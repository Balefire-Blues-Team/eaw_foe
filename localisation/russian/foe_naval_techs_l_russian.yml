foe_heavy_navy_hull_tech_3: "Линейный крейсер"
foe_heavy_navy_hull_tech_3_desc: "Этот морской исполин – гордость любого флота. Переоборудованный и усиленный линейный крейсер павшей Эквестрии внушает ужас всем, кто осмелится выступить против него – и обладает арсеналом, способным это подтвердить. Такие корабли несут гаубицы, множество систем ракетной обороны, управляемых ИИ, а поздние модели дополнительно оснащаются гигантской рельсотронной пушкой, способной пробивать самую толстую броню. Только лучшие из лучших удостаиваются чести служить на этом легендарном судне."
foe_missile_destroyer_hull_tech: "Ракетный эсминец зебр"
foe_missile_destroyer_hull_tech_desc: "В отличие от обычного эсминца, этот корабль представляет собой вершину зебриканских технологий благодаря использованию продвинутой системы маскировки. Созданная на основе стелсбаков и стелс-талисманов зебр, магическая система этих кораблей позволяет им временно становиться практически невидимым, облегчая разведку и сближение с врагом для применения смертоносного арсенала торпед и ракет."
foe_railguns_module_tech: "Корабельные рельсотроны"
foe_railguns_module_tech_desc: ""
foe_megaspell_module_tech: "Тактические мегазаклинания"
foe_megaspell_module_tech_desc: "После того как зебры начали применять жар-торпеды против эквестрийских кораблей, принцесса Луна санкционировала установку пусковых камер для тактических мегазаклинаний на новейшие суда флота. Питание обеспечивается реактором корабля, а заклинания произносят и нацеливают боевые маги, находящиеся на борту. Хотя тактическое мегазаклинание и не способно расплавить целый город, оно с лёгкостью вскипятит экипаж вражеского корабля – вместе с частью океана под ним."
