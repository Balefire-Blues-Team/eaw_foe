 ###Naval Tech###

 
 
 ###Technologies###

foe_nautics_tech_1: "Рыболовное судно"
ship_hull_foe_light_1_desc: "УСТАРЕЛО!\nИз-за нехватки хоть сколько-то функционального оборудования и подходящих верфей многим пришлось использовать старые деревянные суда в качестве основы флота. Простейшая конструкция позволила различным государствам наладить массовое производство таких кораблей. Их скорость зависит исключительно от качества парусов и силы ветра. Тем не менее, они довольно универсальны и способны выполнять функции судов разных классов – от скромных транспортов и канонерок до более внушительных галеонов. Но даже несмотря на их стойкость к стихиям, против мощных боевых кораблей такие суда долго не продержатся."
nautics_tech_2: "Усиленные корпуса"
nautics_tech_2_desc: ""

foe_light_navy_hull_tech_2: "Яхта"
ship_hull_foe_light_2_desc: "Маленькая, лёгкая и, что важнее всего, быстрая яхта пользуется популярностью у торговцев, контрабандистов и, в особенности, рейдеров. Благодаря малому весу её можно легко транспортировать по суше небольшой группой, что позволяет без труда перемещаться между водоёмами. Несмотря на маломощные моторы, такие суда обладают достаточной скоростью и манёвренностью, чтобы уходить от большинства тяжелобронированных кораблей. Однако именно эти достоинства оборачиваются главными недостатками яхт: почти полное отсутствие брони и вооружения делает использование подобных судов в бою крайне рискованным. Тем не менее, обитатели пустошей сумели найти им свою нишу."
foe_light_navy_hull_tech_3: "Патрульный катер"
ship_hull_foe_light_3_desc: "Обладая скоростью, сопоставимой с моторной лодкой, но при этом достаточной огневой мощью, чтобы справиться с любым малым бронированным судном, патрульный катер уверенно выполняет множество самых разных задач. Его основная роль – защита водных путей от рейдеров и контрабандистов, а при необходимости – участие в боевых действиях в качестве лёгкого штурмового судна. Катер имеет минимальное бронирование и может быть оснащён различными видами вооружения – от автоматических гранатомётов до ракетных установок. Два двигателя обеспечивают ему необходимую скорость и манёвренность для патрулирования выделенных участков."
foe_light_navy_hull_tech_4: "Фрегат"
ship_hull_foe_light_4_desc: "Первым полноценным шагом к становлению крупной морской державой является создание фрегатов – основы любого современного военно-морского флота. Взяв за образец старые корабли, найденные на заброшенных верфях или чудом уцелевшие после ядерной катастрофы, мы сможем изучить их и восстановить чертежи с. Эти суда будут служить в роли эскортных и разведывательных кораблей, становясь глазами и ушами флота."
foe_light_navy_hull_tech_5: "Эсминец"
ship_hull_foe_light_5_desc: "Хотя эсминцы выполняют схожие задачи с фрегатами, они обладают куда большей огневой мощью, благодаря чему становятся основой большинства флотов. Оснащённые торпедами и палубными орудиями, эти корабли способны вступать в бой с множеством противников, включая даже линейные крейсеры. Однако их главная опасность кроется в ракетном вооружении: оно позволяет поражать цели на больших дистанциях – как на море, так и на суше. Что ещё в разы усиливается благодаря возможности установки боеголовок с жар-бомбами."
torpedo_tech_1: "Торпеды"
torpedo_tech_1_desc: ""
extra_engine_tech: "Эффективные двигатели"
extra_engine_tech_desc: ""
heavy_navy_hull_tech_1: "Баржа"
ship_hull_foe_heavy_1_desc: "Прозванные "кораблями-казармами", эти вспомогательные суда выполняют широкий спектр задач – от транспортировки войск и поддержки высадок до обеспечения подавляющей огневой мощи. Будучи крупнейшими кораблями флота пустошей, они часто служат флагманами эскадр. Тяжёлая броня и широкие корпуса делают баржи значительно медленнее более лёгких судов."
heavy_navy_hull_tech_2: "Боевой танкер"
ship_hull_foe_heavy_2_desc: "Боевые танкеры обеспечивают поддержку при высадках с моря, используя пушки, миномёты и ракетные установки. Танкеры также могут выполнять роль рейдеров, атакуя торговые конвои в открытом море, маскируясь под обычные грузовые суда. К тому же подобный элемент внезапности позволяет незаметно приблизиться к вражеским кораблям и нанести им серьёзный урон."
heavy_navy_hull_tech_3: "Линейный крейсер"
ship_hull_foe_heavy_3_desc: "Этот морской исполин – гордость любого флота. Переоборудованный и усиленный линейный крейсер павшей Эквестрии внушает ужас всем, кто осмелится выступить против него – и обладает арсеналом, способным это подтвердить. Такие корабли несут гаубицы, множество систем ракетной обороны, управляемых ИИ, а поздние модели дополнительно оснащаются гигантской рельсотронной пушкой, способной пробивать самую толстую броню. Только лучшие из лучших удостаиваются чести служить на этом легендарном судне."
recon_plane_launcher_tech: "Катапульта разведывательного самолёта"
recon_plane_launcher_tech_desc: ""
carrier_hull_tech_1: "Грузовой авианосец"
carrier_foe_equipment_1_desc: "Этот корабль, ранее использовавшийся для перевозки крупных партий грузов между странами по морским маршрутам, теперь представляет собой миниатюрную крепость. Он способен не только транспортировать и запускать самолёты, но и выполнять функции плавучего склада. Кроме того, его можно использовать как командный центр для организации и координации действий флота, способный держаться на безопасной дистанции от врага."
carrier_hull_tech_2: "Авианосец"
carrier_foe_equipment_2_desc: "Созданный на основе корпусов боевых кораблей конца войны, этот проект жертвует бронёй и огневой мощью ради обеспечения воздушной поддержки флота. Авианосец способен перевозить множество истребителей, бомбардировщиков и летающего персонала, благодаря чему может выполнять широкий спектр задач – от борьбы с кораблями до поддержки наземных операций с воздуха. Хотя во время войны такие корабли утратили популярность из-за появления облачных судов, для флота пустошей они по-прежнему представляют огромную ценность."
naval_invasion_tech_5: "Автоматизированный авангард"
