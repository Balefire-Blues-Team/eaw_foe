 # Naval Academy Spirit Names
 wasteland_admirals_spirit:0 "Адмиралы пустошей"
 salvaged_navigation_spirit:0 "Уцелевшие навигационные справочники"
 wartime_crews_spirit:0 "Экипажи военного времени"
 merchant_tradition_spirit:0 "Торговые морские традиции"
 conqueror_captains_spirit:0 "Капитаны-завоеватели"
 concentrated_fleet_academy_spirit:0 "Доктрина концентрации флота"
 river_raider_academy_spirit:0 "Традиция речных рейдеров"
 dispersed_patrol_academy_spirit:0 "Доктрина рассредоточенного патрулирования"
 rustwreck_sea_legacy_spirit:0 "Морское наследие Ржавого Остова"

 # Navy Spirit Names
 scrap_armada_spirit:0 "Армада из металлолома"
 wasteland_navigators_spirit:0 "Навигаторы пустошей"
 salvage_and_refit_spirit:0 "Подъём и переоборудование"
 naval_intelligence_network_spirit:0 "Сеть речных дозорных"
 war_fleet_spirit:0 "Доктрина военного флота"
 coastal_raider_fleet_spirit:0 "Прибрежный рейдерский флот"
 tribal_waterway_spirit:0 "Духи водных путей"
 rustwreck_shipwright_corps_spirit:0 "Корпус корабелов Ржавого Остова"

 # Naval Command Spirit Names
 reckless_captains_spirit:0 "Безрассудные капитаны"
 night_river_hunters_spirit:0 "Ночные речные охотники"
 storm_hardened_crews_spirit:0 "Закалённые штормами экипажи"
 screening_escort_spirit:0 "Тактика заслона"
 ironside_command_spirit:0 "Броненосное командование"
 ghost_fleet_command_spirit:0 "Командование призрачным флотом"
 first_strike_command_spirit:0 "Доктрина первого удара"
 ghoul_sea_captains_spirit:0 "Капитаны затонувшего мира"
 rustwreck_high_command_spirit:0 "Высшее морское командование Ржавого Остова"

 # Naval Academy Spirit Descriptions
 wasteland_admirals_spirit_desc:0 "Они никогда не командовали настоящим флотом. Они вели в бой всё, что могло держать строй до подхода основных сил. Весь секрет не в том, чтобы прорваться, а в том, чтобы удерживать фарватер тогда, когда враг уже уверен, что вы разбиты."
 salvaged_navigation_spirit_desc:0 "Довоенные карты, протоколы и древние представления о том, где всё ещё проходит береговая линия. Два из трёх – уже неплохой результат."
 wartime_crews_spirit_desc:0 "Нет времени на учения или преподавание теории. Враг уже на горизонте, а такелаж всё ещё не в порядке. Они научатся. Выжившие всегда учатся на ошибках своих менее везучих товарищей."
 merchant_tradition_spirit_desc:0 "До падения бомб кто-то должен был возить грузы. Оказалось, что перевозка товаров и управление военным кораблём требуют одних и тех же навыков. Минус накладные, плюс пушки."
 conqueror_captains_spirit_desc:0 "Командир, знающий, как отступать – это командир, который уже заранее планирует отступление. Мы не планируем. Держать курс, полный вперёд, направить нос судна прямиком на проблему."
 concentrated_fleet_academy_spirit_desc:0 "Старые адмиралы собирали воедино каждое корыто, способное плыть, и били по врагу всей мощью разом. Это работает и сейчас. Океан не сильно изменился с тех пор. Так что и тактике меняться тоже необязательно."
 river_raider_academy_spirit_desc:0 "Удар по конвою, потопление эскорта и исчезновение на мелководье до прибытия подкреплений. Наполовину искусство, наполовину некролог. В основном второе, да."
 dispersed_patrol_academy_spirit_desc:0 "Рассредоточиться по каждому каналу и заливу. Наблюдать. Ждать. Контролировать подступы. Не слишком престижно или захватывающе. Но ничто не проплывёт мимо нас незамеченным."
 rustwreck_sea_legacy_spirit_desc:0 "Ржавый Остов не просто строит корабли. Он их взращивает. Каждый капитан, выходящий из этих доков, несёт двухвековой груз с трудом добытых морских знаний и как минимум один шрам, которого можно было избежать. Шрамы прилагаются бесплатно."

 # Navy Spirit Descriptions
 scrap_armada_spirit_desc:0 "Большая часть флота начинала свой путь как что-то другое: баржи, рыбацкие лодки, чей-то модифицированный плот... Главное, что они держатся на плаву. По большей части."
 wasteland_navigators_spirit_desc:0 "Ни надёжных карт, ни работающих компасов – магнитное поле сошло с ума после ударов мегазаклинаний, а пегасы из Клаудсдейла больше не усмиряют течения. Эти пони ведут корабли по звёздам и чутью, достигая цели наперекор всему. Они просто знают, куда направляется вода."
 salvage_and_refit_spirit_desc:0 "Пустошь порождает отличных механиков методом естественного отбора. Те, кто ещё живы, виртуозно поддерживают на ходу то, что давно должно было сгнить."
 naval_intelligence_network_spirit_desc:0 "Торговцы, контрабандисты и береговые наблюдатели, у которых есть веские причины помалкивать об увиденном – до тех пор, пока не поступит предложение получше. Лучшая разведсеть – та, где кажется, будто никто и не смотрит."
 war_fleet_spirit_desc:0 "Собрать суда в единый флот. Концентрировать огонь. Не давать им ни продохнуть, ни подумать. Побеждает самый тяжёлый флот. Вот и весь урок. Вызубрите его наизусть."
 coastal_raider_fleet_spirit_desc:0 "Быстрые, лёгкие и без проблем заменяемые. Им не нужно выигрывать битву. Им нужно лишь заставить врага пожалеть о том, что он её начал."
 tribal_waterway_spirit_desc:0 "С берега их лодки выглядят жалко. Но если вы подошли достаточно близко, чтобы это понять – вы уже проиграли. Эти воды принадлежат им. Обломки на дне доказывают это лучше всяких слов."
 rustwreck_shipwright_corps_spirit_desc:0 "Корпус корабелов не просто чинит суда. Он их улучшает. Каждое переоборудование добавляет лист брони здесь, орудие там и новенькую модификацию, о которой оригинальные конструкторы даже не помышляли. Верфи никогда не спят."

 # Naval Command Spirit Descriptions
 reckless_captains_spirit_desc:0 "Теория морского боя подразумевает позиционирование, расчет времени и взвешенный риск. Наша же практика – переть на цель на полной скорости и смотреть, что будет. Работает чаще, чем должно."
 night_river_hunters_spirit_desc:0 "Реке всё равно, который сейчас час. Нам тоже. С заходом солнца начинается охота, и они не услышат нас, пока их корпус не начнёт набирать воду."
 storm_hardened_crews_spirit_desc:0 "Раньше пегасы Клаудсдейла делали погоду предсказуемой. Теперь этого не делает никто, о чём море регулярно напоминает. Выжившие давно перестали обращать на это внимание."
 screening_escort_spirit_desc:0 "Тяжёлые корабли стоят дорого. Но не суда прикрытия. Заслон идёт первым, ловит торпеды бортом и даёт главным калибрам время прицелиться. Экипажи линкоров считают это крайне удачным раскладом."
 ironside_command_spirit_desc:0 "Пусть стреляют. Пусть стреляют столько, сколько захотят. Мы всё ещё на воде, и теперь наш черёд."
 ghost_fleet_command_spirit_desc:0 "Они доложат наши координаты, но неверно. А пока придёт уточнение, мы будем уже в другом месте. Флот, который никто не может найти – это флот, который никто не сможет остановить."
 first_strike_command_spirit_desc:0 "Бой начинается в тот момент, когда это решаем мы. Не когда они нас заметили. Не когда их орудия готовы. Первый залп всегда за нами. Всё, что после – лишь последствия."
 ghoul_sea_captains_spirit_desc:0 "Они бороздили эти воды ещё до того, как упали бомбы. Они знают каждый изгиб фарватера, каждое коварное мелководье и то, как меняются течения в зависимости от сезона. Двести лет опыта так просто не утопить – как море ничего не забывает, так и они тоже."
 rustwreck_high_command_spirit_desc:0 "Селестийский флот не двинется без приказа и не остановится без причины. Высшее командование знает каждый торговый путь, каждую брешь в патрулях и каждый подход к берегу. Это их море. Они лишь позволяют остальным им пользоваться."
