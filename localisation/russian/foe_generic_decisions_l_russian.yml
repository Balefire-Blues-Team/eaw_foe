#################
### Decisions ###
#################
  foe_political_effort_cat:0 "Политические действия"

  foe_stability_dec:0 "Произнести речь"
  foe_stability_dec_desc:0 "В эти смутные времена наш народ отчаянно нуждается в надежде. Поэтому стоит произнести парочку вдохновляющих и оптимистичных речей."
  foe_stability_water_dec:0 "Распределить воду"
  foe_stability_water_dec_desc:0 "Чистая вода редко встречается в пустоши. Многие семьи нашей стране страдают от нехватки необлучённой воды. Мы позаботимся о том, чтобы распространить чистую воду среди нашего народа, дабы облегчить его страдания."
  foe_war_support_dec:0 "Воздать хвалу нашим хранителям"
  foe_war_support_dec_desc:0 "Сейчас наши храбрые солдаты защищают нас от опасностей и врагов. Они стоят на страже день и ночь, следя за тем, чтобы мы все были целы и невредимы. Давайте покажем им нашу признательность, устроив праздник в их честь!"
  foe_war_support_2_dec:0 "Сплотить нацию"
  foe_war_support_2_dec_desc:0 "Наступили тёмные времена. Враги желают сокрушить нас и разрушить сам наш образ жизни. Если мы хотим выжить как народ, то должны объединиться и сражаться. Ибо если мы проиграем, то наш народ исчезнет."
  foe_research_dec:0 "Изучить инновации военного времени"
  foe_research_dec_desc:0 "В военное время Эквестрия постоянно внедряла инновации и создавала удивительные технологии как в гражданской, так и в военной промышленности. Если мы изучим их достижения, то сможем воспроизвести некоторые из них и улучшить наши собственные научные возможности."
  foe_building_slots_dec:0 "Расчистить мусор"
  foe_building_slots_dec_desc:0 "Большая часть нашей земли всё ещё покрыта обломками и руинами. Если мы расчистим завалы, то получим чуть больше пригодной для строительства земли."
  foe_rationing_dec:0 "Распределение запасов пищи"
  foe_rationing_dec_desc:0 ""
  foe_building_dec:0 "Утилизировать старые материалы"
  foe_building_dec_desc:0 "Вокруг валяются всевозможные полезные материалы: бетон, сталь и многое другое. Почему бы не использовать их в собственных строительных проектах? Конечно, конечный результат может выйти не самым идеальным, но в условиях постапокалипсиса выбирать не приходится."
  
  territory_disputes:0 "Территориальные споры"

  # Military Command category
  foe_military_command_cat:0 "Военное командование"

  foe_field_officer_rotations:0 "Ротация полевых офицеров"
  foe_field_officer_rotations_desc:0 "Содержание полноценной военной академии требует ресурсов, которых у большинства наций пустоши попросту нет. Зато у нас есть поколение тех, кто научился воевать и выжил при этом. Направляя наиболее опытных офицеров во временные учебные задания, мы сможем передать эти добытые кровью знания новобранцам без всяких учебных классов. Академиками они от этого не станут, но зато их будет куда труднее убить."

  foe_authorize_field_promotions:0 "Разрешение полевых повышений"
  foe_authorize_field_promotions_desc:0 "В довоенной Эквестрии офицеров продвигали по службе за выслугу лет, политические связи и правильную фамилию. Но времена изменились. Если солдат под огнём сохраняет жизни своему подразделению, пока старшие по званию всё ещё обдумывают приказы, именно этот солдат должен командовать. Полевые повышения позволяют действовать в обход цепочки командования, предоставляя полномочия нужным пони... пока бестолочи в генштабе не погубили вообще всех."

