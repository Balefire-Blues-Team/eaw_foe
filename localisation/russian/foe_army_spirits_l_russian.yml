 # Academy Spirit Descriptions
 bold_advance_spirit_desc:0 "Промедление подобно смерти. Бей сильно и быстро. И не останавливайся, пока враг не перестанет шевелиться."
 stalwart_resistance_spirit_desc:0 "Мы проливали кровь за эту землю и не отдадим её. Ни дюйма, ни пяди, ни одного проклятого булыжника."
 careful_preparation_spirit_desc:0 "Лезть в перестрелку без плана – верный способ стать трофеем в лагере рейдера. Мы планируем и готовимся, а затем заканчиваем бой до того, как он начнётся."
 peoples_officers_spirit_desc:0 "Они были выбраны общиной, и община ждёт, что те вернут каждого пони домой. Это груз, который большинству генералов никогда не приходилось нести."
 bright_minds_in_command_spirit_desc:0 "Острый рог и ещё более острый ум. Лучшие командиры знают не только как сражаться, но и как просчитывать ситуацию на три битвы вперёд."
 old_blood_command_spirit_desc:0 "Происхождение, богатство и правильная фамилия. Здесь не важно, что ты знаешь, – важно лишь то, кем была твоя бабушка."
 liege_and_loyalty_spirit_desc:0 "Мои солдаты следуют приказам не из-за чинов. Они следуют им, потому что дали клятву. А в эквестрийской пустоши твоё слово – это всё, что у тебя осталось."
 stable_tec_advisory_spirit_desc:0 "11010000 10010111 11010000 10110000 11010000 10110100 11010000 10110101 11010000 10111001 11010001 10000001 11010001 10000010 11010000 10110010 11010000 10111110 11010000 10110010 11010000 10110000 11010000 10111101 00100000 11010000 10111111 11010001 10000000 11010000 10111110 11010001 10000010 11010000 10111110 11010000 10111010 11010000 10111110 11010000 10111011 00100000 11010001 10000010 11010000 10110000 11010000 10111010 11010001 10000010 11010000 10111000 11010001 10000111 11010000 10110101 11010001 10000001 11010000 10111010 11010000 10111110 11010000 10111001 00100000 11010000 10111111 11010000 10111110 11010000 10111100 11010000 10111110 11010001 10001001 11010000 10111000 00100000 11000010 10101011 11010000 10100001 11010001 10000010 11010000 10111110 11010000 10111001 11010000 10111011 00101101 11010000 10100010 11010000 10110101 11010000 10111010 11000010 10111011 00101110"
 hall_of_captains_spirit_desc:0 "Стены зала покрыты именами тех, кто отдал всё своему народу. Каждый офицер, прошедший здесь обучение, знает: от него ждут, что он пополнит этот список своими подвигами, а но не именем."
 recovered_tactics_manuals_spirit_desc:0 "Где-то на этих рассыпающихся довоенных страницах кроется исток наших побед. Вы удивитесь, узнав, что даже двести лет запустения и прямое попадание мегазаклинания не смогли уничтожить эти знания."
 hardened_by_fire_spirit_desc:0 "Они учились командовать не за партами. Они выживали достаточно долго, чтобы во всём разобраться прямо посреди перестрелки. Лучшего подтверждения квалификации не найти."
 wasteland_improvisation_spirit_desc:0 "План не нужен, если ты повидал достаточно, чтобы знать, чем всё закончится. Просто укажи тем, кто умеет стрелять, на тех, в кого нужно попасть."
 memory_orb_strategy_spirit_desc:0 "Используй шар памяти и переживи три сотни сражений за один вечер. Офицерский корпус старой Эквестрии не пережил жар-пламя, но его знания уцелели."
 chem_fueled_command_spirit_desc:0 "«Дэш», «Стампид», «Бак» и полное пренебрежение к собственной безопасности... Кто сказал, что рейдеры не умеют правильно сражаться? Тот просто не видел правильных рейдеров в деле."
 # Army Spirit Descriptions
 beloved_war_heroes_spirit_desc:0 "О них пишут песни, их именами называют улицы поселений, а новобранцы выстраиваются в очереди, чтобы служить под их началом. Победа – это прекрасно, но хорошая легенда – ещё лучше."
 arm_every_pony_spirit_desc:0 "У нас нет времени на полноценную подготовку каждого солдата, но пони с винтовкой – это всё ещё живой щит между нами и врагом. Сойдёт и так."
 mercenary_contracts_spirit_desc:0 "В пустоши за крышки можно купить всё что угодно, даже кого-то, кто готов поймать предназначенную тебе пулю. Лучшая инвестиция в твоей жизни."
 nocturnal_hunters_spirit_desc:0 "Пустошь никогда не спит, и мы тоже. Пускай они укрываются в своих лагерях, думая, что тьма обеспечит им безопасность. Это не так."
 community_defense_corps_spirit_desc:0 "Может, мы и не солдаты, но мы – соседи. И когда кто-то угрожает нашему дому, в этом поселении не найдётся ни одного пони, который не взял бы в копыта оружие."
 hit_and_run_tactics_spirit_desc:0 "Мы не воюем честно. Честная схватка – для тех, кто не хочет побеждать. Мы бьём по уязвимому месту, растворяемся среди скал и повторяем всё это на рассвете."
 ancestral_guidance_spirit_desc:0 "Духи предков оберегают нас в бою. Их мудрость течёт сквозь слова вождя и пламя шамана. Мы сражаемся не одни."
 prewar_veterans_spirit_desc:0 "Мы, гули, на самом деле помним, как работала армия Эквестрии. Мы не забыли эти уроки, желая сохранить свои шкуры в относительной целостности. Оказывается, двести лет радиации творят чудеса с памятью."
 automated_perimeter_spirit_desc:0 "Пускай пытаются прорвать наши стены. Турели не спят, не ведут переговоров и не промахиваются. Как и ремонтные боты, которые поддерживают их в рабочем состоянии."
 alicorn_ascendant_spirit_desc:0 "Аликорны – это не просто сила, это венец того, чего могут достигнуть магия и плоть."
 peoples_war_committee_spirit_desc:0 "Совет из ветеранов, тактиков и лидеров общин, которые действительно понимают, ради чего они посылают пони на смерть. Что за мудрая концепция!"
 recovered_ballistics_texts_spirit_desc:0 "Эти труды пережили войну в ячейке для хранения вещдоков. Данные по стрельбе всё ещё актуальны, ведь даже два столетия не властны над законами физики."
 research_and_salvage_spirit_desc:0 "Нам не нужно превосходить врага огневой мощью, нам нужно его перехитрить. Каждая крышка, потраченная на исследования – это проблема, решённая до того, как она приведёт к появлению горы наших трупов."
 military_above_all_spirit_desc:0 "Всё, чем вы владеете и что вы построили, существует лишь потому, что армия позволяет этому быть. Армия не служит нации. Нация служит армии."
 iron_authority_spirit_desc:0 "Я не правлю «бархатным копытом». Пустошь не уважает мягких правителей. Хотите стабильности – беспрекословно слушайтесь меня. Таков путь."
 heart_of_the_wild_spirit_desc:0 "Старый мир забыл, что когда-то пони были дикими и необузданными. Пустошь напомнила об этом за них. Мы не совершим ту же ошибку."
 steel_ranger_doctrine_spirit_desc:0 "Плоть хрупка. Броня – нет. Мы вкладываем все ресурсы в сталь, что защищает наших рыцарей. Что за польза от отваги, если нет оболочки, способной сохранить ей жизнь?"
 old_war_doctrine_spirit_desc:0 "Эквестрия вела войны тысячу лет до того, как пало первое мегазаклинание. Пони, писавшие эти полевые уставы, знали то, что пустошь раз за разом заставляет усваивать через боль."
 scavengers_advantage_spirit_desc:0 "Пусть враг приносит свои пушки, крышки и припасы. Когда пыль уляжется, мы просто заберём себе все трофеи."
 alicorn_brute_force_spirit_desc:0 "Когда ты состоишь из единой магии земных пони, пегасов и единорогов, тактические нюансы становятся необязательными. Ты просто выбираешь цель и ускоряешься."
 talon_company_protocols_spirit_desc:0 "«Когти» не подписываются на плохие контракты и не ввязываются в авантюры с плохими шансами. Нанимая их, вы получаете профессионалов, видевших любые уголки пустоши и сумевших выжить."
 zebra_legion_legacy_spirit_desc:0 "Легионы зебр маршировали по Зебрике в идеальном строю задолго до войны. Те, кто помнит ту дисциплину, передали её через кровь и традиции, что заметно по сей день."
 crude_augmentations_spirit_desc:0 "Выглядит не очень, да и ставили их не в самой гламурной клинике, но металл есть металл. Режь быстрее, вставляй хром и не задавай лишних вопросов о проценте отторжения."
 perfect_augmentation_spirit_desc:0 "Теперь в нас больше механизмов, чем плоти, и мы не желаем иного. Тело было лишь ограничением. И теперь оно осталось позади."
 steel_ranger_honor_spirit_desc:0 "Паладин Стилхувз не просто так шагнул в пламя мегазаклинания. Рейнджеры помнят свою историю. Каждое задание выполняется в честь тех, кто поддерживал огонь."
 knights_of_the_wastes_spirit_desc:0 "Не каждый пони в силовой броне – Стальной Рейнджер, и не каждый «Коготь» – наёмник. Некоторые из нас – последний рубеж между пустошью и теми, кто стоит у нас за спиной."
 unity_protocols_spirit_desc:0 "Мы не личности. Мы не коалиция. Мы – Единство, и Единство говорит одним голосом... Готовы вы слушать или нет."
 stable_lockdown_protocols_spirit_desc:0 "«Стойл-Тек» строила убежища на века. Так же поступили и пони, вышедшие из них. Мы можем быть медленнее рейдеров, но наши стены переживут их внуков."
 full_throttle_spirit_desc:0 "Никаких планов, карт и ограничений скорости. Между нами и их блокпостом – тридцать секунд и очень громкий движок. Этого предостаточно."
 salvaged_rides_spirit_desc:0 "Ну и что, если это довоенная рухлядь или колымага, собранная из трёх ржавых остовов? Если она движется и мотор заводится, мы заставим её работать. Немного «Дэша» и гаечный ключ решают большинство проблем."
 mounted_heritage_spirit_desc:0 "Задолго до мегазаклинаний пони неслись по полям Эквестрии. Стук копыт и блеск клинков – некоторые традиции пустошь так и не смогла окончательно убить."

 # Division Command Spirit Descriptions
 rapid_battle_orders_spirit_desc:0 "К тому времени, как враг поймёт наши намерения, мы уже будем заняты чем-то другим. Заставлять их реагировать на наши действия, а не намерения – вот секрет нашего выживания."
 experienced_scouts_spirit_desc:0 "Наши разведчики изучили каждый туннель, утёс и выжженный мегазаклинаниями овраг отсюда и до самого горизонта. Сюрпризов не бывает, если мы уже побывали везде первыми."
 throw_them_in_spirit_desc:0 "Враг не будет ждать, пока мы закончим обучение. Дайте им пушку, укажите на цель и надейтесь, что они быстро сообразят, что к чему. Большинство справятся."
 defend_our_home_spirit_desc:0 "Это наша земля. Наши поселения, семьи и могилы. Нам не нужен генерал, чтобы объяснять, за что мы сражаемся. Нам нужен тот, кто не растратит наши жизни впустую."
 blooded_reserves_spirit_desc:0 "Наши резервы – это не «зелёные» новобранцы. Они прошли через суровые кампании, похоронили друзей и всё равно вернулись в строй. Такой опыт не забывается."
 dug_in_and_waiting_spirit_desc:0 "Баррикады, мешки с песком и чашка чего-то горячего, что отдалённо напоминает кофе. Пусть приходят. Мы здесь давно, и нам больше некуда спешить."
 horror_of_the_wastes_spirit_desc:0 "Когти смерти, мантикоры, мутировавшие большие урсы... Твари, населяющие эквестрийскую пустошь, сломили бы любую довоенную армию. Для нас же это просто обычный вторник."
 supply_caravan_network_spirit_desc:0 "Караваны браминов, повозки и самые упрямые офицеры по логистике по эту сторону Филлидельфии. Если груз должен попасть на фронт – он попадёт на фронт."
 gifted_field_officers_spirit_desc:0 "Хорошего офицера от великого отличает не храбрость, а способность иметь запасной план на случай, если основной с треском провалится."
 might_makes_right_spirit_desc:0 "Бери что нужно у слабых, ломай тех, кто сопротивляется, и иди дальше. Сострадание – это роскошь для пони, которые никогда не были на поле боя."
 smash_through_spirit_desc:0 "Сколько пони для этого потребуется? Достаточно. Это единственный верный ответ. Направь против любой проблемы достаточно силы, и она перестанет быть проблемой."
 starve_them_out_spirit_desc:0 "Сытая армия сражается, голодная – сдаётся. Нам не нужно мериться силой в открытом бою, достаточно сделать так, чтобы их следующий обед просто не доехал до фронта."
 raw_instincts_spirit_desc:0 "Забудьте о картах, линиях фронта и путях снабжения. Мы познали эту землю так, как заставила нас эквестрийская пустошь: копытами, зубами и собственными шрамами."
 factory_to_frontline_spirit_desc:0 "Производственная линия никогда не замирает. Роботы, сошедшие с конвейера, отправляются прямиком на фронт. К тому времени, как враг их пересчитает, в пути будет уже вдвое больше."
 iron_within_iron_without_spirit_desc:0 "Стальные Рейнджеры не отступают. Они не сдаются. Они просто шагают вперёд в своей броне и держат строй, потому что Рейнджеры всегда так поступали."
 feral_tide_spirit_desc:0 "Дикие гули не планируют, не координируют действия и не останавливаются. Нехватку дисциплины они с лихвой восполняют неумолимой численностью."
 enclave_patience_spirit_desc:0 "Мы двести лет наблюдали с небес, как пустошь рвёт себя на части. Нам некуда спешить. Терпение – это добродетель, в которой у Анклава было достаточно времени попрактиковаться."
 swift_conquest_spirit_desc:0 "Армии Красного Глаза не задерживаются на месте. Они наносят удар, захватывают рабочую силу и двигаются дальше, прежде чем осядет пыль. Промедление стоит крышек, а крышки стоят жизней."
 drunken_bravado_spirit_desc:0 "Бутылка чего-нибудь крепкого перед атакой – и страх утихает. Это не тактическая доктрина, а рейдерская традиция, а с традициями не спорят, пока они работают."
 elder_wisdom_spirit_desc:0 "Старейшина пережил такое, что сломило бы более молодого пони. Когда он говорит перед битвой, племя слушает. Он не выжил бы в пустоши, если бы ошибался."
 tunnel_fighters_spirit_desc:0 "Они знают каждую нору, каждый обрушившийся железнодорожный туннель и каждый подземный ход отсюда и до самой реки. Бой на открытой местности – это лишь их вежливость по отношению к вам."
 demolition_games_spirit_desc:0 "Арена – это всего лишь тренировочная площадка. Когда ворота открываются, а трибуны замолкают, начинаются настоящие игры на уничтожение. И на этот раз ставки – не крышки."
 radscorpion_doctrine_spirit_desc:0 "Маленький, терпеливый и защищённый броней – радскорпион никогда не торопится. Он выбирает позицию и ждёт, а когда открывается брешь, жало наносит молниеносный удар."
 burn_it_all_spirit_desc:0 "Эквестрийская пустошь родилась в жар-огне. Кое-кто из нас считает, что так она и должна закончиться. Пламя не выбирает жертв, и мы тоже."
