### Ideas ###
#############

 
 political_division:0 "Политическая раздробленность"
 political_division_desc:0 "Филлидельфийский контингент Стальных Рейнджеров испытывает нехватку уверенности в своей Миссии."
 
 FSR_warbond_payback:0 "Выплата военных облигаций"
 FSR_warbond_payback_desc:0 "В настоящее время мы выплачиваем долги по выпущенным нами военным облигациям."
 
 military_first_economy:0 "Акцент на армии"
 military_first_economy_desc:0 "Окружённые со всех сторон врагами, мы не имеем иного выбора, кроме как перевести нашу экономику на военные рельсы."

 south_end_partisans:0 "Партизаны в Саут-Энде"
 south_end_partisans_desc:0 "Дикари в Саут-Энде выступают против нашего правления и регулярно устраивают засады на наши патрули."

 FSR_constructobots:0 "Конструктоботы"
 FSR_constructobots_desc:0 "Прототип конструктоботов «Стойл-Тек» бродят по нашим землям, возводя фабрики и железные дороги."

 FSR_corruption_crackdown:0 "Подавление коррупции"
 FSR_corruption_crackdown_desc:0 "Одним из первых шагов Блюберри Сейбр на посту старейшины стало начало масштабной антикоррупционной кампании. Все, кто растрачивал ресурсы Ордена, были понижены в должности или изгнаны. Теперь она пожинает плоды работы отлаженной военной машины."
 
 FSR_scribe_integration:0 "Интеграция писцов"
 FSR_scribe_integration_desc:0 "Ряды писцов открыты для жителей пустошей, способных доказать свой ум и таланты. Это вызвало новый приток способных исследователей."
 
 FSR_partisan_negotiations:0 "Переговоры с партизанами"
 FSR_partisan_negotiations_desc:0 "Мы усадили партизан за стол переговоров. Теперь нам просто нужно найти компромисс."
 
 FSR_pre_war_sentiment:0 "Довоенные настроения"
 FSR_pre_war_sentiment_desc:0 "Идеи старого мира переживают возрождение в наших рядах."
 
 FSR_calibrated_military_economy:0 "Военная экономика"
 FSR_calibrated_military_economy_desc:0 "Наша экономика настроена так, чтобы мы были готовы к любой угрозе, но при этом сохранялась и гражданская промышленность."
 
 FSR_civilian_focused_economy:0 "Гражданская экономика"
 FSR_civilian_focused_economy_desc:0 "Наша экономика была полностью перестроена с упором на гражданскую промышленность."
 
 FSR_military_only_economy:0 "Исключительно военная экономика"
 FSR_military_only_economy_desc:0 "Наша экономика полностью сосредоточена на военном производстве."
 
 FSR_economic_turmoil:0 "Экономический упадок"
 FSR_economic_turmoil_desc:0 "Недавние радикальные изменения в нашей экономике привели к временному снижению как темпов расширения, так и объёмов производства."
 
 FSR_unity:0 "Единство"
 FSR_unity_desc:0 "Наше отделение впервые за долгое время объединяется."
 
 FSR_borderfights:0 "Стычки с Красным Глазом"
 FSR_borderfights_desc:0 "Небольшие группы работорговцев постоянно вторгаются на нашу территорию. Пока что наши рыцари отбивают эти атаки, но это лишь предвестие того, что грядёт..."
 
 FSR_wastemilitia:0 "Ополчение пустоши"
 FSR_wastemilitia_desc:0 "Теперь наши ряды пополняют жители пустошей. Хотя их много, они весьма недисциплинированы."
 
 FSR_mechamines:0 "Мехаспрайтовые мины"
 FSR_mechamines_desc:0 "Самовоспроизводящиеся стаи мехаспрайтовых мин бродят по нашим землям, поедая металлолом для создания новых особей, после чего часть роя минирует территорию и отправляется на поиски следующей добычи. Только мейнфрейм «Стойл-Тек» знает точные места их размещения."
 
 FSR_nurations:0 "Новые пайки"
 FSR_nurations_desc:0 "Размер пайка был увеличен для поощрения многодетных семей."
 
 FSR_blueyouth:0 "Штальюгенд"
 FSR_blueyouth_desc:0 "Мы значительно снизили призывной возраст. Это даёт нам больше новобранцев, пусть и менее дисциплинированных."
 
 FSR_nuscribes:0 "Расширение писцов"
 FSR_nuscribes_desc:0 "Увеличение числа писцов привело к укреплению исследовательской базы."
 
 FSR_superscribe:0 "Бункерные школы"
 FSR_superscribe_desc:0 "Наши новые школы не только предлагают лучшие инструменты для обучения, но и убеждают родителей в полной безопасности их детей."
 
 FSR_silverwing_intel:0 "Разведка «Сильвервинга»"
 FSR_silverwing_intel_desc:0 "Информация, извлечённая из автоматизированных систем армейской базы «Сильвервинг», поможет нам подготовиться к столкновению с Красным Глазом. К сожалению, эта информация быстро теряет актуальность, поэтому она будет полезна лишь ограниченное время."
 
 FSR_demeter_rations:0 "Фермы «Деметра»"
 FSR_demeter_rations_desc:0 "Фермы, созданные в рамках проекта «Деметра», позволили существенно увеличить рационы, что вызвало рост населения."
 
 FSR_big_foundry:0 "Литейная «Гефеста»"
 FSR_big_foundry_desc:0 "Литейный цех позволил нам существенно нарастить производство по всем направлениям."
 
 FSR_rangerpriviledges:0 "Привилегии рейнджеров"
 FSR_rangerpriviledges_desc:0 "Наши рейнджеры оснащены только лучшим! К сожалению, возвращение им передовых технологий привело к тому, что некоторые пони смотрят на нас с некоторой косой ухмылкой."
 
 FSR_decryption_effort:0 "Расшифровка в процессе"
 FSR_decryption_effort_desc:0 "Наши писцы заняты попытками получить доступ к зашифрованным данным в мейнфрейме «Стойл-Тек», хотя некоторые считают эту затею бесполезной."
 
 FSR_stabletec_arms_idea:0 "Чертежи оружия «Стойл-Тек»"
 FSR_stabletec_arms_idea_desc:0 "Мы обнаружили ряд чертежей различного оружия, спрятанных в мейнфрейме «Стойл-Тек»."
 
 FSR_superior_armor:0 "Превосходная броня"
 FSR_superior_armor_desc:0 "Усовершенствованные методы производства позволяют нам изготавливать гораздо больше силовой брони значительно более высокого качества."
 
 FSR_ranger_army_idea:0 "Армия рейнджеров"
 FSR_ranger_army_idea_desc:0 "Наша армия состоит только из лучших."
 
 FSR_robo_servants:0 "Роботы-слуги"
 FSR_robo_servants_desc:0 "Роботы берут на себя самую сложную и опасную работу, позволяя нашим пони сосредоточиться на других задачах."
 
 FSR_trinity_0:0 "Троица спорит"
 FSR_trinity_0_desc:0 "Всякий раз, когда Троица мейнфрейма вводит новые алгоритмы, её программа заставляет её обсуждать все возможные исходы своих решений, чтобы убедиться, что они не навредят расе пони. Лишь когда решение получит единодушное одобрение, оно воплотится в жизнь."
 
 FSR_trinity_1:0 "Троица активирована"
 FSR_trinity_1_desc:0 "Троица мейнфрейма активирована и теперь поддерживает наши политические и промышленные усилия."
 
 FSR_trinity_2:0 "Троица повлияла на производство"
 FSR_trinity_2_desc:0 "Мы передали Троице мейнфрейма часть контроля над нашими производственными линиями. Это дало немедленный положительный эффект, поскольку ИИ гораздо лучше способен к комплексному управлению, чем любой пони."
 
 FSR_trinity_3:0 "Троица управляет фабриками"
 FSR_trinity_3_desc:0 "Сейчас Троица отвечает за большинство производственных операций и зарекомендовала себя как огромная благодать для государства [Root.GetName]."
 
 FSR_trinity_4:0 "Алгоритмы самообучения"
 FSR_trinity_4_desc:0 "В настоящее время Троица использует алгоритмы самосовершенствования, чтобы постепенно сокращать затраты времени и ресурсов на производство всех видов товаров."
 
 FSR_hq_offices:0 "Офисы штаб-квартиры «Стойл-Тек»"
 FSR_hq_offices_desc:0 "Масштаб новой штаб-квартиры просто поражает! На каждом этаже размещается до 40 отдельных помещений. Если полностью заполнить выделенное пространство офисами, то для закрытия всех вакансий потребуется более тысячи пони."
 
 FSR_hq_labs:0 "Лаборатории штаб-квартиры «Стойл-Тек»"
 FSR_hq_labs_desc:0 "Несколько этажей с лабораториями заполняют новый штаб, исследуя всё подряд: от способов борьбы с радиацией до культур пустошей и новых моделей силовой брони."
 
 FSR_hq_command:0 "Командный центр штаб-квартиры «Стойл-Тек»"
 FSR_hq_command_desc:0 "Этот новый командный центр, пожалуй, самый большой в Эквестрии – соперничать с ним может лишь то, что Анклав прячет за облаками. Здесь составляются подробные планы и вестись учёт набора до последнего пони."
 
 FSR_hq_complete:0 "Штаб-квартира «Стойл-Тек»"
 FSR_hq_complete_desc:0 "Мы сделали это! Самое высокое здание, построенное после падения бомб. С его верхних этажей видна территория далеко за Стеной Филлидельфии. В пустошь поистине вернулось величие."
 
 FSR_bestest_guns:0 "Лучшие пушки на пустоши"
 FSR_bestest_guns_desc:0 "Мы производим лучшие артиллерийские, противотанковые и корабельные орудия во всей пустоши."
 
 FSR_bad_scribes:0 "Неверные писцы"
 FSR_bad_scribes_desc:0 "Писцы нашего отделения презирают наши методы и при первой возможности саботируют наши усилия."
 
 FSR_bad_knights:0 "Неверные рыцари"
 FSR_bad_knights_desc:0 "Хотя большинство рыцарей как минимум терпят новое командование, некоторые заядлые приверженцы идеалов старого мира оказывают нам упорное сопротивление."
 
 FSR_partisan_cooperation:0 "Сотрудничество с партизанами"
 FSR_partisan_cooperation_desc:0 "Мы разрешили разногласия с партизанами и теперь действуем сообща."
 
 FSR_partisan_integration:0 "Партизаны-рыцари"
 FSR_partisan_integration_desc:0 "Мы полностью интегрировали бывших партизан в нашу военную структуру."
 
 FSR_scribe_integration2:0 "Писцы пустоши"
 FSR_scribe_integration2_desc:0 "Мы успешно открыли должность писцов для обитателей пустоши, но нам всё ещё предстоит убедить сомневающихся в их ценности."
 
 FSR_militia_green:0 "Неопытное ополчение"
 FSR_militia_green_desc:0 "Мы начали организовывать бойцов из пустоши в полноценные отряды и провели их базовую подготовку. По дисциплине и выучке они всё ещё сильно уступают настоящим рейнджерам, но прогресс уже заметен."
 
 FSR_militia_regular:0 "Обученное ополчение"
 FSR_militia_regular_desc:0 "Наши программы подготовки были улучшены, а войска стали куда более организованными. Впрочем, предстоит сделать ещё многое."
 
 FSR_militia_prof:0 "Профессиональная армия"
 FSR_militia_prof_desc:0 "Наша армия прошла долгий путь с начала реформ. Прежде неопытные жители пустоши стали столь же дисциплинированными и эффективными, как и наши первые рейнджеры."
 
 FSR_aux_raiders:0 "Вспомогательные силы рейдеров"
 FSR_aux_raiders_desc:0 "Мы набрали сброд со всей пустоши, чтобы использовать его как пушечное мясо в нашей военной машине."
 
 FSR_agrneg:0 "Агрессивные переговоры"
 FSR_agrneg_desc:0 "Всё просто: либо они отдают нам требуемое, либо мы их уничтожаем."
 
 FSR_raid_pala:0 "Рыцари-рейдеры"
 FSR_raid_pala_desc:0 "Позволив самым опытным налётчикам и работорговцам в наших рядах облачиться в силовую броню, мы создали неудержимый ударный кулак."
 
 FSR_angry_slaves:0 "Непокорные рабы"
 FSR_angry_slaves_desc:0 "Хотя мы и сбросили с них оковы, бывшие рабы Филлидельфии всё ещё выражают недовольство и сопротивляются нашему режиму."
 
 FSR_risk_famine:0 "Угроза голода"
 FSR_risk_famine_desc:0 "Немногие запасы продовольствия Красного Глаза были уничтожены во время войны, а наших собственных складов не хватит, чтобы надолго прокормить существенно выросшее население."
 
 FSR_rampant_inflation:0 "Вездесущая инфляция"
 FSR_rampant_inflation_desc:0 "Крышки обесцениваются с каждым днём, и единственная причина, по которой вся наша экономика ещё не обанкротилась, – это масштабное субсидирование."
 
 FSR_economic_stagnation:0 "Экономический застой"
 FSR_economic_stagnation_desc:0 "Многие фабрики пустуют, а рост экономики полностью остановился. Впрочем, эту ситуацию ещё можно исправить."
 
 FSR_remnants_fight:0 "Остатки сил Красного Глаза"
 FSR_remnants_fight_desc:0 "Разрозненные остатки армии Красного Глаза всё ещё совершают нападения на караваны и затрудняют продвижение по Филлидельфии и Внутренним землям."
 
 FSR_angry_slaves_2:0 "Обещания рабам"
 FSR_angry_slaves_2_desc:0 "Мы дали бывшим рабам Филлидельфии ряд обещаний. Они всё ещё недовольны, но больше не поднимают восстаний."
 
 FSR_angry_slaves_3:0 "Хрупкое доверие"
 FSR_angry_slaves_3_desc:0 "Нам удалось договориться с вожаками бывших рабов Филлидельфии. Тем не менее между нашими сторонами по-прежнему сохраняется глубокое недоверие."
 
 FSR_angry_slaves_4:0 "Растущее доверие"
 FSR_angry_slaves_4_desc:0 "Теперь, когда мы приняли шесть требований, вожаки бывших рабов начали публично поддерживать нас, хотя всё ещё с некоторой осторожностью."
 
 FSR_famine:0 "Голод"
 FSR_famine_desc:0 "Наш народ голодает! Не нужно быть экспертом, чтобы понимать, насколько это катастрофично."
 
 FSR_remnants_fight_2:0 "Остатки сил Красного Глаза"
 FSR_remnants_fight_2_desc:0 "Остатки войск были вытеснены из самой Филлидельфии и теперь действуют исключительно во Внутренних землях."
 
 FSR_griff_mercs:0 "Когти Рагини"
 FSR_griff_mercs_desc:0 "«Когти Рагини» – наша собственная спонсируемая государством компания грифонов, в основном отвечающая за разведку и операции по нанесению глубоких ударов."
 
 FSR_griff_citizens:0 "Гражданство для грифонов"
 FSR_griff_citizens_desc:0 "Мы добавили грифонов к видам, которым разрешено получать гражданство в нашей стране. Многие грифоны, уставшие от наёмнической жизни, решили поселиться в наших границах."
 
 FSR_scribe_integration_3:0 "Всеобщее образование"
 FSR_scribe_integration_3_desc:0 "Поскольку должность писца постепенно устаревает, мы начали строить школы по всей стране, чтобы повысить общий уровень образования."
 
 FSR_high_inflation:0 "Высокая инфляция"
 FSR_high_inflation.desc:0 "Хотя мы всё ещё переживаем высокую инфляцию, нам удалось остановить её экспоненциальный рост."
 
 FSR_government_reroll:0 "Обновление правительства"
 FSR_government_reroll_desc:0 "Мы находимся в процессе введения большого количества новых лиц в наше правительство."
 
 FSR_colony_office:0 "Управление по делам колоний"
 FSR_colony_office_desc:0 "УДК контролирует все усилия по колонизации, предпринимаемые нашим правительством. Оно также нанимает специалистов для помощи колонистам-добровольцам в создании новых общин за пределами страны."
 
 FSR_medium_inflation:0 "Стабилизация инфляции"
 FSR_medium_inflation_desc:0 "Вступают в силу первые меры нашего нового экономического совета! Надеемся, наша валюта скоро стабилизируется."
 
 FSR_stable_inflation:0 "Стабильная инфляция"
 FSR_stable_inflation_desc:0 "Мы наконец стабилизировали нашу валюту. Однако прошлый ущерб остаётся ощутимым."
 
 FSR_bit_switch:0 "Переход на биты"
 FSR_bit_switch_desc:0 "Введение битов – старой валюты Эквестрии – потребует времени и сил. Однако в конечном итоге это позволит нашему правительству полностью контролировать финансовую систему."
 
 FSR_scribe_integration_4:0 "Научные сети"
 FSR_scribe_integration_4_desc:0 "Мы достигли высокого уровня общего образования и создали тесно взаимосвязанное научное сообщество."
 
 FSR_labor_buero:0 "Бюро труда"
 FSR_labor_buero_desc:0 "Бюро труда гарантирует соблюдение прав трудящихся. Те, в свою очередь, должны исправно выполнять свои обязанности."
 
 FSR_census:0 "Перепись населения"
 FSR_census_desc:0 "Ежегодная эквестрийская перепись позволяет нам лучше отслеживать численность населения и гарантировать, что никто не уклоняется от призыва."
 
 FSR_census2:0 "Программа четырёх детей"
 FSR_census2_desc:0 "Программа четырёх детей помогает семьям, ежегодно выплачивая значительную сумму в битах семьям с 4 и более детьми."
 
 FSR_census3:0 "Программа шести детей"
 FSR_census3_desc:0 "Программа шести детей помогает семьям, ежегодно выплачивая значительную сумму в битах семьям с 6 и более детьми."
 
 FSR_labor_buero2:0 "Трудовое законодательство"
 FSR_labor_buero2_desc:0 "Законодательство о труде предотвращает эксплуатацию работников безразличными компаниями. Оно также предписывает регламентированные часы работы и производственные нормы, что ведёт к более организованной и стандартизированной системе занятости."
 
 FSR_shield_talismans:0 "Щитовые талисманы"
 FSR_shield_talismans_desc:0 "Мы освоили массовое производство щитовых талисманов. С ними наши солдаты будут защищены лучше, чем когда-либо прежде."
 
 FSR_dog_study:0 "Изучение псов"
 FSR_dog_study_desc:0 "В настоящее время мы изучаем поведение и культуру псов Хрустальных пещер."
 
 FSR_dog_friends:0 "Дружба с псами"
 FSR_dog_friends_desc:0 "Нам удалось наладить дружеские отношения с псами Хрустальных пещер!"
 
 FSR_dog_citizens:0 "Псы-граждане"
 FSR_dog_citizens_desc:0 "Псы теперь официально признанная раса в Эквестрии и могут законно получать гражданство."
 
 FSR_dog_citizens2:0 "Псы-граждане"
 FSR_dog_citizens2_desc:0 "Псы теперь официально признанная раса в Эквестрии и могут законно получать гражданство."
 
 FSR_ghoul_citizens:0 "Гули-граждане"
 FSR_ghoul_citizens_desc:0 "Гули, способные доказать свою разумность, теперь могут получить законное гражданство в нашей стране."
 
 FSR_hmi_reborn:0 "ХМИ возрождена"
 FSR_hmi_rreborn_desc:0 "«Хазард Майнинг Инк.» когда-то была одной из крупнейших горнодобывающих компаний в Эквестрии. Теперь она возрождена в качестве полугосударственной корпорации и будет управлять большей частью наших горнодобывающих операций."
 
 FSR_pegasi_citizens:0 "Пегасы-граждане"
 FSR_pegasi_citizens_desc:0 "Не так давно все пегасы считались предателями Эквестрии. Теперь, благодаря новой политике, даже они могут получить гражданство в нашей славной стране."
 
 FSR_interspecies_study:0 "Изучение межвидовых отношений"
 FSR_interspecies_study_desc:0 "В настоящее время мы проводим ряд различных исследований межвидовых отношений и способов их улучшения."
 
 FSR_harmony_theory:0 "Теория гармонии"
 FSR_harmony_theory_desc:0 "Мы нашли способ воплотить старый эквестрийский принцип «Гармонии» в современном мире. Поддерживая гармонию между расами, а также между государством и гражданами, наше общество сможет процветать и не бояться внутренней розни."
 
 FSR_merchant_navy:0 "Торговый флот"
 FSR_merchant_navy_desc:0 "Наша страна – промышленный центр, а промышленности требуются ресурсы! Днём и ночью конвои торговых судов курсируют вдоль побережья и по рекам, перевозя сырьё для снабжения наших предприятий."
 
 FSR_steel_legion:0 "Стальной легион"
 FSR_steel_legion_desc:0 "Подразделения в силовой броне и обычная пехота наступают единым фронтом."
 
 FSR_mwt:0 "Министерство военных технологий (планируется)"
 FSR_mwt_desc:0 "Подготовлены планы по возрождению Министерства военных технологий как гражданского органа управления."
 FSR_mwt2:0 "Министерство военных технологий (строится)"
 FSR_mwt2_desc:0 "Строительство нового центра Министерства военных технологий уже идёт."
 FSR_mwt3:0 "Министерство военных технологий (открыто)"
 FSR_mwt3_desc:0 "Министерство военных технологий полностью готово к работе."
 FSR_mwt4:0 "Министерство военных технологий (расширено)"
 FSR_mwt4_desc:0 "Министерство военных технологий получило прибавку к бюджету за свою успешную работу над силовой бронёй."
 FSR_mwt5:0 "Министерство военных технологий (восстановлено)"
 FSR_mwt5_desc:0 "«Эпплджек, которая убедила меня, когда я сомневалась, олицетворяет дух Честности!»"
 FSR_mwt6:0 "Министерство военных технологий (восстановлено)"
 FSR_mwt6_desc:0 "«Эпплджек, которая убедила меня, когда я сомневалась, олицетворяет дух Честности!»"
 
 FSR_mom:0 "Министерство морали (планируется)"
 FSR_mom_desc:0 "Подготовлены планы по возрождению Министерства морали."
 FSR_mom2:0 "Министерство морали (строится)"
 FSR_mom2_desc:0 "Строительство нового центра Министерства морали уже идёт."
 FSR_mom3:0 "Министерство морали (открыто)"
 FSR_mom3_desc:0 "Новый взгляд на Министерство морали."
 FSR_mom4:0 "Министерство морали (расширено)"
 FSR_mom4_desc:0 "Министерство морали получило прибавку к бюджету для поддержки своей деятельности."
 FSR_mom5:0 "Министерство морали (восстановлено)"
 FSR_mom5_desc:0 "«Пинки Пай, одолевшая ужас и посмеявшаяся страху в лицо, олицетворяет дух Смеха!»"
 FSR_mom6:0 "Министерство морали (восстановлено)"
 FSR_mom6_desc:0 "«Пинки Пай, одолевшая ужас и посмеявшаяся страху в лицо, олицетворяет дух Смеха!»"
 
 FSR_mop:0 "Министерство мира (планируется)"
 FSR_mop_desc:0 "Подготовлены планы по возрождению Министерства мира."
 FSR_mop2:0 "Министерство мира (строится)"
 FSR_mop2_desc:0 "Строительство нового центра Министерства мира уже идёт."
 FSR_mop3:0 "Министерство мира (открыто)"
 FSR_mop3_desc:0 "Министерство мира: теперь с нулевой вероятностью продажи наших секретов врагам."
 FSR_mop4:0 "Министерство мира (расширено)"
 FSR_mop4_desc:0 "Министерство мира заметно выросло благодаря формированию Корпуса мира."
 FSR_mop5:0 "Министерство мира (восстановлено)"
 FSR_mop5_desc:0 "«Флаттершай, приручившая мантикору своим сочувствием, олицетворяет дух Доброты!»"
 FSR_mop6:0 "Министерство мира (восстановлено)"
 FSR_mop6_desc:0 "«Флаттершай, приручившая мантикору своим сочувствием, олицетворяет дух Доброты!»"
 
 FSR_moi:0 "Министерство стиля (планируется)"
 FSR_moi_desc:0 "Подготовлены планы по возрождению Министерства стиля."
 FSR_moi2:0 "Министерство стиля (строится)"
 FSR_moi2_desc:0 "Строительство нового центра Министерства стиля уже идёт."
 FSR_moi3:0 "Министерство стиля (открыто)"
 FSR_moi3_desc:0 "Гламурное Министерство стиля делает нас прекраснее."
 FSR_moi4:0 "Министерство стиля (расширено)"
 FSR_moi4_desc:0 "Министерство стиля должно быть расширено для удовлетворения возросшей потребности в пропаганде."
 FSR_moi5:0 "Министерство стиля (восстановлено)"
 FSR_moi5_desc:0 "«Рарити, успокоившая печального морского змея ценным подарком, олицетворяет дух Щедрости!»"
 FSR_moi6:0 "Министерство стиля (восстановлено)"
 FSR_moi6_desc:0 "«Рарити, успокоившая печального морского змея ценным подарком, олицетворяет дух Щедрости!»"
 
 FSR_mas:0 "Министерство тайных наук (планируется)"
 FSR_mas_desc:0 "Подготовлены планы по возрождению Министерства тайных наук."
 FSR_mas2:0 "Министерство тайных наук (строится)"
 FSR_mas2_desc:0 "Строительство нового центра Министерства тайных наук уже идёт."
 FSR_mas3:0 "Министерство тайных наук (открыто)"
 FSR_mas3_desc:0 "Исследуем магию и создаём кошмары вот уже более двухсот лет."
 FSR_mas4:0 "Министерство тайных наук (расширено)"
 FSR_mas4_desc:0 "Министерству тайных наук выделено несколько новых лабораторий в поддержку его исследований."
 
 FSR_moa:0 "Министерство крутости (планируется)"
 FSR_moa_desc:0 "Подготовлены планы по возрождению Министерства крутости."
 FSR_moa2:0 "Министерство крутости (строится)"
 FSR_moa2_desc:0 "Строительство нового центра Министерства крутости уже идёт."
 FSR_moa3:0 "Министерство крутости (открыто)"
 FSR_moa3_desc:0 "Прежнее министерство предателей возрождено, чтобы снова служить Эквестрии."
 FSR_moa4:0 "Министерство крутости (расширено)"
 FSR_moa4_desc:0 "Министерство крутости сделало достаточно, чтобы заслужить наше доверие. А вместе с доверием – и увеличение финансирования."
 FSR_moa5:0 "Министерство крутости (восстановлено)"
 FSR_moa5_desc:0 "«И Рэйнбоу Дэш, не бросившая друзей по зову своего сердца, олицетворяет дух Верности!»"
 
 FSR_the_tithe:0 "Дань знаниями"
 FSR_the_tithe_desc:0 ""
 
 FSR_red_tithe:0 "Дань знаниями"
 FSR_red_tithe_desc:0 ""
 
 FSR_the_tithe2:0 "Дань рабами"
 FSR_the_tithe2_desc:0 ""
 
 FSR_red_tithe2:0 "Дань рабами"
 FSR_red_tithe2_desc:0 ""
 
 FSR_slaves1:0 "Рабы-солдаты"
 FSR_slaves1_desc:0 "Мы можем широко использовать рабов как пушечное мясо в наших армиях."
 
 FSR_slaves2:0 "Разведение рабов"
 FSR_slaves2_desc:0 "Мы можем использовать рабский труд для обеспечения армии и пополнения наших ресурсов."
 
 FSR_pile_of_caps:0 "Куча добычи"
 FSR_pile_of_caps_desc:0 "В ходе рейда мы получили столько трофеев, что их трудно даже уследить! Давайте вложим часть этих средств в развитие страны."
 
 FSR_red_puppet:0 "Под контролем Красного Глаза"
 FSR_red_puppet_desc:0 "Наша страна находится под игом Красного Глаза."
 
 FSR_red_puppet2:0 "Под контролем Красного Глаза"
 FSR_red_puppet2_desc:0 "Наша страна находится под игом Красного Глаза."
 
 FSR_marriage_red:0 "Нова Рейдж замужем"
 FSR_marriage_red_desc:0 "С Новой Рейдж и её рейнджерами наши армии сильны как никогда!"
 
 FSR_grand_arme:0 "Великая армия"
 FSR_grand_arme_desc:0 ""
 
 FSR_fire_steel:0 "Сталь и пламя"
 FSR_fire_steel_desc:0 ""
 
 FSR_air_def:0 "Противовоздушная оборона"
 FSR_air_def_desc:0 "Предпринимаются усилия по противодействию вражеской авиации."
 
 FSR_air_def2:0 "Противовоздушная оборона"
 FSR_air_def2_desc:0 "Сочетание зенитных батарей и собственных самолётов способно обезопасить наше воздушное пространство."
 
 FSR_waste_navy2:0 "Флот пустоши"
 FSR_waste_navy2_desc:0 "Наш флот ориентирован на борьбу с угрозами, исходящими от обитателей пустоши."
 
 FSR_war_navy2:0 "Флот военного времени"
 FSR_war_navy2_desc:0 "Наш флот ориентирован на ведение полномасштабных военных конфликтов."
 
 FSR_slaves_subjugation:0 "Закабалённые рабы"
 
 FSR_slaves_emancipation1:0 "Рейнджеры из рабов"
 
 FSR_slaves_emancipation2:0 "Филлидельфийский компромисс"
 
 FSR_FLT_puppet_army:0 "Армия Флэтлендс"
 
 FSR_SSC_puppet_army:0 "Центры набора Стальных Рейнджеров"
 
 FSR_con_rangers_triumphant_idea:0 "Триумф рейнджеров"

 FSR_birds_of_steel_fighter_idea:0 "Стальные птицы"
 FSR_birds_of_steel_fighter_idea_desc:0 "Наши военно-воздушные силы прошли долгий путь: мы и представить не могли, что когда-нибудь снова поднимемся в небо. Это потрясающее зрелище – наблюдать, как наши самолёты взлетают на боевое задание. С такой поддержкой с воздуха мы станем поистине неудержимы."

 FSR_birds_of_steel_cas_idea:0 "Стальные птицы"
