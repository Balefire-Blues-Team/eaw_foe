 FSR_con_cathedral_evacuated_tt:0 "§OМы смогли эвакуировать большую часть технологий из Собора, так что кого волнуют какие-то вонючие фанатики?§!"
 
 FSR_found_silverwing_contingent_tt:0 "§CБудет основан новый контингент Стальных Рейнджеров, использующий в качестве базы Армейский склад «Сильвервинг».§!"
 FSR_create_research_sharing_tt:0 "§GМы создадим новую группу технологического обмена между нами и всеми нашими марионетками.§!"
 
 FSR_msr_remnants_tt:0 "§YНаши братья и сёстры из Мейнхеттена прибыли в штаб-квартиру «Стойл-Тек»!§!"
 
 FSR_cottage_tt:0 "§YСтарейшина Коттедж Чиз прибывает с остатками Стальных Рейнджеров Мейнхеттена в штаб-квартиру «Стойл-Тек»!§!"
 
 FSR_steelhooves_tt:0 "§YСтарейшина Стилхувз прибывает с остатками Стальных Рейнджеров Мейнхеттена в штаб-квартиру «Стойл-Тек»!§!"
 
 FSR_cross_tt:0 "§YСтарейшина Кроссроадс прибывает с остатками Стальных Рейнджеров Мейнхеттена в штаб-квартиру «Стойл-Тек»!§!"
 
 FSR_msr_cottagegod_tt:0 "§GСтарейшина Коттедж Чиз присоединится к нашему делу.§!"

