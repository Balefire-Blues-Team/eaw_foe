

l_russian: 

##################
### FOCUS TREE ###
##################

### Opening Focuses ###
 
 FSR_thegreatwar:0 "Великая война"
 FSR_thegreatwar_desc:0 "Когда на наши головы упали мегазаклинания и сам Тартар разверзся под ногами, у наших полевых командиров не было времени выбирать, что спасать первым делом. Пришлось выбирать."
 
 FSR_stabletechq:0 "Штаб-квартира «Стойл-Тек»"
 FSR_stabletechq_desc:0 "Под штаб-квартирой «Стойл-Тек» наши предки укрыли несметные технологические богатства, охраняемые нами и по сей день."
 
 FSR_theelder:0 "Старейшина"
 FSR_theelder_desc:0 "Старейшина Блюберри Сейбр, нынешняя глава Филлидельфийского отделения, пребывает у власти уже долгое время."


### Industry Tree ###
 FSR_newindustry:0 "Промышленность Филлидельфии"
 FSR_newindustry_desc:0 "Большая часть филлидельфийской промышленности находится на севере, в копытах Красного Глаза, но мы держим какую-то часть на юге. До войны в Филлидельфии располагались многие промышленные титаны, главным образом – «Стойл-Тек». Мы возродим былое величие города!"
 
 FSR_out_docks:0 "Дальние верфи"
 FSR_out_docks_desc:0 "ВМФ Эквестрии фактически больше не существует, ныне только дураки и пираты выходят в море или сплавляются по рекам. Старейшина отдала приказ отремонтировать сохранившиеся доки и пустить их в дело, дабы мы смогли вовремя восстановить флот, когда он понадобится."
 
 FSR_filly_pumps:0 "Водяные насосы в Филли"
 FSR_filly_pumps_desc:0 "Стальные Рейнджеры, в отличие от многих народов пустоши, не утратили знаний об очистке больших масс воды. Применив эти знания и с помощью больших насосных станций на берегу реки, мы сможем удовлетворить запросы растущего населения и развивающейся промышленности."
 
 FSR_down_rennovation:0 "Реновация Саут-Энда"
 FSR_down_rennovation_desc:0 "Слишком долго мощности Саут-Энда лежали в руинах – теперь, когда сопротивление там подавлено, мы можем восстановить какую-то часть инфраструктуры. Это лишь первый шаг на пути к возвращению довоенной промышленности."
 
 FSR_hq_touchup:0 "Обновить штаб-квартиру"
 FSR_hq_touchup_desc:0 "Более чем на два столетия Стальные Рейнджеры Филлидельфии облюбовали бункеры и тоннели под штаб-квартирой «Стойл-Тек». Мы хорошо заботились о нашем доме, но строения на поверхности давным-давно обратились в развалины. Нам не составит труда восстановить линии электропередач и отстроить как минимум два надземных этажа."
 
 FSR_consumer_circuitry:0 "Собрать бытовую электротехнику"
 FSR_consumer_circuitry_desc:0 "Во время войны Филлидельфия была центром разработки и изготовления электронных товаров. Многие фабрики и цеха до сих пор никем не тронуты: роботы-охранники исправно несут службу и спустя двести лет."
 
 FSR_rebuild_robco:0 "Отстроить «Робронко»"
 FSR_rebuild_robco_desc:0 "«Робронко» были одной из крупнейших, если не самой крупной, компанией по производству робототехники в военные годы. Сначала они собирали в основном гражданские модели, но с эскалацией конфликта конвейер стал штамповать легионы протектопони и других боевых роботов."
 
 FSR_robotic_servants:0 "РОбочие"
 FSR_robotic_servants_desc:0 "Восстановив «Робронко», мы сможем поставить производство роботов на поток и освободить больше пони от чёрного труда." 
 
 FSR_bunker_armor:0 "Подземные арсеналы"
 FSR_bunker_armor_desc:0 "Переселив значительную часть населения на поверхность, мы освободим и снова запустим фабрики, которые раньше были вынуждены отдать под жилое пространство."
 
 FSR_unlock_trinity:0 "Проблемы с мейнфреймом"
 FSR_unlock_trinity_desc:0 "С мейнфреймом какие-то проблемы, но не переживайте: лучшие техники уже его чинят..."
 
 FSR_room_progress:0 "Дорогу прогрессу"
 FSR_room_progress_desc:0 "Быть может, мы и входим в число самых развитых группировок на пустоши, но даже мы восстановили лишь крупицу от былой промышленной мощи Эквестрии. Если мы хотим возродить цивилизацию когда-нибудь в будущем, нам необходимо расчистить завалы и проложить нормальные дороги."
 
 FSR_talk_to_trinity:0 "Первая просьба"
 FSR_talk_to_trinity_desc:0 "«Троица» просит, чтобы его лично посетил наш лидер [ROOT.GetLeader]. Видимо, мейнфрейм хочет обратиться с какой-то просьбой."
 
 FSR_talk_two_trinity:0 "Вторая просьба"
 FSR_talk_two_trinity_desc:0 "Вновь «Троица» запрашивает нашего присутствия. Посмотрим, что он хочет сказать в этот раз."
 
 FSR_talk_three_trinity:0 "Третья просьба"
 FSR_talk_three_trinity_desc:0 "Очередная просьба от «Троицы». Можно подумать, это компьютер тут заправляет всем, а не мы!"
 
 FSR_art_factory:0 "Завод реактивной артиллерии"
 FSR_art_factory_desc:0 "После того как мы расчистили завалы, алгоритмы «Троицы» всё подсчитали и указали на одну конкретную область. Там под поверхностью земли мы обнаружили секретный довоенный завод по выпуску реактивной артиллерии. Он сохранился идеально – осталось только провести электричество."
 
 FSR_thousand_gears:0 "Тысяча приводов"
 FSR_thousand_gears_desc:0 "Наша промышленность растёт не по дням, а по часам, пожирая горы ресурсов и исторгая ещё больше оружия. Если мы хотим сохранить стабильный рост и в будущем, нам придётся оптимизировать расход каждого привода, каждой бутыли воды, каждой капли топлива – всё будет использовано по максимуму во имя нашей цели."
 
 FSR_new_hq:0 "Последняя просьба"
 FSR_new_hq_desc:0 "И опять «Троица» призывает нас к себе, но что-то, кажется, идёт не так..."
 
 FSR_best_guns:0 "Лучшие пушки на пустоши"
 FSR_best_guns_desc:0 "Благодаря опыту в использовании военно-морского и наземного вооружения, равно как и аккуратности автоматизированных линий, мы достигнем нового уровня в изготовлении точных деталей для крупнокалиберных орудий."
 
 FSR_track_guns:0 "Орудия на гусеницах"
 FSR_track_guns_desc:0 "Мы привели в порядок промышленные мощности и восстановили стандарты производства, так что пора собрать осколки довоенных танковых проектов и ворваться в новый век на рокочущих гусеницах."
 
 
### Navy Tree ###
 
 FSR_surface_navy:0 "Надводный флот"
 FSR_surface_navy_desc:0 "Нашими нынешними методами и технологиями попросту невозможно воссоздать современные авианосцы и подводные лодки, составлявшие костяк ВМФ Эквестрии. Нам надо мыслить более старыми категориями, когда вершиной морских сражений были галеры и абордаж."
 
 FSR_new_harbor:0 "Новая гавань"
 FSR_new_harbor_desc:0 "Теперь, когда мы можем спускать на воду корабли, пора заново отстроить комплекс больших и малых доков на юге Филлидельфии."
 
 FSR_mobile_ships:0 "Манёвренные корабли"
 FSR_mobile_ships_desc:0 "Одним из главных врагов нашего нового флота станут многочисленные пираты, коими кишат моря и реки. Так как они в основном плавают на юрких каноэ и моторных лодках, мы тоже должны спроектировать такие суда, что смогут догнать и уничтожить их."
 
 FSR_naval_doctrine:0 "Военно-морская теория"
 FSR_naval_doctrine_desc:0 "Мейнфрейм «Стойл-Тек» содержит 2492 документа о теории военно-морского дела со схемами и описаниями тактик. Можно заняться их изучением, чтобы лучше понимать принципы войны на море." 
 
 FSR_big_ships:0 "Плавучие чудища"
 FSR_big_ships_desc:0 "Чтобы соревноваться с другими морскими державами, нам нужны крупные корабли с такой огневой мощью на борту, которой хватило бы сравнять с землёй небольшой городок. Для этого необходимо выпускать более крупные корпуса и чертить схемы нового оружия."
 
 FSR_naval_guns:0 "Корабельные батареи"
 FSR_naval_guns_desc:0 "Мало что способно посоперничать с корабельными орудиями довоенной Эквестрии в плане калибра и ужасающей огневой мощи. Нам потребуется много металла, пороха и топлива, чтобы наладить их выпуск, но они заставят наших врагов дрожать от страха."
 
 FSR_waste_navy:0 "Флот пустоши"
 FSR_waste_navy_desc:0 "Пустошь небогата ресурсами, и содержать флотилию крупных кораблей будет попросту разорительно. Если вместо этого сосредоточиться на массовом производстве небольших судов, мы станем грозной силой на море!"
 
 FSR_war_navy:0 "Флот военного времени"
 FSR_war_navy_desc:0 "Мы приложим все усилия, чтобы возродить ВМФ Эквестрии, каким он был в военные годы. Мы удовлетворимся лишь тогда, когда все моря от Сталлионграда до Зебрики окажутся под нашим контролем!"
 
 FSR_rule_seas:0 "Правь морями!"
 FSR_rule_seas_desc:0 "На подготовку и строительство ушли целые годы, но наконец-то наш флот действительно впечатляет! Отныне никто не будет нам ровней. Правь, МЫ, морями!"
 
### Army Tree ###
 FSR_srarmy:0 "Армия Стальных Рейнджеров"
 FSR_srarmy_desc:0 "С момента основания мы были лучшими из лучших. Настал черёд нашей армии смять всех на пустоши!"
 
 FSR_ajarmy:0 "Новые рейнджеры для нового мира"
 FSR_ajarmy_desc:0 "Прошли дни, когда немногочисленной, хорошо вооружённой элиты было достаточно для выживания. Мы должны принять в наши ряды жителей пустоши, если не хотим потерять доминирующее положение."
 
 FSR_healthyarmy:0 "Здоровые солдаты"
 FSR_healthyarmy_desc:0 "Практика выявила одну серьёзную проблему в нашей новой военной доктрине: намного более высокие потери, чем раньше. Необходимо что-то предпринять, дабы гарантировать личному составу шанс на выживание и комфорт."
 
 FSR_saddlearmy:0 "Новые боевые сёдла"
 FSR_saddlearmy_desc:0 "Многие из наших боевых сёдел были собраны ещё до войны и предназначены для мелкокалиберного оружия. Нужно разработать новые образцы, если нашим солдатам понадобятся пушки потяжелее."
 
 FSR_futurearmy:0 "Оружие будущего"
 FSR_futurearmy_desc:0 "До войны энергомагическое оружие было пиком технологического развития. Оно даст нам весомое преимущество перед врагами."
 
 FSR_armorarmy:0 "Броня новой модели"
 FSR_armorarmy_desc:0 "Отряды в силовой броне по-прежнему играют существенную роль в наших вооружённых силах. Ради нашего же блага они должны иметь самую лучшую экипировку."
 
 FSR_steellegion:0 "Стальной легион"
 FSR_steellegion_desc:0 "Сталь и плоть, тяжёлые рыцари и рекруты с пустошей – они наступают на врага единым фронтом. Никто не устоит перед поступью нашего стального легиона."
 
 FSR_roboarmy:0 "Робо-солдаты"
 FSR_roboarmy_desc:0 "Мы сделаем наши войска куда эффективнее, если задействуем автоматизированные подразделения роботов."
 
 FSR_trainwastelanders:0 "Доктрина пустоши"
 FSR_trainwastelanders_desc:0 "Мы до сих пор полагаемся на устаревшие доктрины – такие же, как и во время войны, шедшей двести лет назад. Если мы меняем армию, необходимо отказаться и от старых установок."
 
 FSR_priviarmy:0 "Привилегии для рейнджеров"
 FSR_priviarmy_desc:0 "Рейнджеры – самое отборное боевое формирование на пустоши, и мы это докажем."
 
 FSR_stabletecproject:0 "Технологии «Стойл-Тек»"
 FSR_stabletecproject_desc:0 "До войны «Стойл-Тек» была одной из самых инновационных компаний в Эквестрии. Их мейнфрейм содержит множество ценных данных, но все они зашифрованы. К счастью, писцы уверены, что смогут взломать код – надо только подождать."
 
 FSR_superiorarmor:0 "Модернизация брони"
 FSR_superiorarmor_desc:0 "Наши рыцари сумели придумать пару способов упростить производство силовой брони и улучшить непосредственно её качество."
 
 FSR_assaultweapons:0 "Тяжёлое штурмовое оружие"
 FSR_assaultweapons_desc:0 "Разрывные боеприпасы смертельны для небронированной лёгкой пехоты – то есть для большей части обитателей пустоши."
 
 FSR_elitescouts:0 "Отборные разведчики"
 FSR_elitescouts_desc:0 "Бездумная атака в лоб приносит только трупы. Мы должны проявлять осторожность и прибегать к разведке, чтобы быть в курсе любых неожиданностей."
 
 FSR_rangerdoctrine:0 "Доктрина рейнджеров"
 FSR_rangerdoctrine_desc:0 "Силовая броня была столпом нашей военной доктрины на протяжении двухсот лет. Зачем отказываться от неё сейчас?"
 
 FSR_rangerarmy:0 "Армия рейнджеров"
 FSR_rangerarmy_desc:0 "Наши солдаты чеканят шаг навстречу врагу, закованные в сталь. Может, это и не самая огромная армия на пустоши, но уж точно самая лучшая."
 
 FSR_raiderarmy:0 "Рейдерский корпус"
 FSR_raiderarmy_desc:0 "Наши войска сильно ограничены недостатком живой силы, а на границах хозяйничают рейдерские банды, вытесненные Красным Глазом. Может, получится убить разом двух грифонов?"
 
 FSR_fortresscity:0 "Город-цитадель"
 FSR_fortresscity_desc:0 "Многие сомневаются, сможем ли мы оборонять нашу штаб-квартиру в случае продолжительной осады. Надо тщательным образом подготовиться к чему бы то ни было."
 
 FSR_agressiveneg:0 "Воинственная дипломатия"
 FSR_agressiveneg_desc:0 "Кричи громко и держи при себе большую дубину – вот залог успешной дипломатии по-пустошному."
 
 FSR_newdoctrine:0 "Новая доктрина"
 FSR_newdoctrine_desc:0 "Дни силовой брони, когда она правила полем боя, сочтены. Чтобы не отстать от соседей, нам нужна большая, приведённая к единому стандарту армия."
 
 FSR_biggerguns:0 "Большие пушки"
 FSR_biggerguns_desc:0 "Большие пушки для большой армии. Избыток огневой мощи, в конце концов, ещё никому не вредил."
 
 FSR_biggestgun:0 "Самая большая пушка на пустоши"
 FSR_biggestgun_desc:0 "Они забьются в норы, когда увидят, что мы на них наведём!"
 
 FSR_raiderworkshops:0 "Рейдерские цеха"
 FSR_raiderworkshops_desc:0 "Рейдеры обустроили логова на нескольких старых заводах, в которых мы очень заинтересованы. С ними можно достичь некоего соглашения..."
 
 FSR_raiderdrugs:0 "Рейдерские наркотики"
 FSR_raiderdrugs_desc:0 "Рейдеры употребляют море разной химии как в бою, так и на отдыхе. Хотя вообще-то многие из этих препаратов предназначены для медицинского использования."
 
 FSR_raiderpaladins:0 "Рейдеры-паладины"
 FSR_raiderpaladins_desc:0 "Словно стальной прилив, исторгнутый пастью самого Тартара, они несутся и сметают всё на своём пути. Сила не самая отборная и не самая дисциплинированная, но одна из самых ужасающих – без сомнения."
 
 
### Opening Political Tree ###
 FSR_thescribes:0 "Вопрос писцов"
 FSR_thescribes_desc:0 "Писцы были административным и научным фундаментом нашего ордена на протяжении веков. Но относительно их будущего есть некоторые вопросы..."
 
 FSR_theknights:0 "Вопрос партизан"
 FSR_theknights_desc:0 "Мы не одни в этой части Филлидельфии. Многие чужеземцы также населяют нашу землю, и немногие из них разделяют наши цели. Конфликты между нами и ними привели к формированию группы так называемых «Партизан», которые сопротивляются каждому нашему шагу. Они представляют собой проблему, которую нужно решить."
 
 FSR_poldivisions:0 "Идейный разброд"
 FSR_poldivisions_desc:0 "Многие обитатели пустошей и члены нашего собственного отделения начали сомневаться в нашей миссии. Старейшина должна выбрать, к чьему совету прислушаться, ведь будущее туманно..."
 
 FSR_stablemainframe:0 "Мейнфрейм «Стойл-Тек»"
 FSR_stablemainframe_desc:0 "Мейнфрейм «Стойл-Тек» – загадочный механизм, набитый технологическими чудесами, и мы только начали раскрывать его секреты."
 
 FSR_industriallegacy:0 "Наследие нашей промышленности"
 FSR_industriallegacy_desc:0 "Огромная часть южной Филлидельфии была выделена под промышленность до Судного Дня, но ныне она погружена в хаос, и мы можем сохранить лишь часть её."
 
 FSR_industyfocus:0 "Цель нашей промышленности"
 FSR_industyfocus_desc:0 "Наша экономика на распутье. Из-за того, что Красный Глаз прямо у нас под боком, мы вынуждены экономить на гражданских и сосредоточиться на армии. Тем не менее наши пони от этого пострадают, поэтому мы можем помочь им в первую очередь. В конце концов, счастливый пони – верный пони. Старейшина, правда, может просто внести пару исправлений и на этом окончить обсуждение..."
 
 FSR_blueberry:0 "Блюберри Сейбр сохраняет позиции"
 FSR_blueberry_desc:0 "В ходе досрочных выборов выяснилось, что старейшина Блюберри и дальше сохранит свой пост. Она обещает продолжать свой умеренный подход и оставить нашу Миссию в планах."
 
 FSR_strawberry:0 "Строуберри Лемонэд становится старейшиной"
 FSR_strawberry_desc:0 "В ходе досрочных выборов выяснилось, что паладин Строуберри Лемонэд возьмёт на себя бразды правления отделением. Она обещает сосредоточиться на тех, кто находится вне территории отделения."
 
 FSR_badpony:0 "Нова Рейдж приходит к власти"
 FSR_badpony_desc:0 "В ходе досрочных выборов выяснилось, что высший паладин Нова Рейдж возьмёт отделение под свой контроль. Она высказала спорное намерение создать альянс с Красным Глазом и призвала нас усилить контроль над «низшими» жителями пустошей. Она решает..."

 ###Continuation### Фокусы Блюберри
 
 FSR_buisnessusual:0 "Всё как обычно"
 FSR_buisnessusual_desc:0 "Статус-кво был сохранён, и Блюберри Сейбр остаётся старейшиной. Мы можем продолжить нашу миссию."
 
 FSR_southbases:0 "Базы в Саут-Энде"
 FSR_southbases_desc:0 "Партизаны изгнаны из Саут-Энда, и мы наконец можем обустроить там базы и закрепиться в регионе."
 
 FSR_enemydoor:0 "Враг на пороге"
 FSR_enemydoor_desc:0 "Саннишор пал, а пони, населявшие его, бредут работать на фабриках Красного Глаза в цепях. Многие из нас волнуются, что мы станем следующими, а потому мы должны решить, что предпринять по этому поводу."
 
 FSR_aggressivestance:0 "Агрессивная позиция"
 FSR_aggressivestance_desc:0 "Лучшая защита – нападение!"
 
 FSR_defensivestance:0 "Оборонительная позиция"
 FSR_defensivestance_desc:0 "Защита – лучшая защита!"
 
 FSR_fightmadagascar:0 "Битва за Дипуотер"
 FSR_fightmadagascar_desc:0 "Дипуотер имеет протяжённую границу с нашими землями и защищён не слишком сильно. Возможно, мы сможем захватить его с минимальными военными усилиями."
 
 FSR_fortifymadagascar:0 "Укрепить Дипуотер"
 FSR_fortifymadagascar_desc:0 "Дипуотер наш, и мы должны укрепить его, чтобы Красный Глаз не отбил его обратно!"
 
 FSR_househardpoint:0 "Каждая пядь асфальта"
 FSR_househardpoint_desc:0 "Раз Красный Глаз хочет весь город только себе, его армия сломает об нас зубы! Засады на каждом углу, снайперы в окнах, бункеры в подвалах, круглосуточные патрули... Улицы потонут в крови его приспешников, прежде чем я буду вынуждена сдать Филлидельфию!"
 
 FSR_mechaspritemines:0 "Спрайтбот-мины"
 FSR_mechaspritemines_desc:0 "Созданные «Робронко» как строительные роботы, эти вдохновлённые параспрайтами конструкты способны собирать собственные копии. Если мы поручим мейнфрейму «Стойл-Тек» управлять ими и дадим ему директиву на защиту города, они будут предельно полезны."
 
 FSR_hqprotectrons:0 "Перепрограммировать системы штаб-квартиры"
 FSR_hqprotectrons_desc:0 "Штаб-квартира «Стойл-Тек» располагает сотнями автоматизированных защитных систем. Даже если мы сможем перепрограммировать лишь 10% из них, они всё равно сослужат добрую службу нашей обороне."
 
 FSR_defensenetwork:0 "Завершить автономную защитную систему"
 FSR_defensenetwork_desc:0 "До войны по всей Филлидельфии построили несметное количество точек ПВО. При подключении к мейнфрейму «Искатель» они сшибут любого дракона или ракету, решивших войти в воздушное пространство Эквестрии. Проект так и не закончили, но мы можем задействовать его часть в нашем секторе города."
 
 FSR_stable2expedition:0 "Экспедиция в Стойло 2"
 FSR_stable2expedition_desc:0 "Стойло 2, расположенное более чем в ста милях к западу от штаб-квартиры «Стойл-Тек», – настоящий клад продвинутых технологий! Мы продолжим нашу миссию по их сохранению и подготовим экспедицию к долгому путешествию!"
 
 FSR_steelalliance:0 "Стальной альянс"
 FSR_steelalliance_desc:0 "Слишком долго все отделения Стальных Рейнджеров стояли в одиночку против всего мира! Нам стоит предложить нашим братьям и сёстрам по всему свету вступить в великий альянс, в котором мы сможем дать отпор любому врагу!"
 
 FSR_newrations:0 "Новые пайки"
 FSR_newrations_desc:0 "В глубинах штаб-квартиры «Стойл-Тек» находится несметное количество складских помещений, некоторые из которых заполнены непортящимися продуктами. Старейшина решила, что пришло время использовать их для улучшения солдатских рационов, а также позволить заводить больше жеребят. Когда придёт война, они нам понадобятся."
 
 FSR_newknights:0 "Увеличить число рыцарей"
 FSR_newknights_desc:0 "Мы находимся в опасном положении. Красный Глаз уже стучится к нам в двери, а Анклав показывает свою уродливую голову, поэтому нам пригодится любое копыто, способное сражаться! Для этого Блюберри Сейбр планирует отменить увольнения для рыцарей и призвать большую часть старой гвардии."
 
 FSR_steelyouth:0 "Программа подготовки молодёжи"
 FSR_steelyouth_desc:0 "Понижение призывного возраста никогда не было хорошим знаком, но мы испытываем голод в пониресурсах, а потому должны научить каждого, кто способен держать винтовку, сражаться за свои жизни."
 
 FSR_morescribes:0 "Расширить штат писцов"  
 FSR_morescribes_desc:0 "Писцы жизненно необходимы для наших производственных и исследовательских мощностей. Если мы хотим опережать пустошь, нам нужно расширить их штат!"
 
 FSR_superscribes:0 "Школы в бункерах"
 FSR_superscribes_desc:0 "Дети должны ходить в школу. Дети также должны быть в безопасности. Очевидное решение этих проблем – строить школы в подземных бункерах!"
 
 FSR_techreclaim:0 "Вернуть потерянные технологии"
 FSR_techreclaim_desc:0 "Нашей миссией всегда был и будет захват и защита технологий старого мира. Сегодня мы вознесём нашу Миссию и всё то, чего нам удалось достичь."
 
 FSR_raidsilver:0 "Рейд за технологиями в Сильвервинг"
 FSR_raidsilver_desc:0 "Армейские склады Сильвервинга находятся достаточно близко к нашей базе и охраняются лишь несколькими некомпетентными бандитами. Если мы ударим жёстко и внезапно, то сможем освободить хранящиеся там технологии."
 
 FSR_raidpit:0 "Рейд в Яму за чертежами"
 FSR_raidpit_desc:0 "Это один из крупнейших промышленных центров на пустоши. Внутри находятся тысячи рабочих и тонны электроники, продвинутых технологий и оружия. Он также забит до краёв вооружёнными рабами и ещё более вооружёнными Когтями. Если мы хотим добыть эти сокровища, нам нужно действовать скрытно..."
 
 FSR_slapredeye:0 "Поставить Красного Глаза на место"
 FSR_slapredeye_desc:0 "Пришло время покончить с величайшей угрозой пустоши! Красный Глаз больше не будет копить рабов и технологии, в которых ничего не смыслит. Мы освободим технологии... ну и рабов тоже, пожалуй."
 
 FSR_demeter:0 "Проект «Деметра»"
 FSR_demeter_desc:0 "На пустоши мало тех, кто не испытывал голода, но у нас есть методы решения подобных проблем..."
 
 FSR_haephestus:0 "Проект «Гефест»"
 FSR_haephestus_desc:0 "Среди стрельбы и криков, если прислушаться внимательно, можно услышать грохот огромной печи. Адская машина, день и ночь питаемая осколками старого мира, штампует тысячи и тысячи ружей и снарядов."
 
 FSR_con_the_new_territories:0 "Администрирование новых территорий"
 FSR_con_the_new_territories_desc:0 "Теперь у нас много земли, но не так много пони, способных ею управлять. Чтобы справиться с этой проблемой, нам стоит учредить гражданские правительства под наблюдением лояльных рейнджеров. Мы надеемся, что это уменьшит недовольство и предотвратит дальнейшие восстания."
 
 FSR_con_emancipation:0 "Освобождение"
 FSR_con_emancipation_desc:0 "Теперь у нас куча рабов и никакого понятия, что с ними делать. Мы не можем их кормить и одевать, не знаем, как предотвратить возможное восстание, да и, по правде говоря, они нам не особо нужны. Так что ради решения всех этих проблем мы просто провозгласим их свободными. Они это точно оценят."
 
 FSR_con_subjugation:0 "Подчинение"
 FSR_con_subjugation_desc:0 "Раз уж у нас столько рабов, что ещё остаётся, кроме как заставить их работать? Мы будем к ним добрее, чем Красный Глаз, и они скоро оценят преимущества нашего правления."
 
 FSR_con_old_quotas:0 "Ввести старые нормы"
 FSR_con_old_quotas_desc:0 "Красный Глаз выжимал из своих рабов все соки. К их несчастью, мы не планируем ничего менять. Они будут производить всё, что нам потребуется, и останутся благодарны за то, что мы их защищаем, пока они работают."
 
 FSR_con_expand_foundries:0 "Расширить литейные"
 FSR_con_expand_foundries_desc:0 "Литейные Красного Глаза были основой его индустрии. Нам понадобится много стали, если мы хотим содержать наши войска в полном снаряжении, поэтому в наших интересах расширить его литейные цеха."
 
 FSR_con_slave_rangers:0 "Принимать рабов в рейнджеры"
 FSR_con_slave_rangers_desc:0 "Строгие стандарты призыва позволяли нам содержать самую профессиональную армию на пустоши. Однако мы больше не можем рассчитывать на небольшое число элитных войск для защиты наших территорий. Для уверенной обороны новых земель мы должны искать новых рекрутов. И разве есть лучший источник, чем недавно освобождённые рабы, готовые умереть за своих освободителей?"
 
 FSR_con_slave_compromise:0 "Большой компромисс"
 FSR_con_slave_compromise_desc:0 "Некоторые бывшие рабы оказались не настолько благодарными, как мы рассчитывали. Эти так называемые «Союзы» выступают с требованиями самоуправления и народного представительства. Хотя мы никогда не согласимся на подобные условия, нам придётся пойти на некоторый компромисс. Паладин Строуберри Лемонэд предложила идею, которая сможет их удовлетворить и при этом оставит власть в наших копытах. В обмен на ограниченную автономию бывшие рабы будут обязаны защищать нашу нацию при возникновении любой угрозы."
 
 FSR_con_scour_ruins:0 "Обыскать руины Филлидельфии"
 FSR_con_scour_ruins_desc:0 "Руины Филлидельфии – настоящая сокровищница полезных материалов. Приложив немного усилий, мы сможем собрать их все и заставить работать на нашу промышленность."
 
 FSR_con_rebuild_key_infra:0 "Отстроить ключевую инфраструктуру"
 FSR_con_rebuild_key_infra_desc:0 "Несмотря на все усилия Красного Глаза по восстановлению Филлидельфии, один из аспектов города практически полностью игнорировался – его инфраструктура. Мы сосредоточимся на том, что он упустил, запустив водоочистные станции и электростанции. Каждый рейнджер должен познать удовольствие от чистой воды и кондиционирования воздуха, да и я наконец-то смогу включить то старое массажное кресло, что годами пылится на складе."
 
 FSR_con_united_filly:0 "Единая Филлидельфия"
 FSR_con_united_filly_desc:0 "Бунты случаются уже не раз в неделю, а раз в месяц, и мы провели большую работу по укреплению нашего контроля. С угасанием сил сопротивления мы наконец можем сказать, что Филлидельфия под нашим полным контролем. Теперь пора обратить внимание на окружающие её территории."
 
 FSR_con_flatlands_industry:0 "Субсидировать индустрию Флэтлендса"
 FSR_con_flatlands_industry_desc:0 "То, что мы сейчас называем Флэтлендсом, при Красном Глазе не представляло собой ничего ценного. Это была лишь земля, соединявшая Филлидельфию и Собор, а потому там не было ничего, кроме рельсов и дорог. Управление этими землями оказалось в затруднительном положении, поэтому мы профинансируем постройку местных фабрик. Это лишь начало, но мы надеемся, что эти инвестиции послужат развитию их индустрии и нашего будущего."
 
 FSR_con_flatlands_agony:0 "Отстроить Агонию"
 FSR_con_flatlands_agony_desc:0 "Город с красноречивым названием Агония – ужасное место для жизни. Еды мало, работы ещё меньше, и в избытке лишь преступность. Однако он также является административным центром Флэтлендса. Чтобы немного помочь региону, а заодно показать местным преимущества нашего правления, мы инвестируем в промышленность города."
 
 FSR_con_flatlands_army:0 "Обучить армию Флэтлендса"
 FSR_con_flatlands_army_desc:0 "Армия Флэтлендса состоит в основном из бывших рабов, плохо обученного ополчения и неопытных наёмников. Их нехватка профессионализма – проблема не только для местных жителей, на которых они постоянно нападают, но и для нас, контролирующих регион. Потребуются усилия, чтобы привести их в порядок, но в конечном счёте оно того стоит."
 
 FSR_con_march_silverwing:0 "Марш на Сильвервинг"
 FSR_con_march_silverwing_desc:0 "Армейские склады Сильвервинга – законная собственность Министерства Военных Технологий. И хотя нам это прекрасно известно, некоторые окопавшиеся там преступники и бандиты не в курсе. Стоит напомнить им об этом свинцом."
 
 FSR_con_contingent_silverwing:0 "Основать контингент Сильвервинга"
 FSR_con_contingent_silverwing_desc:0 "Склады Сильвервинга теперь под нашим контролем, и мы должны задуматься над тем, кто будет управлять регионом. Мы не можем доверить местным армейские склады и уж точно не доверим им самоуправление. Вместо этого мы сформируем новый контингент Стальных Рейнджеров, который будет следить за этими землями."
 
 FSR_con_integrate_light:0 "Интегрировать Сияющий город"
 FSR_con_integrate_light_desc:0 "В Сиянии находится магическая электростанция, позволяющая городу оставаться электрифицированным вот уже более двух столетий. Это и послужило причиной его названия – сияющий маяк посреди пустоши. И хотя жители города считают, что электричество надо использовать для таких мелочей, как хорошее освещение, у нас есть планы куда получше."
 
 FSR_con_sunnyshore_salvage:0 "Отправить утиль-команды на Саннишор"
 FSR_con_sunnyshore_salvage_desc:0 "В регионе Саннишор столько руин, что большинство мусорщиков умерли бы от счастья, пройдясь по ним. К несчастью, местные поселения слишком заняты спорами друг с другом, поэтому задача по разбору завалов ложится на нас."
 
 FSR_con_sunnyshore_recruit:0 "Вербовочные пункты Саннишора"
 FSR_con_sunnyshore_recruit_desc:0 "В Саннишоре очень много пони, готовых отдать свою унылую жизнь в борьбе за высшее благо. Приложив лишь немного усилий, мы сможем убедить их, что в рядах Стальных Рейнджеров их жизнь станет гораздо лучше. Нужно лишь сгладить негативные стороны и сделать акцент на хорошем."
 
 FSR_con_sunnyshore_electronics:0 "Субсидировать «Санни Шоалс Электроникс»"
 FSR_con_sunnyshore_electronics_desc:0 "«Санни Шоалс Электроникс» производили множество бытовой электроники во время войны. Около века назад один предприниматель отбил себе фабрику и возродил предприятие. С тех пор они остаются одним из немногих независимых производителей электроники на пустоши. К несчастью, война Коалиции с Красным Глазом и её последствия привели к трудным временам. Чтобы помочь фабрике, мы предложим существенное финансовое вложение. Всё, что мы попросим взамен, – вечная скидка на их продукцию."
 
 FSR_con_united_knowledge:0 "Знание объединяет"
 FSR_con_united_knowledge_desc:0 "Знание – это ключ к нашему будущему. К будущему, которое объединит нас и все наши территории. Чтобы оно наступило быстрее, мы должны дать всем нашим пони хотя бы базовое образование, а также поощрять исследования и кооперацию между регионами."
 
 FSR_con_into_the_future:0 "Вперёд в будущее!"
 FSR_con_into_the_future_desc:0 "Наши враги разгромлены, наша власть закреплена, наша экономика процветает. Будущее светло, потому что его определяет не Красный Глаз и не одно из варварских государств, которыми усеяна пустошь. Будущее за Стальными Рейнджерами – настоящими спасителями Эквестрии и последним оплотом эквестрийского правительства."
 
 
 
 
 ###Destruction### Фокусы Новы Рейдж
 
 FSR_takeover:0 "Узурпация власти"
 FSR_takeover_desc:0 "Хотя Нова Рейдж и добилась поста старейшины, большая часть отделения до сих пор ей сопротивляется. Лишь обманом и запугиванием она сможет удержаться у власти, пока её соперники вовсю плетут заговоры."
 
 FSR_loyal_scribes:0 "Обеспечить «верность» писцов"
 FSR_loyal_scribes_desc:0 "Слишком долго писцы стояли на пути амбиций Новы Рейдж. Сегодня их хлипкая верность будет поставлена под вопрос. Кто докажет свою преданность – выживет..."
 
 FSR_loyal_politics:0 "Устранить политических оппонентов"
 FSR_loyal_politics_desc:0 "Есть немало пони, не первый год причиняющих Нове неудобства, но уже скоро этому можно будет положить конец. Любой, кто подводил её в прошлом или даже помышляет о бегстве в Мейнхеттен, станет жертвой «несчастного случая» во время патрулирования!"
 
 FSR_loyal_knights:0 "Чистки в рядах рыцарей"
 FSR_loyal_knights_desc:0 "Хотя большая часть рыцарей нас поддерживает, некоторые до сих пор верны старым идеалам и противятся нам. С новоприобретённой властью мы можем объявить их предателями и казнить за измену родине."
 
 FSR_red_offer:0 "Предложение"
 FSR_red_offer_desc:0 "Настал час осуществить планы Новы Рейдж и создать союз, который заставит дрожать всю пустошь."
 
 FSR_slave_indus:0 "Рабы на производстве"
 FSR_slave_indus_desc:0 "Окончательно укрепив власть, мы теперь можем ввести некоторые... более спорные меры. К примеру, использование рабов на самых опасных строительных объектах."
 
 FSR_slave_soldiers:0 "Рабы-солдаты"
 FSR_slave_soldiers_desc:0 "Хотя некоторые и беспокоятся, что рабам не стоит доверять оружие, нам необходимо разительно увеличить размер армии, так что у нас просто нет выбора."
 
 FSR_slave_breed:0 "Программа разведения рабов"
 FSR_slave_breed_desc:0 "Наше население, увы, в упадке. Чтобы исправить проблему, мы запустим крупномасштабную программу разведения рабов."
 
 FSR_warpath:0 "Тропа войны"
 FSR_warpath_desc:0 "Настал час нашему отделению показать себя миру и взять своё!"
 
 FSR_war_light:0 "Погасить свет"
 FSR_war_light_desc:0 "У так называемой нации Сияния есть плодородные земли, которые мы можем использовать с выгодой."
 
 FSR_war_rust:0 "Счистить ржавчину"
 FSR_war_rust_desc:0 "Любители поплавать по солёным водам Ржавого Остова вот-вот поймут, что никакие корабли не сдержат сухопутное наступление!"
 
 FSR_raid_light:0 "Рейд на Сияние"
 FSR_raid_light_desc:0 "Отправим туда экспедицию и глянем, что у них есть ценного."
 
 FSR_raid_rust:0 "Рейд на Понуостров"
 FSR_raid_rust_desc:0 "У них там вполне неплохие корабли. А что же ещё у них есть?"
 
 FSR_spoils_o_war:0 "Добыча и трофеи"
 FSR_spoils_o_war_desc:0 "Мы немало завоевали. Теперь настал час разобрать добычу!"
 
 FSR_cr_ill:0 "Болезнь"
 FSR_cr_ill_desc:0 "Внезапный недуг охватил Нову Рейдж. Её состояние ужасно, болезнь – неизвестна."
 
 FSR_cr_puppet1:0 "В ярме Красного Глаза"
 FSR_cr_puppet1_desc:0 "Мы лишились нашего лидерства. Нова до конца дней прикована к койке в своих палатах, а Красный Глаз тем временем прибрал к копытам все наши дела..."
 
 FSR_cr_puppet2:0 "Обширная работорговля"
 FSR_cr_puppet2_desc:0 "Работорговля – очень выгодное дело, которое однозначно нас обогатит."
 
 FSR_cr_puppet3:0 "Экономическая интеграция"
 FSR_cr_puppet3_desc:0 "Мы интегрируем нашу экономику в экономику Красного Глаза ради его и нашего процветания."
 
 FSR_cr_puppet4:0 "Паладины-работорговцы"
 FSR_cr_puppet4_desc:0 "Дни рыцарства и чести давно прошли. Теперь важна лишь прибыль и восстановление Эквестрии."
 
 FSR_cr_puppet5:0 "Расселить рабов"
 FSR_cr_puppet5_desc:0 "Мы можем увеличить наше население, заселив купленных рабов на наших землях."
 
 FSR_cr_puppet6:0 "Предложить полное слияние"
 FSR_cr_puppet6_desc:0 "Настал час целиком воссоединиться с Красным Глазом, чтобы вместе покорить пустоши!"
 
 FSR_cr_free1:0 "Снова в деле"
 FSR_cr_free1_desc:0 "И готовы задать жару!"
 
 FSR_cr_free2:0 "Экономический бум"
 FSR_cr_free2_desc:0 "Кто знал, что рабы так помогут экономике?"
 
 FSR_cr_free3:0 "Открыть запасные оружейные"
 FSR_cr_free3_desc:0 "НЗ нужен лишь потому, что нам просто не хватает оружия!"
 
 FSR_cr_free4:0 "Расширить армию"
 FSR_cr_free4_desc:0 "Каждой стране нужна армия, а Нова хочет ещё и большую."
 
 FSR_cr_free5:0 "Предложить политический брак"
 FSR_cr_free5_desc:0 "Красный Глаз – самый могучий жеребец пустоши, а Нова о-о-очень любит мощь! Если эти двое сойдутся и объединят страны воедино, кто сможет их остановить?"
 
 FSR_cr_free6:0 "Великая армия"
 FSR_cr_free6_desc:0 "С огромными армиями Красного Глаза и не менее впечатляющими войсками Стальных Рейнджеров мы создадим армию невиданных со времён Великой войны масштабов!"
 
 FSR_cr_free7:0 "Сталь и пламя"
 FSR_cr_free7_desc:0 "Всё, что нужно для процветания и завоеваний. Кровь наших врагов оросит наши поля, их кости станут фундаментом нашего нового общества!"
 
 FSR_cr_free8:0 "Эквестрия – больше чем просто имя"
 FSR_cr_free8_desc:0 "Нова Рейдж и Красный Глаз торжествуют! Под их властью лежит государство, которому нет равных. Они – безраздельные владыки новой Эквестрии."
 
 
 ###Visionary### Путь Строуберри
 
 FSR_outlook:0 "Новый взгляд"
 FSR_outlook_desc:0 "Строуберри привносит много новых идей на рассмотрение, хотя некоторые из них несколько... нестандартны."
 
 FSR_for_politics:0 "Наша внешняя политика"
 FSR_for_politics_desc:0 "Хотя мы долгое время и придерживались изоляционизма, старейшина Строуберри желает это изменить."
 
 FSR_denounce_red:0 "Осудить Красного Глаза"
 FSR_denounce_red_desc:0 "«Тиран пустошей», «хозяин кандалов», «ужас Филлидельфии» – не самый приятный пони, не так ли?"
 
 FSR_save_slaves:0 "Убежище для беженцев из Саннишора"
 FSR_save_slaves_desc:0 "Саннишор пал, но некоторые из их лидеров смогли сбежать на нашу территорию."
 
 FSR_propaganda_slaves:0 "Пропагандистская кампания"
 FSR_propaganda_slaves_desc:0 "Мы знаем, что такое хорошо и что такое плохо. Должен узнать и ты!"
 
 FSR_partisan_meeting:0 "Встреча с партизанами"
 FSR_partisan_meeting_desc:0 "Мы уже начали с ними переговоры, теперь же мы можем их закончить... достойным образом."
 
 FSR_partisan_knights:0 "Из партизан в рыцари"
 FSR_partisan_knights_desc:0 "Раз они так долго с нами сражались, это значит, что они довольно хороши в бою. Мы сможем использовать их навыки ради нашего блага."
 
 FSR_partisan_experts:0 "Использовать опыт партизан"
 FSR_partisan_experts_desc:0 "Все эти грязные трюки из партизанских инструктажей могут быть применены в нашей армии с большой пользой."
 
 FSR_war_prep:0 "Подготовка к войне"
 FSR_war_prep_desc:0 "На счету каждая пуля – особенно если она уготовлена работорговцу!"
 
 FSR_dom_politics:0 "Внутренняя политика"
 FSR_dom_politics_desc:0 "Ведь внутренние враги куда более зловещи, чем внешние."
 
 FSR_reform_scribes:0 "Набрать писцов с пустоши"
 FSR_reform_scribes_desc:0 "Там немало довольно умных пони. Давайте дадим им работать на нас!"
 
 FSR_reform_citizens:0 "Вопрос гражданства"
 FSR_reform_citizens_desc:0 "В старой Эквестрии гражданство предоставлялось всем пони, но можем ли мы в наше время позволить такую роскошь?"
 
 FSR_resentment:0 "Борьба с дискриминацией"
 FSR_resentment_desc:0 "Происходит немало конфликтов между старой и новой гвардией в наших рядах. Мы начнём кампанию по подавлению любых расколов в наших рядах, ведь только вместе мы сможем процветать!"
 
 FSR_opposition:0 "Внутренняя оппозиция"
 FSR_opposition_desc:0 "Не все из наших пони поддерживают новый путь отделения, задуманный старейшиной Строуберри. С этими инакомыслящими так или иначе нужно разобраться."
 
 FSR_deal_nova:0 "Разобраться с Новой Рейдж"
 FSR_deal_nova_desc:0 "Высший паладин Нова Рейдж: большая, сильная и не любит Строуберри. Она – конкретная угроза планам старейшины, поэтому с ней необходимо разобраться."
 
 FSR_deal_crossroads:0 "Сделка с Ваниллой Свирл"
 FSR_deal_crossroads_desc:0 "Недавно повышенный высший паладин Ванилла Свирл показала, что она явно разумнее своей предшественницы. Возможно, мы сможем убедить её быть нам беспрекословно верной."
 
 FSR_prep_reform:0 "Пообещать реформы"
 FSR_prep_reform_desc:0 "Предпринимать какие-либо крупные реформы было бы неразумно в свете того, что над нами нависает угроза со стороны Красного Глаза. Тем не менее мы можем пообещать провести их в будущем."
 
 FSR_kill_red:0 "Освободить Филлидельфию"
 FSR_kill_red_desc:0 "Час настал. Все в призывные пункты! Филлидельфия будет нашей!"
 
 ###Reclamation### Тоже Строуберри
 
 FSR_sl_victory:0 "Освобождённая Филлидельфия"
 FSR_sl_victory_desc:0 "Мы справились, Строуберри! Мы спасли Филлидельфию!"
 
 FSR_sl_filly_united:0 "Единый город"
 FSR_sl_filly_united_desc:0 "Филлидельфия вновь объединена под одним стягом. И больше никогда не будет разделена!"
 
 FSR_sl_fanatics:0 "Истинные верующие"
 FSR_sl_fanatics_desc:0 "Самые фанатичные из сторонников Красного Глаза начали партизанскую кампанию против наших солдат. Они проводят операции из Вечнодикого леса, в который мы не можем просто так ввести войска."
 
 FSR_sl_cathedral:0 "Монумент ложного мессии"
 FSR_sl_cathedral_desc:0 "Собор ранее был столицей нации Красного Глаза. Теперь же, с нашей помощью, от него остались лишь выжженные руины."
 
 FSR_sl_euthanize:0 "Холодное правосудие"
 FSR_sl_euthanize_desc:0 "Слишком много было сотворено ужасного, слишком много жизней унёс с собой Красный Глаз. Сегодня восторжествует справедливость!"
 
 FSR_sl_redemption:0 "Шанс на искупление"
 FSR_sl_redemption_desc:0 "Хотя некоторые подданные Красного Глаза, очевидно, чистейшее зло, ещё есть те, кто добр в глубине своей души. Мы должны предоставить таким существам второй шанс."
 
 FSR_sl_slaves:0 "Бывшие рабы"
 FSR_sl_slaves_desc:0 "На улицах проходят бунты: бывшие рабы Филлидельфии требуют свободы. Мы можем кое-что пообещать и поклясться улучшить ситуацию ради обеспечения хотя бы временного мира."
 
 FSR_sl_cry_for_freedom:0 "Все те, у кого нет будущего..."
 FSR_sl_cry_for_freedom_desc:0 "Строуберри Лемонэд организовала встречу с определившимися «главарями» бывших рабов."
 
 FSR_sl_slave_resettlement:0 "Обретут новую жизнь средь нас"
 FSR_sl_slave_resettlement_desc:0 "Бывшим рабам был представлен список условий, которым им придётся соответствовать, если они желают принять режим Стальных Рейнджеров."
 
 FSR_sl_slavers:0 "Мразь Филлидельфии"
 FSR_sl_slavers_desc:0 "Бывшие рабовладельцы Филлидельфии всё ещё нам противятся. Пока их товарищи во внутренних землях продолжают вести активные бои с нами, их остатки в городе нынче в основном устраивают засады на патрули и убивают одиночных рабов. Их нужно будет просто вычистить."
 
 FSR_sl_stern:0 "Сделки с грифонами"
 FSR_sl_stern_desc:0 "Новый лидер Когтей, Рагини, говорят, грифина разумная. Наверное, с ней можно будет найти общий язык."
 
 FSR_sl_grif_mercs:0 "Новый договор"
 FSR_sl_grif_mercs_desc:0 "Рагини и остатки Когтей будут интегрированы в нашу армию. Мы думаем, что они станут ценной её частью."
 
 FSR_sl_grif_citizens:0 "Граждане, не наёмники"
 FSR_sl_grif_citizens_desc:0 "Вместо применения их в армии мы сможем устроить Рагини и её грифонов на гражданскую работу и таким образом побороть стереотип, что все грифоны должны быть наёмниками."
 
 FSR_sl_schools:0 "Государственные школы"
 FSR_sl_schools_desc:0 "Бывшие рабы, как и рабовладельцы, зачастую необразованны и ничего не умеют. Помимо того, наших писцов стало слишком много. Возможно, решив одну проблему, мы решим и другую."
 
 FSR_sl_workers_not_slaves:0 "Цепи на плуги"
 FSR_sl_workers_not_slaves_desc:0 "Даже сейчас северная Филлидельфия переполнена и почти не функционирует, но у нас есть решение..."
 
 FSR_sl_hunt_remnants:0 "Добить оставшихся"
 FSR_sl_hunt_remnants_desc:0 "Только внутренние земли всё ещё скрывают остатки некогда огромной армии Красного Глаза. Мы будем прочёсывать каждый холм и долину, пока каждый из них не умрёт!"
 
 FSR_sl_police:0 "Гражданская полиция"
 FSR_sl_police_desc:0 "Слишком долго наши вооружённые силы были обременены поддержанием мира! Отныне настоящая полиция будет заниматься принуждением к соблюдению закона."
 
 FSR_sl_brightest:0 "Светлые умы для светлого будущего"
 FSR_sl_brightest_desc:0 "Мы обещали интегрировать бывших рабов в наше правительство. Пришло время выполнить это обещание."
 
 FSR_sl_rations:0 "Выдача рационов"
 FSR_sl_rations_desc:0 "По мере того как всё больше и больше бывших рабов оседают в сельских районах, производство продуктов питания неуклонно растёт. Мы скупим излишки продуктов и раздадим их в тех районах, где населению грозит голод."
 
 FSR_sl_no_doubters:0 "«Отпуск» для сомневающихся"
 FSR_sl_no_doubters_desc:0 "Некоторых пони просто невозможно сделать счастливыми, что бы вы ни пытались сделать для них. Однако у нас есть несколько шахт в глубине Вечнодикого леса, где они могут взять «отпуск» и научиться вести себя так, как должны вести себя образцовые граждане."
 
 FSR_sl_the_front:0 "Великое объявление"
 FSR_sl_the_front_desc:0 "Старейшина Строуберри Лемонэд сделает масштабное заявление, которое затронет нашу страну в целом."
 
 FSR_sl_constitution:0 "Конституция Эквестрии"
 FSR_sl_constitution_desc:0 "Одним из условий, выдвинутых бывшими рабами, было обеспечение создания надлежащей конституции. Пришло время удовлетворить этот запрос."
 
 FSR_sl_government:0 "Сформировать надлежащее правительство"
 FSR_sl_government_desc:0 "Будут приняты законы, разработан бюджет и установлена надлежащая бюрократия. Наконец-то в Эквестрии снова будет гражданское правительство."
 
 FSR_sl_colony_office:0 "Офис колониальных дел"
 FSR_sl_colony_office_desc:0 "Мы полностью планируем вернуть все бывшие земли Эквестрии. Чтобы облегчить этот процесс, мы создадим правительственное учреждение, занимающееся расширением гражданства и интеграцией всех будущих эквестрийцев на этих землях."
 
 FSR_sl_tribe_ultimatum:0 "Ультиматум племенам"
 FSR_sl_tribe_ultimatum_desc:0 "Племена к северу от нашей страны могут оказаться проблемой для успешной интеграции из-за резких культурных различий. Однако это также означает, что если мы сможем интегрировать их, мы сможем интегрировать кого угодно!"
 
 FSR_sl_hmi_operation:0 "Восстановить ХМИ"
 FSR_sl_hmi_operation_desc:0 "ХМИ, или «Хазард Майнинг Инк.», была национализированной компанией, основанной во время войны для поставки сырых металлов, необходимых для поддержки военных действий. Если мы восстановим её, она точно так же сможет поддержать усилия по реконструкции."
 
 FSR_sl_mountain_roads:0 "Инфраструктура для племён"
 FSR_sl_mountain_roads_desc:0 "Как в интересах наших собственных сил, перемещающихся по их землям, так и ради самих местных жителей мы будем вкладывать средства в строительство и ремонт дорог через земли, ранее принадлежавшие племенам."
 
 FSR_sl_pony_aid:0 "Понитарная помощь"
 FSR_sl_pony_aid_desc:0 "Многие из бывших племён страдают, живя в грязи и убожестве. В знак нашей доброй воли мы поможем им вытянуть себя из нищеты и принести себе немного цивилизации."
 
 FSR_sl_march_north:0 "Подчинить горы"
 FSR_sl_march_north_desc:0 "Горы на севере предлагают приличное количество ресурсов и стратегический доступ к Кантерлоту. Мы поможем нашей новой колонии завладеть этими землями на благо и нам, и им."
 
 FSR_sl_delve_deep:0 "Глубже в горы"
 FSR_sl_delve_deep_desc:0 "Хотя мы считаем, что ресурсы, содержащиеся в горах, огромны, безжалостный снег и пересечённая местность затрудняют их добычу. Мы должны оказать нашей колонии поддержку в организации надлежащих операций по добыче полезных ископаемых, если хотим увидеть эти горные ресурсы на наших фабриках."
 
 FSR_sl_super_crystal:0 "Экспедиция в горы"
 FSR_sl_super_crystal_desc:0 "Горы к востоку от Кантерлота неизведанны для нас. Потенциально они могут скрывать любое количество эквестрийских сооружений или секретов. Мы отправимся в экспедицию, чтобы узнать, что таит в себе эта огромная земля."
 
 FSR_sl_rich_mountains:0 "Богатства гор"
 FSR_sl_rich_mountains_desc:0 "Горы оказались прекрасным источником металлов и кристаллов. Будет открыто ещё несколько шахт для добычи ещё большего количества этих ресурсов."
 
 FSR_sl_road_canterlot:0 "Горною тропой"
 FSR_sl_road_canterlot_desc:0 "Развитая сеть дорог облегчит нашим шахтёрам и солдатам передвижение по пересечённой местности."
 
 FSR_sl_ponyville:0 "Ситуация в Понивилле"
 FSR_sl_ponyville_desc:0 "Регион Понивилля имеет для нас стратегическое значение из-за его непосредственной близости к Кантерлоту. Хотя мы могли бы просто полностью захватить регион, также возможно, что одна из местных фракций захочет работать с нами."
 
 FSR_sl_study_dogs:0 "Изучить псов"
 FSR_sl_study_dogs_desc:0 "Мы обнаружили тех, кого считаем прямыми и в значительной степени неизменёнными потомками довоенных алмазных псов, живущих в горах. На данный момент мы будем наблюдать и изучать их, пока не сможем определить их характер и полезность."
 
 FSR_sl_dog_friends:0 "Лучший друг пони"
 FSR_sl_dog_friends_desc:0 "Патруль алмазных псов нашёл одного из наших исследователей. Хотя мы опасались враждебной реакции, псы оказались не только дружелюбными, но и полезными. Эта встреча привела к расширению сотрудничества между нашими народами."
 
 FSR_sl_best_miners:0 "Лучшие шахтёры Эквестрии"
 FSR_sl_best_miners_desc:0 "Одно можно сказать наверняка: ни один пони не сможет соревноваться с алмазным псом в рытье земли. Их природный талант может оказаться очень полезным для нашей горнодобывающей промышленности."
 
 FSR_sl_kill_canterlot:0 "Возвращение Кантерлота"
 FSR_sl_kill_canterlot_desc:0 "Прилегающие районы зачищены от врагов, и наши солдаты могут быстро занять позиции. Пора вернуть прежнюю столицу Эквестрии!"
 
 FSR_sl_declare_intent:0 "Объявление намерений"
 FSR_sl_declare_intent_desc:0 "Мы – полноправные преемники эквестрийского правительства. Пусть никто не заблуждается: вся Эквестрия будет воссоединена под нашим законным правлением."
 
 FSR_sl_issues:0 "Насущные вопросы"
 FSR_sl_issues_desc:0 "Хотя многие проблемы, с которыми мы столкнулись после освобождения Филлидельфии, были решены, экономика всё ещё остаётся в руинах. Если мы хотим восстановить Эквестрию, мы должны сначала восстановить нашу экономику."
 
 FSR_sl_economy_com:0 "Комитет экономического планирования"
 FSR_sl_economy_com_desc:0 "Будет создан Центральный комитет промышленников и бюрократов, чтобы помочь вытащить нашу экономику из пресловутой помойки."
 
 FSR_sl_private_redeye:0 "Приватизация наследства"
 FSR_sl_private_redeye_desc:0 "В «нации» Красного Глаза вся земля находилась в собственности государства. Чтобы вернуть нашу экономику в рабочее состояние, возможно, было бы полезно приватизировать приличную долю некритических отраслей."
 
 FSR_sl_industry_titan:0 "Титаны производства"
 FSR_sl_industry_titan_desc:0 "Чтобы способствовать дальнейшему восстановлению нашей экономики и обеспечить удовлетворение потребностей нашего правительства, мы позаботимся о поддержке крупных частично государственных корпораций."
 
 FSR_sl_anti_infl:0 "Меры против инфляции"
 FSR_sl_anti_infl_desc:0 "Бутылочная крышка практически обесценилась из-за гигантской гиперинфляции. В качестве временной меры, которая поможет взять эту ситуацию под контроль, мы должны предпринять усилия по изъятию большой доли крышек из общего оборота."
 
 FSR_sl_the_bit:0 "Бит"
 FSR_sl_the_bit_desc:0 "С созданием нашей горнодобывающей промышленности мы считаем, что сможем добыть достаточно золота, чтобы возродить довоенный эквестрийский бит в качестве нашей официальной валюты. Хотя переход на новую валюту может занять некоторое время, этот ход может иметь большое значение для восстановления Эквестрии."
 
 FSR_sl_economy_saved:0 "Стабильная экономика"
 FSR_sl_economy_saved_desc:0 "Похоже, наши усилия увенчались успехом, и экономика вернулась в нормальное русло."
 
 FSR_sl_filly_industry:0 "Стальное сердце Эквестрии"
 FSR_sl_filly_industry_desc:0 "Во время войны Филлидельфия была сердцем эквестрийской индустрии. Теперь она может снова стать таковым."
 
 FSR_sl_merchant_navy:0 "Торговый флот"
 FSR_sl_merchant_navy_desc:0 "Когда-то большая часть торговли Эквестрии велась по морю. Пора нам восстановить морскую торговлю! Для этого мы должны создать соответствующий флот – такой, который способен защитить всех наших будущих торговцев."
 
 FSR_sl_united_front:0 "Единым фронтом"
 FSR_sl_united_front_desc:0 "Мы не единственные, кто стремится к лучшей Эквестрии. Если мы присоединимся к тем, кто разделяет наши цели, мы сможем ускорить процесс восстановления нашей великой нации!"
 
 FSR_sl_share_culture:0 "Поделиться нашей культурой"
 FSR_sl_share_culture_desc:0 "Многие эквестрийцы давно позабыли свою культуру. Нам надо провести кампанию и напомнить им, каким надлежит быть настоящему жителю Эквестрии!"
 
 FSR_sl_share_knowledge:0 "Поделиться нашими знаниями"
 FSR_sl_share_knowledge_desc:0 "Многие знания Эквестрии были забыты практически всеми. Мы оказались одними из тех немногих, кто их сберёг. Однако после войны многое было изучено вновь. Может быть, мы могли бы поделиться своими знаниями в обмен на то, что наши союзники поделятся своими?"
 
 FSR_sl_expand_citizen:0 "Расширить определение «гражданина»"
 FSR_sl_expand_citizen_desc:0 "В нашем государстве и в Эквестрии в целом существует множество разных существ. Сейчас поднимаются вопросы, следует ли считать этих существ гражданами."
 
 FSR_sl_ghoul_citizens:0 "Граждане-гули?"
 FSR_sl_ghoul_citizens_desc:0 "Многие опасаются гулей, и вполне справедливо. Все гули – это просто бомбы замедленного действия, которые в любой день могут одичать и атаковать окружающих. Однако правильно ли отказывать им в гражданстве только потому, что они могут когда-нибудь дожить до старости?"
 
 FSR_sl_dog_citizens:0 "Граждане-псы?"
 FSR_sl_dog_citizens_desc:0 "Алмазные псы зарекомендовали себя трудолюбивыми и преданными делу. Может, им пора стать полноценными гражданами?"
 
 FSR_sl_hmi_reborn:0 "Возрождение ХМИ"
 FSR_sl_hmi_reborn_desc:0 "«Хазард Майнинг Инк.» до сих пор добивалась больших успехов в своих начинаниях. Кто знает, чего можно достичь с большим финансированием и ресурсами?"
 
 FSR_sl_pegasi_citizens:0 "Пегасы-граждане?"
 FSR_sl_pegasi_citizens_desc:0 "Когда на Эквестрию обрушился огненный дождь, пегасы запечатали небо и покинули свою страну. Теперь возник вопрос, заслуживают ли они гражданства в нашей восстановленной Эквестрии."
 
 FSR_sl_labor_buero:0 "Бюро труда"
 FSR_sl_labor_buero_desc:0 "Будет сформирован правительственный департамент, который станет помогать управлять нашей экономикой и защищать наших рабочих."
 
 FSR_sl_census:0 "Государственная перепись населения"
 FSR_sl_census_desc:0 "Перед войной Эквестрия проводила ежегодную перепись, чтобы отслеживать любые изменения населения. Сделав нечто подобное, мы могли бы получить представление о том, сколько пони живёт на наших землях."
 
 FSR_sl_four_child:0 "Политика четырёх детей"
 FSR_sl_four_child_desc:0 "Из-за нехватки еды в эквестрийских семьях после войны редко было больше одного или двух жеребят. С нехваткой продуктов питания справились, но нехватка детей остаётся. Возможно, пришло время принять меры для поощрения рождаемости."
 
 FSR_sl_unions:0 "Сделка с союзами"
 FSR_sl_unions_desc:0 "Поскольку наше население организовано лучше, чем когда-либо прежде, сформировались различные профсоюзы, отстаивающие права трудящихся и требующие уступок."
 
 FSR_sl_labor_laws:0 "Защитить рабочих"
 FSR_sl_labor_laws_desc:0 "В сотрудничестве с профсоюзами Бюро разработало различные законы и постановления, призванные обеспечить нашим работникам безопасность и комфорт."
 
 FSR_sl_happy_pony:0 "Реформировать министерства"
 FSR_sl_happy_pony_desc:0 "Во время войны министерства контролировали почти все сферы эквестрийского правительства. Пора сделать это снова."
 
 FSR_sl_inter_relations:0 "Межвидовые отношения"
 FSR_sl_inter_relations_desc:0 "В интересах мирной интеграции мы должны приложить усилия, чтобы изучить и понять обычаи и образ жизни различных существ, не относящихся к пони, которые живут в пределах наших границ."
 
 FSR_sl_harmony_theory:0 "Теория гармонии"
 FSR_sl_harmony_theory_desc:0 "Пони, псы, грифоны, многие другие... Когда столько существ трудится сообща и перенимает опыт друг друга, небывалое процветание неизбежно."
 
 FSR_sl_cultural_integration:0 "Школа им. Строуберри для одарённых эквестрийцев"
 FSR_sl_cultural_integration_desc:0 "В рамках наших усилий по восстановлению Эквестрии до довоенного состояния мы решили создать высшее учебное заведение. Эта великая школа, названная в честь нашей Великой регентихи, поможет запустить наши технологии в будущее! Вернее, в прошлое."
 
 FSR_sl_country_united:0 "Единая страна"
 FSR_sl_country_united_desc:0 "Кантерлот наш! Нам надо как можно скорее начать отстраивать разрушенное и снова сделать его столицей Эквестрии."
 
 FSR_sl_god_dead:0 "Мёртвая богиня"
 FSR_sl_god_dead_desc:0 "Луна мертва. Работая над очисткой и восстановлением Кантерлотского дворца, мы обнаружили и опознали Её останки. Великая регентиха объявила национальный день траура и организует похороны нашей павшей принцессы."
 
 FSR_sl_march_azure:0 "Пересечь Азурвэй"
 FSR_sl_march_azure_desc:0 "Азурвэй – одна из крупнейших рек южной Эквестрии, и весь окружающий регион назван в её честь. Пора вернуть этот регион."
 
 FSR_sl_march_manehattan:0 "Марш на Мейнхеттен"
 FSR_sl_march_manehattan_desc:0 "Некогда Мейнхеттен был средоточием торговли и материального достатка. Возможно, если мы возьмём его под свой контроль, он вновь станет таким."
 
 FSR_sl_mwt:0 "Министерство военных технологий"
 FSR_sl_mwt_desc:0 "Министерство военных технологий занималось управлением и расширением производственных возможностей Эквестрии во время войны, наряду с разработкой как военных, так и промышленных технологий. Поскольку все другие министерства пали вместе с Эквестрией, МВТ уцелело лишь в форме Стальных Рейнджеров. Пришло время восстановить Министерство в том виде, в каком оно задумывалось."
 
 FSR_sl_mwt2:0 "Новый министерский центр"
 FSR_sl_mwt2_desc:0 "Хотя наши нынешние объекты хорошо служат нашим вооружённым силам, они не подходят для гражданского министерства. Поэтому в Филлидельфии должен быть построен новый министерский центр для работы наших гражданских сотрудников."
 
 FSR_sl_mwt3:0 "НИЦ военного времени"
 FSR_sl_mwt3_desc:0 "После завершения строительства нового центра Министерство может возобновить многие из своих исследовательских проектов, существовавших до того, как мир отправился в Тартар. Разумеется, с упором на военные достижения."
 
 FSR_sl_mwt4:0 "Противомашинные винтовки"
 FSR_sl_mwt4_desc:0 "Противомашинные винтовки были одним из многих изобретений, появившихся в МВТ во время войны в противовес зебриканским роботам. Хотя некоторые обеспокоены тем, что их могут использовать против нашей собственной силовой брони, мы опасаемся, что отсутствие инвестиций в эту технологию поставит нас в невыгодное положение. Поэтому мы немедленно возобновим разработку этого оружия."
 
 FSR_sl_mwt5:0 "Скорострельное оружие"
 FSR_sl_mwt5_desc:0 "Хотя противодействие тяжёлой броне – это хорошо, большинство наших врагов не обладают столь тяжёлой защитой. Если мы хотим противостоять налётчикам, работорговцам и даже аликорнам, мы должны начать вкладывать средства в скорострельное оружие малого калибра."
 
 FSR_sl_mwt6:0 "Модернизация силовой брони"
 FSR_sl_mwt6_desc:0 "Наша силовая броня служит нам более 200 лет. Однако за эти 200 лет в технологии силовой брони не было никаких реальных продвижений. Пора улучшить наши старые чертежи, чтобы наши солдаты были защищены в грядущих войнах."
 
 FSR_sl_mwt7:0 "Броня типа «Джаггернаут»"
 FSR_sl_mwt7_desc:0 "Силовая броня класса «Джаггернаут» – это, по сути, увеличенная версия нашей стандартной брони. Она имеет дополнительное покрытие и усиленные внутренние компоненты. Пускай это не самая дешёвая в сборке вещь, она обеспечит нашим солдатам непревзойдённую защиту."
 
 FSR_sl_mwt8:0 "Броня типа XVII"
 FSR_sl_mwt8_desc:0 "Силовая броня класса XVII названа так потому, что может быть собрана всего из 17 отдельных компонентов. Это значительно упрощает массовое производство по сравнению с нашей нынешней силовой бронёй, что необходимо для дальнейшего расширения наших мощных бронетанковых сил."
 
 FSR_sl_mom:0 "Министерство морали"
 FSR_sl_mom_desc:0 "Министерство морали было основано с целью поддержания высокого морального духа гражданского населения. Однако по мере обострения войны оно начало проводить контрразведывательные операции по всей Эквестрии. Меры, принимаемые для борьбы с проникновением зебр, становились всё более агрессивными, пока министерство не стало следить за каждым жителем, мало заботясь о личных правах."
 
 FSR_sl_mom2:0 "Отреставрировать Ферму развлечений"
 FSR_sl_mom2_desc:0 "Филлидельфийская ферма развлечений была построена в рамках инициативы Министерства морали для обеспечения отдыха и развлечений жителей Филлидельфии. Мы думаем, что это идеальное место для строительства нового центра нашего реформированного Министерства."
 
 FSR_sl_mom3:0 "Шоу начинается"
 FSR_sl_mom3_desc:0 "После завершения строительства центра Министерство морали может возобновить то, чем занималось всегда: поддерживать настроение на высоком уровне."
 
 FSR_sl_mom4:0 "А ну-ка, улыбнись!"
 FSR_sl_mom4_desc:0 "Не грусти, смейся! А если не будешь, мы тебя найдём и заставим."
 
 FSR_sl_mom5:0 "Тётушка Пинки наблюдает за тобой"
 FSR_sl_mom5_desc:0 "Мы знаем, когда ты ложишься спать, и знаем, во сколько встаёшь с постели. Мы знаем, хорошо ты себя вёл или плохо. Будь умницей – не расстраивай Пинки!"
 
 FSR_sl_mom6:0 "Дар смеха"
 FSR_sl_mom6_desc:0 "Хотя жизнь здесь, в Эквестрии, может быть счастливой и радостной, этого нельзя сказать о тех, кто находится за пределами наших границ. Это неприемлемо. Мы запустим кампанию, чтобы подбодрить всех этих несчастных хмурых пони по всей пустоши!"
 
 FSR_sl_mom7:0 "Жизнь за Эквестрию"
 FSR_sl_mom7_desc:0 "Помни: если ты не с нами, ты против нас! Наши земли кишат шпионами, предателями и теми, кто сочувствует зебрам, – все они развращают умы наших граждан. Любой, кого уличат в заговоре против Великого регента, будет отправлен на службу в штрафбат, ибо только в смерти они могут искупить свои грехи."
 
 FSR_sl_mom8:0 "Бесконечная вечеринка"
 FSR_sl_mom8_desc:0 "Таблетки! Химия! Дурь! Пони танцуют, вечеринка гремит, а солдаты забывают об усталости. Министерству морали нужно заняться изучением, производством и распространением химических препаратов, чтобы повысить отдачу в наших войсках."
 
 FSR_sl_mop:0 "Министерство мира"
 FSR_sl_mop_desc:0 "Министерству мира было поручено заботиться об общественном здоровье и благополучии граждан Эквестрии, предоставлять медицинские услуги эквестрийским вооружённым силам, а также продвигать исследования и разработки в этой сфере. Хотя многие в наших рядах насмехаются над идеей восстановления того, что они считают самым бесполезным министерством, мы признаём необходимость их услуг для обеспечения стабильности и здоровья нации."
 
 FSR_sl_mop2:0 "Больничный центр"
 FSR_sl_mop2_desc:0 "В соответствии с миссией Министерства мира мы восстановим и расширим больницу «Филлидельфийские сердца и копыта», чтобы она служила как городским центром первичной медицинской помощи, так и собственной базой министерства."
 
 FSR_sl_mop3:0 "Лечение без дискриминации"
 FSR_sl_mop3_desc:0 "Мы позаботимся о лечении всех раненых, будь то друзья или враги... хотя раненые враги позже будут переданы нашим следователям."
 
 FSR_sl_mop4:0 "Разработать новые лекарства"
 FSR_sl_mop4_desc:0 "Большая часть Эквестрии всё ещё полагается на медикаменты, произведённые во время войны. Это совсем не годится! Если мы хотим иметь здоровых и счастливых пони, мы должны обеспечить их необходимыми лекарствами."
 
 FSR_sl_mop5:0 "Ввести стандарты безопасности на фабриках"
 FSR_sl_mop5_desc:0 "В Филлидельфии Красного Глаза безопасность рабочих никого не волновала. В результате на многих его старых заводах отсутствуют даже самые элементарные средства защиты вроде ограждений. Министерство мира в интересах обеспечения благополучия трудящихся Эквестрии запустит кампанию по радикальному повышению безопасности труда на всех предприятиях, признанных не соответствующими нормам."
 
 FSR_sl_mop6:0 "Корпус мира"
 FSR_sl_mop6_desc:0 "Корпус мира – пожалуй, одно из самых популярных предложений реформированного Министерства мира, получившее широкую поддержку со стороны наших более милитаризованных чиновников. Это будет организация профессиональных медиков, всё внимание которой будет сосредоточено на здоровье и благополучии наших могучих эквестрийских вооружённых сил. В конце концов, мёртвый солдат – это потерянный солдат."
 
 FSR_sl_mop7:0 "Подкожные лечебные импланты"
 FSR_sl_mop7_desc:0 "Одно из последних нововведений Министерства мира – имплант, предназначенный для автоматического впрыска дозы лечебного зелья при необходимости. Мы планируем внедрить этот имплант большинству наших военных, чтобы значительно повысить их шансы на выживание в бою."
 
 FSR_sl_mop8:0 "Вы слышали про антирадин..."
 FSR_sl_mop8_desc:0 "«...но слышали ли вы про антирадин-2? Всё верно, это новое усовершенствование старой классической формулы, которую вы все знаете и любите, способно выводить вдвое большее количество радиации! Именно так, в два раза больше! Кроме того, его запатентованная формула была тщательно разработана, чтобы гарантировать минимальный риск аллергических реакций, что было небольшой проблемой со старым антирадином. Так что попрощайтесь с радиационным отравлением и поздоровайтесь со светлым будущим!» Эта реклама оплачена и спонсирована Министерством мира."
 
 FSR_sl_moi:0 "Министерство стиля"
 FSR_sl_moi_desc:0 "Министерство стиля, пожалуй, наименее запоминающееся из всех министерств. Результаты их трудов повсюду: каждая улица, каждый город и посёлок хранят следы их работы, однако большинство пони этого даже не осознают. В конце концов, Министерство стиля крайне редко рекламировало само себя. Они отвечали за дизайн, производство и распространение маркетинговых материалов и пропаганды по всей Эквестрии."
 
 FSR_sl_moi2:0 "Отстроить Кантерлотский центр"
 FSR_sl_moi2_desc:0 "Старый центр Министерства стиля в Кантерлоте, пожалуй, самый функциональный и наименее повреждённый из всех центров столицы. В связи с этим было решено, что он прекрасно послужит в качестве главной базы реформированного Министерства. Всё, что нам нужно сделать, – это расчистить щебень, кое-что подлатать и убрать все эти скелеты."
 
 FSR_sl_moi3:0 "Пропаганду – в массы"
 FSR_sl_moi3_desc:0 "Возможно, Эквестрия пока не является единой нацией, как раньше, но это нас не остановит. Мы будем работать круглосуточно, чтобы гарантировать: каждому эквестрийцу показывают только самую лучшую пропаганду."
 
 FSR_sl_moi4:0 "Контроль над печатью"
 FSR_sl_moi4_desc:0 "Некоторые менее авторитетные источники стремятся раздувать проблемы, придавая высокое значение мелочам. Вряд ли стоит освещать дела лидеров или взяточничество. Да и военные преступления случаются каждый божий день! Нет никаких причин, по которым хорошие пони Эквестрии должны беспокоиться о подобной чепухе. Таким образом, мы будем строго отслеживать и контролировать всю информацию, предоставляемую общественности, чтобы гарантировать её полезность."
 
 FSR_sl_moi5:0 "Возвысить правителей"
 FSR_sl_moi5_desc:0 "Воистину, Великий регент Строуберри Лемонэд и её пони не способны сделать ничего плохого. И скоро все в Эквестрии поверят в это."
 
 FSR_sl_moi6:0 "Лучшая страна в мире"
 FSR_sl_moi6_desc:0 "Наши граждане должны чувствовать себя счастливыми, живя в такой великой стране. Ни одна другая нация не может быть более благополучной и счастливой, чем наша! Очевидно, что любой, кто утверждал бы обратное, попросту разжигает крамолу."
 
 FSR_sl_moi7:0 "Радикализировать народ"
 FSR_sl_moi7_desc:0 "Враг слаб, потому что он непросвещён и свиреп. Враг силён, ибо его много и он непоколебим. Мы все должны быть готовы приносить жертвы ради общего блага всей Эквестрии."
 
 FSR_sl_moi8:0 "Войны за «освобождение»"
 FSR_sl_moi8_desc:0 "Наши войны оправданы, поскольку они ведутся не ради убийств и завоеваний, а ради освобождения и просвещения. Как можно выступать против столь благородной цели?"
 
 FSR_sl_mas:0 "Министерство тайных наук"
 FSR_sl_mas_desc:0 "Министерство тайных наук занималось магическими исследованиями и разработками. Оно сыграло решающую роль в Эквестрийской войне и в тесном сотрудничестве с другими министерствами помогло создать многие из знаковых инноваций военного времени. Их разработки позволяли Эквестрии идти в ногу с технологическими достижениями Зебрики."
 
 FSR_sl_mas2:0 "Восстановить старые учреждения"
 FSR_sl_mas2_desc:0 "У Министерства тайных наук было множество объектов по всей Эквестрии. Будет начата серия экспедиций для восстановления некоторых из них, и один будет выбран в качестве нового главного центра министерства."
 
 FSR_sl_mas3:0 "Сдуть пыль со страниц"
 FSR_sl_mas3_desc:0 "Теперь, когда Министерство тайных наук снова работает, оно вновь может преследовать свою благородную цель – продвигать эквестрийские знания и науку."
 
 FSR_sl_mas4:0 "Расы пони"
 FSR_sl_mas4_desc:0 "Каждая из трёх рас пони обладает уникальными магическими способностями. Земные пони выносливы, сильны и отлично разбираются в растениях. Пегасы могут летать и управлять как облаками, так и погодой. Единороги способны напрямую направлять и использовать магию для выполнения своих приказов. Эти природные способности необходимо изучить, чтобы мы могли полностью раскрыть свой потенциал."
 
 FSR_sl_mas5:0 "Другие расы"
 FSR_sl_mas5_desc:0 "Хотя мы твёрдо верим, что пони – самые волшебные из всех рас, было бы глупо утверждать, будто магия есть только у нас. Насколько мы можем судить, магия пронизывает всю планету, и многие существа в той или иной степени обладают магическими свойствами. Изучая их, мы, возможно, сможем научиться воспроизводить их природную магию с помощью нашей собственной."
 
 FSR_sl_mas6:0 "Альтернативы магическому топливу"
 FSR_sl_mas6_desc:0 "Кристаллы хороши, но их добыча дорога, а функционал ограничен. В качестве жизнеспособной альтернативы мы разработали новое магическое топливо, которое заряжает устройства значительно эффективнее старых методов."
 
 FSR_sl_mas7:0 "Проект «Аликорн»"
 FSR_sl_mas7_desc:0 "[REDACTED]"
 
 FSR_sl_mas8:0 "«Сады Эквестрии»"
 FSR_sl_mas8_desc:0 "[REDACTED]"
 
 FSR_sl_moa:0 "Министерство предателей"
 FSR_sl_moa_desc:0 "Министерство крутости было самым скрытным из всех. Они отвечали за спецоперации, военную разведку и эквестрийскую авиацию. Однако когда с неба посыпались мегазаклинания, пегасы и их министерство отвернулись от страны. Поэтому, хотя его и можно возродить, за Министерством крутости следует пристально наблюдать на предмет любых признаков предательства."
 
 FSR_sl_moa2:0 "Центр в горах"
 FSR_sl_moa2_desc:0 "Министерству крутости будет предоставлен новый центр, построенный с нуля в Кантерлотских горах. Впрочем, этот объект будет под постоянным прослушиванием, чтобы наши доверенные пони могли следить за каждым шагом этого министерства."
 
 FSR_sl_moa3:0 "Высоко и ещё выше!"
 FSR_sl_moa3_desc:0 "Министерство крутости вновь возглавит ВВС Эквестрии. Мы надеемся вскоре увидеть, как они сравняются по силе даже с Анклавом."
 
 FSR_sl_moa4:0 "Полёт – экспертам"
 FSR_sl_moa4_desc:0 "Кто разбирается в полётах лучше, чем существа, рождённые с крыльями?"
 
 FSR_sl_moa5:0 "Продвинутая аэродинамика"
 FSR_sl_moa5_desc:0 "Пегас – это хорошо, а ядерный истребитель – ещё лучше!"
 
 FSR_sl_moa6:0 "Тактика неболомов"
 FSR_sl_moa6_desc:0 "Ожидается, что нашим ВВС придётся сражаться с драконами и «Тандерхедами», так что им необходимо разработать подходящую тактику против таких колоссальных врагов."
 
 FSR_sl_moa7:0 "Добыча хищника"
 FSR_sl_moa7_desc:0 "Воздушные корабли класса «Хищник» получили прозвище «Убийцы драконов» из-за своего истинного предназначения. Обладая тяжёлым вооружением, способным пробивать толстую чешую дракона, эти корабли были одними из лучших в эквестрийской авиации. Мы считаем, что они послужат и нам."
 
 FSR_sl_moa8:0 "Облачное строительство"
 FSR_sl_moa8_desc:0 "Используя облака в конструкции наших летательных аппаратов, мы смогли значительно снизить стоимость производства и улучшить их аэродинамику."
 
 
 ###Airforce##
 
 FSR_srairforce:0 "ВВС Стальных Рейнджеров"
 FSR_srairforce_desc:0 "Мы вновь взмоем в небеса, и неважно, насколько это опасно."
 
 FSR_first_base:0 "Первые авиабазы"
 FSR_first_base_desc:0 "Раз уж мы хотим создать авиацию, то нам в первую очередь нужно место, откуда летательные аппараты смогут взлетать и куда будут садиться."
 
 FSR_airsuperiority:0 "Соперники Анклава"
 FSR_airsuperiority_desc:0 "Предательское министерство, или, как они себя называют, «Анклав», улетело с большей частью эквестрийской авиации в тот день, когда упали бомбы. Если мы хотим иметь хоть какие-то шансы против их воздушной мощи, нам придётся сосредоточить все усилия на завоевании превосходства в воздухе."
 
 FSR_groundsupport:0 "Поддержка наземных сил"
 FSR_groundsupport_desc:0 "Какая польза от авиации, если она не помогает нашим наземным войскам? В конце концов, именно они захватывают территории и выигрывают войны."
 
 FSR_base_con:0 "Концентрированные удары"
 FSR_base_con_desc:0 "Мы построим огромные авиабазы в Филлидельфии и превратим город в непотопляемый авианосец."
 
 FSR_dir_doctrine:0 "Доктрина превосходства в воздухе"
 FSR_dir_doctrine_desc:0 "Без сомнения, мы будем править небесами!"
 
 FSR_anti_cloud:0 "Гиганты в небе"
 FSR_anti_cloud_desc:0 "Дирижабли могут стать нашим единственным вариантом, если мы хотим построить достаточно крупные аппараты для противостояния «Тандерхедам» Анклава."
 
 FSR_asset_def:0 "Защитить наземные объекты"
 FSR_asset_def_desc:0 "Защитить существующую инфраструктуру и гражданских куда важнее, чем пытаться выиграть каждое сражение."
 
 FSR_range_bases:0 "Расширить базы"
 FSR_range_bases_desc:0 "Нам понадобятся базы по всей пустоши, если мы хотим эффективно поддерживать наши войска."
 
 FSR_sup_doctrine:0 "Доктрина поддержки с воздуха"
 FSR_sup_doctrine_desc:0 "Наша авиация и наша армия должны действовать в унисон ради достижения максимальной эффективности в бою."
 
 ## new airforce
   ### Aviation Tree ###

  FSR_Taking_To_The_Skies:0 "Взмывая в небеса"
  FSR_Taking_To_The_Skies_desc:0 "Пегасы и грифоны считали, что небеса принадлежат исключительно им. Но теперь пришла наша очередь. Благодаря некоторым обломкам, что оставил после себя Анклав, мы начали подготовку к покорению небес нашими рейнджерами."

  FSR_Repairing_Old_Airfields:0 "Восстановить старые аэродромы"
  FSR_Repairing_Old_Airfields_desc:0 "В Брыклине никогда не было полноценного аэродрома, так как до войны он был всего лишь частью гораздо более крупного города Мейнхеттена. Однако нам повезло, так как в старом городе всё же располагался небольшая муниципальная ВПП для гражданских самолётов. Мы можем немного поработать и снова ввести в строй этот аэродром."

  FSR_Secure_The_Skies:0 "Обезопасить небеса"
  FSR_Secure_The_Skies_desc:0 "Полное господство в воздухе является ключом к победе на земле. По крайней мере так было до падения мегазаклинаний. Возможно, это и не самый первоочередной вопрос в наши дни, но такая тактика по-прежнему не потеряла своей актуальности."

  FSR_Focus_On_Fighters:0 "Сосредоточиться на истребителях"
  FSR_Focus_On_Fighters_desc:0 "Из-за нехватки ресурсов мы сильно ограничены в возможностях по производству самолетов. Поэтому мы сосредоточимся на производстве истребителей, а не штурмовиков."

  FSR_Dominate_The_Skies:0 "Доминировать в воздушной войне"
  FSR_Dominate_The_Skies_desc:0 "Наша воздушная мощь растёт и пегасы уже перестают быть неоспоримыми владыками неба. Скоро наши новенькие истребители поднимутся в воздух, доказав, что Стальных Рейнджеров нельзя недооценивать."

  FSR_Flying_Fortresses:0 "Летающие крепости"
  FSR_Flying_Fortresses_desc:0 "Истребители хороши, но если мы действительно хотим получить преимущество в воздушной войне, нам нужны более крупные машины. Хотя их производство может быть весьма дорогостоящим, эти воздушные корабли принесут нам победу."

  FSR_Support_Our_Troops:0 "Поддержка для наших войск"
  FSR_Support_Our_Troops_desc:0 "В любых военных операциях мы прежде всего должны заботиться о своих солдатах. Мы должны убедиться, что у них всегда будет поддержка будь то с земли или с воздуха."

  FSR_Focus_On_CAS:0 "Сосредоточиться на штурмовиках"
  FSR_Focus_On_CAS_desc:0 "Из-за нехватки ресурсов мы сильно ограничены в возможностях по производству самолетов. Поэтому мы сосредоточимся на производстве штурмовиков, а не истребителей."

  FSR_Death_From_Above:0 "Смерть с небес"
  FSR_Death_From_Above_desc:0 "Штурмовики прочны, точны и очень эффективны против любых наземных целей. Наши враги даже не поймут, почему с неба прямо им на головы сыплются бомбы."

  FSR_Strategic_Bombing:0 "Стратегические бомбардировки"
  FSR_Strategic_Bombing_desc:0 "Порой единственный способ одолеть врага – уничтожить всё, что помогает его военной машине. Именно здесь и проявляется гений стратегических бомбардировок. С такой мощью на нашей стороне противник будет непременно разгромлен."

  FSR_birds_of_steel:0 "Стальные птицы"
  FSR_birds_of_steel_desc:0 "Наши военно-воздушные силы прошли долгий путь: мы и представить не могли, что когда-нибудь снова поднимемся в небо. Это просто потрясающее зрелище – наблюдать, как наши самолёты взлетают навстречу боевому заданию. Когда пилоты прикрывают нас с небес, мы станем поистине неудержимы."


