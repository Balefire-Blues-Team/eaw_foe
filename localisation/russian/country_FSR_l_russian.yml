 ###Other###
 
 POLITICS_BLUEBERRY_DESC:0 "Консервативная и благоразумная Блюберри Сейбр - давняя Старейшина Филлидельфийского Контингента. Несмотря на то, что она не чурается прагматизма, Блюберри неизменно была фанатичной защитницей традиций Стальных Рейнджеров. Она утверждает, что старые обычаи достойны уважения и поддержки, а отказ от них был бы чистой глупостью.\n\nК несчастью, пони под командованием Блюберри начали всё сильнее сомневаться в своей Старейшине. Серия поражений от сил Красного Глаза уж точно не подняла имидж Старейшины Сейбр в её собственном окружении, что привело к прямым призывам к её отставке. Лишь время покажет, сможет ли Блюберри доказать, что и дальше способна вести Стальных Рейнджеров Филлидельфии в будущее."
 
 POLITICS_NOVA_DESC:0 "Методы Новы Рейдж считаются весьма сомнительными даже среди самых радикальных членов Стальных Рейнджеров. Нова практична до жестокости, поскольку выступает за использование пуль в качестве универсального решения любых проблем.\n\nМало кто знает, почему она решила попытаться занять пост Старейшины, и ещё меньше пони ожидали, что ей действительно удастся победить. На протяжении большей части кампании против Красного Глаза Рейдж считали не более чем верным псом Старейшины Сейбр. Её уход из клики бывшей Старейшины и формирование собственной партии стали неожиданностью для многих, в том числе и для самой Блюберри Сейбр.\n\nТеперь, когда она укрепила свою власть, старейшина Рейдж стремится направить Стальных Рейнджеров по совершенно иному пути. Слухи о её желании сотрудничать с Красным Глазом распространяются очень быстро, и многие опасаются за будущее Филлидельфийского Контингента."
 
 POLITICS_LEMONADE_DESC:0 "До выборов Старейшины Строуберри Лемонэд была весьма непритязательной кобылой. Хоть она и являлась уважаемым паладином, Строуберри почти не участвовала в политике Контингента. Время от времени она высказывалась против наиболее безжалостных действий Старейшины, но редко делала нечто большее, кроме как выражала своё неодобрение.\n\nСейчас она занимает самый престижный пост Контингента. Хотя многие из старших паладинов считают её оптимизм не более чем наивностью, более молодые члены Контингента в восторге от её видения лучшего будущего. Они скандируют её имя и готовы отдать свои жизни в погоне за лучшим миром."
 
 POLITICS_GRANDREGENT_DESC:0 "Оптимистичной и жизнерадостной Строуберри Лемонэд больше нет. Пройдя через многочисленные трудности в качестве Старейшины, она стала гораздо более зрелой. Блеск в её глазах потускнел, из речей исчез энтузиазм, а некогда энергичные движения стали гораздо более сдержанными. Строуберри Лемонэд значительно отдалилась от обычных пони.\n\nНесмотря на всё это, её видение не изменилось с того момента, когда она впервые встала на этот долгий путь. Внутри Строуберри Лемонэд теперь пылает жаркое пламя, которое подпитывает стремление увидеть воплощение её мечты в реальности. Строуберри решительна как никогда и готова восстановить Эквестрию любой ценой."
 
