 FSR_blueberry_wins_effect_tt:0 "Блюберри Сейбр продолжит возглавлять отделение."
 FSR_strawberry_wins_effect_tt:0 "Строуберри Лемонэд направит отделение по новому вектору."
 FSR_badpony_wins_effect_tt:0 "Высший паладин Нова Рейдж начнёт свой режим террора!"
 FSR_robots_tt:0 "§H2 единицы штабных протектронов будут активированы.§!"
 FSR_silver_robots_tt:0 "§HСилы реагирования «Сильвервинга» будут активированы.§!"
 FSR_exploiting_Maneframe_tt:0 "§BНачать расшифровку файла.§!"
 FSR_stableproject_tt:0 "§HОткрывает решения по прототипам «Стойл-Тек».§!"
 FSR_fortess_guard_tt:0 "§HСформируются 3 новых подразделения стражей.§!"
 FSR_fortresscity_dec_tt:0 "§HОткрывает решения по подготовке Филлидельфии к войне.§!"
