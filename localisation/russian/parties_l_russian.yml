#Survivalists
 democratic_surv:0 "Демократия"
 democratic_surv_desc:0 "\n§YДемократия§!\n\nЭта форма правления ориентирована на предоставление народу права голоса. Граждане этого сообщества избирают должностных лиц, представляющих их интересы в администрации в соответствии с верховенством закона."
 authoritarian_surv:0 "Авторитаризм"
 authoritarian_surv_desc:0 "\n§YАвторитаризм§!\n\nФорма автократии, при которой наблюдается высокая централизация политической власти. Лидеры этого сообщества ограничены лишь своими амбициями и ресурсами, доступными для защиты нации и её идеалов."
 freed_slaves_surv:0 "Освобождённые рабы"
 freed_slaves_surv_desc:0 "\n§YОсвобождённые рабы§!\n\nКрайне свободная форма организации общества, где объединения, состоящие из множества бывших рабов, управляют сами собой."
 glyphmark_surv:0 "Пораженчество Глифмарка"
 glyphmark_surv_desc:0 "\n§YПораженчество Глифмарка§!\n\nПессимистичное общество зебр, которое едва удерживается от распада лишь благодаря остаткам их стойкости и былой силы духа."
 ncr_upc:0 "Пацифизм"
 ncr_upc_desc:0 "\n§YПацифизм§!\n\nПацифизм – весьма редкое явление для Пустоши, поскольку любой идеологии, основанной на вере в ненасилие, крайне трудно выжить в этом жестоком мире."
 
#Visionaries
 unity:0 "Единство аликорнов"
 unity_desc:0 "\n§YЕдинство аликорнов§!\n\nЕдинство – это не правительство и не государство в привычном понимании, а коллективный разум всех аликорнов, порождённых силами ЗВТ. В этом Разуме безоговорочно доминирует одна воля – их прародительница, великая и могущественная Богиня."
 redeye:0 "Красный Глаз"
 redeye_desc:0 "\n§YИмперия Красного Глаза§!\n\nТак называемое «правительство» Красного Глаза в лучшем случае напоминает деспотичные автократии эпохи, предшествовавшей установлению диархии в Эквестрии. Во главе общества стоит сам Красный Глаз. Полагаясь на свою харизму, он удерживает в повиновении наёмников и следит за тем, чтобы рабы, составляющие основу его экономики, оставались достаточно сытыми для работы. Он стремится восстановить Эквестрию, но не в прежнем виде, а как прагматичный механизм, адаптированный к суровым реалиям Пустоши. И ради этой цели он готов пойти на всё."
 rebuilder:0 "Восстановители"
 rebuilder_desc:0 "\n§YВосстановители§!\n\nВосстановители признают, что былая Эквестрия мертва. И хотя от неё остались лишь руины, они стремятся сделать Пустошь хотя бы немного более гостеприимным местом."
 uniter:0 "Объединитель"
 uniter_desc:0 "\n§YОбъединитель§!\n\nЦель этого лидера проста: объединить регион под своим началом любыми методами, которые он сочтёт необходимыми..."
 community:0 "Сообщество"
 community_desc:0 "\n§YСообщество§!\n\nПрогрессивное лидерство этого сплочённого общества стремится развивать свою нацию, используя для этого все доступные средства."
 protector:0 "Защитник"
 protector_desc:0 "\n§YЗащитник§!\n\nЭта фракция видит своим долгом защиту тех, кто не в силах постоять за себя перед лицом многочисленных угроз Пустоши."
 justice:0 "Справедливость"
 justice_desc:0 "\n§YСправедливость§!\n\nЭта воинственная организация сражается за правое дело, карая врагов мирных жителей и верша самосуд над злодеями. Впрочем, их взгляды на природу зла порой бывают... излишне бескомпромиссными."
 tenpony_society:0 "Секретное общество"
 tenpony_society_desc:0 "\n§YСекретное общество§!\n\nОбщество Сумерек – это скрытная олигархия, тайно управляющая башней Тенпони. Почти никому не известны их истинные мотивы и конечные цели."
 ncr_urp:0 "Республиканизм"
 ncr_urp_desc:0 "\n§YРеспубликанизм§!\n\nСторонники этой идеологии стремятся окончательно покончить с пережитками монархии в Эквестрии. Их цель – создать систему, в которой каждое существо сможет влиять на выбор лидеров и будущее своего государства."
 river_autumn_ideology:0 "Нео-эквестрийская автократия"
 river_autumn_ideology_desc:0 "\n§YНео-эквестрийская автократия§!\n\nВ этом государстве граждан старательно убеждают в том, что они обладают политическим весом и влиянием. Однако в действительности вся полнота власти сосредоточена в копытах Великого Маршала Анклава. Ничто в пределах страны не может укрыться от её бдительного взора."

#Destroyers
 raider:0 "Рейдеры"
 raider_desc:0 "\n§YРейдеры§!\n\nВоинственная банда, жаждущая лишь грабить и расхищать руины разрушенной Эквестрии. Хаотичные и враждебные, они – идеальное воплощение жестокости Пустоши."
 slaver:0 "Работорговцы"
 slaver_desc:0 "\n§YРаботорговцы§!\n\nОрганизация безжалостных работорговцев, постоянно совершающая набеги на соседей в поисках живого товара. Государства работорговцев организованы значительно лучше, чем типичные рейдерские шайки."
 purist:0 "Пуристы"
 purist_desc:0 "\n§YПуристы§!\n\nНадменные сторонники идеи превосходства, стремящиеся к господству над миром. Они считают Пустошь слишком хаотичной и неспокойной, полагая, что лишь они достойны обладать властью над ней."
 profiteer:0 "Спекулянты"
 profiteer_desc:0 "\n§YСпекулянты§!\n\nСпекулянты грезят титулом нуворишей Пустоши. Они развязывают войны против соседей с единственной целью – нажиться на чужих страданиях."
 cauterize:0 "Бюрократы Анклава"
 cauterize_desc:0 "\n§YБюрократы Анклава§!\n\nБюрократическое государство, управляемое Советом и выступающее за полное господство пегасов над всей Пустошью. Идеи этих функционеров радикальны, а лидерство страны движимо жаждой реванша."
 bloody_army:0 "Независимая армия"
 bloody_army_desc:0 "\n§YНезависимая армия§!\n\nЭто милитаризованное сообщество проще всего описать как армию, удерживающую территорию, нежели как полноценную и суверенную нацию."
 ncr_pl:0 "Панэквестрианизм"
 ncr_pl_desc:0 "\n§YПанэквестрианизм§!\n\nИдеология, сосредоточенная на возрождении былой славы Эквестрии. Её сторонники верят, что общество можно восстановить лишь через полное объединение земель, что порождает волну национализма и экспансии ради достижения заветной цели."
 ten_ghouls:0 "Анархо-пуристы"
 ten_ghouls_desc:0 "\n§YАнархо-пуристы§!\n\nРадикальная идеология, возникшая после переворота в башне Тенпони. Её суть заключается в построении анархического, но при этом крайне ксенофобного общества. Главным объектом угнетения становятся «гладкошкурые» – жители Пустоши, не затронутые гулификацией. Формально обществом управляет Шериф Роттингтейл, но реальное влияние принадлежит выборной Ассамблее Башни."

#Continualists
 despotism:0 "Деспотизм"
 despotism_desc:0 "\n§YДеспотизм§!\n\nВласть в этом государстве почти полностью принадлежит его правителю. Мотивы таких лидеров нередко различаются, но большинство из них придерживаются умеренной политики, предпочитая сохранять текущий статус-кво."
 foe_oligarchism:0 "Олигархия"
 foe_oligarchism_desc:0 "\n§YОлигархия§!\n\nВласть принадлежит узкой группе лиц, захватившей её различными путями. Представители этой элиты сосредоточены исключительно на защите своего статуса и влияния."
 ringers_cont:0 "Мафия"
 ringers_cont_desc:0 "\n§YМафия§!\n\nЭто государство управляется преступной организацией, обладавшей достаточным могуществом, чтобы установить прямой контроль над частью Пустоши. Синдикат наводит порядок криминальными методами, включая вымогательство, рэкет и закулисные сделки."
 enclave_cont:0 "Бюрократия Анклава"
 enclave_cont_desc:0 "\n§YБюрократия Анклава§!\n\nГромоздкая и неповоротливая форма правления. Члены советов придерживаются идеалов традиционализма и превосходства пегасов, хотя на деле глубоко погрязли в мелочных и корыстных спорах между элитами."
 talon_cont:0 "Наёмники-«Когти»"
 talon_cont_desc:0 "\n§YНаёмники-«Когти»§!\n\nВласть в этом регионе находится в когтях грифонов-наёмников, которые сумели отвоевать для себя часть территории Пустоши."
 admirality:0 "Адмиралтейство"
 admirality_desc:0 "\n§YАдмиралтейство§!\n\nУникальная для Пустошей форма правления. Этим морским государством управляет адмирал и офицерский состав, формирующий правительственный кабинет."
 friendship_city:0 "Городской совет"
 friendship_city_desc:0 "\n§YГородской совет§!\n\nВ правящий совет входят наиболее влиятельные пони, формирующие городскую администрацию. Мэр избирается из числа членов совета, однако его власть напрямую зависит от поддержки остальных советников."
 steel_ranger_cont:0 "Изоляционизм рейнджеров"
 steel_ranger_cont_desc:0 "\n§YИзоляционизм рейнджеров§!\n\nЗакрытое иерархическое общество, сосредоточенное исключительно на управлении своим контингентом. События, происходящие за пределами их юрисдикции, Стальных Рейнджеров совершенно не интересуют."
 new_mareway_cont:0 "Гармоническая монархия"
 new_mareway_cont_desc:0 "\n§YГармоническая монархия§!\n\nВ этом государстве возрождён кастовый феодализм. Социальная структура состоит из трёх сословий: крепостных, выполняющих всю черновую работу; рыцарей, выступающих в роли защитников земель; и дворян, ведущих свой род от довоенной знати и передающих власть по наследству."
 ncr_eap:0 "Реституционализм"
 ncr_eap_desc:0 "\n§YРеституционализм§!\n\nИдеология, основанная на вере в то, что спасти можно каждого. Долг реституционалиста – сделать всё возможное, чтобы помочь «сбившимся с пути» и вернуть их в лоно процветающего общества."
 stable_cont:0 "Администрация Стойла"
 stable_cont_desc:0 "\n§YАдминистрация Стойла§!\n\nХотя детали управления варьируются, при таком режиме вся полнота исполнительной власти сосредоточена в копытах Смотрителя – единственного пони, обладающего решающим словом в Стойле."
 tenpony_society_cont:0 "Секретное общество"
 tenpony_society_cont_desc:0 "\n§YСекретное общество§!\n\nОбщество Сумерек – это скрытная олигархия, тайно управляющая башней Тенпони. Почти никому не известны их истинные цели и мотивы."

