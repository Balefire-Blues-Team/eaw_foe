state_lore_text_container_state_name_short_19:0 "Брыклинский Крест"
state_lore_text_container_state_name_19:0 "§YЦитадель Стальных Рейнджеров§!:"
state_lore_text_container_state_description_19:0 "В довоенные времена в Мейнхеттене был построен весьма приметный §YБрыклинский мост§!, позволивший пони пересекать залив всего за несколько минут. Он стал второй по популярности достопримечательностью среди туристов – сразу после §YСтатуи Дружбы§!. Все суда, заходившие в порт, проходили под этим мостом, позволяя пассажирам насладиться его величественным видом.\n\nВеликолепие моста сохраняло свой блеск до §Rсамого конца§!, пережив даже сам Мейнхеттен и оставаясь символом старого мира – напоминанием о его утраченной красоте. В результате взрыва §7жар-бомб§! часть пролётов обрушилась, но башни, стоящие чуть дальше в воде, устояли и превратились в ценный приз для достаточно смелого и способного претендента. Со всех сторон башни окружены водой, и добраться до них, не замочив копыта, можно только через лабиринт подводных туннелей. Сегодня остатки моста представляют собой почти неприступную крепость. Конечно, кто-то может подумать о том, чтобы использовать крылья и атаковать башню с воздуха, но занявший её мейнхеттенский Контингент Стальных рейнджеров припас на этот случай целый арсенал зениток – они снесут любого нападающего с неба раньше, чем тот успеет крикнуть: «Конские яблоки!»\n\n§YБрыклинский Крест§! вскоре стал сердцем §YМейнхеттенского Контингента§! – их домом, где рейнджеры могли безопасно каталогизировать и изолировать все найденные технологии. Поскольку Крест – это лишь часть Брыклинского моста, свободного пространства здесь крайне мало, поэтому мастерские, столовые, казармы и комнаты отдыха размещаются в любом пригодном уголке – а порой даже навешиваются снаружи или строятся на остатках дорожного полотна. Нередко можно услышать, как крики инструкторов по строевой подготовке и переговоры диспетчеров смешиваются с разговорами и смехом рейнджеров, отдыхающих после дежурств.\n\nТакже рейнджеры установили лебёдку, которая может поднимать любые лодки из воды на вершину Креста, чтобы доставлять таким образом припасы или технику. Однако, подобно айсбергу, видимая над водой часть – это далеко не вся крепость рейнджеров.\n\nУглубившись в лабиринт туннелей под Крестом, можно обнаружить наиболее тщательно охраняемую секцию всей базы – так называемое «§GХранилище§!», где Мейнхеттенский Контингент «охраняет» свои главные технологические сокровища. Здесь собраны силовая броня различных моделей, давно утерянные передовые прототипы, водные талисманы, современное оружие, танки и многое другое. Всё это собрано в одном месте, где эти технологические чудеса можно изучать, хранить и, в конечном счёте, никогда не использовать... разве что в самых крайних случаях. Тем не менее, у этого памятника технологической жадности есть одна впечатляющая особенность: Хранилище было построено уже после того, как рейнджеры обосновались в Кресте.\n\nЕсли бы они только решились использовать эти технологии во благо пустоши, а не прятать их в своих закромах..."

state_lore_text_container_state_name_short_39:0 "Город Дружбы"
state_lore_text_container_state_name_39:0 "§YСтатуя Дружбы§!:"
state_lore_text_container_state_description_39:0 "На другом конце гавани, прямо напротив самого §YМейнхеттена§!, лежит §CГород Дружбы§! – поселение, которое открывает свои двери всем желающим и приглашает присоединиться к его мирному обществу. Верный своему названию, Город Дружбы дружелюбен, гостеприимен, открыт и, скорее всего, не станет первым стрелять вам в лицо. Несомненно, это освежающий опыт для земли, где рейдеры без колебаний готовы выпустить кому-то внутренности или засунуть чью-то голову в духовку. Разумеется, жители Города Дружбы могут позволить себе быть такими приветливыми – попасть в их поселение практически невозможно без их разрешения, и они вполне могут позволить себе выбирать, кого впускать, а кого нет.\n\nГород Дружбы построен на руинах §YСтатуи Дружбы§! – самого приметного памятника довоенного Мейнхеттена. Расположенная всего в нескольких сотнях футов от берегов мегаполиса, статуя приветствовала каждого, кто прибывал в городской порт, обещая, что независимо от происхождения, здесь он найдёт друга. Во время войны статуя не стала целью зебр, и потому пережила §RПоследний день§!, сохранившись как памятник ушедшей эпохи. Она подобна одинокому часовому, что устремил взгляд на §YСелестийское море§! в тщетной надежде когда-нибудь вновь встретить гостей, прибывающих на берега Эквестрии.\n\nВ годы, последовавшие за взрывами зебринских бомб, на острове неоднократно разбивали лагеря самые разные пони. Однако лишь спустя некоторое время начались согласованные усилия по практическому использованию самой статуи. Благодаря совместной работе свободных рабочих, торговцев и инженеров, она постепенно превратилась в хаотичную конструкцию из платформ, будок, сторожевых постов и прочих домишек, свисающих с её корпуса. Несмотря на это, часть внешней оболочки статуи всё ещё остаётся видимой, так что её силуэт легко узнаётся даже с расстояния в несколько миль.\n\nЕсли войти в город по единственному ныне существующему §GМосту Дружбы§! и пройти через его гостеприимные ворота, то гость сразу окажется оглушён шумом дискуссий, взрывами смеха и криками торгующихся пони. На большом базаре, где собираются торговцы со всего региона, действительно есть на что посмотреть. На нижнем уровне расположен §Yбар «Кобылий хвост»§! – именно там, где находилась бы соответствующая часть статуи, если бы её создатели не забыли её изготовить. Вопросы местного управления и законодательства обсуждаются и реализуются советом чиновников – что довольно редкое явление для пустошей, которые явно потворствуют диктаторам.\n\nГород Дружбы был, есть и будет светочем дружбы и гармонии. Пусть даже силы, властвующие в мрачной и кровавой пустоши, с удовольствием сбросили бы великую статую в море, представься им такая возможность."

state_lore_text_container_state_name_short_593:0 "Собор"
state_lore_text_container_state_name_593:0 "§YСвятилище нового мира§!:"
state_lore_text_container_state_description_593:0 "На протяжении веков §5Вечнодикий лес§! сдерживался усилиями окружающих его поселений. Несмотря на то, что погода здесь отказывалась подчиняться приказам пегасов, а обитающие в чащобах существа не желали слушать голос разума, лес оставался всего лишь сноской в путеводителях. Его рекомендовали посмотреть, но только не дальше опушек. Заходить внутрь считалось крайне безрассудным, не говоря уже о попытках поселиться там.\n\nТем не менее, время от времени пони всё же заходили в лес. Например, когда §PТвайлайт Спаркл§! и её друзья пытались остановить §2Найтмер Мун§!, а вскоре после этого там поселилась зебра §gЗекора§!. Но после §Rконца света§! Вечнодикий лес стал куда опаснее: бесконтрольные животные буйствовали, а токсичная радиация проникла даже в самые глухие чащобы. Мантикоры одичали. Василиски, способные обратить пони в камень одним взглядом, расплодились до огромных стай. И это не говоря уже об §2убийственной шутке§!.\n\nИ всё же пони жили там. А некоторые обитают в лесу и по сей день. За тысячи лет до Великой войны долина, расположенная в самом сердце Вечнодикого леса, была домом для §Yпринцесс Селестии и Луны§!. Здесь стоял их замок, откуда они правили пони в эпоху мира и процветания до тех пор, пока Луна не стала §2Найтмер Мун§!. После последовавшей войны замок был заброшен. Элементы Гармонии посетили его лишь однажды в стремлении остановить Найтмер Мун, а затем снова забыли. По крайней мере, до тех пор, пока §YСтойл-Тек§! не начала свой проект.\n\nВ то время Вечнодикий лес считался отличным местом, где могли укрыться тысячи земных пони из близлежащего Понивилля и других поселений. Именно здесь было построено §YСтойло 101§!, предназначенное для заселения творцами и учёными – земными пони, которые во время войны сыграли ключевую роль в разработке и внедрении большинства технологий Эквестрии. Их изобретательность привела к поразительным результатам. Когда упали бомбы и стойло было опечатано, земные пони за последующие десятилетия достигли таких высот в медицине и кибернетике, что их достижения показались бы научной фантастикой любому довоенному пони.\n\nОднако за прогрессом неизбежно следуют амбиции. Стойло, сотворившее чудеса науки, породило и одного из величайших §Oмонстров§! пустоши. §RКрасный Глаз§! сам родом из §YСтойла 101§! и ныне использует его как свою цитадель.\n\nТам, где некогда лежали руины замка сестёр-аликорнов, теперь раскинулся обширный комплекс, в центре которого возвышается оборонительная башня. Внутри последователи §RКрасного Глаза§! трудятся над тем, чтобы однажды преобразить пустошь с помощью прогресса. Но не всё в Соборе подчинено суровой функциональности. В большом зале установлены старинные витражи из Кантерлотского замка, наполняющие пространство потусторонним §Pрозоватым светом§! – идеальной атмосферой для публичных выступлений Красного Глаза. В глубине комплекса продолжается разработка кибернетики, за которую отвечает §YДок Слаутер§!. А о том, что происходит на самых нижних уровнях, помимо Красного Глаза знают лишь его наиболее доверенные помощники.\n\nДа, Красный Глаз желает пустоши лишь добра, но понимает: этого не добиться, не разбив несколько фигуральных яиц по пути."

state_lore_text_container_state_name_short_518:0 "Марипони"
state_lore_text_container_state_name_518:0 "§YДом Богини§!:"
state_lore_text_container_state_description_518:0 "Как и облик самой Эквестрии, местность, где впоследствии был построен §Cкомплекс Марипони§!, значительно изменилась в ходе Великой войны. Изначально она была известна как §YПрекрасная долина§! – место, где жили эквестрийские §gалмазные псы§!. Хотя на первый взгляд долина могла не показаться выдающейся, для алмазных псов она действительно была прекрасна: в её глубинах скрывались пещеры, полные §3драгоценных камней§!, столь притягательных для их вида. Однако эти богатства не остались незамеченными. Эквестрия, втянутая в затяжную войну, обратила внимание на эти богатства, стремясь использовать их либо для финансирования военной машины, либо в качестве компонентов магических матриц.\n\nПоначалу псы сопротивлялись, но затем прибыли военные и насильно §Rизгнали их§!. Вскоре в Старом Олнее выросли гигантские шахты, с помощью которых пони извлекли остатки богатств. Когда Эквестрия, наконец, закончила пить соки из долины, она превратилась лишь в мёртвый, бесплодный §Oшрам§!. Некоторые алмазные псы попытались вернуться, но этот район всё ещё находился под оккупацией военных, и у них были другие планы касательно его будущего.\n\nПоскольку долина теперь представляла собой бесполезную, почти безжизненную пустошь, она оказалась идеальным местом для строительства нового исследовательского центра – вдали от населённых пунктов и посторонних глаз. Учёные Эквестрии и мечтать не могли о более подходящей локации. Министерская кобыла §tТвайлайт Спаркл§! время от времени лично навещала Марипони. Ходили слухи, что она курировала секретный проект, который мог бы положить конец войне с минимальными жертвами, а то и вовсе без них. Однако в самом начале войны в комплекс угодила §7жар-бомба§!. И даже если она не уничтожила объект, то как минимум запечатала его, обрекая выживших на медленную, неотвратимую смерть от голода или обезвоживания.\n\nПосле §Yапокалипсиса§! из Марипони перестали поступать какие-либо вести. Алмазные псы вновь попытались вернуться в свои туннели и дома под долиной, но §7радиация§! и §0порча§! – несомненные последствия экспериментов §tМТН§! – изменили их, породив §gадских гончих§!, что и поныне рыщут по пустошам. А вскоре и путешественники, проходившие мимо долины, утверждали, будто видели в небе силуэты, похожие на бывших принцесс Эквестрии. Эти странные существа назвали разрушенный комплекс своим домом и ловили или беспощадно прогоняли всех, кто осмеливался подойти или проживать слишком близко.\n\nНазывая себя §4Единством§!, они заявляли права на всех своих пленников от имени своей великой и могущественной §CБогини§! – существа огромной силы, обитающего в недрах древней лаборатории. Марипони и Прекрасная Долина теперь превратились в разрушенную, радиоактивную и ядовитую опухоль на теле пустоши. И, как любая иная злокачественная опухоль, она может однажды разрастись во нечто, что будет почти невозможно уничтожить."

state_lore_text_container_state_name_short_563:0 "Новая Эпплуза"
state_lore_text_container_state_name_563:0 "§YФронтир пустоши§!:"
state_lore_text_container_state_description_563:0 "Маленький городок §CНовая Эпплуза§!, широко рекламируемый как самое милое, безопасное и гостеприимное – если, конечно, вы не рейдер – поселение в пустоши, является настоящим глотком свежего воздуха, оазисом дружелюбия на краю враждебной пустыни. §GЗдесь даже находится лучший магазин во всей пустоши!§! В отличие от многих других поселений на бывшем §YТихом Западе§! и за его пределами, Новая Эпплуза встречает всех с распростёртыми объятиями. Если только вы не рейдер.\n\nВы же НЕ рейдер, верно?\n\nЕсли кто-то может уверенно ответить «да» на данный вопрос, то в этом оживленном сообществе ему есть на что посмотреть. Несмотря на скромные даже по меркам пустоши размеры §4эклектичный§! стиль Новой Эпплузы сразу бросается в глаза. Почти во всех отношениях, за исключением железнодорожных вагонов, из которых построены стены и дома, это живописное поселение выглядит как идеальное воссоздание жизни поселенцев на Умеренном Западе сотни лет назад. И это резко контрастирует с жизнью в городе-побратиме – §RСтарой Эпплузе§!. В отличие от Новой Эпплузы, Старую Эпплузу возвели на руинах оригинального поселения, и теперь она представляет собой логово рейдеров и работорговцев, с которыми жителям Новой Эпплузы, увы, приходится время от времени иметь дело.\n\nЭто звучит лицемерно, особенно учитывая сильную ненависть местных жителей к рейдерам, но всё же остаётся необходимым: Новая Эпплуза – транзитный узел между городом работорговцев и империей §YКрасного Глаза§!. Ради собственной безопасности город разрешает работорговцам пользоваться железнодорожными путями, а местные пони применяют свои уникальные познания в обслуживании поездов и подъёмных кранов, чтобы оказывать им вынужденную помощь в их омерзительных делах.\n\nДо тех пор, пока удаётся игнорировать противоречие между действиями и провозглашаемыми ценностями, §CНовая Эпплуза§! готова распахнуть свои ворота для любого пони – за исключением рейдеров – кто ищет убежища. Благодаря обещанной защите от §YКрасного Глаза§! и общему дружелюбному отношению, Новая Эпплуза считается одним из самых безопасных поселений. Если, конечно, не считать угрозой зависть тех, кто недоволен её выдающимся положением."

state_lore_text_container_state_name_short_808:0 "Узловая станция R-7"
state_lore_text_container_state_name_808:0 "§YДом Гауды§!:"
state_lore_text_container_state_description_808:0 "§CУзловая станция R-7§! предельно прагматична во всём. У неё нет звучного имени и никаких примечательных черт, способных привлечь хоть кого-нибудь. По крайней мере, добровольно. Поселение выросло вокруг одной из множества довоенных §Yжелезнодорожных развязок§!, не располагается в сколь-либо интересном месте и не обладает особой стратегической ценностью – разве что как точка, где можно немного передохнуть после долгой поездки. Единственное место поблизости, представляющее хоть какой-то интерес – это §9центр перевоспитания «Разбитое копыто»§!, ныне служащий базой для группы рейдеров, возглавляемой таинственным §Yмистером Топазом§!.\n\nПо мере заселения «Разбитого копыта» рейдерам требовалось всё больше знаний и новобранцев, поэтому им пришлось набирать желающих работать. На удивление, такие находились – даже несмотря на кабальные условия. Чтобы обеспечить безопасность основного объекта, близлежащая §Cузловая станция R-7§! была превращена в перевалочный пункт для рабочих и бродяг, нуждающихся в деньгах, еде или хотя бы относительной безопасности. Разумеется, туристы редко посещают это место. Разве что они мечтают оказаться внутри одной из полуразрушенных камер «Разбитого копыта» или взглянуть прямо в дуло винтовки §Yнамёника-«Когтя»§!.\n\nОднако безопасность – именно та вещь, которую можно купить за крышки. По мере роста Узловая станция начала привлекать всё больше солдат удачи. Одной из таких группировок стали §YКогти Гауды§! под началом §LГаудины Грознопёрой§!. До недавнего времени она относилась к городу справедливо – насколько это вообще возможно в здешних краях. Но между ней и рейдерами «Разбитого копыта» начали нарастать трения. Остаётся только гадать, кто уступит первым. Хотя, скорее всего, это будут те, кто живёт в товарных вагонах и не может похвастаться укреплёнными бетонными стенами, способными отвадить нежеланных гостей."

state_lore_text_container_state_name_short_696:0 "Нейварро и Новый Клаудсдейл"
state_lore_text_container_state_name_696:0 "§CАванпост и город§!:"
state_lore_text_container_state_description_696:0 "На протяжении двух столетий пегасы из §CАнклава§! жили в безопасности над землёй, возводя впечатляющие, и на первый взгляд невозможные, облачные города, объединённые в рамках весьма свободной конфедерации. Десятилетиями они практически не взаимодействовали с облучённой поверхностью. Однако, осознав важность понимания происходящего в пустоши, Анклав решил основать постоянный аванпост в самом сердце §Yджунглей Хэйсид§!, назвав его §CНейварро§!.\n\nЭтот аванпост, названный в честь ближайшего облачного города, остаётся единственной подконтрольной Анклаву территорией на поверхности. Он надёжно защищён магическим полем, которое может быть деактивировано исключительно силами пегасов. Для племён, обитающих в джунглях и болотах Хэйсид, Нейварро стал небесным чудом: одни почитают пегасов как богов, другие – презирают их как незваных захватчиков, силой отнявших их землю.\n\nНа данный момент войска Анклава старательно охраняют свой аванпост, в то время как жители Пустоши с тревогой наблюдают, как реваншистские силы за облаками набирают всё больше влияния. Только время покажет, куда подует ветер, но одно ясно: если Анклав когда-нибудь пробудится, ко сну он больше не вернётся. Неоспоримо одно – в ближайшем будущем Анклав сыграет решающую роль в судьбе пустоши, будь то к добру или к худу."

state_lore_text_container_state_name_short_735:0 "Стойло 2"
state_lore_text_container_state_name_735:0 "§YПолный блэкаут§!:"
state_lore_text_container_state_description_735:0 "§CСтойло 2§! – одно из множества убежищ, которые §YСтойл-Тек§! построила по всей Эквестрии в ожидании §Rконца света§!. Если бы не §PЭппл Блум§! – одна из основательниц компании и главный архитектор – это стойло, скорее всего, не появилось бы ни в §YПонивилле§!, ни где-либо ещё. Поскольку §Rферма её семьи§! испытывала финансовые трудности, Эппл Блум использовала часть своих доходов, чтобы купить землю и использовать её в качестве площадки для стойла. Вскоре убежище было возведено по полностью индивидуальному проекту её личного авторства, после чего Эппл Блум вернула землю в собственность своей сестре и бабушке.\n\nСтойло было завершено и терпеливо ждало своего часа. Многие надеялись, что этот день так и не наступит. Но всё же однажды над городами Эквестрии вспыхнуло §7обжигающее зарево§!. Подруга Эппл Блум, §6Свити Белль§!, была назначена Смотрительницей стойла, а её сестре §8Эпплджек§! было предоставлено гарантированное место в списке потенциальных обитателей. В последний день Эквестрии пони вошли внутрь и за ними затворилась дверь, чтобы никогда больше не открыться.\n\nЗа двести лет, прошедших с момента падения бомб, Стойло 2 оставалось застывшим во времени фрагментом давно утраченного мира. Потомки Эпплджек и Свити Белль всё ещё могут проследить своё происхождение до двух героинь старой Эквестрии. §CСмотрительница§! управляет стойлом с железной решимостью, строго следуя заветам, установленным в тот день, когда массивная дверь впервые захлопнулась за последними вошедшими. Так что обитатели стойла по-прежнему не знают, на что похожа поверхность. А если они не знают, то зачем им вообще выходить? «Потому что ещё никто не входил в Стойло и не покидал его.»"

state_lore_text_container_state_name_short_65:0 "Понивилль"
state_lore_text_container_state_name_65:0 "§YНасмешка над элементами§!:"
state_lore_text_container_state_description_65:0 "Хотя до падения бомб §CПонивилль§! и близко не считался одним из старейших городов Эквестрии, его влияние на довоенную историю оказалось непропорционально большим. Когда §Rсемья Эппл§! впервые открыла местный редкий фрукт, сюда начали стекаться сотни, а затем и тысячи пони. Вскоре тихая деревушка стала небольшим городком, который называли домом все шесть §8министерских кобыл§!, три основательницы §YСтойл-Тек§!, а также Биг Макинтош – солдат, который доблестно пожертвовал собой, чтобы заслонить принцессу Селестию от пули снайпера.\n\nВо время войны жизнь в Понивилле оставалась почти неизменной – за исключением появления оружейной компании §Y«Айроншод»§!, которая построила поблизости завод по снабжению войск Эквестрии оружием. После героической гибели Биг Макинтоша в его честь был установлен мемориал. Однако кроме этого жизнь в поселении шла своим чередом: его жители почти не ощущали на себе последствий войны. Другими достопримечательностями Понивилля являлись §Y«Сахарный уголок»§!, где раньше работала министерская кобыла §PПинки Пай§!; §Yбутик «Карусель»§!, основанный министерской кобылой §0Рарити§!; и §Yбиблиотека «Золотой дуб»§!, которая стала домом для министерской кобылы §tТвайлайт Спаркл§! после того, как она переехала в Понивилль и вместе со своими новыми друзьями пыталась остановить §4Найтмер Мун§!.\n\nПосле падения бомб пони всё чаще задумывались: а не лучше ли было бы, если бы Твайлайт Спаркл тогда уничтожила Найтмер Мун, вместо того чтобы попытаться перевоспитать её? Ведь именно убеждение зебр в том, что принцесса Луна подпала под влияние злых звёзд, отчасти послужило катализатором Великой войны. Однако никто не может сказать с уверенностью, как бы сложилась история в этом случае.\n\nВ настоящее время в Понивилле не осталось мирного населения. Хотя на город не было сброшено ни единой бомбы, несколько из них были сбиты над близлежащим §LБелохвостым лесом§!. Последовавшие за этим радиоактивные осадки загрязнили почву и воду, которые остаются §Rзаражёнными§! и по сей день. В отсутствие жителей здесь обосновались бродячие банды рейдеров, которые иногда работают сообща, но чаще враждуют, сражаясь за контроль над развалинами. Недалеко от окраин Понивилля находится §Rферма «Сладкое яблоко»§!, а под ней скрывается §YСтойло 2§!. Его массивные двери оставались запертыми столетиями, но если обитатели стойла (конечно, если они ещё живы) когда-нибудь выйдут наружу, то столкновение с суровой реальностью постапокалиптической Эквестрии станет для них шоком."

state_lore_text_container_state_name_short_798:0 "Руины Клаудсдейла"
state_lore_text_container_state_name_798:0 "§YГород бурь§!:"
state_lore_text_container_state_description_798:0 "«Прогуляться по улицам Клаудсдейла – всё равно что оказаться на седьмом небе от счастья во плоти.» Когда-то этой фразой описывали первое знакомство с шумным городом §CКлаудсдейлом§! – первым, старейшим и крупнейшим городом пегасов Эквестрии вплоть до его последнего дня. Даже не-пегасы порой посещали этот чудесный мегаполис, используя заклинания, которые временно позволяли им ходить по облакам.\n\nДо и во время Великой войны §CКлаудсдейл§! оставался одним из главных погодных центров Эквестрии, производя облака, радугу, дождь, гололёд, мокрый снег и всё прочее, что могли запросить метеорологические службы крупных городов по всей стране. Кроме того, Клаудсдейл был культурным и политическим центром пегасов, ведь его наследие восходит к самым ранним дням существования §YТрёх племён§!, когда он представлял собой военизированную гражданскую республику. Каждый год здесь проводился конкурс §3лучших юных летунов§! – соревнование, в котором самые быстрые и талантливые молодые пегасы боролись за звание лучшего в своей возрастной группе. Эта традиция уходит корнями во времена древних героев, таких как коммандер Харрикейн. Министерская кобыла и элемент верности §CРэйнбоу Дэш§! была бесспорной чемпионкой до тех пор, пока не покинула Клаудсдейл.\n\nПоскольку пегасы исторически отличались воинским мастерством, они внесли значительный вклад в военные усилия, предоставляя рекрутов на фронт и тактические идеи. После того как §CРэйнбоу Дэш§! основала §OШэдоуболтов§!, пегасы стали символами стойкости эквестрийских пони перед лицом угрозы со стороны зебр, и героями, на которых равняются кобылки и жеребчики по всей стране.\n\nПрестиж Клаудсдейла сохранялся вплоть до §Rпоследнего дня§!. Пегасы оставались лучшими воинами Эквестрии, а сам Клаудсдейл – одним из крупнейших её городов, так что он был выбран в качестве первой цели зебринского §7мегазаклинания§!. Поскольку никакого предупреждения не было, лишь горстка пони успела спастись, а многие важнейшие сооружения были уничтожены взрывом. Остатки города, лишённые магии, поддерживавшей его в воздухе, тут же рухнули на землю. Большая часть облачной инфраструктуры рассеялась, превратившись в туман, а более прочные конструкции разбились вдребезги при ударе о землю. Некоторые из выживших горожан превратились в §Lгулей§!, большинство из которых одичало и так и не покинуло руины своих домов.\n\nСегодня некогда гордый город представляет собой лишь груды обломков, по которым рыщут его неупокоенные прежние обитатели. Остаточная магия, образующаяся при создании радуг, смешивается с §7жар-радиацией§! и время от времени вызывает штормы, способные содрать кожу с любого существа, достаточно глупого, чтобы отважиться забраться в глубины этого проклятого места. И всё же в нём сохраняется какое-то очарование – словно смотришь сквозь разбитую линзу на былые славные деньки Эквестрии."

state_lore_text_container_state_name_short_550:0 "Погодная фабрика"
state_lore_text_container_state_name_550:0 "§YМолния в бутылке§!:"
state_lore_text_container_state_description_550:0 "В самом сердце державы §Y[LIT.GetNameDef]§! покоятся остатки одного из чудес довоенной Эквестрии. Проявив стойкость и упорство, местные жители сумели вновь запустить одну из изначальных погодных фабрик §CКлаудсдейла§!, хотя теперь она служит совсем иной цели. Там, где некогда на облачных конвейерах создавались всевозможные погодные явления – от снежинок до града, от кучевых до перистых облаков – теперь производятся разнообразное вооружение и товары гражданского назначения.\n\nХотя это была первая фабрика, она оказалась далеко не последней: государство §Y[LIT.GetNameDef]§! восстановило и другие заводы Клаудсдейла, а порой его разведчики даже осмеливались проникать в руины самого города в поисках уцелевшего оборудования или чертежей. В результате земли вокруг погодной фабрики превратились в промышленные зоны – пусть и выглядящие весьма бледно по сравнению с довоенной индустрией. Там, где трубы Филлидельфии §Lизвергают чёрный, угольный дым§!, относительно чистые выбросы погодной фабрики и её инфраструктуры безвредно поднимаются в воздух, растворяясь среди облаков.\n\nМногие задаются вопросом: почему радужный генератор всё ещё работает и создаёт многоцветную реку, протекающую сквозь поселение, выросшее вокруг фабрик? На самом деле ответ весьма прост: инженеры государства §Y[LIT.GetNameDef]§! так и не разобрались, как его отключить. Да и не особенно старались, надо признать. Многие считают эту реку весьма красивой. Да и к тому же вполне безвредной. Только не вздумайте совать в неё копыта! Однако река тянется вплоть до §Yруин Клаудсдейла§!, где смешивается с остаточной §7жар-радиацией§! и время от времени порождает опасные штормы, которые, к счастью, затухают прежде, чем достигают более густонаселённых районов."

state_lore_text_container_state_name_short_538:0 "Штаб-квартира Стойл-Тек"
state_lore_text_container_state_name_538:0 "§YМесто рождения всей стойл§!:"
state_lore_text_container_state_description_538:0 "В самом центре §YФиллидельфии§!, в металлическом каньоне её бывшего делового квартала, до сих пор слышны шёпот призраков и гул шагов закованных в сталь копыт. От металлических скелетов зданий отражается эхо утраченных надежд и кошмаров пони, погибших в одно мгновение. По сравнению с окраинами и промышленными зонами Филлидельфии её центр кажется другим миром: здесь полуразрушенные небоскрёбы стали нормой, а тела погибших всё ещё лежат на улицах, застыв в тот самый миг, когда §7жар-пламя§! обрушилось с небес.\n\nДо и во время Великой войны центр Филлидельфии был скорее средоточием корпоративной деятельности, чем промышленным районом. Многие эквестрийские корпорации размещали здесь свои филиалы, а то и штаб-квартиры. Нередко представители §6РобронКо§! беседовали за чашечкой кофе с сотрудниками оружейных компаний, а чиновники встречались с управляющими §YСтойл-Тек§! для обсуждения дальнейшей интеграции технологий в повседневную жизнь пони. Десятки подобных разговоров и встреч происходили в самом сердце города на фоне скрипа тормозов и гудков автомобилей. В центре Филлидельфии было так легко игнорировать потери и смерти Великой войны – казалось, что так будет всегда.\n\nНо потом упали бомбы.\n\nВ одно мгновение город затих. Корпоративные офисы были уничтожены, а жизни тысяч пони оборвались в один миг. Одним из немногих уцелевших зданий стала §Cштаб-квартира Стойл-Тек§!, построенная за пределами центрального района – на побережье §YЗалива Затмения§!. Хотя её конструкция не отличалась чем-то особенным, само здание было возведено на совесть. Также в штаб-квартире располагалось самое первое §GСтойло 0§!. Оно не являлось полноценным стойлом, а скорее служило демонстрацией для инвесторов и правительственных чиновников: такие сооружения могут быть использованы для защиты населения в случае наихудшего сценария.\n\nПосле падения бомб штаб-квартира в основном стояла заброшенной – лишь изредка её занимали банды рейдеров. Лишь после наступления Стальных Рейнджеров под командованием §CБлюберри Сейбр§! налётчики были окончательно выбиты. С тех пор здание стало штаб-квартирой §CФиллидельфийского Контингента§! и превратилось в настоящую крепость. Чтобы попасть внутрь, необходимо либо прорваться через укреплённые стены внутреннего двора, либо атаковать напрямую ворота, изготовленные из корпуса линкора. Любой из этих вариантов поистине самоубийственный, и рейнджеры это прекрасно знают.\n\nВо внутренних стенах своей цитадели §CФиллидельфийский Контингент§! готовит новобранцев и не спускает глаз с Пустоши – особенно с нового соседа, §RКрасного Глаза§!. Но даже оборона рейнджеров, сколь бы совершенной она ни казалась, не является неприступной. При достаточном численном перевесе падёт любая крепость, и тогда начнётся битва за ещё один ржавый осколок Старого Мира."

state_lore_text_container_state_name_short_234:0 "Северный Кантерлот"
state_lore_text_container_state_name_234:0 "§PПризрак былой экстравагантности§!:"
state_lore_text_container_state_description_234:0 "С самых первых дней единоличного правления §Yпринцессы Селестии§! город §CКантерлот§! был сердцем эквестрийского правительства, а также маяком доброты и дружбы для всего мира. Расположенный на краю §Yгорного хребта Кантерхорн§!, он был основан единорогами за сотни лет до изгнания §2принцессы Луны§!, о чём до сих пор свидетельствуют сохранившиеся – пусть и обветшавшие – зачарованные опоры, удерживающие Кантерлот на краю утёса.\n\nПосле изгнания Луны принцесса Селестия сделала Кантерлот своим новым домом и дворцом, заключив соответствующие соглашения с единорогами того времени. Уже через столетие город стал центром страны. Говорят, Селестия часто беседовала со своими подданными лично, и вскоре был учреждён §8Дневной придворный приём§!, чтобы любой, столкнувшийся с трудностями, мог обратиться к своей великодушной правительнице. Со временем мирная атмосфера этих залов распространилась по всей стране, а сияющий мрамор и позолоченные крыши важнейших учреждений стали символом эквестрийской гегемонии.\n\nВ Кантерлоте процветала культура и зарождались новейшие модные течения. А ежегодное §YГала§! становилось главным событием года: каждый влиятельный пони стремился привлечь внимание принцессы или доказать, что достоин признания в высшем обществе. §OПраздник Летнего Солнца§! также зародился в Кантерлоте, но вскоре стал всенародным торжеством: каждый год Селестия отправлялась в новое поселение, чтобы лично поприветствовать своих подданных и пожелать им благополучия.\n\nОднако сегодняшний Кантерлот стал лишь пустой оболочкой себя прежнего. Во время Войны он служил резиденцией шести министерств, которые порой открыто, а порой из теней направляли эквестрийскую жизнь. Многочисленные довоенные корпорации размещали здесь свои штаб-квартиры или филиалы, чтобы их интересы оставались на виду сначала у принцессы Селестии, а после её отречения – у принцессы Луны. Поскольку город находился вдали от фронтов, его считали безопасным прибежищем под защитой могучих аликорнов.\n\nИменно эта самоуверенность привела к одной из величайших трагедий §RПоследнего дня§!. Многие §7жар-бомбы§! были нацелены прямо на Кантерлот, дабы уничтожить принцесс и обезглавить правительство. Селестия и Луна находились в городе и смогли предотвратить прямой удар. Но это лишь помогло зебринскому плану. Один из диверсантов выпустил §PРозовое Облако§! – токсин, способный убить даже аликорнов. Магический щит удержал облако внутри, но всё население города погибло.\n\nТеперь Кантерлот стал кладбищем. Особенно его северная часть: здесь всё ещё стоят старые замки, §tПлощадь министерств§! и множество других памятников ушедшей эпохи. Если бы кто-то смог пройти по этим легендарным улицам, не погибнув от §PРозового облака§!, он бы увидел кафе, рестораны, театры – призрачные напоминания о некогда процветавшей культуре. А в опустевших зданиях на §tПлощади министерств§! скрываются несметные сокровища, ожидающие бесстрашных приключенцев.\n\nНо мало кто осмеливается отправляться в город, ведь §PРозовое облако§! всё ещё настолько густое, что способно убить пони при первом же контакте. Даже сама мысль о путешествии сюда – чистое безрассудство. Но это единственный вариант для тех, кто желает увидеть Старый мир в его зловещем, застывшем величии.\n\nТолько не позвольте своему первому вдоху в Кантерлоте стать §Rпоследним§!."

state_lore_text_container_state_name_short_180:0 "Город Стойла"
state_lore_text_container_state_name_180:0 "§PЛожное чувство безопасности§!:"
state_lore_text_container_state_description_180:0 "К югу от величественных променадов центрального и северного §YКантерлота§! на многие часы пути тянутся простые, ничем не примечательные пригороды. Хотя здесь не жили представители довоенной элиты Эквестрии, эти районы всё равно были обречены на гибель, когда зебры запустили §7жар-бомбы§! и вскоре после этого выпустили §PРозовое облако§!. Южный Кантерлот, как и его северная часть, окутан ядовитым туманом, который не развеять ни одному ветру.\n\nИ всё же жизнь существует даже в клубах воплощённой смерти, порождённых зебринской некромантией. Внутри §PРозового облака§! скрыто одинокое поселение. §CГород Стойла§!, названный так из-за того, что был построен вокруг §YСтойла 1§!, представляет собой островок безопасности среди враждебных руин Кантерлота. Однако лишь немногие отправляются туда по собственной воле – разве что они уже мертвы, ведь город по сути своей является самым настоящим §Lнекрополем§!.\n\nСамо §YСтойло 1§!, как и прочие убежища, было якобы создано для защиты своих обитателей – до тех пор, пока поверхность вновь не станет безопасной. Однако истинное предназначение этого стойла было совсем другим. В качестве наказания за участие в разжигании войны §YСтойло 1§! должно было быть запечатано навечно, навсегда заточив внутри аристократию, корпоратов, министерских кобыл и даже самих принцесс, чтобы они вечно терзались муками вины. Но этот замысел так и не был реализован: принцессы погибли, защищая Кантерлот, а министерские кобылы и вовсе не попали в стойло. Некоторые представители кантерлотской элиты всё же оказались заперты внутри – но и они в итоге смогли выбраться наружу.\n\nДверь стойла удалось открыть лишь из-за сбоя в системе, однако это лишь обрекло обитателей на не менее ужасную участь. По словам тех немногих, кто ещё помнит тот день, причиной стало §PРозовое облако§!, разъевшее дверь снаружи. Всего за несколько часов токсин заполнил всё убежище, и большая часть его обитателей погибла. Лишь немногие успели добраться до герметичных защитных костюмов и выбраться наружу – остальные умерли в мучениях.\n\nА затем некоторые вновь ожили.\n\nНекоторые из обитателей, вместо того чтобы пасть жертвой §PОблака§!, превратились в гулей. За десятилетия, прошедшие с момента вскрытия Стойла 1, они основали снаружи крупное поселение. Внутрь наведываются лишь тогда, когда нужно извлечь что-то ценное. Поскольку среди гулей немало пони из высшего класса довоенной эпохи, они сохраняют настороженность по отношению к чужакам. Но тех, кто всё же осмелится забрести в их владения, они обеспечат боеприпасами и припасами.\n\nИногда мёртвые просто хотят, чтобы их оставили в покое."

state_lore_text_container_state_name_short_596:0 "Старая Эпплуза"
state_lore_text_container_state_name_596:0 "§YСтарый мир в оковах§!:"
state_lore_text_container_state_description_596:0 "Добро пожаловать в одно из самых шикарных, престижных и первоклассных поселений §YТихого запада§!! Наслаждайтесь пребыванием здесь §Rдо конца ваших жизней§!... или пока вас не продадут.\n\nЕсли вам по душе такие речи, тогда обязательно загляните в §CЭпплузу§! – или, как всё чаще её называют, §CСтарую Эпплузу§!. Город был основан ещё до войны поселенцами, которые постепенно продвигались в юго-западную пустыню в поисках новых земель и плодородных угодий. Эпплуза не была чем-то особенным – всего лишь очередной городок, возникший на рубеже тысячелетий.\n\nПочва здесь оказалась на удивление плодородной для засушливого региона, и благодаря капельке магии земных пони вскоре на ней выросли сотни яблонь, давшие городу его имя. Городок был скромным, но уютным, и пони со всех концов Эквестрии приезжали сюда в поисках тишины и простоты. Офис шерифа был скорее формальностью, чем необходимостью – ведь в этом маленьком городке все знали друг друга по имени. Чаще всего его двери были закрыты, а сам шериф либо обходил улицы, болтая с жителями, либо сидел в местном салуне – §YСолёном Блоке§! – обсуждая последние события в Эпплузе и её окрестностях.\n\nИз достопримечательностей можно было увидеть часовую башню, которую, якобы, возвели всего за одну неделю (на самом деле нет), и небольшую сцену под открытым небом под названием §YКачающееся Сияние§!, предназначенную для музыкальных выступлений и танцев – неотъемлемой части жизни на Тихом Западе.\n\nВ своё время здесь произошёл небольшой конфликт с местными бизонами, позже вошедший в учебники истории под названием §RЯблочная война§!, но он был мирно урегулирован благодаря вмешательству §Pминистерских кобыл§!, а также находчивости одного бизона и пары местных жителей. Это соглашение продержалось до конца Великой войны, когда отчаяние бизонов вынудило их отказаться от перемирия. В течение нескольких месяцев земли Эпплузы оставались менее заражёнными, чем районы центральной Эквестрии, и город изо всех сил пытался защититься от набегов мародёров.\n\nСо временем радиация из Лас-Пегасуса и соседнего Роквилля начала медленно проникать на юг, после чего яблоневые сады стали увядать и гибнуть. Ныне от былой гордости города остались лишь несколько больных, искривлённых пней. Некоторое время Эпплуза лежала в запустении, пока банды рейдеров, изгнанные выжившими из Роквилля, не укрепили её, превратив в свой оплот. В обмен на еду и деньги они предоставляли доступ к своим пленникам – вне зависимости от их возраста, пола или видовой принадлежности. Благодаря соглашениям с §CНовой Эпплузой§!, находящейся всего в нескольких часах пути, был налажен транспорт для потенциальных клиентов.\n\nНынешний облик города стал карикатурой на прежнюю жизнь на Тихом Западе. Работорговцы и рейдеры порой открыто устраивают потасовки прямо на улицах, но пока сохраняется видимость порядка, это никого не тревожит. Клетки и загоны для рабов заполонили округу. Старая часовая башня, хоть и порядком обветшала, всё ещё отсчитывает время. Но вдобавок теперь она служит дозорным пунктом, откуда можно зорко следить за городом и вовремя пресекать любые попытки к бегству.\n\nПутешественникам настоятельно рекомендуется избегать Старой Эпплузы любой ценой – если только у них нет достаточно крышек, чтобы купить парочку рабов. Но даже в этом случае никто не даст гарантии, что вы покинете город без ошейника на шее."

state_lore_text_container_state_name_short_642:0 "Арбу"
state_lore_text_container_state_name_642:0 "§YИзысканная кухня и прекрасные друзья§!:"
state_lore_text_container_state_description_642:0 "Небольшой городок §CАрбу§!, уютно устроившийся под боком у §YБрыклинского Креста§! – базы рейнджеров – охотно принимает любого пони, кто считает себя готовым к суровому образу жизни, который здесь приходится вести. Сами жители не скрывают, что снаружи их поселение выглядит довольно непритязательно, но внутри гостей встречают одни из самых добрых и приветливых пони за пределами §YГорода Дружбы§!. Дружбы§!. Многие посетители зачастую испытывают недоверие с первых минут. Ну как такое дружелюбие может сохраниться в окружении снующих вокруг рейдеров и бандитов?\n\nКак и многие поселения Пустоши, §CАрбу§! не существовал до войны. Формально он считался пригородом §YМейнхэттена§!, но не имел чётких границ – невозможно было сказать, где он начинался и где заканчивался. Это было просто очередное сплетение дорог и домов, где пони встречались с соседями, сплетничали и старались не отставать от семейства Эпплов. Судя по немногочисленным рассказам нынешних жителей Арбу, его основатели обнаружили район практически нетронутым и сразу же принялись обустраивать его, стремясь сделать свой новый дом как можно более безопасным.\n\nБлагодаря близости к побережью, городок в основном живёт за счёт торговли мясом §Gрадигаторов§!. Подобный товар привлекает грифонов и других плотоядных существ, а также тех пони, кому приходится уступать зову голода. В самом городе можно найти привычные учреждения для подобных поселений: небольшую мэрию, клинику и пару баров. Ничего особенно необычного, если не считать поразительную дружелюбность местных пони.\n\nПоскольку поселение находится рядом с заражённой водой, жители §CАрбу§! подвергаются воздействию радиации в дозах, значительно превышающих безопасный порог. Время от времени они обращаются к §CСтальным Рейнджерам§!, прося поделиться чистой водой в обмен на мясо или шкуры радигаторов. Хотя рейнджеры неизменно отказывают, это не останавливает новые попытки. По сей день охота на радигатора остаётся обрядом посвящения для самых юных жителей. По словам местных, пара взрослых наблюдает за жеребёнком или кобылкой, желающими стать частью общества, пока те выслеживают свою первую добычу и обезвреживают её с минимальным вооружением. После этого наступает время почётного ритуала – необходимо освежевать и разделать радигатора в одиночку, а затем приготовить из него наваристое рагу или суп, чтобы угостить всю общину.\n\nЕсли всё проходит как надо, пони могут съесть §Rсердце§! своей первой добычи, тем самым подтверждая, что полностью приняли путь охотника и могут считаться равными среди остальных жителей города. За свои усилия они получают метку на крупе – знак, свидетельствующий всему миру и общине, что этот пони храбро, в одиночку, сразился с радигатором и одержал победу.\n\nТакже несколько раз поступали жалобы на то, что еда из §CАрбу§! вызывает недомогание у посетителей, однако местные жители утверждают, что причина этого лишь в том, что пони всю жизнь были травоядными и не привыкли к мясу. Город абсолютно безопасен и дружелюбен – и местные очень любят напоминать об этом всем гостям."

state_lore_text_container_state_name_short_478:0 "Гаттервилль"
state_lore_text_container_state_name_478:0 "§YГород в сточной канаве§!:"
state_lore_text_container_state_description_478:0 "§LПримечание редактора: Ниже приведена расшифровка записи, найденной на теле странствующего торговца, недавно скончавшегося от тяжёлого алкогольного отравления, а также из-за отсутствия конечностей.§!\n\n"Ах, §CГаттервилль§! – первый среди неравных! Добро пожаловать, новичок! Готов к крепкому пойлу и ещё более крепким ударам в лицо? Мы знамениты по всей Пустоши, знаешь ли! И всё это правда! Может, не по самым приятным причинам, но хотя бы нас не забудешь, стоит только свернуть за угол!\n\nХм? Хочешь узнать историю этого места? Ну, сейчас нами правит §YМуншайн Сюрпрайз§! – вполне милая кобыла, если смириться с её болтливостью и проблемами с алкоголем. Честно говоря, она уже так давно мэр, что я и не помню, кто был до неё. Такое чувство, будто она воистину вечная. Если хочешь знать моё мнение – она хороший лидер, хоть и немного чокнутая. Ну и косоглазая: одним глазом смотрит на тебя, а вторым – на бутылку. Ха!\n\nУ нас тут, видит Селестия, хватает и мелких, и крупных проблем! Возьми хотя бы §Rпьянство§! – даже жеребята прикладываются к бутылке! Эй! Не смотри на меня так! Я бы никогда не позволил своим детям пить алкоголь. Ну... без присмотра, конечно. А §Oмантикоры§!? Ох, даже не начинай! Эти уродцы – настоящая напасть! Никто, похоже, не знает, как с ними справиться. Хотя у нас есть одна безумная учёная, которая пытается создать яд специально для них. Её зовут... эм... §GГлоуи Грин§!, точно! Бедняжка приехала, полная великих надежд, а теперь живёт в изоляции и ни с кем не общается. Я иногда приношу ей еду. Надеюсь, она ещё жива. Ведь эта кобыла – последняя настоящая надежда этого бедного, забытого всеми, жалкого городишки...\n\n§PЦентр МинМорали§! на севере тоже стоило бы посмотреть... если бы не эти боты. Там всё кишит какими-то механическими штуковинами, которые злятся вообще без причины! Ну да, мы их иногда ломаем да кричим пьяные ругательства – но всё равно, чего они такие злые? Мир уже не спасти, так почему бы просто не посмеяться с друзьями и не опрокинуть пару галлонов пива? Пусть дух алкоголя парит вечно!\n\n§CГаттервилль§! — это место, где твоя жизнь летит в канаву, а потом и сама канава летит в ещё более глубокую канаву! Стой, а напомни-ка своё имя...""
