state_lore_text_container_state_name_short_532:0 "Филлидельфия"
state_lore_text_container_state_name_532:0 "§YГород рабов§!:"
state_lore_text_container_state_description_532:0 "Мегаполис §YФиллидельфия§!, одно из крупнейших поселений довоенной Эквестрии и один из первых центров §gпромышленной революции§!, стал важнейшим городом во время войны. Хотя Филлидельфия уступала по размеру своему городу-побратиму Мейнхеттену, со временем она превзошла его и по престижу, и по численности населения. Затянувшаяся война и постоянный спрос на рабочих на многочисленных заводах лишь ускорили рост. Мейнхеттен стал §tнаучным§! центром военных усилий, а Филлидельфия – бьющимся сердцем военной промышленности.\n\nГоворили, что в Филлидельфии можно купить или достать что угодно. В городе во времена войны фактически отсутствовали бюрократия и правила, так что если промышленник мог доказать, что его деятельность важна для победы над «полосатыми», ему открывались любые двери. §LСмог и сажа§! стали верными спутниками производства любых товаров: от грозных роботов и энергетического оружия до тостеров или телевизоров.\n\nПоскольку Филлидельфия была важнейшей частью эквестрийской военной машины, в §Rпоследний день§! город стал одной из приоритетных целей зебр. Город Сестринской любви избежал отравления розовым облаком (подобно Кантерлоту), но и §7жар-бомб§! на него не пожалели. Многочисленные удары серьёзно повредили инфраструктуру, полностью уничтожили пегасий район Беллс-Эйр и оставили кратер размером с несколько хуфбольных полей недалеко от центра города.\n\nПосле апокалипсиса среди выживших начались беспорядки, а военные и полиция, ошеломлённые падением старого порядка, не смогли остановить их. Дополнительный ущерб, нанесённый охваченными паникой горожанами, окончательно сравнял Драконий город с землёй. Это привело к появлению нескольких ранее скрытых яиц параспрайтов, переживших зачистку города от паразитов за несколько лет до конца света.\n\nС тех пор город не раз менял хозяев, самыми последними из которых были разномастные рейдеры и филлидельфийский контингент §CСтальных рейнджеров§!. Всех их изгнал из северной части города §RКрасный Глаз§! в ходе своей жестокой завоевательной кампании. Однако на тот момент его ресурсы были ограничены и Красный Глаз жаждал лишь самых ценных трофеев – окраин и промышленного сердца города. Но и за них пришлось пролить немало крови, пусть и не его собственной.\n\nПосле завершения первоначальных завоеваний Красный Глаз восстановил фабрики, используя технические познания Стойла 101. Однако за это многим пришлось заплатить неподъёмную цену. Сдавшиеся армиям Красного Глаза были порабощены, но и оставшимся свободными пони пришлось принять участие в принудительных восстановительных работах. Однако кровь и слёзы были пролиты не напрасно: впервые за два столетия трубы §Oфабрик§! Филлидельфии снова дымят, затягивая небо над городом густым смогом и копотью.\n\nНо помимо неба нездоровится и самой земле: радиация §7жар-бомб§! смешалась с древними токсичными отходами, и теперь любой пони, оказавшийся на открытом воздухе более чем на пару дней, в лучшем случае заболевает, а в худшем – быстро хиреет, становясь непригодным для рабского труда. Город идеально вписывается в порочное видение Красного Глаза: доброта рода пони давным-давно проржавела насквозь, оставив лишь оболочку мечты."

