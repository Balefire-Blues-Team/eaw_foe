FOE_WS_Eclipse_gulf: "Аметистовый бассейн"
FOE_WS_Eclipse_gulf_desc: "До Великой Войны бассейн реки Аметист был уютным уголком на берегу Залива Затмения, где располагались портовые города, через которые шла торговля между Эквусом и Грифонией. Это была одна из последних густонаселённых областей перед тем, как путь уходил дальше на юг – в земли Азурии. В довоенное время здесь также развивались рыболовство и лесозаготовительная отрасль, но, как и повсюду в Эквусе, жар-излучение от мегазаклинаний зебр отравило природу, на которую пони привыкли полагаться. Район не был приоритетной целью атаки – ведь на севере и северо-западе находились более важные цели вроде Кантерлота и Филлидельфии. Это позволило пони закрепиться в умеренно безопасных руинах и создать очаги относительной стабильности.\n\nВ Аметистовом Бассейне утвердились три силы, хотя одна из них вышла на сцену совсем недавно. Жители остальной Пустоши первым делом вспоминают про Новый Мейрвей, неофеодальное общество, которое процветает – ну, весьма относительно – вот уже более ста лет. Его знать считает себя потомками великих аристократических семей Кантерлота. Недавно Новый Мейрвей пережил кризис престолонаследия, потеряв два северных баронства, захваченных Кровавой Армией под предводительством Блад Мейн – претендентки на трон, на котором ныне восседает Стар Гейзер.\n\nК востоку от Нового Мейрвея расположены Гильдии Неокасла – наиболее промышленно научно развитая держава региона. Хотя они замкнуты и преданы "магии индустрии и капитализма", свою территорию Гильдии удерживают железной хваткой и не позволяют сотрудникам покидать её. Несмотря на близость к армиям Красного Глаза, государства Аметистового Бассейна пока остаются вне поля его интересов – и у них есть время подготовиться к противодействию его возможным южным амбициям.\n\nРегион богат ресурсами, так что тот, кто выйдет победителем из практически гарантированного конфликта между Гильдиями, Кровавой Армией и Новым Мейрвеем, сможет пережить грядущую бурю – как это уже сделали пони, живущие здесь поколениями."

