FOE_WS_Azuria: "Азурия"
FOE_WS_Azuria_desc: "Вдоль §CАзурвэя§! некогда простирались сотни миль §Gплодородных сельскохозяйственных угодий§!, где располагались лишь редкие небольшие поселения. И конечно, §Fжар-бомбы отравили эти земли§! своей некромантической магией, как и большую часть мира.\nВ некогда §Cкристально чистых реках§! теперь большую часть времени течёт §Lзеленовато-коричневая слизь§!, а подавляющее большинство этих старых ферм теперь совершенно бесплодны, так как их почву вымыли в реку практически непрекращающиеся дожди.\nНо нё все потеряно безвозвратно! Медленно, но верно на протяжении последних двух веков различные существа §Dначали отвоёвывать эту землю§!. То тут, то там возникали небольшие фермы, кое-как выращивающие пищу, а другие существа находили новые способы использования этой земли:\n\n§OРейдеры Разбитого Копыта§! отхватили себе немалый кусок Азурии, угнетая всех, кто живёт там. У фермеров они отбирают большую часть их урожая ради удовлетворения собственных гедонистических желаний.\n§FКаменные Фермеры§! возродили почти позабытую практику выращивания камней на полях. Они ждут, пока те размножатся и забирают излишки минералов и драгоценных камней.\n§GРад-Рыбаки§! - это весьма выносливая группа, выживающая в основном за счет мутировавшей рыбы и морепродуктов, которую они вылавливают в Азурвэе. Хотя им стоит быть осторожны, так как мутировавшие обитатели водных просторов вполне могут дать им отпор! Даже безобидных устриц стоит опасаться.\n§DГильдии Неокасла§! гордятся тем, что поддерживают традиции промышленной магии и капитализма. Они используют реку, чтобы питать свои фабрики и заводы, на которых трудится множество крепостных.\n§rНовый Мейрвей§!, вероятно, является самым процветающим сообществом на берегах этой реки. Они торгуют со всеми и зарабатывают огромное количество крышек. Хотя, надо признать, что эти богатства приносят пользу лишь знатным классам, а крепостным приходится довольствоваться объедками.\n\n§CАзурвэй§! может многое предложить тем, кто осмелится отправиться на поиск её даров. А народы на берегах этой реки находятся в прекрасном положении, чтобы стать одной из доминирующих сил на пустоши."

FOE_WS_Appleloosa: "Эпплуза"
FOE_WS_Appleloosa_desc: "§OЭпплуза§! некогда прославилась в роли романтичного фронтира старой Эквестрии, в чём ей немало помогла красота яблочных ферм и их урожайность. До войны в Эпплузе жило довольно немного пони, которые пытались построить в этом регионе своё будущее. Несмотря на своё удаление от промышленного центра старой Эквестрии, выращиваемой в Эпплузе пищи было вполне достаточно, чтобы прокормить всех жителей региона. Однако жар-бомбы превратили Эпплузу в выжженную пустошь.\n\nТеперь §RСтарая Эпплуза§! выживает в качестве центра работорговли. Большинство её зданий представляют собой самодельные металлические конструкции, иногда перемежаемые клетками для рабов. В центре города расположен процветающий рынок, где за крышки можно купить даже молодых жеребят. В Старой Эпплузе можно найти почти всё, но только не надежду. \n\nС севера с Новой Эпплузой граничат §CСобирателей Молний§! - разрозненная группа полуавтономных деревень, что объединились под общим знаменем. На территории этой нации живёт примерно одинаковое количество представителей всех трёх рас пони, так что в этом месте проживает крупнейшая община пегасов за пределами Анклава. Это место обладает сомнительной честью быть одним из самых расово разнообразных мест в пустоши. Многие пегасы, которые когда-то жили в Клаудсдейле, сбежали в Анклав или погибли после уничтожения города. Но немалое число прочих пегасов решили продолжить жить в руинах своего бывшего дома. Они-то и стали основой для Собирателей Молний. Благодаря поддержке пегасов эта нация контролирует остатки погодной фабрики Клаудсдейла. Несмотря на внутреннюю борьбу, представители этой нации сохраняют веру в свои идеалы и продолжают выживать в пустоши.\n\nНесмотря на сходство названий, в §YНовой Эпплузе§! не торгуют рабами и не терпят рейдеров. Жители этого города обмениваются товарами со Старой Эпплузой лишь из необходимости выживания и защиты от сил армии Красного Глаза. Город построен на остатках крупного железнодорожного узла, так что большинство зданий являются восстановленными железнодорожными вагонами. В городе даже есть свои "небоскрёбы" из нескольких сложенных друг на друга вагонов. Новую Эпплузу окружает кольцо товарных вагонов, с которых бдительные стражники готовы дать отпор любому врагу. \n\n§rМинистерство Тайных Наук§! пережило конец света в Стойле 49. Они считают себя последними представителями старого эквестрийского правительства и законными владыками пустоши. А пока они плетут заговоры внутри своего Стойла в ожидании возможности вернуться во внешний мир и изменить его согласно своим идеалам."
 # Nations
FOE_WS_EYE: "[Root.GetNameDef] - Главный злодей"
FOE_WS_EYE_desc: "Мало кто знал о стойле, спрятанном глубоко в сердце Вечнодикого леса. И уж точно никто не мог предсказать, что простой разведчик из этого стойла станет величайшим монстром, которого когда-либо видела пустошь.\n\n§RКрасный Глаз§! выстроил свой Собор в самом центре Вечнодикого леса и собрал армию из элитных §Yкогтей-наёмников§!, возглавляемую грифиной §RСтерн§!. Первым делом Красный Глаз покорил холмы Скалистого Хребта и поработил местных пони. Он поглощал местные рейдерские банды и заставлял рабов служить в его армии. Вскоре этот жеребец уже стал силой, с которой приходилось считаться, хотя до доминирования в регионе ему было ещё далеко. Основной силой региона была банда злобных рейдеров из §YКлана Кровопускателей§!, которых возглавлял §RБримстоун Блиц§!. Они "прославились" печально известным разграблением Понивилля.\n\nКрасный Глаз выдвинулся против сил Бримстоун Блица, начав §CКампанию во внутренних землях§!. Хотя рейдеры и доминировали в схватках на пустошах почти 200 лет, они не могли сравниться с хорошо оснащённой и дисциплинированной армией Когтей. Рейдеры проиграли, а сам Бримстоун Блиц был взят в плен и стал рабом. Однако Красный Глаз не был удовлетворён. Его взор обратился на §YФиллидельфию§! и чудеса старого мира в его руинах. Его армия двигалась через Внутренние Земли, оставляя после себя лишь разрушения и трупы.\n\nПосле того, как армия Красного Глаза преодолела Внутренние Земли, их лидер предпочёл не терять ни единого мгновения и напал на город. §YСтальные Рейнджеры Филлидельфии§! знали о надвигающейся приливной волне и решили покинуть северную часть города, разграбив как можно больше ценных технологий. При этом они совершенно не заботились о пони, которые жили в городе. Армия Красного Глаза занимала квартал за кварталом, а рейнджеры, соответственно, отступали. А за ними следовало множество пони, бросивших всё в попытке спастись от надвигающейся бури. Оставшихся совершенно беззащитных пони согнали в самодельные клетки и заставили выстроить знаменитую Стену Филлидельфии, которая заперла всех рабов внутри. Отныне они превратились в пешек Красного Глаза для его великого плана.\n\nКрасный Глаз находился в постоянном поиске возможности увеличить свою силу, и поэтому обратил свой взор на юг, к россыпи поселений и рейдеров §YСаннишора§!, которые из необходимости быстро, но тщетно объединились против него... К сожалению, за годы, прошедшие после безжалостной кампании во Внутренних Землях, рейдеры армии Красного Глаза стали слишком §Rбеспокойными и хаотичными§!, что привело к беспорядку в его армии. Однако и ситуация в Филлидельфии начала стремительно ухудшаться, так как §YХозяева§! во главе с выдающимся работорговцем §RЧейнлинк Шэклзом§! с каждой неделей всё сильнее начинают противостоять Стерн и её Когтям. Равновесие между ними может поддерживать только неукротимая воля Красного Глаза. А хуже того то, рабы начали организовываться в §Y\"Союзы\"§! и активно сопротивляются нашему контролю над ними. Как только Саннишор будет покорён, Красный Глаз должен обратить внимание на внутренние дела и сосредоточиться на создании устойчивого фундамента для его конечной цели - §Cистинного эквестрийского единства§!..."

FOE_WS_FSR: "[Root.GetNameDef] - Стражи Филлидельфии"
FOE_WS_FSR_desc: "Филлидельфия ещё не потеряна!\nВ южной части этого великого города стальные рейнджеры по-прежнему противостоят наступающим силам §RКрасного Глаза§!, сдерживая превосходящих их по численности работорговцев с помощью §Cпродвинутых технологий§! и элитного обучения.\nЭтих пони в блестящей силовой броне называют §CСтальными Рейнджерами§!.\nРейнджеры были созданы §OМинистерством Военных Технологий§! во время опустошительной Великой Войны против зебр в качестве элитного подразделения Эквестрии. И даже спустя два столетия радиационных осадков, анархии и массовых кровопролитий, Стальные Рейнджеры всё ещё твёрдо удерживают свои позиции.\nИх миссия проста: восстановить как можно больше технологий старого мира и охранять самые §Lопасные из них§! от недостойных из внешнего мира, потому что хватает всевозможных существ, которые с радостью воспользуются технологиями ради своих корыстных и ужасных целей.\n\nФиллидельфийский контингент рейнджеров сделал своей основной базой почти не пострадавшую §YШтаб-квартиру Стойл-Тек§!. Эта мегакорпорация достигла зенита славы во время войны, а её самое известное творение - стойла - помогло множеству пони пережить удар мегазаклинаний, что уничтожил Эквестрию.\nВпереди у Филлидельфийского Контингента трудные времена, поскольку Красный Глаз всё сильнее и агрессивнее давит на них, партизаны нападают на патрули рейнджеров даже на их территории города, а борьба за власть среди высших чинов рейнджеров парализует действия всего контингента.\nНо ясно одно:\nРейнджерам придётся действовать быстро, если они хотят получить шанс выступить против §RКрасного Глаза§! и покончить с его угрозой раз и навсегда!"

FOE_WS_SHA: "[Root.GetNameDef] - Жемчужина Азурии"
FOE_WS_SHA_desc: "§OИсправительное Учреждение Разбитое Копыто§! было печально известным довоенным лагерем для политических заключенных, ставшее местом неудачного покушения на жизнь принцессы Селестии во время мирных переговоров с зебрами. Память всех тех несчастных, что были вовлечены в заговор, была отнята §PМинистерством Морали§!, а сами они навсегда были заключены в тюрьму.\nИменно здесь эти заключенные были вынуждены добывать §Cмагические драгоценные камни§!, которые питали эквестрийскую военную машину, а также позволяли §rМинистерству Тайных Наук§! проводить их эксперименты.\nПосле того, как жар-бомбы дождём обрушились на Эквестрию, оставшиеся в живых заключенные стали §OРейдерами Разбитого Копыта§! и использовали старую тюрьму в качестве базы для своих операций. Шли годы и рейдеры стали доминировать на большей части земель от §DАзурвэя§! на севере и до §Gюго-восточных джунглей§!.\n\nБандой командует авторитетный и хитрый §FДэдайс§!, который также является §gзаядлым фанатом Свити Белль§!. Но на самом деле Дэдайс - это пешка дракона по имени §OМистер Топаз§!, который правил бандой с самого начала. Он использовал их для получения драгоценных камней, а также пленников, которых можно было §Rсъедать§!.\nОн правит из тени, так как рейдеры, узнав правду, вполне могут выступить уже против него. Поэтому §FДэдайс§! действовал в качестве марионетки.\nРядом с §OИсправительным Учреждением Разбитое Копыто§! лежит §YУзловая Станция Р-7§! - старый железнодорожный узел, который служит штаб-квартирой для §Lотряда Когтей§!, нанятых для оказания помощи рейдерам. Хотя из-за действий §Lлидера Когтей§! станция недавно стала чем-то вроде лагеря беженцев.\n§LОтряд грифонов§! является одним из множества отрядов наёмников, которых в просторечии по всей эквестрийской пустоши называют §L"Когтями"§!. Этот термин восходит к широко известной §LТалон Инк.§!, которая была частью §RКорпоративного Оккупационного Правительства Нова Грифонии§! после того как Эквестрия подчинила их себе во время Великой Войны. Первоначально название относилось только к грифонам из Нова Грифонии, но потом так стали называть вообще любой отряд наёмников с большим процентом грифонов.\n\nОтрядом из Узловой Станции Р-7 командует §rГаудина Грознопёрая§! - наёмница-ветеран, которая, в отличие от большинства, ещё не забыла о морали. Её принцип - буквально придерживаться заключённого контракта, и она привила эти идеи всем членам её отряда. Большой шрам поперек её левого глаза является прекрасным доказательством её побед. §rГаудина§! проявила себя грозным лидером с не менее грозным §Lотрядом Когтей§!, способным бросить вызов многим угрозам пустошей и поддержать §Oрейдеров Разбитого Копыта§!. Однако в последнее время мораль §rГауды§! заставила её вступить в соперничество лично с §FДэдайсом§! и §Oрейдерами Разбитого Копыта§!.\nНекоторые говорят, что эта напряженность может привести к открытому конфликту. Раздоры с §LКогтями§! в Узловой Станции Р-7 и возвышение §RИмперии Красного Глаза§! начинают беспокоить §OМистера Топаза§!. Он раздумывает, не пора ли выйти из тени и установить прямой контроль над тюрьмой и землями вокруг неё. А §rГаудина§! и её §LКогти§! втайне готовятся свергнуть рейдеров и превратить Разбитое Копыто в нечто большее.\nСудьба этих земель вдоль Лазурной реки, а может быть, и всей пустоши, зависит от того, кто победит в борьбе за власть: §Oбезжалостный дракон-тиран§! или §rидеалистичная грифина-наёмница§!."

FOE_WS_TEN: "Башня Тенпони"
FOE_WS_TEN_desc: "Это место называли гордостью §rМинистерства Тайных Наук§!, потому что это на самом деле была очень дерзкая и амбициозная задача: построить массивный небоскрёб, способный выдержать взрыв жар-бомбы, прямо в центре Мейнхеттена. В нём не будет окон, здание будет достаточно высоким, чтобы дотянуться до облаков, и оно, возможно, сможет послужить в качестве убежища в случае опасности.\n\nВойна с §YИмперией Зебр§! бушевала в полную мощь и после отречения §RПринцессы Селестии§! от престола были сформированы шесть правительственных министерств. Они должны были помочь справиться с растущими требованиями эквестрийской военной машины. §rМинистерство Тайных Наук§!, возглавляемое §RТвайлайт Спаркл§!, занималось изучением, исследованием и развитием современной магии. Министерство построило множество хабов по всей Эквестрии, в том числе и в городе Мейнхеттен.\n\n§CМинистерство Стиля§! наложило запрет на все потенциально опасные и подстрекательские тексты в целях поддержания стабильности. §RРарити§!, глава министерства, отвечающего за пропаганду, решила спасти многие тексты от неизбежной цензуры и последующего уничтожения. Такая попытка сохранить знания прошлого потребовала бы огромного комплекса хранилищ, и ни одно место не было лучше приспособлено для того, чтобы вместить все эти запрещённые тексты, чем §YАтенеум Твайлайт Спаркл§! - её частная библиотека. Центр МТН Мейнхеттен продолжал вносить свой вклад в военные усилия, как и прочие хабы по всей стране. В его стенах собирались самых талантливые маги Мейнхеттена. В нём разместился один из самых важных телекоммуникационных и радиовещательных центров в Эквестрии, который продолжил функционировать даже после коллапса Эквестрии.\n\nКогда Эквестрия и остальной известный мир были сожжены огнём жар-бомб, то и Мейнхеттен не минула эта участь. За одно мгновение от города остались лишь руины.\n\nКроме §YБашни Тенпони§!.\n\nБашня, защищенная своей внешней оболочкой и мощной магией, сумела выстоять под воздействием ударной волны мегазаклинания. §YЛиния Селестии§! монорельса также сумела устоять посреди руин Мейнхеттена. Оставшиеся в живых жители хаба образовали сообщество, которое вскоре станет известно как §RОбщество Сумерек§!. Выжившие сумели восстановить большую часть повреждений, вызванных взрывом жар-бомбы. Наземные уровни были укреплены, отремонтированы и изолированы от внешнего мира. Жители §YБашня Тенпони§! приобрели репутацию скрытных изоляционистов. §RОбщество Сумерек§! наложило копыта на знания, оставшиеся от §RТвайлайт Спаркл§! - министерской кобылы.\n\n§YБашня Тенпони§! - отлично укрепленный небоскрёб посреди руин старого Мейнхеттена - является настоящим маяком старой эквестрийской роскоши и процветания. Огромное количество знаний прошлого тщательно охраняются нынешним руководством башни - §RОбществом Сумерек§!. Пустошь даже и не подозревает о их существовании.\n\nСудьба башни §YТенпони§! лежит в копытах его нынешней администрации. И хотя оно действует очень избирательно, у общества большие амбиции не только в отношении §YТенпони§!, но и, возможно, всего Мейнхеттена."

FOE_WS_MAS: "Министерство Тайных Наук"
FOE_WS_MAS_desc: "Министерство Тайных Наук было создано во время войны между зебрами и Эквестрией (также известной как Великая Война) для контроля над развитием технологий и магии Эквестрии. Наше Министерство сыграло важную роль в приближении золотого века прогресса Эквестрии. Мы приложили копыто к развитию почти всех инноваций в Эквестрии военного времени.\n\nНаши проекты того времени были слишком многочисленны, чтобы их можно было перечислить, а достижения - слишком грандиозны, чтобы их можно было описать. Всё это осуществилось благодаря нашей основательнице - министерской кобыле Твайлайт Спаркл. Она - первый и самый величайший лидер, которого когда-либо знало наше министерство и сама Эквестрия. К сожалению, она почти наверняка погибла при ударе мегазаклинаний.\n\nВойна бушевала, а возможность полного уничтожения беспокоила общественность. Это привело к созданию Стойл-Тек - компании, занимающейся разработкой и строительством убежищ, которые могли бы спасти гражданское население в случае развития наихудшего варианта событий. И, как мы все знаем, этот вариант действительно наступил, а Стойла смогли спасти жизни пони от огня и радиации, которые опалили поверхность мира.\n\nОдним из них было Стойло номер 49. И если это название звучит для вас знакомо, так это потому, что вы находитесь прямо в нём! Многие из самых первых обитателей нашего стойла были чиновниками и служащими министерства, что сделало нас последними известными остатками Министерства Тайных Наук.\n\nПосле конца света Министерство сумело выжить в стойле. Гражданское и министерское население сосуществовали друг с другом, а всё стойло возглавляло коалиционное правительство. Во главе правительства встала первая смотрительница, Калм Флауэр. Эта гражданская чиновница была посредницей между двумя группами и присматривала за всеми нами в те темные дни. Она умерла в своей постели в окружении близких в 1068 году. В её честь в атриуме был возведён памятник. Он стоит там и по сей день.\n\nВторой смотритель, Брайт Айдея, объявил себя первым министром нашего возрожденного Министерства Тайных Наук, объединив гражданский и министерский персонал в одно целое. Весь гражданский персонал получил новые должности, а стойло было полностью реорганизовано в соответствии с нашими потребностями. И вот так, под управлением наших любимых министров, мы дожили до сегодняшнего дня."

FOE_WS_NEV: "[Root.GetNameDef] - Пугало пустоши"
FOE_WS_NEV_desc: "Жар-бомбы, которые давным-давно опустошили Эквестрию, привели к появлению множества обществ и фракций, которых раньше никто и никогда не видел. Эти группы бесконечно ссорятся и конфликтуют друг с другом, не понимая, что все они - обычные варвары с пустошей.\n\nОни не способны сохранить и продолжить наследие Эквестрии.\n\nИ всё же, высоко над головами мутантов и варваров, среди облаков живёт раса пони, сохранившая свою чистоту и не затронутая хаосом мегазаклинаний. Они называют себя Великим Пегасьим Анклавом.\n\nСоздание шести министерств по приказу принцессы Луны привело к появлению самого необычного и секретного из них. Это госучреждение возглавила самая знаменитая пегаска Эквестрии - Рэйнбоу Дэш. Она назвала его Министерством Крутости и объявила, что новое министерство будет заниматься изучением всего "крутого" и "радикального". Многие считали, что это министерство не внесло никакого вклада в ход войны, но на самом деле его истинная цель всегда была скрыта от общественности. Оно служило в качестве опытно-конструкторского и исследовательского агентства, специализирующегося на разработке секретной техники. Министерство Крутости приложило копыто ко многим экспериментальным военным разработкам Эквестрии. Это министерство часто сотрудничало с многими прочими военными организациями, а также обеспечивало свою поддержку в различных сражениях. Министерство Крутости было верными шпионами и разведчиками Эквестрии. И оно стало основой для Анклава.\n\nВо время Великой Войны некоторые пегасы разработали тайный план, известный лишь очень ограниченному числу пони. Пегасы поднимутся за облака и изолируют себя там, если война когда-нибудь станет слишком уж радикальной. Они создадут свою форму правительства, которая будет представлять именно их интересы, а не элиты Кантерлота. Они намеревались использовали башни Проекта Одного Пони, чтобы более эффективно контролировать погоду, а также кормить свой народ, не нуждаясь в услугах земных пони на поверхности. Однако в тот злополучный день, когда жар-бомбы обрушились на Эквестрию, великолепный пегасий город Клаудсдейл был уничтожен. Это вызвало ярость и гнев у пегасов по всей Эквестрии, и план по отделению их расы от всех остальных получил немалую поддержку. Оставшиеся в живых жители Клаудсдейла сбежали и перегруппировались, а вскоре началось строительство Нового Клаудсдейла. В этом новом городе, а также некоторых других, пегасы будут продолжать самостоятельно развивать свою цивилизацию над поверхностью Эквестрии на протяжении двухсот лет. Они создали своё собственное правительство вместе с Сенатом и Советом, как и планировали заранее. Пегасы снова спустились на поверхность и создали аванпост Нейварро.\n\nВ нынешнем Анклаве заседают совсем другие пони, но их идеалы в значительной степени остались прежними. Сила Сената ослабевает, а Совет только укрепляет свою власть над правительством пегасов. Генерал Фезерфолл, хотя и является не слишком вдохновляющим лидером, оставался на посту лидера Анклава в течение последних сорока лет, однако многие уже сомневаются в его легитимности из-за разногласий с другими пегасами. Есть немало молодых лидеров, жаждущих занять его место и повести Анклав в совершенно новом направлении. Идеи реваншизма начинают всё глубже проникать в Совет. А некоторые офицеры начинают разрабатывать планы операции, которая изменит судьбу всей пустоши.\n\nАнклав - это Эквестрия, и пегасы снова приведут её к славе."
 
FOE_WS_MSR: "[Root.GetNameDef] - Рыцари МВТ"
FOE_WS_MSR_desc: "История §YСтальных Рейнджеров§! как военной организации восходит к временам, что предшествовали концу света. Изначальные Стальные Рейнджеры были основаны §AМинистерством Военных Технологий§! под руководством §AЭпплджек§!. Стальные Рейнджеры были лучшими солдатами Эквестрии. И когда мир опалило жар-пламя, Стальные Рейнджеры почти не пострадали, спрятавшись в своих многочисленных бункерах и убежищах.\n\n§YМейнхеттенский Контингент§! может отследить своё происхождение до одной из таких групп выживших: §D21-го корпуса солдат в силовой броне§!. Прошли десятилетия после падения бомб, прежде чем рейнджеры осмелились вернуться в руины Мейнхеттена, создав базу для операций в §OБрыклинском Кресте§!. Местные пони считали рейнджеров героями, однако время шло и Контингент начал меняться и становиться всё более изоляционистским и упадочным. \n\nМейнхеттенский Контингент был первым, кто принял ставшую уже привычной иерархию среди Стальных Рейнджеров, линейную и неизменную. На вершине находится §CСтарейшина§! - лидер всего Контингента. Следующий по старшинству ранг - это §GЗвёздный паладин§!. Эти высокопоставленные офицеры командуют большей частью операций контингента. Среди солдат рейнджеров существуют ещё несколько званий. Паладинами, крестоносцами и рыцарями командуют §PСтаршие паладины§!. Эти пони являются основой сил стальных рейнджеров.\n\nПомимо солдат, в большинстве Контингентов есть немало гражданских §FПисцов§! - пони, которые отвечают за исследования, техническое обслуживание и прочие небоевые задачи. Рядовых писцов возглавляют наиболее образованные и влиятельные §yСтаршие писцы§!. Наконец, старшие писцы отчитываются перед §aГлавный писцом§!, который контролирует работу всех писцов и подчиняется лишь Старейшине Контингента.\n\nТекущий главный писец - §RРивер Отэм§! - типично тихая кобыла, но при этом она влиятельна и умна. Отэм пользуется авторитетом у многих пони, и хотя ей не нравится нынешнее направление развития Контингента, она пока тянет время. Некоторые говорят, что она хочет стать следующей Старейшиной, но её конечные цели известны лишь ей самой.\n\nЗнаменитый и уважаемый §rЗвёздный паладин Стилхувз§! неоднократно отказывался от предложенной ему роли старейшины. Несмотря на нежелание по-настоящему руководить рейнджерами, Стилхувз верит, что Стальные Рейнджеры могут стать лучше и превратиться в нечто большее. Если он будет настаивать на этом, многие рейнджеры присоединятся к нему.\n\nОднако ни Ривер Отэм, ни Стилхувз не смогут реализовать свои цели, не убрав одного пони с пути. §LСтарейшина Коттедж Чиз§!, древний жеребец, которого часто называют клеем, удерживающим всё общество Стальных Рейнджеров, благодаря его преданности идеалам Рейнджеров и желанию неотступно следовать их миссии. Коттедж Чиз долгие годы направлял Мейнхеттенский Контингент по крайне консервативному и изоляционистскому пути. Однако в последние годы он стал более эксцентричным, зацикленным на собственной смертности и на том, что будет с Рейнджерами после его смерти. §RОн не может позволить этому случиться.§!"
 
FOE_WS_UNI: "[Root.GetNameDef] - Агония старого мира"
FOE_WS_UNI_desc: "До конфликта с §Wзебрами§! §GЭквестрия§! была мирной и процветающей страной. На протяжении более чем тысячи лет пони жили в мире с окружающими их народами, если не считать редких ссор, которые обычно разрешались словами, а не насилием. В гражданской жизни происходили значительные изменения, а вот армия §GЭквестрии§! страдала от недостатка финансирования.\nПосле §Yрезни в долине Литтлхорн§! были основаны §OМинистерства Эквестрии§!, чей главной целью было обеспечение быстрого прекращения конфликта с зебрами. Одним из них было §RМинистерство Тайных Наук§!, которое возглавила бывшая протеже Селестии - Твайлайт Спаркл.\n\nВойна всё продолжалась и Твайлайт решила, что обычных пони недостаточно для победы на зебрами. Она получила возможность создания искусственных аликорнов с помощью новейшего §rЗелья Вынужденной Трансформации§!.\n\nПосле того как были проработаны первоначальные теории и получены первые прототипы зелий, Твайлайт отправилась на одну из исследовательских баз §RМТН§! под кодовым названием §YМарипони§!. База была размещена в одной из обширных шахт §CАлмазных Псов§! для дополнительной защиты. С течением времени туннели шахты заполнялись смертельно опасными материалами - побочными продуктами различных попыток улучшить §rЗВТ§!.\n\nПроцесс был медленным и полным трудностей, так как малейшее отклонение от верной дозировки могло страшно искалечить или даже убить подопытного. После многочисленных испытаний сам процесс был доведен до совершенства.\n\nПо иронии судьбы, одна из бывших соперниц Твайлайт, маг по имени §CТрикси Луламун§!, оказалась подходящим кандидатом, чтобы стать первым испытуемым финального варианта §rЗВТ§!. Твайлайт и Трикси, а также двое лучших исследователей МТН - близнецы §GГештальт§! и §GМозаика§! - отправились в Марипони, когда война достигла своего апогея. Эксперимент не был доведён до конца, когда по Марипони пришёлся §Oудар§! мегазаклинания, которое разрушило базу и столкнуло Трикси в чаны с §rЗВТ§!.\n\nОднако это был не конец проекта, как полагала Твайлайт. Несмотря на её опасения, проект полностью удался. В течение нескольких дней §Cсущество§! из бака росло и поглощало пони, которые были всё ещё заперты на объекте. И когда Твайлайт почти умерла от обезвоживания, существо прорвалось в её отдельный бункер.\n\nТвайлайт была спасена, но стала частью сознания §CБогини§!. Богиня, когда-то бывшая единорогом по имени §CТрикси§!, теперь, по её мнению, стала §Gспасительницей§! расы пони. Знания, которые она получила после поглощения лучших учёных §RМТН§!, предоставили ей возможность создавать ещё больше искусственных аликорнов.\n\nМарипони медленно превращаясь в продолжение воли самой §CБогини§!. Любой, кто отваживался войти в эти зловещие руины, бесследно исчезал. Оттуда выходили лишь аликорны различных оттенков.\n\nБогиня наблюдала, как мир медленно восстанавливается после магического конца света. Чем больше она наблюдала, тем сильнее понимала, что конфликты и раздоры старого мира не прекратятся без внешнего §Yбожественного§! вмешательства.\n\nС годами она делала частью своего сознания всё больше пони. Каждый аликорн мог без слов общаться с Богиней, которая превращалась в крайне могущественный магический коллективный разум.\n\nТеперь, два столетия спустя после §Rуничтожения§! старой Эквестрии, §CБогиня§! готова распространить благословение §BЕдинства§! на всех пони, которые готовы принять её."
 
FOE_WS_LIT: "§CСобиратели Молний§! - §YДемократический эксперимент§!"
FOE_WS_LIT_desc: "Многие не питали надежд относительно §CКлаудсдейла§! и земель вокруг него. Столица расы пегасов была одной из первых целей, на которую нацелились мегазаклинания зебр. И этот город пал одним из первых. Мало кому удалось бы найти место, ещё меньше подходящее для жизни, чем эти разрушенные земли, которые Собиратели Молний называют домом. Тем не менее, из пепла старого мира сумела возникнуть одна из самых ярких и самобытных наций пустоши, большая часть оставшегося населения которой держалась за свои старые земли и начала долгий процесс восстановления, который продлился несколько поколений.\n\nСобиратели создали довольно децентрализованную племенную конфедерацию, которая объединяла отдалённые деревни, всевозможные поселения и пегасов §CКлаудсдейла§! в надежде на то, что в один день их старый дом будет восстановлен. А до тех пор они жили в нации, что сделала своей основой принципы §Yнадежды, дружбы и плюрализма.§! Это был грандиозный эксперимент, который должен был дать ответ на простой вопрос: как долго такое общество сможет существовать в своём нынешнем виде на суровых просторах пустошей.\n\nОднако не всё идеально. §RРасовые трения§! продолжают накаляться между различными подвидами пони, пока различные сообщества, составляющие основу свободной нации, §Rвсё сильнее отдаляются друг от друга§!. Позорное поражение в §CГромовой войне§!, во время которой Фезербраш и его "Когти" захватили большую часть северных земель Собирателей Молний, лишь сильнее подорвали веру простых пони в их правительство. В результате на политическую сцену вышли новые радикальные фигуры и их идеи, обещающие скорейшее решение всех проблем нации.\n\nА ещё сильнее ситуацию ухудшает тот факт, что Собиратели Молний со всех сторон окружены врагами. На юге лежит рабовладельческое государство §OСтарая Эпплуза§!, которое с каждым днём становится всё более могущественным и амбициозным. На севере §RФезербраш§! крепко держится за свои владения. А с востока приходят вести о том, что §YРейдеры Разбитого Копыта§! планируют стать чем-то большим. Вдобавок ко всему этому продолжают поступать странные сообщения о §pтаинственном стойле на северо-западе...§!\n\nСудьба Собирателей Молний, окружённых врагами и столкнувшихся с внутренними проблемами, висит на волоске. Выдержит ли их великий эксперимент грядущие испытания? Или он снова потерпит неудачу, как это уже некогда случилось с Эквестрией?"
 
FOE_WS_OAP: "[Root.GetNameDef] - Врата на юго-запад"
FOE_WS_OAP_desc: "§OСолнце безжалостно пылает над Старой Эпплузой, заставляя страдать как рабов, так и хозяев.§!\nА рабов и хозяев там немало, так как Старая Эпплуза решила сделать ставку не только на работорговлю, но и на §RКрасного Глаза§! и его империю.\nДругим народам нужно было медленно выкарабкиваться из нищеты с помощью натурального хозяйства или собирательства, а вот Старая Эпплуза получила фору из-за её благоприятного расположения в качестве §Oврат из Внутренних Земель в пустыню Эпплузы.§! Это позволило им контролировать огромное количество торговых путей, так как многие караваны были вынуждены останавливаться в Старой Эпплузе, дабы пополнить запасы воды. Многочисленные §rэкзотические товары§!, §Fвысококачественное оружие§! и, конечно же, §Rогромные количества рабов§! покупаются и продаются на рынках Старой Эпплузы, что позволяет классу торговцев §Aнакапливать богатства.§!\nИ хотя они были богаты, крышек всегда было мало, и поэтому небольшая группа работорговцев во главе с Стил Шеклзом силой §Cвзяла правительство под контроль§!, чтобы начать сотрудничать с работорговцами Красного Глаза в Филлидельфии.\n\nНо не всё хорошо в этом коммерческом оазисе: масштабный §Rторговый дисбаланс с Филлидельфией§! привёл к опасной девальвации крышек Эпплузы, а влияние со стороны Филлидельфии §Dугрожает экономической независимости нации§!. Кроме того, многие §Gболее образованные граждане уезжают в поисках лучшей доли§!, ведь как Красный Глаз, так и прочие нации пустоши обещают выгодные условия исследователям и квалифицированным рабочим, которые присоединятся к ним.\nСамой насущной проблемой являются внутренние беспорядки, которые уже несколько месяцев сотрясают страну. Старая элита, ведомая Чармин Лаком, желает §Lотделить и отдалить нацию от Филлидельфии§!, и предпринимает всё более агрессивные шаги, чтобы добиться своих требований.\n§FРейнджеры Эпплузы§!, авторитетная группа элитных солдат, которые раньше охраняли пустыни, также перестали поддерживать правительство. Ходят слухи, что они §Rведут подготовку к вооружённому восстанию.§!\nБурные времена поджидают Старую Эпплузу. Старые силы возвращаются в Пустошь, а из пепла апокалипсиса восстают новые претенденты. Но, что бы ни принесло будущее, пони Старой Эпплузы знают, что они будут играть §rрешающую роль§! во всём этом. И их §Cлидеры обязательно попытаются добиться как можно более выгодных условий.§!"
 
FOE_WS_NCG: "[Root.GetNameDef] - Бастион корпоративизма"
FOE_WS_NCG_desc: "Для пони §DНеокасла§! всегда существовали только §YГильдии.§! Два века назад они спасли тысячи от разрушительного §Nжар-пламени§!. Однако помощь не была бесплатной: за это спасённые согласились вечно служить §YГильдиям§!. Сегодня в обмен на тяжелый труд их потомки получают всё, о чём можно мечтать: безопасность, цель и зарплату. Среди рабочих принято говорить, что для счастья нужно лишь это.\n\nЕсли не обращать внимания на пропаганду, то можно обнаружить, что история §DНеокасла§! гораздо туманнее, чем хотелось бы нынешним правителям. Истории прошлого, передающиеся из поколения в поколение, рассказывают о том, что некогда тут правило правительство, обеспечивающее всеобщее представительство. Некоторые также рассказывают о времени, когда было много §YГильдий§!.\n\nСегодня лишь три §YГильдии§! правят этой землёй. §OГильдия строителей§! отвечает за строительство и обслуживание зданий в §DНеокасле§!, а также за развитие инфраструктуры. Это крупнейшая и наиболее влиятельная §YГильдия§! нации. Ходят слухи, что §tТорговый Совет§! был создан ими с целью дальнейшего усиления своего влияния на нацию. Но истину знают лишь лидеры этой гильдии.\n\n§GГильдия шахтёров§! отвечает за добычу природных ресурсов. Ранее они контролировали шахты и лесозаготовки, а теперь следят за работой мусорщиков, водоочистительных сооружений и электростанций. Хотя у них меньше сотрудников, чем у §OГильдии строителей§!, монополия на ресурсы обеспечивает этой гильдии огромное влияние.\n\n§RГильдия механикум§! контролирует специализированные заводы, обеспечивая другие §YГильдии§! инструментами и товарами, что не найти в пустоши. Но у них мало рабочих, так что эта гильдия наименее влиятельна. Но они используют каждую возможность, чтобы увеличить своё влияние.\n\nВ пустоши грядут перемены и §YГильдии§! смотрят на них с жадностью. Там, где другие видят надежду или страдания, эти жадные до прибыли пони видят лишь возможность заработать. Лишь время покажет, смогут ли они удовлетворить свою жажду богатства или станут ещё одной жертвой жестокости пустоши." 
 
FOE_WS_CAL: "[Root.GetNameDef] - Обречённая экспедиция"
FOE_WS_CAL_desc: "Изначально у Кантерлотских Аликорнов была единственная цель: найти Чёрную книгу и спасти Единство, обретя возможность создавать аликорнов мужского пола. Прозревающая Тьму вместе с несколькими крыльями других аликорнов вылетела на север из Марипони и приземлилась в Кантерлоте – разрушенной столице старой Эквестрии. Они пробивались через улицы, на которых в парах Розового Облака бродили кантерлотские гули, и в конце концов создали свою базу операций в Королевском Дворце. Ранее это был дом довоенных аликорнов – Селестии и Луны. Прозревающая Тьму нашла останки принцессы Луны и решила носить её кости в качестве символа наступления нового времени.\n\nНо атмосфера Кантерлота тяжким бременем ложится на каждого. Даже аликорны, самые верные слуги Богини, всё равно страдают в этом адском месте. Только благодаря своей природной силе и способностям Прозревающей Тьму им удаётся оставаться в живых, хотя каждый день означает потерю ещё одного аликорна, а вместе с ней и очередной крупицы здравомыслия. Прозревающая Тьму должна провести их через эти руины, найти Чёрную Книгу и установить полное господство над Кантерлотом. Лишь время покажет, что произойдёт после."
 
FOE_WS_MWY: "[Root.GetNameDef] - Гармоничное королевство"
FOE_WS_MWY_desc: "Знатные семьи §rНового Мейрвея§! гордятся тем, что могут проследить свои корни до самой Эквестрии. Они считают себя единственными законными наследниками старой §Yаристократии§! Эквестрии. Но правда в том, что их предки выжили благодаря чистой удаче. Никто из дворян §YМейрвея§! не мог похвастать высоким статусом; в лучшем случае это были мелкие придворные семьи, а в худшем – умеренно состоятельные простые пони.\n\nНо всё же они положили начало, возможно, самому древнему цивилизованному государству в пустоши. Города §YМейрвей§! и §YМейрдия§! избежали удара §Nжар-бомб§! и хорошо пережили последующую радиоактивную зиму. Когда пыль осела, общество сплотилось вокруг знати, которую сопровождал небольшой отряд §Fкантерлотской стражи§!, что вскоре должна была сыграть важную роль.\n\n§OЛейтенант Нимбус Стронгвинг§!, пегас, проигнорировавший приказ Анклава об отступлении из чувства лояльности к короне, был возведён в ранг капитана королевской стражи. А после была возрождена древняя традиция из времён ещё до Селестии и Луны: в отсутствие чёткой линии престолонаследия следующего монарха страны определять должна именно королевская стража. Всего через пять лет после апокалипсиса сэр Стронгвинг исполнил свой долг и назвал §Dлорда Норт Стара§! первым §Yкоролём Нового Мейрвея§! и Защитником Гармонии.\n\nВ последующие годы короли и королевы династии Стар понемногу расширяли Новый Мейрвей. Первым в состав королевства вошёл соседний город §YМейрдия§! и вскоре стало традицией, что править там должен один из членов королевской семьи. Следующими к королевству были присоединены §YЗерновые Земли§! и §YПолуостров§!. Со временем Новый Мейрвей начал простирался от Болот Хэйсид до Азурвэя и от западных Внутренних Земель до реки Понитомик.\n\nДвести долгих лет Новый Мейрвей стоял незыблемо, являясь маяком стабильности, но всему хорошему приходит конец. В 1220 году, на 16-ом году правления §Lкоролевы Сильвер Стар§!, её сестра §RГолден Стар§!, баронесса Мегамарта, восстала в попытке захватить трон. Разочарованная коррупцией и застоем среди знати, а также расстроенная положением крепостных по всему королевству, кобыла собрала армию и двинулась на королевский дворец, §Rказнив§! Сильвер Стар и провозгласив себя королевой.\n\nПоследовала короткая, но жестокая гражданская война; восстания крепостных и сторонников Голден Стар унесли жизни многих дворян, но уже давно ставший гулем §Oсэр Стронгвинг§! объединил лоялистов, чтобы свергнуть Голден Стар и вернуть порядок в королевство. Контрпереворот Стронгвинга был успешным, он лично сразился с Голден Стар, хотя ей и большей части сил удалось сбежать на север от реки Понитомик, в герцогства Мейрдию и Рощу Белль.\n\n§PСтар Гейзер§!, единственная дочь Сильвер Стар и законная наследница Нового Мейрвея, стала королевой всего в 14 лет. За время регентства Новый Мейрвей затмили восходящие державы вроде империи Красного Глаза и постоянно донимали атаки §RКровавой Армии§!. Королева Стар Гейзер молода и оптимистична, несмотря на пережитые ужасы переворота. У неё есть §Pвидение§! будущего Нового Мейрвея, что поднимает его на новые высоты, но далеко не все согласны с ним..."

FOE_WS_ERA: "[Root.GetNameDef] - Армия с государством"
FOE_WS_ERA_desc: "К концу великой войны город §YМейрдия§! был в значительной степени поглощён более крупным §YМейрвеем§!, фактически став одним из его самых приметных пригородов. Шоссе Санрайз соединило поселения мостом через реку Понитомик, так что будущее двух городов казалось светлым. Пока §Nжар-бомбы§! не сожгли эту мечту.\n\nПочти не затронутые бомбардировками §YМейрдия§! и §YМейрвей§! стали своего рода прибежищем для тех, кто бежал из более пострадавших частей Эквестрии. Вскоре там к власти пришли остатки дворянского сословия, провозгласив §rКоролевство Новый Мейрвей§! под властью §Dдинастии Стар§!. Часть Мейрдии, издавна тесно связанной с Мейрвеем, была отдана во владение младшим членам королевской семьи.\n\nПоследней в длинном списке владельцев герцогства Мейрдия была §FГолден Стар§!, некогда баронесса Мегамарта, а ныне ужасная военачальница, известная как §RБлад Мейн§!. Кобыла была разочарована коррупцией и бестолковостью прочих дворян, разгневана бедственным положением крестьян по всему королевству и завидовала своей сестре: §Lкоролеве Сильвер Стар§!.\n\nБлад Мейн тайно собрала армию, отправилась в королевский дворец и §Rказнила§! Сильвер Стар, провозгласив себя следующей королевой. К несчастью для Блад Мейн, её правление оказалось очень недолгим. Гуль-капитан стражи, §Oсир Стронгвинг§!, сразился с узурпаторшей и наградил её шрамом через всё лицо. Блад Мейн и её уцелевшая армия были вынуждены бежать из Мейрвея. Они переправились в §YМейрдию§!, подорвав за собой довоенный мост.\n\nВот уже 15 лет Блад Мейн зализывает раны, формируя §RКровавую Армию§!. Её сила воли объединила рейдеров, беглых крепостных, бывших рыцарей и всех, кто просто жаждет драки. Большую часть этих 15 лет Кровавая Армия довольствовалась набегами на своих соседей и грабежами.\n\nНо всё изменилось в момент возвышения §RКрасного Глаза§!, чьи действия полностью изменили баланс сил в Сердце Эквестрии к северу от территорий Армии. В Красном Глазе Блад Мейн увидела силу, которая наконец-то поможет ей выбраться из тупика и завоевать Новый Мейрвей. Однако ей пришлось поклясться в верности Красному Глазу и хотя бы на словах пообещать полностью подчиниться ему после завоевания Нового Мейрвея.\n\n§RНо Блад Мейн вовсе не обязательно следовать этому договору...§!"

FOE_WS_ABT: "[Root.GetNameDef] – Врата севера"
FOE_WS_ABT_desc: "Ах, Портсхуф! Это поселение, о котором мало кто говорит и куда почти никто ездит, но местному сообществу это вполне по душе. Южная граница кишит враждебными Стальными Рейнджерами и дикими рейдерами, а на западе Эмпайр с вожделением смотрит на их земли. Портсхуф – город-одиночка. За исключением связей с довольно милыми пони из Арбу, основная торговля Портсхуфа идёт через его тёзку – портовый город Портсхуф.\n\nУ каждого жителя Портсхуфа есть ценное право выбирать собственных лидеров. Множество иностранных общин, оживлённый порт и демократическое голосование сделали Портсхуф одним из немногих по-настоящему терпимых уголков в Пустоши. Их нынешний лидер – Фэйрвезер, харизматичный зебра, известный своей невозмутимостью в трудные времена и ведущий себя словно маяк в бурных водах Мейнхеттена.\n\nНо на его место претендуют и другие. Лонгфишер – пони, который день и ночь кричит на улицах о необходимости расширения территорий Портсхуфа и устранения враждебных соседей. Бейлфайр Ай – новичок из Филлидельфии, что восхваляет богатства, принесённые рабством, и мечтает превратить Портсхуф в столицу северной работорговли. И наконец, ходят слухи о старом грифоне по имени Джеральд Груффбик, который хочет покончить с нестабильной демократией Портсхуфа и заменить её своим деспотичным правлением. Многие хотят заполучить Портсхуф, но остаётся главный вопрос – приведёт ли кто-нибудь его к величию?"

FOE_WS_ARB: "[Root.GetNameDef] – Джунгли в пригороде"
FOE_WS_ARB_desc: "Привет, незнакомец! Добро пожаловать в Арбу – самый дружелюбный городок по эту сторону Мейнхеттена! Устал после непростой прогулки по пыльным дорогам? У нас полно приветливых пони, готовых помочь. Проголодался после долгого пути? Знаменитые кебабы из радигаторов Арбу известны по всей пустоши каждому голодному путнику! Что такое? Однажды твой раненый друг посещал нас, но потом исчез? Нам очень жаль, но пустошь безжалостна и неумолима. Вот, возьми кебаб – мясо у нас отменное!\n\nЗдесь, в Арбу, мы любим безопасность и свободу. Мы время от времени голосуем, чтобы мэр Свитуотер снова победила! Конечно, наш мэр не выглядит так внушительно, как стальные рейнджеры с запада, и, может, у неё нет той модной одежды, как у пони из Башни Тенпони к югу, но она – самая дружелюбная пони, которую ты когда-либо встретишь! А вон там, на улице, ты увидишь других кандидатов – например, неугомонного Фист Фри, одну из самых добрых душ Мейнхеттена. Фист Фри считает, что принципы Арбу и наша доброта должны распространиться по всему Мейнхеттену. Он даже хочет сделать мясо бесплатным для всех. Конечно, всё это звучит безумно – мы не в состоянии вести подобные войны – но полезно иногда мечтать о большем.\n\nА те двое? Это Трилл Хант – раньше он был рейдером, а теперь ушёл на покой и помогает нашему ополчению становиться лучше. Да, у него есть некоторые странности, которые пугают пони, но мы тут никого не осуждаем! А тот старик? Это дедушка Рэттл. Прости его – у него деменция. Если проведёшь с ним слишком много времени, он начнёт рассказывать тебе сказки про пониедов. Лично я думаю, он в молодости перечитал странных приключенческих книжек! В любом случае, добро пожаловать в Арбу, незнакомец. Надеемся, тебе у нас понравится – ведь большинство гостей соглашаются остаться тут навсегда!"

FOE_WS_FRI: "[Root.GetNameDef] – Оплот метрополизма"
FOE_WS_FRI_desc: "Город Дружбы – идеальный приют для усталых странников, изгнанников и потерявших свой дом. Построенный вокруг статуи Пони Дружбы, что стоит на восточном побережье Мейнхеттена, Город Дружбы славится крепкими стенами, неплохо обученным ополчением и, в отличие от соседнего Гаттервилля, здесь можно относительно сносно жить. Городом управляет Совет Дружбы и его глава – Блэк Сис, занявшая эту должность благодаря обаянию, миловидности и, конечно же, очаровательному носику, который так и хочется бупнуть.\n\nБлагодаря её лидерству Город Дружбы организован лучше, чем большинство фракций пустоши, и даже может похвастаться невиданными в других поселениях правами вроде свободы слова. В городе живут несколько пегасов-дашитов, так что это весьма терпимый уголок пустоши.\n\nБлэк Сис стремится лишь к мирному развитию, поскольку никаких серьёзных угроз для города нет. Ну не считать же Гаттервилль с его ужасными условиями жизни соперником? Но у Блэк Сис есть соперники, хотя все они подозрительно похожи на неё. Например, Эндлесс Абисс утверждает, что город может разбогатеть, стоит лишь немного расшириться. Мейнхеттен стоит очистить от тех, кто жаждет бупнуть Город Дружбы. Есть ещё Куин Сис – возможно, это просто Блэк Сис в короне и мантии – и она верит, что Город Дружбы должен стать невиданной прежде империей, дабы принести Мейнхеттену прогресс, процветание и мир... силой и бупами. И наконец, есть последняя партия, которую тоже почему-то возглавляет Блэк Сис, и они просто хотят защищать Город Дружбы от внешних угроз.\n\nНу, даже если каждый лидер – это просто Блэк Сис в новом наряде, перед Городом Дружбы стоит трудный выбор: искать процветание через мир или силу, защищаться любой ценой... или же полностью захватить Мейнхеттен."

FOE_WS_GUT: "[Root.GetNameDef] – Худший город в сердце пустоши"
FOE_WS_GUT_desc: "Какая же кривая дорога привела тебя сюда, незнакомец? Хочешь узнать, что такое Гаттервилль? Хочешь понять, что тут делать? Я скажу всего одно слово. Уходи. Уходи как можно скорее, пока не застрял здесь, как мы все. Всё ещё здесь? Правда хочешь остаться? Ладно, но не говори потом, что я тебя не предупреждал. Гаттервилль – худшее место во всей пустоши, это бесспорно. Что бы мы ни делали – мир тут же бьёт нас по морде. Хочешь пойти на работу? Нападение мантикоры. Хочешь разбогатеть на продаже хламе? Агрессивные спрайтботы тут как тут. Хочешь стать лидером этой дыры и всё исправить? Да, другие пробовали – но никто не справился.\n\nСейчас у власти Муншайн Сюрпрайз – и, похоже, навсегда. Раньше она была харизматичной, убедила всё ополчение поддержать её, и так захватила власть. Но потом её накрыло – и она начала пить. Теперь половину слов она не может выговорить, а по утрам едва встаёт. Все пони здесь её ненавидят, но выбора у нас нет. Вакс Виски пытался её заменить, но если Муншайн – алкоголичка, которая ничего не делает, то Вакс – алкоголик, который делает слишком много. Как-то он залил оливковое масло в машину на заводе взрывчатки, устроив пожар, думая что масло помогает механизмам. Вакс уверен, что его идеи нас спасут, но всё, что они принесут – это новый кошмар.\n\nФайн Вайн? Да, рейдер. Настолько никудышный, что мы иногда просто даём ему крышки из жалости. Остальные рейдеры его не уважают, считают неудачником – и, знаешь, они полностью правы. Если Файн станет лидером, мы все превратимся в рейдеров с боссом, который не знает, с какой стороны держать дробовик. А "Движение отрезвления"? Они, может, и шумят на улицах, но все мы знаем: даже если они хотят запретить алкоголь, то сами напиваются до безумия каждую ночь. Даже если они каким-то чудом победят – ни один уважающий себя солдат не пойдёт воевать за них. Видишь, да? Нет пони, который вытащит нас из этой дыры. Ни герой, ни диктатор, ни пьяница. Всё ещё хочешь остаться?\n\nНо знаешь, скажу честно. Иногда, когда я ложусь спать, слышу рёв мантикоры и потрескивание роботов – то думаю, что, может, мы самые сильные в пустоши. Кто ещё мог бы жить в таком Тартаре столько лет? Давным-давно я слышал: тяжёлые времена рождают сильных пони, а сильные пони – лёгкие времена. И даже если каждое утро мы просыпаемся с мыслью, что сегодня умрём... я всё равно мечтаю. Мечтаю о Мейнхеттене, где мы – во главе. Мечтаю о легионах стали, выходящих из врат Гаттервилля. Мечтаю о будущем, где мы заставим других засранцев из пустоши страдать так, как страдаем мы. Каждый день."

FOE_WS_MAR: "[Root.GetNameDef] – Мыши в Большом яблоке"
FOE_WS_MAR_desc: "Когда-то давно, в волшебной стране Эквестрии, у нас была надежда. С тех пор как Найтмер Мун начала войну против Селестии, нас, фестралов, начали притеснять. Когда Селестия восстановила Эквестрию, она позабыла о нас, а когда другие племена взывали к дружбе и гармонии – они проигнорировали нас. Но затем пришла Великая война против зебр. Увидев ужасы войны, Селестия, великая угнетательница, отреклась от трона, и к радости каждого фестрала в Эквестрии, наша любимая Луна заняла его.\n\nНо даже самые благородные сердца отвлекает война, и Луна, кобыла из другого времени, окружённая врагами со всех сторон, так и не успела обратиться к нам – своим самым верным последователям. И всё же каждый благородный фестрал выступил под знамёнами Эквестрии. Мы маршировали плечом к плечу в армии, трудились день и ночь на фабриках, жили достойной жизнью, надеясь угодить ей. Но день за днём фестралов становилось всё меньше – нас выгоняли с фабрик, боясь "пони-вампиров", нас похищали Министерства для своих ужасных проектов, о которых боялись говорить вслух, мы умирали в родных джунглях, сражаясь с полосатой угрозой. Даже когда весь мир был против нас, мы всё ещё надеялись.\n\nА потом, в одно мгновение, всё исчезло. Луна, наша госпожа, наша принцесса, погибла в Розовом облаке, наши дома выжгло жар-пламя, а пони, убитые горем, отвернулись от нас. От нас! Самых верных! И сколько бы мы ни трудились, ни сражались, ни старались – другие племена так и не приняли нас. Когда пустошь поглотила их сердца, рейдеры начали похищать невинных фестралов и мучить их самыми ужасными способами, а каждое поселение отказывало нам в приюте. Башня Тенпони, Стальные Рейнджеры, "толерантный" Портсхуф – все отвергли нас лишь за цвет шерсти и длину клыков. Мы, благородные фестралы, наконец поняли: нас никогда не примут. Нет, наша единственная надежда – захватить наш дом, Мейрлем, куда насильно были согнаны фестралы города во время войны.\n\nНо даже теперь, когда у нас есть дом, другие племена всё ещё стремятся причинить нам зло. После внезапного нападения рейдеров Мейнхеттена наши фабрики теперь вынуждены снабжать их, а мы живём в страхе перед полной оккупацией. И всё же наш благородный лидер, вождь Мун Гард, обещает нам, что мы вот-вот будем в безопасности. Но ходят слухи о другой судьбе, о новой главе в нашей истории.\n\nГоворят, однажды мудрая паладин объединит всех фестралов под своим командованием. Многие считают, что мисс Мелоди – кобыла, благословлённая самой Луной, может оказаться ею. Мудрая паладин провозглашает, что судьба фестралов лежит не в изоляции, а в защите других пони от ночных чудовищ. Говорят, благородный и хитроумный рыцарь однажды приведёт фестралов к величию. Капитан Брайт Найт, непревзойдённый командир, смотрит на мир сквозь призму памяти о былой несправедливости и заявляет: "Никогда больше". И, наконец, часто забываемый, добрый дипломат хочет повести фестралов в будущее, но не в одиночку, а вместе с другими. Френдли Фэнгс хочет работать с теми, кто уже однажды отверг нас, ради всеобщей безопасности.\n\nМы, фестралы, знаем, как началась наша история. Но с каждым годом, с каждой перевёрнутой страницей, мы задаёмся вопросом: что ждёт нас в конце этой истории?"

FOE_WS_MRA: "[Root.GetNameDef] – Гроза города"
FOE_WS_MRA_desc: "Когда Великая война закончилась и жар-пламя опалило мир, выжили лишь сильные, жестокие, свирепые – и именно из этих дикарей старого мира возникли Мейнхеттенские Рейдеры. Когда умерло первое поколение выживших, всем стало ясно: Мейнхеттен принадлежит рейдерам и лишь им одним. Даже богачи из Тенпони вынуждены были это признать. Но потом пришли пони в стальных доспехах, помешанные на скорости рейдеры с запада, случились восстания фестралов и слабаков – и рейдеры погрязли в междоусобице.\n\nВсё это закончилось, когда к власти пришёл новый босс – Костолом, сын прежнего лидера рейдеров. Там, где его отец изо всех пытался объединить рейдеров, Костолом справился куда легче: просто проламывая черепа тем, кто осмеливался ему перечить. Он быстро доказал свою силу: вымогал ресурсы у фестралов из Мейрлема, захватил Фетлок – но всё равно не был удовлетворён.\n\nНесмотря на силу Костолома, есть те, кто готов заменить его в любой момент. Так называемые Королевские стражники под предводительством Холд Хоупа противостоят Костолому на каждом шагу, стараясь помочь поселениям восстановиться. В то же время некоторые из угнетённых поселенцев начали поддерживать республику, которая должна заменить рейдеров, во главе с таинственной фигурой по имени Мэшд Оут. Несмотря на все помехи, Костолом не обращает на них внимания. Ведь Мейнхеттенские Рейдеры когда-то владели всем городом – и намерены вернуть те времена. Не даром название их банды столь амбициозно."

FOE_WS_RAR: "[Root.GetNameDef] – Кочевники на шоссе Санрайз"
FOE_WS_RAR_desc: "Скорость – наше всё!\n\nПодходи, не стесняйся – начинается заезд Дождевых Ездоков! Когда? Всегда когда им захочется! Где? Там, где ты и твои пожитки! Слышишь этот звук? Это урчание моторов, восторженные вопли жаждущих крови рейдеров и, если прислушаешься, крики тех неудачников, кого мы поймали! Когда-то мы, рейдеры, гоняли по всему шоссе Санрайз, но потом появились эти штуки под названием "границы", а на нашего босса, Хот Рода, напала какая-то драная курица с севера!\n\nНет пони в Эквестрии, кто знал бы движки лучше Дождевых Ездоков, и во всей Пустоши нет рейдеров быстрее нас! Под началом Хот Рода, самого быстрого гонщика во всей бывшей Эквестрии, мы собираемся рвануть на север и вышвырнуть эту индейку Редвинга из Слияния Мейр, хорошенько ощипав его, потом на запад, выбить зубы у тормознутых Безумных Гонщиков, а затем метнуться на юг, в Ржавый Остов, чтобы надрать задницу гулям!\n\nМожет ты слышал о тех из нас, кто не считают себя рейдерами – типа Квик Акселерейта или Тайр Тред – они делают вид, будто быстрее Хот Рода, но всё равно знают: наша судьба – пройти шоссе Санрайз от начала до конца!\n\nНа старт, Дождевые Ездоки! Дайте всей пустоши услышать рёв ваших моторов! Три! Два! Один! Газуем!"

FOE_WS_FER: "[Root.GetNameDef] – Скорость как образ жизни"
FOE_WS_FER_desc: "Однажды мудрый философ сказал простую фразу, в которой заключалась вся истина мира: "быстрее, Быстрее, БЫСТРЕЕ!"\n\nКаждый пони с момента рождения жаждет лишь одного – почувствовать ветер в гриве и урчание двигателя, когда он мчится во весь опор по шоссе. Свобода открытой дороги, без ограничений скорости, преград и морали – вот что по-настоящему ценно для Безумных Гонщиков. Когда рабы начинают говорить о "голосовании" или "свободе слова", это звучит совершенно нелепо. Какая может быть свобода вне машины?\n\nИх лидер, Аневризм, наблюдал, как самозванцы из Дождевых Ездоков сбавили ход, и вместо того чтобы ускориться, дали задний, когда за ними пришёл Редвинг. С того самого дня, когда Хот Род трусливо сбежал, Аневризм понял: его судьба – уничтожить самозванца, пройти шоссе Санрайз от начала до конца, примотав вопящего Хот Рода к своем капоту. Его ненависть к Хот Роду столь велика, что пугает даже некоторых рейдеров. Они считают Аневризма опасным. И они правы.\n\nНекоторые из Гонщиков имеют другие планы – например, Стронгбэк хочет улучшить жизнь деревенских пони. Или мэр Скрэп, который считает, что может их защитить. Но оба – дураки, вставшие на пути мести Аневризма. Ключи от машины – это ключи к свободе, не забывайте.\n\nПрогревайте двигатели, пони. Гонщики выходят на старт."

FOE_WS_STT: "[Root.GetNameDef] – Маленькое Стойло, которое смогло"
FOE_WS_STT_desc: "Новый пользователь, добро пожаловать в: Стойло 32. Мы, в компании Стойл-Тек, рады приветствовать вас в вашем новом доме. Загрузка: приветственное сообщение смотрительницы Стейбл Вэй. Загрузка завершена.\n\nДавным-давно на Эквестрию обрушились жар-бомбы, и лишь немногие счастливчики успели укрыться в подземных бункерах. Пока пустошь уничтожала саму себя, пони из Стойл процветали, пока мир снаружи не был признан достаточно безопасным для возвращения. Я, смотрительница Стейбл Вэй, много лет назад приняла трудное решение – открыть Стойло внешнему миру, принять новых членов в наше сообщество и выяснить, что случилось с Фрисайдом в наше отсутствие. И я рада сообщить, что, за исключением пары рейдеров, сообщество пустоши оказалось вполне разумным. С великой радостью я приветствую тебя, житель пустоши – будь ты торговцем, странником, учёным или одним из немногочисленных переселенцев – в Стойло 32, Стайниополис.\n\nЗагрузка сообщения: приветственный экран для наёмников. Автор: смотрительница Стейбл Вэй.\n\nПривет, наёмник. Наверняка ты задаёшься вопросом, зачем Стойлу нанимать кого-то вроде тебя. Хех, конечно, Стойло должно выглядеть приветливым, но мы-то знаем: наступит время, когда воцарится хаос. Наши соседи возятся в грязи и называют это цивилизацией. А чуть поодаль полупьяные рейдеры разъезжают на ржавых развалюхах. Но скоро, с твоей помощью, Стойло 32 вернёт себе Фрисайд, как и должно было, положив конец этой шутке, которую вы, жители Пустоши, зовёте "цивилизацией".\n\nЗагрузка сообщения: доктор Файал.\n\nЭта штука включена? А, работает. Мне пришлось тайком, под видом техобслуживания, вставить это сообщение в систему приветствия. Если ты это читаешь, тебе вот что нужно знать: смотрительница Стейбл Вэй – безумная кобыла. Она притворяется доброй и мирной, но я знаю: если военные когда-нибудь возьмут верх, она без колебаний поведёт их выжигать пустошь. Слушай внимательно: придёт время, когда мы сможем взять всё в свои копыта. Ради обновлённой пустоши. Да, я, так сказать, визионерка. Я не хочу разрушать пустошь, я хочу помочь тебе. Так что, когда придёт время, помоги мне.\n\nЗагрузка сообщения: предвыборная кампания Трейлблейзера.\n\nПриветствую тебя, новый пони в Стайниополисе! Меня зовут Трейлблейзер, и я рад тебя новому гостю! Даже здесь, в зоне ожидания, уже видно, что наше Стойло – особенное место, достойное защиты. И я намерен его защищать. Меня зовут Трейлблейзер... хех, уже говорил, но я собираюсь баллотироваться на пост смотрителя! Нашему Стойлу нужно твёрдое копыто, что защитит его, но не будет слишком сильно давить на жителей. Мы должны дать каждому пони – и, хех, не только пони – возможность выбирать своих лидеров! Надеюсь, ты навестишь меня – я живу на втором уровне, западная сторона Стойла. Я не откажусь от помощи в проведении своей кампании!\n\nЗагрузка сообщения: ошибка, больше сообщений нет. Стойл-Тек желает вам хорошего дня. Добро пожаловать в: Стойло 32. Мы, в компании Стойл-Тек, надеемся, что вам у нас понравится."

FOE_WS_MUD: "[Root.GetNameDef] – Не так плохо, как звучит"
FOE_WS_MUD_desc: "Любишь грязь? Наверное, да, раз решил прийти сюда. Что есть в Мадбурге? Всё просто – собственно грязь, да и сам Мадбург: немного металлолома, немного воды и целая куча грязных пони. Мэр Мадди Паддл правит уже давно, но он не особо примечателен – просто земной пони в достаточно чистой одежде, чтобы его выбрали. Хотя он её никогда не стирает, а очки у него такие мутные, что глаз не видно. Некоторые говорят, от него пахнет как от гуля.\n\nЕсть ещё Филси Мейн – второй по популярности политик в Мадбурге, прославившийся, представь себе, грязной гривой. Он помогает жителям и весьма добрый, но ничего особенного. Только не путай его с Блад Мейн с юга – они очень злятся, если перепутать. В городе есть и небольшая банда рейдеров, возглавляемая пони с крайне неудачным именем Кант Хорсфакер. Да, мать ненавидела своего сына. Он ничем не выделяется, кроме имени – но это же Мадбург, земля непримечательных пони.\n\nЕсть ещё Дёрти Рейн – тот же мэр, только хуже. Больше сказать нечего.\n\nНу, если хочешь остаться в Мадбурге – это твой выбор. У нас нет ни великой истории, ни героев, ни претензий на чужие земли. Мы просто сидим в грязной луже и ждём, пока какая-нибудь отчаявшаяся фракция решит нас захватить. Приятного пребывания."

FOE_WS_WNF: "[Root.GetNameDef] - Exiles of the Foal Mountains"
FOE_WS_WNF_desc: "A tribe split in half, Winsome has recently had conflict against the Foal Valley Tribe, conflict that went poorly for Winsome. Instead of a grand victory, Winsome was pushed back, losing Western and Southern Winsome to the Foal Valley Tribe, and while the West and South might not be as valuable as North and East, which they still hold onto, the loss of this land has lit a spark inside Winsome.\n\n Dark Cloud is a cunning, clever, rather young, yet very dangerous war chief, having replaced the last war chief after a sudden sickness claimed his life. Indeed, all who have rose against Dark Cloud have found themselves similarly suddenly sick, until finally ponies got the memo to not go against him. Now, instead, the tribe follows him gladly as he schemes a plan, to retake their lands and humiliate the Foal Valley. First, they will strike east, aligning themselves with the Stable nation there, splitting apart the weak lands of Mudburg, the Speedfreaks, and the Mob. With all this land, the Foal Valley shall fall with no issues, and once all of the mountains have been taken, Dark Cloud will be undisputed master of Winsome.\n\n Yet others are not satisfied, The Council, they call themselves, a group of representatives that nobody knows, who demand reconquest now. They want to unify the mountains under a single republic, though many in the tribe don't believe their promises. Truly, it seems like only time will tell, but one thing is for sure. Winsome will be a great power, or it will not be a power at all."

FOE_WS_FTR: "[Root.GetNameDef] - Vanguard of the Mountain"
FOE_WS_FTR_desc: "Once, a long time ago, a group of foals was on a field trip in the Foal Mountains, exploring the mountains and learning survival skills by their teachers, and the ever helpful park rangers. Until one day, all the rangers left the foals and the teachers in the mountains, called back to their headquarters to the west for an emergency. We did not know what the emergency was, until we watched as green fire consumed the skies, and the world we all knew was consumed in Balefire. In a green flash, suddenly, the childhood of all the foals was over, and they were thrust right into adulthood, with only teachers to protect them.\n\n The field trip groups would all gather together, along with a group of miners working at H.M.I Mines, the adults agreeing to work together for the benefit of the children. They claimed the southern valley, where they could hunt and grow what little food they could muster, while the foals hid in the mountains, kept safe from harm. And for a generation, all was well, as Foal Valley and Foal Mountains worked as one.\n\n Yet, kept safe from the horrors of the Wasteland, the new generation of foals born, believing themselves greater than the adults who still clung to the 'old world', would kick out all ponies older than eighteen, and proclaim the tribe of Foaltopia. Thus came a schism, as adults went south, and when they had children, they would send them north, into the safe mountains.\n\n As the sun rises upon this tribe, we remain led under Burnt Aspen, she who has led for a decade, a mare careful, wise, and caring for all those beneath her. Yet the time nears for a tribal council to be held, and many others wish to rule the tribe. Most popular is Candle Light, a mare who calls not just for unification with Foaltopia, but for a unification of the Foal Mountains as a whole. Yet another, Rusty Shank, has taken inspiration by the tales of marauding bandits to the east, believing that the only way for the Foal Valley to find strength is to turn to savage raiding and barbarism. Finally is Dead Earth, a pessimist who fought in a previous war against the Winsome Tribe. Now, he believes the fate of the tribe is eventually to be destroyed, casting his eyes south, to the fabled land of Fillydelphia, with fear.\n\n Only one thing is for sure in this land. If we are to survive, if we are to thrive, then it's time for parents and children to stand side-by-side in the world once more. It's time for Foal Valley and Foaltopia to become one."

FOE_WS_FTP: "[Root.GetNameDef] - Child Soldiers Ahoi!"
FOE_WS_FTP_desc: "Once, a long time ago, a group of foals was on a field trip in the Foal Mountains, exploring the mountains and learning survival skills by their teachers, and the ever helpful park rangers. Until one day, all the rangers left the foals and the teachers in the mountains, called back to their headquarters to the west for an emergency. We did not know what the emergency was, until we watched as green fire consumed the skies, and the world we all knew was consumed in Balefire. In a green flash, suddenly, the childhood of all the foals was over, and they were thrust right into adulthood, with only teachers to protect them.\n\n The field trip groups would all gather together, along with a group of miners working at H.M.I Mines, the adults agreeing to work together for the benefit of the children. They claimed the southern valley, where they could hunt and grow what little food they could muster, while the foals hid in the mountains, kept safe from harm. And for a generation, all was well, as Foal Valley and Foal Mountains worked as one.\n\n Yet, kept safe from the horrors of the Wasteland, the new generation of foals born, believing themselves greater than the adults who still clung to the 'old world', would kick out all ponies older than eighteen, and proclaim the tribe of Foaltopia. Thus came a schism, as adults went south, and when they had children, they would send them north, into the safe mountains.\n\n And Foaltopia has prospered under the hooves of the young, where every idea shall be tried at least once, and where vegetables are never on the menu! Even though us foals hate politics, though, Mayor Lamp Light, being a real stick-in-the-mud, has said there's going to be an election anyway. Lamp Light is, of course, a really boring foal, always talking serious about stuff, but he has seen us through a lot of crises while being calm. Then there's Brave Sun, a foal with a heart bigger than his brain, who's said to every other foal about how they're crusaders in the world, that it is the job of us to become the protectors of all foals! Littlehoof doesn't agree with that at all, instead, he fashions himself like an old world emperor, and he proclaims every day to anyone who will listen about how they should go and take from the adults for the benefit of foals! Finally is Pretty Pasture, a self-styled Princess who wants nothing more than every single thing in the world.\n\n Even though every foal might disagree on the way forward, it is clear in the minds of all that there is only one first step. The adults of the south shall come to protect the foals again, and from there, Foaltopia shall become great!"

FOE_WS_CCD: "[Root.GetNameDef] - Dogs of the Mountain"
FOE_WS_CCD_desc: "Mountains have always been the natural home of a Diamond Dog, surrounded by nothing but stone, and gems, there is no greater comfort to us. When the Great War began, Equestria needed to secure the Crystal Caverns, a mountain filled with hidden passages and crystals, which, if followed, could lead one directly into Canterlot itself. Not to mention the need for crystals, to power robots, energy weapons, and to sell all across the world, before long we became one of the top producers of crystals in the world.\n\n When the bombs fell, not much changed, and even still, not much does. None dare to come from the ruins of Canterlot, and to the east lay the foals of Foaltopia. Good to get some pets from, every so often, but good for little else. No, the Crystal Caverns remain a haven for dogs, where dogs can live free, and dig to their heart's content.\n\n Jim, our leader, has keep a steady paw, keeping things safe, prosperous, stable. Yet even the most stable regimes have dissent eventually. Some call for Jim to have a greater vision of the world, to use our peace to rebuild what we can, but they remain unpopular. Then is Hans Gudboi, an average miner who has spent all his life calling for a democracy, where every dog can live free lives. Finally is Ziggy Xi, a mine overseer who wants to make our mines more efficient, by enslaving those around us and forcing them to mine.\n\n Despite their dissent, though, Jim remains in charge for now, and for the foreseeable future, nothing is set to change."

FOE_WS_SCI: "[Root.GetNameDef] - City of Ghouls"
FOE_WS_SCI_desc: "Canterlot, capital of Equestria, and greatest city in the world, built over the course of centuries, was destroyed in but a day. We still remember the Last Day, when the sirens went off, and a sickly pink cloud set down upon us. We, the common citizen of Canterlot, fled to our Stable, Stable 1. We learned the hard way that the Stable was supposed to be an eternal punishment, locking us away with the Princesses, and the rich, those who caused the war.\n\n And yet the rich never showed up, and we thought our punishment was gone. But it had only just begun. Slowly, Pink Cloud and radiation began to seep into our Stable, killing many and sparing few. Some fled, never to be heard from again, others died screaming, some went quietly. The rest of us, though, we weren't so lucky to die. Instead, we watched as our fur slowly started to fall off, as our voices went raspy, and as the centuries past, we learned our eternal punishment had come, to be trapped in a body, forever rotting, never able to die.\n\n Yet things were peaceful for a while, until the arrival of mutants, Alicorns. They flew in and gave us no chance, attacking us and forcing us away from the north side of the city, led by a mare as dark as night, savage and brutal beyond all compare. But we are Canterlot ghouls, and we don't die easy. Soon, the Alicorns will come for us, under Nightseer's monstrous command, and with that invasion, we shall secure our future.\n\n Our Overmare, Emerald Vale, awaits the future, but she is of many minds. Part of her wishes to rebuild the old world, another part wishes to hide back away in our mountain city. And yet, deep in her mind, she can feel a voice growling like a feral beast. Rid this world of smoothfurs, and long may Canterlot reign."

FOE_WS_GLY: "[Root.GetNameDef] - Striped Enclave"
FOE_WS_GLY_desc: "Have you ever been hated? Not just disliked, no, not just derided because of your actions or your beliefs. Have you ever been hated, just because of the color of your fur? It seems silly, that something like that could lead to such hate, but in Glyphmark, every zebra knows that their stripes are just target-marks for every pony in the wasteland.\n\n From our earliest days, us zebras have been betrayed. Forced into the slums called 'Zebratown' by a racist Princess, hated day and night by our fellow citizens, and when the world ended, its rumored that Celestia held up her shield around Canterlot purposefully long enough to lure us into a false sense of security, before sending the Pink Cloud down onto us.\n\n The rest of our history? It doesn't really matter, does it? How many tales of hate, death, and racism does one need to tell before their stripes are justified? How long must we live in tortured existence before the ponies stop shooting us? Never, never enough, all because of our stripes. Xephyr, our leader, rules peacefully, not that there is much to rule over, the pessimism and defeatism of all zebras carrying all the way up to her. Even Grandpa Rattle, the only other good leader, wants nothing more than power.\n\n Yet some of us envision something else. Some still hold hope, and they call for Xephyr to listen, to lead our armies into Canterlot and take the city for our own. From there, we can proclaim safety in the capital of the ponies, and maybe then, maybe, we'll have proven our worth. Yet others wish to take up arms, as a New Zebrican Legion. The ponies have proven time and time again that they'll never see us as anything but monsters. They want monsters? Then we'll give it to them, one bullet at a time."

FOE_WS_SPV: "[Root.GetNameDef] - Basically Deathclaws with Guns"
FOE_WS_SPV_desc: "Once, in a time long ago, Diamond Dogs had a home in Equis. An area of mines, rich in gems and crystals, where we could freely dig, and live happy lives. Then, came the ponies. The Equestrian government needed our home, and they did not ask nicely for us to leave, no, they forced us out by gunpoint, on pain of death. They defiled our home, and called it a name reviled by all Diamond Dogs, Maripony, where abominations live.\n\n We are a society left now, two hundred years later, with nothing. Ponies encroach on our borders, with ideas of freedom and republic, while the monsters of Maripony get all the more bold. Raiders attack Whitetail and steal away the pups and dogs they can, cooking them over fires, visible all the way from the valley. We are beset from all sides, and we know, soon shall come Unity, soon shall come Ponyville, soon shall come the hardest days of the Wasteland.\n\n Laika is a bitch who has led us through bad times, yet her lack of response to our surroundings has led to her having no popularity, and with approaching elections, it is clear to all she will lose. Fluffykins is her most popular opposition, who will take supreme power, and lock the country down, making the country an immovable object, a rock in the storm. Lassie, the second most popular leader, upholds a different ideal, that we Diamond Dogs shall see justice done, that Maripony will be ours once more.\n\n Longclaw, however, holds no such ideals of justice, only revenge. He howls, no more ponies pushing us back, no more suffering, no more setbacks, and many listen. But in the end, the fate of dogs is left unknown, and either our darkest, or our brightest, days are ahead."

FOE_WS_RWK: "[Root.GetNameDef] - The Fading Admirality"
FOE_WS_RWK_desc: "Two hundred years ago, the Celestial Sea Fleet, under command of Admiral High Tides, set out on its last journey. In the cold northern waters they fought, against a massive Zebrican invasion force. At the moment of their triumph against the stripes, though, all went wrong, for from the mainland came flashes of bright green light, as the Balefire Bombs hit all across Equestria. The Pegasi of air command, instead of assisting their navy comrades, pulled away from the battle, leaving them high and dry against the stripes, as they retreated above the clouds like cowards.\n\n Admiral High Tides led the damaged fleet to the nearest friendly port, the city that would come to be called Rustwreck. The journey back to friendly territory was treacherous, many ships were lost, and many sailors. It was on this journey that High Tides became a ghoul, when a young mare fell into the radioactive ocean, he dived in to save her, sealing his fate as a ghoul. Two hundred years ago, the Celestial Sea Fleet landed in Rustwreck, and quickly they began to settle down, military law ruling the wild, chaotic land, keeping the legacy of the navy alive.\n\n Two hundred years have passed, and High Tides is starting to get old. He rambles about psychos, hippies, freaks and pinkos to his fellow Admirals and Captains, and it seems to many that his time is approaching. A sub-sect of the Admiralty follow High Tides' protege, Wavebreaker, an intelligent stallion well respected by the Admirals, who has always held merit above all else. Outside of the capital, though, the majority of the country is left neglected and ignored, their resources, population, and industry not being captured like the capital. One pony seeks to fix this, Doctor Kelp, a doctor from Manehattan with her personal organization, the Sunrise Development Council, wishing to spread prosperity across the country. It’s in these ignored provinces that desperation has taken over. The Endtide, a religious cult led by Crimson Tides, lead charities and paramilitary groups all throughout the hinterlands, spreading their message and their faith. Despite being a cult, the Endtide has been seen as rather reasonable, working alongside the government whenever they could.\n\n Rustwreck is a land on the precipice of change, all can tell that. Rustwreck is a land of tragedy, losing the battles of the past, losing the majority of their navy, losing the best of the best. In the past, glory has been tried to be grasped, but always has been lost. Like when High Tides sent an expedition to Griffonia, to try and make contact with any survivors. He sent a massive ship, led by Commodore Journey Perrylous, an expert at sailing troubled waters, but despite the hope for Griffon aid and trade, the ship never returned. It’s clear that the fate of Rustwreck, while aided by the waves, is a surface endeavor. As High Tides ages, and his mind slips, more ponies begin to question who will be next. The analytic Wavebreaker, the charismatic Crimson Tides, or maybe even the pragmatic Doctor Kelp. Only time will tell if our destiny is a high tide, or a low tide."

FOE_WS_REP: "[Root.GetNameDef] - Bastion of Democracy"
FOE_WS_REP_desc: "When the Balefire bombs fell two centuries ago, other ponies decided to languish in their destruction, becoming disgusting tribals, savage raiders, or giving themselves up to ideologies of slavery, indecency, and horrible things. While the Wasteland destroys itself, there is one shining beacon in the world, a new society building upon the ash of the old world, The Republic, a place where every pony has a vote, every pony has a say, and where society is kept safe from moral impurities. Freedom comes with a price, after all.\n\n No moral impurity, no distractions from what needs to be done. Every pony shall remain sober, away from the poison of chems. Every pony will remain righteous, away from the poison of sexual immorality. Every pony will remain free, that they can choose their local leaders, and together, we may build a society better than the past. These are the promises that President Wide Savage makes, a president who wants very little other than to focus on the interior, and to protect it from the outside. But democracy comes at a price, and others can be elected in his place.\n\n The Council, a collection of the most wealthy ponies in The Republic, have long chipped away at the democratic process, and today they are closer than ever to taking over. Wanting nothing more than maximum profit, they will turn the Republic from a democracy, to an oligarchy. Dry Spell falls into a similar category, though instead of building up, he wishes to expand outwards. With support from the military, he wishes to march, and bring riches back home. Then, there is Loud Speak, a popular pony amongst the common pony, who wishes to lead the Republic into greatness. Some say only by falling under him, could we truly spread our democracy, and create. . . An Eternal Republic."

FOE_WS_EVR: "[Root.GetNameDef] - True Rulers of the Everfree"
FOE_WS_EVR_desc: "Once, long ago, the Diamond Dogs of Equestria were forced out of Maripony. Many of them stayed, but of those who left, many of them decided to take their chances in the Everfree Forest, a place so dark, that no pony would ever come to push them out of their home again. The dogs, in such a dangerous place, reverted back to a tribal type of society, made all the worse when Balefire consumed the lands. They ruled the forest alone for years, until, deep in the Everfree, opened Stable 101.\n\n Fire, and the shooting of guns, that is the 'gift' that Stable 101 gave to the Everfree, as the dogs were once more pushed away from their homelands, by the one called Red Eye, He of 101. He, with his slavers and his raiders, pushed us south, securing all but the southwest of the Everfree Forest for his own. We fled, and we awaited his return, but he never came to claim what remained, instead, he seems to be waiting, waiting to destroy us. Barking Saw, newest Chief of the tribe, is afraid of the enemy of 101, she wishes to remain still, and wait for him to die on his own. One of our most popular elders, Old Red, agrees with her, believing an iron paw is needed to protect what remains.\n\n Yet not all are happy with this turn of events. Rex, a hopeful young dog, wishes to rectify the sins of the past, to reclaim the Everfree, and make a home not only for all Dogs, but for all who have lost their homes. Then there is Scoobert J. Doo, a Dog who was driven savage by the war against Red Eye, and wishes to use his own tactics against him. Raiding, destroying, pillaging, all for the benefit of Dogs.\n\n No matter the leader, we sit awaiting, in our dark home, knowing what's to come. Lead us, and let loose the dogs of war."

FOE_WS_GOR: "[Root.GetNameDef] - Safe in the Lair of the Beast"
FOE_WS_GOR_desc: "Ghastly Gorge, before the war, was seen as place that was rather, well, ghastly, not a place for a normal pony to roam. Quarry Eels come from their sleep every so often, sharp teeth and giant heads biting at whatever happens to roam too close to them, usually to deadly effect. Such a dangerous place, before the war, was seen as a place to not go. But when Balefire consumed the world, the eels went from a danger, to being a protector. And thus was Gorge Town founded, deep within Ghastly Gorge, and there it has stayed, away from risk, as the eels scare off any who might cause trouble.\n\n Yet our peace is not to be long lived, as tensions in our little corner of the world are heating up. Far to the west, the Lightning Scavengers are electing their new leader, with many fearing we might be a target of expansion for them. To the east, Red Eye has taken over Fillydelphia, seeking all of Equestria in his grasp. To our south, there are rumors in Shattered Hoof, of a play for power by Gawd, the Talon potentially posing quite the threat. Closer to home lay Featherbrush's Talons and the Dust Reavers, both of which look hungrily at our little town, both of which pose threats.\n\n Quarray, our leader, rules with a firm, yet fair, hoof, not allowing democracy, like the Republic to the east, yet prioritizing safety and prosperity. Deep Hole, a rather popular figure, believes that by taking over, he could create even greater prosperity, with little focus on anything else. Yet there exist some raiders, following Eel Wrangler, a pony who successfully managed to tame an eel, and in doing so, impressed a group of ponies so much that they immediately joined him. Firm Stead, on the other hand, is a pony that has prioritized helping those in need.\n\n No matter the leader, though, all know one thing for sure. That we are alone in the world, and that many hunger for us. There is only one way to be safe, to take the plains south of us, to kick out the Talons west of us, and secure the Republic east of us. Only with all this land, all this industry, all together, can we stand a chance against the oncoming storm."

FOE_WS_BOG: "[Root.GetNameDef] - Darkness bubbles beneath the Swamp"
FOE_WS_BOG_desc: "'What rests in the bogs, papa?', 'Death, little one. And darkness unmatched.'\n\n Never trust a stallion who builds his home in a swamp, so goes an old world saying. No foundation shall ever be secure, when the ground is mud, and no foal is safe, when the bog hungers for them. Yet in the Wasteland, ponies have to make a choice, to suffer being away from the bog, or to be safe, within the suffering of the bog. None come to Froggy Bottom Bog, afraid of the mire and muck, even if the ponies within are welcoming.\n\n Old Hop, eldest stallion in the bog has seen many decades pass, as raids from the west, and business ponies from the east alike try to take the bogs for themselves. But the bog claims all who come, giving him complete control over it all. For now. Croaker, a village chief, leads a collection of chiefs, wishing to replace the autocratic powers of Hop by a council of chiefs, while still remaining safe in the bog. Green Belly is a normal pony, not a chief, who wants nothing more than to help make lives better, to try and prevent the bog from swallowing another victim.\n\n Yet in the darkness, he lurks. A stallion with blood on his breath, and death in his mind. Toadstool, He of Shadow. Not many trust him, but should he somehow take over, the world itself may tremble. For the bog is more than just a dark place, it is a dark idea. Try and run, try and hide, the bog shall consume you all the same. And leave Desolation in its wake."

FOE_WS_PBN: "[Root.GetNameDef] - Dust, Rust and lottsa Bullets"
FOE_WS_PBN_desc: "Plainstown was built up after the war by a bunch of ponies who thought they would be safe. Dust storms kick up over the entire country, dangerous to those who don't know how to deal with them, but to those who knew, it was just a way to stay safe. Thus the ponies in this region built a nice government, a nice place, thinking they were safe. At least, that's until I, Buckshot, came in and showed them how wrong they were!\n\n I, the most mighty raider in all the west, gathered together a cohort, a gang larger and more unified than any other! For I would go to the raider clans, and any who opposed me, I would tie them to a stake, and light it up, then force the remaining raiders of that gang to feed on the flesh. Unsightly? Yeah. But what isn't nowadays? Its effective, and with that, I was able to take over, and burn to death the previous 'mayor' of the plains. Now, even though gangs might not listen to me as much as they should, and even if the dust makes stuff annoying, I'm leader of a mighty place.\n\n Yet a secretary of the old mayor, Scar Hide, has decided to oppose me! He's popular, too, leading all the ponies of the towns together, trying to oppose me at every step I take, all so he can take over instead. But he doesn't matter, not like he could take me down, unless something real bad was gonna happen! Then there's Fair Sight, a stallion with a gun who plays sheriff around the towns, getting quite the following due to it, and no, he's not related to Farsight in Old Appleloosa. At least I don't think so. He's a bit weird, and even if he's liked, not like he can do anything!\n\n I am a conqueror, I am unmatched in this area. And I look around me, and all I see is weakness. Talons exhausted from a war against pegasi, ponies hiding in their gorge, thinking they're safe, Appleloosa ripe for the taking! It's time I show the gangs who I am again, time to show these ponies that I, Buckshot, am not to be fucked with! I'm gonna burn it all down, and from the ashes, I'll build a land of dust!"

FOE_WS_GUN: "[Root.GetNameDef] - Welcome to the Family!"
FOE_WS_GUN_desc: "How ya doing, boss? Welcome to the greatest little state here in these Equestrian wastelands. We pride ourselves on conducting good business for all the right prices and all the reasonable ponies left in this shithole of a world. The best kind of business is one that attracts crowds and addresses the worst vices the world has ever known. From drinks to chems, to those beautiful mares and sharpest suits, we’re the family that brings everything and anything to the table. The big boss, All Capony, has been running things for years, keeping the rackets running and those fat caps rolling. He’s a real go-getter, helping bring in all our new pals into a real model of a family. Sure, sometimes a pony’s got to get wacked or some poor shopkeep forgets to pay their proper tax, but what’s life without a little crime? I’ll tell ya it’s a boring one! \n\n But life in the syndicate, it ain’t no walk in the park. All Capony, he’s a people person, you know. Trying to make something out of a whole lot of nothing. From the Apple Grove to the lands of Light, and even those northern Fresian fucks, everyone pays their proper tribute to the boss of bosses. Not everything is as it looks, though, cause way down south, a damned storm is brewing. That red-eyed fuck has been eying our boss’s lands for a while now, like the damn bastard he is.\n\n Plus, the boss’s close cronies are surely plotting something. The damned Billard Board is trying to cause a real racket in town by talking about how it’s time we went big and cleaned all the houses out. Sure as hell hope that bastard remembers who’s the real boss here. Then there’s Booze Blues, always drunk out of his damned head, spouting some crap about a vision where the mobster’s paradise happens. Then lastly, the old Swing Beat is too lazy to do anything at all, and says that we’re only good for trying to keep living. Talk about a damned killer of fun. But the boss ain’t gonna go down without a rain of bullets and a glass of the best drinks in these wastes. Because once we’re in the family, we’re in it for life! And no pony, griffon, or anyone is going to break our syndicate!"