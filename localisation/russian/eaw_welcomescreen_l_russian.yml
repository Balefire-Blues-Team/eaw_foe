 EAW_WS_TAB_3_TXT: "\n\n£bb_text  §YBalefire Blues§! расширяет систему технологий рас §YEquestria at War§! двумя новыми видами: пегасами и аликорнами, доступными для Анклава и Единства соответственно. Пегасы отделились от земных пони и единорогов, так что дерево технологий пони было изменено и расширено, дабы отразить эти изменения. В пустоши нет чётких границ между культурами и специфичные расовые подразделения не обязательно будут привязаны только к одной конкретной расе. К примеру, §YРаботорговцы Красного Глаза§! могут исследовать как наёмников-когтей (технологии грифонов), так и роты единорогов (технологии пони). \n\nBB использует смесь из ресурсов OWB и §Yкристаллов§! £resources_strip|7 EaW. §YКристаллы§! используются при создании продвинутого магического снаряжения вроде §YИмпульсного энергетического оружия§!, §YХищников Анклава§! и §YСнаряжения аликорнов§!.\n\n\n\nНаучное и общественное развитие\nBalefire Blues соединяет воедино три технологических уровня OWB  §Y(племенной, цивилизованный и продвинутый)§! и систему §Yразвития§! EaW. Три уровня §YНаучного развития§! можно найти в секции §YКультурных политик§!. Они соответствуют каждому уровню развития науки и дают свои дополнительные эффекты. У Balefire Blues есть своя собственная система §YРазвития§!. Уровни варьируются от "Общества старого мира" до "Общества рейдеров" или "Племенного общества". Некоторые уровни развития могут ограничивать дипломатические возможности. Пример - §YСтойло 2§! и их §YЗакрытое общество стойла§!, которое полностью изолирует их от внешнего мира, пока они не откроют неприступную дверь.\n\nДва типа развития, §YОбщество рейдеров§! и §YОбщество работорговцев§!, разблокируют динамическую §Yсистему рейдов§! из EaW, которая позволяет вам совершать набеги на соседей для различных целей, в том числе и захвата £slave_text  рабов.\n\n\n\nМегазаклинания\n\nНа смену традиционным для HoI4 ядерным бомбам приходят различные \"§YМегазаклинания§!\": особо мощные заклятия, которые могут оказывать разрушительное или же положительное воздействие на ход битвы. Меню мегазаклинаний можно найти в верхней панели справа от вкладки Логистика:\n\n-§GЖар-бомбы§! заменяют традиционные ядерные бомбы. Это оружие было разработано зебрами. Такие бомбы используют некромантическую магию вместо радиоактивных материалов. Жар-бомбы действуют аналогично ядерным, хотя для их применения не требуется достижение превосходства в воздухе.\n-§PЛечебные заклинания§! в настоящее время они являются единственным мегазаклинанием с положительным воздействием в Balefire Blues. Эти заклинания могут предоставить значительные бонусы вашей армии на короткий период времени. Они могут быть активированы с помощью способности лидера или, если у вас нет DLC Waking the Tiger, с помощью кнопки в меню мегазаклинаний.\n-§YСелестия Один§! действует аналогично жар-бомбам, но может использоваться несколько раз. В настоящее время "Селестию Один" может использовать только Башня Тенпони с помощью нового меню на вкладке региона, которое появится после разблокировки мегазаклинания.\n\n\nОперация "Скрепка" - послевоенные исследовательские бонусы\n\nПосле победы над страной в войне, и окончания мирной конференции, победители имеют шанс получить §Yединовременный 50% бонус к исследованиям§! для §Yтехнологий§! , которые изучила проигравшая страна, но не победитель. \n\nШанс получить бонус случаен, и вычисляется в зависимости от технологии. Чем больше §Yпромышленности§! проигравшего было захвачено победителем (либо марионеткой, либо аннексией), тем выше шанс получить бонус, что значит не каждый победитель имеет равный шанс. Уровень §YРазвития§! победителя тоже влияет - чем ниже Развитие, тем ниже шанс.\n\n\nПереключение музыки\n\n£bb_text  Мод §YEquestria at War§! включает в себя несколько новую музыку. Чтобы позволить игрокам выбирать какая музыка им больше нравится, мы добавили кнопку выбора музыки в §Yокно музыкального плеера§! (доступно при нажатии на §Yноту§! рядом с §Yконтроллером скорости времени в игре§!, и там нажать на §Yполосатую желтую кнопку с плюсом§!), позволяющую выбирать между §Yобоими вариантами музыки§!, §Yтолько музыкой из оригинальной игры§! и §Yтолько музыкой из мода EaW§!.\n\nНе обязательный, но рекомендуемый к установке £bb_text  §YEquestria at War Music Mod§! также поддерживает этот выбор.\n\n\nУлучшение ИИ\n\nБыла проведена работа по улучшению ИИ. Хотя он не идеален, и большинство реальных улучшений сделано Парадоксами, мы приложили все усилия, чтобы улучшить поведение ИИ, а также улучшить создание ИИ шаблонов дивизий. ИИ будет использовать добавленные юниты и технологии. ИИ будет выбирать доктрины в зависимости от бонусов, полученных на древе фокусов. ИИ будет использовать различные стратегии в зависимости от событий и изменений на мировой арене. Поведение ИИ на мирных конференциях было улучшено, но все ещё не идеально.\n\n\nИгровые правила\n\nПосле выхода обновления 1.6 'Броненосец', были добавлены новые игровые правила и настройки для различных стран, чтобы позволить игроку настроить собственную игру в £bb_text  §YEquestria at War§! по своему вкусу.\n\n\n\nДинамическая генерация лидеров\n£bb_text  §YBalefire Blues§! адаптирует новую и более интересную систему генерации генералов и адмиралов, а также оперативников для игроков с DLC La Resistance из EaW. Некоторые нации при определённых обстоятельствах могут получать лидеров, принадлежащих различным расам. К примеру, государство §Y[EYE.GetNameWithFlag]§! может генерировать генералов из обычных жителей пустоши, рейдеров и грифонов. У каждого типа генералов есть свои собственные списки имён. Это не вносит никаких значительных изменений (кроме признаков лидеров) в игровой процесс."
