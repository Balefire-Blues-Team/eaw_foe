FOE_WS_Canterlot: "Руины Кантерлота"
FOE_WS_Canterlot_desc: "Кантерлот, бывшая столица Эквестрии, теперь представляет собой проклятые руины. Город, укрытый в объятиях смертоносного Розового Облака, что высасывает саму жизнь из обычных пони. Город, полный гулей, что не могут умереть, и радиопередач, которые плавят сам разум – это истинный Тартар на землях Эквестрии.\nЛишь самые стойкие и выносливые могут выжить здесь: на севере – Кантерлотские Аликорны, ищущие Чёрную Книгу. Их лидер безумна, но весьма способна. На юге – Город Стойла, группа кантерлотских гулей, просто пытающихся выжить. Окружённый с одной стороны зебрами, а с другой – алмазными псами, Кантерлот относительно изолирован от остального мира.\n\nНо поскольку борьба за власть между этими фракциями продолжается, а великие державы возникают по всей пустоши, возможно, это лишь вопрос времени, когда Кантерлот вновь станет столицей чьей-то империи."

