GenStable_supply_bunker: "Найден бункер снабжения"
GenStable_supply_bunker_desc: ""

GENSTABLE_subterranean_builders_idea: "Упорство"
GENSTABLE_subterranean_builders_idea_desc: "Наше Стойло – наш дом, а мы – цивилизованные пони. Цивилизованные пони меняют свой дом, перестраивают его вширь и вглубь, чтобы сделать ещё лучше и превратить в настоящий город. Так или иначе, мы сделаем наше Стойло великим городом, которому не будет равных в новом мире."

GENSTABLE_hedonist_robotopia_idea: "Гениальность"
GENSTABLE_hedonist_robotopia_idea_desc: "Благодаря тому, что роскошь доступна каждому гражданину, у многих наших пони появилось время для совершенствования своих навыков. Механики, которые иначе гнули бы спину в оранжереях или на кухнях, теперь день и ночь трудятся в мастерских, создавая средства для повышения собственного комфорта. Пусть наши пони избалованы и не рвутся в бой, они до мозга костей талантливы во всём, что касается социальных аспектов жизни."

GENSTABLE_paranoid_survivors_idea: "Бдительность"
GENSTABLE_paranoid_survivors_idea_desc: "Когда монстры из внешнего мира явятся на порог нашего Стойла, а потом попытаются выбить дверь и ворваться внутрь – мы будем готовы. Каждая кобыла, жеребец и жеребёнок пройдут базовую подготовку, необходимую для защиты своих семей и домов от кошмаров снаружи."

GENSTABLE_industry_massmarket_idea: "Потребительская промышленность"
GENSTABLE_industry_massmarket_idea_desc: "Мы сосредоточимся на вопросах экономики. Гражданская промышленность превратит нас в промышленного гиганта, способного в будущем вкладывать куда больше средств в военную сферу. Мы создадим то, что действительно стоит защищать, и затем используем всё это для своей защиты."

GENSTABLE_industry_extraction_idea: "Добывающая промышленность"
GENSTABLE_industry_extraction_idea_desc: "Чтобы создать хоть что-то, нужны исходные материалы – например, даже пирог не испечь без муки. Поэтому наше Стойло сосредоточится на фундаментальной основе производства – том сырье, из которого создаются полезные вещи. Торговля этими необработанными ресурсами подстегнёт остальную экономику. Конечно, если только пустошь будет оставаться достаточно стабильной."

GENSTABLE_industry_military_idea: "Военная промышленность"
GENSTABLE_industry_military_idea_desc: "В наши дни весь мир превратился в сущий Тартар, и выжить благодаря одним лишь деньгам или ресурсам больше не получится. Если мы хотим, чтобы у нас вообще была страна, мы должны быть готовы сражаться и убивать за неё, а также производить оружие, которое защитит её от кошмаров из внешнего мира."

GENSTABLE_industry_robonomics_idea: "Автоматизированная промышленность"
GENSTABLE_industry_robonomics_idea_desc: "Мы и так во всём полагаемся на наших механических слуг, так почему бы не доверить им ещё и фабрики? Их конечности никогда не устают, им не нужны передышки и сон, а механические глаза способны заметить изъяны, которые мы бы точно пропустили."

GENSTABLE_protectors_of_civilization_idea: "Защитники цивилизации"
GENSTABLE_protectors_of_civilization_idea_desc: "«Стойл-Тек» возвела дом последней настоящей цивилизации из всех существующих, то есть нашей. Остальные же народы погрузились в дикость и насилие. И они будут стремиться уничтожить нас. Мы не дадим им такого шанса, о нет – если они придут, мы встретим их во всеоружии. Мы сотрём в порошок любых варваров, что дерзнут постучать в наши ворота."

GENSTABLE_lockstep_society_idea: "Политическое единство"
GENSTABLE_lockstep_society_idea_desc: "Все сомнения в превосходстве устоев «Стойл-Тек» улетучились после пары незначительных реформ. Как и прежде, обитатели нашего Стойла будут с радостью следовать за назначенными «Стойл-Тек» лидерами, которые уберегут их от бед и сохранят покой."

GENSTABLE_rebuilding_wastes_idea: "Восстановление пустошей"
GENSTABLE_rebuilding_wastes_idea_desc: "Старый мир погиб, а нынешний оставляет желать лучшего, поэтому наше Стойло устремило взор за пределы настоящего в завтрашний день. В то, что ждёт нас впереди. Будущее уже за горизонтом, и мы первыми встретим его. Когда наступит завтра, оно застанет нашу страну во всеоружии."

GENSTABLE_isolationist_bastion_idea: "Оплот изоляционизма"
GENSTABLE_isolationist_bastion_idea_desc: "Пустошь – страшное и ужасное место, совершенно не подходящее нам, пони из Стойла. Нам не нужны огромные территории, нам не нужно быть чем-то большим, чем мы есть здесь и сейчас. Мы будем держать друзей близко, а врагов – на расстоянии выстрела из наших винтовок."

GENSTABLE_expansionist_nation_idea: "Экспансионистская нация"
GENSTABLE_expansionist_nation_idea_desc: "Нет места прекраснее нашей страны, и было бы крайним эгоизмом не позволять никому наслаждаться даром проживания здесь. Щедрость – один из Элементов Гармонии, поэтому в духе щедрости мы расширим наши границы во все сторону. Пони могут пытаться сражаться с нами, но стоит им вкусить качество жизни под властью «Стойл-Тек», как они никогда больше не захотят нам противостоять."

GENSTABLE_superior_populous_idea: "Мы лучше всех!"
GENSTABLE_superior_populous_idea_desc: "Наше Стойло – действительно нечто особенное. То, с чем не сравнится ни одна нация пустоши, как бы они ни пытались копировать нас или пытаться оболгать. Наша страна велика, народ превосходит всех и каждого, так пришло время всей пустоши узнать об этом и узреть наше безоговорочное превосходство."

GENSTABLE_technological_domain_idea: "Технологический домен"
GENSTABLE_technological_domain_idea_desc: "Благодаря огромным инвестициям в науку и образование каждая сфера нашего общества непрестанно становится всё более эффективной. Невероятно умные чиновники, инженеры, которым дают полную свободу для экспериментов, и начитанные учёные разбрелись по всей стране, приводя в порядок и улучшая всё, что только попадается им на глаза."

GENSTABLE_rapid_advance_focus_idea: "Стремительное продвижение"
GENSTABLE_rapid_advance_focus_idea_desc: "Лучшая защита – это нападение, поэтому наше Стойло решило сделать упор на быстроходную технику. Машины и приспособленная для них тактика, что весьма нечасто встречаются на просторах пустоши, позволят нашему Стойлу обходить с флангов и давить любого, кто дерзнёт встать у нас на пути."

GENSTABLE_enduring_defense_focus_idea: "Стойкая оборона"
GENSTABLE_enduring_defense_focus_idea_desc: "Пони из Стойла привыкли прятаться за металлом – в конце концов, именно в металлическом бункере мы пережили Последний день. Так что традицию прятаться за чем-то действительно тяжёлым мы сохраним и в нашей военной тактике."

GENSTABLE_superiority_of_skill_focus_idea: "Превосходство выучки"
GENSTABLE_superiority_of_skill_focus_idea_desc: "Служба безопасности станет символом истинного и непревзойдённого качества «Стойл-Тек»! Упор на тактику с использованием нашей любимой и высококвалифицированной службы безопасности позволит вести войну с минимально возможными потерями. Весьма полезно для Стойла с относительно небольшим населением."

GENSTABLE_trade_caravans_idea: "Торговые караваны"
GENSTABLE_trade_caravans_idea_desc: "Жители пустоши каждый день приходят к дверям нашего Стойла ради торговли. Их крышки – новая валюта пустоши – профинансировали наём экспертов и развитие нашей экономики. Поэтому мы продолжим производить всё больше товаров на продажу, а затем использовать прибыль для создания ещё большего количества вещей."

GENSTABLE_supremacy_of_metal_idea: "Превосходство металла"
GENSTABLE_supremacy_of_metal_idea_desc: "placeholder"



