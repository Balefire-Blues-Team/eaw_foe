generic_stable.1.t: "Построены на века"
generic_stable.1.d: "Стойла были возведены не просто для того, чтобы пережить удар жар-пламени, но и чтобы просуществовать до тех пор, пока поверхность не станет готова к возвращению пони. Все построенные глубоко под землёй Стойла в стандартной комплектации оснащались системой переработки пищи, гидропоникой и оранжереями для ведения сельского хозяйства, первоклассными медицинскими блоками, хорошо укомплектованной службой безопасности и всем остальным, что необходимо для жизни под землёй. Всё это было обещано каждому Стойлу.\n\nНо не все Стойла были созданы одинаковыми: им предоставляли разный уровень развития в различных сферах, благодаря чему каждое Стойло выработало свою специализацию. В некоторых Стойлах располагались огромные перерабатывающие машины, способные утилизировать любой материал и сделать его пригодным для повторного использования, что обеспечивало невероятную автономность. В других были выкопаны дополнительные помещения, отведённые под небольшие фабрики или мастерские, где пони Стойла могли производить всё необходимое – будь то сборка новых пипбаков или даже создание материалов для будущего расширения и модернизации Стойла. Третьи же стали домом для проведения самых передовых исследований в истории, а их лаборатории были забиты ресурсами и укомплектованы умнейшими учёными.\n\nУ каждого Стойла была своя специализация. Какая же досталась нам?"
generic_stable.1.a: "Исключительная автономность."
generic_stable.1.b: "Масштабное производство."
generic_stable.1.c: "Передовые лаборатории."

generic_stable.2.t: "Поколение основателей"
generic_stable.2.d: "Не бывает двух одинаковых пони: у каждого свои таланты, своя точка зрения и свой подход к делу. Именно поэтому в каждом Стойле сложился особый костяк основателей – группа, от которой произошли все остальные и которая сформировала культуру Стойла. Конечно, далеко не во всех Стойлах строго отбирали тех, кто войдёт внутрь: многие держали двери открытыми до последнего, принимая столько пони, сколько успело добраться, и тем самым увеличивая начальную численность населения.\n\nИ всё же две группы пользовались наибольшим предпочтением при отборе в Стойла. Многим ветеранам, сражавшимся за старую Эквестрию, предлагали первоочередное заселение. Они приходили со своим оружием и готовностью биться за новый дом, а их опыт передавался потомкам из поколения в поколение вплоть до сегодняшних дней. Другим же популярным выбором были социологи, менеджеры и инженеры – те, кто учился в лучших университетах и работал в крупнейших компаниях, особенно в самой «Стойл-Тек».\n\nКогда наши двери открылись в Последний день, кем были наши основатели?"
generic_stable.2.a: "Ветераны Великой войны."
generic_stable.2.b: "Инженеры и менеджеры."
generic_stable.2.c: "Все, кто только успел добраться."

generic_stable.3.t: "Что мы сделали"
generic_stable.3.d: "Когда в Последний день двери наконец захлопнулись, внешний мир остался снаружи. Пони едва могли поверить, что их дома, семьи, друзья... всё просто исчезло. Во вспышке зелёного света мир столь необратимо изменился, что поначалу это казалось нереальным. Пони оцепенело расходились по жилым блокам, а некоторые и вовсе пытались вести себя так, будто это был самый обычный день. Потребовалась неделя, чтобы осознание наконец пришло: прежнего мира больше нет, и теперь нужно искать путь вперёд. Хаос царил долгие недели, что было совершенно неудивительно, ведь пони нужно было смириться с мыслью, что они больше никогда не увидят поверхность. Теперь их главная и единственная цель – выживание. Но жизнь одним лишь выживанием была совершенно немыслима с точки зрения духа и культуры пони.\n\nМногие призывали определиться с целью, и эти споры затянулись как минимум на месяц. Одни хотели превратить наше Стойло в величественный город: эти пони считали, что нет ничего более способствующего единству, чем расширение самого Стойла и превращение его в подземный мегаполис. Другие убеждали вернуть привычную роскошь: роботы-слуги возьмут на себя всю работу (за исключением самых важных и творческих задач), пока пони отдыхают. Последняя группа шепталась о том, какие кошмары и монстры будут рыскать на поверхности, и призывала каждого пони готовиться к дню, когда двери нашего Стойла откроются, чтобы встретить грядущие ужасы во всеоружии.\n\nПосле долгих дебатов возобладало одно видение. Но какому из них суждено было закрепиться в нашем доме?"
generic_stable.3.a: "Подземный мегаполис."
generic_stable.3.b: "Роскошная жизнь."
generic_stable.3.c: "Готовность к худшему."

generic_stable.4.t: "Курс нашей промышленности"
generic_stable.4.d: "В нашем уголке Эквестрии возрождается осколок старого мира: тут да там появляются города и фабрики, работающие на основе науки и технологий «Стойл-Тек». Мы уже являемся промышленной державой, но на арене пустоши мы ещё новички, да и наша разносторонняя экономика пока не показала всего своего потенциала. Наше будущее зависит от специализации.\n\nКак и всегда, мы могли бы сосредоточиться на желаниях наших граждан – как жителей Стойла, так и обитателей пустоши – создав гражданскую промышленность, которой не будет равных. Укрепив гражданский сектор, мы сможем получать достаточно доходов для содержания мощного военно-промышленного комплекса. Конечно, учитывая наши фирменные утилизаторы и производство по методикам «Стойл-Тек», мы могли бы сосредоточиться на переработке и производстве материалов. Наши мусорщики могут разобрать даже ржавевшую под небом две сотни лет машину и превратить её в металл, пригодный для строительства домов, а полученные ресурсы мы могли бы пустить на развитие торговли и дальнейший рост. Впрочем, вся экономика мира бесполезна без сильной армии, способной её защитить. Мы могли бы вложить больше средств в наш военно-промышленный комплекс, создавая тяжёлую промышленность для производства высококачественного вооружения.\n\nПора сделать выбор."
generic_stable.4.a: "Массовое производство."
generic_stable.4.b: "Добыча и переработка."
generic_stable.4.c: "Тяжёлая военная промышленность."
generic_stable.4.x: "Нам нужны только роботы!"

generic_stable.5.t: "Специализация нашей армии"
generic_stable.5.d: "Обычная армия – это хорошо, но на просторах пустоши простого «хорошо» недостаточно: мы должны быть великими. А чтобы стать таковыми, нужно выбрать специализацию – решить, какой подход получит приоритет, и сформировать вокруг этой концепции всю нашу армию. В службе безопасности уже разгораются споры о том, какой курс будет наилучшим.\n\nПопулярное мнение склоняется к идее молниеносной войны: используя технику, которая перемещается быстрее любого пони, мы сможем обходить врага с флангов и уничтожать любые силы противника. Хотя это и усложнит удержание оборонительных рубежей, лучшая защита – это нападение. Впрочем, мы – пони из Стойла, и славимся прежде всего умением укрываться за бронёй и переживать то, что убило бы других на месте. Лучшая защита – это грандиозная оборона, способная встретить любого врага, подступившего к нам, шквалом свинца и неприступной линией укреплений. Наконец, многие утверждают, что рядовым пони не место на передовой, а сражаться должна только наша служба безопасности «Стойл-Тек». Благодаря выучке, броне и навыкам они смогут вести бой практически бесконечно, избегая больших потерь.\n\nПри столь разных мнениях сделать выбор непросто. Но в конечном счёте мы определились."
generic_stable.5.a: "Молниеносная война."
generic_stable.5.b: "Грандиозная оборона."
generic_stable.5.c: "Служба безопасности."
generic_stable.5.x: "Пусть лучше воюют роботы."



