### EVENTS ###
##############

generic_stable.1.t: "Built To Last"
generic_stable.1.d: "Stables weren't simply built to survive a Balefire blast, but to continue on until the surface was ready to be reclaimed by its dwellers. Built deep underground, every Stable would come standard with a food recycling system, systems to allow for sustainable agriculture, exceptional medical facilities, well-stocked Security, and all other manner of what's needed to survive underground. These are what every Stable was promised.\n\n But not every Stable is built the same, they were given different levels of development in different areas, allowing each Stable to develop its own speciality. Some Stables were home to large recycling machines, meant to recycle any material and make it mostly reusable, giving these Stables an exceptional amount of sustainability. Others had excess rooms dedicated to small factories or workshops, where Stable ponies could make whatever they could use, be it building new Pip-Bucks, or even making material to expand and upgrade the Stable as time went on. Many others were home to the best research the world's ever known, labs stocked with mass surpluses, and staffed by only the smartest.\n\n Every Stable had some specialty. What was ours?"
generic_stable.1.a: "Exceptional Sustainability"
generic_stable.1.b: "Outsized Manufacturing"
generic_stable.1.c: "Top Of The Line Labs"

generic_stable.2.t: "The Founding Generation"
generic_stable.2.d: "No two ponies are the same, every pony has a different talent, a different view, a different way of doing things. Of course, every Stable thus has a different founding cadre, a group from whom all others descend, those who built the culture of the Stable. Of course, not every Stable discriminated on who came inside, many of them kept their doors open as long as they could, welcoming as many ponies as they could fit, usually giving the Stable a larger starting size.\n\n Yet two groups were the most popular to allow into the Stables in particular. Many veterans, those who fought for old Equestria, were offered passes and tickets into Stables. They'd come with their weapons and their willingness to fight, and their experience would train their descendants, who would train their descendants, all the way to modern day. Yet another popular choice were the social scientists, the managers, and the engineers. Those who were educated in the finest of universities and served with the finest of companies, especially Stable-Tec proper.\n\n When our doors opened on the Last Day, who made up the majority of our founding cadre?"
generic_stable.2.a: "Veterans of the Great War"
generic_stable.2.b: "Engineers and Executives"
generic_stable.2.c: "As Many As We Could Allow"

generic_stable.3.t: "What We Did"
generic_stable.3.d: "When the doors finally closed on the Last Day, everything was quiet. It was hard to believe for ponies, that their homes, their family, their friends, were all. . . gone. In a flash of green light, the world changed, and it almost didn't seem real to begin with. Ponies reported numbly to their living quarters, some acting like it was just another day. It took a week for it to finally be realized, our world was gone, and now we need to find a way forward. Chaos reigned for weeks, it was only natural, ponies coming to terms with the fact they'd never see the surface again. That all they lived for now was survival. It was unsustainable, un-pony, to live for survival alone.\n\n Some argued for direction, and those debates lasted a month at least. Some wanted to turn our Stable into a grand city, many ponies thought that there's nothing more unifying than expanding the Stable itself, making it an underground metropolis. Others argued to revive the luxury ponies had come to know, robotic servants doing the work while ponies relaxed, except for those jobs that needed to be done by pony hooves. A final group whispered of what horrors would come from the surface, what monsters, what horrors, and they called for every pony to be prepared for the day our Stable doors opened, to prepare for the horrors beyond.\n\n After a long debate, only one vision came out on top. But which is it that claimed our home?"
generic_stable.3.a: "An Underground Metropolis"
generic_stable.3.b: "The Lap Of Luxury"
generic_stable.3.c: "Preparation For The Worst"

generic_stable.4.t: "Course Of Our Industry"
generic_stable.4.d: "All across our chunk of Equestria, a slice of the old world appears, cities and factories, powered by Stable-Tec science and technology. We are already an industrial power in our own right, but we are new on the wasteland scene, and our generalized economy has not proven as great as it could be. Our destiny will come through specialization of our economy.\n\n As always, we could focus on the desires of our citizens, dwellers and non-dwellers alike, building a civilian industry second to none. By strengthening the civilian sector, we can then generate enough revenue to sustain a massive military-industrial complex. Of course, given our Stable-Tec brand recyclers and manufacturing, we could lean more into our recycling and manufacturing of materials. Our scavengers can dismantle something as simple as a scrap car and turn it into metal fit to build a home with, and we could use this material to fuel our trade and build higher. Of course, though, all the economy in the world is useless without a strong military to protect it. We could invest more into our military-industrial complex, creating heavy industry producing the highest quality armaments out there.\n\n The choice is up to us alone to make."
generic_stable.4.a: "Mass-Market Production"
generic_stable.4.b: "Extraction And Refining"
generic_stable.4.c: "Heavy Military Industries"
generic_stable.4.x: "Robots Are All We Need!"

generic_stable.5.t: "Focus Of Our Army"
generic_stable.5.d: "A generalized army is good, but in the wasteland, good isn't good enough, we must be great. To be great, one must specialize, to decide one thing will get more over the other, a single concept that we can build the rest of our army around. Already, of course, many in the Security Forces are arguing over the best course of action to take.\n\n A popular belief is the idea of lightning warfare, that by using vehicles that move faster than any pony can, we can outmaneuver, overrun, and destroy all enemy forces. While this would make our defensive lines harder to hold, the best defense is a good offense. Of course, though, we are Stable ponies, and we are known for one thing above all, sitting behind cover and surviving the unsurvivable. The best defense is a brilliant defense, one that can punish any enemy who comes our way with hailstorms of bullets and a sturdy defensive line. Finally, many argue that the common pony has no place in the frontlines, but only our Stable-Tec Security Forces do. With their training, their armor, and their skills, they can fight on forever without losing many lives.\n\n With opinions so split, it is a difficult decision to make. But in the end, we decided."
generic_stable.5.a: "Lightning Warfare"
generic_stable.5.b: "A Brilliant Defense"
generic_stable.5.c: "Special Security Forces"
generic_stable.5.x: "Just Let The Robots Fight"



