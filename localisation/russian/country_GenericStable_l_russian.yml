### Ideas ###
#############

GenStable_supply_bunker: "Found Supply Bunker"
GenStable_supply_bunker_desc: ""

GENSTABLE_subterranean_builders_idea: "Perserverance"
GENSTABLE_subterranean_builders_idea_desc: "Out Stable is our home, and we are civilized ponies. Civilized ponies take their homes and change it, build it out and down and every which way, to make it larger, to make it a proper city. We will see our Stable become a great city, unmatched in the new world, one way or another."

GENSTABLE_hedonist_robotopia_idea: "Brilliance"
GENSTABLE_hedonist_robotopia_idea_desc: "With luxury given out to every citizen, many of our ponies have had time to become brilliant in their own chosen skills. Mechanists who otherwise would be too busy working in fields or kitchens are now working in workshops, day and night, making the tools of their own luxury. While our ponies are perhaps soft, and not willing to fight, they are brilliant to the last in every social manner."

GENSTABLE_paranoid_survivors_idea: "Vigilance"
GENSTABLE_paranoid_survivors_idea_desc: "When the monsters of the outside come to our Stable doors, when they try to knock it down and force their way in, we will be ready. Every mare, every stallion, every foal will have the basic training needed to protect their families, to protect their homes, from the horrors outside."

GENSTABLE_industry_massmarket_idea: "Consumer-Focused Industry"
GENSTABLE_industry_massmarket_idea_desc: "The civilian economy is at the forefront of production in our Stable now. Our civilian industry shall make us an industrial titan, who can then invest more into military later on. We will build something worth protecting, and we will use that to protect it."

GENSTABLE_industry_extraction_idea: "Resource-Focused Industry"
GENSTABLE_industry_extraction_idea_desc: "In order to make something, you need to have the materials to make it, you can't bake a cake without flour, after all. So our Stable will focus more on these foundational building-blocks, those materials with which useful things are made. The trade buying these raw materials will boost the rest of our economy, provided the wasteland stays stable enough."

GENSTABLE_industry_military_idea: "Military-Focused Industry"
GENSTABLE_industry_military_idea_desc: "The world is Tartarus nowadays, and one can't stay alive through money or material alone, not anymore. If we wish to have a country at all, we need to be willing to fight for it, to kill for it, to produce the very weapons that will protect it from the evil outside."

GENSTABLE_industry_robonomics_idea: "Automation-Focused Industry"
GENSTABLE_industry_robonomics_idea_desc: "We are already relying so much on our robotic servants, why not let them handle the factories as well? Their legs never tire, their morale never wavers and their mechanical eyes can catch impurities we'd never notice."

GENSTABLE_protectors_of_civilization_idea: "Protectors of Civilization"
GENSTABLE_protectors_of_civilization_idea_desc: "Stable-Tec is the home of the last true civilization to exist, us. Others have turned to savagery and violence, they would seek to destroy us, to destroy our home. We won't give them the chance, no, if they come, we will be ready. We will destroy any barbadians who knock on our gates."

GENSTABLE_lockstep_society_idea: "Political Lockstep"
GENSTABLE_lockstep_society_idea_desc: "All questions in the old ways of Stable-Tec have disappeared after a few minor reforms. Like always, our Stable dwellers will happily follow their Stable-Tec designated leadership, who will keep them safe, who will keep them in peace."

GENSTABLE_rebuilding_wastes_idea: "Rebuilding the Wastes"
GENSTABLE_rebuilding_wastes_idea_desc: "The old world died, and the current world sucks, so our Stable has looked beyond the now. We've looked to the tomorrow. To what's to come next. The future is just over the horizon, and we will be the first to find it. When the future comes, it will find our country ready and waiting."

GENSTABLE_isolationist_bastion_idea: "Isolationist Bastion"
GENSTABLE_isolationist_bastion_idea_desc: "The Wasteland is a scary and horrible place, it is no home to us Stable ponies, not really. We do not need any great swath of land, we do not need to be anything more than what we are. We'll keep our friends close, and our enemies at the business end of our rifles."

GENSTABLE_expansionist_nation_idea: "Expansionist Nation"
GENSTABLE_expansionist_nation_idea_desc: "There is no place greater than our country, and it would be selfish to keep it all to ourselves. Generosity is an Element of Harmony, so in the spirit of Generosity, we will spread our nation across the lands. Ponies might fight against us, but once they get a taste of Stable-Tec life, they'll never want to oppose us again."

GENSTABLE_superior_populous_idea: "Superior Populace"
GENSTABLE_superior_populous_idea_desc: "Our Stable is truly something special, it's something to which no wasteland nation can compare, no matter how hard they might try to copy us or appease us. Our nation is supreme, our people are superior, and it's time that the entire wasteland know this, it's time we demonstrate our supremacy."

GENSTABLE_technological_domain_idea: "Technological Domain"
GENSTABLE_technological_domain_idea_desc: "With great investment into our sciences and education, every facet of our society is growing all the more efficient. Bureaucrats, intelligent as can be, engineers encouraged to experiment, and well-read scientists prowl the land, fixing up everything they find."

GENSTABLE_rapid_advance_focus_idea: "Rapid Advance"
GENSTABLE_rapid_advance_focus_idea_desc: "The best defense is a great offense, and our Stable has chosen to focus our offensive maneuvers on vehicles. Uncommon in the wasteland by and large, vehicles and vehicle focused tactics will allow our Stable to outmaneuver and crush any who oppose us."

GENSTABLE_enduring_defense_focus_idea: "Enduring Defense"
GENSTABLE_enduring_defense_focus_idea_desc: "The ponies of the Stable are used to hiding behind metal, after all, it was hiding behind metal that saved our lives on the Last Day, long ago. We will keep alive the old ways of hiding behind a really heavy object in our military tactics."

GENSTABLE_superiority_of_skill_focus_idea: "Superiority of Skill"
GENSTABLE_superiority_of_skill_focus_idea_desc: "Stable-Tec Security Forces shall be Stable-Tec Quality, guaranteed! Focusing on tactics surrounding our beloved and highly skilled Security Forces will allow for warfare that will cost as few lives as possible. Useful for a Stable with a relatively low population."

GENSTABLE_trade_caravans_idea: "Trade Caravans"
GENSTABLE_trade_caravans_idea_desc: "Wastelanders come to the doors of our Stable every day, knocking and coming in to trade with us. Their caps, the currency they use, have funded our hiring of experts and the improvement of our economy. We'll just keep building more materials to trade with, and then use the profit from that trade to build even more materials."

GENSTABLE_supremacy_of_metal_idea: "Supremacy of Metal"
GENSTABLE_supremacy_of_metal_idea_desc: "placeholder"



### Advisors ###



