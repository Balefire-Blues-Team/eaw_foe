l_russian: 

##################
### FOCUS TREE ###
##################

genstable_opening1: "Стойло"
genstable_opening1_desc: "Когда приближался Последний день, «Стойл-Тек» пообещала нам новый дом, расположенный под землёй. Стойло – это наше сердце, Стойло – наша родина, Стойло – это... всё. Но не все Стойла были построены одинаковыми, и насколько обитатели формируют Стойло, настолько и само Стойло формирует своих обитателей."

genstable_opening2: "Обитатели"
genstable_opening2_desc: "Даже если бы каждое Стойло было построено одинаковым, а это совсем не так, его обитатели всегда отличались друг от друга. В каждом Стойле укрылись совершенно различные пони, спрятавшиеся под землёй от обрушившегося на Эквестрию жар-пламени. И влияние нашего первого поколения ощущается и по сей день."

genstable_opening3: "Цель"
genstable_opening3_desc: "Двести лет под землёй – долгий срок, особенно когда дни сменяются лишь по воле стрелок часов, а само время кажется чем-то призрачным. Пони сошли бы с ума, работая без какой-либо цели, ведь превыше всего им нужен высший замысел. И поэтому мы дали им цель."

genstable_building_down: "Строим всё глубже"
genstable_building_down_desc: "Стойло обладает развитым производством и богатыми ресурсами, а также имеет всю необходимую инфраструктуру для дальнейшего расширения наших подземных помещений. Вооружившись бурами, взрывчаткой и инженерными знаниями, мы вгрызёмся ещё глубже в недра земли."

genstable_activate_reactors: "Активация резервных реакторов"
genstable_activate_reactors_desc: "Мир снаружи в последнее время стал куда более... беспокойным. Слухи, которые мы ловим по радиоволнам дикарей, говорят о разгорающемся вокруг нас конфликте. Хотя резервные генераторы предназначены только на случай отказа основных, пришло время включить и их. Мы будем готовы к любому развитию событий."

genstable_expand_purification: "Расширение очистки воды"
genstable_expand_purification_desc: "Каждому пони нужна еда, кров и, самое главное, вода. Без еды можно прожить три недели, без крова – три месяца, но без воды – всего три дня. Вода на поверхности сама по себе крайне далека от чистой, так что пришло время напоить наше Стойло чистейшей водой."

genstable_craft_guns: "Производство нового оружия"
genstable_craft_guns_desc: "В Стойле полно неиспользуемого пространства вроде старых комнат, которые больше никто не занимает. Учитывая опасности на поверхности, пришло время задействовать эти пустующие площади и использовать их для подготовки к будущей обороне. Прежних запасов явно более недостаточно."

genstable_consumer_manufacturing: "Производство для нужд обитателей"
genstable_consumer_manufacturing_desc: "В Стойле полно неиспользуемого пространства вроде старых комнат, которые больше никто не занимает. Пусть на поверхности и опасно, но для нас куда ценнее благополучие наших собственных обитателей и граждан. Мы переоборудуем эти пустующие помещения под производство товаров для жителей Стойла."

genstable_repurpose_maintenance: "Переоборудовать техническое крыло"
genstable_repurpose_maintenance_desc: "Одного лишь базового обслуживания нам уже недостаточно. Да, оно крайне важно, но нам нужно не просто ремонтировать, а создавать. Поэтому мы возьмём уже имеющиеся там материалы и сместим фокус с одного только ремонта на исследования и производство."

genstable_recycle_technology: "Переработка технологий военного времени"
genstable_recycle_technology_desc: "В нашем Стойле хранится множество пережитков старого мира – устройств, которые пылились без дела просто потому, что перестали быть полезными. Пришло время вскрыть эти приборы, изучить принцип их работы и разработать на их основе более полезные технологии."

genstable_underground_chorapolis: "Подземный Хораполис"
genstable_underground_chorapolis_desc: "С завершением последних штрихов в расширении нижних уровней наше Стойло превратилось в настоящий индустриальный центр, какого на пустошах ещё не видывали. По всему Стойлу пони трудятся на фабриках, создавая оружие и технологии, достойные стандартов «Стойл-Тек»."

genstable_building_out: "Выход на поверхность"
genstable_building_out_desc: "Стойло – наш дом, но каждой птице рано или поздно приходится покидать гнездо. Поверхность безопасна для расселения, а персонал службы безопасности уже выдвинул претензии на новые земли, населённые обитателями пустоши. Пришло время шагнуть навстречу новому и учиться у этих незнакомцев, ставших нашими соседями."

genstable_settle_countryside: "Освоение сельской местности"
genstable_settle_countryside_desc: "Пусть солнце и скрыто за облаками, но очень многие пони всю жизнь ждали возможности ощутить под ногами землю, увидеть траву и деревья. Поверхность, конечно, ужасна по сравнению с тем, каким был мир раньше, но она всё ещё прекрасна – и она по-прежнему принадлежит нам, простым пони."

genstable_seize_opportunities: "Использование возможностей"
genstable_seize_opportunities_desc: "Некоторые из наших новых соседей по пустоши рассказали нам о своей недавней находке – довоенных руинах неподалёку, где могут храниться ценные припасы. Хотя мы пока не знаем, чем именно они нам помогут, мы отправим экспедицию на их поиски и, надеемся, найдём что-то полезное."

genstable_room_to_grow: "Простор для роста"
genstable_room_to_grow_desc: "Поверхность широка и очень слабо заселена по сравнению с тесным и переполненным Стойлом. Нашим фабрикам больше не нужно экономить каждый квадратный метр, что позволит смелее экспериментировать с различными методами и технологиями производства."

genstable_industrialize_surface: "Индустриализация поверхности"
genstable_industrialize_surface_desc: "Большая часть поверхности до сих пор заполнена лишь пахотными землями да мелкими мастерскими, далёкими от тех масштабов, к которым мы привыкли под землёй. Но не стоит беспокоиться – Стойло спешит на помощь с качеством и улыбкой «Стойл-Тек»!"

genstable_connect_realm: "Соединяя нашу державу"
genstable_connect_realm_desc: "Один из минусов жизни на поверхности – это огромные расстояния. Нельзя просто сесть в лифт и оказаться там, где тебе нужно. Хотя, постойте... если мы построим поезда, это будет практически тот же лифт, только едущий куда угодно. Так приступим же! Ну или остановимся на автомобилях или хотя бы обычных дорогах."

genstable_foundries_dot_land: "Литейные заводы"
genstable_foundries_dot_land_desc: "Наши перерабатывающие и производственные машины производства «Стойл-Тек» сослужили нам хорошую службу, да и устроены они вполне понятно. На поверхности полно бесхозного, никем не используемого сырья. Пора открыть литейные заводы по всем нашим новым землям, превращая бесполезный мусор в полезные материалы."

genstable_smokestacks_and_cities: "Дымящие трубы и города"
genstable_smokestacks_and_cities_desc: "Теперь на поверхности появился небольшой кусочек нашего дома. Тесные города, полные фабрик и заводов, которые производят всё на свете: оружие, гражданские товары и прочие вещи со знаком качества «Стойл-Тек». Однако если мы хотим вывести нашу экономику на новый уровень, нам пора переходить к специализации."

genstable_our_governance: "Наша система управления"
genstable_our_governance_desc: "Контакт с внешним миром – будь то радиосигналы, непрошеные гости или торговля – заставил наших жителей задуматься о том, правилен ли наш уклад жизни. Он исправно работал на протяжении двухсот лет, но продолжит ли он функционировать и дальше в новом мире?"

genstable_empower_security: "Усиление службы безопасности"
genstable_empower_security_desc: "Безопасность нашей нации обеспечивается не многословными речами и не самоуспокоением, а рождается из действий наших защитников. Служба безопасности Стойла провела нас через Последний день, защищала нас и поддерживала порядок. Поэтому смотрительница по праву наделит их властью. Пришло время нашим защитникам получить заслуженное уважение и контроль над нацией."

genstable_steady_as_she_goes: "Идём прежним курсом"
genstable_steady_as_she_goes_desc: "Двести лет мы выживали и процветали, а теперь продолжим в том же духе ещё два следующих века. Твёрдое копыто удерживало нас на плаву всё это время, так зачем раскачивать лодку? Мы останемся верны нашим традициям."

genstable_let_dwellers_choose: "Пусть жители решают"
genstable_let_dwellers_choose_desc: "Наше будущее не должна определять ни вооружённая до зубов служба безопасности, ни единоличное решение лидера. Пришла пора провести внеочередные выборы и референдум. Это будущее обитателей Стойла, и только им выбирать, каким путём мы пойдём дальше."

genstable_safeguard_way_of_life: "Защитить наш уклад жизни"
genstable_safeguard_way_of_life_desc: "Обитатели пустоши завидуют нам, жителям Стойла. Они говорят, что нам всё даётся легко, ведь им незнакомы наши невзгоды. Может не прямо сейчас, но со временем они точно явится за нами. Когда они постучат в наши двери, останетесь ли вы сидеть сложа копыта? Или встанете на защиту своего дома? Вступайте в службу безопасности «Стойл-Тек» сегодня! Защитите наш дом, наше сердце, наши традиции!"

genstable_dont_rock_boat: "Не раскачивайте лодку!"
genstable_dont_rock_boat_desc: "Простейшим способ усиления администрации нашего Стойла – небольшое расширение состава правления без уступок в пользу радикалов и экстремистов. В качестве советников будут приглашены промышленник и социолог, которые и помогут скорректировать наш курс."

genstable_into_wide_world: "В бескрайнюю пустошь"
genstable_into_wide_world_desc: "Мы больше не можем просто сидеть сложа копыта и смотреть, как мир проходит мимо. Мы стоим на пороге великих перемен. По всей пустоши великие пони и не только ведут свои нации к новым высотам, которые раньше казались немыслимыми. И мы будем там: плечом к плечу с ними, после чего наши имена войдут в учебники истории."

genstable_beacon_of_civilization: "Маяк цивилизации"
genstable_beacon_of_civilization_desc: "Многие в Эквестрии и за её пределами опустились до ужаснейших злодейств в попытках выжить. Культы, занимающиеся убийством жеребят, рейдеры, возомнившие себя спасителями, безумные техно-рыцари, считающие себя силой старого мира – наш мир стал тёмным и жестоким. Мы – всё, что осталось от прежнего уклада. Мы и есть цивилизация."

genstable_undisputed_leadership: "Беспрекословное лидерство"
genstable_undisputed_leadership_desc: "Даже экстремисты, подвергавшие сомнению наш уклад жизни, со временем приутихли, уверенные в правильности курса Стойла. Мы продолжим идти по прежнему пути, а пони, как и прежде, пойдут за нами."

genstable_build_something_new: "Построить что-то новое"
genstable_build_something_new_desc: "Старая Эквестрия не смогла спасти себя, «Стойл-Тек» не сумело уберечь подавляющее большинство пони, а лидеры пустоши и вовсе толком ничего не добились. Эти старые идеологии именно таковы – старые, устаревшие и бесполезные. Пришло время перестать подражать прошлому и создать нечто совершенно новое."

genstable_now_know_wastes: "Знание пустоши"
genstable_now_know_wastes_desc: "Пустошь, бывшая когда-то таинственным и неизведанным местом, теперь нам отлично знакома. Хотя нас и близко нельзя назвать обитателями пустоши, мы знаем местные обычаи, земли и народы. И со временем мы будем познавать их всё глубже."

genstable_preserve_paradise: "Сохранить райский уголок"
genstable_preserve_paradise_desc: "Очевидно, что мы уже построили нечто прекрасное – место, где пони счастливы, находятся в безопасности и процветают. Каждый наш шаг вовне, каждая новая интегрированная провинция – это шанс для прихода хаоса, смерти и разрушения. Пора начать довольствоваться достигнутым. Пришло время создать настоящий рай."

genstable_proclaim_new_nation: "Провозгласить новую нацию"
genstable_proclaim_new_nation_desc: "Мы стали чем-то большим, чем просто Стойлом, что тесно связано с нашими корнями и прошлым. Мы – нечто совершенно новое в этом мире. Стойло станет нашей столицей, а каждая провинция – новым домом, ведь мы провозглашаем себя полноценным, новым государством пустоши."

genstable_enslave_wastelanders: "Поработить жителей пустоши"
genstable_enslave_wastelanders_desc: "Обитателям пустоши известны лишь лишения и рознь, так с чего бы им понимать ценность роскоши и счастья так, как их понимает пони из Стойла? Два века они брызгали слюной и грызлись друг с другом, словно бешеные псы. Что ж, отлично. Пришла пора посадить их на поводок и обучить манерам."

genstable_cling_old_world: "Блюз старого мира"
genstable_cling_old_world_desc: "Старая Эквестрия в наших рассказах – это край мифов и легенд, где каждый пони был счастлив. Где каждый мог вернуться домой сытым и в окружении верных друзей. Возможно, у нас больше нет зелёной травы и радуг старого мира, но мы способны построить хотя бы маленький его уголок прямо здесь, среди руин."

genstable_let_none_interfere: "Копыта прочь!"
genstable_let_none_interfere_desc: "Наше Стойло – это рай, которому нет равных. Пусть пустошь попробует бросить нам вызов: её встретят лишь штыки да стволы нашего оружия. Мы будем жить счастливо и не позволим никому нами заправлять."

genstable_expand_our_borders: "Расширить наши границы"
genstable_expand_our_borders_desc: "Наше новое государство не устраивают текущие территории, и, как подобает любой уважающей себя стране, нам пора расширить границы, чтобы принять других под сень нашего величия. Качество «Стойл-Тек» укажет нам путь, и в конце концов пони пустоши ещё будут нам благодарны."

genstable_superior_in_every_way: "Превосходство во всём"
genstable_superior_in_every_way_desc: "Мы изучили устои пустоши, и они оказались несовершенными. Их привычки и культура – всё это столь... убого по сравнению с нашим укладом жизни. Немытые фермеры из ополчения полагают, будто у них есть шанс против сил безопасности «Стойл-Тек». Мы вежливо – и совершенно обоснованно – с этим не согласны."

genstable_secure_our_domain: "Обезопасить наши владения"
genstable_secure_our_domain_desc: "Единственный способ сохранить наш уголок старого мира – изучать и применять на практике его устои. Мы сделаем наши исследования, производство и строительство настолько эффективными, насколько это вообще возможно."

genstable_concerns_of_security: "Вопросы безопасности"
genstable_concerns_of_security_desc: "Наши силы безопасности отлично вооружены, но им не хватает опыта. Как бы хорошо нас ни обучали, никто из нас не видел настоящей войны. Мы соберём высший состав сил безопасности и выслушаем их соображения касательно возможных будущих конфликтов."

genstable_i_can_see_sky: "Здравствуй, небо"
genstable_i_can_see_sky_desc: "Облака полностью затянули небо, но для нас, пони из стойла, даже эта серая пелена находится на невероятной высоте. Пока одних тошнит или мутит от одного лишь взгляда на бескрайнюю серую высь, многие другие во всеуслышание заявляют о своём желании взмыть к ней."

genstable_crack_open_armories: "Вскрыть арсеналы"
genstable_crack_open_armories_desc: "В стойле всё ещё остаётся несколько арсеналов из прошлого, чьё снаряжение так и не пригодилось бойцам сил безопасности. В этих хранилищах могут найтись ценные припасы и сведения, полезные в нашей текущей ситуации. Давайте вскроем одно из них и посмотрим, что внутри."

genstable_thats_alotta_water: "Сколько же воды!"
genstable_thats_alotta_water_desc: "Море огромно – куда огромнее, чем пони из Стойла способны себе вообразить. Когда самый большой водоём, к которому ты привык – это маленький бассейн, столь внушительный массив воды *несколько* сбивает с толку. И всё же многие мечтают исследовать эту бескрайнюю водную гладь."

genstable_fly_like_pegasus: "Летать, подобно пегасу"
genstable_fly_like_pegasus_desc: "В Стойло попало совсем мало пегасов, но те немногие, что есть в нашем распоряжении, вызвались добровольцами для наших исследователей. В конце концов, именно пегасы послужили прообразом для первых летательных аппаратов, пока облачные корабли не стали самым распространённым воздушным транспортом."

genstable_outfit_our_best: "Снарядить самых лучших"
genstable_outfit_our_best_desc: "В войнах побеждает качество, а количество лишь заполняет гробы. За наше место в мире будут сражаться только самые лучшие, непоколебимо верные и превосходно подготовленные силы безопасности «Стойл-Тек»."

genstable_swim_like_fish: "Плавать как рыбы"
genstable_swim_like_fish_desc: "Рыбы – это пони морей... Ну, вообще-то, согласно старым книгам по истории, это морские пони, но и рыбы тоже сойдут. Они как птицы морей. Они плавают в воде, а мы хотим плавать по поверхности воды. Короче, мы породнимся с рыбами, создав более совершенные корабли. Станем морскими пони. Только не в буквальном смысле."

genstable_stable_built_vehicles: "Машины производства Стойла"
genstable_stable_built_vehicles_desc: "Хотя в самом Стойле по очевидным причинам машины ездить не смогут, на поверхности куда больше места, поэтому транспорт даст нам огромное преимущество над вражескими силами. К счастью, у нас сохранились старые чертежи, так что давайте разберёмся, с какой стороны крепить колёса."

genstable_rapid_fire_guns: "Скорострельное оружие"
genstable_rapid_fire_guns_desc: "Если вам нужен хороший солдат, не стоит давать ему самое точное оружие в мире, ведь солдаты и в лучшие-то времена не отличаются меткостью. Вместо этого нужно дать им то, что способно сеять максимум смерти в нужном направлении с минимальными усилиями. Скорострельные пушки идеально подходят для этой задачи. Осталось только отучить наших солдат называть пулемёты «даккой» – это некультурно."

genstable_time_marches_on: "Время не ждёт"
genstable_time_marches_on_desc: "Теперь, когда базовые реформы затронули каждый аспект армии, пришла пора решить, в чём именно наши войска будут сильны. Поведут ли силы безопасности нас вперёд, станем ли мы полагаться на скорость и технику, или же верх возьмёт оборонительный характер действий?"

genstable_matters_of_science: "Вопросы науки"
genstable_matters_of_science_desc: "В отличие от многих других уголков пустоши, в Стойлах действует всеобщее образование, обязательное для жеребят. Каждый пони в Стойле грамотен, знаком с основами научных знаний и владеет критическим мышлением. Инвестиции в науку позволят нашему образованию оставаться на высочайшем уровне, намного опережая любую державу пустоши."

genstable_refit_maintenance_robots: "Переоборудовать ремонтных роботов"
genstable_refit_maintenance_robots_desc: "У нас есть множество роботов, занятых обслуживанием Стойла, но, честно говоря, это нерациональное использование их возможностей. Мы заберём часть машин и заменим их детали на боевые компоненты, а заодно изучим их получше и научимся воспроизводить и совершенствовать изначальную конструкцию."

genstable_keep_dwellers_healthy: "Забота о здоровье"
genstable_keep_dwellers_healthy_desc: "Здоровое общество – это счастливое общество. Профилактика всегда предпочтительнее лечения, поэтому мы должны обеспечить каждому жителю базовый уровень ухода и медицинского обслуживания, чтобы наши клиники не оказались перегружены в случае чрезвычайных ситуаций."

genstable_equestrian_military_robotics: "Эквестрийские военная робототехника"
genstable_equestrian_military_robotics_desc: "Хотя у нас нет чертежей и схем роботов, сражавшихся против зебр два века назад, в наших книгах сохранились их описания и изображения. Изучив собственных ремонтных роботов, мы сможем превратить эти старые слова и рисунки в живые – хоть и не дышащие – боевые машины."

genstable_access_databanks: "Доступ к базам данных"
genstable_access_databanks_desc: "В Стойле хранится множество архивов, многие из которых последний раз открывали больше сотни лет назад. И хотя значительная часть этой информации считается бесполезной для большинства пони, мы не знаем, что именно может привести к научному прорыву. Мы создадим команду архивариусов, которая займётся изучением этих старых данных."

genstable_improve_farming: "Усовершенствовать сельское хозяйство"
genstable_improve_farming_desc: "Каждому пони нужно питаться, таковы реалии жизни, а наши нынешние сельскохозяйственные методики «Стойл-Тек» не смогут поддерживать растущее население. Если мы хотим быть готовыми к будущему, нужно предотвратить даже шанс голода и нехватки продовольствия. Пора вложиться в аграрные науки."

genstable_200_years_data: "200 лет данных"
genstable_200_years_data_desc: "Стойла отчасти задумывались как социальный эксперимент, в рамках которого можно изучать жизни пони и применять полученные знания в мире после Последнего дня. В наших базах данных хранятся результаты двухсотлетних исследований, про которые, откровенно говоря, попросту позабыли. Мы наймём ещё архивариусов для изучения этих данных, которые имеют шанс пролить свет на тайны природы пони."

genstable_support_security_effort: "Поддержать силы безопасности"
genstable_support_security_effort_desc: "Наука и образование – это важно, но без достойных сил безопасности мы не можем быть уверены, что эти знания у нас не отнимут силой. Мы направим нескольких учёных для работы бок о бок с силами безопасности: вместе они смогут усовершенствовать наше снаряжение и воинскую выучку."

genstable_smartest_people_wasteland: "Раскрытый гений"
genstable_smartest_people_wasteland_desc: "«Я плачу не по Троттенгеймеру, который жил и умер прославленным учёным, а по пяти сотням несостоявшихся Троттенгеймеров, что угасли и сгинули на фермах и в шахтах, так и не получив возможностей проявить себя». Эти слова мудрого пони из старой Эквестрии мы приняли близко к сердцу. В нашем Стойле отныне ни один пони не лишится шанса доказать миру свой ум и гений."

genstable_boring_survivalism: "Выживание в новом мире"
genstable_boring_survivalism_desc: "Радикализм не приведёт нашу страну к величию, но и сохранение прежнего уклада нас не спасёт. Единственный способ для нашего Стойла процветать – это готовность меняться со временем, став живой, полноценной страной. Страной, которая выживет."

genstable_maximum_recycling: "Безграничная... переработка!"
genstable_maximum_recycling_desc: "В нашем Стойле переработка отходов налажена лучше всего в мире – ну или хотя бы в том небольшом его уголке, что нам довелось увидеть. Пора предоставить этому отделу неограниченные полномочия и ресурсы, чтобы они выдавали всё больше материалов, с помощью которых мы сможем построить светлое будущее."

genstable_reach_out_trade: "Торговля Стойла"
genstable_reach_out_trade_desc: "Пусть пони со всей пустоши приходят полюбоваться нашим старым добрым Стойлом: пусть предлагают нам свои безделушки, а мы дадим им полезные материалы в обмен. Мудрый пони однажды сказал, что торговля спасёт пустошь – что ж, пусть «Стойл-Тек» вновь вспомнит свои коммерческие корни, а мы будем во главе этого процесса!"



