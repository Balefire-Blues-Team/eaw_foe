l_russian:
 # All localisation done by Zapdude.
 #----------------------------
 # Labels/headers Doctrine
 #----------------------------
  HEADER_SPECIAL_FORCES_DOCTRINE:0 "Специальные операции"
 SPECIAL_FORCES_DOCTRINE_DESC:0 "Рожденные из горнила второй худшей войны в мире, спецназ выполняет множество важных ролей, и являются самым лучшим из того, что может предложить нация."
 HEADER_AIR_DOCTRINE:0 "Воздушная тактика"
 AIR_DOCTRINE_DESC:0 "Они говорили, что небо это предел, но с кустарными ядерными двигателями и самолётами из металлолома мы можем доказать им, что небо - только начало."
 HEADER_NAVY_DOCTRINE:0 "Военно-морская тактика"
 NAVY_DOCTRINE_DESC:0 "Самая великая империя в истории, чьи земли по размеру были равны луне, правила не только своими подданными. Она правила волнами."

  special_forces: "Щёлкните здесь!"
 #----------------------------
 # Localisation Tech Doctrine Monsters and Machines
 #----------------------------
  one_mind:0 "Единый разум"
  one_mind_desc:0 "Самый большой недостаток, от которого страдает большинство армий - это недопонимание. Генералы могут отдавать противоречивые приказы, а солдаты - по-разному интерпретировать их. Нам не нужно беспокоиться об этом, поскольку мы не оставляем места для несогласия или противоречивых идей. Есть только один план, и все должны ему следовать."
  rad_resistance:0 "Сопротивление к радиации"
  rad_resistance_desc:0 "Когда миру пришёл конец, то его окутало магическое излучение - побочный продукт жар-бомб. Слабые существа тяжело заболевают и даже погибают от контакта с этим излучением. Мы же лишены такой слабости. Радиация не убивает нас, а только делает сильнее."
  created_by_balefire:0 "Рождены в жар-пламени"
  created_by_balefire_desc:0 "Мы обязаны своим существованием радиации. Это то, что дало нам жизнь и тела, а также возвысило нас над низшими существами."
  supernatural_intuition:0 "Сверхъестественная интуиция"
  supernatural_intuition_desc:0 "У нас есть третье чувство, которое низшие существа считают сверхъестественным. Оно позволяет нам с достаточной точностью предугадывать события до того, как они произойдут. И это позволяет нам планировать будущие действия гораздо более эффективно."
  unnatural_selection:0 "Неестественный отбор"
  unnatural_selection_desc:0 "Наши инстинкты отточены не только суровой жизнью в пустоши, но и быстрой эволюцией под воздействием радиации. Мы быстрее, сильнее и выносливее любого другого существа."
  infernal_knowledge:0 "Проклятые знания"
  infernal_knowledge_desc:0 "Мы живем очень долго. За свою жизнь мы многое узнали о выживании в пустошах. Никто не может таиться в тенях или устраивать засады эффективнее нас."
  gifts_of_radiation:0 "Дары радиации"
  gifts_of_radiation_desc:0 "Мы - высшие хищники этого нового мира. Мы те существа, которые покажут всем остальным, кто действительно доминирует в пустоши."
  no_need_for_rest:0 "Сон для слабаков"
  no_need_for_rest_desc:0 "Нам не нужно спать, в отличие от органиков. Мы способны маршировать или даже безжалостно сражаться, не тратя время ни на сон, ни на отдых."
  the_flesh_is_weak:0 "Плоть слаба"
  the_flesh_is_weak_desc:0 "Плоть слаба, она легко пробивается и быстро истекает кровью. Органики будут быстро умирать, если мы нацелимся на их плоть."
  factory_ai:0 "Фабрики под контролем ИИ"
  factory_ai_desc:0 "Органические фабрики неэффективны и подвержены неприятным вещам вроде забастовок и стачек. Полная автоматизация наших заводов гарантирует, что на производственных линиях не будет никаких задержек, а промышленность будет работать с максимально возможной эффективностью."
  age_of_the_machine:0 "Эпоха машин"
  age_of_the_machine_desc:0 "Эпоха органиков подошла к концу. Началась эпоха машин!"
  
  
  
  
 #----------------------------
 # Localisation Tech Doctrine Elite Forces
 #----------------------------
 adaptive_chain_of_command:0 "Гибкая иерархия"
 adaptive_chain_of_command_desc:0 "Несмотря на все усилия, пони имеют свойство гибнуть в бою. Если офицер пал в бою, его подчинённые должны быстро выбрать замену и вернуться в бой.\n\n"
 walking_fire:0 "Стрельба на ходу"
 walking_fire_desc:0 "Наши войска должны не только быть готовы к быстрому развёртыванию, но ещё и уметь веси огонь в движении. Пулемётчики должны быть готовы менять позицию за позицией, пока основные силы наступают.\n\n"
 hit_and_run:0 "Бей-и-беги"
 hit_and_run_desc:0 "У нас нет столько солдат, чтобы бездумно наступать. Мы должны использовать другие тактики. Мы должны действовать быстро, ударять по самому незащищённому месту врага, а затем отступать.\n\n"
 walking_tanks:0 "Ходячие танки"
 walking_tanks_desc:0 "Силовая броня - это одно из величайшее изобретение Старого Мира, которое ещё больше раскрыло себя во время пост-апокалипсиса. Однако, взамен почти полной защиты, нам приходится тратить много времени на подготовку солдат.\n\n"
 scorched_earth:0 "Выжженная земля"
 scorched_earth_desc:0 "Что ещё есть у этих жалких отбросов, кроме их поселений? Они нам не нужны, а, значит, должны быть стёрты с лица земли. Мы уничтожим их поселения, сожжём всё дотла, и засыпем землю солью, чтобы на ней больше ничего не росло.\n\n"
 recon_in_depth:0 "Внедрение разведчиков"
 recon_in_depth_desc:0 "Недостаточно просто патрулировать свою землю. Мы должны разослать разведчиков по всей Пустоши, чтоб они искали следы древних технологий и делали так, чтобы эти технологии не попали в копыта дураков. Наша огромная сфера влияния позволит получать более точную информацию.\n\n"
 brigades_of_steel:0 "Защитники Праведности"
 brigades_of_steel_desc:0 "Силовая броня - это более, чем просто броня, это - символ. Наши пони чувствуют себя защищёнными рядом с солдатами в силовой броне. Они знают, что эти жеребцы и кобылы встанут на их защиту против подавляющих сил врага и дадут им отступить.\n\n"

 #----------------------------
 # Localisation Tech Doctrine Grand Army
 #----------------------------
  military_propaganda:0 "Военная пропаганда"
  military_propaganda_desc:0 "Ещё во время Великой Войны Министерство Стиля использовало пропаганду как для поддержания боевого духа солдат Эквестрии, так и чтобы убедить побольше гражданских записаться в армию. Может быть, нам удастся кое-чему у них научиться?"
  veteran_commanders:0 "Командиры-ветераны"
  veteran_commanders_desc:0 "Если мы повысим наших самых опытных солдат до офицеров, то гарантируем, что наше военное руководство будет компетентным и эффективным."
  combined_arms:0 "Комбинированные силы"
  combined_arms_desc:0 "Наша армия функционирует как хорошо смазанная машина, где каждая часть выполняет свои обязанности и делает именно то, что от неё и ожидают."
  
  
 #----------------------------
 # Localisation Tech Doctrine Slave Army
 #----------------------------
  
 slave_builders:0 "Рабы-строители"
 slave_builders_desc:0 "Вся наша нация построена на рабском труде, и это не изменится в ближайшее время. Все наши здания, начиная от домов и закачивая фабриками, были построены рабами."
 supply_caravans:0 "Караваны снабжения"
 supply_caravans_desc:0 "Снабжение наших солдат крайне важно для ведения войны. Чтобы обеспечить их всем необходимым, мы заставим наших рабов переносить все необходимые материалы и снаряжение."
 born_into_service:0 "Рождены для службы"
 born_into_service_desc:0 "Когда рождается новый раб, его забирают в армию и с самых юных лет обучают служить. Защита нашей нации является первейшим и главнейшим приоритетом, и мы должны быть уверены, что у нас всегда есть хорошо обученные солдаты, готовые вступить в бой в любой момент."
 waves_of_flesh:0 "Волна плоти"
 waves_of_flesh_desc:0 "Мы погребём наших врагов под бесконечной волной из солдат. У наших противников точно быстрее закончатся патроны, чем у нас солдаты."
 chained_legions:0 "Заградотряды"
 chained_legions_desc:0 "Солдаты гораздо охотнее наступают вперёд, когда за их спинами стоит верная смерть. Наши рабы с радостью воспользуются шансом умереть от вражеской пули, потому что альтернатива - смерть от своей собственной."
 bred_not_born:0 "Рождены для войны"
 bred_not_born_desc:0 "Нам всегда нужно как можно больше солдат, чтобы поскорее отправить их в мясорубку. Для этого мы создадим специальные программы по размножению среди наших рабов."
 secure_homefront:0 "Надёжный тыл"
 secure_homefront_desc:0 "Мы не можем допустить разброда в тылах, пока нас отвлекают враги. Сначала мы должны убедиться, что дома у нас всё в порядке. Лишь после этого мы сможем решать проблемы за пределами наших границ."
 ravage_new_lands:0 "Разорить новые земли"
 ravage_new_lands_desc:0 "Нашим войскам известно только одно направление: вперёд! Подобно рою саранчи, мы окутываем новые земли, подавляя всякое сопротивление и включая их в состав нашего государства."
 pressed_into_service:0 "Вынужденный призыв"
 pressed_into_service_desc:0 "Эй, ты там! Ты выглядишь здоровым, покажи-ка мне свои зубы... Вроде бы всё в порядке. Ну всё. Сынок, ты теперь солдат. Вот тебе винтовка и два магазина, используй их с толком!"
 #----------------------------
 # Localisation air doctrine tech
 #----------------------------
  formation_flying_doctrine:0 "Лётные формации"
 formation_flying_doctrine_desc:0 "У нетренированных пилотов есть привычка летать так, что они случайно закрывают собой поле зрения напарника. Этот недостаток может быть нивелирован разработкой специальных формаций."
 fighter_sweeps_doctrine:0 "Рейды на аэропорты"
 fighter_sweeps_doctrine_desc:0 "Вражеская авиация представляет гораздо больше угрозы в небе, чем на земле. Отдавая нашим истребителям приказы на атаку вражеских аэропортов, они смогут уничтожить самолёты противника сразу же после того, как они успеют взлететь."
 formation_fighting_doctrine:0 "Боевые формации"
 formation_fighting_doctrine_desc:0 "Когда самолётом является индивидуальная и не скоординированная единица, она открывает врагам свои слабости. Боевая формация должна послужить решением этой проблемы, как и средством повышения связей с другими пилотами."
 forward_interception_doctrine:0 "Перехват на упреждение"
 forward_interception_doctrine_desc:0 "Ежели ты знаешь, что враг на подходе - ждать его нет смысла. И хоть это рискованнее, фокусировка на бои с вражескими бомбардировщиками поможет сохранить наши заводы и наших пони."
 layered_airzones_doctrine:0 "Слоистые воздушные зоны"
 layered_airzones_doctrine_desc:0 "Порой одного захода просто недостаточно. Деление наших патрульных зон на несколько слоёв может быть и уменьшит максимальное количество территорий, которые мы сможем покрыть, но увеличит шанс поймать врага, пытавшегося проскользнуть через наши патрули."
 multirole_bombers_doctrine:0 "Многоцелевой бомбардировщик"
 multirole_bombers_doctrine_desc:0 "Нет смысла бомбить мертвяка. Чтобы максимально эффективно использовать наших бомбардировщиков, мы должны говорить их пилотам что уже было взорвано, а что нет. Раз уж враги у нас не оканчиваются - почему бы не распостранить побольше любви?"
 detection_avoidance_doctrine:0 "Скрытность"
 detection_avoidance_doctrine_desc:0 "Используя продуманное планирование и математику, мы можем вполне уверенно сказать, как будут выглядеть вражеские воздушные зоны. Используя это преимущество, мы сможем проложить воздушные пути там, где меньше шанса заметить наши самолёты."
 infrastructure_destruction_doctrine:0 "Разрушение инфраструктуры"
 infrastructure_destruction_doctrine_desc:0 "Хочешь вынудить пони перестать сражаться? Опустоши его желудок. Хоть мы не сможем найти каждый вражеский караван, мы сможем атаковать те места, где они будут проходить."
 operational_destruction_doctrine:0 "Нестандартные маршруты перехвата"
 operational_destruction_doctrine_desc:0 "Перехват - это не всегда лишь подавление вражеского сопровождения, чтобы открыть доступ к самым значимым целям. Иногда полёт по менее пройденному пути может позволить напасть на ничего не подозревающего врага."
 priority_targeting_doctrine:0 "Боевые коробки"
 priority_targeting_doctrine_desc:0 "\"Боевая коробка\" это формация, которая улучшает поле зрения защитных пулемётных установок у бомбардировщиков, как и их эффективность."
 strategic_destruction_doctrine:0 "Стратегическое разрушение"
 strategic_destruction_doctrine_desc:0 "Недостаточно просто сбросить бомбу на первую попавшуюся враждебную цель. Чтобы устроить настоящее §R!!СТРАТЕГИЧЕСКОЕ УНИЧТОЖЕНИЕ!!§! мы должны установить иерархию наших целей, чтобы бомбардировщики знали, какую из целей стоит поставить в приоритет."
 day_bombing_doctrine:0 "Дневная бомбардировка"
 day_bombing_doctrine_desc:0 "Использовать наши ограниченные в количестве самолёты в неэффективных ночных полётах слишком рискованно. Мы должны нанести максимально возможный урон, пока Солнце не село за горизонт. \n\n"
 night_bombing_doctrine:0 "Ночная бомбардировка"
 night_bombing_doctrine_desc:0 "Возможность атаковать вражеские цели под покровом ночи даст нам возможность всучить хорошие палки в колёса нашему врагу. Наши пилоты, научившись атаковать цели находясь в близкой к нулю видимости, смогут обхитрить вражеские патрули. \n\n"
 future_airforce_doctrine:0 "Авиация будущего"
 future_airforce_doctrine_desc:0 "Наше планирование обширно, наши процедуры тщательны, и наши пилоты не имеют себе равных. Мы изучили всё, что можно только изучить о воздушных боях, пока остальное большинство Пустоши всё ещё пытается подняться хотябы выше метра над землей."
 dive_bombing_doctrine:0 "Бомбардировка в пикировании"
 dive_bombing_doctrine_desc:0 "Бомбардировка в пикировании —известный манёвр нацистов во Второй Мировой Войне— заключается в вертикальном пикировании над целью перед доставкой своей посылки, что даёт большие шансы на попадание неуправляемого снаряда в цель."
 hunt_and_destroy_doctrine:0 "Поиск и уничтожение"
 hunt_and_destroy_doctrine_desc:0 "В пылу сражения очень сложно указать каждому самолёту свою цель. Давши нашим пилотам больше свободы в выборе цели при наземной поддержке, они смогут принять правильные выборы в быстро меняющемся поле брани."
 direct_ground_support_doctrine:0 "Непосредственная наземная поддержка"
 direct_ground_support_doctrine_desc:0 "Давая определённым лицам возможность вызвать воздушный удар на особенно крепкие цели, мы сможем увеличить влияние воздуха на землю."
 dynamic_target_assignment_doctrine:0 "Динамическое распознавание цели"
 dynamic_target_assignment_doctrine_desc:0 "Вместо того, чтобы полностью направлять наши самолеты на каждую атаку, мы можем вместо этого посылать их меньшими, более многочисленными группами. Это не даст нашему врагу и передышки от казалось бы бесконечных шума, огня и взрывов."

 #----------------------------
 # Localisation special forces tech
 #----------------------------
  special_forces_doctrine_desc:0 "Зарождение специальных сил произошло в 1941 году, когда Британская армия основала особую воздушную службу, SAS. И хоть их кости давным-давно покоятся в земле, их девиз всё ещё не теряет своей силы: кто рискует - побеждает."
