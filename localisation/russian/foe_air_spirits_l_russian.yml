l_russian:

 # Air Force Spirit Names
 reclaimed_aircraft_spirit:0 "Восстановленные машины"
 wasteland_ace_pilots_spirit:0 "Асы пустошей"
 hit_and_fade_air_spirit:0 "Тактика внезапных налётов"
 recovered_flight_doctrine_spirit:0 "Восстановленные лётные уставы"
 cloud_layer_intercept_spirit:0 "Перехват в облаках"
 balefire_ordnance_wing_spirit:0 "Жар-боеприпасы"
 ground_strike_specialists_spirit:0 "Специалисты по наземным ударам"
 stable_tec_avionics_spirit:0 "Авионика «Стойл-Тек»"

 # Air Force Command Spirit Names
 wasteland_close_support_spirit:0 "Протоколы непосредственной авиаподдержки"
 veteran_wingponies_spirit:0 "Ветераны-ведомые"
 unified_wing_command_spirit:0 "Единое авиационное командование"
 ace_of_the_wastes_spirit:0 "Асы пустошей"
 swift_wings_doctrine_spirit:0 "Доктрина быстрых крыльев"
 cloud_sweep_doctrine_spirit:0 "Доктрина зачистки неба"
 precision_bombardment_spirit:0 "Высокоточная бомбардировка"
 balefire_strike_command_spirit:0 "Ударное командование жар-пламени"
 direct_ground_support_command_spirit:0 "Прямая поддержка наземных сил"
 vertibird_assault_corps_spirit:0 "Штурмовой корпус вертибаков"

 # Air Force Spirit Descriptions
 reclaimed_aircraft_spirit_desc:0 "Половина наших «птичек» держится на синей изоленте и молитвах давно мёртвым инженерам. Вторая половина умудряется летать. Сойдёмся на том, что этого достаточно."
 wasteland_ace_pilots_spirit_desc:0 "У некоторых пони просто талант удерживать в воздухе то, что в принципе не должно было отрываться от земли. Мы называем это даром. Они называют это обычным вторником."
 hit_and_fade_air_spirit_desc:0 "Быстрый заход и ещё более быстрый отход – исчезни до того, как зенитчики пристреляются. Скорость и манёвренность – единственная броня, стоящая своих крышек. Если они поняли, что ты там был, значит, ты уже облажался."
 recovered_flight_doctrine_spirit_desc:0 "Какой-то пони из убежища провёл два века, зачитываясь учебниками из архивов. Оказалось, часть из них была по аэронавтике. Те, кто выжил, бесконечно ему благодарны."
 cloud_layer_intercept_spirit_desc:0 "Старые погодные команды знали каждый трюк, на который способно небо. Теперь те же приёмы превращают траектории врагов в смертельные (для них) ловушку. Даже пегасов можно застать врасплох ударом из-за облаков."
 balefire_ordnance_wing_spirit_desc:0 "Если одна жар-бомба огня покончила со старым миром, представьте, что полная боенагрузка сделает с новым. Только не задумывайтесь об этом слишком сильно. Экипажи вот не задумываются."
 ground_strike_specialists_spirit_desc:0 "Они пикируют так низко, что успевают прочитать фамилию на жетоне интенданта. Это весьма доходчиво доносит нашу точку зрения."
 stable_tec_avionics_spirit_desc:0 "Удивительно, как работающий симулятор и двухвековые архивы техобслуживания влияют на уверенность пилота. По крайней мере, так нам говорят пони, которые сами никогда не летали."

 # Air Force Command Spirit Descriptions
 wasteland_close_support_spirit_desc:0 "Просто убедитесь, что наземные войска пометили – свои позиции перед вызовом авиаудара. В прошлый раз мы потеряли трёх пони и фургон со снаряжением. B всё ещё спорим, чья это была вина."
 veteran_wingponies_spirit_desc:0 "Когда ас погибает, кто-то должен унаследовать знания и умения. Эти ветераны следят за тем, чтобы ценнейший опыт не упокоился вместе с ними в воронке от взрыва."
 unified_wing_command_spirit_desc:0 "Один штаб, одна радиочастота, один чёткий план действий. Революционная концепция для ВВС Пустошей – настолько, что её, судя по всему, стоило записать на бумаге."
 ace_of_the_wastes_spirit_desc:0 "Они сбивали то, что не должно было летать, в мире, который не должен был выжить. Они – пример для всех остальных."
 swift_wings_doctrine_spirit_desc:0 "Бой контролирует быстрейший. Он сам решает, когда вступить в схватку, когда выйти из неё и когда зайти во внутренний радиус виража противника. Инерция – единственная броня, которая ничего не весит, и у этих пони её больше, чем у кого-либо."
 cloud_sweep_doctrine_spirit_desc:0 "Если ваши истребители владеют небом, у наземных сил день проходит значительно лучше. В этом и заключается план: ослепить врага и позволить пехотинцам внизу закончить работу."
 precision_bombardment_spirit_desc:0 "Сбросить снаряд точно на нужное здание сложнее, чем кажется – особенно когда большинство построек и без того выглядят как груда щебня после двух веков запустения."
 balefire_strike_command_spirit_desc:0 "Оружие, покончившее со старым миром, может покончить и со множеством вещей поменьше. Вопрос о том, стоит ли это делать, к счастью для экипажа бомбардировщика, выходит за рамки их жалования."
 direct_ground_support_command_spirit_desc:0 "Пехота вас обожает. Пехота противника – ненавидит. Это правильное положение дел. Поддерживайте его."
 vertibird_assault_corps_spirit_desc:0 "Удар с небес прямо в тыл врага, прежде чем он успеет перевести дух. Анклав довел это искусство до совершенства в предсмертные дни Эквестрии. Мы лишь продолжаем традицию."
