### Ideas ###
#############

 SHA_secret_dragon:0 "Дракон за кулисами"
 SHA_secret_dragon_desc:0 "Хотя внешне может показаться, что Разбитым Копытом правит Дэдайс, на самом деле он всего лишь марионетка Мистера Топаза - дракона, что живёт в шахтах под старой тюрьмой."
 
 SHA_unstable_east:0 "Нестабильная восточная граница"
 SHA_unstable_east_desc:0 "Мы едва удерживаем нашу восточную границу. Постоянные налёты державы [LRA.GetNameDEF] и партизан-фестралов вынуждают нас направлять значительную часть наших сил на умиротворение этого региона."
 
 SHA_economic_ruin:0 "Разрушенная экономика"
 SHA_economic_ruin_desc:0 "Войска Красного Глаза разрушили немало наших дорог и мастерских, а также сожгли поля и деревни. Потребуется много усилий, чтобы оправиться от последствий всего этого."
 
 SHA_economic_ruin2:0 "Восстанавливающаяся экономика"
 SHA_economic_ruin2_desc:0 "Хотя худшее уже позади, нам ещё предстоит пройти долгий путь, прежде чем наша экономика встанет на лапы."
 
 SHA_economic_ruin3:0 "Экономика в стагнации"
 SHA_economic_ruin3_desc:0 "Потребовалось немало усилий, чтобы вернуть нашу экономику в нужное русло. Однако мы будем чувствовать последствия её коллапса ещё долгие годы."
 
 SHA_economic_ruin4:0 "Медленный рост"
 SHA_economic_ruin4_desc:0 "Экономика постепенно идёт в гору. С каждым днём открывается всё больше фабрик, и всё больше трудящихся возвращаются домой с полными корзинами еды. Это заняло немало времени, но производство восстановилось, пусть его рост пока и идёт медленнее, чем раньше."
 
 SHA_slaver_remnants:0 "Остатки работорговцев"
 SHA_slaver_remnants_desc:0 "Битва за Разбитое Копыто выиграна, но часть работорговцев просто не понимает, когда пора остановиться!\n§CМы не сможем восстановить нашу страну, пока они мешают нам.§!"
 
 SHA_LRA_prison_colony_idea:0 "Исправительная колония"
 SHA_LRA_prison_colony_idea_desc:0 "Заключённые с востока прибывают в эти земли почти ежедневно. Это привело к тому, что наше общество стало весьма слабым и дезорганизованным."
 
 SHA_speed_repair:0 "Широкомасштабный ремонт"
 SHA_speed_repair_desc:0 "Мы начали масштабную программу по восстановлению инфраструктуры во всех регионах, пострадавших во время битвы при Разбитом Копыте."
 
 NCR_investement_from_sha:0 "Инвестиции из Азурии"
 NCR_investement_from_sha_desc:0 "Временная Республика Азурия инвестирует в нашу промышленность, так что наши крупные проекты будут более эффективными."
 
 NCR_eastern_wall:0 "Бастион востока"
 NCR_eastern_wall_desc:0 "Лишь мы стоим между Анклавом и сердцем нашего альянса. Мы должны устоять любой ценой!"
 
 NCR_early_buildup:0 "Приготовления к войне"
 NCR_early_buildup_desc:0 "Мы предпринимаем согласованные усилия по наращиванию военного потенциала для приготовления к будущей войне."
 
 NCR_early_joint_exercise:0 "Совместные учения"
 NCR_early_joint_exercise_desc:0 "Наша армия проводит обширные учения совместно с другими армиями альянса Разбитого Копыта."
 
 NCR_early_provisional_army:0 "Временная армия республики"
 NCR_early_provisional_army_desc:0 "Наконец-то у нас появилась настоящая постоянная армия для защиты нашей страны. Хотя она, к сожалению, далеко не так профессиональна, как мы хотели бы, эта армия будет яростно сражаться до последнего пони или грифона, защищая свои дома."
 
 NCR_early_cauterize:0 "За республику!"
 NCR_early_cauterize_desc:0 "§RМы будем стрелять во врагов в из всего, что имеет ствол, а если у нас кончатся патроны, то мы будем биться когтями и копытами. Мы не постоим за ценой! Республика победит!§!"
 
 NCR_last_resort_idea:0 "За республику!"
 NCR_last_resort_idea_desc:0 "Сейчас или никогда. Время неудач прошло. Пора заставить этих ублюдков платить кровью за каждый метр отвоёванной у нас земли."
 
 NCR_growing_pains_army:0 "Интеграция армий"
 NCR_growing_pains_army_desc:0 "Армии наций, которые образовали НКР, принципиально отличались друг от друге по структуре, уровню подготовки и оснащения. Теперь мы начинаем длительный процесс объединения этих армий в единую организованную силу."

 NCR_growing_pains_economy:0 "Интеграция экономик"
 NCR_growing_pains_economy_desc:0 "Несмотря на программы экономической интеграции, которые мы проводили до объединения, теперь наша промышленность представляет из себя полный хаос из различных стандартов и процедур. Потребуется время, чтобы вернуть всё на круги своя."
 
 NCR_fmcc_idea:0 "Федеральное Министерство Внутренней Безопасности"
 NCR_fmcc_idea_desc:0 "Агенты Федерального Министерства Внутренней Безопасности занимаются предотвращением терактов. Они стараются справляться со своими операциями без привлечения обычных полицейских сил."
 
 NCR_waste_exploitation_1_idea:0 "Договор о разработке пустошей"
 NCR_waste_exploitation_1_idea_desc:0 "Этот договор позволяет частным компаниям при полной поддержке республики заниматься разработкой ресурсов пустоши."

 NCR_gun_in_every_hoof_idea:0 "Винтовка в каждом копыте"
 NCR_gun_in_every_hoof_idea_desc:0 "Мы - НКР. И мы производим больше оружия, чем любая другая нация на пустоши! Мы заполним наши "Арсеналы свободу" доверху."

 NCR_militia_army:0 "Вооруженные силы НКР"
 NCR_militia_army_desc:0 "ВСНКР в немалой степени полагаются на сеть местного ополчения, которое может быть призвано в час нужды для защиты республики."
 
 NCR_militia_army2:0 "Вооруженные силы НКР"
 NCR_militia_army2_desc:0 "ВСНКР в немалой степени полагаются на сеть местного ополчения, которое может быть призвано в час нужды для защиты республики."
 
 NCR_militia_army3:0 "Вооруженные силы НКР"
 NCR_militia_army3_desc:0 "ВСНКР в немалой степени полагаются на сеть местного ополчения, которое может быть призвано в час нужды для защиты республики."
 
 NCR_militia_army4:0 "Вооруженные силы НКР"
 NCR_militia_army4_desc:0 "ВСНКР в немалой степени полагаются на сеть местного ополчения, которое может быть призвано в час нужды для защиты республики."
 
 NCR_militia_grand_army:0 "Великое ополчение"
 NCR_militia_grand_army_desc:0 "ВСНКР стали одной из крупнейших армий пустоши. Ополченцы, входящие в состав армии НКР, преданы правительству и его идеалам."
 
 NCR_mechanized_focus_idea:0 "Фокус на механизированной войне"
 NCR_mechanized_focus_idea_desc:0 "Мы начали выделять средства на производство механизированной техники. Так мы надеемся резко повысить эффективность наших вооруженных сил."
 
 NCR_prof_army:0 "Вооруженные силы НКР"
 NCR_prof_army_desc:0 "ВСНКР стали настоящей федеральной армией. Все наши солдаты хорошо обучены, одеты в настоящую униформу и готовы умереть за республику в любой момент."
 
 NCR_prof_army2:0 "Вооруженные силы НКР"
 NCR_prof_army2_desc:0 "ВСНКР стали настоящей федеральной армией. Все наши солдаты хорошо обучены, одеты в настоящую униформу и готовы умереть за республику в любой момент."
 
 NCR_prof_army3:0 "Вооруженные силы НКР"
 NCR_prof_army3_desc:0 "ВСНКР стали настоящей федеральной армией. Все наши солдаты хорошо обучены, одеты в настоящую униформу и готовы умереть за республику в любой момент."
 
 NCR_eqs_pa_idea:0 "Массовое производство силовой брони"
 NCR_eqs_pa_idea_desc:0 "Мы возродили методы, с помощью которых Эквестрия массово производила силовую броню во время войны."
 
 
 OAP_ncr_rangers_idea:0 "Рейнджеры НКР"
 OAP_ncr_rangers_idea_desc:0 "Рейнджеры НКР - элита нашей армии. Они прекрасно обучены, быстро адаптируются, и каждый из них может самостоятельно расправиться как минимум с дюжиной работорговцев."
 
 NCR_ranger_program_idea:0 "Программа обмена между НКР и Рейнджерами"
 
 NCR_ranger_program_idea2:0 "Программа обмена между НКР и Рейнджерами"
 
 NCR_zebra_robotics_revived_idea:0 "Зебринская робототехника"
 NCR_zebra_robotics_revived_idea_desc:0 "Мы улучшим наших собственных роботов с помощью идей, позаимствованных у зебринских мастеров-робототехников."
 
 NCR_flying_fortress_idea:0 "Летающая крепость"
 NCR_flying_fortress_idea_desc:0 "Наши облачные корабли являются одними из самых крупных и мощных машин, когда-либо бороздивших небеса."
 
 NCR_second_pillar_idea:0 "Второй столп"
 NCR_second_pillar_idea_desc:0 "Небесная гвардия НКР действует совместно с нашими наземными силы. ВВС поддерживают наших солдат с воздуха и заставляют врагов разбегаться по укрытиям."
 
 NCR_coast_to_coast_naval_idea:0 "Морское доминирование"
 NCR_coast_to_coast_naval_idea_desc:0 "Республика правит морями!"
 
 NCR_merchant_navy_ships_idea:0 "Торговый флот"
 NCR_merchant_navy_ships_idea_desc:0 "Наш флот поддерживает и финансирует ряд богатых торговцев, которые полагаются на него для защиты своих торговых интересов и маршрутов."
 
 NCR_dord_idea1:0 "Отдел исследований и разработок НКР"
 NCR_dord_ideal_desc:0 "Отдел исследований и разработок занимается развитием, управлением и контролем технологического прогресса всех наших наций."
 
 NCR_flwda_idea:0 "Федеральное Агентство Труда и Развития Трудовых Ресурсов"
 NCR_flwda_idea_desc:0 "ФАТРТР отвечает за расширение промышленного потенциала. Также оно привлекает наших граждан к работе над всевозможными общественными проектами."
 
 NCR_NCCDF_idea:0 "Фонд Кооперативного Развития Нового Кантерлота"
 NCR_NCCDF_idea_desc:0 "ФКРНК выделяет средства на развитие и совершенствование Нового Кантерлота, дабы этот город мог стать действительно великой столицей нашей нации."
 
 NCR_gem_rush:0 "Драгоценная лихорадка"
 NCR_gem_rush_desc:0 ""В этих горах есть драгоценные камни!". Этот крик слегка безумно выглядящего шахтёра положил начало настоящей драгоценной лихорадке. Тысячи пони, грифонов и даже псов стекаются в земли Раскалывателей Камней, чтобы по-быстрому разбогатеть."
 
 NCR_refugee_crisis_idea:0 "Великий исход"
 NCR_refugee_crisis_idea_desc:0 ""
 
 followers_of_the_apocalypse_idea:0 "Последователи Апокалипсиса"
 followers_of_the_apocalypse_idea_desc:0 ""
 
 followers_of_the_apocalypse_idea2:0 "Последователи Апокалипсиса"
 followers_of_the_apocalypse_idea2_desc:0 ""
 
 NCR_mechanized_agriculture_idea:0 "Механизированное сельское хозяйство"
 NCR_mechanized_agriculture_idea_desc:0 "Промышленное оборудование и современная техника позволили нашим фермам процветать как никогда. Поставки продовольствия выросли, что поспособствовало росту как нашего населения, так и численности солдат, которых мы можем вставить на поле боя."
 
 NCR_waste_exploitation_2_idea:0 "Договор о разработке пустошей"
 NCR_waste_exploitation_2_idea_desc:0 "Этот договор позволяет частным компаниям при полной поддержке республики заниматься разработкой ресурсов пустоши."

 NCR_city_of_the_worlds_desire_idea:0 "Величайший город республики"
 NCR_city_of_the_worlds_desire_idea_desc:0 "Новый Кантерлот ярко сияет на пустоши. Он стал величайшим городом, подобных которому мир не видел со времён Великой войны. В городе множество удобств, а средний уровень жизни его граждан столь высок, что многие жители пустоши просто отказываются верить в чудеса вроде канализации и горячей воды."
 
 NCR_mwt_spirit_idea:0 "Наследие МВТ"
 NCR_mwt_spirit_idea_desc:0 "Мы продолжили работу Министерства Военных Технологий и ныне занимаемся разработкой передовой военной техники."
 
 NCR_mas_spirit_idea:0 "Наследие МТН"
 NCR_mas_spirit_idea_desc:0 "Мы продолжили работу Министерства тайных Наук и ныне занимаемся разработкой передовых магических технологий."
 
 NCR_investement_to_TEN:0 "Инвестиции из НКР"
 NCR_investement_to_TEN_desc:0 "НКР начала инвестировать в нашу экономику. Хотя некоторые беспокоятся о том, что такая политика может слишком сильно привязать нас к НКР, другие же предпочитают наслаждаться преимуществами данного соглашения."
 
 SHA_recent_skirmish:0 "Недавние пограничные перестрелки"
 SHA_recent_skirmish_desc:0 "[LRA.GetName] снова попытались проникнуть на нашу территорию, хотя нам, как всегда, удалось отбить их атаку. Однако нас беспокоит то, что наши разведчики уже начали сообщать о появлении работорговцев Красного Глаза. Они приближаются к нашей границе небольшими группами, а затем быстро возвращаются обратно.\n§RТут что-то происходит...§!"
 
 NCR_fight_against_evil:0 "Битва против тьмы"
 NCR_fight_against_evil_desc:0 "Красный Глаз должен пасть, в ином случае всему нашему народу не выжить!"
 
 NCR_defending_democracy:0 "До последней капли крови!"
 NCR_defending_democracy_desc:0 "§RМы никогда не сдадимся! Мы либо победим в этой войне, либо же падём все вместе!§!"
 
 NCR_moonsinger_accords_idea: "Соглашения лунных певцов"
 NCR_moonsinger_accords_idea_desc: "Соглашения лунных певцов, подписанные с фестралами Нью-Манго в обмен на их интеграцию в НКР, предоставляют бэтпони множество привилегий, чтобы предотвратить расизм и иные предрассудки, терзавшие их народ во время войны и до неё. Соглашения предоставляют им постоянных представителей и некоторые незначительные послабления в рамках армейской службы. Это далеко не самый популярный акт в стране, но без них никак не обойтись."

 SHA_capital_in_chaos_idea: "Столица в хаосе"
 SHA_capital_in_chaos_idea_desc: "Множество мелких банд всё ещё сопротивляются и стреляют во все стороны, пытаясь занять место Дэдайса в качестве главаря Разбитого Копыта, пока Гаудина собирает воедино разрозненные осколки прежнего аппарата управления. Обе стороны дезорганизованы, что усиливает нестабильность в стране."


 
 
 
 
 
 
### Advisors ###

 SHA_char_Gawd_name:0 "Гаудина Грознопёрая"
 SHA_char_deadeyes_name:0 "Дэдайс"
 SHA_char_council_name:0 "Совет освобождения"
 SHA_char_finebeam_name:0 "Файн Бим"
 SHA_char_luciaclawthorn_name:0 "Люсия Клоторн"
 SHA_char_erichadalberg_name:0 "Эрих Адальберг"
 SHA_char_littlegear_name:0 "Литтл Гир"
 SHA_char_clank_name:0 "Клэнк"
 SHA_char_brightcargo_name:0 "Брайт Карго"
 SHA_char_gallantaegis_name:0 "Галлант Эгида"
 SHA_char_flaperon_name:0 "Флаперон Баррон"
 SHA_char_Gallant_name:0 "Галлант"
 SHA_char_nero_name:0 "Неро"
 SHA_char_irish_bird_name:0 "Граинн у Броин"
 SHA_char_silver_hoof_name:0 "Сильвер Хуф"


 NCR_neocastle_construction_advisor:0 "Гильдии Неокасла"
 NCR_neocastle_construction_advisor_desc:0 "Гильдии Неокасла проявили себя исключительно хорошо. Этим они смогли заполучить уютное местечко в нашем правительстве."
 
 wonderbolts_manu_designer:0 "Вандерболт Мэнуфэкчуринг"
 wonderbolts_manu_designer_desc:0 "Вандерболт Мэнуфэкчуринг некогда была одной из самых престижных компаний Эквестрии, что производили облачные корабли. Теперь она возродилась и верно служит уже нам."
 
 SHA_char_black_gold_name:0 "Блэк Голд"
 SHA_char_stable_lilly_name:0 "Стэбл Лили"
 SHA_char_brick_breaker_name:0 "Брик Брейкер"
 SHA_char_staccato_name:0 "Стакатто"
 SHA_char_burning_maze_name:0 "Бёрнинг Мэйз"
 SHA_char_burning_maze_name_desc:0 "§gБёрнинг Мэйз присоединился к банде Разбитого Копыта давным-давно и быстро приобрел репутацию того, кто заставляет пони работать максимально эффективно. Мэйз доказал, что он более чем способен управлять крупномасштабными проектами. Однако пони под его началом совсем не рады такому начальнику и Мэйз является очень непопулярной фигурой.§!"
 SHA_char_violet_terrace_name:0 "Вайолет Террейс"
 SHA_char_violet_terrace_name_desc:0 "§gВайолет Террейс. Это имя вызывает самые разные чувства: от зависти у кобыл до кое-чего совсем иного у жеребцов. Вайолет проложила путь вплоть до самого верха банды Разбитого Копыта благодаря своей исключительной харизме. Она смогла завоевать доверие самого Дэдайса. После недавних событий Вайолет готова работать на нас и обеспечить нашему правительству столь необходимую поддержку.§!"
 SHA_char_smart_cookie_name:0 "Смарт Куки"
 SHA_char_smart_cookie_name_desc:0 "§gЕсли и есть кто-то, кому не место в Разбитом Копыте, то это Смарт Куки. Она была умной рейдершей, что многие считают почти невозможным. Куки проявляла изобретательность и придумывала всевозможные творческие идеи, направленные на помощь банде. Будем надеяться, что она сможет помочь и нам.§!"
 SHA_char_turnip_menace_name:0 "Тёнип Менэйс"
 SHA_char_turnip_menace_name_desc:0 "§gТёнип Менэйс. Это имя внушает ужас многим. Когда-то он был просто ещё одним бедным фермером, вынужденным отдавать большую часть своего урожая банде Разбитого Копыта каждый раз, когда они появлялись на его пороге. То есть до тех пор, пока он не решился дать рейдерам отпор. Он собрал немалое по размеру ополчение из фермеров и поселенцев. Тёнип Менэйс назвал регион, где располагалась его ферма, Землёй Свёклы, а себя - её повелителем. После этого разгорелась жестокая и кровопролитная Свекольная Война, во время которой многие рейдеры расстались со своими жизнями. После продолжительного конфликта мятежники проиграли. Тёнип Менэйс был схвачен, но, к всеобщему удивлению, Дэдайс не казнил его и предложил фермеру место в банде. Хотя Тёнип Менэйс оказался не таким великим лидером, как мы надеялись, его опыт ведения сельского хозяйства оказался очень ценным. И мы намерены воспользоваться им.§!"
 SHA_char_steel_wall_name:0 "Маршал Стил Уолл"
 SHA_char_avalanche_name:0 "Маршал Аваланч"
 SHA_char_olive_branch_name:0 "Генерал Олив Бранч"
