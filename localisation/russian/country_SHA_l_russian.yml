 NCR_early_eastern_defense_decision_cat:0 "Восточные инвестиции"
 NCR_early_eastern_defense_decision_cat_desc:0 "Крайне важно укрепить нашу восточную границу с Анклавом на случай крайне вероятного конфликта с ними в будущем."
 NCR_early_eastern_defense_connect_capitals_decision:0 "Соединить Лесли и Нью-Манго"
 NCR_early_eastern_defense_outpost_line_decision:0 "Укрепить восточную границу"
 NCR_early_eastern_defense_outpost_line_decision_desc:0 "Мы должны попытаться остановить врага прямо на границе! Чем глубже враг продвинется на нашу территорию, тем больше нашей промышленности и гражданского населения окажутся в опасности."
 NCR_early_eastern_defense_leslie_mango_line_decision:0 "Линия обороны Лесли и Нью-Манго"
 NCR_early_eastern_defense_leslie_mango_line_decision_desc:0 "Если нас всё же оттеснят от границы, то главным приоритетом армии должна стать защита поселений Лесли и Нью-Манго. Для этого мы должны построить ещё одну линию укреплений, что протянется через их территорию."
 
 NCR_power_struggle_urp_decision_cat:0 "Борьба за лидерство в ОРП"
 NCR_power_struggle_urp_decision_cat_desc:0 "В настоящий момент §MГаудина Грознопёрая§!, Президент Республики, и §RУотеруоркс§!, Министр Финансов ОРП, борются за лидерство в партии.\nИх текущее влияние:\n§M[?gawd_influence]% партии поддерживают Гаудину§!\n\n§R[?water_influence]% партии поддерживают Уотеруоркса§!\n"
 
 NCR_water_inspire_patriotism_decision:0 "Вдохновлять патриотизм"
 NCR_water_inspire_patriotism_decision_desc:0 "Произнести речь, продвигающую превосходство пони."
 NCR_water_cooperate_with_pl_decision:0 "Заключить сделку с Патриотической Лигой"
 NCR_water_cooperate_with_pl_decision_desc:0 "Хотя они и являются нашими политическими врагами, Патриотическая Лига по-прежнему поддерживает нас в одном важном вопросе: в снятии Гаудины с поста президента.\nХотя так мы укрепим позиции ПЛ, сделка с ней однозначно поможет росту популярности самого Уотеруоркса."
 
 NCR_incite_ranger_uprising_decision_cat:0 "Поддержать восстание рейнджеров"
 NCR_incite_ranger_uprising_decision_cat_desc:0 "Генерал-рейнджер Фарсайт обратился к нам за помощью в свержении тиранического режима Эпплузы. И мы не бросим их в беде!"
