 shatteredhoof.1.t:0 "Разбитое Копыто: История военных лет"
 shatteredhoof.1.d:0 "До Великой войны земли, ныне известные как Разбитое Копыто, были практически необитаемы. Здесь располагалось лишь несколько фермерских хозяйств да железная дорога, соединявшая современный Новый Мейрвей с Эпплузой. Редкие реликвии, найденные тут да там в песках, намекают, что когда-то здесь существовали поселения племён нейуа с юго-востока, но всё это – предания старины, интересующие лишь археологов. После начала Великой войны именно хребет Разбитое Копыто был выбран местом проведения переговоров о прекращении огня между принцессой Селестией и зебриканскими делегатами. Выбор пал на это место из-за его близости к юго-восточному фронту и крайне низкой плотности населения. Именно во время этих роковых переговоров на Селестию было совершено покушение, которое удалось предотвратить лишь благодаря вмешательству героя войны – Биг Макинтоша.\n\nМинистерство Морали, разъярённое попыткой убийства и опасавшееся самосуда толпы в случае содержания заговорщиков в обычных тюрьмах, приняло решение построить здесь тюрьму «Разбитое Копыто». Название не только должно было напоминать первым заключённым (многие из которых были участниками покушения на хребте) о причинах их заточения, но и буквально описывало внутренние порядки. Узников отправляли на тяжёлые работы, где они в прямом смысле разбивали копыта в поисках драгоценных камней и магических кристаллов для нужд фронта и оплаты услуг драконов-наёмников. Вдали от назойливых глаз прессы с заключёнными обращались как с рабами, а камеры быстро заполнились политическими диссидентами.\n\nМногие подозревают, что «Разбитое Копыто» не стало целью для зебриканских мегазаклинаний именно из-за находившихся там оппозиционеров. Однако, несмотря на отсутствие прямых попаданий, после войны тюрьма осталась без продовольствия, и многие узники даже прибегли к пониедству, надеясь получить шанс выжить. Министерство Морали никогда не заботилось о создании запасов еды, не думая (или не желая думать) о том, как заключённые встретят Последний день. Вместо этого в последние дни войны Министерство инвестировало в..."
 shatteredhoof.1.a:0 "...камеры для новых заключённых."
 shatteredhoof.1.b:0 "...вооружение для всех охранников."
 shatteredhoof.1.c:0 "...расширение помещений для персонала."
 
 shatteredhoof.2.t:0 "Разбитое Копыто: Послевоенная история"
 shatteredhoof.2.d:0 "Вскоре после Последнего дня заключённые Разбитого Копыта превратились в разрозненную толпу, слишком занятую выживанием, чтобы думать о чём-то ещё. Кто-то убежал, желая отыскать другие поселения, кто-то пытался сбиться в банды и атаковать форт Шерхуф, но неизменно получал отпор. У них не было ни плана, ни лидера, ни ресурсов – пока не появилась Руби Роуз. Она была единственной выжившей из некогда исчезнувшей банды, вернувшейся на службу к таинственному благодетелю, известному как Мистер Топаз. Получив оружие и броню от своего покровителя, Руби Роуз выковала порядок из хаоса, став, если выражаться языком рейдеров, «боссом» Разбитого Копыта.\n\nОбъединившись под началом Руби, бывшие узники – точнее теперь рейдеры Разбитого Копыта – начали расширять свои владения, подминая под себя возникающие вокруг мелкие поселения. Их отряды совершали набеги на Пьюрпоинт, Верховье и Лесли, грабя и забирая всё необходимое для жизни. Под началом Руби Роуз налёты были настолько успешными, что группировка быстро превратилась в одну из самых могущественных и уважаемых сил на юге. Множество поселений и культур, чьи названия давно стёрлись из памяти, были подчинены (добровольно или же не очень), что закрепило за Разбитым Копытом место под облачным небом пустоши. Главными плодами завоеваний стали приток Корона и протекторат Шерхуф, некогда полностью принадлежавшие рейдерам.\n\nКогда запасы были накоплены, а дальнейшая экспансия стала лишь вопросом времени, Руби Роуз получила новые указания от Мистера Топаза. Чтобы Разбитое Копыто выжило, им нужно было стать чем-то большим, чем просто мародёрами. Обеспечив безопасность границ и снабжения, Руби Роуз начала отправлять масштабные экспедиции для сбора ресурсов, ремонта и восстановления того, что осталось от Эквестрии. Из всех её начинаний одно увенчалось таким успехом, что его плоды приносят пользу и по сей день. Она..."
 shatteredhoof.2.a:0 "...расчистила местные руины."
 shatteredhoof.2.b:0 "...отремонтировала Азурвэй."
 shatteredhoof.2.c:0 "...разграбила гавань."
 
 shatteredhoof.3.t:0 "Разбитое Копыто: Современная история"
 shatteredhoof.3.d:0 "После того как Руби Роуз мирно скончалась во сне, Разбитое Копыто впало в стагнацию, лишившись мудрого наставничества таинственного мистера Топаза. Пока фракция пребывала в упадке, вокруг её границ возникло множество поселений: они отстраивались на руинах и обживали пустошь. Период застоя закончился, когда неизвестный убийца устранил тогдашнего босса Комплейсенси, что спровоцировало многолетнюю гражданскую войну. Обе стороны сильно истощили друг друга, а потом о себе заявила третья сила под предводительством хитроумного стрелка Дэдайса – нового ставленника мистера Топаза. Благодаря острому уму и быстрой реакции он объединил Разбитое Копыто под своим началом, стремясь превзойти успехи самой Руби Роуз.\n\nДвижимый этими амбициями, он вновь повёл рейдеров в поход, и те быстро сокрушили расслабившиеся окрестные поселения. Первостепенными целями Дэдайса стали Шерхуф и Корона, которые восстали, пытаясь отстоять свою независимость. Используя как стрелковое мастерство, так и тактику устрашения, Дэдайс навязал обеим землям сделку: дань в обмен на защиту. Экспансия продолжалась до тех пор, пока рейдеры не потерпели сокрушительное поражение в области под названием Лесли. Солдаты Дэдайса были поглощены сражением с местными поселенцами, когда их застала врасплох ударом во фланг огромная группа беглых крепостных из Неокасла. Оказавшись зажатым между крепостными и поселенцами, Дэдайс отступил, оставив после себя горы снаряжения. Собрав эти трофеи, поселенцы и крепостные сформировали Освободительную армию Аметиста. Несмотря на поражение, Разбитое копыто стало более сильным, чем когда-либо прежде, и полностью объединённым под властью Дэдайса.\n\nКогда все близлежащие поселения оказались подчинены и начали платить дань, мистер Топаз приказал Дэдайсу перейти к созданию более устойчивого общества. Поэтому Дэдайс нанял наёмников – «Когтей» Гаудины Грознопёрой (подробнее в Приложении I), – и, подобно Руби Роуз, занялся инфраструктурными проектами. Начинания Дэдайса оказали огромное влияние на некоторые районы Разбитого Копыта. Особенно..."
 shatteredhoof.3.a:0 "...изнурительный труд поселенцев до смерти."
 shatteredhoof.3.b:0 "...инвестиции в производство револьверов Шерхуфа."
 shatteredhoof.3.c:0 "...торговля с Гринвэем."
 
 shatteredhoof.4.t:0 "Разбитое Копыто: Приложение I"
 shatteredhoof.4.d:0 "«Когти» были одной из многих групп наёмников родом из некогда оккупированной Нова Грифонии, которые были готовы сражаться за любую сторону конфликта, у которой было достаточно денег для оплаты их услуг. Среди множества наёмных отрядов «Когти» выделялись своим размером и редкостной стойкостью. После наступления Последнего дня компания распалась на множество мелких групп, которые также промышляли наёмничеством: рота Стерн в Филлидельфии, Редвинга – в Саммерфилде, Фезербраша – на западе. Но это приложение посвящено «Когтям» Гауды, что обосновались в Разбитом Копыте. Эти грифоны долгое время провели на юге, работая на Эпплузу, Неокасл и многие другие поселения.\n\nПосле поражения Дэдайса в Лесли ему потребовалось больше войск, чтобы удержать завоёванные земли, и именно поэтому он нанял «Когтей» Гауды в рамках долгосрочного контракта. На протяжении многих лет её наёмники подавляли любые восстания, обучали рейдеров Разбитого Копыта и отражали набеги Освободительной армии Аметиста. Хотя наёмники верны исключительно крышкам, ходят слухи, что Гаудина Грознопёрая желает видеть в Разбитом Копыте нечто большее, чем просто банду грабителей.\n\n— Конец Приложения I. Подпись: Сангвин Сигнейчур, автор «Современной истории пустошей». Пожалуйста, перейдите на следующую страницу к Приложению II, посвященному тактике Гаудины и её упору на..."
 shatteredhoof.4.a:0 "...городской бой."
 shatteredhoof.4.b:0 "...осадную войну."
 shatteredhoof.4.c:0 "...наступление широким фронтом."
 
 shatteredhoof.5.t:0 "Забрать то, что наше по праву"
 shatteredhoof.5.d:0 "Снова наступили те славные деньки, когда мы совершаем обход местных поселений. Лёгкая добыча, как и всегда. Но как бы нам ни хотелось обобрать поселенцев до нитки, мы должны оставить им достаточно средств, чтобы они смогли заплатить нам и в следующий раз.\n\nУ нас есть три варианта:\n\nВо-первых, мы можем забрать все их крышки и купить на них что-нибудь полезное. У местных поубавится деньжат, но разве они им действительно нужны?\n\nВо-вторых, можно отобрать у них оружие. Тогда нам не придётся мастерить или покупать стволы самим, а эти пони гарантированно не смогут оказать нам сопротивления.\n\nИ, наконец, финальный вариант – заставить местных примкнуть к нашей банде. Это позволит компенсировать потери, понесённые в недавних набегах, хотя вручать оружие поселенцам, которые нас ненавидят, – идея не из лучших.\n\nНо какой бы выбор мы ни сделали, мы останемся в плюсе и, как всегда, вскоре вернёмся за добавкой."
 shatteredhoof.5.a:0 "Крышки."
 shatteredhoof.5.b:0 "Пушки."
 shatteredhoof.5.c:0 "Рекруты."
 
 shatteredhoof.6.t:0 "Последствия"
 shatteredhoof.6.d:0 "Гаудина Грознопёрая никогда не привыкла сидеть сложа когти, пока другие работают за неё, но отчаянные времена требуют отчаянных мер. Она расположилась за старым столом Дэдайса, изучая бумаги и манифесты бывшего лидера рейдеров, отмечая тайники со снабжением и позиции врага. Грифина подняла взгляд, когда дверь распахнулась и вошли несколько наёмников, большинство из которых были покрыты кровью и грязью. Гаудина кивнула им. — Доложите о ситуации. Голдбик, что там на R-7? — один из грифонов, самец с золотистыми перьями, почтительно кивнул. — Все наши бойцы мобилизованы и берут страну под контроль. Пока я собирал припасы, на нас напали несколько групп рейдеров, вооружённых стволами из Гринвэя. Похоже, наши западные соседи настроены не слишком дружелюбно. Кроме того, многие бросили заводы, чтобы примкнуть к нам, а из-за этого экономика едва дышит.\n\nГаудина кивнула. — Сейчас нам прежде всего нужны бойцы и пушки, а экономику наладим, когда добьёмся хоть какой-то стабильности. Отправь отряд вырыть траншею вокруг Кучи, чтобы прервать любую поддержку из Гринвэя. Мунталон, что на землях между нами и Шерхуфом? — грифина с тёмным оперением чётко отдала честь. — Земли под охраной, а мой отряд выследил подавляющее большинство рейдеров. Нам помог жеребец, шериф Стил Уолл, лидер Шерхуфа. Он в одиночку переловил кучу рейдеров – к тому времени, как мы их выследили, они уже примерили пеньковые галстуки. Мы также заметили несколько укреплений племени Корона на севере, в стороне от нашего маршрута. Последний раз, когда мы их видели, их атаковали войска Освободительной армии Аметиста; следов Кайзеркреста не обнаружено. Кроме того, рейдеры успели повредить большую часть инфраструктуры прежде, чем мы их перебили. Поступление дани из Шерхуфа в ближайшее время замедлится. — Гаудина резко кивнула. — Вполне приемлемо. Рада слышать, что в Шерхуфе у нас всё ещё есть друзья. Пусть твои отряды удерживают дороги и пути, ведущие в город.\n\nОна посмотрела на последнего грифона, одноглазого самца с красными перьями: — Бладай, что на севере? — тот склонил голову. — Хуже, чем мы считали, мэм. Похоже, рейдеры объединились с Чистыми, и у них современное снаряжение филлидельфийского образца. Нам не удалось рассмотреть многое, но похоже, что Чистые скупают снарягу на всё то награбленное добро, что притащили им беглые рейдеры. Поставки идут от Красного Глаза. Полагаю, это ход Филлидельфии, пытающейся завести друзей на юге. Сдаётся мне, Стерн начала нам завидовать. — Собравшиеся грифоны дружно усмехнулись, пока их не прервала Гаудина. — Мы разберёмся с ними в своё время. Где Кайзеркрест? Мне нужен полный доклад по границе с Аметистом. — Трое грифонов переглянулись, прежде чем заговорил Голдбик: — Пропал без вести. Ничего не слышно с тех пор, как он отправился к границе."
 shatteredhoof.6.a:0 "Мы живы... пока что."
 
 shatteredhoof.7.t:0 "Бойня в Короне"
 shatteredhoof.7.d:0 "Пули со свистом пролетают мимо лачуги из металлолома, пока остатки солдат Кайзеркреста ищут укрытие. Поле боя густо усеяно телами храбрых наёмников, чья кровь льётся на раскалённый песок пустыни. Джованни не может оторвать от них взгляда, даже когда земля содрогается от взрывов летящих в их сторону динамитных шашек и гранат. Кайзеркрест рывком пригибает его к земле, вырывая из оцепенения. — Очнись, птенец! — Джованни чувствует в клюве вкус железа, пока он осматривает немногих оставшихся в живых. Сам Кайзеркрест, Блэкпаудер – их эксперт по взрывчатке, и Гринтейл – медик. Грифон слышит доносящиеся издалека слова, но с трудом понимает их смысл. — ... в укрытие, ждём подкрепления! Понял меня, птенец?! — Джованни моргает и смотрит на Кайзеркреста расфокусированным взглядом. В клюве пересохло, и он не может подобрать слов для ответа, поэтому лишь кивает и выхватывает револьвер.\n\nБлэкпаудер вскрикивает, доставая гранату и выдёргивая чеку. — Гринтейл... — но договорить он не успевает – пуля попадает прямо в гранату в его когте, и та мгновенно детонирует. В мгновение ока Блэкпаудер исчезает в облаке дыма вместе с половиной лачуги. А Гринтейл широко раскрытыми глазами смотрит на свою нижнюю половину тела, оказавшуюся в десяти метрах от другой. Внезапно мир обретает чёткость: на Джованни обрушиваются запах крови и дыма, а также звук продёргиваемого затвора прямо за спиной. Он резко оборачивается и, не думая, трижды стреляет из револьвера. Пули попадают в кобылку лет пятнадцати, не старше, которая держит винтовку больше неё самой. На секунду её взгляд замирает, прикованный к револьверу. Пони открывает рот, словно пытаясь что-то спросить, но вместо слов раздаётся лишь бульканье, поскольку кровь хлещет из её шеи.\n\nКогти Джованни дрожат, когда он шепчет. — Нет, нет... нет... — револьвер падает на землю. Грифон бросается на открытое пространство, подхватывая падающую кобылку, чья кровь пятнает его лапы. — Я не... я... — пули свистят мимо, рикошетят от брони и почти задевают грифона. Но он, не обращая на них внимания, смотрит на угасающий в глазах кобылки свет. И тут кто-то сбивает его с ног сзади и затаскивает в укрытие – на помощь прибыл старый Кайзеркрест. — Проклятье, птенец! — они прячутся за потрёпанными мешками с песком, пока десятки врагов идут в наступление. Джованни трясёт, он смотрит на свои окровавленные когти, а в ушах стоит слабый звон. Из этого транса его вырывает Кайзеркрест, вкладывая в когти новый револьвер и глядя прямо в глаза. — Уходи! Корона пала! — старый грифон отступает назад, вскидывая пулемёт. — Доложи Гауде обо всём. И расскажи остальным... скажи им, что я пал в бою. Теперь лети! — Джованни, несмотря на шок, всё же слышит приказ: он расправляет крылья и взмывает ввысь, оставляя Кайзеркреста позади. Его последние выстрелы навсегда останутся в памяти грифона."
 shatteredhoof.7.a:0 "Корона пала!"
 
 shatteredhoof.8.t:0 "Весьма любопытное предложение"
 shatteredhoof.8.d:0 "С запада пришли вести о рождении новой силы в пустоши. Согласно донесениям разведки, рейдеры Разбитого Копыта теперь находятся под началом грифины по имени Гауда, предводительницы роты «Когтей». Грифоны, разумеется, широко славятся своей жадностью, особенно «Когти» – наёмники, готовые служить любому, чьи карманы полны крышек. Мы уже не раз теряли добрых бэтпони от когтей грифонов, когда те отражали наши ответные удары после их набегов. Из-за этого многие с недоверием относятся к Гаудине и её наёмникам, ведь почти у каждого фестрала друг или родственник был убит рейдером из Разбитого Копыта. Когда речь заходит об этой банде, доверие становится крайне дефицитным ресурсом.\n\nТем не менее говорят, что Гауда заключила союз с Коалицией Шерхуфа во главе с добропорядочным шерифом Стил Уоллом. Ранее рейдеры держали Шерхуф и его многочисленных поселенцев в узде при помощи насилия и крови, поэтому известие о том, что Гауда работает с ними на равных, стало для многих приятной неожиданностью. Шерхуф процветает благодаря этому альянсу, и, похоже, что Разбитому Копыту под лидерством Гауды всё же можно доверять. Скорее всего. И всё же острые клювы и когти грифонов вызывают у многих страх.\n\nНедавно нас посетил вестник с запада, предложив условия союза. Мы могли бы стать для бывших рейдеров сильным союзником, способным сокрушить их врагов и полностью контролировать юг. А Разбитое Копыто, в свою очередь, могло бы защитить нас, если слухи о пегасах, покоряющих болота, окажутся правдой. Может статься, что всем нам будет выгодно держаться вместе – с определёнными уступками, разумеется. И всё же многие задаются вопросом: не собирается ли Гауда предать нас в будущем? Но одно мы знаем наверняка: наше следующее решение навсегда изменит курс развития страны."
 shatteredhoof.8.a:0 "Это явно выгодная сделка."
 shatteredhoof.8.b:0 "Мы не верим грифонам!"

 shatteredhoof.9.t:0 "Проблема Лесли"
 shatteredhoof.9.d:0 "С державой [LRA.GetNameDEF] покончено, и теперь нам нужно определить свою позицию относительно их бывших земель. Изначально мы планировали управлять этой территорией напрямую, но местный лидер по имени Рок Солид обратился к нам с интересным предложением: он хочет, чтобы мы создали здесь полуавтономную исправительную колонию. Это выгодная сделка, так как в случае согласия мы получим место, куда можно будет отправлять всех преступников и нарушителей спокойствия из нашей страны. Своим трудом они поспособствуют развитию промышленности колонии, что, в свою очередь, принесёт пользу и нам. Однако в таком случае мы лишимся прямого доступа к ресурсам и рекрутам с этой территории, которые очень пригодились бы для защиты нации. Как мы поступим?"
 shatteredhoof.9.a:0 "Рок Солид предложил дельную идею."
 shatteredhoof.9.b:0 "Исправительная колония? Нет, нам нужна эта земля."
 
 shatteredhoof.10.t:0 "Пакт Разбитого копыта"
 shatteredhoof.10.d.gawd:0 "Стил Уолл не из тех, кто любит излишества: он прибыл в исправительную колонию Разбитое Копыто в своей старой поношенной форме. Сидящая напротив Гауда, облачённая в броню, тоже не привыкла к роскоши. Двое существ молча изучали друг друга, пока Стил Уолл первым не нарушил тишину.\n\n— Я прибыл сюда от лица поселенцев городков, которые формально считаются частью Разбитого Копыта. Мы присоединились к вашей атаке на рейдеров, потому что я счёл вас разумной грифиной. Мы пролили немало крови добрых пони за ваши цели, так что пришло время достойно отплатить. Наше требование простое и понятное: вы создаёте официальную систему управления, которая не будет основываться лишь на силе и дикости. Вы должны превратить это место в полноценную страну. Мы также ожидаем, что поселения получат право на ограниченное самоуправление, чтобы положить конец единоличному господству Разбитого Копыта над регионом. И я не покину эту комнату, пока требования не будут приняты, Грознопёрая. Так что давайте договариваться.\n\nГауда около минуты не сводила глаз с жеребца, но ни один из них не дрогнул. После долгого молчания грифина коротко кивнула. — Думаю, я могу принять эти условия. Я не для того свергала рейдеров, чтобы самой стать одной из них, — её когти медленно застучали по столу. — Многие из моих «Когтей» родом из земель за морем, из Грифонии. Из Клаудбьюри. Когда в Империи вспыхнула революция, проигравшие повстанцы бежали на север, в Клаудбьюри. Там они придумали идею «республиканизма», согласно которой лидер страны является представителем, избранным простым народом. Уверена, вы слышали о Республике на севере. Похожая идея, создавшая стабильное общество. Эта система просуществует ещё долго после моего ухода.\n\nСтил Уолл удивлённо приподнял бровь. — Республика? Вы посылали своих наёмников на смерть только ради того, чтобы создать республику? А что, если вас не переизберут? — Гауда откинулась на спинку кресла. — Надо только предпринять меры, чтобы меня было невозможно сместить... по крайней мере, на первых выборах. Например, объявить о голосовании буквально за неделю, чтобы никто больше не успел выдвинуть свою кандидатуру. — Грифина вздохнула. — А что мне ещё остаётся? Провозгласить монархию? Вы явно не видели моих птенцов, раз думаете, что я доверю им власть хоть над чем-то. Диктатура? Не слишком-то отличается от власти рейдеров. Мы будем республикой, просто медленной и стабильной. — Она слегка усмехнулась. — Республика подобна винтовке с затвором. Дёрнешь слишком быстро – оружие заклинит. Будешь медлить – и схлопочешь вражескую пулю. Движение должно быть плавным. Если я позволю другим участвовать в этих первых выборах, это парализует систему. Сначала мы должны приучить простых пони к самой идее голосования, а уже потом давать им выбор. Это справедливый компромисс, Стил Уолл?\n\nЖеребец помедлил минуту и кивнул. — Поселенцы Разбитого копыта принимают это предложение."
 shatteredhoof.10.d.topaz:0 "Мы покончили с предателями и отвоевали свои земли, так что дела у нашей банды идут лучше, чем когда-либо прежде. Топаз довёл свои планы до конца, и теперь он может насладиться плодами своего труда. Или нет? Знакомое и привычное чувство жадности никуда не исчезло. Как он может остановиться в момент, когда вокруг столько всего, на что он может выдвинуть свои претензии? О нет, его амбиции далеко не удовлетворены. Топазу не нравится будущее, в котором он будет править маленьким заброшенным клочком земли, имея в подчинении лишь банду рейдеров. Они должны продолжать расширяться, претендовать на большее и стать силой, которая сможет посоперничать даже с величайшими нациями пустоши!"
 shatteredhoof.10.a:0 "В светлое будущее!"
 shatteredhoof.10.b:0 "Слава Топазу!"
 
 shatteredhoof.11.t:0 "Страсти улеглись" #Gawdyna has won
 shatteredhoof.11.d:0 "Когда Джованни получил приказ, он всерьёз подумывал дезертировать из «Когтей» Гауды. Взяться за оружие против Дэдайса и его пони, сражаться за Разбитое Копыто – молодому наёмнику это казалось безумием. Однако пятьсот патронов спустя опасения Джованни развеялись: он стоял среди разбросанных тел рейдеров в уже бывшей столовой. Их дешёвая броня и ржавое оружие не шли ни в какое сравнение с ухоженным и дорогим снаряжением наёмников. И всё же среди множества мёртвых пони можно было заметить и несколько павших грифонов. Джованни бил лёгкий озноб, в то время как ветераны расслабленно обыскивали трупы и курили, устроившись чуть ли не прямо на грудах тел.\n\nОдин из опытных наёмников поднял взгляд, предложил Джованни сигарету и негромко произнёс. — Первый бой, салага? — Джованни медленно покачал головой, забирая сигарету. — Нет, просто... всего пару дней назад я говорил с некоторыми из этих рейдеров, смеялся с ними. — Старший грифон кивнул, выпустив струю дыма, и откинулся назад: — Бывает. Но теперь всё изменится. Мы больше не просто наёмники. Мы перешли в высшую лигу. Осталось только приструнить ещё парочку банд. Обычная зачистка от вредителей. — Джованни нахмурился. — Это пони, а не вредители. Я не буду считать это простым истреблением радтараканов. Это трагедия. — Ветеран помедлил, а затем пожал плечами. — Рейдеры не совсем пони, если ты понимаешь, о чём я. Но... у тебя доброе сердце, птенец. И пока выполняешь приказы, всё будет в порядке.\n\nКак только старый грифон замолчал, сверху раздался громкий хлопок – тело рейдера рухнуло с балкона, пополнив гору трупов внизу. На балконе показалась Гауда с дымящейся винтовкой в когтях. Она окинула взглядом собравшихся бойцов. — Одного пропустили, птенцы! — Многие наёмники обернулись к ней, но Джованни не мог – он не сводил глаз с мёртвого пони, всё ещё истекающего кровью. Гауда снова заговорила. — Отдых закончился! Тюрьма под контролем, но снаружи ещё полно рейдеров! Голдбик, бери взвод и дуй к R-7, собери войска и боеприпасы. Мунталон, твоя группа перекрывает всё отсюда и до Нью-Манго – рейдеры не должны получить ни единого патрона из Шерхуфа. Бладай, Чистые наверняка попытаются воспользоваться моментом, так что не дай им шанса. Кайзеркрест, веди своих к Короне: крепостные пытаются пересечь границу, мы должны показать дикарям, что всё ещё можем их защитить. Живо!\n\nГрифоны разбрелись, похватав оружие и патроны. Старый наёмник рядом с Джованни ухмыльнулся, медленно поднимаясь на ноги. — Ну что, салага? Готов пострелять по крепостным?"
 shatteredhoof.11.a:0 "У Разбитого Копыта новая хозяйка."
 
 shatteredhoof.12.t:0 "Страсти улеглись" #Topaz has won
 shatteredhoof.12.d:0 "Гауда погибла, а вся банда Разбитого Копыта склонилась перед своим истинным повелителем - драконом по имени Мистер Топаз. В его голосе слышатся раскаты чистой ярости, в его глазах пылает вечная жадность, и он доказал, что достаточно силен, чтобы справиться с головорезами Красного Глаза. Теперь ему снова нужно воссоединить банду, что он делал уже много раз через своих марионеток, и вернуть контроль над территорией."
 shatteredhoof.12.a:0 "Мистер Топаз дракон!?"
 
 shatteredhoof.13.t:0 "Стабильная восточная граница"
 shatteredhoof.13.d:0 "Мы разобрались с нашим врагом на востоке. [LRA.GetNameDEF] капитулировала почти сразу, как только наши армии вошли в регион. Хотя многие вольные рейдеры и мелкие отколовшиеся банды всё ещё оказывают сопротивление, вскоре мы их уничтожим и укрепим свой контроль над территорией. Эта победа показала всей Пустоши, что Разбитое Копыто не стоит недооценивать: мы более чем способны защитить себя от любых врагов. Однако нельзя забывать, что §Rдержава [LRA.GetNameDEF] была далеко не единственной угрозой на востоке.§!"
 shatteredhoof.13.a:0 "Наконец-то хоть какая-то стабильность."
 
 shatteredhoof.14.t:0 "Начало чего-то великого"
 shatteredhoof.14.d:0 ""Greetings, citizens of Shattered Hoof, and all ponies who are listening in from our allied states. My name is Gawdyna Grimfeathers, current leader of Shattered Hoof. Earlier this year, I, and my loyal Talons, overthrew the raiders and slavers that held dominion over this fair nation. Alongside with Marshal Steel Wall, and many, many lost lives, both Talon and Settler alike, we have made a new home for us all. The time of Shattered Hoof has come to an end, no longer are we a country whose name will cling to a past of violence and death. As of today, I'd like to announce our country as the Provisional Republic of Azuria, where I shall lead as President until such a time that the Republic has been secured from foreign threats. Today, we begin to build something new, a truly Equestrian republic, combining together the old ideals of friendship, harmony, and democracy into one ideology, which will forever lead us forward. Elections will be organized as soon as the Republic is secured, where you, the citizens, will be able to choose your own leader. Some of you may be curious-"\n\nGiovanni ignores the radio playing in the bar, sat in a quiet corner away from it, slowly sipping from a drink, eyes darkened and withdrawn. Medals hang from his uniform, most proud among them the Azurian Honor Medal, given only to the bravest soldiers of the new republic. Yet, the medal is almost entirely hidden behind other medals, shamefully pressed as far back from sight as it can be. He looks into his drink, claws feeling dirty, ears lightly ringing. The others in the bar crowd around the radio, leaving him alone. That is, until the chair across from him is pulled out, and a pony stallion sits within it, wearing a suit. The stallion speaks after a second, "Giovanni Guiseye, aren't you? It's a pleasure. Rock Solid."\n\nGiovanni looks up after a minute, looking over the stallion, and slowly nodding, "That's me." Rock Solid smiles slightly, "You fought in Corona against the Amethyst raiders, right? I used to be the Mayor of Leslie before those raiders came and took it over. Rumor has it that the President is going to put me there again." He takes a second, "Anyway, I wanted to thank you. Kaisercrest might have fallen in Corona, but he gave me and my stallions enough time to escape into Shattered Hoof. You saved a lot of lives." Giovanni just slightly nods, "Not enough." Rock takes a second before he responds, "Never enough. Well, I know a lot of the new army looks up to you. I do too. If you ever have some spare time, swing on by Leslie and maybe we can talk. General Olive Branch and I have something planned." He then stands, as Giovanni looks up at him, "Enjoy your drink, Mister Giovanni. Long live the republic." Giovanni slowly nods, "Long live the republic.""
 shatteredhoof.14.a:0 "Long Live The Republic!"

shatteredhoof.1401.t: "Heroes"
shatteredhoof.1401.d: "The cylinder of a revolver clicks over one space, the hammer of the gun being pulled back ever so slightly, before being released. Giovanni's claws shake slightly, every click of the hammer, sat on the stage where he was once rewarded a medal. Called a hero. The hammer clicks again on an empty chamber, and he sighs softly, lowering it, looking over the polished surface of the silver gun, Sherhoof Arms stamped on the gleaming metal. His thoughts are interrupted by a hen's voice, 'I heard you were around here.' He looks up, seeing Regina standing there, giving him a small grin, 'Come to relive the medal giving ceremony, Hero of Corona?'\n\nHis grip tightens in his revolver, and he looks down, 'I'm. . . that's not me. Please don't call me that.' She nods, and comes closer, sitting next to him, 'Well, then you better give me a name I can call you, or I might just keep on calling you that.' He takes in a shaking breath, and closes his eyes, before slowly letting it out, 'Giovanni. Giovanni Guiseye.' She grins slightly, 'Well, nice to meet you, Giovanni. I'm Regina, Grimclaw. We met once before. You didn't look so hot back then. Don't look so hot now, either.' He opens his eyes, and looks over at her, and then looks away, 'I shouldn't be here. I should have died in Corona. . . I wish I did.' He shakes his head, 'Hero. Hero, they call me that. Hero of Corona. I wasn't the one who died. I wasn't the one who was left behind. I just ran away! Hero?! What hero does that!?' He snaps his head back to look at her, 'All for your mother. The blood on my claws, it was for her! And for what? To be called a hero? I should be dead, but here I am, bedazzled in medals and congratulations!'\n\nShe looks at him, losing her grin as she does. She takes a second, and looks away, 'Yeah. I get it. I'm not happy with some of what my mother's done either.' She taps her talons on the stage, 'I killed a slave. In The Pure. He saw me when I was sneaking up close, before I took down the guards. He started making noise, and if he kept on doing it, I'd be caught. Killed. So I shot him. Right between the eyes. Best damn shot in my life.' She stays looking away for a moment, and then looks back at Giovanni, 'You're right. We don't deserve this. We're just the ones who survived. But we're the ones left, Giovanni. I think of his face every night, the look of hope in his eyes. One day, when I die, Boreas is going to judge me. I hope by then, I can maybe do enough good to make up for my mistake.'\n\nGiovanni stays quiet, looking at her, then he speaks softly, 'A filly. Amethyst had a filly in their army. It's. . .' He sighs softly, and looks ahead, 'I was invited, the other day, to talk to General Olive Branch, Governor Rock Solid. They have something planned, and they want me there. Politics, I imagine.' Regina smiles softly, 'Go, Gio. We aren't heroes, but. . . but maybe, we can still do good.' He looks back at her, a small smile appearing on his face"
shatteredhoof.1401.a: "To Leslie"
 
 shatteredhoof.15.t:0 "The Pegasus Question"
 shatteredhoof.15.d:0 "Gawd sits in her overly cramped office, reports and papers waiting to be signed stacked in unstable towers, while Sheriff Steel Wall and General Olive Branch sit in front of her. She nods, 'Gentlestallions, we have an issue. While we were busy fixing the South, enemies have gathered at our borders, posing a major threat to the Republic. The Grand Pegasus Enclave poses a threat to the longevity of this Republic, and we aren't leaving this room until we've decided what to do about them. Sheriff, I expect you to speak on behalf of Sherhoof, Olive Branch, speak for the army. If I'm making this decision, it's not going to be alone. Sheriff Steel Wall, you can speak first.'\n\nSteel Wall nods respectfully, 'This isn't a question, Madam Interim-President, there's only one answer here. The Enclave are too big, and too close, of a threat for us to ignore. We have everything to lose, and everything to gain.' He sets a hoof on the desk, 'Those Pegasi are looking down on us right now, because they see us as the threat we are. Fillydelphia's a roving band of raiders, they don't fear them, but we? We're a proper nation on the rise, we're the inheritors of Equestria, we have thousands of willing volunteers who will march to their death tomorrow if it means taking out those winged bastards!' He huffs, 'Every day our ponies look into the sky, they see a reminder of who our true enemy is. This Enclave, these Pegasi, they've taken our birthright for two centuries, they've let our home starve for sunlight, they've let famines go uncontrolled, with just a bit of sunlight would solve it. The Enclave has already killed millions of ponies through their theft of the sun, and I won't have us sit here for another minute, while they kill more!' He slams his hoof down, and then leans back, 'We should march through those damned swamps and tear down their clouds, bit by bit, bullet by bullet. Those who survive will make for good citizens, too. Give me fifty Pegasi and I can bring rain to a drought, give me one hundred and no pony will ever starve again. Give me a squad in power armor and we can fly into Fillydelphia tomorrow, and kill Red Eye in one night!' He leans back, and smooths out his uniform, 'There's no debate here. Besides. You promised justice in the South, Madam Interim-President. So let's bring justice to the skies.'\n\nOlive Branch immediately speaks up, 'Madam Interim-President, it is true that the Enclave is a threat, but it isn't our place to strike first. Imagine how it'll look to the common ponies, they'll think you're just another Ruby Rose, expanding for your one benefit. The Enclave are horrible, but if we are to go to war, we need to wait for them to attack us, and all the nation will rally. Besides, we can't sustain a war effort. Our factories have just barely gotten back to functioning across the nation, our soldiers hardly have enough ammunition to train, let alone go to war. The Hayseed Swamps will devour our supplies until our soldiers have nothing to fight with but their hooves and teeth. If we are to attack the Enclave, we need to ensure we will win, and we will win decisively. How many thousands would die if we attacked now? Enough that the swamps would turn red.' Steel Wall speaks up, 'What about the Hayseed ponies? They're fleeing the Enclave's control, thousands fill Fort Sherhoof by the day, who knows what they're doing to them?' Olive Branch shakes his head, 'If they are fleeing then we will welcome them! How many will die in the crossfire if we march in today?'\n\nGawd holds up a claw as Steel Wall makes to respond, 'That's enough. Sheriff Steel Wall, you had your time to speak, and as your ally, I have listened. Olive Branch, thank you.' She looks between them both, 'You both made good points. But only one of you were correct.'"
 shatteredhoof.15.a:0 "Olive Branch's Pragmatism Wins Out."
 shatteredhoof.15.b:0 "Steel Wall's Aggression Wins."
 
 shatteredhoof_ncr.1.t:0 "Предложение об объединении"
 shatteredhoof_ncr.1.d:0 "Мы получили предложение от Временной Республики Азурия. Они хотят, чтобы наши земли вошли в состав их республики, которая теперь будет управляться новым коллективным демократическим правительством. Также в предложении утверждается, что экономическое сотрудничество и интеграция вооруженных сил значительно улучшат качество жизнь всех граждан альянса. Предложение рекомендует нам провести голосование среди граждан по вопросу об объединении с Азурией. Если мы станем одним из основателей нового государства, то получим огромную выгоду в долгосрочной перспективе. Однако так мы потеряем большую часть нашей автономии. И вряд ли Гаудине понравится наш отказ."
 shatteredhoof_ncr.1.a:0 "Мы рады присоединиться."
 shatteredhoof_ncr.1.b:0 "Это уже слишком."
 
 shatteredhoof_ncr.2.t:0 "Рождение Новой Кантерлотской Республики"
 shatteredhoof_ncr.2.d:0 " 'Good day, Talons, Sheriffs, Greenwayers and Hooflocks, New Mangoites, ponies from across Azuria and Leslie, my name is Gawdyna Grimfeathers. Over the past month, the leaders of the members of the defensive alliance unifying our lands have met in Shattered Hoof. Over this month, we have argued and discussed the creation of a new state, a state that will be, unquestionably, the power of southern Equestria. It is my pleasure to announce to everyone listening today that, as of five minutes ago, we have signed a constitution into place, officially creating the New Canterlot Republic. We are the official successor to Equestria, which has long been dead. Others, like Red Eye in Fillydelphia, might claim their own status as a successor, but it is only this fair Republic that will act on the old ideals of Equestria. Friendship, Harmony, Democracy, Freedom, these four values will guide our society into the future, to create a better society than this land has ever seen.\n\nDuring the war, the state of Equestria did many horrible acts, acts that we will never repeat. The Ministry of Morale's surveillance, the unethical experiments of the Ministry of Arcane Sciences, the corruption of the Ministry of Wartime Technology, the censorship of the Ministry of Image, the unbridled power of Princess Luna; these will have no place in our society. The constitution of our fair republic will ensure this, bounding the power of the President, and of all government representatives. Feel free to go to your local town hall to ask for the full list of rights the constitution grants to you. Most important of them are freedom of speech, to ensure Morale can never again exist, freedom of the press, to prevent Image from ever happening again, and freedom of religion, to protect the minority groups of our republic. As a republic, it is paramount to our rights, and is center in our constitution, the right that every citizen has to elect their own representatives. Elections will be held, and you, the common creature, will be able to vote on the way forward for our country, like never before seen in this land.\n\nDespite the mistakes of the Diarchy in the past, we will still pay tribute to the alicorn sisters for protecting our land for so long. On our new flag, there will be Luna's moon, and Celestia's sun, symbols to make sure we never forget our own history. Our flag will be a tricolor, like most republican flags. It will have purple on it, representing the republic itself, a reference to the Zonician Republic of ancient times. White on it will represent the purity we promise to bring to the wasteland, its color that of Celestia's fur, as we will return the land to the health it once had under her. Finally blue, representing the Azureway, our economic lifeline, based off of Luna's fur color, as she brought Equestria untold modernity and prosperity in her short rule. Our flag already flies high above New Canterlot, the new capital of the Republic, founded in the old city of Junctiontown.\n\nLong may Equestria live, long may be our citizen's lives, long live the Republic.'"
 shatteredhoof_ncr.2.a:0 "Three Cheers!"
 
 shatteredhoof_ncr.4.t:0 "Проблемы интеграции"
 shatteredhoof_ncr.4.d:0 "The sounds of shouting and routine gunfire fill Camp Quarrel, as soldiers from all over come together as one. An Azurian officer stands, watching grenade practice, 'Before you throw a grenade, you need to shout to warn your fellow soldiers.' A Hooflocker steps up to the throwing line, blinking as they look at the crates of items to throw, 'Uhh, sir, these are potatoes. Why are we throwing potatoes instead of real grenades?' The officer steps closer to the Hooflocker, smirking, 'Because real grenades are valuable. In fact, a lot more valuable than you.' He picks up a potato and slaps it into the hoof of the Hooflocker, 'Now get throw-' Before he can finish his sentence, a former Rock Farmer, rescued from Greenway. speaks monotonely, 'Fire in the hole.' She picks up a potato and throws it at a practice target, nailing it in the head, squishing the potato. The officer scowls, 'I said to shout when you're throwing!' She looks over, and blinks, tilting her head, 'I did shout.' He scowls more, 'You also are throwing way too strong, filly.' She tilts her head more, and looks at the potato, then back at the officer, blinking again, 'You expect me to do weaker than that?'\n\nElsewhere, a Leslie former-serf aims a bolt-action, hitting a target dead on, while a thestral loads magazines next to them. The former-serf grins slightly as he cocks the bolt-action of his rifle, 'Whew, this reminds me of my time before we escaped. Used to work for the Miner's Guild.' The thestral nods, 'Miserable conditions are the same?' The stallion grins, 'And our 'masters' are even worse. Heh, back then, though, I had this magazine with a picture of ol' Luna in it, wearing this nice, blue dress. Got me through a lot of tough times, you know, Luna's a looker, well, was a looker.' The thestral looks up and frowns, 'Luna's my goddess, dickhead.' He looks over and smirks more, 'Hey, if a bit of worship got her next to me in a wedding dress, I'd call her a goddess too, buddy.' The thestral scowls, throwing down the magazine, and tackling the stallion.\n\nThe officer rubs his eyes as the Hooflocker's potato splats against the ground, 'You would have just killed us all if that was a real grenade.' His ears twitch and he looks over, as the thestral and the Leslie soldier start to fight, 'Shit.' He rushes over, watching as the thestral wails hit after hit onto the stallion beneath, 'Stop! Stop this instant!' The thestral shouts out, slamming their hooves down on the stallion's face, 'My goddess is not some cheap hooker, you fuck!' The officer moves in to break them apart, but all goes still as a voice booms across the entire camp, 'Stop!'\n\nA potato comes flying like it was shot out of a cannon, smacking right into the thestral's head, sending them flying off the Leslie soldier. The Rock Farmer mare stands proud, and then looks confused as everyone turns to look at her, 'What? I shouted this time.'"
 shatteredhoof_ncr.4.a:0 "This Is Gonna Take A While"
 
 shatteredhoof_ncr.5.t:0 "Демобилизация экономики"
 shatteredhoof_ncr.5.d:0 "Теперь, когда наши насущные проблемы решены и республика более-менее стабильна, мы можем заняться восстановлением гражданской экономики. Милитаристы в нашем правительстве обеспокоены тем, что это может привести к полному краху нашей республики, но президент Гаудина заявила, что их опасения - не более чем параноидальные фантазии. Грифина напомнила им, что цель нашего правительства заключается в том, что мы должны служить народу, а не армии. Наши граждане рады этим изменениям, так как качество их жизни повысится, владельцы бизнеса увеличат свою прибыль, а смены заводских рабочих станут более лёгкими и короткими."
 shatteredhoof_ncr.5.a:0 "Долгожданное возвращение к миру."
 
 shatteredhoof_ncr.6.t:0 "First Election of the New Canterlot Republic"
 shatteredhoof_ncr.6.d:0 "The streets of Leslie are lively with celebration as the results of the election are announced. Gawdyna Grimfeathers and the United Republican Party have won every seat across the nation, ensuring her position and her agenda as President. Within city hall, Governor Rock Solid paces, while Giovanni watches, nursing a drink. Rock shakes his head, "I can't believe this. 'Free and fair elections' my ass! What's the point of an election if you can only choose one candidate, one party?" He scowls, "I submitted my paperwork day one, immediately after I was able to, but nope, didn't get filed in time, guess I didn't appear on the ballots. That would have been a problem for 'Madam President', democracy? What's that? Never heard of it!" He trots up to a window and looks outside, to the streets filled with celebrating ponies, "She would have won anyway! Imagine what this looks like to outsiders, to The Republic, to Friendship City, it's ridiculous, even the Commonwealth would laugh at us! This isn't a democracy, this is a dictatorship with votes, I guess we have a new Luna in charge!"\n\nGiovanni nods softly, watching Rock pace, "She's afraid, Rock." Rock looks over, and he continues, "She's wrong. I didn't. . . I didn't fight for her to pull this stunt. The blood we spilled, for this? It's ridiculous, you're right. You're right. But she's afraid." He looks away, speaking softer, "We lost a lot of Talons, a lot of brothers and sisters, fighting the raiders. Fighting Amethyst. Her own chicks were almost killed a few times." He pauses, and shakes his head, "She doesn't want everything to go to waste. All the sacrifice, all the. . . all the blood." The door to the room opens, as Giovanni continues, "She just needs to be not afraid, and we'll make sure this can't happen again. Next election. Until then, we. . . we fight for the republic. On the battlefield, and in the streets."\n\nFrom the open door, Olive Branch steps in, "The cock's right, Rock Solid, our constitution gives us a chance. Gawd was able to do this because she's far more popular than anyone else, so we need to change that." He looks toward Giovanni, and gives him a nod, before looking back towards Rock, "Gawdyna is going to lead us to war. Blood is going to spill, and we need to seize that opportunity. For every widow, every orphaned foal, we will be there to offer them another choice. Our road isn't going to be easy, but come next election, we'll make sure there's a choice. A choice between blood, or peace. The army respects me. The citizens of the east respect you, Rock. Giovanni, lots of the common soldiers and veterans like you. We've all seen our fair share of blood." He looks between the two, "No more blood. The Equus Amnesty Party will bring proper democracy, peace, and justice. Are you two in?"\n\nRock looks out the window, seeing a few ponies looking out from inside their own houses, "This land's filled with old serfs, saw their families sent away to war. Others watched as the raiders killed their foals. Leslie's lost more than it can take. I'm in, Olive." After a minute of silence, the other two stallions looking at him, Giovanni nods. He looks down at his talons, and closes his eyes, smelling blood faintly, hearing the echoes of gunfire. He opens his eyes, and looks back up, "No more blood. I'm in.""
 shatteredhoof_ncr.6.a:0 "Long Live President Gawdyna"

shatteredhoof_ncr.6001.t: "Democracy"
shatteredhoof_ncr.6001.d: " 'How did I know I'd find you here again?' Regina makes her way into an auditorium, once used for speeches and awards, now being repurposed into a theater. Giovanni sits on stage, looking up as she enters, only to give her a weak smile, 'Because I knew you'd find me here.' She smirks slightly and comes up to the stage, sitting next to him, 'That sounds like a bad pick-up line, Gio.' He smiles a bit more at her, before looking away, breathing in softly, 'There's going to be a speech tomorrow. General Olive Branch, Governor Rock Solid, they're founding a party. A party for peace.'\n\nRegina smiles widely, 'An opposition party? That's great! I mean, I agree with the pacifism too, but honestly, the fact that we held elections without an opposition party. . . well, my mom and I got into a fight about that, at least.' Giovanni nods softly, 'I don't blame her, she's afraid that all her sacrifices will be for nothing. I. . . I understand her, I think. She has a lot to lose. Like you.' He clears his throat, 'But, umm, they want me up there, too. They think my position as-as a hero, it'll help popularity. Apparently a lot of common soldiers, younger soldiers, are. . . fans of me, I guess. They want me to wear my medals on stage. They want me to be their hero, they want me to be. . . to be their pawn. Their knight in gleaming medallions. But every time I think about it, I feel sick. I think about Corona. About her.'\n\nRegina is silent for a minute, looking over at him, 'Do it, Gio. The Republic needs a strong opposition, Olive Branch, Rock Solid, they need you. We need a voice for peace, and you know better than anyone how much peace is needed. And. . .' She sighs softly, and smiles, 'It's what she would want, Gio. There are millions just like her, all across the wasteland. And if nobody speaks up for them, then they're going to be next. I know it'll hurt, and it'll be hard, but they need an advocate. They need their hero.' He looks back at her, into her eyes. A minute passes, and he smiles again, 'Thank you.'"
shatteredhoof_ncr.6001.a: "The Republic Needs Heroes"
 
 shatteredhoof_ncr.7.t:0 "The Equus Amnesty Party Founded! "
 shatteredhoof_ncr.7.d:0 "Giovanni stands on stage, looking over a crowd of thousands of ponies, filling the central square of New Canterlot. He remembers last time, receiving his medal, now brought out of its shameful hiding to be displayed proudly on his chest. A request from Olive Branch, the medal gleaming in the dim sunlight. He looks out over the crowd, a mixture of respectful voices, their voices whispering to each other, looking up at him. Governor Rock Solid stands next to him, and gives him a small nudge from the side. Giovanni looks over, and Rock gives him a small nod. He stands straighter and prouder, his feathers puffing out as he looks over the crowd.\n\nThe crowd goes silent, as General Olive takes the stage, stepping up to a microphone, "Thank you, every creature, for coming to listen. Thank you to every member of our proud armed forces, every politician, and every voter. Today, history is made, my friends. Our first election was rife with controversy, from the decision to have it take place before other parties were created. A vote with only one choice is not a choice at all, many would say, yet our Republic still represents something great in the world. Yet no democracy survives with one party alone. That is why, today, I'd like to announce the creation of the Equus Amnesty Party, a party of peace, prosperity, and justice. As you can see, I have already secured support from renowned hero of the Battle of Corona, Giovanni Guiseye, and Governor of Leslie, Rock Solid. Mister Giovanni saw firstclaw the horrors of war, the death and destruction it can cause. Governor Rock Solid has seen the lasting effects, the widows, the orphans, the starving veterans. To this, I say, no more!"\n\nGiovanni almost looks away, but he stands proud, nodding along as his name is said, and Olive continues on, "The United Republican Party is a party of war, of blood and death, President Gawd will lead our fair ponies nowhere but the grave! We spend thousands of caps on bullets and bombs, while our foals don't know how to read, while our citizens toil day to dusk to barely afford food for the next morning! This is a disgrace! We are not the police of the Wasteland, it is not our role to decide who should and shouldn't die, while we ignore our own citizens!" The crowd loudly cheers, with him waiting for the cheering to die down, before he continues, "Our Republic has already overstepped our bounds. When we marched into Leslie and crushed the Amethyst Liberation Army, we killed hundreds of ponies who were just trying to protect their home! We gave lives to take lives, just to please the imperialist mindset of our President! How long will it be before that happens again? How long will it be until your spouse, your foal, your parents die in some foreign field, just to enrich our 'President'? How many need to die to sate Gawd's greed? I don't know about all of you, but I don't want to find out!"\n\nThe crowd cheers loudly, and Giovanni smiles widely, standing straight, his eyes meeting the eyes of dozens in the crowd. He only stops when he hears Rock mutter beside him, "What does he think he's saying?""
 shatteredhoof_ncr.7.a:0 "Welcome To Democracy"

shatteredhoof_ncr.7001.t: "The Union"
shatteredhoof_ncr.7001.d: "Giovanni gives a soft smile to a journalist, camera flashing in front of his eyes. He can hear screams in the distance, but the sounds of the crowd drown them out. Before another journalist can come up to him, Regina bounds up to him, grinning widely, 'That was amazing! Now we're a proper republic! You did great up there, Gio.' He looks at her, smoothing his ruffled feathers, his talons shaking as he does, 'I. . . it felt good, Regina, it felt really good. But I felt like throwing up the entire time.' He chuckles nervously, and gives her a smile, 'You know, maybe next time, you could join us, H-Hero of The Pure?' She smiles back, 'I would if I could, but my mom would kill me if I got involved in anything.'\n\nAn older hen speaks from behind Regina, 'That's an exaggeration.' She steps aside, as Gawdyna Grimfeathers approaches Giovanni. The older hen looks into his eyes, 'I see you've been talking to my daughter, Giovanni Guiseye.' He looks back at her, and then over at Regina, then back at her. He stands straighter, 'Y-yes, Madam President. She's a friend.' Gawd smirks softly, 'Good, she needs friends. Giovanni. . . You were part of Kaisercrest's crew, weren't you? In Corona?' He nods softly, before she continues, 'I respect what you've done here. I remember seeing you in my office, looking like a stiff breeze would knock you out. Good luck in the next elections, chick.'\n\nHe looks into the older hen's eyes, and smiles softly, giving her a small nod, as she gives him one in return. Before he can speak more, Governor Rock Solid steps closer, 'Giovanni. We have an issue. I need you to come with me right now, we need to talk to Olive.' He looks over at Gawd, who stares right back at him, 'Governor.' He nods, 'Madam President.' He looks back at Giovanni, 'Come on.' He turns and trots away, with Giovanni slowly following after him.\n\nGawd and Regina watch him leave. Gawd looks to the younger hen, 'So when am I going to have some grandchicks?' Regina shakes her head and walks away, 'S-shut up, mom.'"
shatteredhoof_ncr.7001.a: "For Peace"
 
 shatteredhoof_ncr.8.t:0 "The Divide"
 shatteredhoof_ncr.8.d:0 ""Leslie was a mistake?!" Giovanni sits in the Equus Amnesty Party's headquarters, his eyes looking down at the floor while Rock Solid shouts. Rock slams his hoof down on Olive's desk, "They were using foals as soldiers, Olive! You heard what Giovanni went through, are you seriously saying that we should have let them live?!" Olive takes a deep breath, "How many of those foal soldiers did we kill when we attacked them, Rock? How many parents lost their children because of us? Yes, the Amethyst Liberation Army was bad, but we could have solved it some other way. There were good ponies there." Rock scowls, glowering down at Olive, "Is this what you meant by 'peace', Olive? This isn't peace, this is cowardice! What, are you just going to sit by as Fillydelphia expands? Watch as they whip their slaves, kill thousands every day? You just can't handle getting some blood on your hooves!"\n\nGiovanni looks at his talons. They feel dirty. Olive stands up, staring down Rock Solid, "Is that supposed to be wrong, Rock?! Yes, I don't want blood on my hooves, that doesn't make me a coward, that makes me sane! We can help ponies, we can free them, it doesn't have to be through blood! We can make deals, we can integrate them slowly, like the Rock Farmers, like the Fishers, like Mango, no blood needs to be spilled! Conquest isn't the act of a moral republic, Rock, it's the act of a raider." Rock slams his hoof down again, and then turns and trots away, shaking his head, "Raider?! You would compare us to them!? We aren't going to war for loot or tribute, we're going to war to free ponies, that's what peace is! If you stand idly by while others die, then that's no peace at all!" Olive scowls, "I'm sure the dead appreciate their liberation, Rock. When I said peace, I meant just that, peace. War is a wrong to avoid!" Rock spins around, "Wrong? Is what Giovanni did wrong, Olive?!"\n\nHe stands and shouts, "Shut up!" Both stallions go quiet in an instant, heads looking over, as his feathers bristle, "S-stop using my name like I'm not here! Stop treating me like I'm some pawn! Stop pretending like I agree!" He pants softly, and closes his eyes, smelling blood, breathing shakily, "I killed a filly, it was just instinct, I didn't mean to do it! And for what, why, why did I do it? Just so I could live? S-so we could protect some stretch of land?" He shakes as he opens his eyes, which water up, "I was wrong! If I could go back, I'd rather shoot myself than-than do that ever again! Why do you think I'm here?!" He sniffs slightly, and turns away, "If this party can save even one filly, maybe I won't think of her every night. . . I killed her to save myself. I might as well do something valuable with my life." He then turns back to Rock, "So yes, I was wrong! And if you disagree, if you think I was right to shoot that filly, then leave. Now! Get out and take everyone with you who agrees! And don't ever, ever come back!"\n\nRock looks at Giovanni, and then at Olive. After a minute, he trots out, leaving the two of them behind. Olive slowly comes from behind his desk, approaching Giovanni and nudging his side, "I. . ." Giovanni looks back at him, and nods slightly, "Let's save fillies, Olive." Olive takes a second, and then nods, "Let's save fillies.""
 shatteredhoof_ncr.8.a:0 "War In The Party For Peace?"
  
 shatteredhoof_ncr.9.t:0 "Основание Патриотической Лиги"
 shatteredhoof_ncr.9.d:0 "Marshal Steel Wall sits in his personal office, looking at the stallion across from him, a smirking Pegasus wearing mirrored shades over his eyes. The Pegasus speaks up, wearing a fine suit, "Marshal Steel Wall, it's a pleasure to meet you, I'm so glad you finally accepted a meeting with me. I'm Agent Muddied Waters, part of the now defunct intelligence service of Neighvarro. From asking around, I've picked up that you represented the settlers of this fine nation when Gawdyna Grimfeathers was still taking over, is that correct? And many of those settlers are now members of the armed forces." Steel Wall nods, "Yes. Get to the point." Agent Waters grins softly, "Now now, I'm not a rushing type of stallion, you'll have to bear with me. See, I understand from that little tidbit of history that you, Marshal Steel Wall, are a stallion of the common pony. You secured representation for the common settler, not to mention well paying jobs in the army, while Gawdyna Grimfeathers was busy playing rebel in an old prison. You, Marshal Steel Wall, are a stallion to respect. And you have plenty of that respect."\n\nSteel Wall slowly nods, as Agent Waters continues, "Gawdyna Grimfeathers doesn't represent the common pony, you see. That election she held? Laughable. The Grand Pegasus Enclave wasn't the perfect democracy, of course, but even we had the decency to provide at least two options for every vote. And the opposition parties? General Olive Branch would have us sit around and wait until Red Eye puts chains on us all, and Governor Rock Steady is too pacifistic for the militarists, and too militaristic for the pacifists. Your republic needs a savior, Marshal Steel Wall, and I think there's no better savior than you." He snorts slightly, "Why would you want to help us? We conquered you." Agent Waters smiles, "Yes, you did conquer us, now I am part of your country, and I'd rather my country not collapse to invasion again. I'm a patriotic stallion at heart, Marshal Steel Wall, and I love democracy. Right now, this country needs someone willing to protect its democracy from the one who founded it."\n\nSteel Wall takes a second, and then slowly nods, "You want me to become a politician?" Agent Waters chuckles softly and smiles, "Astute as ever, Marshal Steel Wall, yes, I want you to become a politician. I can promise many of the Enclave will support you, as will many militarists. You need to use the bully pulpit to call for investment into the armed forces, and all the industry connected to it. You need the support of the commoners, because if the day comes where Gawdyna decides to do away with this facade of a democracy, those commoners need someone to stand up for them, and do what's right for the republic."\n\nHe takes a second, and nods once more, "I see your point. Well, Muddied Waters, how does campaign manager sound instead of agent?" Muddied Waters grins slightly, "That sounds perfect to me, future President Steel Wall.""
 shatteredhoof_ncr.9.a:0 "Who Protects The Republic?"
 
 shatteredhoof_ncr.10.t:0 "Первая ежегодная конвенция ОРП"
 shatteredhoof_ncr.10.d:0 "Объединенная Республиканская Партия провела свой первый ежегодный съезд. Это мероприятие предназначено для чествования достижений ОРП, а также для обсуждения дел партии и её будущей политики. Сторонники партии и правительственные чиновники, лояльные Гаудине, собрались, чтобы прослушать и обсудить выступления различных партийных чиновников. После длинной вступительной речи от самой Гауды последовала серия выступлений от многих партийных чиновников. Каждый из них, казалось, пытался превзойти предыдущего оратора в плане фанатизма и патриотизма. Такое поведение было бы приемлемо для съезда Патриотической Лиги, но никак не ОРП... Почти до самого конца съезда всё шло без сучка без задоринки.\n\nНеожиданно министр финансов по имени Уотеруоркс поднялся на трибуну вскоре после объявления о закрытии съезда и призвал всех выслушать его слова..."
 shatteredhoof_ncr.10.a:0 "..."
 
 shatteredhoof_ncr.11.t:0 "Речь секретаря Уотеруоркса"
 shatteredhoof_ncr.11.d:0 "— Граждане НКР и участники этой конвенции! Я хочу обсудить сегодня с вами то, как функционирует наша великая нация. Само наше правительство в его нынешнем состоянии крайне ущербно. Наши первые выборы также прошли совершенно некорректно, а лидерство из копыт вон плохо представляет нас как народ и нацию...\n\n... — Наши первые выборы президента были наглым и совершенно бессмысленным мошенничеством. Это факт. Какой смысл в избирательном процессе, если на них был представлен только один кандидат? Ни у кого не было времени попытаться бросить вызов кандидатуре Гаудины. Да и она сама не пылала желанием провести честные и открытые выборы, а лишь раздавала пустые обещания. Гаудина на самом деле была озабочена тем, чтобы побыстрее покончить со всем этим и вернуться к управлению нацией, не заботясь о том, что в стране есть те, кто не поддерживает её. В прошлом она служила в качестве наёмницы безжалостному работорговцу. Это является прекрасным доказательством того, что она стремится лишь к личной славе и власти, а не к улучшению качества жизни народа пустоши. Поэтому я заявляю, что её режим крайне аморален и незаконен...\n\n... — Тот факт, что грифон правит нацией, большинство населения которой составляют пони, подрывает репрезентативность правительства НКР и представляет собой прямую угрозу для самой большой демографической группы нашей нации. Крайне важно, чтобы эта грифина покинула свой пост и позволила воплотиться в нашей нации истинной репрезентации. Кресло президента должны занять истинно достойные лидеры, а не какая-то там мелкая наёмница с претензиями на власть и богатство. И если эта наёмница когда-нибудь осмелится баллотироваться на следующий срок, то тогда я объединю тех, кто согласен с моими недавними аргументами, и отделюсь от этой нелегитимной партии, чтобы воспрепятствовать сомнительным целям этой грифины.\n\nУотеруоркс после этого говорил ещё час. Он заявил, что президентство Гаудины незаконно, и что если она будет баллотироваться на следующих выборах, то ему придётся расколоть партию и создать собственную фракцию - Партию Свободных Пони. Слова Уотеруоркса действительно раскололи ОРП: некоторые оскорбляли его и называли предателем, а другие выразили поддержку храбрым словам и заявили, что Гаудина - предательница идеалов НКР, которой пора уйти в отставку. Хаос разгорелся ещё сильнее, когда прибыла военная полиция. Пока неясно, что будет после этого резкого поворота событий. Но теперь мы знаем точно, что Гаудина лишилась немалой части поддержки в своей партии."
 shatteredhoof_ncr.11.a:0 "Что сейчас произошло?"
 
 shatteredhoof_ncr.12.t:0 "Акт о гражданстве одобрен"
 shatteredhoof_ncr.12.d:0 ""Good morning, citizens of the New Canterlot Republic, this is your President speaking. I am proud to announce to everyone that today, a new mark in history has been made for our great nation. For too long, many in this land have seen Equestria as a nation, purely, of ponies. Before the Last Day, Equestria was treated as a place for earth ponies, pegasi, and unicorns alone, even the thestrals were excluded. In the aftermath of the Last Day, the ponies of the Wasteland didn't learn their lesson. They changed citizenship, not to include others, but to exclude the pegasi who left them. This, all of this, has been a stain on this land, on our fair republic, for too long. Harmony, friendship, democracy, these things are not limited by species. Feathers or fur, claws or hoof, stripes or no, we are, all of us, rational, thinking beings, deserving of our natural rights.\n\nMany would embrace the griffons of our country, but try to reject others. Many will make claims of danger, or inbred criminality, or unintelligence. Many will blame for past mistakes, past misdeeds and failures. All of these are flaws that we, as a nation, must work to overcome. Last night, in a session of the Senate, the 'Citizenship Act' passed almost unanimously, granting, in one grand sweep, citizenship to every creature in our fine nation. It does not matter where you come from, we will not make the mistakes of the past, we will accept you. Like I said, every creature is deserving of our rights, and we would be damned to turn any freedom loving individual away from our borders, from our halls of power, from our nation.\n\nCelestia and Luna, for all their benefits, had this as one major flaw. When the griffons of Nova Griffonia exiled the Yaks from the west, Equestria did not open its doors with open hearts, instead, they let the Yaks find their own place. When we pushed back the Buffalo, we didn't take them in as valuable citizens, instead, we treated them as if they were enemies. When changelings fled from Mad Queen Chrysalis' failed unification wars, Equestria did not open their hearts for their love-bug friends, but slammed the gates shut on them. No more, I say. Be you alicorn, or hellhound, changeling, or deer, be you pony, zebra, or griffon, equine, avian, bovine, all creatures have a place here. All creatures have a home here. Thank you for listening. Long live the republic.""
 shatteredhoof_ncr.12.a:0 "A Home, For All."
 
 shatteredhoof_ncr.13.t:0 "Фельдмаршал Стил Уолл протестует"
 shatteredhoof_ncr.13.d:0 "Governor Rock Steady sits in his home, listening to a radio while he pens law proposals and acts for the United for Peace Coalition to listen to. On the radio, it switches quickly from songs, to a speech, given by the familiar voice of Marshal Steel Wall, ". . . It is obvious that these military reforms the President seeks to pass are nothing more than a grab at power by her. When the armed forces of our republic were created, we swore an oath to protect the constitution we helped write, we swore to protect the democratic rights of every citizen in our borders! We've seen the President slowly eroding the very rights she helped to establish, sham elections, wasting of the budget without caring about our citizens, and now, she wishes to cut back the armed forces, the last line of defense of our rights? If we continue to sit around and watch idly as she takes more and more power, then soon, we'll be nothing more than puppets dancing on Gawd's strings!"\n\nRock frowns softly, and flips the channel, hearing a much more smooth voice speaking, Campaign Manager Muddied Waters, ". . . What Marshal Steel Wall is saying is correct, and, I might even hold, far too kind for what is truly happening. Madam President Gawdyna Grimfeathers says that her proposed military reforms will make it more efficient, she says that by removing the influence of the army, they will ensure civilian governance forever. However, I cannot help but notice, the civilian governance just so happens to be filled with members of the United Republican Party, bar the few who have defected to other parties. Our military serves to protect the decency and democracy of this nation. What Madam President Gawdyna Grimfeathers asks of us is not to allow the military to not interfere, it's to stop the military from saving our country should the time come. And might I remind all of you listening about Madam President Gawdyna Grimfeathers' personal Talon company? She's already shown a willingness to use them to get her way, are we willing to sit by and trust a President unchecked, with her own private military force? I think not."\n\nRock frowns and changes the channel once more, hearing the familiar voice of Olive Branch speaking, ". . . While I must agree that we need to prevent the army from having an influence over our civilian government, to prevent us from becoming a junta in all but name, I must protest and question the motives behind this sudden decision. With the URP holding complete control over our nation, neglecting those of us who don't agree with their point of view, one must question if this reduction in military oversight of the government is just a way to hide upcoming controversial decisions. We must have a transparent government, and Gawdyna isn't going to give us one willingly, my fellow citizens."\n\nRock switches off the radio entirely, and sighs. It seems like the Equus Amnesty Party and Patriotic League are in one against Gawd's decision here. She'll be looking for support, and if she can't find it, then she'll likely draw back her decision. Rock picks up a piece of paper, realizing what he writes will determine the future of the country. After a minute, he puts pen to paper."
 shatteredhoof_ncr.13.a:0 "A Letter of Disapproval"
 shatteredhoof_ncr.13.b:0 "A Letter of Agreement"
 
 shatteredhoof_ncr.14.t:0 "Акт об Анклаве"
 shatteredhoof_ncr.14.d:0 "Gawd finds herself in her office once again, looking down at The Enclave Act, an Act that, if passed into law, would pardon all Enclave personnel. Across from her sits Steel Wall, and Campaign Manager Muddied Waters, a constant grin on his face. Gawd looks up from the act, "You have five minutes to convince me to support this comedy." Steel Wall gives her a steely nod, "The Enclave didn't show us mercy when we fought, but we didn't either. Their officers and scientists were following the orders of a flawed state, that doesn't mean they were evil, it means the state they served was evil. There are brilliant minds being kept in our prisons, minds which could lead us to victory against Fillydelphia, which could unlock the secrets of energy weapons, of power armor. With the Enclave on our side, we can ensure nobody, not Red Eye, not the Steel Rangers, nobody can oppose us."\n\nGawd shakes her head, "This is ridiculous, you want to empower the military, of course. Do you think I'm blind? Here you are, sat with some suit by your side, telling me to give you more power, do you think I'm an idiot? I see this for the grab for power it is. Your party is supported by the Pegasi, supported by the army, so of course, let's release a bunch of Pegasus criminals who will flock to the army. Am I supposed to be surprised when I eventually see them as part of a coup, Steel?" Steel frowns, "I am loyal to this republic, Gawd. I want what is best for it, but you think this is a grab for power. The United for Peace Coalition support this too, even the EAP are partly for it. The nation is asking for you to release them. If only you hadn't rigged the last elections, this might have been solved as the commoners want." She scowls, "I won't have my republic be filled with criminals let loose! Look at what they did while they served the Enclave."\n\nMuddied Waters clears his throat, and smiles, "My apologies, Madam President Gawdyna Grimfeathers, but I'm afraid there's a point of contention. It is true that these officers and researchers did bad things under the command of the Council, I'd never deny that. But, if I'm not wrong, wasn't it you, Madam President Gawdyna Grimfeathers, who worked under the Shattered Hoof Raiders for years as an enforcer?" She scowls more and opens her beak to speak, but he cuts her off, "Not to imply anything about your character, you are an unimpeachable bastion of this nation's values. Yet to the common pony, it might be seen as a point of hypocrisy if you were to punish these Pegasi so harshly. I can only imagine the whispers among the other opposition parties if they heard what was happening here. Of course, it's not my place to decide such important matters, but you, Madam President Gawdyna Grimfeathers, are the mother of the republic. You have a reputation to keep.""
 shatteredhoof_ncr.14.a:0 "The Act Fails"
 shatteredhoof_ncr.14.b:0 "The Act Passes"
 
 shatteredhoof_ncr.15.t:0 "Контакт с Фарсайтом"
 shatteredhoof_ncr.15.d:0 "To the west of New Canterlot is the region of Appleloosa, and, of particular note, the city of Old Appleloosa. Old Appleloosa has long been the center of the southern slave trade, with their slavers going across the south of Equestria, grabbing poor ponies and shipping them north to Fillydelphia. The only real opposition to the slavers are those who believe in the idea of 'Mixie', a party that simply wants to do slavery in a kinder way, and not align with Red Eye in the north. If the slavers stay in power, then Red Eye will likely protect them, and if those 'Mixie' believers take over, then they'll likely be able to put up a good fight against us.\n\nHowever, amongst the deserts of Appleloosa are the Appleloosan Rangers, a group of survivalists and well-trained special forces who have long believed in the call for freedom that our republic stands for. They've opposed slavery at every turn under the command of Farsight. Despite all their opposition, though, they're unable to change Old Appleloosa on their own. Recently, though, a detachment of Rangers arrived in New Canterlot, asking to make a deal.\n\nThe Rangers plan to cause a rebellion in Old Appleloosa, allowing New Canterlot to intervene and support them, making for a much easier conquest. The only issue is, the Rangers want to be autonomous, while they'll support the Republic, they'll still operate on their own. If we accept their offer, it'll make for an easier conquest, but it'll take much longer if we ever hope to core the agricultural lands of Old Appleloosa. However, many in our nation support the Rangers, and if we were to turn them away, it would cause some protest from many groups."
 shatteredhoof_ncr.15.a:0 "Aid the Rangers"
 shatteredhoof_ncr.15.b:0 "Turn the Rangers Away"
 
 shatteredhoof_ncr.17.t:0 "Результаты переписи в НКР"
 shatteredhoof_ncr.17.d:0 "Наши переписчики усердно работали и заходили в каждую дверь в каждом городе НКР, чтобы подсчитать всех граждан нашей республики. Данные по мере поступления подсчитываются и обрабатываются региональными отделениями бюро по переписи населения, созданного специально для решения этой задачи. Мы должны получить данные по каждому поселению, вне зависимости от его размера, чтобы узнать точное количество проживающего в нашей стране населения. Перепись ещё продолжается, но мы уже сделали удивительное открытие относительно земель вокруг Нового Кантерлота. Оказалось, что там есть большое..."
 shatteredhoof_ncr.17.a:0 "...количество граждан призывного возраста, не зарегистрированных в качестве призывников."
 shatteredhoof_ncr.17.b:0 "...сообщество существ без документов."
 
 shatteredhoof_ncr.18.t:0 "Подготовка к проникновению"
 shatteredhoof_ncr.18.d:0 "Мы никогда не видели более мощного щита, чем тот, что защищает центр управления ПОП. Ни одно оружие не может пробить его, ни одно заклинание не может обойти его, и даже наши самые лучшие умные умы никак не могли придумать, как можно преодолеть этот щит. До сегодняшнего дня.\n \n Команда, взявшаяся за задачу проникновения в эту неприступную крепость, разработала план, который, по их мнению, должен привести к успеху. Они хотят взять заклинание обхода, которые раньше считались слишком слабыми, и превратить его в полноценное мегазаклинание. Этого, по их мнению, будет достаточно, чтобы позволить небольшой команде телепортироваться сквозь щит на объект.\n \n Сразу после восхода солнца план начинает осуществляться. Команда самых талантливых единорогов из НКР занимает свои позиции, а другая команда ещё раз проверяет огромную матрицу заклинаний, созданную вокруг щита, на наличие каких-либо ошибок. После завершения начальной подготовки единороги начинают колдовать, вероятно, сложнейшее созданное после войны заклинание. Весь Нейварро просто вспыхивает, поскольку единороги черпают все больше и больше энергии из двух огромных магических реакторов. Один из них уже был установлен на базе, а второй был снят с "Хищника" - облачного корабля Анклава. Свет разгорается всё ярче по мере завершения заклинания. Члены экспедиции готовится к проникновению за щит. Вся энергия мегазаклинания высвобождается в ярчайшей вспышке и... "
 shatteredhoof_ncr.18.a:0 "ВПЕРЁД!"
 
 shatteredhoof_ncr.1811.t:0 "В чреве зверя"
 shatteredhoof_ncr.1811.d:0 "Команда оказывается в самом сердце объекта в окружении многочисленных терминалов и самого современного на конец войны электронного оборудования. Члены команды не могут не оценить сложности объекта, в котором оказались. Образцы самых передовых технологий, что впечатляют даже по меркам Эквестрии военного времени, усеивают стены. К несчастью для учёных, на первый взгляд они не заметили никакого очевидного способа отключения щита. \n \n По мере того как они продолжают исследовать комнату, учёные сталкиваются с другой проблемой: похоже, что большая часть объекта всё ещё заблокирована, а двери не открываются. Хотя они оказались в самом центре управления, у команды учёных нет никакого реального способа взять под контроль объект. Выхода из комнаты нет, а рации отказали сразу же после пересечения щита. Так что связаться с внешним сейчас тоже нельзя. Весьма вероятно, что учёные попали в смертельную ловушку, которая может стать их могилой. \n \n Учёные постепенно начинают понимать, в какой ситуации они оказались, и среди них разгорается паника. Сбежать из комнаты нельзя, их миссию выполнить невозможно, так что их жертва будет напрасной. Но внезапно один из мониторов вспыхивает перед ними."
 shatteredhoof_ncr.1811.a:0 "..."
 
 shatteredhoof_ncr.1812.t:0 "Спящая богиня пробуждается"
 shatteredhoof_ncr.1812.d:0 "— Здравствуйте, мои маленькие пони.\n\nНа мониторе возникла фигура, будто сошедшая со страниц старинных книг. Учёные увидели грациозный силуэт давно почившей принцессы Селестии, чья цифровая грива развевалась на виртуальном ветру. Реакция участников экспедиции варьировалась от полного оцепенения до жгучего любопытства. Однако даже столь внезапный поворот событий не заставил их забыть о том, что они всё ещё заперты в этом комплексе.\n\n— Могу я узнать, кто возглавляет вашу группу? — осведомилось изображение. Глава экспедиции вышел вперёд и заговорил: — Я. Ты – компьютер, управляющий этим объектом?\n\nПризрачный силуэт на мгновение усмехнулся. — Нет, я не компьютер. Хотя именно я контролирую этот комплекс. Могу я узнать твоё имя?\n\nГлава экспедиции на секунду заколебался, но всё же ответил: — Меня зовут Нью Рок. А тебя?\n\n— Я, мои дорогие маленькие пони — Селестия. И я должна извиниться за своё негостеприимство. Боюсь, я была не самой радушной хозяйкой.\n\nУчёные обменялись быстрыми, встревоженными взглядами, после чего Нью Рок заговорил снова: — Селестия мертва. Так что ты либо самозванка, либо обезумевший ИИ. Но это неважно. Меня заботит лишь то, как вытащить мою команду из этой западни.\n\nИзображение на миг помрачнело. — Я и не собиралась удерживать вас здесь. Теперь путь наружу открыт. Но имейте в виду: боюсь, я не смогу впустить тебя или твою команду обратно, когда вы уйдёте.\n\nСтоило изображению произнести эти слова, как одна из дверей, ведущих из центра управления, с шипением отворилась. Нью Рок быстро восстановил дисциплину и повёл группу к выходу. Все двери на их пути послушно открывались, пока учёные не подошли к проклятому силовому щиту. Завеса замерцала и исчезла, позволяя им выйти наружу. Радостные возгласы научной команды резко оборвались, когда щит за их спинами восстановился вновь."
 shatteredhoof_ncr.1812.a:0 "Командование нам ни за что не поверит."
 
 shatteredhoof_ncr.19.t:0 "Полосатый вопрос"
 shatteredhoof_ncr.19.d:0 "Glyphmark has long been known as one of the worst places to live in the Wasteland, only rivaled by Hoofington and Gutterville for its pure squalor. For their history, the zebras of Glyphmark have not only had to deal with all the dangers of nearby Canterlot, but they've also been subject to alicorn raiding parties, and raiders from Ponyville. Countless zebras would disappear in the night, or be taken in large raiding parties, shipped southwards to Appleloosa or to Fillydelphia to serve as slaves. The zebras of this region have come to be naturally distrustful of ponies, defensive of their own species and suspicious of any outsiders.\n\nEven though we passed the Citizenship Act so long ago, many citizens are still suspicious of zebras, or even blame them for the Great War. Many have called for the republic to not give any courtesy or aid to the zebras of Glyphmark. Instead, prevailing among many in the republic is the idea of 'separate but equal' a revival of an old Equestrian policy. The zebras of Glyphmark will be allowed to stay in their home, and would not be expected to provide anything to the republic, yet they will also not be aided or protected by the republic either. Many in both the republic and Glyphmark support this idea, thinking it will help preserve both communities.\n\nHowever, Glyphmark is in squalor, and even if they are suspicious of outsiders, they will accept aid if it is offered. The republic has far more than enough resources to help build Glyphmark back into a proper town, it will be costly to fix them up, but it could pay out well as an investment. In addition, though the zebras might be suspicious of the republic as it is, if we help them out, they might come to help the republic in turn."
 shatteredhoof_ncr.19.a:0 "Segregation Works" #(add a state modifier to the core states of Glyphmark disallowing them to be cored, gives 5% stability)
 shatteredhoof_ncr.19.b:0 "Provide Aid" 
 #(Unlocks Legionary special forces, give each state of Glyphmark a myriad of rare resources, give national spirit that gives 20% consumer goods factor for 180 days)
 
 shatteredhoof_ncr.20.t:0 "Проникая в Стойло 32"
 shatteredhoof_ncr.20.d:0 "После нашей победы над Стойлом 32 их пони попросту решили отступить в свой дом и запечатать за собой дверь. И Стойло проявило себя крепким орешком. Нашим первым препятствием стала сама дверь, которая доказала, что Стойл-Тек действительно постарались на славу. Нашим командам потребовалось несколько недель и более десятка различных попыток, чтобы найти способ обойти эту дверь. Оказалось, что проще вырыть подкоп под дверью, чем пытаться силой пробиться через неё. Следующим препятствием стали остатки жителей Стойла, оказавшие нам отчаянное сопротивление. Они ставили баррикады посреди каждого коридора и устраивали ловушки или засады в комнатах и помещениях Стойла. Многим нашим выжившим бойцам, что сражались в узких коридорах этого Стойла, до конца жизни будут сниться кошмары об этом ужасном месте. Но даже после того, как мы потеряли столько жизней, просто пытаясь захватить это проклятое место, мы столкнулись с новой проблемой. Все их компьютерные системы оснащены системой шифрования военного уровня. До сих пор наши инженеры и программисты не могли похвастаться особыми успехами при взломе этих компьютеров, но они не опускают копыта и когти и продолжают попытки."
 shatteredhoof_ncr.20.a:0 "Ясно."
 
 shatteredhoof_ncr.21.t:0 "Наша политика относительно Мейнхеттена"
 shatteredhoof_ncr.21.d:0 "Мейнхеттен некогда был одним из самых крупных и богатых городов Эквестрии. И мы вернём городу это былое процветание. Но прежде чем это произойдет, мы должны сначала определить наш подход к Башне Тенпони. Если до сих пор Мейнхеттен сотрудничал с нами, то будет разумно и логично соблюсти наши обязательства перед ними и позволить Мейнхеттену сохранить часть своей автономии. Но если на то будет наша воля, то мы всегда можем предать их. Однако если лидерство Башни Тенпони до этого сопротивлялись нашим попыткам установить дружеские отношения с ними, то они не оставили нам иного выбора, кроме как применить против них силу."
 shatteredhoof_ncr.21.a:0 "Они оказались верными союзниками."
 shatteredhoof_ncr.21.b:0 "Теперь они бесполезны для нас."
 shatteredhoof_ncr.21.c:0 "Они знали о последствиях неповиновения."
 
 shatteredhoof_ncr.22.t:0 "НКР желает дальнейшей интеграции"
 shatteredhoof_ncr.22.d:0 "Наши отношения с Новой Кантерлотской Республикой были довольно неплохими, поскольку НКР оказывала нам всевозможную экономическую и военную помощь пока мы работали над восстановлением города Мейнхеттена. А теперь они обратились к нам с предложением перейти на новый уровень сотрудничества. В обмен на то, что мы передадим НКР часть нашей автономии и станем подчиняться их законам, правительство Республики обещает увеличить инвестиции в наш город и продолжать оказывать помощь в борьбе с любыми кризисами, с которыми мы можем столкнуться. Конечно, многие из наших пони выразили возмущение таким предложением. Тем не менее, мы выиграем довольно немало и действительно станем процветающим городом благодаря тесным связям с НКР."
 shatteredhoof_ncr.22.a:0 "Мы принимаем их предложение."
 shatteredhoof_ncr.22.b:0 "Мы вежливо откажемся."
 shatteredhoof_ncr.22.c:0 "Сотрудничество? Мы хотим быть полноценным штатом!"
 
 shatteredhoof_ncr.23.t:0 "Антикризисное управление"
 shatteredhoof_ncr.23.d:0 "Наша нация столкнулась с очередным кризисом. После краха Анклава и его городов в небе десятки, если не сотни тысяч пегасов спустились с небес в нашу нацию в поисках убежища. Некоторые из них были довольно хорошо вооружены, так что нашей армии пришлось постараться, чтобы утихомирить их, прежде чем они начали задумываться о восстании. Однако главная проблема заключается в том, что теперь у нас внезапно возникла нехватка продовольствия для этих бесчисленных новых ртов.\n\nМногие из наших ферм уже и так работали на износ, но теперь из них высасывают все соки, что прокормить волну из тысяч новых пегасов, спускающихся к нам. Это приводит к огромной нагрузке на нашу экономику и её сельскохозяйственный сектор, который был весьма плохо приспособлен к такому притоку новых жителей. Это привело к резкому и значительному росту цен на продовольствие по всей стране. А теперь мы получаем сообщения, что наши собственные жители начинают голодать. Наши возможности по решению этого кризиса ограничены, но если мы не разберёмся с ним в ближайшее время, то ситуация лишь сильнее ухудшится."
 shatteredhoof_ncr.23.a:0 "Это должно стать нашим главным приоритетом!"
 shatteredhoof_ncr.23.b:0 "Мы окажем помощь в ограниченном масштабе."
 shatteredhoof_ncr.23.c:0 "Нас волнует лишь стабильное функционирование экономики."
 
 shatteredhoof_ncr.24.t:0 "Друзья или враги?"
 shatteredhoof_ncr.24.d:0 "The New Canterlot Republic isn't the only country to claim to be a successor to Equestria, and, technically, it's not the most legitimate. The Steel Rangers are a continuation of the Ministry of Wartime Technology, one of the many Ministries that comprised the Equestrian government during the war, and a very effective military unit during the war. They are famous across the wasteland for their technical knowledge, using power armor and heavy weaponry to take dangerous technology, in order to 'protect it' in their bunkers. Some Steel Ranger chapters are beyond negotiating, like in Fillydelphia, who are hated for often killing as many innocent Wastelanders as they kill of Red Eye's forces.\n\nIn the northern city of Manehattan, however, a Steel Ranger chapter exists that isn't utterly despised by ponies. The Manehattan Contingent are famous for destroying the Manehattan Raiders and pushing them across the Lower Mare River, allowing the many city-states of Manehattan to revolt against Raider control. There are also stories of the Steel Rangers working alongside Tenpony Tower to kill the Sunriders, the Raider gang that once owned the land comprising the Speedfreaks and Rain Riders. Of course, like all chapters, Manehattan has an unhealthy obsession with technology, and plenty look at them with distaste.\n\nThe story of the Manehattan Continent seems familiar to Gawd's own story, though, a group of well-armed soldiers overthrowing a Raider group that owned a whole empire. Due to this, many in the republic want to ally with the northern Rangers. In addition, all that power armor and heavy weaponry would be a boon in future wars, while it would be painful to fight against. The decision, in the end, falls to Gawd."
 shatteredhoof_ncr.24.a:0 "Send A Request For Alliance"
 shatteredhoof_ncr.24.b:0 "We Continue Alone"
 
 shatteredhoof_ncr.25.t:0 "Интересное предложение"
 shatteredhoof_ncr.25.d:0 ""Нация", называющая себя Новой Кантерлотской Республикой, прислала сегодня к нам дипломата с весьма интересным предложением. В обмен на наше сотрудничество с их державой и её армиями они готовы как вложить значительные средства в развитие нашей военной промышленности, так и непосредственно помогать нам в ходе боевых действий. Это выгодное предложение, но в случае согласия нам придётся воевать на стороне НКР в потенциально нежелательных для нас конфликтах. Примем ли мы такое предложение?"
 shatteredhoof_ncr.25.a:0 "Мы согласны!"
 shatteredhoof_ncr.25.b:0 "Нет, мы не согласны!"
 
 shatteredhoof_ncr.26.t:0 "Отказ со стороны рейнджеров"
 shatteredhoof_ncr.26.d:0 "Мейнхеттенские Стальные Рейнджеры ответили отказом на наше щедрое предложение. Хотя это, безусловно, печальный исход, мы всё же не удивлены. Когда придет время, эти рейнджеры будут силой интегрированы в нашу республику, независимо от их мнения по этому вопросу."
 shatteredhoof_ncr.26.a:0 "Жаль."
 
 shatteredhoof_ncr.27.t:0 "Предложение Филлидельфии-Паниса"
 shatteredhoof_ncr.27.d:0 "Теперь с Филлидельфийскими Стальными Рейнджерами покончено, но мы должны решить, что делать с их территорией. Остатки их отделения всё ещё сопротивляются нам, устраивая засады на патрули и укрепляя свои оставшиеся опорные пункты. Также нельзя не упомянуть о многочисленных бандах, досаждающих нам. Нашим силам приходится непросто, но мы уже получили ряд предложений, которые помогут справиться с этой проблемой.\n\n Во-первых, мы можем попытаться связаться с Мейнхеттенскими Стальными Рейнджерами в надежде на то, что они готовы работать с нами. Мы постараемся уговорить их перенести все свои операции на бывшую территорию филлидельфийского отделения, по сути продолжив их миссию.\n\n Во-вторых, мы могли примириться с остатками старого отделения и помочь им возродиться. В таком случае им, конечно, придётся принести присягу нашей республике, а также отказаться от части своей автономии. Да, вряд ли они будут считать нас друзьями, но это, по крайней мере, решит проблему контроля над этим регионом.\n\n Или мы могли бы ничего не делать. В конце концов, мы не первый раз сталкиваемся с сопротивлением нашему режиму."
 shatteredhoof_ncr.27.a:0 "Отправьте послание в Мейнхеттен."
 shatteredhoof_ncr.27.b:0 "Мы сами разберёмся с сопротивлением."
 shatteredhoof_ncr.27.c:0 "Свяжитесь с остатками отделения."
 
 shatteredhoof_ncr.28.t:0 "Предательство"
 shatteredhoof_ncr.28.d:0 "Несмотря на наше сотрудничество в прошлом, правительство НКР решило, что мы, вне зависимости от наших желаний, должны немедленно стать частью их республики. Мы срочно готовимся к обороне, так как их вооруженные силы, несомненно, уже совсем скоро выступят на нас."
 shatteredhoof_ncr.28.a:0 "Они пожалеют об этом!"
 
 shatteredhoof_ncr.29.t:0 "Предложение от НКР"
 shatteredhoof_ncr.29.d:0 "До сих пор наши отношения с НКР были достаточно дружественными. Поэтому никто не удивился, когда они решили выдвинуть нам ещё одно предложение. Но оно было весьма и весьма необычным. Наше сестринское отделение в Филлидельфии пало, это нам хорошо известно. Однако вся их территория и активы теперь перешли под контроль НКР, которой, по-видимому, весьма непросто управлять всем этим. Они хотят, чтобы мы перенесли все свои операции в южную Филлидельфию, где мы сможем продолжить работу нашего потерпевшего поражение отделение. Конечно, в таком случае нам придётся бросить Брыклинский Крест и прочие активы в Мейнхеттене, которые НКР тут же приберёт к копытам. Согласны ли мы на такое предложение?"
 shatteredhoof_ncr.29.a:0 "Замечательная идея!"
 shatteredhoof_ncr.29.b:0 "Мы не будем в этом участвовать!"
 
 shatteredhoof_ncr.30.t:0 "Последователи Апокалипсиса"
 shatteredhoof_ncr.30.d:0 "Moontalon stands in Gawd's office in New Canterlot, the pitch black hen looking odd among the old Equestrian style architecture, her armor contrasting the proper uniform Gawd wears from across her. Gawd gives her a nod, "Moontalon, I need a status report on that group you mentioned before." Moontalon looks around for a second more, before looking to Gawd, nodding, "They call themselves the Followers of the Apocalypse, they've already gotten a pretty good spread around the nation. They embed themselves in schools and hospitals, providing education and healthcare, issue is two things. One, they seem to be working alongside some unsavory characters, Alicorns and Hellhounds, apparently the Alicorns are detached from the Unity, but we can't be sure if any of them aren't spies. On top of this, they're spreading ideas around to those they heal and teach, ideas like the Equus Amnesty Party, world peace and all that. They're led by a mare called Velvet Remedy."\n\nGawd frowns, her talons tapping on the desk, "Peaceniks. Equestria used to have issues with them all the time. They make themselves useful to the state so they can try to spread their ideas against the state. They're likely being funded by the EAP, with their pacifist ideas." She frowns more, and then nods after a second, "We can't allow them to continue as they are. They'll spread their poison and make themselves too vital to get rid of, we need to preempt them, and get rid of them. Try to find any example where their Alicorns or Hellhounds act out, get evidence of it. Try to find any dirt on them that you can. We need to stop them before it's too late, we can't have them act against us when our greatest wars come."\n\nMoontalon nods, "Understood, Gawd, I'll get it done. But, umm, to be honest, they seem pretty above board. Their medicine is clean, their members are pretty kind, and they seem pretty clean. What if we can't find anything in them?" Gawd scowls, "Then we'll make something to catch them with. Illegal chems planted in one of their clinics, a false flag, blackmail, any of it. Moontalon, I can't stress this enough. They will kill our republic. We need to strike them first." Moontalon takes a second, and then snaps a salute, "I'll get it done, Gawd.""
 shatteredhoof_ncr.30.a:0 "At Any Cost..."
 
 shatteredhoof_ncr.31.t:0 "Followers Of The Apocalypse Arrested"
 shatteredhoof_ncr.31.d:0 ""Good evening citizens of the republic, this is New Canterlot Public Radio, here to tell the truth, no matter how bad it hurts. Late last night, NCPD performed a raid on the main headquarters of the Followers of the Apocalypse, following a lead about illegal chem production. Leading the raid was Miss Moontalon, who said to NCPR reporters, quote, 'Criminals will claw their way into any society by disguising themselves as being good. The Followers were a bunch of greedy criminals, buying sympathy from the common citizen while they poisoned our country.' Leader of the drug smuggling ring, Velvet Remedy, is now wanted for arrest and interrogation. Any information on her whereabouts will garner a one hundred cap-"\n\n"-sorrow that we see what has happened today. For once, my Equus Amnesty Party stands side by side with the United for Peace Coalition in denouncement of this illegal raid on the Followers of the Apocalypse. Many in our communities go without education and medicine, many die from preventable disease, many foals don't even know how to read, all because of the policies of the United Republican Party. The Followers have saved thousands of lives from sickness and poverty, Velvet Remedy is a pillar of everything we should be as a society. I, General Olive Branch, along with Governor Rock Solid, are calling for an official investigation into the raid on the Follower's headquarters. I believe it is no coincidence that our President has targeted this organization, for they spread the ideal of peace-"\n\n"-Steel Wall is still processing the events that have occurred with the Followers of the Apocalypse, I'm afraid. Many of his soldiers have sent him letters asking about it, asking for him to talk to Madam President Gawdyna Grimfeathers about amnesty for the Followers, no matter what they did. While the Followers were pacifists, their medicine and their doctors saved the lives of many soldiers, and their families. We may disagree with the political views of the Followers, but the Patriotic League thanks Miss Velvet Remedy, and every member of the Followers, for their service in this country. What has occurred here today is a complete miscarriage of justice, and I know that the Patriotic League will do everything in our power to secure justice for Miss Velvet Remedy. Now, if you have any questions, ple-""
 shatteredhoof_ncr.31.a:0 "They Won't Oppose Us Now"
 
 shatteredhoof_ncr.33.t:0 "НКР требует интеграции"
 shatteredhoof_ncr.33.d:0 "Новая Кантерлотская Республика выдвинула нам ультиматум: либо мы подчиняемся их требованиям и входим в их состав как полноправный штат, либо они попытаются навязать свои требования силой. Это вызвало возмущение и беспорядки по всей нашей стране, и многие призывают нас не принимать условия ультиматума, независимо от того, насколько безнадежной может быть война против такого мощного государства. Но действительно ли судьба стать одним из штатом НКР так уж плоха?"
 shatteredhoof_ncr.33.a:0 "Нам лучше стать штатом НКР."
 shatteredhoof_ncr.33.b:0 "Мы будем бороться за нашу свободу!"
 
 shatteredhoof_ncr.32.t:0 "Волонтёры с пустошей"
 shatteredhoof_ncr.32.d:0 "Новости про нашу приверженность делу борьбы за свободу быстро распространились по всей пустоши, и многие опытные существа направляются в республику, надеясь внести свой вклад. Хотя дорога впереди длинна и опасна, приятно сознавать, что многие видят в нас истинных спасителей пустошей. Мы надеемся, что эти добровольцы помогут нам, поскольку борьба за свободу важна для всех."
 shatteredhoof_ncr.32.a:0 "Мы никогда не откажемся от предложенной помощи."
 
 shatteredhoof_ncr.34.t:0 "В защиту демократии"
 shatteredhoof_ncr.34.d:0 "Положение НКР весьма аховое. Силы Красного Глаза дошли уже почти до самого сердца нашей страны, и правительство готово пойти на всё ради победы. Всех, кто может использовать оружие, посылают на фронт вне зависимости от личных желаний; каждый завод выпускает оружие и военные припасы; фермы отдают почти всю свою продукцию, чтобы прокормить войска; а граждане готовы пожертвовать личным имуществом, чтобы помочь ходу войны. Тысячи существ со всей пустоши и даже из самых дальних её уголков желают сражаться за последний и, возможно, единственный бастион демократии во всей пустоши. Правительство НКР делает все возможное, чтобы мобилизовать население на борьбу с армиями работорговцев Красного Глаза. Военная пропаганда столь интенсивна, что может посоперничать с кампаниями Министерством Морали двухвековой давности. Все эти жертвы и лишения граждан НКР не лишены оснований: если республика падёт, то вскоре все добрые существа пустошей окажутся закованными в цепи и будут до конца своих дней работать в напоминающих Тартар фабриках. Жизнь, свобода и стремление к счастью находятся под угрозой, когда кровожадные работорговцы у врат Нового Кантерлота отчаянно пытается переломить ход войны любыми средствами.\nВ своей речи президент Гаудина Грознопёрая призвала граждан НКР полностью посвятить себя войне и закончила свою речь словами:\n\n— Я спрашиваю вас: §RВЫ ГОТОВЫ К ТОТАЛЬНОЙ ВОЙНЕ??!!!§!\n\nТолпа взревела от радости и громко поклялась разорвать всех работорговцев на куски во имя демократии."
 shatteredhoof_ncr.34.a:0 "МЫ ещё можем победить!"
 
 shatteredhoof_ncr.35.t:0 "Сражаясь с тьмой"
 shatteredhoof_ncr.35.d:0 "— Величайшее зло, с которым мы когда-либо сталкивались, теперь вторглось в наши земли. Демон по имени Красный Глаз и его легионы рабов из Филлидельфии и "Собора" неистовствуют по всем пустошам, порабощая всех, кто осмелится противостоять ему. Эти рабы становятся винтиками разрушительной военной машины Красного Глаза и помогают ему в чудовищной попытке восстановить Эквестрию согласно осквернённым и искажённым идеалам этого работорговца. Если это чудовище подчинит себе всю пустошь, то любое подобие нормальной жизни, дружбы или процветания просто утонет под телами бесчисленных рабов и рек крови, которые он пролил. Поэтому я прошу жителей НКР и добрых существ по всей пустоши сделать все возможное, чтобы выступить против этой угрозы и обеспечить, чтобы магия дружбы, которая положила начало Эквестрии, не исчезла в этот тёмный час.\n\nЭто отрывок из речи президента Гаудины Грознопёрой, которую та произнесла в Сенате. Речь была посвящена бушующей между НКР и её союзниками войне против армий работорговцев Красного Глаза. Уже сейчас нации, которые могут быть не согласны с нашей идеологией, но видят в Красном Глазе большую угрозу, прислали сколько смогли припасов и солдат, чтобы помочь НКР выстоять в этой войне. НКР очень благосклонно отнеслась к этим добровольцам и сделала многое, чтобы распространить по всей пустоши вести о том, что для победы над великим злом, что властвует над Филлидельфией и немалой частью Внутренних Земель, нужно действовать совместно. Но война началась совсем недавно и сейчас трудно сказать, будет ли достаточно всей этой помощи.\nРади НКР, а возможно и всей пустоши, мы должны выстоять против сил зла, возглавляемых Красным Глазом..."
 shatteredhoof_ncr.35.a:0 "Сейчас или никогда!"
 
 shatteredhoof_ncr.36.t:0 "Новая столица"
 shatteredhoof_ncr.36.d:0 "После объединения "Альянса Разбитого Копыта" в Новую Кантерлотскую Республику многое изменилось...\nНо одна вещь осталась неизменной. Правительства, которые хотят поддерживать хотя бы видимость функционирующего управления страной, нуждаются в массах бюрократов. Многие низкоуровневые чиновники остались на своих прежних постах, но вот самым талантливым и полезным настоятельно порекомендовали переехать со своими семьями в нашу новую столицу.\nДля облегчения процесса была создана государственная программа. С её помощью каждое существо, желающее переехать в Новый Кантерлот в течение ближайших шести месяцев, может сделать это за счёт правительства. Мы считаем, что такое предложение, несомненно, привлечет многих жителей пустоши.\nМы надеемся, что централизация нашей бюрократии поможет всем новым штатам стать неотъемлемой частью НКР и даже разжечь немного старого доброго патриотизма среди тех, кто лично увидит славу нашей столицы."
 shatteredhoof_ncr.36.a:0 "Чудесно."
 
 shatteredhoof_ncr.37.t:0 "Трущобы Нового Кантерлота"
 shatteredhoof_ncr.37.d:0 " "WE WERE PROMISED FREEDOM."\n\nThese words were spoken to me earlier today, by a group of slaves, escaped from Old Appleloosa. While the streets of New Canterlot might seem to gleam with gold and richness from the outside, when one examines it closer, they'll find a city in crisis. Away from the clean, well-constructed buildings of the government and the rich that fill New Canterlot proper, one can find slums, shacks built from scrap and trash, with no waste disposal, no plumbing, no comforts. Thousands of poor ponies fill these scrap houses, escaped slaves, former serfs, foals and chicks, all of them lovers of freedom, lovers of the Republic. Yet it seems that despite their desire for a better life in New Canterlot, they've been neglected by government programs, and from the factory owners of New Canterlot.\n\n"The minute they hear a Manehattan accent, they turn me away. I spent years working on Rain Rider vehicles, I'm as experienced as a pony can be expected to be. But I don't conform, and that means they don't like me." These words were spoken by a captive who escaped from the Rain Riders outside of Manehattan, who works to help build shacks for others in the slums. Rejected from every aspect of society and government, these desperate ponies have turned to do whatever they have to do to survive, "I had to rob a place last night. I left the Dust Reavers so I'd never have to do that again. But I've got a wife, and foals, and we don't got food. So I did what I had to do."\n\nWith the government neglecting these slums, action has been taken by other parties. The Equus Amnesty Party and United for Peace Coalition have been distributing food and medicine to all those they can, and have helped build better houses. Many witnesses even say that hero of the Battle of Corona, Giovanni Guiseye, was seen distributing food to children in the slums. Our reporters were unable to spot him during their time in the slums, but reports from witnesses claim that he encouraged the poor of the slums to organize protests, and force the government to listen to them. In this reporter's opinion, it is shameful that our government refuses to aid all of its citizens, and it is a betrayal of the promises of our nation.\n\n-Pen Ink, New Canterlot Reporter."
 shatteredhoof_ncr.37.a:0 "This Is Bad."
 
 shatteredhoof_ncr.38.t:0 "Великий Новый Кантерлот"
 shatteredhoof_ncr.38.d:0 ""IT FEELS LIKE OLD EQUESTRIA"\n\nWords spoken from a family of refugees, recently moved into New Canterlot, escaping from the Commonwealth-Khagnate conflict in the far north. These sentiments are echoed across the entire city, as, indeed, New Canterlot seems almost like a new city entirely. Gone are the many slums that used to dominate the outskirts of the city, instead replaced with suburban style wartime housing. Food is plentiful, and each passing day, more ponies and more houses are added to the city. Students flock to the new, expansive university and colleges that serve the entire republic, while foals take buses every day to class, learning with an almost pre-war education level.\n\nA lengthy speech was held by Madam President Gawdyna Grimfeathers in the capital, a symbolic re-opening of the city, fixed and made better than ever before. In it, she remarked on the wonder of seeing a land go from nothing more than an old junction to the thriving capital of a new nation, where no citizen needs to go hungry or cold at night. In a surprising show of unity to many, General Olive Branch of the Equus Amnesty Party, and Governor Rock Solid of the United for Peace Coalition came together to give their own speeches, congratulating the President for her efforts. Governor Rock Solid had this to say, "Though I have had many disagreements with the President, and I still do, we must always acknowledge when good has been done for our nation. Ponies are fed, sheltered, and clothed like never before. It doesn't matter what politics you hold, this is a good thing." Marshal Steel Wall has even organized a military parade, making a point to demonstrate the importance of the military-industrial complex in freeing many from poverty.\n\nYet, we must never forget how this change in New Canterlot came to be. Many hundreds, if not thousands, of ponies died in the slums, and it was only through active protest and calls for action from all facets of society that change was able to be made. While thousands get to enjoy the fruits of the government's labor, we must never forget those who weren't fortunate enough to survive to this point. Without our freedom of assembly, our freedom of speech, we never would have reached this point. We must always keep this in mind.\n\n-Pen Ink, New Canterlot Reporter."
 shatteredhoof_ncr.38.a:0 "To Our Wonderful Capital!"
 
 shatteredhoof_ncr.39.t:0 "Открытие Айронхаска"
 shatteredhoof_ncr.39.d:0 "Сегодня президент Гаудина Грознопёрая официально открыла недавно основанный город Айронхаск. Город был правительственным проектом, который намеревался доказать эффективность централизованно планируемых городов, а также подкрепить заявление нашего президента об освоении пустошей. Айронхаск расположен в лесистой местности между Лесли и Нью-манго и будет служить узлом, позволяющим торговцем со всех концов пустошей безопасно добираться до Азурвэя и, следовательно, наших рынков. Для быстрого заселения города большинство его зданий бесплатно раздавалось бездомным, а также вышедшим в отставку ветеранам.\n После инаугурации нового мэра Айронхаска президент произнесла короткую речь о достижениях сегодняшнего дня и о том, что вскоре всё это будет повторено, но уже в гораздо большем масштабе."
 shatteredhoof_ncr.39.a:0 "Ещё один город республики."
 
 ###Tenpony Negotiations###
 
 shatteredhoof_ncr.16.t:0 "Предложение от НКР"
 shatteredhoof_ncr.16.d:0 "Сегодня прибыл посланник из Новой Кантерлотской Республики с весьма интересным предложением. Для нас не стало сюрпризом, что Мейнхеттен, один из самых богатых и престижных довоенных городов, стал важным приоритетом для экспансии НКР. Конфликт между нами и республикой казался неизбежным, но власти НКР предложили соглашение, которое могло бы позволить нам не только избежать этого конфликта, но и получить новые территории. Если мы согласимся помочь им в захвате земель между Мейнхеттеном и теперешней территорией НКР, а также будем сотрудничать с ними, то власти республики готовы позволить нам сохранить не только большую часть территории, которую мы завоевали, но и весь Мейнхеттен. Это действительно хорошая сделка... возможно, даже слишком хорошая. Настолько ли мы доверяем НКР? Ведь они могут нарушить соглашение и нанести удар тогда, когда мы будем ещё слабы после войны."
 shatteredhoof_ncr.16.a:0 "Звучит как отличная возможность!"
 shatteredhoof_ncr.16.b:0 "Мы им не доверяем."
 
 shatteredhoof_ncr.1611.t:0 "Тенпони принимает наше предложение"
 shatteredhoof_ncr.1611.d:0 "Наш дипломат вернулся из Башни Тенпони с хорошими новостями. Они согласились сотрудничать с нами, а также углублять и расширять военное и экономическое сотрудничество между нашими нациями. Однако представители Башни Тенпони также предупредили нас о том, что они будут внимательно следить за нашей нацией и не обрадуются чрезмерным перемещениям наших войск вдоль их границы. Нас стоит вести себя осторожно с Башней, поскольку они по-прежнему относятся к нам с подозрением, хотя мы проявляем дружелюбие и готовы сотрудничать с ними. Однако мы займёмся решением этих проблем в будущем, так как сейчас нас волнует гораздо более насущный вопрос: мы должны разобраться с регионом Санрайз."
 shatteredhoof_ncr.1611.a:0 "Тогда давайте приступим к делу!"
 
 shatteredhoof_ncr.1612.t:0 "Тенпони отвергает наше предложение"
 shatteredhoof_ncr.1612.d:0 "Наш дипломат вернулся из Башни Тенпони с плохими новостями. Башня отказалась от нашего предложения, сославшись на то, что оно не слишком выгодно для них. Хотя нам придётся самостоятельно завоёвывать Санрайз, мы также сможем оставить все новые территории себе. Но и с самой Башней Тенпони тоже придётся рано или поздно разобраться, поскольку они стоят на пути к нашему доминированию в Мейнхеттене."
 shatteredhoof_ncr.1612.a:0 "Они пожалеют о своём решении."
 
 shatteredhoof_ncr.1613.t:0 "Санрайз наш!"
 shatteredhoof_ncr.1613.d:0 "Мы успешно захватили регион Санрайз и покончили со всеми бандами рейдеров и небольшими нациями, которые раньше удерживали эти земли. Теперь мы должны попытаться разделить эти новые территории между нами и Башней Тенпони, которая помогала нам в этом конфликте. Наша армия намного сильнее, а вклад в войну, соответственно, выше, так что будет справедливо, если мы получим подавляющее большинство новых территорий. Однако делегаты от Тенпони, скорее всего, не согласятся на такие условия. Мы созовём официальную мирную конференцию между нашими самыми опытными дипломатами и представителями Башни Тенпони, чтобы проработать детали соглашения и добиться наиболее выгодных для нас условий."
 shatteredhoof_ncr.1613.a:0 "Пора определить новые границы."
 
 shatteredhoof_ncr.1614.t:0 "Мирная конференция по вопросу Санрайза"
 shatteredhoof_ncr.1614.d:0 "Когда война закончилась, представители НКР созвали мирную конференцию, чтобы определить наши новые границы. Выбранный ими весьма тесный конференц-зал вскоре заполнился дипломатами от обеих сторон. Представители НКР прибыли подготовленным, поскольку их чиновник предоставил карту региона Санрайз с уже намеченными предварительными границами. После этого разгорелась жаркая дискуссия, в которой каждая из сторон пыталась добиться наиболее выгодных для себя условий. Нашим дипломатам приходится нелегко, так как представители НКР знакомы с дипломатией. \n\nПосле часа долгих и бесплодных обсуждений чиновник от НКР сделал шаг вперёд, и комната замерла в ожидании. \n\n — Ладно, мы уже достаточно обсуждали этот вопрос.\n\n Он обернулся на своих коллег позади, а затем бросил взгляд на ту область на карте, которую они готовы передать Тенпони. \n\n — За ваши усилия... Тенпони получит земли Дождевых Ездоков. НКР достанется остальная часть региона. Вас устраивает такое предложение?"
 shatteredhoof_ncr.1614.a:0 "Земель Дождевых Ездоков будет достаточно."
 shatteredhoof_ncr.1614.b:0 "Этого слишком мало!"
 shatteredhoof_ncr.1614.c:0 "Нас устраивают нынешние границы, не нужно ничего менять!"
 
 shatteredhoof_ncr.1615.t:0 "Тенпони требует больше земель"
 shatteredhoof_ncr.1615.d:0 "Несмотря на наши усилия жёстко контролировать ход конференции, представители Тенпони были весьма непреклонны в своих желаниях. Ясно, что они желают получить не только земли Дождевых Ездоков. Представители Башни выразили желание получить в своё распоряжение части Ржавого Остова и Фрисайда. Мы, конечно, не хотим отказываться от этих земель, но отказ от этого требования почти наверняка приведёт к тому, что мирные переговоры полностью провалятся, а наш альянс распадётся."
 shatteredhoof_ncr.1615.a:0 "Они были верными союзниками, пусть получат эти земли."
 shatteredhoof_ncr.1615.b:0 "Это недопустимо! Сделка отменяется."
 
 shatteredhoof_ncr.1616.t:0 "Тенпони требует сохранения нынешних границ"
 shatteredhoof_ncr.1616.d:0 "Несмотря на наши усилия жёстко контролировать ход конференции, представители Тенпони в другом конце зала недовольны любым нашим предложением. И они выдвигают собственное. Башня хочет сохранить границы в их текущем виде и оставить себе все захваченные земли. Они не желают нам уступать ни пяди земли и ясно дали понять, что это их последнее предложение. Мы можем принять их условия, или же отказаться. Но в последнем случае нашему альянсу придёт конец."
 shatteredhoof_ncr.1616.a:0 "Ладно, они убедили нас."
 shatteredhoof_ncr.1616.b:0 "Мы научим их не связываться с нашей республикой."
 
 shatteredhoof_ncr.1617.t:0 "НКР разрывает связи"
 shatteredhoof_ncr.1617.d:0 "Мы выдвинули собственное предложение дипломатам НКР, но потом всё пошло не так, как мы надеялись. Встреча была внезапно закончена по воле лишь одного представителя НКР. Нам сообщили лишь то, что теперь НКР разрывает все связи с нами. Любые дальнейшие попытки установить контакт с властями республики ни к чему не привели. А также мы получаем тревожные сообщения об активности войск НКР вблизи наших границ, которая началась всего через несколько дней после окончания встречи."
 shatteredhoof_ncr.1617.a:0 "Вероятно мы совершили ошибку."
 
 shatteredhoof_ncr.1618.t:0 "НКР соглашается"
 shatteredhoof_ncr.1618.d:0 "Мы выдвинули наше контрпредложение и представители НКР какое-то время обсуждали его между собой. Они пришли к какому-то соглашению и один из них, взглянув на карту Санрайза безо всякого энтузиазма, произнёс следующее. \n\n — Очень хорошо, мы согласны сохранить нынешние границы."
 shatteredhoof_ncr.1618.a:0 "Что ж, с этим мы разобрались."

shatteredhoof_ncr.40.t: "Go With Gawd"
shatteredhoof_ncr.40.d: "'Where were you, five years ago? Many of you, I know, were in chains. Many were subject to oppression, or hate. Many lived in small, scattered settlements, fearful every day that they wouldn't have enough food to put on the table. Some languished in the shadows of Manehattan's towers, others perished in the depths of Fillydelphia, yet others braved the Pink Cloud and the death Canterlot brought. Some were tribals, some were settlers, some were raiders. All were worse off than they are today.\n\nA new day rises over Equestria. The sun is shining high above, fillies and colts make their way to schoolyards, not war zones. Where once, ponies starved, or languished under the chains of their masters, now ponies live with full bellies, the masters of their own fate. No longer are cutie marks used as a way to differentiate slaves, or the meals of the weak for cannibalistic raiders, now they are the true symbol of your destiny. No longer are filthy raiders or slavers using half broken weapons threatening you every day. Instead, well dressed, well armed soldiers march, happy to help any pony in need.\n\nToday's a new day in Equestria, and I am happy to have served as the President over such massive changes. Soon, you'll all go to the polls, and vote for who you want to represent you for the future. Just remember when you go to vote, remember who brought you your votes, your smiles, your safety. Go with Gawd, to continue the legacy of Equestria. My name's Gawdyna Grimfeathers, and I hope to see you all voting come soon. Be safe, my little ponies.'"
shatteredhoof_ncr.40.a: "Go With Gawd!"

shatteredhoof_ncr.41.t: "Sheriff's Star"
shatteredhoof_ncr.41.d: "Fort Sherhoof looks different than it did before. Gone are the dusters and six shooters, replaced by lawponies in armor and semi-auto rifles. Hooves raise in salutes as he trots by them, medals clinking against one another on his chest. He stops in front of his former home, looking at it, refurbished into a great town hall. One hoof in front of the other, he pushes open the door, seeing the stallion on the other side. Older now, yet still wearing the same tobacco-spit colored duster. Deputy, no, Mayor Spittoon snaps his hoof up in a salute, 'Sheri-er, sorry. Marshal Steel Wall.' Steel Wall trots inside, 'At ease, Spittoon. No need for. . . all of that.'\n\nSteel Wall's stubble has grown a bit more grey, the bags under his eyes more pronounced than ever. Spittoon watches him, as he makes his way forward, looking at an old picture. The Sheriff and his Deputies. He smiles softly, 'Did we do good, Spittoon? All that outside. Was it worth it? All the blood, all the loss. All the ponies who didn't come home. I thought of them last night. The other Deputies. The ones that didn't come back.' Spittoon comes up behind him, 'Steel, you've done as good as a stallion can do. You know me and the others are here for you. Maybe it's time-' Steel Wall interrupts him, 'I know. Maybe it's time I hang up these medals.' He looks to the side, an old hat, gleaming golden star on it, 'Never was made for politics. Maybe it's time I put the hat back on. Maybe it's time the Marshal steps out. Sheriff returns.' Spittoon smiles softly and nods.\n\nThe door opens, and the sharply dressed Pegasus enters in. Agent Muddied Waters looks at the two law ponies from behind dark glasses, 'Mayor Tobacco Spittoon, Marshal Steel Wall, I hope that I'm not interrupting anything. Marshal Steel Wall, I come with important news.' Steel Wall slowly looks away from his old hat, 'Spit it out.' Muddied Waters smirks softly, 'I've had a few old friends from the intelligence agency digging through some old folders from when the Republic was being founded. We found something important in one of them. A list of your Deputies compiled by one Genefice Moontalon, including many marked with 'shaky loyalties'. A bit of research has indicated that these former Deputies with shaky loyalties were sent one by one, from Madam President Gawdyna Grimfeathers herself, on suicide missions. Marshal Steel Wall, it would seem that Madam President Gawdyna Grimfeathers is behind the death of many of your old friends.'\n\nSteel Wall narrows his eyes, 'What.' Spittoon speaks up next to him, 'Steel, are you seriously about to believe this turkey? Forget Gawd! Your Deputies need you, Steel. I want my Sheriff back.' Steel Wall glances back at Spittoon, and then at Muddied Waters, quiet for a minute. He then slowly trots to exit, 'I made a promise, Spittoon. That if Grimfeathers betrayed me, then I'd stop at nothing to make her regret it.' Muddied Waters smirks more, as Steel Wall stops at the precipice of the door. He looks back to his old hat once more, and shakes his head, 'Waters, come on. We have a bird to kick out of office.' Muddied Waters grins and follows along, 'Of course, Marshal Steel Wall.'"
shatteredhoof_ncr.41.a: "At Any Cost"

shatteredhoof_ncr.42.t: "The Steady Foundation"
shatteredhoof_ncr.42.d: "Leslie is at peace. Across the city, ponies, griffons, and other assorted creatures sleep soundly in their homes. The streets are clear of crime, well lit and well maintained. Come morning, the children will go to school, learning math, science, literature. No memory remains of the past here, ponies only look towards the future. But the future is far away.\n\nGovernor Rock Solid types away at a keyboard, a lantern on his desk his only company. Correspondence lays across his desk, half read, half understood. There's going to be a charity fundraiser tomorrow for orphans. A museum opening the next day, about the horrors of serfdom. Then a rally with injured soldiers. There's going to be a special guest, some bird from Rustwreck, come to advocate for the same aggressive pacifism Rock Solid has always stood for. There's little time for sleep, the elections are close, and the city needs its Governor. For now, coffee will have to do.\n\nHe looks up, looking outside his window. A poster is there, Olive Branch's stoic face, a call for peace. A call for stagnation. He can still hear Giovanni's anger, ringing through his ears. He pauses for a second, looking into the eyes of the poster. But he doesn't look for long. He turns, and continues tapping away on his typewriter.\n\nMaybe he's alone. Maybe the republic will change. Maybe all this will be for nothing. But that's a sacrifice he's willing to take. No matter which way the wind blows, Leslie, New Canterlot, they'll have him. Their steady foundation."
shatteredhoof_ncr.42.a: "Unmoved"

shatteredhoof_ncr.43.t: "Strawberry Red"
shatteredhoof_ncr.43.d: "Giovanni stands in front of a small house, far away from any town. His breaths come shallow, and quick. His talons are dirty, as they sink into too familiar sand. Regina presses against his side, and he comes back to reality. He looks at her, and she smiles softly, giving him a nod, 'Do it, Gio. I'm here for you.' He takes a deep breath, stepping forward, and knocking on the door.\n\nThe door opens up, an old mare on the other side, her eyes hollow, her sides gaunt. She slowly looks up, until she meets his eyes. A fire ignites within her own, and she growls, 'You.' He looks into her eyes, the eyes of a dying filly looking back at him. His planned words escape him. He speaks before he can think, 'I'm sorry. I'm so sorry.' She growls, and charges forward, pushing him back. He stumbles, but stays standing, the mare's wiry frame unable to move him, 'Sorry?! You're sorry?! You don't get to be sorry!' Tears roll down her cheeks as she shouts, 'You got to live! Murderer!' She shakes her head, and closes her eyes, looking down, breathing heavily, 'My daughter had so much life ahead of her, and you took that. You stole her from me. We were so close to freedom. . .' She looks up, eyes bloodshot, filled with tears, 'If I had a gun, I'd shoot you, you son of a bitch.'\n\nGiovanni speaks softly, 'I know. I wouldn't blame you. I never should have pulled the trigger.' The two remain silent, the ghost of a dying filly stood between them. He speaks quietly, 'What was her name?' The mare sniffs softly, and looks away, 'Strawberry Fields. We were forced to farm on the outskirts of Neocastle. The Liberation Army freed us. She wanted to help them free others.' She looks back at him, 'One day, your soul is going to be judged. Pray whatever gods you believe in are more forgiving than I am. Leave. Now.'\n\nHe looks at her, and softly nods, 'She will. She'll help free others. I promise.' He turns around, and leaves, Regina following beside him. The two travel in silence for a minute, before he speaks again, 'Olive Branch. I. . . I've spent too much time wallowing. It's time I do something.' Regina smiles softly and nods, 'I'll be there, every step.'"
shatteredhoof_ncr.43.a: "Purpose, Anew"

shatteredhoof_ncr.44.t: "Amnesty"
shatteredhoof_ncr.44.d: "General Olive Branch pours three glasses of whiskey, his hoof steady, smiling softly at his two Griffon visitors, 'I'm happy you're back, Giovanni.' Giovanni smiles, as he and Regina pick up glasses, taking a small sip himself, nodding, 'After Rock Solid left, I lost sight of everything. I had an experience near Stajniopolis recently, it reminded me of the promise we made. A peaceful republic, one where no filly needs to die.' He smiles more, 'Maybe I'm late, I know I could have done much more for you during these past few years. But, I've been finding myself again. I had to remember who I am.'\n\nOlive Branch smiles, 'Do not worry about it, my friend. I'm just glad you're back.' He then looks towards Regina, 'Regina Grimclaws, Hero of The Pure. I'm surprised to see you here.' Regina grins slightly, taking a large sip of whiskey, swishing it around her glass, 'I'm not my mom, Olive. Her and I, we never really saw fully eye to eye. I've been friends with Giovanni for years, and I'll be honest, I'm bored. I've seen too much blood, too much war, all at my mother's claws. Sure, mom's gonna squawk about this, but eh, fuck her. I'm tired of being a Grimclaws first, Regina second. Besides, you need me.' She grins, 'Grimclaws are seen good by many, and a lot of the former slaves of Fillydelphia are a fan of me. Those I freed from The Pure spread word about me. Besides, Gio's my friend, and if you're his friend, that means you're cool with me.'\n\nOlive nods, and lifts his class, 'Well, I'm glad you're both here. Hero of Corona, Hero of The Pure.' He smiles, and moves his glass forward, 'I look forward to looking alongside you both. It just so happens, I'm still looking for a Vice President. You wouldn't happen to be looking to become it, would you, Giovanni?' Regina smirks, lifting her own glass, 'Branch and Guiseye, I could see it.' Giovanni looks at her, and then back at Olive. He lifts his own glass and smiles, 'I can see it too. To democracy, my friends.' Olive grins softly, 'To democracy, may peace prevail.' Regina smirks softly, 'To democracy, I can't wait to see how mad mom gets.'"
shatteredhoof_ncr.44.a: "'To Democracy!'"

shatteredhoof_ncr.45.t: "The Second New Canterlot Elections"
shatteredhoof_ncr.45.d: "The time has come once again. All across the Republic, voting stations are set up. In the once filthy streets of Fillydelphia, by the speakeasies of the Mob, in all the grand cities of the South, ponies, griffons, and everything else come by the thousands, casting their votes. The voting will take days to do, and it will take days to count. But, such is the democratic way.\n\nGawdyna Grimfeathers gives yet another radio address, broadcast across the nation, the voice of the old hen speaking to thousands at once. In the streets, Pegasi wearing suits and mirrored glasses speak with soldiers, asking them to look the other way, while they sort through the ballots. No soldier disagrees, nobody would want to displease Marshal Steel Wall. Soldiers who make him, or his campaign agent, mad, well, they usually disappear before long.\n\nIn Leslie, Rock Solid cuts the ribbon to open a new orphanage, posing for the cameras, hugging the orphans and former serfs of his home, his strong smile plastered across all the newspapers across the nation. In New Canterlot proper, Olive Branch speaks endlessly, while the Hero of Corona poses proudly with veterans and the injured. The fillies and colts of soldiers take small medals he gives them, scampering back to their parents, wearing them proudly. In the streets of Fillydelphia, one Grimclaws' voice clashes against another, as Regina speaks to a crowd of former slaves, passion in her voice, and fire in her eyes.\n\nWhen all was said and done, only one winner came out on top."
shatteredhoof_ncr.45.a: "Gawdyna Grimfeathers Stays!"
shatteredhoof_ncr.45.b: "Governor Rock Solid Takes Office"
shatteredhoof_ncr.45.c: "Hail To The Marshal!"
shatteredhoof_ncr.45.e: "Peace For All!"

shatteredhoof_ncr.46.t: "A Patriotic Republic"
shatteredhoof_ncr.46.d: "Marshal, no, President Steel Wall stands in his new office, looking out over New Canterlot. His reflection is a stallion far past his prime, an old Sheriff stuffed into an ill-fitting suit, greying mane left uncovered by any hat. Mayor Spittoon stands behind him, 'Steel. Look at yourself. Is this really what you want? You won, but how long are you gonna stay in? Look, back in Fort Sherhoof, there's this mare, loves older stallions. Widow, husband died in war. I could set you u-' Steel Wall interrupts him, 'Spittoon. Please.'\n\nHe takes a deep breath in, and then slowly releases it, turning to face his old Deputy, 'You know I don't have time for that. I made a promise to you, to everyone else. Don't you remember? I'm a stallion of my word.' He sighs softly, 'Gawd betrayed us. I'm going to make sure she regrets that. Every Deputy she sent to their death. . . she's going to pay. That's my path. But it's not yours.' He looks into Spittoon's eyes, 'You're still young, Deputy. Go. Find a mare, settle down. When you teach them about me, just. . .' He trails off, 'Tell them about the Sheriff. Tell them about that sharp-tongued lover of justice who had hope. Please.' Spittoon looks at him a minute more, '. . . I got it, Sheriff.' He opens his mouth to say more, but pauses. After a second, he turns, and leaves.\n\nAgent Muddied Waters speaks from the corner of the room, 'My apologies that you've had to go through that, Mister President Steel Wall. But you needn't despair.' He approaches closer, as Steel Wall looks out the window, 'Forget Gawdyna Grimfeathers, she's an old hen, let her wither and die, all alone. We have much greater matters to attend to. Skyfreeze has sent correspondence, the conflict over the Commonwealth has resulted in a major power emerging. We mustn't give them time to prepare, Mister President Steel Wall. Shall I tell the factories to prepare for total war?'\n\nSteel Wall looks outside. Husbands and wives trot side by side, their fillies and colts, lucky enough to have never seen the horrors of war. Soldiers, green as can be, practice with their rifles in the distance. The reflection of Muddied Waters stares back at him, smirking. He breathes in, and then out, slowly. He turns to face Waters, 'Prepare the factories. Equestria will be ours.'"
shatteredhoof_ncr.46.a: "As Planned"

shatteredhoof_ncr.47.t: "The United Republic"
shatteredhoof_ncr.47.d: "It's a day just like any other in New Canterlot, a peaceful day. Gawd reads over reports, old eyes now experienced at reading them. Bloodeye put down an attempted gang revolt in the north, no casualties except enemies. Moontalon has found a network of former Enclave spies causing mischief, to be investigated further. Goldbeak's secured another old facility, some mad ghoul Doctor trying to cure Taint in the ruins of Gutterville. Her pen scribbles signatures at the bottom of them each. Reports of refugees from The Commonwealth entering Manehattan, Megaspell detonations in Caledonia, one of the fifty descendants of Virgil asking for her meeting. Signature, signature, signature.\n\nThe door opens, and she looks up, as Regina enters in. She coughs softly, and clears her throat, brushing back greying feathers, 'What is it, chick?' Regina looks at her aging mother, 'How long are you going to stay in, mom? Don't you think this would have been a good time to retire? Give someone else a shot?' Gawd smirks, 'I might be an old hen now, but don't think that means I'm incapable, chick. Isn't this what you wanted? Democracy? The ponies of the nation vote for their leader, and they voted for me. If I said no, that would be anti-democratic.'\n\nRegina looks at her for a minute more in silence, before speaking again, 'And how many of those ponies are you going to send out there? Into the north? The jungles? The desert? How many are going to die for this? How many widows, how many orphans, mom? How many children are you ready to lose?' Gawd stares at her daughter, and shakes her head, 'As many as it takes. You're young, Regina. I don't blame you, all fired up, wanting to change the world. Just like your mom, back when I was younger. Look outside, all the ponies who have a chance at life they never had before. The full bellies, the happy foals, the teachers and soldiers. Is that not worth it?'\n\nShe leans back in her chair, 'Or do you just think I don't care about the dead? I do. I care. Thousands will die, so millions can live. Maybe you aren't brave enough to make that call, but I am, that's why I'm here. I'm the only hen who could stomach making the hard choices, so you didn't have to. When I die, may Boreas damn me, I'd do it all again. You don't have to agree. But I don't care.' She looks into Regina's eyes, 'I have work to do.' Regina looks back, and then turns, leaving."
shatteredhoof_ncr.47.a: "All Stays The Same"

shatteredhoof_ncr.48.t: "Forgiven"
shatteredhoof_ncr.48.d: "'For too long, our fair republic has suffered under the control of warmongers, who believe that bloodshed was the only way forward for our fair state.' President Olive Branch speaks to a crowd of thousands, 'I am glad that today, us citizens of the Republic have come together to say in no uncertain terms that no, war is not what defines us. Death is no Element of Harmony, it is the antithesis to all that we represent. It's time for New Canterlot to change, to become new. Refugees come to our borders from all across the world, and it is up to us to accept them, to move forward in peace. I'd like to invite my Vice President, Giovanni Guiseye, to say a few words.'\n\nGiovanni steps up on the stage, looking out over thousands of watchful eyes. Regina smiles up at him, Gawd stood by her side, judging. Rock Solid gives him a nod of respect, while Steel Wall in the distance runs security, watchful Pegasi keeping their eyes out for any threat. He looks into the center of the crowd, where he sees her. Strawberry Fields looks up at him, eyes devoid of life. His talons dig into the podium, and he speaks, 'Thank you, Olive Branch. My name's Giovanni, many will know me as the Hero of Corona, but. . .'\n\nHe takes a minute, 'I am no hero. War is not a place for heroes, it is not a place for good things. War brings nothing but death, and destruction in its wake. In my dreams, every night, I think of Corona, I think of Kaisercrest, my officer, and I think of all he could have done. The griffons who died, the ponies who died, the families and lives they could have lived. I blamed myself for it for so long, for being the one who pulled the trigger. But I meant only to protect my home, and who I love. It wasn't my fault that Corona happened, but the fault of politicians, Boss Nails and Gawdyna Grimfeathers both. Every night, I will still think of the dead, and I will wish that things have been different. And I will push forward, so things might be different. Peace is not folly and war is not our natural state, no matter how much the wasteland might want us to forget that.'\n\nHe looks into the center of the crowd. Strawberry Fields looks back. She smiles, and disappears. He looks up, and wipes a tear from his eye, 'And I. . . I will not rest until we have defeated the Wasteland. Until peace isn't a luxury. I will work day and night, if it means even just one pony may live. Thank you, all of you.'"
shatteredhoof_ncr.48.a: "But Never Forgotten"

shatteredhoof_ncr.49.t: "A Rock Solid Republic"
shatteredhoof_ncr.49.d: "'I'd like to take this time to thank you, everyone, for all your votes. In my time as the Governor of Leslie, I've done my best to bring prosperity to all, and I plan to do this still. Gawdyna and Steel Wall both call for too much war, yet when there is evil in the wasteland, I am not content to sit by and let it happen. Let our state be a righteous-' The radio clicks off, as Regina sits next to Giovanni, grinning slightly, 'I can't believe Rock Solid won the elections. I mean, seriously. The stallion is, like, one of the most boring stallions I know!' Giovanni smiles back at her, 'I don't mind it. Maybe it's not as good as if we won, but Rock Solid was a friend. I know he'll do what's best for the ponies, and I know we don't have to worry. Democracy prevailed, and at least we aren't going to war. I can accept that.'\n\nRegina leans back, 'I know, but come on. Rock Solid? Really?' She chuckles softly and grins, 'Mom must be pissed to lose to him, of all stallions.' A minute of silence passes between them both, broken by Regina, 'Well, now I'm bored. I'll be honest, I was banking on you winning so I'd get a job. Or Steel Wall, or mom, at least then I'd be entertained in protesting against them. But now?' She looks over at Giovanni, who looks back with a soft smile, 'I think boredom is good. We've lived in much too interesting times.'\n\nRegina looks away, and then looks back, 'Yeah, well, I need to do something. I'm not the type to just sit around.' She taps her talons against each other, and then grins, 'I know. You should go on a date with me.' He blinks, and blushes, 'W-what?' She smirks, and sits up, 'C'mon, don't act like this is a surprise. There's been romantic tension between us since we met, are we going to just let the tension remain?' He looks back at her with wide eyes, 'W-was there?' She smirks and shrugs, 'I don't know, maybe I just saw what I wanted to see. Anyway. Me. Cute hen. Asking you out. Are you gonna keep just staring at me or are you going to say yes?'\n\nHe blinks, 'Y-yes!' He clears his throat, 'I mean, umm, yes. Yeah. I think I'd like that.' She stands up and smirks even more, 'Perfect. How about tomorrow? Gustave Le Grande just opened up a new place down the street, his recipes are two centuries old, they've gotta be pretty good. Six sounds like it works for me, hope it works for you. I'll come wearing a dress, you leave the medals at home, pick a suit that shows plenty of the backside.' She winks, and then makes her way out of the room, 'See you there!' He blinks, looking after her. He stammers slowly, 'Y-yeah, I'll see you there.'"
shatteredhoof_ncr.49.a: "For A Boring Republic"


 
 
 
 ###Decision-Events###

 shatteredhoof_ncr_decisions.1.t:0 "В руинах Анклава"
 shatteredhoof_ncr_decisions.1.d:0 "До войны Нейварро был военно-воздушной базой, расположенной к западу от Нового Хорселеана. После падения бомб это место стало использоваться Анклавом в качестве основной базы для операций в сердце Эквестрии. Также база Нейварро была крайне важна для будущего Анклава, так как в ней расположен центр управления Проектом Одного Пегаса, который, в теории, может предоставить возможность контролировать погоду над большей частью континента. Анклав использовал свой ограниченный доступ к ПОП, чтобы поддерживать постоянный облачный покров над всей пустошью со времён Великой Войны. Именно из этого места они начали своё завоевание пустоши и именно тут они капитулировали. Сейчас данная база лежит в руинах после битвы при Нейварро, после которой большая часть пегасов Нового Клаудсдейла рассеялась по пустошам.\nСейчас Нейварро находится под нашим полным контролем, так что мы теперь можем свободно исследовать остатки базы и узнать все её секреты и тайны. Целая армия из нанятых нами мусорщиков, исследователей и учёных занимается раскопками базы Нейварро и уделяет особое внимание объекту ПОП. После того, как войска НКР разобрались с остатками автоматизированных систем безопасности Нейварро и силами независимых мусорщиков, наши специалисты приступили к сбору и каталогизации всех технологий и данных этой базы, которые могут пойти на благо НКР.\nСреди наших лучших находок было несколько поврежденных чертежей энергетического оружия; целая комната, полная комплектов силовой брони X02, и настоящая сокровищница из шаров памяти, которые Анклав использовал для обучения пилотов.\nОднако самая интригующая находка была сделана группой исследователей, которые обнаружили в самом сердце базы нечто, похожее на большую комнату, окруженную совершенно непроницаемым энергетическим щитом. Попытки отключить щит не увенчались успехом, поскольку, похоже, нет реального способа отключить его, не повредив то, что он защищает. Также нас озадачил тот факт, что щит не подключён к реактору базы. А это значит, что за щитом располагается автономный источник энергии. Наши учёные считают, что само сердце ПОП находится внутри щита, но пока мы не найдем безопасный способ проникнуть за него, мы, увы, не сможем раскрыть секреты, которые он защищает."
 shatteredhoof_ncr_decisions.1.a:0 "Скажите яйцеголовым, что этот щит нужно взломать как можно быстрее!"
 
 shatteredhoof_ncr_decisions.2.t:0 "Секреты холма 431"
 shatteredhoof_ncr_decisions.2.d:0 ""Breaching!" Bloodeye takes cover behind a wall as their team's demolition specialist blows up a sealed door. The bodies of Featherbrush's Talons surround them, still warm and bleeding from the battle for the bunker. As the door blasts open, Bloodeye motions his squad to follow him, keeping a well-maintained rifle up as they move into the space they opened up. They find themselves in a cavernous room, filled to the brim with weapons, and shelves containing uniforms. Bloodeye motions around, "Mango, left side, Fire, right side, Flanks, cover rear, shoot at anything that moves." The other three members of the squad assume their positions. Mango, a thestral with a cigarette and fifty bullets of .308 in an automatic rifle, Fire, a bright orange unicorn with a service rifle, and Flanks, a Pegasus mare who carries a light machine gun, commenting as they trot down the shelves, "Not my name, Sir."\n\nBloodeye doesn't respond, as they make their way down the middle pathway, surrounded on all sides by shelves. Dust lingers in the air and on the floor, kicked up by hooves and talons. Eventually, they reach the end of the room, stood in front of another door, "Flanks, cover me, I'm opening this door. I don't think any enemies got into here, but I'm not going to die because of thinking." Flanks nods, turning around and keeping her LMG sturdy. Bloodeye grabs the handle of the door in front of him, and swings it open, lifting his own rifle up as he does. No enemy comes charging at them, all the awaits them is a flickering light hanging above glowing vats.\n\nThey slowly move into the second room, eyes peering at the vats, only to step back as they see their contents. Bodies. Griffons, ponies, changelings, deer, every species imaginable, floating in green goop, held forever in vats stamped with the logo of the Ministry of Image. Mango breathes out a bit of smoke and shakes his head, "What in Luna's name is this shit?" Flanks frowns softly, "I don't like it." Flame nods along, "Whatever it is, fuck it, and its mother." Bloodeye steps forward, his gun still up, blood red eyes peering through every inch of the facility. After a second, he breathes out, and lowers his rifle, looking back to the others, "Whatever this is, it's for the egg-heads to figure out. There's no enemies left, the bunker's secure. Let's get out of here before one of these things decides to wake up." The ponies shudder softly, and quickly follow as he leads them back through the way they came."
 shatteredhoof_ncr_decisions.2.a:0 "Send A Team To Study"

 shatteredhoof_ncr_decisions.3.t:0 "Секреты Министерства"
 shatteredhoof_ncr_decisions.3.d:0 "Стойло, на которое мы недавно наткнулись, просто необыкновенно: его жители действительно считали себя Министерством Тайных Наук и продолжали деятельность своего "Министерства" ещё долгое время после войны, подобно Анклаву оставаясь в изоляции от остального мира. К сожалению, как и в случае с Анклавом, нам пришлось сражаться против жителей этого стойла, чтобы добраться до его секретов. После того как дым рассеялся, оказалось, что почти все обитатели стойла либо погибли в бою с нашими солдатами, либо покончили с собой в своих комнатах. Даже глава их организации, которого называли "Министром", застрелился в своём кабинете. Немногие выжившие были задержаны и доставлены на допрос или же получили гражданство НКР, если в стойле они занимались лишь гражданскими делами.\nПри исследовании самого стойла оказалось, что большая часть технологий и данных исследований была либо утеряна в ходе боёв, либо же обитатели намеренно уничтожили всё, что могло пригодится нам. Нам удалось заполучить небольшое количество исследовательских данных, а также приличное количество весьма продвинутого вооружения, которое жители этого стойла разрабатывали на протяжении двух последних веков. Также мы отыскали чертежи танка, который был разработан уже после войны. Нас весьма удивил тот факт, что в стойле мы нашли большое количество предметов с пустоши. В основном тех, которые использовались работорговцами. Похоже, что жители этого стойла и раньше контактировали с пустошей. Жаль только, что они взаимодействовали с одними из её худших обитателей.\nЧерез пару дней после того, как нам удалось забрать всё самое ценное, взрыв разнёс стойло на части, убив большую часть тех наших граждан, что уже успели переселиться в стойло для его поддержки в функционирующем состоянии. Сам объект превратился в дымящийся кратер. Мы считаем, что главный реактор стойла был настроен на взрыв с задержкой. А вот намеренно или нет было это сделано... Это печальный день для НКР, так как сотни невинных жизней и стойло в прекрасном состоянии были потеряны навсегда."
 shatteredhoof_ncr_decisions.3.a:0 "Удивительно, как далеко могут зайти некоторые пони, чтобы защитить свои секреты."
 
 shatteredhoof_ncr_decisions.4.t:0 "Логово ложной богини"
 shatteredhoof_ncr_decisions.4.d:0 ""Sir, don't you feel bad about this?" Goldbeak stands on the catwalks in what was once Maripony, looking down at the ruined vats, once filled with IMP. A Griffon hen sits next to him, cleaning her rifle, armor dented and a few cuts still bleeding from the fighting, "I had an alicorn friend once, you know. She wasn't part of the Unity anymore, but she said that she loved it. It was comforting and all that, you know, like a big community in her head." Goldbeak looks over at the hen, and then back down, watching as scientists take the facility apart, searching for what remains, "They didn't ask to become part of this. Sure, once they're part of the hive mind, they'll talk it up, not like they have any control over it. Ponies love to feel good about bad things. But Unity, this 'Goddess' didn't give them any choice. Just made them part of the whole."\n\nThe hen frowns softly, and looks down at the vats as well, "Aren't we the same?" He looks over at her, cocking an eyebrow, as she looks back at him, "We didn't ask ponies if they wanted to be part of the republic. All the ponies of Leslie, Appleloosa, all the alicorns, it's not like we gave them a choice. We marched in and shot those who got in our way. Made them part of our whole." Goldbeak keeps eye contact for a bit, before looking away. He takes a cigarette from his side, and lights it up, breathing the smoke in, before softly letting it out, "It's not like that. We give ponies freedom, give them chances to live better lives, we make their lives better. We give them food, shelter, and community. That's more than they could get elsewhere." She frowns a bit more, and sighs softly, "But that's what the alicorns would say too. They'd say they were better with the Unity, with the hivemind, with their community. I just don't know."\n\nHe nods softly, "It's good to question what we do. We're a democracy. That's what we're all about. But we've freed the alicorns. Now they can vote, now they can think, now they don't have to obey their Goddess." She nods as well, and slowly stands up, leaning against the railing of the catwalk, "But couldn't we have negotiated? Maybe if Unity was treated as a religion by the state, they can only induct members who want to join willingly, and need to release those who don't want to stay. It's just. . . this was something unique, you know? Special, I guess. And now it's gone. Bad, or good, I don't know, but something was here, and now it isn't." He sighs softly, and offers her a cigarette, looking over at her, "It is what it is. Maybe we could have negotiated, I don't know. President didn't do that, though. We're soldiers, we follow orders." She takes the cigarette and looks down, "Yeah. I guess. Just following orders.""
 shatteredhoof_ncr_decisions.4.a:0 "Another Monster Defeated."
 
 shatteredhoof_ncr_decisions.5.t:0 "The Lightbringer's Home"
 shatteredhoof_ncr_decisions.5.d:0 "'We have a situation, ma'am.' Moontalon makes her way down the halls of Stable Two, surrounded by Stable Security, now wearing the uniforms of the New Canterlot Police, 'She's attacked anyone who's come near her, she's, uhh, she's pretty good with levitation, just like her daughter was. There's been a few injuries, no fatalities yet, ma'am. Are you sure you want to deal with this alone?' Moontalon nods, 'Madam President Grimfeathers has entrusted me personally to deal with this. This mare is an important asset to future propaganda efforts, I will take care of her.' The guards all nod, and stand back, while Moontalon makes her way to an open door.\n\nThe end of a broken bottle hits against her leather armor as she enters, a mare stood in the middle of a bedroom, glass of hard cider as her cutie mark, horn lit up bright. The walls are covered in posters of Velvet Remedy, notes taken about Pip-Buck maintenance schedules, all of it covered in a thick layer of dust. The mare's eyes are bloodshot, and dark. She speaks in a wavering voice, 'Get out of here. This is her room! I'm not going to allow anyone else inside it! Get out!' Moontalon looks at the mare, uncaring about the bottle pressed against her chest, 'Little Glass. Nobody is going to mess with your daughter's room. It's going to be made into a museum, preserved, exactly as it is.'\n\nShe shakes her head, 'No, no, no! Museums are meant for the dead!' She throws the bottle down onto the ground, shattering it, stumbling closer to Moontalon, 'My daughter's not dead! You hear me?!' Moontalon looks into her eyes, 'Your daughter was a hero-' The mare shakes her head, 'She's my daughter! Mine! I don't-I didn't. . . She's not allowed. . .' She collapses against the griffon, tears staining her feathers, 'I. . . I loved her, I never told her before she left! I-I'm the last of my family now. . .' Moontalon reaches around the mare, pulling her close, into a hug, 'I'm sorry. Your daughter was a hero. Her loss was a loss to us all.' The mare doesn't respond, her quiet sobs echoing through the corridors of Stable Two."
 shatteredhoof_ncr_decisions.5.a:0 "The Ones Left Behind"
 
 shatteredhoof_ncr_decisions.6.t:0 "Колыбель ужаса"
 shatteredhoof_ncr_decisions.6.d:0 "An old stallion trots after a little filly, her little hooves scampering over the well-maintained tiles of the Museum of Cathedral. The stallion chuckles softly as he struggles to keep up, "Hold on! Your pops can't move so fast!" The filly looks back with a pout, "Aww, come on, I wanna  see the main thingy!" She scuffs at the ground as the older stallion catches up, giving her a small smile, breathing a bit heavily, "Sorry, sweetie, but pop's not in the shape he used to be back in the army. Heh, I still remember back when this place was filled with science mooks. I stood guard as our boys took this place apart for parts." The filly looks ahead, and then back at him, smiling and skipping along, "Did ya fight here, pops?"\n\nHe smiles, following slowly behind her, letting his eyes cross over every exhibit, "Heh, you bet I did, back under ol'President Gawd. I was in my prime back then! I led a squad of ponies through the Everfree to find this place, and do you know what we found?" She looks back and blinks, shaking her head. He smirks, "We found a dragon!" He leans in and roars at the filly, making her giggle softly, as they continue along, "He was big, and mean, and covered with all sorts of bits and baubs. He breathed fire so bright that the sky lit up, like it was noon! Heh, I thank my lucky stars I didn't have to fight him, our colts in the air force took care of him. Or her. I don't remember." He smiles softly, "My squad moved through every hallway here, finding experiment after experiment, protected to the death by Red Eye's cultists. We fought for every inch, but your pops here made sure to clear it all out."\n\nThey come to a stop by the main exhibit, the little filly looking up, eyes widening as she takes it in. A statue of a red stallion, Stable uniform hanging off his back like a cape, stood in front of a painting of a city of the dead, "Woah." She sits down and looks up at it, "Was Red Eye bad, pops? One of mom's friends used to fight for him." He smiles softly, and sits next to the filly, "He was a pony who did bad things. Does that mean he was a bad pony? Well, I think that's for you to decide. Good ponies do bad things, and bad ponies do good things. In the end, doesn't matter. I've known honorable thieves, crooked priests, corrupt politicians, clean salesponies. Good, bad, what happened, happened. And we need to never forget what happened." She blinks softly, and smiles, "I'm never gonna forget.""
 shatteredhoof_ncr_decisions.6.a:0 "History Was Made Here."
 
 shatteredhoof_ncr_decisions.7.t:0 "Remain Buried"
 shatteredhoof_ncr_decisions.7.d:0 ""Well, sir, I'm afraid the Maneframes are, in colloquial terms, utterly fucked sideways." A stallion stands in front of Goldbeak, who listens with a frown, "I knew we should have used less artillery support. It would have cost us lives, but. . . Shit." The stallion smiles, "Shit indeed, sir, but, we are able to recover some information, left in notes and holotapes. It's just to our luck that the Steel Rangers recorded so much. Of course, since this is Stable-Tec HQ, there was a lot to record." He smiles more, "A lot of what we got was off of a stash of Pip-Buck we found, which will be very helpful to study."\n\nGoldbeak nods along, "Summarize the information. If there's nothing valuable here, then I'm going to report it to Gawd, bury the rest, I suppose." The stallion nods, "Well, a lot of it isn't really good, so to say. There's a lot of mentions of other Stables, apparently there were a lot of, uhh, experiments done in them, sir. There's a Stable in Manehattan that forced ponies with different views on technology to work together, one which was ran by an advanced computer program. Umm, there's one that only has fifty stallions? That seems like a recipe for disaster. There's one that contained a whole lot of different species near Canterlot, mostly zebras and ponies. There's a Stable that was supposed to contain the Princesses and, uhh, wasn't going to open until they died, and, well, they're immortal. So. Yeah. Weird there." He looks up from his list, "Stable-Tec did a lot of fucked up shit, sir."\n\nGoldbeak looks at the stallion, and then sighs, "Equestria did a lot of fucked up shit, egg-head. Stable-Tec was no different." He shakes his head, "This history isn't going to help us. It's just going to tear us apart. To think a trusted company could do this. . . it'll sow distrust, if it leaks to the public." The stallion blinks, "Uhh, sir, are we not telling this to the public? Isn't that the whole point of our democracy?" Goldbeak shakes his head again, and turns away, closing his eyes, "They won't know what will harm them. Imagine how ponies will turn against Stable ponies, imagine how those Stable ponies will feel, knowing they were just experiments. Let them think nothing about it. Bury it, bury all of it."\n\nThe scientist frowns softly, "Sir, this is history, imagine what other secrets could be down here?" Goldbeak begins to make his way out of the building, "I gave my orders, now follow them. Some history deserves to be forgotten. Some secrets are best if they remain buried.""
 shatteredhoof_ncr_decisions.7.a:0 "Forget It"
 
 shatteredhoof_ncr_decisions.8.t:0 "Гангстерский рай"
 shatteredhoof_ncr_decisions.8.d:0 "Bullets whizz overhead, a few impacting hastily set up sandbags, as the gangsters lay suppressing fire. Bloodeye, Fire, Mango, and Flanks hide behind the cover, their Griffon commander peeking over, shooting a gangster, before diving back beneath cover, "Can't hold 'em alone! Where's our backup?!" Fire's horn sparks, sending a ball of fire over the sandbags, the sounds of screaming confirming he hit his mark, "Fuck if I know! If we stay here, we're fucked! I don't know about you, Mango, but I'm not looking to get fucked!" Mango frowns around his cigarette, blind-firing his rifle around the sandbags, "Go fuck yourself. If you're the last voice I hear before I die, I swear to Luna, I will kill you."\n\nFlanks spreads a wing, with a helmet sitting on her feathers, tossing it away from the sandbags. The various gangsters turn their fire to the helmet, allowing her to peek over the sandbags, light machine gun chewing up a few enemies, before she's forced to duck back under cover again. She frowns as she reloads, "I'm out of ammo, sir. What do we do?" Bloodeye peeks over again, firing his rifle into another gangster, then taking cover again, bullets impacting the sandbags once more, "I don't know." He takes a second, his eyes looking to the side, where a few enemy bodies lay, Tommy Guns laying beneath them, complete with drum magazines. His eyes light up, "Fire, grab those!" The unicorn looks over, and then sees the guns, grinning as his horn pulls them behind the sandbags.\n\nAll four members of the squad grab a gun, and flick it to full-auto. Flanks licks her lips, "Okay, okay, I'm ready." Mango holds up a hoof, "A second." He takes out a cigarette, which Fire lights up with a bit of magic, "Alright. If I'm going to die with a gangster's gun, I'm going to smoke like a fucking gangster. Let's do it." The four nod, waiting for a pause in the gunfire, before they all peek over cover. Their guns roar with rapid rapport, bullet casings clinking to the ground below as bullets fly to the gangsters, and Fire cries, "Haha, yeah! Suck it you fuckers! How's this feel, huh?!" They chew through the cheap defenses of the gangsters through sheer volume of bullets, and not a single member of the squad stops firing until their guns click dry.\n\nThey look over a field of dead gangsters, their barrels still smoking from their overuse. Bloodeye takes a deep breath, and drops his gun, sitting down, "I should have joined Stern." Mango sits next to him, breathing out a plume of smoke, "I hope that Army Depot is worth it for all this." Flanks shudders out a breath and drops her gun, "This was not worth it." Fire smirks widely, holding his gun proudly, "This was so worth it!""
 shatteredhoof_ncr_decisions.8.a:0 "A Worthy Battle"
 
 shatteredhoof_ncr_decisions.9.t:0 "Вопрос Стойла 32"
 shatteredhoof_ncr_decisions.9.d:0 "Giovanni stands outside of Stable 32, watching with distant eyes as soldiers send ponies out. This Stable was still mostly operational, due to it still being occupied. But its inhabitants made the crime of fighting back and losing against the republic. Thus, has come the cleansing. Clean Stable ponies take their first steps into the wasteland, looking around terrified, as soldiers bark orders to them. Scientists stop some ponies, forcing them into examinations, checking for health and sickness, measuring their skulls, taking their blood, before sending them along. No home awaits them, just the wasteland.\n\nHe swallows softly, before he hears something, the shouts of a soldier that are louder than usual. He rushes over, only to find a soldier pushing a Stable filly against the ground, holding his rifle up at her, "Get back into line!" His talons feel dirty. The stallion shouts again, but Giovanni can't hear the words over the ringing. The filly's eyes are dark. Fear. He can smell the blood. He sees her again, bleeding. His claws tremble. He doesn't remember what happens for the next few moments, but when he blinks, he finds the soldier's throat in his claws, his talons digging into the soft flesh of the pony. Their eyes are scared, just like his. He looks down into the eyes of the pony, and finds himself speaking without control, "Get away from her! S-stop this!" The other soldiers look over, the Stable ponies too. He doesn't see them. He sees nothing but the fear in the filly's eyes.\n\nHe releases the soldier's throat, and pulls his talons back. They're dirty. Covered in blood. His breaths come shakily as the soldier gets up, "Go, go and don't ever come back!" His whole body trembles. The soldier runs away, eyes filled with fear. He tries to breathe. He finds himself unable to. The serf-filly lays in front of him. His legs shake. The world goes dark. Then, a little leg touches his own, and he looks down. The Stable filly looks up at him and sniffs softly, "T-thank you, Mister, but... I can't find my momma."\n\nThe world returns in an instant, and he's finally able to breathe. He finds his cheeks wet. His talons are still dirty, but... He doesn't pay attention to them. He can't. He smiles softly to the little filly, and kneels down close to her, "Don't worry, little filly. Come with me. Let's go find your momma.""
 shatteredhoof_ncr_decisions.9.a:0 "Вот и пришёл конец Стойлу 32."
 
shatteredhoof_ncr_decisions.9001.t: "Breathe"
shatteredhoof_ncr_decisions.9001.d: "His talons feel dirty again. Giovanni sits in a small diner. He drinks a bit of cola, but its flavor is distant. His breathing is shallow, too rapid. The soldier's fearful eyes sit in front of him, rooting him to the seat. The revolver at his side feels heavier than ever before. 'Gio?' He blinks, and the world comes into focus. Regina stands there, besides the table, sitting across from him and smiling softly, 'I got your letter. I'm sorry I wasn't there to support you, up north. Are you okay?'\n\nHe looks at her for a minute, his breathing slowly getting more steady. He closes his eyes and breathes out softly, 'Regina. I'm sorry you have to see me like this. . . again. There was a filly. Near Stable 32. She stepped out of line, and this soldier. . .' His talons clench, digging into his own flesh, before they release, and he opens his eyes, 'I was going to kill him. Right in front of that innocent filly. I was. . .' He looks into her eyes, 'He was so afraid. I saw her again. Looking at me. Bleeding. I couldn't. . . I couldn't look away from her, Regina. I helped the filly find her mother, but. . . but she was still there, and I felt her eyes watching me all the way.'\n\nRegina nods softly, 'I'm sorry, Gio. What happened in that Stable was an atrocity. You can't blame yourself for what you did, for saving a little filly's life. Isn't that what this is all about?' He takes a second, 'It was. Then Rock Solid broke it apart. I don't know who I am, Regina. Am I still a pawn? A hero? A politician? Your friend?' Regina smiles softly, 'You're always going to be my friend. No matter what. You're Giovanni, and you're my friend. Hero, pawn, politician, that's up to you. Nobody's going to tell you what to do. But I'll be here, every step of the way.'\n\nHe looks deep into her eyes, and then looks away, wiping his own, 'Thank you. . . I don't know how I got lucky enough to meet you. I know what I want to do. That filly I saved, I led her to her mother.' He licks his beak, and looks back at her, 'I need to meet her mother. I need to apologize.' She smiles softly, 'Let's do it, then. Together.'"
shatteredhoof_ncr_decisions.9001.a: "In, And Out"
 
 shatteredhoof_ncr_decisions.10.t:0 "Уроки автоматизации"
 shatteredhoof_ncr_decisions.10.d:0 "Stable 29 proved difficult to take, as many of the Stable's defenses were still active, being used to fend off the raiders who owned the Stable for too long. It took a few lives, but piece by piece, the Stable was able to be taken, and, in even better news, it wasn't damaged in the fighting that much. Salvage teams have been sent to strip the Stable for supplies, finding many pieces of valuable technology. Circuits, batteries, and complex metals were stored in the Stable, alongside many other useful things.\n\nIt's clear that something bad took place here. Skeletons litter the inside of the Stable, having been killed quickly. It was only when our salvage team started examining the Stable's Maneframe that we learned why. Apparently, this Stable was supposed to be managed by an advanced AI, which was programmed to conserve resources and hopefully guide ponies to repopulate nearby Manehattan. Issue is, a few decades in, a water chip broke, meaning the Stable had limited water. Before the maintenance ponies could fix it, the Maneframe underwent many calculations, deciding that the ponies would eventually drink all the water, and deducing that the best way to conserve water would be to eliminate all consumption of it. We don't know exactly how it killed all the ponies, but whatever way it chose, it was efficient. Already a sci-fi story based off this tale has begun to be sold in stores across New Canterlot, called Aperture. Ratings are very good."
 shatteredhoof_ncr_decisions.10.a:0 "Never Trust AI."
 
 shatteredhoof_ncr_decisions.11.t:0 "Хаб МинМорали"
 shatteredhoof_ncr_decisions.11.d:0 "В глубине руин Мейнхеттена лежит одно примечательное здание, содержимое которого нас весьма удивило. Министерство Морали во время войны отвечало за противодействие шпионажу зебр, а также обеспечивало лояльность граждан Эквестрии и их преданность направленным на войну усилиям. Мы ожидали, что найдём в их хабе центр управления очень обширной системой наблюдения. Или же камеры для пыток и извлечения памяти. Но оказалось, что это здание было заполнено поздравительными открытками и двухсотлетними тортами.\n\n Похоже, что Министерство занималось поистине монументальной задачей по отслеживанию и празднованию дней рождения каждого жеребенка в Мейнхеттене. Если честно, мы и не знаем, что об этом думать. При зачистке здания нам пришлось разобраться с большим количеством спрайтботов, а также мы нашли останки самой министерской кобылы Пинки Пай. Мы похоронили её там, где две сотни лет назад располагалась ферма камней её семьи."
 shatteredhoof_ncr_decisions.11.a:0 "Ладно."
 
 shatteredhoof_ncr_decisions.12.t:0 "Брыклинский Крест"
 shatteredhoof_ncr_decisions.12.d:0 "Once the main base of operations for the Manehattan Steel Rangers, Bucklyn Cross is the common name given to a large bridge over the Lower Mare River. When the Manehattan Contingent arrived to Manehattan so long ago, it was over this bridge that they pushed the Manehattan Raiders, with the Steel Rangers taking the bridge as their own headquarters. Due to the importance of the bridge to travel over the Lower Mare River, it seems like the Equestrians built a military base, hidden in the supports of the bridge. It was in this small base where the Rangers roamed, and stored all their equipment.\n\nSadly, the Rangers held us off long enough to pick Bucklyn Cross almost entirely clean. They've taken their guns, armor, and all of their data along with their technology, leaving behind just crumbs. Luckily for us, Steel Ranger crumbs are still a massive boon, consisting of small pieces of technology that we can take apart for use in our industry. Though we didn't gain as much as we'd want, this was still a worthwhile endeavor."
 shatteredhoof_ncr_decisions.12.a:0 "Another Old Ruin Dealt With."

 shatteredhoof_ncr_decisions.13.t:0 "Проигранная война"
 shatteredhoof_ncr_decisions.13.d:0 "Провал наступления доказал, что Разбитое Копыто слишком слабо, чтобы вести нас за собой. Мы должны решить: остаться ли нам верными союзниками или разорвать цепи, пока ещё есть такая возможность."
 shatteredhoof_ncr_decisions.13.a:0 "Готовить войска к удару."
 shatteredhoof_ncr_decisions.13.b:0 "Сохранить верность."
 shatteredhoof_ncr_decisions.13.c:0 "Уйти по-тихому."

 shatteredhoof_ncr_decisions.14.t:0 "Война за независимость"
 shatteredhoof_ncr_decisions.14.d:0 "Сейчас или никогда."
 shatteredhoof_ncr_decisions.14.a:0 "К оружию!"

 shatteredhoof_ncr_decisions.15.t:0 "Шёпот предательства"
 shatteredhoof_ncr_decisions.15.d:0 "Пока отголоски неудачного вторжения всё ещё сотрясают нашу нацию, поползли слухи, что наши союзники готовят удар в спину."
 shatteredhoof_ncr_decisions.15.a:0 "Мы должны укрепить границу с державой [FROM.GetNameDef]."

shatteredhoof.7001.t: "Tributary No More"
shatteredhoof.7001.d: "Giovanni stands deep in the heart of Shattered Hoof, his feathers still dirty and ragged, his mind far away. He looks down, his talons still caked with dried blood. His ears still ring slightly. It's complimented by the pounding of bullets and war drums pulsing through his head. '-to me, chick?'' He blinks, and looks across from himself. Gawdyna Grimfeathers, a look of annoyance on her face. She frowns, 'I said, are you listening to me, chick? Tell me what happened in Corona. Why have the Tribe cut off communications? Where's your commanding officer?'\n\nWords flash through his mind, and his throat goes dry, raw from his cries. He speaks without realizing, 'Kaisercrest is dead, Madam Grimfeathers. He. . . we arrived in Corona in the middle of a raid from the Amethyst Liberation Army. We tried to fight as best we could, but we were too few. We didn't have enough bullets, enough explosives, enough Talons.' He takes in a shuddering breath, 'They picked us off, one by one. We had a last stand behind an old shack. They flanked us. It was just me and Kaisercrest, and he. . . he ordered me to retreat, to save myself. He held them off.' He gulps softly, his mouth dry, 'I'm sorry. We were unable to do anything. We. . . we lost Corona. The Tribe doesn't think we can protect them anymore. I'm sorry.'\n\nShe looks at him, his talons digging into her desk, feathers ruffling. Then, she looks into his eyes, and breathes out a sigh, 'You did the best you could, chick. Giovanni, right? You did your mission, you followed orders, you fought to the last griff, that's what matters. We're overstretched and you didn't have the support you needed.' She sits up, 'You'll get a medal once all is said and done. If the Corona Tribe thinks they can make do without us, then let them try. When the Liberation Army overruns them, they'll come begging for us to help. They'll ask for help from the Hero of Corona. If they don't, then we'll make them. You're dismissed. Bloodeye needs help finding Raider stashes. Stay safe, chick.'\n\nHe looks at her for a minute, unmoving, then he speaks softly, 'A medal won't bring them back.' She looks at him with a tight frown, 'No. But ponies love a war hero with a shiny medal. I don't care if you don't want it, chick, that medal's gonna be a symbol to Corona that we care about what happens to them. It's a symbol that we've changed. You're dismissed.' He looks at her for a second more, before he slowly nods, and exits."
shatteredhoof.7001.a: "Curses!"

shatteredhoof.7002.t: "A New Opportunity"
shatteredhoof.7002.d: "The dead litter the fields of Corona, poor raiders taken down by weapons and explosives better than any they've faced before. The leader of the Corona raid trots past body after body, bullets whizzing by his form, fired by a griffon hidden behind cover. Ribbons of blood fill the sky as the bullets find purchase, raiders collapsing, bleeding out into the useless soil below. Yet still, he trots forward. A bullet hits his armor, but it bounces off before it can piece. Yet still, he trots forward. Then, finally, a rapid 'click' fills the air, and the bullets come no more.\n\nHe rounds the haphazard sandbags, an elderly griffon behind them, machine gun smoking from overuse. Another griffon flies away in the distance, but it doesn't matter. The elder looks up to the leader, spitting blood onto the ground, and grinning, 'What are you waiting for, colt? You want me to be-' The leader silences the elder once and for all, a bullet piercing his skull. He smells the air, blood, smoke, death, and freedom in the air. He looks to the surrounding raiders, 'Control the area. Our liberation is not over yet.'\n\nBehind him, a mare shrieks, falling to the ground, where her filly lay, dead. The leader turns to face the mare, approaching her and speaking softly, 'Another fallen soldier in our crusade for freedom, my dear. Mourn her, but do not regret the path she has taken. She died that we might be free another day.' He rests a hoof on her shoulder, and then looks around, a scowl on his face, 'Change of plans! Look at what these Shattered Hoof menaces think they can do! Killing a filly! All because they would rather oppress than ever allow the taste of freedom to grace this land! No more, my friends!' He lifts his pistol, 'We have taken down the vanguard of the enemy forces, but there are many more yearning for freedom! We shall not stop until all of Corona has tasted true freedom! We shall not stop until we have brought justice to the monsters who would do this to one of our own! We shall not stop, and we shall take no steps back! Are you with me, fellow lovers of freedom?!' From all around the field, a cheer comes, chems taken and guns reloaded, ready to take the rest."
shatteredhoof.7002.a: "For Freedom! For Liberation!"

shatteredhoof.7003.t: "Sherhoof Declares Independence"
shatteredhoof.7003.d: "The staccato sound of gunfire still rings all across Shattered Hoof, as pockets of raiders, loyal to Deadeye, hold out against overwhelming odds. The dead lay across the desert sands, their blood turning the sands red, crows and vultures picking at the flesh. Sheriff Steel Wall steps on one body, followed by four deputies, wearing long dusters. His eyes look ahead, above the death and blood, to a group of griffons and a group of ponies exchanging gunfire. Both sides take cover to reload by the time they get close, and his voice is loud enough to be heard by both sides, 'Listen up!'\n\nRaiders and Griffons both turn to look at the approaching Sheriff, as his deputies walk into the No Pony's Land between both sides. There, they place down bags of food, guns, bullets, and caps. Steel Wall speaks, as both sides look at the loot, 'I made a promise to Deadeye that we would deliver tribute for protection and autonomy. Now, Deadeye might not be around anymore, but I'm a stallion of my word. I told him I would have it delivered today. Here it is.' He nods to the loot, 'As promised, food, guns, bullets, caps. Now I don't rightly care which one of you is going to win today. I don't care if you end up dying. This is my tribute, take it, or leave it, it don't trouble me either way. But I got a message for you both to take, to Gawdyna Grimfeathers, to whatever sad sack leads the raiders now.'\n\nHe whistles, and from behind, two more deputies approach. Next to the loot, they throw the bodies of a raider, and of a griffon, half decomposed already. He smirks slightly, 'I upheld my side of the deal, and you haven't. So I'm calling the deal off. Let this be a symbol of our new deal going forward. Come into Sherhoof with bad intentions, and you're not leaving alive. Come to try and raid from us, and you're not leaving alive. Come to press-gang our ponies into your little scuffle, and you're not leaving alive. The settlers of Sherhoof will make sure it's the last damn mistake you ever make.' He smirks a bit more, 'You tell your leaders that Sheriff Steel Wall said that. Tell them if they have an issue, they can come say it to my face.' He then tips his hat to both sides, and turns around, leaving, 'Have fun killing each other.'"
shatteredhoof.7003.a: "Your Tyranny Is Dead!"

shatteredhoof.7004.t: "Formation of the Greenway Compact"
shatteredhoof.7004.d: "Gawd writes yet another report in her office, a nearby clock's ticking her only other companion. At least, until the door to her office opens up, and Bloodeye enters in. He gives her a smirk, 'Damn, ma'am, I see we got you doing only the hardest work in the whole army. Get any papercuts recently, eh?' Gawd looks up, and rubs her eyes, groaning, 'If I could be out there shooting a raider, trust me, I'd really rather do that. Nobody ever mentions how much paperwork there is behind leading a country.' Bloodeye smirks more, 'A tragedy, ma'am, next time a raider has his gun against my head, I'll make sure to pray for your salvation from paperwork.' She groans and rubs her eyes more, 'Go fuck yourself, Bloodeye. Are you here just to torture me, or do you have an actual reason?'\n\nHe chuckles, 'Is that an order, ma'am? Ah, I'm just fucking with you. Yeah, I got something serious. Figured you'd want some levity before you feel like bashing your head against a brick wall.' He clears his throat, his face losing any grin, 'It's the Pure, and Greenway. Apparently they decided to rip us off, because they're also forming an alliance, like we plan to. Something seems to have given them the impression we're going to invade, and eh, I guess a broken earth pony supremacist is right twice a day. But yeah, my scouts saw the Pure selling unicorns who didn't break their horns to the Greenway, apparently they're making a killing from selling 'employees' to Neocastle. They're going to be an issue.'\n\nGawd nods softly, and sighs, 'Alright. We can't waste much more time on just rebuilding, or they're going to outgrow us. Keep your eyes on the north and west, Bloodeye, I'll see if I can't get us some extra guns smuggled from Neocastle before they cause an issue. Get Moontalon's best on capturing a few slavers, see if we can't get some intel on their positions and defenses. Our plans just got a lot more complicated.' Bloodeye snaps a quick salute, and grins, 'On it, ma'am. I'll leave you to your torment.'"
shatteredhoof.7004.a: "Oh No"

shatteredhoof.8001.t: "Terms and Conditions"
shatteredhoof.8001.d: "'Dear Gawdyna Grimfeathers:\n\nI'm sure you have recently received a letter accepting your alliance. That's, so to say, the public letter. I'm writing to you now, leader to leader, because I want to make a few things clear about our 'working relationship'. New Mango is not a puppet state or some tributary for you to boss around. Your Talons are only to enter my country under my approval, and my thestrals are allowed to enter your country the same. Our guns and factories are not to be taken from or raided, if you want something, you ask for it. We are not a lesser power in this alliance, we are equals. If you should come to treat us as less than equals, then we will leave.\n\nI want to make a few other things clear. New Mango is going to profit from this. The only way that we are going to stick around long-term is if you make the lives of the average thestral better. Otherwise, you and I both know that as soon as the South is safe, we're leaving. New Mango is not interested in being part of Shattered Hoof either, if you try to annex us, then we will not go down without a fight. Us thestrals have been abused by both griffons and other ponies before, and I will never willingly put us in a position to be abused again. Stay respectful of us, and maybe this partnership will be beneficial to both sides. Don't betray us like you did to Deadeye, Grimfeathers, or you'll come to regret it.\n\n-Light Narrative.'"
shatteredhoof.8001.a: "Allies Of Convenience"

shatteredhoof.8002.t: "Letter from Gawd"
shatteredhoof.8002.d: "Sheriff Steel Wall sits, nursing a glass of beer in his home, when the door opens up. He glances over, a deputy entering with a small grin, 'Evening, Sheriff. Hope I'm not interrupting anything.' He takes another sip, and then places his drink, facing the deputy, 'What is it, Deputy Spittoon? Slavers from Greenway?' Deputy Spittoon reaches into his dark brown duster, taking out a letter and smirking, 'Message from one Gawdyna Grimfeathers. Took the liberty of reading it for you already, Sheriff, its, heh, it's quite funny.'\n\nHe rolls his eyes and takes the letter, looking it over, muttering as he does, 'Due to your murder of one of my Talons, heh, and the shared danger around us, I, Gawdyna Grimfeathers, ask that you reenter an agreement like you had with Deadeyes.' He chuckles and shakes his head, 'Heh, is this supposed to be serious? She's getting mad that I killed a Talon what tried to steal from us? She thinks she's Deadeye? I ain't afraid of her, on top of that, I don't even trust her to keep her word. She already betrayed one pony, she'd just betray us.'\n\nDeputy Spittoon grins and nods, 'Exactly my thoughts, Sheriff. I've got one of her Talons, fella by the name of Goldbeak waiting back in my town. Should I tell him anything specific to say to Gawdyna?' He nods, 'Yeah, yeah, I got some words in mind to tell her. You tell Mister Goldbeak to tell her that I made the terms of my deal crystal clear. You stay off my land, you don't die, you come onto my land, you're deader than a doornail. Tell her that if she tries to ask anything like this again, I'll shoot her myself.' Spittoon nods and smiles, but Steel Wall speaks up, 'Oh, and one other thing.' He gives the letter back, 'You tell her to shove that letter up her ass, because it's a crock of shit.'"
shatteredhoof.8002.a: "Make Sure To Say Those Exact Words."

shatteredhoof.8003.t: "The Sheriff's Response"
shatteredhoof.8003.d: "Goldbeak stands across the room from Gawd, speaking to her, 'Deputy Spittoon told me that the Sheriff said, and I quote, 'We made our deal clear, you stay away, you don't die. You try to do this again, and maybe I won't be so merciful.' And he said, to end with, 'to shove this letter up your ass, because it's a crock of shit'.' Goldbeak looks at the frowning Gawd, 'So basically, he rejected it. But at least he considered the offer enough to actually insult us, which means he gave it thought.'\n\nGawd taps her talons against her desk, and rubs her eyes, 'He thinks we're just another Deadeye. I thought he was supposed to be reasonable!' She sighs, and looks up, 'I don't understand. I was forceful and assertive with my offer, I made it clear that I was in a position of strength, that I acknowledged his earlier killing of a Talon but was willing to forgive it. It's just like negotiating a contract, but why isn't it working?' Goldbeak gives her a nod, 'If I might, ma'am, the difference between this and a contract is that one is economics, and this is politics. In economics, the one you're negotiating with doesn't care what you act like, they care for your arms and armor. But if we're asking Steel Wall to help us, we need to make it clear that his help is appreciated. That we're willing to go on as equal partners.'\n\nShe sighs, and then nods, 'Right. I'm not just a Talon anymore. Okay, maybe he will give us a second chance. He's worried we're going to betray him, that we're just going to be another Raider warlord, then fine, we'll make it clear we won't. I'll write a new letter, but. . .' She trails off, 'Goldbeak, you're a lot better at this than I am. I don't want you to write it, but just give me pointers, okay? I don't know how you're so good at this.' He grins slightly, 'Well, ma'am, my mom always said I had a beak of gold, and a tongue of silver. I'll help you out.'"
shatteredhoof.8003.a: "This Time, Humble"

shatteredhoof.8004.t: "Another Sign from Gawd"
shatteredhoof.8004.d: "Steel Wall slowly reads yet another letter, the watchful eyes of Goldbeak and Deputy Spittoon on him. It's written far better than before, sure, there are a few insults here and there, but nothing serious. It's humble, to an extent. He sets down the letter, looking up at the griffon in his house, 'Gawd must be desperate if she sent you again, Mister Goldbeak. I have half a mind to send you back to her in a coffin for pestering me so much.' Goldbeak looks at him, 'Your other half?' Steel Wall nods, 'The other half says that I'll be leaving my house in Greenway or Fillydelphian chains if we try to stand alone. We paid tribute for a reason.'\n\nGoldbeak nods softly, and speaks again, 'Sheriff Steel Wall, I respect your honor as a lawstallion. Sherhoof would be chaos and anarchy if it weren't for you and your deputies around to keep the peace. Shattered Hoof was chaos and anarchy, before we took charge. You see Gawd as another Deadeyes, but she's not, she's another you, Sheriff.' Steel Wall smirks, 'World already has too many of me.' Goldbeak grins slightly, 'Perhaps so. But regardless, us Talons have already cleaned our lands of much crime and disorder, bar the few raiders who willingly joined us. We both desire the same thing, a strong, stable, peaceful south, Sheriff. Also, if I might say. . . I was quite the fan of the insult you included in your last response. Insults are a craft that southern ponies are experts in.'\n\nSteel Wall smirks a bit more, and looks down at the letter, tapping his hoof. Deputy Spittoon speaks up, 'If I might, Sheriff, I think the griff's got it right. There hasn't been a single raid since Gawd took over.' Steel Wall taps his hoof some more, 'Alright.' He looks up, 'Alright. If Miss Gawdyna wants Sherhoof as part of her little alliance, she needs to prove it. Sheriffs don't work alongside criminals, and your nation's army is still filled with ex-raiders. You want to bring justice to the wasteland, griff? Prove it. Have Gawd disband those Raider divisions, and give them proper trials. Bring justice in your lands, and maybe I'll believe you.' Goldbeak nods his head, 'I find those terms acceptable. I'll deliver them to Gawd right away.'"
shatteredhoof.8004.a: "Let's See How Sincere She Is"

shatteredhoof.8005.t: "Demands from Sherhoof"
shatteredhoof.8005.d: "Goldbeak stands once more in Gawd's office, this time with a calm smile on his face, 'I talked to the Sheriff and one of his top Deputies, delivering them your letter. It was well received, but they want more than just words before they agree to an alliance. Sherhoof values justice and order above all else, and they want us to prove that we care about it as well. Our army still is composed of many raiders who stood down and joined us when Deadeye was killed, these raiders are criminals, many have committed crimes against our citizens, and Sherhoof's. Sheriff Steel Wall will join us, if you disband these raider divisions, and force them to face trials for their crimes.'\n\nGawd frowns, looking down, her talons clacking against each other, 'He knows that The Pure and Greenway are going to come after us at any minute, right? He knows that the Amethyst Liberation Army is knocking on our door, right? Why would I say no to some raider scum who want to throw their lives away for us! Every raider that isn't on the frontlines is a Talon or a citizen instead, who are going to die in their place!' She leans back and shakes her head, 'We have more than enough troops, we could just invade Sherhoof, and seize their land for ourselves.'\n\nGoldbeak frowns softly, '. . . If you order that, ma'am, then I will see it done, but I must ask you to reconsider. Sherhoof will provide us with far more ponies than the raiders in our own country. Even if we did invade them, their resistance against our rule would be a black hole for good soldiers and good weapons to disappear into. We're supposed to be starting something new here, aren't we? This is our chance to show that we're serious. That you aren't Deadeyes. That you aren't Stern.' Gawd frowns more, closing her eyes. When they open, she's decided what to do."
shatteredhoof.8005.a: "Disarm, Hold Trials"
shatteredhoof.8005.b: "Sherhoof Will Bow"

shatteredhoof.8006.t: "Sincerity at Last"
shatteredhoof.8006.d: "Deputy Spittoon and Sheriff Steel Wall stand in the middle of the city, watching the limp body of one of Shattered Hoof's raiders, swaying in the wind. Spittoon smiles, 'I'll be honest, Sheriff, I didn't think that the old bird would ever actually agree to this. I thought that letter of her's was all huff and puff, but turns out she's got plenty of blow to give. Even gave us a nice gift to help decorate the town's gallows, how sweet of her.' He chuckles.\n\nSteel Wall chuckles slightly, and nods, 'Noose hasn't had enough practice lately, was worried she might lose her touch over scum's necks. I'll have to thank Miss Gawd for giving her a chance to practice.' He nods again, and smiles ever so slightly, 'I think this is the start of something greater, Spittoon. Maybe, together, we'll be able to make the South a better place. I don't think I'll have much time to talk to y'all deputies once the going gets rough, so I want to make you a promise, Spittoon. If Miss Gawd ever breaks her promises, ever betrays the ponies of the South, then I'll be the first and best to stand against her.'\n\nSpittoon nods softly, 'I trust you, Sheriff. If she betrays us, you do whatever you need to do to bring her down. Work with whoever you need to work with. Punish her for smothering this dream. So. You're gonna agree to her offer?' Steel Wall nods, 'In a few minutes, I'm gonna start my way north to meet with her. Unless some power beyond my comprehension decides to take control of me and do something far outside of my character, yeah, I think I'm going to agree. I'm going to get going, Spittoon, stay safe.' Deputy Spittoon nods, 'That's silly, Sheriff. What type of god-like being would want to turn a peaceful pony of your word like you and turn you into a miserable warmonger? They'd have to be real fucked up to do that.'"
shatteredhoof.8006.a: "Didn't Think The Old Hen Had It In Her."
shatteredhoof.8006.b: "I'm Real Fucked Up And Want War!"

shatteredhoof.8007.t: "Birth of the Azurian Alliance"
shatteredhoof.8007.d: "Steel Wall isn't the fancy type, showing up at the border wearing his uniform and hat. Gawd isn't the fancy type either, sitting across from him in her armor, the two uniformed creatures looking at each other from across a table, set up directly on the borderline between Shattered Hoof and Sherhoof. Steel Wall breaks the silence, 'I am here on behalf of the settlers of the towns of Sherhoof, as a representative of the deputies and all other lawful ponies. I'm here, Grimfeathers, because I think you're a reasonable hen. You've already brought justice to the raiders infesting your army, showing you're serious. But I won't abide you become a dictator, and I won't sign this agreement with a dictator. On behalf of Sherhoof, I come with a request. Our request is simple. You create a formalized system of governance, a system that is not merely the rule of the strong and savage, and you make Shattered Hoof a proper country. We also expect that when we fight the Greenway Compact, that Sherhoof be given a share of land equal to Shattered Hoof, to end the dominance Shattered Hoof has had over the region alone. I'm not going to leave this table until these demands have been met, Grimfeathers. So let's bargain.'\n\nGawd's eyes stay locked on the stallion's for a minute, neither of them faltering for a second. After that minute of silence, she gives him a small nod, 'I think I can accept those terms. I wouldn't overthrow raiders just to become a raider myself, or a dictator.' Her talons tap across the desk slowly, 'Many of my Talons have ancestors who come from a place across the sea, back in Griffonia. Cloudbury. There was a revolution in the Empire, and those revolutionaries fled north to Cloudbury when they failed. There, they created the system of 'Republicanism', the idea that a leader is a representative, chosen by the commoners. I'm sure you've heard of The Republic to the north, similar system, stable society, it'll be a system that lasts long after I'm gone.'\n\nSteel Wall raises an eyebrow, 'A republic? You sent your Talons to die, just to make a republic? What if you get voted out? You'll need to forgive my skepticism, Grimfeathers.' She leans back in her seat, 'Make it impossible for me to be voted out, for the first election, at least. Announce elections too quickly for others to run. But what else would I do? Monarchy? You must not have met my chicks if you think I'd trust them to be leaders of this place. Dictatorship? You've already made it clear that's not an option. We'll be a republic, just one that's slow, and steady.' She grins ever so slightly, 'A republic is like a bolt-action rifle. If you move too quickly, it'll get jammed. If you move too slowly, you're going to die. You need the motion to be smooth. If I let others run for this first election, it'll jam the system. We need to introduce the idea of voting to common ponies first, then, give them options. In addition, we will accept the split of land you mention, much of Greenway will be administered by a Sheriff of your picking. Is this a fair compromise, Sheriff Steel Wall?' He takes a minute, and then nods, 'The settlers of Sherhoof accept this proposal, Grimfeathers. Don't make me regret this.'"
shatteredhoof.8007.a: "Hurrah!"

shatteredhoof.8008.t: "Azuria's New Order"
shatteredhoof.8008.d: "Steel Wall and Gawd meet once more at the table on the border, a small shelter set up around it, blocking out sheets of rain that pour down from above. Gawd grins slightly, 'I got word from one of my finest Talons that the last bit of resistance has just fallen in the Compact.' Steel Wall nods, 'My deputies have been rounding up the ringleaders of the slavers and the worst of the earth pony supremacists, they'll be given proper trials and summary executions. I have to admit, I had my doubts when we first met, Grimfeathers, but I think that, for once, I'm a bit hopeful.'\n\nShe smirks, 'I'm touched, Steel. Speaking of when we first met, we discussed and signed an agreement. Shattered Hoof will be taking the border states of both Greenway and The Pure, The Pure will be under a reconstruction government operated by me, Greenway will be run by one of yours. I know these terms are a bit different than we discussed, however, we lost the majority of the casualties in this war, and my Talons would have my head if we didn't get any actual land. The lands we take aren't of much economic productivity, though. I take it these terms are acceptable?'\n\nSteel Wall nods, 'It is acceptable, Grimfeathers, mostly because you asked me, and didn't surprise me with it. Now, for Greenway, I have just the one in mind to take it over. Deputy Spittoon has worked closely alongside some of your Talons during the war, and before it. He's a stallion of justice, and values nothing more than the safety and well-being of ponies. He'll be the breaker of chains in Greenway.' She grins softly and nods, 'That's the one Goldbeak met, isn't it? I find that term acceptable. Who will govern the Pure is still being decided, but it will be someone good. Maybe Moontalon will work, she's good at dealing with things quietly.' She then offers her claws, 'Do we have an agreement, Steel Wall?' He takes her claw, and shakes it, 'We do, Grimfeathers.'"
shatteredhoof.8008.a: "A Just War"

shatteredhoof.8009.t: "Griffon Dreams in Pony Lands"
shatteredhoof.8009.d: "Giovanni stands on stage, a medal on his chest, looking out over the crowd of Talons and ponies alike. Cameras flash and ponies cheer. He flinches at each flash, the rumbling of explosives pounding his head, the taste of blood. His breathing is shallower by the second, his eyes locking onto a random filly in the crowd, his talons feeling dirty. He's interrupted by a small hit to his side. He looks to his side, seeing a hen standing there, medals covering the front of her uniform, giving him a soft smile. Regina Grimfeathers speaks softly, 'I know the crowd's a lot to handle, Hero of Corona. Just hang on for a little bit more, okay? The medals aren't for us. They're for them.' He shakily nods, taking in a deep breath, memories threatening to overtake him. The soft feeling of Regina's tail against his side keeps him in the present.\n\nGawdyna Grimfeathers steps onto stage, stepping up to a small podium, speaking into a microphone, 'Greetings, citizens of Shattered Hoof, members of the Alliance. I would like to take a moment to thank our recipients of awards today. Giovanni Guiseye, who bravely fought hopeless odds to try and defend the ponies of Corona, a true hero of our nation. And my own daughter, Regina Grimfeathers, who led a wing of Talons in a covert mission, freeing hundreds of unicorn slaves in The Pure, and arming them in a mass rebellion. These two griffons, I am proud to have under my command, I am proud that our nation can produce such good examples of heroism. It is the actions of the common griffon, the common pony, that truly defines this nation.'\n\nThe crowd applauds, as Giovanni looks at Gawdyna, eyes hollow as she speaks, 'It has always been the common griffon and the common pony who defines a nation. It is not Red Eye who powers the factories of Fillydelphia, it is the enslaved masses, it was not the noble who pushed on the Empire, it was the common griffon, and it was not Luna who fought the war, it was the common pony! As we move forward as a nation, I want us to remember that we are not defined by me, or by any other leader. We are defined by the common blood, sweat, and tears, and the common hero! It's for this reason I'd like to announce that, once the South has been stabilized, our nation will reform into a proper republic!'\n\nRegina smiles widely, clapping her claws together, while the crowd erupts into cheers. Giovanni stares on, and speaks softly, 'We're just her pawns.' He looks at Regina, and then shakes his head. While the crowd cheers for Gawd, Giovanni leaves the stage, head pounding, ears full of whispers and screams."
shatteredhoof.8009.a: "Pawn To B4."

shatteredhoof_ncr.1001.t: "Same Demand for 1000 Years"
shatteredhoof_ncr.1001.d: "'Dear Gawdyna Grimfeathers.\n\nIt has reached my attention recently that you have been trying, more and more, to integrate New Mango into your country. I can appreciate that us thestrals are a desired commodity, I'm sure you would love to conscript us to our last to save the lives of your griffons, or that you'd wish to throw us into your factories like Red Eye's slaves. Truly, I can appreciate it, you are a great leader, it is only proper you would take inspiration from what Celestia and Luna did to us. However, I have one response to your attempts; leave us alone.\n\nThestrals have languished under the control of foreign powers for centuries. Equestrian imperialism was done with thestral blood, Equestrian factories were filled with thestrals kept starving and feeble, the less said about what Nightmare Moon did, the better. When I agreed to this alliance, I made something as clear as a crystal pony, but it would seem I have to repeat it. New Mango is not, and will never be, interested in joining Shattered Hoof in anything more integrated than an alliance. Normally, I would draw out of this alliance for this particular insult against my country's sovereignty, but I am willing to give you a mulligan. Leave my country alone, and I'll forget about this trespass. Try to integrate us again, and you lose us forever.\n\n-Thank you, Light Narrative, independent leader of the independent state of New Mango.'"
shatteredhoof_ncr.1001.a: "We Would Be Stronger With Them"
shatteredhoof_ncr.1001.b: "Grant Them Their Opt-Out"

shatteredhoof_ncr.1002.t: "They still persist"
shatteredhoof_ncr.1002.d: "Light Narrative looks down at a letter on his desk, having read it over ten times by now. The letter obviously was written by someone like Goldbeak and not Gawdyna herself, its far too humble and far too convincing to come from the old hen. Yet still, many of its words linger in Light Narrative's mind. Promises of freedom and friendship, a state where the thestrals could finally live as one with other species, rather than separate or discriminated against. It's a compelling offer, a hopeful dream, reminiscent of all the nice promises of Luna and Nightmare Moon, long ago. Freedom, equality, friendship. But Celestia sold that lie with just as sweet a tone. The smiling imperialist, Celestia's moniker in many thestral circles, who's to say Gawdyna didn't take inspiration from that?\n\nThe door to his office opens, as many thestrals filter in, elders and young, though none as old as the ghoul himself. He nods, 'Moonsingers, I'm glad you were able to come. I'm sure you've looked over the letter just as I have. As secular leader of this thestral nation, I must admit, it is a good promise. As religious leaders, I thought it best that together, we charter a course for thestral-kind.' He places his hooves on his typewriter, 'Let's get to drafting an agreement.'"
shatteredhoof_ncr.1002.a: "Let's See How Friendly They Really Are..."

shatteredhoof_ncr.1003.t: "144 Points of Demand"
shatteredhoof_ncr.1003.d: "Dear Gawdyna Grimfeathers.\n\nI'm sure you have already received our notated list of one hundred and forty four demands for further integration into Shattered Hoof. I'm sure you'll have no reason to object to most of them, provided your letter you sent us was as truthful as you claim it to be. However, leader to leader, I would like to express the reasoning for why some of these demands are non-negotiable. You see, thestrals have, many times before, been technically equal under the law. But a race where two ponies start at the same point is not fair, if you bludgeon one's leg with a hammer first. Thestrals have long been discriminated against, and despite laws preventing it, it is clear that for the near future, we will still be discriminated against.\n\nIn the past, in Marelem and Mango both, nobles and industrialists saw fit to destroy thestral homes, and replace them with factories, polluting the lands, choking our foals. Your industrialists will do the same, this much is assured. For this reason, we demand that every construction on our ancestral lands, or on lands housing majority thestrals, must be approved via majority vote from the Moonsingers and I. Similarly, in previous generations, thestrals have been pushed out of the seats of power by the majority. To prevent this, and make sure thestrals are always represented, we demand ten percent of all seats in the Senate be thestrals, rounding up, not down. Finally, Luna's most nefarious lie she sold to my species was as a great liberator. She sold the Great War as the only way to protect our ancestral homes from the striped menace, and in doing such, she radicalized hundreds of thousands into the military. I'm sure you weep over every griffon you lose, yet would struggle to shed a tear should a bat die instead. Feathers over leathers, after all, right? For this reason, and for the preservation of thestral ancestral beliefs, we demand that all thestrals who are engaged in religious studies, or who are part of the clergy, are to be exempt from any and all conscription. I hope that you are as friendly as your letter claimed you were, Gawdyna Grimfeathers. Don't make me regret drafting this letter.\n\n-Light Narrative.'"
shatteredhoof_ncr.1003.a: "Sign The Moonsinger Accords"
shatteredhoof_ncr.1003.b: "We Could Always Threaten Them Into Compliance"
shatteredhoof_ncr.1003.c: "Nevermind, Give Them Their Opt-Out"

shatteredhoof_ncr.1004.t: "Threats from Junctiontown"
shatteredhoof_ncr.1004.d: "'How the hour has come at last.' Light Narrative looks down a letter from Gawdyna Grimfeathers. Refusing the Moonsinger Accords, amassing troops on the border. A radio on his desk flicks to life, the voice of a stallion coming tough, 'Light Narrative? This is Sheriff Steel Wall. Is what I've heard true?' Light looks over, and speaks into a microphone, 'Steel Wall, a pleasure, I'm sorry we weren't able to meet under better circumstances. Yes, what you've heard is probably true. Gawdyna has gone against our terms and conditions, and has started to move against us. An intimidation to try and force us into unification under her. Or, in terms you might understand, trying to make us a tributary.'\n\nSteel Wall takes a second to speak from the other side, '. . . Light, it's up to you what's going to happen right now. If the thestrals stand against Gawdyna, then the good ponies of Sherhoof will as well. It'll be a bloody war, but it's not the first time Sherhoof's fought for its place in the sun.' Light nods and speaks back, 'Nor the thestrals for their place in the moon, my friend. I thank you for standing beside us in our time of need. Not many ponies would die for the sake of a thestral.' Steel Wall responds after a minute, 'I'll be honest, Light, I don't give a shit if you're a thestral or a fire-breathing alicorn. I made a promise that if Gawd ruined this, then I'd be the first against her. And I'd stand alongside anyone to make her regret this.'\n\nLight takes a second, smirking softly, speaking back into the microphone, 'Your comparisons are quite flattering, Sheriff Steel Wall. Truly, the art of insults is a specialty of Sherhoof, I endeavor to one day learn how to so expertly insult an entire species as you just have. Bravo, good Sheriff, bravo indeed.' He then leans back from the radio, looking down at the letter before him. He sighs, 'I've seen too much blood for one stallion.' He reaches his hoof back to the radio, 'Sheriff Steel Wall, I've made my decision.'"
shatteredhoof_ncr.1004.a: "Stand Down, Gawd Wins"
shatteredhoof_ncr.1004.b: "Mobilize, War Comes"

shatteredhoof_ncr.1005.t: "Realpolitik"
shatteredhoof_ncr.1005.d: "Regina stands frowning in Gawd's office, looking at her mother, chest covered in gleaming medals, 'Mom, is what I've heard true? You threatened the thestrals?' She frowns more, 'I thought we were supposed to be different from the raiders. We're supposed to be building something new!' She ruffles her feathers, and shakes her head, 'What happened to democracy? To republicanism? Are you seriously going to be happy with a constitution written in blood, on a foundation of bones?'\n\nGawd looks her daughter in the eyes, and frowns, 'I still plan to have a republic, Regina. I think you just make clear why monarchy wouldn't work. Because a chick like you would never have the guts to make these hard choices. We've already built on blood and bones, chick, the blood of raiders, the bones of slavers. You think you can lecture me?' She shakes her head, 'You're young, and foolish still, chick. Divided, the South is going to fall. When the Pegasi come for us, when Fillydelphia comes for us, we can't rely on the votes of some thestral cult to decide what we can and can't do. We'll die. Maybe this is wrong, maybe I could have worked with the thestrals, but I'd rather build a good society on blood, than let us fall to Fillydelphia.'\n\nRegina frowns and shakes her head, 'What's the difference for them, mom? Don't you realize that? You're just the same as Stern is! You're just an old hen making empty promises, crushing the skulls of any who don't belong!' She steps forward and gets even louder, 'Is this how you want to be remembered? Betraying your promises? The Stern of the South? Because you will be!' Gawd slams her claw on the desk, 'Regina, you're dismissed. Get out. Now.' Regina narrows her eyes, flicking her tail behind her. She speaks, her voice as cold as ice, 'Understood. Gawdyna.' She turns around, storming out of the room, slamming the door behind her."
shatteredhoof_ncr.1005.a: "No Friendship In Ivory Towers"

shatteredhoof_ncr.1006.t: "Reaping"
shatteredhoof_ncr.1006.d: "Gawd looks out her window to the south, her sharp eyes looking upon the distant war camps of Sherhoof, side by side with New Mango. The door opens behind her, and talons clack against the door softly. Regina Grimfeathers looks at her mom, speaking softly, 'Why?'\n\nGawd stays looking out the window, her eyes meeting her own reflection, blocking the hen that stands behind her, 'This wasn't my choice. All the thestrals had to do was accept. They'd be citizens, same as any other. Same rights. Same privileges. And Steel Wall has aligned with them. Betrayal.' She glares, 'Betrayal, they call it. I'm not the one who did this. I gave them a choice, and they chose blood, over peace. If they want blood, then they'll have it. More than they can handle. I'll turn the desert red, I'll water the jungles with their blood if that's what they want. Maybe, only maybe, if they beg for my forgiveness, will I consider giving it to them. I'm done playing nice, Regina. Done with these politics. I've tried to play their game for too long. Now, it's time they play my game. Us griffons are predators, ponies are prey. It's time to remind them of this fact.'\n\nRegina takes a small step back. A minute of silence passes, before she speaks, '. . . Who are you?' Gawd looks back at her, a wide smirk on her face, 'I'm Gawd.' Regina looks her mother in the eyes, 'What was all this for?' Gawd smirks even more, 'I've been asking myself the same question, Regina.' Regina stands there for a minute, rooted to the spot. She slowly shakes her head, 'I don't recognize you.' She then turns around, and leaves, leaving Gawd well and truly alone."
shatteredhoof_ncr.1006.a: "Azuria Is Mine Alone."



