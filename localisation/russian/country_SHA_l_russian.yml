 NCR_new_canterlot_plan_decision_cat:0 "План Нового Кантерлота"
 NCR_new_canterlot_plan_decision_cat_desc:0 "В процессе осуществления этого плана мы полностью перестроим нашу столицу и превратим её в город, сравнимый с довоенными мегаполисами.\n\n Однако многие наши граждане застряли в прошлом. Потребуется немало убеждения и усилий, чтобы оправдать выделение значительных средств, необходимые для осуществления этого плана.\n\n В настоящий момент у нас есть §O[?reform_capital] очков реформ§!\n\n План Нового Кантерлота готов на §G[?reform_progress]%§!\n"
