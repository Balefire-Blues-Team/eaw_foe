GTC_greenway_trade_hub_idea: "Торговый хаб Гринвэя"
GTC_greenway_trade_hub_idea_desc: "Столица Гринвэя, Верховье, является крупным портом, выступающим в роли промежуточного звена между югом и центром Эквестрии. Через Верховье идут товары из далёкой Каледонии и Хуфингтона, а покупают их пони из Филлидельфии и Мейнхеттена. Главным их экспортным товаром являются рабы, поставляемые Изумрудными стражами с юга, хотя работорговля пошла на спад с тех пор, как Красный Глаз стал отдавать предпочтение невольникам, купленным в Старой Эпплузе."
GTC_outcompeted_by_OAP_idea: "Проигравшие конкуренцию Старой Эпплузе"
GTC_outcompeted_by_OAP_idea_desc: "В отличие от Старой Эпплузы и других работорговцев, мы отказались встать на сторону Красного Глаза, и теперь наша экономика страдает из-за этого решения."
GTC_outcompeted_by_OAP_2_idea: "Рабы от Чистых"
GTC_outcompeted_by_OAP_2_idea_desc: "Поскольку Чистые стали нашими союзниками, они только рады продавать нам своё единорожье население в рабство. Наконец-то дела снова идут в гору!"
TPU_earthborn_purity_idea: "Чистота рождённых землёй"
TPU_earthborn_purity_idea_desc: "Чистые – это сторонники превосходства земных пони, отвергающие любые другие подвиды. Единственные, кого они готовы хоть в какой-то мере принять – это единороги, признавшие собственную неполноценность и отломившие рога, чтобы уподобиться земным пони. Раз Чистые отвергают единорогов, их боевая мощь невелика по сравнению с окружающими державами, но сами они очень выносливы."
COT_empty_forests_idea: "Опустевшие леса"
COT_empty_forests_idea_desc: "Корона издавна страдала от малонаселённости: лишь небольшие племена обустраивали свои жилища в обширных местных лесах. Ходят слухи, что когда-то этот край был процветающим и полным пони, но постоянные наборы в армию Разбитого Копыта, налёты Аметиста и уход молодых пони в места вроде Неокасла в поисках лучшей жизни заставили эту землю опустеть."
COT_SHC_tribute_to_topaz_idea: "Дань Разбитому Копыту"
COT_SHC_tribute_to_topaz_idea_desc: "С тех пор как Руби Роуз вторглась в Корону, рейдеры забирают у региона его будущее. Раз в год пони Короны собираются вместе и приносят подношения Разбитому Копыту, вынужденные отдавать свою безопасность, процветание и даже друзей, чтобы насыщать жадность рейдеров."
SHC_6_barrel_justice_idea: "Шестизарядное правосудие"
SHC_6_barrel_justice_idea_desc: "Здесь, в Шерхуфе, нет ничего важнее закона и его соблюдения. Каждый город управляется судьёй, и все они подчиняются шерифу Стил Уоллу. Судьи и их отряды законников славятся тем, что вершат правосудие с помощью своих шестизарядных револьверов. В Шерхуфе револьвер – лучшее оружие, ведь здешние образцы превосходят любые другие шестизарядники в пустошах. Местные пони готовы нести закон и порядок, написанные кровью бедолаг, посмевших нарушить его положения."

