 MAN_jungle_brigades_tt:0 "§HВ Нью-Манго будут сформированы 3 дивизии ветеранов из джунглей.§!\n"
 ROK_rockbreakers_tt:0 "§HВо внутренних землях каменных фермеров будут сформированы 2 хорошо оснащённые дивизии раскалывателей камней.§!\n"
 RAF_uber_fishers_tt:0 "§HВ Гринлайне будет сформирована 1 большая и хорошо оснащённая дивизия рыбаков.§!\n"
 
