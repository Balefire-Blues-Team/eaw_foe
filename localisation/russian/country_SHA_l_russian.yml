 NCR_unlock_western_investement_tt:0 "§CОткрывает решения на инвестирование в промышленность и сближение с государствами [ROK.GetGenName] и [RAF.GetGenName].§!"
 NCR_unlock_eastern_investement_tt:0 "§MОткрывает решения по подготовке восточных территорий к войне.§!"

 NCR_early_western_investement_expand_pinkie_farm_decision_tt_1:0 "§RМы не нашли руды, наша попытка провалилась.§!\n"
 NCR_early_western_investement_expand_pinkie_farm_decision_tt_2:0 "§HБыла вскрыта небольшая рудная жила.§!\n"
 NCR_early_western_investement_expand_pinkie_farm_decision_tt_3:0 "§MБыла вскрыта рудная жила приличных размеров.§!\n"
