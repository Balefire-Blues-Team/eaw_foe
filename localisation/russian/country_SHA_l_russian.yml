POLITICS_DEADEYES_DESC:0 "Дэдайс некогда был простым мелким военачальником, который совсем ничем не прославился. Его приход к власти был произошёл совершенно неожиданно, поэтому многие другие рейдерские боссы были застигнуты врасплох возвышением этого непритязательного жеребца.\n\nНо, несмотря на внезапный приход к власти, Дэдайс быстро проявил себя. Под его суровым копытом разваливающаяся и враждующая банда Разбитого Копыт была реорганизована и преобразована в силу, подобной которой юг не видел уже долгое время. Рейдеры быстро отвоевали свои старые земли, а потом обратили своё внимание на прочие банды бандитов, которые так долго охотились на них.\n\nСерия завоеваний и тактических слияний сделала рейдеров Разбитого Копыта самой могущественной бандой на Азурвэе. Хотя все эти годы Дэдайс выглядел главарём банды, истинным лидером Разбитого Копыта оставался таинственный и неуловимый "Мистер Топаз". Только Дэдайс когда-либо разговаривал с этим мистером Топазом, и многие считают, что он является лишь марионеткой, созданной для того, чтобы запугивать новобранцев."

POLITICS_EARLYGAWD_DESC:0 "Среди Когтей есть несколько имен, которые известны по всей послевоенной пустоши. И одно из них - это имя Гаудины Грознопёрой, лидера Когтей Гауды и одной из немногих, кто отклонила предложение Красного Глаза о работе на него.\n\nГаудина известна тем, что она весьма парадоксальным образом одновременно придерживается принципов моралью и дословно следует заключённым ею контрактам. Она отказалась от бесчисленных предложений, которые иные Когти заключили бы не раздумывая, исключительно потому, что они были ей неприятны. Однако её моральные стандарты были не настолько высоки, чтобы помешать ей попасть на службу к банде Разбитого Копыта.\n\nТеперь её контракт завершён, и Гаудина оказалась во главе банды, что наняла ее. Планы этой грифины на будущее пока неизвестны, но многие надеются, что она создаст нечто получше нации рейдеров, которая ранее контролировала земли к югу от Азурвэя."


POLITICS_STEELWALLREVOLUTION_DESC:0 "Вражеская оккупация не пощадила Стил Уолла. Он был вынужден прятаться в бункерах, наблюдать, как убивают пони под его командованием, и постоянно скрываться и бежать от тех, кто желал его смерти. Более слабые жеребцы уже отступили бы, сдались или же сбежали в поисках более дружелюбных земель. Но не Стил Уолл.\n\nМаршал выдержал все невзгоды и теперь готов вернуть потерянное. Его нация больше не покроет себя позором и не будет подчиняться чужеземному завоевателю. Его гордость, его страна и свобода его пони будут восстановлены."

