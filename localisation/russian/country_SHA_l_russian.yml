 NCR_mine_gorges_3_decision:0 "Промышленная добыча полезных ископаемых в Ущелье"
 NCR_mine_gorges_3_decision_desc:0 "Мы развернём добычу по всей территории вокруг Ущелья. Мы отправим туда немало промышленного оборудования, а также освободим рабочих от военной службы."
