 shatteredhoof.1.t:0 "Разбитое Копыто: История военных лет"
 shatteredhoof.1.d:0 "До Великой войны земли, ныне известные как Разбитое Копыто, были практически необитаемы. Здесь располагалось лишь несколько фермерских хозяйств да железная дорога, соединявшая современный Новый Мейрвей с Эпплузой. Редкие реликвии, найденные тут да там в песках, намекают, что когда-то здесь существовали поселения племён нейуа с юго-востока, но всё это – предания старины, интересующие лишь археологов. После начала Великой войны именно хребет Разбитое Копыто был выбран местом проведения переговоров о прекращении огня между принцессой Селестией и зебриканскими делегатами. Выбор пал на это место из-за его близости к юго-восточному фронту и крайне низкой плотности населения. Именно во время этих роковых переговоров на Селестию было совершено покушение, которое удалось предотвратить лишь благодаря вмешательству героя войны – Биг Макинтоша.\n\nМинистерство Морали, разъярённое попыткой убийства и опасавшееся самосуда толпы в случае содержания заговорщиков в обычных тюрьмах, приняло решение построить здесь тюрьму «Разбитое Копыто». Название не только должно было напоминать первым заключённым (многие из которых были участниками покушения на хребте) о причинах их заточения, но и буквально описывало внутренние порядки. Узников отправляли на тяжёлые работы, где они в прямом смысле разбивали копыта в поисках драгоценных камней и магических кристаллов для нужд фронта и оплаты услуг драконов-наёмников. Вдали от назойливых глаз прессы с заключёнными обращались как с рабами, а камеры быстро заполнились политическими диссидентами.\n\nМногие подозревают, что «Разбитое Копыто» не стало целью для зебриканских мегазаклинаний именно из-за находившихся там оппозиционеров. Однако, несмотря на отсутствие прямых попаданий, после войны тюрьма осталась без продовольствия, и многие узники даже прибегли к пониедству, надеясь получить шанс выжить. Министерство Морали никогда не заботилось о создании запасов еды, не думая (или не желая думать) о том, как заключённые встретят Последний день. Вместо этого в последние дни войны Министерство инвестировало в..."
 shatteredhoof.1.a:0 "...камеры для новых заключённых."
 shatteredhoof.1.b:0 "...вооружение для всех охранников."
 shatteredhoof.1.c:0 "...расширение помещений для персонала."
 
 shatteredhoof.2.t:0 "Разбитое Копыто: Послевоенная история"
 shatteredhoof.2.d:0 "Вскоре после Последнего дня заключённые Разбитого Копыта превратились в разрозненную толпу, слишком занятую выживанием, чтобы думать о чём-то ещё. Кто-то убежал, желая отыскать другие поселения, кто-то пытался сбиться в банды и атаковать форт Шерхуф, но неизменно получал отпор. У них не было ни плана, ни лидера, ни ресурсов – пока не появилась Руби Роуз. Она была единственной выжившей из некогда исчезнувшей банды, вернувшейся на службу к таинственному благодетелю, известному как Мистер Топаз. Получив оружие и броню от своего покровителя, Руби Роуз выковала порядок из хаоса, став, если выражаться языком рейдеров, «боссом» Разбитого Копыта.\n\nОбъединившись под началом Руби, бывшие узники – точнее теперь рейдеры Разбитого Копыта – начали расширять свои владения, подминая под себя возникающие вокруг мелкие поселения. Их отряды совершали набеги на Пьюрпоинт, Верховье и Лесли, грабя и забирая всё необходимое для жизни. Под началом Руби Роуз налёты были настолько успешными, что группировка быстро превратилась в одну из самых могущественных и уважаемых сил на юге. Множество поселений и культур, чьи названия давно стёрлись из памяти, были подчинены (добровольно или же не очень), что закрепило за Разбитым Копытом место под облачным небом пустоши. Главными плодами завоеваний стали приток Корона и протекторат Шерхуф, некогда полностью принадлежавшие рейдерам.\n\nКогда запасы были накоплены, а дальнейшая экспансия стала лишь вопросом времени, Руби Роуз получила новые указания от Мистера Топаза. Чтобы Разбитое Копыто выжило, им нужно было стать чем-то большим, чем просто мародёрами. Обеспечив безопасность границ и снабжения, Руби Роуз начала отправлять масштабные экспедиции для сбора ресурсов, ремонта и восстановления того, что осталось от Эквестрии. Из всех её начинаний одно увенчалось таким успехом, что его плоды приносят пользу и по сей день. Она..."
 shatteredhoof.2.a:0 "...расчистила местные руины."
 shatteredhoof.2.b:0 "...отремонтировала Азурвэй."
 shatteredhoof.2.c:0 "...разграбила гавань."
 
 shatteredhoof.3.t:0 "Разбитое Копыто: Современная история"
 shatteredhoof.3.d:0 "После того как Руби Роуз мирно скончалась во сне, Разбитое Копыто впало в стагнацию, лишившись мудрого наставничества таинственного мистера Топаза. Пока фракция пребывала в упадке, вокруг её границ возникло множество поселений: они отстраивались на руинах и обживали пустошь. Период застоя закончился, когда неизвестный убийца устранил тогдашнего босса Комплейсенси, что спровоцировало многолетнюю гражданскую войну. Обе стороны сильно истощили друг друга, а потом о себе заявила третья сила под предводительством хитроумного стрелка Дэдайса – нового ставленника мистера Топаза. Благодаря острому уму и быстрой реакции он объединил Разбитое Копыто под своим началом, стремясь превзойти успехи самой Руби Роуз.\n\nДвижимый этими амбициями, он вновь повёл рейдеров в поход, и те быстро сокрушили расслабившиеся окрестные поселения. Первостепенными целями Дэдайса стали Шерхуф и Корона, которые восстали, пытаясь отстоять свою независимость. Используя как стрелковое мастерство, так и тактику устрашения, Дэдайс навязал обеим землям сделку: дань в обмен на защиту. Экспансия продолжалась до тех пор, пока рейдеры не потерпели сокрушительное поражение в области под названием Лесли. Солдаты Дэдайса были поглощены сражением с местными поселенцами, когда их застала врасплох ударом во фланг огромная группа беглых крепостных из Неокасла. Оказавшись зажатым между крепостными и поселенцами, Дэдайс отступил, оставив после себя горы снаряжения. Собрав эти трофеи, поселенцы и крепостные сформировали Освободительную армию Аметиста. Несмотря на поражение, Разбитое копыто стало более сильным, чем когда-либо прежде, и полностью объединённым под властью Дэдайса.\n\nКогда все близлежащие поселения оказались подчинены и начали платить дань, мистер Топаз приказал Дэдайсу перейти к созданию более устойчивого общества. Поэтому Дэдайс нанял наёмников – «Когтей» Гаудины Грознопёрой (подробнее в Приложении I), – и, подобно Руби Роуз, занялся инфраструктурными проектами. Начинания Дэдайса оказали огромное влияние на некоторые районы Разбитого Копыта. Особенно..."
 shatteredhoof.3.a:0 "...изнурительный труд поселенцев до смерти."
 shatteredhoof.3.b:0 "...инвестиции в производство револьверов Шерхуфа."
 shatteredhoof.3.c:0 "...торговля с Гринвэем."
 
 shatteredhoof.4.t:0 "Разбитое Копыто: Приложение I"
 shatteredhoof.4.d:0 "«Когти» были одной из многих групп наёмников родом из некогда оккупированной Нова Грифонии, которые были готовы сражаться за любую сторону конфликта, у которой было достаточно денег для оплаты их услуг. Среди множества наёмных отрядов «Когти» выделялись своим размером и редкостной стойкостью. После наступления Последнего дня компания распалась на множество мелких групп, которые также промышляли наёмничеством: рота Стерн в Филлидельфии, Редвинга – в Саммерфилде, Фезербраша – на западе. Но это приложение посвящено «Когтям» Гауды, что обосновались в Разбитом Копыте. Эти грифоны долгое время провели на юге, работая на Эпплузу, Неокасл и многие другие поселения.\n\nПосле поражения Дэдайса в Лесли ему потребовалось больше войск, чтобы удержать завоёванные земли, и именно поэтому он нанял «Когтей» Гауды в рамках долгосрочного контракта. На протяжении многих лет её наёмники подавляли любые восстания, обучали рейдеров Разбитого Копыта и отражали набеги Освободительной армии Аметиста. Хотя наёмники верны исключительно крышкам, ходят слухи, что Гаудина Грознопёрая желает видеть в Разбитом Копыте нечто большее, чем просто банду грабителей.\n\n— Конец Приложения I. Подпись: Сангвин Сигнейчур, автор «Современной истории пустошей». Пожалуйста, перейдите на следующую страницу к Приложению II, посвященному тактике Гаудины и её упору на..."
 shatteredhoof.4.a:0 "...городской бой."
 shatteredhoof.4.b:0 "...осадную войну."
 shatteredhoof.4.c:0 "...наступление широким фронтом."
 
 shatteredhoof.5.t:0 "Дань Короны"
 shatteredhoof.5.d:0 "Пони выходят из-под сени лесов, толкая перед собой телеги, нагруженные лучшей данью Короны. Под бдительным взором старейшин, племенные пони в рваных платьях и робах идут вперёд, добавляя свою скромную лепту в огромную гору припасов. Из-за деревьев за ними наблюдают воины с копьями и шестизарядниками Шерхуфа, следя, чтобы никто не уклонился от уплаты. Снова настало время сбора, и пони Короны отдают должное.\n\nРядом с кучей добра сидит старая кобыла; один её глаз изувечен шрамом и больше не видит, тёмные одежды мешком висят на измождённых плечах. Она провожает каждого подносящего слабым кивком и мягкой улыбкой. К ней подбегает крепкий жеребец в сером пальто и обращается к ней: — Верховная старейшина, я не смею подвергать сомнению ваше решение, но из Разбитого Копыта приходят вести о поглощающем его хаосе. Должны ли мы и дальше хранить верность нашим соглашениям? У нас есть шанс стать свободными и вновь самостоятельно вершить свою судьбу, — он слегка хмурится. — Шанс для всех племён показать, чего они стоят.\n\nСтарая кобыла провожает взглядом очередного пони, который кладёт ружьё в общую кучу и уходит. Она тихо произносит. — Оглянись вокруг, юнец. Посмотри на деревья. Что скрывается среди них? — жеребец оглядывается: — Ничего, верховная старейшина. Лес пуст, как и всегда, — она медленно качает головой. — Не всегда. Я всё ещё помню времена, когда умерла Комплейсенси. Тогда я была молодой кобылой, полной рвения и огня. Мы думали, что пришло время Короны занять своё место под солнцем. Но, подобно Икару из старых зебриканских легенд, мы взлетели слишком высоко. Вдохни поглубже, юнец, и пламя обожжёт твои ноздри. Прислушайся, и ты услышишь, как проклятые из Короны молят о пощаде. Но Дэдайс не славился милосердием. За то, что я не узрела собственной дерзости, он забрал мой глаз; за то, что мы возомнили себя выше других, он поверг нас ниц, позволив драконьему огню выжечь наши земли и вычернить кору деревьев.\n\nОна медленно поднимается на копыта и смотрит на жеребца. — Мы под защитой и в безопасности. Пока это так, нам живётся лучше, чем большинству в пустоши. Не желай величия, юнец. Желай лишь счастливой и мирной жизни, — она тихо вздыхает, доставая из-под плаща свою последнюю ценность."
 shatteredhoof.5.a:0 "Мешочек крышек."
 shatteredhoof.5.b:0 "Старое ружьё."
 shatteredhoof.5.c:0 "Письмо о передислокации."
 
 shatteredhoof.6.t:0 "Последствия"
 shatteredhoof.6.d:0 "Гаудина Грознопёрая никогда не привыкла сидеть сложа когти, пока другие работают за неё, но отчаянные времена требуют отчаянных мер. Она расположилась за старым столом Дэдайса, изучая бумаги и манифесты бывшего лидера рейдеров, отмечая тайники со снабжением и позиции врага. Грифина подняла взгляд, когда дверь распахнулась и вошли несколько наёмников, большинство из которых были покрыты кровью и грязью. Гаудина кивнула им. — Доложите о ситуации. Голдбик, что там на R-7? — один из грифонов, самец с золотистыми перьями, почтительно кивнул. — Все наши бойцы мобилизованы и берут страну под контроль. Пока я собирал припасы, на нас напали несколько групп рейдеров, вооружённых стволами из Гринвэя. Похоже, наши западные соседи настроены не слишком дружелюбно. Кроме того, многие бросили заводы, чтобы примкнуть к нам, а из-за этого экономика едва дышит.\n\nГаудина кивнула. — Сейчас нам прежде всего нужны бойцы и пушки, а экономику наладим, когда добьёмся хоть какой-то стабильности. Отправь отряд вырыть траншею вокруг Кучи, чтобы прервать любую поддержку из Гринвэя. Мунталон, что на землях между нами и Шерхуфом? — грифина с тёмным оперением чётко отдала честь. — Земли под охраной, а мой отряд выследил подавляющее большинство рейдеров. Нам помог жеребец, шериф Стил Уолл, лидер Шерхуфа. Он в одиночку переловил кучу рейдеров – к тому времени, как мы их выследили, они уже примерили пеньковые галстуки. Мы также заметили несколько укреплений племени Корона на севере, в стороне от нашего маршрута. Последний раз, когда мы их видели, их атаковали войска Освободительной армии Аметиста; следов Кайзеркреста не обнаружено. Кроме того, рейдеры успели повредить большую часть инфраструктуры прежде, чем мы их перебили. Поступление дани из Шерхуфа в ближайшее время замедлится. — Гаудина резко кивнула. — Вполне приемлемо. Рада слышать, что в Шерхуфе у нас всё ещё есть друзья. Пусть твои отряды удерживают дороги и пути, ведущие в город.\n\nОна посмотрела на последнего грифона, одноглазого самца с красными перьями: — Бладай, что на севере? — тот склонил голову. — Хуже, чем мы считали, мэм. Похоже, рейдеры объединились с Чистыми, и у них современное снаряжение филлидельфийского образца. Нам не удалось рассмотреть многое, но похоже, что Чистые скупают снарягу на всё то награбленное добро, что притащили им беглые рейдеры. Поставки идут от Красного Глаза. Полагаю, это ход Филлидельфии, пытающейся завести друзей на юге. Сдаётся мне, Стерн начала нам завидовать. — Собравшиеся грифоны дружно усмехнулись, пока их не прервала Гаудина. — Мы разберёмся с ними в своё время. Где Кайзеркрест? Мне нужен полный доклад по границе с Аметистом. — Трое грифонов переглянулись, прежде чем заговорил Голдбик: — Пропал без вести. Ничего не слышно с тех пор, как он отправился к границе."
 shatteredhoof.6.a:0 "Мы живы... пока что."
 
 shatteredhoof.7.t:0 "Бойня в Короне"
 shatteredhoof.7.d:0 "Пули со свистом пролетают мимо лачуги из металлолома, пока остатки солдат Кайзеркреста ищут укрытие. Поле боя густо усеяно телами храбрых наёмников, чья кровь льётся на раскалённый песок пустыни. Джованни не может оторвать от них взгляда, даже когда земля содрогается от взрывов летящих в их сторону динамитных шашек и гранат. Кайзеркрест рывком пригибает его к земле, вырывая из оцепенения. — Очнись, птенец! — Джованни чувствует в клюве вкус железа, пока он осматривает немногих оставшихся в живых. Сам Кайзеркрест, Блэкпаудер – их эксперт по взрывчатке, и Гринтейл – медик. Грифон слышит доносящиеся издалека слова, но с трудом понимает их смысл. — ... в укрытие, ждём подкрепления! Понял меня, птенец?! — Джованни моргает и смотрит на Кайзеркреста расфокусированным взглядом. В клюве пересохло, и он не может подобрать слов для ответа, поэтому лишь кивает и выхватывает револьвер.\n\nБлэкпаудер вскрикивает, доставая гранату и выдёргивая чеку. — Гринтейл... — но договорить он не успевает – пуля попадает прямо в гранату в его когте, и та мгновенно детонирует. В мгновение ока Блэкпаудер исчезает в облаке дыма вместе с половиной лачуги. А Гринтейл широко раскрытыми глазами смотрит на свою нижнюю половину тела, оказавшуюся в десяти метрах от другой. Внезапно мир обретает чёткость: на Джованни обрушиваются запах крови и дыма, а также звук продёргиваемого затвора прямо за спиной. Он резко оборачивается и, не думая, трижды стреляет из револьвера. Пули попадают в кобылку лет пятнадцати, не старше, которая держит винтовку больше неё самой. На секунду её взгляд замирает, прикованный к револьверу. Пони открывает рот, словно пытаясь что-то спросить, но вместо слов раздаётся лишь бульканье, поскольку кровь хлещет из её шеи.\n\nКогти Джованни дрожат, когда он шепчет. — Нет, нет... нет... — револьвер падает на землю. Грифон бросается на открытое пространство, подхватывая падающую кобылку, чья кровь пятнает его лапы. — Я не... я... — пули свистят мимо, рикошетят от брони и почти задевают грифона. Но он, не обращая на них внимания, смотрит на угасающий в глазах кобылки свет. И тут кто-то сбивает его с ног сзади и затаскивает в укрытие – на помощь прибыл старый Кайзеркрест. — Проклятье, птенец! — они прячутся за потрёпанными мешками с песком, пока десятки врагов идут в наступление. Джованни трясёт, он смотрит на свои окровавленные когти, а в ушах стоит слабый звон. Из этого транса его вырывает Кайзеркрест, вкладывая в когти новый револьвер и глядя прямо в глаза. — Уходи! Корона пала! — старый грифон отступает назад, вскидывая пулемёт. — Доложи Гауде обо всём. И расскажи остальным... скажи им, что я пал в бою. Теперь лети! — Джованни, несмотря на шок, всё же слышит приказ: он расправляет крылья и взмывает ввысь, оставляя Кайзеркреста позади. Его последние выстрелы навсегда останутся в памяти грифона."
 shatteredhoof.7.a:0 "Корона пала!"
 
 shatteredhoof.8.t:0 "Весьма любопытное предложение"
 shatteredhoof.8.d:0 "С запада пришли вести о рождении новой силы в пустоши. Согласно донесениям разведки, рейдеры Разбитого Копыта теперь находятся под началом грифины по имени Гауда, предводительницы роты «Когтей». Грифоны, разумеется, широко славятся своей жадностью, особенно «Когти» – наёмники, готовые служить любому, чьи карманы полны крышек. Мы уже не раз теряли добрых бэтпони от когтей грифонов, когда те отражали наши ответные удары после их набегов. Из-за этого многие с недоверием относятся к Гаудине и её наёмникам, ведь почти у каждого фестрала друг или родственник был убит рейдером из Разбитого Копыта. Когда речь заходит об этой банде, доверие становится крайне дефицитным ресурсом.\n\nТем не менее говорят, что Гауда заключила союз с Коалицией Шерхуфа во главе с добропорядочным шерифом Стил Уоллом. Ранее рейдеры держали Шерхуф и его многочисленных поселенцев в узде при помощи насилия и крови, поэтому известие о том, что Гауда работает с ними на равных, стало для многих приятной неожиданностью. Шерхуф процветает благодаря этому альянсу, и, похоже, что Разбитому Копыту под лидерством Гауды всё же можно доверять. Скорее всего. И всё же острые клювы и когти грифонов вызывают у многих страх.\n\nНедавно нас посетил вестник с запада, предложив условия союза. Мы могли бы стать для бывших рейдеров сильным союзником, способным сокрушить их врагов и полностью контролировать юг. А Разбитое Копыто, в свою очередь, могло бы защитить нас, если слухи о пегасах, покоряющих болота, окажутся правдой. Может статься, что всем нам будет выгодно держаться вместе – с определёнными уступками, разумеется. И всё же многие задаются вопросом: не собирается ли Гауда предать нас в будущем? Но одно мы знаем наверняка: наше следующее решение навсегда изменит курс развития страны."
 shatteredhoof.8.a:0 "Это явно выгодная сделка."
 shatteredhoof.8.b:0 "Мы не верим грифонам!"

 shatteredhoof.9.t:0 "Проблема Лесли"
 shatteredhoof.9.d:0 "Отчёты о потерях – неизбежной цене оккупации – горами копятся на столе Гауды. Перо подписывает смертные приговоры ещё пятидесяти бедолагам, отправляя их в мясорубку. Леса Короны и поля Лесли принесли больше проблем, чем пользы. Рейдеры, кричащие об «освобождении», бывшие крепостные, возомнившие себя новым Неокаслом, и постоянная угроза со стороны лоялистов босса Нейлса. Гауда хмурится, подписывая очередной приказ. В дверь стучат, после чего грифина кричит «Войдите!».\n\nВнутрь входит жеребец, одаряя её улыбкой и кивком. — Гаудина Грознопёрая, героиня дня, — он держится уверенно и смотрит ей прямо в глаза. — Я – Рок Солид. Возможно, вы знаете меня как одного из главных противников Дэдайса. Непобеждённого, замечу. Если вы знакомы с историей этих мест до вашего прибытия, то я был мэром Лесли. Мы были в затяжной осаде, когда Нейлс повёл своих крепостных с юга и обошёл силы Дэдайса с фланга – и всё благодаря тому, что мои пони держались до последнего. Если не ошибаюсь, именно из-за всей этой заварушки вас и наняли, — он мягко ухмыляется. — Мир тесен, не правда ли? — наёмница закатывает глаза. — Ближе к сути и покороче. Дел у меня по горло.\n\nПони смотрит на грифину, и его ухмылка исчезает. — Хорошо. Оккупация Лесли обходится очень дорого. Она точно не стоит жизней хороших грифонов и пони. Уверен, Шерхуф тоже доставляет проблемы. Я предлагаю простое решение. Вместо того чтобы посылать в те земли очередных грифонов и пони, я советую передать область под управление полуавтономного правительства, которое лучше справится с сопротивлением. Также вы могли бы превратить это место в исправительную колонию, отправляя туда заключённых: часть из них станет охраной, часть – рабочими. Если что-то пойдёт не так – виноват будет местный губернатор, а если всё получится – вся слава достанется вам.\n\nГауда ещё мгновение смотрит на жеребца, а затем медленно кивает. — В этом есть смысл. Ладно. Передам Бладаю, что у него появилась новая работа. — Рок Солид прочищает горло. — Если позволите... я хорошо знаю эти края, ведь когда-то был здесь мэром. Я умею ладить с местными, знаю ландшафт и бесконечно благодарен вам за освобождение. Возможно, я буду кандидатом получше? — грифина смотрит на него несколько секунд. — А ты ещё тот скользкий подлиза, не правда ли? — помедлив секунду, она добавляет. — Я подумаю. А пока что вон отсюда, Солид."
 shatteredhoof.9.a:0 "Новый член нашего альянса."
 shatteredhoof.9.b:0 "Исправительная колония? Нет, нам нужна эта земля."
 
 shatteredhoof.10.t:0 "Пакт Разбитого копыта"
 shatteredhoof.10.d.gawd:0 "Стил Уолл не из тех, кто любит излишества: он прибыл в исправительную колонию Разбитое Копыто в своей старой поношенной форме. Сидящая напротив Гауда, облачённая в броню, тоже не привыкла к роскоши. Двое существ молча изучали друг друга, пока Стил Уолл первым не нарушил тишину.\n\n— Я прибыл сюда от лица поселенцев городков, которые формально считаются частью Разбитого Копыта. Мы присоединились к вашей атаке на рейдеров, потому что я счёл вас разумной грифиной. Мы пролили немало крови добрых пони за ваши цели, так что пришло время достойно отплатить. Наше требование простое и понятное: вы создаёте официальную систему управления, которая не будет основываться лишь на силе и дикости. Вы должны превратить это место в полноценную страну. Мы также ожидаем, что поселения получат право на ограниченное самоуправление, чтобы положить конец единоличному господству Разбитого Копыта над регионом. И я не покину эту комнату, пока требования не будут приняты, Грознопёрая. Так что давайте договариваться.\n\nГауда около минуты не сводила глаз с жеребца, но ни один из них не дрогнул. После долгого молчания грифина коротко кивнула. — Думаю, я могу принять эти условия. Я не для того свергала рейдеров, чтобы самой стать одной из них, — её когти медленно застучали по столу. — Многие из моих «Когтей» родом из земель за морем, из Грифонии. Из Клаудбьюри. Когда в Империи вспыхнула революция, проигравшие повстанцы бежали на север, в Клаудбьюри. Там они придумали идею «республиканизма», согласно которой лидер страны является представителем, избранным простым народом. Уверена, вы слышали о Республике на севере. Похожая идея, создавшая стабильное общество. Эта система просуществует ещё долго после моего ухода.\n\nСтил Уолл удивлённо приподнял бровь. — Республика? Вы посылали своих наёмников на смерть только ради того, чтобы создать республику? А что, если вас не переизберут? — Гауда откинулась на спинку кресла. — Надо только предпринять меры, чтобы меня было невозможно сместить... по крайней мере, на первых выборах. Например, объявить о голосовании буквально за неделю, чтобы никто больше не успел выдвинуть свою кандидатуру. — Грифина вздохнула. — А что мне ещё остаётся? Провозгласить монархию? Вы явно не видели моих птенцов, раз думаете, что я доверю им власть хоть над чем-то. Диктатура? Не слишком-то отличается от власти рейдеров. Мы будем республикой, просто медленной и стабильной, — она слегка усмехнулась. — Республика подобна винтовке с затвором. Дёрнешь слишком быстро – оружие заклинит. Будешь медлить – и схлопочешь вражескую пулю. Движение должно быть плавным. Если я позволю другим участвовать в этих первых выборах, это парализует систему. Сначала мы должны приучить простых пони к самой идее голосования, а уже потом давать им выбор. Это справедливый компромисс, Стил Уолл?\n\nЖеребец помедлил минуту и кивнул. — Поселенцы Разбитого копыта принимают это предложение."
 shatteredhoof.10.d.topaz:0 "Мы покончили с предателями и отвоевали свои земли, так что дела у нашей банды идут лучше, чем когда-либо прежде. Топаз довёл свои планы до конца, и теперь он может насладиться плодами своего труда. Или нет? Знакомое и привычное чувство жадности никуда не исчезло. Как он может остановиться в момент, когда вокруг столько всего, на что он может выдвинуть свои претензии? О нет, его амбиции далеко не удовлетворены. Топазу не нравится будущее, в котором он будет править маленьким заброшенным клочком земли, имея в подчинении лишь банду рейдеров. Они должны продолжать расширяться, претендовать на большее и стать силой, которая сможет посоперничать даже с величайшими нациями пустоши!"
 shatteredhoof.10.a:0 "В светлое будущее!"
 shatteredhoof.10.b:0 "Слава Топазу!"
 
 shatteredhoof.11.t:0 "Страсти улеглись" #Gawdyna has won
 shatteredhoof.11.d:0 "Когда Джованни получил приказ, он всерьёз подумывал дезертировать из «Когтей» Гауды. Взяться за оружие против Дэдайса и его пони, сражаться за Разбитое Копыто – молодому наёмнику это казалось безумием. Однако пятьсот патронов спустя опасения Джованни развеялись: он стоял среди разбросанных тел рейдеров в уже бывшей столовой. Их дешёвая броня и ржавое оружие не шли ни в какое сравнение с ухоженным и дорогим снаряжением наёмников. И всё же среди множества мёртвых пони можно было заметить и несколько павших грифонов. Джованни бил лёгкий озноб, в то время как ветераны расслабленно обыскивали трупы и курили, устроившись чуть ли не прямо на грудах тел.\n\nОдин из опытных наёмников поднял взгляд, предложил Джованни сигарету и негромко произнёс. — Первый бой, салага? — Джованни медленно покачал головой, забирая сигарету. — Нет, просто... всего пару дней назад я говорил с некоторыми из этих рейдеров, смеялся с ними, — старший грифон кивнул, выпустив струю дыма, и откинулся назад: — Бывает. Но теперь всё изменится. Мы больше не просто наёмники. Мы перешли в высшую лигу. Осталось только приструнить ещё парочку банд. Обычная зачистка от вредителей, — Джованни нахмурился. — Это пони, а не вредители. Я не буду считать это простым истреблением радтараканов. Это трагедия, — ветеран помедлил, а затем пожал плечами. — Рейдеры не совсем пони, если ты понимаешь, о чём я. Но... у тебя доброе сердце, птенец. И пока выполняешь приказы, всё будет в порядке.\n\nКак только старый грифон замолчал, сверху раздался громкий хлопок – тело рейдера рухнуло с балкона, пополнив гору трупов внизу. На балконе показалась Гауда с дымящейся винтовкой в когтях. Она окинула взглядом собравшихся бойцов. — Одного пропустили, птенцы! — многие наёмники обернулись к ней, но Джованни не мог – он не сводил глаз с мёртвого пони, всё ещё истекающего кровью. Гауда снова заговорила. — Отдых закончился! Тюрьма под контролем, но снаружи ещё полно рейдеров! Голдбик, бери взвод и дуй к R-7, собери войска и боеприпасы. Мунталон, твоя группа перекрывает всё отсюда и до Нью-Манго – рейдеры не должны получить ни единого патрона из Шерхуфа. Бладай, Чистые наверняка попытаются воспользоваться моментом, так что не дай им шанса. Кайзеркрест, веди своих к Короне: крепостные пытаются пересечь границу, мы должны показать дикарям, что всё ещё можем их защитить. Живо!\n\nГрифоны разбрелись, похватав оружие и патроны. Старый наёмник рядом с Джованни ухмыльнулся, медленно поднимаясь на ноги. — Ну что, салага? Готов пострелять по крепостным?"
 shatteredhoof.11.a:0 "У Разбитого Копыта новая хозяйка."
 
 shatteredhoof.12.t:0 "Страсти улеглись" #Topaz has won
 shatteredhoof.12.d:0 "Гауда погибла, а вся банда Разбитого Копыта склонилась перед своим истинным повелителем - драконом по имени Мистер Топаз. В его голосе слышатся раскаты чистой ярости, в его глазах пылает вечная жадность, и он доказал, что достаточно силен, чтобы справиться с головорезами Красного Глаза. Теперь ему снова нужно воссоединить банду, что он делал уже много раз через своих марионеток, и вернуть контроль над территорией."
 shatteredhoof.12.a:0 "Мистер Топаз дракон!?"
 
 shatteredhoof.13.t:0 "Стабильная восточная граница"
 shatteredhoof.13.d:0 "Мы разобрались с нашим врагом на востоке. [LRA.GetNameDEF] капитулировала почти сразу, как только наши армии вошли в регион. Хотя многие вольные рейдеры и мелкие отколовшиеся банды всё ещё оказывают сопротивление, вскоре мы их уничтожим и укрепим свой контроль над территорией. Эта победа показала всей Пустоши, что Разбитое Копыто не стоит недооценивать: мы более чем способны защитить себя от любых врагов. Однако нельзя забывать, что §Rдержава [LRA.GetNameDEF] была далеко не единственной угрозой на востоке.§!"
 shatteredhoof.13.a:0 "Наконец-то хоть какая-то стабильность."
 
 shatteredhoof.14.t:0 "Начало чего-то великого"
 shatteredhoof.14.d:0 "— Приветствую вас, граждане Разбитого Копыта и пони из наших союзных государств, слушающие нас сейчас. Меня зовут Гаудина Грознопёрая, и я – нынешний лидер Разбитого Копыта. Ранее в этом году я и мои верные «Когти» свергли рейдеров и работорговцев, что властвовали над этой прекрасной страной. Плечом к плечу с маршалом Стил Уоллом мы построили новый дом для всех нас, хотя победа досталась дорогой ценой: как наёмники, так и поселенцы сложили головы за неё. Время Разбитого Копыта подошло к концу – мы больше не страна, чьё имя неразрывно связано с насилием и смертью. С сегодняшнего дня я объявляю наше государство Временной Республикой Азурия, в которой я буду занимать пост президента до тех пор, пока не будут устранены внешние угрозы. Сегодня мы начинаем строить нечто новое: истинно эквестрийскую республику, объединяющую старые идеалы дружбы, гармонии и демократии в единую идеологию, которая вечно будет вести нас вперёд. Мы организуем выборы, как только положение республики упрочится, на которых вы, граждане, сможете сами выбрать своего лидера. Кто-то из вас может задать вопрос...\n\nДжованни игнорирует радио. Он сидит в тихом углу бара, расположившись подальше от шума, и медленно потягивает напиток. Грифон полностью ушёл в себя и не смотрит по сторонам. На его мундире висят медали, и самая почётная из них – «За честь Азурии», которой награждают лишь самых храбрых солдат новой республики. Однако эта награда почти полностью скрыта за остальными, постыдно задвинутая как можно дальше с глаз долой. Он смотрит в свой стакан, чувствуя, будто его когти всё ещё покрыты грязью, а в ушах стоит лёгкий звон. Остальные посетители бара столпились вокруг радио, оставив грифона в одиночестве. Так продолжалось до тех пор, пока стул напротив него не отодвинулся, и на него не сел земной пони в костюме. Спустя мгновение жеребец заговорил. — Джованни Гайсай, верно? Рад знакомству. Рок Солид.\n\nДжованни поднимает взгляд лишь через минуту, оглядывает жеребца и медленно кивает. — Это я, — Рок Солид слегка улыбается. — Вы ведь сражались в Короне против рейдеров Аметиста? Я был мэром Лесли до того, как эти бандиты пришли и захватили город. Ходят слухи, что президент собирается назначить меня на прежний пост, — он делает паузу. — В любом случае, я хотел поблагодарить вас. Кайзеркрест, может, и пал в Короне, но он дал мне и моим пони достаточно времени, чтобы сбежать в Разбитое Копыто. Вы спасли много жизней, — Джованни лишь едва заметно кивает. — Недостаточно, — Рок на секунду задумывается, прежде чем ответить. — Да, всегда недостаточно, если домой вернулись не все. Что ж, я знаю, что многие в нашей новой армии равняются на вас. Я в том числе. Если будет свободное время, загляните в Лесли на разговор. У нас с генералом Олив Бранчем есть кое-какие планы, — пони встаёт, пока Джованни смотрит на него снизу вверх. — Наслаждайтесь напитком, мистер Джованни. Да здравствует республика! — грифон в ответ медленно кивает. — Да здравствует республика."
 shatteredhoof.14.a:0 "Да здравствует республика!"

shatteredhoof.1401.t: "Герои"
shatteredhoof.1401.d: "Барабан револьвера щёлкает, вращаясь. Курок приоттягивается совсем немного, а затем плавно возвращается на место. Когти Джованни слегка дрожат при каждом щелчке. Он сидит на той самой сцене, где когда-то его награждали медалью. Где его называли героем. Курок вновь щёлкает по пустому гнезду для патрона, и грифон тихо вздыхает, опуская оружие. Он рассматривает полированную поверхность серебристого револьвера с клеймом «Шерхуф Армс». Его мысли прерывает голос грифины. — Слышала, ты где-то здесь, — Джованни поднимает взгляд и видит Регину. Она слегка усмехается. — Пришёл заново пережить церемонию награждения, герой Короны?\n\nОн сильнее сжимает рукоять револьвера и опускает голову. — Я... это не про меня. Пожалуйста, не называй меня так, — Регина кивает и подходит ближе, присаживаясь рядом. — Что ж, тогда тебе лучше поскорее назвать имя, по которому я могу к тебе обращаться, иначе я продолжу в том же духе, — он делает неровный вдох, закрывает глаза, а затем медленно выдыхает. — Джованни. Джованни Гайсай, — Регина широко улыбается. — Приятно познакомиться, Джованни. Я – Регина Грознопёрая. Мы уже виделись однажды, только тогда ты выглядел неважно. Да и сейчас, честно говоря, не лучше, — Джованни смотрит на неё, а затем снова отворачивается. — Меня не должно здесь быть. Я должен был погибнуть в Короне... Жаль, что не погиб, — он качает головой. — Герой. Они зовут меня героем. Героем Короны. Но погиб-то не я. Я не остался прикрывать отход товарищей. Я просто сбежал! Герой?! Какой герой так поступает?! — он резко поворачивает голову к ней. — И всё ради твоей матери. Кровь на моих когтях исключительно из-за неё! И ради чего? Чтобы меня называли героем? Я должен быть мёртв, но вместо этого я здесь, обвешанный медалями и усыпанный поздравлениями!\n\nРегина смотрит на него, и усмешка исчезает с её лица. Помолчав секунду, она отводит взгляд. — Да. Я понимаю. Тоже не в восторге от некоторых вещей, которые совершила моя мать, — она постукивает когтями по помосту. — Знаешь, я убила раба. У Чистых. Он заметил меня, когда я подкрадывалась поближе, чтобы снять охрану. Он начал шуметь от радости, и если бы не замолчал, меня бы поймали и убили. И я выстрелила в него. Попала прямо между глаз. Лучший выстрел в моей жизни, — грифина ещё мгновение смотрит в пустоту, а затем снова переводит взгляд на Джованни. — Ты прав. Мы этого не заслуживаем. Мы просто те, кто выжил. Но кроме нас никого не осталось, Джованни. Я каждую ночь вижу его лицо и проблеск надежды в его глазах. Однажды, когда я умру, Борей будет судить меня. Надеюсь, к тому времени я успею сделать достаточно добрых дел, чтобы искупить свою ошибку.\n\nДжованни молчит, глядя на неё, а затем тихо произносит. — Кобылка. У рейдеров Аметиста в армии была маленькая кобылка, — он тихо вздыхает и смотрит прямо перед собой. — На днях меня пригласили на разговор к генералу Олив Бранчу и губернатору Рок Солиду. У них есть какой-то план, и они хотят видеть меня там. Политика, полагаю, — Регина мягко улыбается. — Иди, Джио. Пусть мы и не герои, но... но, может быть, мы всё ещё можем творить добро, — он смотрит на неё, и на его лице впервые за очень долгое время появляется слабая улыбка."
shatteredhoof.1401.a: "Жди меня, Лесли."
 
 shatteredhoof.15.t:0 "Вопрос пегасов"
 shatteredhoof.15.d:0 "Гауда сидит в своем донельзя тесном офисе. Отчёты и бумаги, ожидающие подписи, сложены в неустойчивые башни, готовые обрушиться от неловкого движения. Перед ней сидят шериф Стил Уолл и генерал Олив Бранч. Грифина кивает. — Джентлькольты, у нас проблема. Пока мы были заняты наведением порядка на юге, у наших границ собрались враги, представляющие серьезную угрозу для Республики. Великий Анклав Пегасов – прямая угроза, и мы не покинем эту комнату, пока не определим свой подход к ним. Шериф, я жду, что вы выступите от имени Шерхуфа, а вы, Олив Бранч, будете говорить за армию. Я не собираюсь в одиночку принимать это решение. Шериф Стил Уолл, вы можете высказаться первым.\n\nСтил Уолл почтительно кивает. — Тут всё ясно, госпожа временно исполняющая обязанности президента, ответ только один. Анклав – слишком большая и слишком близкая к нам угроза, чтобы её можно было игнорировать. В случае поражения мы потеряем всё без единого шанса отыграться, — пони кладет копыто на стол. — Эти пегасы внимательно смотрят на нас сверху вниз прямо сейчас, потому что видят в нас ту угрозу, которой мы и являемся. Филлидельфия для них – банда бродячих рейдеров, их они не боятся. Мы же – полноценная нация на подъёме, наследники Эквестрии, у которых есть тысячи добровольцев, готовых завтра же отправиться на смерть, если это поможет покончить с этими крылатыми ублюдками! — он фыркает. — Каждый день наши пони смотрят в затянутое облаками небо и видят напоминание о том, кто наш истинный враг. Пегасы из Анклава вот уже на протяжении двух столетий лишают нас солнца, морят голодом и тьмой, не желая разгонять облака даже на час в день. Анклав уже убил миллионы пони, украв у них солнце, и я не позволю нам безвольно сидеть здесь, пока они убивают новых! — шериф ударяет копытом по столу и откидывается назад. — Мы должны пройти маршем через эти проклятые болота и разогнать их облака. А выжившие станут хорошими гражданами. Дайте мне пятьдесят пегасов, и я принесу дождь во время засухи; дайте мне сотню, и ни один пони больше не будет голодать. Дайте мне отряд в силовой броне, и завтра мы прилетим в Филлидельфию и скинем Красного Глаза с самой высокой трубы его фабрики, — он откидывается назад и поправляет униформу. — Тут не о чем спорить. К тому же, вы обещали правосудие на юге, госпожа временно исполняющая обязанности президента. Так давайте принесем правосудие и в небеса.\n\nОлив Бранч немедленно вступает в разговор. — Госпожа временно исполняющая обязанности президента, это действительно правда, что Анклав – угроза, но неразумно наносить удар первыми. Представьте, как это будет выглядеть в глазах простых пони: они решат, что вы – просто очередная Руби Роуз, расширяющая влияние ради собственной выгоды. Анклав ужасен, но если мы и пойдём на войну, нам нужно дождаться их нападения, и тогда вся нация сплотится. Кроме того, сейчас нам такой враг не по зубам. Фабрики едва начали выпускать продукцию на прежних уровнях, а у солдат едва хватает боеприпасов для тренировок, не говоря уже о войне. Болота Хэйсид будут пожирать наши припасы, после чего солдатам придётся сражаться одними копытами и зубами. Если мы и нападём на Анклав, то только если будем уверены в своей победе. Сколько тысяч погибнет, если мы ударим сейчас? Достаточно, чтобы болота стали красными, — Стил Уолл перебивает. — А как же пони из Хэйсида? Они бегут от контроля Анклава, тысячами ежедневно прибывают в форт Шерхуф. Кто знает, что творится в глубине болот? — Олив Бранч качает головой. — Беженцев мы приютим! Но сколько их погибнет под перекрёстным огнем, если мы войдем туда сегодня?\n\nГауда поднимает коготь, когда Стил Уолл собирается ответить. — Довольно. Шериф Стил Уолл, у вас было время высказаться, и я выслушала ваши доводы. Олив Бранч, спасибо, — она переводит взгляд с одного пони на другого. — Вы оба привели хорошие доводы. Но в итоге я предпочту сделать ставку на..."
 shatteredhoof.15.a:0 "... прагматизм Олив Бранча."
 shatteredhoof.15.b:0 "... агрессию Стил Уолла."
 
 shatteredhoof_ncr.1.t:0 "Предложение об объединении"
 shatteredhoof_ncr.1.d:0 "Мы получили предложение от Временной Республики Азурия. Они хотят, чтобы наши земли вошли в состав их республики, которая теперь будет управляться новым коллективным демократическим правительством. Также в предложении утверждается, что экономическое сотрудничество и интеграция вооруженных сил значительно улучшат качество жизни всех граждан альянса. Предложение рекомендует нам провести голосование среди граждан по вопросу об объединении с Азурией. Если мы станем одним из основателей нового государства, то получим огромную выгоду в долгосрочной перспективе. Однако так мы потеряем большую часть нашей автономии. И вряд ли Гаудине понравится наш отказ."
 shatteredhoof_ncr.1.a:0 "Мы рады присоединиться."
 shatteredhoof_ncr.1.b:0 "Это уже слишком."
 
 shatteredhoof_ncr.2.t:0 "Рождение Новой Кантерлотской Республики"
 shatteredhoof_ncr.2.d:0 "— Добрый день, «Когти» и шерхуфцы, гринвэйцы и хуфлоки, фестралы Нью-Манго и пони со всей Азурии и Лесли! Меня зовут Гауда Грознопёрая. В течение последнего месяца лидеры оборонительного альянса, объединяющего наши земли, проводили встречи в Разбитом Копыте. Весь этот месяц мы спорили и обсуждали создание нового государства, которое станет главенствующей силой в южной Эквестрии. Все, кто слушает эту волну, с превеликим удовольствием объявляю вам, что пять минут назад мы подписали конституцию, тем самым официально провозгласив создание Новой Кантерлотской Республики. Мы – официальный преемник давно павшей Эквестрии. Другие, вроде Красного Глаза в Филлидельфии, могут заявлять о своих аналогичных амбициях, но лишь наша славная республика будет следовать старым идеалам Эквестрии. Дружба, гармония, демократия, свобода – эти четыре ценности направят наше общество в будущее и позволят создать лучший строй, какой только видела эта земля.\n\n— Да, во время войны Эквестрия совершила множество ужасных деяний, которые мы никогда не повторим. Слежка Министерства Морали, неэтичные эксперименты Министерства Тайных Наук, коррупция Министерства Военных Технологий, цензура Министерства Стиля, неограниченная власть принцессы Луны – любым подобным вещам не будет места. Конституция республики гарантирует это, ограничивая власть президента и всех государственных представителей. Вы можете обратиться в местную ратушу, чтобы ознакомиться с полным списком прав, которые дарует вам конституция. Важнейшими из них являются свобода слова – чтобы Министерство Морали никогда не возродилось; свобода прессы – чтобы Министерство Стиля не вернулось вновь; и свобода вероисповедания для защиты меньшинств нашей республики. Для нас первостепенно право каждого гражданина избирать своих представителей. Будут проведены выборы, и вы сможете проголосовать, выбрав путь развития нашей страны, чего прежде не случалось на этой земле.\n\n— Несмотря на ошибки диархии в прошлом, мы всё же отдадим дань уважения сёстрам-аликорнам за то, что они так долго защищали наши земли. На нашем новом флаге будут символы их луны и солнца, гарантирующие, что мы никогда не забудем свою историю. Наш флаг будет триколором, как и большинство республиканских знамён. Пурпурный цвет на нём олицетворяет саму республику – это отсылка к древней Зоникийской Республике. Белый цвет символизирует чистоту, которую мы обещаем принести в пустошь. Также это цвет Селестии, ведь мы вернём земле былое процветание, что было при ней. Наконец, синий цвет представляет Азурвэй, нашу экономическую артерию. Ещё он отсылает к Луне, принесшей Эквестрии небывалую модернизацию и процветание за её короткое правление. Наш флаг уже развевается высоко над Новым Кантерлотом – новой столицей Республики, основанной в старом Джанкшнтауне.\n\n— Да живёт Эквестрия вечно! Долгих лет нашим гражданам! Да здравствует Республика!»"
 shatteredhoof_ncr.2.a:0 "Ура!"
 
 shatteredhoof_ncr.4.t:0 "Проблемы интеграции"
 shatteredhoof_ncr.4.d:0 "Звуки криков и беспорядочной стрельбы наполняют лагерь, когда солдаты со всех концов страны учатся быть единым целым. Азурийский офицер наблюдает за тренировкой по метанию гранат. — Перед тем как бросить гранату, вы должны крикнуть, чтобы предупредить своих товарищей!\n\nПони из Хуфлока подходит к черте для броска и, моргая, смотрит на ящики со снарядами. — Э-э, сэр, это картошка. Почему мы кидаем картошку вместо настоящих гранат? — офицер подходит ближе и говорит с ухмылкой. — Потому что настоящие гранаты ценны. Более того, они гораздо ценнее тебя, — он берёт картофелину и вкладывает её в копыто солдата. — А теперь размахнись хорошенько и брос...\n\nПрежде чем он успевает договорить, бывшая работница каменной фермы, спасенная из Гринвэя, монотонно произносит: «Ложись». Кобыла хватает картофелину и швыряет её изо всех сил в тренировочную мишень, попадая точно в цель и превращая овощ в кашу. Офицер хмурится. — Я же сказал кричать перед броском! — пони оборачивается и недоуменно наклоняет голову. — Я и крикнула, — офицер свирепеет ещё пуще прежнего. — И ты бросаешь слишком сильно, малявка! — она наклоняет голову ещё сильнее, смотрит на картошку, затем снова на офицера. — Вы хотите, чтобы я бросала слабее?\n\nВ другом конце лагеря бывший крепостной из Лесли тренируется на стрельбище, попадая точно в яблочко из своей винтовки, пока фестрал рядом снаряжает магазины. Бывший крепостной слегка ухмыляется, передергивая затвор. — Фух, напоминает мне времена до нашего побега. Я тогда работал на Гильдию Шахтёров, — фестрал кивает. — Условия такие же паршивые? — жеребец утвердительно кивает и скалится. — А наши «хозяева» были ещё хуже. Хех, правда в те времена у меня был журнал с фотографией старой доброй Луны в этом славном синем платье. Помогал мне пережить трудные времена, знаешь ли... Луна – та ещё красотка. Ну, была красоткой, — фестрал поднимает взгляд и мрачнеет. — Эй, Луна – моя богиня, придурок, — пони смотрит на него и ухмыляется ещё шире. — Знаешь, если бы за молитву она оказалась рядом со мной в свадебном платье, я бы тоже назвал её богиней, дружище, — фестрал рычит, швыряет магазин винтовки на землю и бросается на жеребца.\n\nОфицер устало потирает глаза, глядя, как картофелина очередного новобранца просто шмякается о землю. — Будь это настоящая граната, ты бы нас всех только что убил, — его уши дёргаются, и он оборачивается, замечая драку фестрала и солдата из Лесли. — Проклятье, — офицер бежит к ним, пока фестрал наносит удар за ударом по лежащему под ним жеребцу. — Остановись! Немедленно прекрати! — фестрал же, не обращая ни малейшего внимания на команды офицера, лишь орал, впечатывая копыта в лицо противника. — Моя богиня – не дешевая шлюха, ублюдок!\n\nОфицер уже собирается их разнимать, но всё замирает, когда над лагерем разносится оглушительный крик: «СТОЯЯЯЯЯЯЯЯЯЯЯЯТЬ!»\n\nКартофелина, летящая со скоростью пушечного ядра, врезается точно в голову фестрала, сбивая его с избитого солдата. Бывшая фермерша стоит с гордым видом, а затем озадаченно оглядывается, когда все взгляды устремились к ней. — Что? В этот раз я крикнула. Надо ещё громче?"
 shatteredhoof_ncr.4.a:0 "Слаживание новобранцев затянется..."
 
 shatteredhoof_ncr.5.t:0 "Демобилизация экономики"
 shatteredhoof_ncr.5.d:0 "Теперь, когда насущные проблемы решены и республика более-менее стабильна, мы можем заняться восстановлением гражданского сектора. Милитаристы в правительстве обеспокоены тем, что это может привести к краху государства, но президент Гаудина заявила, что их опасения – не более чем параноидальные фантазии. Она напомнила им, что долг правительства – служить народу, а не армии. Граждане приветствуют эти изменения: качество жизни растет, владельцы бизнеса предвкушают прибыль, а смены заводских рабочих становятся короче и легче."
 shatteredhoof_ncr.5.a:0 "Долгожданное возвращение к миру."
 
 shatteredhoof_ncr.6.t:0 "Первые выборы в Новой Кантерлотской Республике"
 shatteredhoof_ncr.6.d:0 "Улицы Лесли полны празднующих гуляк, поскольку в городе официально объявили результаты голосования. Гаудина Грознопёрая и Объединённая Республиканская Партия выиграли на всех участках в стране, гарантировав ей пост президента и зелёный свет для будущих реформ. В здании ратуши губернатор Рок Солид нервно ходит из угла в угол, пока Джованни молча наблюдает за ним, потягивая свой напиток. Рок раздражённо качает головой. — Поверить в это не могу! «Свободные и честные выборы», чтоб их! Какой вообще смысл в выборах, если можно выбрать только одного кандидата и одну партию? — он мрачно кривится. — Я подал все бумаги в первый же день, как только открылась регистрация. Но нет, их «не успели оформить вовремя», так что в бюллетенях меня просто не оказалось! Ну ещё бы, ведь это могло стать проблемой для нашей «госпожи президента». Интересная такая интерпретация демократии без выборов, — жеребец подходит к окну и смотрит на заполненные ликующими пони улицы. — Да она бы всё равно победила! Но как это выглядит со стороны? Что подумают в Республике и Городе Дружбы? Это же курам на смех, даже в Содружестве над нами посмеются! Это не демократия, а диктатура с правом голоса. Что ж, похоже, у нас у руля новая Луна!\n\nДжованни тихо кивает, провожая Рока взглядом. — Она боится, Рок, — губернатор оборачивается, а грифон продолжает. — И она неправа. Я... я проливал кровь вовсе не для того, чтобы она выделывала такие трюки. Столько наших братьев и сестёр погибло ради этого посмешища? Ты прав, во всём прав. Но Гауда напугана, — он отводит взгляд и понижает тон голоса. — Мы потеряли слишком много верных товарищей в боях с рейдерами и Аметистом. Её собственные птенцы несколько раз едва не погибли, — Джованни замолкает на секунду и качает головой. — Она просто не хочет, чтобы все эти жертвы и кровь оказались напрасными. Дверь в комнату начинает со скрипом открываться, но всё же грифон успевает договорить. — Ей просто нужно побороть свой страх, а мы сделаем так, чтобы подобное больше никогда не повторилось. На следующих выборах. А пока... пока что продолжим сражаться за республику. И на поле боя, и в кабинетах, и на улицах.\n\nВ комнату входит Олив Бранч. — А пернатый-то прав, Рок Солид. Конституция всё ещё даёт нам шанс. Гаудина провернула это только потому, что она популярнее кого бы то ни было, а значит, наша задача – изменить это, — он уважительно кивает Джованни, после чего снова поворачивается к Року. — Гауда ведёт нас к войне. Снова прольётся кровь, и мы обязаны использовать эту возможность, чтобы предложить иной выбор каждой вдове и каждому осиротевшему жеребёнку. Наш путь не будет лёгким, но к следующим выборам мы гарантируем народу альтернативу. Выбор между бесконечной бойней и прочным миром. Армия уважает меня. Жители востока уважают тебя, Рок. А Джованни любят простые солдаты и ветераны. Каждый из нас уже по горло сыт этими боями, — он делает короткую паузу и оглядывает собеседников. — Хватит с нас смертей. Эквусская Партия амнистии принесёт этой земле истинную демократию, мир и справедливость. Вы со мной?\n\nРок Солид долго смотрит в окно, замечая немногочисленных пони, наблюдающих за праздником из окон своих домов. — Эта земля полна бывших крепостных, чьи семьи на их глазах угоняли на войну. Другие смотрели, как рейдеры убивали их детей. Лесли потерял больше, чем способен вынести. Я в деле, Олив, — после минуты тяжёлого молчания под пристальными взглядами товарищей Джованни наконец медленно кивает. Он смотрит на свои когти и закрывает глаза – ему снова слабо чудится запах пороха и отголоски далёких выстрелов. Открыв глаза, он твёрдо произносит. — Хватит крови. Я в деле."
 shatteredhoof_ncr.6.a:0 "Да здравствует президент Гаудина!"

shatteredhoof_ncr.6001.t: "Демократия"
shatteredhoof_ncr.6001.d: "— Так и знала, что снова найду тебя здесь, — Регина входит в актовый зал, который когда-то использовался для торжественных речей и награждений, а теперь был переоборудован под театр. Сидящий на сцене Джованни поднимает глаза на вошедшую грифину и слабо улыбается. — А я знал, что ты меня здесь найдёшь, поэтому и ждал, — она слегка усмехается, поднимаясь на сцену и садясь рядом с ним. — Звучит как дешёвый подкат, Джио, — грифон улыбается чуть шире, но затем отводит взгляд и тихо вздыхает. — Завтра будет важное выступление. Генерал Олив Бранч и губернатор Рок Солид основывают партию. Партию за мир.\n\nРегина широко улыбается. — Оппозиционная партия? Это же потрясающе! То есть я и сама разделяю идеи пацифизма, но, честно говоря, то, что мы провели выборы вообще без оппозиции... Ну, мы с мамой знатно поссорились из-за этого, — Джованни мягко кивает. — Я не виню её. Она боится, что все принесённые жертвы окажутся напрасными. Я... думаю, я понимаю её. Ей есть что терять. Например, тебя, — он откашливается. — Но, эм-м, мои соратники хотят, чтобы я тоже был там, на сцене. Они считают, что мой статус... ну, героя войны, поможет поднять их популярность. Оказывается, среди простых солдат, особенно молодых, у меня куча... фанатов, полагаю. Они хотят, чтобы я вышел на сцену со своими медалями. Чтобы я был их героем, их... пешкой. Рыцарем в сверкающих орденах. Но каждый раз, когда я думаю об этом, меня буквально тошнит. Я сразу вспоминаю Корону. Вспоминаю... ту пони.\n\nРегина на минуту замолкает, внимательно глядя на него. — Сделай это, Джио. Республике нужна сильная оппозиция. Олив Бранч и Рок Солид не справятся без тебя. Нам необходим голос мира, а ты лучше кого бы то ни было знаешь, как сильно этот мир сейчас нужен. И... — она тихо вздыхает и улыбается. — Это то, чего хотела бы она, Джио. По всей пустоши живёт множество подобных ей. И если никто не выскажется в их защиту, они станут следующими жертвами. Я знаю, что это будет больно и тяжело, но им нужен заступник. Им нужен их герой, — он снова смотрит ей в глаза. Проходит долгая минута, и грифон наконец улыбается. — Спасибо тебе."
shatteredhoof_ncr.6001.a: "Республике нужны герои."
 
 shatteredhoof_ncr.7.t:0 "Основание Эквусской Партии Амнистии!"
 shatteredhoof_ncr.7.d:0 "Джованни стоит на сцене, вглядываясь в многотысячную толпу пони, заполнившую центральную площадь Нового Кантерлота. Он вспоминает, как был здесь в прошлый раз, получая свою медаль – ту самую, которую сегодня по просьбе Олива Бранча ему пришлось достать из постыдного тайника, чтобы с гордостью прикрепить на грудь. Медаль тускло поблёскивает в лучах заходящего солнца. Грифон смотрит на толпу: пони перешёптываются, с уважением глядя на него снизу вверх. Стоящий рядом губернатор Рок Солид слегка подталкивает его в бок. Джованни оборачивается, и Рок ободряюще кивает ему. Грифон выпрямляется, гордо расправляя перья.\n\nТолпа мгновенно затихает, когда на сцену к микрофону выходит генерал Олив Бранч. — Спасибо каждому из вас, дорогие сограждане, что пришли выслушать нас. Спасибо каждому бойцу наших доблестных вооружённых сил, политику и избирателю. Друзья мои, сегодня творится история. Наши первые выборы были окружены спорами – начиная с решения провести их до того, как будут созданы другие партии. Многие скажут, что голосование, в котором есть лишь один кандидат – это вовсе не выбор, и всё же наша республика по-прежнему олицетворяет собой нечто великое в этом мире. Но ни одна демократия не способна выжить при однопартийной системе. Именно поэтому сегодня я рад объявить о создании Эквусской Партии Амнистии, что выступает за мир, процветание и справедливость! Как видите, я уже пользуюсь поддержкой Рока Солида, губернатора Лесли, и Джованни Гайсая, прославленного героя битвы за Корону. Мистер Джованни на собственной шкуре познал все ужасы войны, несущей лишь смерть и разрушение. Губернатор Рок Солид своими глазами видел её долгосрочные последствия: вдов, сирот и голодающих ветеранов. И сегодня я говорю всему этому «хватит»!\n\nДжованни едва сдерживается, изо всех сил стараясь не отвести взгляд, но гордо стоит на сцене, кивая при упоминании своего имени. А Олив тем временем продолжает. — Объединённая Республиканская Партия – это партия войны, крови и смерти! Президент Гаудина ведёт наших честных пони прямиком в могилу! Мы тратим тысячи крышек на патроны и снаряды, пока наши жеребята не умеют читать, а граждане вкалывают от рассвета до заката, чтобы наскрести на следующий завтрак! Это совершеннейший позор! Мы не нанимались в жандармы всей пустоши, и не нам решать, кому жить, а кому умереть, пока мы плюём на собственных граждан! — толпа разражается оглушительными криками одобрения. Дождавшись, пока овации утихнут, генерал продолжает. — Наша республика уже перешла всяческие границы. Когда мы маршем вошли в Лесли и разгромили Освободительную армию Аметиста, то убили сотни пони, которые всего лишь защищали свой родной дом! Мы отдавали свои жизни, чтобы забирать чужие, и всё ради того, чтобы ублажить империалистические амбиции нашего президента! Как скоро это повторится снова? Сколько ещё пройдёт времени, прежде чем ваш супруг, жеребёнок или родители погибнут на каком-нибудь далёком чужом поле только ради обогащения нашей «госпожи президента»? Сколько жертв нужно, чтобы насытить жадность Гаудины? Я не знаю, но совершенно не хочу проверять на практике!\n\nТолпа ревёт от восторга. Джованни широко улыбается и выпрямляется, встречаясь взглядом с десятками пони в толпе. Его триумф прерывает лишь тихий, растерянный шёпот Рока Солида прямо над ухом: «Он вообще соображает, что несёт?»"
 shatteredhoof_ncr.7.a:0 "Добро пожаловать в демократию."

shatteredhoof_ncr.7001.t: "Союз"
shatteredhoof_ncr.7001.d: "Джованни мягко улыбается журналисту, прикрывая глаза от вспышек камер. Где-то вдалеке слышатся крики, но гул толпы полностью их заглушает. Прежде чем к нему успевает подойти очередной репортёр, к грифону подбегает Регина. Она радостно улыбается. — Это было потрясающе! Вот теперь мы настоящая, правильная республика! Ты отлично держался там, на сцене, Джио.\n\nОн смотрит на неё, приглаживая взъерошенные перья, при этом его когти заметно подрагивают. — Я... это было приятно, Регина, действительно приятно. Но в то же время меня буквально тошнило, — он нервно смеётся и улыбается ей. — Знаешь, может, в следующий раз и ты присоединишься к нам, о Героиня Чистых? — та улыбается в ответ. — Я бы с радостью, но мама меня убьёт, если я во что-нибудь ввяжусь.\n\n— Это преувеличение, — раздаётся сзади Регины голос. Она отходит в сторону, уступая дорогу приближающейся Гаудине Грознопёрой. Пожилая грифина пристально смотрит Джованни в глаза. — Вижу, ты общаешься с моей дочерью, Джованни Гайсай.\n\nОн смотрит на неё, затем на Регину, и вновь переводит взгляд на президента. Грифон выпрямляется. — Д-да, госпожа президент. Мы дружим, — Гаудина слегка усмехается. — Хорошо, друзья ей нужны. Джованни... Ты ведь был в отряде Кайзеркреста? В Короне? — он тихо кивает, после чего она продолжает. — Я уважаю то, что ты там сделал. Помню, как видела тебя в своём кабинете – ты выглядел так, словно от любого дуновения ветерка упадёшь. Удачи на следующих выборах, птенчик.\n\nОн смотрит в глаза старой грифины и мягко улыбается, отвечая на её лёгкий кивок своим. Прежде чем он успевает сказать что-то ещё, к ним подходит губернатор Рок Солид. — Джованни, у нас проблема. Мне нужно, чтобы ты пошёл со мной прямо сейчас, нам нужно поговорить с Оливом, — он переводит взгляд на Гаудину, которая смотрит прямо на него. — Губернатор, — Рок кивает в ответ. — Госпожа президент, — затем снова поворачивается к Джованни. — Пойдём, — пони разворачивается и быстро уходит, а Джованни медленно следует за ним.\n\nГаудина и Регина провожают его взглядом. Старая грифина поворачивается к дочери. — Ну и когда мне ждать внучат-цыплят? — Регина лишь качает головой и уходит. — Д-да ну тебя, мам."
shatteredhoof_ncr.7001.a: "За мир."
 
 shatteredhoof_ncr.8.t:0 "Раскол"
 shatteredhoof_ncr.8.d:0 "— Лесли была ошибкой?! — Джованни сидит в штаб-квартире Эквусской Партии Амнистии, опустив глаза в пол, пока Рок Солид истошно вопит. Рок с силой бьёт копытом по рабочему столу Олива. — Они использовали жеребят в качестве солдат, Олив! Ты слышал, через что прошёл Джованни, неужели ты серьёзно говоришь, что мы должны были оставить их в живых?! — Олив глубоко вздыхает. — Сколько из этих жеребят-солдат мы убили, когда напали на них, Рок? Сколько родителей потеряли своих детей из-за нас? Да, Освободительная Армия Аметиста была злом, но мы могли решить эту проблему как-то иначе. Там были хорошие пони, — Рок кривится, свирепо глядя на Олива. — Так вот что ты имеешь в виду под словом «мир», Олив? Но это не мир, а банальная трусость! И что, ты собираешься просто сидеть сложа копыта, пока Филлидельфия расширяется? Смотреть, как они лупят своих рабов кнутами и убивают тысячи несчастных каждый день? Ты просто боишься замарать копыта в крови!\n\nДжованни смотрит на свои когти. Они кажутся ему грязными. Олив встаёт, встречая тяжёлый взгляд Рока Солида. — А разве это плохо, Рок?! Да, я не хочу марать копыта в крови, но это делает меня не трусом, а здравомыслящим существом! Мы можем помогать пони и освобождать их, однако для этого вовсе не обязательно проливать кровь! Мы можем договариваться и постепенно интегрировать их. Мы так поступили с каменными фермерами, рыбаками и Манго, не пролив ни капли крови! Как может высоконравственная республика заниматься завоеваниями? Это больше походит на достойный рейдера поступок, — Рок снова бьёт копытом по столу, а затем разворачивается и уходит прочь, качая головой. — Рейдера?! Ты смеешь сравнивать нас с ними?! Мы идём на войну не ради добычи или дани, а чтобы освободить пони! Если ты желаешь безучастно стоять в стороне, пока другие умирают, то это никакой не мир! — Олив хмурится. — Уверен, мертвецы по достоинству оценили своё «освобождение», Рок. Когда я говорил о мире, то имел в виду именно его – мир. Война – это зло, которого нужно избегать любой ценой! — Рок резко оборачивается. — Зло? То есть то, что сделал Джованни – это зло, Олив?!\n\nГрифон наконец-то вскакивает и кричит. — Заткнитесь! — оба жеребца мгновенно умолкают и оборачиваются к нему. Перья Джованни встают дыбом. — Х-хватит произносить моё имя так, будто меня здесь нет! Хватит относиться ко мне как к какой-то пешке! И хватит притворяться, будто я с вами согласен! — он тяжело дышит и закрывает глаза, чувствуя призрачный запах крови. — Я убил кобылку. Это был просто рефлекс, я не хотел этого делать! И ради чего? Просто чтобы выжить? Ч-чтобы мы могли защитить какой-то клочок земли? — его начинает трясти, и грифон открывает полные слёз глаза. — Я был неправ! Если бы я мог вернуться назад, то лучше бы застрелился, чем... чем сделал это снова! Как вы думаете, почему я здесь?! — он шмыгает и отворачивается. — Если эта партия сможет спасти хотя бы одну кобылку, возможно, я перестану думать о ней каждую ночь... Я убил её, чтобы спасти себя. Так что я обязан сделать в своей жизни хоть что-то стоящее, — затем он снова поворачивается к Року. — Так что да, я был неправ! И если ты не согласен и считаешь, что я поступил правильно, выстрелив в ту кобылку, то уходи. Живо! Выметайся и забирай с собой всех, кто думает так же! И никогда, никогда больше не возвращайся!\n\nРок смотрит на Джованни, затем на Олива. Спустя минуту он выходит из комнаты, оставляя их одних. Олив медленно выходит из-за стола, подходит к Джованни и слегка подталкивает его в бок. — Я... — Джованни смотрит на него в ответ и слабо кивает. — Давай спасать кобылок, Олив, — тот замирает на секунду, а затем уверенно кивает. — Давай."
 shatteredhoof_ncr.8.a:0 "Война в партии за мир?"
  
 shatteredhoof_ncr.9.t:0 "Основание Патриотической лиги"
 shatteredhoof_ncr.9.d:0 "Маршал Стил Уолл сидит в своём личном кабинете, разглядывая сидящего напротив жеребца – ухмыляющегося пегаса в зеркальных очках. Одетый в изящный костюм пегас заговаривает первым. — Маршал Стил Уолл, рад нашей встрече. Я так счастлив, что вы наконец-то согласились уделить мне время. Я агент Маддид Уотерс, сотрудник ныне расформированной службы разведки Нейварро. Наводя справки, я узнал, что вы представляли интересы поселенцев этой прекрасной нации, когда Гаудина Грознопёрая ещё только намеревалась прийти к власти, верно? И многие из тех поселенцев сейчас служат в вооружённых силах, — Стил Уолл кивает. — Да. Ближе к делу, — агент Уотерс мягко улыбается. — Ну-ну, я не из тех жеребцов, что любят бежать впереди телеги, так что вам придётся набраться терпения. Видите ли, из этого маленького кусочка истории я понял, что вы, маршал Стил Уолл – истинный защитник простого народа. Вы добились представительства для обычных поселенцев, не говоря уже о хорошо оплачиваемой службе в армии, пока Гаудина Грознопёрая вовсю играла в повстанцев в старой тюрьме. Вы, маршал Стил Уолл – жеребец, заслуживающий уважения. И этого уважения у вас предостаточно.\n\nСтил Уолл медленно кивает, а агент Уотерс продолжает. — Видите ли, Гауда не представляет интересы обычных пони. Выборы, которые она провела? Курам на смех. Великий анклав пегасов, конечно, не был идеальной демократией, но даже у нас хватало совести предоставлять как минимум двух кандидатов при любом голосовании. А оппозиционные партии? Генерал Олив Бранч заставил бы нас сидеть сложа копыта и ждать, пока Красный Глаз наденет на всех нас цепи. А губернатор Рок Солид слишком пацифистичен для милитаристов и слишком милитаристичен для пацифистов. Вашей республике нужен спаситель, маршал Стил Уолл, и я считаю, что лучше вас никого не найти, — маршал слегка фыркает. — А с чего бы тебе хотеть помогать нам? Мы ведь завоевали вас, — агент Уотерс улыбается. — Да, вы покорили нас, но тем самым сделали частью вашей страны. И мне бы не хотелось, чтобы моя родина снова рухнула под натиском очередного вторжения. В глубине души я патриот, маршал Стил Уолл, и люблю демократию. Прямо сейчас этой стране нужен кто-то, кто готов защитить её демократию от её основательницы.\n\nСтил Уолл замирает на секунду, а затем медленно кивает. — Хочешь, чтобы я подался в политику? — агент Уотерс тихонько посмеивается и улыбается. — Проницательны как никогда, маршал. Да, я хочу, чтобы вы стали политиком. Могу пообещать, что многие из Анклава поддержат вас, равно как и другие милитаристы. Вам нужно привлечь внимание общественности, чтобы призвать к инвестициям в вооружённые силы и всю связанную с ними промышленность. Вам нужна поддержка простых граждан, ведь рано или поздно настанет день, когда Гаудина решит развеять иллюзию демократии и простому народу понадобится защитник, способный на решительные действия ради блага республики.\n\nОн выдерживает паузу и кивает ещё раз. — Я понял твою мысль. Что ж, Маддид Уотерс, как тебе предложение стать главой моего предвыборного штаба? — пегас довольно ухмыляется. — Звучит просто идеально, будущий президент Стил Уолл."
 shatteredhoof_ncr.9.a:0 "Кто защитит республику?"
 
 shatteredhoof_ncr.10.t:0 "Первая ежегодная конвенция ОРП"
 shatteredhoof_ncr.10.d:0 "Объединённая Республиканская Партия провела свой первый ежегодный съезд. Это мероприятие предназначено для чествования достижений ОРП, а также для обсуждения дел партии и её будущей политики. Сторонники партии и правительственные чиновники, лояльные Гаудине, собрались, чтобы прослушать и обсудить выступления различных партийных деятелей. После длинной вступительной речи от самой Гауды последовала серия выступлений от многих партийных функционеров. Каждый из них, казалось, пытался превзойти предыдущего оратора в плане фанатизма и патриотизма. Такое поведение было бы приемлемо для съезда «Патриотической лиги», но никак не ОРП... Почти до самого конца съезда всё шло без сучка и задоринки.\n\nНеожиданно министр финансов по имени Уотеруоркс поднялся на трибуну вскоре после объявления о закрытии съезда и призвал всех выслушать его слова..."
 shatteredhoof_ncr.10.a:0 "..."
 
 shatteredhoof_ncr.11.t:0 "Речь секретаря Уотеруоркса"
 shatteredhoof_ncr.11.d:0 "— Граждане НКР и участники этого съезда! Сегодня я хочу обсудить с вами то, как функционирует наша великая нация. Наше правительство в его нынешнем состоянии крайне ущербно. Первые выборы также прошли совершенно некорректно, а лидерство страны из копыт вон плохо представляет нас как народ и нацию...\n\n...Наши первые президентские выборы были наглым и совершенно бессмысленным мошенничеством. Это факт. Какой смысл в избирательном процессе, если в бюллетенях был представлен только один кандидат? Ни у кого не было времени даже попытаться оспорить кандидатуру Гаудины. Да и сама она не пылала желанием проводить честные и открытые выборы, а лишь раздавала пустые обещания. На самом деле Гаудина была озабочена тем, чтобы побыстрее покончить со всем этим фарсом и вернуться к единоличной власти, совершенно не заботясь о том, что в стране есть те, кто её не поддерживает. В прошлом она служила наёмницей у безжалостного работорговца. Это служит прекрасным доказательством того, что она стремится лишь к личной славе и власти, а не к улучшению качества жизни народа пустоши. Поэтому я заявляю, что её режим крайне аморален и незаконен...\n\n...Тот факт, что грифина правит нацией, большинство населения которой составляют пони, подрывает репрезентативность правительства НКР и представляет собой прямую угрозу для самой большой демографической группы нашей страны. Крайне важно, чтобы эта грифина покинула свой пост и позволила воплотиться в нашей нации истинному народному представительству. Кресло президента должен занять по-настоящему достойный лидер, а не какая-то там мелкая наёмница с претензиями на власть и богатство. И если она когда-нибудь осмелится баллотироваться на следующий срок, то я объединю тех, кто согласен с моими доводами, и отделюсь от этой нелегитимной партии, чтобы воспрепятствовать сомнительным целям этой чужачки.\n\nПосле этого Уотеруоркс говорил ещё целый час. Он во всеуслышание заявил, что президентство Гаудины незаконно, и если она выставит свою кандидатуру на следующих выборах, ему придётся расколоть партию и создать собственную фракцию – Партию свободных пони. Слова Уотеруоркса действительно раскололи ОРП: одни оскорбляли его и называли предателем, другие же выражали поддержку его храбрым словам и заявляли, что это Гаудина предала идеалы НКР и ей пора в отставку. Хаос разгорелся ещё сильнее, когда на место прибыла военная полиция. Пока неясно, какими будут последствия этого резкого поворота событий. Но теперь мы знаем точно: Гаудина лишилась немалой части поддержки в собственной партии."
 shatteredhoof_ncr.11.a:0 "Что сейчас произошло?"
 
 shatteredhoof_ncr.12.t:0 "Акт о гражданстве одобрен"
 shatteredhoof_ncr.12.d:0 "— Доброе утро, граждане Новой Кантерлотской Республики, с вами говорит ваш президент. Я с гордостью объявляю, что сегодня в истории нашей великой нации была достигнута значительная веха. Слишком долго жители этих земель видели в Эквестрии исключительно государство пони. До Последнего дня Эквестрия считалась домом лишь для земных пони, пегасов и единорогов: даже фестралы были отвергнуты. И даже конец света не помог пустоши усвоить этот урок. Множество держав и наций изменили законы о гражданстве вовсе не ради того, чтобы принять остальных, а чтобы отгородиться от покинувших их пегасов. Все эти постыдные деяния слишком долго пятнали нашу прекрасную республику. Гармония, дружба, демократия – ничто из этого не ограничивается расовыми и видовыми рамками. Перья или шерсть, когти или копыта, полоски или их отсутствие – все мы разумные, мыслящие существа, заслуживающие естественных прав и одинакового обращения.\n\n— Многие готовы принять грифонов в нашей стране, но стремятся отвергнуть других. Многие будут заявлять об опасности, врождённой склонности к преступлениям или глупости чужаков. Многие станут винить их за былые ошибки, проступки и неудачи. Всё это – предрассудки, которые мы как нация должны... нет, обязаны преодолеть. Вчера вечером на заседании Сената был практически единогласно принят «Акт о гражданстве», одним решительным шагом предоставивший полноценное гражданство каждому существу в нашем прекрасном государстве. Неважно, откуда вы родом: мы не совершим ошибок прошлого и примем вас. Как я уже сказала, каждое существо заслуживает равных прав, и мы не посмеем закрыть границы или преградить путь в залы власти ни перед одним свободолюбивым жителем.\n\n— Селестия и Луна, при всех своих достоинствах, были далеко не безгрешны. Когда грифоны из имперской колонии изгнали яков с их родных земель, Эквестрия не распахнула свои объятия, а позволила якам самим искать себе новое пристанище. Когда мы потеснили бизонов, то не приняли их как важных граждан, а превратили во врагов. Когда чейнджлинги бежали после проигранных безумной королевой Кризалис объединительных войн, Эквестрия не открыла сердца нуждающимся в любви жужжащим друзьям, а захлопнула перед ними врата. Подобное должно прекратиться раз и навсегда. Будь вы аликорном или адской гончей, чейнджлингом или оленем, пони, зеброй или грифоном – копытным, пернатым или парнокопытным – у нас найдётся место каждому. Каждый сможет найти здесь свой дом. Спасибо за внимание. Да здравствует республика!"
 shatteredhoof_ncr.12.a:0 "Дом для всех и каждого."
 
 shatteredhoof_ncr.13.t:0 "Фельдмаршал Стил Уолл протестует"
 shatteredhoof_ncr.13.d:0 "Губернатор Рок Солид сидит у себя дома, слушая радио и одновременно набрасывая проекты законов и актов для «Объединённой коалиции за мир». Льющаяся из динамика музыка сменяется речью, произнесённой до боли знакомым голосом маршала Стил Уолла. — ...Очевидно, что эти военные реформы, которые пытается провести президент – не более чем её попытка узурпировать власть. Когда создавались вооружённые силы нашей республики, мы присягали защищать конституцию, которую сами же помогали писать! Мы клялись защищать демократические права каждого гражданина в наших границах! Но теперь мы видим, как президент медленно, но верно подтачивает те самые права, которые когда-то помогала учреждать: фиктивные выборы, растрата бюджета без оглядки на граждан... А теперь она хочет урезать армию – наш последний рубеж обороны? Если мы продолжим сидеть сложа копыта и безучастно смотреть, как она забирает всё больше власти, то вскоре превратимся в марионеток, пляшущих под дудку этой грифины!\n\nРок слегка хмурится и переключает волну. Из динамика льётся куда более вкрадчивый голос главы предвыборного штаба Маддид Уотерса. — ...То, о чём говорит маршал Стил Уолл – чистая правда. И, я бы даже сказал, он слишком мягко описывает происходящее. Госпожа президент Гаудина Грознопёрая утверждает, будто предложенные ей военные реформы повысят эффективность армии; она говорит, что, избавившись от влияния военных, мы навсегда обезопасим гражданскую власть. Однако я не могу не заметить, что это самое гражданское правительство сплошь состоит из членов Объединённой Республиканской Партии – за исключением тех немногих, кто перебежал в другие фракции. Наша армия призвана защищать порядочность и демократию в этой стране. Однако госпожа президент Гаудина Грознопёрая требует от нас не просто изолировать армию от политики, она хочет лишить военных самой возможности спасти нашу страну, когда придёт время. И позвольте напомнить всем слушателям о личной роте «Когтей» госпожи президента. Она уже показала, что готова использовать их ради достижения своих целей. Неужели мы готовы наивно довериться бесконтрольному президенту с её собственной частной армией? Я так не думаю.\n\nРок мрачнеет и ещё раз переключает волну, поймав знакомый голос Олив Бранча. — ...Хотя я согласен с тем, что нам необходимо оградить гражданское правительство от влияния армии, дабы не превратиться в настоящую хунту, я всё же обязан выразить протест и поставить под сомнение мотивы этого внезапного решения. В условиях, когда ОРП полностью контролирует нацию, пренебрегая теми, кто не разделяет их точку зрения, невольно задаёшься вопросом: не является ли ослабление военного надзора за правительством лишь способом скрыть грядущие сомнительные решения? Нам нужно прозрачное правительство, сограждане, а Гаудина по доброй воле не пойдёт на подобное.\n\nРок выключает радио и тяжело вздыхает. Похоже, Эквусская Партия Амнистии и Патриотическая Лига выступили единым фронтом против решения Гауды. Теперь ей придётся искать поддержки, и если той не найдётся, то президент, скорее всего, пойдёт на попятную. Рок взял чистый лист бумаги, понимая, что написанное им определит будущее страны. Помедлив минуту, он начал писать послание, в котором..."
 shatteredhoof_ncr.13.a:0 "... осуждал инициативу."
 shatteredhoof_ncr.13.b:0 "... поддерживал законопроект."
 
 shatteredhoof_ncr.14.t:0 "Акт об Анклаве"
 shatteredhoof_ncr.14.d:0 "Гауда вновь сидит в своём кабинете, глядя на лежащий перед ней «Акт об Анклаве» – законопроект, который в случае принятия амнистирует всех бывших членов Анклава. Напротив неё располагаются Стил Уолл и глава его предвыборного штаба Маддид Уотерс, с лица которого не сходит неизменная ухмылка. Гауда отрывает взгляд от документа. — У вас есть пять минут, чтобы убедить меня поддержать этот фарс, — Стил Уолл начинает весьма уверенно. — Анклав не щадил нас во время боёв, но и мы не проявляли к ним жалости. Их офицеры и учёные лишь выполняли приказы порочного государства, но это не значит, что они сами были злом – злом была система, которой они служили. В наших тюрьмах сейчас томятся блестящие умы, способные привести нас к победе над Филлидельфией, а также раскрыть секреты энергетического оружия и силовой брони. С Анклавом на нашей стороне мы гарантируем, что никто – ни Красный Глаз, ни Стальные Рейнджеры, ни иная сила из другого уголка пустоши – не посмеет нам противостоять.\n\nГауда качает головой. — Просто смехотворно. Разумеется, на самом деле вы хотите усилить армию. Вы держите меня за слепую? Сидите тут в компании какого-то пиджака и вещаете, будто я должна дать вам ещё больше власти. По-вашему, я полная идиотка? Я прекрасно вижу, что это неприкрытая попытка узурпации. Вашу партию поддерживают пегасы, её поддерживает армия, так почему бы, Маар возьми, не выпустить на волю толпу военных преступников-пегасов, которые тут же хлынут в ваши гарнизоны? Стил, мне что, своими когтями поспособствовать будущему военному перевороту? — жеребец хмурится. — Я верен этой республике, Гауда. И желаю ей только блага, а вот вы повсюду видите заговоры. Объединённая коалиция за мир тоже поддерживает этот акт, даже Эквусская Партия Амнистии частично выступает «за». Сама нация просит вас отпустить их. Если бы вы только не сфальсифицировали прошлые выборы, этот вопрос решился бы по воле простого народа, — президент мрачнеет. — В моей республике не будет разгуливать на свободе банда преступников! Посмотрите, что они творили, пока служили Анклаву.\n\nМаддид Уотерс откашливается и улыбается. — Прошу прощения, госпожа президент Гаудина Грознопёрая, но боюсь, здесь есть спорный момент. Чистая правда, что эти офицеры и исследователи совершали ужасные вещи под командованием Совета, это неоспоримый факт. Но, если мне не изменяет память, разве не вы, госпожа президент Гаудина Грознопёрая, годами трудились на благо рейдеров Разбитого Копыта в качестве их карателя? — Гауда злится ещё сильнее и открывает клюв, чтобы заткнуть наглеца, но тот жестом останавливает её. — Ни в коем случае не хочу бросить тень на ваш характер, вы – непоколебимый оплот ценностей нашей нации. И всё же в глазах рядового пони столь суровое наказание этих пегасов с вашей стороны может выглядеть как откровенное лицемерие. Могу лишь представить, какие шепотки поползут среди других оппозиционных партий, узнай они о происходящем в этих стенах. Разумеется, не мне принимать столь важные решения, но вы, госпожа президент Гаудина Грознопёрая – мать нашей республики. И вам нужно беречь свою репутацию."
 shatteredhoof_ncr.14.a:0 "Законопроект проваливается."
 shatteredhoof_ncr.14.b:0 "Законопроект одобрен."
 
 shatteredhoof_ncr.15.t:0 "Контакт с Фарсайтом"
 shatteredhoof_ncr.15.d:0 "К западу от Нового Кантерлота лежит регион Эпплуза. Довоенный город, ныне известный как Старая Эпплуза, вот уже долгое время является центром южной работорговли: охотники за живым товаром рыщут по всему югу Эквестрии, хватают несчастных пони и отправляют их на север, в Филлидельфию. Единственной реальной оппозицией работорговцам являются сторонники идей «Микси» – фракция, которая просто хочет сделать рабство более мягким и не связываться с Красным Глазом на севере. Если работорговцы останутся у власти, Красный Глаз, скорее всего, возьмёт их под защиту, а если верх одержат приверженцы «Микси», то они наверняка смогут оказать нам достойное сопротивление.\n\nОднако среди пустынь Эпплузы действуют эпплузские рейнджеры – группа выживальщиков и отлично обученных бойцов спецназа под командованием Фарсайта, которые разделяют идеалы свободы нашей республики. Они при каждом удобном случае выступали против рабства. Но, несмотря на всё своё сопротивление, они не в силах изменить Старую Эпплузу в одиночку. И вот недавно отряд рейнджеров прибыл в Новый Кантерлот с предложением заключить сделку.\n\nРейнджеры планируют поднять восстание в Старой Эпплузе, что позволит Новому Кантерлоту вмешаться и поддержать их, значительно облегчив покорение региона. Единственная загвоздка в том, что рейнджеры требуют автономии: пускай они и готовы поддержать Республику, но действовать всё равно желают самостоятельно. Если мы примем их предложение, завоевание станет проще, но если мы когда-нибудь захотим интегрировать сельскохозяйственные земли Старой Эпплузы, у нас уйдёт на это гораздо больше времени и сил. Однако многие в нашей стране поддерживают рейнджеров, и если мы укажем им на дверь, это вызовет внутренние протесты."
 shatteredhoof_ncr.15.a:0 "Помочь рейнджерам."
 shatteredhoof_ncr.15.b:0 "Указать рейнджерам на дверь."
 
 shatteredhoof_ncr.17.t:0 "Результаты переписи в НКР"
 shatteredhoof_ncr.17.d:0 "Наши переписчики усердно работали, заходя в каждую дверь во всех городах НКР, чтобы учесть каждого жителя республики. Полученные сведения по мере поступления обрабатываются региональными отделениями бюро по переписи населения, созданного специально для решения этой задачи. Мы обязаны собрать информацию по каждому поселению, вне зависимости от его размера, дабы узнать точную численность проживающих в стране граждан. Перепись ещё продолжается, но мы уже сделали удивительное открытие относительно земель вокруг Нового Кантерлота. Оказалось, что там скрывается внушительное..."
 shatteredhoof_ncr.17.a:0 "...количество граждан призывного возраста, не зарегистрированных в качестве призывников."
 shatteredhoof_ncr.17.b:0 "...сообщество существ без документов."
 
 shatteredhoof_ncr.18.t:0 "Подготовка к проникновению"
 shatteredhoof_ncr.18.d:0 "Мы никогда не видели более мощного щита, чем тот, что защищает центр управления ПОП. Ни одно оружие не способно пробить его, ни одно заклинание не может его обойти, и даже наши величайшие умы понятия не имели, как преодолеть эту преграду. До сегодняшнего дня.\n\nКоманда, которой было поручено проникнуть в неприступную крепость, разработала план, способный, по их мнению, увенчаться успехом. Они хотят взять за основу заклинания обхода, которые раньше считались слишком слабыми, и превратить их в полноценное мегазаклинание. Этого, как уверяют специалисты, хватит, чтобы позволить небольшой группе телепортироваться сквозь щит прямо на объект.\n\nСразу после восхода солнца план начинает осуществляться. Команда самых талантливых единорогов НКР занимает свои позиции, пока другие исследователи ещё раз проверяют на наличие ошибок огромную магическую матрицу, выстроенную вокруг щита. Завершив приготовления, единороги приступают к сотворению, пожалуй, сложнейшего заклинания послевоенной эпохи. Весь Нейварро озаряется ярким светом: маги черпают всё больше и больше энергии из двух колоссальных реакторов. Один из них изначально находился на базе, а второй был снят с «Хищника» – облачного корабля Анклава. По мере сплетения потоков магии свет разгорается всё сильнее. Члены экспедиции замирают в ожидании броска за щит. Вся колоссальная энергия мегазаклинания высвобождается в ослепительной вспышке, и... "
 shatteredhoof_ncr.18.a:0 "ВПЕРЁД!"
 
 shatteredhoof_ncr.1811.t:0 "В чреве зверя"
 shatteredhoof_ncr.1811.d:0 "Команда оказывается в самом сердце комплекса, в окружении многочисленных терминалов и самой современной электронной аппаратуры конца войны. Исследователи поражены сложностью сооружения, в котором очутились: стены усеивают образцы передовых технологий, способные впечатлить даже учёных военного времени. К несчастью, беглый осмотр не выявляет очевидного способа отключить защитный барьер.\n\nПо мере дальнейшего изучения комнаты учёные сталкиваются с новой проблемой: похоже, большая часть комплекса заблокирована, а гермодвери намертво закрыты. Хоть они и находятся в главном центре управления, у группы нет никакой реальной возможности взять под контроль объект. Выхода из помещения нет, а рации наотрез отказались работать сразу после пересечения щита – так что связаться с внешним миром сейчас тоже невозможно. Весьма вероятно, что учёные угодили в смертельную ловушку, которая рискует стать их братской могилой.\n\nПостепенно осознавая всю тяжесть своего положения, члены экспедиции поддаются панике. Побег невозможен, миссия провалена, а значит, их жертва окажется напрасной... Но внезапно прямо перед ними вспыхивает один из мониторов."
 shatteredhoof_ncr.1811.a:0 "..."
 
 shatteredhoof_ncr.1812.t:0 "Спящая богиня пробуждается"
 shatteredhoof_ncr.1812.d:0 "— Здравствуйте, мои маленькие пони.\n\nНа мониторе возникла фигура, будто сошедшая со страниц старинных книг. Учёные увидели грациозный силуэт давно почившей принцессы Селестии, чья цифровая грива развевалась на виртуальном ветру. Реакция участников экспедиции варьировалась от полного оцепенения до жгучего любопытства. Однако даже столь внезапный поворот событий не заставил их забыть о том, что они всё ещё заперты в этом комплексе.\n\n— Могу я узнать, кто возглавляет вашу группу? — осведомилось изображение. Глава экспедиции вышел вперёд и заговорил: — Я. Ты – компьютер, управляющий этим объектом?\n\nПризрачный силуэт на мгновение усмехнулся. — Нет, я не компьютер. Хотя именно я контролирую этот комплекс. Могу я узнать твоё имя?\n\nГлава экспедиции на секунду заколебался, но всё же ответил: — Меня зовут Нью Рок. А тебя?\n\n— Я, мои дорогие маленькие пони – Селестия. И я должна извиниться за своё негостеприимство. Боюсь, я была не самой радушной хозяйкой.\n\nУчёные обменялись быстрыми, встревоженными взглядами, после чего Нью Рок заговорил снова: — Селестия мертва. Так что ты либо самозванка, либо обезумевший ИИ. Но это неважно. Меня заботит лишь то, как вытащить мою команду из этой западни.\n\nИзображение на миг помрачнело. — Я и не собиралась удерживать вас здесь. Теперь путь наружу открыт. Но имейте в виду: боюсь, я не смогу впустить тебя или твою команду обратно, когда вы уйдёте.\n\nСтоило изображению произнести эти слова, как одна из дверей, ведущих из центра управления, с шипением отворилась. Нью Рок быстро восстановил дисциплину и повёл группу к выходу. Все двери на их пути послушно открывались, пока учёные не подошли к проклятому силовому щиту. Завеса замерцала и исчезла, позволяя им выйти наружу. Радостные возгласы научной команды резко оборвались, когда щит за их спинами восстановился вновь."
 shatteredhoof_ncr.1812.a:0 "Командование нам ни за что не поверит."
 
 shatteredhoof_ncr.19.t:0 "Полосатый вопрос"
 shatteredhoof_ncr.19.d:0 "Глифмарк издавна славился как одно из худших мест для жизни во всей пустоши, уступая в звании столицы беспросветной нищеты разве что Хуфингтону да Гаттервиллю. На протяжении всей своей истории зебрам Глифмарка приходилось не только мириться со всеми опасностями жизни близ Кантерлота, но и регулярно страдать от набегов аликорнов и рейдеров из Понивилля. Бесчисленное множество зебр исчезало по ночам или становилось добычей крупных разбойничьих отрядов, увозивших их на юг в Эпплузу или Филлидельфию, чтобы продать в рабство. Зебры этого региона естественным образом прониклись недоверием к пони и любым чужакам в попытке любой ценой защитить своих сородичей.\n\nХотя мы уже очень давно приняли акт о гражданстве, многие граждане до сих пор относятся к зебрам с подозрением или вовсе винят их в развязывании Великой войны. Многие призывают республику не оказывать зебрам Глифмарка никакого содействия или помощи. Более того, среди многих жителей республики преобладает идея возрождение старой политики Эквестрии: «раздельного, но равного» сосуществования с этим народом. Зебрам Глифмарка позволят остаться в своих домах, и от них не будут требовать ничего в пользу республики, но и сама республика не станет оказывать помощь или предлагать защиту. Многие как в республике, так и в самом Глифмарке поддерживают эту идею, полагая, что она поможет сохранить обе общины.\n\nОднако нельзя игнорировать тот факт, что Глифмарк погряз в нищете, и какими бы подозрительными ни были местные жители к чужакам, от предложенной помощи они всё же не откажутся. У республики более чем достаточно ресурсов, чтобы заново отстроить Глифмарк и превратить его в полноценный город. Восстановление обойдётся недёшево, но эти вложения могут щедро окупиться в будущем. Кроме того, пусть сейчас зебры и относятся к республике настороженно, если мы протянем им копыто помощи, они со временем могут ответить нам взаимностью."
 shatteredhoof_ncr.19.a:0 "Старая добрая сегрегация снова в моде." #(add a state modifier to the core states of Glyphmark disallowing them to be cored, gives 5% stability)
 shatteredhoof_ncr.19.b:0 "Мы окажем им помощь." 
 #(Unlocks Legionary special forces, give each state of Glyphmark a myriad of rare resources, give national spirit that gives 20% consumer goods factor for 180 days)
 
 shatteredhoof_ncr.20.t:0 "Проникая в Стойло 32"
 shatteredhoof_ncr.20.d:0 "После нашей победы над силами Стойла 32 местные пони попросту решили отступить в своё убежище и намертво запечатать за собой гермодверь. И этот комплекс оказался крепким орешком. Нашим первым препятствием стала сама дверь, доказавшая, что инженеры «Стойл-Тек» действительно постарались на славу. Нашим командам потребовалось несколько недель и более десятка различных попыток, чтобы найти способ обойти её. Оказалось, что куда проще сделать подкоп, чем пытаться пробиться напролом. Следующим препятствием стали уцелевшие жители, оказавшие нам отчаянное сопротивление. Они возводили баррикады посреди каждого коридора, устраивали ловушки и засады в комнатах и технических помещениях. Многим из наших выживших бойцов, что сражались в тех тесных проходах, до конца жизни будут сниться кошмары об этом жутком месте. Но даже после того, как мы заплатили столь дорогую цену в попытках захватить этот проклятый бункер, мы столкнулись с новой проблемой. Все их терминалы защищены шифрованием военного уровня. До сих пор наши инженеры и программисты не могли похвастаться особыми успехами при взломе, но они не опускают копыта и когти, продолжая попытки."
 shatteredhoof_ncr.20.a:0 "Ясно."
 
 shatteredhoof_ncr.21.t:0 "Наша политика относительно Мейнхеттена"
 shatteredhoof_ncr.21.d:0 "Мейнхеттен некогда был одним из самых крупных и богатых городов Эквестрии, и мы вернём ему былое процветание. Но прежде чем это произойдёт, нам необходимо определить наш подход к Башне Тенпони. Если Мейнхеттен до сих пор исправно сотрудничал с нами, то будет разумно и логично соблюсти взятые на себя обязательства, позволив городу сохранить часть автономии. С другой стороны, если на то будет наша воля, мы всегда можем пересмотреть эти соглашения. Если же лидерство Башни Тенпони до этого противилось любым нашим попыткам установить дружеские отношения, то они сами не оставили нам иного выбора, кроме как применить силу."
 shatteredhoof_ncr.21.a:0 "Они оказались верными союзниками."
 shatteredhoof_ncr.21.b:0 "Теперь они бесполезны для нас."
 shatteredhoof_ncr.21.c:0 "Они знали о последствиях неповиновения."
 
 shatteredhoof_ncr.22.t:0 "НКР желает дальнейшей интеграции"
 shatteredhoof_ncr.22.d:0 "Наши отношения с Новой Кантерлотской Республикой складывались довольно успешно: они оказывали нам всевозможную экономическую и военную помощь, пока мы восстанавливали Мейнхеттен. Теперь же правительство НКР обратилось к нам с предложением перейти на новый уровень сотрудничества. В обмен на отказ от части нашей автономии и подчинение их законодательству Республика обещает расширить инвестиции в город, а также продолжить помогать в преодолении любых кризисов, с которыми мы можем столкнуться. Разумеется, многие наши пони возмущены подобными условиями. Тем не менее, тесные связи с НКР принесут нам немалую выгоду и помогут городу по-настоящему расцвести."
 shatteredhoof_ncr.22.a:0 "Мы принимаем их предложение."
 shatteredhoof_ncr.22.b:0 "Мы вежливо откажемся."
 shatteredhoof_ncr.22.c:0 "Сотрудничество? Мы хотим быть полноценным штатом!"
 
 shatteredhoof_ncr.23.t:0 "Антикризисное управление"
 shatteredhoof_ncr.23.d:0 "Наша нация столкнулась с очередным кризисом. После краха Анклава и его небесных городов десятки, если не сотни тысяч пегасов спустились на наши земли в поисках убежища. Некоторые из них были довольно хорошо вооружены, так что армии пришлось изрядно постараться, дабы утихомирить их, прежде чем они успели бы задуматься о восстании. Однако главная проблема заключается в том, что теперь у нас внезапно возникла острая нехватка продовольствия для бесчисленных новых ртов.\n\nМногие наши фермы и без того работали на износ, но теперь из них высасывают все соки, чтобы прокормить волну спускающихся к нам пегасов. Подобная ситуация создаёт огромную нагрузку на экономику и её сельскохозяйственный сектор, который был совершенно не приспособлен к такому наплыву беженцев. Это привело к резкому и значительному росту цен на продукты по всей стране. Более того, мы уже получаем сообщения о том, что наши собственные граждане начинают голодать. Наши возможности по преодолению этого кризиса ограничены, но если мы не разберёмся с ним в ближайшее время, ситуация станет ещё хуже."
 shatteredhoof_ncr.23.a:0 "Это должно стать нашим главным приоритетом!"
 shatteredhoof_ncr.23.b:0 "Мы окажем помощь в ограниченном масштабе."
 shatteredhoof_ncr.23.c:0 "Нас волнует лишь стабильное функционирование экономики."
 
 shatteredhoof_ncr.24.t:0 "Друзья или враги?"
 shatteredhoof_ncr.24.d:0 "Новая Кантерлотская Республика – далеко не единственное государство, претендующее на статус преемника Эквестрии, и, если рассуждать объективно, далеко не самое легитимное. Стальные Рейнджеры являются прямыми наследниками Министерства военных Технологий – одного из многих ведомств, что были частью эквестрийского правительства военного периода – а также крайне эффективным военизированным формированием тех лет. Они знамениты по всей пустоши своими техническими познаниями, а также использованием силовой брони и тяжёлого вооружения для изъятия опасных технологий ради их «защиты» в своих бункерах. Некоторые капитулы Стальных Рейнджеров совершенно недоговороспособны – к примеру, отделение в Филлидельфии, которое заслужило всеобщую лютую ненависть за то, что истребляет столько же невинных жителей Пустоши, сколько и бойцов Красного Глаза.\n\nОднако на севере в городе Мейнхеттене существует капитул Стальных Рейнджеров с куда более приемлемой репутацией. Мейнхеттенский контингент прославился тем, что сокрушил местных рейдеров и отбросил их за нижнюю реку Мейр, позволив многочисленным городам-государствам Мейнхеттена восстать против бандитского гнёта. Ходят и истории о том, как Стальные Рейнджеры бок о бок с Башней Тенпони разбили Солнечных Ездоков – банду рейдеров, которая когда-то контролировала земли, ныне принадлежащие Безумным Гонщикам и Дождевым Ездокам. Разумеется, как и все остальные капитулы, Мейнхеттен одержим нездоровой страстью к технологиям, из-за чего многие по-прежнему смотрят на них с неприязнью.\n\nИстория Мейнхеттенского контингента во многом напоминает прошлое самой Гауды – группа прекрасно вооружённых солдат свергает бандитскую группировку, подмявшую под себя целую империю. Из-за подобного сходства многие в республике призывают заключить союз с северными рейнджерами. К тому же пони, носящих силовую броню и тяжёлое вооружение, лучше иметь среди союзников, а не врагов. Но итоговое решение остаётся за Гаудой."
 shatteredhoof_ncr.24.a:0 "Отправить предложение о союзе."
 shatteredhoof_ncr.24.b:0 "Мы продолжим путь в одиночку."
 
 shatteredhoof_ncr.25.t:0 "Интересное предложение"
 shatteredhoof_ncr.25.d:0 "«Нация», называющая себя Новой Кантерлотской Республикой, прислала сегодня к нам дипломата с весьма интересным предложением. В обмен на наше сотрудничество с их державой и её армиями они готовы как вложить значительные средства в развитие нашей военной промышленности, так и непосредственно помогать нам в ходе боевых действий. Это выгодное предложение, но в случае согласия нам придётся воевать на стороне НКР в потенциально нежелательных для нас конфликтах. Примем ли мы такое предложение?"
 shatteredhoof_ncr.25.a:0 "Мы согласны!"
 shatteredhoof_ncr.25.b:0 "Нет, мы не согласны!"
 
 shatteredhoof_ncr.26.t:0 "Отказ со стороны рейнджеров"
 shatteredhoof_ncr.26.d:0 "Мейнхеттенские Стальные Рейнджеры ответили отказом на наше щедрое предложение. Хотя это, безусловно, печальный исход, мы всё же не удивлены. Когда придет время, эти рейнджеры будут силой интегрированы в нашу республику, независимо от их мнения по этому вопросу."
 shatteredhoof_ncr.26.a:0 "Жаль."
 
 shatteredhoof_ncr.27.t:0 "Предложение Филлидельфии-Паниса"
 shatteredhoof_ncr.27.d:0 "Теперь с Филлидельфийскими Стальными Рейнджерами покончено, но мы должны решить, что делать с их территорией. Остатки их отделения всё ещё сопротивляются нам, устраивая засады на патрули и укрепляя уцелевшие опорные пункты. Также нельзя не упомянуть о многочисленных местных бандах, досаждающих нашим гарнизонам. Нашим силам приходится непросто, но мы уже получили ряд предложений, которые помогут справиться с этой проблемой.\n\nВо-первых, мы можем попытаться связаться с Мейнхеттенскими Стальными Рейнджерами в надежде на то, что они готовы работать с нами. Мы постараемся убедить их перенести все свои операции на бывшую территорию филлидельфийского капитула, по сути возложив на них контроль над регионом.\n\nВо-вторых, мы могли бы пойти на компромисс с остатками прежнего отделения и помочь им восстановить силы. В таком случае им, конечно, придётся принести присягу нашей Республике, а также отказаться от части своей автономии. Да, вряд ли они станут считать нас друзьями, но это по крайней мере решит проблему контроля над этими землями.\n\nИли же мы можем просто ничего не делать. В конце концов, нам не в первый раз сталкиваться с сопротивлением нашему режиму."
 shatteredhoof_ncr.27.a:0 "Отправьте послание в Мейнхеттен."
 shatteredhoof_ncr.27.b:0 "Мы сами разберёмся с сопротивлением."
 shatteredhoof_ncr.27.c:0 "Свяжитесь с остатками отделения."
 
 shatteredhoof_ncr.28.t:0 "Предательство"
 shatteredhoof_ncr.28.d:0 "Несмотря на наше сотрудничество в прошлом, правительство НКР решило, что мы, вне зависимости от наших желаний, должны немедленно стать частью их республики. Мы срочно готовимся к обороне, так как их вооружённые силы, несомненно, уже совсем скоро выступят против нас."
 shatteredhoof_ncr.28.a:0 "Они пожалеют об этом!"
 
 shatteredhoof_ncr.29.t:0 "Предложение от НКР"
 shatteredhoof_ncr.29.d:0 "До сих пор наши отношения с НКР были достаточно дружественными, поэтому никто не удивился, когда они решили выдвинуть нам ещё одно предложение. Однако оно оказалось весьма и весьма необычным. Наше сестринское отделение в Филлидельфии пало, это нам хорошо известно. Вся их бывшая территория и активы теперь перешли под контроль НКР, которой, по-видимому, весьма непросто управлять всем этим. Они хотят, чтобы мы перенесли все свои операции в южную Филлидельфию, где мы сможем продолжить работу нашего потерпевшего поражение отделения. Конечно, в таком случае нам придётся бросить Брыклинский Крест и прочие активы в Мейнхеттене, которые НКР тут же приберёт к копытам. Согласны ли мы на такое предложение?"
 shatteredhoof_ncr.29.a:0 "Замечательная идея!"
 shatteredhoof_ncr.29.b:0 "Мы не будем в этом участвовать!"
 
 shatteredhoof_ncr.30.t:0 "Последователи Апокалипсиса"
 shatteredhoof_ncr.30.d:0 "Мунталон стоит в кабинете Гауды в Новом Кантерлоте. Иссиня-чёрная грифина выглядит чужеродно среди старинной эквестрийской архитектуры, а её броня резко контрастирует с парадной формой, в которую одета сидящая напротив неё Гауда. Правительница кивает. — Мунталон, мне нужен отчёт о статусе той группы, о которой ты упоминала ранее, — та ещё пару секунд молчит, после чего начинает говорить. — Они называют себя Последователями Апокалипсиса и уже успели довольно прочно обосноваться в нашей стране. Они внедряются в школы и больницы, обеспечивая образование и медицинскую помощь, но есть две проблемы. Во-первых, они, судя по всему, сотрудничают с весьма сомнительными личностями – аликорнами и адскими гончими. Говорят, эти аликорны откололись от Единства, но мы не можем быть уверены, что среди них нет шпионов. Вдобавок к этому они распространяют свои идеи среди тех, кого лечат и учат: всё в духе Эквусской Партии Амнистии. Всеобщий мир и всё такое. Возглавляет их кобыла по имени Вельвет Ремеди.\n\nГауда хмурится, постукивая когтями по столу. — Мааровы пацифисты. У Эквестрии в своё время постоянно были с ними проблемы. Они делают себя полезными для государства, чтобы потом нагло сеять свои антигосударственные идеи. Скорее всего, судя по всему этому бреду о мире, их спонсирует ЭПА, — грифина хмурится ещё сильнее и кивает. — Мы не можем позволить им продолжать в том же духе. Эти засранцы разнесут свою заразу и станут слишком незаменимыми, чтобы от них можно было просто избавиться. Мы должны действовать на опережение и уничтожить их. Постарайся найти любой случай, где их аликорны или адские гончие нарушают закон, добудь доказательства. Ищи на них любую грязь, какую только сможешь. Мы должны остановить их, пока не стало слишком поздно. Нельзя допустить, чтобы Последователи выступили против нас, когда начнутся наши величайшие войны.\n\nМунталон кивает. — Поняла, Гауда, я всё сделаю. Но, гм, если честно, они кажутся довольно безобидными. У них качественные медикаменты, сами они весьма доброжелательны, да и репутация безупречна. Что если мы ничего на них не найдём? — Гауда злобно зыркает на неё. — Значит, сами что-нибудь сделаем. Подбросим нелегальные наркотики в одну из их клиник, устроим провокацию, шантаж – пойдёт всё что угодно. Мунталон, я подчёркиваю всю серьёзность ситуации: они убьют нашу республику. Мы должны нанести удар первыми, — чёрная грифина медлит секунду, а затем отдаёт честь. — Я всё сделаю, Гауда."
 shatteredhoof_ncr.30.a:0 "Любой ценой..."
 
 shatteredhoof_ncr.31.t:0 "Арест Последователей Апокалипсиса"
 shatteredhoof_ncr.31.d:0 "— Добрый вечер, граждане республики. В эфире Общественное радио Нового Кантерлота, готовое сообщать правду, какой бы горькой она ни была. Вчерашним поздним вечером департамент полиции Нового Кантерлота провёл обыск в штаб-квартире Последователей Апокалипсиса, действуя по наводке о нелегальном производстве наркотиков. Возглавлявшая операцию мисс Мунталон заявила репортёрам нашего радио следующее: «Эти алчные преступники маскировались под благодетелей. На публике они пытались делать вид, что безвозмездно помогают всем и каждому. Но на самом деле они покупали сочувствие простых граждан, пока сами безжалостно травили нашу страну.» Глава этой сети по контрабанде запрещённых наркотиков, Вельвет Ремеди, объявлена в розыск для ареста и допроса. Любая информация о её местонахождении принесёт вам награду в сто крыш...\n\n... с прискорбием мы вынуждены наблюдать за сегодняшними событиями. В кои-то веки моя Эквусская Партия Амнистии выступает бок о бок с «Объединённой коалицией за мир» в осуждении этого незаконного рейда на Последователей Апокалипсиса. Многие в наших общинах по-прежнему лишены доступа к образованию и медицине. Немало пони умирают от болезней, которые можно легко предотвратить, а часть жеребят даже не умеет читать – и всё из-за политики Объединённой Республиканской Партии. Последователи спасли тысячи от болезней и нищеты, а Вельвет Ремеди подавала нам пример. Я, генерал Олив Бранч, совместно с губернатором Рок Солидом, призываю к официальному расследованию рейда на штаб-квартиру Последователей. Я считаю, что это не совпадение, что наш президент нацелился именно на эту организацию, ведь они распространяли идеалы мира...\n\n...Стил Уолл, боюсь, всё ещё переваривает события, произошедшие с Последователями Апокалипсиса. Многие из солдат прислали письма с вопросами об этом, прося его поговорить с госпожой президентом Гаудиной Грознопёрой об амнистии для Последователей, независимо от того, что они совершили. Хотя Последователи и были пацифистами, их медикаменты и врачи спасли жизни множества солдат и членов их семей. Мы можем не соглашаться с политическими взглядами Последователей, но Патриотическая Лига благодарит мисс Вельвет Ремеди и каждого члена организации за их службу этой стране. То, что произошло здесь сегодня – это наглое попрание правосудия, и я не сомневаюсь, что Патриотическая Лига сделает всё, что в наших силах, чтобы добиться справедливости для мисс Вельвет Ремеди. Теперь, если у вас есть вопросы, пож..."
 shatteredhoof_ncr.31.a:0 "Теперь они нам не помешают."
 
 shatteredhoof_ncr.33.t:0 "НКР требует интеграции"
 shatteredhoof_ncr.33.d:0 "Новая Кантерлотская Республика выдвинула нам ультиматум: либо мы подчиняемся их требованиям и входим в их состав как полноправный штат, либо они попытаются навязать свою волю силой. Это вызвало возмущение и беспорядки по всей нашей стране, и многие призывают нас не принимать условия ультиматума, независимо от того, насколько безнадёжной может быть война против такого мощного государства. Но действительно ли судьба стать одним из штатов НКР так уж плоха?"
 shatteredhoof_ncr.33.a:0 "Нам лучше стать штатом НКР."
 shatteredhoof_ncr.33.b:0 "Мы будем бороться за нашу свободу!"
 
 shatteredhoof_ncr.32.t:0 "Добровольцы с пустошей"
 shatteredhoof_ncr.32.d:0 "Гаудина Грознопёрая стоит, возвышаясь над толпой, собравшейся со всех концов пустошей. Множество полных надежды глаз смотрят на неё снизу вверх. Грифина удивлённо, но радостно спрашивает. — Как вам всем это удалось? — стоящий позади неё Бладай, которого сопровождают Голдбик и Мунталон, ухмыляется ещё шире. — О, у меня остались старые контакты на севере, в Ржавом Остове, со времён охоты на ублюдков из Дождевых Ездоков. Морячки были только рады подзаработать, — Голдбик мягко улыбается, гордо выпрямившись. — Ты же знаешь, насколько убедительным я умею быть. Мне не составило труда слетать в земли Рад-Рыбаков и Каменных Фермеров, и кое-кто из них решил последовать за мной, — Мунталон же кратко отвечает. — У меня свои методы, — Бладай тоже улыбается. — И мы подумали, что будет правильно сделать подарок нашему новому боссу... то есть президенту.\n\nГауда смотрит на них с ещё более широкой ухмылкой, а затем громко обращается к собравшимся внизу. — Пони и прочие жители пустошей! Добро пожаловать в гостеприимную землю свободы. Уверена, многие уже пообщались с моими грифонами, так что вы знаете наши предложения и желания. Гармония, дружба и свобода по всей пустоши – и мы не остановимся, пока каждый не станет свободным. Я знаю, что многие из вас горят от нетерпения, готовы схватить винтовки и отправиться на передовую хоть сейчас, но я бы хотела на секунду напомнить вам кое о чём.\n\nОна наклоняется вперёд, окидывая каждого добровольца своим орлиным взором. — Этой республике нужно нечто большее, чем просто жадные до крови солдаты. Поверьте, у нас их и так хватает. Когда придёт время сложить оружие, я предложу вам дома и демократию, работу и место, где вы сможете быть счастливы. Вам не обязательно сражаться на фронте ради будущего. Если хотите, можете сделать шаг в сторону прямо сейчас, и республика с радостью примет вас. Это ваш шанс на любую судьбу.\n\nВнизу никто даже не двигается с места. Вместо этого все как один вскидывают копыта и отдают честь. Гауда улыбается ещё радостнее. — Добро пожаловать на борт, борцы за свободу."
 shatteredhoof_ncr.32.a:0 "Мы никогда не откажемся от предложенной помощи."
 
 shatteredhoof_ncr.34.t:0 "В защиту демократии"
 shatteredhoof_ncr.34.d:0 "Кровь пятнает белые одеяния, пока он, хромая, бредёт по красному песку. Вокруг лежат тела верных; их робы отмечены багровыми пятнами, а взоры устремлены в небеса, пока губы шепчут последние молитвы. Он останавливается перед хрупкой фигурой жеребёнка, который зажимает рану на груди, с каждой секундой дыша всё слабее. Опустившись на колени, он кладёт копыто на лоб малыша. — Не бойся, сын мой. Ты сражался достаточно для одной жизни. Селестия ждёт тебя, и ты будешь принят в Её объятия. Иди с миром, солдат Её Воли, — паника в глазах жеребёнка сменяется смирением, а затем они стекленеют.\n\nРядом раздаётся звук шагов подошедшего солдата. — Отче, мы похороним их позже, — священник смотрит на жеребёнка и тихо спрашивает. — Сколько ему было? — солдат опускает взгляд. — Достаточно. Наш командир убит. Вы следующий по старшинству офицер, отче, — он медленно встаёт, отводит взгляд от тела и осматривается. Среди мертвецов видны и сдавшиеся в плен: грязные рейдеры, рабы и несколько грифонов, бросивших оружие. Жеребец тихо читает молитву. — Не уходите смиренно во тьму, ибо верные свету должны сражаться. Да благословит Она павших и дарует нам удачу, — он делает краткую паузу и качает головой. — Свяжите солдат тьмы, ибо мы даруем им милосердие, которого они нам никогда бы не выказали.\n\nПока священник говорит, к нему подбегает запыхавшаяся кобыла. — Сэр! Сэр! — она останавливается, тяжело дыша. — Отче, враг идёт на новый штурм! Нам нужно возвращаться в окопы, они будут здесь с минуты на минуту! — он смотрит на неё, а затем переводит взгляд на пленных. — И они присоединятся к своим порочным собратьям, как только те явятся, — в его глазах разгорается яростный огонь; он выхватывает пистолет и пускает пулю прямо между глаз плачущему рабу.\n\nТело бедняги валится на землю, пока собравшиеся верные смотрят на священника в ожидании указаний. И он кричит изо всех сил, перекрывая испуганные вопли сдавшихся. — Убивайте всех! Селестия узнает своих!"
 shatteredhoof_ncr.34.a:0 "Мы ещё можем победить!"
 
 shatteredhoof_ncr.35.t:0 "Сражаясь с тьмой"
 shatteredhoof_ncr.35.d:0 "— Тьма всегда гуще всего перед приходом света, — произносит старый жеребец с кафедры, оглядывая ряды собравшихся верующих. На его плечах лежит белый плащ с золотой каймой. — В Каледонии, откуда я родом, на мой городок Тимбер напало великое зло, закованное в сталь. Пожары пожирали нас, и в этом пламени гибли даже истово верующие. Невинные и грешники горели одинаково, но мне удалось вырваться из бушующего инферно. Там, среди песков, я устремил взор к облакам и прошептал последнюю молитву Селестии. Когда же я опустил глаза, снизошло спасение – видение Селестии удостоило милости спасти меня, недостойного, — он продолжает говорить, но уже тише. — Но даже в Тимбере нашими врагами всё-таки были пони, чего нельзя сказать о том, что идёт на нас теперь. Селестия всегда несла весть о мире, и Её имя полно благодати. Однако это не мир, когда свет уступает место тьме, братья и сёстры мои во вере. Это не мир, если мы будем безучастно стоять в стороне, пока Красный Глаз, слуга греховных обычаев зебр, замышляет наше полное истребление.\n\nМногие члены общины выпрямляются и настораживаются, в их глазах читается удивление, но священник продолжает в прежнем духе. — Когда я шёл из Каледонии сюда, многих из моего каравана перебили. Они отправились к Селестии на небеса, а выживших схватили работорговцы. И всё же я выжил по Её милости. Когда я прибыл в Разбитое Копыто, то рейдер уже держал меня на прицеле. Но потом «Коготь» застрелил его, и так милость Селестии вновь спасла меня. Годами я задавался вопросом: почему именно я – ведь я не лучший оратор и не чист сердцем – остался жив, когда другие погибли? Неужели лишь для того, чтобы проповедовать Её слово? Я молился об ответе, который смыл бы мою вину, но Она не отвечает столь простыми способами. Верующие, видение Селестии предвещает мир, но для тьмы у Неё нет пощады. Все мы – сосуды Её воли, и поэтому мы тоже преисполнимся беспощадности.\n\nСвященник медленно спускается с кафедры и идёт между рядами прихожан. — Сегодня я иду на призывной пункт, ибо Она открыла мне моё предназначение. Я сражусь с тьмой, чтобы Её Свет восторжествовал. Селестия не станет марать Свои копыта, и посему я буду вершить возмездие от Её имени, дабы сокрушить Её врагов и изгнать тьму из Её света. Оставайтесь дома, если желаете, и Она рассудит вас, когда вы отойдёте в мир иной. Или идите со мной, и пусть винтовки станут Её словом, пули – Её голосом, а окопы – Её домом, — священник выходит из церкви, и его белые одежды развеваются на ветру. А за ним, вняв призыву веры, следуют прихожане с яростным огнём в глазах."
 shatteredhoof_ncr.35.a:0 "Сейчас или никогда!"
 
 shatteredhoof_ncr.36.t:0 "Новая столица"
 shatteredhoof_ncr.36.d:0 "После объединения «Альянса Разбитого Копыта» в Новую Кантерлотскую Республику многое изменилось...\nНо одна вещь осталась неизменной. Правительства, которые хотят поддерживать хотя бы видимость функционирующего управления страной, нуждаются в массах бюрократов. Многие низкоуровневые чиновники остались на своих прежних постах, но вот самым талантливым и полезным настоятельно порекомендовали переехать со своими семьями в нашу новую столицу.\nДля облегчения процесса была создана государственная программа. С её помощью каждое существо, желающее переехать в Новый Кантерлот в течение ближайших шести месяцев, может сделать это за счёт правительства. Мы считаем, что такое предложение, несомненно, привлечёт многих жителей пустоши.\nМы надеемся, что централизация нашей бюрократии поможет всем новым штатам стать неотъемлемой частью НКР и даже разжечь немного старого доброго патриотизма среди тех, кто лично увидит славу нашей столицы."
 shatteredhoof_ncr.36.a:0 "Чудесно."
 
 shatteredhoof_ncr.37.t:0 "Трущобы Нового Кантерлота"
 shatteredhoof_ncr.37.d:0 "«НАМ ОБЕЩАЛИ СВОБОДУ».\n\nВот что мне сказали сегодня утром беглые рабы из Старой Эпплузы. Хотя может показаться, что улицы Нового Кантерлота вымощены золотом и полнятся роскошью, при ближайшем рассмотрении внимательному взору открывается город, охваченный кризисом. Вдали от чистых, добротных зданий правительства и особняков богачей можно найти трущобы: лачуги, построенные из металлолома и мусора, лишённые канализации, водопровода и каких-либо удобств. Тысячи бедных пони населяют эти груды хлама: сбежавшие рабы, бывшие крепостные, жеребята и птенцы. Да, все они искренне любят свободу и республику. Но, судя по всему, несмотря на их стремление к лучшей жизни в Новом Кантерлоте, их забросили как правительственные программы, так и местные владельцы фабрик.\n\n«Стоит им услышать мейнхеттенский акцент, как меня тут же выставляют за дверь. Я годами трудился над машинами Дождевых Ездоков, так что опыта мне не занимать. Но я не из их круга, а значит, они мне не рады». Вот что сказал мне пони, сбежавший от рейдеров-гонщиков, который теперь помогает строить лачуги для других обитателей трущоб. Отвергнутые всеми слоями общества и государства, эти отчаявшиеся существа вынуждены идти на всё ради выживания. «Прошлой ночью я был вынужден совершить ограбление. Я ушёл из банды «Пылевых налётчиков», чтобы больше никогда этим не заниматься. Но у меня жена и жеребята, а еды нет. Поэтому я сделал то, что был должен».\n\nПока правительство игнорирует эти трущобы, инициативу перехватили другие силы. Эквусская Партия Амнистии и «Объединённая коалиция за мир» распределяют продовольствие и медикаменты среди всех, до кого могут дотянуться, а также помогают строить более надёжные жилища. Многие очевидцы даже утверждают, будто героя битвы при Короне, Джованни Гайсая, видели раздающим еду детям в трущобах. Нашим репортёрам не удалось застать его, но, по словам свидетелей, грифон призывал бедноту организовывать протесты, чтобы заставить правительство прислушаться к ним. По мнению автора этого репортажа, то, что наше правительство отказывается помогать собственным гражданам, является позорным предательством самих устоев нашей нации.\n\n— Пен Инк, репортёр Нью Кантерлот Репортер." 
 shatteredhoof_ncr.37.a:0 "Это плохо."
 
 shatteredhoof_ncr.38.t:0 "Великий Новый Кантерлот"
 shatteredhoof_ncr.38.d:0 "«ПРЯМО КАК В СТАРОЙ ЭКВЕСТРИИ».\n\nВот что сказала семья беженцев, которая недавно перебралась в Новый Кантерлот, спасаясь от конфликта между Содружеством и Каганатом на далёком севере. Подобные слова можно услышать по всему городу, ведь Новый Кантерлот и впрямь кажется совершенно другим. Исчезли многочисленные трущобы, прежде преобладавшие на окраинах: их сменили пригороды, полные жилых домов, построенных ещё по эквестрийским стандартам. Продовольствия теперь в избытке, и с каждым днём в городе прибавляется как жителей, так и новых домов. Студенты со всей страны стекаются в новый просторный университет и колледжи, а жеребята каждое утро ездят на автобусах на занятия, получая образование почти что довоенного уровня.\n\nВ столице с пространной речью выступила госпожа президент Гаудина Грознопёрая – это стало символическим открытием обновлённого города, который восстановили и сделали краше прежнего. В своём выступлении она отметила, что очень приятно видеть, как эта земля превращается из обычного старого перепутья в процветающую столицу новой нации, где ни одному гражданину больше не приходится ложиться спать голодным или мёрзнуть по ночам. Неожиданным для многих проявлением единства стало то, что представители оппозиционных партий генерал Олив Бранч и губернатор Рок Солид вышли вместе, чтобы произнести собственные речи и поздравить президента с её успехами. Губернатор Рок Солид заявил: «Хотя у меня было и остаётся множество разногласий с президентом, мы всегда должны признавать, когда для нашей нации делается благое дело. Пони обеспечены едой, кровом и одеждой как никогда прежде. И неважно, каких политических взглядов вы придерживаетесь, ведь это доброе дело». Маршал Стил Уолл даже организовал военный парад, особо подчеркнув важную роль военно-промышленного комплекса в вызволении многих граждан из нищеты.\n\nИ всё же мы никогда не должны забывать, какой ценой дались эти перемены в Новом Кантерлоте. Многие сотни, если не тысячи пони погибли в трущобах, и перемены стали возможны лишь благодаря активным протестам и призывам к действию со стороны всех слоёв общества. Пока тысячи жителей наслаждаются плодами правительственных трудов, мы обязаны помнить о тех, кому не посчастливилось дожить до этого момента. Без нашей свободы собраний и слова мы бы никогда не достигли этой вершины. Мы должны всегда помнить об этом.\n\n— Пен Инк, репортёр Нью Кантерлот Репортер."
 shatteredhoof_ncr.38.a:0 "За нашу прекрасную столицу!"
 
 shatteredhoof_ncr.39.t:0 "Открытие Айронхаска"
 shatteredhoof_ncr.39.d:0 "Слабые копыта мягко ступают по хорошо вымощенным улицам, а глаза, один из которых подёрнут пеленой и покрыт шрамами, всматриваются в окружающий город. То тут, то там пробегают пони; многие устремились вдаль, где президент выступает с речью вместе с новым мэром. Она вдыхает воздух, чистый, насколько это вообще возможно в пустоши, но её дыхание прерывается сильным кашлем. Она шатается и едва не падает, но её подхватывают сильные копыта: жеребец, её верный спутник, встаёт рядом. — Верховная старейшина, вы в порядке? Вам нужен отдых?\n\nВерховная старейшина Короны медленно поднимает взгляд, озираясь по сторонам. Её голос скрипит, словно плохо смазанная дверь. — Цивилизация сменяет племена. Лес был погружён во тьму перед мощью Дэдайса, но из пепла зарождается новая жизнь. И всё же это не Корона. Мы подлетели слишком близко к морю, и его гнев лишил нас крыльев, дитя моё. Я не в порядке, да и как я могу быть в порядке? Когда я вижу, как мой дом изменился до неузнаваемости? Как он стал тем, чем никогда прежде не был? Молодые будут топтать могилы стариков и в своём юношеском высокомерии провозглашать великую победу. Но никто не помнит о костях под своими копытами, о глупости оседлых – тех, кто считал себя непобедимыми. Я должна увидеть их старейшину, ту, которую они называют президентом.\n\nСтарая кобыла с трудом продвигается вперёд, пытаясь копытом нащупать опору, но уйти далеко ей не удаётся. Жеребец подхватывает её и несёт на спине, точно охапку хвороста. — Вам не добраться одной, верховная старейшина. Но вы не одна, — он пробирается вперёд, приближаясь к толпе, пока та не оказывается перед глазами. Гаудина Грознопёрая стоит на помосте, держа в когтях огромные ножницы перед лентой. Слепой глаз старейшины устремляется на неё, и старуха выдыхает. — Тело старой грифины, а высокомерие – совсем юной. Старейшина Грознопёрая. Когда она уйдёт, все будут скорбеть, но не прольётся ни единой слезы, — она умолкает, пока Гаудина заносит гигантские ножницы и перерезает ленту, объявляя город официально открытым.\n\nЖеребец оглядывается назад и видит, что глаза верховной старейшины закрыты, а на лице царит покой. В горле у него встаёт ком, но он лишь качает головой, поворачиваясь спиной к Гаудине. — Мне жаль, верховная старейшина. Отдыхайте, ведь вы свой долг исполнили. И теперь нам, молодым, нужно жить дальше, — он тихо вздыхает и уходит, пока за его спиной ликует толпа."
 shatteredhoof_ncr.39.a:0 "Ещё один город республики."
 
 ###Tenpony Negotiations###
 
 shatteredhoof_ncr.16.t:0 "Предложение от НКР"
 shatteredhoof_ncr.16.d:0 "Сегодня прибыл посланник из Новой Кантерлотской Республики с весьма интересным предложением. Для нас не стало сюрпризом, что Мейнхеттен, один из самых богатых и престижных довоенных городов, стал важным приоритетом для экспансии НКР. Конфликт между нами и республикой казался неизбежным, но власти НКР предложили соглашение, которое могло бы позволить нам не только избежать этого конфликта, но и получить новые территории. Если мы согласимся помочь им в захвате земель между Мейнхеттеном и теперешней территорией НКР, а также будем сотрудничать с ними, то власти республики готовы позволить нам сохранить не только большую часть территории, которую мы завоевали, но и весь Мейнхеттен. Это действительно хорошая сделка... возможно, даже слишком хорошая. Настолько ли мы доверяем НКР? Ведь они могут нарушить соглашение и нанести удар тогда, когда мы будем ещё слабы после войны."
 shatteredhoof_ncr.16.a:0 "Звучит как отличная возможность!"
 shatteredhoof_ncr.16.b:0 "Мы им не доверяем."
 
 shatteredhoof_ncr.1611.t:0 "Тенпони принимает наше предложение"
 shatteredhoof_ncr.1611.d:0 "Наш дипломат вернулся из Башни Тенпони с хорошими новостями. Они согласились сотрудничать с нами, а также углублять и расширять военное и экономическое сотрудничество между нашими нациями. Однако представители Башни Тенпони также предупредили нас о том, что они будут внимательно следить за нашей нацией и не обрадуются чрезмерным перемещениям наших войск вдоль их границы. Нас стоит вести себя осторожно с Башней, поскольку они по-прежнему относятся к нам с подозрением, хотя мы проявляем дружелюбие и готовы сотрудничать с ними. Однако мы займёмся решением этих проблем в будущем, так как сейчас нас волнует гораздо более насущный вопрос: мы должны разобраться с регионом Санрайз."
 shatteredhoof_ncr.1611.a:0 "Тогда давайте приступим к делу!"
 
 shatteredhoof_ncr.1612.t:0 "Тенпони отвергает наше предложение"
 shatteredhoof_ncr.1612.d:0 "Наш дипломат вернулся из Башни Тенпони с плохими новостями. Башня отказалась от нашего предложения, сославшись на то, что оно не слишком выгодно для них. Хотя нам придётся самостоятельно завоёвывать Санрайз, мы также сможем оставить все новые территории себе. Но и с самой Башней Тенпони тоже придётся рано или поздно разобраться, поскольку они стоят на пути к нашему доминированию в Мейнхеттене."
 shatteredhoof_ncr.1612.a:0 "Они пожалеют о своём решении."
 
 shatteredhoof_ncr.1613.t:0 "Санрайз наш!"
 shatteredhoof_ncr.1613.d:0 "Мы успешно захватили регион Санрайз и покончили со всеми бандами рейдеров и небольшими нациями, которые раньше удерживали эти земли. Теперь мы должны попытаться разделить эти новые территории между нами и Башней Тенпони, которая помогала нам в этом конфликте. Наша армия намного сильнее, а вклад в войну, соответственно, выше, так что будет справедливо, если мы получим подавляющее большинство новых территорий. Однако делегаты от Тенпони, скорее всего, не согласятся на такие условия. Мы созовём официальную мирную конференцию между нашими самыми опытными дипломатами и представителями Башни Тенпони, чтобы проработать детали соглашения и добиться наиболее выгодных для нас условий."
 shatteredhoof_ncr.1613.a:0 "Пора определить новые границы."
 
 shatteredhoof_ncr.1614.t:0 "Мирная конференция по вопросу Санрайза"
 shatteredhoof_ncr.1614.d:0 "Когда война закончилась, представители НКР созвали мирную конференцию, чтобы определить наши новые границы. Выбранный ими весьма тесный конференц-зал вскоре заполнился дипломатами от обеих сторон. Представители НКР прибыли подготовленным, поскольку их чиновник предоставил карту региона Санрайз с уже намеченными предварительными границами. После этого разгорелась жаркая дискуссия, в которой каждая из сторон пыталась добиться наиболее выгодных для себя условий. Нашим дипломатам приходится нелегко, так как представители НКР знакомы с дипломатией. \n\nПосле часа долгих и бесплодных обсуждений чиновник от НКР сделал шаг вперёд, и комната замерла в ожидании. \n\n — Ладно, мы уже достаточно обсуждали этот вопрос.\n\n Он обернулся на своих коллег позади, а затем бросил взгляд на ту область на карте, которую они готовы передать Тенпони. \n\n — За ваши усилия... Тенпони получит земли Дождевых Ездоков. НКР достанется остальная часть региона. Вас устраивает такое предложение?"
 shatteredhoof_ncr.1614.a:0 "Земель Дождевых Ездоков будет достаточно."
 shatteredhoof_ncr.1614.b:0 "Этого слишком мало!"
 shatteredhoof_ncr.1614.c:0 "Нас устраивают нынешние границы, не нужно ничего менять!"
 
 shatteredhoof_ncr.1615.t:0 "Тенпони требует больше земель"
 shatteredhoof_ncr.1615.d:0 "Несмотря на наши усилия жёстко контролировать ход конференции, представители Тенпони были весьма непреклонны в своих желаниях. Ясно, что они желают получить не только земли Дождевых Ездоков. Представители Башни выразили желание получить в своё распоряжение части Ржавого Остова и Фрисайда. Мы, конечно, не хотим отказываться от этих земель, но отказ от этого требования почти наверняка приведёт к тому, что мирные переговоры полностью провалятся, а наш альянс распадётся."
 shatteredhoof_ncr.1615.a:0 "Они были верными союзниками, пусть получат эти земли."
 shatteredhoof_ncr.1615.b:0 "Это недопустимо! Сделка отменяется."
 
 shatteredhoof_ncr.1616.t:0 "Тенпони требует сохранения нынешних границ"
 shatteredhoof_ncr.1616.d:0 "Несмотря на наши усилия жёстко контролировать ход конференции, представители Тенпони в другом конце зала недовольны любым нашим предложением. И они выдвигают собственное. Башня хочет сохранить границы в их текущем виде и оставить себе все захваченные земли. Они не желают нам уступать ни пяди земли и ясно дали понять, что это их последнее предложение. Мы можем принять их условия, или же отказаться. Но в последнем случае нашему альянсу придёт конец."
 shatteredhoof_ncr.1616.a:0 "Ладно, они убедили нас."
 shatteredhoof_ncr.1616.b:0 "Мы научим их не связываться с нашей республикой."
 
 shatteredhoof_ncr.1617.t:0 "НКР разрывает связи"
 shatteredhoof_ncr.1617.d:0 "Мы выдвинули собственное предложение дипломатам НКР, но потом всё пошло не так, как мы надеялись. Встреча была внезапно закончена по воле лишь одного представителя НКР. Нам сообщили лишь то, что теперь НКР разрывает все связи с нами. Любые дальнейшие попытки установить контакт с властями республики ни к чему не привели. А также мы получаем тревожные сообщения об активности войск НКР вблизи наших границ, которая началась всего через несколько дней после окончания встречи."
 shatteredhoof_ncr.1617.a:0 "Вероятно мы совершили ошибку."
 
 shatteredhoof_ncr.1618.t:0 "НКР соглашается"
 shatteredhoof_ncr.1618.d:0 "Мы выдвинули наше контрпредложение и представители НКР какое-то время обсуждали его между собой. Они пришли к какому-то соглашению и один из них, взглянув на карту Санрайза безо всякого энтузиазма, произнёс следующее. \n\n — Очень хорошо, мы согласны сохранить нынешние границы."
 shatteredhoof_ncr.1618.a:0 "Что ж, с этим мы разобрались."

shatteredhoof_ncr.40.t: "Голосуйте за Гауду"
shatteredhoof_ncr.40.d: "— Где вы были пять лет назад? Многие из вас, я знаю, находились в цепях. Другие подвергались угнетению или гонениям. Третьи жили в крошечных, разбросанных по пустошам поселениях, каждый день страшась, что им нечего будет поставить на стол. Кто-то чах в тени полуразрушенных небоскрёбов Мейнхеттена, кто-то погибал в трущобах Филлидельфии, а иные бросали вызов Розовому облаку и смерти, которую принёс Кантерлот. Одни были дикарями, другие – поселенцами, третьи – рейдерами. Но абсолютно всем тогда жилось хуже, чем сегодня.\n\n— Над Эквестрией разгорается заря нового дня. Высоко в небе ярко светит солнце, а кобылки и жеребята спешат в школы, а не на фронт. Там, где когда-то пони голодали или изнывали под хлыстами своих господ, теперь они живут в сытости, оставаясь полноправными хозяевами собственной судьбы. Знаки отличия больше не служат клеймом для разделения рабов или признаком слабой добычи для рейдеров-каннибалов – отныне это истинный символ вашего предназначения. Грязные рейдеры и работорговцы с едва работающим оружием больше не угрожают вам изо дня в день. Вместо этого по улицам маршируют опрятные, отлично снаряжённые солдаты, которые рады помочь любому пони, попавшему в беду.\n\n— Сегодня в Эквестрии начинается новая эпоха, и я счастлива, что служила на посту президента во время столь грандиозных перемен. Вскоре вы все отправитесь на избирательные участки и отдадите свои голоса за тех, кто будет представлять вас в будущем. Но когда вы пойдёте голосовать, просто вспомните, кто именно принесла вам избирательное право, улыбки и безопасность. Голосуйте за Гауду, чтобы продолжить великое наследие Эквестрии. Меня зовут Гаудина Грознопёрая, и я надеюсь вскоре увидеть всех вас на выборах. Берегите себя, мои маленькие пони."
shatteredhoof_ncr.40.a: "Голосуйте за Гауду!"

shatteredhoof_ncr.41.t: "Звезда шерифа"
shatteredhoof_ncr.41.d: "Форт Шерхуф выглядит совсем не так, как раньше. В прошлое ушли пыльники и шестизарядные револьверы – их сменили облачённые в броню законники с полуавтоматическими винтовками. Копыта взлетают в приветствии, когда он проходит мимо них, а медали на его груди негромко позвякивают, задевая друг друга. Он останавливается перед своим прежним домом и разглядывает его – теперь здание отремонтировано и превращено в величественную ратушу. Он толкает дверь и видит жеребца на другой стороне. Тот заметно постарел, но всё ещё носит тот самый пыльник цвета табачной слюны. Помощник... нет, теперь уже мэр Спиттун вскидывает копыто к виску. — Шери... ох, извини. Маршал Стил Уолл, — начальник проходит внутрь. — Вольно, Спиттун. Ни к чему все эти формальности...\n\nЩетина Стил Уолла ещё сильнее поседела, а мешки под глазами стали отчётливее, чем когда-либо. Спиттун наблюдает за тем, как маршал подходит к старой фотографии. Шериф и его помощники. Он мягко улыбается. — Мы ведь всё сделали правильно, Спиттун? Всё то, что там, снаружи... Стоило ли оно того? Вся эта кровь и потери. Все те пони, что так и не вернулись домой. Я думал о них прошлой ночью. И о других помощниках. О тех, кто остался в пустошах навсегда, — Спиттун подходит к нему. — Стил, ты сделал всё, что было в силах обычного жеребца. Ты же знаешь, я и остальные всегда рядом. Может, пришло время... — Стил Уолл прерывает его. — Знаю. Кажется, пришло время снять эти медали, — он косится в сторону, где лежит старая шляпа с сияющей золотой звездой. — Хреновенький вышел из меня политик. Возможно, пора снова надеть эту шляпу. Пришло время маршалу уйти. А шерифу – вернуться, — Спиттун мягко улыбается и кивает.\n\nДверь открывается, и в комнату входит по-щегольски одетый пегас. Агент Маддид Уотерс разглядывает двух служителей закона из-за тёмных очков. — Мэр Тобакко Спиттун, маршал Стил Уолл, надеюсь, я вас не прервал. Маршал, у меня важные новости, — Стил Уолл медленно переводит взгляд со своей старой шляпы на гостя. — Выкладывай, — Маддид Уотерс слегка усмехается. — Пара моих старых друзей из разведывательного управления покопались в архивных папках времён основания республики. В одной из них мы нашли кое-что крайне важное. Это список ваших помощников, составленный некой Дженефайс Мунталон, и многие из них были помечены как «неблагонадёжные». Небольшое расследование показало, что эти бывшие помощники со спорной лояльностью отправлялись один за другим лично мадам президентом Гаудиной Грознопёрой на самоубийственные миссии. Маршал Стил Уолл, похоже, именно мадам президент Гауда Грознопёрая стоит за гибелью многих ваших старых друзей.\n\nСтил Уолл прищуривает глаза. — Что? — Спиттун немедленно вступает в диалог. — Стил, ты серьёзно готов поверить этому надутому индюку? Забудь про Гауду! Твои помощники нуждаются в тебе, Стил. А я хочу вернуть своего шерифа, — Стил Уолл переводит взгляд сначала на Спиттуна, затем на Маддида Уотерса и на минуту затихает. После чего медленно направляется к выходу. — Я дал обещание, Спиттун. Если Грознопёрая предаст меня, то я пойду на всё, чтобы заставить её пожалеть об этом, — пегас ухмыляется ещё шире, когда Стил Уолл застывает на пороге. Он в последний раз оглядывается на свою старую шляпу и качает головой. — Уотерс, шевели копытами. Нам нужно вышвырнуть одну птицу из её кабинета, — Маддид Уотерс с ухмылкой следует за ним. — Разумеется, маршал Стил Уолл."
shatteredhoof_ncr.41.a: "Любой ценой"

shatteredhoof_ncr.42.t: "Прочный фундамент"
shatteredhoof_ncr.42.d: "В Лесли царит мир. По всему городу пони, грифоны и прочие существа крепко спят в своих домах. На улицах нет преступности, они хорошо освещены и ухожены. Утром дети пойдут в школы изучать математику, естественные науки и литературу. О прошлом здесь ничего не напоминает – жители смотрят только в будущее. Но это будущее всё ещё очень далеко.\n\nГубернатор Рок Солид стучит по клавишам, и лишь настольная лампа составляет ему компанию в ночи. Письма и отчёты ворохом лежат на его столе, лишь наполовину прочитанные и осмысленные. Завтра состоится благотворительный сбор средств для сирот. На следующий день – открытие музея, посвящённого ужасам крепостного права. Затем – митинг с ранеными солдатами. Ожидается и особый гость: какой-то грифон из Ржавого Остова, прибывающий сюда ради пропаганды того самого агрессивного пацифизма, который Рок Солид всегда защищал. Времени на сон почти нет, выборы уже близко, а городу необходим его губернатор. Так что пока что придётся обходиться кофе и прочими тонизирующими напитками.\n\nПони поднимает глаза и смотрит в окно. Там висит плакат со стоическим лицом Олива Бранча, призывающий к миру и застою. Рок Солид всё ещё слышит в ушах отголоски гнева Джованни. На секунду он замирает, вглядываясь в глаза на плакате. Но смотреть долго некогда. Он отворачивается и продолжает набирать текст на своей печатной машинке.\n\nВозможно, он остался совсем один. Вероятно, республика изменится. Возможно, всё это окажется напрасным. Но эту жертву он готов принести. Куда бы ни дул ветер, у Лесли и Нового Кантерлота всегда будет он. Их прочный фундамент."
shatteredhoof_ncr.42.a: "Непреклонность до самого конца."

shatteredhoof_ncr.43.t: "Клубнично-красный"
shatteredhoof_ncr.43.d: "Джованни стоит перед небольшим домиком в глуши. Дыхание грифона слабое и частое. Его когти грязные, они погружаются в слишком знакомый песок. Регина прижимается к его боку, возвращая его к реальности. Он смотрит на неё, и та мягко улыбается, ободряюще кивая. — Сделай это, Джо. Я рядом, — он делает глубокий вдох, шагает вперёд и стучит в дверь.\n\nДверь открывается, на пороге появляется старая кобыла со впалыми глазами и исхудавшими боками. Она медленно поднимает голову, пока их взгляды не встречаются. В её глазах вспыхивает ярость, и она рычит. — Ты, — он смотрит на неё, и перед его мысленным взором предстают глаза умирающей кобылки. Заготовленные слова мгновенно улетучиваются. Прежде чем Джованни успел продумать речь, он разевает клюв. — Мне жаль. Мне так жаль, — она с рыком бросается вперёд, толкая грифона назад. Он спотыкается, но удерживается на лапах – хрупкое тело кобылы не способно сдвинуть его с места. — Жаль?! Тебе жаль?! Ты не имеешь права извиняться! — слёзы катятся по её щекам, когда она кричит. — Ты остался жить! Убийца! — кобыла качает головой, закрывает глаза и опускает взгляд, тяжело дыша. — У моей дочери впереди была целая жизнь, а ты забрал её. Ты украл её у меня. Мы были так близки к свободе... — она поднимает голову, а её глаза красны и полны слёз. — Будь у меня оружие, я бы пристрелила тебя, мааров ты сын.\n\nДжованни тихо произносит. — Я знаю. И не стал бы тебя винить. Мне вообще не следовало спускать курок, — оба замолкают, и между ними словно встаёт призрак умирающей кобылки. Грифон тихо спрашивает. — Как её звали? — кобыла тихо шмыгает носом и отворачивается. — Строуберри Филдс. Нас заставляли работать на фермах на окраине Неокасла. Освободительная армия спасла нас. И моя дочь хотела помочь им освободить остальных, — кобыла снова смотрит на Джованни. — В один прекрасный день твоя душа предстанет перед судом. Молись, чтобы те боги, в которых ты веришь, оказались милосерднее меня. Уходи. Немедленно.\n\nОн смотрит на неё и мягко кивает. — Она всё же добьётся своего. Строуберри поможет освободить других. Обещаю, — он разворачивается и уходит, а Регина следует за ним. Какое-то время оба грифона идут в полном молчании, после чего Джованни открывает клюв. — Олив Бранч. Я... я слишком долго упивался жалостью к себе. Пришло время действовать, — Регина мягко улыбается и кивает. — Я буду с тобой на каждом шагу."
shatteredhoof_ncr.43.a: "Новая цель."

shatteredhoof_ncr.44.t: "Амнистия"
shatteredhoof_ncr.44.d: "Генерал Олив Бранч уверенно наливает три стакана виски, мягко улыбаясь двум своим гостям-грифонам. — Рад твоему возвращению, Джованни, — тот улыбается и вместе с Региной берёт свой стакан. Сделав небольшой глоток, он кивает. — После ухода Рока Солида я совсем потерял ориентиры. Но недавние события неподалёку от Стайниополиса напомнили мне о данном нами обещании. О мирной республике, где ни одной кобылке больше не придётся умирать, — его улыбка становится шире. — Возможно, это слишком уж запоздалое прозрение. Да, я знаю, что мог бы сделать для тебя гораздо больше за эти последние несколько лет. Но я вновь вспомнил, кто я такой.\n\nОлив Бранч улыбается. — Не беспокойся об этом, друг мой. Я просто рад, что ты вернулся, — затем он переводит взгляд на другую грифину. — Регина Грознопёрая, Героиня Чистых. Удивлён видеть тебя здесь, — Регина слегка ухмыляется, делает приличный глоток виски и покачивает стакан, наблюдая за игрой янтарной жидкости. — Я не моя мать, Олив. Мы с ней никогда особо не ладили. Я дружу с Джованни уже много лет, и, скажу честно, мне скучно. Я видела слишком много крови, слишком много войны – и всё по вине моей матери. Конечно, мама знатно раскричится из-за этого, но да и к Маару её. Я устала быть сначала Грознопёрой, а уже потом Региной. К тому же, я вам нужна, — она ухмыляется. — Многие относятся к Грознопёрым с уважением, да и немалая часть бывших рабов Филлидельфии от меня без ума. Те, кого я вытащила из плена Чистых, уже разнесли слухи обо мне. К тому же, Джо – мой друг, а раз ты его друг, значит, и со мной поладишь.\n\nОлив кивает и поднимает свой стакан. — Что ж, я искренне рад, что вы оба здесь. Герой Короны и героиня Чистых, — он улыбается и протягивает стакан вперёд. — С нетерпением жду возможности трудиться бок о бок с вами обоими. Так уж совпало, что я всё ещё ищу вице-президента. Ты ведь не откажешься занять этот пост, Джованни? — Регина ухмыляется, поднимая свой стакан. — Бранч и Гайсай звучит неплохо, — Джованни смотрит на неё, затем снова на Олива. Он поднимает свой стакан и улыбается. — Я тоже это вижу. За демократию, друзья мои, — Олив мягко улыбается. — За демократию, и пусть восторжествует мир, — Регина тихонько посмеивается. — За демократию. Жду не дождусь увидеть, как взбесится моя матушка."
shatteredhoof_ncr.44.a: "— За демократию!"

shatteredhoof_ncr.45.t: "Вторые выборы в Новом Кантерлоте"
shatteredhoof_ncr.45.d: "И вновь это случилось. По всей Республике открываются избирательные участки. На некогда грязных улицах Филлидельфии, у подпольных баров мафии и во всех великих городах юга пони, грифоны и все прочие существа приходят тысячами, чтобы отдать свои голоса. Голосование займёт несколько дней, и ещё столько же потребуется на подсчёт. Но таков уж путь демократии.\n\nГаудина Грознопёрая выступает с очередным радиообращением, транслируемым на всю страну: голос старой грифины одновременно слушают тысячи граждан. В это же время на улицах пегасы в костюмах и зеркальных очках общаются с солдатами, прося тех посмотреть в другую сторону, пока они копаются в бюллетенях. Ни один солдат не возражает, ведь никто не хочет злить маршала Стил Уолла. Те, кто злят его или главу его предвыборного штаба, обычно очень быстро исчезают.\n\nВ Лесли Рок Солид перерезает ленточку на открытии нового приюта, позируя перед камерами и обнимая сирот и бывших крепостных со своей родины, а его волевая улыбка красуется на страницах всех газет страны. В самом Новом Кантерлоте Олив Бранч без устали произносит речи, пока герой Короны с гордостью позирует рядом с ветеранами и ранеными. Дочери и сыновья солдат принимают из его когтей маленькие медали и убегают обратно к родителям, с гордостью их примеряя. На улицах Филлидельфии голос одной Грознопёрой сталкивается с голосом другой: Регина выступает перед толпой бывших рабов с неподдельной страстью в голосе и огнём в глазах.\n\nКогда все споры утихают и голоса подсчитываются, становится ясен победитель."
shatteredhoof_ncr.45.a: "Гаудина Грознопёрая остаётся!"
shatteredhoof_ncr.45.b: "Губернатор Рок Солид вступает в должность."
shatteredhoof_ncr.45.c: "Да здравствует маршал!"
shatteredhoof_ncr.45.e: "Мир для всех!"

shatteredhoof_ncr.46.t: "Патриотическая республика"
shatteredhoof_ncr.46.d: "Маршал... нет, теперь уже президент Стил Уолл стоит в своём новом кабинете, глядя на Новый Кантерлот. В оконном стекле отражается жеребец, чьи лучшие годы остались далеко позади: старый шериф, напяливший плохо сидящий костюм, с седеющей гривой, не прикрытой шляпой. За его спиной стоит мэр Спиттун. — Стил. Взгляни на себя. Ты действительно этого хотел? Ты победил, но как долго ты собираешься здесь оставаться? Послушай, там, в форте Шерхуфе, есть одна кобыла, ей как раз нравятся жеребцы постарше. Вдова, муж погиб на войне. Я мог бы вас све... — Стил Уолл прерывает его. — Спиттун. Пожалуйста.\n\nОн глубоко вздыхает и, повернувшись лицом к своему старому помощнику, выдыхает воздух. — Ты же знаешь, у меня нет на это времени. Я дал обещание тебе и всем остальным. Неужто ты забыл? Я – жеребец своего слова, — он тихо вздыхает. — Гауда предала нас. И я сделаю всё, чтобы она об этом пожалела. За каждого помощника, которого она отправила на смерть... эта драная курица заплатит. Таков мой путь. Но не твой, — он смотрит Спиттуну прямо в глаза. — Ты ещё молод, помощник. Уходи. Найди себе кобылу, заведи семью. И когда будешь рассказывать им обо мне, просто... — он запинается. — Расскажи им о шерифе. Расскажи о том остром на язык слуге правосудия, в котором ещё жила надежда. Пожалуйста, — Спиттун смотрит на него ещё пару мгновений. — Я... понял тебя, шериф, — он хочет сказать что-то ещё, но осекается. Спустя несколько секунд он разворачивается и уходит.\n\nИз угла комнаты раздаётся голос агента Маддид Уотерса. — Прошу прощения, что вам пришлось через это пройти, господин президент Стил Уолл. Но вам не стоит отчаиваться, — он подходит ближе, пока Стил Уолл смотрит в окно. — Забудьте о Гаудине Грознопёрой, она всего лишь старая грифина, пускай чахнет и умирает в полном одиночестве. У нас есть куда более важные дела. Пришло письмо из Скайфриза: конфликт в Содружестве привёл к появлению новой крупной державы. Мы не должны давать им времени на подготовку, господин президент Стил Уолл. Приказать фабрикам готовиться к тотальной войне?\n\nСтил Уолл смотрит на улицу. Мужья и жёны идут бок о бок, а их сыновья и дочери радуются жизни, будучи достаточно удачливыми, чтобы никогда не видеть ужасов войны. Вдали тренируются с винтовками совсем ещё зелёные солдаты. В стекле отражается лицо Маддид Уотерса, смотрящего на него с ухмылкой. Стил Уолл делает медленный вдох и выдох, после чего поворачивается к Уотерсу. — Готовьте фабрики. Эквестрия будет нашей."
shatteredhoof_ncr.46.a: "Как и планировалось."

shatteredhoof_ncr.47.t: "Единая республика"
shatteredhoof_ncr.47.d: "В Новом Кантерлоте самый обычный, мирный день. Гауда изучает отчёты, её старые глаза уже давно привыкли к бесконечному чтению бумаг. Бладай подавил попытку бандитского бунта на севере: обошлось без жертв, не считая врагов. Мунталон обнаружила сеть бывших шпионов Анклава, сеющих смуту, так что это дело требует дальнейшего расследования. Голдбик зачистил ещё один заброшенный объект: какой-то безумный доктор-гуль пытался вылечить Порчу в руинах Гаттервилля. Перо Гауды оставляет подписи под каждым документом. Отчёты о беженцах из Содружества, прибывающих в Мейнхеттен, взрывы мегазаклинаний в Каледонии, просьба о встрече от одного из пятидесяти потомков Вёрджила. Подпись, подпись, подпись.\n\nДверь открывается, и Гауда поднимает взгляд: в кабинет входит Регина. Старая грифина тихо кашляет, прочищает горло и приглаживает седеющие перья. — В чём дело, крошка? — Регина смотрит на пожилую мать. — Как долго ты собираешься здесь оставаться, мам? Не думаешь, что сейчас самое время уйти на покой? Дать шанс кому-то другому? — Гауда ухмыляется. — Пусть теперь я не так молода, но не думай, что я ни на что не годна, птенчик. Разве не этого ты хотела? Демократии? Пони нашей страны голосуют за своего лидера, и они выбрали меня. Если бы я отказалась, это было бы недемократично.\n\nРегина ещё несколько секунд молча смотрит на неё, прежде чем снова заговорить. — И скольких из этих пони ты собираешься отправить туда? На север? В джунгли? В пустыню? Сколько из них погибнет ради непонятно чего? Сколько вдов и сирот останется, мам? С какими потерями среди детей ты готова смириться? — Гауда пристально смотрит на дочь и качает головой. — Столько, сколько потребуется. Ты молода, Регина. Я не виню тебя за то, что ты так горячишься и хочешь изменить мир. О, я была точно такой же в твои годы. Посмотри в окно: у всех этих пони появился шанс на жизнь, которого у них никогда не было. Полные желудки, счастливые жеребята, учителя и солдаты. Разве это того не стоит?\n\nОна откидывается на спинку кресла. — Или ты думаешь, что мне плевать на мёртвых? Это вовсе не так. Мне не всё равно. Тысячи погибнут, чтобы миллионы могли жить. Возможно, тебе не хватает смелости принять такое решение, но у меня она есть – именно поэтому я здесь. Я – единственная, у кого хватит духу делать тяжёлый выбор, чтобы тебе не пришлось этого делать. Когда я умру, пусть Борей судит мою проклятую душу, но я готова сделать всё это снова без колебаний. Ты не обязана соглашаться. Но я продолжу, — она смотрит Регине прямо в глаза. — У меня много работы, — Регина смотрит на мать в ответ, после чего разворачивается и уходит."
shatteredhoof_ncr.47.a: "Всё остаётся прежним."

shatteredhoof_ncr.48.t: "Прощённые"
shatteredhoof_ncr.48.d: "— Слишком долго наша прекрасная республика страдала под гнётом поджигателей войны, веривших, будто кровопролитие – единственный путь развития нашего славного государства, — недавно принёсший присягу президент Олив Бранч выступает перед многотысячной толпой. — Я рад, что сегодня мы, граждане Республики, собрались вместе, чтобы заявить во всеуслышание: нет, война не определяет нас. Смерть не является Элементом гармонии, она – полная противоположность всему, во что мы верим. Новому Кантерлоту пора измениться и стать по-настоящему новым. Со всего света к нашим границам тянутся беженцы, и наш долг – принять их и вместе двигаться вперёд по пути мира. А сейчас я передаю слово своему вице-президенту, Джованни Гайсаю.\n\nГрифон поднимается на трибуну, окидывая взглядом тысячи устремлённых на него глаз. Регина улыбается ему, рядом с ней стоит Гауда, оценивающе наблюдая за происходящим. Рок Солид выражает своё почтение уважительным кивком, в то время как Стил Уолл командует охраной чуть поодаль – бдительные пегасы следят за небом в поисках любой угрозы. Джованни смотрит в самый центр толпы и замечает *её*. Строуберри Филдс глядит на него снизу вверх, а её глаза совершенно безжизненны. Грифон впивается когтями в кафедру и начинает речь. — Спасибо, Олив Бранч. Меня зовут Джованни. Многие знают меня как героя Короны, но...\n\nОн умолкает на мгновение. — Я вовсе не герой. На войне нет места героям, на ней вообще нет места ничему хорошему. Война несёт лишь смерть и разрушение. Каждую ночь во снах я возвращаюсь в Корону, я думаю о Кайзеркресте, моём командире, и обо всём, что он мог бы совершить. О погибших грифонах и пони, об их семьях и о жизни, которую они могли бы прожить. Я так долго винил себя за то, что именно я спустил тот курок. Но я лишь хотел защитить свой дом и тех, кого люблю. В трагедии Короны виноват не я, а политики – босс Нейлс и Гаудина Грознопёрая. Каждую ночь я всё равно буду помнить о павших и желать, чтобы всё сложилось иначе. Но я буду идти вперёд, чтобы изменить этот мир. Мир – это не глупость, а война – не естественное для нас состояние, как бы сильно пустошь ни пыталась заставить нас забыть об этом.\n\nГрифон снова смотрит в центр толпы. Строуберри Филдс смотрит на него в ответ, улыбается и растворяется в толпе. Джованни поднимает голову и смахивает слезу. — И я... я не успокоюсь, пока мы не одолеем пустошь. Пока мир не перестанет быть непозволительной роскошью. Я буду трудиться день и ночь, если это поможет спасти жизнь хотя бы одного пони. Спасибо вам всем."
shatteredhoof_ncr.48.a: "Но не забытые."

shatteredhoof_ncr.49.t: "Республика Рока Солида"
shatteredhoof_ncr.49.d: "— Я бы хотел воспользоваться этим моментом, чтобы поблагодарить каждого из вас за ваши голоса. Как губернатор Лесли, я делал всё возможное, чтобы принести процветание всем и каждому, и я планирую продолжать этот курс. И Гауда, и Стил Уолл призывают к слишком частым войнам, но когда на просторах пустоши вершится зло, я не намерен сидеть сложа копыта и безучастно смотреть на это. Пусть же наше государство станет праведным... — радио затихает со щелчком. Регина, сидящая рядом с Джованни, слегка ухмыляется. — Не могу поверить, что Рок Солид выиграл выборы. Нет, серьёзно. Этот жеребец – один из самых скучных типов, которых я только знаю! — Джованни улыбается ей в ответ. — А я не против. Может, это и не так здорово, как если бы победили мы, но Рок Солид всегда был мне другом. Знаю, что он сделает всё ради блага пони, и уверен, что нам не о чем беспокоиться. Демократия восторжествовала, и мы всё же не собираемся воевать. Я могу с этим смириться.\n\nРегина откидывается назад. — Ну да, я понимаю, но да ладно? Рок Солид? Серьёзно? — она тихонько смеётся и расплывается в улыбке. — Мама, должно быть, в бешенстве от того, что проиграла именно ему, — между ними воцаряется минутное молчание, которое прерывает сама Регина. — Ну вот, теперь мне скучно. Буду честна, я рассчитывала на твою победу, чтобы получить работу. Или на Стил Уолла, ну или хотя бы на маму – тогда мне было бы весело протестовать против них. А теперь? — она переводит взгляд на Джованни, который смотрит на неё с мягкой улыбкой. — Думаю, что скука – это даже хорошо. На нашу долю хватило «интересных» времён.\n\nРегина отводит глаза, а затем снова смотрит на него. — Ну да, пожалуй, но мне нужно чем-то заняться. Я не из тех, кто может просто сидеть без дела, — грифина постукивает когтями друг о друга, а затем лукаво улыбается. — Придумала. Ты должен пойти со мной на свидание. — Джованни моргает и заливается краской. — Ч-чего? — она ухмыляется и выпрямляется, — Да ладно тебе, не притворяйся, будто это сюрприз. И так всем было ясно, что нас тянуло друг к другу с самой первой встречи. Мы что, так и оставим всё как есть? — он смотрит на неё широко раскрытыми глазами. — Т-тянуло? — она ухмыляется и пожимает плечами. — Не знаю, может, я просто видела то, что хотела увидеть. Как бы то ни было. Я. Милая грифина. Приглашаю тебя на свидание. Ты так и будешь глазеть на меня или скажешь «да»?\n\nОн удивлённо моргает. — Д-да! — затем прочищает горло. — Я имею в виду, эм, да. Конечно. Думаю, мне бы этого хотелось, — она поднимается на ноги, ухмыляясь ещё шире. — Идеально. Как насчёт завтра? Гюстав Ле Гранд только что открыл новый ресторан дальше по улице, его рецептам уже две сотни лет, так что они обязаны быть маарски хороши. В шесть часов вечера мне подходит, надеюсь, тебе тоже. Я приду в платье, а ты оставь свои медали дома и выбери костюм, который выгодно подчеркнёт твой... тыл, — она подмигивает ему и направляется к выходу из комнаты. — До встречи! — грифон ошеломлённо смотрит ей вслед и медленно заикается: — Д-да, до встречи там."
shatteredhoof_ncr.49.a: "За скучную республику."


 
 
 
 ###Decision-Events###

 shatteredhoof_ncr_decisions.1.t:0 "В руинах Анклава"
 shatteredhoof_ncr_decisions.1.d:0 "До войны Нейварро был военно-воздушной базой, расположенной к западу от Нового Хорслеана. После падения бомб это место стало использоваться Анклавом в качестве основной базы для операций в сердце Эквестрии. Также база Нейварро была крайне важна для будущего Анклава, так как в ней расположен центр управления Проектом Одного Пегаса, который, в теории, может предоставить возможность контролировать погоду над большей частью континента. Анклав использовал свой ограниченный доступ к ПОП, чтобы поддерживать постоянный облачный покров над всей пустошью со времён Великой Войны. Именно из этого места они начали своё завоевание пустоши, и именно тут они капитулировали. Сейчас данная база лежит в руинах после битвы при Нейварро, после которой большая часть пегасов Нового Клаудсдейла рассеялась по пустошам.\nСейчас Нейварро находится под нашим полным контролем, так что мы теперь можем свободно исследовать остатки базы и узнать все её секреты и тайны. Целая армия из нанятых нами мусорщиков, исследователей и учёных занимается раскопками базы Нейварро и уделяет особое внимание объекту ПОП. После того, как войска НКР разобрались с остатками автоматизированных систем безопасности Нейварро и силами независимых мусорщиков, наши специалисты приступили к сбору и каталогизации всех технологий и данных этой базы, которые могут пойти на благо НКР.\nСреди наших лучших находок было несколько повреждённых чертежей энергетического оружия; целая комната, полная комплектов силовой брони X-02, и настоящая сокровищница из шаров памяти, которые Анклав использовал для обучения пилотов.\nОднако самая интригующая находка была сделана группой исследователей, которые обнаружили в самом сердце базы нечто, похожее на большую комнату, окружённую совершенно непроницаемым энергетическим щитом. Попытки отключить щит не увенчались успехом, поскольку, похоже, нет реального способа обесточить его, не повредив то, что он защищает. Также нас озадачил тот факт, что щит не подключён к реактору базы. А это значит, что за щитом располагается автономный источник энергии. Наши учёные считают, что само сердце ПОП находится внутри щита, но пока мы не найдём безопасный способ проникнуть за него, мы, увы, не сможем раскрыть секреты, которые он защищает."
 shatteredhoof_ncr_decisions.1.a:0 "Скажите яйцеголовым, что этот щит нужно взломать как можно быстрее!"
 
 shatteredhoof_ncr_decisions.2.t:0 "Секреты холма 431"
 shatteredhoof_ncr_decisions.2.d:0 ""Breaching!" Bloodeye takes cover behind a wall as their team's demolition specialist blows up a sealed door. The bodies of Featherbrush's Talons surround them, still warm and bleeding from the battle for the bunker. As the door blasts open, Bloodeye motions his squad to follow him, keeping a well-maintained rifle up as they move into the space they opened up. They find themselves in a cavernous room, filled to the brim with weapons, and shelves containing uniforms. Bloodeye motions around, "Mango, left side, Fire, right side, Flanks, cover rear, shoot at anything that moves." The other three members of the squad assume their positions. Mango, a thestral with a cigarette and fifty bullets of .308 in an automatic rifle, Fire, a bright orange unicorn with a service rifle, and Flanks, a Pegasus mare who carries a light machine gun, commenting as they trot down the shelves, "Not my name, Sir."\n\nBloodeye doesn't respond, as they make their way down the middle pathway, surrounded on all sides by shelves. Dust lingers in the air and on the floor, kicked up by hooves and talons. Eventually, they reach the end of the room, stood in front of another door, "Flanks, cover me, I'm opening this door. I don't think any enemies got into here, but I'm not going to die because of thinking." Flanks nods, turning around and keeping her LMG sturdy. Bloodeye grabs the handle of the door in front of him, and swings it open, lifting his own rifle up as he does. No enemy comes charging at them, all the awaits them is a flickering light hanging above glowing vats.\n\nThey slowly move into the second room, eyes peering at the vats, only to step back as they see their contents. Bodies. Griffons, ponies, changelings, deer, every species imaginable, floating in green goop, held forever in vats stamped with the logo of the Ministry of Image. Mango breathes out a bit of smoke and shakes his head, "What in Luna's name is this shit?" Flanks frowns softly, "I don't like it." Flame nods along, "Whatever it is, fuck it, and its mother." Bloodeye steps forward, his gun still up, blood red eyes peering through every inch of the facility. After a second, he breathes out, and lowers his rifle, looking back to the others, "Whatever this is, it's for the egg-heads to figure out. There's no enemies left, the bunker's secure. Let's get out of here before one of these things decides to wake up." The ponies shudder softly, and quickly follow as he leads them back through the way they came."
 shatteredhoof_ncr_decisions.2.a:0 "Send A Team To Study"

 shatteredhoof_ncr_decisions.3.t:0 "Секреты Министерства"
 shatteredhoof_ncr_decisions.3.d:0 "Стойло, на которое мы недавно наткнулись, просто необыкновенно: его жители действительно считали себя Министерством Тайных Наук и продолжали деятельность своего "Министерства" ещё долгое время после войны, подобно Анклаву оставаясь в изоляции от остального мира. К сожалению, как и в случае с Анклавом, нам пришлось сражаться против жителей этого стойла, чтобы добраться до его секретов. После того как дым рассеялся, оказалось, что почти все обитатели стойла либо погибли в бою с нашими солдатами, либо покончили с собой в своих комнатах. Даже глава их организации, которого называли "Министром", застрелился в своём кабинете. Немногие выжившие были задержаны и доставлены на допрос или же получили гражданство НКР, если в стойле они занимались лишь гражданскими делами.\nПри исследовании самого стойла оказалось, что большая часть технологий и данных исследований была либо утеряна в ходе боёв, либо же обитатели намеренно уничтожили всё, что могло пригодится нам. Нам удалось заполучить небольшое количество исследовательских данных, а также приличное количество весьма продвинутого вооружения, которое жители этого стойла разрабатывали на протяжении двух последних веков. Также мы отыскали чертежи танка, который был разработан уже после войны. Нас весьма удивил тот факт, что в стойле мы нашли большое количество предметов с пустоши. В основном тех, которые использовались работорговцами. Похоже, что жители этого стойла и раньше контактировали с пустошей. Жаль только, что они взаимодействовали с одними из её худших обитателей.\nЧерез пару дней после того, как нам удалось забрать всё самое ценное, взрыв разнёс стойло на части, убив большую часть тех наших граждан, что уже успели переселиться в стойло для его поддержки в функционирующем состоянии. Сам объект превратился в дымящийся кратер. Мы считаем, что главный реактор стойла был настроен на взрыв с задержкой. А вот намеренно или нет было это сделано... Это печальный день для НКР, так как сотни невинных жизней и стойло в прекрасном состоянии были потеряны навсегда."
 shatteredhoof_ncr_decisions.3.a:0 "Удивительно, как далеко могут зайти некоторые пони, чтобы защитить свои секреты."
 
 shatteredhoof_ncr_decisions.4.t:0 "Логово ложной богини"
 shatteredhoof_ncr_decisions.4.d:0 ""Sir, don't you feel bad about this?" Goldbeak stands on the catwalks in what was once Maripony, looking down at the ruined vats, once filled with IMP. A Griffon hen sits next to him, cleaning her rifle, armor dented and a few cuts still bleeding from the fighting, "I had an alicorn friend once, you know. She wasn't part of the Unity anymore, but she said that she loved it. It was comforting and all that, you know, like a big community in her head." Goldbeak looks over at the hen, and then back down, watching as scientists take the facility apart, searching for what remains, "They didn't ask to become part of this. Sure, once they're part of the hive mind, they'll talk it up, not like they have any control over it. Ponies love to feel good about bad things. But Unity, this 'Goddess' didn't give them any choice. Just made them part of the whole."\n\nThe hen frowns softly, and looks down at the vats as well, "Aren't we the same?" He looks over at her, cocking an eyebrow, as she looks back at him, "We didn't ask ponies if they wanted to be part of the republic. All the ponies of Leslie, Appleloosa, all the alicorns, it's not like we gave them a choice. We marched in and shot those who got in our way. Made them part of our whole." Goldbeak keeps eye contact for a bit, before looking away. He takes a cigarette from his side, and lights it up, breathing the smoke in, before softly letting it out, "It's not like that. We give ponies freedom, give them chances to live better lives, we make their lives better. We give them food, shelter, and community. That's more than they could get elsewhere." She frowns a bit more, and sighs softly, "But that's what the alicorns would say too. They'd say they were better with the Unity, with the hivemind, with their community. I just don't know."\n\nHe nods softly, "It's good to question what we do. We're a democracy. That's what we're all about. But we've freed the alicorns. Now they can vote, now they can think, now they don't have to obey their Goddess." She nods as well, and slowly stands up, leaning against the railing of the catwalk, "But couldn't we have negotiated? Maybe if Unity was treated as a religion by the state, they can only induct members who want to join willingly, and need to release those who don't want to stay. It's just. . . this was something unique, you know? Special, I guess. And now it's gone. Bad, or good, I don't know, but something was here, and now it isn't." He sighs softly, and offers her a cigarette, looking over at her, "It is what it is. Maybe we could have negotiated, I don't know. President didn't do that, though. We're soldiers, we follow orders." She takes the cigarette and looks down, "Yeah. I guess. Just following orders.""
 shatteredhoof_ncr_decisions.4.a:0 "Another Monster Defeated."
 
 shatteredhoof_ncr_decisions.5.t:0 "The Lightbringer's Home"
 shatteredhoof_ncr_decisions.5.d:0 "'We have a situation, ma'am.' Moontalon makes her way down the halls of Stable Two, surrounded by Stable Security, now wearing the uniforms of the New Canterlot Police, 'She's attacked anyone who's come near her, she's, uhh, she's pretty good with levitation, just like her daughter was. There's been a few injuries, no fatalities yet, ma'am. Are you sure you want to deal with this alone?' Moontalon nods, 'Madam President Grimfeathers has entrusted me personally to deal with this. This mare is an important asset to future propaganda efforts, I will take care of her.' The guards all nod, and stand back, while Moontalon makes her way to an open door.\n\nThe end of a broken bottle hits against her leather armor as she enters, a mare stood in the middle of a bedroom, glass of hard cider as her cutie mark, horn lit up bright. The walls are covered in posters of Velvet Remedy, notes taken about Pip-Buck maintenance schedules, all of it covered in a thick layer of dust. The mare's eyes are bloodshot, and dark. She speaks in a wavering voice, 'Get out of here. This is her room! I'm not going to allow anyone else inside it! Get out!' Moontalon looks at the mare, uncaring about the bottle pressed against her chest, 'Little Glass. Nobody is going to mess with your daughter's room. It's going to be made into a museum, preserved, exactly as it is.'\n\nShe shakes her head, 'No, no, no! Museums are meant for the dead!' She throws the bottle down onto the ground, shattering it, stumbling closer to Moontalon, 'My daughter's not dead! You hear me?!' Moontalon looks into her eyes, 'Your daughter was a hero-' The mare shakes her head, 'She's my daughter! Mine! I don't-I didn't. . . She's not allowed. . .' She collapses against the griffon, tears staining her feathers, 'I. . . I loved her, I never told her before she left! I-I'm the last of my family now. . .' Moontalon reaches around the mare, pulling her close, into a hug, 'I'm sorry. Your daughter was a hero. Her loss was a loss to us all.' The mare doesn't respond, her quiet sobs echoing through the corridors of Stable Two."
 shatteredhoof_ncr_decisions.5.a:0 "The Ones Left Behind"
 
 shatteredhoof_ncr_decisions.6.t:0 "Колыбель ужаса"
 shatteredhoof_ncr_decisions.6.d:0 "An old stallion trots after a little filly, her little hooves scampering over the well-maintained tiles of the Museum of Cathedral. The stallion chuckles softly as he struggles to keep up, "Hold on! Your pops can't move so fast!" The filly looks back with a pout, "Aww, come on, I wanna  see the main thingy!" She scuffs at the ground as the older stallion catches up, giving her a small smile, breathing a bit heavily, "Sorry, sweetie, but pop's not in the shape he used to be back in the army. Heh, I still remember back when this place was filled with science mooks. I stood guard as our boys took this place apart for parts." The filly looks ahead, and then back at him, smiling and skipping along, "Did ya fight here, pops?"\n\nHe smiles, following slowly behind her, letting his eyes cross over every exhibit, "Heh, you bet I did, back under ol'President Gawd. I was in my prime back then! I led a squad of ponies through the Everfree to find this place, and do you know what we found?" She looks back and blinks, shaking her head. He smirks, "We found a dragon!" He leans in and roars at the filly, making her giggle softly, as they continue along, "He was big, and mean, and covered with all sorts of bits and baubs. He breathed fire so bright that the sky lit up, like it was noon! Heh, I thank my lucky stars I didn't have to fight him, our colts in the air force took care of him. Or her. I don't remember." He smiles softly, "My squad moved through every hallway here, finding experiment after experiment, protected to the death by Red Eye's cultists. We fought for every inch, but your pops here made sure to clear it all out."\n\nThey come to a stop by the main exhibit, the little filly looking up, eyes widening as she takes it in. A statue of a red stallion, Stable uniform hanging off his back like a cape, stood in front of a painting of a city of the dead, "Woah." She sits down and looks up at it, "Was Red Eye bad, pops? One of mom's friends used to fight for him." He smiles softly, and sits next to the filly, "He was a pony who did bad things. Does that mean he was a bad pony? Well, I think that's for you to decide. Good ponies do bad things, and bad ponies do good things. In the end, doesn't matter. I've known honorable thieves, crooked priests, corrupt politicians, clean salesponies. Good, bad, what happened, happened. And we need to never forget what happened." She blinks softly, and smiles, "I'm never gonna forget.""
 shatteredhoof_ncr_decisions.6.a:0 "History Was Made Here."
 
 shatteredhoof_ncr_decisions.7.t:0 "Remain Buried"
 shatteredhoof_ncr_decisions.7.d:0 ""Well, sir, I'm afraid the Maneframes are, in colloquial terms, utterly fucked sideways." A stallion stands in front of Goldbeak, who listens with a frown, "I knew we should have used less artillery support. It would have cost us lives, but. . . Shit." The stallion smiles, "Shit indeed, sir, but, we are able to recover some information, left in notes and holotapes. It's just to our luck that the Steel Rangers recorded so much. Of course, since this is Stable-Tec HQ, there was a lot to record." He smiles more, "A lot of what we got was off of a stash of Pip-Buck we found, which will be very helpful to study."\n\nGoldbeak nods along, "Summarize the information. If there's nothing valuable here, then I'm going to report it to Gawd, bury the rest, I suppose." The stallion nods, "Well, a lot of it isn't really good, so to say. There's a lot of mentions of other Stables, apparently there were a lot of, uhh, experiments done in them, sir. There's a Stable in Manehattan that forced ponies with different views on technology to work together, one which was ran by an advanced computer program. Umm, there's one that only has fifty stallions? That seems like a recipe for disaster. There's one that contained a whole lot of different species near Canterlot, mostly zebras and ponies. There's a Stable that was supposed to contain the Princesses and, uhh, wasn't going to open until they died, and, well, they're immortal. So. Yeah. Weird there." He looks up from his list, "Stable-Tec did a lot of fucked up shit, sir."\n\nGoldbeak looks at the stallion, and then sighs, "Equestria did a lot of fucked up shit, egg-head. Stable-Tec was no different." He shakes his head, "This history isn't going to help us. It's just going to tear us apart. To think a trusted company could do this. . . it'll sow distrust, if it leaks to the public." The stallion blinks, "Uhh, sir, are we not telling this to the public? Isn't that the whole point of our democracy?" Goldbeak shakes his head again, and turns away, closing his eyes, "They won't know what will harm them. Imagine how ponies will turn against Stable ponies, imagine how those Stable ponies will feel, knowing they were just experiments. Let them think nothing about it. Bury it, bury all of it."\n\nThe scientist frowns softly, "Sir, this is history, imagine what other secrets could be down here?" Goldbeak begins to make his way out of the building, "I gave my orders, now follow them. Some history deserves to be forgotten. Some secrets are best if they remain buried.""
 shatteredhoof_ncr_decisions.7.a:0 "Forget It"
 
 shatteredhoof_ncr_decisions.8.t:0 "Гангстерский рай"
 shatteredhoof_ncr_decisions.8.d:0 "Bullets whizz overhead, a few impacting hastily set up sandbags, as the gangsters lay suppressing fire. Bloodeye, Fire, Mango, and Flanks hide behind the cover, their Griffon commander peeking over, shooting a gangster, before diving back beneath cover, "Can't hold 'em alone! Where's our backup?!" Fire's horn sparks, sending a ball of fire over the sandbags, the sounds of screaming confirming he hit his mark, "Fuck if I know! If we stay here, we're fucked! I don't know about you, Mango, but I'm not looking to get fucked!" Mango frowns around his cigarette, blind-firing his rifle around the sandbags, "Go fuck yourself. If you're the last voice I hear before I die, I swear to Luna, I will kill you."\n\nFlanks spreads a wing, with a helmet sitting on her feathers, tossing it away from the sandbags. The various gangsters turn their fire to the helmet, allowing her to peek over the sandbags, light machine gun chewing up a few enemies, before she's forced to duck back under cover again. She frowns as she reloads, "I'm out of ammo, sir. What do we do?" Bloodeye peeks over again, firing his rifle into another gangster, then taking cover again, bullets impacting the sandbags once more, "I don't know." He takes a second, his eyes looking to the side, where a few enemy bodies lay, Tommy Guns laying beneath them, complete with drum magazines. His eyes light up, "Fire, grab those!" The unicorn looks over, and then sees the guns, grinning as his horn pulls them behind the sandbags.\n\nAll four members of the squad grab a gun, and flick it to full-auto. Flanks licks her lips, "Okay, okay, I'm ready." Mango holds up a hoof, "A second." He takes out a cigarette, which Fire lights up with a bit of magic, "Alright. If I'm going to die with a gangster's gun, I'm going to smoke like a fucking gangster. Let's do it." The four nod, waiting for a pause in the gunfire, before they all peek over cover. Their guns roar with rapid rapport, bullet casings clinking to the ground below as bullets fly to the gangsters, and Fire cries, "Haha, yeah! Suck it you fuckers! How's this feel, huh?!" They chew through the cheap defenses of the gangsters through sheer volume of bullets, and not a single member of the squad stops firing until their guns click dry.\n\nThey look over a field of dead gangsters, their barrels still smoking from their overuse. Bloodeye takes a deep breath, and drops his gun, sitting down, "I should have joined Stern." Mango sits next to him, breathing out a plume of smoke, "I hope that Army Depot is worth it for all this." Flanks shudders out a breath and drops her gun, "This was not worth it." Fire smirks widely, holding his gun proudly, "This was so worth it!""
 shatteredhoof_ncr_decisions.8.a:0 "A Worthy Battle"
 
 shatteredhoof_ncr_decisions.9.t:0 "Вопрос Стойла 32"
 shatteredhoof_ncr_decisions.9.d:0 "Giovanni stands outside of Stable 32, watching with distant eyes as soldiers send ponies out. This Stable was still mostly operational, due to it still being occupied. But its inhabitants made the crime of fighting back and losing against the republic. Thus, has come the cleansing. Clean Stable ponies take their first steps into the wasteland, looking around terrified, as soldiers bark orders to them. Scientists stop some ponies, forcing them into examinations, checking for health and sickness, measuring their skulls, taking their blood, before sending them along. No home awaits them, just the wasteland.\n\nHe swallows softly, before he hears something, the shouts of a soldier that are louder than usual. He rushes over, only to find a soldier pushing a Stable filly against the ground, holding his rifle up at her, "Get back into line!" His talons feel dirty. The stallion shouts again, but Giovanni can't hear the words over the ringing. The filly's eyes are dark. Fear. He can smell the blood. He sees her again, bleeding. His claws tremble. He doesn't remember what happens for the next few moments, but when he blinks, he finds the soldier's throat in his claws, his talons digging into the soft flesh of the pony. Their eyes are scared, just like his. He looks down into the eyes of the pony, and finds himself speaking without control, "Get away from her! S-stop this!" The other soldiers look over, the Stable ponies too. He doesn't see them. He sees nothing but the fear in the filly's eyes.\n\nHe releases the soldier's throat, and pulls his talons back. They're dirty. Covered in blood. His breaths come shakily as the soldier gets up, "Go, go and don't ever come back!" His whole body trembles. The soldier runs away, eyes filled with fear. He tries to breathe. He finds himself unable to. The serf-filly lays in front of him. His legs shake. The world goes dark. Then, a little leg touches his own, and he looks down. The Stable filly looks up at him and sniffs softly, "T-thank you, Mister, but... I can't find my momma."\n\nThe world returns in an instant, and he's finally able to breathe. He finds his cheeks wet. His talons are still dirty, but... He doesn't pay attention to them. He can't. He smiles softly to the little filly, and kneels down close to her, "Don't worry, little filly. Come with me. Let's go find your momma.""
 shatteredhoof_ncr_decisions.9.a:0 "Вот и пришёл конец Стойлу 32."
 
shatteredhoof_ncr_decisions.9001.t: "Breathe"
shatteredhoof_ncr_decisions.9001.d: "His talons feel dirty again. Giovanni sits in a small diner. He drinks a bit of cola, but its flavor is distant. His breathing is shallow, too rapid. The soldier's fearful eyes sit in front of him, rooting him to the seat. The revolver at his side feels heavier than ever before. 'Gio?' He blinks, and the world comes into focus. Regina stands there, besides the table, sitting across from him and smiling softly, 'I got your letter. I'm sorry I wasn't there to support you, up north. Are you okay?'\n\nHe looks at her for a minute, his breathing slowly getting more steady. He closes his eyes and breathes out softly, 'Regina. I'm sorry you have to see me like this. . . again. There was a filly. Near Stable 32. She stepped out of line, and this soldier. . .' His talons clench, digging into his own flesh, before they release, and he opens his eyes, 'I was going to kill him. Right in front of that innocent filly. I was. . .' He looks into her eyes, 'He was so afraid. I saw her again. Looking at me. Bleeding. I couldn't. . . I couldn't look away from her, Regina. I helped the filly find her mother, but. . . but she was still there, and I felt her eyes watching me all the way.'\n\nRegina nods softly, 'I'm sorry, Gio. What happened in that Stable was an atrocity. You can't blame yourself for what you did, for saving a little filly's life. Isn't that what this is all about?' He takes a second, 'It was. Then Rock Solid broke it apart. I don't know who I am, Regina. Am I still a pawn? A hero? A politician? Your friend?' Regina smiles softly, 'You're always going to be my friend. No matter what. You're Giovanni, and you're my friend. Hero, pawn, politician, that's up to you. Nobody's going to tell you what to do. But I'll be here, every step of the way.'\n\nHe looks deep into her eyes, and then looks away, wiping his own, 'Thank you. . . I don't know how I got lucky enough to meet you. I know what I want to do. That filly I saved, I led her to her mother.' He licks his beak, and looks back at her, 'I need to meet her mother. I need to apologize.' She smiles softly, 'Let's do it, then. Together.'"
shatteredhoof_ncr_decisions.9001.a: "In, And Out"
 
 shatteredhoof_ncr_decisions.10.t:0 "Уроки автоматизации"
 shatteredhoof_ncr_decisions.10.d:0 "Stable 29 proved difficult to take, as many of the Stable's defenses were still active, being used to fend off the raiders who owned the Stable for too long. It took a few lives, but piece by piece, the Stable was able to be taken, and, in even better news, it wasn't damaged in the fighting that much. Salvage teams have been sent to strip the Stable for supplies, finding many pieces of valuable technology. Circuits, batteries, and complex metals were stored in the Stable, alongside many other useful things.\n\nIt's clear that something bad took place here. Skeletons litter the inside of the Stable, having been killed quickly. It was only when our salvage team started examining the Stable's Maneframe that we learned why. Apparently, this Stable was supposed to be managed by an advanced AI, which was programmed to conserve resources and hopefully guide ponies to repopulate nearby Manehattan. Issue is, a few decades in, a water chip broke, meaning the Stable had limited water. Before the maintenance ponies could fix it, the Maneframe underwent many calculations, deciding that the ponies would eventually drink all the water, and deducing that the best way to conserve water would be to eliminate all consumption of it. We don't know exactly how it killed all the ponies, but whatever way it chose, it was efficient. Already a sci-fi story based off this tale has begun to be sold in stores across New Canterlot, called Aperture. Ratings are very good."
 shatteredhoof_ncr_decisions.10.a:0 "Never Trust AI."
 
 shatteredhoof_ncr_decisions.11.t:0 "Хаб МинМорали"
 shatteredhoof_ncr_decisions.11.d:0 "В глубине руин Мейнхеттена лежит одно примечательное здание, содержимое которого нас весьма удивило. Министерство Морали во время войны отвечало за противодействие шпионажу зебр, а также обеспечивало лояльность граждан Эквестрии и их преданность направленным на войну усилиям. Мы ожидали, что найдём в их хабе центр управления очень обширной системой наблюдения. Или же камеры для пыток и извлечения памяти. Но оказалось, что это здание было заполнено поздравительными открытками и двухсотлетними тортами.\n\n Похоже, что Министерство занималось поистине монументальной задачей по отслеживанию и празднованию дней рождения каждого жеребенка в Мейнхеттене. Если честно, мы и не знаем, что об этом думать. При зачистке здания нам пришлось разобраться с большим количеством спрайтботов, а также мы нашли останки самой министерской кобылы Пинки Пай. Мы похоронили её там, где две сотни лет назад располагалась ферма камней её семьи."
 shatteredhoof_ncr_decisions.11.a:0 "Ладно."
 
 shatteredhoof_ncr_decisions.12.t:0 "Брыклинский Крест"
 shatteredhoof_ncr_decisions.12.d:0 "Once the main base of operations for the Manehattan Steel Rangers, Bucklyn Cross is the common name given to a large bridge over the Lower Mare River. When the Manehattan Contingent arrived to Manehattan so long ago, it was over this bridge that they pushed the Manehattan Raiders, with the Steel Rangers taking the bridge as their own headquarters. Due to the importance of the bridge to travel over the Lower Mare River, it seems like the Equestrians built a military base, hidden in the supports of the bridge. It was in this small base where the Rangers roamed, and stored all their equipment.\n\nSadly, the Rangers held us off long enough to pick Bucklyn Cross almost entirely clean. They've taken their guns, armor, and all of their data along with their technology, leaving behind just crumbs. Luckily for us, Steel Ranger crumbs are still a massive boon, consisting of small pieces of technology that we can take apart for use in our industry. Though we didn't gain as much as we'd want, this was still a worthwhile endeavor."
 shatteredhoof_ncr_decisions.12.a:0 "Another Old Ruin Dealt With."

 shatteredhoof_ncr_decisions.13.t:0 "Проигранная война"
 shatteredhoof_ncr_decisions.13.d:0 "Провал наступления доказал, что Разбитое Копыто слишком слабо, чтобы вести нас за собой. Мы должны решить: остаться ли нам верными союзниками или разорвать цепи, пока ещё есть такая возможность."
 shatteredhoof_ncr_decisions.13.a:0 "Готовить войска к удару."
 shatteredhoof_ncr_decisions.13.b:0 "Сохранить верность."
 shatteredhoof_ncr_decisions.13.c:0 "Уйти по-тихому."

 shatteredhoof_ncr_decisions.14.t:0 "Война за независимость"
 shatteredhoof_ncr_decisions.14.d:0 "Сейчас или никогда."
 shatteredhoof_ncr_decisions.14.a:0 "К оружию!"

 shatteredhoof_ncr_decisions.15.t:0 "Шёпот предательства"
 shatteredhoof_ncr_decisions.15.d:0 "Пока отголоски неудачного вторжения всё ещё сотрясают нашу нацию, поползли слухи, что наши союзники готовят удар в спину."
 shatteredhoof_ncr_decisions.15.a:0 "Мы должны укрепить границу с державой [FROM.GetNameDef]."

shatteredhoof.7001.t: "Tributary No More"
shatteredhoof.7001.d: "Giovanni stands deep in the heart of Shattered Hoof, his feathers still dirty and ragged, his mind far away. He looks down, his talons still caked with dried blood. His ears still ring slightly. It's complimented by the pounding of bullets and war drums pulsing through his head. '-to me, chick?'' He blinks, and looks across from himself. Gawdyna Grimfeathers, a look of annoyance on her face. She frowns, 'I said, are you listening to me, chick? Tell me what happened in Corona. Why have the Tribe cut off communications? Where's your commanding officer?'\n\nWords flash through his mind, and his throat goes dry, raw from his cries. He speaks without realizing, 'Kaisercrest is dead, Madam Grimfeathers. He. . . we arrived in Corona in the middle of a raid from the Amethyst Liberation Army. We tried to fight as best we could, but we were too few. We didn't have enough bullets, enough explosives, enough Talons.' He takes in a shuddering breath, 'They picked us off, one by one. We had a last stand behind an old shack. They flanked us. It was just me and Kaisercrest, and he. . . he ordered me to retreat, to save myself. He held them off.' He gulps softly, his mouth dry, 'I'm sorry. We were unable to do anything. We. . . we lost Corona. The Tribe doesn't think we can protect them anymore. I'm sorry.'\n\nShe looks at him, his talons digging into her desk, feathers ruffling. Then, she looks into his eyes, and breathes out a sigh, 'You did the best you could, chick. Giovanni, right? You did your mission, you followed orders, you fought to the last griff, that's what matters. We're overstretched and you didn't have the support you needed.' She sits up, 'You'll get a medal once all is said and done. If the Corona Tribe thinks they can make do without us, then let them try. When the Liberation Army overruns them, they'll come begging for us to help. They'll ask for help from the Hero of Corona. If they don't, then we'll make them. You're dismissed. Bloodeye needs help finding Raider stashes. Stay safe, chick.'\n\nHe looks at her for a minute, unmoving, then he speaks softly, 'A medal won't bring them back.' She looks at him with a tight frown, 'No. But ponies love a war hero with a shiny medal. I don't care if you don't want it, chick, that medal's gonna be a symbol to Corona that we care about what happens to them. It's a symbol that we've changed. You're dismissed.' He looks at her for a second more, before he slowly nods, and exits."
shatteredhoof.7001.a: "Curses!"

shatteredhoof.7002.t: "A New Opportunity"
shatteredhoof.7002.d: "The dead litter the fields of Corona, poor raiders taken down by weapons and explosives better than any they've faced before. The leader of the Corona raid trots past body after body, bullets whizzing by his form, fired by a griffon hidden behind cover. Ribbons of blood fill the sky as the bullets find purchase, raiders collapsing, bleeding out into the useless soil below. Yet still, he trots forward. A bullet hits his armor, but it bounces off before it can piece. Yet still, he trots forward. Then, finally, a rapid 'click' fills the air, and the bullets come no more.\n\nHe rounds the haphazard sandbags, an elderly griffon behind them, machine gun smoking from overuse. Another griffon flies away in the distance, but it doesn't matter. The elder looks up to the leader, spitting blood onto the ground, and grinning, 'What are you waiting for, colt? You want me to be-' The leader silences the elder once and for all, a bullet piercing his skull. He smells the air, blood, smoke, death, and freedom in the air. He looks to the surrounding raiders, 'Control the area. Our liberation is not over yet.'\n\nBehind him, a mare shrieks, falling to the ground, where her filly lay, dead. The leader turns to face the mare, approaching her and speaking softly, 'Another fallen soldier in our crusade for freedom, my dear. Mourn her, but do not regret the path she has taken. She died that we might be free another day.' He rests a hoof on her shoulder, and then looks around, a scowl on his face, 'Change of plans! Look at what these Shattered Hoof menaces think they can do! Killing a filly! All because they would rather oppress than ever allow the taste of freedom to grace this land! No more, my friends!' He lifts his pistol, 'We have taken down the vanguard of the enemy forces, but there are many more yearning for freedom! We shall not stop until all of Corona has tasted true freedom! We shall not stop until we have brought justice to the monsters who would do this to one of our own! We shall not stop, and we shall take no steps back! Are you with me, fellow lovers of freedom?!' From all around the field, a cheer comes, chems taken and guns reloaded, ready to take the rest."
shatteredhoof.7002.a: "For Freedom! For Liberation!"

shatteredhoof.7003.t: "Sherhoof Declares Independence"
shatteredhoof.7003.d: "The staccato sound of gunfire still rings all across Shattered Hoof, as pockets of raiders, loyal to Deadeye, hold out against overwhelming odds. The dead lay across the desert sands, their blood turning the sands red, crows and vultures picking at the flesh. Sheriff Steel Wall steps on one body, followed by four deputies, wearing long dusters. His eyes look ahead, above the death and blood, to a group of griffons and a group of ponies exchanging gunfire. Both sides take cover to reload by the time they get close, and his voice is loud enough to be heard by both sides, 'Listen up!'\n\nRaiders and Griffons both turn to look at the approaching Sheriff, as his deputies walk into the No Pony's Land between both sides. There, they place down bags of food, guns, bullets, and caps. Steel Wall speaks, as both sides look at the loot, 'I made a promise to Deadeye that we would deliver tribute for protection and autonomy. Now, Deadeye might not be around anymore, but I'm a stallion of my word. I told him I would have it delivered today. Here it is.' He nods to the loot, 'As promised, food, guns, bullets, caps. Now I don't rightly care which one of you is going to win today. I don't care if you end up dying. This is my tribute, take it, or leave it, it don't trouble me either way. But I got a message for you both to take, to Gawdyna Grimfeathers, to whatever sad sack leads the raiders now.'\n\nHe whistles, and from behind, two more deputies approach. Next to the loot, they throw the bodies of a raider, and of a griffon, half decomposed already. He smirks slightly, 'I upheld my side of the deal, and you haven't. So I'm calling the deal off. Let this be a symbol of our new deal going forward. Come into Sherhoof with bad intentions, and you're not leaving alive. Come to try and raid from us, and you're not leaving alive. Come to press-gang our ponies into your little scuffle, and you're not leaving alive. The settlers of Sherhoof will make sure it's the last damn mistake you ever make.' He smirks a bit more, 'You tell your leaders that Sheriff Steel Wall said that. Tell them if they have an issue, they can come say it to my face.' He then tips his hat to both sides, and turns around, leaving, 'Have fun killing each other.'"
shatteredhoof.7003.a: "Your Tyranny Is Dead!"

shatteredhoof.7004.t: "Formation of the Greenway Compact"
shatteredhoof.7004.d: "Gawd writes yet another report in her office, a nearby clock's ticking her only other companion. At least, until the door to her office opens up, and Bloodeye enters in. He gives her a smirk, 'Damn, ma'am, I see we got you doing only the hardest work in the whole army. Get any papercuts recently, eh?' Gawd looks up, and rubs her eyes, groaning, 'If I could be out there shooting a raider, trust me, I'd really rather do that. Nobody ever mentions how much paperwork there is behind leading a country.' Bloodeye smirks more, 'A tragedy, ma'am, next time a raider has his gun against my head, I'll make sure to pray for your salvation from paperwork.' She groans and rubs her eyes more, 'Go fuck yourself, Bloodeye. Are you here just to torture me, or do you have an actual reason?'\n\nHe chuckles, 'Is that an order, ma'am? Ah, I'm just fucking with you. Yeah, I got something serious. Figured you'd want some levity before you feel like bashing your head against a brick wall.' He clears his throat, his face losing any grin, 'It's the Pure, and Greenway. Apparently they decided to rip us off, because they're also forming an alliance, like we plan to. Something seems to have given them the impression we're going to invade, and eh, I guess a broken earth pony supremacist is right twice a day. But yeah, my scouts saw the Pure selling unicorns who didn't break their horns to the Greenway, apparently they're making a killing from selling 'employees' to Neocastle. They're going to be an issue.'\n\nGawd nods softly, and sighs, 'Alright. We can't waste much more time on just rebuilding, or they're going to outgrow us. Keep your eyes on the north and west, Bloodeye, I'll see if I can't get us some extra guns smuggled from Neocastle before they cause an issue. Get Moontalon's best on capturing a few slavers, see if we can't get some intel on their positions and defenses. Our plans just got a lot more complicated.' Bloodeye snaps a quick salute, and grins, 'On it, ma'am. I'll leave you to your torment.'"
shatteredhoof.7004.a: "Oh No"

shatteredhoof.8001.t: "Terms and Conditions"
shatteredhoof.8001.d: "'Dear Gawdyna Grimfeathers:\n\nI'm sure you have recently received a letter accepting your alliance. That's, so to say, the public letter. I'm writing to you now, leader to leader, because I want to make a few things clear about our 'working relationship'. New Mango is not a puppet state or some tributary for you to boss around. Your Talons are only to enter my country under my approval, and my thestrals are allowed to enter your country the same. Our guns and factories are not to be taken from or raided, if you want something, you ask for it. We are not a lesser power in this alliance, we are equals. If you should come to treat us as less than equals, then we will leave.\n\nI want to make a few other things clear. New Mango is going to profit from this. The only way that we are going to stick around long-term is if you make the lives of the average thestral better. Otherwise, you and I both know that as soon as the South is safe, we're leaving. New Mango is not interested in being part of Shattered Hoof either, if you try to annex us, then we will not go down without a fight. Us thestrals have been abused by both griffons and other ponies before, and I will never willingly put us in a position to be abused again. Stay respectful of us, and maybe this partnership will be beneficial to both sides. Don't betray us like you did to Deadeye, Grimfeathers, or you'll come to regret it.\n\n-Light Narrative.'"
shatteredhoof.8001.a: "Allies Of Convenience"

shatteredhoof.8002.t: "Letter from Gawd"
shatteredhoof.8002.d: "Sheriff Steel Wall sits, nursing a glass of beer in his home, when the door opens up. He glances over, a deputy entering with a small grin, 'Evening, Sheriff. Hope I'm not interrupting anything.' He takes another sip, and then places his drink, facing the deputy, 'What is it, Deputy Spittoon? Slavers from Greenway?' Deputy Spittoon reaches into his dark brown duster, taking out a letter and smirking, 'Message from one Gawdyna Grimfeathers. Took the liberty of reading it for you already, Sheriff, its, heh, it's quite funny.'\n\nHe rolls his eyes and takes the letter, looking it over, muttering as he does, 'Due to your murder of one of my Talons, heh, and the shared danger around us, I, Gawdyna Grimfeathers, ask that you reenter an agreement like you had with Deadeyes.' He chuckles and shakes his head, 'Heh, is this supposed to be serious? She's getting mad that I killed a Talon what tried to steal from us? She thinks she's Deadeye? I ain't afraid of her, on top of that, I don't even trust her to keep her word. She already betrayed one pony, she'd just betray us.'\n\nDeputy Spittoon grins and nods, 'Exactly my thoughts, Sheriff. I've got one of her Talons, fella by the name of Goldbeak waiting back in my town. Should I tell him anything specific to say to Gawdyna?' He nods, 'Yeah, yeah, I got some words in mind to tell her. You tell Mister Goldbeak to tell her that I made the terms of my deal crystal clear. You stay off my land, you don't die, you come onto my land, you're deader than a doornail. Tell her that if she tries to ask anything like this again, I'll shoot her myself.' Spittoon nods and smiles, but Steel Wall speaks up, 'Oh, and one other thing.' He gives the letter back, 'You tell her to shove that letter up her ass, because it's a crock of shit.'"
shatteredhoof.8002.a: "Make Sure To Say Those Exact Words."

shatteredhoof.8003.t: "The Sheriff's Response"
shatteredhoof.8003.d: "Goldbeak stands across the room from Gawd, speaking to her, 'Deputy Spittoon told me that the Sheriff said, and I quote, 'We made our deal clear, you stay away, you don't die. You try to do this again, and maybe I won't be so merciful.' And he said, to end with, 'to shove this letter up your ass, because it's a crock of shit'.' Goldbeak looks at the frowning Gawd, 'So basically, he rejected it. But at least he considered the offer enough to actually insult us, which means he gave it thought.'\n\nGawd taps her talons against her desk, and rubs her eyes, 'He thinks we're just another Deadeye. I thought he was supposed to be reasonable!' She sighs, and looks up, 'I don't understand. I was forceful and assertive with my offer, I made it clear that I was in a position of strength, that I acknowledged his earlier killing of a Talon but was willing to forgive it. It's just like negotiating a contract, but why isn't it working?' Goldbeak gives her a nod, 'If I might, ma'am, the difference between this and a contract is that one is economics, and this is politics. In economics, the one you're negotiating with doesn't care what you act like, they care for your arms and armor. But if we're asking Steel Wall to help us, we need to make it clear that his help is appreciated. That we're willing to go on as equal partners.'\n\nShe sighs, and then nods, 'Right. I'm not just a Talon anymore. Okay, maybe he will give us a second chance. He's worried we're going to betray him, that we're just going to be another Raider warlord, then fine, we'll make it clear we won't. I'll write a new letter, but. . .' She trails off, 'Goldbeak, you're a lot better at this than I am. I don't want you to write it, but just give me pointers, okay? I don't know how you're so good at this.' He grins slightly, 'Well, ma'am, my mom always said I had a beak of gold, and a tongue of silver. I'll help you out.'"
shatteredhoof.8003.a: "This Time, Humble"

shatteredhoof.8004.t: "Another Sign from Gawd"
shatteredhoof.8004.d: "Steel Wall slowly reads yet another letter, the watchful eyes of Goldbeak and Deputy Spittoon on him. It's written far better than before, sure, there are a few insults here and there, but nothing serious. It's humble, to an extent. He sets down the letter, looking up at the griffon in his house, 'Gawd must be desperate if she sent you again, Mister Goldbeak. I have half a mind to send you back to her in a coffin for pestering me so much.' Goldbeak looks at him, 'Your other half?' Steel Wall nods, 'The other half says that I'll be leaving my house in Greenway or Fillydelphian chains if we try to stand alone. We paid tribute for a reason.'\n\nGoldbeak nods softly, and speaks again, 'Sheriff Steel Wall, I respect your honor as a lawstallion. Sherhoof would be chaos and anarchy if it weren't for you and your deputies around to keep the peace. Shattered Hoof was chaos and anarchy, before we took charge. You see Gawd as another Deadeyes, but she's not, she's another you, Sheriff.' Steel Wall smirks, 'World already has too many of me.' Goldbeak grins slightly, 'Perhaps so. But regardless, us Talons have already cleaned our lands of much crime and disorder, bar the few raiders who willingly joined us. We both desire the same thing, a strong, stable, peaceful south, Sheriff. Also, if I might say. . . I was quite the fan of the insult you included in your last response. Insults are a craft that southern ponies are experts in.'\n\nSteel Wall smirks a bit more, and looks down at the letter, tapping his hoof. Deputy Spittoon speaks up, 'If I might, Sheriff, I think the griff's got it right. There hasn't been a single raid since Gawd took over.' Steel Wall taps his hoof some more, 'Alright.' He looks up, 'Alright. If Miss Gawdyna wants Sherhoof as part of her little alliance, she needs to prove it. Sheriffs don't work alongside criminals, and your nation's army is still filled with ex-raiders. You want to bring justice to the wasteland, griff? Prove it. Have Gawd disband those Raider divisions, and give them proper trials. Bring justice in your lands, and maybe I'll believe you.' Goldbeak nods his head, 'I find those terms acceptable. I'll deliver them to Gawd right away.'"
shatteredhoof.8004.a: "Let's See How Sincere She Is"

shatteredhoof.8005.t: "Demands from Sherhoof"
shatteredhoof.8005.d: "Goldbeak stands once more in Gawd's office, this time with a calm smile on his face, 'I talked to the Sheriff and one of his top Deputies, delivering them your letter. It was well received, but they want more than just words before they agree to an alliance. Sherhoof values justice and order above all else, and they want us to prove that we care about it as well. Our army still is composed of many raiders who stood down and joined us when Deadeye was killed, these raiders are criminals, many have committed crimes against our citizens, and Sherhoof's. Sheriff Steel Wall will join us, if you disband these raider divisions, and force them to face trials for their crimes.'\n\nGawd frowns, looking down, her talons clacking against each other, 'He knows that The Pure and Greenway are going to come after us at any minute, right? He knows that the Amethyst Liberation Army is knocking on our door, right? Why would I say no to some raider scum who want to throw their lives away for us! Every raider that isn't on the frontlines is a Talon or a citizen instead, who are going to die in their place!' She leans back and shakes her head, 'We have more than enough troops, we could just invade Sherhoof, and seize their land for ourselves.'\n\nGoldbeak frowns softly, '. . . If you order that, ma'am, then I will see it done, but I must ask you to reconsider. Sherhoof will provide us with far more ponies than the raiders in our own country. Even if we did invade them, their resistance against our rule would be a black hole for good soldiers and good weapons to disappear into. We're supposed to be starting something new here, aren't we? This is our chance to show that we're serious. That you aren't Deadeyes. That you aren't Stern.' Gawd frowns more, closing her eyes. When they open, she's decided what to do."
shatteredhoof.8005.a: "Disarm, Hold Trials"
shatteredhoof.8005.b: "Sherhoof Will Bow"

shatteredhoof.8006.t: "Sincerity at Last"
shatteredhoof.8006.d: "Deputy Spittoon and Sheriff Steel Wall stand in the middle of the city, watching the limp body of one of Shattered Hoof's raiders, swaying in the wind. Spittoon smiles, 'I'll be honest, Sheriff, I didn't think that the old bird would ever actually agree to this. I thought that letter of her's was all huff and puff, but turns out she's got plenty of blow to give. Even gave us a nice gift to help decorate the town's gallows, how sweet of her.' He chuckles.\n\nSteel Wall chuckles slightly, and nods, 'Noose hasn't had enough practice lately, was worried she might lose her touch over scum's necks. I'll have to thank Miss Gawd for giving her a chance to practice.' He nods again, and smiles ever so slightly, 'I think this is the start of something greater, Spittoon. Maybe, together, we'll be able to make the South a better place. I don't think I'll have much time to talk to y'all deputies once the going gets rough, so I want to make you a promise, Spittoon. If Miss Gawd ever breaks her promises, ever betrays the ponies of the South, then I'll be the first and best to stand against her.'\n\nSpittoon nods softly, 'I trust you, Sheriff. If she betrays us, you do whatever you need to do to bring her down. Work with whoever you need to work with. Punish her for smothering this dream. So. You're gonna agree to her offer?' Steel Wall nods, 'In a few minutes, I'm gonna start my way north to meet with her. Unless some power beyond my comprehension decides to take control of me and do something far outside of my character, yeah, I think I'm going to agree. I'm going to get going, Spittoon, stay safe.' Deputy Spittoon nods, 'That's silly, Sheriff. What type of god-like being would want to turn a peaceful pony of your word like you and turn you into a miserable warmonger? They'd have to be real fucked up to do that.'"
shatteredhoof.8006.a: "Didn't Think The Old Hen Had It In Her."
shatteredhoof.8006.b: "I'm Real Fucked Up And Want War!"

shatteredhoof.8007.t: "Birth of the Azurian Alliance"
shatteredhoof.8007.d: "Steel Wall isn't the fancy type, showing up at the border wearing his uniform and hat. Gawd isn't the fancy type either, sitting across from him in her armor, the two uniformed creatures looking at each other from across a table, set up directly on the borderline between Shattered Hoof and Sherhoof. Steel Wall breaks the silence, 'I am here on behalf of the settlers of the towns of Sherhoof, as a representative of the deputies and all other lawful ponies. I'm here, Grimfeathers, because I think you're a reasonable hen. You've already brought justice to the raiders infesting your army, showing you're serious. But I won't abide you become a dictator, and I won't sign this agreement with a dictator. On behalf of Sherhoof, I come with a request. Our request is simple. You create a formalized system of governance, a system that is not merely the rule of the strong and savage, and you make Shattered Hoof a proper country. We also expect that when we fight the Greenway Compact, that Sherhoof be given a share of land equal to Shattered Hoof, to end the dominance Shattered Hoof has had over the region alone. I'm not going to leave this table until these demands have been met, Grimfeathers. So let's bargain.'\n\nGawd's eyes stay locked on the stallion's for a minute, neither of them faltering for a second. After that minute of silence, she gives him a small nod, 'I think I can accept those terms. I wouldn't overthrow raiders just to become a raider myself, or a dictator.' Her talons tap across the desk slowly, 'Many of my Talons have ancestors who come from a place across the sea, back in Griffonia. Cloudbury. There was a revolution in the Empire, and those revolutionaries fled north to Cloudbury when they failed. There, they created the system of 'Republicanism', the idea that a leader is a representative, chosen by the commoners. I'm sure you've heard of The Republic to the north, similar system, stable society, it'll be a system that lasts long after I'm gone.'\n\nSteel Wall raises an eyebrow, 'A republic? You sent your Talons to die, just to make a republic? What if you get voted out? You'll need to forgive my skepticism, Grimfeathers.' She leans back in her seat, 'Make it impossible for me to be voted out, for the first election, at least. Announce elections too quickly for others to run. But what else would I do? Monarchy? You must not have met my chicks if you think I'd trust them to be leaders of this place. Dictatorship? You've already made it clear that's not an option. We'll be a republic, just one that's slow, and steady.' She grins ever so slightly, 'A republic is like a bolt-action rifle. If you move too quickly, it'll get jammed. If you move too slowly, you're going to die. You need the motion to be smooth. If I let others run for this first election, it'll jam the system. We need to introduce the idea of voting to common ponies first, then, give them options. In addition, we will accept the split of land you mention, much of Greenway will be administered by a Sheriff of your picking. Is this a fair compromise, Sheriff Steel Wall?' He takes a minute, and then nods, 'The settlers of Sherhoof accept this proposal, Grimfeathers. Don't make me regret this.'"
shatteredhoof.8007.a: "Hurrah!"

shatteredhoof.8008.t: "Azuria's New Order"
shatteredhoof.8008.d: "Steel Wall and Gawd meet once more at the table on the border, a small shelter set up around it, blocking out sheets of rain that pour down from above. Gawd grins slightly, 'I got word from one of my finest Talons that the last bit of resistance has just fallen in the Compact.' Steel Wall nods, 'My deputies have been rounding up the ringleaders of the slavers and the worst of the earth pony supremacists, they'll be given proper trials and summary executions. I have to admit, I had my doubts when we first met, Grimfeathers, but I think that, for once, I'm a bit hopeful.'\n\nShe smirks, 'I'm touched, Steel. Speaking of when we first met, we discussed and signed an agreement. Shattered Hoof will be taking the border states of both Greenway and The Pure, The Pure will be under a reconstruction government operated by me, Greenway will be run by one of yours. I know these terms are a bit different than we discussed, however, we lost the majority of the casualties in this war, and my Talons would have my head if we didn't get any actual land. The lands we take aren't of much economic productivity, though. I take it these terms are acceptable?'\n\nSteel Wall nods, 'It is acceptable, Grimfeathers, mostly because you asked me, and didn't surprise me with it. Now, for Greenway, I have just the one in mind to take it over. Deputy Spittoon has worked closely alongside some of your Talons during the war, and before it. He's a stallion of justice, and values nothing more than the safety and well-being of ponies. He'll be the breaker of chains in Greenway.' She grins softly and nods, 'That's the one Goldbeak met, isn't it? I find that term acceptable. Who will govern the Pure is still being decided, but it will be someone good. Maybe Moontalon will work, she's good at dealing with things quietly.' She then offers her claws, 'Do we have an agreement, Steel Wall?' He takes her claw, and shakes it, 'We do, Grimfeathers.'"
shatteredhoof.8008.a: "A Just War"

shatteredhoof.8009.t: "Griffon Dreams in Pony Lands"
shatteredhoof.8009.d: "Giovanni stands on stage, a medal on his chest, looking out over the crowd of Talons and ponies alike. Cameras flash and ponies cheer. He flinches at each flash, the rumbling of explosives pounding his head, the taste of blood. His breathing is shallower by the second, his eyes locking onto a random filly in the crowd, his talons feeling dirty. He's interrupted by a small hit to his side. He looks to his side, seeing a hen standing there, medals covering the front of her uniform, giving him a soft smile. Regina Grimfeathers speaks softly, 'I know the crowd's a lot to handle, Hero of Corona. Just hang on for a little bit more, okay? The medals aren't for us. They're for them.' He shakily nods, taking in a deep breath, memories threatening to overtake him. The soft feeling of Regina's tail against his side keeps him in the present.\n\nGawdyna Grimfeathers steps onto stage, stepping up to a small podium, speaking into a microphone, 'Greetings, citizens of Shattered Hoof, members of the Alliance. I would like to take a moment to thank our recipients of awards today. Giovanni Guiseye, who bravely fought hopeless odds to try and defend the ponies of Corona, a true hero of our nation. And my own daughter, Regina Grimfeathers, who led a wing of Talons in a covert mission, freeing hundreds of unicorn slaves in The Pure, and arming them in a mass rebellion. These two griffons, I am proud to have under my command, I am proud that our nation can produce such good examples of heroism. It is the actions of the common griffon, the common pony, that truly defines this nation.'\n\nThe crowd applauds, as Giovanni looks at Gawdyna, eyes hollow as she speaks, 'It has always been the common griffon and the common pony who defines a nation. It is not Red Eye who powers the factories of Fillydelphia, it is the enslaved masses, it was not the noble who pushed on the Empire, it was the common griffon, and it was not Luna who fought the war, it was the common pony! As we move forward as a nation, I want us to remember that we are not defined by me, or by any other leader. We are defined by the common blood, sweat, and tears, and the common hero! It's for this reason I'd like to announce that, once the South has been stabilized, our nation will reform into a proper republic!'\n\nRegina smiles widely, clapping her claws together, while the crowd erupts into cheers. Giovanni stares on, and speaks softly, 'We're just her pawns.' He looks at Regina, and then shakes his head. While the crowd cheers for Gawd, Giovanni leaves the stage, head pounding, ears full of whispers and screams."
shatteredhoof.8009.a: "Pawn To B4."

shatteredhoof_ncr.1001.t: "Same Demand for 1000 Years"
shatteredhoof_ncr.1001.d: "'Dear Gawdyna Grimfeathers.\n\nIt has reached my attention recently that you have been trying, more and more, to integrate New Mango into your country. I can appreciate that us thestrals are a desired commodity, I'm sure you would love to conscript us to our last to save the lives of your griffons, or that you'd wish to throw us into your factories like Red Eye's slaves. Truly, I can appreciate it, you are a great leader, it is only proper you would take inspiration from what Celestia and Luna did to us. However, I have one response to your attempts; leave us alone.\n\nThestrals have languished under the control of foreign powers for centuries. Equestrian imperialism was done with thestral blood, Equestrian factories were filled with thestrals kept starving and feeble, the less said about what Nightmare Moon did, the better. When I agreed to this alliance, I made something as clear as a crystal pony, but it would seem I have to repeat it. New Mango is not, and will never be, interested in joining Shattered Hoof in anything more integrated than an alliance. Normally, I would draw out of this alliance for this particular insult against my country's sovereignty, but I am willing to give you a mulligan. Leave my country alone, and I'll forget about this trespass. Try to integrate us again, and you lose us forever.\n\n-Thank you, Light Narrative, independent leader of the independent state of New Mango.'"
shatteredhoof_ncr.1001.a: "We Would Be Stronger With Them"
shatteredhoof_ncr.1001.b: "Grant Them Their Opt-Out"

shatteredhoof_ncr.1002.t: "They still persist"
shatteredhoof_ncr.1002.d: "Light Narrative looks down at a letter on his desk, having read it over ten times by now. The letter obviously was written by someone like Goldbeak and not Gawdyna herself, its far too humble and far too convincing to come from the old hen. Yet still, many of its words linger in Light Narrative's mind. Promises of freedom and friendship, a state where the thestrals could finally live as one with other species, rather than separate or discriminated against. It's a compelling offer, a hopeful dream, reminiscent of all the nice promises of Luna and Nightmare Moon, long ago. Freedom, equality, friendship. But Celestia sold that lie with just as sweet a tone. The smiling imperialist, Celestia's moniker in many thestral circles, who's to say Gawdyna didn't take inspiration from that?\n\nThe door to his office opens, as many thestrals filter in, elders and young, though none as old as the ghoul himself. He nods, 'Moonsingers, I'm glad you were able to come. I'm sure you've looked over the letter just as I have. As secular leader of this thestral nation, I must admit, it is a good promise. As religious leaders, I thought it best that together, we charter a course for thestral-kind.' He places his hooves on his typewriter, 'Let's get to drafting an agreement.'"
shatteredhoof_ncr.1002.a: "Let's See How Friendly They Really Are..."

shatteredhoof_ncr.1003.t: "144 Points of Demand"
shatteredhoof_ncr.1003.d: "Dear Gawdyna Grimfeathers.\n\nI'm sure you have already received our notated list of one hundred and forty four demands for further integration into Shattered Hoof. I'm sure you'll have no reason to object to most of them, provided your letter you sent us was as truthful as you claim it to be. However, leader to leader, I would like to express the reasoning for why some of these demands are non-negotiable. You see, thestrals have, many times before, been technically equal under the law. But a race where two ponies start at the same point is not fair, if you bludgeon one's leg with a hammer first. Thestrals have long been discriminated against, and despite laws preventing it, it is clear that for the near future, we will still be discriminated against.\n\nIn the past, in Marelem and Mango both, nobles and industrialists saw fit to destroy thestral homes, and replace them with factories, polluting the lands, choking our foals. Your industrialists will do the same, this much is assured. For this reason, we demand that every construction on our ancestral lands, or on lands housing majority thestrals, must be approved via majority vote from the Moonsingers and I. Similarly, in previous generations, thestrals have been pushed out of the seats of power by the majority. To prevent this, and make sure thestrals are always represented, we demand ten percent of all seats in the Senate be thestrals, rounding up, not down. Finally, Luna's most nefarious lie she sold to my species was as a great liberator. She sold the Great War as the only way to protect our ancestral homes from the striped menace, and in doing such, she radicalized hundreds of thousands into the military. I'm sure you weep over every griffon you lose, yet would struggle to shed a tear should a bat die instead. Feathers over leathers, after all, right? For this reason, and for the preservation of thestral ancestral beliefs, we demand that all thestrals who are engaged in religious studies, or who are part of the clergy, are to be exempt from any and all conscription. I hope that you are as friendly as your letter claimed you were, Gawdyna Grimfeathers. Don't make me regret drafting this letter.\n\n-Light Narrative.'"
shatteredhoof_ncr.1003.a: "Sign The Moonsinger Accords"
shatteredhoof_ncr.1003.b: "We Could Always Threaten Them Into Compliance"
shatteredhoof_ncr.1003.c: "Nevermind, Give Them Their Opt-Out"

shatteredhoof_ncr.1004.t: "Threats from Junctiontown"
shatteredhoof_ncr.1004.d: "'How the hour has come at last.' Light Narrative looks down a letter from Gawdyna Grimfeathers. Refusing the Moonsinger Accords, amassing troops on the border. A radio on his desk flicks to life, the voice of a stallion coming tough, 'Light Narrative? This is Sheriff Steel Wall. Is what I've heard true?' Light looks over, and speaks into a microphone, 'Steel Wall, a pleasure, I'm sorry we weren't able to meet under better circumstances. Yes, what you've heard is probably true. Gawdyna has gone against our terms and conditions, and has started to move against us. An intimidation to try and force us into unification under her. Or, in terms you might understand, trying to make us a tributary.'\n\nSteel Wall takes a second to speak from the other side, '. . . Light, it's up to you what's going to happen right now. If the thestrals stand against Gawdyna, then the good ponies of Sherhoof will as well. It'll be a bloody war, but it's not the first time Sherhoof's fought for its place in the sun.' Light nods and speaks back, 'Nor the thestrals for their place in the moon, my friend. I thank you for standing beside us in our time of need. Not many ponies would die for the sake of a thestral.' Steel Wall responds after a minute, 'I'll be honest, Light, I don't give a shit if you're a thestral or a fire-breathing alicorn. I made a promise that if Gawd ruined this, then I'd be the first against her. And I'd stand alongside anyone to make her regret this.'\n\nLight takes a second, smirking softly, speaking back into the microphone, 'Your comparisons are quite flattering, Sheriff Steel Wall. Truly, the art of insults is a specialty of Sherhoof, I endeavor to one day learn how to so expertly insult an entire species as you just have. Bravo, good Sheriff, bravo indeed.' He then leans back from the radio, looking down at the letter before him. He sighs, 'I've seen too much blood for one stallion.' He reaches his hoof back to the radio, 'Sheriff Steel Wall, I've made my decision.'"
shatteredhoof_ncr.1004.a: "Stand Down, Gawd Wins"
shatteredhoof_ncr.1004.b: "Mobilize, War Comes"

shatteredhoof_ncr.1005.t: "Realpolitik"
shatteredhoof_ncr.1005.d: "Regina stands frowning in Gawd's office, looking at her mother, chest covered in gleaming medals, 'Mom, is what I've heard true? You threatened the thestrals?' She frowns more, 'I thought we were supposed to be different from the raiders. We're supposed to be building something new!' She ruffles her feathers, and shakes her head, 'What happened to democracy? To republicanism? Are you seriously going to be happy with a constitution written in blood, on a foundation of bones?'\n\nGawd looks her daughter in the eyes, and frowns, 'I still plan to have a republic, Regina. I think you just make clear why monarchy wouldn't work. Because a chick like you would never have the guts to make these hard choices. We've already built on blood and bones, chick, the blood of raiders, the bones of slavers. You think you can lecture me?' She shakes her head, 'You're young, and foolish still, chick. Divided, the South is going to fall. When the Pegasi come for us, when Fillydelphia comes for us, we can't rely on the votes of some thestral cult to decide what we can and can't do. We'll die. Maybe this is wrong, maybe I could have worked with the thestrals, but I'd rather build a good society on blood, than let us fall to Fillydelphia.'\n\nRegina frowns and shakes her head, 'What's the difference for them, mom? Don't you realize that? You're just the same as Stern is! You're just an old hen making empty promises, crushing the skulls of any who don't belong!' She steps forward and gets even louder, 'Is this how you want to be remembered? Betraying your promises? The Stern of the South? Because you will be!' Gawd slams her claw on the desk, 'Regina, you're dismissed. Get out. Now.' Regina narrows her eyes, flicking her tail behind her. She speaks, her voice as cold as ice, 'Understood. Gawdyna.' She turns around, storming out of the room, slamming the door behind her."
shatteredhoof_ncr.1005.a: "No Friendship In Ivory Towers"

shatteredhoof_ncr.1006.t: "Reaping"
shatteredhoof_ncr.1006.d: "Gawd looks out her window to the south, her sharp eyes looking upon the distant war camps of Sherhoof, side by side with New Mango. The door opens behind her, and talons clack against the door softly. Regina Grimfeathers looks at her mom, speaking softly, 'Why?'\n\nGawd stays looking out the window, her eyes meeting her own reflection, blocking the hen that stands behind her, 'This wasn't my choice. All the thestrals had to do was accept. They'd be citizens, same as any other. Same rights. Same privileges. And Steel Wall has aligned with them. Betrayal.' She glares, 'Betrayal, they call it. I'm not the one who did this. I gave them a choice, and they chose blood, over peace. If they want blood, then they'll have it. More than they can handle. I'll turn the desert red, I'll water the jungles with their blood if that's what they want. Maybe, only maybe, if they beg for my forgiveness, will I consider giving it to them. I'm done playing nice, Regina. Done with these politics. I've tried to play their game for too long. Now, it's time they play my game. Us griffons are predators, ponies are prey. It's time to remind them of this fact.'\n\nRegina takes a small step back. A minute of silence passes, before she speaks, '. . . Who are you?' Gawd looks back at her, a wide smirk on her face, 'I'm Gawd.' Regina looks her mother in the eyes, 'What was all this for?' Gawd smirks even more, 'I've been asking myself the same question, Regina.' Regina stands there for a minute, rooted to the spot. She slowly shakes her head, 'I don't recognize you.' She then turns around, and leaves, leaving Gawd well and truly alone."
shatteredhoof_ncr.1006.a: "Azuria Is Mine Alone."



