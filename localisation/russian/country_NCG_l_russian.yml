NCG_church_of_aetherism: "Государство без народа"
NCG_church_of_aetherism_desc: "Другие нации зависят от своего населения во всём. Мы же – нет. Небольшое количество преданных слуг и легионы роботов исполняют волю Совета Семерых. Остальное население нам совершенно не нужно: его будут игнорировать, где возможно, и систематически морить голодом, загонять до смерти или напрямую истреблять – где нет.\n§tМы возродим их всех, когда вознесёмся и создадим истинный рай. Так что их смерть – лишь временное неудобство...§!"
NCG_church_of_aetherism2: "Государство без народа"
NCG_church_of_aetherism2_desc: "Другие нации зависят от своего населения во всём. Мы же – нет. Небольшое количество преданных слуг и легионы роботов исполняют волю Совета Семерых. Остальное население нам совершенно не нужно: его будут игнорировать, где возможно, и систематически морить голодом, загонять до смерти или напрямую истреблять – где нет.\n§tМы возродим их всех, когда вознесёмся и создадим истинный рай. Так что их смерть – лишь временное неудобство...§!"

NCG_aetherist_science: "§NНаука§! эфиристов"
NCG_aetherist_science_desc: "§NНаука§! – это ветвь философии, посвящённая материальному миру. Но мы отвергаем материю ради §tэфира§!, а значит, отвергаем и излишества §Nнауки§!. Вместо этого мы направим больше ресурсов на строительство Шпиля. Кроме того, производство потребительских товаров также сократится – нам незачем обеспечивать рабочим комфорт, ведь они лишь тела для воплощения великого замысла.\n§tОни поблагодарят нас, когда мы воскресим их в новом мире, а их иллюзии о §Nнауке§! рассыплются в прах.§!"
NCG_aetherist_science2: "§NНаука§! эфиристов"
NCG_aetherist_science2_desc: "§NНаука§! – это ветвь философии, посвящённая материальному миру. Но мы отвергаем материю ради §tэфира§!, а значит, отвергаем и излишества §Nнауки§!. Вместо этого мы направим больше ресурсов на строительство Шпиля. Кроме того, производство потребительских товаров также сократится – нам незачем обеспечивать рабочим комфорт, ведь они лишь тела для воплощения великого замысла.\n§tОни поблагодарят нас, когда мы воскресим их в новом мире, а их иллюзии о §Nнауке§! рассыплются в прах.§!"

NCG_bellatores_idea: "Верные металлические слуги"
NCG_bellatores_idea_desc: "Слуги, обладающие собственным разумом, склонны к сомнениям. Они жаждут, завидуют тем, кто выше их, и жалуются на свою участь. У нас нет времени на подобные глупости – мы заняты спасением всего мира. Мы создадим собственных слуг, абсолютно преданных делу!\n§tА в раю, в знак благодарности за их службу мы даруем им тела из плоти и души, столь же истинные, как и любые другие.§!"
NCG_bellatores_idea2: "Верные металлические слуги"
NCG_bellatores_idea2_desc: "Слуги, обладающие собственным разумом, склонны к сомнениям. Они жаждут, завидуют тем, кто выше их, и жалуются на свою участь. У нас нет времени на подобные глупости – мы заняты спасением всего мира. Мы создадим собственных слуг, абсолютно преданных делу!\n§tА в раю, в знак благодарности за их службу мы даруем им тела из плоти и души, столь же истинные, как и любые другие.§!"

NCG_paralysis_idea: "Паралич"
NCG_paralysis_idea_desc: "We have failed\nOur gods have abandoned us and our empire lies in ruin. We are what remains, and though we still have our endless steel legions, we simply have no appetite for war anymore... or much else, really."

NCG_sabotage_idea: "§WAetherist§! Sabotage"
NCG_sabotage_idea_desc: "Recruiting booths lay empty and morale is in the gutters.\nAetherist propaganda floods our radio feeds and newspapers, smearing our glorious republic and our fight against tyranny. We are already rooting out these agitators, within a matter of weeks, we'll have restored control of the media."




