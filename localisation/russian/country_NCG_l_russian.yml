 NCG_hiring_new_mercs: "Найм новых наёмников"
 NCG_hiring_new_mercs_desc: "В настоящее время мы инвестируем в привлечение дополнительных сторонних подрядчиков для защиты наших активов."

 NCG_underground_construction_idea: "Подземное строительство"
 NCG_underground_construction_idea_desc: "Большая часть нашей промышленной экспансии теперь осуществляется глубоко под землей, вдали от любопытных глаз конкурентов и борцов за права пони."
 NCG_death_merchant_modifier: "Торговцы смертью"
 NCG_death_merchant_modifier_desc: "Торговля оружием - прибыльное дело, мы быстро убедились в этом. Пока у нас есть клиенты, желающие купить оружие, деньги продолжат поступать. А затем эти средства можно реинвестировать в расширение рынка для дальнейшего увеличения потенциальной прибыли."
 NCG_death_buyer_idea: "Покупка оружия Неокасла"
 NCG_death_buyer_idea_desc: "Мы заключили соглашение с Неокаслом, закупая у них оружие. Хотя это будет недёшево, расходы окупят себя, если мы обеспечим армию необходимым для победы оружием."
 NCG_final_capitalism_idea: "§aПиковый капитализм§!"
 NCG_final_capitalism_idea_desc: "Благодаря максимизации производительности труда рабочих и широкому расширению рынка мы достигли модели пиковой прибыли. Благодаря данной модели наши прибыли лишь растут, и Гильдии становятся всё богаче, пока все остальные беднеют. Это, воистину, идеальная система!"
 NCG_final_capitalism_mine_idea: "§aКапитализм на основе рабства§!"
 NCG_final_capitalism_mine_idea_desc: "Благодаря максимизации производительности труда рабочих и широкому расширению рынка мы достигли модели пиковой прибыли. Благодаря данной модели наши прибыли лишь растут, и Гильдии становятся всё богаче, пока все остальные беднеют. Это, воистину, идеальная система!"
 NCG_final_capitalism_mech_idea: "§aКибернетический капитализм§!"
 NCG_final_capitalism_mech_idea_desc: "Благодаря максимизации производительности труда рабочих и широкому расширению рынка мы достигли модели пиковой прибыли. Благодаря данной модели наши прибыли лишь растут, и Гильдии становятся всё богаче, пока все остальные беднеют. Это, воистину, идеальная система!"
 NCG_army_refunding_idea: "Восстановление службы безопасности компании"
 NCG_army_refunding_idea_desc: "В настоящее время мы предпринимаем усилия, которые позволят защитить наши активы в будущем."
 NCG_corpo_aircraft_idea: "Стандартизированная конструкция самолётов"
 NCG_corpo_aircraft_idea_desc: "Все наши самолёты состоят из одних и тех же деталей, изготовленных одинаковыми способами из одних и тех же материалов. Это позволяет нам массово выпускать компоненты, что гарантирует увеличение количества производимых машин."
 NCG_merc_focus_idea: "Армия на основе наёмников"
 NCG_merc_focus_idea_desc: "Мы передали задачу по защите наших активов третьим лицам. Хотя на бумаге это может показаться более дорогим решением, на самом деле в долгосрочной перспективе это сэкономит нам немало денег. Это также гарантирует, что о нашей безопасности позаботятся хорошо обученные профессионалы, что являются одними из лучших солдат пустоши."
 NCG_merc_focus_idea2: "Армия на основе наёмников"
 NCG_merc_focus_idea2_desc: "Мы передали задачу по защите наших активов третьим лицам. Хотя на бумаге это может показаться более дорогим решением, на самом деле в долгосрочной перспективе это сэкономит нам немало денег. Это также гарантирует, что о нашей безопасности позаботятся хорошо обученные профессионалы, что являются одними из лучших солдат пустоши."
 NCG_employee_army_idea: "Армия на основе сотрудников"
 NCG_employee_army_idea_desc: "Мы работаем над расширением наших собственных сил внутренней безопасности. Это позволяет нам осуществлять прямой контроль над вооружёнными силами, обеспечивая соблюдение наших стандартов сотрудниками безопасности."
 NCG_employee_army_idea2: "Армия на основе сотрудников"
 NCG_employee_army_idea2_desc: "Мы работаем над расширением наших собственных сил внутренней безопасности. Это позволяет нам осуществлять прямой контроль над вооружёнными силами, обеспечивая соблюдение наших стандартов сотрудниками безопасности."
 NCG_naval_idea: "Корпоративное управление открытых вод"
 NCG_naval_idea_desc: "Наши водные силы безопасности - одни из лучших, услуги которых можно купить за деньги. Наши ветераны-моряки неустанно трудятся, чтобы обеспечить безопасность наших речных путей и противостоять вечной угрозе пиратства."
 NCG_mobile_army_idea: "Тактика §O'Раскатов грома'§!"
 NCG_mobile_army_idea_desc: "В основе стратегии §OРаскатов грома§! лежит принцип быстрого реагирования на любые потенциальные угрозы. С помощью грузовиков, самолётов и бронетехники наши силы смогут справиться с угрозами задолго до того, как они смогут нанести какой-либо ущерб нашим операциям."
 NCG_mobile_army_idea2: "Тактика §O'Раскатов грома'§!"
 NCG_mobile_army_idea2_desc: "В основе стратегии §OРаскатов грома§! лежит принцип быстрого реагирования на любые потенциальные угрозы. С помощью грузовиков, самолётов и бронетехники наши силы смогут справиться с угрозами задолго до того, как они смогут нанести какой-либо ущерб нашим операциям."
 NCG_robotic_focus_idea: "Тактика §R'Пылающей стали'§!"
 NCG_robotic_focus_idea_desc: "В основе стратегии §RПылающей стали§! лежат роботизированные силы, что обеспечивают защиту наших активов. Благодаря массовому производству этих металлических слуг мы сможем заполучить значительное преимущество перед конкурентами."
 NCG_robotic_focus_idea2: "Тактика §R'Пылающей стали'§!"
 NCG_robotic_focus_idea2_desc: "В основе стратегии §RПылающей стали§! лежат роботизированные силы, что обеспечивают защиту наших активов. Благодаря массовому производству этих металлических слуг мы сможем заполучить значительное преимущество перед конкурентами."
 NCG_defense_focus_idea: "Тактика §F'Тысячи цитаделей'§!"
 NCG_defense_focus_idea_desc: "В основе стратегии §FТысячи цитаделей§! лежит создание укреплённых позиций для обеспечения безопасности наших активов. Благодаря нашему твёрдому отказу уступать конкурентам какие-либо позиции, мы можем гарантировать, что наши активы не поменяют владельца."
 NCG_defense_focus_idea2: "Тактика §F'Тысячи цитаделей'§!"
 NCG_defense_focus_idea2_desc: "В основе стратегии §FТысячи цитаделей§! лежит создание укреплённых позиций для обеспечения безопасности наших активов. Благодаря нашему твёрдому отказу уступать конкурентам какие-либо позиции, мы можем гарантировать, что наши активы не поменяют владельца."
 NCG_finance_BOG_idea: "Выкуп Болотных Прыгунов"
 NCG_finance_BOG_idea_desc: "Нам потребовалось немало средств, чтобы распространить своё влияние на земли Болотных Прыгунов. Хотя в конечном итоге все затраты окупятся, сейчас мы временно ограничены в свободных средствах."
 BOG_bogwoods_idea: "БогВудс(TM)"
 BOG_bogwoods_idea_desc: "БогВудс(TM) это дочерняя компания, созданная Гильдией Неокасла для контроля экономических операций на болоте Фрогги Боттом. Под их надзором многие воины различных племён, живущих на болоте, занимаются осушением этой местности для получения доступа к ценным ресурсам, а также строительством литейных заводов для производства стали."
 NCG_MWY_trade_idea: "Торговая сделка §rНеокасл§!-§PМейрвей§!"
 NCG_MWY_trade_idea2: "Торговая сделка §rНеокасл§!-§PМейрвей§!"
 NCG_pan_azuria_supply_chain_idea: "Крупномасштабные цепочки поставок"
 NCG_indentured_servants_meri: "Меритократический найм"
 NCG_indentured_servants_meri2: "Новая модель занятости"
 NCG_guilds_influence_idea: "Выкуп §rНеокасла§!"
 NCR_trate_idea: "Торговля с §rНеокаслом§!"
 NCG_indentured_servants_slaves: "Порабощённые сотрудники"
 NCG_indentured_servants_slaves2: "Порабощённые сотрудники"
 NCG_state_security_idea: "Отдел кадров"
 NCG_state_security_idea_desc: "Отдел кадров стремится создать хорошо организованную и безопасную рабочую среду для всего персонала. Тут хранятся бумаги, содержащие информацию о каждом сотруднике, что позволяет гарантировать, что все и всегда будут на учёте. Любые вопросы или жалобы быстро рассматриваются, что обеспечивает высокий моральный дух и производительность труда в ходе повседневных задач."
 NCG_state_security_idea2: "Отдел кадров"
