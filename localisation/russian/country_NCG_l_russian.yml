NCG_aetherist_ending_tt: "§tСпасибо, что сыграли за §OНеокасл§!\n\nСовет вознёсся, но остался бессильным. Пустошь, однако, изменилась навсегда – и не в лучшую сторону. Её природные ресурсы были исчерпаны, города разрушены, а тысячи погибли.\nЕдинственная надежда заключается в том, что пони смогут извлечь уроки из случившегося и по собственной воле решат стать лучше.\nСлавьте богов Эфира, ибо они плачут за нас всех, но не забывайте, что именно надежда поддерживает пламя.§!"


