 NCG_electrification_cat: "Расширение §rАркано-электрической интегрированной сети§!"
 NCG_electrification_cat_desc: "Пульсирующие провода змеями тянутся от шпилей Неокасла до самых дальних уголков владений магосов. Там, где ветвятся гудящие провода с матовым серебристым покрытием, воля архимагоса Тезлы абсолютна. В Неокасл поступает информация от огромного количества камер, роботов и сервиторов, а приказы рассылаются как войскам, так и рабочим.\n§GЛюбой подключенный к сети регион будет §Oчастично национализирован§!, давая бонусы к §Oресурсам, производству§! и §Oвоеннообязанному населению§!. Это не так эффективно, как полная национализация, но зато быстрее и куда дешевле в затратах политвласти.§!\n"
 NCG_electrification_dec: "Подключить регион §G[FROM.Getname]§! к сети"

 NCG_subvert_mareway_cat: "Дёргать дворян за ниточки"
 NCG_subvert_mareway_cat_desc:      "§r[MWY.GetLeader]§! решил поступить глупо и отказаться от нашего торгового соглашения, так что нам придётся использовать альтернативные средства, чтобы добраться до §Aбогатств Мейрвея.§!\nПоэтому мы воспользуемся их §GФеодальной системой§!, что лишь усиливает недоверие и конкуренцию между различными дворянами. Мы будем предлагать §Cфинансовые и промышленные "подарки"§! некоторым дворянам и тем самым завоюем поддержку местной знати. И хотя они могут не выступить открыто против короны, наши новые друзья всё равно будут бездействовать во время нашего вторжения, §Rтем самым ослабив корону и её армии!§!"
