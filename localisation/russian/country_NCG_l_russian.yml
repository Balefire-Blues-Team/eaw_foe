 NCG_open_invest_tt: "§DОткрыть интерфейс инвестиций§!"
 ncg_mil_invest_button1_tt: "Вы получите §Y[?NCG_mil_merc_count] пони ресурсов§!,\nа также увеличите §Gвоенные инвестиции на один балл§!"
 ncg_mil_invest_button2_tt: "Вы получите §Y300 единиц элитного оружия§!,\nа также увеличите §Gвоенные инвестиции на один балл§!"
 ncg_mil_invest_button3_tt: "Вы получите §Y1 военную фабрику вне карты§!,\nа также увеличите §Gвоенные инвестиции на один балл§!"
 ncg_mil_invest_button4_tt: "Вы получите §Y2% к организации армии, §Rобороне и атаке пехоты§!§!,\nа также увеличите §Gвоенные инвестиции на один балл§!"
 ncg_mil_invest_button5_tt: "§DМы завершили наши военные инвестиции!\n§YВы получите национальный дух со следующими эффектами:§!\n§G+15% атаки роботов\n+15% обороны роботов\n+10% Фактор военнообязанного населения§!\n"
 ncg_cib_invest_button1_tt: "Вы получите §Y2 единицы металла 1 единицу энергии§!, а также:\n§D4 единицы воды§!\n§Y4 единицы энергии§!\n§g4 единицы металла§!\n4 единицы композитов\n§F3 единицы электроники§!\n§O2 единицы продвинутых компонентов§!\n§r2 единицы кристаллов§!\n\nа также увеличите §Gзарубежные инвестиции на один балл§!"
 ncg_cib_invest_button2_tt: "Вы получите §Y4 единицы инфраструктуры и ячеек для строительства§!, которые будут случайно распределены по вашей национальной территории\n\nа также увеличите §Gзарубежные инвестиции на один балл§!"
 ncg_cib_invest_button3_tt: "Вы получите §Y1 гражданскую мастерскую вне карты§! и §Rнегативный национальный дух на 90 дней§!,\n\nа также увеличите §Gзарубежные инвестиции на один балл§!"
 ncg_cib_invest_button4_tt: "Вы получите §Y§D-5% ресурсов на рынок§! и +5% торговым отношениям§!,\n\nа также увеличите §Gзарубежные инвестиции на один балл§!"
 ncg_cib_invest_button5_tt: "§DМы завершили наши зарубежные инвестиции!\n§YВы получите национальный дух со следующими эффектами:§!\n§G+15% Объем заводского производства\n+15% Производительность верфи\n+10% Скорость строительства\n+10% Максимум производственной эффективности§!\n"
 ncg_rnd_invest_button1_tt: "Вы получите §Y+100% к исследованиям§! для следующей технологии роботов,\n\nа также увеличите §Gинвестиции в исследования и разработки на один балл§!"
 ncg_rnd_invest_button2_tt: "Вы получите §Yслучайное количество высокотехнологичных роботов, транспортных средств или оружия,§!\n\nа также увеличите §Gинвестиции в исследования и разработки на один балл§!"
 ncg_rnd_invest_button3_tt: "Произойдёт §Yслучайное событие§!. Может дать следующие вещи:\n§RКрупный бонус к исследованиям§!\n§OНациональый дух§!\n§DРесурсы§!\n§r?????§!,\n\nа также увеличение §Gинвестиций в исследования и разработки на один балл§!"
 ncg_rnd_invest_button4_tt: "Вы получите §G+3% к скорости исследований§!,\n\nа также увеличите §Gинвестиции в исследования и разработки на один балл§!"
 ncg_rnd_invest_button5_tt: "§DМы завершили наши инвестиции в исследования и разработки!\n§YВы получите уникальный национальный дух со следующими эффектами:§!\n§G+25% Ежемесячный прирост населения\n+25% Скорость строительства инфраструктуры\n+0.30 Ежедневный прирост политической власти\n+1% Еженедельный прирост стабильности§!\n"
 NCG_peak_capitalism_tt: "§YНа шаг ближе к вершине развития капитализма§!"
 NCG_increase_profit_tt: "§YУвеличение прибыли привело к получению§! §Dодного балла инвестиций§!"
 NCG_increase_profit_large_tt: "§YЗначительное увеличение прибыли привело к получению§! §Dдвух баллов инвестиций§!"
 NCG_increase_profit_extreme_tt: "§YНевероятное увеличение прибыли привело к получению§! §Dтрёх баллов инвестиций§!"
 NCG_increase_profit_alt_tt: "§YПовышение производительности привело к получению§! §Dодного балла инвестиций§!"
 NCG_increase_profit_large_alt_tt: "§YЗначительное повышение производительности привело к получению§! §Dдвух баллов инвестиций§!"
 NCG_increase_profit_extreme_alt_tt: "§YНевероятное повышение производительности привело к получению§! §Dтрёх баллов инвестиций§!"
 NCG_investment_points_gaintt: "§YЕжегодная прибыль приводит к получению§! §Dодного балла инвестиций§!"
 NCG_death_merchant_tt: "§CМы свяжемся с крупными нациями из Сердца Эквестрии с предложением продать им некоторое оружие из наших кузен. §FКаждая страна, которая примет это предложение, сделает нашу промышленность сильнее.§!§!"
 NCG_reach_peak_tt: "§DНаконец-то мы достигли своих целей...\nМы достигли §RВЕРШИНЫ РАЗВИТИЯ КАПИТАЛИЗМА!§!§!\n"
 NCG_increases_mer_mp_tt: "§OУвеличивает число пони ресурсов, получаемых за счёт инвестиций, на §R200§!§!"

 NCG_increase_build_inf_tt: "§OУвеличивает влияние Гильдии Строителей§!"
 NCG_increase_mine_inf_tt: "§FУвеличивает влияние Гильдии Шахтёров§!"
 NCG_increase_mech_inf_tt: "§rУвеличивает влияние Гильдии Механикум§!"

 NCG_lower_corruption_tt: "§GПонизит §Rкорпоративную коррупцию§! на один уровень§!"
 NCG_this_ends_game_TT: "§RЭто фактически ЗАВЕРШИТ вашу игру!!!§!"
 NCG_next_nation_buy_tt: "§rНеокасл§! обратится к другому покупателю, и мы никогда больше не получим такого шанса."
 NCG_allows_corpo_puppets_tt: "§CРазблокирует решения, которые позволят воскресить различные §Fдовоенные компании§! в качестве наших филиалов по всему Сердцу Эквестрии§!"
 NCG_red_unhappy_tt: "§RКрасный Глаз не обрадуется этому...§!"
 NCG_better_corruption_tt: "§rМы будем использовать коррупцию в нашей стране в своих интересах, что позволит упростить законодательные процессы.§!\n§DОтныне коррупция будет увеличивать нашу политическую власть.§!"
 NCG_raise_corruption_tt: "§RУвеличит коррупцию§!"
 NCG_enable_slavery_tt: "§CВключит механику рабства для нашей нации.§!\n§FМы получим £slave_text 2000 зарубежных рабов§!"
 NCG_locked_advisor_tt: "§RДобавит советника с хорошими бонусами, которого нельзя будет сменить.§!"
 NCG_sunforge_decisions_tt: "§CРазблокирует решения, которые позволят построить §Oвеликую кузню§!, подобных которой мир ещё не видел.§!"

 NCG_electric_network_ncg_tt: "§rНеокасл§! получит первую итерацию §AАркано-электрической интегрированной сети§!."
 NCG_electric_network_rest_tt: "Остальная часть страны получит §AАркано-электрическую интегрированную сеть§!.\n§CМы также получим возможность строить новые сети в завоёванных нами землях через решение.§!"
 NCG_electric_network_tt: "§AАркано-электрическая интегрированная сеть§! будет расширена сюда."
 NCG_coring_disabled_tt: "§R§rАрхимагос Тезла§! не верит в интеграцию чужаков в нашу нацию. Вместо этого она стремится объединить род пони с помощью куда более практичных, механических средств.\nНационализация отключена, но вы получите бонусы в качестве компенсации."

 NCG_blueprints_aquired_tt: "§rМы получим ряд образцов кибернетики и зашифрованных файлов от нашего контакта в Соборе.§!"

 NCG_rolling_thunder_tt: "§OМы сделаем ставку на стратегию на основе бронетехники.§!"
 NCG_burning_steel_tt: "§RМы сделаем ставку на стратегию, основанную на роботах.§!"
 NCG_thousand_citadels_tt: "§FМы сделаем ставку на стратегию, основанную на создании и удержании укреплённых позиций.§!"

 NCG_smaller_duchies_tt: "§CПоскольку Новый Мейрвей отказался от нашего предложения, мы обратимся к дворянам и, с помощью нашего богатства убедим предать корону в рамках подготовки к нашему возможному вторжению.§!\n"
 NCG_smaller_duchies_tt2: "§RЭффекты этого фокуса зависят от того, примет ли Новый Мейрвей нашу торговую сделку или нет.§!\n"
 NCG_industrial_aid_to_wavy_waters_tt: "§CГерцог Пэйл Лайт сделает вид, что не получил призыва к оружию.§!"
 NCG_industrial_aid_to_pale_light_tt: "§NГерцог Уэйви Уотерс будет держать свой флот в гавани.§!"
 NCG_industrial_aid_to_gatormaw_tt: "§rГерцог Гатормау задержит подкрепление с юга.§!"
 NCG_industrial_aid_to_littleward_tt: "§GГерцог Брайт Глоу не будет мешать нашему вторжению.§!"
 NCG_industrial_aid_to_sunflower_tt: "§AГерцогиня Санфлауэр окажет нам свою скудную поддержку..§!"
 NCG_corporate_takeover_mareway_tt: "§YДля этого фокуса вы либо должны заключить сделку с влиятельной аристократией Нового Мейрвея, либо активно торговать с самим Новым Мейрвеем.§!"

 NCG_90_core_reduction_tt: "§DНации, границы и политические группировки совершенно бессмысленны перед лицом Корня Творения.\nЗа время, проведенное в тенях, мы достигли совершенства в синкретизации разрозненных верований в одну целостную философию. Мы рады всем, кто стремится присоединиться к нам в совершенствовании, независимо от их расы или социального положения!\n\n§FСнижает стоимость национализации на 90%!§!§!\n"
 NCG_incumbo_tt: "§DМы начнём непростой процесс перемещения огромного количества ресурсов в [NCG.Capital.GetName], дабы облегчить строительство Шпиля.§!\n\n§FКаждые 10 дней некоторые ресурсы будут перемещаться из наших регионов в [NCG.Capital.GetName].§!\n"
 NCG_shattered_uprising_tt: "§DЧерез 5 месяцев мы прикажем нашим агентам заняться саботажем в Азурии и одновременно объявим им §RВОЙНУ§!§!\n"

 NCG_mechanicum_coup1_tt: "§OГильдия Строителей§! §Yподчинилась воле§! §RМеханикум§!"
 NCG_mechanicum_coup2_tt: "§GГильдия Шахтёров§! §Yподчинилась воле§! §RМеханикум§!"

NCG_machanicum_epilogue_tt: "§CСпасибо за игру за §OНеокасл§!!\n\nМарш прогресса стал неминуемым, и всех, кто попытается остановить архимагоса Тезлу и её аколитов, ждёт лишь поражение и смерть. Через 20 лет новый бог откроет свои механические глаза и изменит мир до неузнаваемости. Путь проложен, и ни один аспект прежней Эквестрии или же пустоши, в которую она превратилась, не переживет пробуждения §GВсеразума§!.\n§RВремя плоти и магии прошло.\nНастало время мысли и стали§!\n§!§tХвала вам, ибо вы положили конец 200-летнему застою.!§!"

