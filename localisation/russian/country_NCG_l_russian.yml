 POLITICS_TRADE_COUNCIL_DESC: "§YТроица объединенных гильдий§!\n\n§aТорговый совет§! является официальным правящим органом §DНеокасла§!. Эта организация была основана несколько поколений назад в рамках реструктуризации, устроенной §OГильдией Строителей§!. Совет стремится в равной степени представлять интересы каждой из входящих в него Гильдий. Хотя вначале эта инициатива была встречена с опаской, она быстро завоевала поддержку после того, как §GГильдия Шахтёров§! начала рассматривать Совет как возможность поставить всех в равные условия.\n\nХотя изначально §aТорговый совет§! занимался исключительно вопросами национальной политики, с тех пор его полномочия расширились и он стал заниматься решением большинством споров, которые возникают между Гильдиями. Совет стал посредником во многих делах, позволив Гильдиям эффективно работать друг с другом."

