NCG_infinite_spire_1: "Строительство Бесконечного шпиля"
NCG_infinite_spire_1_desc: "Творение – это перевёрнутое дерево. Мы живём на одном из великих миров-плодов, наслаждаясь блаженством жизни, но истинные тайны сокрыты близ корней. Чтобы найти источник всего сущего, мы должны непрестанно строить всё выше и выше!"
NCG_infinite_spire_2: "Строительство Бесконечного шпиля"
NCG_infinite_spire_2_desc: "Творение – это перевёрнутое дерево. Мы живём на одном из великих миров-плодов, наслаждаясь блаженством жизни, но истинные тайны сокрыты близ корней. Чтобы найти источник всего сущего, мы должны непрестанно строить всё выше и выше!"
