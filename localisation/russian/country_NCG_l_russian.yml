 NCG_mil_invest_5: "Армия машин"
 NCG_mil_invest_5_desc: "У костров в ночи тихим шёпотом рассказывают об армии машин Неокасла. Говорят, что эти совершенно бесчувственные конструкции из металла и схем способны стрелять лазерами из глаз и ломать позвоночник пони одним щелчком своих роботизированных копыт. Эти истории не так уж далеки от истины, поскольку наши роботизированные силы доказали, что они способны справиться даже с самыми сильными пони. В дальнейшем они, вероятно, будут играть решающую роль в обеспечении безопасности наших активов по всей пустоши."
 NCG_civ_invest_5: "Магия капитализма"
 NCG_civ_invest_5_desc: "Давным-давно в волшебной стране Эквестрии жили три великие Гильдии. Каждая из них, благородная и гордая, стремилась к тому, что действительно имеет значение: к прибыли. В этом стремлении они совершили множество удивительных подвигов, революционизировав Пустошь силой капитализма и обеспечив неслыханный уровень процветания."
 NCG_rng_invest_5: "Нация будущего"
 NCG_rng_invest_5_desc: "Наша страна - не какая-то примитивная отсталая нация, живущая в каменном веке посреди облучённых руин. О нет, мы создали нацию, стоящую на столпах технологий и прогресса. Наши усилия вновь просветят род пони!"
 NCG_mil_training_modifier: "Специализированная подготовка"
 NCG_mil_training_modifier_desc: "Мы вложили часть нашего тяжело заработанного богатства в обеспечение надлежащей подготовки наших сил безопасности. Улучшенные условия и умелые инструкторы в значительной степени способствуют повышению профессионализма наших храбрых офицеров."
 NCG_civ_market_modifier: "Монополизировать рынок"
 NCG_civ_market_modifier_desc: "В настоящее время мы инвестируем в расширение наших позиций на рынке пустоши. И пока идёт этот процесс, мы можем наносить ущерб нашим конкурентам, одновременно расширяя собственные активы."
 NCG_rnd_budget_modifier: "Увеличенный исследовательский бюджет"
 NCG_rnd_budget_mofier_desc: "Благодаря увеличению финансирования различных исследований и разработок, мы можем позволить себе услуги некоторых из величайших умов пустоши и самые современные объекты. Несмотря на то, что некоторые из более экономных сотрудников считают это пустой тратой средств, мы считаем эти расходы надёжными инвестициями в наше будущее."
 NCG_civ_invest_debuff_idea: "Интеграция иностранного капитала"
 NCG_civ_invest_debuff_idea_desc: "В настоящее время мы работаем над интеграцией недавно приобретенных активов конкурентов."
