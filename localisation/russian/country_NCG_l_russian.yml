 NCG_investment_yearly_cat: "Магия капитализма"
 NCG_investment_yearly_cat_desc: "Бизнес, который не идёт на риск, не сможет продержаться долго на этом жестоком рынке, поэтому мы позаботимся о том, чтобы не лишиться всего. Мы будем инвестировать свободные средства в те проекты, которые хоть и не приносят немедленной прибыли, но либо обещают окупиться в будущем, либо непосредственно способствуют сохранению нашей текущей прибыли. Раз в год часть прибыли от наших инвестиций откладывается на специальный счёт, предназначенный исключительно для такого рода рискованных инвестиций.\n§GБонус увеличивается до §Cдвух баллов инвестиций§! при §O12 гражданских фабриках§! и до §Cтрёх баллов инвестиций§! при §O30 гражданских фабриках§!\n§"

