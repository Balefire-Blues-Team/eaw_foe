 NCG_defunded_army4_desc: "Когда-то давным-давно, более века назад, существовала четвертая гильдия: Гильдия Безопасности. Они обеспечивали защиту персонала и имущества всех прочих гильдий. Однако они стали высокомерными и пожелали захватить власть над всеми своими коллегами. Их предательство привело к долгому и кровавому конфликту, в котором в итоге победили три другие гильдии. Гильдия Безопасности была полностью распущена, а всё её активы были распределены между другими гильдиями.\n\nЭто было тёмное пятно нашей истории, поэтому сотрудники нынешней службы безопасности остаются относительно немногочисленными силами со скромным финансированием. Однако недавние события на рынке пустоши повысили важность защиты активов."

 NCG_piracy_blues: "Пиратский блюз"
 NCG_piracy_blues_desc: "Удобный доступ к §RАзурвэю§! позволил нам стать региональным центром речной торговли, что уступает лишь §YХуф-Сити§!. Хотя это стало большим благом для нашей экономики, активная торговля также привлекла внимание недоброжелателей. Пираты и прочие мерзавцы рыскают по реке на своих самодельных лодках и досаждают нашим судам. Хотя большинству из них не нужно ничего, кроме денежной дани в обмен на проход через их плавучие блокпосты, другие же не чураются насилия и захватывают груз всех, кто им попадается, под угрозой оружия. Пока мы не решим эту проблему, наши водные пути не смогут работать в полную силу."
 NCG_piracy_blues2: "Пиратский блюз"
 NCG_piracy_blues2_desc: "Удобный доступ к §RАзурвэю§! позволил нам стать региональным центром речной торговли, что уступает лишь §YХуф-Сити§!. Хотя это стало большим благом для нашей экономики, активная торговля также привлекла внимание недоброжелателей. Пираты и прочие мерзавцы рыскают по реке на своих самодельных лодках и досаждают нашим судам. Хотя большинству из них не нужно ничего, кроме денежной дани в обмен на проход через их плавучие блокпосты, другие же не чураются насилия и захватывают груз всех, кто им попадается, под угрозой оружия. Пока мы не решим эту проблему, наши водные пути не смогут работать в полную силу."
 NCG_piracy_blues3: "Пиратский блюз"
 NCG_piracy_blues3_desc: "Удобный доступ к §RАзурвэю§! позволил нам стать региональным центром речной торговли, что уступает лишь §YХуф-Сити§!. Хотя это стало большим благом для нашей экономики, активная торговля также привлекла внимание недоброжелателей. Пираты и прочие мерзавцы рыскают по реке на своих самодельных лодках и досаждают нашим судам. Хотя большинству из них не нужно ничего, кроме денежной дани в обмен на проход через их плавучие блокпосты, другие же не чураются насилия и захватывают груз всех, кто им попадается, под угрозой оружия. Пока мы не решим эту проблему, наши водные пути не смогут работать в полную силу."
 NCG_piracy_blues4: "Пиратский блюз"
 NCG_piracy_blues4_desc: "Удобный доступ к §RАзурвэю§! позволил нам стать региональным центром речной торговли, что уступает лишь §YХуф-Сити§!. Хотя это стало большим благом для нашей экономики, активная торговля также привлекла внимание недоброжелателей. Пираты и прочие мерзавцы рыскают по реке на своих самодельных лодках и досаждают нашим судам. Хотя большинству из них не нужно ничего, кроме денежной дани в обмен на проход через их плавучие блокпосты, другие же не чураются насилия и захватывают груз всех, кто им попадается, под угрозой оружия. Пока мы не решим эту проблему, наши водные пути не смогут работать в полную силу."

 NCG_west_amethyst_resistance: "Забастовка Западного Аметиста"
 NCG_west_amethyst_resistance_desc: "Над нашими сотрудниками на севере никогда не присматривали настолько тщательно, как над теми, кто работает в самом Неокасле. Благодаря такой относительной свободе они начали организовываться и формировать свой §RСоюз§!. Этот термин вызывает гнев даже у самых спокойных сотрудников, ведь все мы знаем, что такими мерзкими организациями управляют лишь жаждущие власти жеребята, не уважающие ни рыночный рост, ни рентабельность. Когда Гильдии стало известно об их постоянных попытках саботировать и разрушить те ценности, что лежат в основе нашей великой нацию, они немедленно приняли меры по пресечению деятельности этих смутьянов.\n\nК сожалению, эти усилия привели к тому, что проблема стала лишь серьёзнее. Ужасный §RСоюз§! призвал ко §Rвсеобщей забастовке§! и тем самым ясно показал, что намерен целиком и полностью уничтожить наш образ жизни. К счастью, нам удалось сдержать эту угрозу, но продолжающаяся подстрекательская деятельность в Западном Аметисте сильно затрудняет наши операции. Нам придётся разобраться с забастовщиками, если мы хотим снова выполнять квоты по производству."
 NCG_west_amethyst_resistance2: "Забастовка Западного Аметиста"
 NCG_west_amethyst_resistance2_desc: "Над нашими сотрудниками на севере никогда не присматривали настолько тщательно, как над теми, кто работает в самом Неокасле. Благодаря такой относительной свободе они начали организовываться и формировать свой §RСоюз§!. Этот термин вызывает гнев даже у самых спокойных сотрудников, ведь все мы знаем, что такими мерзкими организациями управляют лишь жаждущие власти жеребята, не уважающие ни рыночный рост, ни рентабельность. Когда Гильдии стало известно об их постоянных попытках саботировать и разрушить те ценности, что лежат в основе нашей великой нацию, они немедленно приняли меры по пресечению деятельности этих смутьянов.\n\nК сожалению, эти усилия привели к тому, что проблема стала лишь серьёзнее. Ужасный §RСоюз§! призвал ко §Rвсеобщей забастовке§! и тем самым ясно показал, что намерен целиком и полностью уничтожить наш образ жизни. К счастью, нам удалось сдержать эту угрозу, но продолжающаяся подстрекательская деятельность в Западном Аметисте сильно затрудняет наши операции. Нам придётся разобраться с забастовщиками, если мы хотим снова выполнять квоты по производству."
