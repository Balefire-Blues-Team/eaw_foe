 NCG_star_foundry_cat: "Строительство §OЗвёздной кузни§!"
 NCG_star_foundry_cat_desc: "Магос Санфордж уже давно мечтала осуществить свой величайшие проект - открыть небольшой портал прямо в §YСердце Солнца§! не только для производства энергии, но и добычи тяжёлых минералы с помощью арканомагнитных процессов.\nЭтот проект обойдётся очень недёшево, но он сможет произвести революцию в нашей промышленности!"
