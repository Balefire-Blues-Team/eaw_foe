l_russian:
 LOADING_TIP_0:0 "Я знал пони, проёбы которых погубили жизни миллионов.\n- §tНаблюдатель§!, про проёбы"
 LOADING_TIP_1:0 "Ко мне поступает ещё множество сообщений. Герои сомкнули ряды от Разбитого Копыта до Хуфингтона, чтобы противостоять ужасам небес.\n- §oDJ Пон-3§!"
 LOADING_TIP_2:0 "В этот день, тебе необходимо выбрать того, кому принести Клятву. Откажись от своих мелочных целей и встань на мою сторону, возобнови свою Клятву защищать граждан Эквестрии.\n- §AСтилХувз Эпплснек§!"
 LOADING_TIP_3:0 "Это мы помогаем.\n- §YЛайфблум§!"
 LOADING_TIP_4:0 "Пони... Пони никогда не меняются.\n- §XКрасный Глаз§!"
 LOADING_TIP_5:0 "Ты Литлпип, королева красочных ругательств, я права?\n- §FПринцесса Селестия§!"
 LOADING_TIP_6:0 "Меня послала Гауда.\n- §GБлэквинг§!"
 LOADING_TIP_7:0 "Давным-давно, в волшебной стране Эквестрии..."
 LOADING_TIP_8:0 "Летите, мои дети! Спасайтесь!\n- §DБогиня§!, незадолго до своей смерти"
 LOADING_TIP_9:0 "Не я буду править Эквестрией. Я уже говорил вам, я - слишком ужасен для того мира, который мы создаём. Мне в нём не место.\n- §XКрасный Глаз§!"
 LOADING_TIP_10:0 "Один пони, которого я знал, говорил, что для хорошей игры в кольца нужно просто правильно прикладывать усилия. Я тоже очень люблю прикладывать.. усилия.\n- §YЖнец Большой Папочка§!"
 LOADING_TIP_11:0 "Эквестрийская пустошь требует жертв.\nОна понемногу уничтожает тебя до тех пор, пока ты больше не будешь узнавать себя.\n- §OМонтерей Джек§!"
 LOADING_TIP_12:0 "— Потому что, конечно, так оно и есть. И ты, Обитательница Стойла, конечно же видишь это более чётко, нежели большинство. Потому что мы с тобой многом похожи, не так ли?\n- §XКрасный Глаз§! спрашивает Обитательницу Стойла верит ли она в то, что он монстр"
 LOADING_TIP_13:0 "Оно просто работает.\n- Тодд Говард и The_Laundry"
 LOADING_TIP_14:0 "В мире, наполненном страданиями и неопределённостью, великое утешение знать, что свет во тьме всё-таки есть."
 LOADING_TIP_15:0 "Пони, подобные им, должны умереть. И моя цель — принести им смерть. Такова моя политика.\n- §OКаламити§!"
 LOADING_TIP_16:0 "Если бы можно было убить пони с помощью морального превосходства, то мы бы давно победили Красного Глаза!\n- §YРыцарь Строуберри Лемонэд§!"
 LOADING_TIP_17:0 "Меня окружают тупые жеребята и ещё более тупые здоровяки.\n- §YМэр Лэмп Лайт§!"
 LOADING_TIP_18:0 "ВЕЛИКАЯ И МОГУЩЕСТВЕННАЯ БОГИНЯ ПРИВЕТСТВУЕТ ТЕБЯ!\n- §DБогиня§!"
 LOADING_TIP_19:0 "Война поднимает на поверхность самых лучших. А во время мира богатые платят ещё более богатым за тёпленькие местечки. Я знаю, что из этого мне ближе.\n— §YАдмирал Хай Тайдс§!"
 LOADING_TIP_20:0 "Мир вновь станет утопией, если каждый просто внесёт свой вклад.\n— §XУченики Собора§!"
 LOADING_TIP_21:0 "Ты всё равно сделаешь это, независимо от того, возражаю я или нет. Знаю. Но для протокола: я против.\n— §GВельвет Ремеди§!"
 LOADING_TIP_22:0 "Они зовут нас дураками. Психами. Да кем угодно, лишь бы им спалось спокойнее. Но приливу всё равно, как ты его называешь.\n— §DКримзон Уотерс§!"
 LOADING_TIP_23:0 "Продолжай улыбаться. В этом весь трюк. Если делать это достаточно долго, то со временем ты начнёшь улыбаться искренне.\n— §YСильвер Белл§!"
 LOADING_TIP_24:0 "Вы в своей жизни ничего не видели, пока не узрели хорошего пса в полном боевом экзоскелете. Вот тогда вы всё поймёте.\n— §YДок Слаутер§! о своей работе"
 LOADING_TIP_25:0 "Каждый, кто выйдет за порог этого Стойла, будет знать то, чего не знает остальной мир. В этом всегда и заключалась суть.\n— §AСкуталу§!, вице-президент Стойл-Тек"
 LOADING_TIP_26:0 "Вам письмо!\n— §oДитзи Ду§!"
