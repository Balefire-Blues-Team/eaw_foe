l_russian: 

##################
### FOCUS TREE ###
##################

RWK_battle_of_petershoof: "Битва за Петерсхуф"
RWK_battle_of_petershoof_desc: "Двести лет назад адмирал Хай Тайдс впервые поучаствовал в морском сражении в качестве командира. Принятые им тогда решения навсегда определили характер нации, которую он позже основал – и их влияние ощущается даже сегодня."

RWK_our_great_shame: "Наш великий позор"
RWK_our_great_shame_desc: "Когда старому миру пришёл конец, адмирал Хай Тайдс вновь оказался перед тяжёлым выбором. Когда всё вокруг тебя рушится и пылает, решения нужно принимать незамедлительно. Так кого ты попытаешься спасти?"

RWK_shelter_on_shore: "Безопасный берег"
RWK_shelter_on_shore_desc: "Выжившим удалось найти уцелевший порт и высадиться там, что положило начало нынешнему Ржавому Остову. Однако спустя десять лет стало ясно, что остатки флота содержать слишком обременительно."

RWK_meet_with_crimson: "Встреча с Кримзон"
RWK_meet_with_crimson_desc: "Культ Последнего Прилива вот уже десятилетие как является занозой в нашем боку. Они избегают призыва, не платят налоги и вовсе не желают быть частью нашего общества. А недавно некоторые из их последователей подожгли магазины в столице, что никак нельзя оставлять без ответа. Адмирал Хай Тайдс намерен встретиться с лидером культа, Кримзон Уотерс."

RWK_call_captains_to_order: "Призвать капитанов к порядку"
RWK_call_captains_to_order_desc: "В последнее время Ржавый Остов заполонили наивные хиппи-пацифисты, игнорирующие приказы адмирала. Пришло время Хай Тайдсу напомнить капитанам их место и заставить подчиниться своему командиру."

RWK_issue_of_impressment: "Возобновить принудительный призыв"
RWK_issue_of_impressment_desc: "Только полоумный станет вести вперёд корабль с на половину укомплектованным экипажем, особенно в непростых условиях пустоши. У Ржавого Остова нет времени на поиск добровольцев. С настоящего момента пони будут принудительно зачисляться на службу государству. Ради всеобщей безопасности."

RWK_hunt_the_cult: "Охота на культ"
RWK_hunt_the_cult_desc: "Кримзон Уотерс – радикалка, скользкая и насквозь лживая кобыла, чьему влиянию нет места в нашей стране. Она возглавляет сборище безумцев, которое осмеливается называться религиозным. Ржавый Остов прекрасно обходился без этих сумасшедших целых два столетия, так что пора очистить нацию от них."

RWK_by_the_root: "С корнем"
RWK_by_the_root_desc: "Эти кретины весьма упорные. Многие из них могли стать хорошими солдатами, если бы только решили умирать за дело флота, а не своей дурацкой религии. Есть только один способ окончательно избавить Ржавый Остов от них: выдрать с корнем и уничтожить все оплоты до единого."

RWK_enemies_to_allies: "Из врагов в союзники"
RWK_enemies_to_allies_desc: "Пусть Последний Прилив сборище психов и уродов, а их предводительница – самая сумасшедшая из всех, но когда припрёт даже эти кретины начинают учиться и действительно ставить палки в колеса. Так что по крайней мере уж лучше знакомое зло, чем кто-то совершенно новый. Хай Тайдс будет сотрудничать с культом... пока что."

RWK_dissolve_MAS_remnants: "Распустить Наблюдательный совет МТН"
RWK_dissolve_MAS_remnants_desc: "В нынешние времена, когда пустошь не даёт нам ни минуты покоя, мы не можем позволить себе терять время на споры о власти или на пони, пытающихся остановить действия лидера. Наблюдательный совет МТН уже доставил достаточно проблем – пора избавиться от этих болтунов-изменников."

RWK_buy_out_purifiers: "Прижать портовые семьи"
RWK_buy_out_purifiers_desc: "Четыре семьи, происходящие от простых моряков, некогда трудившихся на самых... опасных должностях в эквестрийском флоте, уже давно разделили разные сферы порта Ржавого Остова между собой, будто личные владения. Они были лояльны – и потому их терпели. Но теперь пришло время навести порядок и вернуть их обратно под управление, а не наоборот."

RWK_another_census: "Перепись [GetYear] года"
RWK_another_census_desc: "После окончания войны крайне непросто понять, сколько пони живёт в том или ином месте. Государство не может функционировать – а главное, призывать рекрутов, если оно даже не знает, существуют ли вообще данные пони. Пришло время Ржавому Остову провести масштабную перепись, чтобы определить численность населения и строить планы на ближайшее будущее."

RWK_reform_the_general_staff: "Реформа верховного командования"
RWK_reform_the_general_staff_desc: "Война – это меритократия, а мир же – фарс, где естественный порядок – это когда богатые пони платят друг другу, чтобы получить тёпленькое местечко в правительстве. Подобный курс неприемлем, особенно когда к югу от нас рыщут злодеи вроде Красного Глаза. Пора напомнить верховному командованию, что они не просто так носят красивые мундиры."

RWK_nationalize_valkyrie_arms: "Национализировать Валькирия Армс"
RWK_nationalize_valkyrie_arms_desc: "Национализация – дело тонкое. Одна ошибка – и ты уже коммунист, или вингбардийский фашист времён Великой войны. Так что это мера, которую применяют только к ключевым предприятиям. Теперь, когда Последний Прилив больше не мешает нам, Ржавый Остов наконец-то может взять под контроль оружейную корпорацию Валькирия Армс ради безопасности всей страны."

RWK_new_warbands: "Новые боевые отряды"
RWK_new_warbands_desc: "Кримзон Уотерс обратилась к Хай Тайдсу с предложением включить её отряды сумасшедших и психов в состав национальной армии. Да, их здравомыслие не отвечает нашим стандартам, но Хай Тайдс не может отрицать того, что Остову в данный момент нужна любая помощь для укрепления обороны."

RWK_war_and_peace: "Перенастройка экономики"
RWK_war_and_peace_desc: "Ржавый Остов – сияющий маяк на восточном побережье, но правда в том, что он может добиться куда больших успехов. Хай Тайдс призвал к общенациональной перестройке экономической системы – хотя пока ещё неизвестно, принесёт ли это пользу простому пони или рядовому солдату."

RWK_integrate_the_outskirts: "Интеграция окраин"
RWK_integrate_the_outskirts_desc: "Окраины Ржавого Остова долгое время оставались в тени центра города. Но любой толковый генерал знает: лучший способ защитить столицу – не дать врагу добраться до неё. По этой причине Хай Тайдс инициировал масштабный инфраструктурный проект на окраинах, чтобы улучшить позиции армии в этих районах."

RWK_hand_out_boarding_guns: "Открыть морские арсеналы"
RWK_hand_out_boarding_guns_desc: "Флот хранит значительные запасы вооружений, и хотя он остаётся основной силой Ржавого Остова, нельзя отрицать, что сухопутные войска страдают от нехватки снаряжения. В интересах национальной безопасности будет запущен масштабный проект: морские арсеналы откроют свои хранилища, после инспекции которых излишки будут переданы армии."

RWK_study_great_war: "Уроки Великой войны"
RWK_study_great_war_desc: "Гуль – очень полезный лидер государства: он лично сражался в Великой войне и обладает бесценным опытом. Пусть методы ведения боя изменились, а сама война стала совсем иной, знания и воспоминания о крупнейшем конфликте в истории всё ещё способны подготовить вооружённые силы к грядущим сражениям."

RWK_bloody_lessons: "Кровавые уроки"
RWK_bloody_lessons_desc: "Последний Прилив больше не представляет угрозы для нации – движение либо было подавлено в зародыше, либо обратилось против других врагов. В любом случае, наш опыт столкновения с подобными фанатиками преподал нам ценные уроки, которые ещё пригодятся в будущем."

RWK_prepared_for_anything: "Готовность ко всему"
RWK_prepared_for_anything_desc: "Мир становится всё опаснее, как бы ни твердили обратное наивные мечтатели и пацифисты из Совета развития Санрайза. У нас нет времени сидеть сложа копыта и ждать, пока Красный Глаз двинется на север. Борьба за выживание начинается сегодня – с милитаризации экономики."

RWK_generators_for_saltpan: "Электростанция Солончака"
RWK_generators_for_saltpan_desc: "На пустошах ни одно государство не может функционировать без энергии. Электричество используется повсеместно, оно – кровь, что питает весь Ржавый Остов. Крайне неразумно зависеть от импорта столь важного ресурса. Поэтому мы откроем электростанцию, чтобы обеспечить страну энергией в любых обстоятельствах."

RWK_across_the_hoofsic: "Спешить Ездоков"
RWK_across_the_hoofsic_desc: "Дождевые Ездоки – шайка психов на байках. Но эти опасные рейдеры весьма плохо защищают свою южную границу. Разведка сообщает о высоком риске конфликта рейдеров с силами грифонов на севере – и лучшего момента для удара нам просто не найти."

RWK_put_off_inevitable: "Отсрочить неизбежное"
RWK_put_off_inevitable_desc: "Хай Тайдc угасает, но он не какой-нибудь слабак, который просто смирится с этим. Каждый день он чувствует, как сил становится всё меньше, но у адмирала впереди ещё множество дел, так что он не готов проститься с этим миром. Последний час близится, но Тайдc закалит свой разум и продержится ещё немного."

RWK_choose_a_successor: "Выбрать преемника"
RWK_choose_a_successor_desc: "Вейвбрейкер, глава Нового Адмиралтейства, и Кримзон Уотерс, лидер Последнего Прилива – единственные, кого Хай Тайдс считает хоть сколько-то компетентными кандидатами на пост лидера нации. Один – умный ботаник, другая – хитрая чудачка. Время истекает и Хай Тайдс должен сделать выбор."

RWK_authorize_experimental_treatments: "Исследование экспериментального лечения"
RWK_authorize_experimental_treatments_desc: "Доктор Келп – умная кобыла. Она – врач, предложившая передовой метод восстановления стремительно угасающего разума Хай Тайдса. Государство выделит часть ресурсов, чтобы она немедленно начала свою работу. Будем надеяться, что это даст умирающему адмиралу ещё один шанс."


###Economics-Tree###

RWK_sunrise_development_council: "Расширить §OСовет Развития Санрайза§!"
RWK_sunrise_development_council_desc: "§OСРС§! – это государственная организация, объединяющая видных торговцев, экономистов и промышленников. Мы поручим совету повысить промышленное производство по всей стране."

RWK_root_out_dappleshore_water: "Избавиться от водяных баронов Дапплшора"
RWK_root_out_dappleshore_water_desc: "Дапплшор – пристанище богатых пони, владеющих водоочистными станциями. Они, как монополисты, установили завышенные цены на чистую воду, наживаясь на жажде простых пони. Если правительство намерено полноценно использовать ресурсы и население Дапплшора, сперва нужно разобраться с так называемыми водяными баронами."

RWK_revive_tradepost_valkyrie: "Возродить торговый пост "Валькирия""
RWK_revive_tradepost_valkyrie_desc: "С тех пор как на западе, особенно в Лайте, укрепилась мафия, торговля практически прекратилась – всё из-за неприязни Хай Тайдса к мафиози. Лишь восстановление торговых потоков позволит Вестшору вновь процветать."

RWK_taxbreaks_for_sunrise: "Налоговые льготы для торговцев Санрайза"
RWK_taxbreaks_for_sunrise_desc: "Санрайз – дом для множества торговцев, особенно в районе штаб-квартиры "Санрайз Шиппинг", которая служит ключевым узлом торговли между южными и северными регионами. Но в последнее время дела идут неважно, и многие из купцов несут убытки. Небольшое снижение налогов поможет им вернуть крышки в свои карманы."

RWK_reinforce_broken_road: "Укрепить Разбитую Дорогу"
RWK_reinforce_broken_road_desc: "Разбитая Дорога, как ясно из её названия, действительно в весьма плачевном состоянии. Но поскольку она находится совсем рядом с потенциально опасными Ездоками Дождя, крайне важно не только восстановить регион, но и возвести там укрепления, чтобы обороняться от налётов с севера. Надёжная защита от рейдеров поможет вернуть Дороге процветание."

RWK_negotiate_with_razorsharks: "Разобраться с "Бритвоакулами""
RWK_negotiate_with_razorsharks_desc: ""Бритвоакулы" – небольшая банда, удачно захватившая хорошо укреплённую территорию и наносящая ущерб торговле одним своим присутствием. Мнения пони о том, как именно с ними поступить расходятся, но ясно одно – рано или поздно с ними придётся так или иначе разобраться."

RWK_subsidy_crimson_gunsmiths: "Субсидировать оружейников Кримзон"
RWK_subsidy_crimson_gunsmiths_desc: "Культ Кримзон, известный как Последний Прилив, нуждается в источнике дохода, которым стало производство оружия. Вне зависимости от отношения правительства к культу, нам действительно нужно как можно больше оружия. Небольшие субсидии позволят этим оружейникам расшириться, а их творениям – попасть в копыта нашей пехоты."

RWK_rebuild_equestria_fund: "Толчок для частного бизнеса"
RWK_rebuild_equestria_fund_desc: "Лишь немногие пони решаются открыть своё дело в пустоши – для большинства это слишком рискованная затея, чтобы даже мечтать о собственном бизнесе. Но именно торговля способна спасти пустошь, вернуть ей цивилизацию и процветание. Мы создадим фонд для поддержки местных предприятий, чтобы обеспечить развитие торговли и восстановление наших земель."

RWK_connect_hinterlands: "Соединить Внутренние земли"
RWK_connect_hinterlands_desc: "Торговля приносит процветание, но из-за проблем с инфраструктурой в наших отдалённых регионах темпы прироста значительно ниже ожидаемых. К счастью, решение очевидно: мы начнём строительство новых дорог в этих землях, что не только принесёт пользу местной экономике, но и упростит действия армии в этих районах."

RWK_powerlines_to_saltpan: "Линии электропередачи к Солончаку"
RWK_powerlines_to_saltpan_desc: "Электростанция в Солончаке производит немалое количество энергии, но без соединения с другими регионами большая её часть простаивает. Чтобы обеспечить максимальную отдачу, мы построим линии электропередач, благодаря которым энергия Солончака достигнет всех уголков страны без потерь."

RWK_future_in_chains: "Будущее в цепях"
RWK_future_in_chains_desc: "Красный Глаз доказал миру, что рабство, если его продвигает пони с чётким видением, может стать эффективным инструментом строительства нового мира. Кримзон Уотерс постановила ввести государственное рабство, надеясь, что использование подневольного труда даст экономике толчок, который позволит нагнать Филлидельфию."

RWK_treasures_of_past: "Сокровища прошлого"
RWK_treasures_of_past_desc: "В Ржавом Остове полно руин, в особенности давно покинутых и проржавевших старых кораблей. Но в их недрах до сих пор скрываются уникальные электронные компоненты, подобных которым не найти нигде в пустоши. Мы начнём национальную программу по сбору утиля, чтобы проникнуть в глубины этих судов и извлечь оттуда все ценности."

RWK_divert_funding_research: "Перенаправить финансирование на исследования"
RWK_divert_funding_research_desc: "Разумная экономика – это успешная экономика, и с этим трудно поспорить. Без инноваций и изобретений Ржавому Остову не видать процветания. Поэтому часть государственных средств будет направлена учёным и исследователям, что позволит улучшить научную базу, развивать технологии и восстановить утраченные знания."

RWK_build_on_past_success: "Опереться на прошлые успехи"
RWK_build_on_past_success_desc: "Эквестрия долгие годы оставалась крупнейшей экономикой мира благодаря сочетанию частного предпринимательства, минимального вмешательства государства и развитой социальной поддержки. Эта модель была стабильной и обеспечивала всеобщее процветание. Поэтому мы должны обратиться к проверенному опыту былой эквестрийской экономики."

RWK_siblings_faith_bondage: "Братья по вере и оковам"
RWK_siblings_faith_bondage_desc: "Рабство – тяжёлое испытание для пони, и многие из них находят утешение в немногих доступных им источниках. Поэтому мы позволим рабам делать перерыв от работы, если они будут посещать службы, проводимые Последним Приливом. Рабы смогут прикоснуться к истине, и, вдохновлённые верой, станут трудиться усерднее, чем прежде."

RWK_raid_jungle_slaves: "Набег за рабами из джунглей"
RWK_raid_jungle_slaves_desc: "Юго-восток полон племён, многие из которых идеально подходят для порабощения. Мы направим туда войска, которые будут грабить прибрежные деревни и захватывать в плен всех, кого удастся. Через четыре года рабы получат выбор: обратиться в истинную веру и присоединиться к гражданскому обществу или остаться в рабстве, цепляясь за ложных богов."

RWK_from_dappleshore_valkyrie: "Из Дапплшора в Валькири-Пойнт"
RWK_from_dappleshore_valkyrie_desc: "Между Дапплшором и Валькири-Пойнт отсутствует железнодорожное сообщение, что тормозит развитие местной экономики и создаёт проблему в случае необходимости снабжения армии. Поэтому будет построена новая железная дорога, чтобы обеспечить поставки для войск и купцов."

RWK_great_reclamation: "Великое возвращение"
RWK_great_reclamation_desc: "Наша земля полна пустующих уголков, где среди дикой природы рыщут агрессивные звери, хотя ранее там жили пони. Мы начнём масштабную программу по возвращению этих земель в пользование пони, дабы промышленность и процветание вновь вернулись на эти просторы."

RWK_trade_along_east_coast: "Торговля вдоль восточного побережья"
RWK_trade_along_east_coast_desc: "Мейнхеттен – это множество процветающих городов-государств с прекрасным торговым потенциалом. Главная проблема – рейдеры, блокирующие путь к ним. Но даже без них другие страны могут попытаться обложить пошлинами проходящие товары. Поэтому мы задействуем наш флот и начнём морскую торговлю с северными союзниками."

RWK_empower_merchant_captains: "Власть купцам и капитанам"
RWK_empower_merchant_captains_desc: "Никто не знает особенности работы бизнеса лучше его самого. Обязанность капитанов торговых судов и владельцев караванных компаний отчитываться перед центральным правительством лишь породит бюрократическую неразбериху. Вместо этого мы доверимся местным купцам и капитанам – они сами лучше знают, как вести свои дела."

RWK_skilled_manufacturing_slaves: "Ремесленное производство"
RWK_skilled_manufacturing_slaves_desc: "Многие рабы обращаются в культ Последнего Прилива, и теперь их можно обучить более тонкой работе, чтобы они могли производить композитные металлы и сложную электронику. Они продолжат трудиться даже после освобождения, обеспечивая нас доступом к редким и ценным ресурсам."

RWK_factories_rival_redeye: "Фабрики, не уступающие Филлидельфии"
RWK_factories_rival_redeye_desc: "По всему Ржавому Остову рабы и свободные пони трудятся плечом к плечу, восстанавливая старые фабрики и строя новые. Теперь многие смотрят на нас с восхищением: промышленность обогащает нашу землю, позволяя соперничать с Красным Глазом и быть альтернативным покупателем рабов."

RWK_maritime_prosperity: "Морское процветание"
RWK_maritime_prosperity_desc: "На морях нет рейдеров – лишь редкие пираты на дряхлых баржах. Морские пути – ключ к процветанию Ржавого Остова, и наши верфи будут строить всё больше торговых судов, доставляя ресурсы из далёких земель на благо всей нации."

RWK_encourage_local_industrialists: "Поддержать местных промышленников"
RWK_encourage_local_industrialists_desc: "Эквестрия отличалась от других стран вниманием к малому бизнесу – источнику процветания и изобретательности, питавшему всю нацию. Мы не должны позволить монополистам захватить экономику. Вместо этого стоит продолжить финансировать местный малый бизнес."

RWK_deregulate_whale_oil: "Снять ограничения на китобойный промысел"
RWK_deregulate_whale_oil_desc: "Охота на китов весьма жестока, но пустошь сама по себе немилосердна, а нашей нации нужны ресурсы, которые даёт китовый жир. Мы ослабим регулирование, чтобы извлечь выгоду из этого промысла. В конце концов, контроль всегда можно ввести снова."

RWK_sweat_and_bleed: "Пот и кровь во имя Прилива"
RWK_sweat_and_bleed_desc: "Большинство наших тружеников, как рабов, так и свободных, уже обратились в культ Последнего Прилива, и вера наполняет их невиданной прежде силой. Они могут работать изнуряюще долго, возводя фабрику за фабрикой, не ожидая никакой роскоши взамен – всё ради Последнего Прилива, всё ради Кримзон Уотерс."

RWK_industrializing_sunrise: "Индустриализация Санрайза"
RWK_industrializing_sunrise_desc: "Санрайз, расположенный на пересечении северных и южных торговых потоков – отличное место для инвестиций. Производимые здесь товары смогут свободно двигаться в обоих направлениях, что делает его приоритетом для государственного финансирования."

RWK_grand_capital: "Великолепная столица"
RWK_grand_capital_desc: "Городские районы очень производительны, но ни один из них не сравнится с Ржавым Остовом. Пони стекаются сюда со всей пустоши, стремясь трудиться на фабриках нашей столицы, число которых растёт с каждым днём. Некоторые уже называют Ржавый Остов новым Кантерлотом.\nТолько не надо путать нас с южными республиканцами."

RWK_crimson_method: "§RМетод Кримзон§!"
RWK_crimson_method_desc: "Вера для простого рабочего ценнее золота: пони, трудящиеся за крышки, прикладывают лишь необходимый минимум усилий, тогда как те, кто трудится ради веры, всегда выкладываются полностью. Портреты Кримзон Уотерс будут висеть в каждой фабрике и мастерской, наполняя сердца верой, необходимой для того, чтобы работать усерднее, лучше и быстрее."

RWK_assimilate_local_cultures: "Ассимиляция местных культур"
RWK_assimilate_local_cultures_desc: "Недопустимо, чтобы пони чувствовали себя чужими в нашей нации из-за пустяков вроде культуры. Эквестрия была многонациональным государством, и Ржавый Остов последует её примеру. Любые местные культуры будут ассимилированы в единую общую."

RWK_wealth_of_oceans: "§CБогатства океанов§!"
RWK_wealth_of_oceans_desc: "Капитаны, купцы и всевозможные торговцы со всей пустоши стекаются в Ржавый Остов, чтобы продавать товары на рыночных условиях, оставлять крышки в местных лавках и поддерживать национальную промышленность. Наша держава по праву стала торговой столицей всего региона, не имеющей себе равных."

RWK_foundries_of_summerfield: "Литейные цеха Саммерфилда"
RWK_foundries_of_summerfield_desc: "В Саммерфилде осталось немало заброшенных фабрик, которыми не умели пользоваться Дождевые Ездоки. А многие из них вдобавок были повреждены во время стычек рейдеров с силами государства Эмпайр и "когтей" Редвинга. Теперь, когда этот некогда процветающий район находится под нашим контролем, мы можем вновь разжечь пламя промышленности в этих цехах."

RWK_buy_foreign_expertise: "Приобрести иностранный опыт"
RWK_buy_foreign_expertise_desc: "Многие учёные скитаются по пустоши, по тем или иным причинам изгнанные из дома. Вольнодумные писцы Стальных Рейнджеров, дашиты и многие другие умные пони могут захотеть помочь нам в обмен на горстку крышек. Стоит воспользоваться ошибками других и привлечь опыт и знания этих учёных."

RWK_rebuild_freeside_powerplant: "Восстановить гидроэлектростанцию Фрисайда"
RWK_rebuild_freeside_powerplant_desc: "На реке Мейр расположена крупная гидроэлектростанция. Только вот рейдеры-гонщики давно-давно частично разобрали её оборудование, чтобы использовать детали в своих безумных машинах. К счастью мы, как морская держава, обладаем подходящими знаниями и возможностями, чтобы вновь вернуть электростанцию к жизни."

RWK_strip_silverwing_bare: "Обобрать Сильвервинг до основания"
RWK_strip_silverwing_bare_desc: "Армейский склад Сильвервинг долгое время использовался Звонарями в их тёмных делишках, однако гангстеры так и не осознали весь потенциал находящихся там систем. Мы разберём на запчасти  компьютеры, машины и всё прочее сломанное оборудование базы, чтобы из этого хлама создать нечто новое."

RWK_ever_deeper_mines: "Копать всё глубже"
RWK_ever_deeper_mines_desc: "Шахты Глубины уже давно находятся под контролем Апрельской Рощи, сравнительно небольшой и слабой державы. И даже при поддержке Звонарей их добывающие возможности были очень ограничены. К счастью, мы достаточно богаты, чтобы профинансировать шахтёров и создать одну из самых глубоких шахт во всей пустоши."

RWK_golden_sun_rises: "§OЗолотой рассвет§!"
RWK_golden_sun_rises_desc: "Над Ржавым Остовом восходит солнце, озаряя землю, отражающую величие прошлого. Фабрики и лавки простираются во все концы, куда только падает взгляд. Эквестрия возродилась в нашем уголке пустоши. Теперь Фонд восстановления Эквестрии можно закрыть, ведь каждый, кто видит наши успехи, понимает: Эквестрия всё ещё жива."


###Naval-Tree###

RWK_reign_in_spending: "Сократить расходы"
RWK_reign_in_spending_desc: "Как бы приятно ни было иметь большой флот, сейчас наша нация не в состоянии продолжать масштабное финансирование кораблестроения. Пришло время сократить военно-морской бюджет – хотя бы на время, пока мы не определим, в каком направлении мы хотим развиваться дальше."

RWK_dappleshore_dockyards: "Верфи Дапплшора"
RWK_dappleshore_dockyards_desc: "Дапплшор – самый южный край нашей страны, расположенный в стратегически важном районе, который может оказаться чрезвычайно важным в случае конфликта на юге. Пришло время улучшить местную морскую инфраструктуру, чтобы город был готов ремонтировать и вводить в строй корабли для операций в южных водах."

RWK_tideyards_thinktank: "Флотский аналитический центр"
RWK_tideyards_thinktank_desc: "Вне зависимости от размера наш флот станет бесполезным, если мы перестанем развивать технические знания. Море непрестанно меняется, и моряки должны быть готовы к переменам. Поэтому будет создан новый аналитический центр, чтобы изучать морскую войну и гарантировать, что мы сумеем адаптироваться к переменчивой стихии."

RWK_refurbish_naval_armaments: "Адаптировать морское вооружение к пустоши"
RWK_refurbish_naval_armaments_desc: "Многие наши корабли всё ещё оснащены так, словно им предстоит сражаться с судами полосатых ещё со времён Великой войны. Но большинство кораблей в пустоши слабо бронированы, а также куда меньше и манёвреннее. Поэтому необходимо адаптировать вооружение под новые цели, иначе вся мощь флота рискует проиграть хлипким корытам из металлолома."

RWK_return_reasonable_budgets: "Торговый, не военный бюджет"
RWK_return_reasonable_budgets_desc: "Процветание нашей стране принесёт торговля, а не гигантские линкоры и крейсеры. Мы должны ещё сильнее сократить расходы на флот, чтобы вложить средства в развитие экономики. В конце концов, новые инвестиции всегда можно использовать для строительства дополнительных верфей."

RWK_catch_up_hull: "Производство новых корпусов"
RWK_catch_up_hull_desc: "Корабельной пушке нужен корпус, чтобы выйти в море: оружие без корпуса – всего лишь музейный экспонат, а корпус без оружия – лёгкая добыча. Мы должны постоянно совершенствовать наши корабли, чтобы их корпуса были готовы к размещению любого вооружения, которого потребует ситуация в пустоши."

RWK_intra_ship_systems: "Совершенствовать корабельную электронику"
RWK_intra_ship_systems_desc: "Электроника позволит значительно повысить контроль наших кораблей и всего оборудования в целом. Радио обеспечивает мгновенную связь между капитанами капитанов, радары обнаруживают невидимые глазом угрозы, а компьютеры ускоряют наведение орудий. Электроника – будущее морской войны."

RWK_restructure_naval_budget: "Реструктуризация бюджета"
RWK_restructure_naval_budget_desc: "Наш флот заслуживает лишь самого лучшего, так что пришло время соответствующим образом адаптировать бюджет. Суммы на морские расходы больше не будут браться "с потолка" – вместо этого мы начнём финансировать спуск на воду всё большего количества кораблей. Наши верфи будут работать, пока мы не достигнем абсолютного господства на море."

RWK_convert_hms_goldenheart: "Переоборудовать "Голденхарт""
RWK_convert_hms_goldenheart_desc: "Корабль Её Величества "Голденхарт" – самый обычный крейсер, ремонтом которого давно пренебрегали. Поэтому мы не будем тратить средства на его восстановление для боя, а вместо этого переоснастим корабль для обучения морских пехотинцев. Тренировки на настоящем судне позволит им весьма эффективно подготовиться к будущим операциям."

RWK_focus_mercantile_shipping: "Величайший торговый порт восточного побережья"
RWK_focus_mercantile_shipping_desc: "Поскольку наши верфи больше не так загружены строительством кораблей, они могут принимать больше зарубежных торговцев. Корабли со всего восточного побережья будут швартоваться у наших причалов, оплачивая мелкий ремонт и продавая свои товары по всей стране, принося процветание рынкам и укрепляя нашу прибрежную экономику."

RWK_revive_carrier_concept: "Послевоенные авианосцы"
RWK_revive_carrier_concept_desc: "Авианосцы должны постоянно адаптироваться, чтобы угнаться за стремительно возрождающейся наукой об авиации. Авианосцы времён войны были рассчитаны лишь на актуальные в те времена самолёты, но нам же приходится адаптироваться."

RWK_iron_kraken_doctrine: "Ставка на линейные корабли"
RWK_iron_kraken_doctrine_desc: "У нас есть то, чем не может похвастаться никто другой в пустоши – настоящие линейные корабли с мощными орудиями и толстой бронёй. Господство на море завоёвывается не одними лишь эсминцами и крейсерами, а могучими линкорами и дредноутами. Пусть же наша доктрина отражает этот факт и сосредоточится на тяжёлых кораблях."

RWK_refurbish_hms_indomitable: "Начать переоборудование"Санрайза""
RWK_refurbish_hms_indomitable_desc: "Корабль Её Величества "Санрайз" когда-то был флагманом Селестийского флота под командованием самого Хай Тайдса. Со временем он пришёл в упадок, что совершенно неприемлемо для столь гордого судна. Пора восстановить его и сделать символом нашего морского превосходства."

RWK_hook_up_reactors: "Подключить реактор к энергосети"
RWK_hook_up_reactors_desc: ""Голденхарт", как и большинство прочих крейсеров, оснащён собственным реактором, питающим всё оборудование на борту. Однако учебному кораблю не требуется столь высокая мощность. Вместо этого мы можем использовать этот реактор для выработки электричества на благо всей страны."

RWK_strip_non_essential_parts: "Демонтаж лишних частей"
RWK_strip_non_essential_parts_desc: ""Голденхарт" больше не будет использоваться в бою, но судно полно ценных запчастей, которые могут пригодиться на других кораблях. Опытные мусорщики избавят эту посудину от лишних частей, сохранив при этом её пригодной в качестве учебного корабля."

RWK_advanced_propulsion_systems: "Подготовка к морским высадкам"
RWK_advanced_propulsion_systems_desc: "Наши морские пехотинцы – гордость нации, а раз мы можем контролировать водные просторы, то станет вполне естественно использовать их для высадок. На наших собственных пляжах мы начнём новую программу подготовки солдат, которая поможет подготовить наших отважных морпехов к высадкам в тыл врага."

RWK_long_range_detection: "Дальнее обнаружение"
RWK_long_range_detection_desc: "Знание – это уже половина победы. Если ты узнаёшь о враге раньше, чем он о тебе, то можешь выиграть даже неравный бой или, при заметной разнице в силах, вовремя отступить. Поэтому мы должны разработать радары дальнего действия, чтобы наши корабли могли засекать противника раньше, чем он заметит нас."

RWK_wateland_armor_schemes: "Усиленное бронирование"
RWK_wateland_armor_schemes_desc: "Всего лишь один миллиметр брони может стать разницей между гибелью корабля и лишь серьёзными повреждениями. Броня защищает наших моряков и боезапас, позволяя кораблям дольше оставаться в строю. Не будем экономить на бронировании наших тяжёлых кораблей."

RWK_repair_the_railguns: "Починить корабельные рельсотроны"
RWK_repair_the_railguns_desc: "Рельсотроны используют силы электромагнетизма для разгона снаряда по рельсам до колоссальных скоростей. В годы войны они считались одной из наиболее передовых разработок Эквестрии. Многие наши корабли всё ещё оснащены подобным оружием, так что нужно лишь поручить специалистам хорошенько проверить их и подготовить к вводу в эксплуатацию."

RWK_kickstart_the_reactor: "Восстановить камеры мегазаклинаний"
RWK_kickstart_the_reactor_desc: "Тактические мегазаклинания способны переломить ход любого сражения. У нас всё ещё есть несколько матриц для сотворения подобных чар, так что давайте вложим ресурсы в камеры для их наложения, чтобы дать нашим кораблям преимущество, которого не будет ни у одного другого флота в пустоши."

RWK_floating_dockyards: "Плавучие верфи"
RWK_floating_dockyards_desc: "Верфи вовсе не обязательно строить на суше – напротив, размещение их на земле отнимает ценное пространство, которое можно использовать для других проектов. Поэтому мы создадим плавучие верфи, которые смогут строить новые корабли и ремонтировать существующие, не занимая при этом прибрежную территорию."

RWK_bane_of_pirates: "Обезопасить моря"
RWK_bane_of_pirates_desc: "Пустошь – не место для огромных кораблей и дредноутов: большинство врагов на волнах – пираты на лоханках да дырявых шлюпах. Поэтому нам не стоит тратить ресурсы на тяжёлые корабли. Вместо этого мы построим множество быстрых и эффективных лёгких судов, которые смогут защитить моря как от пиратов, так и от других противников."

RWK_superiority_of_fire: "Огневое превосходство"
RWK_superiority_of_fire_desc: "Как решить любую проблему? Взять пушку побольше. А если не сработает, то добавить ещё одну. Повторять до аннигиляции проблемы. Наши корабли способны нести оружие тяжелее, чем любая наземная машина, так давайте воспользуемся этим и вложимся в крупнокалиберные орудия."

RWK_modern_escort_ships: "Современные корабли сопровождения"
RWK_modern_escort_ships_desc: "Крупные корабли бесполезны без надлежащего эскорта, готового прикрыть их от торпед и принять на себя огонь лёгкого оружия. Если мы будем полагаться на устаревшие проекты, то потеряем костяк флота. Мы должны сосредоточиться на улучшении и разработке современных кораблей сопровождения."

RWK_naval_hegemon: "Морской гегемон"
RWK_naval_hegemon_desc: "Наши тяжёлые корабли не имеют равных и вызывают зависть у любой морской державы пустоши. Весь флот строится вокруг этих гигантов, которые приносят нам победу в каждом сражении и величайший уровень престижа. Давайте, наконец, сделаем линейные корабли краеугольным камнем наших доктрин."

RWK_integrate_cnc_matrix: "Интегрировать защитные талисманы"
RWK_integrate_cnc_matrix_desc: "Защитным талисманам нужно лишь немного магии, чтобы дать тот же эффект, что и массивная броня. Их использование позволит нам существенно снизить массу кораблей. Чем больше брони мы заменим талисманами, тем больше орудий сможем установить на этих красавцев."

RWK_warships_to_factories: "От боевых кораблей к кораблям-фабрикам"
RWK_warships_to_factories_desc: "Многие наши корабли, особенно тяжёлые, ржавеют без дела из-за колоссального превосходства лёгких судов в защите торговых путей. Однако и для них можно найти применение. Многие такие корабли были принудительно поставлены на прикол, чтобы использоваться как защищённые оружейные фабрики."

RWK_equestrias_true_fleet: "Истинный флот Эквестрии"
RWK_equestrias_true_fleet_desc: "Мы – наследники Селестийского флота, и после множества реформ морских доктрин, сил и новых исследований мы можем с гордостью заявить: флот вернулся. Корабли вольно и гордо несут знамя Ржавого Остова от Мейнхеттена до Балтимейра, и наше господство на море никто не подвергает сомнению."

RWK_queen_of_oceans: "Королева океанов"
RWK_queen_of_oceans_desc: "После немалых вложений корабль Её Величества "Санрайз" наконец может вернуться в строй, чтобы возглавить Селестийский флот и вести нашу нацию к светлому будущему. После небольшой торжественной церемонии корабль вновь выйдет в море, готовый сокрушать всех недругов Ржавого Остова."


###Army-Tree###

RWK_treat_army_as_equals:0 "Независимое армейское командование"
RWK_treat_army_as_equals_desc:0 "Хотя истоки Ржавого Остова связаны с морем и флотом, невозможно отрицать тот факт, что в пустоши не выжить без наземной армии. Чтобы провести достойные реформы наших сухопутных войск, мы создадим независимое армейское командование."

RWK_codify_marine_corps:0 "Учредить корпус морпехов"
RWK_codify_marine_corps_desc:0 "Королевские морские пехотинцы были одним из многих предметов гордости Эквестрии во время войны, и это наследие Ржавый Остов не забыл. Будучи идеальным связующим звеном между сухопутными и морскими силами, морская пехота станет важнейшим столпом всех военных операций."

RWK_enforce_training_standards:0 "Ужесточить стандарты подготовки"
RWK_enforce_training_standards_desc:0 "Мы не станем армией сброда, подобной "воинству" Филлидельфии или иных сил пустоши. Ржавый Остов построен хорошо обученными и профессиональными солдатами, так что мы не намерены менять подход. Наша пехота будет обучена как можно лучше, что обеспечит наивысшую боевую эффективность."

RWK_lift_arms_restrictions:0 "Инвестиции в стрелковое оружие"
RWK_lift_arms_restrictions_desc:0 "Хотя мы хорошо понимаем важность тяжёлого вооружения кораблей, исследованиями стрелкового оружия долгое время пренебрегали. Однако именно оно выигрывает войны: солдат с пулемётом всегда одержит верх над солдатом с однозарядной винтовкой. Мы должны вложиться в развитие стрелкового вооружения, чтобы обеспечить превосходство нашего снаряжения."

RWK_practise_invasion_tactics:0 "Снабжение по морю"
RWK_practise_invasion_tactics_desc:0 "Будучи морской державой, мы можем использовать для снабжения нашей армии не только железные дороги. Наши корабли способны перевозить множество орудий, огромное количество боеприпасов, а также неисчислимые запасы продовольствия и топлива для войск. Морская транспортировка обеспечит наши армии всем необходимым."

RWK_arms_the_spearhead:0 "Вооружить авангард"
RWK_arms_the_spearhead_desc:0 "Спецназ всегда должен быть готов адаптироваться к меняющимся обстоятельствам. Сегодня нашим морпехам может потребоваться высадка на равнины, а завтра – в городские джунгли Мейнхеттена или в настоящие джунгли Хэйсида. Пусть наши аналитики подготовят их ко всем возможным сценариям."

RWK_drills_drills_drills:0 "Учения, учения и ещё раз учения"
RWK_drills_drills_drills_desc:0 "Хорошо подготовленный солдат – это тот, кто выжил, а хорошо подготовленный офицер остаётся стойким и непреклонным даже в самые тяжёлые времена. Солдаты, офицеры и генералы будут постоянно проводить учения и военные игры, чтобы наша сухопутная военная доктрина непрерывно совершенствовалась."

RWK_motorization_effort:0 "Моторизация"
RWK_motorization_effort_desc:0 "Скорость – ключ к победе, ведь на войне дорога каждая секунда. Мы начнём вспоминать принципы использования грузовиков, так как эти быстрые машины позволят нашим войскам захватывать позиции противника и перехватывать подкрепления или снабжение ещё до того, как они достигнут вражеских сил."

RWK_provide_fire_support:0 "Огневая поддержка"
RWK_provide_fire_support_desc:0 "Одних малокалиберных орудий недостаточно, чтобы выиграть каждое сражение: пехотинцу нередко приходится выбивать врага из укрытия или нуждаться в подавляющем огне, чтобы переместиться с одной позиции на другую. Мы подготовим специализированные группы поддержки, вооружённые взрывчаткой для выкуривания противников и тяжёлым вооружением для защиты своих."

RWK_best_and_bravest:0 "Наша элита"
RWK_best_and_bravest_desc:0 "Корпус морской пехоты и все специальные подразделения – это элита элит. Давно канули в прошлое старые стереотипы о морпехах: теперь каждый солдат – будь то из флота, авиации или сухопутных войск – знает, что в морскую пехоту и спецподразделения принимают лишь лучших, сильнейших и умнейших среди нас."

RWK_power_armored_marines:0 "Морпехи в силовой броне"
RWK_power_armored_marines_desc:0 "Силовая броня была одной из отличительных черт эквестрийской армии во время войны, хотя на морском театре боевых действий она почти не применялась. Однако эти тяжёлые бойцы прекрасно могут действовать бок о бок с обычными морпехами, обеспечивая мобильное укрытие и выступая в роли миниатюрных танков при самых тяжёлых высадках."

RWK_utilize_magic:0 "Использовать нашу магию"
RWK_utilize_magic_desc:0 "Мы – пони, а магия – наша отличительная черта. Единороги составляют значительную часть нашего войска, но даже земные пони обладают собственной магией. Давайте раскроем тайны магии и применим её в нашей армии."

RWK_cloaked_in_finest_steel:0 "Заполучить высокотехнологичные чертежи"
RWK_cloaked_in_finest_steel_desc:0 "Мы заняли территорию, ранее принадлежавшую высокотехнологичной фракции, и теперь наши учёные и исследователи тщательно изучают всё, что оставили после себя их специалисты. Благодаря этому мы сможем получить технологическое превосходство над любыми будущими врагами и создать оружие, даже более совершенное, чем у Эквестрии времён войны."

RWK_division_level_integration:0 "Расширение рот поддержки"
RWK_division_level_integration_desc:0 "Выживаемость пехоты напрямую зависит от поддержки: пехотинец без помощи имеет все шансы очень быстро погибнуть или обратиться в бегство. Неважно, будет ли эта поддержка заключаться во взрывчатке, боевых наркотиках или чём-то ещё – мы должны вкладываться в развитие рот поддержки, чтобы наша пехота действовала максимально эффективно."

RWK_lessons_from_corps:0 "Уроки высадки в Стейблсайде"
RWK_lessons_from_corps_desc:0 "Зебры высадились на юго-востоке Эквестрии, и именно морпехам было поручено провести встречную высадку в Стейблсайде. Да, их попытка вернуть город потерпела неудачу, но мы нашли шары памяти старых морпехов, которые сражались против полосатых в этом великом городе. Мы должны изучить эти воспоминания и применить их опыт для подготовки собственных морпехов."

RWK_proliferate_squad_weapons:0 "Выживи сегодня ради завтра"
RWK_proliferate_squad_weapons_desc:0 "В пустоши осталось куда меньше пони, чем жило во время войны. Мы не можем полагаться лишь на качество вооружения, если у нас не будет пони, способных им пользоваться. Необходимо вкладываться в развитие госпиталей, подготовку полевых медиков и производство лекарств, иначе мы рискуем остаться без рекрутов."

RWK_equal_in_rank_honor:0 "Равные в звании и чести"
RWK_equal_in_rank_honor_desc:0 "Когда-то армию считали посмешищем по сравнению с флотом, и многие, кто вступал в сухопутные войска, подвергались насмешкам со стороны моряков. Но сегодня армия доказала, что она современна, компетентна и боеспособна. Отныне армия и флот будут идти плечом к плечу – никто не важнее другого, оба равные в своём достоинстве."


###Air-Tree###

RWK_take_to_skies: "Take to the Skies"
RWK_take_to_skies_desc: "Aviation is an art that has long been neglected by our nation, ever since the air command abandoned High Tides on the Last Day. However, to our south, the Enclave and Red Eye both have the ability to fly, and with it, they've become a lot more dangerous. It's time to shake off our sea legs, and take to the skies once more, so that our enemies do not dominate it alone."

RWK_sunrise_skyyards: "Sunrise Skyyards"
RWK_sunrise_skyyards_desc: "The province of Sunrise will be home to a massive air base, due to its good location. We will tear down some local industry to build up airports, able to host the first of our new air craft. Having these airports will also allow us to do some test flights of what we've produced."

RWK_experimental_support_aircraft: "Hunter-Killer Helis"
RWK_experimental_support_aircraft_desc: "Planes and cloud ships are not the only aircraft that dominate the air, as the often overlooked helicopter shows. While helicopters are not fit to fight for air superiority like planes, they are able to provide unmatched close air support to our ground forces. Let us invest in helicopters, so our control of the air can become control of the ground."

RWK_aeronautical_wargames: "Aeronautical Exercises"
RWK_aeronautical_wargames_desc: "Being a naval based country, it is only natural that we train our pilots to fly over both land and sea. We will begin a mass training program for every pilot, where they will fly in and around our ships, ensuring a close connection between our air and our naval forces, so both grow a mutual trust for each other."

RWK_behemoths_of_heavens: "Behemoths of the Heavens"
RWK_behemoths_of_heavens_desc: "Blimps are a sight to behold, able to hold weapons unmatched by any other form of air craft, they are leviathans dominating the sky. Much like how every good navy needs a capital ship, our Air Force needs a capital ship as well, and no better candidate fits that purpose than a massive blimp."

RWK_invasion_air_sea: "Flying Invasion Support"
RWK_invasion_air_sea_desc: "Control of the air allows for more than just close air support and clear skies for our infantry, it also allows for emergency supply drops to soldiers in need. Our marines, and our regular land based forces will be glad to have us invest in cargo planes, so that we can drop off new supplies to those who need them, and allow invasions to continue unfettered."

RWK_heavy_support_fighter: "Heavy Support Fighters"
RWK_heavy_support_fighter_desc: "Not every solution can be solved by interceptors or by quick and maneuverable fighters with only a few guns. Sometimes, a pony needs something slow, something armored, something strapped to Tartarus and back with ordinance and guns. Heavy fighters will provide exactly that."

RWK_skyfleet_concept: "Reintroduce Formation Bombing"
RWK_skyfleet_concept_desc: "Bombing is an art form the Wasteland has long forgotten, but nothing is quite as nice as dropping kilograms of bombs onto your enemies. Our bombers shall be trained in classic formation flying, like in wartime Equestria, ensuring every bombing run hits the proper target."

RWK_flying_carrier_doctrine: "Simplified Airframes"
RWK_flying_carrier_doctrine_desc: "Even the most quality, best built plane will find itself screwed over if it's outnumbered, even if outnumbered by bad designs. While we won't sacrifice quality, we can make our planes more streamlined, and more able to be mass produced. This will also help our pilots better transition from training to actual missions."

RWK_zebrica_bomber: "Revive the §tZebrica Bomber§! Program"
RWK_zebrica_bomber_desc: "Deep in wartime facilities lay plans for what are called the Zebrica Bombers, bombers built to be loaded down with more bombs and fly far enough to reach Zebrica. While we have no desire to fly all the way to Zebrica, we can study these plans and apply them to our current bombers, allowing them to carry heavier ordinance and allowing them to fly further without refueling."

RWK_reverse_engineering_cloudships: "Reverse-Engineer Cloudships"
RWK_reverse_engineering_cloudships_desc: "Neighvarro and the Grand Pegasus Enclave, being left with little to do in the sky, have invented aircraft like no other. Now with access to Neighvarro, and to some captured scientists and schematics, we can study and potentially reproduce the aircraft that made the GPE so dangerous."

RWK_magical_propulsion_systems: "Arcanomechanical Airframe Construction"
RWK_magical_propulsion_systems_desc: "Advanced aircraft is very hard to understand or build, and only very, very well educated ponies and scholars could potentially do it. Luckily for us, we've come across a source for those educated ponies, and we're now able to use them to create more, and more advanced air craft."


###Crimson Waters Path###

RWK_carmine_turn_the_waves: "§cCarmine§! Turn the Waves"
RWK_carmine_turn_the_waves_desc: "Rustwreck has fallen to our machinations!\nWhile many of our fanatical supporters would like to lynch anypony that opposed us, but we want to foster a proper society, not some nightmare state. For this purpose, Crimson and her inner circle have compiled a list of 500 or so names. Come dawn, these names will leave the census and enter the obituaries."

RWK_unbreakable_hierarchy: "New Hierarchies"
RWK_unbreakable_hierarchy_desc: "For the longest time, Rustwreck was in essence a small civilian government subordinate to the Admirality. We will have to revamp this and put our new civilian government in charge. While some argue that this might weaken the Cult, Crimson's plan is for the Cult to so thoroughly integrate into everyday life that it's existence will never even be a matter of discussion."

RWK_mask_off: "Mask Off"
RWK_mask_off_desc: "Now that we are in control we can integrate our strongholds into society proper. Guerilla fighters will become townguards, those that built walls now help build houses and some particularly educated ponies might even notice that many 'blood rituals' the cult practises suspiciously seem to follow Equestrian medical procedures, leading to some very predictable miracle cures."

RWK_purge_the_admirality: "Disarm the Admirality"
RWK_purge_the_admirality_desc: "As the former rulers of Rustwreck, the Admirality poses the last true threat to our plans. Luckily, a combination of faith and caps has loosened certain lips giving us an in. We can't disarm them in one fell swoop, but will gradually replace uncooperative officers and reward those loyal to the cause."

RWK_replace_the_cap: "Replace the Cap"
RWK_replace_the_cap_desc: "How are Bottlecaps even a sustainable currency?\nWe will replace them with National Scrip, small metal rods with identifying marks etched into them, as our internal currency. To keep 'on theme' we will also lacqer the currency blood red."

RWK_finish_of_the_rain_riders: "Finish Off [RAR.GetNameDef]"
RWK_finish_of_the_rain_riders_desc: "The Rain Riders are raiders who specialize in vehicles, and they sit upon the valuable land of Summerfield. Their land is home to resources, industry, and population that will be much better served fighting for the Endtide. Let us march north, and take their land for our own."

RWK_let_all_work_as_one: "We All Work as One"
RWK_let_all_work_as_one_desc: "Luxury goods are just that, a luxury, and the faithful of true Endtide need nothing but faith to keep them going. Our industry shall be retooled for maximum efficiency, turning away from production of luxury civilian goods, and instead towards national purposes. This is the first step to matching Fillydelphia in strength."

RWK_fold_in_sdc: "Fold in the §OS.D.C.§!"
RWK_fold_in_sdc_desc: "The Sunrise Development Council shall be folded into a new organisation focused on stabilizing the economy, and ensuring continued growth: §OThe Clockwork Cathedral§!\nFor this purpose, we will build them a new headquaters in Westshore."

RWK_the_saltpan_conference: "The Saltpan Conference"
RWK_the_saltpan_conference_desc: "Rustwreck is a great city, but it can't compare to Fillydelphia or Manehattan. If we want to lead the Heartlands into the future the city must grow, and Crimson Tides has a plan to force this growth at unprecedented rates..."

RWK_amnesty_for_service: "Amnesty for Service"
RWK_amnesty_for_service_desc: "We have a large number of individuals of questionable loyalty that are currently taking up resources as prisoners or under state-surveillance. We will offer them a choice to enlist for 5 years in either military or civil construction service in order to 'clear their name' while turning them into net-contributors to our nation."

RWK_begin_the_great_syncretism: "The Great Syncretism"
RWK_begin_the_great_syncretism_desc: "The Cult of the Endtide has by now assimilated a plurality of our Core population. However, if we wish to expand across the wasteland, we will need faster and more sophisticated methods to induct ponies into our way of life."

RWK_march_on_freeside: "March on Freeside"
RWK_march_on_freeside_desc: "The Speedfreaks are the rivals to the Rain Riders, holders to a beloved philosophy about the freedom of the road. Taking Freeside from their control will give us more resources to work with. In addition, these raiders are uniquely ready to be converted to the Endtide, we just merely need to incorporate their philosophy."

RWK_everypony_serves: "Everypony Serves"
RWK_everypony_serves_desc: "It doesn't matter who you are, if you serve the Endtide, then you will constantly serve its purposes. Every member of the cult and nation, from the high Crimson Waters to the lowliest slave will work each and every hour, fueled by faith and spirit. In the fields, in the factories, in the army, the Endtide lifts all boats in its wake."

RWK_built_for_war: "Built for War"
RWK_built_for_war_desc: "Our economy is shifting away from a focus on just construction, towards production of necessary equipment for the military, to ensure the Endtide will be unmatched in our stockpiles. Already, Crimson has ordered more arms manufactures, owned and operated by the Endtide, to produce guns, bombs, and bullets galore."

RWK_send_out_missionaries: "Send out 'Missionaries'"
RWK_send_out_missionaries_desc: "Nothing's better for some good old fashion manufacturing of consent than missionaries and their work. To all our neighbors will go clever and charismatic missionaries, working to destabilize their nations, convert their soldiers, and ensure that when the time comes, all will fall to the tide."

RWK_spend_leftover_caps: "Spend Leftover Caps"
RWK_spend_leftover_caps_desc: "Our changes to the economy has left us with a massive amount of money. It's time we put this excess money to use, our beloved leader, Crimson, needs only to decide what to do with it."

RWK_ultimatum_for_stajniopolis: "Ultimatum for Stajniopolis"
RWK_ultimatum_for_stajniopolis_desc: "The Stable nation of Stajniopolis is filled with resources, factories, and well educated ponies, yet they also lack one thing, a large army. Their Stable is defensive, though, and these ponies are reasonable, unlike the raiders fought before. Crimson will draft a letter asking for the Stable ponies to surrender and join willfully. If they say no, well, their mistake."

RWK_raider_engineering: "Adapt Raider-Engineering"
RWK_raider_engineering_desc: "The Rain Riders and Speedfreaks are mechanics beyond compare. Their obsession with speedy vehicles have created death machines better than anywhere else in the Wasteland, and even better, the raiders love making more deadly vehicles. Let's recruit some raider scholars, and put them to work making even more deadly vehicles."

RWK_fanatic_devotion: "Fanatic Devotion"
RWK_fanatic_devotion_desc: "Faith fills the heart of every believer in the Endtide, faith in the great plan of Crimson, and all that she will do. With the faithful, there will be no questioning, no second guessing, and no doubt, only devotion and zealotry."

RWK_work_in_bondage_fight_for_freedom: "Fight in Bondage to Live in Freedom"
RWK_work_in_bondage_fight_for_freedom_desc: "There's no better way to encourage slaves than to give them a way to freedom, especially when free ponies are treated so well. We will begin a national program, allowing slaves to willingly join the army, and after a period of service, they will be free. Hopefully this will encourage their fellow slaves to work harder, knowing they can be free."

RWK_strong_bodies_strong_minds: "Strong Bodies, Stronger Minds"
RWK_strong_bodies_strong_minds_desc: "A healthy mind starts with a healthy body, and with our control over the country assured, every member of the Endtide is assured good health. Many struggling ponies have proven themselves to be smart scholars after being helped, with many offering their intelligence to studying ways to keep all ponies healthy, happy, and smart."

RWK_feed_the_hungry_train_the_weak: "Feed the Hungry, Train the Weak"
RWK_feed_the_hungry_train_the_weak_desc: "A rising tide lifts all boats, and similarly, the Endtide will uplift all ponies who follow it. The hungry shall be hungry no more, as priests go from town to town, giving out bread and food to the needy. The weak shall be weak no more, and instead shall be trained to be as strong as our soldiers. A strong society, a satiated society, is a stable society. Not to be confused with a Stable society."

RWK_build_for_final_struggle: "Build for the Final Struggle"
RWK_build_for_final_struggle_desc: "The time swiftly approaches for the Endtide to sweep south, and destroy the empires of Fillydelphia, bringing faith and joy in our wake. As the time nears closer, every pony can feel the need to work harder, work faster, for if we are not prepared, this final struggle will end in disaster, not in victory."

RWK_spread_the_faith: "Spread the Faith"
RWK_spread_the_faith_desc: "The border provinces of The Mob have fallen in love with the Endtide the more they've learned about it. These ponies wish to escape from the grasp of The Ringers, away from decadence, and instead to the warm embrace of faith. All we need to do is defeat a few small border patrols, to scare away their current owners, and claim this land for ourselves."

RWK_break_mudburg: "Break Mudburg"
RWK_break_mudburg_desc: "While Mudburg is a place that struggles, it is still invaluable to the Endtide. It's ponies, beaten down and dirty, will be joyous and faithful converts when we take them over. It's land will serve as a good supply point for our push south, and even give us an easy pincer maneuver on the Mob lands. Let us take this nation, and uplift them."

RWK_liberators_by_another_name: "Liberators by Another Name"
RWK_liberators_by_another_name_desc: "Many ponies are afraid of us, of our use of slavery, of our use of blood in our rituals. But, we will show these skeptics the value of the Endtide, as even our slaves live better lives than free ponies do elsewhere. We bring food, we bring security, we bring faith, we liberate you from hunger, from death, and from hopelessness. Some might call us thugs, but we're a true force of liberation."

RWK_hook_line_sinker: "Hook, Line and Sinker"
RWK_hook_line_sinker_desc: "Crimson watches over the cult of the Endtide happily every night, watching as the ignorant and weak fill their hearts with faith, and follow in her stead. Soon, the time will come when the Endtide will no longer be necessary, when faith can be set aside, and when ponies can live free. But for now, ponies listen, ponies follow, ponies believe Crimson, all her lies, hook, line, and sinker."

RWK_all_comforts_from_faith: "All Comforts from Faith"
RWK_all_comforts_from_faith_desc: "Luxury goods aren't something to be celebrated in the place of faith, but the good news is, faith can also be a luxury good. Portraits and statues of Crimson fill the factories, entire factories print books and scraps of paper with Crimson's quotes on them, bringing ponies more comfort than any other form of luxury."

RWK_only_one_may_reign: "Only One May Reign"
RWK_only_one_may_reign_desc: "The Heartlands region of Equestria stands at a tipping point, as the final battle for the fate of the Heartlands comes closer. The Endtide's endless armies march like a crimson wave, ready to wash away enemy defenses and erode their armies to nothing. The final struggle approaches, and when the dust settles, only one will remain, one Endtide, for all."

RWK_enshrine_the_clergy: "Constitutionalize the Clergy"
RWK_enshrine_the_clergy_desc: "The power of the clergy is confusing, even to the clergy themselves, with many members of the clergy differing to Crimson at all times. It's time to finalize the power the clergy will have, and in doing so, turn our lands from a society with a faith, to a faith with a society."

RWK_against_all_odds: "Against All Odds"
RWK_against_all_odds_desc: "Fillydelphia has long been called the crown jewel of the Heartlands, and whoever owns it is seen as the undisputed master of the land. Many call the Endtide insane for our attack against them, even many faithful members falter in their faith in sight of the black smoke of industry from Fillydelphia. Yet in our hearts, we all know that we are a force for good, fighting against a pervasive evil, and in the end, good shall always triumph."

RWK_pull_raider_strings: "Fight for Salvation"
RWK_pull_raider_strings_desc: "Raiders are violent and deadly, and above all, effective soldiers. They're dogs pulling at their leashes, especially those who have fallen in with the Endtide completely, yet they've been held back. Let us organize special Raider divisions, equipped with only the most fanatic and dangerous faithful raiders, and allow their horror to grace our enemies."

RWK_arms_collection: "Arms Collection"
RWK_arms_collection_desc: "The Wasteland is a place filled with guns, as almost every pony owns at least a basic firearm or weapon to defend themselves. However, the final struggle demands more and more weapons, no matter their quality, better a pony armed with a bad weapon than no weapon at all. A national program shall begin, to collect weapons from across our land, for our safety, for our victory."

RWK_into_mountains: "Into the Mountains"
RWK_into_mountains_desc: "The land of Windsome poses a small threat to us, if left untouched, as we cannot be sure that they will not attack us if we show a moment of weakness in the final struggle. We must secure our flank, to ensure no opportunistic tribals will destroy the faith, and allow evil to win."

RWK_queen_takes_king: "Queen Takes King"
RWK_queen_takes_king_desc: "Fillydelphia has been taken and the final struggle has come to an end, in a complete victory for the Endtide. Red Eye's slaves are scared, thinking we're just another realm of madponies come to abuse them. Now, the time has come for the Endtide to settle, and for Crimson to commit to her final set of reforms, that will ensure the stability and victory of the faith for centuries."

RWK_wars_of_ablation: "Wars of Ablation"
RWK_wars_of_ablation_desc: "We have assimilated many raiders into our army over the course of the Conquest. Sadly, a lot of them simply have no place in civil society. We will start a series of wars in order to kill off these unsalvageable soldiers."

RWK_old_supporters_new_regime: "Old Supporters, New Regime"
RWK_old_supporters_new_regime_desc: "Not everyone who supported Red Eye was evil, like he was. Some used their positions of power in order to try and make things go better for slaves, others genuinely believed he presented the best hope for the wasteland, and even others who just fought for money. Let the just and honest find their new home in the Endtide."

RWK_partial_liberation_for_fillydelphia: "Liberation in Faith"
RWK_partial_liberation_for_fillydelphia_desc: "A simple decree has been issued by Crimson, a proclamation that, from this day onward, no member of the Endtide shall ever be enslaved. This decree was paired with another decree, announcing a change in the meaning of membership for the cult, that from now onwards, every citizen will be a member of the Endtide, regardless of personal faith, and through this, be freed."

RWK_gradual_demobilization: "Gradual Demobilization"
RWK_gradual_demobilization_desc: "The final struggle is over, and it's time for our soldiers to have their due. Large benefits and payments will ensure comfortable lives for them all, as conscription will finally be brought to an end. Let every soldier rest and settle, and let their homes be filled with cheer, as the soldier-colts come marching home."

RWK_capital_fit_for_empire: "Cult No More"
RWK_capital_fit_for_empire_desc: "The Endtide was never stable, that much is clear, and it is not fitting for a country that will last for a long time. No, Endtide control of the government shall last no longer, it's time for a reformation to society. No longer shall we be a theocracy, from this day onward, we shall be a republic, proud and free."

RWK_war_in_name_of_peace: "A Future to Live For"
RWK_war_in_name_of_peace_desc: "The final struggle has ended and the final reforms made to society. So much blood has been spilled, and many have suffered, many more have died. But today marks something unseen in two hundred years. For today, ponies look towards the future, and feel hope."


###Wavebreaker Path###

RWK_a_new_admirality: "The 'New' Admirality"
RWK_a_new_admirality_desc: "Wavebreaker has been announced as the new leader of the nation, and has immediately dived deep into his paperwork. His followers, the New Admiralty, have begun their take over of the levers of power, to ensure their new leader will be able to lead well."

RWK_formalize_sdc: "Formalize the §OS.D.C.§!"
RWK_formalize_sdc_desc: "Doctor Kelp and her Sunrise Development Council have done wonders for the nation's economy with their intelligence and economic prowess. It would be idiotic to reject the benefits that cooperation with Doctor Kelp will bring, and thus, Wavebreaker will ensure she is given control over our economics."

RWK_retire_old_guards: "Retire the Old Guard"
RWK_retire_old_guards_desc: "The navy is filled with old stallions, remnants of a past age, who stand in the way of reform and change. While it isn't necessary to get them out of the way, if Wavebreaker wishes to have the political capital to make rapid change, they will need to leave."

RWK_naval_meritocracy: "Naval Meritocracy in all sectors"
RWK_naval_meritocracy_desc: "Discrimination is an inefficient system, it doesn't matter what species, gender, sexuality, or anything that a worker, scholar, or soldier is. The navy knew this well, even recruiting a few griffons in their history, for their naval prowess. It's time we apply this militaristic approach to society at large, and do away with old ideas of discrimination."

RWK_much_needed_reforms: "Much needed reforms"
RWK_much_needed_reforms_desc: "Our current advisors are either lacking, or nonexistent, with the change in governance. The first step to our reforms will be to hire advisors who can help change society, after all, we can't afford to stagnate as we are."

RWK_a_305_mm_tungsten_message: "A 305mm Tungsten message"
RWK_a_305_mm_tungsten_message_desc: "Our alliance with The Mob was a matter of convenience, and not a matter that Wavebreaker is happy about. The Mob is filled with a bunch of the worst type of scum imaginable. It's time we send them a message, that Rustwreck will cavort with them no longer."

RWK_reintegrate_crimson_cultists: "Re-integrate the Crimson-cultists"
RWK_reintegrate_crimson_cultists_desc: "Crimson's cult of the Endtide is filled with a bunch of inspired and brutal ponies, the perfect mixture for a fighter. Seeing as Crimson has aligned with Wavebreaker, it's time we put these Endtide members to use. All members of the Endtide will be offered a chance to join the new administration, or the military."

RWK_crack_down_on_grey_economy: "Crack down on the Grey economy"
RWK_crack_down_on_grey_economy_desc: "The grey and black markets smuggle chems and other contraband into our proud nation, poisoning many and weakening our institutions. Yet despite this, it is true that these markets do benefit the national economy. Is it better to destroy this market, at the cost of prosperity, or to let it persist?"

RWK_subsidize_circuitry_production: "Project: §PSage§!"
RWK_subsidize_circuitry_production_desc: "Knowledge is power, in both warfare and in the leadership of a nation, this is undeniable. Project Sage is a large machine, constantly fed with new information, able to be asked questions and giving answers with this information in mind. If successful, Sage will be able to do the job of hundreds of bureaucrats, alone."

RWK_focus_on_the_future: "Focus on the future"
RWK_focus_on_the_future_desc: "The passing of High Tides has affected many in the nation, none more than Wavebreaker himself, who saw the ghoul almost like a father. But the past is the past, and if Rustwreck spends too much time mourning the past, we will never grasp the future."

RWK_shouldering_the_burden: "Shouldering the burden"
RWK_shouldering_the_burden_desc: "It is only through a brilliant, clever, and strong central leader that Rustwreck will become a nation worthy of the world stage. Wavebreaker is the only stallion able to lead this nation, that much is clear, and it is to him that more and more power will be given."

RWK_expand_naval_intelligence: "Expand Naval Intelligence"
RWK_expand_naval_intelligence_desc: "Naval Intelligence has served as a covert intelligence branch of Rustwreck for a while, yet it was limited to the navy alone. If we wish for victory, we must have knowledge, and NavInt is the pathway to knowledge. Let us expand this organization, and in doing so, remain knowledgeable."

RWK_our_legacy_at_sea: "Our Legacy at Sea"
RWK_our_legacy_at_sea_desc: "Wavebreaker, like High Tides before him, is a navy stallion, knowing more about ships than anyone else in the nation, able to recite schematics off the top of his head. The sea is our home, truly, for it brings prosperity, peace, and power to the nation, it's time we bring focus back to it."

RWK_memory_orb_based_ethics: "Memory-orb based learning"
RWK_memory_orb_based_ethics_desc: "Memory orbs are a technology allowing for ponies to view and relive the memories of past creatures. The information contained in these memories is priceless, and yet they have been not used much in the past. Wavebreaker will change this, as his analytical mind will delve into hundreds of memories, to learn more and more."

RWK_our_history_is_mandate: "Our History is Mandate"
RWK_our_history_is_mandate_desc: "The Steel Rangers are cowards, who hid away in their bunkers whenever the world came to an end. The Enclave are even worse, as they abandoned the wasteland as a whole, betraying the millions of soldiers they left to suffer. We are the true heroes of Equestria, and as heroes, we hold a deep hate in our heart for these cowards."

RWK_higher_civilian_education: "Elevate civilian education"
RWK_higher_civilian_education_desc: "An educated population is a population that will allow for us to be even greater than ever before. It's time we invest into our education centers, to create the scholars of tomorrow."

RWK_remove_disruptive_factors: "Remove disruptive factors"
RWK_remove_disruptive_factors_desc: "We are in a precarious situation, and we cannot afford to waste time due to the disruptions of the press or due to ponies slipping freely into our nation. Our borders and our press will be carefully controlled by the state, to ensure stability, even in times of crisis."

RWK_consolidate_science: "Consolidate Science under the State"
RWK_consolidate_science_desc: "Scientists work better when given resources, and when working together. It's high time that our nation brings together all of the scientists of the land under our control. With increased funding, and increased interplay between different fields and scholars, we will boost our scientific research massively."

RWK_proclaim_the_rebirth: "Proclaim the rebirth"
RWK_proclaim_the_rebirth_desc: "Rustwreck is a name for a dying nation, a nation where ships rusted in port, where ponies died of radiation in the afterglow of the Last Day. We are this nation no longer. For now, we reclaim our mantle as the Celestial Sea Fleet, and with it, we reclaim our mandate over the eastern coast. Let all on the Celestial Sea cheer, for their fleet has returned."

RWK_tighten_training_standards: "Tighten training-standards"
RWK_tighten_training_standards_desc: "Incompetence leads to death under the rain of gunfire and artillery. We cannot allow for incompetents or weaklings to fill our ranks. As High Tides would say, it's time to get rid of the pacifists, pinkos, freaks, and psychos that fill our ranks, to ensure all of our armed forces are truly great."

RWK_the_subservient_army: "Unified Invasion-Doctrine"
RWK_the_subservient_army_desc: "All in our army revolves around what makes us truly special, the marine corps. It's time that we write this doctrine down in stone, and ensure every facet of our armed forces is ready to support even the roughest of landings from our marines."

RWK_caps_for_orbs: "Caps for Orbs"
RWK_caps_for_orbs_desc: "With our growing economy, we have a small surplus of caps to invest. While the SDC claims that it would be best for us to invest back into the economy, there is something far more lucrative. Knowledge can bring more than industry ever can, and memory orbs bring knowledge."

RWK_predictive_governance: "Pre-emptive Governance"
RWK_predictive_governance_desc: "SAGE has been fed even more data, becoming a library truly unmatched. It's computer systems work second by second, calculating information from all that has been fed to it. Using all of this information, we can finally predict ponies, the economy, and war. It will take more resources, but it's time SAGE is upgraded to predict, not just react."

RWK_first_prosperity_zone: "The first Prosperity-Zone"
RWK_first_prosperity_zone_desc: "The occupation and rebuilding of Summerfield is not a matter that the central government needs to concern itself with, as the city is too large and too ruined to sap our resources and attention. It's time that we create what has been deemed a Prosperity Zone, a semi-autonomous region of our nation, which will rebuild and bring commerce to its area."

RWK_compartmentalize_ressources: "Compartmentalize Ressource-extraction"
RWK_compartmentalize_ressources_desc: "Freeside, owned by the Speedfreaks, does not have much industry or any notable population centers. However, it does have access to some potentially useful resources. It's time to create what is called a Resource Zone, an autonomous area of our nation, tasked with extracting the natural resources of an area."

RWK_welcome_our_new_citizens: "Welcome our new Citizens"
RWK_welcome_our_new_citizens_desc: "All under the protection of the Celestial Sea Fleet will be granted the same protections, the same rights, liberties, freedoms, and the same privileges. Those in Rustwreck and those in our newly acquired lands will be given food, homes to stay in, and education, more than anyone has offered them for two centuries. A taste of old Equestria."

RWK_skill_recycling: "Skill-recycling"
RWK_skill_recycling_desc: "Our large collection of memory orbs allow each and every pony to experience, personally, any skill that the orbs hold. Orbs of doctors are given to medical workers, who can live through memory the experience of a wartime surgery. Memory orbs of victory are given to generals and admirals, pushing them to new strategies. Our skills come not just from the present, but the past as well."

RWK_naval_discipline_forever: "Ensure continued Harmony"
RWK_naval_discipline_forever_desc: "NavInt has served their role well so far, belong to prevent any uprising, keeping ponies safe, and keeping the government informed. We should encourage their activities in our outlying territories, to ensure compliance with the central government's commands."

RWK_a_shining_city_on_the_shore: "Shining city on the shore"
RWK_a_shining_city_on_the_shore_desc: "Rustwreck, even the city name, reflects the city no longer. Rusted ships are all gone, the beaches filled instead with traders, and war ships, factories and markets. All of this, though, is only possible due to one stallion, High Tides. It's time to ensure his name shall forever be known, in our city of gold."

RWK_secure_summerfield: "Secure Summerfield"
RWK_secure_summerfield_desc: "Our current control over Summerfield is insufficient and inefficient. It's time that we expand our realm even larger, and claim the two others who own part of Summerfield, Redwing's Talons and Empire. With those two gone, we will be the unquestioned sovereigns of this area."

RWK_rehabilitative_personality_restructuring: "Restorative Personality restructuring"
RWK_rehabilitative_personality_restructuring_desc: "When mixed with a cocktail of drugs, specific memory orbs can have a large effect on the pony using them. Happy memories of peaceful times create happy, peaceful ponies. Given the amount of dysfunctional, violent, and sometimes destructive raiders in our country, it's time to invest into this personality changing, to ensure they no longer pose a threat."

RWK_learn_from_the_greats: "Learn from the Greats"
RWK_learn_from_the_greats_desc: "Wartime Equestria had many brilliant tactitians and strategists. We will seek out any memory orbs they may have left behind and add the study of these to the required curriculum for our officers."

RWK_just_like_old_times: "Just like old times"
RWK_just_like_old_times_desc: "When one looks upon our nation now, they wouldn't think of it as wasteland. For like a Phoenix rising from the ashes, we have rebuilt. Ponies, happy, clean, and prosperous trot suburban streets, work well paying jobs, danger and misfortune nothing but a distant memory. We are a wasteland no longer, now we are a proper nation, on the scale of the old world."

RWK_ministry_of_cultural_management: "Ministry of Cultural Management"
RWK_ministry_of_cultural_management_desc: "Not every culture is as destructive as the raiders, in fact, many cultures might have rituals and ideas that we could learn from. In order to ensure that Ruster culture does not overwhelm other cultures, we will found a new ministry, to manage all cultures. With this, we will not be seen as an empire, but as a land of many cultures."

RWK_ministry_of_acquisition: "Ministry of Resource-Acquisition"
RWK_ministry_of_acquisition_desc: "We need to better handle our subjects, especially as we get more Prosperity and Resource Zones. To handle our growing autonomous regions, we will create a new ministry, which will ensure our Zones are governed exactly how Wavebreaker would desire them to be."

RWK_ministry_of_reindustrialization: "Ministry of Re-Industrialization"
RWK_ministry_of_reindustrialization_desc: "Our experiment of autonomous regions has been massively successful, and as we claim more land, we need to continue our efforts to create these zones. To facilitate, a ministry will be created, which will decide what lands belong to what region, and to make new administrative Zones, if needed."

RWK_new_memories_new_age: "Only together can we prevail"
RWK_new_memories_new_age_desc: "Our autonomous regions are still home to ponies, land, and soldiers that can be better used. To ensure no region falls behind another, we will create a research fund, that all members will be able to learn from each other."

RWK_opening_salvo: "Opening Salvo"
RWK_opening_salvo_desc: "The time has come to reclaim the shining jewel of wartime Equestria, the city of Manehatten. Our marines, our army, all of our administrative zones, and the navy shall work side to side, to take over this city. We will route all who stand in our way, especially the traitorous Steel Rangers in Bucklyn Cross."

RWK_mandated_technology_quotas: "Mandate Technology-quotas"
RWK_mandated_technology_quotas_desc: "Out advanced technology requires advanced resources in order to run, especially with projects like SAGE. It's time that we crack the whip in the capital, and use our advanced factories to produce all the resources we will need for the future."

RWK_national_pacification_government: "National Pacification Government"
RWK_national_pacification_government_desc: "Democracy is the enemy of the perfection our nation expects, making leaders into a popularity contest, rather than a contest of merit. Our nation has no room for this wasteful practice, if we are to keep Equestria safe, we must get rid of this nonsense."

RWK_punish_the_traitors: "Punish the Traitors"
RWK_punish_the_traitors_desc: "The Steel Rangers betrayed the ponies of Equestria when they fled behind their bunker walls. They have continued their betrayal each and every day that has passed, as they have refused to help those around them. It's time that we give these traitors their due."

RWK_magical_loyalty_programming: "Magical Loyalty Programming"
RWK_magical_loyalty_programming_desc: "With our work on the personality changes getting better and better by the day, ponies that otherwise would have caused issues have now become happy, loyal citizens of our nation."

RWK_retrofit_carrier_reactors: "Retrofit Carrier-reactors"
RWK_retrofit_carrier_reactors_desc: "Many old carriers have large reactors in their hulls, designed to provide them with near limitless energy. Many of these reactors have become useless over time, yet they still carry power within them, the power to explode. It's time we put these reactors to use, creating weapons on the scale of Balefire Bombs from them."

RWK_quantified_usefulness_to_the_state: "Quantified Usefulness to the State"
RWK_quantified_usefulness_to_the_state_desc: "NavInt will be tasked with handling every state that we own, to determine if the ponies in that state are properly serving the central government, or if they are a waste of resources. Through this, we can better target investments, and better insure every single state of our nation serves as they should."

RWK_return_order_to_the_west: "Return Order to the West"
RWK_return_order_to_the_west_desc: "To the west lay many nations, some small, some very large and rich. It's time that we begin the next step of our national pacification, to reclaim these industrial centers of Equestria from the traitors, tribals, and slavers that currently occupy them."

RWK_inherit_mwt: "Inheritors of the MWT"
RWK_inherit_mwt_desc: "Being the only legitimate remnants of the Equestrian armed forces means that we are the true inheritors of the Ministry of Wartime Technology. With the Steel Rangers properly punished for their crimes, it's time for true Equestrian patriots to take on the powered armor of old once more."

RWK_resurrect_equestrias_heroes: "Resurrect Equestria's Heroes"
RWK_resurrect_equestrias_heroes_desc: "The Elements of Harmony, the Ministry Mares, many of their exploits were saved onto memory orbs. Using SAGE's predictive algorithms and these memory orbs, we can properly reproduce the personality of the old heroes. All except for Rainbow Dash, as traitors and cowards get no credit."

RWK_prepare_for_second_great_war: "Unleash Equestria's Industry"
RWK_prepare_for_second_great_war_desc: "Without a strong industry behind us, our occupation and pacification efforts will fall flat. If a pony does not work in the army, then they must work to support the army, until such a day that our industry can rest, and is needed no more."

RWK_universal_citizenship: "Universal Citizenship"
RWK_universal_citizenship_desc: "Discrimination doesn't make any sense, especially since every species has their own strengths and weaknesses. It's time that we accept each and every species, so we can exploit what makes them unique, and what makes them strong, for our benefit."

RWK_preserve_the_capital: "Preserve the Capital"
RWK_preserve_the_capital_desc: "Much of our administration and our industry is kept in a relatively small area, around Tidetown, the capital. Enemies will try and cut the head off the snake when they attack us, and will aim to attack the capital. To counter this, we will massively fortify the area, prepared against any attacks."

RWK_learn_from_lunas_mistakes: "Learn from Luna's mistakes"
RWK_learn_from_lunas_mistakes_desc: "Luna led a military like none other, but she always struggled to work in the civilian world. This applies to Wavebreaker too, but through the use of memory orbs, we can prevent this. All ponies will have high standards of living, as long as they follow the laws, and because of that, they will be loyal forevermore."

RWK_reclaim_the_capital: "Reclaim Canterlot"
RWK_reclaim_the_capital_desc: "Canterlot was once the capital of Equestria, and seeing as we are the true and legitimate armed forces of Equestria, it falls to us to reclaim the old capital from the clutches of those who have it. No ghouls, no Alicorns, and no raiders or zebras will stand in the way of our reclamation."

RWK_destroy_the_upstarts: "Destroy the Upstarts"
RWK_destroy_the_upstarts-desc: "We now own the majority of the Equestrian Heartlands, yet there still exist some potentially powerful foes to our south. Shattered Hoof and Appleloosa in specific hold population and industry that could be threatening, if allowed to continue. We must march south, and reclaim the south, before they can pose a real threat."

RWK_end_new_cloudsdale: "End New Cloudsdale"
RWK_end_new_cloudsdale_desc: "The Enclave, a bunch of sniveling, traitorous cowards, there is no world in which they get away from our judgement. All who stand between us and the Pegasi will be destroyed just as thoroughly as we destroy them."

RWK_an_equestrian_navarchy: "An Equestrian Navarchy"
RWK_an_equestrian_navarchy_desc: "All is done, and the sun rises upon a land reborn, an Equestria born of its own navy. Wavebreaker has led us through fear and death, all the way to victory. However, something seems to be wrong. Doctor Kelp hasn't been seen in a few days. . ."


###Civilian Governance Path###
##Shared Branch for Kelp and Jacques
RWK_civilian_governance_start: "Civilian Governance"
RWK_civilian_governance_start_desc: "For two centuries, Rustwreck has been ruled over by the military, with civilian apparatuses being ignored whenever they would arise. However, with a coalition between the intelligent Doctor Kelp and her Sunrise Development Council, as well as the charismatic Jacques Perrylous and his lovers of liberty, this military rule can finally end."

RWK_civilian_governance_left_1: "The First Step outwards"
RWK_civilian_governance_left_1_desc: "We have taken the state formerly known as Boosterjuice, showing the strength of our civilian government over the northern raiders. It's time we welcome the ponies of this new province, and begin to rebuild it."

RWK_civilian_governance_left_2: "Diplomacy through trade"
RWK_civilian_governance_left_2_desc: "There is no better way to ally a state than to have your traders trade with each other. Trade creates relationships, and it creates friendships. It's time that we send our traders out to potentially friendly states, in hopes that they will garner a positive opinion of our nation."

RWK_civilian_governance_left_3: "Our Logical Allies"
RWK_civilian_governance_left_3_desc: "Stajniopolis exists as another peaceful, democratic state in the wasteland, one whose land desires do not overlap with our own, making them natural to befriend. However, Jacques, and his lovers of liberty, think it wise to begin to befriend the ponies of Light, with the Griffon himself going across borders into Light, to spread his fervor for freedom."

RWK_civilian_governance_right_1: "Allow civilian university admissions"
RWK_civilian_governance_right_1_desc: "Being in the military doesn't make one intelligent, and civilians can often be more intelligent than the military, as seen with Doctor Kelp. It is shameful that higher education was hidden behind the requirement of military service. It's time to open our universities to all."

RWK_civilian_governance_right_2: "Weaken the Admirality's grasp"
RWK_civilian_governance_right_2_desc: "The Admiralty of the nation held a lot of power under High Tides, and many chafe under the rule of civilians instead of the rule of a fellow military stallion. It's time to remove the Admiralty from many influential positions, weakening their power and allowing us more influence over the nation."

RWK_civilian_governance_right_3: "Dominate Merchant shipping"
RWK_civilian_governance_right_3_desc: "Our position near the middle of the Equestrian eastern seaboard makes us a natural trading partner for anyone. Ships come in day after day from all across the wasteland, selling to our merchants and selling to each other. Truly, we are an unmatched meeting point for any naval traders."

RWK_civilian_governance_end: "The First Prime Minister"
RWK_civilian_governance_end_desc: "The republic has been stabilized and civilian rule has been assured, now it's time to make due on our promises, and hold elections for leader. Doctor Kelp, and her more peaceful developmentalists, stand against Jacques Perrylous, and his aggressive flames of freedom. It's time for the nation to decide which leader shall lead them into the future."

#Kelp Focuses
RWK_kelp_mob_left_1: "Liberty from within"
RWK_kelp_mob_left_1_desc: "We are the only truly free nation within The Mob's influence, forced to become an ally of these nations out of necessity. While it is distasteful to work alongside these thugs and gangsters, it presents an opportunity. With our resources, we can spread a call for democracy across The Mob, and in doing so, create a faction of freedom loving ponies."

RWK_kelp_mob_left_2: "A Beacon for the Free"
RWK_kelp_mob_left_2_desc: "Rustwreck is a republic that does not discriminate on those who approach us. Refugees, migrants, all are welcome into our lovely nation, as long as they follow the law, and love freedom. Let all who value liberty see us as a lighthouse of democracy on the coast."

RWK_kelp_mob_right_1: "Sabotage the Mob"
RWK_kelp_mob_right_1_desc: "It's only a matter of time before The Mob gets jealous of our freedoms and our prosperity, and tries to force us under their boots. We must send in saboteurs into The Ringers, the ringleaders of the whole Mob, and through doing such, we can prepare for their eventual attack."

RWK_kelp_mob_right_2: "Economic Outreach"
RWK_kelp_mob_right_2_desc: "Light and the Friesian Tribe rest on the outskirts of The Mob's control, and as such, they have the most connection to the world outside of the Mob. Let's use these connections to build up not only ourselves, but these countries, and prepare them should we eventually occupy them."

RWK_kelp_mob_shared: "Trade with Glowport"
RWK_kelp_mob_shared_desc: "Light has valuable resources and industry, which they trade freely with others through Glowport, a large port city. Given our proximity, it would be good to establish trade relations with them, that we can profit from their trade, and allow them to profit as well."

RWK_kelp_mob_left_3: "Advocate for Fillydelphia"
RWK_kelp_mob_left_3_desc: "To be revealed in The Mob's update, coming soon to a Balefire Blues near you."

RWK_kelp_mob_left_4: "Deal or no deal"
RWK_kelp_mob_left_4_desc: "The danger that forced us to work alongside The Mob has passed, and it's time for us to use our larger size and industry to our benefit. The Mob shall listen to our demands, or we shall leave immediately."

RWK_kelp_mob_right_3: "Promises of a better future"
RWK_kelp_mob_right_3_desc: "Many across The Mob's control have heard our calls for freedom and have flocked to our republic, to live free, prosperous lives. Ponies from all across the subject states of The Mob come by the hundreds, to raise rifles and march side by side, for peace, prosperity, and democracy."

RWK_kelp_mob_right_4: "Break the Yoke"
RWK_kelp_mob_right_4_desc: "The Mob can not be allowed to exist as they currently are. No longer will we sit idly by and let this group of gangsters and bandits rule freely. It's time for the republic to march, to bring freedom to the oppressed, and democracy to the unheard."

RWK_kelp_core_1: "Trust your friends"
RWK_kelp_core_1_desc: "Crimson Waters, Wavebreaker, and Jacques are a special bunch, all of whom use their special sets of skills in order to aid Doctor Kelp and the republic at every turn. With this group of friends at the helm, the nation can be completely stabilized, and together, can the republic advance."

RWK_kelp_core_2: "Picture perfect health"
RWK_kelp_core_2_desc: "A healthy society starts with a healthy body, and a healthy mind. It is a tragedy that nowhere across the wasteland truly has comprehensive healthcare, it's time to finally change that. As of today, every citizen of the republic is promised healthcare, both physical and mental, to keep all healthy and happy."

RWK_kelp_core_3: "Refuge for all"
RWK_kelp_core_3_desc: "Rustwreck has much empty land within its borders, which has sat for too long unoccupied. Ponies across the wasteland look at us with envy and want, it's high time that we properly open our borders, and accept all who wish to move here. Allow these new ponies to boost our economy ever further, and bring unmatched prosperity,"

RWK_kelp_core_4: "In the MoP's hoofsteps"
RWK_kelp_core_4_desc: "The Ministry of Peace was the single largest healthcare innovator in the wartime nation of Equestria. It's time that we began to replicate their success. Already, production across the nation has started, producing healing potions on the same same scale as the Ministry of Peace, unmatched by any other power in the wasteland."

RWK_kelp_core_5: "Friends across the Land"
RWK_kelp_core_5_desc: "It doesn't matter one's species, for every species can feel the burning passion and desire for freedom and prosperity in their hearts. Rustwreck shall, from here on, welcome any species who comes to our borders with open hearts,"

RWK_kelp_core_6: "Together into the future"
RWK_kelp_core_6_desc: "Our friends, nations of freedom and peace, stand side by side with us during war and peace. Let our armies march together, to defend against the encroaching forces of reaction and autocracy. Let our shining faction be a symbol of peace across the wasteland."

RWK_kelp_foreign_1: "Liberate Summerdale"
RWK_kelp_foreign_1_desc: "The Rain Raiders and Speedfreaks of the north have long since brought pain and misery to the ponies they control. Their violent tendencies are the prime example of the horror the wasteland can bring. It's time that we defeat the raiders, and begin to rebuild and rehabilitate those that we can."

RWK_kelp_foreign_2: "The painful process of rehabilitation"
RWK_kelp_foreign_2_desc: "Many raiders have broken lives coupled with broken minds, mental illnesses, substance abuse, and PTSD from traumatic situations are dominant in Raider lands. However, many raiders can be helped, they just need the right help. The right medicine, the right therapist, and plenty of time, can turn even the most vile raider into the best pony."

RWK_kelp_foreign_3: "Protectors of the mare River"
RWK_kelp_foreign_3_desc: "Our ships do not only fight in war, but they also fight in peace, to ensure safe waters for all. The Mare River is a thoroughfare for trade in our region of the Wasteland, allowing all communities of Manehatten to connect, as well as all those who live upriver. It's time that we become the true naval guardians of this river, to ensure no pirate and no raider blocks trade ever again."

RWK_kelp_foreign_4: "The last obstacle to lasting Peace"
RWK_kelp_foreign_4_desc: "There exists one last nation of raiders on our borders, which oppress and kill those within their borders. The Manehattan Raiders under The Bonecrusher seek to conquer and destroy the entire city. It's time that we step in, and ensure these ambitions never see the light of day."

RWK_kelp_foreign_5: "Stable Matters"
RWK_kelp_foreign_5_desc: "Stajniopolis has long been a loyal ally and a close friend, it's time that we advance our partnership. Unified into one republic, we can bring much more prosperity to both countries. Let's just hope our Stable friends agree to our proposal."

RWK_kelp_core_7: "Universal education initiative"
RWK_kelp_core_7_desc: "Education is a right in our republic, for if a pony is misinformed, they can not make smart decisions with their votes. It's time to start a mass program of education, schools shall open all across the nation, filled with teachers who will teach each and every pony. Soon, we will reach education levels not seen since the Last Day."

RWK_kelp_core_8: "Prosperity in the West"
RWK_kelp_core_8_desc: "Doctor Kelp is widely praised as a liberator, for all she has done to help the nations surrounding us. Ponies conquered by our armies flock to our banners, they flock to construct factories, and bring unmatched prosperity to their lands. Some have even gone so far as to call Doctor Kelp the Liberator of Sunrise."

RWK_kelp_core_9: "The Peace-Corps"
RWK_kelp_core_9_desc: "Our army is to only be of the highest quality, kept with the finest of equipment and the best of training. We seek not to conquer other lands, but instead to bring peace, even when others might attack us. Only the best and brightest will serve in the new peace corps, with harsh rules of engagement, to ensure we shall never kill unnecessarily."

RWK_kelp_core_10: "The Great Renewal"
RWK_kelp_core_10_desc: "Our economic policies pay off every day, and all across the nation, new factories and cities pop up, with properly maintained roads, properly designed factories, and hundreds of happy ponies. We resemble, with every passing day, something close to what Equestria once was, and with each day, our prosperity only grows."

RWK_kelp_core_11: "Safeguard our Liberty"
RWK_kelp_core_11_desc: "Together with our friends, we will always protect those lovers of freedom. Volunteers flock to our ranks, their morale unmatched across the wasteland, for they know they fight for a good fight. Let the love of liberty be the banner our soldiers wave, and let every enemy break upon us like a wave against a stalwart rock."

RWK_kelp_core_12: "One nation under law"
RWK_kelp_core_12_desc: "All in our nation operate under the same system, under the same laws. Everyone, from the lowliest criminal to the Prime Minister themselves will be kept in check by our laws. In this land, the law rules, and forever may it continue to reign, and keep us safe."

RWK_kelp_core_end: "Light of the East"
RWK_kelp_core_end_desc: "In such a short time, Rustwreck has gone from a nowhere autocracy to a lively, thriving republic. We are a light of liberty to all ponies on the eastern seaboard, and our nation is the envy of all others. However, even if Doctor Kelp is happy beyond belief with all that has occurred, there is still a loose end left hanging."

#Jacques Focuses

RWK_great_recovery: "The Great Recovery"
RWK_great_recovery_desc: "In order to construct a great society, we must first build up the nation as a whole. Factories will be sped up, factories will be constructed faster than ever, as roads and railways are built to tie together all of the nation. This will mean less ponies are available to join the army, but this will pay off in the long run."

RWK_welfare_for_people: "Welfare for the People"
RWK_welfare_for_people_desc: "Liberté, the Aquilian word for Freedom, is the cornerstone of our nation. We must not only ensure ponies can enjoy freedom, but we must give them welfare, so they may actually enjoy their freedom. A pony left stranded in a desert is the most free pony in the world, but it is only through social safety that they can have true liberté."

RWK_place_where_it_rained: "The Place where it Rained"
RWK_place_where_it_rained_desc: "The Rain Riders to our north drive on asphalt roads the same color as rain clouds, their society built around a brutal need for speed. We already have taken Klopen from their control, it's time that we light the torch of democracy, and lead it to the oppressed ponies of the north."

RWK_free_people_free_road: "Free People of the free Road"
RWK_free_people_free_road_desc: "The Speedfreaks espouse a corrupted version of freedom, believing that freedom is the ability to drive without anyone to stop you. This unique philosophy will make the raiders accepting of our message of democracy. Due to this, they are the next logical step for our republic to expand to."

RWK_larmee_du_liberte: "L'armée du Liberté"
RWK_larmee_du_liberte_desc: "In the fight for freedom, none can be denied, and all are needed. The minorities and majorities, the oppressed and the poor, huddled masses stand together under the marching standard of the army. Under the light of our liberty, the army shall march, to bring democracy in their wake."

RWK_hoof_in_claw_in_paw: "Hoof in Claw in Paw"
RWK_hoof_in_claw_in_paw_desc: "Species is nothing but another category to try and divide people, just like nation, class, or religion. It's time to break down this category, for in our republic, each and every species will be able to reap the benefits of their liberty. Fraternité, Brotherhood, between all species will be assured."

RWK_deregulate_foreign_trade: "Deregulate foreign Trade"
RWK_deregulate_foreign_trade_desc: "It is true that many products in the wasteland are produced in distasteful places, such as the slave factories of Fillydelphia. However, it would be idiotic to close our market to even those goods. Better than those ill-gotten gains be used to feed the flame of liberty, rather than collecting dust."

RWK_gentle_hoof: "The Gentle Hoof"
RWK_gentle_hoof_desc: "Égalité, equality, applies the same to every being in our nation. It doesn't matter your background, your religion, your creed or species, you will be given a chance to embrace liberty. The raiders of the north are the same, many of them have suffered abuse from the world. We will offer them equality and freedom, and hopefully, with Crimson's help, they will carry forth the torch of liberty."

RWK_soldiers_with_heart: "Soldiers with heart"
RWK_soldiers_with_heart_desc: "The light of liberty sees every dark corner of the wasteland, welcoming all with open hearts and smiles who wish to partake in its warm embrace. From every corner of the wasteland come creatures of every species, their hearts beating as one, with a love of liberty unmatched."

RWK_mending_old_rifts: "The Wars of our Forefathers"
RWK_mending_old_rifts_desc: "There are many, both in the past and present, who have rejected the brotherhood that we hold so dear. From the racial supremacists of the Enclave to the fascists of old Wingbardy, to the monarchists of Griffonheim. Jacques shall make a radio announcement to the nation, reaffirming brotherhood, even in the face of these great betrayals of the past."

RWK_democracy_on_every_level: "Democracy on every level"
RWK_democracy_on_every_level_desc: "Liberty in its most basic form is the ability to choose one's own leader. Mayors, governors, local councils, and of course the national government shall be elected democratically, with votes and suffrage given to every being that lives within our nation."

RWK_never_another_empire: "Never another Empire"
RWK_never_another_empire_desc: "Long ago, the Griffonian Empire attempted to crush the light of liberty in Aquila, destroying much of the Périphérie as they did. Though Aquila survived for a while more, we, the next carriers of the light of liberty, know better than to trust imperials. Be they from Griffonheim or Empire, let it be known, to suffer no empire to live."

RWK_revolution_to_manehattan: "Révolution to Manehattan"
RWK_revolution_to_manehattan_desc: "The nations of Manehattan are filled with raiders, oligarchical councils, closed off settlements, Steel Rangers, and many dangerous ponies. Though some of Manehattan is overseen by democracies, they do not hold true freedom and liberty as we do. It's time to bring true democracy to the Pearl of the East Coast."

RWK_vengeance_for_lost_dream: "Vengeance for a lost Dream"
RWK_vengeance_for_lost_dream_desc: "Redwing's Talons are fellow griffons, like Jacques is, but they do not hold freedom and democracy like we do. Instead, they march with the same desires of old Wingbardy, complete supremacy, complete control. Birds of a feather flock together, however, and it's time for us to take these lands for ourselves, to find the lovers of liberty within the lands."

RWK_beacon_of_liberty: "Our Beacon of Liberté"
RWK_beacon_of_liberty_desc: "Brotherhood in the army is critical to success, if soldiers do not trust their leaders, then they will never fight as well as they could. Thus, it's time to allow all soldiers to vote for their officers. This democratic army shall shine across the wasteland, as the soldiers of true liberty march happily side by side."

RWK_blind_to_creed_and_colour: "Blind to Creed and Color"
RWK_blind_to_creed_and_colour_desc: "It doesn't matter who you are, what you believe, or what you look like, for in the heart of all beings is the flame of liberty, burning bright. It is not the role of the government to judge religions, cultures, or anything like that. Instead, we must awaken the flame of liberty within all beings, blind to their other beliefs."

RWK_mandate_workers_unions: "Mandate Union-owned Factories"
RWK_mandate_workers_unions_desc: "High Tides would have called us pinkos or reds, but the truth is, true liberty only comes when democracy is not only political, but economic. It's time for workers to control their workplaces, as we saw in Skynavia long ago. We will organize unions for each and every factory, and transfer control of all industries, even critical industries, to these factory unions."

RWK_an_ideal_city: "Our model-city"
RWK_an_ideal_city_desc: "Summerfield has come a long way from where it once was, as our rebuilding teams march through the streets, repairing roads and factories long since destroyed. Summerfield exists as a testimony to our ideals, that liberty, equality, fraternity, and democracy can bring peace and liberty to even the darkest corners of the land."

RWK_long_road_to_trust: "The Long Road to Trust"
RWK_long_road_to_trust_desc: "The Steel Rangers, many within our nation hate them for their lack of help to the wasteland. Many have added them on the list with Wingbardy and the Enclave, as a faction who lacks fraternity. We must decide how to treat this special faction. How far can we allow equality to extend?"

RWK_those_that_deny_our_ideals: "Those that deny our ideals"
RWK_those_that_deny_our_ideals_desc: "The paradox of tolerance, an old thought experiment created in the Griffonian Republic, used to argue against the existence of monarchist parties. Redwing's griffons find the idea of democracy and freedom laughable. How do we handle those who reject our ideals so blatantly?"

RWK_protect_our_friends: "Protect our Friends"
RWK_protect_our_friends_desc: "The time has come to reach out to our loyal allies, who have stuck with us through thin and thick. We do not carry the light of liberty alone, it's time to see if our fellow democracies wish to continue being our allies."

RWK_education_as_right: "Education as a Right"
RWK_education_as_right_desc: "Those who are not educated are not truly free, for while ignorance is bliss, it is also a shackle placed upon the citizens of the republic, to try and control them. No longer will ponies go without education, from now on, we will encourage every field of education, even if it might go against some of our ideas. If you aren't free to think, you can't truly be free at all."

RWK_summerfield_university: "Establish Summerfield University"
RWK_summerfield_university_desc: "The ponies of Summerfield are eager to help the republic, and we are eager to have their help. Some old raiders have begun to teach impromptu mechanics shops, it's time that we unify these mechanics shops together, and from that basis, create a whole university, the first seen in two hundred years."

RWK_rebuild_from_bones: "Rebuild from Bones"
RWK_rebuild_from_bones_desc: "Much of Manehatten is left like a skeleton, filled with broken roads, broken factories, and broken houses. It's time that we bring these bones back to life, to rebuild this once great city, like a Phoenix from the ashes."

RWK_all_who_stand_against_evil: "All who stand against Evil"
RWK_all_who_stand_against_evil_desc: "The army of liberty does not exist only to serve the republic's interests, but to serve the international community of liberty lovers. Aquila learned the hard way that a lack of internationalism leads to disaster, as they failed to help the Griffonian Republic against the Empire, allowing the imperials to later invade them. We won't make the same mistake."

RWK_vive_la_republique: "Vive La République"
RWK_vive_la_republique_desc: "The time has come, all major reforms have been made, and the flames of liberty have spread to every corner of our region. An election has been called, and with this election, we will solidify our democratic roots. May the best prime minister win!"

RWK_crushing_democracy_enemies: "Crushing the Republic's Enemies"
RWK_crushing_democracy_enemies_desc: "The Debt Crusher, formerly known as The Bonecrusher, has won the election. She's decided that the welfare as it exists is perfect, and all that remains is for the republic to constantly spread. Soon, all of the wasteland will know liberty, at her hoof."

RWK_cementing_our_ideas: "Cementing our Ideas"
RWK_cementing_our_ideas_desc: "Jacques Perrylous has been re-elected as prime minister, reaffirming the faith of the people in his agenda. With him more confident than ever, he can make the last few changes to the nation, to finally make it a place worth being proud of."

RWK_turn_inward: "Turn Inward"
RWK_turn_inward_desc: "Black Seas, former Mayor of Friendship City, won the election with the backing of more conservative members of the republic. She has decreed that the republic has no need to continue to expand, and has closed all ideas of expansion, to instead focus on prosperity."

RWK_path_to_peace: "The Path to Peace"
RWK_path_to_peace_desc: "Doctor Kelp has won the second election for prime minister, and with aid from Jacques, she will work to further reform the internals of society. Jacques has done a good job, but there are more changes to be made. First is her decision to reduce the army's size, down to an elite peacekeeping force."

RWK_making_friends_by_force: "Making friends by force"
RWK_making_friends_by_force_desc: "The Stable ponies have long been aligned with our desires, as they are a fellow republic, but to allow them to stay free is bonkers and ridiculous. Only by directly owning them can we make sure both Stable pony and wasteland pony live under maximal liberty."

RWK_eternal_war_for_liberty: "Our eternal war for Liberty"
RWK_eternal_war_for_liberty_desc: "Liberty doesn't come just from the goodness of hearts or the welfare of people, but it comes oftentimes through bayonet and bomb. Imperialists, monarchists, evils of the worst types lay all around us. It's time to pick up our arms, and prepare the never ending expansion of our freedom."

RWK_expand_rebublics_army: "Expand the Republic's Army"
RWK_expand_rebublics_army_desc: "The army, given its democratic structure and good training, has more volunteers than it can handle! It's time for us to expand the army even wider. Recruiting centers will open in every city, for every lover of liberty to sign up, to fight for liberty with blood and bayonet."

RWK_fight_back_shadow: "Fight back the Shadow"
RWK_fight_back_shadow_desc: "Our republic can suffer no tyrant to stand, and no evil to escape justice. It's time that we take up arms once more, and prepare for more wars, to shine the light of liberty across the entire wasteland."

RWK_safeguard_independence: "Safeguard our Independence"
RWK_safeguard_independence_desc: "As part of keeping our republic safe, we will enact a policy of maximal defense. Every settlement must have outposts for soldiers in it, with air defenses as well. Should any try to invade our nation, they will find us like a cornered tiger, ready to destroy any who threaten us."

RWK_hometown_advantage: "Hometown Advantage"
RWK_hometown_advantage_desc: "Given that Black Seas is from Friendship City, she knows better than anyone else on how to keep it prosperous and ever growing. Friendship City shall be the premier port and industrial center of the republic, under her wise leadership."

RWK_prosperity_of_republic: "Liberty is non-negotiable"
RWK_prosperity_of_republic_desc: "If there's one thing Jacques and Kelp can always agree on, it's that evil must be defeated wherever it arises, and liberty must be brought to all ponies. Despite her more peaceful sensibilities, it's time for Kelp to announce to the nation, to make sure all know that liberty is non-negotiable."

RWK_reach_out_hoof_of_friendship: "Reach out the Hoof of Kinship"
RWK_reach_out_hoof_of_friendship_desc: "Our loyal Stable allies have long since worked alongside us, but keeping our nations separate has just ensured neither of us benefit as much as we can from each other. It's time to ask the Stable ponies to unify with the republic at large."

RWK_war_for_the_ring: "War for the Ring"
RWK_war_for_the_ring_desc: "It's time to begin crushing our moral debts, and we shall do this through becoming liberators of the desperate and the oppressed. Debt Crusher is familiar with war, and has formally announced preparations for a great war, to defeat all evil in her wake."

RWK_iron_minister: "The Iron Minister"
RWK_iron_minister_desc: "Debt Crusher is a very stubborn mare, who is dead set on paying off her moral debts, to the point that she doesn't sometimes notice others. She has oftentimes ignored some government ministers, especially those concerned with agriculture. This has led to ponies being a bit more hesitant to have children, though soldiers are more inspired than ever to fight."

RWK_under_tricolor: "Under the Tricolor"
RWK_under_tricolor_desc: "The Tricolor, the symbol of republicanism in Griffonia, flies over all lovers of liberty within our great republic. Every pony all across the nation can look upon their flag with pride and joy, knowing that they are free, knowing that they are safe."

RWK_war_for_light: "War for the Light"
RWK_war_for_light_desc: "Jacques shall suffer no tyrant to live. No slaver, no racial supremacist, no hive mind that steals the minds of thousands. It's time for the republic to march once more, to light the flame of liberty in the hearts of all, and bring freedom to all the downtrodden and oppressed. Today, evil dies."

RWK_let_no_oppressor_in: "Let no Oppressor in"
RWK_let_no_oppressor_in_desc: "If an enemy nation were to be able to push past our soldier outposts, they would then be met with well trained militia. Every citizen of the republic owns a gun and ammunition for that gun, each citizen given training on how to use it. Let the Enclave, Red Eye, or Unity try to march upon our land, they shall find our ponies know how to bite and hold."

RWK_more_beautiful_manehattan: "A more beautiful Manehattan"
RWK_more_beautiful_manehattan_desc: "A nation is not only good due to its welfare, prosperity, or freedom. Beauty is a forgotten thing in this wasteland, but with our money, it's time to return beauty to our little slice of the world. Let Manehatten become a place of beauty, of art, of roses, gold, and marble. Let none question the prosperity of our republic, when they beyond the beauty we bring to the world."

RWK_rise_from_ashes: "Rise from the Ashes"
RWK_rise_from_ashes_desc: "It's time for the army to settle down, and rebuild the wastelands we might have created. We do not make a wasteland and call it peace, instead, we build back the wastes, and call that freedom. Let our soldiers work to fix up roads and construct new factories across our nation. Many of them might even settle down in the areas we fix, all the better."

RWK_expand_welfare: "Expand social welfare"
RWK_expand_welfare_desc: "Our welfare is already a sight to behold across the wasteland, but with our improving economy, there's no reason to not improve it. Let's turn more and more of our growing, booming industry to supporting our civilians."

RWK_gunbarrel_republic: "The Gunbarrel Republic"
RWK_gunbarrel_republic_desc: "The Gunbarrel Republic, a term coined by a critic at first, but Debt Crusher has embraced it. Freedom comes at the end of a gun's barrel, for all those who resist, they will be destroyed, and all those who join, they shall be given guns. The torch of liberty has been reformed, becoming a raging wildfire instead."

RWK_beware_all_ye_tyrants: "Beware all ye Tyrants"
RWK_beware_all_ye_tyrants_desc: "A stable republic has been built, and tyrants across the wasteland rightfully fear what we could bring to them. For now, the republic is a country that hopes. A country Jacques is proud of. Left with hope burning in his chest, and a moment of free time, Jacques decides to read the letter his father gave to him so long ago."

RWK_mayor_of_nation: "Mayor of the Nation"
RWK_mayor_of_nation_desc: "Prime Minister is much too pompous a title for a mare like Black Seas. Truly, she doesn't act like a prime minister, but as a local mayor, meeting often with her ponies, ensuring only the best for them. Her prosperity, her safety, have become loved by all around her. For now, Black Seas is seen as the lovable mayor of an entire nation."

RWK_towards_brighter_future: "Towards a brighter future"
RWK_towards_brighter_future_desc: "The future, now more than ever, shines bright. Ponies from all around live good, happy lives, they vote and they love, as it should be. Truly, Doctor Kelp must be a prime minister of a quality unmatched."

RWK_vive_la_republique: "Vive la République"
RWK_vive_la_republique_desc: ""



