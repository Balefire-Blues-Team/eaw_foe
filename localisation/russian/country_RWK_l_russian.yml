### Events ###
##############

rustwreck.1.t: "Rustwreck seeks to renew trade-ties"
rustwreck.1.d: "Earlier today, our halls of power received a visitor, a low ranking sailor called Crows Nest from Rustwreck, proposing we build up a trade route between Valkyrie’s Point and The Bend. Now Rustwreck isn’t exactly an economic powerhouse, but they’ve still got a lot of stuff, and caps, that we’d like to get our hooves on. Of course, The Ringers aren’t going to be very happy to hear we’re trading outside of ‘The Family’, might even see it as undermining their power.\n\nWhat’s undeniable is that this deal will help both of us and would provide a big economic boost. We could use that boost to try and jumpstart our economy, either to become a better partner to The Ringers, or to strike out on our own. On the other hoof, The Ringers will be angry, and they’ve protected us. It’s like that saying, don’t bite the hoof that feeds you, never know when that offering might become a punch. Either way, we’ve got a choice to make."
rustwreck.1.a: "Accept the deal"
rustwreck.1.b: "Reject the deal"

rustwreck.2.t: "Light accepts the deal"
rustwreck.2.d: "REPORT: LIGHT TRADE AGREEMENT:\n\nMessenger CROWS NEST has arrived back from LIGHT from discussions on the creation of a trade route between VALKYRIE'S POINT and THE BEND. MAYOR DOUGHNUT has responded with an affirmative yes, meaning that construction of a trade route between VALKYRIE’S POINT and THE BEND can now begin, which will boost industry in both areas. Reports indicate THE RINGERS are unhappy with us for 'undermining' their 'family', a possible issue for later.\n\nThis is a good turn of events and exactly what we wanted to happen. This trade will be the start to massive economic growth. No major incidents reported, construction set to begin within the week."
rustwreck.2.a: "Cooperation wins again"

rustwreck.3.t: "Light rejects the deal"
rustwreck.3.d: "REPORT: LIGHT TRADE AGREEMENT:\n\nMessenger CROWS NEST has arrived back from LIGHT from discussions on the creation of a trade route between VALKYRIE'S POINT and THE BEND. MAYOR DOUGHNUT has responded with a no to our generous offer, meaning that construction of a trade route between VALKYRIE’S POINT and THE BEND can not begin. Reports indicate THE RINGERS are happy with this turn of events, it is possible that THE RINGERS influenced this outcome due to their relationship with LIGHT.\n\nThe funds set aside for this project will now be turned instead to investment and construction in that area. While the lack of a trade route will mean slower economic growth than hoped, economic growth will still come. No major incidents reported, investment to begin next week."
rustwreck.3.a: "We will survive without them"

rustwreck.4.t: "The Scourge of the Sea"
rustwreck.4.d: "It’s a muggy and windy day in Rustwreck, as it always is. High Tides paced back and forth through his spacious office, glancing out the window every so often. A raider gang, pirates, more like, called the Razorsharks, have taken over an offshore mining rig, and much as he’d love to just shell them, that thing is just too valuable to damage or lose. Of course everypony has come up with their own ideas on how to solve this issue, from the more reasonable to the outright insane.\n\nWavebreaker put forward the most sane and normal proposal, requesting that our forces should simply engage the raiders at sea and on shore until we wear them down enough to force them to flee. Killing is what everyone else does to raiders, it’s what they deserve, it’s the most straight-forward path to victory. But of course, doing this would lose good sailors, ponies with families, jobs, dying against some monstrous scum of Equestria.\n\nDoctor Kelp, in all her doctorly confidence, has proposed a pacifistic solution. She’s treated some raiders we took captive before, talked to them, knows them, says they aren’t as scummy as we think, that if she could talk to them she could convince them to leave with some money. Not only does this require us to pay those freaks, but it puts our best Doctor at risk, and it just pushes the problem down the road. She seems confident, but overconfidence has killed many a so-called 'intellectual'.\n\nCrimson Waters rushed her proposal, written in red ink, well, hopefully that’s ink, never know with that psycho. Her proposal is to send her to a meeting and have her convince the raiders to join her cult. This would get rid of the raiders, and if it fails, Tartarus, it might get rid of her too, not the worst outcome. Worst outcome is she succeeds, then not only do we have more cultists, but cultists with experience. Whatever. A decision has to be made.."
rustwreck.4.a: "Let's wipe these Raiders"
rustwreck.4.b: "We shall spend caps, not blood"
rustwreck.4.c: "Let Crimson do her thing"

rustwreck.5.t: "Mission Accomplished"
rustwreck.5.d: "REPORT: OPERATION DULL RAZOR:\n\nRUSTWRECK’S navy and our loyal sailors and soldiers have ventured out to face the raider threat known as the RAZORSHARKS. Reports indicate VICTORY, as the RAZORSHARKS have been defeated with only minor losses to our side. The RAZORSHARKS have been hunted down and destroyed and are sure to never threaten our shores before. \n\nThe MINING RIG, ORICHALCHUM, has been taken over and scavenging teams have been hard at work scavenging through it and finding everything of value to RUSTWRECK and our glorious mission. Preliminary searches have reported valuable materials being found aboard ORICHALCUM, which is being inspected further by naval engineers. Further scavenging teams shall see what more hides. No major incidents reported, scavenging to continue."
rustwreck.5.a: "The Navy does not tolerate piracy!"

rustwreck.6.t: "Without a drop of blood shed"
rustwreck.6.d: "Reports have come in from Doctor Kelp, not done in the proper format expected of a report, but that’s what happens when a civilian like her writes. The raiders have left the Orichalcum, the name of the mining rig they inhabited, and not a single drop of blood was spilled. Of course, it cost us a pretty cap, but is money worth more than lives? Maybe. Especially since it looks like those pirate scum are heading north, to the Rain Riders’ territory, meaning we’ll have to keep a close eye on them.\n\nOf course Doctor Kelp has gotten praise from all around ever since she got back, ponies are happy their sons and husbands aren’t sailing out to fight pirates. Even those sceptical of her have kept their mouths shut, just watching the shores with slight worry. Of course she hasn’t let it get to her head, no, and that makes it all the worse, a quiet arrogance by not being arrogant about an achievement. If we end up seeing some of those pirates in a Rain Riders’ raid, gonna make sure that Kelp sees them, knows that her victory wasn’t all sunshine and rainbows."
rustwreck.6.a: "Violence isn't always the answer."

rustwreck.7.t: "Together against he Tides"
rustwreck.7.d: "Feasts, they’ve been the gathering place of ponies since the beginning of history, where enemies can sit and break bread with each other, sort out their differences in a quiet, sophisticated manner. Yet here we stand amongst brothers, sisters, followers and lackeys and those few golden who question yet follow anyway, and the feast is so… sloppy. Slobbering Raiders, shouting and drinking without a care in the world, so loud. Crimson stands and watches as her many cult members talk with the new converts, including Stranglevine, the raider leader who’s fully bought into it all. He’s a fool who’s not taken a single second to think, merely following the first pony who offered a hoof. A mutt, and that’s being unkind to dogs. They shout and talk of the wonders of all the cult has to offer, but they’re nothing but snakes in the grass, to turn so easily was a sign of weakness, not a sign of strength.\n\nShe would saunter out from the door she stood behind, and like that the feast would become quiet, as all look over at her. She flicks her mane to the side, clearing her eyes to look at each and every one of them, before putting on a practised grin and happy expression, ‘My brothers and my sisters, my lovely ponies from every trot of life, I am so happy you’ve accepted your new siblings in faith so readily. Stranglevine here was so attentive when I told him everything about the Endtide, following my every word like a do.. Ahem, a loyal hound eager to learn from its master, the perfect member!’ Her words are met with a cheer, as she scoops up a drink, hopping up onto the table, scattering around plates of food, holding it up with a wide smirk, ‘To our new brothers and sisters, converts to the truth, to the wondrous world they’ve opened their eyes to, to me, who shared with them the truth so freely, so readily! My followers, my beloved ponies, my friends and my family, raise a glass, raise a mug, raise your voice, all together we welcome them! Bound by blood, we are one!"
rustwreck.7.a: "Bound by blood, we are one!"

rustwreck.8.t: "Trade Fleet from Rustwreck"
rustwreck.8.d: "Earlier today a bunch of boats arrived from Rustwreck, laden with goods and ready to trade with us. Of course we’ve always been open to trade with them, they have a lot of stuff to give, but we’ve treated them no different than any other trader. This fleet though came with some documents, an agreement to offer us, saying we should lower our tariffs of them and be more open to their economies.\n\nNow there’s some benefits and drawbacks to both options. Saying yes will give us some better trade, a better economy, but then again, it might also open them up to getting better too. We don’t know if Rustwreck is going to be on our side forever, so giving them some economic opportunity might come back to bite our flanks in the future. Of course, if we say no, we’ll also lose out on that benefit. We have a lot to gain and a lot to potentially lose, we’ll have to think."
rustwreck.8.a: "Prosperity for us all"
rustwreck.8.b: "We shouldn't give them too much ground"

rustwreck.9.t: "[FROM.GetName] welcomes our Trade-Fleet"
rustwreck.9.d: "REPORT: TRADE FLEET:\n\nOur TRADE FLEET has made contact with [FROM.GetName] earlier today. Our TRADE FLEET carried a proposal to open up barriers between us for greater trade and economic prosperity. Luckily they have AGREED and economic cooperation has begun between our two communities quickly. No major incidents reported, trade to begin next week."
rustwreck.9.a: "Caps make the world go round"

rustwreck.10.t: "All Hooves to Battle-Stations!"
rustwreck.10.d: "March, 1035, Celestia Sea Fleet under command of Admiral High Tides.\n\nTwo Imperial Naval Frodo’s have been spotted nearby to Haukland and are on way to Severyana, rumors are of either trade interdictors or a possible invasion force. The Celestial Sea Fleet, rebuilt with the latest technology available after the disaster that happened in 1014, was dispatched on an interception mission to catch the stripes before they had a chance to get close to Equestria and her sacred shoreline. Passing by Albion, the Fleet was assisted by Northern Air Command, carrying dozens of Raptors, Skytanks, and a Thunderhead, who moved to assist the Fleet and her flagship, the Battleship HMS Sunrise.\n\nContact with the enemy was established near the Stepstone Sea, seeing the enemy fleet consisted of many smaller vessels, and a few larger ones such as the enemy flagship, the Gloriana. High Tides would act decisively upon spotting the enemy fleet, seeing the three options before him. He could hunt down the enemy’s flagship and destroy their spirits, as well as their command structure, he could destroy as many smaller vessels as possible to remove all extra firepower, or he could attack carefully as to conserve strength for future conflicts. Of all options, High Tides decided upon:"
rustwreck.10.a: "Hunt their Flagship, the Gloriana"
rustwreck.10.b: "Destroy as many vessels as possible"
rustwreck.10.c: "Conserve our own strength and attack carefully"

rustwreck.11.t: "The Long Retreat"
rustwreck.11.d: "The Celestial Sea Fleet failed their mission...\n\nWe failed Equestria...\n\nWhere Equestrian lasers boiled the sea and melted hulls, the Zebras responded with salvoes of hundreds of missiles that minced flesh and steel in equal measure.\nWhere tactical Megaspells ripped holes in the Zebrican formation, they were answered by balefire torpedoes that vaporized Equestrian ships without even wreckage left behind.\nThe battle was even... we could have won.\nCould have won if Northern Air Command hadn't betrayed us. By some subtle signal our air support broke of the battle as one and ascended beyond the clouds. Radio transmissions urged every Pegasus in the fleet to retreat to the clouds as well, but the Admiral ordered that our own anti-aircraft guns be used to shoot every desserter out of the sky. Few dared to try and join their feathered brothers after that. Still, without air support the battle would be a one sided slaughter. The order to retreat was given and luckily the Imperial fleet was damaged enough to not pursue.\nJust as preparations had been made to rendevouz at Albion and repair, our systems went out of control. Warning sirens went off on every ship in the fleet, striking many an unlucky sailor deaf for days after.\n\nIt had finally happened!\nThe much dreaded megaspell exchange...the end of the world.\nMinutes later, the sirens manually disabled, sickly green explosions could be seen on the mainland as zebrican Balefire Warheads destroyed everything we once held dear. An hour off the coast High Tides watched several warheads impact around Albion, shrouding the whole metropolis in necromantic fallout. Where to now? Prance? Manehattan? Fillydelphia? No, every major city and known military installation would be targeted.\nWith his homeland dying mere miles away, Admiral High Tides charted a course for the little used harbour of Redheap on the Poninsula.\nThe world was over, but on their way south, they would save what they could..."
rustwreck.11.a: "They loaded the ships full of civilians"
rustwreck.11.b: "They evacuated labs and factories"
rustwreck.11.c: "They scuttled every military base they came across"

rustwreck.12.t: "Carrying the Legacy"
rustwreck.12.d: "Her Majesty’s Navy is still the gemstone of Equestria, even if half of it has washed up on the shore of the small town once called Redheap. Sailors have renamed it to Rustwreck out of some sort of humor about the ships crashed into shore, attempting to make light of the situation. While annoying on its own, what annoyed High Tides more than anything was when one of these jokesters tried to seriously convinced him to get rid of more of the fleet, due to ‘economic drain’ and ‘resource use’, nothing but excuses from Zebra-loving pansies who want to see the last shining light of Equestria snuffed out.\n\nSure, its been ten years since Equestria died, and High Tides looks more like a zombie than a pony at this point, but that navy is still more valuable than the opinion of a hooffull of sailors. But they have a point, the fleet won’t need to turn its guns against the striped menace for a while longer, and if Her Majesty’s Navy wants a chance to ever spill striped blood again, it’ll cost a sacrifice. So, biting his tongue and putting down his pride, High Tides would reluctantly agree to a proposition on what to do with the ships."
rustwreck.12.a: "Use them for a trade-Fleet"
rustwreck.12.b: "Convert them to industrial use"
rustwreck.12.c: "Keep some as floating military bases"

rustwreck.13.t: "In the belly of the Beast"
rustwreck.13.d: "HMS Iron Shield, once a great enforcer of Equestrian power, Luna’s long-reaching hoof, even if just a cruiser, has now become a derelict hive of scum and psychopathic freaks, otherwise known as the Cult of the Endtide. High Tides would be given a tour after a surprisingly cordial meeting with the Cult, though his bodyguards retain a quiet vigilance, you never know with cultists, after all. He made a show of correcting the cultist giving the tour at every point, after all, he knows damn well what a cruiser’s inside looks like and he doesn’t need some freak to explain it to him like he’s never seen it before. Each correction would make his guards tense slightly and prepare for lashback, but none would ever come, the cultist laughing it off and continuing the tour. Being laughed at only put High Tides in an even worse mood, and he had to suppress many, many violent feelings before the tour ended.\n\nNow stood in a meeting room, once a captain’s quarters, he met Crimson Waters, head freak, dressed in a disgusting robe with brown stains all over it, probably blood considering it’s this psycho. Her stance is terrible too, like one of those pansy Army generals who got in through birth, confident and theatrical, the type of pony he’d like to give a lashing if they ever got on his ship. Crimson surprised him, though, because as soon as everypony else left, she would begin to speak more normally, giving him an offer to end all the recent trouble.\n\nShe gave him a list, a list of names, fake troublemakers who Crimson wants to take the blame so she can deal with the actual perpetrators more subtly. Given she’s the leader of the freaks who caused the trouble to begin with, this offer first came off as extremely rude, arrogant even, and it took until Tides was shouting and growling at her that she fully explained. Do this for her, trust her, let her take care of it, and the cult will align with the state, calming tensions. Just take the list and blame them, let her do the work, and calm everything down.\n\nHigh Tides’ voice sounded more raspy than normal as he talked over the deal, a pounding in the back of his head telling him to just kill her for even thinking she can offer him this poisoned deal. But her cult is big, it could be helpful to have on his side, even if the freaks are psychos. Of course, she’s also giving him a list of ponies she doesn’t like, or is even scared of, it’d be easy to just go to them, make them work against her. As she flashed him a final, confident smirk, he’d be left to make the choice in a second of thought."
rustwreck.13.a: "High Tides takes the Deal, allying with Crimson."
rustwreck.13.b: "Let's just take the list and use these ponies to damage the Cult."

rustwreck.14.t: "Like shooting Raiders in a barrel"
rustwreck.14.d: "War, war never changes, be it civil or not, it’s all just a bunch of insane freaks fighting against normal ponies, and these past few days have proved that. Those cult freaks, the Endtide, have been fighting hoof and tooth in Westshore and in the Poninsula, giving those freaks the exact fate they deserve, bullets to the skull so their psycho-babble doesn’t make any other freak follow them. These insane freaks, unlike those Zebras freaks, were easy to beat, scattered and disorganised, wiped up easier than a dead roach by a broom and pan. Those freaks didn’t even suspect we were coming, they hardly had weapons, made them easier to shoot than a pacifistic protest back in the good old days.\n\nSadly these freaks have been entrenched in a few places, strongholds with guns, ammo, and plenty of psychopathic freaks to use them. It will cost good ponies their lives, it will cost us bullets, but we’ll get it done. These freaks aren’t worth the bullets used to kill them, but as long as they try and destabilise us, they’re a threat worth killing. Soon there are going to be some proper assaults on those freaks, and once we’re done, well, Crimson Waters is gonna be surrounded by a bunch of ponies losing their crimson."
rustwreck.14.a: "No discipline like navy discipline"

rustwreck.15.t: "Dismantling the Warcamp"
rustwreck.15.d: "The freaks are gone, we took out their place, Crimson’s Warcamp, but sadly didn’t get to wipe it from the face of Equis, nah, instead we gotta build it back up. Wavebreaker, that geek, planned the attack, though like all geeks he stayed out of it when the going actually came, letting others handle it. Pansy. Doctor Kelp and her ‘Council’ gave us some caps and the infrastructure to rebuild it all, though that pacifistic high-on-her-pony Kelp is going to rub it in our nose for the rest of time by never actually acknowledging it. Not like that Manehattenite pacifist could ever handle actually going out there to fight, nah, she’d turn to the bottle like the rest of her kind always do when the going gets tough.\n\nEven though they’re both pansies, they’re helping, so they’ve had some say in stuff, like renaming the town. Wavebreaker actually gave a good idea when he got his face out of one of them geek novels, said we should name the town after a pony who was in the first wave, a hero who died fighting. Probably because the geek feels guilty about not being there. Kelp wants to restore the old name of the town, which isn’t bad either, it’s about time some normal names came back to Equestria, enough of this ‘Rain Riders’ and ‘Liberation Army’ and whatever in Tartarus’s name those traitors are naming their fiftieth cloud city or bunker. Both ponies have got good points, but only one can be picked."
rustwreck.15.a: "Let Wavebreaker have the honor"
rustwreck.15.b: "Dr. Kelp should have this one"

rustwreck.16.t: "The Fate of Crimson Waters"
rustwreck.16.d: "In a brig would be one pony, desperate and defeated, Crimson Waters, looking up at Wavebreaker, High Tides, and Doctor Kelp, as they look back at her. Before they could say a word, she would speak, quickly and without that trademark cult personality, ‘You don’t want to kill me! Celestia’s name, do you actually think I believed all that cult stuff? I’m the one who made it up, me, made it up out of thin air, I’m not a believer, I’m just a mare who wanted power, okay, just a normal mare who’s plan got out of hoof! I went too far, okay, I know, I shouldn’t have gone against you, but look at all I’ve done, look at everything-‘\n\nShe’s cut off by a rising growl from High Tides, who presses against the cage door separating them, speaking in a very raspy voice, ‘I should throw you overboard until you wither and die like the insect psychopathic freak you are!’ Wavebreaker would nod along, looking at her, ‘Sir, with all due respect, I agree, she’s done a lot wrong. A pony with the power to speak like her is a threat, sir, one which shouldn’t be underestimated. She is like a Sirin, sir, it’s best we not give her time to sing.’ High Tides looks over at him, deadpan, ‘Is that a reference to one of your geek stories?’ Wavebreaker blinks and shakes his head too quickly, ‘No! No sir! I don’t even know what you’re talking about, sir, geek stories have nothing to do with what I do in my free time, sir, nor what I do on shore leave, sir, and respectfully, sir, there is no connection between me and it, sir, it is more disconnected than a flamethrower and a 155mm gun, sir.’\n\nDoctor Kelp steps forward, ‘If I may, Wavebreaker, that is quite enough of your obscuration. High Tides, I believe that Crimson Waters should be given amnesty rather than defenestrated, I believe it is pertinent to consider the possibility of beneficial consequences of keeping her around.’ High Tides opens his mouth to speak, but Kelp talks before he can, ‘Like her or call her a psychopath, though narcissistic personality disorder would be more accurate if we’re psychologically diagnosing her, you must acquiesce and admit she has done something impressive. She built a rival power system within your nation-state, one whose prominence threatened your reign, one which could have easily overthrown you given time. That power is not to be thrown away, it would be like a unicorn throwing away telekinesis, rather that dangerous power should be used, abused, to your advantage.’ High Tides would frown, but relent."
rustwreck.16.a: "Very well, Crimson may live"
#rustwreck.16.b: "The traitor will be keelhauled!"

rustwreck.17.t: "Preaching in the Outskirts"
rustwreck.17.d: "Religion, High Tides don’t got a thing against a pony with a simple belief in something divine, even if he hasn't decided on any of it after all he’s gone through, religion is fine enough. Cults, though, are infuriating, claiming they have the answers to every problem, just throwing gasoline onto the problems that already exist. Before the war it was Nightmare Cultists, bats and freaks who wanted that psycho, Nightmare Moon, to return, during the war it was those zebra kooks who didn't know flank from tail, shouting their babble about stars. Nowadays , it’s the Cult of the Endtide, freaks that are just as bad as those before then, but now they serve a purpose due to that uneasy alliance.\n\nTheir preachers have been getting more bold recently, preaching their nonsense right outside of the capital, and some ponies were even buying into their psycho cult preachings. If we let them continue like this then more ponies are going to become freaks like them, kooks spouting about doomsday and apocalypse like we haven’t already gone through one, but it’ll keep them happy and on our side. Of course, we could also crack down, throw these freaks into a cell, spare our ponies from their nonsense, but that would make Crimson mad. What’s more valuable, tossing these freaks where they belong, or keeping Crimson happy?"
rustwreck.17.a: "Let them preach"
rustwreck.17.b: "Arrest the preachers"

rustwreck.18.t: "Census Results"
rustwreck.18.d: "REPORT: CENSUS DATA:\n\nRUSTWRECK CITY has been purveyed during the NATIONAL CENSUS and has shown little change from what was predicted and expected, no major change noted. SUNRISE has suffered a population DECLINE due to the failure of a caravan company, SUNRISE SUPREME, which led to many ponies in the area migrating elsewhere, a decline from prediction noted. BROKEN ROAD has shown little change from what was predicted and expected, no major change noted. THE OUTSKIRTS has shown little change from what was predicted and expected, no major change noted. THE PONINSULA has shown little change from what was predicted and expected, no major changes noted.\n\nWESTSHORE has shown a massive INCREASE in population above what was expected from predictions. Migration seems to come from LIGHT due to the takeover of THE RINGERS, many families have left to join us. Notably there are many SKILLED WORKERS who shall boost our industry in the area. Every other settlement showed no change outside of predictions."
rustwreck.18.a: "Fascinating"

rustwreck.19.t: "War or Peace"
rustwreck.19.d: "Two hundred years, that’s how long it’s been since that last war ended. Well, close enough to two hundred anyway, and even today ponies struggle in the aftermath. Oh sure, there were raiders, psychopaths, cultist freaks fighting each other, but those were never wars, not on the same scale. Not like the war High Tides had seen before. But the world has changed recently, a silver-tongued psychopath has taken Fillydelphia, Ranger-freaks are coming out of their bunkers, those freaky alicorns are making moves, not to mention the radio doesn’t shut up about heroes this and heroes that, it’s obvious that things are coming to a boiling point.\n\nHigh Tides stands in his office, overlooking the capital, feeling a lowly simmering pride deep in his chest, seeing how far this place has come. Ponies trot safely, no raider freaks are around, no pinko pacifists haunt the streets, it’s like a slice of the old world if everything was more decayed. But it can come so much further, with slow, stable growth in the civilian sector it could be so much more, a maretropolis, a shining star on the coast, a screw you to those zebras for thinking they could destroy it. But there’s tensions, there’s gonna be war soon, and even the best discipline doesn’t beat a foe if they don’t have ammo to shoot with. Thus he stands, looking out, pondering, is it best to focus on defence and war, so they’ll never be caught off guard, or focus on building up the civilian sector and making everything better?"
rustwreck.19.a: "War"
rustwreck.19.b: "Peace"

rustwreck.20.t: "Borderwar - Victory"
rustwreck.20.d: "REPORT: BATTLE OF BOOSTERJUICE:\n\nEarlier today in the province of BOOSTERJUICE the forces of RUSTWRECK fought the forces of the RAIN RIDERS and succeeded in crossing the HOOFSIC river, thus securing the northern border-towns from future raids.\n\nThe fight reportedly went smoothly and without major incident, no loss of life beyond predictions and no massive loss of equipment. This defeat over the raiders should send a message to them that we aren’t to be messed with. Border seems secured, border guards will be kept in position for possible counterattack."
rustwreck.20.a: "Excellent!"

rustwreck.21.t: "Borderwar - Loss"
rustwreck.21.d: "REPORT: BATTLE OF BOOSTERJUICE:\n\nEarlier today in the province of BOOSTERJUICE the forces of RUSTWRECK fought the forces of the RAIN RIDERS but were stalled on the HOOFSIC river. Reports indicate that the RAIN RIDERS took the stalling as an opportunity and went behind our lines, raiding BROKEN ROAD and taking loot.\n\nThe fight ended with a noticeable loss of life and of equipment, it was a costly defeat. No other border movements have been noted by border guards, but this failure has emboldened the raiders and sent a message that we can’t protect our northern cities. Border is unsecure, border guards will watch for a second attack."
rustwreck.21.a: "We'll get them next time"

rustwreck.22.t: "Borderwar - No Movement"
rustwreck.22.d: "REPORT: BATTLE OF BOOSTERJUICE:\n\nEarlier today in the province of BOOSTERJUICE the forces of RUSTWRECK fought the forces of the RAIN RIDERS but were stalled crossing the HOOFSIC river. The RAIN RIDERS attempted a counterattack, but the counterattack failed, being destroyed by defences at FORT WAVEBREAKE. RAIN RIDER troops fell back to their side of the HOOFSIC, leaving no movement made.\n\nThis sends no real message and thus the status quo has been maintained. No major loss of life or equipment. No other border movements have been noticed by border guards, patrols will be continued in look-out for a possible raid of revenge."
rustwreck.22.a: "Rearm, retrain, retry."

rustwreck.23.t: "The Burdens of Age"
rustwreck.23.d: "The HMS Celestia’s Grace, once nothing more than a cheap cruiser chewed up by war, now a shining, brand new top-of-the-line ship. High Tides trots with an officer by his side, speaking in his raspy tone of voice as he inspects the ship, ‘This hunk of junk wouldn’t have gotten praise back when I sailed, but now it’s the best we have. You did a good job with it, Officer. . .’ He trails off, looking the Officer in the eyes for a few moments, before speaking slowly, ‘Sea Cucumber, of course. Celestia’s Haste is looking good.’ He pauses and blinks, ‘Taste. Face. Celestia’s Grace.’ He growls and shakes his head, ‘It’s a stupid name anyway, we should redo it, Celestia’s Haste sounds better anyway!’\n\nOfficer Sea Cucumber looks at him oddly, stepping closer, ‘Sir, are you okay? It’s not like you to forget words like this, sir, especially not of ships.’ High Tides raises a hoof and points onwards, indicating the tour should go on. Sea Cucumber would blink, but slowly go along, stepping into the ship to give a tour of its refurbished insides. High Tides would follow after, until a sudden bout of dizziness, making him stumble and slam his head into the metal door leading into the ship. He growls while Sea Cucumber comes up to him, ‘Sir, are you okay? That was a bad hit, sir.’\n\nHigh Tides growls and clutches his head, stumbling a bit, before shaking his head, ‘I’m fine.’ He waves at the Officer dismissively, ‘The ship looks good enough, the Haste, Grace, whatever, it’s good to sail. This is a waste of my time, I’m going home.’ He growls out the last word and storms away, his hooves hitting hard against the ground as he trots, putting his mind onto other matters."
rustwreck.23.a: "Some meds will fix this."

rustwreck.24.t: "Out of Commission"
rustwreck.24.d: "It all started when he fell getting out of bed, banging his head against a desk, not the first time High Tides has banged his head the past little while, but ever since there’s been a droning migraine in his head, pounding like the drums of war, and his legs feel weak, worse than even the worst sea-legs.\n\nDoctor Kelp leans back from wrapping a bandage around Tides’ head, looking down at him with a small frown on her face, hidden behind a medical mask, ‘Now, with you experiencing symptoms such as a migraine and weak legs, I am not just encouraging, but ordering you to remain in bed for a week. We don’t know what has infected you, and if this pathogen has a high infection risk then it could cause havoc amongst us all.’ He looks at her and opens his mouth to speak, but in a surprising show of force, she stomps her hoof, “Tides. You will listen to your doctor and you will listen now. I am stumped by what’s causing you to be sick and I need time to research it, to find out what this could be, ghouls don’t usually catch pathogens, so this is unique. There’s no room for further questioning, you will listen and obey, and you will remain in your bed.’ She looks deep into his eyes, before spinning around, trotting out of there.\n\nWavebreaker enters as soon as she leaves, giving Tides a salute and a slightly worried look. Tides looks at him and closes his eyes, ‘Wavebreaker. I hope you didn’t have any plans for that geek stuff for the next week, I need you to take over. Damned pinko Doctor ordered me to remain in my bed and I know better than to piss off your medical staff. You’ll be taking care of things for me, understood.’ Wavebreaker nods, ‘Yes sir, though I should note I did not plan to do anything that involved geekiness for the next week, or the next rest of my life, sir. Are you okay, sir?’ High Tides would lean back and growl, ‘I’ll be better when I don’t have to put up with annoying nerds and geeks coming into my room! Get out already!’ Wavebreaker salutes and follows orders, leaving the room immediately."
rustwreck.24.a: "A sick ghoul? Scary."

rustwreck.25.t: "Diagnosis"
rustwreck.25.d: "Throbbing pain and weakness for a week, unending and unforgiving, High Tides would know no respite. Doctor Kelp worked hard on a diagnosis, taking tests and running theories, annoying him almost every single day, her pacifistic smart-pony arrogance almost driving him to madness multiple times. Today would be no different, coming in to take useless samples to run her useless tests on them, all while treating him like he’s some infirm corpse!\n\nDoctor Kelp stands at the hoof of Tides’ bed, speaking to him, ‘Admiral, despite being alive, your body is still, for all intents and purposes, a cadaver slowly rotting away due to necrosis. Your external self looks fine, as fine as a ghoul can look, but inside, Admiral, your body has been withering.’ She lifts up a flask to her lips, taking a deep sip of warming whiskey, before putting it down, speaking slowly, ‘It’s reached your brain now, Admiral, that’s the cause of the migraines you feel, it’s your brain slowly rotting. Soon it’ll be gone and you’ll become feral, Admiral, you’ll be. . . You’ll be gone. I don’t know what I can do, I’ve run tests and tried to make cures and vaccinations, but nothing works. I’ll try. I’ll try, Tides. I’m sorry.’\n\nTides looks at her as he’s given the news, the throbbing pain getting worse, filling his head with nothing except that pain. A moment passes before he stands from his bed, his legs wobbling as he approaches her, a growl rising in his throat, ‘You’re telling me I’m going to die, Doctor Kelp? Then what are you good for if you can’t do anything about it?’ He scowls and gets right in front of her face, ensuring she can smell his rotting breath, ‘You think you know everything you pinko pacifistic little good for nothing rich pony? Think you know I’m going to die? You think you know? You know nothing about death!’ He pushes her back and shouts louder, ‘Leave! Get out of my sight you useless idiot! I should have never hired you to begin with, you’ve done nothing for me, nothing, nothing!’ She frowns softly and extends a hoof towards him, ‘Tides-‘ He shouts over her in a loud yell, slamming his hoof against a nearby wall, putting a dent into it, growling, ‘You keep your mouth shut about this or I’m going to make sure you never say another useless word again! Now get out!’\n\nIt was only after she left that he paused, breathed, and began to slowly cry."
rustwreck.25.a: "We need to keep this secret"

rustwreck.26.t: "Pain"
rustwreck.26.d: "Bright lights, restraints, the smell of a sterile hospital, those all met Admiral High Tides as he opened his eyes. A mare stands above him, a doctor, probably a field medic who’s pulled him away from his ship going down. Heh, bet he gave it to the stripes before that ship went down. He’s only a Ensign at this point, but he’ll be damned before he gives the stripes a win without some blood.\n\nTides speaks, his voice a bit more raspy than he remembers, ‘Hey there, Doc. How’s the stripe look?’ The mare looks down at him, a name-tag on her, reading Doctor Kelp. Strange, no rank. She speaks softly, ‘Admiral Tides?’ He snorts with a quick laugh, ‘I wish, just Ensign right now, sweetheart. What happened to me out there? Did I take down one of the stripes?’ She frowns, and takes a second before responding, ‘Tides, I’m afraid you’re not in the past. You are Admiral High Tides, leader of Rustwreck, the war was two hundred years ago. You were turned into a ghoul via Balefire bombs, and you’ve been demonstrating retrograde amnesia due to a process called feralization, where you slowly lose yourself. We’re trying our best to save you.’ He takes a second to take in all she said, before cracking a small grin, ‘Dang, and here I was hoping I was a young sailor being cared after by a cute doctor. I-‘ He growls as a lance of pain goes through his head, ‘I remember the pain, and the biting, I’m dying, I’m. . . Oh Celestia, I’m really dying, it hurts so much.’\n\nKelp looks away from the bed, taking out a flask and taking a deep swig from it, before looking back, ‘Tides. I. I have made a cure for the process, one which can halt it. But. It’s not pleasant. It’ll be the worst pain you’ve ever felt, assuming it even works. You’ll hopefully remember everything and be able to increase your lifespan again. But I can’t promise anything. I’m sorry, I tried my best.’ He chuckles softly, closing his eyes, ‘Hey, I don’t want a pretty mare crying being the last thing I see, Kelp. It hurts a lot, more than anything I’ve felt before, but I’m a soldier, I can maybe take it. But I don’t know. Maybe I should just die, let it all end.’ He sighs out, and looks up at her, answering after a minute."
rustwreck.26.a: "Do it!"
rustwreck.26.b: "Just let me die..."

rustwreck.27.t: "The Treatment"
rustwreck.27.d: "The screams are the only thing Kelp hears. She attempts to drown them out with her flask, but it doesn’t work, they echo around her mind like a bad case of tinnitus. It was supposed to work, every test said that it should, the pain wasn’t supposed to be that bad. Another swig. High Tides was a grumpy stallion, hardly nice, but he was a good stallion, a stallion who deserved so much more. Another swig. She should have seen the signs, should have prepared a cure before, maybe he’d still be awake. Another swig, but nothing comes, the flask run dry. His body is there in the room, catatonic.\n\nThe nurses and her had injected him with the cure before retreating, watching with baited breath as he spasmed, screamed, and begged for the pain to be over. His mother, Celestia, Luna, even Discord, he begged them all, before it all went silent. She approached him with bated breath and hope, reaching out for a response, but none came. The others checked him, a burst blood vessel during the struggle, he’s still alive, but never to awake again. It wouldn’t even occur to her. She’d sit next to him, holding his rotting hoof, hoping they’re wrong, hoping he’d awake. He never did. No matter how much she begged he would, no matter how much she prayed, he never woke up.\n\nShe’s drunk off of her whiskey, but it doesn’t help. Every time she closes her eyes she sees him make the decision, looking so hopeful and so afraid. She trots over to him and takes his hoof, holding it for a minute, before she whispers to him, ‘I’m sorry, Tides. I tried my best. I’m sorry.’ She sniffles as her eyes water, turning away from Admiral High Tides for the last time."
rustwreck.27.a: "Damn, this is gonna be a problem"

rustwreck.28.t: "Emergency Powers"
rustwreck.28.d: "Early yesterday a treatment to cure the process of becoming a feral ghoul was given to High Tides, but during the treatment he suffered a burst blood vessel, and has since gone catatonic.’ Doctor Kelp speaks, sitting at a table with many well dressed ponies, members of the Sunrise Development Council, some military ponies, more peaceful members of the New Admiralty, and some not well dressed ones, the supporters of Jacques Perrylous, and the Griffon himself. She continues, a half-empty glass of whiskey on the table in front of her, ‘Wavebreaker and Crimson Waters are sure to try and grasp for power, which will bring Rustwreck into an era of conflict and war, if they don’t tear apart the realm fighting for leadership. In light of this, I propose I be granted temporary emergency powers so I can steer our nation through this crisis.’\n\nMurmurs break out amongst the table, even the most loyal to Kelp being hesitant to agree, but the murmurs die down as Jacques stands, tapping his talons against the table, ‘So let me see if I’ve got this right, Miss Kelp. Your failure has basically killed High Tides, and you want us to trust you with emergency powers?’ He snorts, ‘I ain’t a chick, and I wasn’t born yesterday, we can all see this is a grab at power for yourself. Couldn’t take being First Mate so you had to become Captain did you? Who’s to say you ain’t just gonna call everything an emergency, eh, who’s to say you ain’t gonna be a dictator?’ He grins slightly, ‘Why should my crew not just leave right now?’\n\nShe looks at him, sitting down and picking up her whiskey, taking a deep sip, before setting it down, ‘Jacques Perrylous, I require your presence because I trust you to do what needs to be done. I’m a Doctor, I swore to do no harm when I took my oath, believe me, the ivory towers of power are not my place. But Wavebreaker is hawkish, Crimson is insane, and you don’t have enough support to win leadership, I am the only mare educated enough to take the reins. I also need your help and experience, Jacques. You’ve been sailing a sinking ship for twenty years.’ She picks up her whiskey, and downs the last of it, then sliding her papers to the centre of the table, the paper being a proposal for emergency powers, ‘Welcome to my sinking ship."
rustwreck.28.a: "Let's hope none try for a coup"

rustwreck.29.t: "The Compromise"
rustwreck.29.d: "Ponies and a few Griffons stand armed all throughout Rustwreck, the Royal Marines and some sailors occupying the harbour for Wavebreaker, while some militia, parts of the army, and Jacques’ crew stand opposed from them, each side itching for a sign to draw their guns and fire. Above it all, in the Harbourmaster’s Office, stand Kelp and Wavebreaker, drinking whiskey and coffee respectively. Bags line the bottom of their eyes, both having only gotten sleep in winks and blinks the past few days. Paper lays on the table between them, terms of agreement between the two sides.\n\nWavebreaker paces back and fourth, looking out the window to the stand-off below, while speaking in a high-strung voice, ‘Why did this have to happen? It was all going so well, Tides seemed to be doing better, to just die like he did, it’s not right. It’s not right at all.’ He looks at Kelp with narrowed eyes, ‘And his killer is the one telling me I should just give up and let her lead? Your failure caused him to die, Kelp, and even worse it caused him to die in pain, in suffering, horribly. It’s not just murder you did, it’s torture, and now I’m expected to sign the country to you? You know I could send the marines in, they would likely win.’\n\nDoctor Kelp sighs softly and picks up her whiskey glass, downing another portion of it, before putting it down, ‘It was supposed to cure him, not kill him, and he is still alive, even if catatonic. I won’t make excuses for my failures, my mistakes have been numerous and often, that is not the problem at hoof.’ She taps the paper in front of her, ‘Wavebreaker, you’ll be the new Admiral, even if the country won’t belong to you. You will command the navy and be at its helm, you’ll be able to keep me in check, checks and balances, Wavebreaker. You could order your soldiers forward and you might win, but you would leave us weak and crippled, paving the way for the Ringers to conquer us. I know you aren’t happy about it. I’m not happy about it either, if I could give away this responsibility, I would. But Rustwreck comes first.’ Wavebreaker picks up his own coffee, downing it as he closes his eyes. Slowly, he opens them back up, and signs his name on the paper."
rustwreck.29.a: "Crisis averted."

rustwreck.30.t: "Separation of Church and State"
rustwreck.30.d: "Earlier this week, I spoke to Admiral Wavebreaker, and convinced him along with the New Admiralty to join our side. While averting civil war from the New Admiralty, Crimson Waters and the Cult of the Endtide have seized many outlying settlements for their cause, ensuring any conflict would be a bloodbath. Thus, I have invited to the Council today the mare herself, Crimson Waters.’ Doctor Kelp would finish her droll speech as the doors swing open, Crimson Waters sauntering into the room, a group of bodyguards following right behind her. Her each step is purposeful and confident, her eyes scanning every set at the table. Doctor Kelp continues her speech, ‘In order to find alliance and compromise with the Cult of Endtimes, we will be voting on a bill to give them representation, should Crimson agree.’\n\nCrimson flicks her mane through the air and grins as Kelp finishes speaking, ‘My oh my, are you all sure you haven’t picked a robot as your leader? Such lifeless prose, and such a stiff pose, I’ve heard more life from Spite-Bots.’ She chuckles, her cultists chuckling along, as she begins to trot around the table, behind the backs of the council members, ‘But even a broken bot is right twice a day, oh yes indeed, she is right to not want to fight me. None of you have seen a second of war nor a drop of blood, you’re virgins to destruction, afraid to ever face the flames stoked outside. You’re going to be angry when I have my seat alongside you, you’ll think I’m a freak, like the late corpse.’ She leans her head in to the table, placing it right on the shoulder of the sitting Jacques, who looks over at her as she grins, ‘I think I want my seat right beside this one, oh yes, that’ll be nice. I accept your terms, Kelp, after all, bound by blood, we are one.’\n\nThe council would all be uncomfortable in the minutes following, but, with a resounding yes vote, the bill would pass, granting the Cult of the Endtide many privileges."
rustwreck.30.a: "Freedom, even for the Cultists."

rustwreck.31.t: "Blood or Steel?"
rustwreck.31.d: "It’s hard to remember things. High Tides doesn’t remember what day it is. What year. Sometimes he thinks Celestia is still alive, he can swear he sees Luna. Other times he wants nothing more than to rip out some stripes’ throat. It’s too much. He’s dying, that’s clear to see, he can’t even summon the energy to care about that anymore. But Rustwreck needs a leader, no matter if they’re a geek, or a freak. Just. Someone. Someone after him.\n\nWavebreaker stands above High Tides in his bed, and though the stallion tries to look stoic and professional, he can’t stop his eyes from looking worried, scared, and sad. The two would talk for hours, from the early morning to the mid afternoon, after all, Tides can’t do anything else. Wavebreaker is a good stallion, he hates the cowardly Pegasi and the cowardly MWT just as much as Tides, he won’t let them trot all over Rustwreck, no, he’ll use the navy to blast them out of the sky and bunker. He sees Wastelanders as tools, assets to be given orders and told what to do, he’s pragmatic, practical, he’ll lead them well. Better than that, he’s practically lived his whole life on a boat, he’ll be able to order the military like nobody else, making Rustwreck worth respecting. He’s a nerd, and a geek, and his glasses are stupid, but that doesn’t matter. Not now. Now anymore. Wavebreaker would leave after a long time, his eyes sad as he said his final goodbyes.\n\nCrimson would spend the rest of the day talking to Tides, the mare’s every word being confident, even if they’re mostly insane. Her eyes shine with intelligence and charisma as she speaks, and with some care for Tides, even if they don’t see eye to eye on everything. She’s insane, of course, a psychopathic freak leading a cult who’s even worse, blood drinkers and killers. But she’s the leader of a cult so disliked, yet somehow it’s gained so much popularity. The cult is also treated well by her, and no matter what one can say, she will listen when someone speaks. Above all, she’s charismatic, and maybe that’s what Rustwreck needs, someone who can lead them, unify them. She would leave as the night begins, using her last words with Tides to wish him good luck on the other side.\n\nBoth candidates have their upsides and downsides. With his mind slowly slipping, Tides calls his staff into the room, before declaring his official successor."
rustwreck.31.a: "Wavebreaker"
rustwreck.31.b: "Crimson Waters"

rustwreck.32.t: "The Prodigal Son"
rustwreck.32.d: "Twenty years ago, we sent an expedition to Griffonia to try and see if any life remained that could potentially be used to our benefit, but it never returned and was thought to have been dead. Commodore Seafoam left and never returned, until now, when we spotted a large and dilapidated barge slowly sailing its way to Rustwreck. Being hailed on the radio, they confirmed they were the Stableside, the very same barge that was thought to have been gone. They were allowed closer, and upon seeing them, it was discovered that they weren’t lying. Some of the old sailors matched descriptions for the same crew we sent twenty years ago, matched them exactly.\n\nAs our ships neared, we were able to identify the captain, who spoke to us over radio, a Griffon who claims to be the adopted son of the Commodore we sent out. His name is Jacques Perrylous, a Griffon blue in color, with an eye patch over one eye and a wooden peg replacing one of his legs. Most of the crew was in some bad state, he was no different, dirty and looking slimmer than average, it seems like they’ve gone through Tartarus to get back home. Our ships have begun to escort them back to the shore, with many curious of the tale these travellers have to tell, and excited for the experience they can bring."
rustwreck.32.a: "This is quite unusual"

rustwreck.33.t: "Time claims us all"
rustwreck.33.d: "It was all calm before High Tides finally went feral, ponies seemed like for once they could agree to something, mourning the oncoming loss of their leader. The moment was also calm, and sombre, with Doctor Kelp ordering a merciful death via drugs to the feral Admiral, and a day spent all across the nation to mourn, to celebrate the life and soon to come legacy of Admiral High Tides, may he rest in peace. The days after, however, tensions began to rise again in every town and city, arguments and little fights becoming all the more common, everyone knows the time is approaching where Rustwreck’s fate will be decided.\n\nWhispered in the alleyways and spoke in hushed tones in safe-houses and barracks, the vultures, Crimson Waters and Wavebreaker, preparing for when the time comes. The Cult of the Endtide and the New Admiralty gather their supporters and prepare them, taking up arms, drawing out plans, using every last favor they have across the nation. It’s all done in the shadows for now, hidden from sight, but soon the time will come, and the nation will be able to do nothing but watch as its fate is secured."
rustwreck.33.a: "May he rest in peace"

rustwreck.34.t: "Succession"
rustwreck.34.d: "Anxiety isn’t an emotion Crimson Waters feels very often, suppressing it oftentimes in favor of her exuberant confidence and charm. Today is different for her, today is the day where everything needs to go right for her, or else all shall go wrong. Despite herself, her hooves tap nervously against the ground as she paces back and forward in a private room, her mind playing fifty different ways everything could go wrong, and a hundred more for it to go well.\n\nThe door opens, she looks hopefully as a cultist gives her a nod, slowly breaking out into a wide smile as the cultist gives the news. Wavebreaker was caught completely off guard, his soldiers and troops surrounded before they even woke up, and the stallion himself placed under house arrest. The only conflict was during the taking of the old admiralty building, where five guards and two cultists lost their lives in the fighting. Nobody stands against her now, the Cult has won.\n\nAs the messenger leaves, the anxiety comes back, chased by a wave of relief. Crimson has won, but these upcoming days will be where victory is truly secured, where she will show the nation every plan she has. Of course, ponies will be expecting a speech, the blind sheep of Rustwreck seeking a charismatic voice through these times, not caring what is said, but how. Luckily for them, Crimson is a wonderfully charismatic speaker. Suppressing all her anxiety and wearing a practised grin, she struts out of her room, ready to lead her new nation."
rustwreck.34.a: "Tide have mercy on us!"

rustwreck.35.t: "Succession"
rustwreck.35.d: "Joy is something Wavebreaker doesn’t feel very much, outside of the pages of a good book. Today, however, joy is exactly what he feels, filling up his heart and his head as he looks over Rustwreck from on high. There was no fight, no grand struggle for what’s right, because Rustwreck isn’t a novel, it’s a nation, filled with ponies thirsting for stability and for what’s right, in other words, him. Nobody would know that the Old Admiralty is out of their positions, fewer would care, but all will know when he begins to improve the nation for all of them. No longer is the Admiralty split between old and new, from today onwards, Rustwreck’s Admiralty stand unified.\n\nThe passing of Admiral High Tides, rest his soul, was an unfortunate day for everyone, and will be forever remembered as a day of mourning. But eventually, after a few years, a bit of joy will come after that, as ponies celebrate the opportunity that his passing has given them. Leading is much like a battle at sea, it’s all about seizing on an opportunity and making the most of it. Wavebreaker plans to do just that."
rustwreck.35.a: "New and Old as one."

rustwreck.36.t: "Some may die..."
rustwreck.36.d: "It’s a cold morning in Rustwreck, as deep within High Tides’ old office sit Doctor Kelp, currently drowning herself in wartime whiskey, and Crimson Waves, flipping through a list of ponies provided by Kelp, ponies who need to die. Crimson looks over at Kelp, setting aside that list and flipping through another folder of officers, ‘You know, Kelp, Loyalty was always my favorite Element of Harmony. I enjoy those who are loyal, like you, you’re loyal to your principles above all else, just like I am as well. In fact, the whole ‘bound by blood, we are one’, that’s just loyalty in a phrase, one in purpose, in following, so on. So I’m sure you understand why these ponies have to go, they aren’t loyal, they’re, how to say, disharmonious, chaotic. And like with the Nightmare and Discord, what is disharmonious is dangerous, and is gotten rid of.’\n\nKelp snorts softly and drinks down another glass of whiskey, setting it down too hard as she looks over at Crimson, ‘Don’t try to justify this purge to me, Crimson. You have your names, your list, leave me out of the rest of it. I’m a Doctor. I do no harm. Just, just get on with it, and leave me alone.’\n\nCrimson grins softly, opting for no response, instead turning back to the new files she has. Officers and Admirals, of course they can’t be taken care of right now, they have enough guns to flatten the whole country. But eventually, some will need to be gotten rid of. So, listening to the sounds of drinking and depression coming from Kelp, Crimson would mark them all, live, die, or dismissed."
rustwreck.36.a: "...So others may live"

rustwreck.37.t: "Ship Amok!"
rustwreck.37.d: "Report on the HMS Valiant’s stupid shit they did, by Note Pad, Crimson’s most literate follower. NOTE: Somepony burned the templates used for the previous reports under the Admiral, so we’re doing it freestyle.\n\nIn the holy efforts to convert the Admitality away from their heretical ways to the pure and righteous manners of The Endtide, we have come across some stubborn admirals. Today, in the midst of trying to convince a Captain, of the HMS Valient, our agent fucked up big time and somehow made the Captain open fire on the capital. Luckily there was little damage from the bombardment due to the late hour, but this was still extremely bad. Crimson, in all her blessed wisdom, would summon a squad with a mage to take out the Captain, for the good of us all.\n\nUpon teleporting onto the ship, most would surrender, except the Captain and some of the higher ranks, who had to be eliminated. Good enough end, really, bastard already opened fire on his own capital, couldn’t be trusted. Due to this, the ship will no longer cause us any issues, and at least the other Captains know we aren’t messing around."
rustwreck.37.a: "What a childish tantrum"

rustwreck.38.t: "With friends like these"
rustwreck.38.d: "Kaboom, say goodbye to your Flash Magnus Mark Three Anti Infantry Mechanised Pony!’ Dice clatter across the floor, surrounded by hundreds of plastic soldier ponies scattered all over the room, while Crimson and Wavebreaker stand over it. The game had a name once, but it’s been lost to time, now it’s just the game that these two play. It had started out as a joke by Doctor Kelp that they play it after an argument, but then they listened, they won, they lost, and slowly hate turned into a more friendly rivalry. The Doctor herself is the only one who knows the rules, but as she drinks her third glass, she can barely speak, let alone explain rules. The only other one in the room being Downhaul, the stallion wanting to see what all the fuss is about.\n\nWavebreaker shakes his head as Crimson pushes over an oversized plastic mech, ‘You rolled three sixes but the Flash Magnus Mark Three Anti Infantry Mechanised Pony has twenty hit points, therefore it still survives with two left and does not die. Therefore you do not win in this exchange, and I still have my Flash Magnus Mark Three Anti Infantry Mechanised Pony.’ Crimson shakes her head back, as the two then look to Kelp for answers. None come, as the Doctor has fully passed out, leaving the two rivals to look at each other. As one, they nod, holding up their hooves as Wavebreaker speaks, ‘We settle this honourably. Hoof, stone, parchment.’ Crimson nods solemnly as the two begin their conflict of hooves."
rustwreck.38.a: "I gotta find a rulebook."

rustwreck.39.t: "An Artificial Metropolis"
rustwreck.39.d: "Saltpan, meeting notes on meeting of the Circle of the Endtide, vote on distribution of funds and resources from conquered territories.\n\nCrimson Waters, holy be her name, has suggested and been supported by her inner circle in this suggestion, that the newly conquered lands we may find should have their industry moved by force and assimilated into Rustwreck. This would help make Rustwreck proper into an unbreakable fortress of steel, an industrial centre second, or perhaps even greater than, Fillydephia itself. Proposals range from mass large-scale redistribution from the new lands to more small-scale.\n\nThe only opposition comes from Doctor Kelp and some of her economists. They argue against Crimson Waters, holy be her name, that this redistribution is near equal to a cultural genocide of the newly conquered areas. The only appealing argument from their side was to point out that this centralization of industry and population makes the nation more vulnerable to attack. Should an enemy somehow take the capital, it would remove the majority of industry and population. They argue that keeping ponies and industry spread out would ensure that we can continue to fight on even should the capital fall. At the end of it all, a vote was held to see which proposal wins out."
rustwreck.39.a: "Aim for 15.000 in Rustwreck and 10.000 in Saltpan"
rustwreck.39.b: "Aim for 25.000 in Rustwreck and 18.000 in Saltpan"
rustwreck.39.c: "Aim for 40.000 in Rustwreck and 25.000 in Saltpan"
rustwreck.39.e: "Scrap the plan, invest the allocated funds into industry"

rustwreck.40.t: "The Next Generation"
rustwreck.40.d: "Report on meeting on changing the name of the Warcamp, I guess, due to it being made into a Fort. Yeah. Okay report starting now.\n\nSo the old Warcamp where the Cult of the Endtide operated is being made a big base, and everyone is disagreeing with what it should be named to, hence why this meeting is happening. Oh, I’m Red Ink, by the way, I’m supposed to be keeping records of this meeting, but right now we’re just sitting around doing nothing. Oh, here comes Scarlet, a high priest of the Cult, love her, she’s wearing a very nice outfit today, really matches her smile, oh shit she’s talking, umm, okay, got the basics. So basically Scarlet wants to name the Warcamp to Fort Crimson, since Crimson is so good.\n\nUgh, Doctor Kelp, she comes up next and gives some long speech about nothing, using those fancy words she likes. Basically she wants to name it Fort Aestus, which is old ponish for ‘tide’. Sounds like a nerd suggestion to me, I really hope we don’t actually go with that. Wavebreaker is up next, wants to name it Fort Hightide, makes sense since that stallion probably sees High Tides like a father after so long spent with him. And now everyone is debating, cool. Hey, just want to say, whoever wrote the reports for High Tides, I respect you, this shit is so annoying, I don’t know how you did it. Oh, shit, okay, the decision is being made. Looks like they’ve decided upon. . ."
rustwreck.40.a: "Fort Crimson"
rustwreck.40.b: "Fort Aestus"
rustwreck.40.c: "Fort Hightide"

rustwreck.41.t: "Bloody Business"
rustwreck.41.d: "It’s a nice day over the Sunrise Shipping HQ, where ponies shop all around with no issues, except for one pony in particular. He’s a merchant from Tenpony Tower, and he’s spent the last ten minutes arguing with a merchant over some blood bags, wanting to purchase with caps instead of scrip. Said merchant slams their hoof into the counter as they speak, ‘I have perfectly good caps that would be accepted anywhere else in the Wasteland, that scrip won’t be, so just take the caps already!’ The official selling the bags would motion to a currency exchange counter nearby, ‘I don’t make the rules, buddy, you want these blood bags, you need to get some scrip from right there. Don’t like it, go somewhere else.’\n\nThe merchant frowns in frustration before stomping their way over to the counter, only to discover that the counter works with certain amounts. One can’t give one hundred and twenty two caps to exchange, no, one can only give over two hundred plus thirty, as the system works in intervals of ten. It takes another few minutes of arguing before the merchant grumbles and pays the caps, being given the scrip.\n\nTrudging back to the official, the merchant would place down the scrip they have, getting all the blood bags possible. However, once all is said and done, they’d be left with eight extra scrip, the merchant looking at it, ‘What am I supposed to do with this? It’s worthless anywhere else!’ The official shrugs and grins, ‘Sorry, buddy, unless you want to buy something else, nothing else I can do to help.’\n\nThe Sunrise Shipping HQ’s pleasant day would be interrupted by a frustrated, angry shout."
rustwreck.41.a: "What am I supposed to do with this?"

rustwreck.42.t: "Baltimare Blues"
rustwreck.42.d: "Report on lateness of boat that was late to returning to port.\n\nHey there boss, here’s that report you requested on that late boat, should hopefully be better than those boring reports that High Tides got. So, basically, yeah, like, so, our boat made a raid in the southeast and stopped in Baltimare on the way back home, restocking on supplies to feed the slaves they captured. So basically the Captain of one of the ships stopped there, since there were actually multiple ships, got real friendly-like with one of the higher ups of the crime families in Baltimare. The boats all stayed longer enjoying a little celebration by that higher up, along with the giant amounts of chems sold for cheap and everything else there.\n\nAnyway, their visit ended with an exchange of stuff and a friendly goodbye, meaning that Baltimare actually kinda likes us now. So, like, yeah, that’s probably good, might be something for you to take advantage of, boss. Anyway, that’s all for the report, this is Port Master signing off, peace out."
rustwreck.42.a: "It's great to make new friends!"

rustwreck.43.t: "Agony of Choice"
rustwreck.43.d: "After our recent economic restructuring, there’s been a lot of resources, money, and such left over waiting to be spent. Money serves no good collecting dust, and so ideas have been created to decide what to do with it. Some advisors advocate for spending the caps abroad because that will give other places the illusion of Rustwreck having a functioning economy. Apparently ponies really like to put caps into functioning places instead of non-functioning, so spending these caps could result in foreign ponies investing back into us and our industry.\n\nAnother advisor stumbled across some random blue unicorn stallion who’s selling some schematics and blueprints he apparently stole from somewhere in Manehatten. The prices are super high for just some simple blueprints, but at the same time, innovation is what brings strength, at least that’s what the unicorn said in his sales pitch. He seems like a bit of a little shit and even bragged about some weapons deal down south when he was talking to us. But he’s not wrong, these blueprints could be what makes us a force in the world.\n\nFinally, most simply, is to buy food and construct some houses for our ponies. As famous political theorist from before the war, Meow, said, a nation marches on its stomach. Or something like that. That might have actually been a Prench philosopher. Then again they’re Prench so they don’t matter. Despite the questionable origins of this quote, it’s not wrong, feeding the ponies and giving them houses will make them happier. Happier ponies means a happier realm. In the end, we have to decide on one idea."
rustwreck.43.a: "Our Industry must grow!"
rustwreck.43.b: "A technological edge would be useful"
rustwreck.43.c: "Our ponies deserve a break, let's help them out"

rustwreck.44.t: "[RWK.GetName] Demands Our Surrender"
rustwreck.44.d: "Greetings, my esteemed leader of the Stable, hidden deep underground, and a good day and wish of good fortune to it.\n\nI am the ever so wonderful Crimson Waters, one of your, I’m sure, many esteemed neighbours, perhaps the most esteemed of them all. I must say, I admire your Stable and your ponies, their manners, their ways, and how they border my country. It’s all so very nice, one of the pinnacles of Wasteland civilization, one might say. It would be such a shame to see it be ruined, as I’m sure you agree. I was hemming and hawing over this whole predicament of the stability and safety of your Stable all night last night, you see, and I came to a brilliant solution. I will offer my protection to your ponies!\n\nI’m sure you must be smiling quite widely at that most wondrous of news, after all, my soldiers are much more numerous, better armed, and better trained than your own quaint army. Your Stable will now have a proper force to protect it, to protect you, and all the ponies inside. My army will be making their way to the Stable as we speak, and oh, I do so hope that you welcome them with forelegs spread wide, it would, oh, it would just make my day. I look forward to a fruitful partnership with you, do try not to ruin it by any sort of needless protesting against our presence.\n\nSigned Crimson Waters, your new friend."
rustwreck.44.a: "We'll never surrender!"
rustwreck.44.b: "Let's avoid the bloodshed"

rustwreck.45.t: "Stajniopolis Refuses Our Ultimatum"
rustwreck.45.d: "Report on the Stable ponies and their dumb shit. I hope this reaches you well, Crimson, especially since you fired the last report writer, I hope I do a better job for you. Umm, this is my first time writing a report, though, so please be nice. Okay? Cool. You’re cool for that. You’re the nicest leader. Sorry, right, I should actually say what happened. Okay, so, you sent a letter to the Stable, right, and it was, you know, really well written, I’m sure. But the Stable ponies basically said no, right, and they’re going to try and resist us taking them over.\n\nSo yeah anyway, it’s, it’s not the best situation, right, but, you know, they’re weak, and we’re going to be able to take them over without any issue. I hope we don’t have to kill too many of them, I’d like to see what a pony looks like not covered in dirt or blood. I’m sure you would too. I mean, you know, the stallions of the cult, they’re always so dirty, unlike the Stable ponies, their fur is always so clean. Probably smells nice, and not like blood and fish. Sorry, that’s not related to this report. Anyway, we’re invading the Stable, right, and, well, we should be done soon. Have a nice day Crimson!"
rustwreck.45.a: "Let's get this over with"

rustwreck.46.t: "Stajniopolis Joins Us"
rustwreck.46.d: "It’s a slightly cold day in the Wasteland, clouds covering the sky, as the forces of Rustwreck arrive at the entrance of what was once the capital of Stajniopolis. Stable ponies stand around outside it, watching as the soldiers approach, covered in sea-spray, a bit of blood, and dirt, quite a few of the ponies covering their muzzles from the smell. One of them, though, is brave enough to trot forward, giving the leader of the soldiers a small smile, ‘Hello, you’re our new neighbors, right? I’m Doewheat, I’m a baker in the Stable, and when we were told you’d be visiting, well.’ She gives the leader a basket, filled with bread, ‘I made you a welcoming gift!’\n\nThe commander takes the basket, looking at the bread inside, then looking up at the mare. A moment passes, ponies watching on from both sides, interested to see his reaction. He smiles at her, ‘Thank you! Crimson Waters is going to be so happy to hear you’re all so welcoming!’ His reaction diffuses tension, as more Stable ponies slowly trot out and begin to talk to the soldiers.\n\nDoewheat smiles widely, ‘I’m glad to hear that! Crimson Waters, she’s your leader, right? The leader of your cu-or, sorry, your religion? I’d be interested in hearing more. Maybe I can even give you a tour of the Stable!’ The commander smiles widely and nods, ‘Happily! Please, lead the way!’ The mare smiles wider and leads him inside, as Stable pony and Cultist begin to talk more amongst themselves, cordial, if not yet friendly."
rustwreck.46.a: "What a deal"

rustwreck.47.t: "Borderwar Victory"
rustwreck.47.d: "WIP"
rustwreck.47.a: "Awesome"

rustwreck.48.t: "Borderwar Defeat"
rustwreck.48.d: "WIP"
rustwreck.48.a: "Damn"

rustwreck.49.t: "Borderwar Tie"
rustwreck.49.d: "WIP"
rustwreck.49.a: "oh well"

rustwreck.50.t: "The miracles of Silverwing"
rustwreck.50.d: "Silverwing Depot, a storied place, once an army base, then abandoned, then taken back by the Mob, used as the headquarters of their small empire. It’s no wonder that the inside of the Depot would be filled with wonders and marvels like nowhere else. Through these walls, Crimson would trot, followed by one of her literate followers, one of the more intelligent of her flock. Crimson picks up something, a metal device, looking it over, ‘You said this device was made purely for the purpose of heating up bread? I remember High Tides mentioned these once or twice. Toasters. I trotted in on him once when he was going feral and he was ranting quietly to himself about these things.’ The follower remains silent behind her, going to another piece of random technology and picking it up, looking it over.\n\nCrimson looks over, seeing the follower is holding up some sort of plastic stick in the general shape of a sword. They press a button on the handle, making the plastic light up a bright green color. The follower looks over, confused, as hoof steps come down the hallway. Wavebreaker trotting down the halls, exploring it himself. He looks at the plastic glowing thing, his eyes widening as he speaks, ‘Is that a Glow-Cutlass from Moon Fights?’ He quickly trots over, picking up another one, which begins to glow blue. He smiles widely, picking up another which glows red, throwing it over to Crimson, ‘We’re fighting with these.’\n\nCrimson catches the red cutlass, looking at it, then shrugging and smiling slightly, ‘This should be fun.’ She charges at Wavebreaker, as the two begin a play fight, except it’s actually way more serious than it should be. She swings with force and speed while he backs up, feinting and dodging, even doing a sick combat roll behind her at one point. He lifts up his saber and brings it down on her leg, smirking as he does, ‘And thus fallest the evil Empress, Crimson Waters, and the galaxy is safe.’ Crimson rolls her eyes and grins, ‘You’re a nerd. To think that ponies used to have the time to waste building this type of stuff."
rustwreck.50.a: "What a wonder"

rustwreck.51.t: "Breaking the Gates of the Damned"
rustwreck.51.d: "Thestrals have never been liked in Equestria, especially not in the slave pits of Fillydelphia. When ponies get desperate, they turn against each other, and pick on the weakest among them, the hated, those to blame. New Moon knew this since birth, she knew this when she was dragged to Fillydelphia, she knew this when she slipped away going between jobs. She’s survived for months now skirting through alleyways stealing what she can, sticking to the shadows, staying out of sight of the slavers. Something happened though, a war, so the whispers say, and a few days ago ponies entered the city. Covered in blood, fighting street to street to take the city, probably just a bunch of psychopathic raiders who would kill her should they find her. But food has gotten scarce now, things are harder now.\n\nNew Moon got clumsy today. She went out during the day to one of those preachers who accompanied the soldiers, and tried to steal something as they passed by, but they noticed. Now, she runs through alleyways, ducking around corners and keeping to the shadows as the preacher chases her down, surely set on killing her, or worse. Eventually she’d come to a halt as she came to a dead end, brick wall in front of her, too tired to even think of flying away. Panting, she slowly turns, as the preacher rounds the corner of the alleyway, looking at her. He breathes heavily, ‘You’re a quick runner.’ He takes a second to catch his breath, before reaching into his robes, slowly taking out a piece of bread. He sets it down, smiling softly, ‘Here, you look hungry. The Endtide is here to help ponies like you. But I know you’re afraid.’ He steps back, giving her a softer smile, ‘If you want more, I’ll be by the exit of this alleyway tomorrow. Perhaps we could talk.’ He turns and leaves, leaving New Moon panting. She slowly steps forward and picks up the bread, looking it over for a moment, before looking after the preacher. If he’s giving out bread, he can’t be too bad, right?"
rustwreck.51.a: "A great city, in rubble again."

rustwreck.52.t: "Checkmate"
rustwreck.52.d: "May the best pony win, I think that was a common saying before the bombs.’ Crimson Waters stands on the roof of the Alpha-Omega Hotel in Fillydelphia, looking around the city, where preachers move from street to street, offering food, water, aid, and faith to the slaves of the city. Prisoners of war would be marched through the streets to prison camps, slavers and raiders from Red Eye, a deactivated Steel Ranger trapped within their own armor after it was hit by a spark grenade, being pulled along in a wagon. A few Mobsters, still causing issues now, even one or two Stable ponies who picked up arms against her. Slaves stand on the side of the road, watching as the enemies are pulled by, not shouting in anger, but merely watching the procession.\n\nA special cart would exit from the inside of the hotel, carrying precious cargo within it. Crimson watches from up high as the cart nears the gates into Fillydelphia, the ‘Gates of the Damned’, which are now wide open for anyone to come and go. Slaves watch just as she does as the cart is slowly opened, and a body is taken from within. Though partly burned, Red Eye’s body is still easily identifiable, especially with his Stable-cloak, which he’s been permitted to keep even after death. No cheer comes as they hang his body from the gates, the slaves are too tired for that. But they do smile. Crimson smiles as well."
rustwreck.52.a: "We have much to do"

rustwreck.53.t: "Those who can be saved"
rustwreck.53.d: "Not everyone we fought against is bad, nor are they deserving of death.’ In the middle of a meeting room sits three individuals, Crimson Waters, Doctor Kelp, and, in front of them both, the slightly battered Protege, protege of Red Eye. Crimson continues, with a small smile, ‘If every pony I fought was bad, Kelp, then you wouldn’t be standing here. Nor would Wavebreaker, wherever he is. Red Eye was bad, yes, but from what the slaves have said, this one is quite nice. For a slaver, some even say he was once a slave himself.’ She looks to Protege, ‘What of you? Are you willing to help?’\n\nProtege looks on as Kelp pours herself a drink and takes a sip of it. She looks at him, sliding him the glass, but he slides it back after a second, without drinking from it, ‘Red Eye was the greatest hope this Wasteland has ever seen, and you killed him. You killed him and put him on display for all to see. You, your cultists, they talk a big game about the betterment of the Wasteland, but I don’t see it. Red Eye did bad, yes, but he built factories, he restored houses, he’s done more than you ever will. Because he was a good pony, a pony of pure-heart who did what was necessary. But you? You’re raiders who smile when you kill somepony.’\n\nCrimson looks on at him, before giving him a wide smile, ‘That’s the correct answer. You see, I admire Red Eye in many ways, you’re right, he’s done much more than anyone else in the Wasteland. But he was tied down by his methods, by the brutality of those who followed him. He’s built a foundation, me, I’m going to add scaffolding, I’m going to add the walls, the floors, heat, electric, but I need help to do that. Call me a raider if you want, but this raider wants you to keep her reigned in.’ She then slides him a piece of paper, ‘You have two options. Say no, go back to the camp you came from, where you will waste away and do nothing. Or make me a list, a list of those who are too far gone, those who deserve to be killed for all to watch. Do that, and I’ll gladly have you by my side. Your choice."
rustwreck.53.a: "Protegé hesitantly picks up a pen"

rustwreck.54.t: "The Fillydelphian Constitution"
rustwreck.54.d: "Crimson stands in a room of her closest advisors, some she might even call friends, in Stabletec HQ. Their best scribe sat with a large sheet of paper, writing down what will be the basis of the country going forward, a constitution. Most of it was just defining what was already known to be true across the realm, but one part of it was most important. Crimson would speak to the gathered advisors, and to all those listening by radio, ‘I shouldn’t have to spend too long going over the horrors of slavery, my friends, we’ve seen it first-hoof in Fillydelphia. The idea that one pony can own another is silly, ridiculous, and even worse, it’s inefficient. It is a core tenant of our religion that slavery should not exist, and with this, we will declare it to be over. Every citizen of our faith, in accordance with it, will be freed from the bonds of slavery forevermore.’\n\nWavebreaker looks over from his seat, frowning softly, ‘Of your faith? This is not something which should be restricted to only those who convert, Crimson.’ Crimson looks over at him, smiling widely, ‘Conversion is not necessary, Wavebreaker, nor is belief and faith. By living within my borders, you are a member of the Endtide, because you are under my protection. You may worship Celestia, Luna, some Zebra god, even Nightmare Moon, or nobody at all, and still you will be under my protection. The Endtide is all of us, it is you, it is me, it is everyone listening on the radio.’ She takes a second to take a breath, before grinning softly, ‘And with this decree, I do declare, the Endtide has ended slavery.’"
rustwreck.54.a: "This day will be one for the history books!"

rustwreck.55.t: "Jasmine comes marching home"
rustwreck.55.d: "So this is Rustwreck, is it?’ Two ponies trot down the streets in the now city of Rustwreck, by vendors selling food, water, and even one selling flowers, what little exist. One of the two ponies is a mare, Jasmine, carrying a small flower in the collar of a non-combat military uniform. She smiles over to her companion, a short, small stallion who was once a slave in Fillydelphia, smiling more as she speaks, ‘It is. It used to be a lot smaller under the late Admiral. This is what I fought to protect, Pick, all of these ponies.’ He smiles softly, ‘Aww, and here I thought you were conscripted just so you could come free me. I’m hurt, scarred, mortified by your words, woe is me.’ The two laugh a bit as they trot together, until they reach a small house on the outskirts of the city.\n\nJasmine slowly trots up and knocks on the door. A minute passes before it opens, a mare on the other side, around her age, looking at Jasmine like she’s seeing a ghost. Jasmine smiles softly, ‘Tea, I’m back.’ The two mares quickly hug, while Jasmine continues to speak, ‘We’re, umm, going to a volunteer army. So I’m back. For good.’ Tea pulls away from the hug, sniffing a bit, ‘Jasmine, I, I thought you were dead! Two years you’ve been away, no letter, no nothing back!’ She pouts and pushes Jasmine playfully with her hoof, ‘Off to go play soldier-filly.’ Jasmine laughs a bit in response, before leaning in and nuzzling Tea, ‘I’m back, Tea, and I think I’m ready to move on to playing wife for a little bit.’ She smiles, ‘Oh, by the way, this is Pick.’ She motions to her friend, who gives a small wave, ‘I saved him from Fillydelphia and he’s been following me like a lost puppy since then. Can we keep him?’ Jasmine would snicker a bit, followed by Pick, then Tea, as the three begin to fully laugh, the two lovers embracing once more as Pick watches with a soft smile."
rustwreck.55.a: "Life can finally go on"

rustwreck.56.t: "The Light at the end of the tunnel"
rustwreck.56.d: "Radios flick on all across the country, former slaves, soldiers, Stable ponies, cultists, and once raiders would gather around together, sharing food, drinks, and entire blocks gather around the radio. The radio crackles to life, as the voice of Crimson comes from it, speaking softly, ‘Greetings, ponies of the Endtide, ponies of surrounding countries, griffons, diamond dogs, whoever else might be listening. You have all been very faithful in me these past few trying years, and I am grateful for that like you could never imagine. Many of us have died, many of us have been freed, but through it all, our faith has kept us alive, it’s kept us going. But faith isn’t all a country needs, no, a country needs leadership, and I’m afraid to say I’m not immortal. I am no alicorn, not a ghoul, nor any sort of dark magician, I’m a pony, and sometime, I’m going to die.’\n\nAll chatter dies down as everyone listens in, ears perked, ‘I’m going to try something that hasn’t been tried in Equestria before. Then again, that’s nothing new, is it? Nobody in Equestria before has led a cult, a faith, to such wonderful heights, nobody has ever had such a positive effect on those under them. I will be creating a republic, elected by you, the ponies of the nation. I know this will come as a shock to many of you, and many need time to get used to it. In order to ensure stability, I will remain the head of the government for another decade, while we set up an independent parliament and court system. If all goes well, I’ll be able to retire, finally. I happily await your parliamentary runs for election.’ The radio then flicks off.\n\nAll across the nation, ponies would celebrate, or they’d be anxious over the sudden change. Already plans would be drafted and money would be gathered for those hoping to make history as the first elected leaders of their district. Meanwhile, back in her personal office, Crimson swirls a glass of Kelp’s whiskey, taking a sip of it and smirking to herself, ‘I told you all this bloodcult was just a facade. Behold my doubters and despair, not only have I made a better Equestria, but now I can retire.’"
rustwreck.56.a: "They never saw it coming."

rustwreck.57.t: "War never changes. . . but ponies do!"
rustwreck.57.d: "Republic Day, the celebration held on the day that the republic was founded, not the most creative name, and some international observers get it mixed up with The Republic’s Day from The Republic’s founding, but it works. Down in the streets, ponies would drink and eat at banquets and barbecues and the like held out of the churches, all of which is provided by the state, of course. Politicians give speeches vying for election, including Wavebreaker, seeking to become the first prime minister of them all. Up above Crimson stands on a balcony, swirling around a glass of whiskey, sipping from it. Kelp is behind her, working on fixing up some papers in her office, moving more enthusiastically than ever before. She said she’d stop drinking recently, a sober Kelp, well, that’s quite the sight.\n\nCrimson turns her eyes downwards as slaves dance next to ex-Rangers, her loyal cultists as always having fun. She spots a jasmine colored mare trotting alongside a tea colored mare, nuzzling each other as they trot, followed by an ex-slave. A thestral mare, an ex-slave as well, would work alongside a preacher at a local church, cooking and giving away food, some mango-habanero flavored thing. A Stable pony from Stajniopolis would trot alongside a general of the armies, the two talking and having fun. Her eyes fall upon a ghoul, some refugee from Tenpony, talking to a blue unicorn with a silver mane.\n\nCrimson smiles softly, as Kelp looks over, speaking to the doctor, ‘Kelp, you knew him better than I did. Would High Tides have been happy with this? What would he have thought?’ Kelp pauses in her sorting of papers, taking a minute before speaking, ‘I think he’d be proud. But he would never admit it to you, he’d likely nitpick about how you don’t have a strong enough navy, or about how he could have done better. But I think he would be proud. I think he is proud, looking on from whatever afterlife he might have gone to.’ Crimson looks out over the celebrations, the ponies whose stories she doesn’t know, the friends she’s made, and turns her eyes finally to the coast, where ships sit in port. She looks at her drink, and grins slightly, ‘Admiral High Tides, if you didn’t die, I wouldn't be where I am today. You were a cranky ghoul. This one is for you.’ She then pours out the rest of her whiskey, down onto the street below. She sets down the glass, and turns around, giving Kelp a small grin, ‘Only eight more years, Kelp. Let’s get back to work.’"
rustwreck.57.a: "Hope is always worth fighting for"



rustwreck.58.t: "The Love of Paperwork"
rustwreck.58.d: "Numbers, papers, pens and pencils, kind words and keen eyes, all are common when a new leader takes stage, especially one as learned as Wavebreaker is. Letters from the admirals and every member of the navy confirming their loyalty, stacked one by one in their own file. The loyal local authorities, the army, some of the rich civilians, owners of caravans, some of them have sent letters affirming his position, others have sent in questions. So Wavebreaker sits in his office, typing out new letters minute by minute, all while a loyal marine, Careful Corsair, looks over each and every letter he sends out.\n\nCorsair looks up upon reading a letter, intended on swaying a caravan company to be steadfast, 'Admiral, this letter should be reworded, you insult the local mayor in it, by saying that, and I quote, ‘Mister Lucky Chime generates ten times more money for the country than any town he visits’.' Wavebreaker looks up from behind a typewriter, and sighs softly, 'Why is that rude? That is an accurate statement. If the mayors are offended by that letter, then they should step up their game and help the country more.' Corsair shakes his head, 'Sir, with respect, these are not military personnel, these are civilians, not to mention powerful civilians. They do not expect to be insulted as much as us military personnel do, Sir, and you need to remember that you aren't just the leader of us personnel, Sir, but you are also their leader. They do not know who you are yet. They will read hostility into words where hostility never existed.'\n\nWith a sigh, Wavebreaker reaches up and rubs his eyes, keeping them closed for a minute, before nodding, 'I don't know how High Tides put up with this, these ponies are ridiculous. They engage entirely in emotions, not in statistics or facts. If you say somepony is below average, they see that as an attack, I don't get it. These ponies say they want freedoms too, but how am I supposed to give those and keep them safe at the same time? They should just obey me when I give the order, I am their commander, after all.' Corsair shakes his head, 'Negative, Sir, you aren't the commander of the population at all. You're their leader, that means you need to work with them where they are, instead of treating them like you treat the military. Just keep typing, Sir, once you gain their respect, they'll follow you to Tartarus and back.'"
rustwreck.58.a: "Type, type, type"


rustwreck.59.t: "The Wonders of Economics"
rustwreck.59.d: "Trotting down the hallway of the newly named Sunrise Development Council Building is Wavebreaker, a stallion who has no taste for giving things good names, and instead names them very bluntly. By his side, though slower, trots Doctor Kelp, listening as he speaks, “I know you are a mare who enjoys building things up, Doctor Kelp, and I agree with your desires to build a proper industry and infrastructure for this country. We need industry to build up a stronger economy to pull up the entire country and make us into a power worth existing. Of course, as you know, I am quite good with numbers, but economic policy makes little sense to me, whereas you are addicted to it. For that reason, I’m offering you your own office, from which you may manage the economic development of the country.”\n\n Kelp and him come to a stop outside of a small office, with Kelp looking at it, and over at him, then sipping a sip of whiskey from a flask, “Really? You push me away from potentially improving this country, just to give me an office and a fancy name tag, thinking I'm just going to go along with this chicanery? You just want to keep me under your watch, maybe keep me on retainer for when you eventually get old and fade. Well, I am not going to be some marionette for you, I need more than that to be convinced and coerced.”\n\n Wavebreaker looks at her, reaching up and adjusting his glasses, “Kelp, listen. I know we don't agree on much, but Rustwreck is my home, and it is your home as well. Disagree with me on other issues, and I will not care. Push me away at any other time for any other reason and I will be fine with it. But I know you care for the ponies, and I am offering you a chance to help them. I know you will agree to the office, and I know you are just opposing me because you are half drunk. Welcome to your new office, even if you don't like being here.” With no time for her to respond, he turns around, and trots away from her. But at the same time, he mutters to himself, “Let’s dilute her whiskey for the next little bit, lest she ruin the country in a drunken haze.”"
rustwreck.59.a: "Welcome, Kelp."

rustwreck.60.t: "Last Hurrah"
rustwreck.60.d: "Iron Bomber wasn't always an older stallion, no, once, a long time ago, he was a bright eyed recruit following in his father's hoofprints by joining Rustwreck's navy, where he would serve for the next thirty years with pride and distinction. Even when a stray bullet would take out one of his eyes, even when his left hoof got stuck in a firing mechanism, even when good old High Tides passed away. Wavebreaker has taken over since then, and Iron Bomber has never liked him very much. A colt who spends his deployments with his muzzle in a manual, rather than among the sailors, tasting the salty air of the sea. A lad who doesn't know how to run a ship doesn't know how to run a country, that much is for sure.\n\n Iron sits around in an old shack, surrounded by his drinking buddies, one of them, Loch Load, speaking to them all, 'Aye, y'heard me right, lads, Wavebreaker forced me to retire. Called it honorable the right lad did, gave me a healthy bonus, refused to let me back in.' Another one, Loose Cannon, nods along, 'Aye, aye, forced me to do the same, only I still got a good eye on me head, unlike you lads. Gave me a new job in the Sunrise Development Council, I'm gonna be working under that lass, Kelp, for a while.' Yet another one leans forward, Bootlegger, 'Kelp? Ain't she the lass what killed High Tides? Aye, I was forced to work in a recruitment center, said me horrible good looks should scare off any who ain't got the guts for sailing!'\n\n Iron Bomber picks up his own drink, looking at it, 'Aye, he got something right, least, kicked your sorry arse off the boats, lads say yer snoring's bad enough to wake the Nightmare, they do. Aye, aye, I ain't like ye lads, guess I'm just too valuable to be kicked out, best sailor of us lot, ever since Booties got burnt. But this lad, Wavebreaker, he ain't worthy of me service, I'll say that much. I've given more than enough years and body parts for this navy, I say, and I ain't gonna give no more of me body from today on. Aye, c'mon, lads, final toast for the big lad about to retire, aye?' The stallions all lift their drinks at once, shouting, 'Aye! T'Iron Bomber, worst sailor on the seas!' With shouts and chuckles, they down their drinks, the final drink of the old guard, opening the way to the new."
rustwreck.60.a: "Cheers, mates!"

rustwreck.61.t: "Meeting Notes"
rustwreck.61.d: "Not everypony in the Endtide was an insane cultist or fighter, after all, even cults need ponies to take care of the finances, and that's exactly what Blood Money did, back before the cult was stamped down on. When the Endtide, well, ended, Money picked up her things and left, using her mathematical and literary knowledge to her advantage to bounce from job to job. Then Wavebreaker started to make tests for ponies to take, for positions in the government, and Money decided to give it a try, better a government position than bouncing from work to work. She didn't expect the test to be so easy, nor did she expect to be instantly assigned a position as assistant to Wavebreaker, after he made sure she didn't cheat on the test.\n\n So now Blood Money sits, her horn hard at work, scribbling down notes on papers as she listens to the Sunrise Development Council. Apparently there's rumors of coal being found in the country, and all the Councillors discuss in dry tones all the implications that introduction of coal could have on the speed of the country's development. Wavebreaker, of course, eats it all up, and happily argues his points, Doctor Kelp shoots back with her own point. It's times like these that Blood Money misses all the pomp and circumstance of the Endtide, they might have been a cult, but at least they put on a show.\n\n Bored out of her mind, Blood Money begins to sketch on her own piece of paper, while her horn takes notes, having at least an hour of boredom to finish up her masterpiece of a sketch. She is shocked, however, as Wavebreaker trots up beside her, 'Miss Money, if you wouldn't mind showing the fellow Councillors the graph I told you to draw.' Blood Money pauses in her tracks, and looks up at Wavebreaker. He looks down at her, and then at her sketch, adjusting his glasses as he does, 'Is that a drawing of me and Doctor Kelp kissing?'"
rustwreck.61.a: "'Sorry, Sir.'"

rustwreck.62.t: "Moving Fast"
rustwreck.62.d: "Crop Rotation, a tall stallion, stands outside of Wavebreaker's office nervously, glancing every so often to a mare who types away on a typewriter. He clears his throat and opens his mouth to speak, when the door to Wavebreaker's office opens, another stallion trotting out of there. The mare at the typewriter looks up, 'You may go in now.'\n\n Crop takes a deep breath, and then enters into the office, seeing Wavebreaker typing away at a typewriter, and another mare, Crimson, hanging off to the side of the room. He clears his throat, 'Wavebreaker, or, Sir, or, Admiral Wavebreaker, umm, my apologies, is it possible that we could have this meeting without company?' Wavebreaker shakes his head, 'Apologies, Mister Rotation, I'm afraid she's much like a cat, she's wherever she wants to be and you can't stop her.' Crimson smirks, off to the side of the room, 'I'd take offense, but cats are cute, fluffy, and smart, so that's pretty accurate to me.' Crop clears his throat softly, 'Right, then, I suppose I'll say my idea I've had. As you know, I have helped improve agriculture across the country, with my skills, I am quite skilled in the sciences of fertility. And of course, as you are now leader, you have a lot of resources.'\n\n Wavebreaker nods, 'Yes, you don't need to start with an intro, I read your dossier, provided by Crimson, please continue.' Crop nods, 'Yes, well, I have a proposal, to improve the fertility of the nation. You see, much like crops, we need more ponies if we are going to stand a chance of surviving. So my proposal is that, since mares are the gatekeepers of relationships, that we should create a government program that will distribute mares equally amongst the stallion population, to ensure maximum fertility-' He stops, as Crimson barks out a laugh, off to the side, 'Distribute mares? We're not seeds like your crops, you dolt, I'm afraid we're quite capable of making decisions ourselves.' Crop clears his throat, 'Sir, or, Admiral Wavebreaker, can you remove her or reprimand her from interrupting me?' Crimson rolls her eyes, and trots closer, 'Oh no, what's that, the big bad scary mare is speaking over you? Number one, Wavebreaker is probably ace, it's not like he gives a shit about all of this, and number two, you better start running before I geld you for even suggesting this idea in front of me.'\n\n Crop looks at her, and within a second, turns and runs out of the office. Crimson snorts, 'Distribute mares to stallions, can you believe that?' Wavebreaker gives a small smile, 'I would suggest next time you don't chase my guests out with a threat of a gelding, Crimson. Even if you were completely correct here. I'll have someone watch him, in case he tries anything.'"
rustwreck.62.a: "Yet hardly moving"

rustwreck.63.t: "Doppelganger"
rustwreck.63.d: "'Have you ever wanted another robot version of yourself? Ever get tired of hanging around with boring ponies who have horrible character traits such as disagreements with your beliefs? Ever get tired of needing to hire flesh and blood body doubles for the weekly assassinations? Ever wanted a companion who already knows everything about you? Introducing! The Square Mirror!' Wavebreaker watches from behind his glasses as a pony puts on a sales pitch for him. A mare wearing a brown overcoat and a much too tall hat, giving him a grin brighter than the sunlight, 'Go on, Mister Wavebreaker, give him a try!' She motions beside her, where a robot stands, which looks a bit like Wavebreaker, except shorter, fatter, without any glasses, the wrong color, and with missing paint.\n\n Crimson watches from the side of the room, and clops her hooves as Wavebreaker rubs his eyes, with her standing up, 'Wow, it looks so accurate! Am I Doctor Kelp, because I think I'm seeing double!' She trots up to the robot and grins, 'Say, Wavebreaker, how much currency do you cost?' The robot takes a second, before speaking in a mare's voice, 'Currency is a social construct made by the rich and the leaders of countries to try and keep down the common worker. I would not accept any currency, except to destroy it and rid the world of the curse of capital.' Crimson chuckles, 'Ha-ha! That's just like what Wavebreaker would say! Hey machine, what's your opinion on Nightmare Moon?' The robot takes a second again, before speaking once more, 'Nightmare Moon is a vanguard who will lead the workers of Equestria to liberation under her plan of eternal nightfall, it only through mixing together the tenants of Nightmareism and Marksism that we can survive!'\n\n Wavebreaker shakes his head, 'I've seen enough, thank you, Miss Tinker, for your offering, but I'll be honest, this seems more like a gag gift than anything actually useful.' The mare pouts sadly, while Crimson grins, 'No, no, I'll take it, I love this thing.' The mare smiles, while Wavebreaker frowns, 'I'm not letting you keep it.' The mare frowns in disappointment, while Crimson presses up against the side of the machine, 'Aww, come on, it'll be funny, and might be useful!' The mare nods along in agreement, while Wavebreaker shakes his head, 'I'm not spending money on this.' The mare looks down, disappointed, while Crimson tries one last time, 'Aww, come on, can't I keep it?'"
rustwreck.63.a: "'No.'"

rustwreck.64.t: "The Waning Light"
rustwreck.64.d: "REPORT: WE ARE LEAVING\n\n The leader of RUSTWRECK, WAVEBREAKER, has decided here on out to LEAVE our alliance of circumstance with you, THE MOB. Our leader, WAVEBREAKER, has announced over the radio earlier today his intentions to LEAVE, and he strongly advises you DO NOT INTERFERE with the process of leaving.\n\n If you do try to INTERFERE with the process, then, if you wouldn't mind looking to the shores, you will see FIVE HUNDRED CANNONS are pointed towards your shores, towards the city of GLOWPORT, and the coast of LIGHT, try and oppose us, and we will OPEN FIRE.\n\n Your move, mobster. Signed: WAVEBREAKER."
rustwreck.64.a: "Agree to their demands"
rustwreck.64.b: "We will not be intimidated"

rustwreck.65.t: "Same Old Business"
rustwreck.65.d: "'Any of you have love lives before all this?' A group of cultists, once part of the Endtide's military wing, sit together. A while back, Wavebreaker decided that, while the cult itself might not be allowed a military anymore, the ferocious fighters could still serve him well. Thus, he created a special marine battalion, the Endbringers, sending all of the Endtide's roughest to boot camp, to train a trusted, elite fighting force. They sit around now, around a dining table, eating at some cans of food, speaking to one another. One of them, a short and unassuming mare, Jasmine, speaks up, 'I have a wife back home, actually.'\n\n The various others look over, including a stallion, who shouts from the other end of the table, 'Oh come on, how does a mare get a wife before I do!' Jasmine blushes, and shakes her head, 'She's not technically my wife yet, but we're engaged, and I signed up for the military wing of the cult to try and get a bit of a bonus from Crimson to plan our wedding! And, well, now, I'm here to try and fight to earn more money, because I'm going to buy her a nice dress, and we'll have a flower buffet, and it'll be very nice!' She then takes a second, blushing more, 'But, umm, her name is Tea.'\n\n One of the other stallions laughs to himself, 'Tea? Oh momma, I think I'm thirsty for some of that myself!' Jasmine bristles, 'Wh-hey! That's my wife, or, my soon to be wife you're talking about!' Another stallion, from across the mess room, throws an empty can, hitting the offending stallion on the back of the head, making him flinch. Yet another stallion chuckles, 'Hey, aren't you the one who tried to hit on Crimson when you first arrived?' The stallion frowns, and then pushes his fellow, 'Shut up about that!' The shove, predictably, causes a lot of chaos, which escalates into a full on free for all once someone else makes a suggestive comment about Tea, causing a very angry Jasmine to tackle them and start hitting at them. The fight goes on for minutes, until the drill sergeant trots into the room, shouting, 'Stand at attention, maggots!'"
rustwreck.65.a: "Yes, Drill Sergeant!"

rustwreck.66.t: "Dangers from Abroad"
rustwreck.66.d: "REPORT: CHEM SMUGGLING:\n\n Good evening, WAVEBREAKER, report from NAVAL INTELLIGENCE, courtesy of Agent Starport, concerning the situation of CHEM SMUGGLING. CHEMS, are substances which cause a mental or physical change in the user, such as feelings of ecstasy, improvements of speed, or the ignoring of pain, they are also highly addictive. As part of your FREE TRADE POLICY, we have noticed a concerning increase in CHEM SMUGGLING, into the country. As of today, we calculate that about 20 TONS of illegal chems have snuck their way into our country, and have been sold through the grey and black markets to the vulnerable ponies of our nation.\n\n This agent, and all of NAVAL INTELLIGENCE, strongly support you to increase funding so we may compete against the CHEM SMUGGLING and try to eliminate the black and grey markets of our country. Of course this will conflict with your policies, and it may slow down the economy, but this poison will destroy our youth. The choice, as always, is up to you."
rustwreck.66.a: "The Status Quo will suffice"
rustwreck.66.b: "We need to prevent all smuggling"
rustwreck.66.c: "We need to prevent all smuggling"

rustwreck.67.t: "Last Voyage of the Hemp Express"
rustwreck.67.d: "Hooves hit against metal, one by one, as uniformed members of Naval Intelligence board a small convoy inbound from Baltimare. The leader of the group, Agent Clear Mind, looks around the deck of the ship, where sailors stand, looking at him and his ponies. The Captain, a Baltimare pony with dreadlocks in his mane, trots down with a small grin, 'Evening there, Agent, you said over radio you would be doing a cargo inspection?' Agent Clear nods to the Captain, 'Indeed, Hemp Rope, part of the new policies put in place. Please, lead me to your cargo storage.'\n\n Hemp grins softly, and opens a hatch, trotting down a small stairway into the underbelly of the ship, where crates upon crates sit, filled to the brim with all sorts of stuff. Rope, food, mostly root vegetables, some oil, and other assorted things. Agent Clear trots to each crate, looking it over carefully and nudging it with his hoof, ensuring everything is up to board. He goes around fully, before he trots back up to Hemp, and nods, 'Well, everything seems to be good. I, hmm, give me a second.' He takes a second to sniff the air, and he finally spots it. Past the smell of vegetables, the smell of the salty sea air, the smell of oil, he smells what he's looking for, Dash. He trots over to a crate of vegetables, and knocks it over, revealing a crate of Dash beneath.\n\n With a single smooth motion, Agent Clear draws a revolver, chambering a round and leveling the gun at Hemp Rope, 'Captain Hemp Rope of Baltimare, you are hereby under arrest under charges of smuggling illegal chems. You and all of your crew will be given a chance to testify at a naval court, come quietly or I will open fire.' Hemp Rope looks down the barrel of the revolver, and sighs, 'You got me, I'll come with.' The Agent nods, and then trots above board, where the others begin to quickly take the remaining crew as prisoners. Agent Clear goes to trot off the boat, only to pause before he does. He reaches into his coat, and takes out a match. He strikes it against his own neck fur, and then tosses it at an oil lamp, catching the whole ship on fire, as he leads the imprisoned Captain away."
rustwreck.67.a: "A sign for those that try to corrupt our people"

rustwreck.68.t: "Blueprint of a Mind"
rustwreck.68.d: "'A wise pony once said, knowing is half the battle, and it is knowledge which wins the war against any enemy.' Wavebreaker stands in his office, as Crimson sits off to the side, listening and watching him pace side to side, 'What caused the downfall of Celestia? She relied too much on the nobles, who led her wrong, to war against Zebrica. What caused the downfall of Luna? She relied too much on the ponies of the Ministries, who turned her country corrupt. What caused the downfall of the Ministry Mares? They relied upon other ponies, whose lack of knowledge failed them. All throughout history, ponies have failed because they relied on other ponies, ponies with lacking knowledge, ponies who could not make proper guesses about the future, ponies who were corrupt, and fallible. Do you know what I've learned from my time in the navy, Crimson? Ponies are good, but metal and steel are better.'\n\n Crimson smirks, and clops her hooves together, 'Wow, that's such a good speech, did you rehearse it in the mirror this morning or something? Seriously, why are you saying all of this, you feel like you're building up to something big.' Wavebreaker nods, 'Because I am. Computers, they take the data you give them, and they put out perfect predictions. They can calculate the trajectory of a shell in microseconds, whereas ponies require either faith or full minutes to calculate. So far, Crimson, we've been reacting to the issues presented to us, but I think, with a computer given all the data of the nation, we can predict problems before they ever occur. We can protect ponies from threats yet to reveal themselves! Say, for example, an economic recession is coming, a computer could predict that and give us the optimal strategy to react to it.'\n\n Crimson pauses, and tilts her head, 'That's actually not the worst idea I've heard you have. Yet there's some glaring issues, firstly, trusting a computer is, like, pretty much always a bad idea in those science fiction books you read. Evil computers killing ponies, incompetent computers killing ponies, lots of killing ponies. And two, of course, uhh, we don't have anywhere close to the resources we would need to build that.' Wavebreaker smiles, 'But this isn't a novel, Crimson, and it's not going to be in control. It'll just advise me, and I then filter if it's a good idea, or a bad idea. And of course, we don't have the resources now, but I think we can gather resources together. With increased production across the country, we can create a facsimile of what will be, a prototype, so to say. A digital library that catches all information it needs, maybe we could call it the infonet, since it's a net that catches information.' Crimson snorts, 'Yeah, leave the names up to me, thank you, you suck at them.'"
rustwreck.68.a: "A library of Light and Electricity"

rustwreck.69.t: "§PSAGE§! Comes Online"
rustwreck.69.d: "The trio of Kelp, Wavebreaker, and Crimson stand in a massive hall, looking at a room-sized computer, which whines and whirrs as it processes information. Robots are strapped to the computer, their optical sensors being used to absorb information at fast speeds. Ponies float books, memory orbs, movies, and many, many other things in front of the robot sensors, watching as the information is absorbed, and processed into the maneframe. Wavebreaker pushes up his glasses and smiles, 'This machine is a large collection of knowledge, basically, a library in digital form, which you can ask any question and then it will tell you what it knows. The machine first absorbs information into its central processor, which I have deemed the infoweb, and then it processes that information, much like an engine that processes fuel. You then speak your question out loud, and it uses that processor to search for its information, thus, I call it a search engine.'\n\n Kelp looks at the machine, and then takes a small swig of her whiskey, shaking her head as she does. She steps up to the one of the robots plugged into the machine, 'Machine, tell me the definition of defenestration, and provide me a historical example of when it was done.' The machine processes for a second, and it's mechanical voice then responds, 'Defenestration is to kill a creature via throwing them out of a window. The most popular historical example of this is The Defenestration of the Heretics in Eagleton in early 662, when locals found out the clergy of the town were secretly worshipping Maar, and so they threw them out of windows, with their wings tied to their sides.' Kelp takes a step back, looking at the machine, before looking at Wavebreaker, 'This machine could be of assistance, yes, but it also poses a great threat, we must not let it control our decisions, merely be in an advisory role.'\n\n Crimson trots forward, and smirks, 'Oh, don't worry, Kelp, it may have a lot of intelligence, but it doesn't have wisdom, like you, or charisma, like me. Mmm, you know, I remember I used to have a role in the Endtide for those who were intelligent.' She rests a hoof on the machine, and grins, 'SAGE, Supercomputer Assistant Gestalt Engine.' Wavebreaker blinks, as does Kelp, who speaks, 'You know the word gestalt?' Crimson looks back, and grins, 'The whole is greater than the sum of its parts.' Wavebreaker pauses, and nods, 'I like it. So shall it be. Welcome to the world, SAGE.'"
rustwreck.69.a: "A marvel of Wasteland engineering"

rustwreck.70.t: "The World Keeps Turning"
rustwreck.70.d: "Thunder rumbles through the sky and rain begins to patter down onto the grass around Wavebreaker, while he stands alone, looking over a gravestone. Engraved upon it the name of the one he looked up to, 'High Tides'. Today, like every day, is another day since this country lost the best leader it had, leaving Wavebreaker behind in its wake.\n Wavebreaker sighs softly, looking at the gravestone, 'I wish you were here, Admiral, things seemed so much easier. The Old Guard are gone, they didn't agree to go with me. The Endtide are neutered, yet still they try to resist me, even Crimson, who spends every day testing my patience, I'd be rid of her if she didn't give good ideas. Even Kelp is against me sometimes, she argues against seemingly whatever I want as part of the economic ministry. Is this what it was like, when you first brought us together? I wonder how it felt.'\n\n He takes a second, 'I know you fought in the war. I never asked, but I wonder, did you have family? Friends? Did you ever find out what happened to them? I've always been alone, truly, so I couldn't understand the loss if you lost your loved ones, especially if you didn't even know for sure that they were gone. And yet despite that loss, you still led, you led until the very last moment when your body finally gave out on you. You led us through the sunset of your homeland, and through the night, until sunrise came again. Then you passed, and I feel sunset has come upon us once more, and evening. Yet as night comes, I cannot help but to fear that I will not be as strong as you.'\n\n He takes a breath in, slowly, 'I'm not as charismatic as Crimson is, in fact, ponies find me grating to listen to. I'm not as intelligent as Kelp, I'm knowledgeable, but that mare has a vault of knowledge which she keeps locked away with whiskey. Even that Griffon that returned, Jacques, he was more bold and controlling than I. They might try to help me, but you trusted this country to me, High. I don't know if I'm worthy. But the night is coming, and even if my light might sputter and die, I will stand with it to the final moment.' He takes a second more, 'I loved you like a father. I'm sorry I didn't get to say goodbye properly. Rest well.'"
rustwreck.70.a: "Evening turned to night"

rustwreck.71.t: "The Stallions in Grey"
rustwreck.71.d: "Darkness fades as eyes open, bleary and unfocused, blinking to adjust to a bright light shining in their eyes. Pot Roast opens his eyes, but he isn't in his restaurant back in Glowport, nor his home, nor anywhere in Light. He can feel the ocean waves under him, a harsh electric light being pulled away after a second. He blinks his eyes, and opens them again, seeing a stallion standing before him, wearing a blue-grey overcoat and a hat. The stallion, Agent Clear Mind, grins slightly, 'Hello there, Pot Roast. I'm sure you're curious what you're doing here.'\n\n Roast clears his throat, looking down, seeing his hooves aren't restrained, like he would expect, 'Who are you, what do you want?' Agent Clear grins a bit more, as another pony comes into the room, offering Roast a glass of whiskey, 'Who we are, well, that's for me to know, and you to guess. Drink?' Roast looks at the whiskey, and then shakes his head, 'I'm sober.' Agent Clear then smirks softly, tipping up his hat, 'Is that so? I remember it differently. About a week ago, you snuck out to the bar during the closing hours of your restaurant, and there you shared a drink with a stranger, whose name you never asked. You told him all about your promise to your wife, how you'd never drink again. But your boss is too demanding, your foals too energetic, can you blame a stallion for a little vice? After all, what is life without a bit of well-ventured vice?' Roast looks Clear in the eyes, before he grabs the drink, taking a sip, 'One of you drank with me. What do you want?'\n\n Clear grins, 'We've kept an eye on you for a while.' He reaches into his coat, taking out a vial of liquid and giving it over, 'I want you to dump this into the food of a trader who's coming next week. His name is Open Market, and he's been causing issues, spreading ideas like democracy and other chaotic desires. Sneak him this poison, and once he ends up dead, you'll find a gift of caps under your pillow one night, enough to retire off of.' Roast pauses, and sips his whiskey a bit more, 'And what if I say no?'\n\n Agent Clear smirks softly, 'Your foal wanders whenever you and the wife are away at work. He trots along the shore, all alone. Quite dangerous, you know, he could fall in and never be seen again.' Clear smirks more, and tips his hat, 'Face it, Roast, there's only one real choice here. But either way, no matter what you choose, well. . .'"
rustwreck.71.a: "'We'll be seeing you again'"

rustwreck.72.t: "Dusting Off Old Memories"
rustwreck.72.d: "My name's Redheart, and I am a mare, a nurse, standing now in a university. Ponies surround me, looking down at me, the eyes of the Ministry of Peace looking for the slightest mistake. Yet I speak still despite the nerves, 'Ponies were not meant to fight in war, this much is obvious, as we are a prey species, a herd species, one not made for the horrors of bloodshed, of mud, or rain, or death. However, our neighbors, the Griffons, as seen by the effectiveness of their Talon Mercenaries, are predator creatures, they are pack hunters who work, in nature, in small squads to hunt down their prey. It is for this reason that I propose a new project, Ministry of Peace, to take the predator gene from Griffons, and try to put it into our soldiers.'\n\n The wind blows through my feathers, rain pattering down on reinforced leather armor, as the sounds of gunfire and the smell of blood fills the air. I dive, and my talons rend the flesh of a zebra stallion, his throat slashed, and he collapses to the ground. Other griffons land around me, lighting up the streets with rapid gunfire, killing the multitudes of Zebras who come. Gunshots come from the city hall of what once was a place called Stableside, and another Griffon shouts to me, 'Gilda! Secure the objective and go!' I turn, and rip the door off a carriage, rifle roaring as it sees a zebra inside, killing her in an instant. My claws reach out, and grab their bag, carrying a book inside. It's cold.\n\n I am a stallion, the taste of smoke lodged in the back of my throat, as I stand in a dressing room. A mare in a red dress lays on the bed before me, syringes of Med-X and vials of Dash scattered all about. I chuckle, and remark darkly, 'Oh, Miss Keys, I guess the fame got to you. Here you are now. Pretty as a picture for little old Domino.'\n\n The machine comes off of my head as the final memory orb ends. I blink, a hoof pushing up my glasses slowly, as I ground myself once more. Crimson looks at me, and she speaks, 'Wavebreaker, are you alright? Ready for the next set of orbs?' I look at my hoof. I remember when it was claws, even if it never was mine. I nod softly."
rustwreck.72.a: "Onto the next batch"

rustwreck.73.t: "Fervor of Youth"
rustwreck.73.d: "Tea Cup is a mare who's always tried her best for her community, always trying to ensure the next generation would be better than the current. Before, that meant working with Endtide, but now she serves a new cult's purpose when she teaches her foals. A cult of hate, propagated by the state itself, filled with actual history. She stands now before a class full of foals, smiling softly, 'Alright, class, today we'll be talking about ancient Equestrian history, and today we'll talk about an ancient tale from the ancient leader of Equestria, Princess Celestia the Wise. This story takes us to when a delegation of a species called 'Yaks' decided to visit Celestia. Do you know what Yaks are?' The class is quiet, until one foal raises his hoof, 'Oh, Yaks are big fluffy creatures, they're about the same size as a Steel Ranger, but the Rangers are twice as mean!' She laughs softly, and smiles, 'Yes, that's correct, though Yaks are renowned for their bad temper, and for their xenophobia. Do you know what xenophobia means?' Another foal raises her hoof, 'It's whenever you dislike outsiders, like the Enclave does, and only mean ponies are xenophobic.' Tea smiles and nods, 'Very good! Yes, the Yaks are much like the Steel Rangers and the Enclave both!'\n\n She then takes a second before she continues, 'Anyway, the Yaks came to Celestia, and she treated them nicely, to make their leader, the Khan, happy. She fed them the nicest of treats, gave them the most comfortable beds, and made sure servants served them at every second. But, on their last day there, one of the Yaks got mad at a servant who stood in his way, so he took it out on the servant, and killed him. Celestia, furious with the death of her servant, summoned the Yaks to a meeting room. With a flash of her horn, she summoned a piece of the sun, which burned all the Yaks down to ash. She then took this ash, and shipped it to the Khan. Now, what does this story tell us?'\n\n Another colt speaks up, 'Oh, umm, don't fuck with Celestia?' Tea frowns, 'Language, please. But no, this story teaches us something that applies even to modern day. Those who are mean, like the Steel Rangers, and those who hate those other than them, like the Enclave, can turn even the most peaceful of ponies into a killer. Always remember, foals, don't be like the Rangers or the Enclave, be kind to each other, and value harmony above all.'"
rustwreck.73.a: "'Now who's ready for recess?'"

rustwreck.74.t: "Collecting Stamps"
rustwreck.74.d: "'Next!' A stallion's voice shouts, as the line of merchants make their way down the road, trying to get into Rustwreck. Arachno comes from Friendship City, being quite the popular trader of goods, mostly clothes, blankets, and other things weaved together. He, and the dozen other merchants, hold their papers tightly as they wait for the fifth stamp to receive entry. Luckily, being this far into the line means they're not at any risk. Some of those near the back of the line, so he hears, are prime prey for the Rain Riders to beset and attack. Given the security of the country, though, as soon as you're close enough to the borders, the raiders don't dare attack, lest they receive a 155mm shell to their cars from off the shore.\n\n Arachno has been here before, only a few years ago. The streets are clean, there used to be a hoof full of thieves around, and some crazy cultist from something called the Endtide who always tried to convert those who passed by. But now, the streets are filled with ponies, who talk and trot by each other's sides. Armed ponies stand every so often, armed with rifles and thick armor, ready to fend off any criminals or pick-pockets, and ready to force any caravans with contraband right back the way they came.\n\n Speakers play music through the streets of the border town, but it's not the voice of P0N-3 speaking, like in most settlements. Instead, it's some mare, speaking about increased profits, safety, about the dangers of the Enclave and Steel Rangers. The whole place is odd. Finally, Arachno comes up to the final stand, and places his papers down. The pony within the stand looks at the papers, and smiles, 'Oh, sorry, I'm afraid I can't let you in. These papers expired five seconds ago, you'll need to check back at the back of the line. Try to move quicker next time.'"
rustwreck.74.a: "Are they trying to be obtuse?"

rustwreck.75.t: "Past Glories"
rustwreck.75.d: "'Good morning, ponies of Rustwreck, this is your leader, Wavebreaker, speaking. As of this morning, I do announce my intentions that our nation, Rustwreck, shall one day reform into what we once were, the Celestial Sea Fleet.' Kelp takes a sip of her whiskey, 'I understand many of you will not know what that means. Simply put, the country will be run effectively, like a naval fleet, you will be given your rights, and your orders, and you will follow them. Furthermore, we seek to reclaim the Celestial Sea, starting by attacking the raiders to our north. In a few short weeks, we will sail north, and for the first time in too many years, our shores might see combat once more. This message will repeat until the end of the day, thank you.' Kelp sighs softly, setting down her glass.\n\n When the message had first gone out, she rushed over to Wavebreaker, after all, reforming into a Fleet would likely mean the end of civilian administration. But no, the council, and her, shall stay. Yet still, this step, like many things nowadays, is another reason to drink. Crimson and Wavebreaker sit in the room as well, with Crimson grinning slightly, 'Personally, I think this will go great. If you entrust me with reforming these raiders, at least, then taking down the north will be easy, we'll have a bunch of new fighters ready and willing to serve us.'\n\n Kelp looks up, 'Did she know about this before?' Wavebreaker nods, 'Crimson has a way of finding things out, I try not to question it. I know you are worried, Kelp, and I am too. No numbers, no planning, survives first contact with the enemy. The coming months will be worrisome, but, I think, in the end, we will survive. We'll make High Tides proud.' Kelp sighs, sipping her whiskey again, before placing it down once more, 'This will go poorly.' Wavebreaker takes a second, 'Maybe.' He then picks up her glass, looking at it, before taking a small sip himself. He winces as the drink burns his throat, yet he slowly sips again. He then sets the drink down, 'Maybe it'll go badly. But we'll never know until we try.'"
rustwreck.75.a: "Why does this have to be so difficult?"

rustwreck.76.t: "On a Foundation of Rubble"
rustwreck.76.d: "Summerdale, once a lively wartime community, then a Raider hub, and now, after much fighting, in the hooves of Wavebreaker. Said hooves trot down a ruined street, past collapsed houses and destroyed factories, while Crimson trots beside him, 'I've been working with the Rain Riders and discovered they're actually not that bad. They have a unique culture, based around freedom, the freedom to drive their cars, mostly. It seems to me like the only thing we need to do to reform them is allow them to purchase and race their cars. Put a car at the end of an obstacle course, and nopony will complete it as good as a Rain Rider.' Wavebreaker nods, and comes to a stop. He sighs, softly, 'I hope they can be reformed, but looking around right now, I don't know if they can. It's been two hundred years, and yet this place is in ruin and rubble. Why? Why is it like this? Why are only we and a select few villains the ones who try to pick up the pieces? Why am I unique, as the only one rebuilding the country who isn't evil, like Red Eye is? Why is this the cost of Equestria?'\n\n Crimson trots in front of Wavebreaker, giving him a small smile, 'Not like you helped things, with your bombardments. But have you ever paused to think about this, Wavebreaker? Why everypony who tries to restore Equestria is evil? Perhaps it's because that's the price to be paid to rebuild the old, rather than embrace the new.' She nods, 'The Rain Riders, like them or not, they built a new culture. Did you know they pick their leader through a race? They actually have laws against abusing vehicles, and they have a law stating that any slave who proves they can drive becomes a Rider. They didn't rebuild because they're not trying to rebuild, they're just trying to build, and we took them over. Maybe Equestria died, Wavebreaker, and maybe it's time we move on.'\n\n Wavebreaker frowns, 'No, I won't give up. It's in every wasteland pony's heart that Equestria was better than this all. I won't move on, not if I can rebuild. If you believe that, Crimson, why are you even here? Why are you helping me? Why do you never leave?' Crimson pauses, and then grins softly, 'Because you're my friend, Wavebreaker. Besides, of all the freaks in the wasteland, you're the one I trust the most to do good. And even if you do bad, I'll still be there, even if I don't like the path you trot down, I'm there by your side. I had my chance, and you won, so even if your ideas are two hundred years out of date, I'm here for you. Now come on, are we going to rebuild or what?'"
rustwreck.76.a: "Another burden to take up."

rustwreck.77.t: "Expensive Toys"
rustwreck.77.d: "Kelp stands in Wavebreaker's office, missing her whiskey flask for once, frowning as she stands before him, 'You want to buy more memory orbs? Wavebreaker, then orbs aren't helping! The last orb you went through almost made you dissociate! Not to mention those orbs with that cursed book in it, this is just an addiction!' Wavebreaker sits behind his desk, pushing up his glasses, 'SAGE has produced a report which says that more information from the war-time will help our nation prosper and succeed. I know you are the head of economics, Kelp, so you desire all the caps in the world, but this is important, more important than your factories.'\n\n Kelp scowls, 'More important? My money goes to feed ponies, my money goes to build up factories to fund your imperialism, my money provides therapy for your damaged troops and my economy makes your guns! Tell me, what, perchance, has your spending spree bought us, hmm? How about that time you bought a 'laser musket' from that blue-furred unicorn charlatan, only to find out it was a foal's toy? How could I forget that time you bought an entire crate full of 'weapons technology' magazines that turned out to be science fiction? Let us not forget, too, that time you believed a stallion who said you could grow corn in the snow, of course, only the most wise investments from our esteemed leader. You are hemorrhaging caps on personal projects that do not turn any dividends and do not facilitate any greater interest for the country as a whole!'\n\n Wavebreaker frowns, and stands, 'Enough, Kelp! That's enough. I understand you feel afraid that SAGE is actually working now, you think I won't need you.' Kelp scoffs, 'That facsimile of a library? Are you resorting to projection to try and disingenuously disincentive yourself from actually listening?' Wavebreaker shakes his head, 'Kelp, I appreciate your contributions, and everything else. But I am the leader, and I make the decisions. This meeting is over, I have a game to play with Crimson, after my loss before.' Kelp frowns, and shakes her head, 'Are you serious? You're retreating into the foalish games that you and her play? Running off to your sycophant hoping she'll assure you that your assessments are correct?' Wavebreaker frowns, 'I said that's enough Kelp. I've made my decision.'"
rustwreck.77.a: "I know what I'm doing"

rustwreck.78.t: "Fate Cast In Numbers"
rustwreck.78.d: "Blood Money stands by SAGE, watching as a dozen ponies stand and tap away at a dozen terminals coming off of the machine, a bit envious of their jobs, just standing around looking at a screen all day, making sure nothing goes wrong. She yelps slightly as a stallion nudges her side, making the stallion smile apologetically, 'Apologies, Miss Money, here's the report you were asking for. A chart of the predictions SAGE has in place for that statue that's being planned, its costs, how long it will take, so on. Make sure Wavebreaker sees this.' She nods, matting down her bristled fur after being surprised, 'Of course, thank you, Mister Butter Spread.'\n\n She takes the offered file, carrying it on her back as she rapidly trots away. Practically every hour, she's called down here to grab some new spreadsheet or some new report from the machine, and to bring it up to Wavebreaker. Graphs predicting oddly accurately the trends of the economy, of resistance movements in occupied territories, of the requirements of ponies and civilians as a whole. Today, like every other day, she trots her way up to Wavebreaker's office, and opens the door, setting the report down on his desk, before going back out to the front, to await any visitors.\n\n Wavebreaker sits behind his desk, and looks over the new report with a soft smile, 'I know you'd be proud of this, Tides. Finally, controlling the nation is as easy as controlling the navy. Knowing is half the battle, and with this knowledge, I think the war to rebuild Equestria shall be won.'"
rustwreck.78.a: "A great step towards Order and Harmony"

rustwreck.79.t: "Better Safe Than Sorry"
rustwreck.79.d: "Once, long ago, there was a nation called Stalliongrad, who, following an ideology of equality, freedom, and democracy, broke free from Equestria. But Equestria, under the brutal rule of Luna, did not let the rebels stand, and before long, all the armies of Equestria marched north, and with them, they squashed the flame of revolution under their hoof. The sickle was replaced with the crescent moon, and the hammer with the gavel, as Luna's law set to reform the revolutionaries. Yet my great-great-grandparents did not stay in the north, instead, they fled down to Summerdale, where they would keep the flame of revolution alive in their hearts. They made local unions, they pushed for the ousting of a corrupt mayor, and they cried when the revolution of the northern Griffons was crushed by Imperial jackboots.\n\n Even after the world ended, and the Rain Riders came in, my family kept the revolutionary spirit alive. Being literate, we were kept as personal servants for the leader, I was, until the conquest by Wavebreaker, the servant to Hot Rod. And indeed, though I served a raider, I kept the red flame alive in my heart. It was the influence of my family that gave the Riders their love for freedom, even if they misinterpreted what we meant, and I have kept that desire to my heart for my long forty years of life. Yet recently, Wavebreaker, the new tyrant of these lands, has begun to rebuild. Summerdale is unrecognizable, no slaves exist, ponies hardly go hungry, and day by day they come to give us radios, and propaganda.\n\n In the last few months, I've tried to call for the founding of a union, to push for democracy, but the ponies have no care for it. Our bellies are full, they say, we have jobs, and houses, they say, why mess with something good? They listen day by day to the propaganda broadcasts, they've come to hate the Steel Rangers and the Enclave far more than they hated the raiders. I am no fool, I know the propaganda is propaganda, yet at the same time, I am a pony all the same. Perhaps the others are right. Perhaps now is not the time for the flames of revolution, but instead the embers of obedience. I do not know what I shall do, but as the days pass, I feel less of a desire for freedom, and more a desire for the safety Wavebreaker promises."
rustwreck.79.a: "-Signed, Lenin Suit."

rustwreck.80.t: "Preserved in Memory"
rustwreck.80.d: "'Hello, High Tides.' Wavebreaker stands in the sunset, looking up at a statue of High Tides. Gone is the rotting and feted flesh, instead, what stands there is the pony he once was, the young, bright-eyed stallion who first led the fleet to Rustwreck, 'I've changed some things, I decided, now that we've rebuilt, Rustwreck wasn't really a proper name for this place. This is Tidetown now, the place you built, a place which now, engraved in stone, you shall forever watch, and which shall forever remember you as a leader.' He takes a second, and sighs, looking down, 'Yet that's less than you deserve. You were much more than a leader, Tides, and I'm afraid once I'm gone, no pony will truly be able to remember that. It was in the little moments. The pride you'd have when you saw me promoted, the bit of panic in your eyes when my hoof got caught in an anchor's line, the small, dry jokes and comments you would make every day. I hardly remember them now, it's so hard to remember who you once were, when all I can imagine is the growls of you going feral. When all others have written are the grand speeches and moments of glory. When everyone sees you like a hero, not like a pony.'\n\n Wavebreaker looks back up, into the eyes of the statue, 'I don't know who my ancestors were. I've delved into memory orb after memory orb, but I've never seen a pony who looks like my grandparent. I'll be honest, often, when I close my eyes, I forget what my mother looked like. I forget what my father looked like, because you've taken their place. You knew them, though. Choppy Waves, Circuit Breaker, you saw them before they disappeared, maybe you even know why they left. But you didn't say, and you didn't make memory orbs, and now I'll never know. I'll never know because you were an asshole, Tides, who pushed away anypony who tried to get too close. I know you'd be proud of me for saying that, oddly. I'm not going to make the same mistakes as you.'\n\n He reaches up, and pushes up his glasses, 'I'm going to record my memories, I'm going to make sure whoever comes next, whatever children I might have, or future scholars looking back will know exactly who I was. I'm going to be kept alive forever, while you, Tides, you'll eventually fade away, even kept in stone. I'll never forget you, and I'm going to make you proud. And one day, after I die, when we meet once more, I think I'm going to smack you for giving me such a dysfunctional country to work with. And when I die, and for every day after, I will be remembered. Immortalized in orbs, and in the minds of the future.'"
rustwreck.80.a: "Comforting, in a way"

rustwreck.81.t: "False Memories"
rustwreck.81.d: "REPORT: PROJECT SIMULACRUM\n\n Good morning, WAVEBREAKER, I come with a report for a breakthrough we at NAVAL INTELLIGENCE have had with one of our projects, SIMULACRUM. The goal of the project was to MANIPULATE MEMORIES in order to PACIFY any aggressive or violent opponents to you. We have tested a specific process on a raider named CROSSWIRE.\n\n The process started off by giving the pony a solution of chemicals, provided to us by SAGE, which rendered the subject NEUTRA, lowering aggression and increasing brain-placidity. Then, with the machine you had made to play MEMORY ORBS, we inserted FIVE DAYS worth of MEMORY ORBS from Equestria, memories consisting of PEACEFUL actions. After the process was complete, the machine was removed, and the raider was PEACEFUL and HARMONIC.\n\n With this tool, we may rehabilitate many raiders who have proven themselves to be untrustworthy or violent. The only issue is that the process wears off between ONE MONTH to THREE MONTHS, and needs to be applied again. With plenty of investment, though, this could be a breakthrough. Signed, AGENT CLEAR MIND."
rustwreck.81.a: "Triple their funding!"

rustwreck.82.t: "Internal Opposition"
rustwreck.82.d: "Kelp flings open a door, trotting inside, while Wavebreaker and Bona Fide, head of Naval Intelligence, stand around talking to each other. She doesn't have her flask on her, nor does she look drunk at all, no, just furious. She slams the door behind her and shouts at Wavebreaker, 'Did you think I wouldn't hear about your experiment, Wavebreaker? Did you think you would just get this past me without my attention? Forcing ponies to watch memory orbs, 'reforming' them, have you gone insane! I have half a mind to give you a diagnosis for this, brainwashing ponies! I thought you were supposed to be better than Red Eye?'\n\n Bona Fide clears his throat, and stands straight, 'If I may, Doctor Kelp, firstly, this is highly inappropriate of you to come barging into Wavebreaker's office like this. You might be the head of the economy, yet you must still follow procedure. Secondly, you say this is brainwashing, but it isn't, it's reformation. These raiders, the ponies were using it against, they aren't peaceful members of society. If we didn't reform them, then we would have to execute them, isn't this, as you call it, 'brainwashing' better than execution?' Kelp scowls, 'You may not, Bona. I came here to speak to Wavebreaker, not listen to his latest sycophant sing his praises, so if you do not mind, in my professional opinion, you should shut your mouth before I shut it for you. Wavebreaker, how long will it be before this technology is used against innocents? Against those who dissent? Against those like me?' Wavebreaker frowns, 'It will never be used against those who simply dissent, Kelp, and never used on you. You are a valuable member of this society, you contribute. Please, we can talk more later, tonight.'\n\n Kelp frowns, and simply shakes her head, turning and leaving. Bona Fide inclines his head and smiles, 'Do you wish for me to do anything about her, Wavebreaker? She is quite the troublemaker.' Wavebreaker smiles softly, 'No, Kelp is valuable, she raises good points. And like I said, I would never do anything against an innocent, let alone a friend like her. Now, back to what we were talking about.'"
rustwreck.82.a: "Meeting adjourned"

rustwreck.83.t: "White Picket Fences"
rustwreck.83.d: "Jasmine stands next to Tea, marine and teacher stood side by side, surrounded by a sight not seen in the wasteland for two centuries. Freshly built suburban style houses, painted in a neo-retro green color, surrounded by freshly painted white picket fences, complete with mailboxes and lawns, though the lawns are still dead grass. Jasmine takes a second, and then sniffs, 'It looks like we walked into an old photo.' Tea slowly nods, and smiles softly, 'Well, I'm not complaining, this place is pretty nice, though it is fairly large.' Wife and wife trot forward down the driveway, and up to the door of their new home, opening it up.\n\n The inside is clean, sturdy, made fresh, with running water, and some lights on the ceiling. Windows, clean windows, allow the dim sunlight to filter through, as the two mares look around the inside of the suburban house. Jasmine scrunches up her muzzle, 'This is weird.' Tea smiles softly, trotting up to a dining table, made of freshly carved wood, running her hoof softly across it, 'It does look like an old magazine advertisement for a house. But you earned this for us, Jasmine, with your service.' Tea trots up to Jasmine, nuzzling her, and then kissing the hotly blushing cheeks of her wife, 'Stop it, Tea, you also earned this for us. Teachers are hard to come by, after all, much more rare than marines.' Tea smirks softly, pressing against her wife, 'Not as rare as a marine this cute, hehe~'\n\n Jasmine, her cheeks burning bright red, looks elsewhere, until her eyes fall upon a silver colored tool on the counter, 'Hey what's that?' Tea smiles, and trots closer to it, 'That, my lovely, is a convenient excuse to get out of my loving hug. It's a toaster, it warms up bread.' Jasmine pauses, and lifts an eyebrow, 'Don't, like, Steel Rangers kill for these types of things?' Tea smiles, 'Well, yes, but they're being made. Luxuries, wartime luxuries, I don't know if we'll ever use it, but they have promised electricity for 18 hours a day.'\n\n Jasmine nods softly, looking around, 'This is a large place for two lesbian horses to fill.' Tea smiles, and trots closer to her wife, 'Well, you know, there are a lot of orphans, ever since the war against the raiders. Looking for loving parents, and a safe home.' Jasmine blinks, 'Really? Wow, I hope they find one, that sounds sad.' Tea blinks back, and then boops her wife's snoot, 'I'm saying we should adopt a foal, Jasmine.' She blinks again, 'Oh. Well, not like I've got anything better to do.'"
rustwreck.83.a: "'Let's adopt a foal!'"

rustwreck.84.t: "Background Noise"
rustwreck.84.d: "Today has been the meeting of the century, as representatives from all the subjects of the Admiralty, the administrative zones, have come to sign a document, drafted by Wavebreaker, Kelp, and SAGE. The treaty is quite simple, requiring an equal spread of any research or discoveries of wartime information, for the common benefit of all Zones, and for greater optimization. Many of the representatives came with gifts, and many talk now.\n\n Wavebreaker doesn't pay them any attention, though, looking at something the member from Summerfield got him. Protectamini 1000, a small Protectapony with a properly functioning laser pointer system, able to move just like the real deal, with an attached remote, and with voice lines. He smiles, pressing the top of the head of the machine, making it shout a line, 'I AM A PROTECTAPONY BUILT BY DOCTOR IMPENDING DOOM! FEAR ME!' He chuckles softly, and presses it again, with another voice line playing, 'DOOM APPROACHES, COWER IN FEAR!' He smiles more, and presses the laser-crystal on the head, making a laser pointer fire out of it, and another voice line play, 'PERISH IN CLEANSING LASER!'\n\n Crimson leans over and smirks, sitting right next to him, 'Having fun with your toy there?' Wavebreaker smiles softly, 'Unironically, yes, this thing is amazing. I can't believe these types of things would be common in the past. It's able to speak!' The voices in the background pause and look over his way after he speaks a bit too loud, with him clearing his throat, 'My apologies, continue.' The various representatives continue to talk, while Crimson giggles to herself, 'Yeah, you know what else is able to speak and move on their own? Ponies. Besides, I know the true reason you like this thing, you're going to try and use it against me during our game tonight. Let me tell you, though, my Somnambula Mark Two Anti-Armor Mobile Gun is going to destroy this thing.'\n\n He smiles and shakes his head, 'It's not just that, Crimson, though yes, this thing will destroy you and your OP Rockhoof Mobile Protection Unit. Think about the old world, about the fact that things like these used to be in the room of every foal who wanted it. Yet modern day, something like this, well, it's worthy of awe. This isn't just a toy, Crimson. It's a miracle from the past.'"
rustwreck.84.a: "Miracles of the past indeed."

rustwreck.85.t: "The Voice of the Wasteland"
rustwreck.85.d: "Tenpony Tower, to some it's a beacon of decadence in the wasteland. To Wavebreaker, though, it served as a symbol of hope, in a way, a place where the culture of the old world still survived, even if they refused to spread it. So when the time came and they took Tenpony, he did not entrust its redemption and reformation to Crimson alone, instead, he decided to travel with her, to take a more personal approach to it. Now he and Crimson stand in the midst of the Tenpony courtyard, armed soldiers clearing out the last violent resistance of the tower, while a gathered collection of the remaining leaders stand in front of them, at their head being Homage, assistant to DJ P0N-3.\n\n Wavebreaker pushes up his glasses and smiles, 'I must admit, I've always taken a liking to the good DJ, and his idea of a good fight. To fight for Harmony, and an improved wasteland, a wasteland like Equestria once again. I'm also interested in seeing the radio equipment that he works with, and I would like to meet the stallion himself.' Homage stands in front of him, and shakes her head, 'He doesn't meet with anypony else, let alone conquerors like you. He only meets with a select few heroes of the Wasteland, the shining beacons of hope, so no, it doesn't matter what you say. You're not seeing him, and you're not getting any access to the radio equipment.'\n\n Crimson smirks softly, 'You meet with heroes and beacons of hope? I think he fits that pretty nicely, if I'm to be honest. Oh sure, he's not some Stable pony with a penchant for shooting raiders, but he's a hero still. Just look at Summerdale, they've gone from being slaves to raiders, to now being well fed, educated, productive members of society. Maybe you disagree with his use of force, but you have to admit, he's a hero. He fights the good fight, and would make for a great interview. Plus he's a massive nerd and could help expand the radio broadcast, all the way to reach even the Enclave.' Homage frowns for a second, and then pauses, and looks away, 'Hmm. I'll give you an interview, but on one condition. You allow the DJ to continue to say whatever he wants to say. Do that, and I'll help you out, as much as I can.' Wavebreaker nods and extends a hoof, 'Of course, it's a deal.'"
rustwreck.85.a: "The Good Fight is more than shooting raiders."

rustwreck.86.t: "Plans in Shadow"
rustwreck.86.d: "'No, no, my friend, you see, torture is actually an extremely inefficient way of extracting information.' A raspy voice speaks, quiet, within a small closet within a wartime water-treatment plant. Stood inside is a ghoul, along with his companions, Bona Fide of Naval Intelligence, and a pony from Detroit who stands in the shadow. The ghoul continues, 'Torture just makes the target say what they think you want to hear, not the truth. Believe me, we tried it back in the old days, against zebra infiltrators, but they just gave us false info that fed our confirmation biases. I remember when we finally caught Sevrov too, he gave us the run around, no matter how many eyelashes we plucked or waterboarding we did. You don't torture ponies to get information, you give them rewards for giving correct information.'\n\n Bona nods softly, 'I see, or you use a memory orb to extract the information you're looking for.' The ghoul snorts, as the pony in the shadows speaks in a thick northern accent, 'Memory orbs are cheating.' The ghoul nods, 'Exactly, they're cheating, and those pinkos you interrogate can just create false memories if they're good enough. If we're rebuilding Equestria, we can't fall into the same mistakes Minister Pie did. The Last Day was a fault of intel, after all, nothing else.'\n\n Bona nods once more, 'Well, you are correct, we won't make the same mistakes as them. And that's why I need your help, both of you. There are many dissidents nowadays, more than even the war. Not only do we have pinkos and hippies like the old days, but now we have raiders, cultists, politicians who believe in things like democracy. All very anti-harmonic, of course.' He takes a breath in, and then nods, 'I expect to see you both here next week, we'll run experiments and see what method is the most effective. No step is too far to see Wavebreaker's vision done. Even if he wouldn't like it, we do the dirty stuff so he'll never have to.'"
rustwreck.86.a: "We act for the good of Ponykind, after all"


rustwreck.87.t: "Democracy is obsolete"
rustwreck.87.d: "Equestria, no matter the year, no matter the crisis, has always been defined by one thing, the benevolent and dictatorial powers of those leading it. Whereas others may have squandered their potential behind petty kings, fief lords, or republics, believing their inefficiencies to be proof of a better system, Equestria had never fallen for such folly. Many have tried, Kelp has called for a Republican system within the country many times, and even the oft-ignored Captain Jacques has spoken on the need for votes. But the truth is, democracy is outdated, it's a set of pretty ideas, about liberty and freedom, that does nothing but cause worse outcomes for a country. What matters more, a country being happy, or a single pony feeling good because they've blocked the entire political system? No longer will we allow these inefficient ideas to flourish or take route. The Wasteland is too dangerous for ideals, all that remains in this blasted land is efficiency.\n\n It is thus, with a pen, that Wavebreaker writes his greatest command. A new organization, the National Pacification Government, a technocratic, efficient council, with dictatorial powers, overseen by none other than Wavebreaker, will oversee the rejuvenation of this land. For every position, other than local Mayors, will be chosen by the new council, to ensure loyalty, to ensure efficiency, to ensure that when years have passed, all ponies will be housed, and fed. No more will we play into the folly of the GPE, who believe the vote to be sacred. No longer will we play into the idiocy of the Steel Rangers, who believe checks and balances are above all else.\n\n Equestria is, and always will be, a land of cold, and efficient, Harmony."
rustwreck.87.a: "It was a griffonian idea to begin with"

rustwreck.88.t: "Cowards in Armor"
rustwreck.88.d: "Wavebreaker sits in a office near the frontlines, deep within Bucklyn Cross, where the Manehattean Contingent once called home. But they've been pushed back, by the force of marines, and by bombardments from a river fleet, they've been slowly pushed back. Yet even if all Steel Rangers are brutes and thugs, there are some who weren't Steel, instead, they call themselves Applejack's Rangers. Star Paladin Crossroads sits across from him, wearing her armor, painted with the symbol of the Applejack Rangers, listening as he speaks, 'Due to your quick surrender, Crossroads, I will spare you and all Rangers who defect to the oath of Applejack, and who decide to join me. I have no wish for any more bloodshed than is needed, but only for justice to be brought against the Steel Rangers, for the crimes they have done.'\n\n Crossroads nods, 'Yes, sir, and I hope, with your blessing, to build the Rangers back to what they once were. Gallant knights of steel, protecting and serving the ponies of Equestria.' Wavebreaker smiles softly, 'Exactly. While we wipe up the remaining Steel Rangers, I expect you to build something new in the background. See me like your new Luna, your commander in chief, but you are the one who will head the organization, of course. Now, let's talk about your ex-comrades in arms.'\n\n Crossroads nods again, 'The remaining members of the Manehattan Contingent who have not defected to join me have begun to call themselves the Remnant Rangers. They're led by two Knights, Mango Slice and Dice, and they number a few hundred among their ranks. I would, however, advise caution and mercy. You've already killed Cottage Cheese and destroyed the Steel Rangers, these ponies don't fight for what you hate. They just fight to protect their home. I know the Mango siblings well, they won't go easy, but if you promise to treat them and theirs with respect and due process, they will cooperate.' Wavebreaker looks into her eyes for a second, and then nods, 'I will give them one chance, and if they say no, then they will receive justice at the end of a shell.'"
rustwreck.88.a: "Diamonds among coal"

rustwreck.89.t: "Midnight Visitors"
rustwreck.89.d: "Kelp has been having a bad day, a really, really bad day. Wavebreaker has given her a new stack of reports from SAGE, asking her to do frankly ridiculous things to the economy to fit its predictions, not to mention her assistant, Whiskey Shot, has been gone all day with no notice. By the time she arrives home, she has a pounding headache, and a desire to just go to sleep. She opens the door, her mind and eyes tired, sighing as she trots in, only to pause. Her blood runs cold and all drowsiness fades in a flash of adrenaline as she sees three ponies in her house. Her assistant, Whiskey Shot, sits and stares blankly ahead, while Bona Fide and another Naval Intelligence Agent sit on her either side. Bons looks up and grins, 'Doctor Kelp, lovely place you've got here. I hope you don't mind a small visit. Take a seat.'\n\n Kelp stands her ground and looks him in the eyes, 'You have precisely five seconds to get out of my house. Do you think Wavebreaker would stand for this? Breaking and entering from the head of NavInt?' Bona smirks softly, 'Fine, don't sit if you don't want to. See, Kelp, you've been a very silly mare these past few years, you've been sticking your muzzle where it doesn't belong. See, you are, if I'm not wrong, the head of economics. It's all you're good for, after all, ever since you let High Tides die, yet, why is it, exactly, that the head of economics is coming to Wavebreaker about foreign policy, hmm? Or about our reformation program?' Kelp snorts slightly, 'If you're here for an assasination, spare me the monologue and shoot me, it'll be your death warrant.' Bona smiles, 'Kill you? Never. Death is wasteful, and even worse than that, it's distasteful. We don't need to kill you.'\n\n The other agent clears his throat, 'Sunshine. Stand.' Whiskey Shot snaps to attention and speaks with a dry tone, 'Yes.' She then stands from her seat, 'Sunshine. Trot to Doctor Kelp.' Kelp watches as her assistant trots towards her, with near robotic movement, her legs tensing, ready to run at a moment's notice, 'Sunshine. Roll over.' Whiskey paused, and then does a combat roll, before coming back to her hooves. Bona stands from the seat, 'I do hope I don't need to make myself any clearer, Doctor Kelp. You have a wonderful mind, don't waste it by opposing us.'"
rustwreck.89.a: "Good evening, Doctor,"

rustwreck.90.t: "Equality for All"
rustwreck.90.d: "Jasmine sits at a table in their suburban style house, carrying a scar across her cheek now, courtesy of a mango colored Steel Ranger who gave her quite the Slice. The radio speaks on the table in front of her, the sultry tones of DJ P0N-3, 'In other news, Wavebreaker, leader of the country once known as Rustwreck, has announced a new initiative in his lands, and all lands that answer to him. According to him, to prevent the greed and corruption prevalent in the old world, he has instituted a nationalization policy of all companies that employ more than thirty ponies or griffons within them. In addition, to prevent hoarding of unnecessary wealth, he's gone ahead and said any pony who has more than five million caps will be taxed at a rate of one hundred percent. Now I'll be honest, ponies, coming from Tenpony, I saw it every day, ponies with too much money and too little to spend it on, and I know that those types of ponies, heh, well, they aren't fighting the good fight. Maybe this isn't as flashy as a Stable pony shooting up Ponyville, but if these caps go towards the poor, the needy, the foals? Well, maybe the good fight doesn't need to be so flashy.'\n\n Jasmine lifts up and sips from a mug of coffee, as the door opens up, as Tea enters in, carrying their little filly on her back, Third Gear. Tea trots up to the table, and looks at the mug of coffee, and frowns, 'Jasmine, are you drinking coffee in secret again? I bought plenty of jasmine tea when I went to the store.' Jasmine looks up, and grins, 'Yeah, but, like, if I drink jasmine tea, that's, like, basically liquid cannibalism, right?' Tea rolls her eyes, and sets Gear down, who giggles, 'I swear, Gear, you had better not ever be as silly as your mother.' Jasmine smirks softly, 'Or do, my silliness landed me the best wife in Equestria.'\n\n Tea rolls her eyes softly, and grins, 'accidentally' knocking over the mug of coffee, 'Whoops, looks like the heretic-juice got spilled, my bad. Now I'm going to make us a nice, big pot of tea. What's on the news?' Jasmine looks at the spilled coffee, 'I will never forget you, mug of coffee.' She then looks at Tea and smiles, 'Well, they're increasing taxes on the rich fucks, which means more money for our little wild child here, and for your school.' Tea frowns, 'Language, Jasmine.' Gear giggles softly, and speaks, 'My old parents used to say stuff like that a lot. So yay! Fuck the rich cunts, give their money to me!' Jasmine snorts, and begins to laugh, while Tea looks on with judgement in her eyes."
rustwreck.90.a: "More for the rest of us!"

rustwreck.91.t: "The Factories Stop"
rustwreck.91.d: "Wavebreaker's hoof crushes a bit of glass under it, as he looks ahead. Fillydelphia, once a great city, now a city under siege. He can hear it now, his marines going from street to street, clearing out Red Eye's loyalists, and aiding any slaves they come across. Body guards surround him, wearing armored dusters and carrying revolvers, while a few aides stand around. His eyes turn upwards, to the Alpha-Omega hotel, where Red Eye was when his infiltrators made their way in. He was in the middle of teaching a class to foals when he was killed. He didn't take his bodyguards with him, thinking nobody would dare kill him in front of foals. Naval Intelligence proved him wrong, and Wavebreaker won't make the same mistake. There's going to be some who come for him too, sometime, and he won't be caught with his guard down, never.\n\n He yawns softly. His dreams have been getting worse, and his sleep interrupted constantly with issue after issue. He's not had time to actually rest in months, the only time he has off, he spends either playing games or venting to Crimson, or sneaking away some of Kelp's secret stash. He's an introvert, after all, he only has a limited amount of energy for other ponies, but he's also a leader, who needs to be there at all times. Now even when he tries to sleep, he won't be alone, he'll be watched over. After all, his safety is more important than his comfort.\n\n An aide speaks from beside him, 'We've been having some issues in a specific area. One of the larger slavers, Chainlink Shackles, seems to have rallied many of the smaller slavers to his side, and they're forcing their slaves to shoot at us. We've sent in the Endtide Marines, but the fighting is going to be fierce, even Captain Jasmine doesn't know if they'll be able to break through. But in other news, Crimson has been working with someone else, Protege, she says he'll help us out.' Wavebreaker slowly nods, and yawns, 'I'll meet with him tonight, sleep schedule be damned.'"
rustwreck.91.a: "No rest until Equestria stands again"

rustwreck.92.t: "Now and Forever"
rustwreck.92.d: "The Memory Orb room, that's what this place has come to be called. Where Wavebreaker, in all his free time, will slip away to, and watch orb, after orb, to learn as much as he can. Now it's cleared of the usual scientists, except the head of the research, as the perimeter of the room is filled with armed guards. The head researcher clears his throat, 'Now, to explain one last time before we begin, this procedure will scan your mind. It will find each and every one of your memories and deem them as either important, or not important, with the latter being memories like eating food or going to sleep. We will then transcribe all the memories we extract onto exactly one hundred and sixty memory orbs, with these orbs, we can then provide your memories to any future leaders. With this, we can ensure that you, well, in a sense, never truly die.'\n\n Wavebreaker nods, but his nod stops as Crimson steps forward, almost always being by his side, in one way or another, 'Wavebreaker, this isn't a good idea.' She looks into his eyes, her own eyes devoid of her usual amusement, her voice missing its usual exuberance, 'Firstly, all those unimportant memories, they're what make you who you are. The moments you spend playing games with me, the small drinks we share, the times you've visited High Tides grave, the books you've combed through and spent hours obsessing over. They're all a part of you, in fact, they're much more of you than your leadership. You aren't a leader, Wavebreaker, not a leader alone. You're a pony, and a friend.' She smiles softly, 'I'll support you whatever you do, but I need to let you know this is a bad idea. You're trying to live forever, Wavebreaker, like High Tides did. But he died, as Celestia died, and Luna died, and every so-called immortal died. No pony can live forever, Wavebreaker.'\n\n Wavebreaker looks at her, and then reaches up, and takes off his glasses. He closes his eyes, exhaustion almost making him fall asleep, 'You're right, Crimson. Tides died, Celestia died, Luna died. You're right. No pony can live forever.' He then reopens his eyes, and slowly slides his glasses back on, 'But I have to. Scientist, let's get this done with, before I second guess myself.'"
rustwreck.92.a: "Begin the process"

rustwreck.93.t: "Clear Skies"
rustwreck.93.d: "'All ships, fire!' The roar of hundreds of guns sounded at once at Wavebreaker's command, towards their target in the distance. New Cloudsdale, and the Single Pegasus Project tower that keeps it aloft, and blocks all the sun from the Heartlands. When the armies came to the Pegasi, they retreated once again, as they always do, but this time the sky won't protect them. Nothing could protect them, no distance could keep his guns from cracking open the sky. A loud crack fills the air, and a shockwave sends the twenty-two ship fleet rocking back and forth, as the sound of the shells impacting reaches them. All sailors stand quietly, many of them looking at Wavebreaker, their eyes unsure, as even he seems to waver in his belief.\n\n But then they see it, bright yellow light streaming through cracks appearing in the gray sky. The cloud cover begins to slowly disappear, and for once, across the Wasteland, ponies would look up and see it. Their birthright. The sunlight. For a moment, all is silent across the Heartlands, factories empty and even the raiders stop in their tracks. Slavers, Pegasi, disgraced Rangers, all turn their eyes upwards, as the grey peels away, revealing beautiful blue behind it. All guns lower and all eyes widen in wonder, as sunlight warms them for the first time in two centuries. Even as the swarms of Pegasi begin to flee their collapsing city of clouds, the sunlight dancing through their feathers, the world remains silent for just a moment.\n\n Then, the cheers begin, not just on the boats, but from everyone. Even the most mad of mutants or the most chem-addled of raiders can't hold themselves back from joining in. Standing on his boat, Wavebreaker stares up. He takes off his glasses, and closes his eyes, letting warm sunlight shine across his face, a few small tears escaping him as he does, the bags under his eyes disappearing for but a moment. Slowly, he opens his eyes again, and speaks softly, 'High Tides, is this what you lost? I'm so sorry. . .'"
rustwreck.93.a: "Equestria, we return the sun to you"

rustwreck.94.t: "Heavy is the Crown"
rustwreck.94.d: "'Wavebreaker, I know we've had our differences in the past, but through it all, I believed you were a good pony. I always did, but I also know you're an idiot. Shortsighted, both literally and figuratively, and you've not seen a single thing your help has done. I've seen you take those Mint-Als, I've seen you drink from my stash, it's blinded you to what's happening. You think you've built utopia, but the truth is, you're just like Red Eye. Freedom at the end of the barrel, security at the cost of freedom, a totalitarian surveillance state. I know you're trying your best, but the truth is, Wavebreaker, you're not good enough. I'm fleeing this dystopia you've built. I know you'll read this over, and I know you'll listen, Wavebreaker. High Tides would have been so, so disappointed in you.' Wavebreaker looks at the final letter Kelp sent him, and sighs softly. He could have stopped her, if he really wanted, but she's a free pony, just a pony who doesn't understand the cost of leading.\n\n Freedom isn't a thing that comes for free, it comes with a cost. Blood, obedience, and security, give those up and you receive everything you could ever want, why couldn't she get that? Sure, Bona Fide might sometimes go a bit too far, but he just wants to do what's best for the world. If anything was wrong, he would have been stopped, after all. Crimson would have stopped him, she would have told him to shut up and listen, it wouldn't be the first time. Yet still, Kelp is a smart pony. Maybe she's right?\n\n The sun rises outside, and Wavebreaker glances over, sighing, another sleepless night. He stands, and slowly trots over to the window. Traders fill the streets, ponies trot from place to place, free from worry. A mare carries her daughter to school, as Captain Jasmine of the Endtide Marines trots beside them. It's a peaceful society, a quiet society, where everyone can be who they want to be, as long as they follow the rules. Wavebreaker steps back, and sighs softly, 'Would he be disappointed? Maybe. He always was disappointed, Kelp. But now? Now, I don't care anymore. I'm not going to live in Tides' shadow, and I won't let you pretend this progress is a bad thing. Equestria is alive once more, and a new Admiral is at the helm. A rock on the shoreline, stood strong even as the waves batter him down. I am the breaker of waves, Kelp. And no matter what comes. . . I'm going to see this through. Good bye.'"
rustwreck.94.a: "The work may end, but through it all, I will stand."

rustwreck.95.t: "Ending 200 Years of Law"
rustwreck.95.d: "'Good evening, citizens of Rustwreck. This is Doctor Kelp speaking, your current interim government leader in the absence of High Tide. For two centuries, our country has been under the rule of Equestrian martial law, laws meant for emergencies, that stripped away the freedom and power of each and every pony, and of a civilian government. Today, that ends, as in five minutes, I, and the newly elected Council, will be signing a law into motion that will bestow power upon this council of elected representatives. Already, we have held a small vote, but nothing close to what will come. After a short period of stabilization, ponies of Rustwreck, I promise a proper election.'\n\n Kelp leans away from a small microphone, and shuts it off, ending her broadcast to Rustwreck. Around her sits a small council, the interim government, with only her, a few members of the Sunrise Development Council, Wavebreaker, with most of the votes of the navy, Crimson, voted in by her Endtide, and Jacques Perrylous, with his previous crew members having canvassed for votes towards him. Kelp nods to everyone, and slides a piece of paper to the middle of the table they sit around, 'With your signatures, Councillors, we will permanently end martial law in our country, and open the way for true democracy.'\n\n Jacques grins, holding up one of his own fallen feathers, and dipping it into ink, 'So you're saying we're interim, think that means we're lasting for a short time, aye, but when will we actually have these elections?' Crimson smirks, only to lean over and pluck a loose feather from Jacques herself, smirking more as the griff squawks, 'He brings up a good point, the martial law was also supposed to be temporary, but it lasted two hundred years. How do we know this isn't just you trying to become a dictator?' Kelp shakes her head, and takes a small sip of her whiskey, before placing it down, 'If I endeavored to become a dictator, I wouldn't be ending this law. The interim government shall last until we have stabilized the country to immediate foreign threats, and until we have ensured properly safe and secure secret ballots for each and every pony, and other creature, within our borders.'\n\n After a moment's consideration, both Jacques and Crimson sign the paper. Wavebreaker trots over, clicking open a pen as he does, 'I question this idea of democracy, Kelp, but I'll agree to it.' He then signs the paper, and with a majority of signatures, martial law has ended in Rustwreck."
rustwreck.95.a: "A new beginning"


rustwreck.96.t: "Emissaries from Rustwreck"
rustwreck.96.d: "Whiskey Shot's a mare who's never been very far from Rustwreck, away from the smell of rusty metal and the salty sea air, so to say the sterile environment of a Stable was odd for her, well, that would be an understatement. Whiskey sits in a small meeting room, with the three most important mares in Stajniopolis, Overmare Stable Way, Doctor Phial, and Trailblazer, the last of which is currently talking the ear off of Whiskey, 'I hope you're enjoying your stay, since you smell pretty bad, so you're probably from someplace that smells pretty bad, but it smells good here since we have good water purification systems, so maybe the rest of your country could come and get clean sometime! Oh, have you considered maybe joining my campaign to be elected Overmare, I'm always looking for help, and you look like you'd be great for helping!'\n\n Stable Way clears her throat, 'No advertising your campaigning to foreign dignitaries, Trailblazer. We have more important business to discuss. Miss Shot, is it? We have read over your proposal, courtesy of the one you call Doctor Kelp, proposing an alliance. As we are all the main runners for the next election, I believe it is only proper for us each to say what we like, and what we don't like, before we come to a decision. Doctor Phial, if you would.' Doctor Phial glances over at Stable Way, and then back at Whiskey, 'I strongly encourage this alliance, as I feel both of our countries have shared and similar issues related to the relative strength of our militaries to our civilian population and governance. I believe that, together, our civilian branches will be strong enough to prevent any potential coups, and the destruction that would come in its wake. Furthermore, I believe that you can help us rebuild the ruins that are Freeside.'\n\n Trailblazer smiles widely, 'Oh, my turn, okay, so, Miss Shot, I really want to see your home and meet this Kelp, she seems like she'd be amazing in helping me organize my campaign! You guys say you're going to have elections once you're stable, and you know, there's nothing more stable than a Stable!' The Overmare clears her throat, 'Yes, well, now to me. I do like the idea of, with your help, unifying the region of Freeside under our control, wresting control from the raiders that inhabit it. Yet, at the same time, joining you paints a larger target on our back. Therefore, as Overmare, I believe I've come to a decision.'"
rustwreck.96.a: "Splendid Idea"
rustwreck.96.b: "That's too much of a gamble"

rustwreck.97.t: "Foundation of the Sunrise Accord"
rustwreck.97.d: "Trailblazer, the bright eyed reformist of Stajniopolis, trots into the Interim Council with a smile brighter than a Balefire blast. She smiles even more, 'Good morning Councilor Kelp! Oh, and Councilor Wavebreaker! Hi there Councillor Crimson!' She then gasps as she looks at Jacques, who's currently looking down at a book, 'Oh my Celestia, is that an actual Griffon?' She bounces over towards him and smiles, 'Whiskey Shot told me you spoke Prench slash Aquilean, I learned some on the way over! Puis-je toucher tes plumes?' Jacques blinks, and looks up from his book, and over at her, 'Did you just ask to touch me? I. . . You know what, oui, for the alliance.' Trailblazer grins widely and pats the top of his head, 'Tres soft!' He rolls his eyes, 'That's a butchery of my language, mademoiselle.'\n\n Behind Trailblazer trots in Whiskey Shot, who was sent to negotiate the alliance with Stajniopolis. Unlike Trailblazer, though, her mane is ratty, she has a few cuts on her, and a bit of her mane is scorched. She trots up to Kelp, and then collapses into the chair next to her, 'We went through Speedfreaks territory. She killed fifty of them, alone. Don't fuck with her, boss.' Kelp blinks, and then looks at Trailblazer, who is still trying to pet the Griffon, and she blinks again, 'Huh.' She then clears her throat, 'Miss Trailblazer, apologies for interrupting you, but I believe it prudent that we do not waste time petting griffons, and instead, we get to what we're here for.'\n\n Trailblazer smiles, and pulls her hoof away from Jacques, much to his relief, 'Right!' She reaches into a saddlebag and takes out a piece of paper, setting it on the table, 'The Sunrise Accord, as signed by Overmare Stable Way, Doctor Phial, and me! All it needs is for your signatures and our nations' fates shall forever be intertwined!' With no time wasted, the various Councillors sign the paper, and as the last signature, Jacques, goes on the page, the alliance between Stajniopolis and Rustwreck is forever enshrined."
rustwreck.97.a: "The future looks bright"

rustwreck.98.t: "A Polite Rejection"
rustwreck.98.d: "'Good morning, Doctor Kelp of Rustwreck.\n\n It is with my deepest apologies that I write to inform you that we of the nation of Stajniopolis have decided, after careful consideration, to reject your proposal of an alliance. While it is true that this alliance could have many benefits for us both, we must also acknowledge that we are a country stood on a shaky foundation. You promised us Freeside if we joined you, but we know too well that stretching one's borders too wide is a recipe for disaster, especially for us. We also acknowledge that you promised economic integration, and while we will still gladly accept any traders you send, the economy of our nation is for our nation alone to control, not you.'\n\n Thank you, signed, Overmare Stable Way, Doctor Phial, Miss Trailblazer."
rustwreck.98.a: "Darn"

rustwreck.99.t: "In Lighthouse's Shadow"
rustwreck.99.d: "Fritter looks behind him nervously as he approaches a lighthouse, on the coast of Light, but he sees nopony following him. With a nervous breath, he opens the door into the lighthouse, and enters inside, where half a hundred ponies already wait, along with a Griffon. A few of them draw guns, but they're stopped by a raised talon, as the Griffon speaks, his voice an odd mixture of Equestrian sailor and Aquilan, 'Welcome, Monsieur Fritter, I am glad you were able to make it. Were you followed by anyone?' He looks to the Griffon, and shakes his head, 'No, Mayor Doughnut seems to not even know you're here, none of the enforcers from the Ringers do either.'\n\n Jacques smirks, and then reaches into his coat, dark blue in color, taking out a bottle of rum, with him pouring a few drinks for the surrounding ponies, 'Don't call him Mayor, he hasn't earned that title. Mister Doughnut is a puppet, a Mayor, well, a Mayor is chosen by the people he looks over. You don't have a Mayor right now, but soon, with my help, you'll have one.' Fritter nods after a second, and sits amongst his fellows, revolutionaries and dissidents, not the type a secretary like him would normally hang around. He slowly takes one of the glasses of rum, and sips it, 'Umm, Mister Jacques, I think I speak for everyone here when I ask this. Why are you here, and what do you really want?'\n\n Jacques smirks, looking into his eyes, before lifting his own rum, taking a swig, setting it down, 'Democracy, that's what I want, true democracy, with the liberty, fraternity, and equality that every person deserves. A long time ago, my homeland held those three ideals close, but then an empire came and crushed our dreams. We called for aid from the north and south, those who claimed to hold freedom, but they didn't answer. My home, Rila, was destroyed under the jackboot of a monarch, like Light is being stomped under the well-polished shoe of the mobsters. Liberty, the freedom to choose your leaders, fraternity, the freedom to live amongst those who see you as a brother, equality, the ability to live without fear. I want this for every creature in the wastes, be they griffons, or ponies, secretaries, or Alicorns, and tonight, Fritter, tonight you all seize your freedom.' He smirks, 'Look to the coast in three days, the Stableside will arrive, with guns, and bullets, and bombs, and you, mes amis, shall grab your freedom with force! To the Light Revolution, to the fraternity of all freedom loving creatures!' He raises his bottle, met with cheers of those around him, 'Vive La Révolution!'"
rustwreck.99.a: "Two can play the subterfuge game"

rustwreck.100.t: "From Petershoof to Vanhoover"
rustwreck.100.d: "Kelp and Wavebreaker stand side by side as they look out over Rustwreck, the city more alive than its ever been before. Down below, the market thrives, a mare from the Commonwealth sells bread, the Builder's Guild of Neocastle sells building supplies, a stallion from Atzlan sells bananas and argues with the desert traders of Trotsas who sell pepper and silk. In the distance, a ship from Portshoof carries with it the finest alcohol in Equestria, and down the road come Rain Riders in cars loaded down with loot, ready to sell to the highest bidder. Wavebreaker frowns slightly, 'Kelp, are you sure all this free trade is such a good idea? Are we really allowing raiders to sell their loot here? Chems? Gun dealers?'\n\n Kelp looks down upon the city, and smiles faintly, 'The raiders will steal no matter what we do, it is better that we profit from them than allow for their loot to be kept like metaphorical dragons. Plus, allowing them into the market means they might learn some of our ideals, give it a few years, and maybe a few of them start wanting their own democracy, maybe they want to produce goods, instead of stealing. But that's up to them.' She smiles more, 'Rehabilitation centers for the addicts to chems, Wavebreaker, it's better to educate ponies and treat them as patients, not as criminals, just because they used some chems. It's not our place to tell ponies what they can put in their bodies. Guns? We can open shooting ranges where retired marines teach those interested how to shoot them, and how to keep care of their guns. Give it a few years, and we'll have a militia ready at all times to oppose any enemy that tries to attack us. When every pony knows how to shoot a gun, you keep the raiders, the slavers, even the Rangers away.'\n\n Wavebreaker looks down at the market for a second, feeling a sudden bout of tiredness over him, 'That makes sense. The same as everything you do, even if I find fault, you manage to explain it, and it makes sense. But I can never understand it unless I hear it from you, all this, civilians, economics, I just don't get it.' He pauses, and then looks over at Kelp, 'The elections are coming up soon, I know that. I'd like to decline the chance to run, Doctor Kelp. All of this is just too much for my brain to handle, and I'm going to be far more comfortable leading marines, than leading civilians.' Kelp nods softly, and smiles, 'You have your niche, Wavebreaker. I think High Tides would be proud of you, to finally decide on what it is.' He nods, 'I wish you good luck in the elections, Kelp.'"
rustwreck.100.a: "Prosperity knows no borders."

rustwreck.101.t: "Election Day"
rustwreck.101.d: "Mare and Griffon sit together in a small office, enjoying a glass of rum and a glass of whiskey together, 'So anyway, there my Ensign was, and we're looking out to the coast, when we see this big fucking beast, looked like some chimera creature of fused together griffons and ponies, absolutely disgusting. The creature spreads its wings, right, and so we look at each other, dreading the fight to come, but before we could even shout out to prepare for battle, boom! Our gunner launched a high explosive round right at the thing, and it exploded high in the sky, guts and blood and entrails flying out, looked like a firework!' Kelp snorts as she listens to the story from Jacques, taking another sip of whiskey. Yet despite her calm exterior, one of her hooves keep tapping the ground anxiously. A tick, she has them to keep herself calm, whereas Jacques, it seems, he just talks to keep himself calm.\n\n Kelp clears her throat, before he goes into another story, 'I apologize for interrupting, Jacques. I'm just curious about something. So, of course, Wavebreaker dropped out of the election after a talk with me, but Crimson, she decided to lend her support towards you, and endorsed you. Why?' Jacques pauses, and shrugs, grinning, 'I plan to ask her, but I think you misjudge her, Kelp. You see her bloody exterior and think she's a maniac of some sort. Me? Well, I know what it looks like to be bullshitting every day of your life, believe me. I sailed a sinking ship for near ten years of my life, and I had to pretend every day like I knew what I was doing.'\n\n Kelp nods softly, and then speaks again, 'I hope most actually vote and don't choose to abstain. I'd like to take this moment of uncertainty to say something, Jacques. I do not agree with some of what you say, I find your rhetoric to be aggressive, and some of your ideas are too idealistic for me. But should you win, I will not question it for a moment.' He looks at her, and leans back, lifting up his glass, 'Same, mademoiselle Kelp, I think you don't go far enough in some areas, but you are a good leader. Should I lose today, then I'll follow lock-step with you until the next election. Either way.' He grins, holding out his glass, 'Come tomorrow, when the last vote is counted, one of us will be drinking for the last time in a while, so come on, Kelp. To democracy!' She takes a second, before nodding, clinking her whiskey against his rum, 'To democracy, and may the best creature win.'"
rustwreck.101.a: "Dr. Kelp wins!"
rustwreck.101.b: "Jacques takes the vote!"

rustwreck.102.t: "Doing Away With Distractions"
rustwreck.102.d: "Kelp trots a bit unsteadily into her home, with a small headache in the back of her head. She's spent the day at a banquet, held to celebrate her victory in the elections, with her needing to say hello to every important pony who wanted her attention, killing her introverted mind. Plus all of the alcohol, that doesn't help the headache, or the stumbling. After a bit of fumbling with her keys, though, she finally enters into her home, closing the door behind her and meandering into her kitchen. She pauses as she enters, looking at a cabinet, filled to the brim with whiskey, and at the bottom, a vintage wine gifted to her by Wavebreaker. She pauses.\n\n Memories flash through her mind unbidden, of hangovers, of every time she's tasted the sweet warmth of whiskey, of her studies long ago. Of her failures. Of High Tides' catatonic corpse. She sniffs for a second, and whispers softly, 'Alcohol reduces reaction times, it decreases inhibitions, Kelp. It's like she said to you. Can't find answers at the bottom of a bottle. Can't find success. Can't find cures, or love, or the way to save the world. And you didn't listen. And she left, and you left, and you failed, and you killed him. Because of negligence. Because of weakness. Can't find a cure for being feral, can't find it while drunk, while stumbling and while your head pounds. Can't find it, Kelp. You can only find failures, and failure is all you'll be with a bottle in your hoof.'\n\n She frowns softly, and slowly trots up to the whiskey cabinet, looking at it, and then looking at the sink next to it, 'I've failed too many times. But ponies trust me now. They chose me to lead them. Will I stumble into darkness, inebriated on this poison? Will I fail them, like I failed him?' She growls, and grabs a bottle, ripping the top off, pouring it down the drain, 'No! I'm not going to fail anymore, no more disappointments, Kelp!' She grabs another bottle, emptying it right down the drain, 'No more mental blocks, no more poison, no more doubt!' She grabs another, 'No more running away and hiding.' She then looks at what remains, the gift Wavebreaker gave her. She takes it, and takes off the cork. For a moment, she wants nothing more than to just taste it. Then she turns it over, and poison colored the same red as blood flows down the drain, as the headache slowly subsides, 'No more distractions, Kelp.'"
rustwreck.102.a: "Goodbye old friend"

rustwreck.103.t: "Party Like It's 1007"
rustwreck.103.d: "Jacques stands on the Stableside, the old ship he sailed on, and leans against a railing, looking down below, as his crew dance along with many who voted for him. Endtide ponies bearing food, old sailors bringing rum and tales of times long since gone, new sailors and bushy-tailed bright-eyed civilians, with an energy more infectious than smallpox. Jacques grins slightly, looking at a bottle of rum in his claws, 'Ah, mon ami, j'adore tu, j'préfère tu, je dis au revoir, et merci.' He then lifts the bottle of rum, and in a single smooth motion, throws it off the side of the ship. The motion catches the attention from those below, and eyes turn to face him. Old eyes, familiar eyes, young eyes, curious, nervous, yet all are filled with hope. They watch, and he spreads his wings, flapping them once, to land in the middle of the deck, his old crew rapidly coming to his side.\n\n He spins around, and grins, looking at the gathered crowd, 'Once! Once upon a time, mes amis, there was a place in the world, a place filled with hope! Gaudreau, Vérany, Cru, Allard, brave ponies and griffons who looked at the injustice of the world, and instead of backing down, they said no! No, mon ami, no, mon roi, I shall not sit idly by! No, to the tyrant, no, to the fascist, no, to the monarch, and no to the despot! No, I shall not give you my soul, no, I shall not give my freedom, no, I shall not be your slave! Today, my friends, today that hope is revived on another coast, and today, the dream still lives!'\n\n The crowd cheers around him, while he flaps his wings, flying halfway up the ship, latching onto a rope and looking below him, 'You call me Prime Minister, but you shall never call me your master! You answer to me, and I answer to you, for every day here on out! Liberty! You shall choose your leaders, and they shall listen to the popular will! Fraternity! It doesn't matter if you have horns, wings, beaks or claws, you are the same! Equality! The poor and rich are the same, subject to the same laws, and all shall live happy! Together, no matter your background, no matter your religion, or your age, we stand together! Long may the dream of freedom live! Vive La Révolution!' His shout is matched from below, 'Vive Jacques!'"
rustwreck.103.a: "Three hurrahs for the future!"

rustwreck.104.t: "Movement for Democracy"
rustwreck.104.d: "It's not news that our neighbor, Rustwreck, has become a republic rather recently, and unlike many of the other republics in the world, they're one that actually has fair votes and resources to spare. Of course, this has caused issues for us, since it's hard to hide behind a fake democracy when you have one right next door. Even more annoying, Rustwreck has been using its resources to funnel supplies and aid to our poor and vulnerable.\n\n Of course, if we let them continue, they could radicalise the population, and we could have a revolt on our hooves. At the same time, though, they are aiding our citizens, and are, in a way, saving us money. Of course, we could try and throw them out of our country, but that wouldn't look good to a lot of ponies, since they've now revealed our lacking support for the worst-off among us. Either way could cause an issue, but we've got to decide."
rustwreck.104.a: "Let them agitate"
rustwreck.104.b: "Throw them out now!"

rustwreck.105.t: "[PREV.GetNameDEF] Accepts Democratic Outreach"
rustwreck.105.d: "Dear Prime Minister of Rustwreck:\n\n After a long period of thought about your so called 'democratic outreach program', we have come to a final decision. The benefits this program provides are, quite frankly, too good to turn down. We accept your offer happily, and we hope that this program will lead to further cooperation between our countries.\n\n Thank you for the offer, and we hope the program is as successful as we hope it will be."
rustwreck.105.a: "Wonderful!"

rustwreck.106.t: "[PREV.GetNameDEF] Rejects Democratic Outreach"
rustwreck.106.d: "Dear Prime Minister of Rustwreck:\n\n After a long period of thought about your so called 'democratic outreach program', we have come to a final decision. Simply put, the benefits brought by this program are not enough to compensate for the loss of sovereignty that it would bring. Contrary to your seeming belief, we are not a subject state to you, nor are we a province of Rustwreck, we do not answer to you, and we never will. This program is nothing more than a poorly disguised attempt at imperialism over our country.\n\n Thank you for the offer, but next time, shove it up your ass instead."
rustwreck.106.a: "How short-sighted"

rustwreck.107.t: "The Call of Freedom"
rustwreck.107.d: "Democracy, it's such a loaded term. Ask the NCR what democracy is, and they'll tell you it's voting for Gawd, ask members of The Republic, and they'll tell you it's living a righteous life, free to choose the path ahead. Yet in Rustwreck, it meant the ability to choose your leaders, and that definition of democracy has spread like a poison, a corruption, into every country who has so much as touched Rustwreck.\n\n They came weeks ago, offering us an outreach program, they said they would aid us, and help us. But it was nothing more than a front for them to spread their subversive, destructive ideology through our country. Now, ponies march down the streets, and they shout in enraged voices. Democracy. Freedom. Votes. The military can only do so much against the popular will, and soon enough, they will be here. Outside, we can hear the voices sing, come to throw off the yoke from those above them.\n\n Now, there is only one choice to make. To give up willingly, and hope they will take mercy upon us, or to fight until the last light of liberty is smothered under the marching boots of our soldiers. To go willingly, or to resist against the dying of our power."
rustwreck.107.a: "Freedom!"
rustwreck.107.b: "We can't risk revolution"

rustwreck.108.t: "With Friends Like These"
rustwreck.108.d: "For months, every day Kelp went to sleep, she remembered. The screams of pain. The last glimmering speck of hope. The spark of life that High Tides once carried. For months, she's tossed and turned at night, thinking of her failures, not just him, but them all. She's gone to her whiskey cabinet again and again, only stopped by the lack of anything there. But today, she slept well. Today, her throat isn't parched, and her head doesn't throb from the lack of a drink. For once in her life, she sits, and doesn't try to run away, or hide at the bottom of the barrel.\n\n She watches as Wavebreaker sits to her left, finishing the last of his report, acting as the Minister of Defense. She watches as he finishes, as Crimson speaks, 'Ah, I forgot my pen, alas, what ever will I write with?' She watches as Crimson, now her Minister of Economics, plucks a loose feather from Jacques. Jacques, now her Minister of Interior, squawks at her, 'Stop doing that!' Crimson chuckles, 'You're a bird, you're supposed to preen loose feathers, you should know this.' Wavebreaker looks up, 'You know I'm carrying a pen, Crimson, you can just ask for it.'\n\n Kelp smiles, and then sniffs, reaching up to rub her eyes. The noise stops the others in their tracks, as they turn to look at her, Crimson speaking first, 'Are. . . Are you crying, Kelp?' Kelp smiles, and then chuckles, shaking her head as tears roll down her cheeks, 'It's not sadness, Crimson.' Wavebreaker clears his throat, 'I could get you some tissues, if you want.' Kelp smiles even wider, 'No, no. I like this, I don't need anything.' Jacques looks at her, speaking the last of those three, 'In withdrawal from your whiskey?' Kelp snorts softly, and laughs even more, 'No, no, actually, I came out of withdrawal symptoms today. It's just-' She takes a second, and wipes her eyes again, looking at all of them, 'I feel happy. To think that just a few years ago, we all, well, not you Jacques, but us three were at each other's throats in pandemonium. Now here we are, and we care for each other.' She takes a second, and smiles softly, 'High Tides would have loved to see this. His best student in his element, Crimson doing something other than monologues, and a Griffon, a complete stranger, no less, bringing in hope. And me, smiling.' She smiles even more, 'I love you all, you. . . You're all the only friends I've ever had. And I'm happy.'"
rustwreck.108.a: "Maybe we really can make this world better"

rustwreck.109.t: "A New Lease on Life"
rustwreck.109.d: "Oil Can lays underneath a car, repairing the suspension to it. He's always been good with tools, at least, as far back as he can remember, but he can't remember very far back. Just a few months, when he woke up in a Rustwreck clinic, his stomach being pumped due to an overdose. He doesn't really know much before then, other than he once rode with the Rain Riders, and flashes, flashes of memory. The bell to the door of his shop rings, and he slides out from under the car, wiping himself off of grease and oil, 'I'll be there in just a minute!' He trots to the front of the store, where he sees a mare standing, a tiny bit older than him, still young, wearing a smile. But then she sees him, and her face turns sour, and she speaks with venom, 'You?'\n\n He pauses, and looks at her, taking a second, 'Have we met before?' She scowls, 'Have we met? Yes, we've met! You filthy raider, did you seriously forget me? You stole my entire caravan and nearly killed me! You-' She's cut off, as he reaches under the counter, and places a book in front of her, opening it up, 'What is this supposed to be? It's a list of names.' She looks at it, and pauses as she reads it, 'Ponies I've hurt?' He nods and smiles softly, 'I'm sorry if I hurt you. I was a bad pony back then, and I've done a lot of wrong. I just don't remember it, just flashes. I remember some nights I would go to sleep, only to wake up a week later, with a pony dead at my hooves. And I'm sorry, I'm so sorry for that. If you tell me what I stole from you, I'll try my best to repay you, with extra, it's the least I could do.'\n\n She pauses, and looks at the book, and then up at him, 'I-that's, that's oddly reflective for a raider.' He nods softly, 'Ever since Prime Minister Kelp opened up those therapy centers, I've been going every week. My therapist says I've done a lot of harm to the world, and they said that it would be a long path to redemption. He told me making oneself better is the hard way, rejecting betterment is the easy path. That's why a lot of the Riders decided to drive into the river, or do a suicidal charge against the Rangers, rather than trying to improve.' He smiles softly, 'I don't know if I'll ever make up for what I did. But I've lived a life of destruction. That's why I'm a mechanic, so I can fix some of the things I've broken.' She looks into his eyes even deeper, and then looks down, and adds her name to his list, 'I see. There's no need to pay me back, really, I'm fine.' She looks back up, taking a second, before smiling softly, 'I think you're already much better than you were before.' With nothing more than an exchanged nod, she turns, and leaves."
rustwreck.109.a: "The road to redemption is long, and winding."


rustwreck.111.t: "Make Trade, Not War"
rustwreck.111.d: "Two Steel Rangers watch as a ship passes by Bucklyn Cross, filled with marines, keeping the waters safe from any pirates. In its wake are traders, from Friendship City, from Portshoof, even from the far north, come to trade freely with the Rangers. The two Knights sit by a radio, which crackles to life, a voice coming through it, 'Ahoy there! This is Jasmine of the Cute Mare Cruiser, that's the boat which is passing by you, it's a pun since this is the Mare River. Anyway, is anyone hearing me?' One of the Rangers speaks into the receiver of the radio, 'This is Knight Mango Slice and Knight Mango Dice of the Manehattan Contingent, you're free to pass by Bucklyn Cross, we won't stop you.'\n\n Jasmine, on the other side, laughs a bit, 'Oh, no, I know that, that's not why I'm radioing in. See, once this ship gets back to Rustwreck, I'm going to be proposing to the most beautiful mare in the world, her name is Tea, and she loves tea, of course. I'm wondering if you know if this port has any high quality tea you could give me? I can't pay, since we're not going to make a stop, but I would appreciate it.' Dice looks at Slice and comments, 'Another lesbian?' Slice smirks, 'We're soldiers, Dice, we're all lesbians.' She then speaks into the receiver again, 'Roger, Jasmine, reading you loud and clear. Lucky for you, I am also a mare-lover, and a tea lover, I respect the grind, as the foals say. I've got a small crate full of tea bags from the west, they say they have an orange tang to them. Wave us down on the deck.'\n\n Both Rangers watch as a jasmine colored mare steps out onto the deck of the cruiser, with Slice looking at her brother, 'You're up.' Dice rolls his eyes, and then stands. He grabs a crate full of tea, tensing his power-armor covered frame, and in a single massive toss, he throws the tea crate down, right next to the mare. Jasmine looks up at the two Rangers, snapping them a salute, met with two salutes in return, as the soldiers, even if they march under different flags, share a moment of comradey."
rustwreck.111.a: "Happiness is built on prosperity"


rustwreck.112.t: "Rustwreck Seeks Unification"
rustwreck.112.d: "Whiskey Shot was used to the trot from Rustwreck to the now named Freeside Republic. Ever since she brought back the agreement to the original alliance, she has been trusted to bring messages from one to the other, important messages, like she has now. Entering into the familiar halls of the Stable, she finds herself once more in a familiar meeting room, where Phial, Stable Way, and Trailblazer await again. She clears her throat, 'Mares of the Freeside Republic, Rustwreck and you have fought side by side, time and time again. We have helped make each other stronger than ever. With that in mind, Prime Minister Kelp believes it is time for us to work all the closer together. We propose a formal merging of our nations, so that we may pool our resources together. And, of course, this means you will be able to run for the position of Prime Minister in the new republic.\n\n All three mares, the most popular of their republic, look at the proposed offer. Phial speaks up, 'I believe this is a good idea, as it will strengthen both of our countries by a significant margin.' Stable nods and speaks, 'Yet we would give up our sovereignty.' Trailblazer smiles widely, 'Wow, that's so many new voters for my campaign! How could I say no?' The three look at each other, before deciding."
rustwreck.112.a: "Let us join hooves!"
rustwreck.112.b: "We are allies, and that is what we'll stay"


rustwreck.113.t: "[STT.GetName] Agrees to Unification"
rustwreck.113.d: "Down below, ponies celebrate in the streets, a new holiday, Unification Day. Kelp stands on a balcony, watching as ponies, once from Stable 32, and her own citizens celebrate. Even Overmare Stable Way for once is smiling as she plays a game of ring-throwing, her aim being perfect, landing every ring that she throws around a bottle. A stand sells old comic books, where Wavebreaker and Doctor Phial have come together, the two of them trading verbal blows against each other, over the quality of Moon Fights and Space Journey. Others watch the two of them in wonder as they bring up exact quotes and even cite statistics and scientific studies, trying to prove which is better. Then elsewhere, Crimson and Trailblazer combine their political careers and their hobbies, as the two of them surround Jacques. The poor bird is attacked from both sides, one mare petting him, and the other preening his messy wings, yet despite the annoyance, he still smiles.\n\n Kelp stands alone on the balcony, but despite that, she doesn't feel alone. She sees her friends, and she sees their smiling faces. She sees her citizens, well fed, free, dancing to new songs, debating politics, everything a free pony should do. She watches as a former raider lends a hoof to a mare whose carriage broke down, fixing his sins one wheel at a time. She watches two mares snuggle up side by side, sipping tea, while a visiting caravan of Steel Rangers tell tales of combat and action. She's alone, and yet, now, she never feels alone.\n\n She raises a hoof, and all across the city, voices go quiet, and turn to face their Prime Minister. Her aide, Whiskey Shot, offers her a microphone, connected to speakers all throughout the city. And slowly, she speaks, 'Rust is oxidised iron, it makes the metal weak, unpleasant, brittle, and old. When High Tides passed away, this is what Rustwreck was, an inch away from calamity, relying on laws two centuries out of date, ruled by those who still remembered the sunlight. But now, we don't need that anymore. We've built our own laws, we've built a stable foundation, and now, I see sunlight again in this country. I see it in the eyes of everyone I look at, I hear it in their voices, and the joy they carry. No longer is this a land of rust, for we've become so much more than that. I'd like to announce, effective immediately, a change to the name of our country, something far more fitting us. No longer are we a land of rust. Today, we are. . .'"
rustwreck.113.a: "'Sunrise Republic'"
rustwreck.113.b: "'United Sovereign Sunrise Republics'"
rustwreck.113.c: "'Northwestern Council Republic'"

rustwreck.114.t: "[STT.GetName] Rejects Unification"
rustwreck.114.d: "Despite our wishes for unification, it would seem like unification was not meant to be. For now, Rustwreck will remain Rustwreck alone, and our close friends shall remain nothing more than allies. It's put quite a damper on spirits, and many ponies have taken to claiming that our friends must be controlled by some extra-dimensional being who forced them to say no. To them, that's the only thing that makes sense. But regardless of why, the rejection still stands, and Rustwreck stands alone forevermore."
rustwreck.114.a: "Allies they'll stay then"

rustwreck.115.t: "Sleep Well"
rustwreck.115.d: "It's been months since High Tides went catatonic, but despite him being dead, Kelp never had the heart to pull the plug. Today, she enters his hospital room, looking at the body of the ghoul, alive, but not truly living. Her throat feels parched, but she swallows it down, and trots to his side, 'Do you know who my first failed patient was, Tides? My own mother.' She sits on a chair, right next to him, and closes her eyes, 'It was a preventable disease, something that I could have cured. But when she got sick, I got too nervous. When I first tasted whiskey, when I first got drunk, I thought it was taking away those nerves. That was false. It merely made them worse.' She sighs softly, 'I still remember it. She told me before she went under that if I failed, I wouldn't find success at the bottom of a bottle. I put her under, and I began the incision, but my hoof was shaking too much, so I took a shot. Then another. Then I began to cut into her, and everything was going so well. But alcohol decreases hoof-eye coordination, and I lost track of my scalpel for a second. I remember it. The smell of blood as I cut an artery. Watching the color drain from my mother's body. That's why I ran away down here, Tides. I couldn't stand to go to her funeral, when I was the one who put her there.'\n\n She opens her eyes, which are filled with tears, and looks over at him, 'And-and then I failed you too, because I couldn't stop myself from having another drink. Because I couldn't control myself. Because I thought that poison was a cure. And I've kept you alive here for so long, because I couldn't admit that I'd failed you, Tides. And I'm sorry.' She sniffs softly, and stands, looking down at him, 'I wish I was better for you. I wish I was the doctor you needed. You would be so proud if you were alive, because Equestria's back, Tides. Harmony's back, friendship and magic has finally come back. I only wish you could see it again. You gave up two hundred years of your life, fighting for other ponies. You were a hero, Tides.' She wipes her eyes, though tears begin to flow anyway, 'When you had amnesia, right before I tried the cure, you called me cute. Heh. . . I think that, maybe, if I had met you two centuries ago, well. . . no use fantasizing.'\n\n Kelp leans down, to the system that keeps Tides alive. She flicks it off."
rustwreck.115.a: "A brighter future lays ahead."


rustwreck.116.t: "Liberté, Freedom From Danger"
rustwreck.116.d: "Rain pours down softly against a window, nearly broken glass barely holding back the downpour, as two mares sit inside a small shack in Rustwreck. One of them, a jasmine colored mare of short stature, flips through an old book with her muzzle, while the other, the color of tea, prepares tea with only a quarter of a teabag. Jasmine looks up from her book, and sighs softly, looking out of a window, 'Some sort of election, huh? No more need for armed members of the Endtide, not like Crimson even paid us that well to begin with.' Tea trots over and pours some of her drink, which is only faintly tea colored, 'Don't worry about it, Jasmine, we'll find you another job sometime. Then maybe we can get that leak fixed.' Jasmine grumbles softly, 'How am I going to afford a wedding if I have to keep paying for stuff around here?'\n\n Tea smiles softly, 'What's more important, Jasmine, me being happy, or us being alive.' Jasmine blinks, 'Uhh. You being happy, duh.' Tea rolls her eyes, and clips the other mare on the ear with her hoof, 'I wouldn't be very happy if I wasn't alive, smart-flank.' Their conversation would be stopped by a knock to the door. Jasmine stands first, going over to the door, peering out of a peephole, then opening it up. On the other side stands a stallion wearing a purple coat and a red hat, rain sliding off of it. He grins slightly and offers a hoof, 'Jasmine Leaf, isn't it? I am Agent Clear Mind, here on behalf of Prime Minister Jacques.' Tea trots up from behind Jasmine, while Jasmine frowns, 'You look shifty, like you're here to kidnap me or something.'\n\n Agent Clear chuckles slightly, 'Nonsense, though since I don't hear a radio, I imagine you don't have one. If you've been out of the news lately, the Prime Minister has ordered a welfare program for all ponies, to ensure a decent standard of living. Now, you both make a fair enough income, so you don't qualify for any income welfare, but your house is in a lot of disrepair.' He reaches into his coat, taking out a sheet of paper and a pen, 'If you sign here then government contractors will, free of charge, repair your house. In the meantime, you can stay at a local shelter, where we can discuss further welfare programs you may apply for. State-run medical insurance, tax reliefs, and our job searching program are quite helpful.' Jasmine blinks, 'What's insurance?' Tea pushes her aside, and signs the contract, before looking up, smiling, 'Ignore her, we'll take it!'"
rustwreck.116.a: "Freedom from fear, for all"

rustwreck.117.t: "Liberté, Freedom of Thought"
rustwreck.117.d: "Rustwreck's school was never the nicest place, usually only housing a few disinterested rich foals, whose parents didn't need them to work, or a few poor foals on their days off. It had rusty walls, being built out of the scrap of a cruiser, and only had a few rooms, and even fewer teachers. Now, however, it couldn't be any more different. The walls are painted bright colors, with murals of green grass, rainbow, and sunlight, clean windows glimmering with the grey sunlight of the outside, an actual chalkboard, comfortable desks, actual books. The place might still smell like rust and sea salt, but everything does in Rustwreck.\n\n Tea stands in front of a full class of students, now able to attend due to their parents having proper welfare, with her smiling, 'Now, class, today we will be talking about Equestria, and the different political philosophies around during the war, and before. There were three main throughlines in modern Equestrian politics, being Marksism, Harmonism, and Republicanism. Marksism was an ideology that took over the north-eastern edges of Equestria, it championed the rights of workers, and called for a worldwide revolution. However, the north-eastern revolution was short lived, as Luna marched in and crushed them. Harmonism was the benevolent ideology of Luna and Celestia, a system that, while monarchical and dictatorial in nature, ensured its citizens were happy, and usually they kept the powers of the monarch under checks and balances. Finally, Republicanism was a fringe ideology which originated in Griffonia, where two revolutions, in Cloudsbury and Aquila, set up republics similar to what we have today. However, its popularity faded quickly, due to the Griffonian Empire conquering Cloudsbury, and nearly conquering Aquila, with the only ponies who held Republican beliefs being in Prance, reading Aquilian texts.'\n\n A foal raises his hoof, and speaks, 'So why are we a republic if it failed in the past?' Another foal retorts quickly, 'Because we deserve the right to choose, that's what my pa says!' Another colt speaks off to the side, 'I mean, I think I might like harmony better, I don't really trust myself to make those types of choices.' Another foal smiles, 'Oh, my mommy read some Marks, I really liked it!' Tea smiles, holding up a hoof, 'Okay, okay, that's enough, foals.' She smiles even wider, 'This is why we are a republic, specifically a democratic republic, because ponies have different beliefs. And one day, when you all are old enough, you will be able to form your own opinions, and try to convince other ponies. You can run for office as a Marksist, or you could be an activist for Harmonism, or you could believe in republicanism, but that's your choice. My job isn't to tell you that you should be one or the other, because in a democracy, that's your choice to make. I just have to make sure you all know the history behind them. Now, let's go onto the more fringe ideologies, like Posadism.'"
rustwreck.117.a: "Freedom to think, for all."

rustwreck.118.t: "Liberté, Freedom Of Choice"
rustwreck.118.d: "Jacques relaxes in his office, enjoying a rare moment of rest in his life. In his claws, he holds an envelope, kept pristine and white, flipping it around to read the text on the other side. 'Mon Fils, Jacques'. As he looks at it, the door opens up, as Crimson trots inside, grin on her face, mane combed off to the side, looking much cleaner than she normally does. She trots closer and grins even more, 'Hey there, Jacques, I was thinking we should talk about the idea you proposed. About local representation.' She loses her grin a bit, though it still remains, slightly, 'Look, I get you like democracy, and I think it's pretty cool too. Honestly, if I took over instead of you, I would have likely made a republic too. But this democratic local representation, I hope you know this is going to backfire. If they elect ponies who oppose what you want, they'll try and muck up the system, block welfare from going through, try and prevent votes, they'll try and rig this next election against you. I get your ideals, really, I do, but this is just a disaster in the making, either they'll prevent your goals from being done, or they'll replace you.'\n\n Jacques nods, and smiles, 'Mmm, oui, but that's the risk I'm willing to take. I promise liberté to each and every creature in this republic, and it's not exactly very free if I, like a dictator, decide local governors, or mayors.' He smiles, 'May they disagree with me? Yes, in fact I know they will. But the local population is just going to look at the cities who do agree with me. They'll see how they're better, see how they get aided more, and then they'll turn against their leader, and replace them. Democracy at action, Crimson, if you don't like your leader, you replace them. And if they don't like me, then they can try to replace me.' He sets the envelope down on his desk, 'In a century, Crimson, long after we've died, we want to make a system that will survive, not just survive, but thrive. I don't like my ideals just because they're good, but because they're effective. If I act like a dictator to install governors and mayors, then whoever replaces me would do the same, until someone comes along with bad intentions.'\n\n Crimson frowns slightly, before she slowly nods, 'I guess. I'm just worried, I've heard members of the Endtide speak about their welfare, how much better it's made their lives. I don't want that to fade, but I trust you.' She then pauses, and looks at the envelope, tilting her head, 'What's with the letter?' Jacques nods, taking the envelope, 'It's from my parents, my Griffon parents.' Crimson nods, 'What do they say in it?' He smiles softly, and places it in a desk, before closing it, 'I do not know. I've never read it, and I never will. Not until I build a society I know they would be proud of.'"
rustwreck.118.a: "Democracy, for all."

rustwreck.119.t: "Fraternité, Freedom From Discrimination"
rustwreck.119.d: "Miss Melody, a thestral wearing a flowing purple dress over her form, trots into a meeting room. Inside, awaiting her, is Jacques and Crimson, along with an older Pegasus stallion, Radar. Jacques smiles as she enters, 'I hope your travel from Marelem was not too hard, Mademoiselle Melody, and with you, Monsiour Radar.' Miss Melody takes a seat across from him, speaking in a quiet, refined tone, 'Under the cover of Luna's blessed dark, never could harm come to me. But please, Miss Melody is my name, it is not a title.' Jacques smiles, 'My apologies, Miss Melody. Now, I would like to start off with a small acknowledgment, of course. Neither of you are citizens of Rustwreck, you, Radar, and you, Melody, are from Friendship City and Marelem respectively.' Radar nods, 'Yep, but from what I remember of that letter you sent us, you said you wanted outside perspectives, right?' Jacques nods, and smiles, 'Yes, being Prime Minister means if I picked a thestral or Pegasus citizen of my own nation, it would lead to some bias on their part. You both are from elsewhere, and that means less bias.'\n\n Miss Melody nods, 'Verily. I shall make my position clear, Sir Jacques, though I may not be a citizen of your fair realm, I extend my heart to all thestrals, like Luna above, for they are my people, as they are hers, and I express her will. Discrimination against thestrals is not as simple as equal treatment under your laws and codes of conduct, Sir Jacques, because we have a history of harsh discrimination against us for more than our leather and darkness. During the dark time, when Luna watched us from her blessed sanctuary, we were discriminated against, for ponies thought Luna was the demon who corrupted her. If you wish, truly, to make thestrals equal in your land, you must start by protecting our very beliefs.' Radar speaks up, 'Pegasi aren't that complicated compared to all that. Just remind ponies that we weren't the ones who fled above the clouds, that was my great-great whatever grandfather. I'd recommend just promoting some Pegasi to high positions and let that do the work.'\n\n Crimson speaks up, off to the side, and grins, 'Miss Melody here brings up a good point, you know. Ponies should be free to believe whatever they believe, be that Luna, or blood, or whatever. Freedom of thought, and all that.' Radar nods, 'Yeah, I might not believe in much myself, but still better to include others.' Miss Melody nods simply, 'Verily, my people shall be very pleased if you protect our believers.' Jacques nods along, and then smiles, 'Well, how could I say no? Of course, religions will need to not break any laws, but as long as they don't do actions which break laws, well, c'est la vie. Freedom of religion, freedom from discrimination, classic combination.'"
rustwreck.119.a: "Discrimination, no more."

rustwreck.120.t: "Fraternité, Freedom From Supremacy"
rustwreck.120.d: "'Bonjour, everyone, this is your Prime Minister, Jacques, speaking. I do hope you all are having a fine day, be you in Rustwreck, or elsewhere, listening in. I would like to start this broadcast off with a history lesson. Two centuries ago, my home, Rila, was part of a republic much like this one, Aquila, where true freedom reigned. However, the Griffonian Empire, monarchists of the most evil sort, after crushing the only other torch of freedom on the continent, saw fit to try and come to crush us as well. We were slowly pushed back, and so we sent a call for aid south, to a land called Wingbardy, who had a parliament, much like us, and hated the Empire, much like us. But in our hour of need, our so-called brothers betrayed us. They sent no aid, and merely sat back to watch as we fought. For you see, Wingbardy was poisoned by an ideology, fascism. An ideology that told them that they alone were better than all others in the world, an ideology that destroyed the brotherhood of nations, and replaced it with selfish, greedy betrayal in the darkest of hours.\n\n Wingbardy, I'm afraid, has never died, citizens. Now, instead, the poison of supremacy, of national unity over brotherhood, lives elsewhere, the Grand Pegasus Enclave. A bunch of cowards living in clouds, denying us sunlight, who claim they are the only true republic in the Wasteland. To that, I say, no! I hope you listen to me now, Enclave, for I see through your lies. What sort of republic runs away when the world needs them most? What republic shoots those who fly too high? What republic is it that bars their gates to the needy? What republic is it that engages in racial supremacy? What republic is it that bombs the homes of innocent griffons, day in, day out!\n\n You, Enclave, give Pegasi a bad name, for Pegasi, like all creatures, are fundamentally decent, yet you poison them, and then offer a cure that you call racial supremacy. I do not care if you should come here with offers of kindness! If you should come with bombs and lasers! If all the armies of the skies were to descend, I would not turn my tail and run, like you did! For you are a false nation, a false republic, for you are the killers of my home! I don't care how long it will take, but I will find my way up there, Enclave, and we will bring true freedom to you, like you've never known. Let the innocent rejoice, and let the guilty fear, Grand Pegasus Enclave, for soon, your time will come!'"
rustwreck.120.a: "Trust not the snake, for they hide poison."

rustwreck.121.t: "Fraternité, Trust of Leaders"
rustwreck.121.d: "A collection of soldiers sit together in a room, of all shapes, sizes, and colors, taking a small break from their duties. One of them, Quickie, speaks up, her voice coarse, 'I can't believe Officer Brown Muzzle didn't let me drink anything yesterday, I was almost dying by the end of watch.' Another soldier nods, coughing a bit, before he, Tide, speaks, 'Yeah, not to mention he constantly runs useless training exercises.' To his side, Splendid speaks up with a small smile, her smile making the room a bit brighter, 'Well, you know, that gives me an idea. The Prime Minister has spoken a lot about how democracy needs to be on every level, right? Why don't we just approach him with a petition? Maybe we could vote for a new officer, since Brown is so bad.'\n\n Stickie, an older stallion, coughs off to the side, 'Vote for a new officer? That's not how any of this works. The military is based on merit, not democracy.' Another soldier, Base, snorts, 'You call Brown merited? He hardly even knows what side of the firing line to point towards the enemy. Let alone what a kill zone is, or covering fire. He just paid off some upper officer.' Resistance, a younger stallion, pushes up his glasses, 'We shouldn't do this anyway. If we do this, then every other unit in the military might want to do it too.' The final member of the squad, Charge, speaks up, jumping on top of her chair, 'We need to do this! If we do this, then every other unit in the military will too! We'll be famous, we'll be loved, and we all actually know what we're doing! I'd trust Stickie to know tactics far more than Brown!'\n\n Splendid smiles, and stands as well, 'I can begin to write the petition, all we need to do is get enough signatures from other squads, and maybe Jacques will accept it! Come on, even if you disagree, you have to know that Brown is just gonna get us killed!' The remaining members of the group look amongst themselves, before in comes a chorus of 'aye's."
rustwreck.121.a: "With a signature, the military is democratic as well."

rustwreck.122.t: "Fraternité, Paradox"
rustwreck.122.d: "Crimson and Jacques sit in his office, with Jacques looking over a piece of paper, tapping his talons on the table. Crimson speaks up, 'Those Talons, Jacques, even you have to admit that they might be too much to try and cater to. Those Neugreifenland griffs, they speak about reviving the Empire. Isn't that the place that destroyed your home?' Jacques frowns slightly, 'Oui, I am aware of that, Crimson. Do you think I didn't think about that?' Crimson looks at him, and nods, 'I know you did, and I know it's a touchy subject. But it's the subject at hoof.' He sighs, and leans back in his seat, rubbing his eyes, 'I can't just stamp down on them or try to force my views on them, Crimson. What sort of republic stamps down on the views of those it disagrees with?'\n\n Crimson takes a second, before speaking, 'Jacques, you spoke before about Wingbardy, and it's fascism, I think you called it. Something so fundamentally opposed to what we're doing here. You said you would put the guilty Enclave on trial, to prevent their poison from spreading. I'm sorry, but these griffons are the same, they hold themselves to be superior, they think your ideas are a joke. They're never going to take us seriously, not for another three generations at least. Can we afford that? We're young, Jacques, we're unstable, we don't know what's going to happen after the next election. Do you want to take the risk that they will undo all the work we did? That they'll get rid of our tolerance? Destroy the fraternity you've tried to build? These aren't just different ideas, Jacques, they're incompatible ideas.'\n\n Jacques frowns even more, 'Damned if I do, damned if I don't. If I force them to agree with me, to 're-educate' them, then I've become a fascist myself. Intolerant of the ideas of others. But if I don't, then they could destroy us.' Crimson reaches forward her hoof, resting it on top of his claws, 'Jacques, nobody said leading would be easy. No system is perfect, either. What's more important to you, Jacques? Your ideals? Or keeping this system alive?'"
rustwreck.122.a: "Stability."
rustwreck.122.b: "Ideals."

rustwreck.123.t: "Fraternité, Brotherhood of Nations"
rustwreck.123.d: "'Bonjour, all those who are listening, be you citizens, or be you foreign. This is Prime Minister Jacques, of Rustwreck. I would like to address this broadcast to our northern neighbors, Portshoof, to all the ponies, griffons, and zebras who call it home. I know that the leader of the nation might question my idea to ask this in public. But to that, I say, should the citizens of the nation not hear this offer themselves? For you are a democracy, this decision, truly, is up to the citizens of your nation, not something to be talked about behind closed doors.\n\n I have spoken before on the idea of fraternité, which is, in your tongue, the word brotherhood. I have denounced the false republics, such as the Grand Pegasus Enclave, for their betrayal of other nations, for their lack of brotherhood. But you, citizens of Porthoof, are not corrupted like they are. Your society, remarkably, is free from much discrimination. You have elections, Libeté, you have programs to aid the worst off, Égalité, and you are peaceful for those who are peaceful, Fraternité. You, truly, represent the same ideals that I do, and it is for that reason that I shall not pretend to hold to any national supremacy. I will not denounce you because of your flag, or because you have a different leader.\n\n Allow me to put my offer in clear words. I extend to you, creatures of Portshoof, an offer to join me, that together, we may spread our ideals across the wasteland. Rustwreck and Portshoof, maritime republics, holders of true freedom, stood side by side against the tyrants and fascists of the world. I will not force anything, however. It is up for you to decide. I hope you all make the right choice.'"
rustwreck.123.a: "Vivé La République!"
rustwreck.123.b: "Portshoof Stands Alone."

rustwreck.124.t: "Fraternité, Against All Tyrants"
rustwreck.124.d: "Jacques watches with a small smile, as the Foreign Fighters march through the streets. Dashites swoop along with free Griffons in the air, as a column marches below, discriminated against Thestrals, escaped slaves, republicans exiled from every corner of Equestria, marching with leather armor, and automatic weapons. Jacques turns around, where the commanders of the forces sit. Thunderclap, a young Pegasus stallion, wearing an Enclave uniform dyed blue, Ferrous, a Griffon exiled from Featherbrush's lands, and Rocky, a Diamond Dog ex-slave.\n\n Before Jacques can even speak, Thunderclap would speak up, and give him a salute, 'Prime Minister, sir, I understand you might not like the GPE, but I ask that you keep that judgement away from my soldiers, sir. All of us are true believers in freedom and democracy, for all countries, for all species, sir!' Jacques nods, and smiles, 'What brought you here? For all three of you.' Thunderclap speaks first, 'Sir, my home in the GPE, well, my faith in it was destroyed, sir. My brother, Thunderbolt, turned Dashite, and my commanding officer forced me to. . . Well, after that, I knew I had to leave. I found a group of other Dashites, and we've been looking for someone worthy to serve, sir. You're the first who's both worthy of us, and will accept us.'\n\n Jacques turns to face Ferrous, who nods, 'Featherbrush is old and dying, and once he's gone, all his Talons are gone with him. I once tried to convince him to forget the outdated systems of Talons, told him maybe it was time for a new Griffonian Republic. He laughed at me, so I took those who would follow and found you.' Rocky would growl slightly, hunched over, his bipedal form being a bit too tall for the room, 'Was Everfree Dog, home ruined by ponies, racism. Was good. Then Red Eye come, kill dogs, take as slaves. Took years. Dug tunnel out of Fillydelphia. Led other slaves.' He takes a second, before speaking again, 'When in chains, canine, equine, doesn't matter. Slave, master. That matter. You are not master. Worthy, of slave service.'\n\n Jacques nods, and then smiles widely, 'Thunderclap, I would never turn anyone away due to their origin. If you are willing to fight for freedom, then welcome aboard. Ferrous, traditions are overrated, I think you'll find we have little love for the old ways around here, welcome aboard. Rocky, never in my realm shall there be a slave, and I hope to earn the trust you've put into me.' He smiles, 'Welcome to Rustwreck, fighters for freedom. Vivé La République.'"
rustwreck.124.a: "Freedom is paid for in blood."

rustwreck.125.t: "Égalité, Even To Raiders"
rustwreck.125.d: "Hate is a word used so loosely by ponies, they use it for the mildest dislike, they use it to mean annoyance, sometimes to mean love, sometimes when they wish death upon another. Today, however, Jacques would get a first-claw example of true hate. Never before had he seen such fire burn in the eyes of stallions, than when Aneurysm and Hot Rod entered the same room as he and Crimson. Hot Rod's eyes burn hot with rage and hatred against his old rival, glaring at him with a scowl. Aneurysm, on the surface, seems calmer, but in his eyes rests an inferno, ready to destroy. With a simple nod from Jacques, Crimson speaks up, 'Hot Rod, Aneurysm, leaders of the Rain Riders and the Speedfreaks. Given all the ponies you've killed, you should be very, very happy that you're looking at a pretty mare and a not so pretty Griffon, rather than the end of a gun.'\n\n Aneurysm nods, sitting straight in his chair, 'The one you sent to invite me here spoke of my philosophy.' His voice is calm, filled with an odd wisdom, 'You say you bring freedom to the lands, but to me, there is no greater freedom than traveling. To hop into a vehicle and roar down roads, away from all but the pavement, the wind, and the purr of the engine. For there is no discrimination on the road. No identity, no worries, and for but a bit, a pony can be truly free.' Hot Rod scoffs and rolls his eyes, 'Fucking pansy bullshit, this is why I could never fucking stand this cunt. Driving isn't some grand philosophy or any of that shit! It's a skill, it's a science, it's an art! The only reason why I'm here, and not off slaving in for someone else is because I perfected that art! Nobody can drift better than me! No creature can go faster and live! Can even out-speed a teleporting horn-head! I'm fucking amazing, why are you even bothering with this limp-dick cunt next to me?'\n\n Crimson smiles, 'Now now, you haven't even heard our offer.' She flicks her mane to the side, and grins, 'We now own the entire Sunrise Highway, and I know that you've both dreamed, and killed, over the want to race down it. So, if you both agree to work with us, if you agree to remain peaceful, and help our efforts to civilize your gangs, then you'll be able to race down the Highway, once per year. In fact, we're planning a grand race in just a week.' Jacques nods and smiles, 'Tour De Sunrise. If you stallions wish to prove you're the fastest, now's your chance.' Once they're both done speaking, Aneurysm stands from his seat, and bows his head, 'I shall train, Prime Minister, and work alongside you happily, for this honor you have granted me.' Hot Rod bolts up, 'Race down the Highway? Fuck yeah! I'm gonna win this shit and crush your pathetic balls under my fucking wheels, freak! Whoop!' Hot Rod rushes out of the room, followed by a much calmer Aneurysm."
rustwreck.125.a: "Let the races begin."

rustwreck.126.t: "Égalité, And The Winner Is"
rustwreck.126.d: "The Tour De Sunrise went wonderfully! Ponies from all around Rustwreck, and even many from outside of its borders, came to watch as the Speedfreaks and Rain Riders raced against each other, hundreds of different vehicles tearing down the roads at once. A radio broadcast went on, as the race lasted a full two days and nights, with many needing to stop halfway through for repairs or fuel, and a few others also got lost and ended up driving onto other roads. Of course, Hot Rod and Aneurysm were in the lead the entire time, Hot Rod keeping a consistently fast pace, but Aneurysm took corners closer, and had better acceleration, meaning the two stayed neck and neck the entire time. Surprisingly, neither tried to sabotage the other, the love of the race removing all thoughts of breaking the rules.\n\n The finish flag waves and a camera flashes as the two cars cross the finish line, with a decent portion of either gang finishing not too long after. Hot Rod hops out of his car, shouting, 'Fuck yeah baby! That's how it's done! Suck it, freak, Rod stays winning, Rod stays Hot for all the mares! Whoo!' Aneurysm steps out of his own car, closing the door behind him, looking up to an announcer's booth, as more gang members climb out of their vehicles. After a minute, the announcer speaks up, 'Well, folks, I can't believe it, but it seems that we have a tie on our hooves! Both front runners crossed the finish line at the exact same time, meaning we now have two winners!' Hot Rod blinks as he hears the announcer, 'What? Fuck that noise, I won!' He growls, and shouts, 'Riders, fuck this pansy ass pretender up, show him why we're the rulers of the road!'\n\n At his command, many of the gang members on both sides draw their guns. Jacques watches from above, spreading his wings to go down and intervene, but before he does, Crimson places a hoof on his side, 'Don't.' She grins, 'Hold on just a few more seconds.' Down below, they watch as a group, consisting of both Rain Riders and Speedfreaks, cross over the finish line. But instead of arguing, the two groups immediately begin talking to each other, laughing, and congratulating each other on the race. Hot Rod, seeing this, shouts, 'What do you think you're doing? Kill these cunts!' One of his gang looks over, and smiles, 'Boss, there's always next year, we can win then.' Hot Rod growls, but he's stopped as Aneurysm approaches him, and offers a hoof, 'Good race.' Hot Rod looks at the offered hoof, and after a second, shakes it, looking into the eyes of his rival, 'Good race.'"
rustwreck.126.a: "Can't wait for next year!"

rustwreck.127.t: "Égalité, To Live Normally"
rustwreck.127.d: "'Good race!' Turbo was never the best racer in the Rain Riders, he knew how to drive well enough, of course, all of them did. But he would never come close to beating Hot Rod. He shakes hooves with another, Spoke, who gives him a small grin, 'Good race.' Spoke was never the best racer in the Speedfreaks, he might have been a bit slower than his fellows, but nothing felt better than the feeling of the wind through his mane. Both had raced in the Tour De Sunrise last year, and Turbo felt a bit of pride. Not because of his racing, but because he was the one who spoke up, and stopped his boss from killing the Speedfreaks.\n\n The two stand next to their cars, engines off, having just finished a small race. Turbo pulls his hoof back from the shake, taking out a cigarette and lighting it up, smiling as he does, 'You know, few days ago, I met a pretty cute mare. Rust mare, not one of us. She has a mane that smells like sea salt, instead of oil, pretty clean mare, too. Decided I'd give her a drive around town.' Spoke chuckles, leaning against the car, next to Turbo, 'A Rust mare interested in driving? Now that's a sight. Heh, I met one of them before, asked for my help repairing a small boat she had. Offered her a ride too, but she said no.' Turbo snorts, 'Did you specify in your car?' Spoke blinks, looking at Turbo, 'Aww fuck, is that why she said no? Fuck, stallion, I just don't get how these Rusters work. They don't curse nearly as much as we do, half of them don't know an alternator from an engine, let alone what vulcanisation is, and if I try to explain it to them, they just cover their noses and trot away.' Turbo smirks, 'No shit, your breath smells like literal shit.'\n\n Turbo lifts up his cigarette, taking a puff, before breathing it out, 'That mare I drove around, I asked her some about it. Thing is, these ponies didn't grow up rough and tumble like us. Our love of the road is their love of the sea, same thing, different places. Best thing to do is just try and speak in their terms. Like their boss, Jacques, did with us.' Spoke nods, 'Yeah, I think if he didn't speak about his freedom in a way Aneurysm would understand, he would have thrown him the fuck out.' Turbo grins, 'Exactly. They explained their fancy fucking Prench in normal terms that we dumbasses could understand. Maybe we can do the same to the cute mares, eh? Besides.' He smirks, 'Goldmine out there for Rider or Freak stallions, Rust is an untapped market. Plenty of cute mares for enterprising stallions.' He grins, and then flicks his cigarette away, 'Of course, if you want to get them, you gotta actually drive faster than me. Now come on, first to Rustwreck gets a beer.'"
rustwreck.127.a: "You're on."


rustwreck.128.t: "Égalité, The Old Enemies"
rustwreck.128.d: "The door to Jacques’ office opens up as Wavebreaker trots inside, the normally calm stallion now having a deep frown. He approaches Jacques’ desk, giving him a respectful nod, “Prime Minister, we need to talk.” Jacques looks up from a piece of paper, clicking a pen and setting it aside, “Well, go on, I am always available to talk.” Wavebreaker nods, “It’s about the Steel Rangers, we have recently conquered them, but from what I’ve seen, you are taking a conciliatory stance to them. You have let them exist as a group so far, instead of destroying them at their very foundations. Jacques, these Rangers are horrible ponies, every moment that you let them keep that horrible title is another moment they’ll plot against you and the republic. I know you aren’t from around here, I know that you want to treat them like any other group, but they aren’t like any other. They’re poison.”\n\n Jacques taps his talons on his desk, “Wavebreaker, though I was not born here, I am from here, you should know that. My father told me all about the Rangers, about how they would go around stealing technology from traders, but also, how they would protect the city of Manehattan from raiders. It was due to the unshaken bulwark of the Steel Rangers that Manehattan was not overrun by raiders. For as much as they might act like raiders themselves, they are an organization with a code, beliefs, and more than that, a lot of guns. Put simply, they’re a religious group, one who would be ready and willing to fight for the Republic, if we treat them with respect. Why should I reject them?”\n\n Wavebreaker frowns, “Because they lack the fraternity you speak of! When the world ended, do you think the Steel Rangers helped ponies? Do you think they did anything decent? No, they stole like thieves from their fellow ponies, and shot any who got too close! They’re traitors just like the GPE, if you’re so willing to denounce one, you should be willing to denounce the other.” He clears his throat, “In this, the Admirals all agree. We are the ones who built this nation, Prime Minister, we are the ones who protect it. Please just consider it.” Jacques nods softly, “I am. If I force acceptance, then I risk alienating your Admirals. But what type of republic are we if I bend to pressure from the military?” Wavebreaker frowns, “Then put it up to a vote, where every pony can have a say. After all, you are a champion of democracy, aren’t you?”"
rustwreck.128.a: "The Steel Rangers will serve the Republic"
rustwreck.128.b: "Defer to a national vote on the issue"
rustwreck.128.c: "The Steel Rangers shall forever be disbanded"

rustwreck.129.t: "Égalité, No Matter Creed"
rustwreck.129.d: "Bucklyn Cross is no stranger to elections these days, every Steel Ranger who trotted in to cast their ballot today remembered the last vote. The Vote of No Confidence, Cottage Cheese or Steelhooves, one of the most divided times in the Contingent’s history. Now, though, it’s even worse, more candidates running for the position of Elder, who shall act as Governor of Bucklyn Cross from now on. Crossroads, Cottage Cheese, Steelhooves, and a dozen more had all put their votes in. The old guard, traditionalists split their vote among them, some going for Steelhooves, others for the old Elder, some for the charming Star Paladin. But not everyone voted that way.\n\n Knights Mango Slice and Dice stand outside of the ballot counting room, with Slice grinning, “So, who did you vote for? Let me guess, Cottage Cheese? Crossroads?” Dice rolls his eyes and grins slightly, “Paladin Shortcake, our commander. Maybe a few years ago I would have voted for Cottage or Steelhooves. But they’re going to win anyway, so I might as well vote for Shortcake, it’ll make her happy to know at least one of us voted for her.” Slice blinks at him, “Oh, you did too? Yeah, I voted for her myself. You know, these are unprecedented times. Fitting for us to have an unprecedented Elder, even though I know she’ll never win.”\n\n The door to the ballot casting room bursts open, as a short, pink colored mare comes out, “Whoo! Guess who’s the new Elder? That’s right, this mare!” The other candidates come out with disappointment on their faces, while Shortcake dances on the spot, “Because I’m short, I’m sweet, I’m very nice to meet, whoo! Alright Rangers, hope you’re ready for Manehatten to change!” She grins widely, “Liberty, fraternity, equality, blackjack and hookers!” Slice and Dice both blink, and look at each other. Dice blinks again, “What have we done?” Slice grins, “Well, we voted for change. Guess we’re getting change.” They look back to their new Elder, as she cracks open a bottle of whiskey, beginning to drink it down."
rustwreck.129.a: "New blood."

rustwreck.130.t: "Égalité, The Good Fight"
rustwreck.130.d: "Jacques adjusts himself uncomfortably, sitting in a chair not made for those with wings, deep inside of Tenpony Tower. Across from him is Homage, the mare assistant to the DJ, who gives him a small grin, “So, Prime Minister, I hope you’re comfortable. I’ll be running your interview, I’m afraid, the DJ himself doesn’t talk to others than his assistant. Of course, everything is being recorded so your side of the interview can be actually aired, I’m just going to ask the questions the DJ would ask. So, without further delay, let’s get into the most important question.” She clears her throat and smiles, “Prime Minister Jacques, you’ve said many times before that you fight for freedom for ponies and all creatures. Does it not seem odd, then, that you would conquer others without their consent?”\n\n Jacques grins, finally getting comfortable in his seat, “Freedom, sometimes, doesn’t come from the choice of individuals, Monsieur DJ. It is not freedom to allow a raider to own a slave, it is not freedom to sit idly by while others suffer. You have spoken before on your broadcast of heroes fighting what you call The Good Fight. A fight against the injustice of the Wasteland, a fight against hopelessness, a fight for the freedom and dignity of every creature. Perhaps Tenpony Tower, for example, was not home to raiders or slaves, but it was not free either. For your home was a dictatorship, an oligarchy in all but name. Maybe it is not as bad as the raiders, but it is still an evil all the same, and like you, I fight evil where I find it.”\n\n Homage grins softly, “You would say that you and your republic fight the good fight?” He nods, “Sometimes it might not seem that way, but yes, we do fight the good fight. Seeing the smiles of liberated ponies, given homes, food, the right to vote for the first time. Seeing the smiling thestrals who live in a society who accepts them. Seeing the Dashites and runaway slaves find a new home. There is no better fight than that.” Homage smirks, “Wow, that’s going to sound actually really good on air. Keep answers like that and we’ll be golden. So, onto my next question. Concerning the rehabilitation of The Bonecrusher, now known as Debt Crusher, what would you say. . .”"
rustwreck.130.a: "The best fight there is."

rustwreck.131.t: "Égalité, Friendship and Fraternity"
rustwreck.131.d: "”Do you ever question why it is that ponies on the coast are the ones most democratic?” Jacques speaks, peering out of the head of the Statue of Friendship, while Black Seas sits behind him at her desk. She nods, “The ocean provides plenty of food, easy travel, easy trade. It’s no wonder that us, you, and Portshoof all started on the coast.” She smiles, “Are you enjoying the view, Prime Minister?” He nods and grins slightly, “I am, oui. Because I know that I’m looking back to where I came from right now. If my knowledge of maps is correct, then due east of here is Rila, my home. When I was young I would always look to the western oceans, wondering what I would see. Then I spent most of my life learning what was out there first-claw.”\n\n Black Seas smiles, standing up and trotting next to Jacques, “The ocean is a beautiful place, even in its dangers. You ask why we coastal ponies are democratic, well. When the tide rises and the waves try to bring you to the bottom of the sea, the water doesn’t discriminate. Mare or stallion, young or old, griffon or pony, we all drown the same. When the hoof that feeds you is so dangerous, it brings ponies together, to face a common enemy.” She looks to Jacques and nods, “Like my ponies with your ponies. We aren’t Rusters, we have very different cultures, but we share the same enemies. Red Eye, New Canterlot, Grand Pegasus Enclave, they all eye us with desire in their eyes, and they’re going to come soon. That’s why we stand together, the free ponies of Equestria, and with bullet, bomb, and spirit, we will protect our home.”\n\n Jacques looks over at Black Seas and grins, “Keep giving speeches like that, and maybe I’ll lose the next election.” She laughs a little bit and smiles, “Ponies love confidence being delivered by a cute mare. That’s how I’ve stayed as Mayor, and how I secured my position as Governor now. You know, we are a very safe island, an island that holds all your ideals. Maybe this office could become yours, and this city your capital.” Jacques smiles, “Maybe. But not yet, I’m afraid. We still have much more to do before we have the resources to move capitals. But of all candidates, I’ll keep this one in mind. I look forward to working together, Black Seas.” She smiles, “Likewise, Prime Minister.”"
rustwreck.131.a: "A true Politician"

rustwreck.132.t: "Égalité, A Step Too Far"
rustwreck.132.d: "Cannibalism, a dark term not found much in all but the darkest annals of Equestrian history, an act so taboo that only in the most desperate of times do ponies do it. Now, though, it’s on the lips of every creature in the republic. When Arbu fell, one of them, an older stallion named Rattle, led a squad of ponies to the killing rooms, where unfortunate travelers and the injured alike would be butchered for meat. This revelation was met with the immediate quarantine of the entire town of Arbu, with only Rattle and the foals being allowed to leave, the rest of the town being surrounded by soldiers at all times, not permitted to leave.\n\n Crimson shouts, in Jacques’ office, “Have you never been desperate?! No, of course you haven’t, you rich bitch!” Doctor Kelp stands with a glass of whiskey and a scowl on her face, “Even in my most desperate of times I would not resort to murder and cannibalism, Crimson. Why is this a discourse? Why are we debating this matter? They’re murderers, cannibals, they’re degenerates who eat the dead.” Crimson shakes her head, “Murder is wrong, of fucking course, Kelp, but we’ve worked with raiders before! Raiders! Hot Rod, Aneurysm, Debt Crusher, they’re all ten times worse than any pony from Arbu! We stop the murders, here and now, but we do not judge these ponies for acts of desperation. We do not steal from them the equality we’ve given to everyone else!”\n\n Jacques frowns and speaks up, “Kelp, Crimson, that’s enough. They will be forgiven for their murders, like the raiders, and will be subjected equally to our laws. But at the same time, if we stop their cannibalism, then they’ll just murder in secret again. Is it not better to allow them to eat their own dead? That way we at least know where the meat comes from.” Kelp frowns, “This is no mere burial ritual, Jacques, its cannibalism. Do you know what kind of diseases this could cause? This is out of the question.” Jacques frowns more, “You are not Prime Minister, Kelp, you don’t tell me what the question is. Either we piss off Arbu and make them murderers in secret, or we allow this practice to continue even if others will dislike it. Like it or not, it’s part of their culture now, and we promised to protect cultures. But still, I don’t know if this is too far.”"
rustwreck.132.a: "It's an immoral practice"
rustwreck.132.b: "Let them keep it, it's cultural"

rustwreck.133.t: "Égalité, No Matter Color"
rustwreck.133.d: "Midknight trots slowly through the town of Fetlock, rolling along a cart of goods behind him, goods manufactured in the darkest of nights in Marelem. All around him, ponies of the republic look at him, but it isn't in fear or disgust like it used to be. No, instead, they give friendly smiles, and waves. It's unnerving to him, how the ponies don't dislike him anymore. From what the others say back home, this is the new normal, the republic looks past species, they don't judge the thestrals or their faith. Yet still, to see raiders, who just a few months ago were frothing with rage at the suggestion of a thestral nearby, instead giving him waves and smiles, it gives a feeling like no other. Like the world has gone mad and you're the only one who is normal, like an alien invasion has replaced the ponies of Manehattan with those who are decent and kind, not cruel.\n\n He comes to a stop, setting up his cart into a little trading stand, for ponies to come and buy from. However, he's stopped in his tracks, as a mare with a rough voice speaks from behind him, 'Thestral.' Midknight eeps and turns around, facing a familiar figure, a tall, savage looking mare, 'B-Bonecrusher?' She looks into his eyes, and huffs, 'The Bonecrusher exists no longer, thestral. For I have seen the light, I have seen the err of my ways, I have seen the immorality and the freedom I stole from those like you. I, my friend, am the Debt Crusher!' She smirks, 'And I shall not stop until I have paid every debt in Equestria! For my moral debts are countless, and when I die, I wish for it to be with a blank slate! You, thestral, in the past I extorted your country for their industry, and in doing so, I have taken on a great debt! A debt of racism! A debt of thievery! A moral debt so deep and so severe that I shall never recover from it, but I will try!' Midknight blinks, and shifts back uncomfortably, 'O-okay, if you say so.'\n\n Debt Crusher smirks, 'I do say, and I do declare! For today, I begin to pay the debt of my past sins!' She reaches into her cloak and takes out a bag, filled to the brim with caps, placing it down on the cart of Midknight, 'I wish to buy everything you have, and I have even provided a very generous twenty percent tip! I shall take the burden of your wares and I shall give them freely! To the needy! To the hungry! To the poor ponies of this town, for it is I who forced them to be this way!' She scoops up all of the goods in the cart, and then trots away. Midknight is left looking after her, one of his eyes twitching as he does, 'What?!'"
rustwreck.133.a: "Debt repaid!"

rustwreck.134.t: "Égalité, For Even the Dregs"
rustwreck.134.d: "Jasmine trots through the streets of Gutterville, keeping her rifle close, watching those around her. Construction workers from every corner of the republic have come together at one place, to tear down the scrap shacks and shanty towns of Gutterville, and replace them with proper buildings, where ponies can live, laugh, and love. Given the state of the town, though, a constant guard presence is needed, just in case the worst comes. With the ringing of an alert, a shout goes through the town, 'Manticore incoming! Take cover!' In an instantly, calmly and practiced, the construction workers and ponies of Gutterville take shelter, while Jasmine takes up her automatic rifle, and gets going.\n\n She arrives to a small fitting platform, rapidly climbing up it, and looking out into the distance, where a swarm of six Manticore flock closer, looking for a tasty meal. Jasmine frowns, lifting her rifle and looking down the sites, firing in calm, controlled bursts of three. Her bullets hit true on two of the manticore, knocking out their wings and sending them careening down to the ground, where they'll likely break their necks. The remaining four manticore begin evasive maneuvers, with her only able to shoot down one other before they get in close. Cursing, she pulls the trigger again, only to hear nothing more than an empty click, running out of ammunition. She frowns, and looks down at her rifle, before retreating from her post, to take cover.\n\n The sound of a minigun fills the air, bullets rapidly ripping through the flesh of the oncoming Manticore, reducing one of them to nothing more than a red mist, causing another to crash, and killing the other one through shots to the face. Next to Jasmine stands a stallion of gray color, with a minigun on his side. He looks down at her, and smiles, 'Sorry about that! I needed to get my ammo, glad I arrived in time to help.' He offers her a hoof, 'Sergeant Hail Storm, former Steel Ranger.' She takes his hoof and gets up, grumbling a bit as she reloads her rifle, 'My wife would kill me if she knew what just happened. I'm Jasmine, former Endtide.' Hail chuckles, and nods, 'Yeah, well, somepony needs to be out here helping these ponies, even if our wives hate it. Want to get a drink? I hear the previous leader of this place has a killer bar, newly built.' Jasmine grins slightly, 'Eh, yeah, I could use a drink after that.'"
rustwreck.134.a: "Even the lowest can rise high."

rustwreck.135.t: "Vive La République!"
rustwreck.135.d: "Around a table sit four figures, a large collection of paper in front of them. Doctor Kelp, one of the four, lifts her glass and sips some whiskey, before setting it back down, 'So, before we affirm that we sign this agreement, let us go through the promises that it makes. Jacques, start us off.' Jacques grins and nods, 'Section one of the new constitution does proclaim that all laws passed during my term are unbreakable and to be protected by military strength. Freedom from discrimination, freedom of religion, freedom of thought, the right to welfare, the right to education, the right to unions and local representatives, the right of soldiers to choose their commanders, and the guarantee of Liberty, Equality, and Fraternity to all citizens, be they pony or anything else.' Kelp nods, 'This section, I affirm.' To her left, Black Seas smiles, signing the piece of paper, 'That section, I agree to.' Debt Crusher, formerly known as Bonecrusher, smirks, 'These protections, I undertake!'\n\n Jacques smiles, 'Onto section two, Black Seas, if you may.' Black Seas nods, 'We, as a republic, are a union of creatures, defined by our acceptance of other cultures, our brotherhood with fellow republics, and our amnesty given to all conquered citizens, that crimes committed before our conquest, given proper repentance, are to be forgiven in an act of national amnesty. Never shall we keep prisoners who have not undergone fair trial, never shall we hold the crimes of forefathers to their sons, and never will we deny a pony their rights based on color, creed, or past. Section two of the constitution, I, Black Seas, do affirm.' Debt Crusher nods, 'Amnesty for all, even those like me, this, I, Debt Crusher, swear to uphold.' Kelp nods along, sipping her whiskey again, 'As it is written, so shall it be.'\n\n Debt Crusher speaks up, 'Second three of the constitution of the republic! We do uphold that, every four years, regardless of national emergency, a vote shall be held for all positions in the republic! Citizens will elect their local Governors and Mayors, and ponies will vote for their representatives who, in a national parliament, shall choose amongst themselves a Prime Minister! When the Prime Minister is chosen, the citizens of the republic will hold a vote of affirmation, and should they deny the candidate for PM, the parliament will need to choose a new one, until one is found that the majority of the nation agrees to follow! These promises, I, Debt Crusher, affirm!' Doctor Kelp nods once more, 'This democracy, I follow.' Black Seas nods along, 'This promise, I swear to.'\n\n Finally, Jacques speaks up, 'And with a new constitution, we draft a new name, a name befitting our ideals, befitting our friends, befitting even our Aquilian influence. The Republic of Friendship, also known as La République de Amitié. This, I affirm!' Debt Crusher stands from her seat, 'This I swear!' Black Seas smiles widely, 'For friendship, I will follow.' Kelp sets down her drink, and nods, 'Acceptable.'"
rustwreck.135.a: "Vivé Amitié!"

rustwreck.136.t: "Freedom, The Center"
rustwreck.136.d: "The four sit around a table once more, this time looking over a large map on the table. Black Seas speaks up, 'As I mentioned prior when I first met Jacques, Friendship City is the ideal location for our capital. Firstly, it is very defensive, with our large navy, we will never need to fear an attack from any enemy reaching our capital. In addition, it is a coastal city, and a very rich one, it could serve as a wonderful hub for visitors from all around Equestria. Not to mention the symbolism of living in the shade of the Statue of Friendship, we could even take on a project to restore any damage to the statue, and with it, we will earn our name, as the Republic of Friendship. Being that I was Mayor, and am now Governor, of Friendship City, I understand that I am biased, but beyond simple bias, my suggestion just makes sense. Given how much of our population is in Manehattan, too, it is only proper for the capital to be somewhere in the city proper.'\n\n Debt Crusher shakes her head, and points at a city on the map, 'Summerfield, no question, is the proper capital of the republic! Jacques, my Prime Minister, you have undertaken massive reconstruction efforts, and the city is now a proper city! Plus, Summerfield is in the geographic center of the republic. We should not plan for where populations are now, but where they will be in the future, and since there's no Speedfreaks or Riders, there will be mass colonization of the western stretches of the republic. New cities will be built, and they will want to be close to the capital. To the Debt Crusher, there is no other option, let this city be the symbol of us leaving behind ash, and building something new!'\n\n Kelp rolls her eyes slightly, and then nods, 'Apart from the braggadacious nature of these two, wanting cities close to their jurisdictions to be the ones made capital, it is obvious that Rustwreck is the best choice. I have personally built up Rustwreck ever since I arrived. It has by far the best industry and infrastructure in our country, and in addition, it carries with it a legacy of legitimacy. Black Seas is right that our capital should be maritime, and Debt Crusher is astonishingly correct as well, that our capital should represent rebuilding. I say we keep it in Rustwreck, but rename the city to Republic City.'\n\n All three of them look at Jacques, as he looks at the map, considering each and every option. Finally, after a minute to think, he makes a decision."
rustwreck.136.a: "Rename Rustwreck to Republic City"
rustwreck.136.b: "Friendship city, the symbol of the Old World"
rustwreck.136.c: "Summerfield embodies our spirit of rebuilding best"

rustwreck.137.t: "Freedom, To Disagree"
rustwreck.137.d: "'Good afternoon, ponies of the wasteland! I hope you're all having a good day out there, it is I, the best DJ in all the land, broadcasting out of Tenpony Tower in the Republic of Friendship. Sat here with me, I have two underdog candidates for the election. Please, Black Seas, introduce yourself.' A mare's voice clears her throat, before speaking, 'Good afternoon, ponies, my name is Black Seas. I have been the leader of Friendship City for quite a while, and as its Mayor, I led the city through tough times. As its Governor, I have led the city into integration with our friends in the larger republic.' The stallion's voice comes back on, 'And how about you, Debt Crusher?' The rough voice of a mare speaks, 'I am Debt Crusher, once called The Bonecrusher, savage and horrible leader of the Manehatten Raiders. When the Prime Minister conquered my land, it was only due to his amnesty that I was given a new lease on life. Jacques is my hero, as I know he is for thousands of ex-raiders in the world, and I want nothing more than to take his position, so I can make him proud, as Prime Marenister.'\n\n 'Well, mares, with introductions out of the way, let's get into the thick of the matter. Debt Crusher, you must admit, your past makes it hard to trust you as a leader. Why do you think you should win?' A small growl, 'My past burdens are too much to count, but I have changed. Tell me, who in this wasteland does not have a debt? Who has lived a perfect life? None have, except the liars. I have a moral debt crushing my soul, DJ, and I will not stop improving the world until my debt is repaid. All the blood I have spilled with be replaced with lives saved, as we march into Fillydelphia, and to every place where darkness hides on this wasteland! To every pony who burdens those around them, to every tyrant who rejects change and amnesty, I will one for you, and you will pray for me to be as lenient as Jacques was to me!'\n\n 'See, and this is why I am the only sane leader around here. Debt Crusher wishes to take us into foreign conflicts, where thousands of ponies will die, Jacques the same. We are already the jewel of Equestria, the shining beacon of liberty in a land bereft of it. Why, then, do we need to fuel our liberty with the blood of soldiers? We are rich, our cities safe, stable, protected. If ponies should wish to come here, let them come of their free will. I am the only candidate who is not a warmonger!' Debt Crusher shouts, 'You are a coward! You who sit on your island and watch as those like me kill the innocent! You pathetic weakling, you simpering, lying sack of shit, you who hold bits and caps over the blood and souls of ponies!' DJ P0N-3 cuts off both their mics, 'Looks like we're having some technical difficulties, ponies, we'll be right back, after a song from Sweetie Belle.'"
rustwreck.137.a: "We'll be right back!"

rustwreck.138.t: "Freedom, Stood Side By Side"
rustwreck.138.d: "Jacques and Kelp stand together, overlooking the city below, as ponies go to and fro. Posters are plastered around, one with Hot Rod's grinning face saying 'Race your way to the polls, Jacques needs us!' To another one with Aneurysm, done in a 2d cartoon type style, reading 'Speed to the ballots, vote for Debt Crusher.' In the distance, a lively debate plays out between supporters of Kelp and Black Seas in an impromptu forum. Jacques grins slightly, 'You know, I never got it, what's the difference between you and Black Seas, really?' Kelp looks out at the forum, and sips her whiskey, 'She's a pacifist, I never was. I never technically swore to do no harm, you know, instead, I've sworn to ameliorate the harm I do, that I do the maximum good with the least amount of bad. She wishes to turn us into a fortress merchant republic, to let the rest of the world die alone. I'm much more international, like you. But unlike you, I do not denounce fellow republics because they aren't good enough. Even just trying is enough to earn my respect.'\n\n Jacques smiles softly, stepping away from the window, 'I'm glad you've been here to support me, madam Kelp, even when we've disagreed. I know you didn't like the taking of Manehatten, you would have preferred to operate through alliances, but none of those places were as good as here. You were by my side the entire time, and I want to let you know I'll do the same, if you win.' He grins, 'Even if I don't think you go far enough, I follow the democratic will, no matter what that will is.' Kelp looks at him, and smiles softly, nodding. She sets her whiskey down, 'The same from me, Jacques. Should you win again, I will be there every step of the way. Even if we may disagree on a few particulars, I cannot deny that you've created something beautiful. To the point where I don't know if I could have done better, but if I win, I'll try.'\n\n Mare and Griffon look out together at what they have built, and after a moment, a smile crosses both of their faces."
rustwreck.138.a: "For democracy."

rustwreck.139.t: "Freedom, For All"
rustwreck.139.d: "Gathering once more around a small table are the four main candidates for Prime Minister, all of them quite nervous. Black Seas flips through a book to calm her nerves, while Kelp reads a graphic novel she stole from Wavebreaker, maintaining a calm demeanor. At the same time, Debt Crusher stands near Jacques, and talks to him, 'Prime Minister Jacques, I'd just like to say that even though I'm running against you, I, the Debt Crusher, see you as a hero. If it were not for you, then I would either be high off my mind on chems right now, or dead. I want to extend your mercy further, and give every pony a right to pay off their debts. I want Red Eye, I want to show him the error of his ways, until he too realizes the debts he needs to pay. I want to buy all the slaves, and give them free houses, and whatever jobs they want, I want to buy his most loyal Talons, only to give them the command to do whatever they want. But even if I lose, I will always respect the process you've given to us.'\n\n Before Jacques can respond, Black Seas speaks up, 'Red Eye is far too dangerous to try that with. Sorry to say, Debt, but your little Fetlock and Orangedale fiefdom was nothing compared to what Red Eye has. That's why it's best we stay here, quiet, stable, and safe, where his chains can't reach.' Kelp speaks up as well, 'Red Eye is a narcissist who will always be one, you won't be able to convince him out of his delusions of grandeur. You, Debt, were born into a bad situation, and that's what made you who you are, your upbringing and nurture. Red Eye chose to become who he is.' Debt Crusher shakes her head, 'Never! I will never believe that there is a pony so evil that they cannot be given amnesty! That's what others believed of me, and I need to show them they were wrong.'\n\n Jacques smiles softly, 'It's good that you all disagree on this stuff, mares. Because I know at heart, we all want what's best for the Republic, for every pony who votes for us. As long as we keep that, then in the end, no matter who wins, it is a victory for us all.' As he finishes speaking, the door opens up, and Crimson trots in. She flicks her mane to the side, and grins, 'The votes have been counted.'"
rustwreck.139.a: "Jacques takes a second term!"
rustwreck.139.b: "Kelp becomes second Prime Minister!"
rustwreck.139.c: "The Manehattan-vote sweeps for Black Seas!"
rustwreck.139.e: "Debt- Debt Crusher somehow wins?!"

rustwreck.140.t: "Fraternité, Bound By Blood"
rustwreck.140.d: "Jacques adjusts in his new seat, in his own personal office in Rustwreck, the seat not being designed for a creature with wings. In the middle of his uncomfortable adjusting, the door opens up, and Crimson saunters in, wearing a suave grin, 'Good morning, Prime Minister, I received a letter you sent me?' She flicks her mane to the side, and grins more, 'What ever could the Prime Minister want with a boring old preacher like me?' Jacques looks at her, and gives her a small nod, 'Crimson, ever since you came into Kelp's council, you've always sat near me, and helped me out. You told your Endtide to vote for me. Why would a cult leader support me, parce que I supported your religious freedom?'\n\n Crimson chuckles, 'Nonsense, my blessing doesn't come with reciprocal support, Jacques, I was on your side from the minute I heard you speak. Your words of fraternity, well, the Endtide is exactly that. Bound by blood, we are one, and, pray tell, is not every creature in the world bound by their blood? Together, we are one, brother and sister, pony and Griffon. Our blood marks our struggle against the Wasteland. I expect nothing in return from you, birdy.' Jacques looks at her, and then grins, 'Crimson. I sailed a sinking ship for most of my life. When I became captain, I became the best bullshitter around, because I needed to convince them I had a plan, and a place to go, and that I wasn't scared out of my mind. Don't try to bullshit a bullshitter. I think I get it now. This whole cult thing, you don't believe a single bit of it.'\n\n Crimson looks at him, and smirks, 'There you go, now that's why I supported you. High Tides, Kelp, Wavebreaker, even my own followers, they're so easy to just lie to. They'll believe whatever character I play, and my character is the charming cult leader. After all, being a cult leader means your followers follow you, and don't question you. My cult was never about belief, it was about political power, with which I could change the world for the better. You saw right through me, impressive.' Jacques smiles, 'My father, the Commodore, taught me about ponies like this. Maybe you don't expect anything in return, Crimson, but you are a clever, and smart, mare. I think you understand ponies more than anyone else in this country. I'd like to make you an office, to be my top advisor, and in this role, I will entrust you to help me rehabilitate the bad of the Wasteland. Sounds like a deal?' Crimson looks at him, and then smirks."
rustwreck.140.a: "Deal."


rustwreck.141.t: "Justice"
rustwreck.141.d: "When the votes came in, nobody expected this result. The Debt Crusher, once the feared and hated The Bonecrusher of Manehattan, now stands in charge of one of the most powerful countries in the world. Today, all around the republic, creatures tune in on their radios, nervous citizens and hopeful raiders, anxious businesses and eager soldiers, to listen to the first radio address of Prime Minister Debt Crusher.\n\n 'Good day, or, as Jacques would say, bonjour, ponies of the republic! The Debt Crusher has been elected as your new Prime Minister, and I am more proud than ever, to have come such a long way from where I was. I would like to thank every pony that voted, even if it wasn't for me, because in spite of all of your fears, I love democracy! I shall take no actions to decrease our democracy, fair citizens, I shall not undo a single action done by Jacques! When I was a raider, I looked to this new republic with envy, and now I stand here with pride, and admiration, that we have made a country where every last pony can be free! No matter how evil you were before, even those horrible like me can, through hard work and determination, find themselves stood atop the heap, at the head of this republic. Many of you are afraid, and I don't blame you, I have done much wrong, and my moral debt is too great to ever repay. I was an actor of bloodshed in this world in the past.'\n\n She takes a second, before she continues, 'But then I remember what Jacques taught us all. Justice, true justice, isn't about vengeance, about tearing down the evil and crushing them under your hooves. Justice is offering a hoof to those already knocked down, giving them a second chance, a chance to come back, and to pay off their debts. I don't bring pain, or hate to this Wasteland, citizens, but I bring that justice that Jacques taught us about. Every creature, no matter how wicked, can be saved, no creature is beyond help, and justice knows no borders. Our republic, similarly, will know no borders, for I declare this, to every pony. We will own everything, we will take down the evil, the wicked, the corrupt, and they will pay their moral debts! The Debt Crusher promises this! Take up arms, citizens of the republic, we bring justice, we bring freedom, and we bring redemption at the end of our gun barrels!'"
rustwreck.141.a: "True Justice"

rustwreck.142.t: "Redemption"
rustwreck.142.d: "A celebration rings outside, ponies from every corner of Equestria celebrating. The occasion? The anniversary of when Jacques' ship, The Stableside, returned to Rustwreck. Fitting, thought Debt Crusher, as that was the start of the greatness that has come to the Wasteland, and of her own redemption. Yet redemption is a hard thing to do, the average citizen, even when happy, prosperous, and celebrating, still has a voice in the back of their heads. A voice telling them to destroy their enemies, destroy those who are 'other', to wipe out any evil from the face of Equestria. Debt Crusher felt those feelings once, too, before Jacques came.\n\n Stood in a small meeting room, Debt Crusher trots around, while Crimson and Jacques, now minister of justice, write down on a piece of paper. Crusher speaks as she paces, 'Red Eye, and all of his slavers, are to be redeemed. Even the worst slaver did their slaving for a reason, perhaps because they wanted to make products, or maybe they liked the feeling of control. We can make them managers in state-run businesses, where they can be overseen, where they can use their learned management, and where they can repay their debts.' Crimson looks up, and nods, 'Sure, but that's all simple, they're still ponies. What about Unity?' Debt Crusher spins around, and frowns, 'Unity and The Goddess are only bad because they force ponies to join. They are a religion like the Endtide, or like the Luna Worship, we promised freedom of religion in our constitution. Allow Alicorns to exist as normal, but they can only convert those who willingly join Unity, The Goddess should accept this compromise.'\n\n Crimson grins slightly, 'Mmm, so, we're going to add slavers and Alicorns to the mix. Plus, eventually, Enclavers, quite a lot. I don't know if ponies are going to so happily accept this acceptance, Debt Crusher.' Crusher frowns, turning and trotting to look out a nearby window, 'Look out here. Ponies next to thestrals, next to griffons, next to raiders and zebras. Speedfreaks and Rain Riders race side by side, my old gang and the thestrals share drinks, Steel Rangers trot around with no titles anymore. What more is an Alicorn? What more is Red Eye? Redemption is not something to be withheld from ponies, for none are too far gone. Acceptance is a long path, upon which redemption is the first step.' She turns back to face Crimson, seeing Jacques also has a wide smile on his face. She looks at him, her hero, and then at Crimson again, passionate fire burning in her eyes, 'Redemption, my friends. For all.'"
rustwreck.142.a: "And Justice With It."

rustwreck.143.t: "Freedom"
rustwreck.143.d: "Democracy, they say, bears the sweetest of fruits, and indeed, for Jacques, no fruit has been as sweet than when he was confirmed for a second term. Of course, he would have been happy to lose still, democracy is above all else, but still, to know his citizens love him enough to vote him in again, well, it puts a wide smile on his face. He's wearing said smile constantly, even as he sits in his office, signing off on some papers. The door opens up, and Crimson saunters in, smirking, carrying some alcohol with her, 'There's my favorite Prime Minister, I hope your work is done, because we're getting white-mare drunk tonight.' Jacques looks up, and smiles widely, 'Ah, bonjour, Crimson. I'm afraid I have to say no to the drinks, no drinking while on the job, and, well, my job is my life now.'\n\n Crimson smirks, rolling her eyes and trotting up to him, 'Jacques, what's the point of sitting in some cluttered, dark office all day? You're making the world better, your citizens love you, and you have a cute mare offering you drinks. Just one night, out of this office, around those who like you. Come on.' She stands straighter, and before he can speak again, she places a bottle on his desk, 'There's a bar in Gutterville, newly opened, I've heard high reviews of it from a marine who's part of the Endtide, Jasmine. Everyone is going to be there, I've got Debt Crusher riding in with Aneurysm, Black Seas is riding in with Hot Rod, I think they might be romantic with each other, and Governess Shortcake is making her special Strawberry Shots. Come on, let the citizens see their Prime Minister for once.'\n\n Jacques looks at Crimson, taking a second, before he grins and nods, standing, 'Okay, okay, you've convinced me, allons-y. How are we getting there?' Crimson smirks, 'You are going to pick me up and fly me there, Jacques. Make use of those wings for once.' He blinks, looking over at her, before he grins softly, 'I'll try, but I make no promises.'"
rustwreck.143.a: "From Freedom, Hope"

rustwreck.144.t: "Hope"
rustwreck.144.d: "'Mon Fils, Jacques:\n I have only a few hours left, my son, and I wish not to waste them speaking to you, memories you would forget. Instead, I write this letter, to give to the good Commodore, who has promised to take you, and keep you safe. My name is Pierre Robse, and two hundred years ago, my ancestor led the revolution in Rila against the monarchs, and it is that glory that I always strive for. I know one day you may forget my face, your mother's, where you grew up. It is cloudy here, in Rila, and we build in ruins, for if you step into the light, the Pegasi of the skies will come down, to destroy you. I led a small settlement, a settlement called Hope, and I'm afraid that a few hours ago, you stepped into the light. I know what's coming for me, mon fils, I know the death this Enclave brings, I know the destruction, and the despair, and I hope you never do.\n\n Jacques, when your mother made you, it was the best day of my life, and even now, when I see you, I think of nothing but her. Your eyes are not dark, and clouded, they do not despair. They have nothing but hope in them, for a better future. Commodore Perrylous shall take care of you now, and soon, he shall be your father much more than I ever was. But I beg you, my son. You may forget me, you may forget your home, and your mother, but I beg you to never forget one thing. Never forget your hope. You see the world as a brighter and better place, and I know, one day, you will create that better world. Find love, my son, find life, find the joy you deserve. Goodbye, my son, I shall watch from Eyr's side, and know, I will forever be proud.'\n\n Jacques slowly sets his letter down on his desk, looking at it for a second, blinking his eyes clear of tears that threaten them. The door opens, and as always, Crimson trots in, with a charming grin, eyes filled with mirth, a suave charm like no other. Before she can speak, Jacques looks up at her. He takes a second, his claws resting upon his father's letter, and then smiles, 'Crimson. Would you like to go on a date?'"
rustwreck.144.a: "From Hope, A Better World"

rustwreck.145.t: "Stability"
rustwreck.145.d: "When times are good, there's only one thing that ponies, truly, want. They want a steady hoof, who will guide the way forward, turning times from good, to even better. When the votes came in for Black Seas, this old thought was proven true once again, as the steady hoof of Friendship City now rests easy upon the republic. She stands now, in front of the press, letting pictures be taken of her freely, putting on her most charming smile, even as the press asks her questions. A stallion shouts out, 'Prime Minister Seas, what will be done with the other candidates?' Black Seas smiles widely, 'The other candidates all received a good portion of the votes, it is obvious that much of this country wants them. Friendship, what I have always been about, has always been about working with each other, finding their strengths. Crimson will be in charge of rehabilitation programs still, of course, Doctor Kelp I will make the head of the new Ministry of Medicine, to ensure a healthy society. Debt Crusher is, above all, an inspiring figure, showing the redemption our republic offers to even the blackest of souls, she will become the Minister of Foreign Outreach, a new program designed to attract migrants from all over the Wasteland. Jacques is, above all, unmatched in his friendliness and his ability to talk, as such, he will become the Minister of Diplomacy, a new position founded to forge friendships across national borders.'\n\n Cheers come from some ponies, as another reporter shouts, 'Prime Minister, what are your plans to deal with Fillydelphia?' Black Seas smiles serenely, 'Fillydelphia, no matter its owner, is always a place overseen by darkened hearts, I would never wish to own it myself, to bring the poison of that city into our republic. However, our republic can benefit from the city itself, for the factories churn out products cheaper than any other in the Wasteland. Let our money be spent on Fillydelphia goods, so those caps may go towards funding better safety procedures in their factories. Similarly, this will allow us to produce higher quality goods, as Manehatten has always been renowned for.' She smiles, as pictures are taken all over, 'I say this to every pony of the Wasteland. By the end of my tenure, on the back of every high quality product, be it a gun, toaster, or a robot, it will say one phrase, one phrase that will show the dominance of our republic over all others. Made In The Republic of Friendship!'"
rustwreck.145.a: "Caps Make The World Go Round"

rustwreck.146.t: "Prosperity"
rustwreck.146.d: "Trade will save the wasteland. Somepony said that once, far to the south, in a cursed city. Yet, it's undeniable, no phrase has ever been more correct in the Wasteland. For now, Black Seas stands on a balcony, casting her eyes out to the distance, where caravans come, laden down with goods, food, and caps. Her ponies, the press, all her friendly citizens look up at her, wearing clean, repaired clothes, in a city even cleaner than it was before the war. She smiles widely, 'Good morning, my citizens! Today marks thirty-five days since I have finished implementing my most major reforms. Today marks, also, the highest profit day ever seen in the history of this side of Equestria! To the south stream caravans from Fillydelphia, from Shattered Hoof, even all the way from Hoofington, delivering food, clothes, and all manner of cheap commodities for us to enjoy. To the north go our traders, selling indiscriminately, to all who will take it, at high prices, for high quality. Be you Khagnate, be you Commonwealth, Virgillian, Penguin, even the remnants of the Zebra Legions march to battle wearing armor, made by our armorers, carrying guns made in our factories, eating food grown in our farms. We are the workshop of the wastes, my citizens, and today, we are richer than ever.'\n\n Cheers come from below, making her smile even wider, speaking over them, 'Our life expectancy has not only increased past all others in the Wasteland, but is now even higher than during the war! Every citizen lives happily, paid wages that would make them upper class in any other state, buying food cheaply, living in houses for free, with medicine provided for no charge, with no fear of raiders, with no racism, no hate, no prejudice. Today, my ponies, I do not wish to just congratulate ourselves, instead, I have an important declaration! I declare that, upon this day, we, the Republic of Friendship, have bested the Wasteland!'"
rustwreck.146.a: "The Bright Spot of Equestria"

rustwreck.147.t: "Cooporation"
rustwreck.147.d: "The vote came as no big surprise, Kelp was always popular, if not for Crimson supporting Jacques in the first election, she would have won. Now, with more time to prepare, she has, and now she is ready to change the country for the better. Well, almost ready, but as she was named Prime Minister, Kelp realized she couldn't lead, not without dealing with one more loose end. Thus she stands in a hospital room, with Wavebreaker, Crimson, and Jacques standing around her, looking down at High Tides. His heart may beat, and he might breathe still, but no true life rests behind his closed eyes, only the empty shell of what once was.\n\n Wavebreaker sighs softly, looking at Tides, and then looking away, 'I didn't know you were keeping him on life support still. You were right, we do need to end him.' Kelp lifts up a glass, sipping her whiskey, nodding softly as she sets it down, 'I was holding out hope that he may spontaneously wake up, if I kept him preserved. Of course, I was delusional, and a Prime Minister can't be tied down by the past, can she?' Crimson looks at the ghoul, and then smiles softly, her usual charming tone gone from her voice, 'I still remember when he was passing, how we all treated each other like enemies. But then he passed, and here we are, standing side by side.' She grins softly, 'Tides thought that ruling was something to be done alone, I wonder, if he had chosen one of us to lead, if he would expect us to rule alone.'\n\n Jacques looks down at the ghoul, then at Kelp, 'I never knew Tides beyond a few weeks when he was going feral. But my father would speak of him, and from what I know, he was a rough stallion, tough and hard to be around, but there was nobody else my father would have trusted with his life than Tides. He seems like he was a true leader, even if he was tricked into thinking being a dictator was good. I think Boreas will accept him willingly.' Kelp looks at Jacques, giving him a small nod, 'Boreas, or whatever else is out there. Whatever divine power watches us right now, I think I speak for all of us when I say this. High Tides, I wish you a good afterlife.' She flicks off the life support, as Wavebreaker speaks, his voice hitching as he does, 'Goodbye.' Crimson smiles softly, 'See you on the flip side, Tides.' Jacques speaks last, speaking softly, 'Unto the next life, Admiral. Don't let Navy Jones seize your soul on the way.'"
rustwreck.147.a: "Stood Side By Side, We Move"

rustwreck.148.t: "Democracy"
rustwreck.148.d: "The best part about democracy, according to many old scholars, is the ability to always have someone getting stuff done, even when your leader can't. That is where Kelp finds herself right now, as she wakes up in a random house, her throat dry, and her head pounding slightly. Foggy memories flow through her head of last night, some celebration of her accomplishments, then she was challenged by some ex-Steel Ranger, Chaser, in a drinking contest. Her thoughts are interrupted as the door to her room opens up, and a tea colored mare trots in, offering her a warm cup of tea. She smiles softly, 'Good morning, Prime Minister. I'm Tea, I'm a teacher at a nearby school. My wife and I, Jasmine, found you when we were going on a trot last night. You were passed out on the side of the road, it looked like you drank too much. Are you feeling alright?'\n\n Kelp sits up, resting a hoof on her head, as another mare steps in, Jasmine, who smiles, 'She's awake?' Kelp nods softly, 'I'm quite awake, yes, I'm. . . My apologies, for you needing to house me due to my intoxication.' She blinks her eyes open, and looks at the mares, 'You two, I remember you, Agent Clear Mind led you to a shelter while your house was repaired. I gave you both an examination, to make sure no pestilence was affecting you. Thank you, both of you, if I were left there. . .' Tea smiles softly, 'If you were left there, Prime Minister, someone else would have helped you. Because of the society you've built, and Jacques, this republic.' Jasmine grins and nods, 'Friendship isn't just a name, it's a way of living. It wouldn't be very friendly to leave the Prime Minister out in the cold.'\n\n Before Kelp can reply, another pony trots through the door, Crimson. She looks at Kelp, and smiles softly, 'Hey there, mare, looks like you got a bit too wild last night, huh?' Kelp nods softly, 'Yes, but I am okay, thanks to these two mares.' Crimson smirks, 'You can thank me for that, Jasmine here was part of the Endtide.' Jasmine beams with pride, as Crimson continues, 'Come on, the others have been holding down the fort while you were missing.' Kelp slowly nods, and stands, unsteadily following after Crimson, 'This is very negative, Crimson, that I passed out, and I'm suffering a form of miniature amnesia for last night. How can I be expected to lead if this happens?' Crimson looks at her, and smiles softly, 'Then let's decrease that drinking, Kelp. It might be hard, but you're our friend. And friends help friends out.'"
rustwreck.148.a: "Even In The Darkest Days"

