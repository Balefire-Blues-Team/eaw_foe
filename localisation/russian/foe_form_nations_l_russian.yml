 SUN_gabriel_motorcycle:0 "Золотой мотоцикл Габриэля"
 SUN_gabriel_motorcycle_desc:0 "Извлечённый из глубин Нижней реки Мейр легендарный позолоченный мотоцикл Габриэля Санрайдера, основателя изначальных Солнечных Гонщиков, снова несётся во главе банды. Один лишь его вид вдохновляет каждого рейдера на шоссе мчаться во весь опор и бить как можно сильнее."

 SUN_follow_nitro:0 "По пути Нитро"
 SUN_follow_nitro_desc:0 "Вдохновлённая последним дневником Нитро Бустерджуса, банда обращает свой взор на врагов шоссе. Старые Солнечные Гонщики никогда не заезжали достаточно далеко. Но мы превзойдём их."

 SUN_learning_mistakes:0 "Уроки последнего Солнечного гонщика"
 SUN_learning_mistakes_desc:0 "Дневник Нитро подробно рассказывает о том, чего делать уж точно не стоит. Банда принимает близко к сердцу предупреждения старого лидера: никогда не позволять междоусобицам разделять шоссе и никогда не прекращать строить то, что создаётся на века."

 SUN_hit_and_run:0 "Доктрина «бей-и-беги»"
 SUN_hit_and_run_desc:0 "Рабы Филлидельфии помнят старую тактику Нитро. Быстрые удары, стремительные отступления и тактика, не позволяющая врагу зажать тебя в угол. Банда шоссе полностью перенимает эти методы."

 RAR_chainlink_shackles:0 "Нанять Чейнлинка Шеклза"
 RAR_chainlink_shackles_desc:0 "Самый грозный босс работорговцев в истории Филлидельфии. Его правление окончено, но технические познания остаются непревзойдёнными. Пора заставить его потрудиться на нас."

 SUN_chainlink_spirit:0 "Технические знания Чейнлинка"
 SUN_chainlink_spirit_desc:0 "Благодаря техническим познаниям Чейнлинка Шеклза старые заводские линии в Филлидельфии и вдоль всего шоссе с рёвом возвращаются к жизни. Оружие отремонтировано, двигатели запущены, а производство идёт полным ходом."

 SUN_ranger_prototype:0 "Прототипы брони рейнджеров"
 SUN_ranger_prototype_desc:0 "От Стальных Рейнджеров нам досталась горстка прототипов силовой брони. На основе этих образцов наши инженеры создали улучшенные версии, адаптированные под образ жизни рейдеров: они легче, быстрее и созданы специально для войны на шоссе."

 SUN_sunrider_race:0 "Босс садится за руль"
 SUN_sunrider_race_desc:0 "Босс шоссе Санрайза выиграл великую гонку на арене Саммерфилда, явив своё мастерство вождения всей нации. Вдохновлённый этой победой, каждый рейдер теперь водит ещё агрессивнее."

unification.34.t: "Очистить сточные канавы"
unification.34.d: "В Мейнхеттене гремят выстрелы, а лазерные лучи освещают темноту внутри разрушенного здания. Мантикоры ревут, а спрайтботы, искрясь, валятся на землю. Стальные Рейнджеры в силовой броне стоят бок о бок с единорогами, вооружёнными винтовками «Mag-X», чьи стволы слегка дымятся от непрерывного использования. Сверху падает туша мантикоры – это фестрал и пегас ведут воздушный бой с теми тварями, что ещё остались в воздухе. Рейнджеры и единороги поднимают головы, чтобы полюбоваться зрелищем, но резко вздрагивают от очередного выстрела. Рядом стоит офицер Гаттервилля, а прямо перед ним лежит мантикора, чей прыжок был прерван в полёте пулей в глаз. Офицер выпрямляется. — Живее, у нас ещё полно работы, полюбуетесь позже.\n\nВ другой части города по свежевымощенной дороге с рёвом несётся грузовик, который резко тормозит перед ремонтируемым домом. Безумный гонщик выходит из кабины, закуривает и наблюдает, как единорог зажигает свой рог, поднимая в воздух тяжёлый металлолом. Команда грифонов прижимает металл к стене здания, пока члены Гильдии строителей прибивают их на место. Безумный гонщик усмехается. — Я охренительно боюсь этого твоего рога, Крейн, — единорог мягко улыбается в ответ. — Я и стены Новой Эпплузы не за один день возвёл. К тому же я не умею водить, — безумный гонщик ухмыляется, выпуская струйку дыма. К ним подбегает бывший филлидельфийский работорговец. — До конца дня нам нужно построить ещё пять домов, у вас есть пять минут на перерыв. Хорошая работа.\n\nКантерлотский гуль и зебра бок о бок сортируют медикаменты. Оба поднимают взгляд, когда внутрь, пошатываясь, заходит больной жеребец в сопровождении фестралки. Племенной шаман подбегает к пони, помогая ему удержаться на копытах, пока кобыла обеспокоенно хмурится. — Его зовут Пик, он заболел сразу после того, как изрядно хлебнул местной дряни. Вы можете ему помочь? — зебра подходит, чтобы подставить жеребцу плечо с другой стороны, а гуль тем временем собирает нужные лекарства. — Проще простого, я такое уже не раз видел. Как-то раз один жеребец выпил коктейль с примесью Розового Облака – ну и жуткое зрелище. Подождите здесь, мэм, к концу дня мы полностью промоем ему кишки.\n\nВдали встаёт солнце, привычно бросая свой тусклый свет на Гаттервилль. Но сегодня этот свет кажется чуточку ярче. Существа со всей пустоши трудятся вместе, постепенно стирая воспоминания о прошлом. Впервые Гаттервилль вытащили из сточной канавы. Впервые у них появилась надежда."
unification.34.a: "Надежда даёт силы, когда всё потеряно."

unification.35.t: "Сокровища прошлого"
unification.35.d: "Впервые на памяти нынешнего поколения рейдеры могут проехать весь путь от Фрисайда до самого побережья по самому ценному участку шоссе Санрайз. Оседлавшие Дождь и Безумные Гонщики остались в прошлом – всякая разница между ними забыта ради чистой любви к дороге. Некоторые старые рейдеры-гули начали рассказывать байки о древних Солнечных Гонщиках – великой банде, которая десятилетиями беспрепятственно колесила по шоссе Санрайз, беря всё, что вздумается, и заставляя всех пони дрожать от страха. Теперь, когда рейдеры могут вновь гонять где им угодно, банды стали собираться вне налётов просто ради покатушек, разыскивая следы давно забытых Солнечных Ездоков.\n\nМолодая кобыла слишком сильно разогналась на окраине Фрисайда, вылетела с дороги и рухнула в нижнюю реку Мейр. Радиоактивная жижа отравила её, пока она барахталась в ней. Однако, несмотря на смертельную лучевую болезнь, кобыла из последних сил добралась до ближайшего города, чтобы рассказать о том, что увидела в мутных водах: позолоченный мотоцикл, покоящийся на дне, последнее наследие Габриэля Санрайдера, самого первого Солнечного Гонщика. Вскоре после этого кобыла скончалась, довольная тем фактом, что успела в свои последние минуты поведать о великой находке.\n\nПожилой рейдер из банды Оседлавших Дождь прорывался через Центральный Саммерфилд на тяжелобронированном БТР, пока пятьдесят его подельников, облепивших борта машины, поливали всё вокруг огнём из пулемётов и закидывали взрывчаткой, уничтожая столько ополченцев Эмпайра и пернатых засранцев из Когтей, сколько могли. Их броневик был уничтожен, и им пришлось укрыться в здании, которое враг забросал снарядами. Выжил лишь один рейдер, получивший тяжёлые ранения, но взрывы обнажили великую машину, погребённую под обломками строения: танк, собранный из металлолома и чистого упрямства. То был могучий символ Астигматизма, второго и величайшего главаря Солнечных Гонщиков. Рейдер едва сумел добраться до своих, чтобы поведать об открытии.\n\nА пока группа пленных пони трудилась над восстановлением разрушенного моста на Разбитой дороге, они наткнулись на остов машины Нитро Бустерджуса – личного автомобиля последнего Солнечного Гонщика, прокачанного так, что он превосходил любое другое авто. Проблема в том, что даже со всеми богатствами шоссе Санрайз у нас есть ресурсы для восстановления лишь одного из этих транспортных средств в его былом величии. Что нам вернуть на асфальт: золотой мотоцикл Санрайдера, крутейший танк Астигматизма или навороченную тачку Нитро?"
unification.35.a: "Мотоцикл Габриэля Санрайдера!"
unification.35.b: "Танк Астигматизма!"
unification.35.c: "Машину Нитро Бустерджуса!"

unification.36.t: "Шёпот призраков"
unification.36.d: "Пока группа наших рейдеров грабила недавно захваченную Башню Тенпони, мы наткнулись на целую библиотеку исторических документов. Большинство из них – история чейнджлингов, каких-то киринов, детство принцесс – оказались бесполезным хламом, поэтому мы сожгли этот мусор в огромном костре. Но среди макулатуры нашлось кое-что действительно важное: личный дневник Нитро Бустерджуса, последнего главаря Солнечных Гонщиков. Вот что там говорилось:\n\n«Два дня с тех пор, как Солнечные Гонщики распались. Должен был предвидеть это: Безумные Гонщики и Оседлавшие Дождь спорили годами, чуть ли не в драку лезли, когда не были слишком заняты налётами на других. Позорники хреновы, они осквернили всё, что построил Габриэль. Я бы привязал их к своей тачке и тащил по асфальту, если бы их так не любили простые бойцы. Два дня назад пытался собрать их на вечеринку – думал, смогу убедить их примириться или хотя бы заставлю одного прикончить другого. Но мне, сука, как обычно «повезло»: эти консервные банки, Рейнджеры как они зовутся, припёрлись вместе с кучкой кучкой снобов из Тенпони. Чуть и меня не укокошили – один из этих огромных стальных засранцев взял меня на мушку, я бы точно сдох, если бы движок заглох. Дождевые и Гонщики подумали, что это подстава, обвинили друг друга и устроили резню. Если бы не они, может, ещё оставалось бы что-то, что можно спасти. Но нет. Солнечные Гонщики мертвы. Бомбы не прикончили нас, флот не остановил, нет... лишь мы сами смогли уничтожить себя. Как символично.\n\nДумаю, буду вести эти записи и дальше. Не знаю, какой от них толк. Может, это просто удержит меня от того, чтобы пустить пулю в лоб. А может, когда-нибудь в будущем кто-то их найдёт. Было бы круто увидеть своё имя в будущих учебниках истории, пусть даже в роли самого главного неудачника, которого когда-либо знало это шоссе. Знаешь, мы ведь никогда не проезжали по шоссе Санрайз целиком за раз – только по той части, где можно было кошмарить беженцев. Флот заблокировал путь на юг. Но я смотрел на карты и видел, что это шоссе тянется всё дальше и дальше. И я буду гнать по нему так долго, как смогу. Всё лучше, чем сидеть на месте».\n\nМы, рейдеры, не славимся любовью к истории, но всё же имя последнего главаря наших предков окружает атмосфера особого почтения. Многие, кто услышит об этом, захотят уничтожить Тенпони и Стальных Рейнджеров за то, что они совершили, другие же просто захотят поучиться у Нитро. Но в сердце каждого, кто любит дорогу, горит желание проехать это шоссе до самого конца, следуя за задними огнями машины нашего предка."
unification.36.a: "Месть! Кровь!"
unification.36.b: "Пойти по пути Нитро."
unification.36.c: "Извлечь уроки из его ошибок."

unification.37.t: "Вдарить по тормозам"
unification.37.d: "«Восемь дней с тех пор, как Солнечные Гонщики распались. На шоссе я попал в засаду флота, они раздолбали мою тачку, так что она осталась погребённой под мостом. Мне удалось найти другую машину возле электростанции или генератора – хрен разберёшь, что это было. Старомодное корыто, из тех, на которых разъезжают гангстеры в шарах памяти. Старик Габриэль прибил бы меня, узнай он, что я рассекаю на этом хламе, словно какой-то богатый вингбардиец. Впрочем, теперь это неважно. Старая развалюха продержалась достаточно долго, чтобы довезти меня по шоссе до Филлидельфии, но радиатору хана, а припасы на исходе. Мне страшно не хочется этого делать, но, похоже, придётся помочь кому-то в этом проклятом месте, чтобы получить помощь взамен.\n\nЭтот город – настоящая зона боевых действий, здесь всё куда хуже, чем когда-либо было в Мейнхеттене. И пяти футов нельзя проехать, чтобы не пришлось пригибаться и искать укрытие. Тут воняет кровью и гнилью. В городе заправляют работорговцы, погрязшие в бесконечной войне за новые территории и новых рабов под своими знамёнами. Но здесь есть не только работорговцы – несколько групп невольников пытаются сражаться, чтобы освободить своих собратьев по всему городу. Конечно, даже если им удастся перебить работорговцев, сомневаюсь, что они долго пробудут едины. Они разорвут друг друга на части – таков уж закон пустоши. Ещё я встретил здесь стальных пони, этих шагающих танков. Похоже, они в городе недавно – какой-то экспедиционный отряд, желающий прибрать к копытам местную промышленность. Огневой мощи у них навалом, а вот солдат не хватает: я видел, как их просто задавили числом, забрасывая пушечным мясом. Кажется, тут было и кое-что ещё – республика, засевшая на станциях метро под землёй. Я нашёл то, что от неё осталось, – всё разнесено в щепки, а от всей системы подземки несёт гнилой мятой и смертью.\n\nУ всех фракций есть припасы, которые мне так нужны. На дороге я слышал об ещё одном шоссе к югу, Азурвэе. Не знаю почему, но я хочу добраться туда. Думаю, просто хочется проехаться по чему-то, кроме Санрайза. Часть меня желает просто сдохнуть здесь, став очередной кучкой костей, сдавшей перед жестокостью Филлидельфии, но я пока не позволю этому случиться. У городских рабов полно пони и пушек, но работорговцы превосходят их и числом, и вооружением, так что бедолаги просто бросаются на врагов и дохнут. Думаю, у меня богатый опыт налётов, я мог бы обучить их воевать с умом. Конечно, есть ещё Шеклзы, крупнейший клан работорговцев в Филлидельфии, они засели на старых фабриках и используют потрёпанные стволы и ножи. Я столько времени провёл, копаясь в движках, что мог бы подсобить и им: перезапустить пару старых заводских линий или показать, как чинить оружие. Ну и, разумеется, остаются стальные пони. Эти ублюдки чуть не убили меня на севере, но я должен отдать должное их броне. Они словно носят на себе танк. И раз уж я так хорошо разбираюсь в настоящих танках, то, возможно, смогу подкинуть им парочку прототипов для этой брони. Пожалуй, пора на боковую. Утро вечера мудренее»."
unification.37.a: "Рабы помнят его тактику молниеносных налётов."
unification.37.b: "Шеклзам пришлись по душе его познания в механике."
unification.37.c: "У рейнджеров всё ещё осталось несколько прототипов."

unification.38.t: "Пустой бак"
unification.38.d: "«Когда я был совсем мелким, Габриэль после налётов рассказывал нам, жеребятам, разные истории. Он говорил о солнце, в честь которого назвали нашу банду – о том, какое оно яркое и прекрасное. Говорил, что нас зовут Солнечными Гонщики, потому что мы – яркий островок свободы, оставшийся после конца света. Что мы мчимся по шоссе с востока на запад, в точности как солнце, и что нас невозможно остановить, как когда-то нельзя было остановить само солнце. Он много чего рассказывал. Про зеленеющие поля Герцланда, где он вырос; про красоту танцовщиц из Седельной Аравии; про чистейшее синее небо и то пьянящее чувство, когда ты можешь свободно лететь через всю страну, имея лишь тачку и полный бак бензина. Он рассказывал о тогдашних дорогах, забитых пони, которые сновали туда-сюда, о месте, которое было по-настоящему свободным в мире, где свободы больше не осталось нигде. Как бы я хотел увидеть всё это своими глазами. Хотел бы увидеть солнце в зеркале заднего вида, пока мой движок ревёт на полностью отремонтированном шоссе. Хотел бы доехать до самого Вракса, подцепить там какую-нибудь кобылку-чейнджлинга и завести семью. Хотел бы прокатиться мимо виноградников Клубничного Герцогства и провести остаток дней, собирая новые тачки в Йеле. Но ведь ничего этого не случится, верно?\n\nПустошь убивает нас с самого рождения, потому что она забирает единственное, что делает нас лучше животных. Надежду. Мы все видели, как это произошло с Габриэлем: видели, как его глаза тускнели день ото дня, пока однажды он просто не исчез. Мы видели это каждый день на Санрайзе. Зачем мы убивали пони? Нам не особо-то и нужны были их шмотки. С нашими машинами мы могли бы стать торговцами, могли бы построить что-то стоящее. Место, которое было бы свободным, место, где не плевать друг на друга. Но ничего не осталось. Новый Мейрвей сохраняет пони жизнь, но ломает их дух. Разбитое Копыто забивает на всё, что находится за пределами их тюрьмы. А Филлидельфия – это просто мясорубка, перемалывающая каждого, кто окажется рядом. Кем же были Солнечные Гонщики? Всего лишь бандой бродячих дикарей, разрушающих всё на своём пути.\n\nУ меня закончился бензин. Я думал, что если поеду по Азурвэю, то увижу хоть что-то, ради чего захочется двигаться дальше. Но не увидел. Я всё думаю о том, что увидел в метро под Филлидельфией. Мёртвая республика, разорванная в клочья. И знаете, что я понял? В тех пони было больше жизни, чем когда-либо во мне. Потому что пусть даже на мгновение, но у них была надежда. А пустошь уничтожает надежду. Никто и не вспомнит ту попытку обрести надежду в глубинах Филлидельфии. Никто не вспомнит меня. Хотел бы я вернуться на Санрайз. Чтобы они смотрели, как я подыхаю, и понимали, что скоро их ждёт то же самое. Хотел бы я напоследок увидеть солнце. Здесь для меня больше ничего нет. Прощайте»."
unification.38.a: "Он заслужил свой последний заезд."

unification.39.t: "Конвой"
unification.39.desc: "Двигатели тихонько урчат, пока здоровенный конвой мчится по дорогам. Начав свой путь в небесном порту Кумулус, колонна проехала по шоссе Санрайз, миновала Филлидельфию и вышла на Азурвэй, двигаясь в спокойном темпе, непривычном для рейдеров Санрайза. Тысячи зевак наблюдали за ними с обочин улиц: рейдеры, рабы, побеждённые враги и даже несколько гостей из-за рубежа. Во главе конвоя шла отреставрированная тачка старого главаря Солнечных Гонщиков – за рулём сидел нынешний босс шоссе Санрайз, а на пассажирском сиденье покоился скелет Нитро Бустерджуса с отверстием от пули в черепе. По словам старых рейдеров, это был самый почётный способ провожать бывших главарей – устроить им последний заезд по шоссе.\n\nРейдеры не славятся тонкой душевной организацией, чаще всего они испытывают лишь ярость, похоть или экстаз. Но каждый рейдер, который дорожит своей тачкой, прочитал дневники Нитро, и обычно буйные бандиты притихли. Каждый вынес из чтения что-то своё, но все ощутили одинаковую торжественную печаль – чувство незнакомое и неуютное. Многие говорят, что мы доказали, что достойны имени, которым звали себя наши предки. Потомки Солнечных Гонщиков свободно гоняют по дорогам, так что нам следует принять эту честь и вернуть древнее название. Другие утверждают, что мы доказали, что не нуждаемся в предках: мы всё ещё живы, в то время как Нитро и все остальные Солнечные Гонщиков мертвы, и Империя Санрайз стала именно такой, какой и должна быть.\n\nКое-кто из молодых рейдеров шёпотом переговаривается о концепции довоенных дорог. Они мечтают о трассах без трещин и ухабов, о гладкой езде из одного места в любое другое. Молодёжь считает, что банде нужно перестать зацикливаться только на прокачке машин, а вместо этого заняться ремонтом дорог и защищать их от любого, кто попытается их разрушить. Они не успокоятся, пока банда не заделает каждую трещину, каждую кочку и каждую выбоину на шоссе.\n\nИстория, рассказанная Нитро, задела за живое многих в банде – то, как Солнечные Гонщики разорвали самих себя на части, как они не смогли построить ничего нового и долговечного. Многие из тех, кто не принадлежит к рейдерам – будь то рабы, механики или обычные жители – хотят превратить банду во что-то новое и лучшее, что оставит прочный след в истории. Мы не Солнечные Гонщики и не должны оставаться просто шоссе Санрайз. Нам нужно стать чем-то новым, что объединит традиции прошлого с надеждой на будущее. Конвой продолжает свой путь, но все знают: как только он остановится, банда изменится навсегда. Нам необходимо..."
unification.39.a: "... прославлять прошлое."
unification.39.b: "... оставаться прежними."
unification.39.c: "... защитить эти дороги."
unification.39.d: "... пойти на радикальные перемены."

unification.40.t: "Новые порядки"
unification.40.desc: "Ветер тихонько дует над ареной Саммерфилда, на которую выезжает новая машин. Тысячи автомобилей, байков и более крупных транспортных средств хаотично припаркованы вокруг недавно построенного стадиона – все они собрались, чтобы увидеть гонку века, которая определит будущее всей нации. Фестралка глубоко вдыхает: запах машинной смазки и масла кажется ей приятным и родным по сравнению со смогом, к которому она привыкла в Филлидельфии. Нью Мун медленно останавливается у въезда на арену. Но едва она собирается двинуться дальше, её останавливает пассажир – жеребец по имени Пик. — Послушай, Мун, знаю, ты угрохала кучу денег на эту тачку, но это же безумие! Ты можешь погибнуть! — она замирает на секунду, смотрит на него и затем тихо произносит. — Я погибла в тот самый миг, когда Красный Глаз заковал меня в цепи. А это – мой шанс начать жить. Увидимся на финише, когда я выиграю, Пик, — жеребец лишь тяжело вздыхает и выбирается из салона, позволяя Мун выехать на арену.\n\nТысячи существ наблюдают за происходящим с трибун, пока комментатор надрывается через громкоговорители, представляя каждого участника. Нью Мун не обращает на них внимания – она выезжает на трассу и паркует машину на своей стартовой позиции. Слева от неё огромный як стоит рядом с выпотрошенным танком, топая копытами и крича. — Як КРУШИТЬ жалкий пони-соперник! Як создать Седьмой Каганат! — чуть дальше кобыла-зебра в белоснежном одеянии восседает на моторизованной колеснице и неспешно потягивает красное вино. На первой позиции стоит сам босс – лучшие механики Безумных Гонщиков наносят последние штрихи на его личную тачку.\n\nСправа доносится оглушительный рёв мотоцикла: Блэк Сис, бывшая мэр города Дружбы, газует на дорогущем байке. На ней дизайнерская байкерская куртка и чёрные солнцезащитные очки. За ней пристраивается БТР с развевающимися по ветру потрёпанными флагами Разбитого Копыта – бывшие инженеры этой фракции проводят финальную проверку бронемашины, пока маршал Стил Уолл усаживается в кресло. Земля содрогается, и Нью Мун переводит взгляд на въезд: на арену вкатывается целый корабль на колёсах. Десятки бывших матросов орут и улюлюкают, пока капитан Жак ведёт этот «Стейблсайд» – лебединую песню Ржавого Остова.\n\nКомментатор снова объявляет весь список, пока соперники Нью Мун купаются в лучах грядущей славы. Устав от этой какофонии из объявлений, криков, морских шанти, воплей яка «КРУШИТЬ!» и рёва моторов, Нью Мун поднимает стёкла, возвращаясь в привычную тишину. Она закрывает глаза и шепчет: «Милосердная Луна, присмотри за мной». Открыв глаза, фестралка щёлкает тумблером радио, после чего салон заполняет записанная на плёнку речь Красный Глаз. Начинается обратный отсчёт. Кобыла крепче сжимает руль, её вертикальные зрачки пристально всматриваются вдаль, и гонка начинается. В итоге побеждает..."
unification.40.a: "... Босс!"
unification.40.b: "... Нью Мун!"
unification.40.c: "... Блэк Сис!"
unification.40.d: "... Стил Уолл!"