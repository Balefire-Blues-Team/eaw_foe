###Events###

unification.5.t: "Бесстрашие"
unification.5.d: "«Пони Республики, а также наши новые сограждане! Я – ваш президент Лауд Спик. Я сижу здесь, у камина, в котором весело трещат дрова, заготовленные в самом Вечнодиком лесу, и только что закончил беседу с мистером Кворри и Старым Рексом – двумя уважаемыми представителями наших недавно интегрированных соседей. Я знаю, дорогие пони, что годы засилья консерваторов научили вас бояться внешнего мира и тем самым изрядно ослабили. Ведь только слабые отвергают неизведанное из-за своего страха. Сильные же всегда стремятся к прогрессу, словно жеребята, бегущие за заходящим солнцем; они уверенно шагают в неизвестность с твёрдой убеждённостью, а не со страхом. Именно этот трусливый, заискивающий консерватизм привёл к тому, что президент Вайд Сэвидж потерял свой пост. И именно смелый, созидательный прогрессивизм позволил мне превратить нашу страну в великую и могучую нацию.\n\nДа, устои псов Вечнодикого леса или Союза ущелий могут показаться нам странными, но если мы отвергнем их, то попросту погрязнем в застое, оставшись в полном одиночестве посреди постоянно меняющегося мира. Оглянитесь вокруг, мои сограждане. Да, у нас действительно есть причины для опасений, но угроза исходит вовсе не изнутри. На востоке поднимает голову озлобленный и жаждущий власти жеребец по имени Ред Ай, истинный бастион консерватизма. А фальшивая пророчица Гаудина Грознопёрая, прикрываясь лживой маской прогресса, уже засматривается на наши прекрасные земли своими алчными грифоньими глазами. И когда Филлидельфия или Расколотое Копыто пойдут на нас войной, поверьте, мои пони, вы будете счастливы, что на вашей стороне стоит мощь алмазных псов, адских гончих и карьерных угрей. Мы больше не станем сидеть сложа копыта. Мы больше не захолустная республика и не второстепенная держава. Сегодня мы – Великая Республика, и отныне мы будем вместе бесстрашно маршировать в будущее. А теперь налейте-ка сидра и разделите его со своими новыми соседями, мои пони. Теперь вы все – граждане одной страны»."
unification.5.a: "Вместе в будущее!"

unification.6.t: "Громкоговорители"
unification.6.d: "«Пони Республики и союзные нам существа, я рад вновь говорить со всеми вами. Многое изменилось с момента моего последнего радиообращения, и благодаря нашим усилиям по восстановлению теперь мой голос слышен каждому. Наши миротворческие миссии продвигаются успешно». Бакшот укрывается в горящем доме со своей неизменной жуткой ухмылкой на устах; вокруг него лежат горы взрывчатки и оружия, брошенные убитыми рейдерами. Солдаты подбираются всё ближе, уничтожая очередного бандита. Бакшот тянется к своему ружью, но с удивлением видит, как оно взмывает в воздух. Рядом с ним стоит рейдерша-единорожка и целится ему прямо в голову. А в кармане у неё надёжно спрятано подписанное президентом помилование за прошлые преступления. Бакшот заходится безумным хохотом, когда его оружие гремит в ответ, а висящий неподалёку громкоговоритель продолжает вещать как ни в чём не бывало: «Закон и порядок восстанавливаются в каждом уголке Республики, пока последние остатки беззакония и хаоса изгоняются с наших земель».\n\nФезербраш весь покрыт грязью и кровью. Вместе с адской гончей и старым объездчиком карьерных угрей он сидит за столом в небольшой лачуге: они обсуждают поставки оружия и снаряжения для сопротивления. Они так увлечены спором, что никто не замечает опасности, пока газовая граната не разбивает окно. В домик мгновенно врываются солдаты в противогазах. Адскую гончую убивают прежде, чем та успевает среагировать, но Фезербраш дерётся как одержимый: острые грифоньи когти рвут броню и плоть под ней. Однако дым быстро заполняет его старые лёгкие; он падает, и сквозь туман на него безжалостно смотрят холодные стёкла противогазов. А из репродукторов сквозь шум борьбы доносится: «Автократы и тираны, стремившиеся расколоть нашу любимую республику, повержены».\n\nЖеребёнок в болотной деревушке вздрагивает, когда здоровенный жеребец толкает лавочника и забирает его товар. Малыш рад уже тому, что целью нападения стал не он. Он заворожённо слушает голос из громкоговорителя: «Процветание, безопасность и стабильность придут к каждому гражданину нашей прекрасной республики, это я вам обещаю. Сегодня, мои пони...» Жеребёнок очарован этим голосом и далёким Капитолием. Солдаты бьют зачинщика беспорядков прикладом по затылку и утаскивают прочь, но малыш этого даже не замечает. Он уже представляет себя в строгом костюме и галстуке, обращающимся к миллионам пони через точно такие же репродукторы. С улыбкой на лице он вскакивает и бежит домой, а его разум переполнен картинами великого будущего. Его уши подёргиваются, ловя последние слова послания из динамиков, которое достигает ушей каждого гражданина республики.\n\n«Наша Республика воистину...."
unification.6.a: "... вечна»."

unification.7.t: "Искусство, тени и плоть"
unification.7.d: "Акрилик Скетч сидел в своей скромной маленькой хижине и слушал по радио ещё довоенные песни. Между делом он зарисовывал мутировавшую собаку, которую увидел совсем недавно, после чего со спокойным вздохом взглянул на получившийся набросок. Акрилику до сих пор не верилось, что лучший друг пони – столь доброе и преданное существо – из-за противоестественной магии превратился в подобный кошмар. Он на мгновение задумался о том, сколько ещё уникальных существ Зебрики теперь выглядят столь же ужасающе.\n\nВнезапно радиоприёмник, словно обретя собственный разум, переключился на другую волну, на которой Акрилик услышал по-настоящему жуткие звуки. Всплески воды, хрипы пони или какого-то другого существа, захлёбывающегося собственной кровью или иной жидкостью, и доносящееся из динамика бурление. Не поддаваясь панике, Акрилик улыбнулся: он подумал, что это, должно быть, просто странные помехи и ничего более. Он снова переключил канал, но кошмар не прекратился. Теперь радио транслировало звуки пустого помещения, наполненного шёпотом, скрипом работающих верёвок и шкивов, чьим-то удушьем и криками какого-то несчастного, обречённого на участь, которую Акрилик не мог даже вообразить. А на фоне всего этого мягко и торжественно пел хор из кобыл и жеребцов. Они пели прямо под звуки последнего вздоха пони, чью жизнь уносила какая-то неведомая сила.\n\nАкрилик глубоко нахмурился и прижал уши, стараясь максимально приглушить этот шум. Крики и звуки смерти начали затихать, позволив ему расслабиться хотя бы на секунду. Но вдруг его ухо дёрнулось – пони отчётливо услышал, что пение становится как будто ближе."
unification.7.a: "Некоторые секреты лучше оставить под водой."

unification.8.t: "Непризнанный шедевр"
unification.8.d: "Сержант Коппер Пайк и его отделение маршировали среди старых руин Либертивилля, что находился прямо за чертой Капитолия, пока на город опускалась ночь. Он не знал, что именно здесь произошло, но отчётливо понимал: что-то не так. Воздух на вкус был... неправильным, словно пропитанный ржавым металлом и грязью, гниющей на солнце. Многие некогда уютные деревянные здания с соломенными крышами были разрушены. Остальные заросли мхом и покрылись слоем грязи и крови. Даже металлические постройки успели заржаветь и развалиться.\n\nКоппер посмотрел на своих солдат – троих молодых жеребцов, едва оставивших детство позади, которых призвали на службу ради защиты их великой Республики. Заметив, что его бойцы замерли от ужаса, а их копыта дрожат, сержант кивнул им и заговорил едва слышно, словно боясь пробудить что-то давно уснувшее в этом городе. — Так, жеребятки, слушайте меня внимательно. Очевидно, что здесь что-то затевается, и боюсь, что даже Капитолий в опасности. Я не стану требовать от вас понапрасну рисковать своими жизнями. Хотите смыться отсюда? Вы свободны. Боюсь, нашей Республике уже пришёл конец, — сержант низко опустил голову, пока трое жеребцов спешно разбегались в разные стороны. Дезертиры, что с них взять. И всё же эта Республика была его жизнью, и если придётся, Коппер Пайк пойдёт ко дну вместе со своим кораблём. Сделав решительный, глубокий вдох мутного болотного воздуха, сержант зашагал по улице в поисках знаков – следов борьбы, примет битвы, любых признаков жизни или хотя бы смерти.\n\nВыйдя к тому, что когда-то было старым центром Либертивилля, он застыл на месте, заметив ужасающий кошмар. Мёртвый пони, чьё тело использовали как чашу для болотной воды, а голову насильно запрокинули к небу. Глаза и рот были выколоты и залиты болотной жижей, которая самым отвратительным образом пузырилась, пенилась и шипела. На груди была вырезана надпись: «Узрите моё финальное творение; и да разверзнется Трясина». Коппер закрыл глаза и вскинул винтовку, твёрдо решив прекратить мучения несчастного, как вдруг услышал далёкие крики. Дрожа всем телом, сержант закинул свою рычажную винтовку за плечо и галопом помчался на звуки.\n\nДобравшись до места, он обнаружил огромное количество крови на мокрой грязи, разбросанные повсюду ошмётки плоти, расколотый надвое шлем, аккуратно разобранную винтовку и лежащую рядом изуродованную голову одного из его солдат. Коппер лишь испустил короткий, дрожащий вздох перед тем, как почувствовал, что его тело полностью онемело. Он мог лишь жалобно заскулить, падая навзничь."
unification.8.a: "Ни законы, ни правительство не сдержат природу."

unification.9.t: "Разведывательный отчёт PB-06, он же «Трясина»"
unification.9.d: "Место: Богвилль, провинция Гринлайн-Рад Рыбаки\nДокладчик: Мунталон, глава «Ока Гауды»\nПричастный персонал: «Око Гауды», Мунталон\n\nДоклад: Я и моя команда прибыли в Богвилль – деревню на самой границе с поразившей север заразой, которая разрослась настолько, что уже вовсю травит и этот город. Вода становится ещё более непригодной для питья, чем обычно. Местные жители умирают, стоит им сделать глоток, и, судя по всему, очистить её может лишь долгое и интенсивное кипячение. Каждый день пони, грифоны и прочие существа, покрытые личинками, ужасными поражениями кожи и с красными, затуманенными глазами, обращаются к целителям, у которых вскоре и умирают. Местные врачи считают, что они страдают от лучевой болезни, но это явно что-то куда более жуткое: многие пациенты умоляют прекратить их мучения, пока они заживо гниют. Соседние государства вроде Новой Эпплузы уже тоже начинают сталкиваться с этим кошмаром. Эти события либо нарушили, либо полностью прервали наши северные маршруты снабжения, поскольку здешние земли становятся слишком враждебны даже для самых оснащённых караванных компаний. Пони на дальнем севере из мест вроде Понивилля и Сердца Эквестрии сообщают о тех же проблемах.\n\nПрезидент Гаудина, я рекомендую срочно направить сюда санитарные отряды с огнемётами, ибо лишь пламя может по-настоящему обуздать эту трясину. Чем дольше мы медлим, тем сильнее страдаем, и я боюсь, что в итоге мы будем вынуждены либо отступить, либо оставить после себя города-призраки. Пришлите сюда Бладая и его громил для поддержания порядка. Нельзя допустить, чтобы ситуация вышла из-под контроля. За НКР."
unification.9.a: "ТОЛЬКО ДЛЯ ГЛАЗ ПРЕЗИДЕНТА"

unification.10.t: "Начало Союза"
unification.10.d: "Когти скрежещут по металлу и дереву – то наёмники-«Когти» взяли на изготовку свои винтовки, наставив их на укреплённую дверь оружейной. Один из них гордо стоит с револьвером в когтях, обращаясь к товарищам. — Держите пушки наготове, друзья. Фезербраш пал, но мы не сдадимся! Отправим этих пони обратно в их Ущелье! — грифон целится из револьвера в дверь, но его прицел сбивается, когда земля под лапами содрогается. Металлический пол бункера разлетается на куски, и внутрь врывается гигантский угорь, поднимая в воздух тучи пыли и обломков. Прежде чем наёмники успевают прийти в себя, пони Ущелья спрыгивают со своего ездового угря, направляя на них оружие. — Сдавайтесь, а иначе станете следующим обедом для этого угря!\n\nВ другом месте солдат Ущелья наблюдает, как равнинные пони тащат за собой на городскую площадь связанного жеребца. Пойманный Бакшот неистово кричит. — Снимите с меня эти проклятые верёвки! Ах вы, ублюдки-импотенты! Я убью вас всех, как только выберусь отсюда! — пони швыряют пленника к копытам солдата, который смотрит сверху вниз на бывшего главаря рейдеров. Бакшот сплёвывает кровь на землю и криво ухмыляется. — Я выжгу всё ваше проклятое Ущелье дотла! Вы все сгорите! Сгорите! — солдат молча поднимает винтовку и пускает пулю прямо между глаз рейдера. Окружающие поселенцы облегчённо вздыхают.\n\nСолдаты стоят на краю Жуткого Ущелья, и дым от их сигарет поднимается к облакам в небе. Старший из них проверяет запасы патронов. — Не представляю, каково это – быть в составе оккупационных войск. Как бы странно я чувствовал себя без привычных стен Ущелья вокруг! — младшая из группы слегка ухмыляется, чистя свою винтовку. — Я слышала, что многие из наших сил скоро вернутся. Бакшота поймали, а сейчас, судя по всему, идёт бой против последних «Когтей» – значит, мы готовимся к чему-то масштабному, — она улыбается ещё шире и тренированными движениями быстро собирает оружие. — До меня дошли слухи, будто Республика – следующая в списке на вступление в Союз, — старший тихо кивает. — Главное, чтобы мы были в безопасности."
unification.10.a:0 "В безопасности мы и будем."

unification.11.t: "Пламя"
unification.11.d: "Два рейдера – ухмыляющийся жеребец и следующая за ним кобыла – оставляют за собой шлейф пыли, приближаясь к фигуре почти мифического главаря. Бакшот стоит, широко выпучив глаза и ухмыляясь ещё шире, наблюдая, как банды развлекаются с экипировкой «Когтей» и пируют мясом карьерных угрей, зажаренным на огромных кострах. Жеребец останавливается позади Бакшота и подобострастно улыбается. — Бакшот, вот и мой любимый рейдер! Знаешь, я всегда говорил остальным, что за тобой нужен глаз да глаз. Знаю, меня не было рядом, чтобы помогать тебе, но, понимаешь, я всегда пытался заставить других понять то, что видел в тебе сам. О, кстати, я Дабл Бэррел, а это моя рабыня. Это мой подарок. Можешь даже назвать её сам, у неё пока нет имени.\n\nБакшот некоторое время продолжает смотреть вперёд, а затем с широкой улыбкой поворачивается лицом к Дабл Бэррелу. — Прости, я разве просил тебя разевать рот? — Дабл Бэррел моргает. — Э-э, нет. Не думаю, но я просто подумал... — Бакшот разражается безумным хохотом и резко разворачивается к нему. — Подумал? Ты подумал? Должно быть, думал ты не слишком усердно! Если бы ты думал как следует, то прямо сейчас умолял бы сохранить тебе жизнь, предательский кусок ты дерьма, — он подходит ближе к Даблу, который слегка отстраняется. — Где же ты был, когда я подминал под себя «Когтей»? Где ты был, когда я уничтожал Ущелье? Где ты был, а?\n\nДабл слегка заикается. — Я-я... прошу прощения, босс, я просто, ну, понимаете, говорил другим бандам, что они должны помочь вам, н-но они не слушали, вот же негодяи! Я на вашей стороне, всегда был, предан по гробовую доску! — Бакшот ухмыляется. — Знаешь, что я ненавижу больше всего на свете? Я могу простить того, кто сражается против меня – нельзя же винить идиота за то, что он идиот. И того, кто ненавидит меня. О, у них хотя бы есть принципы! Но ты... ты хуже их всех. Ты – жалкий червь, — дробовик оглушительно ревёт, начисто отрывая Даблу ногу.\n\nДабл падает на землю, уставившись на обрубок, где только что была конечность. — Твою мать! За что?! — стоящая в стороне кобыла смотрит на это и хищно ухмыляется. Бакшот переводит на неё взгляд, облизывая губы, и подходит ближе, сохраняя безумную ухмылку. — А вот в тебе... о, в тебе я вижу потенциал. Ну давай. Что нам с ним сделать? — она смотрит на жеребца, затем на Бакшота, и в её глазах разгорается злобное пламя. — Сожги его. Заживо, — рейдер смотрит на неё и ухмыляется так, что щёки вот-вот лопнут. — Дорогуша, ты определённо в моём стиле."
unification.11.a: "Враги обратятся в пепел."

unification.12.t: "Костёр"
unification.12.d: "Кобыла стоит, расплывшись в широчайшей ухмылке, и наблюдает, как Новая Эпплуза выгорает дотла, а рейдеры продолжают грабить ещё целые здания. Пока она смотрит на бушующее пламя, что-то взмывает из огня, проносится по небу, а затем устремляется по дуге прямо к ней. Сверху на рейдершу пикирует косоглазая кобыла-гуль, разбивая о её голову школьную меловую доску. Кобыла-рейдер отступает на шаг, её голова неестественно дёргается в сторону от силы удара. Медленно сплюнув на землю кровь вместе со сломанным зубом, она облизывает губы и вновь ухмыляется, переводя взгляд на кобылу-гуля.\n\nПегаска-гуль пикирует для следующего удара, замахиваясь почти расколотой доской, но кобыла уклоняется в сторону, прежде чем та успевает её задеть. Выхватив нож, она вонзает его в бок гуля. На лице пегаски возникает болезненная гримаса, и та падает на землю перед рейдершей. Агрессорша смотрит на неё сверху вниз, подносит нож и слизывает с него покрывающую лезвие кровь гуля. Её ухмылка становится ещё шире, когда она встречается взглядом с глазами кобылы-гуля, смотрящими в совершенно разные стороны. — Хороший выпад. Но всё-таки недостаточно хороший, — она облизывает губы и, издав короткий смешок, бросает свой нож перед гулем. — Давай, проваливай отсюда. И в следующий раз используй оружие получше. Ты слишком забавная, чтобы тебя убивать, — гуль смотрит на нож, затем на рейдершу, хватает оружие и спасается бегством.\n\nБакшот заговаривает у неё за спиной. — О-о-у, а я-то думал, что она сможет тебя прикончить, — кобыла поворачивается и отвечает с широкой ухмылкой. — Хей-хей, Бакки. Если уж Бэррел не смог меня уложить, то какая-то косоглазая пегаска точно с этим не справится, — она облизывает губы и кивает головой в сторону горящего вдали города. — Всё именно так, как ты и хотел, Бакки, — Бакшот широко оскаливается, осматривая полыхающий город: — Здесь ещё полно растопки. Я же хочу разжечь... лесной пожар! — он облизывает губы и снова смотрит на неё. — У тебя ведь до сих пор нет имени, верно?\n\nКобыла гордо выпрямляется, пока оранжевые языки пламени вдалеке очерчивают её силуэт. — А разве это имеет значение, Бакки? — она ухмыляется ещё шире, склонив голову набок. — Я просто делаю то, чего хочешь ты. Да, конечно, я хороша, но только потому, что подражаю кому-то куда более великому, — он смотрит на неё, и его улыбка прерывается безумным хохотом, после чего он подходит ближе. — Твою мать! А ты забавная! Да, знаешь что, а это ведь верно. Ты, по сути, просто ухудшенная версия меня, — он вновь облизывает губы и наклоняется. — Шевелись, нам ещё нужно сжечь всю пустошь. Птицебойка."
unification.12.a: "Дым виден за многие мили."

unification.13.t: "Лесной пожар"
unification.13.d: "Джанкшнтаун и Разбитое Копыто полыхают – жаркое пламя пожирает амбициозный город, желавший стать столицей пустоши. Крики невинных обрываются пулями рейдеров. Последний выживший «Коготь» сидит посреди дороги, наблюдая за приближением предводительницы этой атаки – самой ужасающей кобылы во всей НКР, Птицебойки. Он кашляет, когда она подходит ближе. — Я сдаюсь. Пожалуйста, я сделаю всё, что захочешь. Я готов присоединиться к вам, — Птицебойка подходит к грифону и смотрит сверху вниз с широкой ухмылкой. Кобыла наклоняется, слизывает пепел с его перьев и отстраняется с ещё более широким оскалом. — Знаешь что? Думаю, я проголодалась.\n\nОн вжимается в землю, дрожа от её прикосновения. — Я-я... я могу достать тебе немного еды... — кобыла упирается копытами в его бок и ухмыляется ещё сильнее. — Я желаю кое-чего конкретного, — она облизывает губы, пристально глядя ему прямо в глаза. — Жареной курятины, — одним движением она швыряет раненого грифона прямиком в окно горящего здания; его крики длятся недолго. Кобыла смотрит ему вслед, расплывшись в широчайшей ухмылке, пока языки пламени доносятся до неё со всех сторон. Из глубины её груди вырывается смешок от самой смешной шутки в мире, понятной ей одной.\n\nВ соседнем здании взрывается зажигательная бомба. К ней подходит Бакшот, в его широко раскрытых глазах пляшут отблески огня, отражаясь в ещё более широкой ухмылке. — Понюхай этот дым, Птицебойка. Месяц – и здесь не останется ничего, кроме пепла и золы, — Птицебойка переводит на него взгляд и с ухмылкой кивает. — Как пожелаешь, Бакки, — он посмеивается, слизывая с губ пепел и сажу, и смотрит ей в глаза. Затем жеребец протягивает копыто и улыбается как никогда широко. — Потанцуем? — она хихикает и принимает его копыто. — Думала, ты никогда не спросишь...\n\nОн прижимает её к себе, и они начинают двигаться. Копыта ступают по покрытым пеплом черепам, а прах кружится вокруг них подобно торнадо, пока они вращаются в танце. Горячее пламя забирает жизни последних защитников, предсмертные вопли служат им музыкой, крики невинных – мелодией, а рушащиеся здания задают ритм. Он скалится, пока её ухмылка становится всё шире. Огонь бушует повсюду, но самое яркое пламя пылает у них внутри."
unification.13.a: "Прах к праху."

unification.14.t: "Равнины"
unification.14.d: "Пони с равнин собираются со всей округи, наблюдая за приземляющимися в маленьком городке наёмниками-«Когтями», чьё хорошо смазанное оружие и чистая броня зловеще поблёскивают на солнце. Никто не смеет даже потянуться к своим ружьям или сделать лишнее движение, ведь зоркие грифоны следят за каждым их шагом. Последним на землю опускается пожилой грифон: сам Фезербраш окидывает собравшихся пони тяжёлым взглядом и двигается вперёд, глубоко вонзая когти в пыль равнины.\n\nС другой стороны городка одновременно прибывает группа пони: они облачены в грязную броню, а оружие едва может стрелять. Их предводитель тащит за собой верёвку, что обмотана вокруг шеи тела, которое всё ещё истекает кровью. Они медленно рысят по направлению к грифонам и бросают мёртвого пони прямо перед Фезербрашем. Грифон смотрит на труп Бакшота, который даже после смерти всё ещё безумно скалится, а пони с равнин говорит. — Это подарок, Фезербраш. В знак доброй воли.\n\nФезербраш поднимает взгляд и слегка кивает пони. Он подзывает своих «Когтей» ближе, и те поднимают тело. — Я повешу его на видном месте. Напомню всем, какова цена рейдерства, — стоящий напротив него пони кивает. — Мы все благодарны за освобождение нашего дома, Фезербраш. Мы потеряли многих близких из-за безумных поджигателей. Но мы не собираемся сидеть сложа копыта и приветствовать нового «Босса», — пони смотрит ему прямо в глаза. — Мы, пони равнин, можем сами о себе позаботиться. Да, мы будем платить вам дань и поддержим в любых войнах, но позвольте нам вести свои дела самостоятельно.\n\nФезербраш переводит взгляд на пони, а затем кивает. — Хорошо. Во внешних делах вы всё равно будете зависеть от нас, а с внутренними и сами справитесь. Это лучшее, на что вы можете рассчитывать, — пони в ответ лишь тихо кивает. — Приемлемо."
unification.14.a: "Новый контракт."

unification.15.t: "Ущелья"
unification.15.d: "Фезербраш стоит в самой глубине Жуткого ущелья, разглядывая огромную дыру в скале. Рядом с ним столпились местные пони, многие из которых вовсю заключают друг с другом пари. Один из них обращается к грифону. — Если вы хотите когда-нибудь заслужить наше уважение, сэр Фезербраш, вам придётся принять участие в наших традициях. Конечно, вы можете отступить в любой момент, но я не гарантирую, что мои сородичи после этого сложат оружие, — Фезербраш разминает шею с привычным хрустом и усмехается. — Думаешь, я испугался? Это будет весело, — он взмахивает крыльями и взмывает в воздух.\n\nИз норы прямо под ним с рёвом, эхом разносящимся по всему ущелью, вырывается гигантский карьерный угорь с широко распахнутой пастью. Его острые зубы едва не задевают заднюю лапу Фезербраша, но тот успевает перевернуться в воздухе, попутно доставая острый нож. Угорь извивается из стороны в сторону, заставляя всё ущелье содрогаться, снова ревёт и бросается в погоню. Очередной взмах крыльев – и чудовище пролетает мимо, а нож грифона находит свою цель, глубоко вонзаясь в плоть. Когти Фезербраша впиваются в спину ревущего угря, который начинает со всей силы биться о стены ущелья, но старый воин лишь усиливает хватку.\n\nУгорь ревёт ещё громче, совершая очередной яростный бросок назад. С усмешкой Фезербраш разжимает когти и отлетает в сторону, оставив нож в теле чудовища. Когда тварь с размаху ударяется о скалу, каменная стена давит на рукоять ножа, отчего лезвие пробивает угря насквозь и выходит с другой стороны. Фезербраш пикирует вниз и перехватывает клинок, пока густая горячая кровь противника начинает заливать ущелье. Угорь пытается укусить его напоследок. Едва увернувшись, грифон вонзает нож в глаз чудовища, выкалывая его, а свободной лапой достаёт с пояса гранату. Выдернув чеку, он заталкивает боеприпас прямо в глазницу угря и стремительно улетает прочь.\n\nГрифон приземляется рядом с пони ущелья, и все они заворожённо наблюдают, как голова угря разлетается на куски. Повсюду брызжет кровь, и некогда великое существо безжизненно оседает на дно. Подняв лапу, покрытый кровью Фезербраш ловит свой нож, отлетевший от взрыва. Он ловким движением стряхивает с лезвия кровь, убирает его обратно в ножны и смотрит на ошеломлённых пони ущелья. — Надеюсь, было достаточно убедительно?"
unification.15.a: "Истинный хозяин ущелий."

unification.16.t: "Подхалим"
unification.16.d: "Тела бойцов Реваншистской коалиции усеивают землю снаружи Погодной фабрики, пока «Когти» подавляют последние очаги сопротивления. Главарей банд хватают чуть ли не каждый час, а их подчинённые, не отличавшиеся особой верностью, разбегаются при одном лишь виде дисциплинированных грифонов. Но далеко не все сражались и далеко не все бежали. Фезербраш приземляется в уединённом месте в сопровождении двух грифонов. Он хмуро смотрит на улыбающегося единорога в костюме, стоящего напротив него. Скайбрейкер склоняет голову. — Сэр Фезербраш, сочту за честь познакомиться с вами. Я – ваш преданный поклонник.\n\nФезербраш отряхивается и подходит ближе. — Я получил твоё письмо. У тебя есть пять минут, чтобы убедить меня, — единорог ухмыляется и кивает. — Под моим началом находится немало Собирателей Молний, большинство из которых – единороги, отлично обученные боевой магии. Я не особо верен старым порядкам Ассамблеи, а желаю лишь процветания всем пони, за которыми присматриваю. В этом плане, как мне кажется, мы – родственные души, — его ухмылка становится ещё шире. — Конечно, вам понадобятся земли, так что вы можете забрать весь Громовой путь целиком. Мои искусные маги настолько тщательно подавят любое недовольство, что эта земля останется вашей навсегда. Взамен я прошу лишь об одном: оставьте южную часть страны под моим надзором. Мне будет проще совладать с ожиданиями Старой Эпплузы, да и оставшиеся «Собиратели», разумеется, будут видеть во мне своего.\n\nФезербраш пристально смотрит на него и качает головой. — Тебе нельзя доверять, — Скайбрейкер тихо смеётся и улыбается. — Разумеется, нельзя. Я пошёл на это исключительно ради собственной выгоды, сэр Фезербраш. Какой мне прок от противостояния с вами? Полагаю, так я лишь заработаю пулю в лоб и лишусь долгих лет будущей жизни. М-м-м, не самая лучшая сделка. Это соглашение сделает меня богатым, а вас – ещё богаче. Оно выгодно нам обоим, — Фезербраш разглядывает наглого пони ещё минуту, а затем кивает. — Ладно. Но если оступишься – сильно пожалеешь."
unification.16.a: "— Разумеется, сэр."

unification.17.t: "Сказание"
unification.17.d: "Давным-давно на болотах Хэйсид разразилась чума, что распространялась среди местных жителей подобно лесному пожару. Мор забирал каждого, кого касался в отдалённых деревнях, но, несмотря на множество смертей и всеобщую разруху, от верховного вождя не было никакой помощи. Молодой жеребёнок, подхвативший заразу, отправился просить вождя о спасении, но в час нужды его просто прогнали прочь. Тогда он ушёл, чтобы слиться воедино с болотом.\n\nОднако его смертный час ещё не пробил. Лист-на-Ветру увядал в самой глуши, но внезапно небеса над ним разверзлись. Ослепительные в своём сиянии лучи солнца пробились сквозь тучи, озарив всё вокруг. Из небесной выси раздался громовой голос Мириад, что исцелил жеребца и напутствовал его простым наказом: «Плодитесь и заселяйте пустоши». Окрепнув и вернув былые силы, Лист-на-Ветру принялся исцелять юных и немощных по всему болоту. Слухи о его чудесах дошли до верховного вождя, который в приступе зависти решил уничтожить Пророка Мириад. Однако Лист был готов и точным ударом перерезал горло верховному вождю, оборвав его жизнь в мгновение ока.\n\nГодами племена вели междоусобные войны: старейшины, верные верховному вождю, клеймили Листа убийцей, в то время как преданный ему Культ процветал. Прошли годы, и теперь, впервые в истории, болота сплочены волей Мириад. Святые пони ходят из города в город, предлагая пищу и слова истины, помогая всем найти утешения в объятиях Мириад, и только самые нечестивые воины находили в себе гнусь отвергнуть протянутое копыто.\n\nЛист-на-Ветру встаёт во главе истинно священного государства. И становится очевидно, что болота Хэйсид – далеко не весь мир. Время пришло. Все должны познать волю Мириад."
unification.17.a: "Плодитесь и заселяйте пустоши."

unification.18.t: "Милосердие Мириад"
unification.18.d: "Муки голода терзают её, поэтому каждый шаг даётся с огромным трудом. Пони медленно приближается к импровизированному лагерю, где сидят закованные в броню пони с исхудавшими боками и впалыми глазами. Она минует их всех и подходит к одному из жеребцов в самой нарядной броне и обращается к нему. — Я вернулась из разведки. Культистов не обнаружено, — её собеседник сидит перед радиостанцией, но вот в отличие от всех других его бока прямо-таки лоснятся от жира. Он слегка ухмыляется ей. — О, отлично. Только вот у меня плохие новости: обещанных ранее пайков не будет. Враг нашёл наш тайник со снабжением. Мои глубочайшие извинения. Но ты не переживай: если сходишь ещё на одну разведку, возможно, тогда тебе что-нибудь и перепадёт.\n\nКобыла устало смотрит на него, а её ноги дрожат. — Не думаю, что смогу это сделать, сэр, — он снисходительно усмехается. — Ну, в таком случае эти пайки, скорее всего, достанутся тому пони, кто сможет. А теперь пожалуйста, отойди в сторону, ты нагоняешь тоску, а я не люблю люблю грустить, — пони начала медленно отступать, и в этот момент оживает радиоприёмник. — Доброго вам дня, солдаты Неокасла и Аметиста. К вам обращается Голос Мириад от имени нашего святейшего Пророка. Не сомневаюсь, что вам не впервой чувствовать голод, но даже так вы уже на пределе, не так ли?\n\nОфицер хмурится и тянется, чтобы выключить радио, но его останавливают яростные взгляды всех окружающих. Голос из приёмника продолжает. — Зная верхушку Неокасла, я опять же не сомневаюсь, что она не рассказала своим солдатам о сделанных нами предложениях. Надеюсь, теперь же рядовые бойцы услышат меня. Солдаты Неокасла и Аметиста, мы гарантируем вам трёхразовое питание и возможность стать полноправным членом святой общины. А в ответ просим лишь об одном. Сдавайтесь, — офицер слегка посмеивается. — Хе-хе, ну что за топорная пропаганда. Мы ведь никогда ему не поверим, верно?\n\nОн поворачивается к солдатам, но тут понимает, что в лоб ему упирается ствол револьвера. Не проходит и минуты, как каждое оружие в лагере добавляет по новому отверстию в его теле."
unification.18.a: "Мириад рада всем."

unification.19.t: "Мириад"
unification.19.d: "Пегаска, облачённая в лишь тёмно-серый плащ, заходит в небольшую комнату для совещаний. Она поднимает глаза и видит того, к кому пришла. Лист-на-Ветру наливает чай и тихо говорит ей. — Я слышал, ты молилась о встрече со мной. Ты ищешь наставления Мириад? Присаживайся и выпей чаю. Я никогда не отказываю во встрече тому, кого сковало отчаяние. Добро пожаловать в мою обитель, дитя Мириад.\n\nКобыла тихонько смеётся и медленно садится. Она смотрит на Листа, игнорируя чай на столе. — Лист-на-Ветру, ты так вырос с момента нашей прошлой встречи, — жеребец смотрит на неё, и одно его ухо дёргается при звуках знакомого голоса. — Я хорошо помню, как увидела тебя в тех болотах, в шаге от смерти. Тебе повезло, что я нашла тебя тогда. И посмотри, что ты сделал после моего наставления, — она нежно улыбается ему. — Я горжусь тобой и твоими успехами.\n\nОн тихо моргает и наклоняется вперёд, отчего капюшон его одеяния спадает, а на лице появляется улыбка. — Мириад? Ты приняла облик пегаски? — она смотрит на него с едва заметной грустной улыбкой. — Мириад Абанданс. Я назвала тебе тогда лишь своё имя. Я не богиня, Лист, я всего лишь кобыла, — он отстраняется, а она продолжает. — Агент Маддид Уотерс из разведслужбы Нейварро сказал, что планы по захвату болот Хэйсида уже вовсю прорабатываются в стенах агентства. В то время я была полковницей, почти ушедшей в отставку, поэтому согласилась на задание найти кого-нибудь, кто расколет регион изнутри. Хех... Посмотри, что из этого вышло. Это был далеко не самый лучший или продуманный план. Я не богиня, Лист, но ты так много сделал во имя меня, что я больше не могла поддерживать эту ложь.\n\nЖеребец безмолвно смотрит на гостью, напряжённо обдумывая открывшееся ему откровение. Затем он медленно, но непреклонно произносит. — Ты – Мириад. Ты – моя богиня, — кобыла качает головой. — Вовсе нет... — он подаётся вперёд и начинает с жаром говорить. — Нет, богиня! Посмотри на улицу, Мириад. Узри, что твои слова позволили нам совершить. Посмотри на всё то благо, что ты сотворила, — он протягивает ей копыто и улыбается. — Моя богиня, позволь пророку твоему представить тебя твоим детям, — она смотрит на него несколько мгновений. А затем отвечает на жест."
unification.19.a: "— Добро пожаловать, Мириад."

unification.20.t: "Хороший бизнес"
unification.20.d: "Статуя Дружбы взирает на одноимённый город, а вместе с ней из своего личного кабинета за всем наблюдает Блэк Сис. Ранее припрятанные богатства башни Тенпони теперь принадлежат беднякам, которые тратят их на еду и выпивку, привезённые из Арбу. Или на оружие фестралов из Мейрлема. Писарь рейнджеров беседует с членом Общества Сумерек, обмениваясь записями, в то время как двое рыцарей – брат и сестра – болтают и смеются, общаясь с солдатом города.\n\nБывшие рейдеры и те, кто некогда был их жертвами, жмут друг другу копыта и обмениваются улыбками, пока корабли ежеминутно причаливают к докам. Торговцы прибывают отовсюду – из Ржавого Остова, Нового Ариса, Гринвэя и даже из юго-восточных джунглей – а трюмы их судов под завязку нагружены товарами. В тени Статуи Дружбы крышки переходят из копыт в копыта, а товары текут от производителя к купцу, от потребителя к другу. Часть крышек остаётся в казне города, чтобы потом оплатить строительство ещё более крупных фабрик и предприятий.\n\nБлэк Сис с гордостью смотрит на свои достижения. На крышки и зарубежные монеты. На оружие, патроны и лекарства. Она видит улыбки жителей на улицах и слышит их смех. Мейнхеттен наконец-то стал тем сияющим городом, каким он всегда и должен был быть. Она наблюдает и улыбается."
unification.20.a: "Пусть крышки текут рекой."

unification.21.t: "Руины"
unification.21.d: "Разбитые дороги Кантерлота поскрипывают под тяжестью копыт, шагающих по улицам покорённой столицы. Зебра по имени Зения оглядывает разрушенный город, с любопытством изучая висящий на стене старый плакат, который сохранился так хорошо, словно с Последнего дня и не минуло два века. С плаката на неё смотрит другая зебра: её глаза кажутся зловещими и тёмными, а зубы напоминают острые клыки – настоящее чудовище. Зения наклоняет голову набок: «Неужели мы действительно так выглядели?» Она недоверчиво качает головой.\n\nЗатем она переводит взгляд на старый магазинчик, расположенный рядом с плакатом. Дверь едва держится на проржавевших петлях, поэтому зебра без проблем выбивает её пинком задних копыт. Преграда с грохотом валится на землю, после чего кобыла заходит внутрь. Со всех сторон на неё безмолвно взирают манекены, облачённые в роскошные платья. Её взгляд скользит мимо них, изучая многочисленные полки – одни уже рухнули от старости, другие ещё едва держатся. Вдруг она замечает кое-что особенное, и на её лице появляется улыбка.\n\nЗандер неторопливо шагает по улице, держа винтовку наготове на случай появления аликорна или гуля, способного доставить неприятности. Он слегка вздрагивает, услышав вдалеке грохот, покрепче перехватывает винтовку и устремляется на звук, спотыкаясь о куски обломков. Быстро добравшись до старого магазина, он вскидывает оружие и кричит. — Покажись! Оккупационный корпус Глифмарка!\n\nЗения высовывает голову наружу – поверх её чёрно-белого тела надето алое платье. Она густо краснеет, завидев Зандера. — Ой, прости, я сильно нашумела? — Зандер смотрит на неё и тоже смущённо краснеет, опуская винтовку. — Думал, тут шарится какой-то аликорн, — они оба отводят глаза, пока жеребец наконец не произносит. — Тебе очень идёт, — она краснеет ещё сильнее. — Спасибо."
unification.21.a: "Возвращение на гору."

unification.22.t: "Шаг вперёд"
unification.22.d: "Зандер безучастно стоит в стороне, наблюдая за тем, как техника и пони заполняют район, что когда-то был известен как Зебратаун. Сегодня же новые дома и лавки появляются подле не менее новых фабрик. Он втягивает носом воздух и слегка морщится, почуяв дым от близлежащего кострища. В его памяти проносятся воспоминания: Красный Глаз и рейдеры из Понивилля, утаскивающие прочь его друзей и семью.\n\nЗения, выглядящая просто великолепно в своём алом платье, с широкой улыбкой помогает старой кобыле с юга добраться до её нового жилища. — Вот и твой новый дом. Ты будешь снаряжать магазины и обоймы патронами для наших солдат, чтобы помочь нашему освободительному движению, — старая кобыла открывает дверь своего дома и тихонько кивает. — А мне будут платить? — Зения широко улыбается. — Ну конечно! Мы против рабства. Поэтому никак не можем не оплачивать твой труд, ведь иначе это было бы тем же рабством, только под другим названием, — старая кобыла мягко кивает и заходит внутрь.\n\nЗандер подходит к Зении сзади. — Как думаешь, кто-нибудь из этих пони доставит нам неприятности? Помнишь, что там говорится в легендах о событиях в Стойле? — Зения поворачивается к нему. — Эти пони не собираются нас предавать. Всё с ними будет хорошо, они будут честно трудиться. Те же, кто не захотел пойти с нами, просто остались в своих домах. А все эти пони... — она делает паузу. — Они ненавидят работорговцев куда сильнее, чем «полосатых». И они нам помогут.\n\nЗандер тихонько кивает. — Пожалуй, — он на секунду задумывается, а затем отводит взгляд. — Тебя кто-нибудь ждёт в Филлидельфии? — та нежно улыбается и кивает. — Муж. По крайней мере, я на это надеюсь. Прошли годы, и иногда я вспоминаю тот день, когда его забрали, — она умолкает и качает головой, грустно улыбаясь. — Надеюсь, ему понравится это платье. Красный – его любимый цвет, — Зандер смотрит на неё, а затем тепло улыбается. — Муж? Надеюсь, мы найдём его. Ты заслуживаешь счастья."
unification.22.a: "Цепи, что нужно разбить."

unification.23.t: "Разорванные звенья"
unification.23.d: "Улицы Филлидельфии раскрашиваются в чёрно-белые цвета: зебры и пони в армейских повязках в чёрно-белую полоску помогают бывшим рабам. Врачи и алхимики заботятся обо всех пострадавших, пока солдаты раздают еду. На улице мелькает алое пятно – это Зения подбегает к измождённому жеребцу-зебре и крепко его обнимает. Зандер наблюдает за этим с мягкой улыбкой, а затем отводит взгляд, продолжая помогать остальным.\n\nВ самом центре города тысячи рабов собираются вокруг башни «Альфа-Омега», откуда только что вывели жеребят, что рады воссоединиться со своими родителями. Солдаты тычут в спину гигантского, внушающего отвращение работорговца, заставляя его встать на край крыши. Чейнлинк Шеклз смотрит сверху вниз на собравшихся рабов, что уставились на него. На его лице играет ухмылка, и он смеётся, не обращая внимания на петлю, что набрасывают ему на шею. — Даже убивая меня, вы, жалкие черви, всё равно смотрите на меня снизу вверх! — солдаты отступают на шаг, после чего движением ствола винтовки указывают в сторону далёкой земли.\n\nЧейнлинк ухмыляется ещё шире, оглядываясь на солдат. — Полосатые. Надо было догадаться, что это будете вы. Ну давайте, попробуйте приручить этот город. Он сожрёт вас и не подавится. Только мне это было под силу! — жеребец снова коротко смеётся. — Лишь я один мог быть Хозяином этого города. Я и только я, не вы. Эта ошибка погубит вас, — он делает шаг с края здания, и его грузное тело устремляется вниз."
unification.23.a: "Долгожданная свобода."

unification.24.t: "Гора, навевающая ностальгию"
unification.24.d: "Смотрительница Эмеральд Вейл шла по улице в сопровождении личной охраны и видела разгромленные, лежащие в руинах улицы Кантерлота. Вышедшие на поверхность обитатели Стойла застыли в изумлении при виде подобного зрелища, горюя о своих прошлых жизнях. Глава технической службы Луз Болт уже начал переоборудовать свою старую велосипедную мастерскую в полноценный цех, несмотря на то, что некоторые детали намертво вросли в его кожу. Флауэр Баскет, одна из многочисленных жеребят Города Стойла, взволнованно рванула к своему прежнему дому. Её родители смотрели на родное гнездо со смесью благоговения и ужаса: некогда ухоженное жилище со множеством окон и красивым садом превратилось в настоящие развалины, но всё же устояло. Начальник безопасности Батон Бэш ворчал по поводу утраченного потенциала разрушенного и разграбленного штаба Кантерлотской стражи.\n\nКогда Эмеральд наконец поглядела вперёд, она наткнулась на старый офис «Стойл-Тек» – здание, потрёпанное временем и, конечно же, Розовым Облаком. Именно здесь ностальгия нахлынула на неё – куда сильнее, чем могла бы ударить любая магия аликорнов. Она прошлась по атриуму, вспоминая времена, полные весёлой болтовни с коллегами, долгих перерывов на кофе и, самое главное, встречу со своей единственной настоящей любовью. Эти мысли приносили одновременно боль и ликование, сливаясь в единое чувство ностальгии. Продолжая идти, она нашла свой кабинет на третьем этаже – полуразрушенное помещение, почти доверху заваленное обломками бетона. Уцелел лишь неплохо сохранившийся, но всё равно изрядно потрёпанный снимок молодой Эмеральд, позирующей со своими коллегами и посетившей их Скуталу – президентом «Стойл-Тек». Гуль постаралась оставить прошлое позади, и на её лице появилось решительное выражение, когда она взглянула на своих верных пони из Стойла, ныне обживающих Кантерлот – их отвоёванный дом."
unification.24.a: "Мы обязаны возродить столицу Эквестрии."

unification.25.t: "Спуск в настоящее"
unification.25.d: "Эмеральд Вейл стоит перед дымящимися руинами Понивилля после ожесточённой перестрелки с бандой мэра. Рейдеры дрались грязно, и бой выдался тяжёлым, но они недооценили поразительное упрямство воспрянувших духом граждан Кантерлота. Вейл отводит взгляд от удручающей картины и направляется в «Золотой дуб» – бывшую штаб-квартиру мэра и главное логово её банды, которая когда-то также служила домом для министерской кобылы Твайлайт Спаркл. Эмеральд с презрительным прищуром смотрит на полуразрушенное здание и с трепетом осознаёт, насколько же сильно это место, некогда бывшее скромным общественным центром, пришло в упадок.\n\nХотя кабинет представляет собой лишь жалкие, ветхие руины былого величия, Вейл понимает, что он служит наглядным отражением нынешнего состояния всего мира. Поправляя воротник своего костюма, она осознаёт, что все поступки рейдеров были по-своему практичны. Клетки, хоть и простые, эффективно удерживали узников, судя по следам когтей на полу, скрюченным скелетам замученных жертв, а также засохшей крови и выбитым зубам, усеявшим доски. Книги, бесполезные для варваров-рейдеров, нашли новое применение: их кожаные обложки пустили на ремни для брони, а бумагу использовали для гигиены – точнее того, что считалось гигиеной по их стандартам. Лестницы и половицы были выломаны, чтобы добраться до земли, которой укрепляли изнутри это полое дерево.\n\nГуль понимает, что рейдеров двигали вперёд лишь жестокость, жадность и низменное желание добраться до лёгкой «добычи». Но при этом она понимает, что они проявили незаурядную изобретательность и новаторство, создавая нечто новое из остатков старого, чтобы просто продержаться, выжить и, в конце концов, закрепиться здесь. Поднявшись на верхний ярус дерева, Вейл опускается в шаткое и старое кресло-качалку. Посмотрев в самодельное окно, она замечает, как её бойцы из службы безопасности уже используют рейдерские клетки по назначению: освобождают пленников и запирают внутри тех бандитов, что не успели сбежать. На её лице появляется ухмылка при мысли о том, что обитатели её Стойла учатся приспосабливаться точно так же, как и она сама. Вейл неподвижно сидит у окна, погружённая в думы и мерно покачиваясь в течение пары часов, пока вдруг не вскакивает как ошпаренная, озарённая одной простой истиной."
unification.25.a: "Мы обязаны играть по правилам этой новой Эквестрии."
unification.25.b: "Слишком примитивно. Мы можем это усовершенствовать."
unification.25.c: "Как вдохновляюще. Теперь их черёд."

unification.26.t: "Восхождение к будущему"
unification.26.d: "Эмеральд Вейл сидит в здании торгового поста Виновия – исторической и весьма колоритной постройке, возведённой давным-давно в качестве неофициального посольства Аквелии в Эквестрии. Это было ещё до рождения родителей Вейл и даже её бабушек с дедушками. Столь древнее место как нельзя лучше подходит для встречи, ведь сегодня оно обретёт новый смысл. В этот самый момент главный зал торгового поста начали заполнять высокопоставленные лица и вожди различных племён Жеребячьих гор, занимая места за большим круглым столом из дуба, привезённым из одного офисного здания в Кантерлоте. Эмеральд восседает во главе этого стола. Когда все рассаживаются по местам, гуль дружелюбно и совершенно безобидно улыбается, начиная партию в игру, в которую она не играла уже очень давно – в политику. — Добрый день, уважаемые вожди Жеребячьей долины. Меня зовут Эмеральд Вейл, и я собрала вас всех здесь сегодня по двум причинам. Первая проста: я хочу интегрировать ваши племена в состав Кантерлотского Царства. Я желаю, чтобы мы учились у ваших племён, а ваши племена, в свою очередь, учились у нас.\n\nМногие из вождей в замешательстве и тревоге переглядываются друг с другом, осознавая последствия подобного объединения, однако Эмеральд не тратит ни секунды на то, чтобы развеять эти опасения. — Вторая причина же куда более прямолинейна. Пусть мы и можем собраться под единым знаменем Кантерлотского Царства, но никогда не будем в безопасности, пока не покончим с угрозой на юге. С угрозой, которую многие из вас знают слишком хорошо – с Красным Глазом, — некоторые вожди бледнеют, другие принимаются шептаться, осознавая суть предложения Эмеральд, но она остаётся безразличной к их реакции и для пущей убедительности ударяет передними копытами по столу. — Вы прекрасно слышали мои слова. Нравится вам это или нет, но он рано или поздно придёт за нами всеми, если только мы его не опередим. Пора взглянуть в лицо будущему, но не поодиночке, а вместе. Я понимаю что это большой шаг который требует размышлений, но думаю уже сейчас наши подчинённые могут начать обмен опытом, не так ли? А за это время вы сможете подумать и обсудить мои условия. Когда вы примете нужное решение, вы сможете найти меня снаружи, — Эмеральд одаривает присутствующих выверенной улыбкой, после чего поднимается из-за стола и направляется к выходу, оставляя позади ошеломлённый совет из жеребят, новоявленных генералиссимусов и сектантов, которые лишь безмолвно смотрят друг на друга, думая об одном и том же."
unification.26.a: "Это точка невозврата."

unification.27.t: "Своевременное объединение"
unification.27.d: "Племена великой Жеребячьей долины приняли множество новых членов: рабов, раскаявшихся работорговцев и заблудших наёмников, нуждавшихся в общине. Были сформированы и новые племена, которые интегрировались в гораздо более великое Кантерлотское Царство, превзошедшее любые мечтания Эмеральд. Наконец она примерила на себя роль истинной эквестрийки, взяв под свой контроль Эквестрию в её привычном понимании. Однако теперь пришло время создать на её основе нечто совершенно новое. Подобно своему великому лидеру – Эмеральд, Царство никогда не забудет своё прошлое, будет трепетно заботиться о настоящем и устремит взор в будущее. Таким образом, государство официально преобразуется в Сердце Эквестрии – союз кантерлотских гулей, племён, освобождённых рабов, зебр и бывших рейдеров, призванный выковать новую идентичность!\n\nЭмеральд сворачивает газету, прячет её в карман своего фирменного комбинезона из стойла и с лёгким вздохом удовлетворения направляется трусцой по недавно заасфальтированной улице Филлидельфии. Она смотрит на Гост Уорда, представителя многочисленных племён Жеребячьей Долины, а также на Протеже – координатора дел в оккупированной Филлидельфии и бывшего наследника Красного Глаза. Эмеральд улыбается и останавливается, глядя на своих новоиспечённых союзников: — Гост, ты самый приземлённый и умелый член великого племени Зелёной Долины. Ты лучше всех понимаешь остальные сообщества, их особенности, культуру и веру. Ты знаешь жизнь племён изнутри, и я хочу, чтобы ты сохранил её, изменив так, как посчитаешь нужным.\n\nЗатем она переводит взгляд на Протеже, расплываясь в улыбке. — А ты, Протеже, попросту был рождён для этого – Красный Глаз создал это место, чтобы ты им правил после него, — с немного печальным видом гуль замирает посреди улицы, рассматривая билборд с изображением Пинки Пай. — Что же до меня... Думаю, мне пора отойти от дел, вам так не кажется? Но кто из вас двоих займёт моё место? — глядя на двоих кандидатов, Эмеральд принимает непростое решение.."
unification.27.a: "— Гост Уорд станет вождём, и тогда эти земли унаследуют племена."
unification.27.b: "— Протеже готовили на роль лидера. Я не намерена перечить судьбе."
unification.27.c: "— Знаете, пожалуй, я всё же останусь."

unification.28.t: "Слияние мощи и великолепия"
unification.28.d: "Грис Вил сворачивает газету, закатывая глаза. Эти ребята из Стойла всегда были слишком падки на дешёвые сенсации и обилие восклицательных знаков. И всё же их хаотичная энергия отлично сочетается с духом старой банды. Пока он ждёт, к нему подбегает кобылка – бывшая сотрудница службы безопасности Стойла, на жетоне которой гордо красуется имя Траума Тейзер. Улыбаясь, она несёт два пакета с аппетитной выпечкой и протягивает один из них ему. — Вот, держи, Грис! Шоколадный, с присыпкой, как ты и просил! — Грис слегка краснеет и нервно посмеивается. — Хех, э-э, спасибо, Траума. Давай-ка за работу, — оба пони забираются в один из многочисленных реквизированных автомобилей Безумных Гонщиков, используемых теперь для охраны правопорядка. Грис садится за руль и заводит старую развалюху, которая, чихая, оживает и трогается с места.\n\nКак только они выезжают, старое радио с треском оживает: «Внимание всем патрульным! Банды рейдеров, предположительно Оседлавшие Дождь, орудуют на окраинах Фрисайда! Повторяю, всем свободным экипажам прибыть на подмогу!» Услышав это, Грис прибавляет ход, демонстрируя умения, которым он научился во времена своего бытия среди Безумных Гонщиков. Стоило им свернуть на шоссе, как напарники замечают банду из четырёх байкеров на военных мотоциклах. Траума кричит: — Именем Республики Фрисайд, прижмитесь к обочине! — в ответ раздаются выстрелы, и пони открывает ответный огонь из своего служебного револьвера. Грис выжимает газ, повторяя манёвр, которому его обучил Аневризм.\n\nГрис точным таранным ударом сталкивает двух рейдеров с дороги, хотя один из них успевает выстрелить ему прямо в плечо. Он шипит сквозь зубы от пронзившей бок боли, но чувство дорожной свободы притупляет её. Траума подстреливает ещё одного байкера, оставляя лишь последнего, который на полной скорости уносится в сторону самого города. Грис пытается до упора вдавить педаль газа, но нога его не слушается. Посмотрев вниз, жеребец замечает новые дырки от пуль, которых даже не почувствовал. Траума что-то кричит, но Грис уже ничего не слышит, пока мир вокруг окончательно не погружается во тьму.\n\nТраума сидит в отделении травматологии, вся в бинтах и ссадинах, с гипсом на ноге, сломанной во время аварии. К ней подходит доктор и слегка кивает. Траума тут же вскакивает на копыта и, ковыляя, мчится к палате Гриса, а врач едва поспевает за ней, крича вслед. — Только не обнимай его слишком сильно, мы бы хотели сохранить его ногу после стольких усилий, — на больничной койке лежит измученный Грис, но при виде Траумы на его лице появляется улыбка. — Прости, что разбил тачку. Аневризм бы меня за такое вздёрнул. Но вы, пони из Стойла, хех... Наоборот, меня подлатали.\n\nОна мягко улыбается. — Ты всё равно водишь лучше меня. Остальные испекли тебе торт, чтобы ты поскорее поправлялся. Шоколадный, с присыпкой. Я тут, правда, уже слопала половину, но... ты можешь забрать остальное, — на его нарочито усталый вздох она лишь виновато улыбнулась, но потом ободрительно сказала. — Ты всем доказал, что в душе всё ещё рейдер."
unification.28.a: "Сохранённая идентичность, перенятые привычки."

unification.29.t: "Бесконечный пир"
unification.29.d: "Город Дружбы празднует. Многие поначалу с подозрением относились к тому, что их силой подчинило Арбу. Особенно те, кто наслушались разных разговоров о том, что эти якобы добрые пони – на самом деле жуткие пониеды. Но затем начались фестивали: мясо жарится на открытом огне, сок стекает прямо в костры, а еды здесь более чем достаточно, чтобы досыта накормить тысячи пони. Подобные празднества устраиваются по всему Мейнхеттену их новыми благожелательными повелителями.\n\nК одному из поваров, усердно трудящемуся у огня, подходит кобыла. — Простите, вы ведь из Арбу, верно? — повар оборачивается, улыбается и кивает. — Всё верно, мэм! Хотите чего-нибудь перекусить? — кобыла качает головой. — Нет, спасибо. Э-э... мой муж сражался против вас, когда вы напали на нас, и хотя я не против того, что вы теперь нами правите... случайно не знаете, у кого я могла бы узнать, где тело моего мужа? Просто моей дочурке позарез нужно с ним попрощаться, — повар тихонько посмеивается и, отрезав кусок мяса, протягивает его кобыле. — Мне жаль, но вам правда не стоит об этом беспокоиться. Прошлое осталось в прошлом. Ешьте и наслаждайтесь будущим, и ваш муж окажется гораздо ближе, чем вы думаете, — кобыла медленно кивает, берёт мясо и трусит прочь, а жеребец ухмыляется ей вслед.\n\nЖеребчик и кобылка галопом несутся по улицам, весело хохоча в процессе. Жеребёнок спотыкается о выпирающий камень, и острый угол лачуги глубоко вонзается ему в бок, заставляя того закричать от боли. Кобылка замирает перед ним с широко раскрытыми глазами и зовёт на помощь. К ним подходит повар и опускается на колени перед раненым. — Ого, малыш, похоже, ты сильно поранился. Где твои родители? — жеребчик отворачивается, зажимая бок. — Я... я сирота, сэр, — повар цыкает языком и поднимается. — Ну, так дело не пойдёт. Давай, залезай ко мне на спину, я отнесу тебя в ближайшую клинику.\n\nЖеребёнок медленно карабкается наверх, а кобылка выпячивает грудь. — Я пойду с вами! Я ведь его подруга! — повар оценивающе смотрит на неё сверху вниз и улыбается ещё шире. — А как же твои родители, кроха? — она мотает головой. — Мертвы, — он мягко ухмыляется. — Тогда и ты следуй за мной. Тобой и твоим другом займутся наши лучшие специалисты, — Он разворачивается, пока раненый жеребёнок тихо скулит от боли, и говорит с широкой зловещей усмешкой. — Мяса будет много."
unification.29.a: "— Только не задавай вопросов о его происхождении."

unification.30.t: "Отец"
unification.30.d: "— Ты гордишься мной, отец? — Костолом стоит перед могилой, глядя на неё сверху вниз. — Этих ублюдков из Тенпони поимели по полной. Долбаных пищащих ублюдков я подвесил за кожаные крылья и перерезал им глотки. Гаттервилль раздавлен, хотя эти засранцы самостоятельно залезли в дерьмо по самые уши. А Город Дружбы теперь тоже будет называться Городом Костолома. Я размозжил черепа всем этим консервным банкам-рейнджерам и вырвал глотки трусам в Арбу. Я отомстил за тебя. Восстановил империю, которую ты просрал.\n\nКостолом расхаживает из стороны в сторону. — Но этого ведь мало, да? Нет, сука, нет, этого всегда мало! Мейнхеттен – ничто по сравнению с тем, что творится на юге. О, я видел беглых рабов оттуда. Красный Глаз? Ну что за дурацкая кличка! Я раздавлю этого ублюдка и его самодовольную харю, которая так и просит кирпича! У него красная шерсть, так я сделаю её ещё, сука, краснее, о да! — Костолом с силой бьёт копытами о землю. — Видишь, папка, я не такой, как ты! Я не какой-то грёбаный идиот, который будет сидеть сложа копыта и позволять ублюдкам из пустоши идти против меня! Хрен вам всем! И пошёл ты отдельно на хер за то, что так поступал!\n\nКостолом разворачивается и одним могучим ударом задних ног разносит надгробие на куски, после чего запрыгивает на могилу и начинает топтать её. — Посмотри, что мне пришлось натворить, чтобы вернуть то, что принадлежало мне по праву рождения! Я – Костолом! Мейнхеттен был нашим, но ты всё просрал и сломал мне жизнь! Посмотри, сколько, сука, времени это заняло! Тварь! — Костолом хохочет и широко ухмыляется. — О, я не повторю ту же ошибку. Моего имени теперь будут бояться по всей пустоши. Славься, Костолом!"
unification.30.a: "Славься, Костолом!"

unification.31.t: "История"
unification.31.d: "Давным-давно в волшебной стране Эквестрии жила богиня. Когда во время крупнейшей войны в истории трон опустел, богиня сделала шаг, на который никто другой не решился, и мантия власти тяжким грузом легла на её плечи. Пока знать и простые пони отворачивались от неё, фестралы – самая преданная когорта – остались непоколебимо верны ей. По милости богини бэтпони преданно шли в армию и на заводы, и их верные копыта без устали трудились ради победы. Но эта преданность не была вознаграждена. Знать и промышленники отвлекали богиню, а простые пони ополчились против фестралов, вынуждая их жить в самых ужасных местах. И всё же бэтпони продолжали преданно служить своей богине. Но всё это оказалось напрасно, когда в Последний день небо рухнуло на землю.\n\nФестралы сплотились в единую общину в Мейрлеме, найдя защиту как от Солнечных Гонщиков, так и от чудовищ. Среди облучённых радиацией небоскрёбов мы обрели свой дом, а когда небо над головой приняло цвет телевизора, настроенного на мёртвый канал, наша серая шерсть позволяла сливаться с ним и путешествовать без лишних забот. Но затем пришёл Король бандитов, пони непревзойдённой силы, вместе со своим демоническим отродьем, и они единым махом подмяли под себя общины фестралов. Когда нас начали теснить, мы обратились к соседям, но ответа не последовало. Тенпони, Арбу и даже Город Дружбы отвергли призыв выступить против зла вместе. Так фестралы вновь оказались под гнётом пони.\n\nНо этому не суждено было длиться вечно. Когда Король бандитов отступил, фестралы вновь заявили о своём месте в мире. Мы слишком долго доверяли пони и надеялись на помощь. Но пони непостоянны и раз за разом били фестралов в спину. Даже у самых благородных существ есть предел терпения. И потому мы выступили в поход, и фестралья сталь сокрушила любое сопротивление. И впервые мы могли рассказать историю не об угнетении и сегрегации. В первый раз наш род оказался на самой вершине. И впервые над Мейнхеттеном гордо реют кожаные крылья."
unification.31.a: "Вот и сказке конец, а кто слушал – молодец."

unification.32.t: "Куда угодно, только подальше отсюда"
unification.32.d: "Дождевая Наездница сидит в своей машине, двигатель которой мерно урчит, и курит сигарету, глядя в глаза уставшему охраннику Гаттервилля. Она выпускает дым, пока охранник сидит и заливает свои проблемы выпивкой. Их разделяет лишь воображаемая граница. Кобыла слегка прищуривается, вглядываясь сквозь дым, и замечает приближающуюся группу пони в разорванных костюмах и платьях. Незадачливый пограничник безучастным взглядом провожает идущих через границу пони, вновь прикладываясь к бутылке. Наездница выбирается из машины, ухмыляется и, прислонившись к капоту, наводит на толпу пистолет, удерживая его магией. — Чё как? С вас плата за проход по моей земле. По пятьдесят крышек с каждого.\n\nПони смотрят на пистолет лишь секунду, после чего вперёд выходит жеребец со сломанным рогом и достаёт большой мешок с крышками. — Шестьсот крышек. Излишек достанется тебе, если поможешь нам. Увези нас на своей колымаге. Скоро подойдут наши друзья, у них ещё больше денег, и они заплатят столько же, чтобы их увезли отсюда, — кобыла прищуривается, выдыхая струю дыма прямо в морду жеребцу, и оскаливает пожелтевшие зубы. — Ублюдки из Тенпони. Слышь, у меня вот другое предложение: а как насчёт того, чтобы я пустила тебе пулю промеж глаз и забрала всё, что у вас есть?\n\nЖеребец смотрит ей прямо в глаза и кладёт мешок с крышками перед ней. — Потому что злорадствовать перед живыми пони куда приятнее, чем перед трупами, Наездница. Знаю, насколько комично это выглядит с твоей колокольни, — она ухмыляется и поднимает мешок магией, заглядывая вовнутрь. — О, ты как никогда прав. Вы, чмошники из Тенпони, никогда не хотели вылезать из своей долбаной башни, а теперь сверкаете копытами так, будто за вами адская гончая несётся. И что-то мне подсказывает, что вами движет отнюдь не любовь к дорогам, — он стойко выдерживает её взгляд. — Я лучше рискну и найму рейдера для перевозки, чем останусь с голодными мантикорами, пьяными начальниками и полумёртвыми солдатами.\n\nЕё ухмылка становится ещё шире, из ноздрей вырываются новые клубы сигаретного дыма, а в глазах вспыхивает истинно драконья жадность. Она подтягивает крышки к себе. — Так вам, самодовольным ублюдкам, и надо. Но ты прав. Я получу массу удовольствия, издеваясь над тобой и каждым следующим высокомерным беженцем, и при этом обдеру вас до нитки, — она выплёвывает сигарету на землю и затаптывает её копытом. — Залезайте. Куда едем? — жеребец отвечает ей коротким уважительным кивком. — Куда угодно, только подальше отсюда."
unification.32.a: "Страдание объединяет даже злейших врагов."

unification.33.t: "Выпивку всем!"
unification.33.d: "Вертикальные зрачки следят из переулка Филлидельфии за тем, как солдаты Гаттервилля и рабы Филлидельфии вместе празднуют освобождение. Выпивки предостаточно: рабы, столь долго лишённые роскоши, топят былые горести в виски и вине. Фестралка внимательно наблюдает, и её зоркий взгляд устремлён на жидкий яд, который жадно глушат её сородичи. Он темнее смога и грязнее любого из любимчиков Чейнлинка, но его жгучий вкус всё равно находит путь в пищеводы многих. Она переводит взгляд, наблюдая, как слабые желудком падают прямо на мостовую, как рвота, смешанная с кровью, заливает улицы, как они тонут на суше, пока вокруг вовсю продолжается празднование.\n\nУши кобылы подёргиваются, когда она поворачивает голову и видит пони, вваливающегося в переулок напротив неё. Рядом с ней падает бывший собрат по рабству – молодой жеребец, который держится за живот и тяжело стонет. Он харкает кровью на холодный камень и едва не захлёбывается. Через секундную паузу фестралка подходит к нему и похлопывает по спине кожаными крыльями, помогая исторгнуть остатки. Но кровь продолжает идти, и он валится на мостовую, уставившись на неё отчаявшимся и испуганным взглядом. Она смотрит в ответ и тихо шепчет. — Никогда не принимай подношений от захватчиков. Еда от завоевателя – это всегда яд.\n\nЖеребец кашляет ещё сильнее, а затем его выворачивает: тёмная смесь чёрной крови и выпивки стекает в ближайшую решётку, а тело несчастного не может даже шевельнуться, содрогаясь в рвотных позывах. Кобыла смотрит на него, закрывает глаза и шепчет. — Милосердная Луна, пожалуйста, свобода всего в одном шаге... не отнимай её у того, кто невиновен, — её крылья поддерживают жеребца, пока его безудержно рвёт несколько минут без перерыва. Но тошнота наконец-то прекращается. Фестралка открывает глаза и видит, что тот лежит, едва дыша, и смотрит на неё снизу вверх. Она сглатывает слюну и слабо улыбается. — Ты выжил. Далеко не всем так повезёт.\n\nОн делает слабый вдох, а затем выдох, а после едва слышно шепчет. — Пик... — она мягко кивает. — Нью Мун, — они тихо сидят вдвоём, окружённые звуками смерти и празднества. Фестралка встречается с жеребцом взглядом, а затем отворачивается в сторону солдат Гаттервилля на улицах. — Красный Глаз убивал бы нас более очевидными способами. А это – знак. Подчиняйся или умри, — она выдерживает паузу, а затем снова смотрит на него. — Отдыхай, Пик. Когда поправишься, мы сбежим. Вместе."
unification.33.a: "Каков твой яд?"

