 ###Ideas###

 GOR_skybreaker_alliance:0 "Альянс Скайбрейкера"
 GOR_skybreaker_alliance_desc:0 "Интеграция боевых магов Скайбрейкера дала нам доступ к их тайным знаниям, которые укрепили наши войска, промышленность и общую способность проецировать силу по всему Громовому пути."

 HSC_myriads_truth:0 "Истина Мириад"
 HSC_myriads_truth_desc:0 "Откровение о том, что Мириад Абанданс – всего лишь смертная кобыла, пошатнуло веру, однако то, как Лист-на-Ветру принял это, превратило сомнения в более глубокую и стойкую преданность. Культ движется вперёд с обновлённой целью."

 GLY_wasteland_adaptation:0 "Адаптация к пустошам"
 GLY_wasteland_adaptation_desc:0 "Воспользовавшись промышленной мощью покорённого запада, наши инженеры научились восстанавливать производство буквально из руин, используя в качестве материалов лишь металлолом да мусор."

 SCI_adaptive_wasteland_strategy:0 "Адаптивная стратегия пустошей"
 SCI_adaptive_wasteland_strategy_desc:0 "Стойло научилось мыслить как сама пустошь: гибко, непредсказуемо, неумолимо. Наши солдаты адаптируются к любой ситуации, а командиры действуют по обстоятельствам, импровизируя на лету."

 SCI_refined_wasteland_tactics:0 "Усовершенствованная тактика пустошей"
 SCI_refined_wasteland_tactics_desc:0 "Рейдеры показали нам основы, а теперь мы их улучшаем. Кантерлотская дисциплина, смешанная с прагматизмом пустошей, создаёт стойкую боевую силу, собранную со всех уголков нашей территории."

 SCI_lessons_from_raiders:0 "Уроки рейдеров"
 SCI_lessons_from_raiders_desc:0 "Мы изучили методы рейдеров и доработали их под себя. Наши солдаты безжалостны, быстры и вселяют ужас... хотя безрассудство такого подхода всё же обходится недёшево."

 SCI_ghost_ward_guidance:0 "Наставление Гост Уорда"
 SCI_ghost_ward_guidance_desc:0 "Гост Уорд, вождь племени Великой Зелёной долины, познал мудрость всех народов Жеребячьих горы. Под его наставлением наши исконные территории превратились в крепость, народ сыт, а заводы гудят без перерыва."

 SCI_the_natural_choice:0 "Естественный выбор"
 SCI_the_natural_choice_desc:0 "Протеже был рождён, чтобы править. Красный Глаз годами готовил его к управлению великой нацией, и теперь этот навык служит Сердцу Эквестрии. Наша высочайшая организация вызывает зависть у всей пустоши, хотя политическая цена этого высока."

 SCI_emerald_hegemony:0 "Гегемония Эмеральд"
 SCI_emerald_hegemony_desc:0 "Эмеральд Вейл была, есть и будет. Не будет ни преемника, ни наследника, ни передачи власти. Сердце Эквестрии принадлежит ей, и под её твёрдым копытом нация выстоит, хотя требования такого лидерства тяжко сказываются на росте населения."

 STA_freeside_spirit:0 "Дух Фрисайда"
 STA_freeside_spirit_desc:0 "Республика Фрисайд напитана энергией как Стойла, так и Безумных Гонщиков: быстрая, новаторская и неистово гордящаяся тем, что они построили вместе."

 GUT_new_hope:0 "Новая надежда"
 GUT_new_hope_desc:0 "Мейнхеттен чист. Сточные канавы свободны, мантикоры ушли, а спрайт-боты умолкли. Впервые за многие поколения жители Гаттервилля смотрят в будущее с искренней надеждой."

