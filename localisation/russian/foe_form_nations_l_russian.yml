 SUN_gabriel_motorcycle:0 "Золотой мотоцикл Габриэля"
 SUN_gabriel_motorcycle_desc:0 "Извлечённый из глубин Нижней реки Мейр легендарный позолоченный мотоцикл Габриэля Санрайдера, основателя изначальных Солнечных ездоков, снова несётся во главе банды. Один лишь его вид вдохновляет каждого рейдера на шоссе мчаться во весь опор и бить как можно сильнее."

 SUN_follow_nitro:0 "По пути Нитро"
 SUN_follow_nitro_desc:0 "Вдохновлённая последним дневником Нитро Бустерджуса, банда обращает свой взор на врагов шоссе. Старые Солнечные ездоки никогда не заезжали достаточно далеко. Но мы превзойдём их."

 SUN_learning_mistakes:0 "Уроки последнего Солнечного ездока"
 SUN_learning_mistakes_desc:0 "Дневник Нитро подробно рассказывает о том, чего делать уж точно не стоит. Банда принимает близко к сердцу предупреждения старого лидера: никогда не позволять междоусобицам разделять шоссе и никогда не прекращать строить то, что создаётся на века."

 SUN_hit_and_run:0 "Доктрина «бей-и-беги»"
 SUN_hit_and_run_desc:0 "Рабы Филлидельфии помнят старую тактику Нитро. Быстрые удары, стремительные отступления и тактика, не позволяющая врагу зажать тебя в угол. Банда шоссе полностью перенимает эти методы."

 RAR_chainlink_shackles:0 "Нанять Чейнлинка Шеклза"
 RAR_chainlink_shackles_desc:0 "Самый грозный босс работорговцев в истории Филлидельфии. Его правление окончено, но технические познания остаются непревзойдёнными. Пора заставить его потрудиться на нас."

 SUN_chainlink_spirit:0 "Технические знания Чейнлинка"
 SUN_chainlink_spirit_desc:0 "Благодаря техническим познаниям Чейнлинка Шеклза старые заводские линии в Филлидельфии и вдоль всего шоссе с рёвом возвращаются к жизни. Оружие отремонтировано, двигатели запущены, а производство идёт полным ходом."

 SUN_ranger_prototype:0 "Прототипы брони рейнджеров"
 SUN_ranger_prototype_desc:0 "От Стальных Рейнджеров нам досталась горстка прототипов силовой брони. На основе этих образцов наши инженеры создали улучшенные версии, адаптированные под образ жизни рейдеров: они легче, быстрее и созданы специально для войны на шоссе."

 SUN_sunrider_race:0 "Босс садится за руль"
 SUN_sunrider_race_desc:0 "Босс шоссе Санрайза выиграл великую гонку на арене Саммерфилда, явив своё мастерство вождения всей нации. Вдохновлённый этой победой, каждый рейдер теперь водит ещё агрессивнее."

unification.34.t: "Clean The Gutters"
unification.34.d: "Gunshots ring through Manehattan, mixed with laser beams lighting up the dark inside of a ruined building. Manticores roar and Spritebots spark as they fall, Steel Rangers in powered armor stood next to unicorns with Mag-X rifles, barrels smoking slightly from use. A manticore body falls from the sky above, a thestral and Pegasus engaged in a dogfight with those that remain. The Rangers and unicorns look up to admire, only to flinch slightly from a gunshot. A Gutterville officer stands there, a lunging Manticore stopped halfway through their leap by a bullet to the eyes. The officer stands straight, 'Come on, we still have work to do, admire later.'\n\nElsewhere, a truck roars down a freshly paved road, stopping in front of a house under repair. A Speedfreak steps out, smoking and watching as a unicorn lights up their horn, floating up heavy scrap metal. A team of Talons grab each piece of metal, holding it against the building, while members of the Builder's Guild hammer each into place. The Speedfreak smirks, 'I'm fucking scared of that horn, Crane.' The unicorn smirks softly, 'I didn't build New Apple's walls in a day. Besides, I can't drive.' The Speedfreak smirks, breathing out some smoke. A former Fillydelphian slaver trots up, 'We have five more houses to build before the day's done, you have five minutes to take a break. Good work.'\n\nA Canterlot Ghoul and a Zebra sort medicines side by side, both looking up as a sick stallion stumbles inside, alongside a thestral mare. A tribal shaman trots up to the pony, supporting him, while the mare frowns, 'His name is Pick, he's been sick ever since he drank some of the old swill. Can you help him?' The zebra trots up to support the stallion's other side, while the ghoul gathers up some medicine, 'Simple, I've seen this before. One time I saw a stallion drink a mixer with some Pink Cloud in it, horrible. Wait here, ma'am, we'll have his system flushed and cleaned by day's end.'\n\nIn the distance, the sun rises, it's dim light cast on Gutterville like usual. But today, the light seems less dim. Creatures from all across the wasteland work together, slowly erasing the memories of the past. For once, Gutterville is pulled from the gutters. For once, they have hope."
unification.34.a: "Hope Fuels, When All Is Lost"

unification.35.t: "Treasures Of The Past"
unification.35.d: "For the first time in living memory, raiders are able to drive all the way from Freeside to the coastline, along the most valued stretch of the Sunrise Highway. Rain Riders, Speedfreaks, the difference between them is forgotten for sheer love of the road. Some older raiders, ghouls, have begun to tell tales of the ancients, the Sunriders, the great gang who rode the Sunrise Highway unimpeded for decades, taking as they wanted and making all ponies fear them. Now, with raiders able to drive where they please, gangs have gotten together outside of raids to go on joyrides, searching for memories of the long forgotten Sunriders.\n\nA young mare was driving too fast outside of Freeside when she tumbled off the road and into the Lower Mare River, the irradiated muck making her sick while she swam back to the surface. However, despite dying of radiation poisoning, the mare rushed her way to the nearest city, telling tale of what she saw in the murky waters. A gold-plated motorcycle under the waters, the last remnant of the first Sunrider, Gabriel Sunrider. The mare died shortly after, happy that her final moments were spent sharing her find.\n\nAn older Rain Rider was plowing through Central Summerfield on an up-armored APC, machine guns firing and explosives being thrown by fifty fellow raiders hanging off the sides of the vehicle, killing as many Empire militamares and Talon bastards as they could. Their vehicle was destroyed and they were forced to take cover in a building, which was pounded by enemy explosives. Only one raider survived, badly injured, but all the explosions revealed something buried under the rubble of the building. A tank built of scrap and spirit, the mighty symbol of Astigmatism, second and greatest leader of the Sunriders. The raider barely made it back to tell us.\n\nWhile a group of captured ponies were working to fix up a broken bridge in The Broken Road, they found the scrapped remnants of Nitro Boosterjuice's car, personal vehicle of the last Sunrider, tricked out to be better than any other car. Issue is, even with all the resources of the Sunrise Highway, we've only got the resources to try and restore one of these vehicles to their proper glory. Should we reclaim Sunrider's golden motorcycle, Astigmatism's badass tank, or Nitro's techy car?"
unification.35.a: "Gabriel Sunrider's Motorcycle!"
unification.35.b: "Astigmatism's Tank!"
unification.35.c: "Nitro Boosterjuice's Car!"

unification.36.t: "Whispers From Ghosts"
unification.36.d: "While a group of our raiders were looting the recently taken Tenpony Tower, we found a library of historical documents. Most of them were useless, about the history of Changelings, Kirin, the childhood of the Princesses, they all were burned in a giant pyre. But there among the useless shit was something very, very important. A personal journal from the last leader of the Sunriders, Nitro Boosterjuice. The entry is as follows:\n\n'Two days since the Sunriders broke. Shoulda seen this coming, Speedfreak and Rain Ride have been arguing for years, almost getting into fights when they weren't too busy raiding others. Fucking disgraces to what Gabriel built, I'd have strung them up to my car if they weren't liked by the common colts. Tried to invite them to a party two days ago, thought I'd be able to convince them to come to terms with each other, or at least force one to kill the other. Just my fucking luck that them steel beasts, Rangers, I think they're called, came marching through with some of them Tenponyers supporting them. They almost got me, too, one of the big metal ones had his sights locked on, would have died if my car stalled out. Rain and Speed thought the other had set it up, blamed each other, started fighting each other. If not for them, maybe there'd still be something to try and salvage. But there's nothing left. The Sunriders are dead. Bombs couldn't kill us, navy couldn't kill us, nah, only we could kill us. Figures.\n\nWriting these journals now, I think. I don't know what good it will do. Maybe it'll just stop me from blowing my brains out. Maybe, sometime in the future, someone might find this. Be nice to have my name in the future history books, at least, even if it is as the biggest failure the highway's ever known. You know, we never drove all the Sunrise Highway, really, just the part where we could run down refugees. Navy blocked the way south. But I've looked at the maps, I can see this highway keeps going. I'm going to keep riding down it as long as I can. Anything's better than sitting still.'\n\nWe raiders might not be known for our love of history, but still, an air of reverence surrounds the last leader of our gang's ancestors. Many who hear of this will want to destroy Tenpony and the Steel Rangers for what they did, some others will want to just learn from him. But in the heart of all those who love the road, a desire burns to ride the highway all the way, to ride in the slipstream of our ancestor."
unification.36.a: "Revenge! Blood!"
unification.36.b: "Follow Nitro's Path"
unification.36.c: "Learn From His Mistakes"

unification.37.t: "Putting On The Brakes"
unification.37.d: "'Eight days since the Sunriders broke. I got ambushed by the navy while I was driving down the highway, they got my car, left it buried under a bridge. I managed to find another car near the power plant, or generator, don't know which it is. It was an old fashioned vehicle, type you'd see being driven by mobsters in memory orbs, old Gabriel would kill me if he knew I was driving this junk like some rich Wingbardian. Doesn't matter anymore, though. The old thing lasted long enough to get me down the highway to Filly, but the radiator's fucked, and I'm out of supplies. I don't want to do it, but it looks like I'll need to help somebody in this cursed place, get help in return.\n\nThis city's a war zone, worse than Manehattan ever was. Can't drive five feet without needing to duck and cover. This place smells like blood, and rot. The city's dominated by slavers caught in an endless war to get more turf and more slaves under their banners. It's not all slavers, though, there's some groups of slaves trying to fight to liberate their fellow slaves around the city. Of course, even if they did manage to kill the slavers, I doubt they'd be united for long. They'd tear each other apart, that's the way of the wasteland. I found some more steel ponies here, Steel Rangers, the trotting tanks. They seem to be new to the city, some sort of expeditionary force wanting to secure the industry. They've got the firepower, but not the ponypower, I've seen them be overwhelmed by sheer numbers of ponies being thrown at them. I think there was something else here too, a republic who held up in the metro stations. I found what was left, broken into pieces, the whole subway system smells like rotten mint and death.\n\nAll of the factions have supplies, supplies I need. I heard on the road about something south, another highway, the Azureway. I don't know why, but I want to get there. Drive on something that isn't the Sunrise, I guess. Part of me wants to just die here, another set of bones buried under Filly's brutality, but I'm not letting that happen yet. The slaves of the town have a lot of ponies and a lot of guns, but they're outnumbered and outgunned by the slavers, they just throw themselves at enemies and die. Figure I have a lot of experience from raids, could teach them a better way to fight. Of course, there's also the Shackles, largest slaver family in Filly, based out of some old factories, using beaten up guns and knives. Spending so long looking over an engine, I think I could help them out, restart a few old factory lines, maybe show them how to fix their guns. Of course, there's also the steel ponies, bastards almost killed me up north, but I gotta appreciate their armor. It's like they're wearing a tank, figure that since I know actual tanks so well, maybe I can give them some prototypes on that armor. I'm gonna take the night to decide.'"
unification.37.a: "The slaves remember his hit-and-run tactics"
unification.37.b: "The Shackles loved his mechanical knowledge"
unification.37.c: "The Rangers still have a few prototypes"

unification.38.t: "Outta Gas"
unification.38.d: "'I remember when I was young, Gabriel would tell stories after raids to us foals. He would tell us about the sun, the namesake of the gang, of how bright and beautiful it was. He said we're called the Sunriders because we're a bright spot of freedom left after the end, that we ride along a highway east-to-west, just like the sun does, that we're unstoppable, just like the sun was. He told us a lot of stories. The verdant fields of the Herzland where he grew up, the beauty of Saddle Arabian dancers, the brilliant blue sky, the feeling of being able to ride freely across the country with nothing more than a car and a full tank of gas. He told us about the highways back then, filled with ponies going hither and tither, a place that was truly free, in a world where no place else was. I wish I could have seen it all. I wish I could have seen the sun in the rearview while I roared down a fully fixed highway. I wish I could drive all the way to Vraks and meet a changeling broad, start a family. I wish I could drive by the vineyards of Strawberry and spend my life making new cars in Yale. But none of that is going to happen, is it?\n\nThe Wasteland kills us all from the moment we're born, because it gets rid of the only thing that makes us better than animals. Hope. We all saw it happen to Gabriel, saw his eyes grow more dim day by day, until he disappeared. We saw it every day on the Sunrise. Why did we kill ponies? We didn't really need their stuff. With our cars, we could have become traders, could have built something that functions. A place that's free, a place that cares. But nothing remains. New Mareway keeps ponies alive, but it crushes their spirits. Shattered Hoof neglects everything outside their prison. Filly is a meat grinder, eating everything that comes near. And what were the Sunriders? Nothing but a band of roving brutes, destroying everything.\n\nI'm out of gas. I thought that maybe if I drove the Azureway, I'd see something that would make me continue. I didn't. I keep thinking on what I saw in the metros under Filly. A dead republic, torn to shreds. You know what I realize? Those ponies are more alive than I ever was. Because even if just for a moment, they had hope. But the Wasteland crushes hope. Nobody's going to remember that experiment in hope under Filly. Nobody's going to remember me. I wish I was back on the Sunrise. Make them watch me die, realize what's going to happen to them. I wish I saw the sun. There's nothing left for me here. Goodbye.'"
unification.38.a: "He deserves one final ride."

unification.39.t: "The Convoy"
unification.39.desc: "Engines purr quietly as a massive convoy rides the highways. Starting up in Cumulus Skyport, the convoy made their way along the Sunrise Highway, down through Filly, and then to the Azureway, heading at a calm pace for the Sunrise raiders. Thousands would watch from the sides of the streets, raiders, slaves, conquered enemies, even a few visitors from abroad. In the front of the convoy is a restored vehicle of an old Sunrider leader, the boss of the Sunrise Highway in the driver's seat, while the skeleton of Nitro Boosterjuice sits in the passenger seat, bullet hole ever present in his head. According to the old raiders, this was an honorable way to treat the old leaders, one final ride down the highway.\n\nRaiders aren't known for their emotional intelligence, often they only feel rage, lust, or ecstasy. But every raider worth their car read the journals of Nitro, and all across the gang, usually rambunctious raiders are left quiet. Everyone came away with a different idea from their reading, though all felt the same solemn sadness, unfamiliar and uncomfortable. Many say that we've proven worthy of the name our ancestors called themselves. The Sunrider's descendants ride the highways freely, so we should take the honor of the ancient name. Others say that we've proven we don't need the ancestors, we're still alive, while Nitro and all other Sunriders are dead, the Sunrise Empire is what it should be.\n\nSome younger raiders whisper to themselves about the ideas of the pre-war roads. To think of roads with no cracks, no bumps, smooth riding from one place to any place else, it sounds better than anything to them. They think the gang should refocus from just making better vehicles, and instead fix the roads, and protect them from anyone who would wish to damage them. They want no rest until the gang has fixed every crack, every bump, and every pothole on the highways.\n\nThe story Nitro tells strikes a chord among many of the gang, how the Sunriders tore themselves apart, how they failed to build anything new, anything lasting. Many non-raiders, be they slaves, mechanics, or normal citizens want to change the gang to something new, something better, something that will leave a lasting mark. We aren't the Sunriders, we shouldn't be the Sunrise Highway, we need to be something new, someplace that combines the traditions of the past, with a hope for the future. As the convoy continues, everyone knows, as soon as it stops, the gang will be changed forever."
unification.39.a: "Glorify The Past"
unification.39.b: "Stay As We Are"
unification.39.c: "We Will Protect These Roads"
unification.39.d: "We Need Radical Change"

unification.40.t: "The New Normal"
unification.40.desc: "The wind blows softly as a new car pulls up to the Summerfield Arena. Thousands of cars, bikes, and larger vehicles are parked haphazardly around the newly constructed stadium, here to watch the race to beat all races, the race to determine the future of the nation. A thestral mare breathes in deeply, the smell of engine grease and oil comforting compared to the smog she's used to back in Fillydelphia. New Moon slowly comes to a stop near the entrance to the arena, about to pull in, when she's stopped by her passenger, a stallion named Pick, 'Look, Moon, I know you spent a lot on making this car, but this is dangerous! You could die!' She takes a second and looks at her passenger, taking a second before she speaks softly, 'I died the moment Red Eye chained me. This is my chance to live. I'll see you when I win, Pick.' Pick frowns softly, before climbing out of the car, leaving Moon to pull in.\n\nThousands of creatures watch from the stands, as an announcer shouts over a speaker system, introducing every racer. She pays them no mind, pulling up onto the track, parking her car in the proper spot. To her left, a giant Yak stands next to a hollowed out tank, stomping and shouting, 'Yak crush puny pony racer competition! Make Seventh Khagnate!' Past him, a zebra mare sits in a motorized chariot, her form adorned in white robes, drinking a red wine. In the first slot is the boss, the finest mechanics in the Speedriders giving their personal vehicle a final look over.\n\nTo her right comes the roar of a motorcycle, former Mayor of Friendship City, Black Seas, revving the engine of an expensive motorcycle, wearing a designer biker jacket and black shades over her eyes. Beyond her, an APC with decrepit flags of Shattered Hoof waving in the wind pulls up, former Shattered Hoof engineers giving the APC a final check, as Marshal Steel Wall settles into the seat. The ground rumbles, as New Moon looks to the entrance, seeing an entire ship on wheels, dozens of former sailors cheering and jeering as Captain Jacques drives the Stableside into the arena, the last hurrah of Rustwreck.\n\nThe announcer introduces them all again, as New Moon's fellow drivers bask in the glory of what's to come. After a minute of hearing the cacophony of announcements, cheers, sea shanties, Yak yelling, and engines, New Moon rolls up her windows, in silence once more. She closes her eyes and whispers, 'Merciful Luna, watch over me.' She opens her eyes, and flicks on her radio, a recorded broadcast of one of Red Eye's speeches filling the car. The countdown begins as she grips the steering wheel, slitted eyes staring ahead intently, as the race begins."
unification.40.a: "The Boss Wins!"
unification.40.b: "New Moon Wins!"
unification.40.c: "Black Seas Wins!"
unification.40.d: "Steel Wall Wins!"