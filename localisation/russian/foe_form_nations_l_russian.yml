unification.5.t: "Бесстрашие"
unification.5.d: "«Пони Республики, а также наши новые сограждане! Я – ваш президент Лауд Спик. Я сижу здесь, у камина, в котором весело трещат дрова, заготовленные в самом Вечнодиком лесу, и только что закончил беседу с мистером Кворри и Старым Рексом – двумя уважаемыми представителями наших недавно интегрированных соседей. Я знаю, дорогие пони, что годы засилья консерваторов научили вас бояться внешнего мира и тем самым изрядно ослабили. Ведь только слабые отвергают неизведанное из-за своего страха. Сильные же всегда стремятся к прогрессу, словно жеребята, бегущие за заходящим солнцем; они уверенно шагают в неизвестность с твёрдой убеждённостью, а не со страхом. Именно этот трусливый, заискивающий консерватизм привёл к тому, что президент Вайд Сэвидж потерял свой пост. И именно смелый, созидательный прогрессивизм позволил мне превратить нашу страну в великую и могучую нацию.\n\nДа, устои псов Вечнодикого леса или Союза ущелий могут показаться нам странными, но если мы отвергнем их, то попросту погрязнем в застое, оставшись в полном одиночестве посреди постоянно меняющегося мира. Оглянитесь вокруг, мои сограждане. Да, у нас действительно есть причины для опасений, но угроза исходит вовсе не изнутри. На востоке поднимает голову озлобленный и жаждущий власти жеребец по имени Ред Ай, истинный бастион консерватизма. А фальшивая пророчица Гаудина Грознопёрая, прикрываясь лживой маской прогресса, уже засматривается на наши прекрасные земли своими алчными грифоньими глазами. И когда Филлидельфия или Расколотое Копыто пойдут на нас войной, поверьте, мои пони, вы будете счастливы, что на вашей стороне стоит мощь алмазных псов, адских гончих и карьерных угрей. Мы больше не станем сидеть сложа копыта. Мы больше не захолустная республика и не второстепенная держава. Сегодня мы – Великая Республика, и отныне мы будем вместе бесстрашно маршировать в будущее. А теперь налейте-ка сидра и разделите его со своими новыми соседями, мои пони. Теперь вы все – граждане одной страны»."
unification.5.a: "Вместе в будущее!"

unification.6.t: "Громкоговорители"
unification.6.d: "«Пони Республики и союзные нам существа, я рад вновь говорить со всеми вами. Многое изменилось с момента моего последнего радиообращения, и благодаря нашим усилиям по восстановлению теперь мой голос слышен каждому. Наши миротворческие миссии продвигаются успешно». Бакшот укрывается в горящем доме со своей неизменной жуткой ухмылкой на устах; вокруг него лежат горы взрывчатки и оружия, брошенные убитыми рейдерами. Солдаты подбираются всё ближе, уничтожая очередного бандита. Бакшот тянется к своему ружью, но с удивлением видит, как оно взмывает в воздух. Рядом с ним стоит рейдерша-единорожка и целится ему прямо в голову. А в кармане у неё надёжно спрятано подписанное президентом помилование за прошлые преступления. Бакшот заходится безумным хохотом, когда его оружие гремит в ответ, а висящий неподалёку громкоговоритель продолжает вещать как ни в чём не бывало: «Закон и порядок восстанавливаются в каждом уголке Республики, пока последние остатки беззакония и хаоса изгоняются с наших земель».\n\nФезербраш весь покрыт грязью и кровью. Вместе с адской гончей и старым объездчиком карьерных угрей он сидит за столом в небольшой лачуге: они обсуждают поставки оружия и снаряжения для сопротивления. Они так увлечены спором, что никто не замечает опасности, пока газовая граната не разбивает окно. В домик мгновенно врываются солдаты в противогазах. Адскую гончую убивают прежде, чем та успевает среагировать, но Фезербраш дерётся как одержимый: острые грифоньи когти рвут броню и плоть под ней. Однако дым быстро заполняет его старые лёгкие; он падает, и сквозь туман на него безжалостно смотрят холодные стёкла противогазов. А из репродукторов сквозь шум борьбы доносится: «Автократы и тираны, стремившиеся расколоть нашу любимую республику, повержены».\n\nЖеребёнок в болотной деревушке вздрагивает, когда здоровенный жеребец толкает лавочника и забирает его товар. Малыш рад уже тому, что целью нападения стал не он. Он заворожённо слушает голос из громкоговорителя: «Процветание, безопасность и стабильность придут к каждому гражданину нашей прекрасной республики, это я вам обещаю. Сегодня, мои пони...» Жеребёнок очарован этим голосом и далёким Капитолием. Солдаты бьют зачинщика беспорядков прикладом по затылку и утаскивают прочь, но малыш этого даже не замечает. Он уже представляет себя в строгом костюме и галстуке, обращающимся к миллионам пони через точно такие же репродукторы. С улыбкой на лице он вскакивает и бежит домой, а его разум переполнен картинами великого будущего. Его уши подёргиваются, ловя последние слова послания из динамиков, которое достигает ушей каждого гражданина республики.\n\n«Наша Республика воистину...."
unification.6.a: "... вечна»."

unification.7.t: "Искусство, тени и плоть"
unification.7.d: "Акрилик Скетч сидел в своей скромной маленькой хижине и слушал по радио ещё довоенные песни. Между делом он зарисовывал мутировавшую собаку, которую увидел совсем недавно, после чего со спокойным вздохом взглянул на получившийся набросок. Акрилику до сих пор не верилось, что лучший друг пони – столь доброе и преданное существо – из-за противоестественной магии превратился в подобный кошмар. Он на мгновение задумался о том, сколько ещё уникальных существ Зебрики теперь выглядят столь же ужасающе.\n\nВнезапно радиоприёмник, словно обретя собственный разум, переключился на другую волну, на которой Акрилик услышал по-настоящему жуткие звуки. Всплески воды, хрипы пони или какого-то другого существа, захлёбывающегося собственной кровью или иной жидкостью, и доносящееся из динамика бурление. Не поддаваясь панике, Акрилик улыбнулся: он подумал, что это, должно быть, просто странные помехи и ничего более. Он снова переключил канал, но кошмар не прекратился. Теперь радио транслировало звуки пустого помещения, наполненного шёпотом, скрипом работающих верёвок и шкивов, чьим-то удушьем и криками какого-то несчастного, обречённого на участь, которую Акрилик не мог даже вообразить. А на фоне всего этого мягко и торжественно пел хор из кобыл и жеребцов. Они пели прямо под звуки последнего вздоха пони, чью жизнь уносила какая-то неведомая сила.\n\nАкрилик глубоко нахмурился и прижал уши, стараясь максимально приглушить этот шум. Крики и звуки смерти начали затихать, позволив ему расслабиться хотя бы на секунду. Но вдруг его ухо дёрнулось – пони отчётливо услышал, что пение становится как будто ближе."
unification.7.a: "Некоторые секреты лучше оставить под водой."

unification.8.t: "Непризнанный шедевр"
unification.8.d: "Сержант Коппер Пайк и его отделение маршировали среди старых руин Либертивилля, что находился прямо за чертой Капитолия, пока на город опускалась ночь. Он не знал, что именно здесь произошло, но отчётливо понимал: что-то не так. Воздух на вкус был... неправильным, словно пропитанный ржавым металлом и грязью, гниющей на солнце. Многие некогда уютные деревянные здания с соломенными крышами были разрушены. Остальные заросли мхом и покрылись слоем грязи и крови. Даже металлические постройки успели заржаветь и развалиться.\n\nКоппер посмотрел на своих солдат – троих молодых жеребцов, едва оставивших детство позади, которых призвали на службу ради защиты их великой Республики. Заметив, что его бойцы замерли от ужаса, а их копыта дрожат, сержант кивнул им и заговорил едва слышно, словно боясь пробудить что-то давно уснувшее в этом городе. — Так, жеребятки, слушайте меня внимательно. Очевидно, что здесь что-то затевается, и боюсь, что даже Капитолий в опасности. Я не стану требовать от вас понапрасну рисковать своими жизнями. Хотите смыться отсюда? Вы свободны. Боюсь, нашей Республике уже пришёл конец, — сержант низко опустил голову, пока трое жеребцов спешно разбегались в разные стороны. Дезертиры, что с них взять. И всё же эта Республика была его жизнью, и если придётся, Коппер Пайк пойдёт ко дну вместе со своим кораблём. Сделав решительный, глубокий вдох мутного болотного воздуха, сержант зашагал по улице в поисках знаков – следов борьбы, примет битвы, любых признаков жизни или хотя бы смерти.\n\nВыйдя к тому, что когда-то было старым центром Либертивилля, он застыл на месте, заметив ужасающий кошмар. Мёртвый пони, чьё тело использовали как чашу для болотной воды, а голову насильно запрокинули к небу. Глаза и рот были выколоты и залиты болотной жижей, которая самым отвратительным образом пузырилась, пенилась и шипела. На груди была вырезана надпись: «Узрите моё финальное творение; и да разверзнется Трясина». Коппер закрыл глаза и вскинул винтовку, твёрдо решив прекратить мучения несчастного, как вдруг услышал далёкие крики. Дрожа всем телом, сержант закинул свою рычажную винтовку за плечо и галопом помчался на звуки.\n\nДобравшись до места, он обнаружил огромное количество крови на мокрой грязи, разбросанные повсюду ошмётки плоти, расколотый надвое шлем, аккуратно разобранную винтовку и лежащую рядом изуродованную голову одного из его солдат. Коппер лишь испустил короткий, дрожащий вздох перед тем, как почувствовал, что его тело полностью онемело. Он мог лишь жалобно заскулить, падая навзничь."
unification.8.a: "Ни законы, ни правительство не сдержат природу."

unification.9.t: "Разведывательный отчёт PB-06, он же «Трясина»"
unification.9.d: "Место: Богвилль, провинция Гринлайн-Рад Рыбаки\nДокладчик: Мунталон, глава «Ока Гауды»\nПричастный персонал: «Око Гауды», Мунталон\n\nДоклад: Я и моя команда прибыли в Богвилль – деревню на самой границе с поразившей север заразой, которая разрослась настолько, что уже вовсю травит и этот город. Вода становится ещё более непригодной для питья, чем обычно. Местные жители умирают, стоит им сделать глоток, и, судя по всему, очистить её может лишь долгое и интенсивное кипячение. Каждый день пони, грифоны и прочие существа, покрытые личинками, ужасными поражениями кожи и с красными, затуманенными глазами, обращаются к целителям, у которых вскоре и умирают. Местные врачи считают, что они страдают от лучевой болезни, но это явно что-то куда более жуткое: многие пациенты умоляют прекратить их мучения, пока они заживо гниют. Соседние государства вроде Новой Эпплузы уже тоже начинают сталкиваться с этим кошмаром. Эти события либо нарушили, либо полностью прервали наши северные маршруты снабжения, поскольку здешние земли становятся слишком враждебны даже для самых оснащённых караванных компаний. Пони на дальнем севере из мест вроде Понивилля и Сердца Эквестрии сообщают о тех же проблемах.\n\nПрезидент Гаудина, я рекомендую срочно направить сюда санитарные отряды с огнемётами, ибо лишь пламя может по-настоящему обуздать эту трясину. Чем дольше мы медлим, тем сильнее страдаем, и я боюсь, что в итоге мы будем вынуждены либо отступить, либо оставить после себя города-призраки. Пришлите сюда Бладая и его громил для поддержания порядка. Нельзя допустить, чтобы ситуация вышла из-под контроля. За НКР."
unification.9.a: "ТОЛЬКО ДЛЯ ГЛАЗ ПРЕЗИДЕНТА"

unification.10.t: "Start Of The Union"
unification.10.d: "Talons click against metal and wood, as Talons ready their rifles, pointed at the reinforced door into the armory. One Talon stands proud, revolver in his grasp, speaking to his fellows, 'Keep your guns aimed, friends. Featherbrush has fallen, but we never will. Let's send these ponies back to their Gorge!' He aims his revolver at the door, but his aim falters as the ground below them shudders. The metal floor of the bunker makes way, as a giant eel burrows inside, dust and debris filling the air. Before the Talons can recover, Gorge ponies climb off of their eel, aiming guns at all of them, 'Surrender, or you'll be the eel's next meal.'\n\nElsewhere, a Gorge soldier watches as the Plains Ponies drag a tied up stallion behind them, to town square. The tied up Buckshot shouts wildly, 'Get these fucking ropes off me! You fucking impotent bastards, I'll kill you all once I get out of here!' The ponies throw him in front of the soldier, who looks down at the former raider boss. Buckshot spits blood onto the ground, grinning crookedly, 'I'm going to burn your whole fucking Gorge to the ground! You're gonna burn! Burn!' The soldier lifts his rifle, putting a bullet between the raider's eyes, sighs of relief coming from the many settlers surrounding.\n\nSoldiers stand at the edge of Ghastly Gorge, cigarette smoke wafting up into the cloudy sky above. The elder of the two checks his ammo, 'Couldn't imagine being part of the occupation forces, it would feel so weird, not having the Gorge around me.' The younger one grins slightly, cleaning up her rifle, 'I hear a lot of the occupation forces are coming back soon. Buckshot was caught, apparently there's a fight against the last Talons, means we're getting ready for something big.' She grins a bit more, and assembles her weapon with trained hooves, 'Latest I hear, Republic's next on the list to be part of the Union.' The elder nods softly, 'Long as it keeps us safe.'"
unification.10.a: "Safe, We Shall Be"

unification.11.t: "Flame"
unification.11.d: "Two raiders kick up dust behind them, a grinning stallion and a following mare, approaching the near mythical leader. Buckshot stands, eyes wide and grin even wider, watching gangs playing with Talon equipment, feasting on Quarry Eel meat, cooked on massive bonfires. The stallion stops behind Buckshot, and gives him a smirk, 'Buckshot, there's my favorite raider, you know, I always said to the others that you were a pony to keep an eye on. I know I ain't been around to help you very much, but you know, I was always trying to get the others to realize what I saw. Oh, I'm Double Barrel, by the way, this is my slave mare, I'm giving her as a gift to ya, she don't got a name.'\n\nBuckshot stays looking ahead, his grin growing wider as he turns slightly to face Double Barrel, 'Sorry, did I ask you to speak?' Double Barrel blinks, 'Uhh, no, I guess not, but I just thought-' Buckshot cackles out and spins to face him, 'Thought? You thought? Must not have thought very much! If you thought, maybe right now, you'd be groveling for your life, you fucking traitorous piece of shit.' He steps closer to Double, who steps back slightly, 'Where were you when I was taking over the Talons? Where were you when I was killing the Gorge? Where were you, mmm?'\n\nDouble stammers slightly, 'I-I'm sorry, boss, I was just, you know, telling the other gangs they should help you, b-but they weren't listening, ya see? I'm on your side, always been, loyal as can be!' Buckshot smirks, 'You know what I hate more than anything? I could forgive someone who fights me, they're just fucking stupid, can't be blamed for being a fucking idiot. Someone who hates me? Hah, at least they have standards! But you, you're worse than that. You're a fucking worm.' The shotgun on his side roars to life, blasting away Double's leg.\n\nDouble collapses, staring at the stump where a leg used to be, 'F-fuck! Why?!' Off to the side, the mare looks, and smirks. Buckshot looks over at her, licking his lips and approaching, unkillable grin staying on his face, 'Now you, oh, you, I see potential. C'mon. What should we do with him?' She looks at the stallion, and then at Buckshot, smirking widely, 'Burn him. Alive.' He looks back at her, grin growing ever wide, 'My type of mare.'"
unification.11.a: "Enemies To Ashes"

unification.12.t: "Bonfire"
unification.12.d: "A mare stands, smirk wide as can be, watching New Appleloosa burning to the ground, raiders still ransacking every building. As she watches, something flies up from the flames, streaking through the sky, then arcing down directly towards her. From above, a ghoul with a wall-eyed stare descends, cracking a chalk board over her head. The raider mare steps back, her head cracking to the side from the force of the blow. Slowly, she spits blood onto the ground, a tooth among it, before licking her lips, smirk returning as she looks back at the ghoul mare.\n\nThe ghoul Pegasus dives in for another blow, swinging an almost broken chalk board at her head, but the mare side steps before it can hit, pulling a knife from her collar, sticking it into the ghoul's side. A quiet expression of pain covers the ghoul's face, as she collapses in front of the raider mare. The raider looks down at her, pulling her knife out, licking it off of the ghoul blood that covers it. She smirks even wider, eyes meeting the eyes of the ghoul, staring two different ways, 'Good strike. Not good enough, though.' She licks her lips, a small giggle escaping her lips, throwing her knife down before the ghoul, 'Go on, get out of here. Next time, use a better weapon. You're too entertaining to kill.' The ghoul looks at the knife, and then at the mare, grabbing the knife and fleeing.\n\nBuckshot speaks from behind her mare, 'Aww, and here I thought she'd be able to kill you.' The mare looks back at him, smirking wider, 'Hey-hey, Bucky. Barrel couldn't take me down, some ditsy Pegasus ain't gonna be able to do it.' She licks her lips and nods her head to the burning city in the distance, 'Exactly as I thought you'd want it, Bucky.' Buckshot grins widely, looking the burning city over, 'There's still more to burn, this is just a bonfire. I'm looking for. . . a wildfire!' He licks his own lips and looks back at her, 'You still don't have a name, do you?'\n\nShe stands proudly, orange flames in the distance outlining her body, 'Does it matter, Bucky?' She smirks even wider, tilting her head, 'I'm just doing what you want. Oh sure, I'm great, but only because I'm ripping off someone greater.' He looks at her, his grin interrupted with a wild cackle, stepping closer towards her, 'Fuck! You're entertaining! Yeah, you know what, you're right, you're basically a worse me.' He licks his lips and leans in, 'C'mon, we've got more to burn. Birdshot.'"
unification.12.a: "Smoke Seen For Miles"

unification.13.t: "Wildfire"
unification.13.d: "Junctiontown and Shattered Hoof burn, hot flames claiming the new capital of the wasteland. The innocent screams are cut off by Raider bullets. The last Talon sits in the road, watching as the leader of the attack approaches, the most terrifying mare in the NCR, Birdshot. He coughs as she approaches, 'I surrender, please, I'll join you, I'll do whatever you want.' Birdshot approaches him, looking down at him with a wide smirk. She leans down, and licks his ash covered feathers, pulling back with a wider smirk, 'You know what? I think I'm hungry.'\n\nHe cringes away from the mare's lick, 'I-I can get you some food?' She rests her hooves on his side, and smirks more, 'I'm hungry for something specific.' She licks her lips, looking deep into his eyes, 'Fried chicken~' In one movement, she tosses the injured Talon to the side, throwing him through the window of a burning building, his screams not lasting for long. She looks after him, smirk wide as can be, while the flames lick at her from all around. A giggle comes from deep within her, the funniest joke in the world said to nobody but her.\n\nA fire bomb explodes in the building next to her, as Buckshot approaches, flames flicking in his wide eyes, reflected in his wider grin, 'Smell that smoke, Birdshot. One month, and nothing will be here but ash and those the flame seared.' Birdshot looks over at him, and smirks, nodding, 'As you want, Bucky.' He chuckles, licking his lips clean of ash and soot, looking into her eyes. Then, he offers his hoof, grin wider than ever before, 'A dance?' She giggles, and takes his hoof, 'I thought you'd never ask~' \n\nHe pulls her close, as the two begin to move. Hooves step on ashen skulls, ash surrounding them like a tornado as they spin together. The hot flames claim those around, screams the music they dance to, the cries of the innocent the melody, the collapsing buildings the beat. He grins as she smirks wider. The flames burn all around, but the brightest flames burn inside."
unification.13.a: "Dust To Dust"

unification.14.t: "The Plains"
unification.14.d: "Ponies of the plains gather all around, watching as Talons land one by one in their small town, maintained guns and clean armor gleaming in the sunlight. None dare to try and reach for their guns, or make a movement that's unexpected, eagle eyed griffons watching their every movement. Landing last is an older griffon, Featherbrush looking at the various ponies with a small glare, stalking forward, talons digging through the dust of the plains.\n\nOn the other side of the town, ponies arrive at once, filthy armor and barely functional guns gracing their forms. Their leader pulls a noose behind them, a body attached to it by the neck, bleeding still on the ground. They trot slowly, coming closer and depositing the dead pony in front of Featherbrush. Featherbrush looks down, the corpse of Buckshot still grinning as madly as ever, while the plains pony speaks, 'A gift, Featherbrush. To show good faith.'\n\nFeatherbrush looks up, giving the ponies a small nod. He motions his Talons closer, who take the body in their claws, 'I'll hang him in a public place. Remind ponies the price of raiderdom.' The pony across from him nods, 'We all appreciate the liberation of our home, Featherbrush. We lost a lot of loved ones to his flames. But we aren't going to idly sit by and welcome a new 'Boss'.' The pony looks into his eyes, 'We ponies of the plains can take care of ourselves. We will pay you tribute, and we will join any wars, but let us govern ourselves.'\n\nFeatherbrush looks back at the pony, and then nods, 'Fine. You're going to be dependent on us, anyway. You'll have economic and political freedom. That's about as good as you're going to get.' The pony softly nods, 'Acceptable.'"
unification.14.a: "A New Contract"

unification.15.t: "The Gorges"
unification.15.d: "Featherbrush stands within the deepest depths of Ghastly Gorge, old eyes looking at a gigantic hole in the Gorge. Gorge ponies stand beside him, many exchanging bets with each other, while one speaks to him, 'If you wish to ever earn our respect, Sir Featherbrush, you must engage with our traditions. Of course, you can step back at any time, but I cannot promise my fellows will stand down should you do so.' Featherbrush rolls his neck, creaking it, a small smirk crossing his face, 'Do you think I'm afraid? This is going to be fun.' He flaps his wings, flying into the air.\n\nFrom the hole under him, a giant Quarry Eel lunges out, mouth wide open, roars echoing across the Gorge. Its sharp teeth barely miss Featherbrush's leg, as he rolls to the side midair, drawing a sharp knife from his side. The Eel wiggles side to side, making the whole Gorge shudder, roaring once more, and lunging after him. With one flap of his wings, the Eel misses, while his knife finds purchase in its flesh, digging deep into flesh. His talons dig into the back of the Eel as it roars, slamming itself against the sides of the Gorge, but he just digs his talons in deeper.\n\nThe Eel roars louder, slamming itself back. With a smirk, Featherbrush releases his grasp, flying to the side, leaving his knife behind in the Eel. As it slams against the wall, the wall slams against the knife's handle, sending it flying through the entire Eel, and through the other side. Featherbrush dives down and grabs his blade, thick, hot blood beginning to pool in the Gorge, as the Eel tries to bite him once again. He dodges barely to the side, his knife digging into the Eel's eye, ripping it open while his free talons reach to his side, taking out a grenade. He pulls the pin, she stuffs the grenade in the Eel's eye, flying away quickly.\n\nHe lands by the Gorge ponies, all of whom watch as the Eel's head explodes. Blood splatters all over, as the once great creature slumps down, dead. He raises his claws, catching his knife, flying from the explosion, covered in blood. He flicks the blade clean, and slides it back to his side, looking at the Gorge ponies, 'I trust that will work?'"
unification.15.a: "Master Of Gorges"

unification.16.t: "The Sycophant"
unification.16.d: "The bodies of the Revanchist Coalition cover the ground outside the Weather Factory, as Talons put down the last of the resistance. Warband leaders are caught by the hour, their soldiers of mixed loyalty fleeing upon sight of Talon discipline. But not everyone fought, and not everyone fled. Featherbrush lands in a secluded area, two griffons flanking his either side. He glares slightly at the smiling suited unicorn across from him, Skybreaker. He bows his head, 'Sir Featherbrush, a pleasure to make your acquaintance. I'm a big fan.'\n\nFeatherbrush dusts himself off, and steps closer, 'I got your letter. You have five minutes to convince me.' Skybreaker grins and nods, 'I have much of the Lightning Scavengers under me, the majority of the unicorn population, well practiced in battle magic. I hold no loyalty to the old ways of the Assembly, I simply wish for the prosperity of all ponies I look over. In that, I feel we are kindred souls.' He grins more, 'Of course, you will want some land, you can take the full Thunderway. My skilled mages will extract confessions from any who resist you, and we shall so thoroughly crush any resistance that the land will be yours, forever. In exchange, all I ask is that you leave the southern side of the country under my control. I can better manage the expectations of Old Appleloosa, and of course, the remaining Scavs will see me as one of them.'\n\nFeatherbrush looks at him, and shakes his head, 'You aren't a trustworthy pony.' Skybreaker chuckles softly and smiles, 'Of course I'm not. I'm in this for nothing but my own gain, Sir Featherbrush. What gain would I get from opposing you, exactly? I believe I'd gain a bullet to the head, and lose many years of future living. Mmm, not a good bargain. This will make me rich, and you even richer. It works for us both.' Featherbrush looks at him for a minute more, and then nods, 'Fine. But step out of line, and you'll regret it.'"
unification.16.a: "Of Course, Sir"

unification.17.t: "A Tale"
unification.17.d: "Once upon a time, in the Hayseed Swamps, a plague spread like wildfire amidst the swamp folk. The plague claimed all it touched among the outlaying villages, yet despite the death and destruction, no help came from the High Chief. A young colt found himself afflicted and sought aid from the High Chief, and in his time of need, he was turned away. Thus he left, to become one with the swamp.\n\nYet it was not to be his fate to die. For there in the swamp, Leaf On The Wind languished, when the sky broke above him. Rays of sunlight, blinding in their incandescence, shone down all around him. From above, a voice boomed, Myriad, healing him and giving him a simple command. To spread, and repopulate the wastes. Nursed back to health, he healed the young and sick across the swamps. His miracles were heard about by the High Chief, who in a fit of jealousy, saw fit to destroy the Prophet of Myriad. Yet Myriad was never to be disappointed, as Leaf struck the throat of the High Chief, killing him in but a moment.\n\nFor years, the tribes have fought, the old loyal to the High Chief calling Leaf a murderer, while his loyal Cult have prospered. Years have passed, and now, for once, the swamps are united under Myriad's vision. Holy ponies go from town to town, offering food and conversion, with all but the most unholy warriors laying down their arms, and joining in the embrace of Myriad.\n\nLeaf On The Wind stands at the helm of his holy nation. It has become clear that the Hayseed Swamps are not alone in the world. The time has come. Myriad will have the world."
unification.17.a: "Spread, Repopulate."

unification.18.t: "Myriad's Mercy"
unification.18.d: "Hunger pangs pain her, each and every step a struggle to make. She comes up slowly to an impromptu camp, armored ponies sit around, their sides gaunt, eyes hollowed. She steps up to the most armored stallion, speaking to him, 'I'm back from scouting. No cultists.' The stallion looks over a radio, his sides fat, giving her a small grin, 'Ah, good. I'm afraid to say that I don't have those rations I promised you. The enemy found our supply cache before we could. My humblest apologies, don't worry, if you do another scouting mission, maybe you could get something.'\n\nShe looks at him, legs shaking, 'I don't think I can do that, Sir.' He smirks softly, 'Well, then those rations will likely go to somepony who can do it. Please move aside, you're making the atmosphere very sad. I don't like being sad.' She slowly steps aside, while the radio flicks on, a voice speaking through it, 'Good day, soldiers of Neocastle and Amethyst. This is the Voice of Myriad, speaking on behalf of our most holy Prophet. I'm sure all you fat-cats are feeling a bit hungry by now, aren't you?'\n\nThe stallion frowns and moves to turn off the radio, but he's prevented by flares from everyone around, 'I'm sure you haven't told your soldiers about the offers we've made, knowing you Neocastle folks. I hope this is loud enough to be heard by your soldiers. Soldiers of Neocastle and Amethyst, we can promise three meals per day and a community of holy ponies, we only ask one thing. Surrender.' The officer chuckles slightly, 'Heh-heh, what ineffective propaganda, we would never believe him, right?'\n\nHe turns to face the camp, only to come eye to eye with a revolver, pressed against his forehead. In a minute, every gun in camp adds another hole to his body."
unification.18.a: "Myriad For All"

unification.19.t: "Myriad"
unification.19.d: "A Pegasus trots into a small meeting room, carrying nothing but a dark grey cloak over her body. She looks up, seeing the one she has come for. Leaf On The Wind sits, pouring tea, speaking to her softly, 'You have prayed to meet with me, I have heard. You seek guidance from Myriad? Take a seat and have some tea. I never reject a meeting with one desperate. You are welcomed to my abode, Child of Myriad.'\n\nThe mare laughs a bit softly, slowly taking a seat, 'Parent, I'm afraid.' She looks up at Leaf, ignoring the tea on the table, 'Leaf On The Wind, you've grown so much since I've last seen you.' He looks back at her, one of his ears twitching in recognition of her voice, 'I still remember seeing you in those swamps, a moment away from death. You were lucky I found you when I did, and look what you've done with what I gave you.' She smiles softly at him, 'I'm proud of you, and all that you've done.'\n\nHe blinks softly and leans forward, the hood of his robes falling down, a smile on his face, 'Myriad? You've taken the form of a Pegasus?' She looks back at him with a small, sad smile, 'Myriad Abundance. I only introduced myself to you with my first name. I am no goddess, Leaf, I'm just a mare.' He draws back, while she continues, 'Agent Muddied Waters of the Neighvarro intelligence agency predicted we would try to invade the Hayseed Swamps. I was an almost retired Colonel back then, so he sent me to find someone, who would split the Swamps. Heh. . . Look how that went. It wasn't the best plan. I'm not a goddess, Leaf. You've done so much for me, how could I keep letting you believe a lie?'\n\nHe looks at her, his eyes shaking within their sockets, silent as he looks at her. Then, he slowly speaks, 'You are Myriad. You are my goddess.' She shakes her head, 'I'm not a goddess.' He leans forward, 'You are! Look outside, Myriad. Look at what your words allowed us to do. Look at all the good you have brought.' He extends a hoof to her and smiles, 'My Goddess, let your Prophet introduce you to your children.' She looks at him for a minute. Then, she reaches forward, taking his hoof."
unification.19.a: "Welcome, Myriad"

unification.20.t: "Good Business"
unification.20.d: "The Statue of Friendship stares down upon Friendship City, along with it, the eyes of Black Seas, in her personal office. The stashed away wealth of Tenpony is claimed by the poor, spending it on food and drink imported from Arbu, or on weapons sold by Marelem thestrals. A Scribe speaks to a member of the Twilight Society, both exchanging notes, while a pair of Knight siblings chat and laugh with a soldier of Friendship.\n\nFormer raiders and their former prey shake hooves and exchange smiles, while ships land in the docks by the minute. Traders come to sell from Rustwreck, New Aris, and far away Greenway, even a few ships hailing from the southeastern jungles, laden down with much to trade. Under the shadow of Friendship, caps exchange hooves, and goods flow from producer, to merchant, to consumer, to friend. A few get lost in the transactions, sent up to Friendship, reinvested into even greater factories and businesses.\n\nBlack Seas looks upon all that she has built, eyeing the caps and coins. The guns and bullets, the medicines, the smiles and the laughter. Manehattan has, finally, become the shining city it was always supposed to be. She watches. She smiles."
unification.20.a: "Let the Money Flow"

unification.21.t: "The Ruins"
unification.21.d: "The broken roads of Canterlot crack and creak as striped hooves step down the conquered streets of Canterlot. Zenia, a zebra mare, looks around the ruined capital, looking curiously at a nearby poster, hung on a wall, still preserved like it was on the Last Day. On it, another zebra looks back at her, her eyes evil and dark, teeth sharp fangs, a dangerous beast. She tilts her head, 'Is this what we looked like?' She shakes her head incredulously.\n\nShe then looks next to the poster, inside an old shop. She pulls the door off its rusted hinges, crashing to the ground before she trots inside. Mannequins watch her from all sides, dressed in fancy dress. Her eyes look past them, looking at the many shelves, some collapsed from age, some still hanging up barely. She sees something, and a smile appears on her face.\n\nZander trots his way down a street, rifle by his side ready for the first alicorn or ghoul that would cause issues. He jumps slightly as he hears a crash in the distance, securing his rifle and galloping his way over, stumbling over a few pieces of debris. He arrives quickly outside of an old shop, readying his gun and shouting, 'Come out, Glyphmark occupation authority!'\n\nZenia pokes her head outside, wearing a scarlet red dress over her black and white body. She blushes as she sees Zander, 'Oh, sorry, did I make too much noise?' Zander looks at her, and blushes as well, averting his rifle, 'I thought you were one of those alicorns.' They both look away from each other, until he speaks again, 'You look nice in it.' She blushes more, 'Thanks.'"
unification.21.a: "Reclaiming The Mountain"

unification.22.t: "The Step Ahead"
unification.22.d: "Zander stands idly by, watching as equipment and ponies fill the area once known as Zebratown, new homes and new businesses built alongside new factories. He sniffs the air, and cringes softly when he smells smoke from a nearby firepit. Memories flash past his mind, Red Eye and Ponyville Raiders dragging away his friends and family.\n\nZenia helps an old mare from the south to her new house, looking beautiful in a scarlet dress and wide smile, 'This is going to be your new home. You'll be working on loading magazines and clips for our soldiers to use for our liberation efforts.' The old mare opens the door to her house, and nods softly, 'Will I be paid?' Zenia smiles widely, 'Of course! We're against slavery, we wouldn't not pay your labor, that would just be slavery by a different name.' The old mare nods softly, and enters the house.\n\nZander approaches from behind Zenia, 'Do you think any of these ponies will cause issues? Remember what happened in the Stable, in the legends.' Zenia looks over at him, 'These ponies aren't going to betray us. They'll be fine, and they'll work. Those who wouldn't go along are still back in their homes, all these ponies, well.' She takes a second, 'They hate slavers more than they hate 'stripes'. They'll help us.'\n\nZander nods softly, 'I guess.' He takes a second, and looks off, 'Do you have anyone waiting for you in Fillydelphia?' She smiles softly and nods, 'A husband. I hope, at least. It's been years, and sometimes I think about when he was taken.' She pauses, and shakes her head, smiling softly, 'I hope he'll like this dress I found. It's his favorite color.' Zander looks at her, and then smiles softly, 'Husband? I hope we find him. You deserve someone.'"
unification.22.a: "Chains To Break"

unification.23.t: "Broken Chainlinks"
unification.23.d: "Black and white fills the streets of Fillydelphia, as zebras and ponies westing black and white striped armies help slaves travel. Doctors and alchemists tend to them all, while soldiers distribute food. A flash of scarlet enters the street, as Zenia rushes up to a gaunt zebra stallion, giving him a big hug. Zander watches with a soft smile, before turning his eyes away, helping a few more.\n\nAt the center of the city, thousands of slaves gather around Alpha-Omega Tower, evacuated of foals in the midst of being reunited with their parents. Soldiers poke at the back of a gigantic, disgusting slaver, forcing him to stand at the edge of the roof. Chainlink Shackles looks down as the gathered slaves stare up at him. He smirks, and chuckles, even as a noose is tied around his neck, 'Even when they kill me, they still look up at me!' The soldiers step back, holding up their guns at him, a wordless command being issued.\n\nChainlink smirks more, looking back at the soldiers, 'Stripes. Should have known it would be you. Go on, try to tame the city, Stripes. It's going to devour you. Only I could!' He chuckles a bit more, 'Only I ever could be this city's Master. Your mistake.' He takes a single step off the end of the building, plummeting down."
unification.23.a: "Freedom."

unification.24.t: "A Mountain of Nostalgia"
unification.24.d: "As Overmare Emerald Vale trotted down the street with her personal security forces in tow, she gazed upon the trashed, ruined streets of Canterlot, seeing her fellow Stable Dwellers marvel and remiss over their old lives. The head of Stable Maintenance, Loose Bolt, already started retooling his old bicycle repair shop as a workshop, despite components fused to his skin. Flower Basket, one of the many foals of Stable City, would excitedly dash to her old home. Her parents stared at it from the road with equal awe and horror at the house, once having many windows and a nice garden, now a smoldering mess, yet still standing. Her security chief, Baton Bash, grumbled over the lost potential of the destroyed and looted Canterlot Guard Headquarters. \n\n When she finally looked ahead, Emerald ran into the old Stable-Tec office, a building eroded by time and, of course, the Pink Cloud. It is here where nostalgia hit her, far harder than any alicorn magic could. She trotted through the atrium, where she recalled the times of joyful chatter with coworkers, long coffee breaks, and most of all, meeting her one true love. Those thoughts gave away both pain and glee, synthesized into nostalgia. As she continued trotting, she found her own office, a third story room, largely destroyed ruins, nearly filled with concrete. All that remained was a well preserved, yet even now, worn picture of a younger Emerald, posed with her coworkers and the visiting Stable-Tec President, Scootaloo. Her eyes would turn away from the past, a resolute expression across her face as she gazed at her fellow Stable Dwellers, now dwelling within Canterlot, their reclaimed home."
unification.24.a: "We Must Revive Old Canterlot"

unification.25.t: "Descent to the Present"
unification.25.d: "Emerald Vale stands before the smoldering ruins of Ponyville, following a deadly firefight with The Mayor's Gang. The raiders fought dirty, and it was a rough firefight, but they underestimated the enduring stubbornness of the renewed citizens of Canterlot. Vale looks away from the devastated atmosphere following the battle, and trots into Golden Oaks, the headquarters of the Mayor and main base of her infamous gang, yet also the home of Ministry Mare Twilight Sparkle, for a time. She looks upon the ruined building with a scornful scowl. Vale realizes, awestruck, just how much this place, a humble community center, got out of shape. Vale sees many things wrong with this place, when it used to be so right. \n\n Although the office is a poor, dilapidated ruin of what it once was, Vale realizes that it also serves as a statement of what the world is like now. As she adjusts the collar on her suit, she realizes that everything the raiders did to this place had a purpose. The cages, although simple, are effective at holding prisoners, judging by the claw marks on the floor, the curled up skeletons, starved of life, plus the dried blood and missing teeth strewn about the floor. The books, useless to the savage raiders, repurposed, their leather covers turned to strips then sewed into armor, their paper used for hygiene, what limited hygiene raiders tried to have, of course. Ladders and floorboards, torn out to make way for dirt, used to add wood back to the hollow tree. \n\n She understands the raiders were held back by cruelty, greed, and the base desires for shallow ‘loot'. She also understands that they implemented great creativity and innovation, making something new, from what remains of the old, to sustain, survive, and eventually thrive. As Vale makes it to the upper level of the tree, she sits down in a rickety old rocking chair, looking out the makeshift window, she sees her security force using the raider's cages, freeing the captives and imprisoning the raiders who could not escape. A grin grows across her face, as she realizes her Stable is learning, just as she does. Vale stares out the window, thinking and rocking for a couple of hours, before she shoots up like a rocket, with one simple realization."
unification.25.a: "We Must Play By This New Equestria's Rules"
unification.25.b: "Too Simple. We Can Refine This."
unification.25.c: "Inspiring. Now It's Their Turn."

unification.26.t: "Rising to the Future"
unification.26.d: "Emerald Vale sits within Trading Post Vinovia, a historic, rustic building, built as the unofficial embassy of Aquileia in Equestria, a long time ago. It was before Vale's parents were even born, or her grandparents. Such an ancient place is the perfect place for her meeting, for it will gain a new meaning. Dignitaries and leaders from the various Foal Mountain tribes, at that moment, began flooding into the trading post's main hall, taking seats at a great round table of oak, brought from an office building in Canterlot, which Emerald sits at the head of. Once everyone is seated, Emerald gives a rather inoffensive smile, playing a game she has not played in a while, politics. 'Good day, valued leaders of the Foal Valley. My name is Emerald Vale, and I have come here, gathering you all here today for two reasons. The first reason is simple: I want to integrate your tribes into the Canterrealm. I want to learn from your tribes, and I want your tribes to learn from us, too.'\n\nMany of the leaders would look to each other with uncertainty and concern at the implications of integration, though Emerald does not even take a moment to address said concern, 'The second reason is far more blunt. While we can all form under one banner, under Canterrealm, we will never be safe until the threat to our south is dealt with. A threat that many of you know all too well, Red Eye.' Some of the representatives would begin to go pale, and others would whisper to each other, realizing the proposition Emerald makes, yet she is indifferent to their reactions, with her stamping her front hooves on the table for emphasis, 'You heard what I said, and whether you all like it or not, he will come for us, if we do not come for him. It's time to face the vision of the future, and claim it, together. For now, though, I believe it is time to exchange expertise, isn't it? I'll let you all come to terms, meet me outside when you're ready to move forward.' Emerald gives a pleasant, political, and natural smile, before getting off of the table and trotting off, leaving a dumbfounded council of foals, wannabe generalissimos and cultists, who all gaze at one another, thinking one thing."
unification.26.a: "This Is The Point Of No Return"

unification.27.t: "A Timely Unification"
unification.27.d: "The tribes of the great Foal Valley have received many new members; slaves, redeemed slavers, lost mercenaries needing a community. New tribes have been formed as well, and integrated into a far greater Canterrealm than Emerald could have ever expected. She has finally taken the mantle of what it means to be Equestrian, to have Equestria as it was known in her control, and now, it is time to make something new of it. Like their great leader Emerald, the Canterrealm will never forget the past, will tend to the present and will keep an eye to the future. Thus, the state shall officially reform into the Heartlands, a union of Canterlot ghouls, tribals, freed slaves, zebras and ex-raiders, to forge a new identity!\n\nEmerald rolls the newspaper up, storing it within her stable suit, giving a pleasant sigh, and going to trot down the newly paved Fillydelphian street. She regards Ghost Ward, the representative of the many Foal Valley tribes, and Protege, the organizer of occupied Fillydelphia, the former heir of Red Eye, too. Emerald smiles, and stops, regarding her newfound allies, 'Ghost, you are the most grounded and capable member of the great Green Valley tribe. You best understand the other tribes, their specialties, their cultures, their faiths, you know the tribal life, and I want you to preserve it, I want you to change it as you see fit.'\n\nShe then looks to Protege, flashing a grin, 'And you, Protege, you were already made for this, Red Eye made this place for you to rule.' She gives a somewhat solemn look, and stops in the middle of the street, looking at a billboard of Pinkie Pie, 'As for me, I think it's time to retire, don't you two think? Yet which one of you two will take my place?' As she looks to her two future choices, Emerald decides. . ."
unification.27.a: "Ghost Ward's chieftain, so the tribes shall inherit this land."
unification.27.b: "Protege is built to lead, who am I to deny destiny?"
unification.27.c: "Actually, I think I'm here to stay."

unification.28.t: "Might and Magnificence, Merged"
unification.28.d: "Grease Wheel folds up a newspaper, rolling his eyes. These Stable types have always been way too fond of excitement and exclamation points for their own good. Still, they match the old gang's chaotic energy pretty nicely. As he waits, a mare trots up to him, a former member of Stable Security, the name Trauma Taser proudly emblazoned on her badge. She smiles, carries two bags of delicious pastries, and gives one of her bags to Grease, 'There ya go Grease, it's chocolate, with sprinkles, just like you wanted!' Grease blushes a bit, and chuckles nervously, 'Heh, uh, thanks, Trauma. Let's get to work.' Both ponies would climb into one of the many appropriated Speedfreak cars used for law enforcement, and Grease takes the wheel, turning on the old hunk of junk, which sputters to life and begins to move.\n\n As they get on the move, the old radio crackles to life, 'Calling all Officers! Raider gangs, potentially Rain Riders, are harassing Outer Freeside! Repeat, all officers respond!' With that, Grease drives with the precision and speed learned through being a Speedfreak. As he turns down the highway, the pair spot a gang of four bikers on military motorcycles, Trauma yells out, 'By order of the Freeside Republic, pull over!' They respond with gunshots, and she responds in kind, with her service revolver. Grease speeds up, pulling a move learned from Aneurysm. \n\n Grease knocks two raiders off the road with a pit maneuver, though one of them manages to land a shot right to his shoulder. He hisses through his teeth, pain shooting up his side, but the pain is dulled by the freedom of the road. Trauma shoots down another biker, leaving only one, who speeds off towards the city proper. Grease tries to slam the gas but his leg doesn't respond. He looks, only to see more bullet holes riddling him, he didn't even feel them. Trauma shouts, but he can't hear as the world goes black.\n\nTrauma sits in the trauma center, covered in bandage scrapes, with a cast over one leg, broken in the crash. A doctor comes up to her, giving a small nod, with Trauma hopping to her hooves and galloping over to Grease's ward, the doctor trailing behind, 'Don't hug him too hard, we want him keeping that leg of his.' Within the bed is Grease, looking exhausted, but smiling as he sees Trauma, 'Sorry about crashing. Aneurysm would have strung me up for that. But you Stable ponies, heh. Fixed me right up.'\n\nShe grins softly, 'You're still a better driver than me. The others baked you a cake to feel better. Chocolate, with sprinkles. I might have already eaten half of it, but, uhh. You can have the rest.' She gives him a smaller grin, while he sighs, 'You're a raider at heart.'"
unification.28.a: "Preserved identities, exchanged habits."

unification.29.t: "The Neverending Feast"
unification.29.d: "Friendship City celebrates. Many were a bit suspicious when they were first forced under Arbu, hearing rumors about the seemingly kind ponies, baseless rumors about cannibalism, but then the festivals came. Meat roasts over open flames, more than enough for the thousands of ponies to gorge themselves on, juices dripping down into the fires. Similar festivals are held all over the city of Manehattan, put on by their new, benevolent overlords.\n\nA mare approaches one of the chefs, hard at work at cooking, 'Excuse me, you're from Arbu, right?' The chef looks over and smiles, nodding, 'You've got that right, ma'am! Want something to eat?' The mare shakes her head, 'No, thank you. Umm, my husband fought against you when you attacked us, and though I don't mind you all owning us, umm. . . do you maybe know where I could ask to find my husband's body? It's just, my filly could really use the closure.' The chef chuckles softly and smiles, taking a slice of meat, and offering it to the mare, 'I'm sorry, but you shouldn't worry about it, really. The past is the past. Eat, and enjoy the future, and your husband will be closer than you think.' The mare slowly nods, and takes the meat, trotting away with it, while the stallion smirks behind her.\n\nA colt and filly gallop through the streets, giggling and laughing happily as they do. The colt trips over a loose stone, a sharp corner of a shack cutting into his side, deeply, making him cry out in pain. The filly stops in front of him, wide-eyed, and calls for help. A chef lumbers over, kneeling down in front of the colt, 'Woah there, looks like you injured yourself. Where's your parents?' The colt looks away, holding his side, 'I-I'm an orphan, Sir.' The chef tsks and stands up, 'Well, that won't do, then. Come on, climb onto my back, I'll take you to a nearby clinic.'\n\nThe colt slowly climbs up, while the filly puffs up her chest, 'I'll come with you! I'm his friend, after all!' The chef looks down at her, and smiles more, 'What about your parents, little one?' She shakes her head, 'Dead.' He grins softly, 'Follow me, then. You and your friend will be looked over by our best.' He turns around, the injured colt mewling in pain, as he speaks with a wide smirk, 'There's going to be plenty of meat.'"
unification.29.a: "Don't Question The Source"

unification.30.t: "Father"
unification.30.d: "'Are you proud, father?' The Bonecrusher stands in front of a grave, looking down at it, 'Those Tenpony fucks have been fucked over. I've tied up those fucking leatherbacks by their wings and cut their throats. Gutterville's been crushed, though those fucks didn't exactly need any help to be fucked, Friendship City is gonna be called Bonecrush City too. I crushed the skulls of all those tin can Rangers, and I tore the throats out of the cowards in Arbu. I avenged you. Rebuilt the empire you lost.'\n\nThe Bonecrusher paces side to side, 'But it's not enough, is it? No, no, fuck no, it's never enough! Manehattan's nothing compared to what's down south, mmm, oh, I've seen the slaves who escaped from there. Red Eye? Fucking cunty name, isn't it? I'm going to crush that bastard and his smug 'better than you' face! His coat's red, I'm gonna make if fucking redder, yeah!' The Bonecrusher slams their hooves down, 'See, dad, I'm not like you! I'm not some fucking idiot who's going to sit back and let the bastards of the wasteland step against me! Fuck that! And fuck you for doing that!'\n\nThe Bonecrusher turns, and in one clean buck, demolishes the gravestone, leaping up and treading on the grave, 'Look what I've had to do to bring back what should have been my birthright! I'm The Bonecrusher, Manehattan was always fine, but you fucked up, you fucked up and you fucked me up! Look how fucking long this took! Bastard!' The Bonecrusher laughs, and smirks widely, 'I'm not gonna make the same mistake. My name's gonna be feared all across the wasteland. The Bonecrusher rises!'"
unification.30.a: "The Bonecrusher Rises!"

unification.31.t: "The Story"
unification.31.d: "Once upon a time, in the magical land of Equestria, a goddess lived. When the throne laid empty during the largest war of history, the goddess took the step none else would, and the crown weighed heavily. While the nobles and common citizens turned away from her, her most loyal cohort stepped up for her, the Thestrals. With her grace, the thestrals loyally took to the army and factories, loyal hooves forever producing for the Great War. But all their loyalty was not repaid. The noble and industrialists distracted the goddess, while the common pony turned against the Thestral, forcing them to live in the worst places. Yet still, the Thestral served their goddess loyally. In the end, it was all for naught, as the sky fell on the Last Day.\n\nThe Thestral banded together under into a community in Marelem, being protected from Sunriders and monsters both. Upon the irradiated skyscrapers, we found our home, and as the sky turned grey above, our grey coats allowed us travel without worry. Then came The Bandit King, a pony of unmatched strength and his demon spawn, who, as one, overwhelmed the communities of thestrals. When we were pushed back, we reached out to our neighbors, yet no response came. Tenpony, Arbu, even the City of Friendship, rejected the call to stand together. Thus, the Thestral languished under pony control once again.\n\nBut it was not to last. When the Bandit King fell back, the Thestrals claimed their place in the world once again. For too long we had trusted ponies to aid us, but ponies are fickle, betraying Thestral loyalty at every turn. Even the most noble creature has a breaking point. Thus, we marched, and Thestral steel crushed all resistance under hoof. For once in our history, our tale is not one of rejection and oppression. For once, we are on top. And for once, Manehattan is united under leather, not normal ponies."
unification.31.a: "Book End"

unification.32.t: "Anywhere But Here"
unification.32.d: "A Rain Rider sits in her car, engine rumbling slightly as she smokes a cigarette, looking into the eyes of a tired Gutterville guard. She breathes out the smoke, as the guard sits, drinking away his troubles, nothing separating them but an imaginary border. She narrows her eyes slightly, peering through the smoke, seeing a group of ponies approaching, wearing torn apart suits and dresses. The guard watches with distant eyes as the ponies cross the border, drinking even more. The Rain Rider climbs out of her car, smirking and leaning against it, motioning a pistol in her magic at the group, 'Sup? You'll wanna be paying up, toll for passing through my land. Fifty caps, each.'\n\nThe ponies look at the pistol for only a second, before a stallion with a broken apart horn appears, taking out a large bag of caps from his coat, 'Six hundred caps, the extra can be yours if you help us. Take us in your car. We have friends who are going to be coming soon, they have more money, they'll pay the same rate for transport away.' The mare narrows her eyes, breathing out a plume of smoke into the stallion's face, grinning with yellowed teeth, 'Tenpony fucks. Hey, I've got another suggestion, how about I shoot you between the eyes and take what you've got?'\n\nHe looks into her eyes, and places the bag of caps in front of her, 'Because it'll be more satisfying to gloat to living ponies than dead bodies, Rain Rider. I know how humorous this must be from your perspective.' She smirks, and floats up the bag, peering inside, 'You got that right, you Tenpony fucks never wanted to leave your fucked up tower, and now you're scampering to move fast. I got a feeling it ain't the love of the road what got you going, though.' He looks at her steadily, 'I would rather take my chances with hiring a raider for transport than I would with hungry manticores, alcoholic leaders, and half-dead soldiers.'\n\nShe smirks more, another cloud of smoke coming from her nostrils, her eyes glinting with draconic greed. She floats the caps to her side, 'Serves you selfrighteous fucks right. But you're right. I'm gonna have a lot of fun making fun of you and every other tight-assed refugee fleeing, and I'm gonna take all your caps while I'm at.' She spits the cigarette on the ground, crushing it under her hoof, 'Climb in. Where are you going?' He gives her a small, respectful nod, 'Anywhere but here.'"
unification.32.a: "Suffering Makes Strange Bedfellows"

unification.33.t: "Drinks for Everyone!"
unification.33.d: "Slitted eyes stare from a Fillydelphian alleyway, watching as the soldiers of Gutterville and the slaves of Fillydelphia celebrate together. Drink is plentiful, as slaves, kept from luxury for so long, drown themselves in whiskey and wine. A thestral mare watches, her sharp eyes looking at the liquid poison her fellows guzzle down. Darker than smog and more dirty than one of Chainlink's favorites, but its burn still finds its way down the esophagus of many. Her eyes turn, watching the weak collapse in the street, vomit mixed with blood spilling onto the streets, drowning on land, while celebrations continue all around.\n\nThe mare's ears flick and twitch as she turns her head, seeing a pony stumble into the alleyway across from her. A fellow slave collapses beside her, a young stallion grasping his stomach, groaning uncomfortably. He coughs up blood onto the cold stone, his throat closing up on the sheer amount. She takes a second, and then approaches him, using her leathery wings to pat his back, letting him get the rest out. But blood keeps coming, and he collapses onto the street, his eyes looking to her, desperate and afraid. She looks back, and whispers softly, 'Never take an offer from those who take over. Food from a conqueror is always venom.'\n\nHe coughs even harder, and then pukes, a dark mixture of black blood and booze flowing into a nearby grate, the stallion's body unable to move other than the motion of retching. She looks over him and closes her eyes, whispering, 'Merciful Luna, please, freedom is just a step away. . . do not take it away from one who is innocent.' Her wings would work to support the stallion, with him retching for minutes on end, until he stops. She opens her eyes, and sees him laying there, breathing softly, his eyes looking up at her. She swallows softly, and offers a thin smile, 'You have survived. Many will not be so lucky.'\n\nHe breathes in softly, and then out, breathing out softly, 'Pick. . .' She nods softly, 'New Moon.' The two sit quietly together, the sound of death and celebration surrounding them. She meets his eyes, and then looks away, to the Gutterville soldiers in the streets, 'Red Eye would kill us in more obvious ways. This is a symbol. Obey, or die.' She takes a minute, and then looks back at him, 'Rest, Pick. When you've recovered, we'll escape. Together.'"
unification.33.a: "What's Your Poison?"

