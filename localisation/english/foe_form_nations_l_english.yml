 ###Ideas###

 GOR_skybreaker_alliance:0 "Skybreaker Alliance"
 GOR_skybreaker_alliance_desc:0 "With Skybreaker's battle-mages integrated into our forces, their arcane expertise augments both our industry and our ability to project power across the Thunderway."

 HSC_myriads_truth:0 "The Truth of Myriad"
 HSC_myriads_truth_desc:0 "The revelation of Myriad Abundance as a mortal mare has shaken the faith, yet Leaf On The Wind's acceptance has transformed doubt into a deeper, more resilient devotion. The Cult marches forward with renewed purpose."

 GLY_wasteland_adaptation:0 "Wasteland Adaptation"
 GLY_wasteland_adaptation_desc:0 "Repurposing the industrial might of the conquered west, our engineers have learned to rebuild from ruins, converting scrapped equipment into new productive capacity."

 SCI_adaptive_wasteland_strategy:0 "Adaptive Wasteland Strategy"
 SCI_adaptive_wasteland_strategy_desc:0 "The Stable has learned to think like the wasteland itself: Fluid, improvised, relentless. Our soldiers adapt to any situation, our commanders innovate on the fly."

 SCI_refined_wasteland_tactics:0 "Refined Wasteland Tactics"
 SCI_refined_wasteland_tactics_desc:0 "The raiders showed us the basics; now we improve upon them. Canterlot's discipline applied to wasteland pragmatism creates a resilient fighting force drawn from every corner of our territory."

 SCI_lessons_from_raiders:0 "Lessons From The Raiders"
 SCI_lessons_from_raiders_desc:0 "We have taken the raiders' methods and made them our own. Our soldiers are merciless, fast, and terrifying... though the recklessness of this approach takes its toll."

 SCI_ghost_ward_guidance:0 "Ghost Ward's Guidance"
 SCI_ghost_ward_guidance_desc:0 "Ghost Ward, chieftain of the Great Green Valley tribe, brings the combined wisdom of the Foal Mountain peoples. Under their guidance, our core territories are a fortress, our people well-fed, and our industries humming."

 SCI_the_natural_choice:0 "The Natural Choice"
 SCI_the_natural_choice_desc:0 "Protege was built to rule. Red Eye spent years preparing him to administer a great nation, and now that skill serves the Heartlands. Our organization is the envy of the wasteland, though the political cost is steep."

 SCI_emerald_hegemony:0 "The Emerald Hegemony"
 SCI_emerald_hegemony_desc:0 "Emerald Vale stays. There is no successor, no heir, no handoff. The Heartlands are hers to guide, and under her steady hoof, the nation endures, although the demands of leadership weigh heavily on population growth."

 STA_freeside_spirit:0 "Freeside Spirit"
 STA_freeside_spirit_desc:0 "The Freeside Republic carries the energy of both the Stable and the Speedfreaks: Fast, innovative, and fiercely proud of what they have built together."

 GUT_new_hope:0 "New Hope"
 GUT_new_hope_desc:0 "Manehattan is clean. The gutters are clear, the manticores are gone, the spritebots are silent. For the first time in generations, the people of Gutterville look to the future with genuine hope."

