 # Air Force Command Spirit Names
 wasteland_close_support_spirit:0 "Close Air Support Protocols"
 veteran_wingponies_spirit:0 "Veteran Wingponies"
 unified_wing_command_spirit:0 "Unified Wing Command"
 ace_of_the_wastes_spirit:0 "Ace of the Wastes"
 swift_wings_doctrine_spirit:0 "Swift Wing Doctrine"
 cloud_sweep_doctrine_spirit:0 "Cloud Sweep Doctrine"
 precision_bombardment_spirit:0 "Precision Bombardment"
 balefire_strike_command_spirit:0 "Balefire Strike Command"
 direct_ground_support_command_spirit:0 "Direct Ground Support"
 vertibird_assault_corps_spirit:0 "Vertibuck Assault Corps"

 # Air Force Spirit Descriptions
 reclaimed_aircraft_spirit_desc:0 "Half the birds are held together with duct tape and prayers to long-dead engineers. The other half actually fly. We'll call it good enough."
 wasteland_ace_pilots_spirit_desc:0 "Some ponies just have a talent for keeping something in the air that never should have left the ground. We call it a gift. They call it Tuesday."
 hit_and_fade_air_spirit_desc:0 "In fast, out faster, and gone before the flak gunners find the range. Speed and agility are the only armor worth having. If they knew you were there, you already did something wrong."
 recovered_flight_doctrine_spirit_desc:0 "Some Stable pony spent two centuries reading every textbook in the archive. Turns out some of them were about aeronautics. The survivors are grateful."
 cloud_layer_intercept_spirit_desc:0 "The old weather teams knew every trick the sky could offer. Now those same tricks make enemy approach vectors a death trap. Even pegasi can get surprised from above the cloudline."
 balefire_ordnance_wing_spirit_desc:0 "If one balefire bomb ended the old world, imagine what a full payload can do to the new one. Don't think about it too hard. Neither do the crews."
 ground_strike_specialists_spirit_desc:0 "They dive so low the crew can read the supply sergeant's nametag before pulling up. That tends to get the point across."
 stable_tec_avionics_spirit_desc:0 "Remarkable what a functioning flight simulator and two centuries of untouched maintenance records can do for a pilot's confidence. Or so we're told by ponies who have never flown anything."

 # Air Force Command Spirit Descriptions
 wasteland_close_support_spirit_desc:0 "Just make sure the ground troops have marked their position before calling in the run. Last time we lost three ponies and a supply wagon. We're still arguing about whose fault that was."
 veteran_wingponies_spirit_desc:0 "When the ace goes down, somepony has to carry the knowledge forward. These veterans make sure it doesn't go down with them into the crater."
 unified_wing_command_spirit_desc:0 "One command, one radio frequency, one coherent plan of action. A revolutionary concept for a wasteland air force, and one that apparently needed to be written down."
 ace_of_the_wastes_spirit_desc:0 "They've shot down things that weren't supposed to fly in a world that wasn't supposed to survive. Whatever they're doing, the rest of us are taking notes."
 swift_wings_doctrine_spirit_desc:0 "The fastest wing controls the engagement. It chooses when to fight, when to break, and when to turn inside the enemy's arc. Momentum is the only armor that doesn't weigh anything, and these ponies carry more of it than most."
 cloud_sweep_doctrine_spirit_desc:0 "If your fighters own the sky, the ground forces have a considerably better day. That's the whole plan. Strip the enemy blind and let the boots below finish the rest."
 precision_bombardment_spirit_desc:0 "Dropping ordnance on the right building is harder than it looks, especially when most of the buildings already look like rubble from two hundred years of neglect."
 balefire_strike_command_spirit_desc:0 "The weapon that ended the old world can end a great many smaller things too. The question of whether it should is, mercifully, above the bomber crew's pay grade."
 direct_ground_support_command_spirit_desc:0 "The infantry loves you. The enemy's infantry does not. This is the correct arrangement. Maintain it."
 vertibird_assault_corps_spirit_desc:0 "Drop from the sky directly into the enemy's rear area before they've had a moment to breathe. The Enclave perfected this art in Equestria's dying days. We're just carrying the tradition forward."
