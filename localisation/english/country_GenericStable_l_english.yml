### Decisions ###
#################



#############
### Ideas ###
#############

GenStable_supply_bunker: "Found Supply Bunker"
GenStable_supply_bunker_desc: "We've happened across an abundance of supplies, which has been a boon for our ponies."

GENSTABLE_subterranean_builders_idea: "Perseverance"
GENSTABLE_subterranean_builders_idea_desc: "Out Stable is our home, and we are civilized ponies. Civilized ponies take their homes and change it, build it out and down and every which way, to make it larger, to make it a proper city. We will see our Stable become a great city, unmatched in the new world, one way or another."

GENSTABLE_hedonist_robotopia_idea: "Brilliance"
GENSTABLE_hedonist_robotopia_idea_desc: "With luxury given out to every citizen, many of our ponies have had time to become brilliant in their own chosen skills. Mechanists who otherwise would be too busy working in fields or kitchens are now working in workshops, day and night, making the tools of their own luxury. While our ponies are perhaps soft, and not willing to fight, they are brilliant to the last in every social manner."

GENSTABLE_paranoid_survivors_idea: "Vigilance"
GENSTABLE_paranoid_survivors_idea_desc: "When the monsters of the outside come to our Stable doors, when they try to knock it down and force their way in, we will be ready. Every mare, every stallion, every foal will have the basic training needed to protect their families, to protect their homes, from the horrors outside."

GENSTABLE_industry_massmarket_idea: "Consumer-Focused Industry"
GENSTABLE_industry_massmarket_idea_desc: "The civilian economy is at the forefront of production in our Stable now. Our civilian industry shall make us an industrial titan, who can then invest more into military later on. We will build something worth protecting, and we will use that to protect it."

GENSTABLE_industry_extraction_idea: "Resource-Focused Industry"
GENSTABLE_industry_extraction_idea_desc: "In order to make something, you need to have the materials to make it, you can't bake a cake without flour, after all. So our Stable will focus more on these foundational building-blocks, those materials with which useful things are made. The trade buying these raw materials will boost the rest of our economy, provided the wasteland stays stable enough."

GENSTABLE_industry_military_idea: "Military-Focused Industry"
GENSTABLE_industry_military_idea_desc: "The world is Tartarus nowadays, and one can't stay alive through money or material alone, not anymore. If we wish to have a country at all, we need to be willing to fight for it, to kill for it, to produce the very weapons that will protect it from the evil outside."

GENSTABLE_industry_robonomics_idea: "Automation-Focused Industry"
GENSTABLE_industry_robonomics_idea_desc: "We are already relying so much on our robotic servants, why not let them handle the factories as well? Their legs never tire, their morale never wavers and their mechanical eyes can catch impurities we'd never notice."

GENSTABLE_protectors_of_civilization_idea: "Protectors of Civilization"
GENSTABLE_protectors_of_civilization_idea_desc: "Stable-Tec is the home of the last true civilization to exist, us. Others have turned to savagery and violence, they would seek to destroy us, to destroy our home. We won't give them the chance, no, if they come, we will be ready. We will destroy any barbarians who knock on our gates."

GENSTABLE_lockstep_society_idea: "Political Lockstep"
GENSTABLE_lockstep_society_idea_desc: "All questions in the old ways of Stable-Tec have disappeared after a few minor reforms. Like always, our Stable dwellers will happily follow their Stable-Tec designated leadership, who will keep them safe, who will keep them in peace."

GENSTABLE_rebuilding_wastes_idea: "Rebuilding the Wastes"
GENSTABLE_rebuilding_wastes_idea_desc: "The old world died, and the current world sucks, so our Stable has looked beyond the now. We've looked to the tomorrow. To what's to come next. The future is just over the horizon, and we will be the first to find it. When the future comes, it will find our country ready and waiting."

GENSTABLE_isolationist_bastion_idea: "Isolationist Bastion"
GENSTABLE_isolationist_bastion_idea_desc: "The Wasteland is a scary and horrible place, it is no home to us Stable ponies, not really. We do not need any great swath of land, we do not need to be anything more than what we are. We'll keep our friends close, and our enemies at the business end of our rifles."

GENSTABLE_expansionist_nation_idea: "Expansionist Nation"
GENSTABLE_expansionist_nation_idea_desc: "There is no place greater than our country, and it would be selfish to keep it all to ourselves. Generosity is an Element of Harmony, so in the spirit of Generosity, we will spread our nation across the lands. Ponies might fight against us, but once they get a taste of Stable-Tec life, they'll never want to oppose us again."

GENSTABLE_superior_populous_idea: "Superior Populace"
GENSTABLE_superior_populous_idea_desc: "Our Stable is truly something special, it's something to which no wasteland nation can compare, no matter how hard they might try to copy us or appease us. Our nation is supreme, our people are superior, and it's time that the entire wasteland know this, it's time we demonstrate our supremacy."

GENSTABLE_technological_domain_idea: "Technological Domain"
GENSTABLE_technological_domain_idea_desc: "With great investment into our sciences and education, every facet of our society is growing all the more efficient. Bureaucrats, intelligent as can be, engineers encouraged to experiment, and well-read scientists prowl the land, fixing up everything they find."

GENSTABLE_rapid_advance_focus_idea: "Rapid Advance"
GENSTABLE_rapid_advance_focus_idea_desc: "The best defense is a great offense, and our Stable has chosen to focus our offensive maneuvers on vehicles. Uncommon in the wasteland by and large, vehicles and vehicle focused tactics will allow our Stable to outmaneuver and crush any who oppose us."

GENSTABLE_enduring_defense_focus_idea: "Enduring Defense"
GENSTABLE_enduring_defense_focus_idea_desc: "The ponies of the Stable are used to hiding behind metal, after all, it was hiding behind metal that saved our lives on the Last Day, long ago. We will keep alive the old ways of hiding behind a really heavy object in our military tactics."

GENSTABLE_superiority_of_skill_focus_idea: "Superiority of Skill"
GENSTABLE_superiority_of_skill_focus_idea_desc: "Stable-Tec Security Forces shall be Stable-Tec Quality, guaranteed! Focusing on tactics surrounding our beloved and highly skilled Security Forces will allow for warfare that will cost as few lives as possible. Useful for a Stable with a relatively low population."

GENSTABLE_trade_caravans_idea: "Trade Caravans"
GENSTABLE_trade_caravans_idea_desc: "Wastelanders come to the doors of our Stable every day, knocking and coming in to trade with us. Their caps, the currency they use, have funded our hiring of experts and the improvement of our economy. We'll just keep building more materials to trade with, and then use the profit from that trade to build even more materials."

GENSTABLE_supremacy_of_metal_idea: "Supremacy of Metal"
GENSTABLE_supremacy_of_metal_idea_desc: "Our Stable ponies are top of the line at producing top of the line robots, which will perform top of the line duties in our top of the line armed forces. Cheaper, with better performance, one could even say our robots are top of the line."



### Advisors ###



##############
### EVENTS ###
##############

generic_stable.1.t: "Built To Last"
generic_stable.1.d: "Stables weren't simply built to survive a Balefire blast, but to continue on until the surface was ready to be reclaimed by their dwellers. Built deep underground, every Stable would come standard with a food recycling system, systems to allow for sustainable agriculture, exceptional medical facilities, well-stocked Security, and all other manner of what's needed to survive underground. These are what every Stable was promised.\n\n But not every Stable is built the same, they were given different levels of development in different areas, allowing each Stable to develop its own speciality. Some Stables were home to large recycling machines, meant to recycle any material and make it mostly reusable, giving these making these Stables exceptionally sustainable. Others had excess rooms dedicated to small factories or workshops, where Stable ponies could make whatever they could use, be it building new Pip-Bucks, or even making materials to expand and upgrade the Stable as time went on. Many others were home to the best research facilities the world's ever known, labs stocked with mass surpluses, and staffed by only the smartest.\n\n Every Stable had some specialty. What was ours?"
generic_stable.1.a: "Exceptional Sustainability"
generic_stable.1.b: "Outsized Manufacturing"
generic_stable.1.c: "Top Of The Line Labs"

generic_stable.2.t: "The Founding Generation"
generic_stable.2.d: "No two ponies are the same, every pony has a different talent, a different view, a different way of doing things. Of course, every Stable thus has a different founding cadre, a group from whom all others descend, those who built the culture of the Stable. Of course, not every Stable discriminated on who came inside, many of them kept their doors open as long as they could, welcoming as many ponies as they could fit, usually giving the Stable a larger starting size.\n\n Yet two groups were the most popular to allow into the Stables in particular. Many veterans, those who fought for old Equestria, were offered passes and tickets into Stables. They'd come with their weapons and their willingness to fight, and with their experience, they would train their descendants, who would train their descendants, all the way to the modern day. Yet another popular choice were the social scientists, the managers, and the engineers. Those who were educated in the finest of universities and served with the finest of companies, especially Stable-Tec proper.\n\n When our doors opened on the Last Day, who made up the majority of our founding cadre?"
generic_stable.2.a: "Veterans of the Great War"
generic_stable.2.b: "Engineers and Executives"
generic_stable.2.c: "As Many As We Could Allow"

generic_stable.3.t: "What We Did"
generic_stable.3.d: "When the doors finally closed on the Last Day, everything was quiet. It was hard to believe for ponies, that their homes, their family, their friends, were all. . . gone. In a flash of green light, the world changed, and it almost didn't seem real to begin with. Ponies reported numbly to their living quarters, some acting like it was just another day. It took a week for them to finally realize that their world was gone, and now they would need to need to find a way forward. Chaos reigned for weeks, it was only natural, ponies coming to terms with the fact they'd never see the surface again. That all they lived for now was survival. It was unsustainable, un-pony, to live for survival alone.\n\n Some argued for direction, and those debates lasted a month at least. Some wanted to turn our Stable into a grand city, many ponies thought that there's nothing more unifying than expanding the Stable itself, making it an underground metropolis. Others argued to revive the luxury ponies had come to know, robotic servants doing the work while ponies relaxed, except for those jobs that needed to be done by pony hooves. A final group whispered of what horrors would come from the surface, what monsters, what horrors, and they called for every pony to be prepared for the day our Stable doors opened, to prepare for the horrors beyond.\n\n After a long debate, only one vision came out on top. But which is it that claimed our home?"
generic_stable.3.a: "An Underground Metropolis"
generic_stable.3.b: "The Lap Of Luxury"
generic_stable.3.c: "Preparation For The Worst"

generic_stable.4.t: "Course Of Our Industry"
generic_stable.4.d: "All across our chunk of Equestria, a slice of the old world appears, cities and factories, powered by Stable-Tec science and technology. We are already an industrial power in our own right, but we are new on the wasteland scene, and our generalized economy has not proven as great as it could be. Our destiny will come through specialization of our economy.\n\n As always, we could focus on the desires of our citizens, dwellers and non-dwellers alike, building a civilian industry second to none. By strengthening the civilian sector, we can then generate enough revenue to sustain a massive military-industrial complex. Of course, given our Stable-Tec brand recyclers and manufacturing, we could lean more into our recycling and manufacturing of materials. Our scavengers can dismantle something as simple as a scrap car and turn it into metal fit to build a home with, and we could use this material to fuel our trade and build higher. Of course, though, all the economy in the world is useless without a strong military to protect it. We could invest more into our military-industrial complex, creating heavy industry producing the highest quality armaments out there.\n\n The choice is up to us alone to make."
generic_stable.4.a: "Mass-Market Production"
generic_stable.4.b: "Extraction And Refining"
generic_stable.4.c: "Heavy Military Industries"
generic_stable.4.x: "Robots Are All We Need!"

generic_stable.5.t: "Focus Of Our Army"
generic_stable.5.d: "A generalist army is good, but in the wasteland, good isn't good enough, we must be great. To be great, one must specialize, to decide one thing will get more over the other, a single concept that we can build the rest of our army around. Already, of course, many in the Security Forces are arguing over the best course of action to take.\n\n A popular belief is the idea of lightning warfare, that by using vehicles that move faster than any pony can, we can outmaneuver, overrun, and destroy all enemy forces. While this would make our defensive lines harder to hold, the best defense is a good offense. Of course, though, we are Stable ponies, and we are known for one thing above all, sitting behind cover and surviving the unsurvivable. The best defense is a brilliant defense, one that can punish any enemy who comes our way with hailstorms of bullets and a sturdy defensive line. Finally, many argue that the common pony has no place in the frontlines, but only our Stable-Tec Security Forces do. With their training, their armor, and their skills, they can fight on forever without losing many lives.\n\n With opinions so split, it is a difficult decision to make. But in the end, we decided."
generic_stable.5.a: "Lightning Warfare"
generic_stable.5.b: "A Brilliant Defense"
generic_stable.5.c: "Special Security Forces"
generic_stable.5.x: "Just Let The Robots Fight"



