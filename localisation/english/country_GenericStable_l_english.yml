##################
### FOCUS TREE ###
##################

genstable_opening1: "The Stable"
genstable_opening1_desc: "When the Last Day approached, Stable-Tec promised a new home, underground. The Stable is our heart, the Stable is our home, the Stable is. . . Everything. But not every Stable was built the same, and as much as the dwellers shape the Stable, the Stable shapes the dwellers."

genstable_opening2: "The Dwellers"
genstable_opening2_desc: "Even if every Stable was built the same, which they weren't, the dwellers, the inhabitants, were all different. Every Stable had a different list of unique individuals who ducked and covered underground when Balefire fell on Equestria. Them, our founding generation, still have an effect seen today."

genstable_opening3: "The Purpose"
genstable_opening3_desc: "Two hundred years is a long time underground, when one can't count the days but by the hands of a clock, when time itself seems ethereal. Ponies would drive themselves crazy working with no vision in sight, as ponies are creatures of purpose above all. So, we gave them purpose."

genstable_building_down: "Building Down"
genstable_building_down_desc: "The Stable is home to strong manufacturing capabilities and abundant resources, with plenty of infrastructure to facilitate even more expansion of our facilities. Utilizing drills, explosives, and industrial wisdom, we will dig even deeper into the earth."

genstable_activate_reactors: "Activate Backup Reactors"
genstable_activate_reactors_desc: "The world outside has grown more. . . active, as of recent. The rumors we hear on the outsider's radio waves speak of conflict coming our way. While backup generators are only meant to be used should the primary ones fail, it's time that we turn them on anyway. We will be prepared for anything that comes."

genstable_expand_purification: "Expand Water Purification"
genstable_expand_purification_desc: "Every pony needs food, shelter, and above all, water. You can survive three weeks without food, three months without shelter, but only three days without water. The surface's water is far from pure on its own, so it's time that we make our Stable home to a flood of fresh, clean water."

genstable_craft_guns: "Craft New Guns"
genstable_craft_guns_desc: "We have plenty of unused space in the Stable, old rooms which are no longer occupied or used. Given the dangers on the surface, it's time we make use of this wasted space, and turn them to prepare for our defense. Our stockpiles aren't enough anymore."

genstable_consumer_manufacturing: "Dweller-Focused Manufacturing"
genstable_consumer_manufacturing_desc: "We have plenty of unused space in the Stable, old rooms which are no longer occupied or used. While the surface is dangerous, what's even more precious is the well-being of our own dwellers, of our citizens. We will convert these empty rooms into workshops, to produce goods for our dwellers."

genstable_repurpose_maintenance: "Repurpose Maintenance Wing"
genstable_repurpose_maintenance_desc: "Maintenance alone isn't enough for what we need, while it is important, we need not just to repair, but to make. We'll take the materials already there and change it from focusing on just repair to instead focusing more on research and production."

genstable_recycle_technology: "Recycle Wartime Technology"
genstable_recycle_technology_desc: "Our Stable is home to many leftovers of the old world, devices that have been left to collect dust due to simply not being useful enough anymore. It's time we crack these devices open, study how they work, and turn their components into more useful technology."

genstable_underground_chorapolis: "Underground Chorapolis"
genstable_underground_chorapolis_desc: "With the last touches on our new under-Stable expansions, our Stable is more of a center of industry than it ever has been. All around the Stable, ponies work in manufacturies, creating weapons and technology that are truly Stable-Tec Quality."

genstable_building_out: "Building Out"
genstable_building_out_desc: "The Stable is our home, but every bird has to leave their nest eventually. The surface is safe for our settlement, and our Security Forces have already claimed new land, filled with surface ponies. It's time for us to go forth, to learn from these strangers turned new neighbors."

genstable_settle_countryside: "Settle The Countryside"
genstable_settle_countryside_desc: "While the sun might be hidden behind clouds, many ponies have waited their entire lives to feel soil beneath their hooves, to touch grass, and to see trees. While the surface is, well, horrid compared to what the past looked like, it is still beautiful, and it is still ours, the common pony's."

genstable_seize_opportunities: "Seize Opportunities"
genstable_seize_opportunities_desc: "Some of our new wasteland neighbors have told us about a nearby pre-war ruin, which might have valuable supplies. While we don't know how exactly this will help us, we will send an expedition to find it, and hopefully, we will benefit greatly."

genstable_room_to_grow: "Room To Grow"
genstable_room_to_grow_desc: "The surface is wide open and underpopulated compared to the cramped and crowded Stable. Our factories no longer need to be as space efficient, allowing us to experiment more with different methods and techniques of production."

genstable_industrialize_surface: "Industrialize The Surface"
genstable_industrialize_surface_desc: "Much of the surface remains home to just farmland or small manufacturing, not the large scale factories we have built underground. Not to worry, though, the Stable is here to help, with Stable-Tec Quality and a Stable-Tec Smile!"

genstable_connect_realm: "Connect Our Realm"
genstable_connect_realm_desc: "One downside about the surface is how far apart everything is. One cannot simply take an elevator and reach wherever they want to. Actually, wait, if we build trains, that's basically an elevator wherever you want to go. Let's build some trains! Or something like that, maybe cars, or basic roads."

genstable_foundries_dot_land: "Founding Foundries"
genstable_foundries_dot_land_desc: "Our Stable-Tec brand recycling machines and manufacturing machines have served us well, and are well understood. The surface has a lot of useless material, unused. It's time we open up some foundries all around our new lands, taking the useless, and making it useful."

genstable_smokestacks_and_cities: "Smokestacks And Cities"
genstable_smokestacks_and_cities_desc: "On the surface, now, there's a small slice of home. Cramped cities, filled with factories, producing Stable-Tec Quality weaponry, civilian goods, and the like. However, we cannot generalize for too long more, we need to specialize our economy if we want to make it soar."

genstable_our_governance: "Our Governance"
genstable_our_governance_desc: "Our exposure to the outside, be it through radio signals, intruders, or trade, has sparked questions within our Stable if our way of doing things is proper. It has worked for two hundred years so far, but will it continue to work?"

genstable_empower_security: "Empower Security"
genstable_empower_security_desc: "The safety of our nation doesn't come from any broad speech or from complacency, it comes from action, from our protectors. Stable Security saw us through the Last Day, it protected us, kept order. The Overmare shall empower them above all else. It's time our protectors gain a little respect and control."

genstable_steady_as_she_goes: "Steady As She Goes"
genstable_steady_as_she_goes_desc: "For two hundred years we have survived, for two hundred we have prospered, and for two hundred more, we will continue. A steady hoof has kept us going as we have, why rock the boat? We stay behind our ways."

genstable_let_dwellers_choose: "Let Dwellers Choose"
genstable_let_dwellers_choose_desc: "Our future shouldn't be decided by armed security or by our current leader alone, it's time that we call a snap election and referendum. It is the Stable dwellers' future, they may choose the way we trot forward."

genstable_safeguard_way_of_life: "Safeguard Our Way Of Life"
genstable_safeguard_way_of_life_desc: "The Wastelanders are jealous of us Stable dwellers, they say we have it easy, they don't know our struggles. They come, maybe not now, but they will come for us eventually. When they knock on our doors, will you sit down and shrug? Or will you protect your home? Join Stable-Tec Security today, protect our home, protect our heart, protect our ways."

genstable_dont_rock_boat: "Don't Rock The Boat"
genstable_dont_rock_boat_desc: "A simple way to help our Stable administration would be a small expansion of the leadership, without fully playing into the hooves of any radicals and extremists. An industrialist and a sociologist will be invited as advisors to help guide our way forward."

genstable_into_wide_world: "Into The Wide Wasteland"
genstable_into_wide_world_desc: "We cannot simply sit back and watch the world pass by us anymore, we are on the precipice of great change. All around the wasteland, great ponies lead great nations to heights never before thought possible. We shall be there right alongside them, we will be recorded in the history books."

genstable_beacon_of_civilization: "Beacon Of Civilization"
genstable_beacon_of_civilization_desc: "Others across Equestria and beyond have turned to villainy of the highest order in their pursuit of survival. Cults killing colts, raiders who think they're saviors, insane techno-knights believing they are a force of the old world, the world is dark and cruel. We are all that remains of the old way. We are civilization."

genstable_undisputed_leadership: "Undisputed Leadership"
genstable_undisputed_leadership_desc: "Even the extremists who questioned our ways have quieted over time, calmed and assured by our Stable hoof. Our Stable will go along as it always has, and like always, ponies shall follow along, safe, and sound."

genstable_build_something_new: "Build Something New"
genstable_build_something_new_desc: "Old Equestria failed to save itself, Stable-Tec failed to save the vast majority of ponies, and the wasteland leaders have failed to do much of anything at all. These old ideologies are just that, old, outdated, obsolete. It's time we don't try to emulate the old anymore. It's time to make something brand new."

genstable_now_know_wastes: "Wasteland Knowledge"
genstable_now_know_wastes_desc: "The Wasteland, once a mysterious and unknown place, is now one that we know quite well. While we are not Wastelanders yet by any stretch of the imagination, we know their ways, we know their land, we know their peoples. And we shall know more and more, as time goes on."

genstable_preserve_paradise: "Preserve Paradise"
genstable_preserve_paradise_desc: "It is plain that we have built something beautiful already, a place where ponies are happy, safe, and prosperous. Every step we take outwards, every new province we integrate, is a chance for chaos, a chance for death and ruin. It's time to be content with our gains. It's time we make paradise."

genstable_proclaim_new_nation: "Proclaim New Nation"
genstable_proclaim_new_nation_desc: "We are greater than just our Stable, just our roots, just our past. We are something new in the world. The Stable will be the capital and every province shall be a new home, as we proclaim ourselves a new, proper, wasteland nation."

genstable_enslave_wastelanders: "Enslave Wastelanders"
genstable_enslave_wastelanders_desc: "The Wastelanders truly know hardship and strife, so how could they ever appreciate luxury and happiness like a Stable pony? They've spent their two centuries frothing at the mouths and fighting each other like rabid dogs. Fine. It's time then that we leash them, and show them a more civilized way."

genstable_cling_old_world: "Old World Blues"
genstable_cling_old_world_desc: "Old Equestria is a place of myth and legend in our tales, a place where every pony was happy. Where every pony could go home with a full belly and a massive herd of friends. We might not have the green grass and rainbows of the old world, but maybe we can try to build a small slice of the old in the new."

genstable_let_none_interfere: "Let None Interfere"
genstable_let_none_interfere_desc: "Our Stable is a paradise, second to none. Let the wasteland come and try to contest us, they will find nothing but the cold steel of our weapons pointed their way. We will live happy, and we will not allow any other power to bully us."

genstable_expand_our_borders: "Expand Our Borders"
genstable_expand_our_borders_desc: "Our new nation is unhappy with what we have now, and as every nation does, it is time for us to expand our borders, to include others within our greatness. Stable-Tec Quality will lead our way, and in the end, the ponies of the wasteland will thank us."

genstable_superior_in_every_way: "Superior In Every Way"
genstable_superior_in_every_way_desc: "We have studied the ways of the wasteland, and they have come up lacking. Their habits, their cultures, it is all so. . . Inferior to our way. Their mass armies of unwashed farmers think they can stand a chance against our Stable-Tec Security Force. We politely, and correctly, disagree."

genstable_secure_our_domain: "Secure Our Domain"
genstable_secure_our_domain_desc: "The only way to keep our slice of the old alive is through studying and practicing the ways of the old. We will make our research, our production, and our construction as effective as we can."

genstable_concerns_of_security: "Concerns of Security"
genstable_concerns_of_security_desc: "Our Security Forces are well armed, but inexperienced, no matter how well trained, none of us have seen an actual war. We will gather together the top of our Security Forces and listen to their potential concerns about future conflicts."

genstable_i_can_see_sky: "Hello Sky"
genstable_i_can_see_sky_desc: "The clouds form a complete cover in the sky, but for us Stable ponies, it's still a long, long way up until one reaches that cover. While some of us vomit or get sick from just looking up at the endless grey expanse, many others have proclaimed their desire to fly to it."

genstable_crack_open_armories: "Crack Open Armories"
genstable_crack_open_armories_desc: "We still have a few armories in the Stable which have gone untouched by the years, their materiel never needed by any Security member. These armories might have valuable supplies and information for our current situation, let's crack one open and look inside."

genstable_thats_alotta_water: "That's A Lot Of Water"
genstable_thats_alotta_water_desc: "The coast is vast, much more vast than any Stable pony can properly comprehend. When the largest body of water one is used to is a small swimming pool, well, such a big piece of water is disconcerting. Still, many wish to explore this endless expanse of water."

genstable_fly_like_pegasus: "Fly Like A Pegasus"
genstable_fly_like_pegasus_desc: "Not many Pegasi came into the Stable, but the few who are left have been picked as volunteers for our researchers. Pegasi are what the original air vehicles were based off of, after all, until cloudships became what was most common."

genstable_outfit_our_best: "Outfit Our Best"
genstable_outfit_our_best_desc: "Quality wins wars, quantity wins caskets, marking company returns on investment. Our place in the world will be fought for by only the best, our ever loyal, our ever qualified, Stable-Tec Security Forces."

genstable_swim_like_fish: "Swim Like Fish"
genstable_swim_like_fish_desc: "Fish are the ponies of the sea. . . well, no, actually, I suppose that's Seaponies according to the old history books, but fish are close enough. They're the birds of the sea. They swim in the water, we want to swim on top of the water. Anyway, we're going to be like fish, we'll be the ponies of the sea, by making better ships. We'll be Seaponies. Well, not literally."

genstable_stable_built_vehicles: "Stable-Built Vehicles"
genstable_stable_built_vehicles_desc: "While the Stable itself cannot handle vehicles for obvious reasons, the surface is much wider, and vehicles give us much room for outmaneuvering enemy forces. We luckily still have some old blueprints for some vehicles, let's figure out how to make them."

genstable_rapid_fire_guns: "Rapid Fire Guns"
genstable_rapid_fire_guns_desc: "If you want a good soldier, you don't want to give them the most accurate weapon in the world, since soldiers are hardly accurate at the best of times. Instead, you give them the thing that can send the most death in the same direction with as little effort as needed. Rapid fire guns will achieve this. We just need to stop our soldiers from calling our machine guns 'Dakka', it's uncouth."

genstable_time_marches_on: "Time Marches On"
genstable_time_marches_on_desc: "With our most basic reforms touching every corner of the army, the time has come to decide what our army will excel at. Will our Security Forces lead the way forward, will speed and vehicles, or will our defensive nature win out?"

genstable_matters_of_science: "Matters Of Science"
genstable_matters_of_science_desc: "Unlike many places in the wasteland, Stables have universal education, which every foal is required to get. Every pony in a Stable is literate, trained with basic scientific knowledge, and knows critical thinking. An investment into science will ensure our education stays top-notch, far above any wasteland power."

genstable_refit_maintenance_robots: "Refit Maintenance Robots"
genstable_refit_maintenance_robots_desc: "We have many robots dedicated to maintaining the Stable, but truly, this is a waste of their abilities. We will take some of our robots and replace their parts with parts meant for war and fighting, and in doing so, we will study them further, and learn how to reproduce them, how to make them better."

genstable_keep_dwellers_healthy: "Keep Dwellers Healthy"
genstable_keep_dwellers_healthy_desc: "A healthy society is a happy society. An ounce of prevention is worth a ton of a cure, so we need to ensure that we give every dweller a general standard of care and of health, so our clinics aren't overwhelmed, come any emergencies."

genstable_equestrian_military_robotics: "Equestrian Military Robotics"
genstable_equestrian_military_robotics_desc: "While we do not have blueprints or schematics for the robots used to fight the stripes long ago, we do have descriptions and depictions in our books. With our study of our own maintenance robots, we are able to turn these old words and drawings into living, not breathing, robots."

genstable_access_databanks: "Access Databanks"
genstable_access_databanks_desc: "There's a lot of data kept in the Stable which has, for lack of a better term, collected dust. While much of this data is deemed not truly useful to a lot of ponies, we don't know what might lead to a breakthrough in our sciences. We will create a team of archivists dedicated to going through these old databanks."

genstable_improve_farming: "Improve Farming"
genstable_improve_farming_desc: "Every pony needs to eat, this is a fact of life, and our current Stable-Tec farming instruments won't do well enough for a growing population. If we are to be prepared for the future, we need to ensure no famine and no starvation comes. We'll invest into the agricultural sciences."

genstable_200_years_data: "200 Years of Data"
genstable_200_years_data_desc: "The Stables were, in part, all designed as a social experiment, to study how ponies live and try to apply their learnings to the world after the Last Day. Our databanks have two hundred years of research that has been, frankly, overlooked. We'll hire some more archivists to go through this data, perhaps it'll reveal more about the pony condition."

genstable_support_security_effort: "Support Security Effort"
genstable_support_security_effort_desc: "Science and education are good, yes, but without a strong Security Force, we cannot be sure this information won't be forcibly taken away. We'll dedicate a few scientists to studying alongside our Security Forces. Together, they will be able to improve our equipment and training."

genstable_smartest_people_wasteland: "Brilliance Unleashed"
genstable_smartest_people_wasteland_desc: "'I weep not for the Trottenheimer who lived and died a renowned scientist, but for the five hundred Trottenheimers who languished and died in farms and mines, never given the tools to succeed.' Words from a wise pony of old Equestria, which we've taken to heart. In our Stable, now, no pony will go without the chance to prove their knowledge, their brilliance, to the world."

genstable_boring_survivalism: "Survival In A New World"
genstable_boring_survivalism_desc: "Radicalism will not lead our country to greatness, but neither will keeping the same way we are. The only way for our Stable to thrive is to be willing to change as time changes, to become a living, breathing country. A country that will survive."

genstable_maximum_recycling: "Unlimited...Recycling!"
genstable_maximum_recycling_desc: "Our Stable is home to the best recycling in the entire world, at least compared to the small slice of the world we've seen. It's time we give them unlimited power, so they can pump out more and more materials, with which we can build an ever-changing future."

genstable_reach_out_trade: "Stable Trade"
genstable_reach_out_trade_desc: "Let ponies come from all around the Wasteland to admire our little old Stable, let them give us trinkets, and we'll give them material in exchange. A wise pony once said that commerce will save the wasteland, well then, let Stable-Tec be commercialized once again, with us at the forefront!"



