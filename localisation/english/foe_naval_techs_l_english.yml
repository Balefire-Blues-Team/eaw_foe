 ###Naval Tech###

 
 
 ###Technologies###

foe_nautics_tech_1: "Fishing Boat"
ship_hull_foe_light_1_desc: "With a lack of modern machinery and suitable dockyards, many have been forced to use old wooden ships as the backbone of their navy. This old simplistic design has allowed various nations to produce them in large quantities. The speed of these ships varies depending on the quality of its sail and the strength of the wind. This allows them to play a multi purpose role, ranging from simple transports and gunboats, to the more ambitious Galleon Warships. Reliable as it might be, against any other more powerful warships, its survivability drops drastically."

foe_light_navy_hull_tech_2: "Yacht"
ship_hull_foe_light_2_desc: "Small, light and most importantly fast, it's a favorite for many traders, smugglers, and especially raiders. Because of its light design, it can easily be carried by a small group allowing them to move to different waterways with little effort. Using small motor engines, these boats have both the speed and maneuverability to outrun most heavily armored ships. It's these strengths that are its greatest weakness. With little to no armor, much less armament to defend itself, its use as an actual fighting ship is dangerous, but the denizens of the wasteland have made it work."
foe_light_navy_hull_tech_3: "Patrol Boat"
ship_hull_foe_light_3_desc: "Having the relative speed of a motor boat but with enough firepower to handle any small armored ship, the patrol boat serves that multi-role goal. Its purpose is to protect the nation's waters against raiders, smugglers and if need be, serve as a light assault ship. Slightly better armored, it is armed with multiple mounted weapons which can vary from Grenade Machine Guns to Rocket Launchers. With two motor engines, it still has the speed and maneuverability required to protect its waters."
foe_light_navy_hull_tech_4: "Frigate"
ship_hull_foe_light_4_desc: "The first real step into building a true fleet and becoming a major naval power on Equus, frigates are the backbone of any modern navy. Using old models found in naval scrap yards and surviving wrecks that survived the nuclear calamity, we can reverse-engineer blueprints. These ships serve as escorts and scouts becoming the eyes and ears of the navy."
foe_light_navy_hull_tech_5: "Destroyer"
ship_hull_foe_light_5_desc: "While playing a similar role to frigates, destroyers have far more firepower which makes them a staple in most fleets. Carrying an array of torpedoes and deck-guns, it has enough firepower to engage numerous ships including battlecruisers. However, their missile capability is what makes them so dangerous to any adversary, as it enables them to hit targets at long distance both on land and sea with the added bonus of potentially carrying balefire warheads."
heavy_navy_hull_tech_1: "Barge"
ship_hull_foe_heavy_1_desc: "Nicknamed “Barrack Ships”, these support ships serve a variety of roles ranging from transporting troops, supporting naval landings and providing overwhelming firepower. As the largest ships in a wasteland navy they often serve as Flagships and fleet anchors. Their heavy armor and broad hull design makes them significantly slower than smaller hulls."
heavy_navy_hull_tech_2: "Battle Tanker"
ship_hull_foe_heavy_2_desc: "Battle Tankers provide support for any naval invasions with a variation of indirect weapons such as Cannons, mortars, and rockets. They can also serve the role as merchant raiding vessels, conducting convoy raiding across the sea by disguising themselves as any regular merchant ship. This gives them the element of surprise allowing them to approach enemy vessels and inflict heavy damage upon them."
heavy_navy_hull_tech_3: "Battlecruiser"
ship_hull_foe_heavy_3_desc: "This Behemoth of a ship is the pride of any fleet, a retrofitted and rearmed battlecruiser of Equestria’s past, this ship is a terror on the ocean and has the weaponry to back that up. Battleships sport howitzer guns, an array of numerous Missile defense systems with the latest of AI technology, and late war models even host a massive energy based railcannon that can easily penetrate the thickest of armor. Only the best and the most elite are given the honor of serving on this legendary vessel."
foe_recon_plane_launcher_tech: "Recon Plane Launcher"
foe_recon_plane_launcher_tech_desc: ""
carrier_hull_tech_1: "Cargo-Carrier"
carrier_foe_equipment_1_desc: "Used once to transport large amounts of cargo from one country to another via sea routes. This ship acts like a miniature fortress, giving it the ability to transport and launch planes as well as serve as a supply dockyard. It can also be used as a command vessel that can maintain standoff distance thanks to its planes, allowing the vessel to focus much of its time on organizing and coordinating with the fleet."
carrier_hull_tech_2: "Aircraft Carrier"
carrier_foe_equipment_2_desc: "Using the hulls of late war warships, this design sacrifices armor and firepower in exchange for providing air support for the navy. Able to carry a large assortment of fighters, bombers and flying personnel, it allows it to fill multiple roles ranging from anti-ship to close air support. While these ships went out of favor in the war due to the rise of Cloudships, they will be invaluable for any Wasteland navy."
naval_weapons_module_lmg_tech: "Mounted LMGs"
naval_weapons_module_lmg_tech_desc: "Mounted light machine guns provide reliable close-range fire against exposed crews and lightly armored targets."
naval_weapons_module_hmg_tech: "Heavy Machine Gun Nests"
naval_weapons_module_hmg_tech_desc: "Protected heavy machine gun nests deliver sustained fire against small craft and low-flying aircraft."
naval_weapons_module_deckgun_tech: "Deck-Guns"
naval_weapons_module_deckgun_tech_desc: "Deck-mounted cannons give vessels the firepower to engage armored targets at range."
naval_weapons_module_mpws_tech: "Multi-Purpose Weapons Systems"
naval_weapons_module_mpws_tech_desc: "Versatile weapon mounts can rapidly switch between surface, aerial, and coastal targets."
naval_weapons_module_cwis_tech: "Automated CWIS"
naval_weapons_module_cwis_tech_desc: "Automated close-in weapon systems track and destroy incoming aircraft, missiles, and other threats."
naval_weapons_module_pdw_tech: "Networked Laser Turrets"
naval_weapons_module_pdw_tech_desc: "Linked laser turrets coordinate their fire to intercept fast-moving threats with exceptional precision."
naval_weapons_module_catapult_tech: "Grenade Catapult"
naval_weapons_module_catapult_tech_desc: "A simple mechanical launcher hurls explosive charges onto nearby vessels and fortified shores."
naval_weapons_module_centrecanon_tech: "Centre-Line Cannons"
naval_weapons_module_centrecanon_tech_desc: "Large cannons mounted along the vessel's center line offer powerful fire without compromising stability."
naval_weapons_module_dumbrocket_tech: "Dumbfire Rockets"
naval_weapons_module_dumbrocket_tech_desc: "Unguided rockets trade accuracy for cheap, devastating volleys against large or clustered targets."
naval_weapons_module_wiremissile_tech: "Wire-Guided Missiles"
naval_weapons_module_wiremissile_tech_desc: "Operator-guided missiles use a trailing control wire to strike targets with improved accuracy."
naval_weapons_module_aimissile_tech: "Anti-Ship Cruise Missiles"
naval_weapons_module_aimissile_tech_desc: "Long-range guided missiles skim above the water before delivering heavy warheads into enemy vessels."
naval_weapons_module_multibarrel_tech: "Multi-Barrel Turrets"
naval_weapons_module_multibarrel_tech_desc: "Multi-barrel turrets unleash dense volleys while maintaining fire as individual barrels reload or cool."
naval_weapons_module_artillery_tech: "Naval Artillery"
naval_weapons_module_artillery_tech_desc: "Heavy naval guns bombard distant ships and shore positions with high-caliber shells."
naval_weapons_module_lasers_tech: "Barrage Lasers"
naval_weapons_module_lasers_tech_desc: "Rapid-firing laser arrays saturate an area with concentrated beams of destructive energy."
naval_weapons_module_plasma_tech: "Plasma Cannons"
naval_weapons_module_plasma_tech_desc: "Plasma cannons launch superheated projectiles capable of burning through the heaviest armor."
foe_light_navy_hull_tech_3_light_armor: "Lightweight Hull Construction"
foe_light_navy_hull_tech_3_light_armor_desc: "Advanced materials reduce hull weight without sacrificing structural integrity, improving speed and agility."
foe_light_navy_hull_tech_5_stealth_armor: "Radar-Deflecting Armor"
foe_light_navy_hull_tech_5_stealth_armor_desc: "Angled armor and radar-absorbent materials reduce the vessel's signature and make it harder to detect."
foe_nautics_tech_2: "Reinforced Hulls"
foe_nautics_tech_2_desc: "The outer hull is reinforced with an internal structural framework of steel beams, longitudinal and transverse framing, and additional layers of plating."
foe_naval_invasion_tech_1: "Raiding Boats"
foe_naval_invasion_tech_1_desc: "Small, fast boats carry raiding parties ashore before defenders can organize an effective response."
foe_naval_invasion_tech_2: "Coordinated Landings"
foe_naval_invasion_tech_2_desc: "Careful planning synchronizes landing waves, ensuring troops and supplies reach the shore in good order."
foe_naval_invasion_tech_3: "Specialized Landing Ships"
foe_naval_invasion_tech_3_desc: "Purpose-built landing ships deliver soldiers, vehicles, and heavy equipment directly onto hostile shores."
foe_naval_invasion_tech_4: "Naval Artillery Support"
foe_naval_invasion_tech_4_desc: "Warships bombard coastal defenses ahead of an assault, clearing the way for troops moving inland."
foe_naval_invasion_tech_5: "Naval Shock Troops"
foe_naval_invasion_tech_5_desc: "Elite assault troops storm fortified beaches and seize critical positions during the opening hours of an invasion."
foe_torpedo_tech_1: "Torpedoes"
foe_torpedo_tech_1_desc: "These self-propelled underwater explosive weapons were once the terror of merchant shipping. While we are unable to produce oceangoing submarines, we can still replicate part of their terryfing firepower.\nSome claim the Zebras even used balefire warheads on some of their torpedos."
foe_extra_engine_tech: "Improved Engines"
foe_extra_engine_tech_desc: "Improvement to the central drive-shafts have increased the amount of low-end torque our engines can output. Meanwhile, improved materials have strenghtened heavy-load endurance and proven to be exceptionally corrosion resistant."
foe_heavy_navy_hull_tech_3: "Battlecruiser"
foe_heavy_navy_hull_tech_3_desc: "Immense belts of reinforced armour allow capital ships to withstand sustained heavy bombardment."
foe_missile_destroyer_hull_tech: "Zebra Missile Destroyer"
foe_missile_destroyer_hull_tech_desc: "Unlike a regular destroyer, this ship is the pinnacle of Zebrican technology with its use of an advanced cloaking system. Building on the Stealth Pip and Zebra Stealth Talisman, this arcane system allows the ship to become nearly invisible for a time allowing them to scout enemy targets with ease or to get close enough to use its dangerous assortment of torpedoes and missiles."
foe_railguns_module_tech: "Naval Railguns"
foe_railguns_module_tech_desc: "Electromagnetic rails accelerate solid projectiles to tremendous speeds, delivering devastating long-range impacts."
foe_megaspell_module_tech: "Tactical Megaspells"
foe_megaspell_module_tech_desc: "With the advent of Zebrican use of Balefire torpedoes against equestrian vessels, Princess Luna authorized the integration of tactical megaspell chambers into the newest ships of the fleet. With power supplied by the ship's reactor, and spells by onboard combat mages, a tactical megaspell might not melt entire cities but it will easily flash-boil the crew of an enemy ship, and part of the ocean around it."
foe_shielded_hull_module_tech: "Hull Integrated Shield Talismans"
foe_shielded_hull_module_tech_desc: "Powerful wards reinforce massive armour belts, protecting ships from conventional weapons and hostile magic."
foe_pocket_bb_hull_tech: "Pocket Battleship"
foe_heavy_navy_hull_tech_3_1: "Dreadnaught Emulation"
foe_heavy_navy_hull_tech_3_1_desc: "WIP"

 
 
