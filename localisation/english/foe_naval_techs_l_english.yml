light_ship_motor_module: "Electric Motor"
light_ship_motor_module_desc: "Compact electric motors provide light vessels with quiet, reliable propulsion."
light_ship_armour_basic_module: "Steel Armour"
light_ship_armour_basic_module_desc: "Steel plating protects the vessel's vital compartments from small-arms fire and shell fragments."
light_ship_armour_light_module: "Lightweight Armour"
light_ship_armour_light_module_desc: "Advanced lightweight plating offers dependable protection while preserving speed and maneuverability."
light_ship_pulsejet_module: "Waterjet"
light_ship_pulsejet_module_desc: "Powerful waterjets propel the vessel at high speed and allow it to turn with exceptional agility."
light_ship_magic_prop_module: "Aquakinetic Propulsion"
light_ship_magic_prop_module_desc: "Enchanted machinery bends the surrounding water, driving the vessel forward without conventional propellers."
light_ship_armour_special_module: "Ceramo-Composite Armour"
light_ship_armour_special_module_desc: "Layered ceramic and composite plates resist heavy impacts while remaining lighter than conventional armour."
ship_torpedo_module: "Torpedo Tube"
ship_torpedo_module_desc: "A submerged launch tube fires self-propelled explosives capable of striking below an enemy vessel's armour."
heavy_ship_motor_module: "Freighter Engines"
heavy_ship_motor_module_desc: "Rugged commercial engines provide the immense torque needed to move heavy warships."
heavy_ship_armour_basic_module: "Layered Steel Armour"
heavy_ship_armour_basic_module_desc: "Multiple layers of steel plating absorb heavy impacts and protect the vessel's critical systems."
heavy_ship_armour_uparmor_module: "Alternate-Layer Armour"
heavy_ship_armour_uparmor_module_desc: "Alternating layers of hard and flexible materials disperse impacts before they can penetrate the hull."
heavy_ship_magic_prop_module: "Tsunami-class Engine"
heavy_ship_magic_prop_module_desc: "This colossal enchanted engine harnesses the force of the sea to propel even the heaviest vessels."
heavy_ship_armour_titaium_module: "Titanium-Alloy Armour"
heavy_ship_armour_titaium_module_desc: "Titanium-alloy plating provides superior protection at a fraction of the weight of steel."
heavy_ship_armour_dreadnaught_module: "Dreadnought Armour"
heavy_ship_armour_dreadnaught_module_desc: "Immense belts of reinforced armour allow capital ships to withstand sustained heavy bombardment."
ship_recon_module: "Recon-Plane Launcher"
ship_recon_module_desc: "A compact launch system deploys reconnaissance aircraft to locate distant fleets and coastal positions."
ship_carrier_module: "Carrier Airstrip"
ship_carrier_module_desc: "A reinforced flight deck allows combat aircraft to launch from and return to the vessel."
ship_lmg_module: "Light Machine Gun"
ship_lmg_module_desc: "A light machine gun provides rapid close-range fire against exposed crews and small boats."
ship_hmg_module: "Mounted HMG"
ship_hmg_module_desc: "A mounted heavy machine gun delivers sustained fire against small craft and low-flying aircraft."
ship_deckgun_module: "Deckgun"
ship_deckgun_module_desc: "A deck-mounted cannon engages armoured vessels and coastal targets at moderate range."
ship_mpws_module: "Multi-Purpose-Weapon-System"
ship_mpws_module_desc: "This versatile weapon mount can rapidly engage surface, aerial, and coastal targets."
ship_cwis_module: "Automated CWIS"
ship_cwis_module_desc: "An automated close-in weapon system tracks and destroys missiles, aircraft, and other approaching threats."
ship_pdw_module: "Laser PDW Network"
ship_pdw_module_desc: "Networked laser turrets coordinate precise bursts of fire against fast-moving threats."
ship_catapult_module: "Grenade Catapult"
ship_catapult_module_desc: "A mechanical launcher hurls explosive charges onto nearby vessels and fortified shores."
ship_clc_module: "Centre Line Canon"
ship_clc_module_desc: "A large centre-line cannon delivers powerful fire while distributing its recoil evenly across the hull."
ship_rocket_module: "Rocket Pod"
ship_rocket_module_desc: "A cluster of launch tubes saturates large or grouped targets with unguided rockets."
ship_missile_module: "Missile Battery"
ship_missile_module_desc: "A battery of guided missiles strikes enemy vessels with accuracy from beyond gun range."
ship_cruise_module: "Cruise-Missile Bay"
ship_cruise_module_desc: "An enclosed launch bay carries long-range cruise missiles designed to destroy ships and strategic targets."
ship_multibarrel_module: "3-Barrel Turret"
ship_multibarrel_module_desc: "Three heavy barrels fire in sequence, maintaining a relentless barrage while limiting heat buildup."
ship_arty_module: "Shipboard Artillery Battery"
ship_arty_module_desc: "A battery of heavy guns bombards distant vessels and shore positions with high-caliber shells."
ship_lasers_module: "Barrage Laser Turret"
ship_lasers_module_desc: "A rapid-firing laser turret sweeps the target area with a barrage of concentrated energy."
ship_plasma_module: "Plasma Cannon Turret"
ship_plasma_module_desc: "This reinforced turret launches superheated plasma capable of burning through the heaviest armour."
ship_railgun_module: "Railgun Turret"
ship_railgun_module_desc: "Electromagnetic rails accelerate solid projectiles to tremendous speeds, delivering devastating long-range impacts."
ship_megaspell_module: "Tactical Megaspell Chamber"
ship_megaspell_module_desc: "A shielded ritual chamber focuses immense magical power into battlefield-altering spells."
light_ship_armour_talisman_module: "Magically Shielded Escort Armour"
light_ship_armour_talisman_module_desc: "Protective talismans woven into lightweight plating shield escort vessels from physical and magical attacks."
heavy_ship_armour_talisman_module: "Magically Shielded Capital Armour"
heavy_ship_armour_talisman_module_desc: "Powerful wards reinforce massive armour belts, protecting capital ships from conventional weapons and hostile magic."
ship_hull_foe_pocket_heavy: "Battleship"
ship_hull_foe_pocket_heavy_desc: "A heavily armoured capital ship built to dominate the seas with powerful guns and exceptional endurance."

 
