redstalker.1.t:0 "Dawn of the New World"
redstalker.1.d:0 "The Sun rises in the distance, shining down upon at least a hundred raiders, occupying Fort Soarin. The thrum of music fills the air, the beat of drums, the strings of guitars, the cacophony of overeager vocals singing their damn hearts out. Chems and drinks are shared between the thrumming masses, raiders from all across the north sharing in an orgy of ecstasy and celebration for their new home.\n\n But not all partake in the celebrations. A stallion stands above it all, on a large perch, looking out into the city beyond the Fort. Philosopher-Raider Punt keeps a small scowl on his face, a cold wind blowing past him, ruffling his long coat, and carrying with it the sounds of revelry below. He isn't alone for long, as a door into the Fort proper opens behind him, a mare stepping out, grinning, 'Hey, Punt, the fuck are you doing up here? The gang wants t'see you!' He narrows his eyes, looking south, to the Administration Tower, speaking softly, 'They'll have to suffice with seeing you instead, Lewd Tenant. They carry not the responsibility of leadership vested in me, nor the grand vision I hold for the future. Let them drink their brain cells away, let them rot like feted carcasses, if it means they shall fight superior tomorrow. Today is no day for celebration. It is a cold day, a black day, for our enemies have made themselves clear. We shan't tarry in destroying them, we need merely to gather our strength.'\n\n Lewd tilts her head and blinks, 'Uhh. Right. Sorry, Punt, I ain't really understanding, why are you, uhh, you know, not happy? Shit's rocking right now.' He snorts softly, turning to look at her with one eye, his form outlined against the city behind him, 'Verily, for one battle has been won, let me cast myself into vice and forget the next step ahead. Our war is far from won, Lewd. It is not enough, this small chunk of land we have liberated from the chilling grasp of the old world. Look out and see, it is not enough! The ancient enemy gathers on our borders, stripes set to seize the city that is ours, socialists following a zombie of an ideology, a machine chasing ghosts! Why revel and indulge when our fight has only just begun!?' He snorts, 'Leave me, Lewd. Raise the spirits of the troops. I have a future to plan.' She blinks at him, and then turns around, and leaves."
redstalker.1.a:0 "Not Enough"

redstalker.2.t:0 "Collecting Debts"
redstalker.2.d:0 "Glasses fill with vodka, as Punt sits across from another stallion, a raider of blue fur and slick black mane, grinning and admiring the mare which pours the vodka, 'Damn, Punt, you've got yourself a damn nice place going on here! Shit ton of loot here, you're gonna be a rich bastard, I tell you what.' Punt waves a hoof at the vodka mare, sending her away, 'I hold no desire for richness in material wealth, my friend, merely in the completion of the renewal the Last Day has given us. The Konzan Raiders have been exemplars of the new world since I last provided aid to you. I remember quite well, how we chased off a group of so-called heroes, crusaders for the dead ways, when they were nary a moment from killing your boss. We did not ask much in payment then, for your gang truly needed the resources to build up.'\n\n The other stallion smirks, 'But now you do want to make us pay, I get it, I get it. Smart fuck you are, Punt, not many bosses would wait to ask for shit, but damn if it didn't help us out.' Punt nods sharply, 'Verily, if I were a boss, that would be an adequate observation, yet I make a point of not calling myself a boss. I am the Philosopher-Raider, a title I have proven time and time again of deserving. Do not mistake me as some fool, my friend. The city of Princessyn awaits liberation from the decadence and death of the old world, my forces are great, but we can be greater. Konzan has resources, and they have an outstanding debt to me. Do not lowball me, do not make me a fool, grant me an offer proper to what I have provided for you in the past.'\n\n The stallion smirks and nods, 'Heh, hey, boss likes you, Punt, and he might want a cut of the action in this place. Yeah, I've got a fair offer for you. We got a lot of raiders we could send your way, bolster up your gangs and put more bodies on the front. Of course, though, we got something else on offer. A group of scholars we captured on a recent raid, which we can provide to you. The choice's yours.'"
redstalker.2.a:0 "New Raiders"
redstalker.2.b:0 "New Scholars"

redstalker.3.t:0 "Legacy of a dead nation"
redstalker.3.d:0 "Punt trots through the Administration Tower, as raiders clear every single room. Lewd Tenant trots next to him, grinning, 'We've found a lot of good shit so far, Punt, but I'm sure there's still a whole lot here which is hidden. It'll take us a bit to find everything. But we've found weapons, medicine, robots, even some food. Funnily enough, there was a room with love kept in it, Vamp's gonna be eating well for a while.' Punt nods, his long coat brushing away centuries of dust on the floor, 'Useful, but that is not why we are truly here, Lewd Tenant.'\n\n As he trots up floor after floor, he would eventually come to the floor right below the top. A raider would approach him, grinning and giving a salute, 'Punt! I was lookin' for ya! We found a lotta good shit according to the eggheads, lotsa books'n'shit, plus a whole lot of what they're callin' art. Looks like them propaganda posters but better quality, they even got one with ol' moon mare's flank-' Punt raises a hoof, 'Burn it all. If it does not aid our research or our efforts, then it is useless to us. We will not obsess over the ghosts of the old world. It would behoove you to keep that in mind.' The raider blinks, and then looks back, 'Uhh, right, sorry, Punt, just, y'know, wanted to keep you tabbed up on what we're destroying. Uhh. There's also some Wingboner Magazines from the old world there, is that useful?' Punt glares at the stallion, who gulps nervously, 'R-right, I thought not, umm, yeah. We'll. . . we'll burn those too.' Punt trots past him, 'See to it that you will. Do not be attracted to the dead, raider. It is unbecoming.'\n\n His trotting comes to a stop at the top floor, with Punt emerging to a massive series of machines. Lewd Tenant grins from beside him, 'The remnants of the old clanker who was running this place before. I wanted to give you the pleasure of deciding what happens to it, Punt.' He nods, and trots forward, until he reaches the middle of the room. A mass of wires, tangled together in a knot tighter than any the world has ever seen, connected to the dozens of machines all around. He looks down at it for a second, before speaking, 'Whosoever shall undo this knot shall be the ruler of all of Princessyn.' He lifts up the mass of wires with one of his hooves, glaring at them. In one smooth motion, he draws his knife from the collar of his coat, and cuts clean through the wires, killing the AI once in control of Princessyn. He throws the wires down, 'And thus, I have undone them.'"
redstalker.3.a:0 "Princessyn Shall Be Mine"

redstalker.4.t:0 "New triumphs over Old"
redstalker.4.d:0 "Punt stands atop the old Administration Tower, looking out across the city of Princessyn, as celebrations dot the landscape. Music is played through the streets, a mixture of heavy raider rock, the jazz of the old Army ghouls, Zebrican strings and woodwinds, the tempo of old Severyanan folk music, with the amplification of Disciple created speakers. The old has been forgotten in the music, the barriers between factions and ideologies destroyed, and made into one. Slaves trot the streets, hearts beating with love and their heads filled with obsession to their mistress, serving all those who they can find.\n\n Lewd Tenant, mistress of the slaves, speaks from behind Punt, 'You know, you've got a nickname now. The Obliterator.' He turns to face her, a small smile on his face. She offers him some vodka, carrying one for herself. He takes it, 'An apt description, for I have utterly destroyed the memory of the old within this city. But I did not do it alone, Lewd Tenant. What do they call you, other than mistress?' She grins softly, tilting her head, 'They're calling me The Black Widow. Pretty fucking badass name, if I do say so myself. And yeah, I did save your ass, multiple times. But you still did a good job, Punt.' He looks into her eyes, 'We did a good job, Lewd. Yet our job is not done yet. There still remains much to be freed from the rot of the past.'\n\n She smirks at him, 'Maybe. But the new world has a hoofhold like never before, because of us. I've been experimenting recently on poisoning bullets, I think I've come up with a new formula. If our bullets hit an enemy, then they'll become utterly obsessed with me, and betray their own army. Just one shot can disrupt enemy defenses, and any survivors who have the effect on them, well, they'll join the army, and die for me. We have a self-replicating army, Punt, in a way. It's a lot of power I have over them.' He looks at her, 'And I would have it no other way, Lewd. This country belongs not just to me, but to you as well. I am. . . satisfied.'\n\n Punt and Lewd Tenant look at each other, as he raises his vodka, 'To the new world.' Lewd grins, tapping her glass against his own, 'To the destruction of the old.' The two down their drinks, together."
redstalker.4.a:0 "And To What Comes Next "

