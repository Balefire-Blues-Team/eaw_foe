RST_eternal_war_cat_desc:0 "War is the law of the Wasteland.\nIn its bloodshed we gain glory, in its suffering we are forged into stronger, better creatures. To live without war is to live in weakness and ignorance.\n\n§RSo long as the rewards of war come due, we will prevail!§!\n"
