##################
### FOCUS TREE ###
##################

RST_arrival:0 "The Arrival"
RST_arrival_desc:0 "Ain't no place that's more old world than this Princessyn rat-den. Buildings left undamaged, buildings left unraided, 'bout time that some ponies reminded this city that the war happened."

RST_call_to_adventure:0 "Call to Adventure"
RST_call_to_adventure_desc:0 "Lotsa ponies in the wastes live boring lives, with boring farms, and boring wives, or husbands. We offer excitement, though, and loot, tons of loot, more than ya little pony brain could imagine. Join an' get some."

RST_looting_the_armory:0 "Looting the Armory"
RST_looting_the_armory_desc:0 "Lotsa nice shit is kept locked away in this city. We'll crack open those locks and take what's inside for ourselves."

RST_absorb_local_gangs:0 "Absorb local Gangs"
RST_absorb_local_gangs_desc:0 "We ain't the only Raider gang what moved into Princessyn, we got others here, small in number, but big in Raider spirit. We'll offa for them to join us, and get a piece of the loot."

RST_favor_from_konzan:0 "A favour from Konzan"
RST_favor_from_konzan_desc:0 "Long ago, Punt helped Zenit Konzan take Kosnolota from the Sladkiy Collective, and Konzan's owed us ever since. 'Bout time we go a-knocking for a repayment."

RST_mallowtown_deal:0 "The Mallowtown-Deal"
RST_mallowtown_deal_desc:0 "Mallowtown up north's a mining place, what don't have a lot of money. We'll ask them real nice-like to give us some big explosives, in return for a small amount of loot we've found so far."

RST_kicking_off:0 "Kicking things off"
RST_kicking_off_desc:0 "Two remnants of the old world are still around, a bunch of Stripes who think they're still fighting the Great War, and an insane clanker that thinks the same. Time we remind them the war ended, and we, ponies of the wasteland, were the only winners."

RST_clear_streets:0 "Clear the streets of Muties"
RST_clear_streets_desc:0 "Streets are filthy with Balefire mutants, or from whatever was causing the mess in this city, and they're mucking up our plans. We'll go on a killing spree, should free room for development."

RST_makeshift_workshops:0 "Makeshift Gun-workshops"
RST_makeshift_workshops_desc:0 "We don't got enough time to try and construct proper weapons manufacturing right now, when we got so much killing to do. We'll just turn some old shops into workshops."

RST_fortress_camps:0 "Camps around the Fortress"
RST_fortress_camps_desc:0 "Camp Soarin is the heart of our operations, freeing this city from old world influence, and we can't let it fall. We'll build it up even more."

RST_redeye_example:0 "Follow Red Eye's Example"
RST_redeye_example_desc:0 "Ain't nobody in the wastes what can throw down like Red Eye can, down south, with his mass armies of slaves, complimented by some chicken special forces. We should copy what he's doing."

RST_legionary_model:0 "The Legionary Model"
RST_legionary_model_desc:0 "The Stripes are Wastelanders like any other, and they're quite good ones, heck, they almost won that old Great War tussle. They got a lot they can teach about quality troops, so let's learn."

RST_whats_yours:0 "What's yours is now mine"
RST_whats_yours_desc:0 "we gotta forget the old world, the old world does have a lotta good loot for us to take. Electronics, robotics, better buildings and industry. Let's take these pieces of the old, and make them new."

RST_welcome_masses:0 "Welcome the willing masses"
RST_welcome_masses_desc:0 "Compared to the others in this city, a group of raiders are pretty normal and pretty nice. A lot of ponies moving in to live in this city, or to scavenge, have decided to stay with us."

RST_reactivate_production:0 "Reactivate Production lines"
RST_reactivate_production_desc:0 "Princessyn's got some old factories what were disabled by the clanker in charge of things. Now that we're in control of them, we can set them back on."

RST_strip_robot_weapons:0 "Strip robots for weapons"
RST_strip_robot_weapons_desc:0 "Robots got plenty of blasters and other weapons attached to them, all they need is a trigger and a pony can use 'em. Since we've got a lot of dead clankers, we'll just pull the weapons off 'em."

RST_advanced_raiders:0 "Form a command-council"
RST_advanced_raiders_desc:0 "Unlike the old world, we ain't gonna determine tactics from just one pony alone, that shit is doomed t'fail. We'll instead do a small council of gang bosses, who can share their thoughts with Punt."

RST_robotics_expertise:0 "Robotics expertise"
RST_robotics_expertise_desc:0 "This city's got a whole lot of factories tuned to making robots, and the Stripes say that robots are effective. Heck, let's give 'em a shot, better some clanker gets clapped than a flesh and blood raider."

RST_punting_reds:0 "Bash the Reds teeth in"
RST_punting_reds_desc:0 "Some ponies can't forget the old world of the Great War, and it seems some are even further back than that. A bunch o'ideologues following a dead nation and a ghost ideology fill the city, let's kick 'em out."

RST_electronic_scribes:0 "Electronic Scribes"
RST_electronic_scribes_desc:0 "Our enslaved Scribes are whining about not having proper electronic note taking, well fine, we'll give 'em some of those electronics we captured from the main clanker."

RST_put_zeebs_to_work:0 "Put the Zeebs to work"
RST_put_zeebs_to_work_desc:0 "The Stripes we took over like the place they're living, so we'll allow them to stay, long as they work to make it better."

RST_our_new_capital:0 "Our new Capital"
RST_our_new_capital_desc:0 "The old tower that the main clanker inhabited's quite nice for Punt, allows him to look over the city all fancy-like. We'll move in and take it for ourselves."

RST_air_raiders:0 "Air-Raiders"
RST_air_raiders_desc:0 "Sky's clear, 'cept for those grey clouds high above. Ain't no better place for a raider to be than up there, raining death down below."

RST_punts_elite:0 "The Murderous Elite"
RST_punts_elite_desc:0 "Sometimes, you need a small group of elites to break through some defenses, and so we'll make some of them. Punt's Stalkers will tear down any defenses, for our Raider horde to exploit."

RST_defeated_slaves:0 "Make slaves of the defeated"
RST_defeated_slaves_desc:0 "We'll make better use of these ponies than they could make use of themselves. We need industry and shit like that to be a shining light of the new world, so let's take slaves and make 'em build it up."

RST_mercy_reward:0 "Mercy's reward"
RST_mercy_reward_desc:0 "It ain't gonna do us any good to take these ponies as slaves, it'll only rile 'em up. If we want to have a long term hold over this city, which Punt does want, then we need to work with 'em. We're all Wastelanders, after all."

RST_consolidate_homefield:0 "Push our Firepower-advantage"
RST_consolidate_homefield_deac:0 " We got a lot of deactivated factories in the places we've taken, we just need to set them back on. We'll also call in some debts from outside the city, see if some old friends can't supply us weapons too."

RST_raidin_fleet:0 "Raidin' River Fleet"
RST_raidin_fleet_desc:0 "River what goes through Princessyn is Tartarus to cross if you don't have a boat. So, let's get some boats."

RST_true_wasteland_army:0 "Proper Wasteland Army"
RST_true_wasteland_army_desc:0 "We've refined ourselves enough, forgotten the past, and embraced the now. We're no longer just a Raider gang, now, we're a Raider army, and Princessyn will be ours."

RST_southside_blues:0 "Southside Blues"
RST_southside_blues_desc:0 "Only two more remain before Princessyn's been baptized in the new world. We'll go down and kick their teeth in, show them the way of the new world."

RST_repair_tower_reactor:0 "Repair the Tower-Orbchive"
RST_repair_tower_reactor_desc:0 "The orbchive, sponsored and named by the Minsitry Mare Rainbow Dash, holds a truly massive amount of hoof-selected memory orbs as well as special reading-terminals that can display very low-resolution images of the Orbs' contents. Many of these orbs will be invaluable for our research!"

RST_new_world_victory:0 "New World Victory"
RST_new_world_victory_desc:0 "Princessyn's welcomed to the new world now, as Punt overlooks all of it. Now the past can be forgotten and left to the eggheads and their history books. Now, a new future can be made."


