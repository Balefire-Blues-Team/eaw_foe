LEE_kaisaryn_cohort_tt:0 "§NWe will raise 1 §OElite 20-Width division of Legionaires with Fireteam support§!§!"
LEE_aurorae_align_tt:0 "§NThis choice aligns us closer with Legio Aurorae§!"

