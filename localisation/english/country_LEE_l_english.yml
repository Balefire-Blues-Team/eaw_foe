##################
### FOCUS TREE ###
##################

LEE_not_yet_lost:0 "Not yet Lost"
LEE_not_yet_lost_desc:0 "The Battle of Princessyn has started poorly, our enemies were greater in number, firepower, and skill than predicted. Many have fallen, but the battle is not yet lost."

LEE_radical_restructuring:0 "Radical Restructuring"
LEE_radical_restructuring_desc:0 "Many in our leadership were lost in the first phase of the Battle of Princessyn, our forces are left not knowing who is in command. We must gather together all who survived the first phase, and reorganize."

LEE_dig_in_prepare:0 "Dig in and prepare"
LEE_dig_in_prepare_desc:0 "We are surrounded by enemies who believe they are strong, but do not know that they are truly just dead ponies trotting. They come for us from all sides, but we will be ready for them. We will hold, no matter what."

LEE_make_due_with_stuff:0 "Make due with what we have"
LEE_make_due_with_stuff_desc:0 "Home is far away, and we must leave behind our homesickness, for Princessyn shall be our new home. We shall claim this slice of the city, and make it properly and proudly Zebrican."

LEE_expand_the_auxilia:0 "Expand the Auxilia"
LEE_expand_the_auxilia_desc:0 "The local pony forces do not fight like zebras, this is true, yet a gun on the front is better than none at all. They shall join us as auxiliary forces, even if many legionaries might not like it."

LEE_a_desperate_plea:0 "A desperate plea"
LEE_a_desperate_plea_desc:0 "We are almost alone, except for the funding from Legio Aurorae. The land is hostile, vast, and difficult to tame, our enemies are great and allies sparse. We must ask for further assistance."

LEE_western_bulwark:0 "The Western Bulwark"
LEE_western_bulwark_desc:0 "While once the Stalliongrad ponies were allies to Zebrica, now they have become treacherous enemies, poisoned by the Balefire. They will come after us, but we will be ready."

LEE_eastern_fortifications:0 "Eastern fortifications"
LEE_eastern_fortifications_desc:0 "Raiders, the scum of the wasteland, and a memory of our old enemy sit to the east, pressing against our borders day by day. We shall build up for them, and they shall fall before us."

LEE_loot_museums_weapons:0 "Loot Museums for Weapons"
LEE_loot_museums_weapons_desc:0 "Many museums in this region celebrate the Equestrian imperialism against the independent country of Stalliongrad. While the weaponry in these museums are outdated, many still operate, and can be put to better use."

LEE_malls_to_factories:0 "Malls to Factories"
LEE_malls_to_factories_desc:0 "Malls are massive, wide-spanning symbols of Equestrian decadence. It is lucky that these large complexes can easily be used to house production lines and factories."

LEE_appoint_new_legates:0 "Appoint new Legates"
LEE_appoint_new_legates_desc:0 "High command has been properly reorganized, yet many legions go without knowing who their leaders are, relying on Prefects and Tribunes to operate. We must ensure every legion has a Legate."

LEE_skyscraper_factories:0 "Skyscraper factories"
LEE_skyscraper_factories_desc:0 "The tall buildings of this city, meant to serve as housing, provide the perfect place for industry. Too high, away from the fighting and the destruction of the ground, these factories shall remain ever present."

LEE_weakest_link:0 "The Weakest Link"
LEE_weakest_link_desc:0 "The Equestrian AI, servant of the Maiden of Stars and enemy to the Fallen Caesar, must be the first to fall in the Battle of Princessyn."

LEE_metro_manufactories:0 "Metro-manufacturies"
LEE_metro_manufactories_desc:0 "The underground metro system does not run anymore, but it provides ample space for weapons manufacturies. The rails and metro stations can serve as distribution points, allowing for safe supply access."

LEE_our_metropolitan_fortress:0 "Our metropolitan fortress"
LEE_our_metropolitan_fortress_desc:0 "For victory to be achieved, every street shall be ready to be barricaded, and every window of every house shall glint with the muzzle flash of loyal zebras."

LEE_raise_first_kaisaryn_cohort:0 "Raise the first Kaisaryn Cohort"
LEE_raise_first_kaisaryn_cohort_desc:0 "Our forces are too small in number to hold the city for long. Our expanded auxiliary forces shall be used to create a new cohort, consisting of ponies, using proper Zebrican tactics."

LEE_re_evalutate_tangazo_inclusio:0 "Re-evalutate the §NTangazo Inclusio§!"
LEE_re_evalutate_tangazo_inclusio_desc:0 "The §NTangazo Inclusio§! is a special exemption granted to Legio Aurorae by the late Caesar themselves. It was granted in anticipation of problems with reinforcing the Severyanan campaign, and officially allows the Legion to source a percentage of their recruits from local, non-citizen, sources."

LEE_adjust_our_doctrine:0 "Adjust our doctrine"
LEE_adjust_our_doctrine_desc:0 "We fight many enemies, and not all will fall the same to our old tactics. If we are to survive and win this battle, our doctrine must be a living doctrine, ready to change as the wind blows."

LEE_subdue_the_ai:0 "Subdue the AI"
LEE_subdue_the_ai_desc:0 "The AI was an admirable foe, even if it was one that fought for the wrong side. We are experts at understanding machinery, perhaps we could reprogram this AI, to serve the proper master."

LEE_quality_over_quantity:0 "Quality over Quantity"
LEE_quality_over_quantity_desc:0 "We do not have as many soldiers, as many guns, as others around us do. But we will ensure that the guns, the soldiers, we do have, are as good as possible."

LEE_indomitable_spirit:0 "Immortal Spirit"
LEE_indomitable_spirit_desc:0 "The Fallen Caesar lives on, present in our every action. The bravery of our soldiers, the brilliance of our leaders, the strength of our hooves, all is in service of the Fallen Caesar."

LEE_open_bazaar_to_world:0 "Open the Bazaar to the Wasteland"
LEE_open_bazaar_to_world_desc:0 "Ponies may dislike zebras in the wasteland, but they are, at their core, greedy creatures. We will offer them a place to buy and sell, to exchange their cap currency, and they shall eagerly forget if the hoof handling the caps is striped or not."

LEE_integrate_support_companies:0 "Integrate support companies"
LEE_integrate_support_companies_desc:0 "War is much more than hooves with guns, it is a symphony, an orchestra, where every member of a society plays a part to its completion."

LEE_resume_automated_manufacturing:0 "Resume automated manufacturing"
LEE_resume_automated_manufacturing_desc:0 "The auto-armories, meant to produce equipment with no need for organic assistance, have been reactivated by the now faithful AI."

LEE_reprogram_defenses:0 "Reprogram the defenses"
LEE_reprogram_defenses_desc:0 "The now faithful AI has granted control over the city's robots to us. May this new auxiliary force save the lives of many, and grant us victory."

LEE_shamanistic_guidance:0 "Shamanistic guidance"
LEE_shamanistic_guidance_desc:0 "Our Shamans commune with the spirits beyond, and from their timeless wisdom, they shall guide our hooves, guide our blades, and guide our nation."
 
LEE_glory_to_caesar:0 "Glory to the Caesar"
LEE_glory_to_caesar_desc:0 "The Battle of Princessyn has almost come to a close, its final phase is but one charge, one battle cry, away. We shall raise our guns and swords, zebra and pony all, and we shall claim this city for the Caesar."

LEE_hold_a_great_triumph:0 "Hold a Triumph"
LEE_hold_a_great_triumph_desc:0 "Those who harried us upon our arrival here have been defeated, and it is time to exact revenge against them. We shall march them through the streets, draped in chains, to proclaim our victory."

LEE_a_twist_of_destiny:0 "A Twist of Destiny"
LEE_a_twist_of_destiny_desc:0 " Our home, those loyal Legions who seized Petershoof long ago, has turned to chaos and strife. Zebra turns against zebra, and the Fallen Caesar weeps to see his own fight. But we have claimed a safe haven. We have become worthy of the title of Legion."

LEE_Kaisaryn_now_and_forever:0 "Kaiseryn, now and forever!"
LEE_Kaisaryn_now_and_forever_desc:0 "Princessyn is an outdated name, now that the battle is over. Over this city, the false Princesses of Equestria hold no more sway. Over this city, only the Fallen Caesar presides."

