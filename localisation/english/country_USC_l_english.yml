 severyana.21.t:0 "Final Notice"
 severyana.21.d:0 "WIP\n\nThe Unseen Council has taken the chair of the alliance and served every member a Final Notice: from now on, all of us pay. We can submit and become its tributary, or leave the alliance and wait for the collectors to come."
