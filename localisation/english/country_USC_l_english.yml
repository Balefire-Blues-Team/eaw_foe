 SDF_united_protectors_desc:0 "The Severyanan Defense Force is a defensive alliance founded in the aftermath of the Commonwealth's Great Northern Expedition, which sought to control Severyana. The ponies north of the Polga River are tough and hardy, working together for one goal, to ensure no Equestrian tyrant can ever cross into Severyana, ever again."
