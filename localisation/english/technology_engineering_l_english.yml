l_english:
 #research
 electronic_engineering:0 "Oh's Law"
 electronic_engineering_desc:0 "Formulated by Doctor Oh, Oh's Law is a mathematical law to understand the relationship between voltage, current, and resistance. Many in the Wasteland had to rediscover Oh's Law in order to begin work on their electronics."
 electronic_engineering_1: "Resistors"
 electronic_engineering_1_desc:0 "The primary way to control the variables in Oh's Law, resistors are used to add resistance to a current and to control it. Many in the Wasteland threw these away before their research revealed they were actually useful."
 electronic_engineering_2: "Capacitors"
 electronic_engineering_2_desc:0 "Capacitors allowed for electronics to become a lot more specific, allowing for a controlled release of energy and for stabilizing voltage in devices. Due to the lack of complex electronics in the Wasteland, many nations would pay top cap for some capacitors."
 electronic_engineering_3:0 "Basic Computations"
 electronic_engineering_3_desc:0 "It might seem like magic, but most actions done by computers are simply a mixture of on and off signals that cause certain reactions. It was only the more civilized groups of the wasteland who came to understand the way to control these inputs and outputs, thus making systems able to do basic calculations, primarily math."
 electronic_engineering_4: "Horse Microchips"
 electronic_engineering_4_desc:0 "Developed by Mister Horse in the early years of the war, these types of computer chips are extremely small in size, able to pack a lot of computational power into a small space. These microchips were a necessity for Equestria, and for Wasteland powers, to develop terminal systems."
 electronic_engineering_5: "Terminals"
 electronic_engineering_5_desc:0 "Large and bulky, terminals were computers that were used everywhere, before and after the Last Day. Able to run calculations in an instant, able to send messages from terminal to terminal in but a minute, and able to store and organize information like nothing else. Terminals might look unimpressive, but they're the workhorse behind scientific advances across contemporary history."
 electronic_engineering_6:0 "Microsystems"
 electronic_engineering_6_desc:0 "Microsystems were often used in mobile devices, such as the Pip-Bucks that soldiers and Stable Dwellers would wear. However, there are many cases where Microsystems would combine together to create a larger system, such as in Princessyn. These systems were able to run basic AIs, mostly used to judge the state of the wearer, sort their inventories, and make fancy names for quests."
 electronic_engineering_7:0 "Crusader Maneframes"
 electronic_engineering_7_desc:0 "Extremely rare due to their sheer size and computational powers, Crusader Maneframes are the top of the line for computing technology. What is so fascinating about them is their ability to create almost pony-like minds, such as Mister House in Dise. Rumors even claim they can fuse with the soul of a pony and make them become one with the machine, though we don't know for sure. Some say that Wallkirk and Cognitum were examples of this, but neither was ever able to be confirmed."
 #Communication
 communication_engineering:0 "Rarity's Guide To Speaking Fabulously"
 communication_engineering_desc:0 "A very popular book both before and after the Last Day, the Guide to Speaking Fabulously was written by Ministry Mare Rarity. It teaches the reader how to speak better, and was often used by leaders, both civilian and military, to learn how to speak to their underlings in a way that wouldn't cause confusion."
 communication_engineering_1:0 "Smoke Signals"
 communication_engineering_1_desc:0 "Often used by large tribal nations that lived on rough terrain, smoke signals used the smoke of fires to send messages across long distances. These signals were most famously used in the Hayseed Swamps near the start of their civil war, used to coordinate both Strider and Cult militaries."
 communication_engineering_2:0 "Basic Radios"
 communication_engineering_2_desc:0 "Radios such as these were used all across the Wasteland to communicate. While many were used by armies to communicate between officers, they were also widely used by normal ponies to listen in to DJ P0N-3's broadcast every day."
 communication_engineering_3:0 "Advanced Radios"
 communication_engineering_3_desc:0 "Having longer ranges and much clearer sound than their predecessors, these radios took a decent understanding of electronics to produce. They were primarily used in the Wasteland for military communication, but in the later years, many normal ponies would also be able to buy these high quality radios."
 communication_engineering_4:0 "Relays"
 communication_engineering_4_desc:0 "Radios don't have an unlimited range, even the most advanced ones could only go so far before it cut out. Radio relays fixed this issue, by receiving and sending a radio's signal, allowing for much greater range in communications. The most famous relays were those used by DJ P0N-3, one of which the Lightbringer even helped clear for him."
 communication_engineering_5:0 "Termlink Communications"
 communication_engineering_5_desc:0 "Terminals were able to transmit information across much greater ranges than radios, allowing for ponies across Equestria to communicate as long as they shared a connection. Terminals also delivered their message in writing, allowing it to be recorded for the future and understood with less room for misinterpretation."
 #Radar
 radar_1:0 "Listening Posts"
 radar_1_desc:0 "Inspired by the shape of the ear, these first radars would basically be a giant funnel for sound to enter into, for a listener to be able to hear. They were first used to listen for planes and for enemy ships, able to pick up their loud engines from far away."
 radar_2:0 "Basic Radar"
 radar_2_desc:0 "Inspired by bat echolocation, these radars used a form of echolocation on their own. They would send out a pulse of noise, low enough to not be heard by any pony ear, and then calculate how long they took to bounce back to the radar. Calculations had to be done by hoof to determine the distance of anything spotted."
 radar_3:0 "Computerized Radar"
 radar_3_desc:0 "These radars were quite similar to their predecessors, using a pulse of noise and the time it takes for it to return in order to judge distance. However, unlike their predecessors, these radars used computers to automatically calculate and measure how far away something is."
 radar_4:0 "Large Scale Radar"
 radar_4_desc:0 "Larger than previous radar stations, and with much more advanced technology within it, these large scale radars were able to cover a much larger range around them."
 radar_5:0 "Specific Radar"
 radar_5_desc:0 "These radars use computers in order to get rid of useless information collected by their echolocation. Through doing so, they allow for potential threats or things of notice to be better noticed, without all the noise of useless information."
 radar_6:0 "P.E.N"
 radar_6_desc:0 "The Perfect Echolocation Noticer, as coined by its inventor, is the final stage of Wasteland radar technology. Combining the large scale size and the specificity of its predecessors, this radar was able to hear if a pen dropped halfway across the country, at least, so said its inventor."
 #Encryption
 encryption:0 "Mage Hand Signals"
 encryption_desc:0 "Inspired by Talons and their use of signals with their claws, many unicorns across the Wasteland would develop an unspoken language through the use of magic hands. Thumbs up, thumbs down, peace, rock on, hang ten, and the middle finger could all be communicated through their magical hands, having different meanings in different contexts."
 encryption_1:0 "OPSEC"
 encryption_1_desc:0 "Operational Security is, in its basics, making sure that only you are hearing what you're supposed to, and that your enemies aren't also hearing it. The most basic form of OPSEC used across the Wasteland was having unique meanings assigned to random words, so it would sound like gibberish to others."
 encryption_2:0 "Horse Code"
 encryption_2_desc:0 "A language where a certain amount of taps, pauses, and dashes could be used to create letters and entire messages. Horse Code was developed during the Great War, and has been used ever since as a way to transmit information. Given how common it is, it doesn't work to hide much information, but it can still be useful."
 encryption_3:0 "Signal Jammers"
 encryption_3_desc:0 "More advanced wasteland nations used localized signal jammers while out in the field, specialized devices that would ensure none in a localized area could access a radio network other than them. While not perfect, these signal jammers served to protect much sensitive information."
 encryption_4:0 "Encryption"
 encryption_4_desc:0 "With the increase in terminal to terminal communication, a way needed to be developed to prevent any terminal from being able to receive sensitive information. These came in many forms, many of which would scan a connection for any unapproved signals, and if spotted, it would sever the connection."
 #Decryption
 decryption:0 "Basic Literacy"
 decryption_desc:0 "Many ponies in the Wasteland didn't know how to read very well, except for words which would help their survival. For many countries, their first step in understanding their enemies was making sure their infiltrators and soldiers could read. What good is capturing enemy documents if you can't read them?"
 decryption_1:0 "Cypher-Breakers"
 decryption_1_desc:0 "Specialised groups were formed in many wasteland militaries that would listen in to enemy communications and try to understand their cyphers. They would compare communications to the actions of enemy armies and use that to assume what their code-words meant."
 decryption_2:0 "Telegraphs"
 decryption_2_desc:0 "Developed alongside Horse Code, these machines would receive the taps and dashes and automatically translate them into letters and words. These are a large part of why Horse Code was an imperfect encryption method."
 decryption_3:0 "Signal Interceptors"
 decryption_3_desc:0 "Devices designed to counter the effects of signal jammers, they would create an extremely small area where the jammer wouldn't work. This would allow forces to listen in, despite signal jammers."
 decryption_4:0 "False Friend Flag"
 decryption_4_desc:0 "These specialized programs existed to try and trick many forms of terminal based encryption. They would purposefully allow themselves to be spotted by encryption programs, and pretend that they are the right receiver for the information, allowing the encrypted information to be received."

