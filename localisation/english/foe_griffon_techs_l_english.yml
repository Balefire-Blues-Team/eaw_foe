  #talons techs
  talons_tech_research:0 "Talons Technology Research Time"
  TITLE_TALON_MERCS_SUBTITLE:0 "TALON MERCENARIES"
  TITLE_GRIFFON_AIR_NAVY_SUBTITLE:0 "GRIFFON AIR AND NAVY"
  TITLE_GRIFFON_ARMY_SUBTITLE:0 "GRIFFON ARMY"
  TITLE_GRIFFON_SOCIETY_SUBTITLE:0 "GRIFFON SOCIETY"
  ME_TALONS_TOOLTIP:0 "\n£unit_talons_icon_small Talons will require §YMagical Infantry Equipment§! instead of §YInfantry Equipment§!\n"
  talons:0 "Talons"
  talons_desc:0 "Since before the bombs, Griffon Talons have been the premiere mercenary forces in the world. As times change, Talons shift their loyalties from the highest bidder to the people who will ensure their lives, allowing them to survive this coming storm."
  talons_tech:0 "Talons Technology"
  tech_talons:0 "Talons Division I"
  tech_talons_desc:0 "Known around the world for their skill and bravery, the tradition of mercenaries in griffon culture dates back to some of the earliest griffon societies. Using enchanted armour and weapons, these soldiers can square up even against some power armors."
  tech_talons2:0 "Talons Division II"
  tech_talons2_desc:0 "Through the use of improved training and equipment, we can strengthen our Talons divisions."
  tech_talons3:0 "Talons Division III"
  tech_talons3_desc:0 "With the further modernisation and improvement of our Talons, we can ensure their prevalence on the battlefield will continue."
  tech_talons_a:0 "Talons Division IV"
  tech_talons_a_desc:0 "By improving the enchantments used for armour, our talons can survive and fight for longer on the battlefield."
  tech_talons_b:0 "Talons Division V"
  tech_talons_b_desc:0 "In order to keep our Talons competitive, we need to ensure they have even stronger enchantments and weaponry."
  tech_talons_c:0 "Talons Division VI"
  tech_talons_c_desc:0 "By inviting some of the most powerful enchanters from across the wasteland, we can make our Talons into unstoppable fighters."
  tech_talons_magical:0 "Griffon Recruits"
  tech_talons_magical_desc:0 "We must ensure that not only do we use the finest equipment for our Talons, but also the finest soldiers - only griffons deserve to be part of our elite Talons."
  tech_talons_magical2:0 "Highest Standards"
  tech_talons_magical2_desc:0 "Nothing less than perfect is accepted in our mercenaries, and that extends to our training - by enforcing strict guidelines for conscription and training, our Talons will be the envy of the world."
  tech_talons_regular:0 "Wasteland Recruits"
  tech_talons_regular_desc:0 "We cannot afford to limit our recruiting to griffons. If we extend our drafts to other wastelanders as well, while our quality might suffer our troops will have many more men to draw from."
  tech_talons_regular2:0 "Fighting Spirit"
  tech_talons_regular2_desc:0 "Griffons are natural born fighters. From the moment our chicks leave their eggs, they can put any other race into the ground!"
  #griffon techs
  tech_griffon_misc:0 "Griffonian Quality"
  tech_griffon_misc_desc:0 "Griffons are natural crafters, and often won't settle for anything less than the most finely produced product. For their industry, this made it better in the long run, as their parts were able to function at maximum efficiency."
  tech_griffon_misc2:0 "The Assembly Line"
  tech_griffon_misc2_desc:0 "Invented in the Griffonian Empire and carried to Equestria by Griffons, the assembly line allows for much faster production of equipment."
  tech_griffon_misc3:0 "Nested Structures"
  tech_griffon_misc3_desc:0 "Not referring to nests like birds live in, but rather to the act of including something within something else. Nested structures, popular in Griffon culture, combine together houses, factories, and shops into the same structure, allowing for more industry per square mile."
  tech_griffon_misc_a:0 "Sharp Eyes"
  tech_griffon_misc_a_desc:0 "Griffons are renowned for their great eyesight, and are able to spot things from much further off than ponies can. This allows griffons to often spot any threats or spot enemy movements from far away."
  tech_griffon_misc_b:0 "Skilled Crafters"
  tech_griffon_misc_b_desc:0 "Most Griffons who were taught how to make equipment were trained to much higher levels than ponies before working. This higher level of training allowed Griffons to easily switch between production lines without a massive decrease in output."
  tech_griffon_misc_c:0 "Quality Materials"
  tech_griffon_misc_c_desc:0 "None are better than Griffons in identifying the quality of a piece of metal or a forged item. Due to this, they are able to choose the finest materials for their products, allowing them to function for longer without breaking."
  tech_griffon_army:0 "Natural Flight"
  tech_griffon_army_desc:0 "As can be assumed by the large wings on their side, Griffons are able to fly. In combat, this means that their infantry were able to fight on three dimensions instead of just two, making them a dangerous threat."
  tech_griffon_army_def2:0 "Fliers"
  tech_griffon_army_def2_desc:0 "Specially trained Griffons would often act as Fliers in the army, flying from place to place in order to spread orders and take account of any enemy movement."
  tech_griffon_army_def3:0 "Blessed Armor"
  tech_griffon_army_def3_desc:0 "Though many Talons don't believe in the old gods of Griffonia, they still are said to be protected by Arcturius from up high. Nobody is sure if this is why Talon armor seems to be better than regular armor, but if there's a physical reason, the Talons aren't sharing it."
  tech_griffon_army_def_a:0 "Support Doctrine"
  tech_griffon_army_def_a_desc:0 "Being the first to invent tanks, Griffons have a better understanding of tank tactics than most species. For Griffons, tanks serve as infantry support more than anything, rather than acting on their own."
  tech_griffon_army_def_b:0 "Knightly Legacy"
  tech_griffon_army_def_b_desc:0 "Many tank drivers in Griffon culture see themselves like the Knights of Griffonia far away. Owing to this feeling of a common legacy, tank drivers were often able to work easily together, even if from different cultures."
  tech_griffon_army_def_c:0 "Blessed Munitions"
  tech_griffon_army_def_c_desc:0 "While some reject that Arcturius or Maar are the reason why bullets shot out of Griffon anti-machine rifles or machine guns hit harder than out of any other gun, it is the only explanation that makes sense. If anyone tries to ask a Talon why, they'll just laugh and threaten to give a live demonstration."
  tech_griffon_army_atk2:0 "Three Dimensional Movement"
  tech_griffon_army_atk2_desc:0 "Owing to their ability to fly, Griffons are able to often fly over any obstacles, which would normally slow ponies down quite a lot."
  tech_griffon_army_atk3:0 "Spotters"
  tech_griffon_army_atk3_desc:0 "Often working side by side with special forces, Griffon spotters would fly high above armies and use their keen eyes to look into the distance. Given their keen eyesight and their ability to fly, this often resulted in much better reconnaissance than ponies could do."
  tech_griffon_army_atk_a:0 "Reavers"
  tech_griffon_army_atk_a_desc:0 "Unique gauntlets designed to strap onto the talons of a Griffon, Reavers are specially made to rip through anything else that flies through the skies. Often consisting of an easy to break-off blade sticking out of the side of the gauntlet, Griffons would use their aerial momentum to jam these blades into flying craft, then breaking them off to prevent any damage done to the Griffon themselves."
  tech_griffon_army_atk_b:0 "Predators"
  tech_griffon_army_atk_b_desc:0 "Griffons are able to eat vegetables like ponies, but above all, they are able to stomach meat much better than ponies can, even raw. Even encircled Griffons could remain well-fed for days, able to eat the pests of whatever position they're locked down at."
  tech_griffon_army_atk_c:0 "Lightweight Vehicles"
  tech_griffon_army_atk_c_desc:0 "Griffon vehicles, especially motorcycles, were often designed to be much lighter than pony versions. This lightness would allow Griffons to use their wings, to boost the speed of a vehicle, to stabilize it and allow for a steady shot, or to jump over obstacles in the road."
  tech_griffon_airnavy:0 "Multipurpose Yards"
  tech_griffon_airnavy_desc:0 "Griffons have long seen air and naval combat as one and the same, since most naval battles during their history were resolved by sailors taking to the skies and fighting. Due to this, whenever designing dockyards or airyards, most Griffons will also include basic structure for the other, allowing them to be built quicker when needed."
  tech_griffon_airnavy2:0 "Crow's Nest"
  tech_griffon_airnavy2_desc:0 "Used on both ships and aircraft by Griffons, a crow's nest is a raised potion of a craft with a three hundred and sixty degree view. In ships, griffons would often act as spotters from atop sails or command decks. On aircraft, there would often be a commanding officer sat in a glass viewport, allowing them to see everything and issue commands in the midst of a dogfight."
  tech_griffon_navy3:0 "Zeroed Guns"
  tech_griffon_navy3_desc:0 "Given that most Griffon naval combat was about two groups of fliers fighting each other, most Griffonian ships learned how to zero in their weapons for maximum accuracy. This has made them much better at hitting flying targets, and at hitting other ships."
  tech_griffon_navy4:0 "Seahawks"
  tech_griffon_navy4_desc:0 "A term used for Griffons who are part of small privateering ships, who would fly into the distance looking for undefended ships, before returning to inform their captains. Originally came about in the Golden Age of Griffonian Piracy, but the practice continued for many small ships."
  tech_griffon_navy5:0 "Pack Tactics"
  tech_griffon_navy5_desc:0 "Griffons, being social predators, often work as pack hunters when hunting for food. On the water, many use pack tactics to hunt enemy ships as well, acting as one whole rather than as a mix of individuals."
  tech_griffon_air3:0 "Natural Fliers"
  tech_griffon_air3_desc:0 "Given that Griffons are naturally able to fly, they understand the physics behind flying much better than non-flying species do. This allows their pilots to start much more experienced, naturally understanding the ways of the sky."
  tech_griffon_air4:0 "Flock Tactics"
  tech_griffon_air4_desc:0 "Many Griffon strategic bombers would have an escort unit inside of Griffons with heavy weaponry. Should an enemy fly to try and shoot down the bombers, this escort would fly out and use their heavy weaponry to either shoot down or distract the interceptors, allowing their bombers enough time to escape or deposit their payload."
  tech_griffon_air5:0 "Masters Of The Sky"
  tech_griffon_air5_desc:0 "Griffons pride themselves on their ability to fly, and their ability to kill things, with both gaining large amounts of respect in Griffon culture. Due to this, many Griffons set out to become masters of the sky, unmatched and unbeatable."
  griffon_folder:0 "Griffon Techs"
  griffon_folder_desc:0 "Technologies specific to the griffon race."