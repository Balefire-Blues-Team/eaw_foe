 # Naval Academy Spirit Descriptions
 wasteland_admirals_spirit_desc:0 "They never led a real navy. They led whatever floated. Turns out the distinction matters less than anypony expected, and more than they'd admit."
 salvaged_navigation_spirit_desc:0 "Pre-war charts, pre-war protocols, pre-war assumptions about where the coastline still exists. Two out of three isn't bad."
 wartime_crews_spirit_desc:0 "No time for drills. No room for theory. The enemy is already on the horizon and the rigging still isn't right. They'll learn. The survivors always do."
 merchant_tradition_spirit_desc:0 "Before the bombs, somepony had to move the goods. Turns out moving goods at sea and moving ships at war involve the same skill set, minus the invoices and plus the cannons."
 conqueror_captains_spirit_desc:0 "A commander who knows how to retreat is a commander who plans to. We don't plan to. Set course, full speed, point the bow at the problem."
 concentrated_fleet_academy_spirit_desc:0 "The old admirals would gather every hull that could float and hit the enemy all at once. It still works. The ocean isn't that different from what it used to be. The tactics don't need to be either."
 river_raider_academy_spirit_desc:0 "Hit the convoy, sink the escort, vanish into the shallows before reinforcements arrive. Half art form, half obituary. Mostly obituary."
 dispersed_patrol_academy_spirit_desc:0 "Spread across every channel and inlet. Watching. Waiting. Covering the approaches. Not glamorous. Not exciting. But nothing gets through without us knowing about it first."
 rustwreck_sea_legacy_spirit_desc:0 "Rustwreck doesn't just build ships. It grows them. Every captain that walks out of those docks carries two centuries of hard-won maritime knowledge and at least one preventable scar. The scars come free."

 # Navy Spirit Descriptions
 scrap_armada_spirit_desc:0 "Most of the fleet started as something else. Barges, fishing boats, one enthusiastic raider's modified raft. What matters is they float. Mostly."
 wasteland_navigators_spirit_desc:0 "No proper charts, no reliable compass readings since the balefire rewrote the magnetic field. They navigate by starlight, instinct, and an argument about which direction the current goes. They're right more often than they should be."
 salvage_and_refit_spirit_desc:0 "The wasteland produces excellent mechanics by process of elimination. The ones still alive are very good at keeping things running that shouldn't be."
 naval_intelligence_network_spirit_desc:0 "Traders, smugglers, and shore-watchers with a reason to stay quiet about what they've seen — until a better offer arrives. The best intelligence network is one that looks like nopony is watching."
 war_fleet_spirit_desc:0 "Mass the hulls. Concentrate the fire. Don't give them room to breathe or time to think. The heaviest fleet wins. That's the whole lesson. Write it down."
 coastal_raider_fleet_spirit_desc:0 "Fast, light, expendable. They don't have to win the battle. They just have to make the enemy wish it hadn't started one."
 tribal_waterway_spirit_desc:0 "Their boats don't look like much from shore. Get close enough to find out and you've already lost. These waters belong to them. The wreckage makes that point for us."
 rustwreck_shipwright_corps_spirit_desc:0 "The Shipwright Corps doesn't just repair ships. They improve them. Every refit adds a plate here, a gun mount there, a quietly terrifying modification the original designers never intended. The yards never sleep."

 # Naval Command Spirit Descriptions
 reckless_captains_spirit_desc:0 "The theory of naval combat involves positioning, timing, and calculated risk. Our theory involves going straight at the target as fast as possible and seeing what happens. It works more than it shouldn't."
 night_river_hunters_spirit_desc:0 "The river doesn't care what time it is. Neither do we. When the sun goes down, the hunting starts, and they never hear us until the hull starts taking water."
 storm_hardened_crews_spirit_desc:0 "The old Cloudsdale pegasi kept the weather predictable. Now nopony does, and the sea reminds you of that on a regular basis. The survivors stopped minding a long time ago."
 screening_escort_spirit_desc:0 "The capital ships are expensive. The screen is not. The screen goes first, finds the torpedoes the hard way, and gives the big guns time to aim. This is considered a good arrangement by the crew of the capital ships."
 ironside_command_spirit_desc:0 "Let them hit us. Let them hit us as many times as they want. We're still here, and now it's our turn."
 ghost_fleet_command_spirit_desc:0 "They'll report our position wrong. By the time the correction arrives, we're somewhere else. A fleet nopony can find is a fleet nopony can stop."
 first_strike_command_spirit_desc:0 "The engagement begins the moment we decide it begins. Not when they spot us. Not when their guns are ready. The first shot is ours. Everything after that is consequences."
 ghoul_sea_captains_spirit_desc:0 "They sailed these waters before the bombs dropped. They'll be sailing them long after the rest of us are gone. Two hundred years of operational experience doesn't wash off."
 rustwreck_high_command_spirit_desc:0 "The Celestial Fleet doesn't move without authorization, and it doesn't stop without a reason. The High Command knows every shipping lane, every patrol gap, every coastal approach. It's their sea. They just allow the rest of us to use it."
