### Events ###
 GSL.101.title:0 "Where the Chains Came From"
 GSL.101.desc:0 "WIP\n\nEvery slaver house has a story about how it started. Ours?"
 GSL.101.a:0 "A raider gang that found ponies sell better than they die."
 GSL.101.b:0 "The guards of an old prison who kept their prisoners."
 GSL.101.c:0 "Runaways from a bigger house who became masters themselves."
 GSL.102.title:0 "The First Collar"
 GSL.102.desc:0 "WIP\n\nThe first big catch made the house. Who wore those collars?"
 GSL.102.a:0 "Ponies, broken to the factory floor."
 GSL.102.b:0 "Southerners, sent down the mines."
 GSL.102.c:0 "Prisoners of war, and their officers."
 GSL.103.title:0 "The Master of the House"
 GSL.103.desc:0 "WIP\n\nThe master of a slaver house is known for one thing above all. What is ours known for?"
 GSL.103.a:0 "Cruelty. Nopony in the pens dares look up."
 GSL.103.b:0 "Cunning. Every deal goes the master's way."
 GSL.103.c:0 "Wealth. The house has never been short of coin."
 GSL.1.title:0 "Runaways"
 GSL.1.desc:0 "WIP\n\nA whole gang slipped its chains in the night and is heading for the hills."
 GSL.1.a:0 "Send the catchers after them."
 GSL.1.b:0 "Let them go. The waste will finish them."
 GSL.2.title:0 "Sabotage"
 GSL.2.desc:0 "WIP\n\nSand in the gears, a fire in the store room. Somepony in the work gangs wants the factory to stop."
 GSL.2.a:0 "Crack down on every gang."
 GSL.2.b:0 "Fix the damage and move on."
 GSL.3.title:0 "A Ringleader"
 GSL.3.desc:0 "WIP\n\nThe overseers say one slave is behind the whispers in the pens. The others listen to her."
 GSL.3.a:0 "Make an example of her."
 GSL.3.b:0 "Sell her and everypony she talked to."

### Slave market panel ###
 GSL_market_header:0 "Slave Market"
 GSL_market_line_1:0 "Going price: §Y[?global.GSL_price|0]§! £civ_factory_output (normal §Y[?global.GSL_base_price|0]§!)     On offer: §Y[?global.GSL_pool|1]§! thousand"
 GSL_market_line_1_tt:0 "One batch is §Y1 thousand§! slaves. Every batch sold lowers the price by §Y5%§!, every batch bought raises it by §Y5%§!; each month it drifts §Y10%§! of the way back to the normal price of §Y[?global.GSL_base_price|0]§!. It stays between half and double the normal price. Events in the wasteland can move the price, and some move the normal price itself.\n\nSellers receive the price in §YEconomic Capacity Surplus§!, which speeds up construction. Buyers pay §Y20%§! more, with factory time, political power or guns."
 GSL_market_slaves:0 "£slave_text Our slaves: §Y[?foe_slaves_var]§! thousand free, §Y[?GSL_held]§!/§R[?GSL_hold_cap]§! thousand in gangs"
 GSL_market_slaves_tt:0 "Free slaves can be sold, spent on decisions or put into gangs. Slaves in gangs give a running bonus and cost stability and research through §YThe Pens§!."
 GSL_market_line_2:0 "Our rates: §RSell§! §Y[?GSL_sell_mult|%0]§!,     §GBuy§! §Y[?GSL_buy_mult|%0]§!     Contract: §Y[?GSL_debt_days|0]§! days"
 GSL_market_line_2_tt:0 "Our selling rate multiplies what we receive, our buying rate what we pay. The contract is the factory time we still owe for slaves bought on contract: one civilian factory works for the sellers until it is paid off."
 GSL_sell_surplus_button:0 "§R[?global.GSL_price|0]§! £civ_factory_output"
 GSL_sell_pp_button:0 "§R[?global.GSL_sell_pp|0]§! £pol_power"
 GSL_sell_guns_button:0 "§R[?global.GSL_sell_guns|0]§! £infantry_equipment_text_icon"
 GSL_buy_factories_button:0 "£civ_factory §G[?global.GSL_buy_days|0] days§!"
 GSL_buy_pp_button:0 "§G[?global.GSL_buy_pp|0]§! £pol_power"
 GSL_buy_guns_button:0 "§G[?global.GSL_buy_guns|0]§! £infantry_equipment_text_icon"
 GSL_sell_surplus_button_tt:0 "§YSell 1 thousand slaves for Economic Capacity Surplus§!\nWe receive §G[?global.GSL_price|0]§! £civ_factory_output, times our selling rate of §Y[?GSL_sell_mult|%0]§!. The surplus speeds up our construction until it is used up.\n\nRequires §Y1 thousand§! free slaves (we have §Y[?foe_slaves_var|1]§!)."
 GSL_sell_pp_button_tt:0 "§YSell 1 thousand slaves for favours§!\nWe receive §G[?global.GSL_sell_pp|0]§! £pol_power political power, times our selling rate of §Y[?GSL_sell_mult|%0]§!.\n\nRequires §Y1 thousand§! free slaves (we have §Y[?foe_slaves_var|1]§!)."
 GSL_sell_guns_button_tt:0 "§YSell 1 thousand slaves for guns§!\nWe receive §G[?global.GSL_sell_guns|0]§! £infantry_equipment_text_icon guns, times our selling rate of §Y[?GSL_sell_mult|%0]§!.\n\nRequires §Y1 thousand§! free slaves (we have §Y[?foe_slaves_var|1]§!)."
 GSL_buy_factories_button_tt:0 "§YBuy [GSL_GetContractAmount] slaves on contract§!\nOne of our civilian factories £civ_factory works for the sellers for another §R[?global.GSL_buy_days|0]§! days, times our buying rate of §Y[?GSL_buy_mult|%0]§!.\n\nRequires slaves on offer, a free civilian factory £civ_factory and a contract of no more than §Y360§! days (ours: §Y[?GSL_debt_days|0]§!)."
 GSL_buy_pp_button_tt:0 "§YBuy 1 thousand slaves with favours§!\nWe pay §R[?global.GSL_buy_pp|0]§! £pol_power political power, times our buying rate of §Y[?GSL_buy_mult|%0]§!.\n\nRequires slaves on offer and at least §Y[?global.GSL_buy_pp|0]§! £pol_power political power."
 GSL_buy_guns_button_tt:0 "§YBuy 1 thousand slaves with guns§!\nWe pay §R[?global.GSL_buy_guns|0]§! £infantry_equipment_text_icon guns, times our buying rate of §Y[?GSL_buy_mult|%0]§!.\n\nRequires slaves on offer and at least §Y[?global.GSL_buy_guns|0]§! £infantry_equipment_text_icon guns in stock."
 GSL_autorenew_button:0 "Auto-renew"
 GSL_autorenew_button_tt:0 "§YAuto-renew our contract§!\nWhile this is on, a contract that has been paid off is renewed with §Y1 thousand§! slaves at the next monthly tick. One civilian factory £civ_factory stays at work for the sellers.\n\nRenewal pauses while the price is above §Y[?global.GSL_autorenew_limit|0]§! £civ_factory_output (§Y125%§! of the normal price), and needs slaves on offer and a free civilian factory.\n\nClick to switch it on or off."
 GSL_autorenew_off:0 "Auto-renew is §Yoff§!"
 GSL_autorenew_on:0 "Auto-renew is §Gon§!"
 GSL_autorenew_paused:0 "Auto-renew is §Rpaused§!: price above §Y[?global.GSL_autorenew_limit|0]§!"
 GSL_sunnyshore_market_tt:0 "The flood of fresh slaves drops the price on the §YSlave Market§! by §G15%§! and adds §Y5 thousand§! to the slaves on offer."
 GSL_market_notice_tt:0 "The going price on the §YSlave Market§! is now §Y[?global.GSL_price|0]§! £civ_factory_output, the normal price §Y[?global.GSL_base_price|0]§!."
 GSL.201.title:0 "Fillydelphia Wants More Hands"
 GSL.201.desc:0 "WIP\n\nThe furnaces of Fillydelphia now number more than a hundred, and every one of them eats slaves. Red Eye's buyers are paying whatever the pens ask. The price of a collar will not come down again soon."
 GSL.201.a:0 "Good news for sellers."
 GSL.202.title:0 "A Flood in the Pens"
 GSL.202.desc:0 "WIP\n\nRed Eye has chained the whole of Sunnyshore. Thousands of fresh slaves are being marched east, and the surplus spills onto every market in the wasteland. For a while, slaves will be cheap."
 GSL.202.a:0 "A good time to buy."

### Slave panel: The Pens and gangs ###
 GSL_pens_line:0 "The Pens: §R[?GSL_pens_stability|%0]§! stability, §R[?GSL_pens_research|%0]§! research speed"
 GSL_pens_line_tt:0 "What the slaves in our gangs cost right now: §R-2%§! stability and §R-1%§! research speed for every thousand held, times our cost of §Y[?GSL_pens_cost_mult|%0]§!. Holding §Y3 thousand§! or more also risks trouble in the pens."
 GSL_gang_field_row:0 "Field and Mine Gangs: §Y[?GSL_gang_field|0]§! / 3   §G+[?GSL_pens_metal|0]§! metal and energy"
 GSL_gang_field_row_tt:0 "§YField and Mine Gangs§!\nEach gang holds §Y1 thousand§! slaves. Up to §Y3§! gangs of this kind, and no more slaves in all our gangs than we can hold (§Y[?GSL_held|0]§! of §Y[?GSL_hold_cap|0]§! thousand)."
 GSL_assign_field_button:0 "+1"
 GSL_release_field_button:0 "-1"
 GSL_assign_field_button_tt:0 "§YPut 1 thousand slaves into a new Field and Mine Gang§!\nThe bonus grows, and so does the cost of §YThe Pens§!.\n\nRequires §Y1 thousand§! free slaves (we have §Y[?foe_slaves_var|1]§!), room in our gangs (§Y[?GSL_held|0]§! of §Y[?GSL_hold_cap|0]§!) and fewer than §Y3§! gangs of this kind."
 GSL_release_field_button_tt:0 "§YDisband one Field and Mine Gang§!\nIts §Y1 thousand§! slaves return to the pens as free slaves."
 GSL_gang_factory_row:0 "Factory Gangs: §Y[?GSL_gang_factory|0]§! / 3   §G+[?GSL_pens_output|%0]§! factory output"
 GSL_gang_factory_row_tt:0 "§YFactory Gangs§!\nEach gang holds §Y1 thousand§! slaves. Up to §Y3§! gangs of this kind, and no more slaves in all our gangs than we can hold (§Y[?GSL_held|0]§! of §Y[?GSL_hold_cap|0]§! thousand)."
 GSL_assign_factory_button:0 "+1"
 GSL_release_factory_button:0 "-1"
 GSL_assign_factory_button_tt:0 "§YPut 1 thousand slaves into a new Factory Gang§!\nThe bonus grows, and so does the cost of §YThe Pens§!.\n\nRequires §Y1 thousand§! free slaves (we have §Y[?foe_slaves_var|1]§!), room in our gangs (§Y[?GSL_held|0]§! of §Y[?GSL_hold_cap|0]§!) and fewer than §Y3§! gangs of this kind."
 GSL_release_factory_button_tt:0 "§YDisband one Factory Gang§!\nIts §Y1 thousand§! slaves return to the pens as free slaves."
 GSL_gang_road_row:0 "Road and Building Gangs: §Y[?GSL_gang_road|0]§! / 3   §G+[?GSL_pens_construction|%0]§! construction speed"
 GSL_gang_road_row_tt:0 "§YRoad and Building Gangs§!\nEach gang holds §Y1 thousand§! slaves. Up to §Y3§! gangs of this kind, and no more slaves in all our gangs than we can hold (§Y[?GSL_held|0]§! of §Y[?GSL_hold_cap|0]§! thousand)."
 GSL_assign_road_button:0 "+1"
 GSL_release_road_button:0 "-1"
 GSL_assign_road_button_tt:0 "§YPut 1 thousand slaves into a new Road and Building Gang§!\nThe bonus grows, and so does the cost of §YThe Pens§!.\n\nRequires §Y1 thousand§! free slaves (we have §Y[?foe_slaves_var|1]§!), room in our gangs (§Y[?GSL_held|0]§! of §Y[?GSL_hold_cap|0]§!) and fewer than §Y3§! gangs of this kind."
 GSL_release_road_button_tt:0 "§YDisband one Road and Building Gang§!\nIts §Y1 thousand§! slaves return to the pens as free slaves."
 GSL_gang_levy_row:0 "Levy Gangs: §Y[?GSL_gang_levy|0]§! / 3   §G+[?GSL_pens_recruit|%0]§! recruitable population"
 GSL_gang_levy_row_tt:0 "§YLevy Gangs§!\nEach gang holds §Y1 thousand§! slaves. Up to §Y3§! gangs of this kind, and no more slaves in all our gangs than we can hold (§Y[?GSL_held|0]§! of §Y[?GSL_hold_cap|0]§! thousand)."
 GSL_assign_levy_button:0 "+1"
 GSL_release_levy_button:0 "-1"
 GSL_assign_levy_button_tt:0 "§YPut 1 thousand slaves into a new Levy Gang§!\nThe bonus grows, and so does the cost of §YThe Pens§!.\n\nRequires §Y1 thousand§! free slaves (we have §Y[?foe_slaves_var|1]§!), room in our gangs (§Y[?GSL_held|0]§! of §Y[?GSL_hold_cap|0]§!) and fewer than §Y3§! gangs of this kind."
 GSL_release_levy_button_tt:0 "§YDisband one Levy Gang§!\nIts §Y1 thousand§! slaves return to the pens as free slaves."
 GSL_pens_cat:0 "The Pens"
 GSL_pens_cat_desc:0 "Slaves held in gangs work for the house, and the house pays for keeping them. The catchers bring in more."

 ### Abolition ###
 GSL_abolish_tt:0 "§YSlavery ends.§! Every slave we hold, in the pens or in gangs (§Y[?foe_slaves_var|1]§! thousand free), is set free and settles in our core states, where our conscription law draws on them like on anyone else.\nThe slave market closes to us: our contracts, standing orders and gangs are void."

 ### Slave system in other trees ###
 GSL_contract_one:0 "1 thousand"
 GSL_contract_two:0 "2 thousand"
 GSL_open_pens_tt:0 "Opens §YThe Pens§!: slaves held in a gang give a running bonus, and The Pens charge their cost: §R-2%§! stability and §R-1%§! research speed for every thousand held. Our gangs can hold §Y4 thousand§! slaves."
 OAP_centre_of_slave_trade_tt:0 "§YSlave Market§!: we sell at §G+10%§! and buy at §G-10%§!. Every contract brings §G2 thousand§! slaves instead of 1"
 OAP_centre_of_slave_trade2_tt:0 "§YSlave Market§!: we sell at §G+20%§! and buy at §G-20%§!. Every contract brings §G2 thousand§! slaves instead of 1"
 GSL_oap_clearance_market_tt:0 "The cleared plantations flood the §YSlave Market§!: the price drops by §G10%§! and §Y3 thousand§! slaves are added to the offer."
 GSL_oap_junction_market_tt:0 "The Junction's slaves reach the §YSlave Market§!: the price drops by §G5%§! and §Y1 thousand§! slaves are added to the offer."
 GSL_oap_abolition_market_tt:0 "The wasteland loses its biggest slave market: the normal price on the §YSlave Market§! rises by §R150§! for good."
 GSL.203.title:0 "Appleloosa Closes Its Pens"
 GSL.203.desc:0 "WIP\n\nThe Rangers have shut down the auction blocks of Old Appleloosa. The caravans from the Southwest have nowhere to sell, and every slaver in the wasteland now pays more for what little reaches them."
 GSL.203.a:0 "Slaves will be dear for a long time."
 GSL_market_no_sell:0 "§RFillydelphia does not sell its slaves.§!"
 GSL_market_no_sell_tt:0 "Every collar in Red Eye's lands goes to the furnaces of Fillydelphia. We buy on the §YSlave Market§!, but we never sell."
 EYE_slave_market_tt:0 "§YSlave Market§!: Fillydelphia pays any price. We buy at §R+50%§! and §Rnever sell§!."
 GSL_rangers_market_tt:0 "The captured Rangers flood the §YSlave Market§!: the price drops by §G10%§! and §Y3 thousand§! slaves are added to the offer."
 GSL_mareway_market_tt:0 "The slaves from the Mareway flood the §YSlave Market§!: the price drops by §G15%§! and §Y4 thousand§! slaves are added to the offer."
 GSL.204.title:0 "Rangers in Chains"
 GSL.204.desc:0 "WIP\n\nRed Eye has put the Filly Rangers in collars. Fillydelphia cannot use them all, and the ones it does not want are sold off cheap: armoured ponies who used to hunt slavers now stand on the auction blocks."
 GSL.204.a:0 "A good time to buy."
 GSL.205.title:0 "The Mareway Emptied"
 GSL.205.desc:0 "WIP\n\nThe towns along the Mareway have been marched east in chains. More slaves are on the road than the pens of Fillydelphia can hold, and the overflow is sold to whoever is buying."
 GSL.205.a:0 "A good time to buy."
