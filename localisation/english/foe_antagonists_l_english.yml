 # Fall phase
 foe_antagonists.2.k:0 "The Rival is annexed by an AI neighbour (tests an AI kill)"
 foe_antagonists.2.l:0 "Run the refill timers out now"
 foe_antagonists.9.t:0 "A New Threat"
 foe_antagonists.9.d_rival:0 "WIP\n\n[?global.FOE_antagonist_last_fallen.GetNameWithFlag] is gone, but the wasteland does not stay empty for long. [?global.FOE_antagonist_rival.GetNameWithFlag] has risen to take its place as our §RRival§!."
 foe_antagonists.9.d_archenemy:0 "WIP\n\n[?global.FOE_antagonist_last_fallen.GetNameWithFlag] is gone, but the wasteland does not stay empty for long. [?global.FOE_antagonist_archenemy.GetNameWithFlag] has risen to take its place as our §dArchenemy§!."
 foe_antagonists.9.d_reserve:0 "WIP\n\n[?global.FOE_antagonist_last_fallen.GetNameWithFlag] is gone, but the wasteland does not stay empty for long. [?global.FOE_antagonist_reserve.GetNameWithFlag] has risen to take its place as our §GDistant Threat§!."
 foe_antagonists.9.a:0 "Another one."
 FOE_tracker_status_defeated:0 "§GDefeated by us§!"
 # Strike countdown
 foe_antagonists.2.m:0 "End every strike countdown now (the wars start)"
 foe_antagonists.13.t:0 "The Storm Gathers"
 foe_antagonists.13.d_hard:0 "WIP\n\n[FROM.GetNameWithFlag] is massing its armies along our border. Supply columns crowd the roads behind their lines and their forward camps fill by the day. Our officers expect them to attack within the month."
 foe_antagonists.13.d_brutal:0 "WIP\n\n[FROM.GetNameWithFlag] is massing its armies along our border. Supply columns crowd the roads behind their lines and their forward camps are already full. Our officers expect them to attack within days."
 foe_antagonists.13.a:0 "Man the defences."
 FOE_antagonist_missions:0 "Antagonist Plans"
 FOE_antagonist_strike_mission:0 "Strike on [FROM.GetName]"
 FOE_antagonist_strike_mission_desc:0 "Our armies are gathering on the border. When this runs out, we attack."
 FOE_antagonist_strike_mission_brutal:0 "Strike on [FROM.GetName]"
 FOE_antagonist_strike_mission_brutal_desc:0 "Our armies are gathering on the border. When this runs out, we attack."
