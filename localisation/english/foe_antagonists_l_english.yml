l_english:
 foe_antagonists.1.t:0 "Storm on the Horizon"
 foe_antagonists.1.d:0 "WIP\n\nThe following AI nations have been chosen as your antagonists:\n\n§RRival:§! [?global.FOE_antagonist_rival.GetNameWithFlag], the closest of the three. We will meet them first.\n§dArchenemy:§! [?global.FOE_antagonist_archenemy.GetNameWithFlag], further out and far more dangerous.\n§GDistant Threat:§! [?global.FOE_antagonist_reserve.GetNameWithFlag], at the edge of the known wasteland.\n\nThey will grow while we grow. We had better be ready when they come."
 foe_antagonists.1.a:0 "We will be ready."
 foe_antagonists.2.t:0 "DEBUG: Antagonists"
 foe_antagonists.2.d:0 "Rival: [?global.FOE_antagonist_rival.GetTag]\nArchenemy: [?global.FOE_antagonist_archenemy.GetTag]\nDistant Threat: [?global.FOE_antagonist_reserve.GetTag]\n\nRerolling switches the system on (Hard) if it is off."
 foe_antagonists.2.a:0 "Reroll the Antagonists"
 foe_antagonists.2.b:0 "Toggle Brutal"
 foe_antagonists.2.c:0 "Log the Antagonists to game.log"
 foe_antagonists.2.e:0 "Clear the Antagonists and switch the system off"
 foe_antagonists.2.g:0 "Run the monthly update now (rubber band + expansion)"
 foe_antagonists.2.h:0 "Run the expansion timers out, then run the update"
 foe_antagonists.2.i:0 "Force Contact now (every Antagonist not in Contact yet)"
 foe_antagonists.2.j:0 "Force a first strike from the Rival (ignores every condition)"
 foe_antagonists.2.f:0 "Close"
 foe_antagonists.4.t:0 "Shadows on the Border"
 foe_antagonists.4.d:0 "WIP\n\nOur patrols bring the news we have been dreading: [FROM.GetNameWithFlag] now shares a border with us. Their scouts watch our outposts from the far ridges, and fresh earthworks are rising along the line.\n\nFor now the border is quiet. It will not stay that way."
 foe_antagonists.4.a:0 "Watch the border."
 foe_antagonists.5.t:0 "The Storm Breaks"
 foe_antagonists.5.d:0 "WIP\n\n[FROM.GetNameWithFlag] has thrown its armies across our border. They have been building towards this moment for years, and they chose their hour with care.\n\nEvery soldier we can spare must turn to face them."
 foe_antagonists.5.a:0 "Then we fight."
