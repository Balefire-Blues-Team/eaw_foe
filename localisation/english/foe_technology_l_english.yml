 ### Generic race techs
 tech_generic_misc:0 "Natural Magics"
 tech_generic_misc_desc:0 "Despite most creatures thinking only unicorns have magic, the truth is, every species has their own form of magic, which is expressed in different ways. Many species figured out over time how to turn their natural magics into greater productive capabilities."
 tech_generic_misc2:0 "Natural Senses"
 tech_generic_misc2_desc:0 "Many species in the world have senses that are better in one way or another compared to ponies. These senses would often allow for them to find treasures that ponies never would."
 tech_generic_misc3:0 "Natural Understanding"
 tech_generic_misc3_desc:0 "Via a bit of biological research, many species were able to find the minimum amount for them to eat. By finding this minimum, supplies could be better rationed out in times of need."
 tech_generic_misc_a:0 "Natural Strengths"
 tech_generic_misc_a_desc:0 "Many species adapted their living spaces to be easier built and to more easily accommodate their forms. From the tiny houses of Breezies to the large and easily built houses of the Minotaur, every species has their own unique architecture."
 tech_generic_misc_b:0 "Natural Sciences"
 tech_generic_misc_b_desc:0 "Via the understanding of a species' natural limits, natural magic, and strengths, many scholars could capitalize on this knowledge to find further, useful information."
 tech_generic_misc_c:0 "Natural Languages"
 tech_generic_misc_c_desc:0 "Many creatures have a mother tongue connected to their origins, even if they can speak Pony quite well. These original languages could often confuse any code breakers who didn't speak it."
 tech_generic_l:0 "Augmented Defenses"
 tech_generic_l_desc:0 "Many species would change their defensive lines to be different from those used by ponies, and more suited to their forms. They would also often have an easier time breaking into pony defenses, due to their shapes."
 tech_generic_l2:0 "Augmented Firearms"
 tech_generic_l2_desc:0 "Many species took the weaponry developed by ponies and changed its size to be better reflecting of their size. For Yaks and Minotaur, this would often mean making much larger weapons, and for other species, often smaller weapons."
 tech_generic_l3:0 "Augmented Vehicles"
 tech_generic_l3_desc:0 "Many Equestrian vehicles didn't quite work for species of larger size or different shape, causing many species to modify vehicles to fit them."
 tech_generic_l4:0 "Augmented Fortifications"
 tech_generic_l4_desc:0 "Forts, such as bunkers or outposts, needed to be shaped to fit the shape of the species using them. Often, this made them harder to attack into, given ponies were often the wrong size for them."
 tech_generic_l5:0 "Augmented Tactics"
 tech_generic_l5_desc:0 "Due to the different strengths and weaknesses of various species, many augmented their tactics to better cover their weaknesses and exploit their strengths."
 tech_generic_r:0 "Specialized Soldiers"
 tech_generic_r_desc:0 "Many species across the world have different forms of special forces which often make use of the unique strengths and weaknesses of those species,"
 tech_generic_r2:0 "Specialised Ships"
 tech_generic_r2_desc:0 "Many Equestrian ships needed to be changed to allow for other species to use them, and other species' ships often were differently shaped. Most famously were Deer Longships, whose slender shape gave them greater maneuverability."
 tech_generic_r3:0 "Specialised Planes"
 tech_generic_r3_desc:0 "Of course, many Equestrian planes couldn't fit other species either, and other species made their own designs better fitting to their unique shapes."
 tech_generic_r4:0 "Specialized Breaching"
 tech_generic_r4_desc:0 "Given the differences between species, the need came to develop different equipment and tactics for breaching enemy fortifications. Many differently sized breaching charges would result from this, used by creatures to make the smallest hole possible for them to fit through."
 tech_generic_r5:0 "Specialised Responses"
 tech_generic_r5_desc:0 "When enemies attack, different species have different reactions. While ponies engage in herd tactics and look to their leader, other species often would enter into what is called fight or flight, improving their individual responses."
