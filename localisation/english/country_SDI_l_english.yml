##################
### FOCUS TREE ###
##################
SDI_syndicate_armstrade
SDI_begin_operation:0 "Begin Operation"
SDI_begin_operation_desc:0 "The Scrapper Syndicate's support has allowed us to claim a portion of Princessyn, where our Disciples can admire the Balefire Shadows. Enemies surround us. We must be prepared to take this holy land."

SDI_assess_the_city:0 "Assess the City"
SDI_assess_the_city_desc:0 "The Scrapper-Syndicate will send out groups of Scavengers, scouts and engineers to judge the worth of the city and give a rough assessment of the wealth to be had here."

SDI_probe_the_border:0 "Probe the border"
SDI_probe_the_border_desc:0 "Our western border contains the perfidious Reds, and our east the surprise enemies, the ghouls and ghosts of the old world. We must assess their strength through probing attacks."

SDI_industrial_overhaul:0 "Industrial Overhaul"
SDI_industrial_overhaul_desc:0 "There is much wealth to be found in the abandoned industry, wealth that can turn into weapons, into trade, into understanding. We shall follow the Scrapper's desires, and overhaul the industry we find."

SDI_techno_espionage:0 "Techno-espionage"
SDI_techno_espionage_desc:0 "Many around us will be researching as well as we do. They are sure to have discovered things which we have not. We should not let this go to waste, instead, we should seek to take their understandings, and make them ours."

SDI_sacred_pilgrimage:0 "Sacred Pilgrimage"
SDI_sacred_pilgrimage_desc:0 "We are here for the Balefire Shadows, and we must ensure every new member knows exactly what we are doing here. We shall clear the way to some Balefire Shadows, and ensure it is a path that every faithful member must trot."

SDI_shadows_of_prophecy:0 "Shadows of Prophecy"
SDI_shadows_of_prophecy_desc:0 "With their prophecy revealed, many of the Disciples have given the vast majority of their worldly possessions to the Expedition, believing they won't need them much longer. With this cash, and the cultists happily performing what is basically slave-labor, we will improve our capital."

SDI_connect_the_plaza:0 "Clear out metro lines"
SDI_connect_the_plaza_desc:0 "The metros under our land are filled with mutants, ruins, and a few outposts of ghouls. We will clear out all of them, ensuring no threat comes from below, giving us supply lines that cannot be assailed."

SDI_apocalyptic_sermons:0 "Apocalyptic Sermons"
SDI_apocalyptic_sermons_desc:0 "It is time that we remind the Disciples why we are here to begin with. We have found an old radio transmitter, and shall use it to broadcast a sermon to all who will listen. Some will follow the call of the city."

SDI_mercenary_alliances:0 "Mercenary Alliances"
SDI_mercenary_alliances_desc:0 "The Talons, the third lever of power present in the country, serve as a manner of compromise between both sides. It is time we pay heed to the Talons, and hire a few more of them, that they can ensure conflict does not escalate between Scrapper and Disciple."

SDI_cultist_enclaves:0 "Cultist Agitators"
SDI_cultist_enclaves_desc:0 "Our cultists do not look any different than normal ponies, and with the swarm of ponies entering the city, they can easily filter inside our enemies. There, they can work with locals, and prepare the path for our arrival."

SDI_syndicate_armstrade:0 "Syndicate Arms-Trade"
SDI_syndicate_armstrade_desc:0 "In order to win the city, we need weaponry, and the Syndicate can provide more than enough weaponry, in exchange for our favor. Some Scrappers are invited to move in by the Syndicate, where they shall turn scrap into weapons."

SDI_salvage_monopolization:0 "Salvage-monopolization"
SDI_salvage_monopolization_desc:0 ""

SDI_drive_out_ghouls:0 "Conquer the False Army"
SDI_drive_out_ghouls_desc:0 "The ghouls, ghosts of the old world, do not understand us, they do not understand the modern world. They would seek to claim this holy land for their own purposes, we must show them that this land is ours, and ours alone."

SDI_balefire_zealots:0 "Balefire-Zealots"
SDI_balefire_zealots_desc:0 "We know what we fight for, and with our ever-growing forces, many can finally believe that what we fight for is possible. Nopony wishes to stand alone against the world, but we are herd creatures. And as our herd grows more and more, more shall stand with us."

SDI_city_wide_scrapyard:0 "City-sized Salvage yard"
SDI_city_wide_scrapyard_desc:0 "Princessyn is not a proper city, not anymore, rather it is but a large and towering collection of scrap, ready to be collected. Houses left abandoned, businesses long forgotten, those that are not remade shall be scrapped."

SDI_motorized_vanguard:0 "Motorized Scouts"
SDI_motorized_vanguard_desc:0 "While vehicles are unable to operate at maximum efficiency in the closed off and damaged streets of the city, they can still go faster than the average pony. We shall repair some vehicles and use them to improve our scouting capabilities."

SDI_seize_the_jewel:0 "Seize the Tower"
SDI_seize_the_jewel_desc:0 "It is time to secure the heart of the one who has long kept us from taking the city that is rightfully ours. The AI at the core of Princessyn has killed thousands. We will have vengeance."

SDI_fight_the_reds:0 "Fight the Reds"
SDI_fight_the_reds_desc:0 "Stalliongrad once tried to destroy Equestria, long ago, until the Princessee saw fit to protect their home, and put down the Revolution. These ponies are nothing but foals wearing symbols they do not understand. We shall see them destroyed."

SDI_pay_for_peace:0 "Pay for Peace"
SDI_pay_for_peace_desc:0 "The Syndicate claims that the way to any pony's heart is through caps, and though it doesn't hold true for the faithful, it does for the faithless. We shall allow the Syndicate to bribe those conquered, that they might join our holy forces."

SDI_technological_leap:0 "Technological leap"
SDI_technological_leap_desc:0 "Our investments have resulted in a useful outcome, as more scholars flock to our banners. Curious to study the Balefire as we are, they have been given a restored research lab, where they shall delve into the secrets of the old world."

SDI_wealth_for_syndicate:0 "Wealth for the Syndicate"
SDI_wealth_for_syndicate_desc:0 "The Scrappers are the true power backing our current expedition, and we owe our existence to them. We shall acquiesce to them, and give them all they desire, for the betterment of the nation."

SDI_funding_balefire_research:0 "Funding Balefire Research"
SDI_funding_balefire_research_desc:0 "The Disciples are the heart of our purpose here, seeking understanding of the messages left behind in Balefire. The Scrappers are helpers in this holy quest, nothing more."

SDI_access_trade_networks:0 "Access trade networks"
SDI_access_trade_networks_desc:0 "The river at the center of the city has long served as an artery for trade, and it shall serve as such once more. We shall send ships far, and receive ships as we can, and revive the life to these waters."

SDI_cleanup_operations:0 "Cleanup Operations"
SDI_cleanup_operations_desc:0 "Zebras, those who sent the Balefire, who destroyed the old plentiful lands of Equestria, taunt us from the north. Raiders, the worst example of new world excess, sit beside them, arrogant and crass. Both shall fall."

SDI_heretical_suppression:0 "Heretical Suppression"
SDI_heretical_suppression_desc:0 " We must ensure that none shall question the path we trot, unless said question is for the advancing of the path. Heretics, those who reject the goal of understanding, shall be silenced."

SDI_shadow_council:0 "Chosen by the Shadows"
SDI_shadow_council_desc:0 "The best and brightest of the Disciples have been gathered together into a council, and they have reaffirmed Umbral Zap's place at the top of all. We will work together to understand this world."

SDI_reverse_engineering:0 "Learn from our enemies"
SDI_reverse_engineering_desc:0 "The Scrappers have studied those we have fought since our arrival in the city. Though we have proven stronger than they, they still have things to learn from. The Scrappers offer this knowledge to us, in the spirit of cooperation."

SDI_coup_de_gras:0 "Coup de Gras"
SDI_coup_de_gras_desc:0 "The time has come, the city is under control. Now we must reckon with the choices made along the way. Shall the Disciples have their way, or shall the Syndicate come out on top?"



