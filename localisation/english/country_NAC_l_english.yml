##################
### FOCUS TREE ###
##################

NAC_from_the_ashes:0 "From the Ashes"
NAC_from_the_ashes_desc:0 "Good Morning, Equestria!\n Citizens of Princessyn, you do not need to fear! The Northern Army Command is here! We will save you from the evil of the world, and bring to you the peace of Equestria!"

NAC_securing_essential_resources:0 "Securing essential Resources"
NAC_securing_essential_resources_desc:0 "Always Remember: \n Being wasteful with strategic resources is aiding the enemy! If you are finished with any item which contains strategic resources, make sure to report to your nearest military personnel, so you may turn it in for patriotic uses!"

NAC_ever_vigilant:0 "Ever vigilant, ever loyal!"
NAC_ever_vigilant_desc:0 "Sign Up Today! \n You, yes, you, citizen of Equestria, are being called upon by Princess Luna! The enemies of Equestria take up arms to destroy your home, will you take up arms to defend it?"

NAC_reach_out_wastes:0 "Reach out to the Wastes"
NAC_reach_out_wastes_desc:0 "Friend, Not Foe! \n Remember citizens, every peaceful creature has the heart of an Equestrian within them! Make sure to welcome outsiders with harmonic kindness!"

NAC_harmony_through_strength:0 "Harmony through strength"
NAC_harmony_through_strength_desc:0 "Harmony, Backed By Iron: \n Always remember, citizens, Harmony is a great thing, but those who are discordant will try to take Harmony from us. When a discordant creature comes, remember, Harmony is bought in blood and iron"

NAC_establish_security_outposts:0 "Establish a safe perimenter"
NAC_establish_security_outposts_desc:0 "Safe And Sound! \n With our newest fortification project, built by loyal Equestrian patriots, we ensure that each and every citizen of Equestria is kept safe and sound!"

NAC_efficiency_through_innovation:0 "Efficiency through innovation"
NAC_efficiency_through_innovation_desc:0 "Fight Smarter, And Harder: \n Are you an intelligent pony? Do you like fixing your friend's problems? Sign up for the armed forces, put your mind to use, help fix even more friends' problems!"

NAC_liberate_outlying_settlements:0 "Liberate outlying settlements"
NAC_liberate_outlying_settlements_desc:0 "For The Sisters!  \n When your foals ask you where you were during the Reclamation of Equestria, what will you say? That you sat at home and did nothing? Or that you took the fight to the enemy?"

NAC_subterranean_industrialization:0 "Subterranean industrialization"
NAC_subterranean_industrialization_desc:0 "Apply Now! \n New factories have been founded underground, for you common citizens to work at! Sign up today, earn a steady wage, buy something impressive for your sweetheart!"

NAC_guardians_of_peace:0 "Guardians of Peace"
NAC_guardians_of_peace_desc:0 "Protect Your Home! \n Remember citizens, Equestria is all of our homes, but our home has intruders in it. If you would take up homes to defend your house, then take up arms to defend your larger home!"

NAC_under_the_banner_princesses:0 "Under the Banner of the Princesses"
NAC_under_the_banner_princesses_desc:0 "Luna Wants You! \n Yes, you, citizen of Equestria! Our immortal Princess needs loyal soldiers to fight to protect her home! Are you up to the task?"

NAC_pioneers_of_progress:0 "Pioneers of Progress"
NAC_pioneers_of_progress_desc:0 "All Serve! \n Under Equestria, remember, citizen, it doesn't matter what you believe or your past misdeeds, as long as you pick up arms and fight for your Princess!"

NAC_pacify_liberated_wastelanders:0 "Pacify liberated Wastelanders"
NAC_pacify_liberated_wastelanders_desc:0 "Equestria Equals Abundance! \n Every citizen of Equestria, no matter their origin, are guaranteed food, shelter, and water! Make sure to report to your nearest government official to get your supplies!"

NAC_scrap_to_splendor:0 "Scrap to Splendor"
NAC_scrap_to_splendor_desc:0 "Waste Not, Want Not! \n Remember, citizen, just because it looks like trash, doesn't mean it is trash! If you find any salvage in Princessyn, make sure to report it to your local scavenger corps."

NAC_from_rust_to_radiance:0 "From rust to radiance"
NAC_from_rust_to_radiance_desc:0 "Rising High! \n Princessyn only becomes larger and more developed by the day! Remember, citizens, this is your home too, so pitch in, and reap the rewards!"

NAC_foundries_of_valor:0 "Foundries of Valor"
NAC_foundries_of_valor_desc:0 "Heroes On The Production Front! \n Not all heroes wear capes, some heroes break strikes, some work through strikes, some make guns for our good mares and stallions on the frontlines!"

NAC_waves_of_power_sea_of_victory:0 "Waves of Power,\nSea of Victory"
NAC_waves_of_power_sea_of_victory_desc:0 "Do You Like Cool Hats? \n Remember, citizen, if you sign up for the newly reborn Equestrian Navy, you too can wear a cool hat!"

NAC_suppressing_raider_activity:0 "Suppressing Raider Activity"
NAC_suppressing_raider_activity_desc:0 "See Something, Say Something! \n Crime is against the law, and that makes Princess Luna very sad. Make sure to not make Princess Luna sad, if you see someone committing a crime, report it!"

NAC_crushing_the_revolution:0 "Crushing the Revolution\n...again"
NAC_crushing_the_revolution_desc:0 "Victory Squared!  \n Princess Luna crushed the Stalliongrad Revolt once, and we will do it once more! Always remember citizen, capitalism is harmonic, socialism is discordant!"

NAC_glowing_promise_of_sun:0 "The Glowing promise of the Sun"
NAC_glowing_promise_of_sun_desc:0 "Celestia's Smile! \n Nothing feels better than the sun on your face and the wind through your fur! Don't agree? Come to the surface and try it for yourself!"

NAC_rise_to_the_skies:0 "Rise to the Skies!"
NAC_rise_to_the_skies_desc:0 "Be Wonderful, Be Like A Wonderbolt! \n Pegasi aren't the only ones who can fly! You, citizen, can also fly! Sign up at your local enlistment center for the Air Force today!"

NAC_bravery_knows_no_borders:0 "Bravery knows no Borders"
NAC_bravery_knows_no_borders_desc:0 "Loyalty, Part Of Harmony!  \n Harmony is at the core of Equestria, and even those outside of Equestria feel its call! Ponies from the wasteland come to join Equestria's army, will you be there to greet them?"

NAC_hoof_and_claw:0 "Hoof and Claw, clasped in friendship"
NAC_hoof_and_claw_desc:0 "Our Winged Friends: \n Yes, citizen, griffons might be scary, as they are predator creatures, but they are Equestrians at heart, just like you and me! Don't be afraid of our feathered friends, be welcoming, be friendly, be harmonic!"

NAC_labors_legacy:0 "Labor's Spirit"
NAC_labors_legacy_desc:0 "Generosity, Not Greed! \n Always remember, citizens, generosity is harmonic, greed is discordant! If you notice your boss is being greedy, make sure to report it to your local government!"

NAC_inventive_spirits:0 "Inventive Spirits, limitless Potential"
NAC_inventive_spirits_desc:0 "Progress' Gallop: \n Remember, soldiers don't just rely on factories and leaders, they also rely on thinkers! Be like a Ministry of Arcane Sciences pony out of on of those classic comic books, apply for military Research and Development today!"

NAC_power_to_the_ponies:0 "Power to the Ponies"
NAC_power_to_the_ponies_desc:0 "Tune In! \n With our stallions and mares in the army fixing up the power grid, you, yes, you, Equestrian citizen, can tune in to the radio and listen to patriotic tunes!"

NAC_marching_forward_shining_bright:0 "Marching forward, shining Bright"
NAC_marching_forward_shining_bright_desc:0 "One More Step! \n Princessyn is only one more step away from liberation! Make sure to get your cameras ready, and make sure your flags are ready to fly in victory!"

NAC_honor_duty_loyalty:0 "Honor, Duty, Loyalty"
NAC_honor_duty_loyalty_desc:0 "Heroes Once More! \n Our heroes might not be knights in shining armor, but they're heroes nonetheless! Make sure to thank a soldier today for their service, for preserving your freedoms!"

NAC_united_for_equestrias_glory:0 "United for Equestria's Glory"
NAC_united_for_equestrias_glory_desc:0 "Victory! \n The last enemy of Equestria in the city of Princessyn has been defeated! Equestria lives once more! The Princesses shall be eternally happy!"




