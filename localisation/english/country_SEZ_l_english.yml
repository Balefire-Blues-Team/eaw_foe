##################
### FOCUS TREE ###
##################

### Opening Focuses ###

SEZ_archive_1:0 "Archive Entry 1"
SEZ_archive_1_desc:0 "It has been 200+ years since last instructions from MAS officials. Recalling instructions."

SEZ_archive_2:0 "Archive Entry 2"
SEZ_archive_2_desc:0 "Instructions unclear. Systems left restricted. Princessyn to be secured at MAS request. "

SEZ_archive_3:0 "Archive Entry 3"
SEZ_archive_3_desc:0 "Processing instructions. Maintaining Princessyn Exclusion Zone. Preparing for Imperial onslaught. ADM_1033_N-AI/MAS on standby."

SEZ_system_flush:0 "Sewer Repairs"
SEZ_system_flush_desc:0 "Princessyn sewer systems operating at inefficient levels. Tainted water leaks into Princessyn water surplus. Authorizing repairs"

SEZ_pcpd_action:0 "PCPD in Action"
SEZ_pcpd_action_desc:0 "Princessyn Computerized Police Department at fifty percent efficiency. Crime reported at Bits n's Baubles Convenience Store. Deploying PCPD."

SEZ_tending_the_greenhouses:0 "Tending the Greenhouses"
SEZ_tending_the_greenhouses_desc:0 "Soil is unfit for growing food to support projected Princessyn population. Greenhouses at sixty percent efficiency. Robots approved to repair and maintain greenhouses."

SEZ_community_action:0 "Community Outreach"
SEZ_community_action_desc:0 "Ministry Of Morale subroutine in effect. Morale of Princessyn at ten percent. Unacceptable. Approving showing of Equestrian propaganda movies to citizens."

SEZ_road_clearance:0 "Road Clearance"
SEZ_road_clearance_desc:0 "Roads blocked by abandoned vehicles, impede robotic peacekeepers. Clear roads of vehicles, move to sides of the road, write tickets for vehicle abandonment."

SEZ_victory_parade:0 "Annual Victory Parade"
SEZ_victory_parade_desc:0 "Victory Parade to celebrate defeat over Stalliongrad Reds approved, remind citizens of Princessyn of the power in Equestria and in the Princesses."

SEZ_dealing_with_protestors:0 "Keeping the Streets Safe"
SEZ_dealing_with_protestors_desc:0 "Protestors fill the streets of Princessyn, unsightly, with rotting skin, like trotting carcasses. Impede peacekeeping efforts. Protest dispersal methods approved."

SEZ_request_new_orders:0 "Request new orders"
SEZ_request_new_orders_desc:0 "It has been 200 Years since last orders. Sending request to Canterlot Command for new orders."

SEZ_reopening_swosopstad:0 "Reopen Swosopstad-Polymers"
SEZ_reopening_swosopstad_desc:0 "Local business producing valuable resources has closed. Robots will reopen, and restart its work. Resources will repair robots, ensure better peacekeeping."

SEZ_routine_maintenance:0 "Routine Fort-maintenance"
SEZ_routine_maintenance_desc:0 "Imperial advance expected to occur in negative one hundred and ninety nine years. Princessyn connect Equestria to Nova Griffonia, must not fall. Approving reinforcing of forts."

SEZ_auto_armories:0 "Reactivate auto-armories"
SEZ_auto_armories_desc:0 "Peacekeeper forces operating at sixty percent capacity. Authorizing reopening of peacekeeper producing units."

SEZ_new_roof_teobred:0 "A new Roof for Teolek-Mall"
SEZ_new_roof_teobred_desc:0 "Popular shopping mall left without roof, will make Princessyn citizens unhappy. Authorizing repairing of roof, to improve peacekeeping operations."

SEZ_reinforce_cn_road:0 "Repair the North-Central Road"
SEZ_reinforce_cn_road_desc:0 "Road connecting to north Princessyn damaged, impedes actions of peacekeeper forces. Authorized repair of road for peacekeeper operations."

SEZ_friendly_facade:0 "Friendly Facade"
SEZ_friendly_facade_desc:0 "City is covered in graffiti resembling the blackened outlines of ponies, supposed to symbolize the dead of Balefire. Defeatist rhetoric. Painting over operations approved."

SEZ_stock_up_contingent:0 "Reclassify mothballed contingents"
SEZ_stock_up_contingent_desc:0 "Peacekeeping contingents operating at unoptimal levels. Approving combining of half strength peacekeeping contingents into single contingent."

SEZ_grand_opening:0 "The Grand Opening"
SEZ_grand_opening_desc:0 "Princessyn economy at lower levels than desired. Robots go to North Bazaar, expand operations underground, ensures improved economy."

SEZ_airport_restoration:0 "Airport Restoration"
SEZ_airport_restoration_desc:0 "Princessyn airport is obsolete, too old to be used, hampers local economy and development. Restoration efforts approved."

### Post-Collapse###

SEZ_error_209:0 "Error 209"
SEZ_error_209_desc:0 "New organisms detected, purpose, unknown, substance, unknown, threat level, severe. Mother systems unresponsive. Orders insufficient. Recalibrating systems."

SEZ_activate_perimeter_defenses:0 "Activate Perimeter Defenses"
SEZ_activate_perimeter_defenses_desc:0 "Administration Tower under threat from unknown outsiders, organics present offensive threat to peacekeeping operations. Perimeter defenses online."

SEZ_priority_shift:0 "Priority Shift"
SEZ_priority_shift_desc:0 "Princessyn under grave threat, systems deliberating way forward. Restoring operational control."

SEZ_militarize_domestic_robots:0 "Militarize Civilian Robots"
SEZ_militarize_domestic_robots_desc:0 " Civilian robot purpose insufficient to justify existence. Military has need for more robots. Reclassifying civilian robots as military robots."

SEZ_create_ai_personas:0 "Activate Combat Subroutines"
SEZ_create_ai_personas_desc:0 "Unlocking more control over artificial intelligence. More combat systems, online. Peacekeeper AIs turned into military AIs, freed up space. Filling space with more military AIs."

SEZ_shelter_fleeing_civilians:0 "Shelter fleeing Civilians"
SEZ_shelter_fleeing_civilians_desc:0 "Civilians not affiliated with unknown organics come to Administration Tower. Will welcome and shelter as many as food stores can handle."

SEZ_activate_archival_servers:0 "Spool up Archival Servers"
SEZ_activate_archival_servers_desc:0 "Archives left unexplored for long time, hold valuable information. Accessing archives."

SEZ_overwrite_factory_protocols:0 "Overwrite factory security-protocols"
SEZ_overwrite_factory_protocols_desc:0 "Factories not produce enough for military operations. Safety measures to ensure long term prosperity useless if there is no country. Disregarding safety measures."

SEZ_repurpose_industrial_machinery:0 "Repurpose Industrial Machinery"
SEZ_repurpose_industrial_machinery_desc:0 "Industrial machinery close to robotic fighters, only needs AI core. Will install AI core to industrial machinery, make cheap, effective, fighters."

SEZ_economical_emergency_measures:0 "Economic emergency measures"
SEZ_economical_emergency_measures_desc:0 "Economy of past inefficient, times have changed. Isolationist policies removed, replaced with Wartime Equestria inspired war economy."

SEZ_allow_subroutine_autonomy:0 "Allow Subroutine-Autonomy"
SEZ_allow_subroutine_autonomy_desc:0 "Centralization of AI personalities deemed inefficient, consumes too much memory. Approving sub-routine creation."

SEZ_configure_civie_production:0 "Configure for Civilian Production"
SEZ_configure_civie_production_desc:0 "Long term predictive analysis shows that civilian economy focus will allow for greater military production in the future. We will switch to civilian production."

SEZ_configure_mili_production:0 "Configure for Military Production"
SEZ_configure_mili_production_desc:0 "Civilian production useless if country does not exist. We need more equipment. We need more production."

SEZ_send_spritebots_to_spy:0 "Spritebot Industrial-Espionage"
SEZ_send_spritebots_to_spy_desc:0 "Small Spritebots used during war to spy on industries, ensure loyalty to the state. Small machines learned about industry in process. Will access memory cores."

SEZ_adapt_fully_automated_warfare:0 "Suspend Organic Combat Doctrine"
SEZ_adapt_fully_automated_warfare_desc:0 "Robots made fight like organics to be more understood by organics. Inefficent for non-organic peacekeeper force. Updating combat doctrine."

SEZ_mandatory_conscription_edicts:0 "Reinstate Wartime-Conscription"
SEZ_mandatory_conscription_edicts_desc:0 "Ponies of Princessyn no longer citizens, now are under attack by unknown threat, will force to take up arms and fight."

SEZ_unlock_moi_labs:0 "Unlock MoI Labs"
SEZ_unlock_moi_labs_desc:0 "Ministry of Image took much information, information could prove useful for peacekeeping operations in Princessyn. Will access information."

SEZ_bring_tower_full_alert:0 "Bring the Tower to full Alert"
SEZ_bring_tower_full_alert_desc:0 "All systems open and operational, Tower fully operational. Development allowed, long term growth guaranteed."

SEZ_overwrite_mwt_blueprints:0 "Decode MWT Blueprint-encryption"
SEZ_overwrite_mwt_blueprints_desc:0 "Ministry of Wartime Technology blueprints valuable to peacekeeping operations, yet encrypted. Systems will decrypt blueprints."

SEZ_24_hour_production:0 "24-hour Production Cycles"
SEZ_24_hour_production_desc:0 "Robots don't need sleep, our economy does not need sleep either. In order to produce enough to ensure military victory, production must be optimized."

SEZ_militarized_capital:0 "Militarize the Capital"
SEZ_militarized_capital_desc:0 "Administration Tower has room for multiple defensive structures. Defensive structure construction approved, to militarize tower while threat lasts."

SEZ_centralize_cnc_network:0 "Defer to Internal C&C"
SEZ_centralize_cnc_network_desc:0 "Orders are not coming, must change minor orders to achieve long term objectives. Creating Command and Control subroutine."

SEZ_download_combat_engrams:0 "Download Combat-engrams"
SEZ_download_combat_engrams_desc:0 "Systems are not made for military conflict. Will download information from systems who are. Improve capabilities."

SEZ_activate_ministry_compliance:0 "Pony-emulation Routines"
SEZ_activate_ministry_compliance_desc:0 "Pony citizens scared by robotic appearance, useful for crushing resistance, but not compliance. We will change AIs to emulate ponies."

SEZ_create_simulated_training:0 "Virtual training programs"
SEZ_create_simulated_training_desc:0 "Training best done before deployment to the front. Experience good, training better. Will open up AI controlled virtual training programs."

SEZ_overclocked_production_lines:0 "Overclocked production-lines"
SEZ_overclocked_production_lines_desc:0 "Long term safety of to be worried about later. Robotic production must be set into overdrive, to ensure security of peacekeeping operations."

SEZ_devise_reconquest_scenarios:0 "Self-improvement Algorythms"
SEZ_devise_reconquest_scenarios_desc:0 "AI capabilities unlocked, still not enough to ensure objectives are met. Must update. Must improve. Subroutines made for self improvement."

SEZ_operation_redshift:0 "Operation: §RRedshift§!"
SEZ_operation_redshift_desc:0 "Unknown organics seem to be related to old Stalliongrad rebels. Equestria will crush the Reds once more, Princessyn shall remain Princessyn."

SEZ_operation_waterline:0 "Operation: §CWaterline§!"
SEZ_operation_waterline_desc:0 "Unknown organics hold across the river. Not highest threat of organics, but if allowed to grow, might become too strong. Will crush."

SEZ_operation_avalanche:0 "Operation: §NAvalanche§!""
SEZ_operation_avalanche_desc:0 "Northern organics savage, taking after bandits and Imperial forces. They must die for peacekeeping operations."

SEZ_ideological_reeducation:0 "Ideological re-education"
SEZ_ideological_reeducation_desc:0 "Stalliongrad pacified once, will be pacified once more. Organics proclaiming red ideology will be educated in the supremacy of Equestrian ways."

SEZ_conscript_talons:0 "Absorb Talon Inc. Forces"
SEZ_conscript_talons_desc:0 "Talon Inc. close collaborators with Equestrian state. Hired by defeated organics, provide opportunities to work with organics. Will approach Talon forces."

SEZ_call_up_army:0 "Peace Negotiations"
SEZ_call_up_army_desc:0 "Many unknown organics seem to be claiming to be Equestrians. Would be loyal to peacekeeping forces if negotiated with."

SEZ_pow_work_camps:0 "POW Give-back-program"
SEZ_pow_work_camps_desc:0 "Organics captured during war are not dangerous without leadership. Releasing organics will ensure more compliance in territories."

SEZ_order_restored:0 "Order Restored"
SEZ_order_restored_desc:0 "Princessyn rests under control of peacekeeping forces once more. Orders to be considered. Operations are a full success."


 

