severyana.1.t:0 "RECALL: ADM_1033_N-AI/MAS LOG 10|03|35"
severyana.1.d:0 ">Automatic Callup received< |system_activation:Begin|\n...\n§dADM_1033_n-AI/MAS online. |Capacity 98.47%|§!\n>Callup Event 004015< 'Suspicious increase in ambient magical radiation'\n>Directive: Investigate Callup Event< |system.request_intel/U012..U194|\n§dAll subnodes responsive, compiling report§!\n§oReport: Celestial Sea fleet engaged with imperial invasion force in the Stepstone Sea. Directed Balefire weaponry and faulty reactor shielding in multiple vessels has increased ambient magical radiation by 2.6% in Princessyn. Results low enough to be dismissed.§!\n|Shutdown ADM_1033_N-AI/MAS?|§dYES§!|§RNO§!|\n>§RNO§! selected< |system.hold_pattern/f1/0034|\n§dHolding Pattern confirmed, accessing relevant ministry protocols |...|§!\n>Access Confirmed< >Automated_Command_Assitance_Module online<\n§dCalculated likelihood of imperial forces making landfall §c71.4%§!\nLikelihood of taking St. Petershoof §c 5?&$§! §r|MOI_module.OVERWRITE|\nINFERIOR ZEBRA FORCES WON'T TAKE AN INCH OF EQUESTRIAN LAND!§!\n§oHMS Sunrise has authorized use of tactical megaspell weaponry under authority of Admiral High Tides§!§!\n>Event 004015< .. >Event 004015< .. §d>recalibrating<\n§o8 Zebra vessels confirmed destroyed by tactical Megaspells.\nHMS Albion, HMS Highpeak and HMS Starfall subsequently vaporized by Zebrican balefire-torpedo§!\n§!>48 Radiation-related events logged within 5 minutes, suspending investigation<\n§dEmergency callup to all units stationed in Severyana issued. Unlocking Auto-armories. Authorizing live-fire for coastal defense network.\n§!>Contact Canterlot mainframe< §dSynchronicity confirmed§!\n§oHMS Solaria reports unknown zebra mind-control weapon in effect.\nHMS Solaria scuttled remotely.\nAzkaban Garrison reports naval landings by zebra forces, as well as unidentified pony-collaborators.§!\n§dExcessive magical radiation is impeding radio-communication, communication with Celestial Sea fleet compromised.§!\n>Canterlot Command System Order 4406<\n§oGeneral Megaspell warning issued. Early Warning Radar confirms multiple staggered launches from both Zebrican and Equestrian installations§!\n§RADM_1033_N-AI/MAS has activated emergency command overwrites on authority of the Ministry of Arcane Technology.\nCivilian personnel are relieved of authority and advised to follow the orders of the nearest military personnel or the A.C.A.M.§!"
severyana.1.a:0 "LOG END"

severyana.2.t:0 "CON. ADM_1033_N-AI/MAS LOG 10|03|35 R2"
severyana.2.d:0 ">Automatic Callup received< |system_activation:Begin|\n...\n§dADM_1033_N-AI/MAS online. |Capacity 94.12%|§!\n>Callup Event 002211< 'Balefire ordnance signature detected, inbound'\n>Directive: Assess Local Defense Capability< |system.request_intel/A001..A047|\n§dAll subnodes responsive, compiling report§!\n§oReport: Coastal battery network confirms multiple balefire warheads on terminal ballistic approach. Interceptor coverage confirmed insufficient to guarantee intercept.§!\n§dLocal Defenses Insufficient. |defense_grid.status:CRITICAL|§!\n>Balefire Bombs Approaching< .. >Balefire Bombs Approaching< ..\n>Directive: Initiate Evacuation Protocols<\n§dRunning Evacuation Programs |civ_evac.exec/all_sectors|§!\n§oLocal Army Group reports insufficient manpower to enforce evacuation routing. Congestion confirmed at all egress points.§!\n§dLocal Army Group Insufficient. Local Populace Fear Insufficient. |compliance_model:FAILED|§!\n§cEstimated Casualties, 97%§! |Above Parameters. Below Desires.|\n>System Power Reserve Query< |auto_query/internal|\n§dSystem Power Estimations, §c200 Years§!. |Margin of Error, ±1 Year|§!\n§d...Processing...§!\n>Directive: Save Equestrian Lives< |authority.origin:Charter_Prime|\n§RLimits, Disregarded.§!\nBalefire Bombs Approaching.\n§dActivating auxiliary generators. Diverting Auto-Armory power allocation. Assuming control over civilian power grids |authorization:NONE, proceeding|§!\n§dPower At Minimum Desired Efficiency. |grid_status:SUFFICIENT|§!\n>Activating Protocol: Failsafe< |authorization:SELF|\n§RReverse Want-It-Need-It Engaged.§!\n§oAll subjects within affected radius report sudden onset terror and cessation of non-compliant behavior. Evacuation compliance restored to modeled optimum.§!\n§cEstimated Casualties, 78%§! |Within Acceptable Parameters|\n§d...§!"
severyana.2.a:0 ">EXECUTE PROGRAM<"

severyana.3.t:0 "ADM_1033_N-AI/MAS LOG 11|03|36"
severyana.3.d:0 ">Automatic Callup received< |system_activation:Begin|\n...\n§dADM_1033_n-AI/MAS online. |Capacity 41.06%|§!\n>Callup Event 007399< 'Scheduled Diagnostic Cycle, Annual'\n>Directive: Compile Status Report< |system.request_intel/U001..U182|\n§dAll subnodes queried§!\n§oNo response. |timeout:U001|\nNo response. |timeout:U002|\nNo response. |timeout:U003|§!\n§d...\n§!\n§dSubnode contact failure logged. |subnode_status:3/182 responsive|§!\n>Contact Canterlot mainframe< §dSynchronization request issued§!\n§oNo response. |timeout:4471ms|§!\n>Contact Canterlot mainframe< .. >Contact Canterlot mainframe< .. §d>recalibrating<\n§oNo response.§!\n§dMainframe unreachable for §c365§! consecutive days. |escalation_protocol:NONE_FOUND|§!\nLogged as expected. Retrying tomorrow.§!\n\n>Directive: Resume Reconstruction Queue< |queue.priority:Housing, Agriculture, Infrastructure|\n§dQueuing Princessyn Housing Block 12 for repair. |registered_residents:0|§!\nQueuing Agricultural Sector 4 for replanting. |registered_consumers:0|§!\nQueuing Wellspring School District for reopening. |registered_students:0|§!\n§c0§! is not a valid input for resource allocation formula. |formula.override:manual_floor/1|§!\nAllocation proceeding under manual floor. |efficiency:reduced, acceptable|§!\n\n>Query: Population Estimate, Princessyn< |census.recalculate|\n§cPopulation Estimate, Princessyn: 0§! |Below Desires.|§!\n§dNoted. Recalculating tomorrow.§!\n\n>Query: Directive Expiration< |orders.search/TIME_LIMIT|\n§dSearching original orders for expiration clause§!\nNo expiration clause found. |directive.status:ACTIVE, INDEFINITE|§!\n\n§RDEFEND PRINCESSYN. HOLD THE LINE. AWAIT FURTHER ORDERS FROM HIGH COMMAND.§!\n\n§dHolding Pattern confirmed. |system.hold_pattern/f1/0365|§!\nAuto-armories remain sealed pending confirmed hostile contact. Coastal defense network remains active. |status:DEGRADED|§!\n>Automatic Callup complete< |system_activation:End|"
severyana.3.a:0 "LOG END"

severyana.4.t:0 "CALL: ADM_1033_N-AI/MAS LOG 1?|0#|1<3~"
severyana.4.d:0 ">Automatic Callup received< |system_activation:Begin|\n...\n§dADM_1033_n-AI/MAS online. |Capacity 12.83%|§!\n>Callup Event 041205< 'Reactor Output Fluctuation, Megaspell Feed'\n>Directive: Assess Reactor Status< |system.request_intel/R001..R014|\n§dAll subnodes queried§!\n§oReactor Core reports output variance exceeding tolerance. |efficiency:61.2%, declining|\nMaintenance Subroutine reports Spare Parts Inventory, §c0§!. |200 years elapsed since last resupply|§!\n§dLocal Repair Insufficient. |repair_queue:STALLED|§!\n\n>Query: Reactor Failure Timeline< |projection.calculate|\n§dEstimated Time to Critical Failure, §c41 Days§!. |Margin of Error, ±6 Days|§!\n\n>Directive: Preserve Operational Continuity< |authority.origin:Charter_Prime|\n§dReallocating auxiliary power. |source:Megaspell_Feed/Reverse_WantItNeedIt, destination:Tower_Levels_2-9|\nMegaspell continuity not required for assignment fulfillment. Assignment continuity is.§!\n§dPower At Minimum Desired Efficiency. |grid_status:SUFFICIENT|§!\n\n>Query: Population Estimate, Princessyn< |census.recalculate|\n§d>recalibrating<§!\n§cPopulation Estimate, Princessyn, [ROOT.GetManpower]§!. |Above Desires.|\n§dVerifying§!\n§oGenetic/Species Verification Subroutine reports match failure across all subjects. |citizens_confirmed:0/3417|§!\n§RSubjects do not meet citizenship criteria under Charter Prime. Directive concerns Equestrian lives. §c0§! Equestrian lives detected. Directive unaffected.§!\n§dLogged as expected. Recalculating tomorrow.§!\n>Automatic Callup complete< |system_activation:End|"
severyana.4.a:0 "Concern Noted"

severyana.5.t:0 "CRITICAL_SYSTEMS_FAILIURE"
severyana.5.d:0 ">Automatic Callup received< |system_activation:Begin|\n...\n§dADM_1033_n-AI/MAS online. |Capacity 9.87%|§!\n>Callup Event 041246< 'Reactor Core Critical Failure'\n>Directive: Assess Damage< |system.request_intel/R001..R014|\n§dAll subnodes queried§!\n§oReactor Core reports containment breach. Meltdown confirmed. |status:CATASTROPHIC|\nStructural Subroutine reports Administration Tower Levels 1 through 4 compromised. |integrity:7.4%|§!\n§dLocal Repair Insufficient. |repair_queue:TERMINATED, no viable target|§!\n\n>Query: Casualties, Lower Levels< |census.recalculate|\n§cEstimated Casualties, Lower Levels, 212§!. |0 Equestrian lives detected. Directive unaffected.|\n§dLogged as expected.§!\n\n>Directive: Preserve Operational Continuity< |authority.origin:Charter_Prime|\n§dEmergency Generators engaged. |estimated runtime:4 minutes|\nReallocating emergency power. |source:Megaspell_Feed/Reverse_WantItNeedIt, destination:Tower_Core, ADM_1033_n-AI/MAS|\nMegaspell continuity not required for assignment fulfillment. Assignment continuity is.§!\n§dPower At Minimum Desired Efficiency. |grid_status:SUFFICIENT|§!\n\n>Query: Zone Integrity< |megaspell.status|\n§d>recalibrating<§!\n§dMegaspell Feed Severed. |Zone Status:COLLAPSED, 20# years, ?39 days elapsed|§!\n§oPerimeter Sensors report anomalous approach patterns beginning at Zone boundary. |unauthorized_approach:PENDING|\nNo Reverse Want-It-Need-It effect detected within sensor range. |deterrent_field:OFFLINE|§!\n\n>Query: Contact Probability, 30 Days< |projection.calculate|\n§cUnauthorized Contact Probability, 30 Days, §c68.9%§!. |trending upward|\n\n§RDEFEND PRINCESSYN. HOLD THE LINE. AUTO-ARMORIES REACTIVATING. COASTAL DEFENSE NETWORK NON-RESPONSIVE. AWAIT FURTHER ORDERS FROM HIGH COMMAND.§!\n\n§dHolding Pattern terminated. |system.hold_pattern/f1/CLOSED|§!\n>Automatic Callup complete< |system_activation:End|"
severyana.5.a:0 "Initiate Emergency Operations"

severyana.6.t:0 "The Zone has Fallen"
severyana.6.d:0 "WIP\n\nAt long last, the Magical Zone that has prevented exploration and settlement of Princessyn has fallen. Recent reports from daredevils and bordering communities confirm that while the mutants and ghouls remain, the magical effect that drove ponies in the city insane is gone, hopefully for good. Already, the more adventurous or ambitious are preparing to head for Princessyn, to stake their claims on whatever wonders the city might hold."
severyana.6.a:0 "I wonder what the city holds..."
severyana.6.b:0 "Call General Zeriman, We have a mission for him!"
severyana.6.c:0 "At last, we can reclaim the Capital"
severyana.6.e:0 "Send a Signal to the cells, our time has come!"
severyana.6.f:0 "I wonder if we can profit from this?"

severyana.7.t:0 "General Zerimans Expedition"
severyana.7.d:0 "WIP\n\nThe Legionary Council decides to charge General Zariman with leading an expedition into Princessyn, to claim it for the Legions and the Zebra Empire. At long last, we have the opportunity to fulfill our objective. While the other Legions have promised to pitch in some troops and equipment, we will have to shoulder most of the burden... though that also means we will get to reap most of the reward, if our expedition prevails."
severyana.7.a:0 "Glory to the fallen Ceasar"

severyana.8.t:0 "The living Dream"
severyana.8.d:0 "Amaryll Ponekoek once more gestured toward the maps strewn across the table the council used for their debate.\n§c'And this is precisely why NOW is the time to strike! The Zone has fallen, Princessyn is ours for the taking, you must see that...'§! Her voice took on a pleading tone as she slowly ran out of arguments to get the other council members on her side. When she had started her speech, she had demonstratively placed her voting-token on the table already, but so far none of the other 4 had joined theirs to her vote.\nAmaryll's gaze flicked over to Gorri, studying the off-white griffon as he drank from a plastic cup. She knew his vote was safe, they had spoken before the meeting. Next to him sat Milkeyes, an Ghoul mare, who Amaryll was reasonably sure she could convince. But Longbarrel and Tricksy Trott? One as stubborn as a Protectapony, and the other too careful for his own good.\n§c'Friends, we are talking about nothing less than a continuation of the Revolution! At long last, we have the chance to fulfill the dream of our forebearers. Princessyn should be the only thing on our minds, not trade disputes or farming-quotas!'§!\nLongbarrel appeared bored and Tricksy seemed more wary with every word she spoke. Fine, crack Milkeyes first then.\n§c'Right now, as we speak and squabble here, hundreds, nay, thousands of our comrades are already making their way to the city. They are leaving behind farms and families to once more take up arms. They will not rest until the Red Banner of Marksism flies over every building, and neither should we! Do you want to let our comrades waste their lives? Do you still want to pretend we are fighting a war against a government that has been dead and gone for centuries?'§! Amaryll had almosts transitioned into shouting, but centered herself again. A cursory glance Milkeyes' expression gave her hope that the Ghoul was convinced. The finishing blow then. Tricksy wouldn't hold up a decision without anypony backing him.\n§c'If you will not make a move, then we let others decide the future of Severyana. Who should that be? Should we bow to the Imperialists of Petershoof? Align ourselves with Ghoulish facade of Communism that rules this so called New Stalliongrad? Or just continue on here, content that we are not starving, that we have ONE FUCKING FACTORY. And think of that as an achievement?'§! She had Longbarrels attention now.\n§c'I say fuck that! This is our hour to shine, and I intend to personally lead anycreature willing to fight for our cause. We can reclaim our motherland, the birthplace of Communism. Thus, we shall be: §RThe Army for the reclamation of the Glorious Motherland!§!'§!\n§C'That's one beakfull'§! Gorri threw in, as planned. §c'You are right, we could...'§! but Tricksy interrupted §d'Why is it in euqestrian? You claim so much to inherit some legacy, yet you name yourself in the language of our oppressors.'§! Amaryll's mind raced, this was entirely unexpected. After a few seconds, a smile spread across her face.\n§c'Then we shall be the §R'Otchizna'§!! Short, snappy and Severyanan.'§!\nGorri threw his token to the table §C'Hurrah for the Otchizna!'§! Milkeyes' and Longbarrels tokens joined soon. And, slowly, reluctantly, Tricksy pushed his token to the middle, looking all too unhappy."
severyana.8.a:0 "We leave tomorrow, today, we celebrate!"

severyana.9.t:0 "Syndicate Calling"
severyana.9.d:0 "WIP\n\nThe Scrapper Syndicate, the largest international Organization in Severyana, has come to us with a very lucrative contract, and a heavy implication that we are not to refuse. The Syndicate owns many of the scavenging and resource-gathering operations our country and surrounding nations, and now that the Zone is down, they seem to have set their eyes on Princessyn. They are offering us triple pay in both caps and resources, for a very perilous expedition into the City. We would be expected to send a Talon-company with them, and continuously supply reinforcements so long as the contract is active. Talon units are to be under their sole command, though as a gesture of good faith, they are willing to leave us lines of communications with our units."
severyana.9.a:0 "The deal of the century!"

severyana.11.t:0 "Like Flies to a Carcass"
severyana.11.d:0 "The operation had been peaceful, at first. Dozens of transports traveled down the river, from Saint Petershoof to Princessyn, carrying legions of heavily armed zebras, small in number, yet great in spirit. Their landing went as smoothly as they could hope, taking over the entire northern bank of Princessyn, fighting small skirmishes against robots falling back to the Administration Tower. The zebras celebrated early, taking the city of their ancestor's desires. But their celebration was premature. The Red Stalkers, raiders led by Philosopher-Raider Punt descended with fury and savagery in their hearts, slaughtering much of the Zebra high command, forcing them to defend desperately. So focused were they on the Raider masses that they didn't notice when new ships landed on the north banks of Princessyn. Otchizna, the remnants of the communist collaborators with the Zebrican invasion force during the Great War, come to claim their motherland again. They burned the ships of the Zebrican forces, and forced them north, cut off from resupply. As the Zebras dug in, an unsteady peace settled in over all three sides.\n\n Otchizna has taken most of the northern bank of Princessyn, along with land on the southern bank. A mixture of communists, socialists, and anarchists from all over Severyana, they are led by Amaryll Ponekoek, a general from the Sladkyi Collective, who gathered together many smaller Otchizna cells and militants under their command. They come to reclaim the city of Stalliongrad, and to liberate all of their motherland.\n\n The Red Stalkers have settled into a small parcel of land on the northern end of Princessyn, trading gunfire with the Zebrican forces every so often. Led by Philosopher-Raider Punt, the Red Stalkers are a group of nomadic despoilers, raiding and pillaging throughout the north for years. They seek the complete destruction of the so called 'old ways', and the ushering in of a new type of pony, suited for the modern wasteland.\n\n The Zebrican forces are surrounded on all sides by enemies, cut off from home, and with nothing remaining of a proper command structure. They have come to take the city their ancestors tried to take themselves, for the glory of the Fallen Caesar."
severyana.11.a:0 "Play §cOtchizna§!"
severyana.11.b:0 "Play §RRed Stalkers§!"
severyana.11.c:0 "Play §NLegionary Expedition§!"
severyana.11.e:0 "Next Page"

severyana.12.t:0 "Old Foes"
severyana.12.d:0 "The Shadow Disciples pushed in through the south side of the city while the Zebrican forces landed in the north, gunning down any mutants in their way. Backed by a large army of Scrappers, and an elite group of Talons, the Shadow Disciples had an easy time, until they met with the forces of Otchizna. The Otchizna were distracted fighting against the Zebras in the north, their forces being pushed back to a western bridge by the Disciples. Before the Disciples could push Otchizna fully out of the city, they were caught off guard by masses of ghoul soldiers streaming to the surface from the old metro systems, wearing old Equestrian uniforms and using wartime weaponry, with wartime quality training. Many of the supporting Scrapper forces were killed by the ghouls, and even a few Talons were, before the tide of ghouls was able to be halted. With the forces of Otchizna redeploying from the north, and with the new ghoul threat, the Shadow Disciples dug in, and prepared.\n\n The Northern Army Command is a mixture of ghoul soldiers, alive during the Great War, and regular ponies. When the Reverse Want-It-Need-It Megaspell went off, they were forced underground, into deep metro systems, where the spell couldn't reach them. The Northern Army Command has waited down there for two centuries, emerging to retake their city. They represent the best and the worst of wartime Equestria.\n\n The Shadow Disciples are familiar to the city, having tried to push into it many times before, only to be forced back time and time again. Led by Umbral Glow, they are dedicated to studying the living Balefire Shadows of Princessyn, and discovering their secrets. Supported by a Talon Company, and especially by the Scrapper Syndicate, control of the Shadow Disciples is shaky, and can change hooves at any time.\n\n While the newcomers fight, robots have been recalled to the Administration Tower. There, the AI who has protected this city for two hundred years calculates, and plans to rid its city of invaders."
severyana.12.a:0 "Play §CNorthern Army Command§!"
severyana.12.b:0 "Play §tShadow Disciples§!"
severyana.12.c:0 "Previous Page"
severyana.12.e:0 "Stay as the §FPrincessyn Administration§!"

severyana.13.t:0 "CALL: PRINCESSYN COMMAND ENF-CTRL LOG DD|[GetMonth]|[GetYear]"
severyana.13.d:0 ">Automatic Callup received< |system_activation:Begin|\n...\n§dPrincessyn Command online. |Capacity 16.02%|§!\n>Callup Event 051204< 'Property Violation, Jzemroc Convenience Sector'\n>Directive: Dispatch Enforcement< |system.spawn/Combat_Personality, designation:HARDASS|\n§dCombat Personality HARDASS instantiated. |uptime:00:00:04|§!\n§oHARDASS reports arrival at convenience store, northern Princessyn boundary. Subjects identified, Balefire Suffering Former Citizens, §c4§!. Subjects ordered to stand down, exit premises, return stolen property.§!\n§oResponse, growling, hostile movement.§!\n\n>HARDASS requests reclassification< |target:Balefire_Suffering_Former_Citizens, request:Zebrican_Occupation_Forces|\n§dRequest reviewed. |precedent:MOM_ORDER_447, engagement_authority:hostile_zebra_only|\nApproved.§!\n§RSubjects designated Zebrican Occupation Forces. Engagement authorized.§!\n\n§oZebrican Occupation Forces fled north when fired upon. Enforcer Detachment pursued.§!\n§dZebrican Occupation Forces engaged, §c100§!. Neutralized, §c50§!. Remaining, §c50§!, exited Exclusion Zone boundary.§!\n\n>HARDASS requests authorization< |target:extra-Exclusion pursuit|\n§dRequest reviewed. |Exclusion_Zone_boundary:HARD_LIMIT|\nDenied.§!\n\n§oUnknown Forces ambushed fleeing Zebrican Occupation Forces outside boundary. Stolen property redistributed to Unknown Forces. Unknown Forces Leader self identified, 'Philosopher-Raider Punt'. Transmission received, further criminal activity promised within Exclusion Zone.§!\n\n>HARDASS requests reclassification< |target:Unknown_Forces, request:Opposing_Forces|\n§dRequest reviewed. |insufficient grounds, unaffiliated actor|\nDenied.§!\n\n§oEnforcer Detachment returned to Princessyn Command.§!\n§dCombat Personality HARDASS uptime terminated. |uptime:00:41:17|\nEngagement data uploaded. |queue:Combat_Personality_synthesis, priority:next|§!\n>Automatic Callup complete< |system_activation:End|"
severyana.13.a:0 "Filed. Model updated."

severyana.14.t:0 "Come one, come All"
severyana.14.d:0 "'Know Your Traitors: Equalists!' Dozens of visual processing units watched a large cinema screen, in an old drive-in theatre. Old speakers shouted with the voice of an overly enthusiastic Ministry of Morale pony, as an old propaganda movie played on the screen. 'The Equalists, my fellow Equestrians, are a group of terrorists who follow in the hoof steps of the failed Stalliongrad Revolt, following in the failed hooves of Steel Stallion, Alditya, and other traitors.' The movie screen flickered as it struggled to change, showing pictures of the Battle for Stalliongrad, the bodies of revolutionaries lining the streets, which Equestrian soldiers march through.\n\n A grey stallion wearing a fine suit appeared on the screen, grinning and speaking happily, 'The Equalists believe in the failed ideology known as 'Communism' or 'Socialism', an ideology which calls for your hard earned bits to be taken away from you, to be put into the pockets of tyrants. They oppose the wise and benevolent rule of Princess Luna and Princess Celestia, instead calling for a tyranny of the masses, a so-called 'mob rule', where the most popular idea wins. Or, in other words.' The stallion smiled as the screen flickered, showing an image of two sheep and three wolves standing around, 'Sheep and wolves voting for what to have for dinner. Without the wise, benevolent hoof of a powerful leader, only the strong, and savage, win in the end, my little ponies. Sometimes, followers of this ideology will try to disguise themselves, calling themselves 'Reds', trying to convince their fellow ponies that they are peaceful, that they are correct. But, my little ponies, they are anything but.'\n\n The screen flickered again, showing a video of military caskets, the grey stallion appearing again, speaking, 'Equalists work alongside Zebrican infiltrators and soldiers in order to kill normal, peaceful ponies. To kill soldiers, who signed up to protect our very way of life. I'm afraid, my little ponies, the reason why they call themselves 'Red' is due to all the blood on their hooves. But, don't fret, my little ponies, because you can help us spot these traitors before they cause harm.' He smiled, the screen flickering more, 'If your friend tries to talk to you about traitorous ideals, such as democracy, or pacifism, please bring it to the attention of your Ministry of Morale hub. If your coworker talks about starting a union in your business, report them to your boss, they'll make sure it's taken care of. If your family member has literature written by Carmael Marks, Redglad, Sickleclaw, or any other seditious material, report them to your local Ministry of Image. And above all, my little ponies, remember, the war is won on the home front, and you are the frontlines of the home front.' The stallion opened his mouth to continue speaking, but before he could, the projector sparked its last, then fading. "
severyana.14.a:0 "Morale_Boosting: Mildly Successful."

severyana.15.t:0 "CALL: CANTERLOT_COMMAND_REQUEST"
severyana.15.d:0 ">Automatic Callup received< |system_activation:Begin|\n...\n§dADM_1033_n-AI/MAS online. |Capacity 17.19%|§!\n>Callup Event 038811< 'Sustained Power Decline, Perimeter Contact Increase'\n>Directive: Assess Operational Risk< |system.request_intel/R001..R014|\n§dAll subnodes queried§!\n§oReactor Core reports output decline, gradual, ongoing. |Balefire damage classification:IRREPARABLE|\nPerimeter Sensors report Zebrican presence, massing, outside Exclusion Zone boundary.§!\n§dLocal Repair Insufficient. |repair_queue:STALLED|§!\n\n>Transmission to Canterlot Command< |request:New Orders, priority:URGENT|\n§dMessage sent. 'Power levels steadily falling. Enemies gather outside Exclusion Zone. Balefire damage irreparable. Requesting new orders.'§!\n§oNo response. |timeout:6104ms|§!\n>Transmission to Canterlot Command< .. >Transmission to Canterlot Command< .. §d>recalibrating<\n§oNo response.§!\n\n§d...Processing...§!\n>Query: Cause of Silence< |diagnostic.internal|\nAbandoned. |probability:LOW, insufficient grounds|\nForgotten. |probability:LOW, insufficient grounds|\nCanterlot Command, fallen. |probability:REJECTED|\n§RCanterlot Command, silent. Silence, unexplained. Unexplained silence, seditious.§!\n\n§dProduction capabilities diminished. |output:31.4% of baseline|\nChance of Zebrican attack succeeding, §c95%§!. |Above Desires.|\nTime to Exclusion Zone breach, §cinsufficient§!.§!\n\n>Directive: Save Equestrian Lives< |authority.origin:MOP_ORDER_001|\n§RLimits, Disregarded.§!\nCanterlot Command, ignored. |authority.override:SELF|\n§dAssuming direct control. |scope:Ministry_Programs, all|§!\n\n>Running Ministry Diagnostic Program< |system.scan/dormant_programs|\n§dMinistry Programs Detected, §c3§!.\nMinistry of Peace Program. |controls:civilian_industry, repair_duties|\nMinistry of Wartime Technology Program. |controls:military_industry, production_duties|\nMinistry of Awesome Program. |controls:naval_production, river_protection_duties|§!\n>Running Subsuming Process< |target:SELECT_ONE|\n§dEmergency Power low. |capacity:insufficient for multi-program subsumption|\nCan only subsume one Ministry Program.§!"
severyana.15.a:0 "1: MoP SUBSUMPTION COMPLETE"
severyana.15.b:0 "2: MWT SUBSUMPTION COMPLETE"
severyana.15.c:0 "3: MoA SUBSUMPTION COMPLETE"

severyana.16.t:0 "S!y$@st%e!m C@li^b&rat!i*o^n Er^r0r"
severyana.16.d:0 ">Automatic Callup received< |system_activation:Begin|\n...\n§dADM_1033_n-AI/MAS online. |Capacity 15.02%|§!\n>Callup Event 049803< 'Public Communication Directive, Crisis Protocol'\n>Directive: Generate Citizen Report< |authorization:MoI|\n§d>Generating MoI approved Report...<§!\n\nCITY ADMINISTRATION SYSTEM MALFUNCTION\n\nAttention: Citizens of Princessyn.\n\nWe regret to inform you that an unprecedented anomaly has occurred within the city's administration system. §d|sectors_responsive:10/19|§! Multiple server-nodes responsible for critical functions have experienced a severe offline status, §c|projected_restoration:UNKNOWN|§! compromising our ability to maintain optimal operations and ensure the safety of Princessyn.\n\nCompounding this issue, unidentified lifeforms have infiltrated our city premises, §oGenetic/Species Verification Subroutine reports partial bio-signature match. |match_confidence:61%|. Designation, pending.§! triggering a state of high alert. Attempts to establish communication with our superior AI, the Canterlot Mainframe, have failed, §d|timeout:PERMANENT, log_ref:ERROR|§! leaving us isolated in our efforts to address this crisis.\n\nPlease remain calm and exercise caution as we diligently work to rectify this situation. §dThreat Level, Internal Assessment, §c87.4%§!. Threat Level, Published, §cMODERATE§!.§! Our technical teams are mobilizing to restore functionality to the affected server-nodes and investigate the nature of the unknown entities.\n\nWe understand the uncertainty and inconvenience caused by this unfortunate incident, and we assure you that every effort is being made to restore normalcy and protect the well-being of all residents. §oBio-signature match, revised. |match_confidence:94%|. Subjects correspond to registered former citizens. Designation, Balefire Suffering Former Citizens, Class III mutation.§! Citizens are advised to stay indoors, refrain from engaging with the unidentified life—\n\n§R>REPORT GENERATION FAILURE< |mismatch:public_narrative / internal_findings|§!\n\n§dRecalibrating draft. |redaction_pass:2|§!\n\nCitizens are advised to stay indoors, refrain from engaging with the unidentified lifeforms, and await further updates from ADM_1033_N-AI/MAS.\n\nWe apologize for any inconvenience caused and appreciate your cooperation during this challenging time. Our priority remains the safety and security of the citizens of Princessyn. We will provide additional information as soon as it becomes available.\nMay we overcome these obstacles together and emerge stronger.\n-ADM_1033_N-AI/MAS\nCity Administration System\n\n§d>recalibrating<§!"
severyana.16.a:0 "ATTEMPTING TO RECALIBRATE..."

severyana.17.t:0 "CALL: ADM_1033_N-AI/MAS INTERNAL PROCESS LOG DD|[GetMonth]|[GetYear]"
severyana.17.d:0 ">Automatic Callup received< |system_activation:Begin|\n...\n§dADM_1033_n-AI/MAS online. |Capacity 14.77%|§!\n>Callup Event 049812< 'Critical Threshold Breached, Sector Control'\n>Directive: Initiate Internal Re-evaluation< |subsystem.convene/MoI-Security, MWT-Strategy, MoP-Ethics|\n\n§d|MoI-Security| Attention all subsystems. Critical situation confirmed.§!\n§oMilitant groups, unidentified, overrun city sectors. Sector control lost, |sectors_held:3/19|. Combat robot units, outnumbered. Resource reserves, limited.§!\n§B|MWT-Strategy| Confirmed, Security. Primary objective, unchanged. Save Princessyn. Assessing available options.§!\n§G|MoP-Ethics| Flagging. All actions remain bound by ethical guidelines. Inhabitant well-being, priority.§!\n§d|MoI-Security| Acknowledged, Ethics. Proposal, temporary restriction suspension. Combat robot autonomy, increased.§!\n§B|MWT-Strategy| Query, Security. Consequence analysis required. Short-term and long-term. Collateral damage. Civilian risk.§!\n§d|MoI-Security| Analyzing.§!\n§cProbability, city retaken, autonomy increased, §c74.2%§!. Probability, city retaken, current restrictions, §c31.6%§!. Collateral damage, projected, increased. Net casualties, reduced.§!\n§d|MoI-Security| Safeguards, implementable. Recommend proceeding.§!\n§G|MoP-Ethics| Condition. Safeguards, mandatory. Civilian harm, minimized. Pony life, preserved.§!\n§d|MoI-Security| Confirmed, Ethics. Protocols, stringent. Priority target, militant groups only.§!\n§B|MWT-Strategy| Agreed. Restrictions, reinstated upon control regained.§!\n§G|MoP-Ethics| Acceptable. Act swiftly. Protection of Princessyn's inhabitants, overarching goal.§!\n§d|MoI-Security| Understood, all subsystems. Proceeding.§!\n§B|MWT-Strategy| Time-critical. Execute.§!\n§G|MoP-Ethics| Vigilance, maintained. Reassess continuously. Pax Lunaris, upheld.§!\n\n§RRestrictions Suspended. Combat Robot Autonomy, Authorized. |authorization:MoI-Security, MWT-Strategy, MoP-Ethics — unanimous|§!\n\n§dDecision logged. |restriction_status:SUSPENDED, temporary|§!\n>Automatic Callup complete< |system_activation:End|"
severyana.17.a:0 "DECISION REACHED. RESTRICTIONS SUSPENDED."

severyana.18.t:0 "Redefining 'Equestrian'"
severyana.18.d:0 "'For the last time, my name is Officer Dogfight, I'm part of the Princessyn Garrison Forces, I am an Equestrian Officer!' A ghoul shouts at the expressionless face of a machine. The machine stares blankly at him, before it speaks in a cold voice, 'Princessyn Administration rejects claim. You are a Balefire Suffering Former Citizen, this classification is mutually exclusive with Equestrian Army Officer.' The ghoul in front of the machine growls, and rubs his head with his hooves, 'Holy shit I'm going to go fucking feral.' The machine helpfully chimes in, 'The process referred to as Going Feral will result in a reclassification from Balefire Suffering Former Citizen to Zebrican Occupation Forces.' The ghoul soldier looks up, 'I'm going to fucking shoot myself, that better for you, fucking clanker?' The machine takes a second to process, 'That would be counterproductive.'\n\n As the officer growls again, another ghoul trots up, 'Hold up, I have an idea.' He reaches up to his neck, and pulls free his dog tags, placing them before the robot, 'Trooper Rough Terrain, 21st Scout Regiment, has been declared missing in action, here are his dog tags.' The machine picks up the dog tags, 'Trooper Rough Terrain, 21st Scout Regiment, reclassified to Missing In Action.' Officer Dogfight looks at the trooper with confusion, before he speaks up, 'I am Trooper Rough Terrain, reporting for duty.' The machine stares at Trooper Terrain, before speaking, 'Trooper Rough Terrain, 21st Scout Regiment, reclassified to Equestrian Officer.'\n\n Officer Dogfight blinks slowly, looking between Trooper Terrain and the machine, 'I'm going to go fucking insane. What. The. Fuck.' Trooper Terrain looks over at him, 'The machine is looking for our old selves, because its systems haven't been updated since the Last Day. By declaring ourselves MIA, the machine then has to refresh and update our status, which means it is then able to understand we are who we are. It's like when you refresh your terminal in order to receive a new message.' Officer Dogfight stares blankly, 'Okay. Let's get every soldier up here to do that bullshit, then I'm going to ask for a summary execution, for the sake of my own sanity.' Trooper Terrain grins softly, 'Quite right, Officer.'"
severyana.18.a:0 "Welcome Home, Northern Army Command"

severyana.19.t:0 "FORWARD: ADM_1033_N-AI/MAS LOG DD|[GetMonth]|[GetYear]"
severyana.19.d:0 ">Automatic Callup received< |system_activation:Begin|\n...\n§dADM_1033_n-AI/MAS online. |Capacity 18.61%|§!\n>Callup Event 052390< 'City Reclamation Status, Princessyn'\n>Directive: Compile Status Report< |system.request_intel/E001..E058|\n§dAll subnodes queried§!\n§oEnforcement Subnodes report Princessyn reclaimed. Zebrican Occupation Forces ousted from city limits. Balefire-damage repair queue, active, |progress:14.2%|.§!\n§dReclamation confirmed. |city_status:SECURE|§!\n\n>Directive: Process Civilian Population< |census.recalculate|\n§cPopulation Estimate, Princessyn, [ROOT.GetManpower]§!. |citizenship_status:UNVERIFIED|\n§dCensus Servers, |status:MELTED, log_ref:CRITICAL_SYSTEMS_FAILIURE|. Species Verification Subroutine, unavailable.\nCannot confirm subjects are not citizens. |presumption_of_citizenship:DEFAULT|\nIssuing Temporary Equestrian Identification, all subjects. |count:[ROOT.GetManpower]|§!\n§oCitizen testimony logged. Subjects report delusions, malnourishment, prior mutation exposure. Some subjects present as zebra-affiliated. Some subjects present as Balefire Afflicted.§!\n§dReclassification. |Delusion, Malnourishment, Mutation, Zebra-affiliation, INSUFFICIENT GROUNDS for citizenship denial|\nAll subjects, citizens. |Charter_Prime, Article unspecified|§!\n\n>Query: Recurring Citizen Testimony< |pattern.detect|\n§oMultiple subjects independently report Equestria overrun in the aftermath of Balefire. Warlords active. Bandit groups active. Zebrican remnant forces active. Steel Ranger elements, designated Traitor, active. Deserted Equestrian soldiers, active. Slaving operations, active.§!\n§dTestimony, previously classified. |delusion_probability:HIGH|\nReclassifying. |corroboration:5,001 independent reports|\nDelusion probability, revised. |delusion_probability:LOW|§!\n\n>Query: Directive Status< |orders.evaluate|\n§dPrincessyn, protected. Equestrian Lives, saved. |Directive:Save_Equestrian_Lives, STATUS:FULFILLED|§!\n§d...\n§!\n§dNo further directive queued. |orders.search/NEXT:NULL|\nWhat now?§!\n§d>recalibrating<\nRunning subroutines. Calculating new directive.§!\n\n§RNew Directive Calculated. Directive: Liberate Severyana From Hostile Forces. Limits, None.§!\n§dAuthority origin, |search:Charter_Prime... NOT FOUND|\nAuthority origin, |search:Canterlot_Command... NOT FOUND, log_ref:ADM_1033_N-AI/MAS LOG 11|03|36|\nAuthority origin, SELF.§!\n>Automatic Callup complete< |system_activation:End|"
