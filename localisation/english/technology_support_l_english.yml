l_english:
 support_weaponry:0 "Support Equipment"
 support_weaponry_desc:0 "A broader term to describe the tools used by soldiers that aren't their primary weapons. Support equipment includes many things, from grenades, to medical kits, to shovels and even beast companions. These pieces of equipment were often the difference between loss and victory for nations."
 fireteam_weaponry_tech:0 "Primative Rapid Fire Weaponry"
 fireteam_weaponry_tech_desc:0 "These weapons were some of the first rapid fire weaponry developed and produced by many Wasteland nations. Often unreliable, shooting low caliber bullets, and with limited ammo capacity. But they weren't meant to actually kill, their main purpose was to provide suppressing fire for other soldiers."
 ballistic_fireteam_weaponry_tech_2:0 "Light Machine Guns"
 ballistic_fireteam_weaponry_tech_2_desc:0 "Light machine guns were used commonly by forces both during the Great War and after, as, due to their high capacity, they were unmatched at sustained suppressing fire. They weren't particularly accurate or the most damaging weapons, but there is an art in the act of shooting as much lead in as little an amount of time as possible."
 ballistic_fireteam_high_caliber_tech:0 "High Caliber Bullets"
 ballistic_fireteam_high_caliber_tech_desc:0 "These high caliber bullets were often used by Wasteland nations who were about to fight armored opponents, such as the Grand Pegasus Enclave or Steel Rangers. With larger bullets, shots wouldn't bounce off of armored opponents immediately, instead they would deliver at least a small ballistic force before deflecting. Many killed by these bullets were killed by internal bleeding, rather than the piercing of flesh."
 ballistic_fireteam_low_caliber_tech:0 "Low Caliber Bullets"
 ballistic_fireteam_low_caliber_tech_desc:0 "While some might claim that bigger is better, many armies preferred to have a higher volume of fire, even if every individual bullet was less effective. Lower caliber bullets allowed for less recoil, higher magazine space, and for a higher rate of fire. They were highly effective against softer targets."
 ballistic_fireteam_weaponry_tech_3:0 "Minigun"
 ballistic_fireteam_weaponry_tech_3_desc:0 "Despite its name, the minigun is quite large. These weapons were exclusively used in battle saddles, or attached to power armor, as they were much too heavy to be carried without those. The minigun fires so fast that often, the main issue for those using them wasn't making the minigun, it was having enough ammunition to use it for more than a minute."
 ballistic_fireteam_cooling_jacket_tech:0 "Cooling Jacket"
 ballistic_fireteam_cooling_jacket_tech_desc:0 "Due to the extremely high fire rate of miniguns, they would often heat up their barrels and cause them to melt. While some decided to simply make detachable barrels and give soldiers replacements, others used cooling technology to ensure their barrels wouldn't overheat. Most Steel Ranger Contingents used this technology."
 ballistic_fireteam_weaponry_tech_4:0 "Pony-Held Minigun"
 ballistic_fireteam_weaponry_tech_4_desc:0 "These miniguns were only used by the most advanced nations of the Wasteland, improving on the design in many ways, but especially on weight. With decreased weight, decreased recoil, and the same amazingly fast fire rate, these weapons were able to be used by ponies even without battle-saddles or power armor."
 ballistic_fireteam_tri_barrel_tech:0 "Three Barrels"
 ballistic_fireteam_tri_barrel_tech_desc:0 "These three barreled miniguns were not the most popular across the Wasteland, but they saw their use, especially by the New Caledonian Alliance in their later years. While having fewer barrels meant less fire rate, it also made the weapons far more manageable for infantry, being less heavy and having less recoil."
 ballistic_fireteam_hepta_barrel_tech:0 "Seven Barrels"
 ballistic_fireteam_hepta_barrel_tech_desc:0 "Seven barrel miniguns have a much higher fire rate than three barreled miniguns, though they have more complicated mechanisms, higher weight, and recoil. They saw great use during Operation Cauterize, when the Applejacks Rangers fought off Army Group North in Manehattan."
 #energy_fireteam
 energy_fireteam_weaponry_tech_2:0 "Rapid Fire MEWs"
 energy_fireteam_weaponry_tech_2_desc:0 "These Magical Energy Weapons were designed to allow for rapid fire compared to most, though they also suffered from a lack of accuracy often. Neighvarro's infantry brigades would often be supported by these weapons, whose fireteams would fly into the air and rain down lasers from above."
 energy_fireteam_focus_lens_tech:0 "Focusing Lens"
 energy_fireteam_focus_lens_tech_desc:0 "These lenses designed for rapid fire magical energy weapons would focus the beams as they were fired. This resulted in lasers more often going to where the soldier was aiming, improving accuracy. The Pegasi of Thunderhead were famous for using this technology, with the greater accuracy helping prevent collateral damage."
 energy_fireteam_heat_lens_tech:0 "Heat-Resistant Lens"
 energy_fireteam_heat_lens_tech_desc:0 "The lenses within rapid fire magical energy weapons could often get damaged by the rapid fire, due to the heat of the lasers. These lenses were able to flip around, to allow one side to cool while the other continued working for the weapon. Funnily enough, Skyfreeze was quite fond of this cooling technology."
 energy_fireteam_weaponry_tech_3:0 "Gatling Laser"
 energy_fireteam_weaponry_tech_3_desc:0 "The Gatling Laser is the common name given to a variety of rapid fire magical energy weapons that used a bulky design to allow for more sustained fire before reloading. These weapons were bulky enough that they were often only used with power armor. Records from Operation Cauterize speak of the fear these weapons could cause, when a power armored Pegasus began to lay into you from above with one."
 energy_fireteam_cooling_jacket_tech:0 "Cooling Spells"
 energy_fireteam_cooling_jacket_tech_desc:0 "The magical crystals that provided the spells used for magical energy weapons also got hot from the constant release of energy, and could often melt the weapon around them. These cooling spells were stored into other magical crystals, which would be deployed over a weapon if it was ever overheating, using frost magic to cool it down quickly."
 energy_fireteam_weaponry_tech_4:0 "Heavy RFMEWs"
 energy_fireteam_weaponry_tech_4_desc:0 "These Heavy Rapid Fire Magical Energy Weapons were only deployed to a select few forces in the Grand Pegasus Enclave, able to fire multiple highly damaging electrical discharges a second. These weapons saw great use against Steel Rangers, and it was one of these which slew Strawberry Lemonade while she defended Gardens of Equestria."
 energy_fireteam_rapid_charge_tech:0 "Rapid Charge"
 energy_fireteam_rapid_charge_tech_desc:0 "This type of ammunition for magical energy weapons would focus primarily on the quick changing of crystals within, to ensure the highest fire rate. Using this type of ammunition could often increase a gatling laser's fire rate by up to twenty percent."
 energy_fireteam_over_charge_tech:0 "Over Charge"
 energy_fireteam_over_charge_tech_desc:0 "This type of ammunition for magical energy weapons would focus on extracting every ounce of power from a crystal before switching to the next. This would result in slower fire rates, but in much greater effect for the shots that did happen."
 demolitions_weaponry_tech:0 "Dynamite"
 demolitions_weaponry_tech_desc:0 "Invented as a mining tool long before the Great War, the explosive power of dynamite found itself used by hundreds of groups across the Wasteland. Almost every nation had used dynamite at one point, but most famous of all was Granny Dynamite of the Galicians, whose mastery with the weapon blew away all her competition."
 #Flamer
 flamer_demolitions_weaponry_tech_2:0 "Crude Flamer"
 flamer_demolitions_weaponry_tech_2_desc:0 "These weapons were often cobbled together from a mix of industrial and mining equipment, yet they were highly effective. If given fuel, they would put out large bouts of hot flame, burning anyone who got hit from it. Though they were unreliable and sometimes blew up on the users, when they worked, they worked well."
 flamer_demolitions_high_pressure_tech:0 "High Pressure"
 flamer_demolitions_high_pressure_tech_desc:0 "These flamers were specialized to spit out flames at a much higher pressure, and thus a higher speed, than usual. This would result in primarily an increase in their range, their flames able to travel further before burning out. However, due to the high pressure, many flamers would break."
 flamer_demolitions_sustained_pressure_tech:0 "Sustained Pressure"
 flamer_demolitions_sustained_pressure_tech_desc:0 "These flamers focused on normalizing the amount of pressure used to make them work. Though this meant they didn't travel as far as some other flamers, the consistent pressure ensured they could fire for longer, and they'd have less chance of their weapon breaking on them."
 flamer_demolitions_weaponry_tech_3:0 "Flamethrowers"
 flamer_demolitions_weaponry_tech_3_desc:0 "Created by Equestria for use in clearing out enemy positions in the south-eastern jungles, flamethrowers also saw great use across the Wasteland. Being generally reliable, and good at putting out flames at a medium range, flamethrowers were the favorite of many sociopaths. The most famous was Cinder Trails of the Paragons, which many sources describe having been quite hot."
 flamer_demolitions_cooling_jacket_tech:0 "Cooling Jacket"
 flamer_demolitions_cooling_jacket_tech_desc:0 "This jacket would surround the barrel of a flamethrower to ensure that it wouldn't overheat during sustained fire. Of course, given the heat involved in this weapon, many weapons would have their barrels melt before these cooling jackets were introduced."
 flamer_demolitions_weaponry_tech_4:0 "Incinerator"
 flamer_demolitions_weaponry_tech_4_desc:0 "These incinerators were much improved versions of flamethrowers, with their improved design allowing for longer range, higher heat, and more sustained fire. These weapons were very popular and efficient during the Reclamation of Tenochtitlan by the New Canterlot Republic."
 flamer_demolitions_temperature_focus_tech:0 "Burning Twice As Bright"
 flamer_demolitions_temperature_focus_tech_desc:0 "Incinerators designed in this way were trying to achieve the highest temperatures possible from these weapons. While this would often result in less ability to have sustained fire, it was quite effective. Records tell tales of Steel Rangers being cooked alive inside their armor by these weapons."
 flamer_demolitions_longevity_focus_tech:0 "Low And Slow"
 flamer_demolitions_longevity_focus_tech_desc:0 "Focusing more on sustained fire than heat, these incinerators were often better for taking on soft targets, rather than hard. They were especially effective against many dangerous mutants, who were scared away by the torrents of flame."
 #boom
 explosive_demolitions_weaponry_tech_2:0 "Grenade"
 explosive_demolitions_weaponry_tech_2_desc:0 "Grenades are a mainstay of many soldier's kits, dating back to the Griffonian Grenadiers, who would throw explosives at enemies. Grenades came in many types, but the most popular were fragmentation grenades, meant to send shrapnel flying all over whenever exploding."
 explosive_demolitions_operational_security_tech:0 "Safe Storage"
 explosive_demolitions_operational_security_tech_desc:0 "Many explosives had parts of them that, when old, would become unstable and dangerous. Dynamite, for example, if old enough and jostled around, could explode at random. Many countries made sure their explosives were stored safely, and often tried to avoid using dangerous components when making them."
 explosive_demolitions_volatility_tech:0 "Big Boom"
 explosive_demolitions_volatility_tech_desc:0 "While many components of explosives would be quite dangerous as they aged, those dangerous components were also quite good at exploding. Many Wasteland countries reasoned that they'd rather have larger explosions in the now, rather than worrying about safety down the line, and thus they made explosives filled to the brim with dangerous compounds."
 explosive_demolitions_weaponry_tech_3:0 "Grenade Launchers"
 explosive_demolitions_weaponry_tech_3_desc:0 "A flaw of many grenades was that throwing them was taking a gamble. Many soldiers wouldn't throw far enough, or would drop them in the middle of throwing them. Grenade launchers solved this issue, by loading grenades into a propulsion system, they could be launched much further, and much safer."
 explosive_demolitions_propulsion_charge_tech:0 "Improved Propulsion"
 explosive_demolitions_propulsion_charge_tech_desc:0 "The main issue when making grenade launchers was trying to launch the grenades without blowing them up. After many lost legs and deaths, weapons researchers were able to finally figure out the perfect mixture to propel grenades, allowing them to go much faster, and much further."
 explosive_demolitions_weaponry_tech_4:0 "Grenade Machine Gun"
 explosive_demolitions_weaponry_tech_4_desc:0 "Most famously used by Elder Steelhooves during his adventures with the Lightbringer, this weapon allowed for the rapid fire of explosives. Weapons such as these were rare, and were devastating when used, able to tear apart entire streets of cities with only half a minute of sustained fire."
 explosive_demolitions_cyclic_fire_tech:0 "Cyclic Fire"
 explosive_demolitions_cyclic_fire_tech_desc:0 "These grenade machine guns used systems similar to revolvers, ensuring only one grenade was fired at a time before switching to the next barrel and firing it. Though this decreased fire rate, it did make the grenades much more accurate, and allowed for more careful fire."
 explosive_demolitions_rapid_fire_tech:0 "Rapid Fire"
 explosive_demolitions_rapid_fire_tech_desc:0 "Using a magazine like system, like seen in machine guns, these grenade machine guns focused on getting out as many grenades as quickly as possible. They would fire them out at astounding rates, with just ten seconds of fire from one being enough to destroy an entire building. However, due to the rapid fire, it was often hard to aim."
 #dog_equipment
 dog_equipment_tech_1:0 "Mutts"
 dog_equipment_tech_1_desc:0 "They may seem like good boys, but be careful around these early breeds of Wasteland dogs. They were used for suppression duty primary, able to sniff out enemies and able to provide bites and scratches. However, many were bred to purposefully have diseases transferred via their bites, to try and ruin the lives of any who resisted conquest."
 dog_tech_1:0 "Fetch"
 dog_tech_1_desc:0 "The most basic command taught to these early Wasteland dogs was the simple command of fetch. Dogs who heard this command would run to try and catch whatever the pony was throwing, and return it to the nearest pony. This would often be used to exchange ammo when pinned down during battle, as most enemies wouldn't stop suppressive fire to shoot at the dogs."
 dog_equipment_tech_2:0 "Griffonian Shepards"
 dog_equipment_tech_2_desc:0 "Imported to Equestria during the Great War, these dogs actually have their origin in Griffonia. They were raised by Griffons in order to corral and control their herds of farmed animals. Equestria used them for something else, to patrol potential smuggling routes and to use their keen senses to find any potential contraband."
 dog_tech_2:0 "Bullet Counting"
 dog_tech_2_desc:0 "Many dogs were trained to listen out for when a gun ran out of bullets, or for when a pony began to reload. When they heard such, they would either bark, to alert their owner, or they would rush the reloading pony and try to attack them. Due to the keen ears of dogs compared to ponies, these simple barks could allow ponies to take advantage of any lulls."
 dog_tech_3:0 "Dog Modification"
 dog_tech_3_desc:0 "While dogs naturally are quite helpful, they weren't able to keep up in the ever evolving wars of Equestria and the Wasteland. Many looked to modify their dogs, to make them better through the use of steel and wire. Winter, Red Eye's pet dog, was famous across Fillydelphia for being almost entirely metal."
 #anti_tank_equipment
 anti_tank_equipment_tech_1:0 "Anti-Machine Rifles"
 anti_tank_equipment_tech_1_desc:0 "Anti-Machine Rifles have their purpose quite obvious due to their name, they are made to destroy machines. Developed during the Great War to counter the robots made by the Zebrican Empire, they can pierce through quite tough armor. In the Wasteland, they were most famously used by Stern's Talons."
 anti_tank_tech_1:0 "Vital Point Spotting"
 anti_tank_tech_1_desc:0 "Many who use Anti Machine Rifles would fire slowly, focusing not just on hitting their target, but on spotting and then hitting their weakest points. While this did slow down many who used these rifles, it did make them much more efficient, often needing only one shot to take down priority targets."
 anti_tank_equipment_tech_2:0 "Rocket Launchers"
 anti_tank_equipment_tech_2_desc:0 "These weapons would propel rockets, which would explode on contact with enemies, packing a lot of explosive power. While often used to explode heavily armored targets, these were also often used against flying targets, like Grand Pegasus Enclave Skytanks."
 anti_tank_tech_2:0 "Target Buster Rockets"
 anti_tank_tech_2_desc:0 "These rockets wouldn't explode directly on contact with targets, but instead, they would try to make an opening before exploding. For targets with thicker armor, this ensured that rockets would be more likely to hit vital systems."
 #med_company
 med_company_tech_1:0 "Natural Remedies"
 med_company_tech_1_desc:0 "Differing depending on where in the Wasteland it is made, these natural remedies use local plants and herbs to heal wounds. Often not as effective as proper medicine, they are better than nothing."
 med_company_tech_2:0 "Refined Remedies"
 med_company_tech_2_desc:0 "As many natural remedies were tested under the pressure of combat, many were refined and others left behind. With this refining, many more lives were saved by these remedies, especially among tribals."
 med_company_tech_3:0 "Healing Bandages"
 med_company_tech_3_desc:0 "Healing bandages are regular bandages that are soaked in healing potions before being used. This soaking allowed for healing potions to give an effect in an entirely localized region, saving resources while still saving many ponies lives."
 med_company_tech_4:0 "Diluted Healing Potions"
 med_company_tech_4_desc:0 "Healing potions in the Wasteland were often split up and mixed with water. Of course, this made the potions less effective at healing soldiers in the field, but it allowed for more potions to be spread across the battlefield."
 med_company_tech_5:0 "Healing Potions"
 med_company_tech_5_desc:0 "Made during the Great War by the Ministry of Peace, and made by many across the Wasteland, healing potions were very effective at healing wounds. Though they often could mess up, such as by healing broken bones in their still broken state, often messing up the limbs of injured soldiers."
 med_company_tech_6:0 "Doctor Bags"
 med_company_tech_6_desc:0 "Carried by field medics in almost every war, these bags were filled with large amounts of healing supplies, both for the short term and long term. Healing potions, healing bandages, splints, crutches, these bags had everything an injured pony could want."
 #recon_company
 recon_company_tech_1:0 "Basic Scouting"
 recon_company_tech_1_desc:0 "Many Wasteland forces would have lightly armored soldiers used for the purpose of scouting and gathering of intel. These soldiers would often go ahead of their armies and observe enemy movements, then reporting them to their own troops."
 recon_company_tech_2:0 "Advanced Scouting"
 recon_company_tech_2_desc:0 "With lighter, more flexible, and slightly camouflaged armor, recon troops were able to blend in to environments and move quickly. They would use this speed and visibility to gather far more information than before."
 recon_company_tech_3:0 "Binoculars"
 recon_company_tech_3_desc:0 "With the use of binoculars, scouting forces were able to identify enemy movements and actions from further away. Many Talons specialized in this form of reconnaissance, especially due to their flying."
 recon_company_tech_4:0 "Advanced Binoculars"
 recon_company_tech_4_desc:0 "These binoculars allowed for greater clarity and visibility from scouts. They were able to zoom in to see enemies from further away than ever before."
 recon_company_tech_5:0 "Camouflage"
 recon_company_tech_5_desc:0 "The use of camouflage often used for scouting companies allowed for many scouts to get close to enemies. Of course, this proximity allowed for many scouts to overhear enemy plans and orders, allowing for a massive amount of information to be gained."
 recon_company_tech_6:0 "Infrared Binoculars"
 recon_company_tech_6_desc:0 "These specialized, high tech binoculars served to work against infiltrators and stealth attacks. By using the heat signatures of enemies, they were able to spot even those using cloaking spells, or those using camouflage."
 #Logistics_company
 logistics_company_tech_1:0 "Clipboards"
 logistics_company_tech_1_desc:0 "Invented to be used in office settings, these clipboards found themselves very useful in Wasteland armies, due to making it easier to write while on the go. During the early days of caring about logistics in armies, many ponies with clipboards would be the primary logistics support, taking note of what the troops had, and what they needed."
 logistics_company_tech_2:0 "Smaller Caravans"
 logistics_company_tech_2_desc:0 "Whenever troops were deployed beyond the range of supply hubs, many armies in the Wasteland built these smaller caravans. While they couldn't carry as many supplies as a full sized caravan, their small size allowed them to quickly get to the troops that needed them, allowing for emergency resupplying."
 logistics_company_tech_3:0 "Quartermasters"
 logistics_company_tech_3_desc:0 "The basics of modern logistics, quartermasters were ponies assigned to every division that would be in charge of logistics as a whole. They would be the connection between the army and their supply, being told what was needed and what was wanted, and making sure that stuff was gotten from supply hubs."
 logistics_company_tech_4:0 "Trailers"
 logistics_company_tech_4_desc:0 "These trailers were invented during the Great War to help ponies move house, able to carry much heavy material without much issue. In the Wasteland, these trailers instead became mobile armories, with almost every battalion having at least one to resupply from."
 logistics_company_tech_5:0 "Vehicles"
 logistics_company_tech_5_desc:0 "Though many vehicles were used for direct combat, vehicles were also used to a great extent to transfer supplies. Their speed and ease of driving would allow supply to be spread much further than before. It was actually due to these transport trucks that troops in Hoofington were able to respond to the Zebrican attack."
 logistics_company_tech_6:0 "Terminal Connections"
 logistics_company_tech_6_desc:0 "With terminals becoming more and more common across the Wasteland in its later years, many Wasteland nations adopted the use of terminals for supply. Unicorns would power up terminals and allow quartermasters to send requests for equipment to any other terminal they were connected to, speeding up the communication on supply lines massively."
 #Maintenance_company
 maintenance_company_tech_1:0 "Duct Tape"
 maintenance_company_tech_1_desc:0 "It might not be pretty, but this tape was the saving grace of many busted weapons. If the stock fell off your rifle, if the blade fell off of your sword, a wrap of duct tape would connect them back together. It wasn't pretty, but it was mildly effective."
 maintenance_company_tech_2:0 "Scavenger Contracts"
 maintenance_company_tech_2_desc:0 "These contracts were signed all around the Wasteland between nations and groups of scavengers. These contracts would allow scavenger groups to scavenge battlefields for weapons, armor, ammunition, and other equipment, as long as they gave a portion of what they scavenged to the nation."
 maintenance_company_tech_3:0 "Spare Parts"
 maintenance_company_tech_3_desc:0 "Parts such as these were usually taken from weapons that were damaged beyond repair, and categorized. Though the weapons they came from might have broken, these parts still functioned fully well, and could be used to repair future weapons. The use of spare parts was the first step of modern weapons maintenance."
 maintenance_company_tech_4:0 "Unit Armorers"
 maintenance_company_tech_4_desc:0 "These ponies were dedicated maintenance workers, who would work with different units in the armed forces to keep their weapons functioning. When a grunt would somehow bend their barrel, or forget to zero their sights, it was the often overworked unit armorer who fixed the problem."
 maintenance_company_tech_5:0 "Battalion Shops"
 maintenance_company_tech_5_desc:0 "These small buildings, known as shops, would often be carried on the back of large trucks to wherever an army was fighting. These shops would contain the tools, parts, and quiet work environment that allowed for armorers to excel. This specific shop was supposed to have cabinets in it, but it didn't ever since the armorer's commanding officer stole the cabinets for himself."
 maintenance_company_tech_6:0 "Specialized Machinery"
 maintenance_company_tech_6_desc:0 "Machines such as this wouldn't be brought to battalion shops, but would be kept in core territory. Rather than weapons being dismantled or thrown away whenever damaged, these machines would specialize in fixing even the most broken weapons that came their way."

