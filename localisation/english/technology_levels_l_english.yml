l_english:
 #Infantry tech
 infantry_tech_level_tribal:0 "Tribal Infantry Technology"
 infantry_tech_level_tribal_desc:0 "While these states were called tribal in their technology level, that doesn't mean that they were tribal in actuality. Many settlements, tribes, and raider gangs were described as tribal in tech level. Often only able to produce melee weapons and basic infantry equipment."
 infantry_tech_level_settler:0 "Settled Infantry Technology"
 infantry_tech_level_settler_desc:0 "Often represented by smaller nations and settlements, settled infantry technology was when weaponry began to become primarily ballistic. Many settled countries would use early Great War technology, and a few would even produce magical energy weapons."
 infantry_tech_level_scientific:0 "Scientific Infantry Technology"
 infantry_tech_level_scientific_desc:0 "Often only seen in countries with a strong investment into research, scientific infantry equipment is when Wasteland nations began to make weapons on par with the late Great War. Advanced assault rifles and futuristic magical energy weapons marked this type of technology in the Wasteland, largely seen with the Grand Pegasus Enclave."
 #power armor tech
 power_armour_tech_level_settler:0 "Settled Power Armor"
 power_armour_tech_level_settler_desc:0 "Settlements didn't often use power armor technology in great amounts, but some scattered settlements did make basic armor. These armors were often shells, not actually powered by internal systems. They were only truly used en masse by the Metalheads of the Spiked Collars tribe."
 power_armour_tech_level_scientific:0 "Scientific Power Armor"
 power_armour_tech_level_scientific_desc:0 "The first proper power armor, with internal systems making the pilot into a trotting tank, were made by scientific countries. During the years of Red Eye's reign, most advanced power armors were only produced and jealously kept by Steel Rangers and the Grand Pegasus Enclave."
 #special forces tech
 special_forces_tech_level_tribal:0 "Tribal Special Forces"
 special_forces_tech_level_tribal_desc:0 "Special forces kits in the tribal stage of development often focused more on mobility and flexibility than anything else. Special forces under this tech level would often wear light leather armor and use high quality rapid fire weapons, rather than precision rifles."
 special_forces_tech_level_settler:0 "Settled Special Forces"
 special_forces_tech_level_settler_desc:0 "Special Forces often used by settlers, such as the Old Appleloosan Rangers, often focused on basic camouflage for their forces, and traded out rapid fire weapons for precision rifles. It was this focus on stealth and precision that turned special forces from slightly better infantry to properly special forces."
 special_forces_tech_level_scientific:0 "Scientific Special Forces"
 special_forces_tech_level_scientific_desc:0 "Only used in small numbers as far as records show, these special forces used stealth field technologies and deadly precise rifles. Only a few units using this type of equipment are known about, as any others have likely been stricken from the record."
 #support tech
 support_tech_level_tribal:0 "Tribal Support Technology"
 support_tech_level_tribal_desc:0 "Often focusing on only the basics of support, tribal support technology often used whatever could be easily found. Dynamite, rapid fire machine guns, anti-machine rifles, and basic supplies given to soldiers. While they don't look that impressive, even these tools found great use across many wars."
 support_tech_level_settler:0 "Settled Support Technology"
 support_tech_level_settler_desc:0 "The bread and butter of most wasteland nations, these support technologies often came along with a formalization of use. These technologies favored mass production over quality, and would see wide use across countless battles."
 support_tech_level_scientific:0 "Scientific Support Technology"
 support_tech_level_scientific_desc:0 "Often only used by Steel Rangers, Applejacks Rangers, and Grand Pegasus Enclave, these support equipments focused on specialization and perfection of their performance. Also seen used in the later years of the New Canterlot Republic's wars, these technologies were often the difference between victory and defeat,"
 #vehicles tech
 vehicles_tech_level_tribal:0 "Tribal Vehicles"
 vehicles_tech_level_tribal_desc:0 "With only basic motors that often required pony input to run, these vehicles were mainly used by smaller raider gangs or specific tribes. Citizens across the Wasteland would often, in the later years of the Wasteland, have some of these vehicles for their own use."
 vehicles_tech_level_settler:0 "Settled Vehicles"
 vehicles_tech_level_settler_desc:0 "With properly designed motors, these vehicles are able to travel with minimal effort from their drivers, and at much greater speed. Though they were often just frames with metal welded onto them rather than properly constructed, they provided sufficient speed for most Wasteland needs."
 vehicles_tech_level_scientific:0 "Scientific Vehicles"
 vehicles_tech_level_scientific_desc:0 "With Great War quality, these vehicles were often armored, quick, and were able to destroy any soft targets they were used against. Only seen during the late Great War and within the most advanced Wasteland nations."
 #robotics tech
 robotics_tech_level_tribal:0 "Tribal Robots"
 robotics_tech_level_tribal_desc:0 "While robots as a whole were quite uncommon across the Wasteland armies, the first robots of those that used them were simple automata. Trained to follow orders and usually ineffective compared to actual soldiers, they still served as an effective start to robotic warfare."
 robotics_tech_level_settler:0 "Settled Robots"
 robotics_tech_level_settler_desc:0 "The main robots seen across the Wasteland and in use for the few Wasteland armies who used them. These robots often perform roles usually reserved for grunts at an acceptable level, used especially for those who lack a large amount of manpower."
 robotics_tech_level_scientific:0 "Scientific Robots"
 robotics_tech_level_scientific_desc:0 "The greatest used by both Equestria and Zebrica during the Great War, these robots were armies on their own. They could often change the tide of a battle individually, let alone when deployed en masse. Often they were found in dangerous wartime ruins."
 #air tech
 air_tech_level_tribal:0 "Tribal Aeronautics"
 air_tech_level_tribal_desc:0 "Consisting of gliders rather than any truly motorized flight, these early planes are still to be admired. It's hard to remember as an educated pony that, back in the Wasteland, ponies had no clue how to make things other than Pegasi fly."
 air_tech_level_settler:0 "Settled Aeronautics"
 air_tech_level_settler_desc:0 "The first motorized aircraft, be it the motors that would make planes or helicopters fly, or those which would ensure the proper heat of airships. Even these basic aircraft would be the difference between victory and defeat for many in the Wasteland. Red Eye was only able to destroy the Fillydelphian Contingent due to his use of balloons."
 air_tech_level_scientific:0 "Scientific Aeronautics"
 air_tech_level_scientific_desc:0 "Leaving behind the basic aircraft of pre-war Equestria, these aircraft more resemble those used during the Great War. Raptor Cloudships were feared and beloved by soldiers on both sides, and though they were never used much in the Great War, planes found great use in anti-Enclave warfare in the Wasteland."
 #naval tech
 naval_tech_level_tribal:0 "Tribal Navy"
 naval_tech_level_tribal_desc:0 "These small ships, often using sails or very basic motors, were the most common form of naval vessels used across the Wasteland. Due to many powers not having a navy, having a primitive navy proved quite useful, even if it would be destroyed easily by a greater navy."
 naval_tech_level_settler:0 "Settled Navy"
 naval_tech_level_settler_desc:0 "Using metal frames and engines, as well as large artillery pieces for most of their weaponry, these ships were often the cutting edge of naval technology in the Wasteland. The New Canterlot Republic put these ships to great use in the Battle of Baltimare, shelling the city from its own docks."
 naval_tech_level_scientific:0 "Scientific Navy"
 naval_tech_level_scientific_desc:0 "Ships that used the top tier technology from the Great War, they were hardly ever built by Wasteland nations. Most ships of this caliber were often remnants from the Great War. One of the few to have a navy using these modern ships was Rustwreck, with their advanced ships providing massive amounts of fire support against Red Eye's invasion forces."
 #tools tech
 tools_tech_level_tribal:0 "Tribal Tools"
 tools_tech_level_tribal_desc:0 "These primitive tools saw use across the Wasteland, made from scratch by tribes, gangs, and settlements all over. Many in the Wasteland did not see the need to have better, as despite the simplicity of these tools, they proved effective enough for most ponies."
 tools_tech_level_settler:0 "Settled Tools"
 tools_tech_level_settler_desc:0 "These tools were the mainstays of most large industrial nations in the Wasteland. Red Eye, the New Canterlot Republic, and the New Caledonian Alliance produced many of these tools, which would find their way through trade routes to almost every settlement across the Wasteland."
 tools_tech_level_scientific:0 "Scientific Tools"
 tools_tech_level_scientific_desc:0 "Only used by the most modern industries of the Wasteland, these tools combined the simplicity of primitive tools with the usefulness of settled tools. Often these tools were meant for specific jobs, and those who used these tools often had massive toolboxes meant for any occasion."
 #habitation tech
 habitation_tech_level_tribal:0 "Tribal Architecture"
 habitation_tech_level_tribal_desc:0 "While they might seem primitive to the modern pony, these houses provided shelter to millions across the Wasteland. Made out of local, easy to harvest materials and put together just enough to keep out the weather, these shelters were often the difference between life and death for the post-apocalyptic pony."
 habitation_tech_level_settler:0 "Settled Architecture"
 habitation_tech_level_settler_desc:0 "Using more complex materials and techniques, these houses were, by Wasteland standards, sturdy and comfortable. Many of these houses even still stand in the historic districts of many cities and towns, their well-kept stone and adobe structures withstanding the test of time."
 habitation_tech_level_scientific:0 "Scientific Architecture"
 habitation_tech_level_scientific_desc:0 "Often built using specialized power tools and well-produced industrial materials, these houses were the best a pony could hope to live in. While often lacking the amenities present in late Great War housing, these houses provided an unshakable, stable place to sleep every night."
 #exploitation tech
 exploitation_tech_level_tribal:0 "Tribal Extraction"
 exploitation_tech_level_tribal_desc:0 "The most basic form of resource extraction used by most tribes and settlements across the Wasteland. Using very primitive tools, such as hoof crafted axes and pickaxes, these tools were able to tap into just the barest resources."
 exploitation_tech_level_settler:0 "Settled Extraction"
 exploitation_tech_level_settler_desc:0 "Using dedicated tools often made in factories, such as power tools, these extraction methods were used by larger settlements to get all they could from the earth. The Neocastle Miner's Guild specialized in this style of extraction, able to draw out untold amounts of material from the ground."
 exploitation_tech_level_scientific:0 "Scientific Extraction"
 exploitation_tech_level_scientific_desc:0 "Using surveying machines and large machines dedicated to extraction, these methods were able to dig deep into the ground. They would ensure that, of course, where they dug actually had materials, and they would extract all they could before leaving."
 #electronics tech
 electronics_tech_level_tribal:0 "Tribal Electronics"
 electronics_tech_level_tribal_desc:0 "Representing the very first computers, and the understanding of electronic theory needed to get there. This understanding was the start for any settlement who wished to make their way into the electronics trade."
 electronics_tech_level_settler:0 "Settled Electronics"
 electronics_tech_level_settler_desc:0 "With the very first microchips and the first terminals, these electronics are what most civilians would have access to. A large step up over the simple electronics of the past, but not representing the best of the best for electronics."
 electronics_tech_level_scientific:0 "Scientific Electronics"
 electronics_tech_level_scientific_desc:0 "Only achieved by the Wasteland countries most dedicated to research, these electronics were rare even during the Great War. The best of them all, Crusader Maneframes, were very rare and often only used by the richest of Equestria. One can see the power of their effects, running almost pony-like AIs, like Mother, Wallkirk, Mister House, and Cognitum."

