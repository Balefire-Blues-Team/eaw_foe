  DeadTree_STPStart1:0 "§tSizable Zony Population"
  DeadTree_STPStart1_desc:0 "Due to events over the last thirty years, the population of zebra-pony crossbreeds has grown signifigantly. Colorful and strong, they are an exotic sight to many in the wasteland... Slavers especially." 

  DeadTree_STPStart2:0 "§7Spiritualism and Shamanism"
  DeadTree_STPStart2_desc:0 "During the Great War the Legions of Zebrica were capable of invoking spirits in ways that defied the logic of Equestria's greatest scientist. In recent decades, several Zebra and Zony Shaman have settled among the ponies of Stable Phi, granting insight into their ways." 

  DeadTree_STPStart3:0 "§8Advanced Materials Research Stable"
  DeadTree_STPStart3_desc:0 "Stable Phi was once a confidential center of refining for Ministry of Arcane Science and Ministry of Awesome projects in the region... designed to serve as both a refuge and place of work should the War end outside of Equestria's favor." 

  DeadTree_STWStart1:0 "§RDisorganized Mob"
  DeadTree_STWStart1_desc:0 "To call the Stingwing Gangs 'Unified' would be a laughable joke at the best of times; held together through the strength and ability of StingWing himself, the Gangs are often at one-anothers throats over minor disputes... it wouldn't take much to push them over into open fighting for a few days."

  DeadTree_STWStart2:0 "§RCazadorable Tamers"
  DeadTree_STWStart2_desc:0 "Theres no real way to 'tame' a Cazadorable; the large party-pink wasps are the size of a pony and just as likely to view them as prey... but with the right mix of herbs and smoke, one could calm them enough to work. Their venom is potentially potent, often being loaded into hollowed rounds for use against the unarmored."

  DeadTree_SUSStart1:0 "§4Citizenship Tiers"
  DeadTree_SUSStart1_desc:0 "During the early days after the Great War, the Unicorn-majority staff of South Shore's town council formed a proper government and set forth to protect themselves against the madness of the post-war world. ...one of their early edicts established three tiers of Citizens split along intelligence. Most unicorns fit into the uppermost tier, while many pegasi and earth ponies fell into the lesser tiers. Unofficialy seen as a caste system, movement between the tiers is possible... but not common."

  DeadTree_SUSStart2:0 "§5Canterine Shores University of Arcane Sciences"
  DeadTree_SUSStart2_desc:0 "Established seven years after Princess Luna's return, CSU dedicated itself to Arcane Sciences in the realm of energy storage and creation... during the Great War one of their greatest projects was the development of the 'Celestial Flicker'; an attempt to artificially create a fragment of Celestia's Sun to generate power. . ...while successful, the prototype reduced the outlying lab facility and much of the surrounding area to a perfectly rounded crater. The damage done to the town and university was minimal, but the name South Shore stuck as it essentially placed a new shore-line on the border of the town."

  DeadTree_FSEStart1:0 "§YFilly Scouts of Equestria"
  DeadTree_FSEStart1_desc:0 "The Great War caused many changes in the Filly Scouts of Equestria... with rising militancy and concern of Zebra invasion, Home Guard instructors would regularly be brought in to provide 'practical survival examples' for the young Fillies. This included courses on combat stims and light military training. In the modern day, the Filly Scouts are a lethal force in battle, striking hard and fast using tactics honed over the centuries... and just as often offering to sell the survivors drug-laced cookies in the aftermath of battle."

  DeadTree_STRStart1:0 "§WThe Long Eyes of the Law"
  DeadTree_STRStart1_desc:0 "Tracing their liniage back to the Enclave Incursion of 1205, the Long Eye Regulators were formed from the remaining Regulators who survived the battle. Led by the widow of their former leader, Alguacil, the Regulators took on his moniker as they continued their duty of ridding the land of monsters in civilized shape."

  DeadTree_RRGStart1:0 "§OBig Game Hunters"
  DeadTree_RRGStart1_desc:0 "The weapons of the Red Rabbit Gang are focused more towards punching through the thick flesh and armor of their local MegaFauna... but as it turns out, the flesh of a twelve-pony tall firebreathing Golden Gecko isn't that different from armor plating."

  DeadTree_RRGStart2:0 "§RMegaFauna"
  DeadTree_RRGStart2_desc:0 "The Raiders of the Red Rabbit Gang are unusually clever folk... mostly because the less-clever among them don't live long. Surrounded by numerous massive beasts brought about by the ancient effects of a MegaSpell missile, those who call the territory home either learn how to live with the massive creatures... or become lunch."

  DeadTree_STMStart1:0 "§1Pegasi of the Cloudsdale Marshes"
  DeadTree_STMStart1_desc:0 "When Cloudsdale fell, much of the machinery in its Weather Factory was either destroyed or damaged... some fell back to Equis while others remained trapped in the clouds of the SPP, operating at random. Descendant from the Weather Facility's survivors, the Stormriders maintain some of the fallen machinery... taking full advantage of the Marsh created by the constant storms and pure water generated by the Generators above."

  DeadTree_STMStart2:0 "§2Slavers of the Marsh"
  DeadTree_STMStart2_desc:0 "Slavery is a way of life in Equestria, loners don't last very long and fools have a tendency to disappear. Travelling the Marshes alone is a risky buisness... even the towns aren't safe. Well... for outsiders, anyway."

  DeadTree_Start:0 "§8 22222"
  DeadTree_Start_desc:0 ""

