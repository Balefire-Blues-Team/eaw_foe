  robot_primacy_improved_reactor: "Improved Reactor"
  SUBDOCTRINE_WASTELAND_CARAVANS: "Wasteland Caravans"
  SUBDOCTRINE_WASTELAND_CARAVANS_DESC: "Caravans are the lifeblood of the wasteland, providing essential supplies and resources to sustain the army. Focus on improving caravan efficiency and security to ensure a steady flow of resources."
  wasteland_caravans_fast_convoys: "Fast Convoys"
  wasteland_caravans_air_drops: "Air Drops"
  wasteland_caravans_robot_escorts: "Robot Escorts"
  wasteland_caravans_nightrunners: "Nightrunners"
  wasteland_caravans_caravan_rotation: "Caravan Rotation"
  SUBDOCTRINE_SCAVENGER_FIELDS: "Scavenger Fields"
  SUBDOCTRINE_SCAVENGER_FIELDS_DESC: "Scavenger fields are areas rich in resources and salvageable materials. Focus on training units to efficiently scavenge and utilize these resources to support the army's operations."
  scavenger_fields_opportunistic_foraging: "Opportunistic Foraging"
  scavenger_fields_scrap_recovery_teams: "Scrap Recovery Teams"
  scavenger_fields_cache_networks: "Cache Networks"
  scavenger_fields_jury_rigged_firepower: "Jury-Rigged Firepower"
  scavenger_fields_wasteland_self_reliance: "Wasteland Self-Reliance"
  SUBDOCTRINE_FORTIFIED_DEPOTS: "Fortified Depots"
  SUBDOCTRINE_FORTIFIED_DEPOTS_DESC: "Fortifying resource depots is crucial for maintaining a steady supply of resources and ensuring the army's sustainability in the wasteland."
  fortified_depots_forward_depots: "Forward Depots"
  fortified_depots_stockpile_defense: "Stockpile Defense"
  fortified_depots_sustained_defense: "Sustained Defense"
  fortified_depots_counter_attack_reserves: "Counter-Attack Reserves"
  fortified_depots_bastion_networks: "Bastion Networks"
  SUBDOCTRINE_WASTELAND_FORAGING: "Wasteland Foraging" 
  SUBDOCTRINE_WASTELAND_FORAGING_DESC: "Survival in the wasteland requires resourcefulness and adaptability. Ancestral knowledge of foraging and scavenging techniques is crucial for sustaining the army in harsh environments."
  wasteland_foraging_hunter_gatherer_ways: "Hunter-Gatherer Ways"
  wasteland_foraging_kinship_bonds: "Kinship Bonds"
  wasteland_foraging_wasteland_scavengers: "Wasteland Scavengers"
  wasteland_foraging_raiding_parties: "Raiding Parties"
  wasteland_foraging_ancestral_knowledge: "Ancestral Knowledge"
  SUBDOCTRINE_MARAUDER_LOGISTICS: "Marauder Logistics"
  SUBDOCTRINE_MARAUDER_LOGISTICS_DESC: "The Marauder Logistics doctrine embraces the brutal truth of the wasteland: the strongest warband is the one that never stops moving. Instead of relying on fragile supply lines, marauders treat every enemy convoy as a mobile depot."
  marauder_logistics_hit_and_run: "Hit and Run"
  marauder_logistics_bloodied_pillaging: "Bloodied Pillaging"
  marauder_logistics_terrorist_occupation: "Terrorist Occupation"
  marauder_logistics_caravan_raiding: "Caravan Raiding"
  marauder_logistics_warlords: "Warlords"
  GRAND_DOCTRINE_GREAT_WAR_DOCTRINE: "Great-War Doctrine"
  GRAND_DOCTRINE_GREAT_WAR_DOCTRINE_DESC: "The Great War between Equestria and the Zebrican Empire forged two of the most disciplined armies the world has ever seen. Their field manuals survived the balefire, and those who study them fight with trained soldiers, prepared positions and careful planning."
  SUBDOCTRINE_STEEL_RANGER_BRIGADES: "Steel Ranger Brigades"
  SUBDOCTRINE_STEEL_RANGER_BRIGADES_DESC: "Equestria answered the zebra lines with ponies in power armor, walking tanks that could hold ground no infantry could take. Their brigades fight in steel, and their doctrine is built around them.\n\nMastery is gained from power armor units.\nCannot be combined with Zebrican Infiltrator Tactics."
  steel_ranger_brigades_walking_tanks: "Walking Tanks"
  steel_ranger_brigades_integrated_fire_teams: "Integrated Fire Teams"
  steel_ranger_brigades_adaptive_chain_of_command: "Adaptive Chain of Command"
  steel_ranger_brigades_combined_arms: "Combined Arms"
  steel_ranger_brigades_brigades_of_steel: "Brigades of Steel"
  SUBDOCTRINE_ZEBRICAN_INFILTRATOR_TACTICS: "Zebrican Infiltrator Tactics"
  SUBDOCTRINE_ZEBRICAN_INFILTRATOR_TACTICS_DESC: "The Zebrican Empire never matched Equestria's steel, so it struck where the steel was not. Small units slip through the lines at night, hit hard and are gone before the enemy can respond.\n\nCannot be combined with Steel Ranger Brigades."
  zebrican_infiltrator_tactics_hit_and_run: "Hit and Run"
  zebrican_infiltrator_tactics_recon_in_depth: "Recon in Depth"
  zebrican_infiltrator_tactics_walking_fire: "Walking Fire"
  zebrican_infiltrator_tactics_scorched_earth: "Scorched Earth"
  zebrican_infiltrator_tactics_shock_and_awe: "Shock and Awe"
  SUBDOCTRINE_GRAND_BATTLE_PLAN: "Grand Battle Plan"
  SUBDOCTRINE_GRAND_BATTLE_PLAN_DESC: "Both armies of the Great War learned that battles are won long before the first shot. Prepared positions, veteran staff and a plan for every sector let a patient commander grind any attacker down."
  grand_battle_plan_grand_battle_plan: "Grand Battle Plan"
  grand_battle_plan_prepared_defense: "Prepared Defense"
  grand_battle_plan_veteran_commanders: "Veteran Commanders"
  grand_battle_plan_military_propaganda: "Military Propaganda"
  grand_battle_plan_grand_assault: "Grand Assault"
  GRAND_DOCTRINE_INDUSTRIAL_WARFARE: "Industrial Warfare"
  GRAND_DOCTRINE_INDUSTRIAL_WARFARE_DESC: "Wars are won on the factory floor. Whoever turns out the most soldiers, machines and shells, whether built by robots or by chained hooves, will bury the enemy under the weight of production."
  SUBDOCTRINE_WAVE_OF_STEEL: "Wave of Steel"
  SUBDOCTRINE_WAVE_OF_STEEL_DESC: "Robots do not tire, do not flee and do not need to be fed. An army of machines, built and repaired by automated factories, rolls over anything made of flesh.\n\nCannot be combined with Waves of Flesh."
  wave_of_steel_doctrine_no_need_for_rest: "No Need for Rest"
  wave_of_steel_doctrine_the_flesh_is_weak: "The Flesh Is Weak"
  wave_of_steel_doctrine_factory_ai: "Factory AI"
  wave_of_steel_doctrine_targeting_algorithms: "Targeting Algorithms"
  wave_of_steel_doctrine_age_of_the_machine: "Age of the Machine"
  SUBDOCTRINE_WAVES_OF_FLESH: "Waves of Flesh"
  SUBDOCTRINE_WAVES_OF_FLESH_DESC: "Every foal is a future soldier. Bred, raised and drilled for the front, the conscript masses are thrown at the enemy until the line breaks.\n\nCannot be combined with Wave of Steel."
  waves_of_flesh_doctrine_born_into_service: "Born into Service"
  waves_of_flesh_doctrine_waves_of_flesh: "Waves of Flesh"
  waves_of_flesh_doctrine_chained_legions: "Chained Legions"
  waves_of_flesh_doctrine_bred_not_born: "Bred, Not Born"
  waves_of_flesh_doctrine_pressed_into_service: "Pressed into Service"
  SUBDOCTRINE_FACTORY_SLAVES: "Factory Slaves"
  SUBDOCTRINE_FACTORY_SLAVES_DESC: "Captives do not fight, they work. Chained to the assembly lines and the supply roads, slaves keep the war machine fed while the soldiers do the killing."
  factory_slaves_doctrine_slave_builders: "Slave Builders"
  factory_slaves_doctrine_assembly_lines: "Assembly Lines"
  factory_slaves_doctrine_supply_caravans: "Supply Caravans"
  factory_slaves_doctrine_secure_homefront: "Secure Homefront"
  factory_slaves_doctrine_ravage_new_lands: "Ravage New Lands"
  SUBDOCTRINE_SCRAP_ARMOR: "Scrap Armor"
  SUBDOCTRINE_SCRAP_ARMOR_DESC: "No factory, no problem. Wasteland armies field whatever they can drag out of the ruins: rusted pre-war tanks, re-flashed robots and captured vehicles, welded together and kept running by stubborn mechanics."
  scrap_armor_salvaged_hulls: "Salvaged Hulls"
  scrap_armor_reprogrammed_robots: "Reprogrammed Robots"
  scrap_armor_spiked_rams: "Spiked Rams"
  scrap_armor_field_repairs: "Field Repairs"
  scrap_armor_road_warriors: "Road Warriors"
  SUBDOCTRINE_IMP_ENHANCED_SOLDIERS: "I.M.P. Enhanced Soldiers"
  SUBDOCTRINE_IMP_ENHANCED_SOLDIERS_DESC: "In the closing days of the Great War, the Ministry of Arcane Sciences turned ponies into alicorns with the Impelled Metamorphosis Potion. The soldiers it made are no longer infantry: hulking, winged and nearly unstoppable, they break lines with awesome magical might.\n\nMastery is gained from Alicorn units.\nRequires Alicorn Body."
  imp_enhanced_soldiers_created_by_balefire: "Created by Balefire"
  imp_enhanced_soldiers_rad_resistance: "Rad Resistance"
  imp_enhanced_soldiers_unnatural_selection: "Unnatural Selection"
  imp_enhanced_soldiers_gifts_of_radiation: "Gifts of Radiation"
  imp_enhanced_soldiers_winged_juggernauts: "Winged Juggernauts"
  SUBDOCTRINE_TELEPATHIC_COMMAND: "Telepathic Command"
  SUBDOCTRINE_TELEPATHIC_COMMAND_DESC: "Alicorns share their thoughts across any distance. Orders need no radio and no runner, every unit knows what the others see, and the army moves as a single mind.\n\nRequires Alicorn Body."
  telepathic_command_one_mind: "One Mind"
  telepathic_command_supernatural_intuition: "Supernatural Intuition"
  telepathic_command_malicious_intellect: "Malicious Intellect"
  telepathic_command_infernal_knowledge: "Infernal Knowledge"
  telepathic_command_hive_mind: "Hive Mind"
  bfb_special_forces_doctrine: "Special Forces Doctrine"
  GRAND_DOCTRINE_SF_WASTELAND_RANGERS: "Wasteland Rangers"
  GRAND_DOCTRINE_SF_WASTELAND_RANGERS_DESC: "Every settlement has its rangers: tough, self-reliant scouts who know the land. Train enough of them and they become an army of their own."
  GRAND_DOCTRINE_SF_ELITE_DETACHMENTS: "Elite Detachments"
  GRAND_DOCTRINE_SF_ELITE_DETACHMENTS_DESC: "Few, but the best the wasteland has to offer. Elite detachments are hoof-picked, trained without mercy and trusted to fight on alone far from any supply line."
  SUBDOCTRINE_SF_WASTELAND_COMMANDOS: "Wasteland Commandos"
  SUBDOCTRINE_SF_WASTELAND_COMMANDOS_DESC: "Small teams of hardened specialists who live behind enemy lines, strike where they are least expected and come home with what they took."
  sf_wasteland_commandos_behind_enemy_lines: "Behind Enemy Lines"
  sf_wasteland_commandos_rapid_selection: "Rapid Selection"
  sf_wasteland_commandos_close_quarters_drills: "Close-Quarters Drills"
  sf_wasteland_commandos_hardened_veterans: "Hardened Veterans"
  sf_wasteland_commandos_night_raids: "Night Raids"
  SUBDOCTRINE_SF_PEGASUS_STRIKE_WINGS: "Pegasus Strike Wings"
  SUBDOCTRINE_SF_PEGASUS_STRIKE_WINGS_DESC: "Pegasus troops drop out of the clouds onto the enemy's rear, break through before the line can react and are gone again on the wind."
  sf_pegasus_strike_wings_cloud_cover: "Cloud Cover"
  sf_pegasus_strike_wings_diving_assault: "Diving Assault"
  sf_pegasus_strike_wings_wing_drills: "Wing Drills"
  sf_pegasus_strike_wings_lightning_raids: "Lightning Raids"
  sf_pegasus_strike_wings_masters_of_the_sky: "Masters of the Sky"
  SUBDOCTRINE_SF_TALON_MERCENARIES: "Talon Mercenaries"
  SUBDOCTRINE_SF_TALON_MERCENARIES_DESC: "Griffon mercenaries fight for caps, and they fight well. Paid on time and led by veterans of a hundred contracts, a Talon company does not break."
  sf_talon_mercenaries_paid_in_caps: "Paid in Caps"
  sf_talon_mercenaries_contract_veterans: "Contract Veterans"
  sf_talon_mercenaries_talon_discipline: "Talon Discipline"
  sf_talon_mercenaries_aerial_assault: "Aerial Assault"
  sf_talon_mercenaries_company_reputation: "Company Reputation"
  SUBDOCTRINE_SF_IRONPAW_DIGGERS: "Ironpaw Diggers"
  SUBDOCTRINE_SF_IRONPAW_DIGGERS_DESC: "Diamond dogs dig in faster and deeper than anyone else. Once an Ironpaw unit has gone to ground, it takes an army to dig it out again."
  sf_ironpaw_diggers_tunnel_networks: "Tunnel Networks"
  sf_ironpaw_diggers_dug_in: "Dug In"
  sf_ironpaw_diggers_burrow_ambush: "Burrow Ambush"
  sf_ironpaw_diggers_stubborn_diggers: "Stubborn Diggers"
  sf_ironpaw_diggers_underground_caches: "Underground Caches"
  SUBDOCTRINE_SF_LEGION_COHORTS: "Legion Cohorts"
  SUBDOCTRINE_SF_LEGION_COHORTS_DESC: "The legion fights in disciplined cohorts that hold their shields together under any fire and advance at a steady march until the enemy line gives way."
  sf_legion_cohorts_iron_discipline: "Iron Discipline"
  sf_legion_cohorts_shield_wall: "Shield Wall"
  sf_legion_cohorts_forced_march: "Forced March"
  sf_legion_cohorts_centurion_command: "Centurion Command"
  sf_legion_cohorts_crushing_charge: "Crushing Charge"
  SUBDOCTRINE_SF_YAK_SMASHERS: "Yak Smashers"
  SUBDOCTRINE_SF_YAK_SMASHERS_DESC: "Yaks do not do subtle. They come down from the mountains in a stampede of horns and fury and smash whatever stands in their way."
  sf_yak_smashers_berserker_fury: "Berserker Fury"
  sf_yak_smashers_thick_hides: "Thick Hides"
  sf_yak_smashers_mountain_born: "Mountain Born"
  sf_yak_smashers_smash: "SMASH!"
  sf_yak_smashers_stampede: "Stampede"
  SUBDOCTRINE_SF_ALICORN_SPELLCASTERS: "Alicorn Spellcasters"
  SUBDOCTRINE_SF_ALICORN_SPELLCASTERS_DESC: "Beyond brute strength, alicorns command the full range of unicorn magic: they teleport into the enemy's lines, turn invisible and shield themselves with spells."
  sf_alicorn_spellcasters_teleport_strike: "Teleport Strike"
  sf_alicorn_spellcasters_invisibility_spells: "Invisibility Spells"
  sf_alicorn_spellcasters_arcane_barrage: "Arcane Barrage"
  sf_alicorn_spellcasters_shield_spells: "Shield Spells"
  sf_alicorn_spellcasters_blink_assault: "Blink Assault"
  SUBDOCTRINE_SF_STEEL_RANGER_PALADINS: "Steel Ranger Paladins"
  SUBDOCTRINE_SF_STEEL_RANGER_PALADINS_DESC: "Only the best knights earn the rank of Paladin. Drilled for years in their armor and armed with the finest energy weapons, they lead every assault from the front."
  sf_steel_ranger_paladins_paladin_training: "Paladin Training"
  sf_steel_ranger_paladins_laser_discipline: "Laser Discipline"
  sf_steel_ranger_paladins_reinforced_plating: "Reinforced Plating"
  sf_steel_ranger_paladins_fireteam_doctrine: "Fireteam Doctrine"
  sf_steel_ranger_paladins_codex_of_steel: "Codex of Steel"
  DOCTRINE_TRACK_SF_TERRAIN: "Terrain Specialization"
  SUBDOCTRINE_SF_MOUNTAIN_RANGERS: "Mountain Rangers"
  SUBDOCTRINE_SF_MOUNTAIN_RANGERS_DESC: "Specialists who live on the high passes. They climb where others cannot, fight through snow and ice, and hold ridgelines against any odds.\n\nUnlocked by completing a special forces track."
  sf_mountain_rangers_high_ground: "High Ground"
  sf_mountain_rangers_snow_walkers: "Snow Walkers"
  sf_mountain_rangers_mountain_fastness: "Mountain Fastness"
  sf_mountain_rangers_goat_trails: "Goat Trails"
  sf_mountain_rangers_ranger_instructors: "Ranger Instructors"
  SUBDOCTRINE_SF_FOREST_STALKERS: "Forest Stalkers"
  SUBDOCTRINE_SF_FOREST_STALKERS_DESC: "In the overgrown forests of the wasteland, the enemy never sees them coming. Forest stalkers strike from cover and melt back into the trees.\n\nUnlocked by completing a special forces track."
  sf_forest_stalkers_canopy_strikes: "Canopy Strikes"
  sf_forest_stalkers_ambush_positions: "Ambush Positions"
  sf_forest_stalkers_hidden_camps: "Hidden Camps"
  sf_forest_stalkers_game_trails: "Game Trails"
  sf_forest_stalkers_woodcraft_school: "Woodcraft School"
  SUBDOCTRINE_SF_RUIN_CRAWLERS: "Ruin Crawlers"
  SUBDOCTRINE_SF_RUIN_CRAWLERS_DESC: "The pre-war cities and sealed Stables are mazes of rubble, tunnels and blast doors. Ruin crawlers know every one of them and clear them room by room.\n\nUnlocked by completing a special forces track."
  sf_ruin_crawlers_room_clearing: "Room Clearing"
  sf_ruin_crawlers_breaching_the_stables: "Breaching the Stables"
  sf_ruin_crawlers_rubble_fortresses: "Rubble Fortresses"
  sf_ruin_crawlers_tunnel_routes: "Tunnel Routes"
  sf_ruin_crawlers_urban_warfare_school: "Urban Warfare School"
  SUBDOCTRINE_SF_DUST_WALKERS: "Dust Walkers"
  SUBDOCTRINE_SF_DUST_WALKERS_DESC: "Hardened by sun and radiation, dust walkers cross the deserts and the edges of the glowing lands where no one else would go, and bring back what they learned.\n\nUnlocked by completing a special forces track."
  sf_dust_walkers_dune_raiders: "Dune Raiders"
  sf_dust_walkers_sun_hardened: "Sun-Hardened"
  sf_dust_walkers_dug_into_the_dunes: "Dug into the Dunes"
  sf_dust_walkers_rad_away_rations: "Rad-Away Rations"
  sf_dust_walkers_glowing_lands_lore: "Glowing Lands Lore"
  SUBDOCTRINE_SF_SWAMP_RUNNERS: "Swamp Runners"
  SUBDOCTRINE_SF_SWAMP_RUNNERS_DESC: "Where the ground turns to mud and every river is an obstacle, swamp runners move freely. They wade, swim and strike from the reeds.\n\nUnlocked by completing a special forces track."
  sf_swamp_runners_bog_ambush: "Bog Ambush"
  sf_swamp_runners_river_fording: "River Fording"
  sf_swamp_runners_stilted_outposts: "Stilted Outposts"
  sf_swamp_runners_reed_paths: "Reed Paths"
  sf_swamp_runners_swamp_lore: "Swamp Lore"
  SUBDOCTRINE_SF_NIGHT_HUNTERS: "Night Hunters"
  SUBDOCTRINE_SF_NIGHT_HUNTERS_DESC: "The wasteland belongs to whoever owns the dark. Night hunters teach the whole army to fight after sundown, and lead the attacks themselves.\n\nUnlocked by completing a special forces track."
  sf_night_hunters_silent_approach: "Silent Approach"
  sf_night_hunters_night_drills: "Night Drills"
  sf_night_hunters_moonlit_raids: "Moonlit Raids"
  sf_night_hunters_sleepless_watch: "Sleepless Watch"
  sf_night_hunters_owning_the_dark: "Owning the Dark"
