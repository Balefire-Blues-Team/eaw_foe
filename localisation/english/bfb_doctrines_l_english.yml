  SUBDOCTRINE_SF_PROJECT_UNSTOPPABLE: "Project Unstoppable"
  SUBDOCTRINE_SF_PROJECT_UNSTOPPABLE_DESC: "Boiling Brew's combat chems turn volunteers into Aurumites: golden-eyed super soldiers who feel no pain, never tire and keep fighting long after any normal pony would have fallen."
  sf_project_unstoppable_combat_stimulants: "Combat Stimulants"
  sf_project_unstoppable_serum_refinement: "Serum Refinement"
  sf_project_unstoppable_pain_suppressors: "Pain Suppressors"
  sf_project_unstoppable_berserk_doses: "Berserk Doses"
  sf_project_unstoppable_unstoppable: "Unstoppable"
  SUBDOCTRINE_ARCANE_SUPPORT_CORPS: "Arcane Support Corps"
  SUBDOCTRINE_ARCANE_SUPPORT_CORPS_DESC: "A single company of trained unicorns can change the course of a battle: they raise shields over the line, heal the wounded, hurl debris with telekinesis and scry out the enemy's positions.\n\nRequires unicorn support companies."
  arcane_support_corps_shield_spells: "Shield Spells"
  arcane_support_corps_healing_magic: "Healing Magic"
  arcane_support_corps_telekinetic_barrage: "Telekinetic Barrage"
  arcane_support_corps_scrying_spells: "Scrying Spells"
  arcane_support_corps_battle_mages: "Battle Mages"
  SUBDOCTRINE_NECROVICORUM: "Necrovicorum"
  SUBDOCTRINE_NECROVICORUM_DESC: "The dead do not tire, do not desert and do not need to be paid. Necromancer-officers raise the fallen and drive them forward, and whatever falls on the field today may march again tomorrow.\n\nMastery is gained from undead units."
  necrovicorum_raise_the_fallen: "Raise the Fallen"
  necrovicorum_necromancer_officers: "Necromancer-Officers"
  necrovicorum_bone_plating: "Bone Plating"
  necrovicorum_tireless_dead: "Tireless Dead"
  necrovicorum_abomination_vanguard: "Abomination Vanguard"

  # Air doctrines
  GRAND_DOCTRINE_WARTIME_AIR_COMMAND: "Wartime Air Command"
  GRAND_DOCTRINE_WARTIME_AIR_COMMAND_DESC: "The ministries fought their war from the sky down: win the air first, then burn out whatever feeds the enemy's army. Those who inherited their manuals, their hangars or their arrogance still fly that way."
  GRAND_DOCTRINE_ARMY_COOPERATION: "Army Cooperation"
  GRAND_DOCTRINE_ARMY_COOPERATION_DESC: "An aircraft is artillery that can fly. Every wing answers to the front it flies over, and a sortie that does not help the troops below was a waste of fuel."
  GRAND_DOCTRINE_WASTELAND_SKIES: "Wasteland Skies"
  GRAND_DOCTRINE_WASTELAND_SKIES_DESC: "Anything that still flies in the wasteland was dug out of a ruin and is held together by wire and stubbornness. Nobody can afford to lose such a machine, or the pony who knows how to land it."
  DOCTRINE_TRACK_BFB_FIGHTER_AIRCRAFT: "Fighters"
  DOCTRINE_TRACK_BFB_STRIKE_AIRCRAFT: "Strike Craft"
  DOCTRINE_TRACK_BFB_HEAVY_AIRCRAFT: "Heavy Bombers"
  DOCTRINE_TRACK_BFB_AIRSHIPS: "Airships"
  SUBDOCTRINE_AIR_SUB_INTERCEPTORS: "Interceptor Screens"
  SUBDOCTRINE_AIR_SUB_INTERCEPTORS_DESC: "Fighters are kept close to what they protect and sent up the moment something hostile is seen. Nothing crosses our sky unchallenged."
  air_sub_interceptors_scramble_drills: "Scramble Drills"
  air_sub_interceptors_point_defence: "Point Defence"
  air_sub_interceptors_bomber_killers: "Bomber Killers"
  air_sub_interceptors_ground_controllers: "Ground Controllers"
  air_sub_interceptors_dispersed_fields: "Dispersed Fields"
  SUBDOCTRINE_AIR_SUB_ESCORT_WINGS: "Escort Wings"
  SUBDOCTRINE_AIR_SUB_ESCORT_WINGS_DESC: "A bomber that arrives alone does not come home. Fighters fly out with the strike force and stay with it all the way."
  air_sub_escort_wings_drop_tanks: "Drop Tanks"
  air_sub_escort_wings_close_escort: "Close Escort"
  air_sub_escort_wings_heavy_fighter_sweeps: "Heavy Fighter Sweeps"
  air_sub_escort_wings_relay_escorts: "Relay Escorts"
  air_sub_escort_wings_long_patrols: "Long Patrols"
  SUBDOCTRINE_AIR_SUB_DOGFIGHTERS: "Dogfighting Aces"
  SUBDOCTRINE_AIR_SUB_DOGFIGHTERS_DESC: "Machines can be rebuilt; a pilot with twenty kills cannot. The best flyers are given the best aircraft and the freedom to hunt."
  air_sub_dogfighters_loose_pairs: "Loose Pairs"
  air_sub_dogfighters_ace_schools: "Ace Schools"
  air_sub_dogfighters_energy_fighting: "Energy Fighting"
  air_sub_dogfighters_veteran_cadres: "Veteran Cadres"
  air_sub_dogfighters_aces_high: "Aces High"
  SUBDOCTRINE_AIR_SUB_DIVE_BOMBING: "Dive Bombing"
  SUBDOCTRINE_AIR_SUB_DIVE_BOMBING_DESC: "A light bomber pointed straight at its target and released at the last moment hits what it aims at. The crews need steady nerves and a strong airframe."
  air_sub_dive_bombing_steep_approach: "Steep Approach"
  air_sub_dive_bombing_forward_observers: "Forward Observers"
  air_sub_dive_bombing_hardened_crews: "Hardened Crews"
  air_sub_dive_bombing_screaming_dives: "Screaming Dives"
  air_sub_dive_bombing_pinpoint_release: "Pinpoint Release"
  SUBDOCTRINE_AIR_SUB_GUNSHIP_SUPPORT: "Gunship Support"
  SUBDOCTRINE_AIR_SUB_GUNSHIP_SUPPORT_DESC: "Rotorcraft need no runway and can wait behind the next ridge. They follow the troops forward and answer a call for fire within minutes."
  air_sub_gunship_support_nap_of_the_earth: "Nap of the Earth"
  air_sub_gunship_support_forward_arming_points: "Forward Arming Points"
  air_sub_gunship_support_loitering_fire: "Loitering Fire"
  air_sub_gunship_support_tank_hunters: "Tank Hunters"
  air_sub_gunship_support_all_weather_rotors: "All-Weather Rotors"
  SUBDOCTRINE_AIR_SUB_INTERDICTION: "Battlefield Interdiction"
  SUBDOCTRINE_AIR_SUB_INTERDICTION_DESC: "The enemy's front line is fed by roads, bridges and ships. Strike craft range behind it and attack whatever moves, by day and by night."
  air_sub_interdiction_road_hunting: "Road Hunting"
  air_sub_interdiction_armed_reconnaissance: "Armed Reconnaissance"
  air_sub_interdiction_ship_hunters: "Ship Hunters"
  air_sub_interdiction_night_intruders: "Night Intruders"
  air_sub_interdiction_relentless_pressure: "Relentless Pressure"
  SUBDOCTRINE_AIR_SUB_AREA_BOMBING: "Area Bombing"
  SUBDOCTRINE_AIR_SUB_AREA_BOMBING_DESC: "If the factory cannot be hit, the district around it can. Heavy bombers fly in streams and unload on everything below."
  air_sub_area_bombing_bomber_streams: "Bomber Streams"
  air_sub_area_bombing_night_raids: "Night Raids"
  air_sub_area_bombing_firestorms: "Firestorms"
  air_sub_area_bombing_massed_formations: "Massed Formations"
  air_sub_area_bombing_under_cover_of_dark: "Under Cover of Dark"
  SUBDOCTRINE_AIR_SUB_PRECISION_RAIDS: "Precision Raids"
  SUBDOCTRINE_AIR_SUB_PRECISION_RAIDS_DESC: "One bomb on the right generator hall is worth a thousand on the houses around it. Crews train to find a single building and hit it in daylight."
  air_sub_precision_raids_bombsight_training: "Bombsight Training"
  air_sub_precision_raids_daylight_raids: "Daylight Raids"
  air_sub_precision_raids_pathfinders: "Pathfinders"
  air_sub_precision_raids_keypoint_targets: "Keypoint Targets"
  air_sub_precision_raids_battlefield_heavies: "Battlefield Heavies"
  SUBDOCTRINE_AIR_SUB_LONG_RANGE_OPERATIONS: "Long-Range Operations"
  SUBDOCTRINE_AIR_SUB_LONG_RANGE_OPERATIONS_DESC: "Equestria is wide and good airfields are rare. Heavy aircraft are flown to the edge of their range and trusted to look after themselves there."
  air_sub_long_range_operations_staging_fields: "Staging Fields"
  air_sub_long_range_operations_crew_rotation: "Crew Rotation"
  air_sub_long_range_operations_defensive_boxes: "Defensive Boxes"
  air_sub_long_range_operations_deep_raids: "Deep Raids"
  air_sub_long_range_operations_self_reliance: "Self-Reliance"
  SUBDOCTRINE_AIR_SUB_SKY_FORTRESSES: "Sky Fortresses"
  SUBDOCTRINE_AIR_SUB_SKY_FORTRESSES_DESC: "An airship cannot outrun or outturn anything, so it is built to outlast it: gun decks on every side, and an envelope that takes a beating."
  air_sub_sky_fortresses_gun_decks: "Gun Decks"
  air_sub_sky_fortresses_armoured_envelopes: "Armoured Envelopes"
  air_sub_sky_fortresses_picket_lines: "Picket Lines"
  air_sub_sky_fortresses_damage_control: "Damage Control"
  air_sub_sky_fortresses_broadside_drill: "Broadside Drill"
  SUBDOCTRINE_AIR_SUB_FIRE_SUPPORT_PLATFORMS: "Fire Support Platforms"
  SUBDOCTRINE_AIR_SUB_FIRE_SUPPORT_PLATFORMS_DESC: "An airship can carry guns no aeroplane could lift and hang over a battlefield for hours. It is a battery that needs no road."
  air_sub_fire_support_platforms_hovering_batteries: "Hovering Batteries"
  air_sub_fire_support_platforms_spotter_gondolas: "Spotter Gondolas"
  air_sub_fire_support_platforms_siege_bombardment: "Siege Bombardment"
  air_sub_fire_support_platforms_heavy_ordnance: "Heavy Ordnance"
  air_sub_fire_support_platforms_sustained_station: "Sustained Station"
  SUBDOCTRINE_AIR_SUB_PATROL_BLIMPS: "Patrol Blimps"
  SUBDOCTRINE_AIR_SUB_PATROL_BLIMPS_DESC: "A gas bag, an engine and a crew of four are cheap, and they can stay up for days. What they lack in fight they make up in numbers and reach."
  air_sub_patrol_blimps_skeleton_crews: "Skeleton Crews"
  air_sub_patrol_blimps_mooring_masts: "Mooring Masts"
  air_sub_patrol_blimps_coastal_watch: "Coastal Watch"
  air_sub_patrol_blimps_workshop_gasbags: "Workshop Gasbags"
  air_sub_patrol_blimps_long_endurance: "Long Endurance"

  # Sea doctrines
  GRAND_DOCTRINE_BATTLE_FLEET: "Battle Fleet"
  GRAND_DOCTRINE_BATTLE_FLEET_DESC: "The sea belongs to whoever can put the heaviest guns and the most aircraft over it on the day that matters. Everything else in the fleet exists to bring the big ships to that day intact."
  GRAND_DOCTRINE_CORSAIR_FLEET: "Corsair Fleet"
  GRAND_DOCTRINE_CORSAIR_FLEET_DESC: "A small navy cannot win a battle, but it does not have to fight one. Fast ships strike where the enemy is not, take what his convoys carry, and are gone before his fleet arrives."
  DOCTRINE_TRACK_BFB_SCREENS: "Escorts"
  DOCTRINE_TRACK_BFB_CAPITAL_SHIPS: "Capital Ships"
  DOCTRINE_TRACK_BFB_CARRIERS: "Carriers"
  DOCTRINE_TRACK_BFB_FLEET_OPERATIONS: "Fleet Operations"
  SUBDOCTRINE_SEA_SUB_CONVOY_ESCORTS: "Convoy Escorts"
  SUBDOCTRINE_SEA_SUB_CONVOY_ESCORTS_DESC: "A cargo that arrives is worth more than an enemy sunk. Escorts stay with the convoy, whatever tempts them away."
  sea_sub_convoy_escorts_herding_drills: "Herding Drills"
  sea_sub_convoy_escorts_picket_stations: "Picket Stations"
  sea_sub_convoy_escorts_close_cover: "Close Cover"
  sea_sub_convoy_escorts_long_haul_crews: "Long-Haul Crews"
  sea_sub_convoy_escorts_escort_groups: "Escort Groups"
  SUBDOCTRINE_SEA_SUB_FLEET_SCREENS: "Fleet Screens"
  SUBDOCTRINE_SEA_SUB_FLEET_SCREENS_DESC: "Escorts form a ring around the heavy ships and take whatever is aimed at them: torpedoes, aircraft, or the enemy's own escorts."
  sea_sub_fleet_screens_station_keeping: "Station Keeping"
  sea_sub_fleet_screens_flak_umbrella: "Flak Umbrella"
  sea_sub_fleet_screens_torpedo_shield: "Torpedo Shield"
  sea_sub_fleet_screens_missile_pickets: "Missile Pickets"
  sea_sub_fleet_screens_tight_formation: "Tight Formation"
  SUBDOCTRINE_SEA_SUB_TORPEDO_FLOTILLAS: "Torpedo Flotillas"
  SUBDOCTRINE_SEA_SUB_TORPEDO_FLOTILLAS_DESC: "A destroyer costs a fraction of a capital ship and carries the one weapon that can sink it. Flotillas attack together, at night, at speed."
  sea_sub_torpedo_flotillas_night_attacks: "Night Attacks"
  sea_sub_torpedo_flotillas_massed_spreads: "Massed Spreads"
  sea_sub_torpedo_flotillas_flotilla_leaders: "Flotilla Leaders"
  sea_sub_torpedo_flotillas_slip_the_screen: "Slip the Screen"
  sea_sub_torpedo_flotillas_fast_run_in: "Fast Run-In"
  SUBDOCTRINE_SEA_SUB_LINE_OF_BATTLE: "Line of Battle"
  SUBDOCTRINE_SEA_SUB_LINE_OF_BATTLE_DESC: "Heavy ships fight together, in order, under one flag. The side whose line holds and whose guns keep firing owns the sea afterwards."
  sea_sub_line_of_battle_gunnery_drills: "Gunnery Drills"
  sea_sub_line_of_battle_flagship_command: "Flagship Command"
  sea_sub_line_of_battle_damage_control: "Damage Control"
  sea_sub_line_of_battle_armour_schemes: "Armour Schemes"
  sea_sub_line_of_battle_decisive_battle: "Decisive Battle"
  SUBDOCTRINE_SEA_SUB_SHORE_BOMBARDMENT: "Shore Bombardment"
  SUBDOCTRINE_SEA_SUB_SHORE_BOMBARDMENT_DESC: "Most of Equestria's wars are decided on land, and much of that land lies within reach of a heavy gun. The fleet's big ships are its largest artillery."
  sea_sub_shore_bombardment_fire_plans: "Fire Plans"
  sea_sub_shore_bombardment_landing_cover: "Landing Cover"
  sea_sub_shore_bombardment_inshore_work: "Inshore Work"
  sea_sub_shore_bombardment_secondary_batteries: "Secondary Batteries"
  sea_sub_shore_bombardment_standing_bombardment: "Standing Bombardment"
  SUBDOCTRINE_SEA_SUB_HEAVY_RAIDERS: "Heavy Raiders"
  SUBDOCTRINE_SEA_SUB_HEAVY_RAIDERS_DESC: "One heavy ship loose on the trade routes ties down a squadron sent to find it. It outruns what it cannot fight and outguns what it cannot outrun."
  sea_sub_heavy_raiders_lone_wolves: "Lone Wolves"
  sea_sub_heavy_raiders_hit_and_fade: "Hit and Fade"
  sea_sub_heavy_raiders_prize_crews: "Prize Crews"
  sea_sub_heavy_raiders_low_silhouette: "Low Silhouette"
  sea_sub_heavy_raiders_raider_gunnery: "Raider Gunnery"
  SUBDOCTRINE_SEA_SUB_CARRIER_STRIKE_GROUPS: "Carrier Strike Groups"
  SUBDOCTRINE_SEA_SUB_CARRIER_STRIKE_GROUPS_DESC: "The carrier is the fleet's main weapon and its air wing is the shell. Everything is arranged so the first strike lands before the enemy has found us."
  sea_sub_carrier_strike_groups_deck_cycles: "Deck Cycles"
  sea_sub_carrier_strike_groups_strike_coordination: "Strike Coordination"
  sea_sub_carrier_strike_groups_armed_and_waiting: "Armed and Waiting"
  sea_sub_carrier_strike_groups_fleet_speed: "Fleet Speed"
  sea_sub_carrier_strike_groups_alpha_strikes: "Alpha Strikes"
  SUBDOCTRINE_SEA_SUB_FLOATING_AIRFIELDS: "Floating Airfields"
  SUBDOCTRINE_SEA_SUB_FLOATING_AIRFIELDS_DESC: "Good airfields are rare on the coast and there are none at sea. A carrier parked offshore is a runway that can be moved to wherever the war is."
  sea_sub_floating_airfields_crowded_decks: "Crowded Decks"
  sea_sub_floating_airfields_port_raids: "Port Raids"
  sea_sub_floating_airfields_deck_armour: "Deck Armour"
  sea_sub_floating_airfields_night_landings: "Night Landings"
  sea_sub_floating_airfields_long_stations: "Long Stations"
  SUBDOCTRINE_SEA_SUB_ESCORT_CARRIERS: "Escort Carriers"
  SUBDOCTRINE_SEA_SUB_ESCORT_CARRIERS_DESC: "A flight deck welded onto a freighter hull is no fleet carrier, but it puts eyes over a convoy and it can be built by any yard."
  sea_sub_escort_carriers_converted_hulls: "Converted Hulls"
  sea_sub_escort_carriers_air_patrols: "Air Patrols"
  sea_sub_escort_carriers_convoy_cover: "Convoy Cover"
  sea_sub_escort_carriers_flak_decks: "Flak Decks"
  sea_sub_escort_carriers_hunting_groups: "Hunting Groups"
  SUBDOCTRINE_SEA_SUB_COMMERCE_RAIDING: "Commerce Raiding"
  SUBDOCTRINE_SEA_SUB_COMMERCE_RAIDING_DESC: "An enemy who cannot ship fuel, steel and food cannot fight for long. The fleet is sent after his merchant ships and kept away from his warships."
  sea_sub_commerce_raiding_sea_lane_charts: "Sea Lane Charts"
  sea_sub_commerce_raiding_prize_rules: "Prize Rules"
  sea_sub_commerce_raiding_refuelling_at_sea: "Refuelling at Sea"
  sea_sub_commerce_raiding_slip_away: "Slip Away"
  sea_sub_commerce_raiding_wide_sweeps: "Wide Sweeps"
  SUBDOCTRINE_SEA_SUB_LANDING_OPERATIONS: "Landing Operations"
  SUBDOCTRINE_SEA_SUB_LANDING_OPERATIONS_DESC: "The navy's real task is to put an army ashore and keep it fed there, and to stop anyone doing the same to us."
  sea_sub_landing_operations_fire_support_ships: "Fire Support Ships"
  sea_sub_landing_operations_coastal_watch: "Coastal Watch"
  sea_sub_landing_operations_floating_piers: "Floating Piers"
  sea_sub_landing_operations_rehearsals: "Rehearsals"
  sea_sub_landing_operations_beach_depots: "Beach Depots"
  SUBDOCTRINE_SEA_SUB_FLEET_LOGISTICS: "Fleet Logistics"
  SUBDOCTRINE_SEA_SUB_FLEET_LOGISTICS_DESC: "Two hundred years after the war, a working dry dock is rarer than a working warship. A fleet that can repair, refuel and refit itself is twice its size."
  sea_sub_fleet_logistics_dockyard_crews: "Dockyard Crews"
  sea_sub_fleet_logistics_refit_yards: "Refit Yards"
  sea_sub_fleet_logistics_fleet_tenders: "Fleet Tenders"
  sea_sub_fleet_logistics_signal_books: "Signal Books"
  sea_sub_fleet_logistics_salvage_parties: "Salvage Parties"

  # Air specialty subdoctrines
  SUBDOCTRINE_AIR_SPEC_CRYSTAL_LANCERS: "Crystal Lancers"
  SUBDOCTRINE_AIR_SPEC_CRYSTAL_LANCERS_DESC: "A pulse engine throws a fighter across the sky faster than anything with a propeller can follow. Lancers make one pass at full speed and are gone before the enemy has turned.\n\nUnlocked by Crystal Frame."
  air_spec_crystal_lancers_pulse_sprint: "Pulse Sprint"
  air_spec_crystal_lancers_slashing_passes: "Slashing Passes"
  air_spec_crystal_lancers_resonance_ranging: "Resonance Ranging"
  air_spec_crystal_lancers_attuned_pilots: "Attuned Pilots"
  air_spec_crystal_lancers_lance_formation: "Lance Formation"
  SUBDOCTRINE_AIR_SPEC_GHOST_SQUADRONS: "Ghost Squadrons"
  SUBDOCTRINE_AIR_SPEC_GHOST_SQUADRONS_DESC: "Zebrican stealth fields hide a fighter until it opens fire. Ghost pilots choose every fight they are in, and they only choose the ones already won.\n\nUnlocked by Zebrican Stealth Frame."
  air_spec_ghost_squadrons_silent_approach: "Silent Approach"
  air_spec_ghost_squadrons_cloaked_patrols: "Cloaked Patrols"
  air_spec_ghost_squadrons_no_fair_fights: "No Fair Fights"
  air_spec_ghost_squadrons_night_stalkers: "Night Stalkers"
  air_spec_ghost_squadrons_gone_without_a_trace: "Gone Without a Trace"
  SUBDOCTRINE_AIR_SPEC_ALICORN_FLIGHTS: "Alicorn Flights"
  SUBDOCTRINE_AIR_SPEC_ALICORN_FLIGHTS_DESC: "Wings joined mind to mind need no radio and make no mistakes of timing. What one pilot sees, all of them see, and what one learns is never lost.\n\nUnlocked by alicorn equipment."
  air_spec_alicorn_flights_many_wings_one_mind: "Many Wings, One Mind"
  air_spec_alicorn_flights_shared_sight: "Shared Sight"
  air_spec_alicorn_flights_perfect_formation: "Perfect Formation"
  air_spec_alicorn_flights_nothing_forgotten: "Nothing Forgotten"
  air_spec_alicorn_flights_guided_claws: "Guided Strikes"
  SUBDOCTRINE_AIR_SPEC_SHADOWBOLT_OPERATIONS: "Shadowbolt Operations"
  SUBDOCTRINE_AIR_SPEC_SHADOWBOLT_OPERATIONS_DESC: "The Shadowbolts were Equestria's answer to a front that would not move: pegasi dropped behind it at night, with fighters overhead to keep the sky clear. The fighters matter less than who they deliver.\n\nUnlocked by pegasus divisions."
  air_spec_shadowbolt_operations_jump_wings: "Jump Wings"
  air_spec_shadowbolt_operations_fighter_cover: "Fighter Cover"
  air_spec_shadowbolt_operations_behind_the_lines: "Behind the Lines"
  air_spec_shadowbolt_operations_light_loads: "Light Loads"
  air_spec_shadowbolt_operations_shadowbolts: "Shadowbolts"
  SUBDOCTRINE_AIR_SPEC_VERTIBUCK_ASSAULT: "Vertibuck Assault"
  SUBDOCTRINE_AIR_SPEC_VERTIBUCK_ASSAULT_DESC: "A Vertibuck does not drop its load and leave. It sets down where it is needed, and its guns stay over the landing zone until the fight below is finished.\n\nUnlocked by the Vertibuck."
  air_spec_vertibuck_assault_hot_landing_zones: "Hot Landing Zones"
  air_spec_vertibuck_assault_armoured_bellies: "Armoured Bellies"
  air_spec_vertibuck_assault_door_gunners: "Door Gunners"
  air_spec_vertibuck_assault_rapid_turnaround: "Rapid Turnaround"
  air_spec_vertibuck_assault_air_cavalry: "Air Cavalry"
  SUBDOCTRINE_AIR_SPEC_SKYTANK_COLUMNS: "Skytank Columns"
  SUBDOCTRINE_AIR_SPEC_SKYTANK_COLUMNS_DESC: "Half gunship, half airship, a Skytank is too slow to dodge anything and does not need to. Columns of them drift over a front and take it apart at their leisure.\n\nUnlocked by the Skytank."
  air_spec_skytank_columns_flying_bunkers: "Flying Bunkers"
  air_spec_skytank_columns_heavy_gun_pods: "Heavy Gun Pods"
  air_spec_skytank_columns_slow_and_steady: "Slow and Steady"
  air_spec_skytank_columns_armoured_escort: "Armoured Escort"
  air_spec_skytank_columns_siege_from_above: "Siege from Above"
  SUBDOCTRINE_AIR_SPEC_WEATHER_MASTERY: "Weather Mastery"
  SUBDOCTRINE_AIR_SPEC_WEATHER_MASTERY_DESC: "Pegasi do not wait for good bombing weather; they make it. Cloud is laid over the route out and pulled off the target, and the storm that follows is theirs as well.\n\nUnlocked by pegasus nations."
  air_spec_weather_mastery_overcast_to_order: "Overcast to Order"
  air_spec_weather_mastery_clear_skies_over_target: "Clear Skies over the Target"
  air_spec_weather_mastery_storm_walls: "Storm Walls"
  air_spec_weather_mastery_night_weather_teams: "Night Weather Teams"
  air_spec_weather_mastery_the_sky_is_ours: "The Sky Is Ours"
  SUBDOCTRINE_AIR_SPEC_RUINATION_PROTOCOLS: "Ruination Protocols"
  SUBDOCTRINE_AIR_SPEC_RUINATION_PROTOCOLS_DESC: "The Zebrican answer to a defended region is to make it unfit for anything alive, and then to send in soldiers that are not. Heavy bombers poison and flatten; machines walk in over what is left.\n\nUnlocked by zebra nations."
  air_spec_ruination_protocols_salt_the_earth: "Salt the Earth"
  air_spec_ruination_protocols_unfeeling_vanguard: "Unfeeling Vanguard"
  air_spec_ruination_protocols_nothing_left_standing: "Nothing Left Standing"
  air_spec_ruination_protocols_machines_follow_the_fire: "Machines Follow the Fire"
  air_spec_ruination_protocols_total_ruin: "Total Ruin"
  SUBDOCTRINE_AIR_SPEC_RAPTOR_FLEETS: "Raptor Fleets"
  SUBDOCTRINE_AIR_SPEC_RAPTOR_FLEETS_DESC: "A Raptor is a warship that happens to sail on cloud. The Enclave built its whole air arm around them: smaller craft scout and screen, and the Raptors decide the battle.\n\nUnlocked by the Raptor."
  air_spec_raptor_fleets_cloud_plating: "Cloud Plating"
  air_spec_raptor_fleets_dragonlance_batteries: "Dragonlance Batteries"
  air_spec_raptor_fleets_escort_squadrons: "Escort Squadrons"
  air_spec_raptor_fleets_command_decks: "Command Decks"
  air_spec_raptor_fleets_rulers_of_the_sky: "Rulers of the Sky"
  SUBDOCTRINE_AIR_SPEC_WING_AND_TALON: "Wing and Talon"
  SUBDOCTRINE_AIR_SPEC_WING_AND_TALON_DESC: "A griffon who flies a machine has been flying all her life already. She reads the air without instruments, scouts a target on her own wings before she attacks it, and if the machine is shot from under her, she simply flies home.\n\nUnlocked by griffon nations."
  air_spec_wing_and_talon_born_on_the_wing: "Born on the Wing"
  air_spec_wing_and_talon_winged_spotters: "Winged Spotters"
  air_spec_wing_and_talon_stoop_attacks: "Stoop Attacks"
  air_spec_wing_and_talon_crews_fly_home: "Crews Fly Home"
  air_spec_wing_and_talon_talons_from_above: "Talons from Above"

  # Sea specialty subdoctrines
  SUBDOCTRINE_SEA_SPEC_GHOST_FLOTILLAS: "Ghost Flotillas"
  SUBDOCTRINE_SEA_SPEC_GHOST_FLOTILLAS_DESC: "Stealth plating turns a destroyer into a shadow on the water. Ghost flotillas close to knife range in the dark, fire once, and are not there when the star shells go up.\n\nUnlocked by stealth hull plating."
  sea_spec_ghost_flotillas_dark_running: "Dark Running"
  sea_spec_ghost_flotillas_knife_range: "Knife Range"
  sea_spec_ghost_flotillas_night_owls: "Night Owls"
  sea_spec_ghost_flotillas_first_salvo: "First Salvo"
  sea_spec_ghost_flotillas_fade_out: "Fade Out"
  SUBDOCTRINE_SEA_SPEC_MISSILE_AGE: "Missile Age"
  SUBDOCTRINE_SEA_SPEC_MISSILE_AGE_DESC: "A ship that can hit from beyond the horizon has no need to trade broadsides. The gun line is finished; the future belongs to whoever sees first and launches first.\n\nUnlocked by the missile destroyer."
  sea_spec_missile_age_over_the_horizon: "Over the Horizon"
  sea_spec_missile_age_salvo_fire: "Salvo Fire"
  sea_spec_missile_age_fleet_air_defence: "Fleet Air Defence"
  sea_spec_missile_age_guided_strikes: "Guided Strikes"
  sea_spec_missile_age_new_line_of_battle: "The New Line of Battle"
  SUBDOCTRINE_SEA_SPEC_MEGASPELL_BATTERIES: "Megaspell Batteries"
  SUBDOCTRINE_SEA_SPEC_MEGASPELL_BATTERIES_DESC: "A heavy ship built around a single pre-war weapon is a threat that ends arguments. It need not fire often. It need only be known to be there.\n\nUnlocked by megaspell batteries."
  sea_spec_megaspell_batteries_one_shot_one_fleet: "One Shot, One Fleet"
  sea_spec_megaspell_batteries_arcane_rangefinders: "Arcane Rangefinders"
  sea_spec_megaspell_batteries_matrix_crews: "Matrix Crews"
  sea_spec_megaspell_batteries_city_breakers: "City Breakers"
  sea_spec_megaspell_batteries_fear_of_the_flash: "Fear of the Flash"
  SUBDOCTRINE_SEA_SPEC_TALISMAN_WARDS: "Talisman Wards"
  SUBDOCTRINE_SEA_SPEC_TALISMAN_WARDS_DESC: "Steel stops a shell; a ward stops the next one as well. Shielded hulls let a fleet stay in a fight that would have sunk it, and sail home afterwards.\n\nUnlocked by shielded hulls."
  sea_spec_talisman_wards_layered_wards: "Layered Wards"
  sea_spec_talisman_wards_ward_tenders: "Ward Tenders"
  sea_spec_talisman_wards_turned_torpedoes: "Turned Torpedoes"
  sea_spec_talisman_wards_shielded_escorts: "Shielded Escorts"
  sea_spec_talisman_wards_unsinkable: "Unsinkable"
  SUBDOCTRINE_SEA_SPEC_IRON_KRAKEN: "Iron Kraken"
  SUBDOCTRINE_SEA_SPEC_IRON_KRAKEN_DESC: "Rustwreck's fleet is one animal. The heavy ships are its body, the escorts its arms, and the yards of the Wreck its heart; nothing moves alone and nothing is left behind.\n\nUnlocked by the Iron Kraken doctrine of Rustwreck."
  sea_spec_iron_kraken_the_iron_core: "The Iron Core"
  sea_spec_iron_kraken_arms_of_the_kraken: "Arms of the Kraken"
  sea_spec_iron_kraken_yards_of_the_wreck: "Yards of the Wreck"
  sea_spec_iron_kraken_no_ship_sails_alone: "No Ship Sails Alone"
  sea_spec_iron_kraken_masters_of_the_coast: "Masters of the Coast"
  SUBDOCTRINE_SEA_SPEC_THUNDERHEAD_MOTHERSHIPS: "Thunderhead Motherships"
  SUBDOCTRINE_SEA_SPEC_THUNDERHEAD_MOTHERSHIPS_DESC: "A Thunderhead is a harbour that travels. Raptors moor alongside it, Skytanks nest in its cradles, and wherever it stops the Enclave has a fleet base by nightfall.\n\nUnlocked by the Skytank."
  sea_spec_thunderhead_motherships_cloud_docks: "Cloud Docks"
  sea_spec_thunderhead_motherships_skytank_cradles: "Skytank Cradles"
  sea_spec_thunderhead_motherships_raptor_tenders: "Raptor Tenders"
  sea_spec_thunderhead_motherships_storm_launch: "Storm Launch"
  sea_spec_thunderhead_motherships_eye_of_the_storm: "Eye of the Storm"

  # Enclave land subdoctrines
  SUBDOCTRINE_PEGASUS_POWER_ARMOUR: "Pegasus Power Armour"
  SUBDOCTRINE_PEGASUS_POWER_ARMOUR_DESC: "Enclave armour was never meant to hold a line. It flies. A wing of armoured pegasi arrives from above, fires on the way in, and is over the next ridge before the defenders have turned their guns.\n\nOnly for Enclave nations."
  pegasus_power_armour_flight_talismans: "Flight Talismans"
  pegasus_power_armour_strafing_passes: "Strafing Passes"
  pegasus_power_armour_above_the_terrain: "Above the Terrain"
  pegasus_power_armour_above_the_terrain_tt: "§Y$category_power_armor$§! in §Y$hills$§!, §Y$mountain$§! and across §Yrivers§!: Attack §G+10%§!, Movement §G+15%§!"
  pegasus_power_armour_wing_commanders: "Wing Commanders"
  pegasus_power_armour_death_from_above: "Death from Above"
  SUBDOCTRINE_SKY_ASSAULT: "Sky Assault"
  SUBDOCTRINE_SKY_ASSAULT_DESC: "The Enclave lives above the clouds, and its armies start every campaign there. Whole formations gather out of sight over the target and come down through the cloud layer at once.\n\nOnly for Enclave nations."
  sky_assault_above_the_cloud_layer: "Above the Cloud Layer"
  sky_assault_cloud_staging: "Cloud Staging"
  sky_assault_vertical_envelopment: "Vertical Envelopment"
  sky_assault_strike_and_withdraw: "Strike and Withdraw"
  sky_assault_the_sky_belongs_to_us: "The Sky Belongs to Us"
