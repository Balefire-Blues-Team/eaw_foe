  SUBDOCTRINE_ROBOT_PRIMACY: "Robot Primacy"
  SUBDOCTRINE_ROBOT_PRIMACY_DESC: "Robots are the most efficient way to win battles. Focus on developing and utilizing advanced robotic units to dominate the battlefield."
