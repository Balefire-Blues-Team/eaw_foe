### Events ###
##############

 neocastlegui.1.t: "Technological Breakthrough!"
 neocastlegui.1.d: "Here in the blasted heart of the wasteland, we have achieved a truly incredible thing. Out progress and research have truly borne fruit. In this way, there appears to be, without any shred of doubt, a true vindication of the effect of our innovative nature. Our corporate labs and R&D efforts had been more than satisfactory in this regard. We can only hope that through the proper application of those new ideas and concepts, we can further strengthen and consolidate our industrial capabilities thorugh those wonderful technologies that will be perfected and refined. \n\nOur have made breakthroughs in the industry will lead us to a much more profitable future!"
 neocastlegui.1.a: "Wonderful News!"

 neocastlegui.2.t: "A Rifle From Another Age"
 neocastlegui.2.d: "It was an incidental thing, nothing more than the hobbyist project of a Technician within the Mechanicum. Indeed, if it were not for this Technician running late to their shift, it would have gone entirely unnoticed. This incident, along with their suspicious behavior when questioned as to why they were so late, was what then sparked an internal investigation into the errant employee's unbecoming behavior. An investigation which quickly escalated into sending security forces into their quarters to find out what was so important to them that they would dare be late in performing their obligations to their Guild.\n\nThis investigation quickly found the topic of their obsession: A homemade rifle, seemingly entirely unique in design. The initial reaction was as severe as it was swift, with the Technician in question being quickly sentenced to becoming fuel for the many carbon-extractors used as one of the many sources of power for the immense facility known as the Alpha Forge. In an unusual turn of events though, this move was quickly overturned by one of our respected and revered Engineers, who proclaimed the lowly Technicians work to be a 'marvel of innovation'.\n\nFollowing this, the case and the weapon that came from it was quickly brought up to an interested Magos. After some study and deliberation, it was decreed that this Technician had truly been blessed, and was to not just be fully reinstated, but immediately promoted to the rank of Engineer. As for the weapon itself, it was quickly reverse engineered, catalogued, and sent to a team of the Mechanicum's brightest for further study."
 neocastlegui.2.a: "A marvel, they say?"

 neocastlegui.3.t: "Energy from the Void"
 neocastlegui.3.d: "Our Scientists are not quite sure how they managed it, but a random accident while testing a new form of magical-energy reactor has caused it to output power... even while there is no Magical gem inserted.\nFrom the scarce reading we can get from the outside, it seems like the reactor has tapped into some fundamental force of the universe, as, according to the readings, its not that the reactor-chamber is empty, but that it contains negative space. Our current theory is that this negative space was created due to a misapplication of multiple power-gems in a circuit, and that it by all rights should have blown up the entire tower. However, as the universe abhorrs negativity, it seems that energy is spontaneously manifesting within the reactor, in a universal effort to restore equilibrium, only to be syphoned off by our machine, to be used by us.\nThe Scientist responsible for the mistake that created this has been reprimanded for it, and was afterwards promoted to head his own research team.\nThis could very well be a clean energy source for the future, once we understand how to properly re-create it."
 neocastlegui.3.a: "Wonderful"

 neocastlegui.4.t: "The Restoration-Potion(TM)"
 neocastlegui.4.d: "The various Guilds of Neocastle aren't known for being biologists. We are masters of machinery, not fickle things like a pony's bodily functions! However, there are a few who seek to understand and innovate within the realm of flesh. Recently, these individuals have concocted a new and improved healing potion of sorts. The potion's creators have made ecstatic claims to investors, stating its supposed ability to bring the most tired labourers of the mines, or even the seemingly failed test subjects of the Mechanicum, back from the brink! Great promises of high regeneration and full rejuvenation of body and spirit were met with deaf ears however, as the idea was soon scrapped and began trading hands.\n\nAfter some time, and substantial trading of large quantities of favors, assets, and other funds, an enthusiastic member of the Mechanicum resurfaced the project. There were several test trials, many of which concluded with applicants becoming deformed and disturbing. Some subjects were found sagging horrendously with three times the skin. Others gained much larger blood vessels which couldn't be filled by their miniscule hearts. Many more simply grew too much flesh to move effectively, or POPPED, leaving a mess for the janitors. But science inevitably prevailed! We have developed the first... net positive iteration of this potion! Furthermore, after some rather foalish names, the likes of "Flesh Fixer Fantastic(TM)!'' or "Better Built Best Bodies©!", we have reached a final marketable brand.\n\nSo are you feeling worn out? Is your poor old body not working the way it used to? Perhaps a freak machinery accident cut off more than just a bit of your hoof? Or do you want to make sure you get the most out of your hard working and esteemed employees? Well go and get some of Neocastle's most spectacular Restoration Potion™! With one sip you can get anypony into peak condition! Check with your local doctor to see if our Restoration Potion™ is right for you!\n\n*Conditions such as rapid gain or loss of hair, skin, pigmentation, muscles, bones, a face, vital organs or limbs may occur. The producers of Restoration Potion(TM) are not to be held accountable, under any circumstances, for side effects of this product.*"
 neocastlegui.4.a: "Side effects, pfffttt!"

 neocastlegui.5.t: "Cellulose-Refraction process"
 neocastlegui.5.d: "In a pioneering move, one of our research-teams has invented a new process by which to produce Composites such as hard-plastic from nothing more than slightly radioactive cellulose.\nTrees with a bit of Radiation are not hard to come by, especailly considering the Everfree directly to our north. The new Invention utilizes the inherent radiation of the wood, by causing a process of cascading mutations within the material that forces the cells to harden their membranes into a kind of bio-plstic, causing them to expend all of their energy and dying off once the process is complete. While it is not nearly as smooth and flawless as regular Plastics, our new version is easily producable given our location, and any flaws it does have can be worked around by our engineers."
 neocastlegui.5.a: "Wonderful"

 neocastlegui.6.t: "Ancient Factory Restored"
 neocastlegui.6.d: "One of our Research teams in cooperation with engineers from both the Builders Guild and the Mechanicum Guild have managed to repair an Advanced-Componet factory.\nThe Building was little more than a rotting ruin when our people started their work, and now the brick and concrete walls stand again, the machines beat once more like a heart restarted. Capacitors crackle with energy, as new modulators, plasma-excitors, AI-matrixes and more are being produced by our capable staff using these machines to their fullest. The Trade Council has hailed this as a great success, and one a big step towards restoring Wartime profits to the Guilds. Sadly, we are unable to reblicate many of the machines for now, as we still need the "template" provided by the wartime equipment, though our Scientists are confident that those too can be reverse-engineered in time."
 neocastlegui.6.a: "Wonderful"

 neocastlegui.7.t: "Listen on... Forever"
 neocastlegui.7.d: "Our ponies in Research and Development have been hard at work, restoring a series of tapes discovered in the remnants of a Ministry of Morale office building. At first, our engineers thought they had just wasted time restoring some old tapes of the usual propaganda and public service announcements one might expect of pre-war radio. However it quickly became apparent that something more was going on after the technician charged with listening to all the tapes for cataloging purposes was notably happy and open to suggestion. This led to the discovery that the tapes weren’t just any ordinary recorded broadcast, but were in fact filled with subliminal messages about respecting authority and remaining calm and content at all times. Further testing indicated that playing these tapes as workers went about their day increased productivity and decreased informal complaints about working conditions and their superiors! We’ll begin broadcasting them everyday!"
 neocastlegui.7.a: "Smile smile smile ponies! Forever!"

 neocastlegui.8.t: "The Neocastle-Legions"
 neocastlegui.8.d: "In an impressive feat of historical reverse-engineering, our Scientists focused on Zebra-Research have managed to replicate the exact organisation and training of the famous Zebrican Legions. With a new comprehensive guide-book for field commanders already being written, it should be a relatively easy task to train some of our soldiers in this foreign method of Warfare. The Great War has proven time and time again that Zebrican tactics were extremely effective in depleting the nemies morale, while remaining supremely organized themselves. This new method of training our own legions will give us a significant advantage when fighting the untrained Peasant hordes of new Mareway, and may even allow us to stand against the Professional Talons of RedEye's.\n\nThe Armed forces of the Guilds will rule the Battlefield!"
 neocastlegui.8.a: "Wonderful"

 neocastlegui.9.t: "The Revised Manual for Combat-Magic"
 neocastlegui.9.d: "Magic. The force of nature that is able to do wonderful and terrifying things in equal measure. It has been and always will be a tool, a tool of healing, a tool of building, a tool of power, of cause and effect. A tool of death and destruction, as the blasted out world around us would speak too.For eons, Equestria was famed for its battle-mages, and even during the Great War they were a force to be reckoned with on the battlefield. But the ability to launch fireballs from one's horn or raise a shield to ward off attacks required years of training and discipline to achieve... But now, any unicorn can do it with a copy of How To Kill With Magic In The Wasteland (For Dummies!)©, a spellbook of carefully selected and written spells that would allow even a foal with a broken horn to defend themselves in the harshness of the waste! To not buy this incredible product would be killer to unicorn security forces! Stop bullets, make swords from magic, burn peasants and strikers to ash like that! Hurry now! Supplies won’t last!"
 neocastlegui.9.a: "Notice: Not responsible for any spell failures. Self defense not guaranteed."

 neocastlegui.10.t: "The New Model Division"
 neocastlegui.10.d: "Silence fell across the gathered crowd as two ponies stepped up onto stage, all attention within the room being directed to those that had called them there to begin with. One of them, a mare dressed in the standard Equestrian-style suit that was so common among the upper ranks of the Builder's Guild, was the first to speak.\n\n'Welcome, everypony! Welcome to the future! Let me begin by asking you about the flaws of fielding a standing army: Is it their need for sleep? The struggle of supplying and feeding each soldier? The always short-line of new recruits, even with a strict reassignment policy? All of the above! That is why we, in conjunction with our partners at the Mechanicum Guild, have been hard at work creating a new type of soldier. One that does not tire, does not rest, does not need to be fed, and can be churned out as quickly as our factories can produce. I present to you all... the soldier of the future!'\n\nWith that, the stallion next to her lifted his hoof to reveal a leg-mounted device, vaguely resembling Stable-Tec's infamous Pip-Bucks. With the boop of a button, orders were remotely sent out, and a moment later a procession began as a small army of equine-robots ascended onto stage.\n\n'Gaze now at the splendor of these artificial protectors! Each one of them has been reinforced with the recently devised lunarite alloys, ensuring near-total protection against arms fire. They each pack enough power to crush even a hellhound to dust beneath their metal hooves! And even better, every one of them comes with a built in proprietary NewLens(C) SuperBeam(TM) arcane laser, capable of vaporizing any foe! Each and every unit here has a life-time of 203 years* before needing to be recharged, allowing them to outfight any foe they may come across! Not a single rival will be able to stand against us with even a sizable army of these state-of-the-art machine-soldiers.'\n\n'However, we can't do it without you. These aren't cheap, though we assure you that the investment is well worth it, and that is why we are asking those of you gathered to help us in this endeavor. What are a few bits when put next to our future? Thank you for watching this presentation. I and my partner here will be answering any questions you may have about these feats of engineering, and a live demonstration of their combat ability will be held in the field outside in an hour's time. By the end of the day, we hope that you will have seen for yourselves the potential that this technology holds to revolutionize warfare as we know it.'"
 neocastlegui.10.a: "Get your robot army today, for only 1,999,999!"

neocastle.1.t: "War Profiteering"
neocastle.1.d: "Most look back upon the Great War as a tragedy, the event which plunged the world into the apocalyptic nightmare that it is today. However, this viewpoint is rare among the ponies of the Neocastle Guilds. Rather than being a time of strife, that period is seen as being a time of opportunity instead. It is no secret that the Guilds, though they weren't called such yet, profited immensely from the conflict.\n\nThe Builder's Guild enthusiastically tells everypony willing to listen that they once built vast military bases and a great many bunkers all across the nation for the Equestrian government. They even claim to have been directly involved in the construction of a number of megaspell chambers, some of the most complicated and intricate structures ever designed by ponykind. They claim that the majority of these works still stand to this day, as irrefutable evidence of the quality of their workmanship.\n\nThe Miner's Guild often scoffs at these supposed accomplishments, instead pointing to their own work as being far more impressive. They controlled the majority of Equestria's mines, lumberyards, and even rock farms, providing the nation with all of the materials necessary to fuel the war effort. They even go so far as to boast that the entire War depended upon them.\n\nUnlike the other two, the Mechanicum Guild is far more reserved in regards to their accomplishments during the War. They scarcely speak of what they did, and never to those outside of their Guild, but rumors persist that they were involved in all manner of highly classified projects.\n\nWhile all three Guilds prospered off of the conflict, the Equestrian government began to tighten their finances more in the latest stages of the War. When the flow of seemingly endless bits began to dry up, the Guilds all sent representatives to Her Majesty's Night Court to petition her for greater funding, but only one of them secured her favor."
neocastle.1.a: "The Builders"
neocastle.1.b: "The Miners"
neocastle.1.c: "The Mechanics"

neocastle.2.t: "Securing Vital Assets"
neocastle.2.d: "When the end of the world came, we were not left entirely unprepared. The Guilds had prepared for the War to end in balefire, preparing a number of shelters all across the country to hide away company personnel and assets in. Many of the ponies in the upper levels of the Guilds today owe their existence entirely to these bunkers, as their ancestors only survived thanks to them. However, it seems that we were among the few fortunate enough to have enjoyed such success. Contact with all of the other shelters was lost and the lack of efforts by them to communicate with the Guilds has led to them being presumed destroyed.\n\nWhen our ancestors were building the bunkers, there was some debate over what they should focus on saving. Some argued that mid-level employees should be allowed in as well, both as a reward for their commitment to their companies and so as to ensure that they had a workforce to aid them when the time came to emerge and reconstruct the world. Others argued for them to be stocked with a large supply of valuables, so as to provide a trading good in the early days of the Wasteland. Yet a small select few instead called for these bunkers to hold within them the most advanced technology that money could afford. It is believed that they hoped to establish themselves as Gods to ignorant tribals, though the lack of tribals in the local area thwarted that plan entirely.\n\nAfter a great deal of arguing and bickering, it was decided to prioritize the preservation of..."
neocastle.2.a: "Our Employees"
neocastle.2.b: "Luxury Goods"
neocastle.2.c: "Advanced Technology"

neocastle.3.t: "Adapting to the Wasteland"
neocastle.3.d: "With a new world came new challenges, leading to a great deal of difficulty in the early days as we struggled to remain in control of the area. In those days, our competitors were many and our future was entirely uncertain. In order to survive, we had to see to internal restructuring and come up with a new operations strategy in order to maximize company potential while minimizing future risks. That is to say, we had to come up with a way to beat out our competitors while staying out of the line of fire. In order to achieve these, three plans were brought forward.\n\nThe first plan that was proposed was to simply ensure that our employees enjoyed a living standard far above those of our competitors. This would not only ensure greater productivity, but would have a demoralizing effect upon our rivals personnel. This plan enjoyed widespread support, especially among the employees themselves.\n\nThe second proposal was to invest heavily into marketing, both to consumer markets and within our company itself. With a widespread campaign, it was believed that we could foster a brand identity that could instil loyalty within the marketing targets, ensuring a lasting commitment towards our company.\n\nThe final proposal was to entirely do away with much of the corporate bureaucracy that plagued our company, as it was little more than an outdated relic from a time when we were subject to the rule of law. Without petty concerns such as 'legal compliance' or 'dues to the Crown' in the new world, we could be rid of all of that nonsense and focus on streamlining our company to ensure maximum efficiency.\n\nEventually, one plan won out over the others. And none too soon, for one of our competitors was growing especially threatening. The proposal which ended up being our key to success was..."
neocastle.3.a: "Ensuring Employee Satisfaction"
neocastle.3.b: "Promoting Brand Loyalty"
neocastle.3.c: "Streamlining Operations"

neocastle.4.t: "Calling the 50th Board Meeting"
neocastle.4.d: "In a tradition predating even the formation of the Trade Council, the highest levels of management within each Guild gather once every four years to discuss our nation's operational strategy moving forward. There are few restrictions on what can be proposed during these meetings, resulting in them often being used as a method to increase the power and influence of those participating. Over the last few board meetings, there has been an invested effort by each Guild to muster enough support to declare one of them to be the official figurehead for the nation, rather than the Trade Council. Though nopony has managed to muster enough support to pull this off yet, they have been pulling all of their strings and calling upon every favor owed to them over the last few years in the hope of finally achieving enough votes to secure a majority.\n\nOne example of their fierce competition for influence can be found in the argument over who will be hosting the upcomming meeting. Through a mix of bribes, backroom deals, and direct intimidation, they have all sought to gain the favor of the Trade Council in order to be selected as this years host.\n\nEach Guild knows full well that whoever does hoof the bill will also gain a considerable amount of prestiege, along with forcing the other members of upper management into their turf and opening up plenty of opportunities to make discrete deals with the ponies casting the votes. With this in mind, their cutthroat strategies have only ramped up further leading up to the quadrennial meeting. However, only one Guild's efforts would pay off in the end..."
neocastle.4.a: "The Builder's Guild"
neocastle.4.b: "The Miner's Guild"
neocastle.4.c: "The Mechanicum Guild"

neocastle.5.t: "A Cap for a Bit"
neocastle.5.d: "Though most topics of discussion among the Board centered around money, one topic in particular was unique in that it related directly to the monetary policy of the Guilds. Even more unusual was the pony to bring up this discussion, Archmagos Tezla herself. It was well known that the Mechanicum was far less profit-oriented than their peers, seeing profit as nothing more than a means towards an end rather than the end itself. In hushed whispers, many of the respectable enterprising ponies of Neocastle spoke of them in less than flattering terms, calling them 'uncapitalistic', among many worse things. So it was then a great surprise when their respected leader called for the Board to examine the nation's policy on caps as a medium of trade.\n\nHer points were many and hoof-picked to appeal to those present. Caps were unbacked, making them volatile and risky. Something the Builder's Guild could see hurting their profit-margins in the long term. On top of that, they were also subject to market manipulations from their competitors. The situation down in Old Appleloosa was evidence enough of this. Such an argument was quick to appeal to the more paranoid members of the Miner's Guild, always concerned with retaining their independence. Finally, the reason for her having brought this up to begin with, it took away from their own authority. So long as ponies could gather wealth from external sources, they could escape the control of the Guilds.\n\nThough many present nodded in agreement to her points, Brick and J.E.B., in a rare show of agreement, began issuing counter points. While the currency may be volatile, it was also near universally accepted, making it a necessity for further economic growth. External factors could damage the cap, certainly, but could they not also leverage it against their rivals in much the same way? As for controlling the ponies of Neocastle, that was already accomplished well enough by providing them with both meaningful work and a steady supply of consumer goods. What more could they need?\n\nThis started a fresh series of debates and conversations among those gathered. It would take them quite a while to reach a conclusion, but when they did, it was firmly in favor of..."
neocastle.5.a: "...continuing to use bottlecaps."
neocastle.5.b: "...introducing our own currency."

neocastle.6.t: "Threats and Opportunities"
neocastle.6.d: "One matter of great concern among many within the Guilds was the industrial powerhouse to the north. Though little was known about this 'Red Eye' character who had forged them, the industrial might wielded by the restored city of Fillydelphia was nothing short of awe-inspiring. The sheer amount of factories, ponypower, and resources at the disposal of whomever controlled that smog-blanketed city was enough to strike envy in the hearts of many of those present. It was of no surprise to anypony when this topic was brought up, as none were sure what policy the Guilds should take towards one of their largest competitors moving forward.\n\nAfter a considerable amount of discussion, it was Brick who declared that we must begin preparing for an inevitable conflict immediately. While he was all for maintaining the illusion of friendly relations with [EYE.GetLeader], it would not do at all to allow such a large competitor to remain so. Sooner or later, the time would come when this rival would come for them as well, and it was far better they be ready for them when they do.\n\nJ.E.B., who had been unusually quiet thus far, pondered for a bit longer before surprising everypony with a far more cooperative proposal. Rather than try to actively work against this competitor, a move that he assured the rest of the Board would only result in their definite invasion, it would be far preferable to stay on their goodside and so to avoid conflict for as long as possible. After all, they wouldn't be prepared to undertake a massive aggressive market expansion anytime soon, especially against such a superior force.\n\nArchmagos Tezla and her flock dismissed both proposals outright, claiming that their projections showed that their northern competitor wasn't long for this world. Pointing to a variety of factors from internal instability to multiple powerful competitors, they offered reassurance that Neocastle stood on far more stable ground and was at far less risk in the long run. Of course, this wasn't anywhere near enough to disuade Brick nor J.E.B., but it did get some of the less stubborn-headed ponies present thinking.\n\nIn the end, it was decided to..."
neocastle.6.a: "...move against Fillydelphia."
neocastle.6.b: "...work with Fillydelphia."
neocastle.6.c: "...ignore them, they are of no threat."

neocastle.7.t: "Are Employees People?"
neocastle.7.d: "In an unexpected interjection while discussing personnel management strategies moving forward, Brick Bobcat unveiled a plan to completely change the way in which we categorize equine personnel. He argues that his plan, which includes radical changes such as ensuring that official wages are provided and cracking down on workplace abuses, would go a long way towards improving the happiness of our employees. According to studies conducted by the Builder's Guilds' own Department of Research and Development, this increased quality of living would directly translate into increased spending at Guild stores and improved productivity. Despite these supposedly sound conclusions, the idea of granting 'token rights' to our personnel was still a highly controversial one.\n\nThe most immediate response to this drastic policy shift was from J.E.B., who was quick to completely dismiss the motion as a pointless risk to their profit-margins. He went on to claim that the very concept of 'pony rights' which Brick sought to grant to our personnel was nothing more than Unionist propaganda meant to provide an intellectual basis for their destructive policies. The implied accusation of Unionist sympathies quickly riled up Brick, who claimed that this plan would remove all legitimacy from the Unions rather than empowering them.\n\nIt wasn't until the other two stallions had calmed down that Tezla spoke, stating that the Mechanicum Guild would not support these policies in the slightest until they had been given an opportunity to conduct their own study into the matter. A study which would need at least another two decades to have conclusive results. With this declaration, the other gathered Magos were quick to throw their support behind her, making their stance clear. After a considerable amount of further debate, the votes were finally cast, and it was decided to..."
neocastle.7.a: "Pledge to guarantee basic employee rights."
neocastle.7.b: "Keep them as is."

neocastle.8.t: "Greasing the Gears of Business"
neocastle.8.d: "As is customary for these meetings, the Builder's Guild has once again proposed an internal restructuring strategy aimed towards reducing pony-based inefficiencies within our operations. Brick Bobcat's presentation on this topic, which included poorly drawing a variety of diagrams on a chalkboard to emphasize his points, went on for a number of hours. Before Brick could get properly worked up over this interpreted insult, Tezla interjected to voice her full support for his plan. According to her, the equine factor has always been the single most harmful factor in the financial reports of every Guild, and must be compensated for in any way possible.\n\nThe Miner's Guild, revealing themselves to have been more aware than what they appeared to be, remained largely unconvinced. Many of them, including J.E.B. himself, had garnered a reputation for taking bribes and granting appointments to the highest bidder. Under the strategy being proposed, these sorts of activities would be cracked down upon and strict policies of conduct would be enforced across all three Guilds. Even if this did improve the overall profit-margins, it certainly would put a damper on their own personal income.\n\nThe always unanimous support of the Mechanicum Guild would usually be more than enough to skew this vote in favor of Brick, if it were not for a large number of bribes placed earlier that day. The only question that remained was if this proposal would be defeated by the very practice which it sought to eliminate."
neocastle.8.a: "Corruption only hurts our profits."
neocastle.8.b: "A little corruption doesn't hurt anypony."

neocastle.9.t: "Guns, Tanks, and Profit"
neocastle.9.d: "It had been peaceful for a while now, with little arguing to be heard as the Board of Directors discussed matters of advertising strategies and market expansion moving forward. Though there had been some disagreements here or there, there was nothing serious enough to get fired up over. Unfortunately, this couldn't last. With the sound of a hoof slam onto the table, Brick was interrupted mid-speech by J.E.B., who was quick to follow up with a vocal objection to the CEO's latest proposal.\n\nThe proposal in question was to further expand into the private arms market, providing even more weapons for any interested parties who could afford them. Though it had initially seemed like a sound field to expand to, the mining magnate himself tore into it with harsh criticism, pointing out that we could barely supply our own security forces and that the Guilds would essentially be selling their own nooses. Murmurs of agreement soon spread across those gathered, his fire and brimstone rhetoric being more than enough to win them over.\n\nBefore he could completely lose them, Brick began waving away all of his concerns and calling that nothing but foalish alarmism. In his words, 'who would invade us when we're the ones supplying them with all their guns?'\n\nFor her part, the Archmagos simply stood impassive and offered nothing to the argument. The Mechanicum Guild had never been concerned about the arms industry and that wasn't likely to change anytime soon."
neocastle.9.a: "Increase weapons exports!"
neocastle.9.b: "Sell all of our guns? In this cutthroat market!?"

neocastle.10.t: "A National Director"
neocastle.10.d: "With all other avenues of discussion exhausted, the time had come at last for the final move to be made in the greater political game that had been going on behind the scenes. It fell to the ever authoritative CEO Brick Bobcat to first acknowledge the dragon within the room, calling upon those gathered to address a very important question regarding the future of their nation: 'Who should lead us moving forward, and why should it be me?'\n\nOf course, this was immediately met with a string of insults and objections from J.E.B., who went off on an awe-inspiring tirade against the Builder's Guild leader. By the end of his ten minute long angry rant, which included labeling his rival all manner of things from 'arrogant emptyheaded paperpusher' to things that were best left stricken from the official record, he finally collapsed back onto his haunches with visible exhaustion. Of course, with the floor once again free, it was only natural for the target of his vitriol to stand up and launch into a counter tirade.\n\nThis continued in a cycle for well over an hour, with the most loyal cronies of both sides occasionally joining in with their own creative insults towards the opposing Guild. During it all, Archmagos Tezla stood as impassive as either. Indeed, when she did stand up during a short lull in the debacle, it took a moment for most of those present to notice that she had taken the floor at all. Admonishing both of her equals as acting extremely foalish with this tremendous display of school-yard insults, her sharp criticism towards the conduct of those present made many ponies look down in shame for having acted so in such a professional environment. Of course, they immediately fired up once more when she concluded by claiming that this showed that only the Mechanicum could be trusted to guide their nation into the future, starting up debate once more.\n\nOf course, the truth of the matter was that the decision had already been made long before this argument began. None of those gathered had been idle during the free time afforded to them, with many bribes trading hooves and many promises being made. These backroom deals would be what carried the day, with the final vote being tallied and the result declaring the definite leader of the nation as a whole to be..."
neocastle.10.a: "Brick 'Bob' Bobcat"
neocastle.10.b: "J.E.B. Beauteous"
neocastle.10.c: "Archmagos Tezla"

neocastle.11.t: "A Costly Buyout"
neocastle.11.d: "The Bog Hoppers have agreed to our generous offer. Of course, they had little idea of what would come after. While our merchants spend enough money in their backwards country to make even Red Eye blush, they have also been busy purchasing every bit of land that the locals were willing to part with. Which, it turns out, is quite a lot. Despite being savage tribals, the bog-lurking ponies were very quick to jump on the opportunity to become filthy rich.\n\nTo make matters even better, the various chieftans and shamans have proven themselves to be just as easy to buy as those who follow them. With their open declarations of support for our endeavors, only the most hot-headed and independent warriors would dare speak out against us. Their nation is effectively ours, as we are able to act with full impunity within their borders. Though they shall retain some semblance of their independence on paper, there is no doubt that they have been firmly rendered a subsidiary."
neocastle.11.a: "Prosperity Ahead!"

neocastle.12.t: "Neocastle's Proposal"
neocastle.12.d: "An envoy arrived within our fair lands today, hailing from the eastern merchant-state of Neocastle. The Guilds, true to the spirit of profit which they embody, have come to us with a proposal to facilitate increased trade between our two nations. Many of our more influential ponies, especially those of a mercantile background, have expressed a great degree of concern regarding this deal. Their warnings are extensive and dire in equal measure, though a critical eye would find them to be from a position of one who would be harmed by increased competition within the economy.\n\nSo it falls to us to determine which course of action to follow. Do we embrace these merchants and the products in which they bring, or do we reject their deal in order to protect our own traders?"
neocastle.12.a: "A great idea!"
neocastle.12.b: "Keep them out of our market."

neocastle.13.t: "New Mareway Accepts!"
neocastle.13.d: "As expected, [MWY.GetLeader] has accepted our mutually beneficial trade deal.\nWith this initial hurdle out of the way, not only can our nations profit from eachother, but the Guilds now have a questionably legal way to influence New Mareway's politics by leverging our wealth. Though we likely could have gotten away with this anyways, it now should be a foals task to make any of our questionable investments seem like nothing more than a bit of legitimate trading."
neocastle.13.a: "Onwards, to further profit!"

neocastle.14.t: "New Mareway Rejects!"
neocastle.14.d: "In an unexpected move, New Mareway has actually rejected our negotiations outright. Our merchants were quickly thrown out of their nation and reports claim that they are now taking measures to further distance their economy from our own. Did they see through our long-term scheme, or are they simply far too busy playing a game of court and knights to see the value in our deal? It's hard to tell, but either way, we will not be so easily detered. If they don't wish to do things the easy way, we are left with little choice but to take more drastic measures."
neocastle.14.a: "They will come to regret this."

neocastle.15.t: "Nation for Sale"
neocastle.15.d: "The Guilds of Neocastle have, for one reason or another, decided to give up on any greater ambitions they may have held and to 'cash out', as it were. That is to say, they are offering to sell their entire nation to any interested buyer. In exchange for more than enough for every one of their ranking Guild members to live out the remainder of their lives in decadent luxury, along with an agreement to allow them to continue to operate private businesses within our nation, they will completely submit themselves to our authority. Though this would certainly put a strain on our own finances, it could potentially be a massive boon to us in the long-run. We should also keep in mind that if we reject this deal, another nation may accept it instead."
neocastle.15.a: "An entire nation? Of course we'll buy it!"
neocastle.15.b: "For how much!? We can't afford that."

neocastle.16.t: "The Everfree Betrayal"
neocastle.16.d: "Disconcerting news reached us today from the Southeaster Everfree:\nThe local Garrison seems to have defected to the neocastle guilds, and most of the local Slaves seem to welcome the change of ownership. Many of our own slavers seem involved in the treachery, having been generously bribed by the Guilds, with only a few of them returning to our lands with the news. Neocastle has already sent envoys to the Cathedral, calling the move a 'Management-Necessity' and promise to make the loss up to us with preferential treatment in trade. The Southeast Everfree wasn't a particularly valuable territory, but maybe we should still avenge such a betrayal?"
neocastle.16.a: "Accept their overtures, for now..."
neocastle.16.b: "Prepare for retaliation ASAP!"

neocastle.17.t: "The Guild's Deal"
neocastle.17.d: "We are used to having a lukewarm relationship with the merchants to the southwest, with them being wealthy traders and us finding great success in stealing from their ilk. As a result, it was a great surprise when they approached us with an offer that didn't involve paying tribute. It was an even greater surprise when they wanted to actually forge an alliance of sorts against what they call a common enemy.\n\nIt seems that the Guilds of Neocastle are just as invested in the destruction of Mareway as we are. For whatever reason, they seek to topple the Kingdom and deal with their greatest competition in the area. In exchange for our aid in this, they promise us all of the lands beyond the central Amethyst Basin, leaving us with the far better side of this deal. To butter us up even further, they are offering their expertise to improve our combat effectiveness.\n\nIt is a deal that is far too good to be true. So now the question we need to ask is: Do we trust the merchants to hold up their end of the bargain, or will they simply turn on us and steal victory from our grasp?"
neocastle.17.a: "Mareway won't know what hit them."
neocastle.17.b: "Shoot their courier and be done with it."

neocastle.18.t: "[ERA.GetLeader] Accepts"
neocastle.18.d: "Word has come back from the raiders to the northeast: We are in business. Our new partners will gladly aid us in toppling our shared foe of Mareway. As per our offer to them, we have already sent a caravan loaded with a variety of schematics and staffed with several of our top technical experts to assist them in modernizing their forces. As a pleasant addition to our deal, and perhaps to keep an eye on us, [ERA.GetLeader] has also sent several 'military advisors' our way, though they are hardly what we would consider proper military professionals. Despite being disorderly and prone to getting into hoof fights, they still have a surprising amount of valuable insight into the art of combat, making them a valuable addition to our own security forces."
neocastle.18.a: "Wonderful!"

neocastle.19.t: "[ERA.GetLeader] Rejects"
neocastle.19.d: "The courier we sent to deliver our message to the raiders has returned to us, far worse for wear. It seems they were shot in the head and dumped into a shallow grave, before being rescued by a traveling doctor and nursed back to health. After a long and, from how they tell it, eventful journey, they managed to arrive safely back in our borders. Though they carried with them no formal reply, their treatment at the hooves of [ERA.GetLeader] is more than enough for us to figure out their answer.\n\nOf course, this presents a new risk for us moving forward. When the time comes to topple Mareway, we may find ourselves being flanked and struck by the raiders at the same time. It would do us well to be prepared for that worst case scenario."
neocastle.19.a: "Damn them!"

neocastle.20.t: "Moving the Capital?"
neocastle.20.d: "With the Nobles of the Peninsula and New Mareway as a whole becoming an integral part of our Country, the question of our Capital has arisen:\nWhile New Neocastle was our Capital so far, and houses most of our research-capabilities, it might also be too small to govern this new Nation. New Mareway on the other hoof is not only more than twice as large, but also houses the pre-existing administration of Mareway, already well versed in administrating a large and rebellious realm. Moving our Capital would also make a clear statement to all the Nobles of Mareway, that we are the new, legitimate rulers and are willing to work in the pre-existing Framework.\nIn the end, this choice won't break our Nation, but has great symbolic value."
neocastle.20.a: "New Neocastle is Fine"
neocastle.20.b: "We will rule from New Mareway!"

neocastle.21.t: "The Neocastle-Mareway Union"
neocastle.21.d: "In a small Ceremony today, J.e.b. Beauteous, representing the Neocastle Guilds, and a distant Cousin standing in for Queen Stargazer, representing the Kingdom of New Mareway signed a treaty officially uniting their Nations.\nWhile many saw this as only a formality, seeing as Mareway had already been conquered, this treaty officially recognizes Mareway as an equal and integral part of the new Nation, and guarrantees that all Nobles are allowed to keep their current status. Additionally, high-ranking Company members were awarded Noble Titles, and all Serf officially made into Employees.\nWith this momentous step, A new Wasteland Power is born, poised to strike at the soft underbelly of RedEyes Empire, or maybe turn its eyes towards the fertile soils of Azuria?\n But before any of that, now is the time to §rP§OA§RR§GT§rY§!§!§!§!§!!"
neocastle.21.a: "Three Hurraahs!"

neocastle.22.t: "Trapping the Power of a Star"
neocastle.22.d: "Hundreds of Ponies were digging up the Radiation-hardened soil at the Site Magos Sunforge had designated for her grand project. Under the watchful eyes of Corporate security and the Magos herself, one half of them were excavating a massive pit, to later be filled with the installation itself, as most of it would need to be located underground. The other half were digging the canal to the Azureway, which would both be used to ferry materials to the construction site, as well as provide the large amounts of water neccessary to cool the Foundry once it came online.\n\nStill, this was only the first step: Materials would need to be imported and the structure itself built. Then there was still the not insignificant matter of constructing the internal workings of the Foundry itself, as well as radiation-shields to prevent the entire region from becoming even more of a wasteland that it already is. And, last but not least, the Foundry would need a massive amount of energy to kickstart the process, more than the Guilds were producing now by an order of magnitude.\nBut we will overcome all these obstacles, and then we'll make history!"
neocastle.22.a: "There is much work to be done!"

neocastle.23.t: "Laying the last Brick"
neocastle.23.d: "Today the construction finally finished.\nIn a symbolic gesture, Brick Bobcat, leader of the Builder's Guild, and Magos Sunforge, representing the Mechanicum Guild, together laid the final stone in the construction of the main body of the Star Foundry. While the site looks like a nondescript concrete building, only two stories tall, from the outside, it extends a further six stories underground to what soon will be the heart of the foundry itself. Corridors of smooth concrete and cold steel connect mostly empty rooms, as the installation still needs to be outfitted with the wide variety of High-tech instruments the Magos requested.\nThe fifth and sixth stories below-ground will house the portal itself, as well as the radiation-shields. Level four serves mainly as a water-inlet to cool the reactor and funnel the steam to turbines above, producing energy. The water also serves as an additional layer of Radiation-shielding. Above that, the actual foundry will be placed, where the extracted materials will be processed and refined."
neocastle.23.a: "It's taking shape."

neocastle.24.t: "Opening the Gates to Infinity"
neocastle.24.d: "At last, the day has come.\n\nMagos Sunforge took one last look at the readings, assuring herself that this was perfectly safe, though it still didn't feel like it. With a deep breath she banished those doubts from her mind, and set about ordering her assistants to their positions.\n§O'Initiate Sequence!'§!\nWith that she turned the safety key at her desk, and two of her fellow researcher on the other side of the room turned theirs as well, activating the portal.\nAs everyone stared at the monitor, a faint glimmer appeared in the middle of the portal-chamber, quickly glowing into a shower of sparks. Normally this would have produced a flame, but they had filled the chamber with Neon to prevent Oxygen ingniting spontaneously at the absurd temperatures. Finally, with a bright flash, they could see the portal ripping itself open, flooding the chamber with light. Not a second thereafter the feed stopped, the camera melting in the extreme heat.\n§O'Energy output?'§! a few dreadful seconds of silence followed §r'Nominal, Magos. The process seems to be stable'§!\n At that the Control Room erupted in Cheers, they had done it! They had done what only Celestia did in the past:\n\n§RTame the power of the Sun.§!"
neocastle.24.a: "A Great Step for Equinekind!"

neocastle.25.t: "Taking Our Relationship Further"
neocastle.25.d: "Our relationship with Neocastle has been largely positive for a while now, but it was only ever a business partnership. Even as their own merchants extended their influence over our nation, buying up more assets and dominating our markets, we foalishly continued to believe that they were only interested in maintaining a mutually beneficial trade agreement. After all, we both seemed to be growing richer and richer, and the concern of where this could lead to in the long run had all but fled our minds. Unfortunately, it seems that we were being far too generous in our assumption that the Guilds were only interested in sustainable mutual profit.\n\nAn urgent message was sent all the way from Neocastle to [MWY.GetLeader] themselves. The contents? A marriage proposal, from one Brick 'Bob' Bobcat, CEO of the Builder's Guild and Director of all of Neocastle. The letter is very polite, expressing a romantic interest and pointing to the many benefits such an arrangement could provide. However, there is also a threatening undertone to the entire thing, with a firm reminder of how reliant our economy has grown upon them and how unfortunate it would be if a rejection caused relations to sour immensely.\n\nNow, we are left with two options. We could accept this offer, marrying away our leader in exchange for lasting peace and prosperity. Alternatively, we can tell 'Bob' to go shove it where Celestia's light doesn't shine, consequences be damned."
neocastle.25.a: "Accept."
neocastle.25.b: "No!"

neocastle.26.t: "They Accept!"
neocastle.26.d: "Joyous word has come back to us today: [MWY.GetLeader] has accepted our marriage proposal! Brick was so happy by the news that he declared a day off for all of upper-management and even gave his secretary a rather generous raise. Of course, his joy has less to do with the marriage itself and more to do with the ever-growing profit margins that are promised by it. After all, Bob's already married to the Guild, or so it was commonly remarked prior to this arrangement.\n\nNow, all that's left to do is the wedding itself along with all of the legally binding contracts that brings. Of course, both nations involved will need some time to prepare for such a great occasion, and a not inconsiderable amount of the Guild's wealth will be put towards ensuring that it is an event for the Wasteland to remember."
neocastle.26.a: "Huzzah!"

neocastle.27.t: "They Decline"
neocastle.27.d: "Unfortunate news has returned from New Mareway today, as [MWY.GetLeader] has rejected our marriage proposal. The rejection in question is far from polite, expressing a number of insults towards Bob's character that often steer into territory far more crude than what would be expected from a pony of influence within New Mareway. However, despite the insulting nature of it all, our benevolent CEO has expressed nothing but firm confidence that this matter would soon be well behind us, just as soon as our security forces finished mustering for forceful asset seizure. After all, New Mareway owes quite a bit of debt to us for all of the wealth we have provided them. It is only right that we should ensure that they pay what they owe."
neocastle.27.a: "They'll come to regret this."

neocastle.28.t: "A Wedding of the Rich"
neocastle.28.d: "Gazing out across the sea stood a massive cathedral made of stone and glass, designed as according to the traditional Celestial style of architecture. A wide dome pointed out over the top of the structure, filtering all light that came within to create a dazzling display of colors. A large oak door covered the entryway, hiding behind it a hall lined with stylistically carved pillars. Behind yet another firm door lay the main hall itself, where hoof-crafted benches formed rows across the floor. It would be easy to mistake this impressive work as a religious building, perhaps one that even predated the War. However, that was far from the case. In an awe-inducing display of reckless spending, the treasuries of both [MWY.GetLeader] and the Builder's Guild have been partially drained through the hiring of an immense amount of labourers and the import of a large amount of resources from all across the Wasteland. Through their well-paid efforts, the towering structure was built in a record-breaking time, all for a single purpose.\n\nAs Brick stood in front of the crowd - a gathering of every affluential pony across Neocastle and Mareway alike - he couldn't help but feel the stirring of something greater than greed from within himself. What was this odd sensation, which fluttered within him? Nervousness? Excitement? Anticipation? Ah, perhaps it was all of the above - after all, this was going to be one of the most profitable deals he had made in his long history with the Guild. Speaking of which, there stood his investment now, slowly walking down the aisle towards him.\n\n[MWY.GetLeader] was dressed in a flowing white dress, tailored by only the most skilled hooves from all across New Mareway. The well-woven fabric carried with it an enchantment to give it an otherwordly shine, reflecting the already colorful lights within the cathedral into a display with an even greater degree of dazzlement."
neocastle.28.a: "..."

neocastle.282.t: "A Wedding of the Rich"
neocastle.282.d: "As the soon-to-be wife joined the soon-to-be husband, the later became lost staring into the flowing gloss that seemed to wrap the entire dress in a ever-flowing rainbow. Putting his thoughts aside though, he broke his gaze away from the memserizing enchantment and looked back out at the assembled crowd. His lawyer took this as his cue to begin the ceremony proper.\n\n'Mares. Gentlestallions. We come here today to witness the legally binding contract of marriage be signed between two consenting partners, in the name of a long lasting relationship into the future. Now, I'm afraid I'm not much one for pomp. I've known Bob here a long time, gotten him out of more trouble than I care to remember, and it was an honor to be asked to oversee this procession. That being said, I'm no preacher. So you'll forgive me if I skip some of the standard ceremony.'\n\n'Brick, do you take this pony to be your lawfully wedded wife, to love and to hold, to support and to carry, until death do you part?'\n\n'I do.'\n\n'[MWY.GetLeader], do you take this pony to be your lawfully wedded husband, to love and to hold, to support and to carry, until death do you part?'\n\nWith some hesitance, 'I do.'\n\n'Then you may now sign here, here, and here.' \n\nThe couple did just that, signing their names and dating on a contract putting their marriage into legally-binded paper. And with that, the independence of New Mareway was similarly signed away. Though [MWY.GetLeader] barely maintained the facade of happiness towards this agreement, Brick was far more openly gleeful that this deal had gone through. The wealth it would bring the Guild would be immense, all without a single drop of blood spilled."
neocastle.282.a: "Long live Neocastle-Mareway!"




neocastle.999.t: "Neocastle Path-Debug"
neocastle.999.d: "Debug event to load in specific Political trees"
neocastle.999.a: "Load Ultra-Corporatism"
neocastle.999.b: "Load Slave-Corruptors"
neocastle.999.c: "Load Mechanicum"

neocastle.998.t: "The Merchants of Death"
neocastle.998.d: "We have been approached with an offer by the merchants of Neocastle. In exchange for a not insubstantial amount of money, they are willing to lease us weaponry to aid in our military endeavors. Though many within our nation are hesitant to make a deal with the notoriously profit-seeking Guilds, we can't ignore the potential benefits of this deal. They're even willing to negotiate a payment plan with us."
neocastle.998.a: "Take the deal!"
neocastle.998.b: "Reject their offer."

neocastle.997.t: "Advanced Asset Protection Strategy"
neocastle.997.d: "Though our security forces have come far, we are forced to recognize the reality that they are still relatively uncompetitive within the Greater Wasteland Market. We must push further and create a more specialized strategy to ensure that we can keep up with our business rivals. Towards this end, three proposals have been brought forward.\n\nFirstly, the 'Rolling Thunder' proposal. Under this plan, we would focus on the development of trucks, tanks, and planes for use in asset protection. The integration of these machines into our forces would allow us to swiftly and effectively respond to any threats that may arise, dealing with problems before they can substantially impact our profit-margins.\n\nThis proposal led to a second one of a similar nature, the 'Burning Steel' proposal, offered by the Mechanicum Guild. They argue that we should go further than simply integrating machines with our organic forces and should instead pursue the creation of a mostly-robotic force in order to solve our security needs. Though this would certainly be costly, it would compensate for the disadvantage provided by our relatively low population compared to our competitors.\n\nFinally, a small group of senior security officers have stepped forward with an idea to pursue the creation of fortified positions around all of our strategic assets, calling this the 'Thousand Citadels' proposal. They maintain that our organic forces are more than capable of holding these positions, provided they are given the proper resources and means to do so.\n\nEach plan has its own merits, but we can only pursue one if we wish to keep our profit-margins in the green. Which one should we invest in moving forward?"
neocastle.997.a: "Rolling Thunder"
neocastle.997.b: "Burning Steel"
neocastle.997.c: "Thousand Citadels"


 ###Scribes Additions###
 neocastleflavor.1.t: "Eyes in the Sky"
 neocastleflavor.1.d: "Cherry Dust quickly threw herself back under the cover of her makeshift lean-to as yet another plane flew by overhead. Those damn Guilds had gotten crafty, using their planes to keep an eye on the strikers to always stay three steps ahead of them. In response, they had been forced to come up with their own plans to avoid the Guilds watchful eyes and to continue their struggle away from prying eyes. Unfortunately, it had taken them far too long to figure out the true purpose of the machines circling in the sky above them.\n\nLast week, they arrived at their planned demonstration outside of the scavenging yards, only to find a small army of armed ponies waiting for them. Blue Powder had insisted they continue on with their event regardless of the prepared response to it, but it wasn't long until he was beaten down and dragged away to Celestia-knows-where. There had been an effort to fight back, of course, but they were outnumbered and outmatched. It wasn't long until they had been forced to flee. And all the while, the planes kept flying overhead.\n\nNo matter where they went from there, each and every protest was met with a well-prepared counter force. The Guilds goons seemed to know where they would be at all times. It had taken precious time, but they put two and two together, and figured out what was going on. Since then, they had been forced to live like rats, hiding away where not even the Sun could see them.\n\nThough the situation looked dire, Cherry knew she wouldn't give up on their cause. She and everypony else here would continue fighting for their rights until the very end. After all, better to live free than to die a slave to the Guilds wages."
 neocastleflavor.1.a: "The strike continues."

 neocastleflavor.2.t: "Union Busting"
 neocastleflavor.2.d: "Time hadn't been kind to Cherry Dust. The resolve she once held to keep the fight alive had all but vanished, replaced instead by a tired exhaustion. When the Guilds thugs had stopped coming around, they had all believed it to be a victory. This illusion of having pushed them back sent their morale to new highs, heedless of the planes flying overhead. Afterall, what did it matter if their celebrations were watched? There was no way for their forces to break up their gatherings, not without them knowing well in advance.\n\nThen the first bomb fell.\n\nCherry could vividly remember the chaos following the blast. Shouting and panicking ensued everywhere, with ponies making a mad gallop for cover. That was far from the last explosive dropped that day, as more soon followed and wrought destruction.\n\nTheir usual hiding spots quickly became targets, with their temporary homes over these last few months being bombed to Tartarus. The masterminds of the Union were all missing and dead, their ponies were scattered, and still the planes flew relentlessly overhead. What could they do to an enemy with the means to kill all of them without ever laying a hoof on the ground? Their situation was entirely hopeless.\n\nIt was with this in mind that Cherry made a decision. She would return to her forepony tomorrow and ask to come back to work. Though she would be considered a traitor by those still left within the Union, they would soon likely be dead and she would still be alive, even if she did have to slave away."
 neocastleflavor.2.a: "Finally, a return to normalcy."

 neocastleflavor.3.t: "The Central Headquarters"
 neocastleflavor.3.d: "Deep within the heart of Neocastle, where nothing but concrete and rebar stretches on for miles, sits one of the oldest structures to survive the Great War. What was once an ancient office building being rented to countless firms had been given new life, restored to working order by the Builder's Guild. Over the centuries, they had further expanded the towering complex, more than tripling the size of it as they continued to build upon it so that it could continue to keep up with their ever-growing bureaucracy.\n\nCountless attempts have been made to map out the great labyrinth of cubicles, offices, and occasional workshops that makeup this mighty structure. Each and every attempt has ended in failure, being abandonned thanks in large part to the countless rennovations that are seemingly always underway. More than one pony has been found lost within and old stories shared among the workers speak of corpses being found of those who died of dehydration while wandering those dull grey halls.\n\nFortunately for the Board of Directors, they would not have to travel through that dreary abyss of soul-crushing paperwork and endless inefficiency. Instead, they would only be stepping hoof into the lobby, before riding the surprisingly well-maintained elevators up to the penthouse. That room, along with the offices of upper management, stood in stark contrast to the rest of the building. Good lightning, luxruious furnishing, and a window offering a view overlooking the entire city made the top floor the stuff of legends. It would be here, in well-padded comfortable chairs surrounding a glass table, that the future of the nation would be decided."
 neocastleflavor.3.a: "The bueracratic core of the Builder's Guild."

 neocastleflavor.4.t: "The Grand Hall"
 neocastleflavor.4.d: "Far away from the hustle and bustle of Neocastle, the Grand Hall stood as both the heart of the Miners Guild's work and also as a monument to that very same work. A stone foundation supported a structure made largely of wood, a luxury within even the relatively rich lands of Neocastle. From the moment one would step hoof into the entryway, they would immediately be taken with the vast murals that stretch across the walls, depicting the many crucial duties of the Guild. It is said that this impressive piece was painted over the course of years, with dozens of artists being sought out from all across the Wasteland to take part in the project. Despite the impressive splendor on display, it was but a small part of the extensive cultural collection held within those walls.\n\nOf course, while it was required that all who walked through those halls would first witness the entryway, it would not do at all as a meeting room. Instead, that lay further in, far away from prying eyes. Behind a heavy oak door, more than heavy enough to block all but the loudest of sounds, stood the meeting hall of the Miner's Guild. A great wooden table stretched across the room, surrounded by padded armchairs that were as expensive as they were comfortable. A solitary fireplace sat at the end of the hall, providing warmth and light alike. Lining the walls were portraits of every President in the Guild's history, staring down upon those gathered with stern gazes. It was there that their Vice Presidents often met to discuss their operational strategies, and it would also be there that the Board of Directors would meet to discuss the future of their nation."
 neocastleflavor.4.a: "The beating heart of the Miner's Guild."

 neocastleflavor.5.t: "The Alpha Forge"
 neocastleflavor.5.d: "Where the other Guilds sought to impress with their iconic structures, the Mechanicum had no such desire. On the surface, the Alpha Forge was nothing more than another of the countless factories dotting Neocastle. However, the true structure resided far below the hooves of the menials laboring away, within a vast bunker built within the confines of the earth. There sat a tremendous steel door, modeled after those of the the Stables of old, which stood as the gateway into the heart of the Mechanicum.\n\nOnce one passes the threshold dividing the true Forge from the outside world, they would be met with a well-lit transit station. Boarding one of the many trams that continue to run throughout all hours of day and night, one would find themselves quickly transported across a vast tunnel network that stretches underneath the entire city. As it shoots past station after station, only brief glimpses can be caught of each stop. Mundane workshops and specialized manufacturies quickly give way to odd shrines full of hooded figures praying to depictions of various machines. As the ride continues, even this is replaced by sights of countless laboratories holding within them all manner of wonderous things. At the end of the line sits the final station, where a large airlock protects the gathering hall for the Magos themselves. There are no chairs nor tables to be found within it, for such material concerns are far below the highest ranking members of the Mechanicum. Little decorations could be found within the room, beyond a large cog hanging upon the wall. It would be there that the Board of Directors, shifting uncomfortably, would decide the future of their nation."
 neocastleflavor.5.a: "The ever-turning cogs of the Mechanicum Guild."

 neocastleflavor.6.t: "A Home of Dreams"
 neocastleflavor.6.d: "Duchess Sunflower was far from destitute, still remaining firmly among New Mareway's wealthy high-society. That being said, much of her wealth was tied up already, leaving her with considerably less spending money than even many members of the minor nobility. As a result, it was necessary for her to carefully consider each and every additional expense, so as to avoid being forced to liquidate family assets in the name of staving off poverty. For most of her life, this had met going without many of the luxuries afforded to other nobles. No luxury private carriage, no new dresses each and every year, no extensively lavish parties, and most damningly, no immense mansion. Her own house had been passed down for generations and was less than half the size of even the smallest of the Duke's homes. Ever since she was a filly, she had looked in awe and envy at those personal castles which were kept by her peers, wishing to someday have one for herself. As she grew older though, she came to realize the importance of balancing her families wealth and understood that it simply wouldn't be happening anytime in her lifetime. That is, until the Guilds offered to make her dreams a reality.\n\nIn exchange for just a few small favors, she was given the home of her dreams. Imported labourers - officially coming in from Manehattan - had quickly set to work building a massive home. Sneaking the materials for it across the border was much more challenging, though with a bit of creativity they managed to pass them off as having come in from a newly established company in Hoof City. Though there were some close calls, most of this plan went off without a hitch, and her new mansion stood before her now.\n\nIt was everything she had ever dreamed of. A beautiful garden surrounded it, filled with flowers of every color. Concrete steps led up to a massive entryway, capable of holding hundreds of ponies within it. Beyond it stood a wide array of rooms to suit every purpose. Large well-stocked kitchens, immense opulent ballrooms, and more than enough guest rooms to fit half a village in. It would soon be the talk of the court, with nobles from all around begging to come tour her new home and looking at it with that same envy with which she once looked upon theirs. All she had to do was pull a few strings when the time came."
 neocastleflavor.6.a: "We can count on her support."

 neocastleflavor.7.t: "A Party Worthy of a Duke"
 neocastleflavor.7.d: "Brick looked around with uncertainty, as he took in the vast estate of Duke Bright Glow. The music that filled the air proved, if nothing else, unique. A mixture of odd long drawn out flutes, quick chords, and a procession of blaring trumpets played a symphony that was an mix of a marching song, a classic orchestral piece, and something far more rapid and intense than anything the Neocastle CEO would of had playing back home. Of course, the musical tones that created the atmosphere for this event were far from the main attraction. In an odd display of hedonism, the good Duke had gone all out with the budget afforded to him in order to throw a party unlike any other. Hundred-pony wide orgies filled the halls, giant feasts with seemingly unending amounts of food were available to everypony, and artistic displays lined the walls. Brick wasn't sure if it was for him, but it was something alright.\n\nSpotting the benevolent host of this event, he quickly made his way towards him. A task easier said than done, as he had to avoid several ponies too drunk to walk straight, a noble who seemed to be high on dash, and a rather bulky griffon mercenary who was performing feats of strength for a gathered crowd. Finally reaching the stallion himself, Brick was relieved to find him both able to speak and sober. He wasted no time in jumping straight into business, lest either of those things change.\n\n'Duke Bright Glow. This is quite the party you've thrown here, but you do remember our arrangement, yes?'\n\nThe good Duke took a moment to admire his work before responding, 'Of course. You enabled this all to happen, after all. It is only right that I repay in kind. Now, please, enjoy yourself. This is a party after all!'\n\nAt that, the Duke up and trotted away, leaving his benefactor sitting there with visible frustration etched across his face. That damned noble better prove himself more reliable than his conversing skills, or he would come to regret wasting all of this money on such a frivolous event."
 neocastleflavor.7.a: "He'll be a helpful ally... hopefully."

 neocastleflavor.8.t: "Big Game Hunting"
 neocastleflavor.8.d: "'March forth, my fellow stallions, march! For there exists before us a foe greater than any we have faced before, a beast so horrific and abominable that its very name has been stricken from all recorded history! Entire armies have fallen before it's might, I say, entire armies! Yet we have what those armies did not: Bravery in our hearts and resolve in our spirits. We shall fight with our guns, until the foul creature has smashed them into pieces! Then, we shall fight with our blades, until it has devoured those in its endless hunger! Then, we shall fight with our hooves, until it has ripped them from our very body! But even then, when all hope appears lost and our lifeblood is leaving our broken bodies, we shall continue to fight on with our teeth and our head! If we should die today, let it be said that we died fighting a foe most fierce and that we truly gave it every last bit of effort to topple this creature in the name of crown and country! Now, march! Onwards to glory!'\n\nWith zealous cheers, the assembled nobles gathered their rifles and charged behind their leader, prepared to face their 'mighty foe'. Sitting in the safety of the Duke's heavily guarded mansion, Brick spectated the entire event. Though the noble had exaggerated extensively in his descriptions, their target was still no pushover. It had cost a fortune to get a group of mercenaries to transport a hellhound here alive, but they had managed, and the Duke's support was all but assured. So long as he survived the hunt, that is."
 neocastleflavor.8.a: "What an odd stallion."

 neocastleflavor.9.t: "A Barge of Luxury"
 neocastleflavor.9.d: "To call Duke Light's investment, and by extension Neocastle's discreet investment, a boat would be a disservice to the massive floating city that now occupied the sea. It was of such size that it wouldn't even fit down the Azureway, let alone into any of the docks in New Mareway. As a result, it had docks built into it instead, for supplies to be delivered to it through smaller boats. Aboard the ship itself was a every form of entertainment imaginable, from bars to swimming pools to vast indoor apple orchards. It was a city of the future, built entirely on water and entirely for the amusement of a singular stallion. Of course, not even Neocastle's wealth alone was enough for this immense seabound complex, as the Duke himself contributed a very large portion of his own wealth towards the ludicrously high expenses.\n\nBrick had seen those expense reports himself, and he couldn't help but cringe back a bit as he took in the immensity of it all. All of this, for a single stallion and his business associates? The price to keep it afloat alone would eat up the Duke's yearly income by a substantial margin, and it was likely that this project of his would end up driving him into bankruptcy before long. However, that would hardly be Neocastle's concern. So long as he retained his title and enough influence to follow through with his side of their deal, nothing else would matter."
 neocastleflavor.9.a: "How much did this cost again?"

 neocastleflavor.10.t: "Aggressive Negotiations"
 neocastleflavor.10.d: "As Duke Water glared at the pony across from him, he had to take care not to allow his frustration to show. The stallion in question was a member of the minor nobility, landed but with such a small domain so as to be considered irrelevant in the greater political scheme of the country. Despite this, he had managed to be a thorn in his superior's side quite constantly, driving wedges between him and other nobles while amassing enough support to tackle him economically. Now, he had come to negotiate with him, making quite frankly unreasonable demands. After taking a moment to breathe, he decided to voice just those thoughts to his rival.\n\n'So, let me make sure I heard you correctly. You, after having spent the last several months building an alliance against me, undercutting my merchants, sabotaging my trade deals, and even going so far as to rile up the peasantry against me... have decided to trot right into my home as if you owned the place and make demands of me? Is that right?'\n\nThe target of his ire opened his mouth to speak, before quickly getting cut off once more.\n\n'You have made a mistake though. A grave one indeed. This is my estate, my domain, and you are nothing here. Your title, your contacts, your friends - none of it matters when you are on my land. Now, I tire of you and your relentless efforts to steal away my influence. You will not be leaving my land. Thornwing!'\n\nAt his shout, a griffon fell on top of the pony unfortunate enough to have angered the Duke. With a quick movement of his assailants claws, that pony in question was left dead on the floor with his neck twisted in an unnatural direction. The griffon who had carried out the act looked up at his temporary employer. 'You sure to have a lot of enemies, boss. That's the fifth one this week.'\n\nThe Duke took a moment to stare in disgust at the corpse marring his recently polished floor before responding. 'And now I have one less. This one shouldn't take much effort, perhaps a staged attack on the road home. We're fortunate he didn't bring any guards, otherwise this could be a bit messier. Now, while the dead may wait, I certainly won't. Hurry to it!'\n\nFollowing his orders, the mercenary quickly gathered up the body before discretely making his way out of the estates window. While this job was well paying, he couldn't wait for it to be over. Maybe he would return north, join up with the Talons in Fillydelphia. Rumor had it that there were some promising opportunities in the south too, over in the lands around Shattered Hoof. Anywhere that wasn't in Mareway, with all of its convoluted politics and stuck up nobility."
 neocastleflavor.10.a: "Another rival dealt with."

 neocastleflavor.11.t: "The Shareholders Decision"
 neocastleflavor.11.d: "Brick Bobcat was not known for admitting defeat. For his entire life, he had fought hard to get where he is today, overcoming countless rivals in the race to the top. He had done many things he wasn't proud of, but that is what made him a victor and all those who stood against him nothing more than losers. That is, until today.\n\nThe decision made by the shareholders was near universal: A complete loss of confidence in the Builder's Guild. The target of their apparent ire wasn't just Brick himself, but the entire company under him. Now as a time for change, they said. A time for somepony else to radically change the way things are done. A load of griffonshit, if Bob had ever heard any. The time for reasoning and pleading though was long since past. The only thing he could do now was pack his bags and set out for a new life, away from the luxuries which he had grown used to over the years.\n\nLooking across his office for what could very well be the last time, he couldn't help but wonder where it all went wrong. Did they not expand fast enough, diversify enough with their portfolio? Was the brand blueprint not supercharged enough? These questions and more struck him, as he struggled to rationalize the fate of his Guild, until a knock on his door interrupted his near-frantic mind.\n\nTaking a moment to recompose himself, the soon-to-be-former CEO braced himself before calling out for his visitor to come in. Anger stirred within him as the pony in question revealed themselves to be a half-robot mechanical freak, no doubt one of the Mechanicum's representatives here to see the miserable sight of a fired executive. Through gritted teeth, Bob questioned his unwelcome guest. 'What do you want? Can't you see I'm busy here?'\n\nTwo cold cybernetic eyes stared back at him before the pony responded. 'Hello, Brick Bobcat. I am your successor...'"
 neocastleflavor.11.a: "...CEO-Magos Aetherspark."

 neocastleflavor.12.t: "J.E.B.'s 'Accident'"
 neocastleflavor.12.d: "It was rare for all of the Vice Presidents to be in attendance of a meeting, outside of truly special circumstances. However, this definitely qualified. News had come in earlier that day which had shaken the Guild to its very core. J.E.B., President and sole proprietor of the Miner's Guild, had died in a mine collapse in the early hours of the morning. Needless to say, this sparked a crisis in the upper-ranks of the Guild as they struggled to come up with a unified response.\n\n'Well, his son is perfectly capable of seeing to his father's affairs!'\n'He's barely 7, for Celestia's sake! We can't expect him to know how to run the entire Guild!'\n'What about his daughter?'\n'She can't even count to four, and that's with the aid of her hooves. She would bring us to ruin!'\n'Well, then one of us must step up!'\n'Yes, but who?'\n\nAnd so arguing continued on, well into the late hours of the night. Their shouting escalated further, tensions ran higher, and none of them noticed the quiet thumps of bodies hitting the hardwood floor outside the thick doors of their meeting room. Nor did any take any particular notice to the sound of steel hooves clopping against that very same floor as several figures approached the ongoing debate.\n\nTwo of their number were only stopped from beating eachother senseless when the doors to their chamber were flung open and a number of armored cyberponies rushed in, manarifles trained. Behind the intruders marched an authoritative figure who looked to be more machine than flesh.\n\n'Mares and stallions, I have here a solution for your woes. Rather than pointlessly fighting eachother over which of you to seize power, why not entrust in an outside mediator to lead your beloved Guild into the future?'\n\nThe disadvantaged ponies glanced around at one another for several uneasy moments before one of them dared speak. 'And if we refuse?'\n\nIn a flash of light, the speaker was reduced to nothing more than a pile of dust. 'Then you will join your friend there. Any other questions?'"
 neocastleflavor.12.a: "Nopony dared object."

 neocastleflavor.13.t: "Technological Breakthrough! Alt."
 neocastleflavor.13.d: "The Mechanicum's thirst for knowledge always brings new and inventive technologies to Neocastle, this time they’ve seemed to gain a strong interest in industrial developments. With the Mining and Builder guilds being quick to profit off it, with the mining seeking to simply make workers more efficient. The builders guild however sees much profit to be made, quicker construction is always good for business. Having the interest of the guilds in newer technologies also have the bonus also gives the Mechanicum greater resources to build their research facilities, making their eternal quest for knowledge easier. Even if the other guilds care little for the cults quest, their results are highly sought after from the board."
 neocastleflavor.13.a: "I smell profit!"

neocastle.31.t: "Selection"
neocastle.31.d: "Thunder cracked through the sky, but it is almost comforting to those below it, glad that it was just thunder and not another gunshot, another explosion. The ground beneath Neighvarro is covered in bodies, clad in power armor, with some of the pegasi still breathing within, fearful, hoping they will not be noticed. One by one, Servitors would go to them, cracking open their suits and pulling the pony out from inside, though they may scream and cry. They’d be quickly brought to a line outside of the old Enclave control rooms, broken into not too long ago by a squad of robots and Servitors, who used the Enclave’s own guns against them. There, pegasi would be pulled forward, scanned, measured for intelligence and strength, with the majority of them being dragged away to a factory pumping acrid smoke into the air, the smoke trails chasing after the last remaining cloudships as they flee for safety.\n\nRain patters down upon cold and wet Pegasi as they are dragged before the conqueror of the Neighvarro, a pony who is more machine than meat, with the right half of their body made completely of metal, both eyes glowing an intense purple. They would speak, enhancements making their voice, crackling and popping, carry over the rain, ‘You are worthy. You are not like your fellows, for you have something that is valuable. You are strong. You are smart. You shall be built up even further, and you shall tower above them. Rejoice, for soon your suffering will end. Rejoice, for soon your flesh shall be replaced with metal. You shall be the first of a new generation of pegasi, enhanced, improved, upgraded. Hallelujah.’ They then give a small nod to the other cyborgs and robots, who would forcibly pull the pegasi along with them, marching to a much cleaner factory, set up in the distance."
neocastle.31.a: "Rejoice, do not struggle."

neocastle.32.t: "Upgrading"
neocastle.32.d: "Thestrals never were liked in Equestria, and in Fillydelphia, being a thestral was nearly a death sentence, and so New Moon had learned to hide all her life, slinking through alleyways, away from sight. The robots came, from what was once Neocastle, some slaves celebrated, some lamented, many just went along with it, but not her, she knew better than to hope by this point. She’s hidden in the shadows, stalking the shadows, watching as these strange metal ponies would so quickly change the factories she had almost died within, and she would watch as slaves and masters alike would be marched into them. Some emerged covered in metal, one of the strange ponies now, others would enter and never leave, with only robots ever leaving, but always less robots than ponies who entered.\n\nShe’d watch as a slave is dragged into line, only to begin to fight back against the robots, the slave, who must have fought in the Pit before, would take down three of them before he was finally subdued, being dragged away. She’d poke her head out of her shadows, watching him, even meeting eyes with the stallion, who would look into her slitted eyes in shock, shock that she has hidden so long. But that would be her undoing. In an instant, those metal ponies and robots would snap their heads to face her, and charge close, firing off blasts of blue energy. She shrieks and flaps her wings, running into the alleyway, but she’s not as fast as they are, and they begin to catch up. In desperation, she banks to the left, rushing into a side door, leading into one of the factories.\n\nShe’d run past whirring machines of blades and saws, doing horrible things within, the stretch of blood in the air almost making her vomit, but she’s in too much danger to stop, and so she pushes on. They outflanked her, two robots appearing from a machine in front of her, filling the air with crackling energy, while those behind drew closer and closer. Left with no other choice, she dives into one of the machines, the door to it sliding shut, a glass pane letting her see a weird unicorn on the other side. The unicorn would just smirk slightly, ‘What an exceptional specimen. But she is not the most perceptive. We’ll fix her.’ He’d then press a button, with New Moon looking back, before screaming, as buzzing saws and sharp blades would upgrade her, replacing flesh with metal."
neocastle.32.a: "Rejoice, do not hide."

neocastle.33.t: "Refining"
neocastle.33.d: "Conquering was always the easy part to Magos Sly Sprocket, it doesn’t take perfection to take over a city, merely guns and idiots to hold them, but the hard part is what comes after. Every city has its use, and [808.GetName] was no exception. As soon as the fighting had ended, he had dragged together a bunch of their officers and Engineers, those who were smart enough to not be immediately lobotomized, at least. Three, that’s how many there were. Two engineers, one mare and one stallion, and one officer, a Griffon with quite the glare on her. They’ve been uncooperative so far, but of course they would be, they are but flesh, believing themselves to be greater than anything else.\n\nHowever, when he asked what could be done with the city for the third time, it would be the engineering mare who finally answered. She spoke of a battle that happened not too long ago, when a pony fought and managed to kill the dragon who used to live under [808.GetName], quite an impressive story, he would have quite liked to meet that mare, to upgrade such greatness would be a pleasure indeed. The mare would then theorize on something, dragons are able to breathe fire when they are alive, so perhaps the Magos could find that corpse, and revive it into a living machine, breathing fire infinitely, limitless energy. An appealing, and clever, suggestion, that’s why, when the questions were done, she was the only one he allowed to stay.\n\nThe other two had proven not to be worth the effort, all too willful and defiant. Being so uncooperative against what is better for them... like foals fighting their parents, it’s silly and a little bit gross. So they’d be dragged away to be turned into a thought engine, where those minds will finally be able to answer questions, unburdened by that pesky will. The mare, however, she was special. She was clever, cooperative, an intellectual, perfect for being properly upgraded, in other words. She’ll begin her studies with the Guild shortly, sure to work on the project of reviving that dead dragon."
neocastle.33.a: "Rejoice, for the intelligent inherit Equestria."

neocastle.34.t: "The Great Wall"
neocastle.34.d: "It’d be a cold and dark day along the border, then again, most days are, where two ponies sit on a hilltop, watching the border with binoculars. Both were just farmers a little while ago, normal ponies trying to live, but with the Mechanicum expanding so rapidly, they were forced into service, to protect their home. Of course, they stood no chance of actually winning, everyone knew that the damn robots and cyborgs could crush any pony they came across. So they lived every day like it was their last, because chances are that it would be, everypony knew that they'd come shortly, and everything would change.\n\nBut then they stopped. Robots and cyborgs still roam the border, and would surely kill or capture any that they see, but they aren’t marching across. Instead, they’re building, digging deep ruts in the ground, within which automated turrets sit, concrete bunkers where magically powered machine guns await, anti-air positions pointed high into the sky. It was a sight to behold, every pony knows that if they tried to attack it, they’d die. But maybe they don’t have to charge it, maybe the nightmare’s ended, maybe they can finally return to a life of peace.\n\nNopony knows why they’re stopping, but everypony is so scared of their weird ponies to attempt to ask. So instead they all just quietly celebrate, hoping the day never comes where those defenses are used, hoping they’ll never have to see those metal ponies again. Of course, some whisper with concerns about why they’re building defenses, it’s unlike them. But that doesn’t matter for now, Equestria is safe from the madness."
neocastle.34.a: "Rejoice, you are safe."

neocastle.35.t: "The Allmighty"
neocastle.35.d: "Trillions of calculations, millions of variables, a neigh uncountable amount of permutations, simulations ran through dozens upon dozens upon hundreds of analysts, AIs, and thought engines, and finally, they’ve all come up with one final answer. Twenty years. Twenty years to salvation, to the saving of ponykind. Twenty years until the promised day, when ponykind shall take their first steps into the rest of their existence.\n\nThey call it the Allmind, an AI greater than any conceived before, to the point where it is greater than just an AI or machine, it’s a god. No more resources are needed to build it, any more would be wasteful, so we have closed off our borders, focusing entirely on bringing Its creation. A perfect fusion of mind, soul, and body, the final goal of scientists for millennia, even back when they were called alchemists, the perfection of ponykind. We will need unimaginable power to sustain It, Starforges, devices such as them, the power of the sun in our hooves, all to bring IT.\n\nHallelujah, the promised day approaches, where ponies shall finally see the land of wires and gears, and all shall know Its greatness. The Allmind approaches. Praise be."
neocastle.35.a: "Rejoice, It is almost here."

neocastle.36.t: "Hallelujah"
neocastle.36.d: "Life is a journey, twisted and broken, painful and horrible, wonderful and awful, long. Archmagos Tezla knows this better than most ponies. She still remembers her early days, practically a slave, serving as a minor miner underneath Neocastle, extracting resources for those above her, needing to fight over scraps of bread, unable to trust any around her. She remembers scavenging broken pickaxes, slowly shaping them together into a claw, with which she would dig into rocks to extract the needed materials. She remembers moving up in the world, being elected Director, getting the other two out of her way, the wars, the many, many wars, she remembers them all.\n\nTwo hundred years ago, she would be called many things. Psychologists would call her a sociopath, damaged by an upbringing where she could have no trust, lashing out against a world, unable to allow anyone else to have will or power greater than hers because she remembers losing her power so long ago. Marksists would call her a fascist monster, stomping down on those underneath her for her own sick pleasure. And Celestia? Oh, she’d call her a villain. Worse than Sombra, perhaps, worse than Discord, unredeemable, worth not even the moon, but merely to be cast into flames and burnt away until nothing remained. She’d call herself something else. Victorious. Surviving. In an evolutionary sense, the winner. Those cries of evil did nothing when the Zebras dropped bombs on those past ponies, just as the cries of evil from outside do nothing when her robots shoot them with plasma.\n\nIt’s a new Equestria, one of metal and steel, not of morals and flesh, not anymore. That’s where the Allmind will come in, a Celestia for a new age, able to lead without being held back by morals like the alicorn was. Soon, all will see her as a prophet, beckoning the coming of the almighty, the guiding hoof through this world. Soon, all raiders, all bullies, and slaves will bow and know true power. Unlike attempted prophets of the past, Unity, Red Eye, ushering in alicorns, or the New Canterlot Republic, worshipping their own god, democracy, she will be the first to be successful. And all will be set right in the world.\n\nHallelujah."
neocastle.36.a: "Rejoice, do not fear..."

neocastle.3001.t: "The Power Of Democracy"
neocastle.3001.d: "Shouts, hoof fights, and chaos were the order of the day, as the many different idealists, mercenaries, and other assorted forces fought over the future of their newly liberated Neocastle. It was a contentious matter, as those involved all had very different goals and visions. Even those of similar interests were in conflict with one another, now that it came down to details.\n\nThe Unionists, having organized this whole assembly, sought to bring some semblance of democracy to what they saw as their homeland, though they couldn't yet agree on how far to go nor what form this would take. Some took the opportunity to argue for the dissolution of the Miner's Guild as well, while others said they needed to form their own new Guild to lead them. The mercenaries, here only due to the coffers of their employers, threw their voices behind their various captains on the behalf of said employers. It seems they had a vested interest in the divestiture of the nation as a whole. And the pirates? Well, they fancied themselves warlords-to-be.\n\nSister Citrine waited and observed the proceedings from a blasted out ruin across the way. It had been a long evening of unproductivity, and it seemed like it would only get longer yet. A flash of green light, then three, from another ruin signified that the wait was over. It was time to cast their ballots. Citrine responded with her own hornflashes, before bringing together a teleportation spell and vanishing in a flash.\n\nOn stage, or rather the rickety thrown together platform being used as one. Very good, right location. Very nauseous, but she would manage. Also very good, vomiting would ruin the effect. Teleportation had never been her strong suit, but it seems she had pulled it off for tonight. Gathering her bearings, Citrine looked around at those assembled. Many eyes were locked on her, yet many others continued to fight and debate with one another. An amplification spell would get their attention quick enough.\n\n'HELLO!' Too loud, though now she had everyponies attention, 'Ahem. It's my privilege and honor to stand here before you all, those who fought so bravely and fiercely against our shared foe, those who bled and sweat for the dream of a brighter future. A future that you may all be a part of, I assure you! There's just one tiny thing you must do first, one little ritual to humor the Fates. Please, I ask of you, to now disarm yourselves and get down if you'd like to join us in building our destiny.'\n\nNopony moved, though some began to glance around nervously or reach for their weapons. Oh well - It was worth a try. A flash of light flew from Citrine's horn, the final signal for the night. Within seconds, a much brighter light flooded the stage, a team of mercenaries being teleported in to protect her. Gunfire filled the air, as similarly loyal and paid off soldiers spread throughout the audience took out the biggest threats. Some ponies tried to fight, making themselves priority targets. Many more scrambled and ran, only to run into the waiting enforcers of the Miner's Guild or the robotic guards posted in each alleyway."
neocastle.3001.a: "It was over in minutes"

neocastle.30.t: "The Beauty Of Order"
neocastle.30.d: "Sister Citrine blinked, her mind still reeling from the raw violence earlier that evening. She was no stranger to it, of course, but to be that close to so many ponies being gunned down... it gave her a new sort of perspective on the matter. One that would haunt her dreams for years to come. Ah, such is the price of salvation!\n\nA loud thud drew her out of her thoughts, turning her attention back up to the ongoing meeting. The others within the Council of Seven, those who had been entrusted with guiding ponykind to its ascension, were in full celebration of their success. The thud in question had come from one of her Brothers slamming his hoof down on the table in the midst of some tall tale of glory in their recent conflict. Of course, knowing him, his recounting was near certain a fabrication. Though his spellwork was impressive, he always took care to be as far away from any actual danger as possible. Probably the reason he was able to be here tonight, unlike certain others.\n\nSpeaking of, their newest member of the Council had quickly fit right in. Shame what happened to Brother Prase, but such was the price of his own hubris. In his place now sat 'Jeb', that eccentric self-proclaimed family-stallion who had made the wise choice to align with the winning side. Of course, that name of his wouldn't do, wouldn't do at all, but nopony had yet seen fit to push the issue on him. Not so soon after our victory. Soon enough though. Jeb looked back across at Citrine, before taking this as a sort of cue. Standing up and tapping the meeting table, he began to speak.\n\n'The rabble's been dealt with, the other Guilds toppled, and our reigns secured. Now, I say that's pretty good cause for a toast. What do you say, or do you all not partake?'\n\n'We're ponies of enlightenment, not savagery!', responded one of the other Brothers, 'That's to say, of course we drink! We'll do it to something greater though - everyday can be a victory, as fate wills it, so instead let's toast to fate itself! Quick now, pour your glasses, don't leave us waiting! Good, good. To those lost, to those yet to be enlightened, and to the new world!'\n\n"
neocastle.30.a: "To the new world!"

neocastle.37.t: "The Lodge Sends It's Regards"
neocastle.37.d: "In the days before the rise of Archmagos Tezla, there were others within our Guild with a different perspective on the nature of progress. They sought the esoteric, the spiritual, and the arcane. Through these things, they believed a greater understanding of the nature of equinity could be achieved, and through that understanding the impossible would become possible. Though their goals may have been similar, their ideals and methods fundamentally clashed with our own. Divergence from our vision could not be allowed, nor from theirs, leading to their willing exile.\n\nSince then, they have existed largely within the realm of rumors and myths. Officially, they have for all intents and purposes ceased to exist, with none of the Guilds acknowledging them or having any connection to them. Unofficially, whispers abound surrounding the so-called 'Lodge of Creators'. Underground exhibits of their so-called 'truths of reality', rundown establishments serving as fronts within our least monitored communities, unaccounted for allocations of resources - all of these incidents and more lend credence to their continued presence. And now, perhaps emboldened by the recent success of their former Guild, they have made the first official contact with our Guild since their exile.\n\nA representative of their 'organization', identifying herself as 'Sister Sapphire', infiltrated the lowest levels of the Alpha Forge and delivered a note to a senior Magos, before vanishing in a flash of light. An investigation into the incident is underway, but the contents of the letter are just as mysterious as the methods of getting it to us. A short congratulations, followed by an offer of an alliance between us and the Lodge. To decline, all we must do is rip apart their letter. To accept, we must burn it.\n\nThe form their support would take is a mystery, along with their intentions and motives. How do we proceed?"
neocastle.37.a: "Tear up their letter"
neocastle.37.b: "Burn it"

neocastle.38.t: "Lapse In Security"
neocastle.38.d: "Laser and plasma burns dot the scene, the burning wreckage of what was once an important Mechanicum convoy still visible off the coast. Security personnel rush to and fro, struggling to secure the perimeter and keep the situation under control. Bodies continue to wash up on the shore, some burned to a crisp, others sporting laser and plasma burns. We've yet to find any survivors.\n\nFrom his vantage point along the Neo-Bridge, Blue Feather surveyed the damage. Thirty thousand caps worth of machinery, materials, and menials gone like that. No doubt the Mechanicum would be furious, and with good cause, as there should have been no way for a raid this deep into our territory. Multiple outposts line the approach, patrols travel all day up and down the river, and the convoy itself had security forces stationed on it. Forces that likely didn't survive, if the half-burned uniforms on many of the bodies was anything to go by.\n\nA growing commotion drew the stallion's eyes, as Magi began to arrive in force. With a sigh, Blue Feather began to make his way towards the new arrivees. There'd be questions, a definite lack of answers, and he'd be lucky to still be employed come the day's end. It was going to be a long shift."
neocastle.38.a: "How could this have happened?"

neocastle.39.t: "All Quiet In The North"
neocastle.39.d: "'Unionists on the Run', 'Rioters Abandon Cause', 'Special Memo: An End to the Strikes'. Headline after headline, report after report, all stated much the same: The West Amethyst Strikes had come to a sudden unexpected end. Where once were waving banners, unionist marches, and even armed rebels, was now silence. It seemed as if all of the dissidents had simply packed up and left overnight.\n\nMany within the Guilds considered this a major victory. Parties and celebrations abounded, and work was already underway on getting the once-occupied factories back up and running. The popular narrative was that this was an inevitable outcome, the natural result of any attempt at resisting the Guild's influence. The strikers simply couldn't sustain themselves anymore. As to where they went? Likely over the borders, every border they could find, to try their luck somewhere far away from us.\n\nYet, looking through the reports, something continued to bother Tezla about this supposed victory. There were only reports of them vanishing - nothing regarding their migration, no signs of herds traveling together, nothing from our border patrols. Investigations were underway, but so far all evidence pointed to the unionists having simply up and vanished."
neocastle.39.a: "What in Tartarus is going on?"

neocastle.40.t: "Static On The Feeds"
neocastle.40.d: "Alarms blaring, galloping hooves all throughout the halls, shouts and orders fighting with one another to be heard. The Alpha Forge as a whole was in a state of pure chaos unlike anything it had witnessed before. Among it all, the Archmagos herself fought to maintain some semblance of order.\n\nIt happened quickly. Electricity was cut off throughout large parts of New Neocastle, followed by the emergency communication lines. Automated security had been shut down, doors were being sealed shut or forced open, and the internal networks of all three Guilds were seemingly hijacked by an unknown foe. With no means to contact the surface, many of the Mechanicum's senior Magi have since been stuck trying to regain control over their own systems from within the depths of the Alpha Forge.\n\nA flicker of light, as the monitors lining the room are brought back online. Quiet begins to, slowly and surely, roll across the room. A minute later, they begin to display the newly restored security feed from above.\n\nFlame, chaos, and destruction. The situation on the surface appears dire, as masses of armed ponies lay siege to New Neocastle itself. Disorganized hordes of ponies, armed with impressive energy weapons and boasting heavy armor, march block by block into the heart of the city. Flying alongside them is every sort of banner: The emblem of the Union, the symbols of the pirate clans, the flag of Leslie, and even a few mercenary standards all fly side-by-side, giving the impression of a victory march through the city.\n\nAnd there, leading the ponies forward and struggling to keep the makeshift army coherent, figures in distinct white coats. The ever-elusive Lodge of Creators, finally appearing in the open, seemingly orchestrating the entire invasion."
neocastle.40.a: "A storm has arrived."

neocastle.41.t: "The Streets Weep Red"
neocastle.41.d: "'Status report, now!' 'Sector 9 needs reinforcements, move, move!' 'The Builder's have fallen back! I repeat, the Builder's have fallen back!'\n\nShout after shout, as the forces under the Mechanicum's command struggled to fight back against the invading horde. The situation on the surface had only continued to deteriorate, with the enemy continuing their steady assault. From within her makeshift command center, the Arch Magos could do little but watch as everything came crashing down.\n\nA sudden flicker of hope, as an out-of-breath Magos delivered an urgent report... 'Engineers report automated defenses back online.' The siege on the Alpha Forge's entrance is briefly broken, as the turrets come back online and begin vaporizing every hostile that dares to show themselves. A steady rhythm of steel against steel sounds out, heralding the emergence of a small army of robotic soldiers. Lasers and plasma fly through the air, being exchanged by both sides, but with the tide clearly shifting in the defender's favor.\n\nThe formerly relentless assault pauses, the first sign that something is wrong. A hum fills the air, and those unicorns among the Mechanicum's forces immediately feel the pressure of intense magic. Those directing the effort barely have time to realize what's going on, before a great vortex opens atop their position and begins to tear apart the very fabric of reality around it. Ponies distort, losing all sense of self and feeling as pure uncontrolled chaos is unleashed upon them. Limbs go flying, ripped off of their owners with unimaginable force, and their owners likewise soon follow, cast to and fro. Their robotic allies fare no better, being ripped apart or finding that gravity no longer applies to them.\n\nThe vortex shifts, moving further into the rapidly collapsing fortification. Deep below, the Magi in command can do nothing but watch in shocked horror as the once-thought-impenetrable steel cog protecting them is ripped out of its frame and tossed through the air, as if it were no more than a minor inconvenience. In the distance, it smashes into another distant fortification, pulverizing a small army of security personnel.\n\nOut of the ruins, they emerge - the Lodge themselves, leading their army forward to finish the job. Though the Alpha Forge is far from defenseless, the forces hidden down below are nothing before the might of such magic - a fact that both sides are distinctly aware of.\n\nYet hope flourishes once more, as from a ruined factory opposite to the approaching invaders, heavily armed forces sporting the banner of the Miner's Guild emerge. Uncertainty becomes visible on the face of the front-most Creator, wholly unprepared for this new threat. He takes a step back, as the Miner's..."
neocastle.41.a: "...open fire on the hostile mob."
neocastle.41.b: "...lower their weapons and approach."

neocastle.42.t: "At The Eleventh Hour"
neocastle.42.d: "With a brilliant flash of light, the Creator at the head of the advance vanishes. The others behind him are quickly shredded, devoid of any sort of cover and stranded in the open. The roar of an incinerator sounds out, as great gullets of flame are launched at the ruins from which the assorted soldiers were laying siege. Screams go out, as those lucky enough to avoid being burned alive instead find themselves facing a swarm of grenades, launched from a large automated gun wielded by one of the Miner's Guild's elite. In the distance, the roar of an artillery canon signals the already disorganized lines shattering, as a mix of soldiers and mercenaries quickly shred their way towards the few still standing holdouts of the defenders. Granted a brief reprieve, even the Builder's Guild's greatly diminished forces remerge into the fray with fresh vigor.\n\nTaking stock of the rapidly shifting situation, Tezla prepares to restore command to the Mechanicum's remaining defenders. Before she can fully collect herself however, another flash of light gives a very brief warning before another Magos slams into her, taking the plasma blast that was meant to decapitate their leadership.\n\nCreators, a dozen of them, horns lit and weapons ready. With the element of surprise, they managed to eliminate many of those gathered already, but not quick enough, as the Mechanicum's finest quickly regain composure and fight back. With a wordless roar, one Magos throws himself blade first at the unwelcome intruders, stabbing a hoof-blade deep into the neck of one. The others follow suit, unleashing with everything they have, closing in and near mauling the hostile mages.\n\nOne of the Creators, the very same one that tried to take out Tezla herself a few moments before, uses a shield spell to block the blow that would have otherwise ended his life. Dropping it, he casts flames upon the face of his would-be killer. He quickly barks orders to the others, directing their spells and casting his own, driving back the rabid Magi and regaining control of the situation.\n\nHalted mid-order, the one that seemed to be leading them stood mouth-agape, a long blade piercing through his chest. As it was withdrawn, he collapsed, a half-finished spell fizzling out as life left him. Looking down at him, Tezla found the sight of his white coat turning red to be very satisfying, but only spent a moment relishing in it before turning her attention to the remaining mages - who were rapidly falling now that their leader was gone. It seems none of them quite shared his talent for teleportation, as several took off in a mad gallop trying to save themselves. A futile attempt, as more Mechanicum forces poured in from every entrance to the command center, making quick work of their foe.\n\nThe monitors all around depicted similar victories, with the invaders falling apart and going into full retreat. In many areas, they even began to turn on one other, or even the Creators that sought to lead them. The battle was, perhaps only thanks to the Miner's Guild, won."
neocastle.42.a: "I suppose we owe the Miner's Guild our thanks"

neocastle.43.t: "Last Turn Of The Gear"
neocastle.43.d: "One might expect silence, a moment of respite and rest in the aftermath of such a violent revolution. Maybe even respect for the dying and the dead, a sort of humble reverence for the bloodied streets upon which the ponies trod. One might expect that it would be the calm following the storm, a moment of clarity and peace. The reality, Sister Citrine was finding, was very different from that poetic envisionment. Looting was still underway, with many districts of the city remaining a wild free for all. Ponies still galloped this way and that, having to constantly detour to avoid yet another rubble-strewn road or collapsed alleyway. Cries went out, some of pain, some for order, others of ponies searching for their loved ones amidst the destruction. It was, to her eyes, a very unpleasant sight; far too heavy in pain and far too light in purpose.\n\nA pony was approaching every passerby, clinging to them and begging and pleading for news of her beloved. Amusement flickered behind Citrine's eyes as the mare approached her, nearly groveling at her hooves, desperation clashing with exhaustion bringing the poor thing to the brink of collapse. 'Please ma'am, please, have you seen my husband, Tail Light? He's a Builder, but he's a good stallion, just tried to keep out of the way, please...'\n\nGazing at the pitiful mess before her, Citrine considered her for a moment. Raising her hoof, she gently stroked the mare's grime-covered face, cooing to her as if she were comforting an injured animal. 'There there, it's going to be alright dear. Gone or not, he's served the greatest purpose any of us could ever hope for. Take joy in his passing, for he would have given himself unto a new age.'\n\nThe mare drew back at these words, confused and disturbed, before continuing her fruitless search and accosting more passerby. Citrine felt a brief bloom of annoyance, before reminding herself that these ponies can't be blamed for their ignorance. They simply know no better, unenlightened to the truth of things. It was for this reason that the Lodge was formed, that everything they had done was required, and that everything they would do was necessary. For the ponies simply couldn't lead themselves, trapped as they were in their own lesser concerns.\n\nContinuing her march down the street, Citrine was quickly stopped yet again by another filth-ridden pony. This one was different, bearing the tattered remains of a factory uniform with makeshift armor padding strapped to it, and passing out flyers to every passerby. 'Freedom, freedom for the ponies of Neocastle! You there, miss, have you heard the word? The Guilds are no more! Come tonight, come everypony, to discuss the future of our free nation!' Handing her a flyer, he quickly went on his way. The flyer in question announced the first ever General Assembly of the Unified Unions of Neocastle, tonight in front of the ruins of the Builder's Guild's former Headquarters.\n\nGiggling to herself, Citrine began coming up with a plan. The next step was looking to be much easier than anticipated. The Unions, while offering up all sorts of silly novel ideas, were unfortunately far too influential to simply let be. The entertainment they provided with their assemblies and their idealistic rhetoric would be sorely missed, but there'd be no better opportunity than the one they had just gifted to her on a sheet of paper."
neocastle.43.a: "The ground needs to be level for Creation to begin."

neocastle_creator.1.t: "Ever Skyward"
neocastle_creator.1.d: "The task of our most magnificent work has begun, dubbed the almighty Infinity Spire. It shall be the tool that shall guide us to our destiny. Our blessed task requires resources and we shall have them, every settlement, every building, every body must be used to accelerate our ascension. Our great mechanical soldiers guard those that tear down what had remained from our take over, homes crumble, dreams die but all of this was but the first of many sacrifices that must be done to accomplish our goals. The old settlements’ walls collapsed, broken down into their most essential parts, packed onto caravans heading towards the site that shall be the monument to our goals and vision. There would be no more resistance for what shall come, all must focus solely on the creation of the Infinity Spire for it shall grant salvation to this damned land once our aspirations have been completed. \n\n What was being built was beyond any scope of what could be thought of in these dead wastes. The Spire grows taller and wider with every resource added into its construction. It is like a starving beast that must be fed, growing stronger as it grows with every sacrifice given to it. Blood, metal, tears. These are what flow towards the tower as it grows ever onwards blanketing the sky in its forthcoming shadows. Our destiny awaits us as we feed our dreams and aspirations into every piece of the Infinite Spire that ascends into the sky. Soon, the sky and land itself shall become ours for no price shall be deemed too high."
neocastle_creator.1.a: "Blessed be the great work"

neocastle_creator.2.t: "Dreams Writ In Blood"
neocastle_creator.2.d: "It was a simple procedure to eliminate the last remnant of the guilds, the Miners, from the new state. A signing of a pen against paper and a smile of victory. They had now outlived their usefulness to the Aetherists and thus would be liquidated in force. The ground was not where the aspirations of heaven lay, and slavery itself was distasteful and inefficient for the future they sought to create. With the Mechanicum exterminated utterly, the Builders fleeing or dead, it was only a matter of time before the Aetherists moved to secure their power completely. JEB was fortunate enough to have ascended into the Council, avoiding the fate of his erstwhile guild, merely dictating who would be the most useful to the cause and who would be liquidated for future projects. Death after all would be a mercy for them, for their demise gives further progress to the ultimate goal. The former slaves will be reorganized and moved to their new fate in serving the grand design, the mines shall be forgotten for our heaven lies far above the clouds themselves. Whilst the ponies may despise us now, scorn our names and call us mad. This is merely the chanting of the ignorant who are not blessed by the sacred knowledge we hold. In time they shall come to see us as we are, the great saviors and divines whom shall purify this wasteland. And we shall repay their loyalty and sacrifice, their blood and sweat, their deaths and pain with a most divine gift. The gift of prosperity that shall reign over all and the sweetest bliss of an eternal future."
neocastle_creator.2.a: "Thus end the guilds, wiping the slate clean."

neocastle_creator.4.t: "Wheels Within Wheels"
neocastle_creator.4.d: "It was with great surprise that Acolyte Stormrise was summoned to the chambers of the grand order with a message saved only for their eyes. The Grand Design required more resources, more blood, more of everything. The Infinity Spire was to give the world a new enlightenment, and thus, the first true enemy has been decided: the NCR must be broken to give way to the future that the Aetherists shall bring. \n\n The young acolyte made their way into the chambers where everything would be explained and the first true orders would be given. The honor of being chosen weighed heavily upon Stormrise’s mind; to be given directions by the future divines was a blessing only the most worthy were ever to receive. He stood within the chambers as the scroll was laid out upon crystal floors. It was a simple mission at its core. Paint Gawdyna as nothing more than an opportunist kleptocrat, scaring the citizens with internal tales of corruption and fearmongering, and building connections within the administration to tear it apart from the inside. They did not have the time or followers to fully crush them from within, thus this method of internal division would suffice. The unicorn smiled at the thought, even as the various complications with such an endeavour swelled like fire within the depths of his mind. This would only stall them out after all, but sacrifices must be made for the greater good; only through the Aetherist’s teachings can the mortals be saved from damnation. It is what they had taught him, what was forged into his very soul at the beginning. Nothing can be deemed too unfair, no price deemed too high; the very concept of selfishness would have no place in the future they’d create. Luckily, the order has been preparing for this change for a long time, as Stormrise counted every cap that had been allocated to his grand mission. This would be his own legacy in the steps of the divinely chosen. Stormrise stared upwards into the infinite expanse of the sacred spire that would bring about ponykind’s salvation and smiled, letting it drag across their entire face. 'For the future, for the order, for our paradise that is meant to be. For those who refuse the tyrant’s calls will find themselves redeemed and saved by the light of the future."
neocastle_creator.4.a: "To save others in chaos, is always a worthy cause.'"

neocastle_creator.5.t: "Gods Have No Need Of Borders"
neocastle_creator.5.d: "For what is a border upon our world? It is a line, drawn by creatures small and misguided. An unnatural line, drawn by those who believe themselves stronger than gods, who believe themselves greater than anything. President Gawd has not earned the right to draw the lines on the maps as she does, for she is but a small dimple upon the fruit of the world. Salvation is not found in voting booths in a single-party state, salvation is only found through destiny, and the path alongside the riverbed we trot.'\n\n Cheap Hooker sighs as he listens to the radio, some Aetherist bullcrap that's been popping up all over the Republic recently. It's all just a bunch of babble, of course, but like every soldier, Hooker gets bored easily, and a bored soldier will listen to anything that's on. Fisherman's Harbor, what a post for a young stallion, where the water is filthy, and the mares even filthier. He sighs and adjusts the service rifle sitting beside him, stationed up high in an observation tower overlooking a small road. Just then, he would glance upwards, only to pause, spotting a plume of smoke in the distance.\n\n A garbled voice comes in through his radio, but he can't pick up but a few words, 'Bridge, Aetherists, advancing.' He looks at the radio with a frown, trying to tune it to make out the voices, but just as quickly as he tries, the signal cuts out. He nervously taps his front hoof on the edge of his observation post, gulping and taking out some binoculars, looking north, towards New Neocastle Bridge.\n\n Legions of robots, like nothing he's ever seen before, big and small, with odd symbols emblazoned on their metallic forms. A few ponies trot amidst the robot legion, ponies wearing steel armor, polished and shining bright, fashioned to look like robes over their bodies. With a start, he throws down the binoculars, and calls into his radio, 'Command, we've got a problem! Aetherist robots advancing on my position! I need immediate backup!' He looks back to the advancing legions, which have come even closer. With a gulp, he looks at the radio, and then shakes his head, 'I'm not dying for this.' He strips his uniform off, leaving it behind, as he quickly descends from his post, and breaks out in a full sprint away from the encroaching metal legion."
neocastle_creator.5.a: "We are inevitable"

neocastle_creator.6.t: "The Future In Chains"
neocastle_creator.6.d: "A war’s end brings many new beginnings, as the last remnants of the NCR are hunted down and exterminated, the former acolyte, now Scholar Stormrise, watches over the robotic legions that span across New Canterlot. So many lives sacrificed and erased in these days, and yet many more remain broken by the destruction. His eyes were glued to the destruction, the ashes, and the sounds of buildings already being ripped apart to be carted towards the Infinite Spire. “All of this death, all of this chaos, caused by my own hooves. I feel uplifted and enlightened, but a part of my soul cannot help but watch this with more questions.” Stormrise’s gaze fell upon the vast lines of ponies being rounded up, forced into narrow lines by their robotic legions—an endless march northwards to pay their penance by sacrificing their blood and hooves towards the Great Work. \n\n The scholar didn’t even realise the presence of the council member watching over the lines with a smile. “Beautiful, is it not? A necessary sacrifice for the future we will create.” Stormrise felt a shiver run up their spine. To be so close to one of the divinely chosen was a gift few could ever comprehend. Perhaps out of a desire to seek answers or merely in the heat of the moment, Stormrise spoke out in a calm yet submissive voice. “Great ascendant, must they all perish, however? Could there not be any amongst them worthy of enlightenment? It is our duty to enlighten the mind and give rise to the Great Work, but surely some are capable of more use than simple labor.” The scholar tapped his hooves idly along the ground, staring towards the lines once more, the old and young forced in singularity forged onwards to a lone purpose. To work until they perish, and then are simply reused to continue the cycle. \n\n The council member nodded towards Stormrise’s words, seeming to give them a moment of thought before dismissal. “Young Scholar, your mind is fresh and awash with possibilities. You’ve learned our teachings since the order has claimed dominion. I understand your questions, your worries, and your doubts. But these sacrifices are a necessity for the paradise we seek to create to be given form. They are too old to understand, too weak willed to see the truths of the world. They cannot see the future as we do, and they are broken because of it. The only hope we can bestow upon them is the ability to create that future for the next generations. A world without fear, without disease, without suffering, and without misery.” The council member held their hooves upwards above the towering lines of ponies as they spoke in a grand voice that echoed from the hills, “For peace always comes at a cost. Therefore, we must honour what we are able. Take their names into your heart, Scholar, remember them, remember their faces, remember everything. So that when our goal is achieved, when paradise is at last accomplished. You may thank them, and earn their forgiveness.” \n\n Stormrise’s eyes widened as he stared down upon the crowds once more, a glimmer of understanding building within his soul. He would take the time to descend after the remnants were at last defeated, and record every name of every pony he could into his journal. Let no sacrifice or pony be forgotten on the path to salvation."
neocastle_creator.6.a: "Let their memories live on, in the dreams of the future."

neocastle_creator.7.t: "The Last Generation"
neocastle_creator.7.d: "Most classrooms are bedazzled with maps, posters of old inspirational quotes, maybe a few books on shelves lining the wall. Yet, for the group of early and soon to be teenagers in the room, the walls are barren, except for a few emblazoned emblems of the Aetherists. Into this room trots Sister Citrine, looking at the gathered students with a small smile on her face, yet with eyes filled with quiet somberness. She trots up to the front of the room, and smiles as she does, turning to face the students, ''Once, the monster of Fillydelphia said something to his slaves. He said unto them 'One generation of suffering, one generation of slavery, so all generations future may live in Equestria rebuilt.' Though he is a monster, verily, and he is a fool, unable to grasp the truth of reality, he is a fool who has said a very true phrase. For us, there shall be one last generation, this last generation of suffering, as all generations thus far have suffered. This last generation, before paradise can be brought unto the world. Your generation, my little ponies, is the last generation that shall truly behold the horrors of our disconnected, ignorant, weak lives.''\n\n The students shift around slightly in their seats. Citrine might be a bit weird, but as one of them coughs, the rest of them remember the boiling heat of the forges and the choking dust of the mines. Citrine, Citrine is better than that. Sister Citrine smiles wider, 'However, do not despair, and do not fret, for your generation shall be the first to behold wonders like never before seen. Your generation shall help my generation to pave the river-side path upon which we shall trot our destinies into paradise. Your generation, within this very room, shall help place the final stepping stones, until no more have to trot. Yet, I am afraid, and though I am sorrowful to say it, I must subject you to one last horror of this unenlightened world, before our paradise is to come.' She frowns softly, and bows her head in slight shame, 'For I must subject you to something none will need to understand once paradise has arrived. My students, let us learn algebra.'"
neocastle_creator.7.a: "Paradise is your birthright"

neocastle_creator.8.t: "The Never-Dimming Sun"
neocastle_creator.8.d: "Buried deep underground, where few dare to tread, lay a secret room, hiding within it a secret pony, within her mind, the secrets to a nation. A large tank of bio-gel, enough to build hundreds of robobrains, holds within it the secrets, deep within a body, stripped of most of its parts, like a toy shattered upon the ground. Magos Sunforge, bereft of cybernetic legs, a tube shoved down her throat, eyes forced wide open at all times, for her to behold the horror she has become. For it is into her mind that the Aetherists delve at all hours of the day, for they demand secrets untold, codes and blueprints, unwilling to let the brilliant mind rest. Yet despite it all, within the gel, Sunforge always has her lips upturned, into the faintest hints of a smile.\n\n 'You calculated sin wrong, funny for a religious colt like yourself, you used B instead of A for the calculations, so you calculated cosine.' The robotic voice of Sunforge radiates from the speakers on top of her tube, for all to hear. All around, stallions and mares type away on terminals, calculating and planning. In front of her, a stallion frowns, and then looks away, ''Tis not my fault that I err, for I am but an ignorant pony, trying to build a shrine to the paradise we seek.' A mechanical chuckle comes from the speakers, Sunforge speaking once more with a voice not her own, 'Believe me, building isn't your specialties, you should see some of what I've been given access to. You're so obsessed with the idea that you must that you never considered if you can build such things. I'd do the calculations myself if I were given them!'\n\n The stallion grumbles, as the door to the room opens. In trots Sister Ruby, a radiant glow about her, bright red eyes scanning the room, before locking on to Sunforge. She trots up to the tube, looking into the wide-open eyes of the suspended mare, 'Magos Sunforge. Have you looked over the schematics we've given to you?' Sunforge cackles out a laugh, 'The spire? I've looked it over, it's doomed to fail! I've had to recalculate so much of your math, I've practically built the thing myself!' Sister Ruby simply smiles serenely, and nods, 'Very good. I come with an offer, Sunforge. Help us, and you shall be confined to this tube no more. Can you help make our destiny come true?' Sunforge cackles again, the speakers crackling with her cackling, 'You're all insane and your plan is doomed to fail, and likely destroy the entire country in the process!' She takes a second, her lips slowly curling upwards within the tube, 'I've fixed worse.'"
neocastle_creator.8.a: "If only they had asked, I would have joined willingly."

neocastle_creator.9.t: "The Flesh Is Pure"
neocastle_creator.9.d: "'This flesh is weak, it disgusts me that you have given it to me.' Sunforge trots slowly, on hooves regrown by magics beyond her grasp. The breeze flows softly between the small gaps in her fur, chilling her legs to the bone, much colder than even the blackest of steel cybernetic was. Sister Ruby trots beside her and smiles, 'We don't appreciate a whiner amongst us winners, Sunforge. Chin up.' Sister Citrine presses against Sunforge from the other side, as the mare stumbles, 'Flesh is not weak, for flesh is what ties us all together, it is the vessel for our souls. It is only by flesh, blood, and bone that we may trot upon the riverside path, not through iron and steel.' Sunforge shakes her head, and takes another step up a long flight of stairs, a few of her remaining cybernetics sparking slightly, 'How do you all put up with the itch? I feel like a kitten, like I want to rub against everything, just to get rid of that feeling. The way it pulses, the way I can feel my heart beat, the disgusting, vicious blood within, I almost preferred the bio-gel.'\n\n With a few more steps, the trio of mares would come to a door, opened up by Ruby, dim sunlight steaming through grey clouds, brighter than anything Sunforge has seen in a while. She flinches for a second, but then pushes through the discomfort of the sun, staring into the sky above, 'Hello there, sunshine.' She blinks. When her eyes reopen, she sees that it was not the sunlight that she saw at light, but the reflection of the pale light upon a massive spire, rising up towards the clouds, its metal construction gleaming in the soft light. Ponies, small as ants from this far away, work alongside massive robots, building higher and higher. Sometimes, a pony would fall, splattering down to the ground below.\n\n Seeing the sight, Sunforge at first smirks, and then begins to chuckle, which quickly turns into a mad cackling. Sister Citrine looks towards her, 'Is something funny?' At the same time, Sister Ruby would lower her body stance, ready to potentially fight. Both mares watch as Sunforge doubles over from the cackling, beginning to cough, until she hacks up a splattering of bio-gel onto the ground. Recovering, she stands on shaky hooves, licking her lips clean of the gel that remains, then smirking all the wider, 'I have so many ideas, and so much to do, to make this madness work. I haven't been this excited since I first learned what x equals.' She smirks even more, and then pauses. She turns to Citrine, and posits a question."
neocastle_creator.9.a: "Say, how do you intend to power this thing?"

neocastle_creator.10.t: "The Wasteland Never Changes"
neocastle_creator.10.d: "'Herald Endbringer!' A stallion pokes his head up from a small field of crops, looking towards the porch of his small shack, 'Yes, ma?' His mother, an older mare, sits on the porch in her rocking chair. The dim sunlight was shining on her earlier, but now, the sun has been blotted out, by the shadow of the distant tower, arising in the capital. She calls out to him, 'That darn tower is blocking my sunlight! I didn't slave away fifty years in company security just to be given a rocking chair that's not in the sunlight! When are you gonna go talk to the bigwigs in charge and tell 'em to stop building it!' Herald sighs softly, and shakes his head, returning to his fields, picking a mutated tomato from the ground, 'Ma, they ain't gonna listen to a random farmer stallion.' She harrumphs from her chair, crossing her forelegs, 'Why, you just tell 'em that good ol' Lease Painbringer told 'em to stop building, they'll listen right up if they know what's good for 'em!'\n\n Another mutated tomato picked from the ground. Something had happened in the capital a while back, some new group took over, and shortly after, they started to build that big tower. He's seen a few of them before, ponies in steel robes, accompanied by robots larger than he is. Better to ignore them and let them pass, though, this little town has been kept pretty safe, but he's heard tales from elsewhere, entire towns emptied, to go fill factories or to build. He sighs again, 'Ma, just move your rocking chair!'\n\n His ears twitch to the sound of hooves and mechanical wheels. He looks up from his small farm, watching as one of those ponies approach, wearing steel robes over their body, flanked by a large robot, treaded wheels trundling over the dirt ground. The pony trots right past him, and up to Lease, unfurling a scroll and smiling, 'Lease Painbringer, I've been sent to look for you, and your family. Is Life Ender still alive?' She shakes her head, and grins, ''Fraid he became his name. Say, whippersnapper, you mind if I can talk to whatever bigwig's sending you out here? That there tower's blocked my spot for my chair.' Herald frowns, coming up behind the stranger pony, clearing his throat, 'I'm sorry, she doesn't mean it.' The stranger smiles, and looks back at him, 'Don't worry! In fact, I was coming to take you to those 'bigwigs' anyway! No need to pack any personal belongings, we'll provide everything you need, on the path to our salvation.' Lease blinks, and then frowns. For a moment, he thinks of speaking against her, but then his eyes flick to the robot, its guns pointed towards the direction of his ma. After a long moment, he looks down, and closes his eyes, 'Just lead the way.'"
neocastle_creator.10.a: "The world keeps turning"

neocastle_creator.11.t: "The Deeper Mysteries"
neocastle_creator.11.d: "JEB sits in a room, tapping his hoof intermittently against the table he sits at, while some knowledgeable Aetherist sits across from him. He whistles, and then nods, 'Alright, so, you know why we're here. I'm helping you all, but I don't know the first thing about what you all actually believe. Tell me your mumbo-jumbo so I can at last pretend I understand this stuff.' The scholar sat across from him smiles softly, and nods, 'As is your desire, I shall share the great wisdoms. What is it that makes a pony a pony, and a Griffon a Griffon, and doesn't make us wild beasts? Souls. It is from these souls that we create magic, that we are granted the will upon which we enact unto the world. Without these souls, we are no different than any wild beast.' JEB rolls his eyes, 'Yeah yeah, I already know that, get on with it.'\n\n The scholar takes his interruption in stride, smiling softly, 'What is the substance of the soul? That's a rhetorical question. Just like particles are made up of atoms, our souls are made of something similar, Aether. But one might ask, why is it that we have souls to begin with? I want you to imagine, for a second, that we are the seed of an apple.' He smiles softly, 'Seeds are filled with a bit of water, to allow them to become great, tasty apples. Around this seed is the fruit, which contains even more water in it, that fruit is attached to a branch, which has more water, this branch is part of a tree, and the closer you get to the bottom, the more wet it is. Until, you reach the roots, which drink from the nourishing river. Except, it isn't water that I speak of, but, instead, Aether, souls, the ability to make change upon the world. The universe is but one tree, feeding from this river, and we are but one seed of one fruit, containing only the barest hints of Aether within us. This is why the world has been so bad, because we lack the ability to create paradise with the Aether we have.'\n\n JEB snorts slightly, 'Seriously? We're an apple seed? This sounds like a cult founded by the Apples, might belong better in Appleloosa.' The scholar smiles softly, 'You get lost in illusions and metaphor and belief it is truth, my friend. But you need not worry. For soon, our spire, the great work, shall be complete. We shall tap into the Aether, as a seed falling into the river, and with that, create paradise on our lands. You may doubt. But you'll see, one day.'"
neocastle_creator.11.a: "Thus is the nature of this world"

neocastle_creator.12.t: "Empty Pews"
neocastle_creator.12.d: "'It is upon the riverside path that I trot, but a tiny drop in the universe, on the eternal destiny, towards salvation, towards paradise.' Sister Ruby's voice echos off of empty walls. The Aetherists have no need for missionary work, they have no need to spread the word of truth, after all, soon all will know the truth of Aether for themselves. The Chapel, however, exists as a place where true believers will congregate. Those brave enough to venture beneath the Great Spire, intelligent enough to stumble upon the hidden room, would need to have their hooves guided by soul and destiny, to trot the riverside path. Sister Ruby doesn't spend much time down here, there's often more important work to do, and there is important work to do today, as well. But, deep within her soul, she has a good feeling, that perhaps a fellow soul shall come to join her this day.\n\n Of course, that good feeling was backed up by evidence. She looks upon the one piece of art in the room, a mural on the wall, of a river, passing by a tree burdened with ripe fruit. She had seen the stallion's eyes when he was building the tower. He did not carry in them ignorance like most, nor did he carry in them the same bedraggled exhaustion of the other workers. He was tired when last she saw him, but not weighed down by that exhaustion. He had noticed a flaw in the design of the Great Spire, as, of course, all things built by mortal hooves are flawed. Most would ignore it. But he led a small team to fix it, even if not asked. His eyes had been shooting around as well, perhaps looking for a way out. But it's only natural, a pony as perceptive, as potentially useful as him, would be wasted in just construction. He knows that. She knows that. They both know that an escape would be found.\n\n Hooves clatter on the stone floor as the door to the room opens up. He pants softly as he slips into the room, his breath hitching upon seeing Sister Ruby, stood at a front podium, awaiting him. Yet she does not look upon the runaway with disdain. She looks upon him with a smile. She speaks unto him, 'We who trot the riverside path are always called to our rightful place. We try to avoid our destinies, but on the path to avoidance, we come across it all the same. Welcome. I have much to teach you.'"
neocastle_creator.12.a: "Welcome, brother."

neocastle_creator.13.t: "Cornucopia"
neocastle_creator.13.d: "The Infinity Spire is like a starving beast, endlessly devouring more resources and more workers by the day. Steel, plastic, concrete, all of these are essential to continue its growth into the very skies themselves. But such demands require greater sacrifices by the day, we could tear apart every grand city in our territory and still not have enough to continue. But this wasteland gives us ever more opportunities, every settlement cleansed and every city reclaimed can be torn from the roots to feed the Spire’s requirements. We must keep building ever skywards to reach the very roots of divinity. Foundations must be put in place to keep the newer levels ready for even further building, more and more individuals must be dedicated to ensuring the stability of the spire. Thousands of workers and robots flow freely into the great structure ensuring that our schedule is not interrupted. Blood, wires, death is all that is found as more and more sacrifices are made in the name of paradise. We will tear apart all of the wasteland for this goal if need be. Every city shall be forgotten, every settlement but a distant memory faded away in the dreams of the old. The young will be blessed with the gifts we shall create. The Infinity Spire must continue to grow, no matter the costs. When we are finally finished, when our great work has come to an end... It shall be the last marvelous creation of the world and signify the ascension. Paradise waits for nopony and all must play their part."
neocastle_creator.13.a: "The future paradise bought and fueled by the blood of the chosen."

neocastle_creator.14.t: "War For The Skies"
neocastle_creator.14.d: "'This is Sergeant Thunderstruck, leading my squad on an interception mission, over.' The gruff voice of a stallion speaks inside of his power armor, scorpion-like tail trailing along the ground behind him, insect-like eyes glaring ahead, laser weapons on his side glowing hot. He spreads his wings, shouting, 'Soldiers of the Enclave, let's pound these grounders!' A whoop comes from the squad behind him, fifteen sets of wings spreading, flying one after another into the fray above Neocastle. The squad of sixteen power-armored ponies depart the main bridge of the Raptor Cloudship Cumulonimbusia, flying ahead. Explosions fill the air around them, as the ground pounders below launch flak shells by the hundreds into the skies, bright spotlights on their infinite spire seeking out squads of pegasi, as spritebots fill the air by the thousands, little lasers firing, pinging uselessly off of blackened armor.\n\n The squad unleashes a barrage of lasers, targeting programs in their helmets aiming their shots, sending hundreds of robots back towards the ground. Thunderstruck speaks into his intercom, 'Lightning Squadron, keep formation, we're going to be puncturing through enemy lines! Let's cut the head off this drake!' The Pegasi dive down, laser rifles roaring shot after shot, bright red lancing through the night sky, felling spritebots by the dozen. By their either side, they'd be suddenly accompanied by Skytanks, a heavy gunner whopping into air as his gatling laser cuts through the numbers of spritebots, 'Wohoo! Lightning One, clearing the path for you!' Thunderstruck and his squad continue forward, spotlights shining upon them, as flak guns turn to fire at them.\n\n The robots would fall from the sky in their wake, until a loud flash of light fills the air, a flak shot hitting against their assisting Skytank, blowing it up, igniting a second moon in the sky with its brightness. Undeterred, the squad flies on, closer and closer to the top of the unfinished tower. Thereupon, Thunderstruck spots a mare, Sister Ruby, wearing robes of steel, looking at the approaching pegasi with a smile on her face. Thunderstruck looks right back at her, his rifles aligning over her, only stopping as a voice comes over his armor, 'Lightning One, return to Cumulonimbusia, we are withdrawing, I repeat, we are withdrawing.' Thunderstruck comes to a stop, as the flak quiets and the roar of lasers goes quiet around them.\n\n There, stood on the tip of the currently complete levels of the tower, Sister Ruby gives a small wave, as Lightning Squad withdraws."
neocastle_creator.14.a: "Damn those Pegasi"

neocastle_creator.15.t: "Thinktank"
neocastle_creator.15.d: "Deep in the depths of the spire, where once Sunforge was submerged in bio-gel, now stand many more, though far lesser, minds. The room has been enlarged, with a massive generator near the center of it, powering two hundred brains in total, all kept in bio-gel. Brother Amethyst looks over the brains, smiling, 'They have been rather compliant since we have created this system, only minor rebellion, which I have sought to correct.' Sister Ruby stands alongside him, her hoof resting on a brain jar, a small smile on her face, 'You must be careful to not be overly harsh, Brother Amethyst, and do not judge. For these ponies are ignorant of the paradise we will bring. Yet it is through this Think Tank that we will do much.'\n\n Sunforge snorts slightly as she overlooks the two hundred brains, 'Think Tank, you are all much too uncreative with names. Whenever you bring this paradise about, you know they're going to just pick a better name than such a thoughtless pun. Oh, you have brains in tanks, let's call it the think tank.' She rolls her eyes, 'My C-Consciousness idea would have sounded much better.' Sister Ruby looks over, and smiles softly, 'After we achieve paradise, we will have no care for names. It is called the Think Tank because that is what it is. And all these ponies shall be glad to have been part of it, once we grant them bodies back in paradise. How have their findings been so far?'\n\n Sunforge smirks softly, 'Not terrible, I could do better myself, of course, but I am only able to do so much, even if I do that much wonderfully. I've looked over their math and their suggestions, it checks out so far. They're starting to think collectively now, hence why Collective-Consciousness would have sounded better.' She then grins slightly, looking at the minds, 'But they've done fine. They'll help us out.'"
neocastle_creator.15.a: "A mind like no other"

neocastle_creator.16.t: "Anthill"
neocastle_creator.16.d: "Hard Rock’s life ever since the Aetherists had taken his town has been nothing less than pure misery and decay. Dragged away by their foul robots and torn away from his very family, his life has been trapped under the shadows of that damn spire they worship. He never saw the natural light of the sun again; all he could feel was the sweat dripping down his brow as he was forced to carry materials up the lifts, and his only company were the cold, unthinking machines or the silent guards. \n\n The day starts the same, forced awake, given nothing but a bowl of gruel, and told to start working right away. The endless monotony of bringing materials forth, working on forging new beams that would ascend the tower to ensure its stability, and the deafening cries of those who could no longer continue, left to rot on the wayside, forgotten like a spent torch. At least Hard Rock could consider himself a lucky one; those with too much intelligence were snatched in the middle of the night, dragged away, never to be seen again. Those who were too defiant were merely shot on the spot. And those who actively tried to sabotage the Spire? Their fate was too terrible to even think about; all he could remember was the sound of saws and screaming. Before they’d return at least empty and broken, their eyes as hollow as the halls that ran through every inch of the spire. He missed his daughter, her bright eyes full of hope in a world that was so cruel. He missed his wife, whose smile would make the hard life in the wasteland worth going through. The robot patrol saw him idling and quickly shoved the stallion forward once more. It was back to the forges with him, to be nothing more than another forgotten statistic. Hard Rock hated every moment of this life, torn away in the name of some stupid belief in paradise. His paradise was when he was with his family, and this horror he was a part of did nothing to ease the building dread. Hard Rock didn’t even notice when he passed by a lone mare who was being dragged away due to her keen intellect. He didn’t even notice that it was his daughter, who’d become a part of something far worse than he could ever imagine. It was just another day in the Infinite Spire, where hope came to die and everything was sacrificed in the name of paradise. Cold machines and broken ponies were all you could find here."
neocastle_creator.16.a: "Life is miserable, death seems like a mercy at this point..."

neocastle_creator.17.t: "Gleaming Metal"
neocastle_creator.17.d: "White, the color of purity, for good reason. Upon white, one can spot black spots, mud, dirt, that which carries disease and muck. Hospitals are kept white, so blood leaking might be seen. Lab coats are kept white, so stains can be seen upon them. White shows water the best, which could carry cholera, or dysentery, or other issues, especially in the wasteland. White is the color of Celestia, she whose fire would cleanse all she desired, before her death, of course. Brother Quartz has always loved white. His coat is white, his mane a slightly darker shade of white, his eyes, hidden behind white colored goggles, preventing any eye-transmitted diseases like spoken of in Nimbusian legend, the disease of petrification, horrible, and his mouth is also hidden behind white masks.\n\n He gazes upon the white finish of the robot in front of him, a smile on his face, hidden behind the mask. Cool metal, it does not carry the disease of the flesh, the blood, nor the other unmentionable fluids inside of ponies. It is clean. Pure. The robot carries on it the tools of purification as well. Heavy lasers resting by its side. Heat cauterizes wounds. Prevents infections. Burns away the impure, those who stand in the way of paradise. Brother Quartz looks upon the new standard robots of the nation, all painted pure white, sanitary, perfect, pure. He smiles softly.\n\n One day, when they reach perfection, when they create paradise, pony and robot won't be that different anymore. No sickness of the flesh, no weakness, no impurity. He'll make sure of that, one day. They're so close to perfection now. But then, he notices something. On the robot. A speck of dirt. Behind his goggles he stares, his smile contorting into a small frown. He sighs, taking out a cloth, and cleaning the dirt off, his eyes growing misty as he does. Perfection is near. But even this steel is not perfect. Nothing is perfect in this world. But it will be."
neocastle_creator.17.a: "Things will be so much better."

neocastle_creator.18.t: "Necessary Sacrifices"
neocastle_creator.18.d: "Smoke, the scent of an imperfect world, a scent all too common to the Wasteland. Sister Citrine stops in the midst of a street. This was once a small farming settlement where she stands, a place where ponies would be born, suffer, and die, due to the imperfect world they were in. She takes a deep breath of the smoke, searing it into her memory, as she glances over at a burning building. A Sentinel emerges from the burning building, it's pure white form marred by ash, its wheels rolling over the ashes of a recently destroyed pony. She frowns for a second, and looks away. The Sentinels know not what they do, for they are machines, they simply follow the wills of their creators. They do evil here, where children, mothers and fathers are killed.\n\n But it isn't her fault they're dying. They refused to come along, to build the grand project, to build the spire, to toil their imperfect lives to create perfection. Yet she can't blame them either, for they know not what they do. They are just trying to protect their homes, protect their families, they are good, honest ponies, the type who deserve perfection, even if they inadvertently stand in the way of it. She sighs, breathing out the smoke she breathed in before, which wafts through the air, filled with ashes, and the screams and cries of those still being killed. These ponies had to serve as an example, to make sure others wouldn't resist, to make sure nothing could stop the search for perfection.\n\n She looks back up, as a Sentinel wheels out of a building, before she slowly smiles. Sentinels might not be ponies, but they do have memories in them, they'll have data, faces and names, for every pony killed today. Maybe it won't make up for their death, but, after a second, Citrine decides that once all is done, she's going to look through their memories. She'll memorize each and every pony killed on the riverside trot to their paradise, and she'll ensure that they are reborn, so she can tell them how sorry she is. With her faith restored, she lifts her hoof, and gives a small wave to her friendly Sentinel, as it continues through the ashes of the dead."
neocastle_creator.18.a: "We will save your souls"

neocastle_creator.19.t: "There Can Only Be Seven"
neocastle_creator.19.d: "Deep within the central control room of the Spire, a plot is brewing. Brother Diamond has been a part of their organisation for a while now, yet Sister Citrine finds both his devotion and loyalty to the cause to be lacking. He is too focused on the acquisition of wealth, the pursuit of profit, and seeking only to enrich himself instead of aiming for the goal of paradise. Every lesson taught simply waved away with one hoof, every doctrine given was ignored or merely glanced over before being put aside, and even now, he has proven to be a less-than-adequate replacement for Brother Prase. The very thought of such an uncouth stallion within the ranks of the seven is akin to blasphemy. Originally, there were no suitable replacements to be found, none who could hold a candle to the other six. But now Magos Sunforge has long since proven that she may be the replacement the Aetherists need. Her intellect is sharp, her mind open, and her commitment is seen as far more beneficial than Brother Diamond’s. \n\n Hence why Citrine had invited her into the depths of the spire to discuss her plan. “Sunforge, I believe it is time to let you know why I called you here. You see, it is time for a change in leadership. Brother Diamond, foolish as he is, has long since lost his lustre. We need a true genius to replace him, and thus I turn to you. Here is the center for the robots within the spire. All we need to do is cause an accident for him, and thus you shall be named his successor.” Citrine smiled softly. She didn’t enjoy the idea of killing one of her fellows, but in the name of paradise, such sacrifices would have to be done. \n\n Sunforge would glance over the machines with a subtle nod of acknowledgement. “It will be as simple as when I first calculated what x would equal. Here’s a rather simple flaw to put within his robots, a few screws shall be loosened on his balcony upon the Spire and with the right amount of force placed on it. Gravity will do the work for us.” Sunforge merely glanced up at the spirals above with a soft laugh. “It will be such a simple act.” \n\n Brother Diamond was standing within the balcony of his section of the Spire, watching as the ponies below worked. This was life, better than having been killed by these insane cultists. All he had to do was turn against the fellow guilds and instantly be rewarded. He called for one of his robots to bring him another drink before beginning to lean against the balcony. It took him five seconds too long to realize it had been tampered with. Within the depths of the spire, Citrine and Sunforged watched as Brother Diamond was met with the unfortunate end of so many other ponies. A smile drew across Citrine’s face as that fool was finally dealt with. She turned towards her new sister in the order with glee, being the first to call her by her new official name."
neocastle_creator.19.a: "Welcome, Sister Sunstone"

neocastle_creator.20.t: "Incursion"
neocastle_creator.20.d: "Admiral Dust Devil stands in the control center for the Thunderhead class Cloudship Mirage, medals clinking together on his Enclave uniform as he lowers a pipe, breathing out slowly as his rust colored eyes survey the cloud-town of Altos ahead of him, where Aetherist forces float, be they robot or aircraft. He grumbles to a young stallion standing behind him, 'Private Rind, is it? Mind telling me why this town is filled with cultists, and not citizens of the GPE?'\n\n The stallion behind him snaps a salute, his voice wavering slightly, 'Sir, Private Cheese Rind, sir. Sir, they came out of nowhere, sir. We've been keeping a close eye on construction of that tower of theirs, and it has been nearing closer to the clouds every day, but we did not think they would dare attack us, sir. They used a foul magic, sir, on our recon stallions watching them this morning. I saw the aftermath, sir, it was. Well. Horrible, sir. We didn't notice our recon's absence until it was too late, they came upon us with robots and aircraft both. We simply weren't equipped to fight them.' He looks down, gulping, his voice hitching as he speaks, 'My squad kept me safe, sir, wanted me to get home to my brothers. They had flak shooting into the air, it killed our CO, sir, I was the only one able to escape, sir. I believe they let me escape on purpose, sir, to tell you. They knew we would send a response.' He then looks back up, and nods, 'I'll fight with you, sir, for my brothers and sisters in arms. For their memories.'\n\n Admiral Devil frowns slightly, looking out the window, then shaking his head, 'We won't be fighting. These cultists have too organized of a force, too many of them, too. It'd cost thousands of good pegasi and good cloud ships to make your squad proud.' He looks to a nearby stallion, 'Ensign, take a message to the attached Captains, evacuation orders. I want every cloud-settlement in a fifteen mile radius empty by tomorrow. If we're going to be fighting a war, let the politicians declare it, not me.' Private Rind blinks, and frowns, 'Sir, with all do respect, are we really going to let these maniacs have Altos? What about the civilians? My squad?' Admiral Devil shakes his head again, 'Dead or gone already, Private. You feel angry about that answer? Good.' He sighs softly, lifting up his pipe again, looking upon the Aetherist tower, 'Kid, if I were you, I'd leave the army. Write a book about this. Saving Private Rind, something like that. Be rich, be healthy, be happy. Lot better than sticking in with the military.'"
neocastle_creator.20.a: "What is this madness?"

neocastle_creator.21.t: "Mareway's Last Stand"
neocastle_creator.21.d: "The sound of steel being ripped apart fills the throne room of New Mareway, as Duke Gatormaw's obsidian club tears an Aetherist machine apart. Another machine approaches him, its guns whirling to life, stopping as a thin rapier is forced through its central processor, pulled back by a tug of magic, to Queen Stargazer, covered in blood, oil, and sweat. She pants softly, her magical aura flickering for a moment, as her eyes turn to the entrance to the throne room, §t'Do you think Duke Bright Glow will be bringing those reinforcements soon?'§! Gatormaw snorts, spitting out a glob of blood onto the floor, §c'He's taken his wealth and ran, I expected no less. We are going to die here, my Queen.'§! Stargazer frowns softly, closing her eyes. She breathes in softly, shakily, and then opens her eyes again, §t'Not without a fight.'§! He looks to her, and grins, half his teeth broken or out of place, §c'Not without a legendary fight.'§!\n\n Hooves trot upon the ground, as one of the Aetherists enter into the room. A lithe mare, wearing steel robes over her form, a serene smile on her face, §r'Six Sentries, twelve Spritebots, countless others, I did wrong to underestimate you.'§! Duke Gatormaw growls and charges forward, and Queen Stargazer charges alongside him. Club and rapier swing and thrust at the Aetherist, who smiles, teleporting to the side of the attack, §r'You are strong, but we are beyond the strength of this world.'§! She would try to say more, but stop as Stargazer thrusts towards her. She steps to the side, only to shout in pain, as Gatormaw's club impacts her side, sending her flying to the side. Stargazer pants, as the two approach the downed mare, §t'I have done so, so much to try and make this world better. Is this my reward? To be felled at the hooves of narcissists? Is the end of my lineage to be a cult? I will protect my ponies from all, no matter the cost.'§!\n\n Gatormaw lifts his club up, prepared to swing it down onto the mare, but his swing is stopped as a magical shockwave rocks the room. The shockwave sends the stallion flying backwards, crunching against the hard walls of the palace, sending Stargazer similarly flying, smacking against her throne. The Aetherist stands, her horn smoking from the use of magic. She trots past the crumpled heap of Gatormaw, up to Stargazer, only to stop, as her hoof hits a book. She looks down, beholding a small book on the ground, fallen from Stargazer's robes, The Journal of Friendship. She looks up again to Stargazer, the Queen's vision beginning to dim, stepping closer and smiling, §r'I see you, Stargazer, and I know you are worth the new world we will create. You might not will for it, you may fight against it, but you will see the new world come.'§!"
neocastle_creator.21.a: "Let the good labor."

neocastle_creator.22.t: "The Heart of Democracy"
neocastle_creator.22.d: "Taking the Capitol had been all too easy for the Aetherists, much of the resistance of the Republic had already been crushed elsewhere, and the local militia mostly surrendered when fought. Yet still, the Aetherist field commander trotting with two Sentinels into the Capitol proper feels a bit nervous. His steel robes might protect him, as his robotic guards do, yet he does not look forward to the hidden defenses President Wide Savage would have. He trots through well-kept art-deco halls, portraits on the walls of serious looking stallions and mares, wearing suits and dresses, of all ages, the previous Presidents. At the end of the long hallway lay a door, a door to the center of the Republic as a whole.\n\n The Aetherist enters inside, but instead of hearing the sound of gunfire, he hears the soft sound of a quill writing. Inside his office is President Wide Savage, suit well pressed and mane kept formally brushed, a scroll in front of him that he writes on. He glances up for a second as the Aetherist enters, and his two robots, speaking after a second, §P'Did they not teach you manners, colt? Knock next time. Did you grow up in a barn? Close the door behind you.'§! The Aetherist blinks his eyes, slowly closing the doors behind him. He clears his throat, §r'Wide Savage of The Republic, surrender your nation and your title as leader. You shall hereby be used to build the Spire, to bring about paradise.'§! Wide Savage yawns softly, looking down and continuing to write, §P'My capitulation statement is on the table next to you, I drafted it three hours ago.'§! The Aetherist looks over to the table, and a scroll upon it, §r'I see. You are. Oddly calm?'§!\n\n Wide Savage looks up, §P'I knew what was coming. Refugees who survived the bogs and forests came by. The President must always be prepared. I also wrote a victory speech, I kept it in my drawer. I do still hope to use it.'§! The Aetherist nods, §r'None can stand in the way of the riverside path, Savage. Come with me.'§! Savage smiles softly, §P'In but a moment, I need to put down my final remarks.'§! He leaves his signature on the scroll, rolling it up and standing. The Aetherist looks at the scroll oddly, §r'What is it that you find so important to write?'§! President Wide Savage smiles softly, taking the scroll, and putting it into his desk, §P'A speech for my next electoral victory. I hope to use it, once your insane nation collapses, and everything returns to normal.'§! The Aetherist frowns."
neocastle_creator.22.a: "No collapse to come."

neocastle_creator.23.t: "What Is Given"
neocastle_creator.23.d: "Her heart pounds. It's one of the only sounds she can hear anymore, the beat of her own heart, and the trundling of wheels behind her. The plan had been perfect to slip away through the mines, after all, she was just one mare, Chocolate Gear was not that important in the grand scheme of things. She'd just slip away during a shift change, none would notice. Yet, one did notice, sending an entire Sentinel after her. The massive machine's wheels trundle after her, faster than hooves ever could be. Its weapons are trained on her, though it dares not fire, lest the mines be damaged.\n\n She slips through narrow hallways and through small crags in the walls, using all of her flexibility to squeeze through everything that could be between her and the machine. But it's quick, and it's smart, and it keeps up. She pants, almost feeling like passing out, squeezing through another crevice into a hallway. Her eyes look all over, finally spotting a small crag in the rock wall. The wheels trundle closer, as she dives into the small space, fitting as much of herself within as possible. The machine comes closer, its red light illuminating the mines, scanning for her. She shudders within her small hiding hole. She remembers the red lights through her window, not too long ago. Then a brighter red flash as her husband investigated.\n\n After an eternity, the Sentinel continues to trundle on, it's wheels disappearing into the distance. She breathes out softly, taking a minute to rest in her hiding spot. She just needs to blend in, and try to get out of the capital. Once she's out of the capital, she can flee. Maybe to Red Eye, if he's still around, he would want the information she has. Or the Steel Rangers, they love knowledge, maybe them. She takes in a deep breath, and slowly crawls free from the crag, continuing her escape."
neocastle_creator.23.a: "The one that got away"

neocastle_creator.24.t: "Steel Legions"
neocastle_creator.24.d: "Gunfire roars through the tight metal corridors of the Hill 432 Bunker. Featherbrush takes cover behind the sparking remains of a Sentinel, his anti-machine rifle smoking from overuse. Griffons, battered, bruised, and proud beyond belief surround him, taking cover behind metal walls or robotic corpses, rifles roaring as they fire shot after shot at the encroaching robots. Featherbrush peeks over his cover, lasers grazing past him, as he fires a high-velocity bullet right through another Sentinel's head. The endless legion of robots seems to be dwindling, as fewer and fewer fill the room. The old Griffon grins slightly, his parched throat calling to those who would listen, §R'Talons! Push them back!'§!\n\n He's the first to leave his cover. He fires wildly into the robots, bullets and lasers whisking past him, the buzz of laser beams and near missed bullets, an unstoppable wave of bullets crashing into the stalwart legions of steel. His rifle roars loudly as he fells the final robot in the hallway, its barrel glowing red, overused and overheated, the barrel melting together into a useless mass. He tosses the rifle aside, reaching down and ripping an arm off of a nearby Sentinel, grinning as he grabs inside the arm, at the weapon's firing mechanism, §R'Come on, Talons! Do you want to live forever?!'§! He's met by the proud squawks of griffons, armor scorched and dented, three dozen arising to meet his call. As one, they push down the hall, to where dim sunlight rests at the end of the slaughter.\n\n The squad of Talons emerge into the light, weapons held at the ready, and though their eyes might be bleary and their breaks filled with blood, never have they had a prouder moment. Their eyes blink, adjusting to the sunlight, only for all that pride to disappear in an instant. For their eagle eyes behold the power of the Aetherists. Legions of machines painted bright white, stretching as far as the eye can see, all of their weapons pointed at the griffons.\n\n Featherbrush looks upon the endless legion of his enemy, muttering under his breath, §R'Arcturus, pay close attention today. I'll make you proud.'§!"
neocastle_creator.24.a: "Brave, but futile"

neocastle_creator.25.t: "Division Brings Unity"
neocastle_creator.25.d: "When Cloudsdale fell, so did the many wagons of the sky, their pullers, their passengers, their cargo. The Ruins were dangerous for centuries, the multitude of carts present holding hidden treasures, or hidden dangers. Today, they serve as nothing more than cover for frightened ponies. A raider pants as he dives behind an overturned cart, his rusted rifle clattering to the ground in the panic. He curses under his breath, grabbing a magazine and slamming it into his rifle, panting as he does. He peeks out and fires a single shot at the encroaching Sentinels, his bullet pinging off their armor. All around, other ponies would do the same. A tribal pony would throw a spear from behind cover, a unicorn fires a knife of ice, a panicking farmer fumbles to reload his single-shot shotgun, his hooves fumbling with the shells. The raider disappears behind cover again as the Sentinels fire a barrage of lasers at him. They don't want to damage the carts, their scrap metal can be used to build the Spire ever higher.\n\n As despair sets in, the raider looks towards the sky, where he beholds a beautiful sight. A squadron of Enclaveists fly through the sky, pulling carts behind them. Unicorn mages sit on top of the carts, projecting shields that absorb the myriad of lasers fired towards them from down below. The carts come over the legion of Sentinels, the shields suddenly disappearing, as the backs of the carts open. From within come ghouls, hundreds of feral ghouls, plummeting down to the ground below. Their fetid, rotting flesh breaks upon the white steel of the Sentinels, blackened blood marring their pure forms, getting into their internal systems. Their aged bones break under the force, yet still they snip and bite at the machines they land on, their feral minds seeking naught but violence. Individually, they aren't dangerous at all, but all together, they weigh down the Sentinels, tearing the legion down, bit by bit.\n\n No cheer comes from the exhausted ponies as the Enclaveists land their carts amidst them. The raider trots up to the carts, exhausted, sighing out to them, §c'Good work. Hook Hoof wouldn't have even come up with that.'§! The Enclaveists and unicorns look at him, his former enemies giving him small, tired smiles. The tribal, the farmer, and the unicorn come together. The farmer looks down, §o'I voted for Shake Spar.'§! The unicorn shakes his head, §G'Nobody cares anymore. We're in this together now.'§! They all look into the distance, as another legion approaches. The raider sighs, §c'Got any more ghouls?'§! The Enclaveist shakes her head, §B'We're out. We're all going to die.'§! The unicorns climb off of the top of the carts, as the raider reloads his rifle again, §G'Well. Let's give them one heck of a goodbye.'§!"
neocastle_creator.25.a: "Yet they collapse anyway"

neocastle_creator.26.t: "Among Intellectuals"
neocastle_creator.26.d: "§o'So, you say that souls are made up of this Aether?'§! Deep within Stable 49, the greatest minds of the Ministry of Arcane Sciences gather, after their security force was thoroughly destroyed. The Aetherist scholar smiles and nods, §r'And this Aether comes from beyond, from the river, which feeds the tree that we call reality. This Aether gives soul, which gives us magic.'§! The gathered unicorns all smile at the mention of magic, as the scholar continues, §r'We seek to bring about a paradise to this world, by increasing the amount of Aether within the world. Through doing so, we will be able to bring back the dead, those who are deserving, at least, we will eliminate all hunger, we will eliminate all needs and wants, and bring true paradise.'§!\n\n One of the gathered scientists laughs softly, smiling, §o'Why did you not just tell us about this beforehand? We would have handed the Overstallion over in a heart's beat, I, for one, much prefer this Aether goal to whatever he wanted to do.'§! An intelligence agent nods, §o'Not to mention that we already have many willing workers, who will be able to help your aspirations. We have many researchers, they will wish to use all their expertise in order to help you. After your impressive showing of force against us especially, none will try to stand against you.'§! A nearby scientist smiles, §o'Oh, if I may, I would like to study your robots, I believe I can fix a few flaws in their design and make them nearly unstoppable!'§!\n\n The Aetherist scholar smiles serenely and nods, §r'We welcome all who seek to trot the riverside path. We will work alongside all of you gladly, as long as you are genuine in your desires to help. I believe it is destiny that you all survived to help us. Though I must ask, many ponies resist us to the very last moment, why do you not?'§! Another scientist snorts slightly, §o'And waste our brilliant minds? Please, leave the unintelligent brutes to waste their minds in battle and vain sacrifices, we will be happier with cooperation than subjugation.'§!"
neocastle_creator.26.a: "The obvious choice"

neocastle_creator.27.t: "Endless Lines"
neocastle_creator.27.d: "All roads lead to Neocastle, that's been the saying Sister Citrine has heard from the workers of the spire. They aren't wrong. For she stands midway up the tower, looking out a window, down upon thousands upon thousands of ponies being marched into the city. Over the bridge connecting to what was once New Canterlot come trucks, confiscated from the Republic, carrying ponies by the dozens, and their white Sentinel guards. To the east, former serfs and nobles alike march to the factories, not a single one willing to step away. To her side, Brother Quartz speaks, his clinical white mask muffling his words a bit, speaking about how he was able to recreate a wartime robotic design to help them. She doesn't pay him much attention.\n\n After a minute, Quartz realizes she isn't listening, smiling softly behind his mask, 'Sister Citrine, you are distant. I can assume why. Tell me. Have you ever seen Fillydelphia?' She glances over, and then shakes her head, making him nod, 'It's horrible. The ponies are. Dirty. Scarred. Worked to death. Slaves. Under cruel slavers. Whips. And chains, too. You are. Mmm. Saddened. By what we're doing. But let me assure you. Here, ponies work, yes. But healthy. Together. Happy, to an extent. Still free to talk. And laugh. And enjoy the small moments. That make our world better. No slavers. No cruelty. Just steel. And efficiency. Ponies die. Ponies always die. However. They're repurposed. Used to fuel construction. They'll be back. Once we've built paradise. You are saddened. Because you are a good pony. But. We're all good ponies. The highest council. To the lowest servant. We'll all find Paradise. The riverside path. Out there, they die. No purpose to it. No reason. Senseless violence. Hunger. Poxes. Plagues. Here? They serve purpose. They serve paradise. Better to die well. Than to live forever.'\n\n Citrine nods softly, and smiles softly as well, 'I know it's better here than elsewhere, Brother Quartz. I just wish there was a better way. Even if all this suffering builds towards paradise, I sometimes feel like I am a villain. I sometimes question my faith, and if we are correct. I know we are in the end, yet still, I am a pony, I can't help but to want good.' Brother Quartz looks over, and then looks out onto the lines of ponies, marching in, 'In this world? No good exists. Just bad. And less bad. But soon, Sister. Soon. We will have good. We will have joy. And plenty. No disease. No pox. No suffering. Not anymore. They don't know. But we do. That's why we do this.' He smiles softly, and nods, 'I'll go. Study my robots.' He gives Citrine a small nod, and then trots off, leaving her alone."
neocastle_creator.27.a: "I hope they can forgive us in the new World"

neocastle_creator.28.t: "Red Flames"
neocastle_creator.28.d: "§c'Go! Take my notes with you! I hid a truck away, take it to Fillydelphia, quickly!'§! The researcher nods, closing the hatch to a hidden escape, leaving only him behind. Red, one of Red Eye's most loyal followers, one of the dozens who worked on New Unity, now stands alone amidst the vats, the terminals, the catwalks where a new goddess was to be born. Soldiers fight elsewhere in Cathedral, their bullets useless against the thick armor of the Aetherist Sentinels. They knew they wouldn't leave here alive, but they were willing to take the sacrifice. The final shots echo down the halls, and Red sighs. He closes his eyes, looking down, horn flickering on and off, a shade of scarlet.\n\n The door to the room is forced open, as a squadron of ten Sentinels force their way inside, accompanied by a single Aetherist commander, in steel robes. The Aetherist's eyes look around the room, the terminals, a few hanging cages, vats of a mysterious viscous liquid, lighting up the room. The Aetherist then looks at Red, a small stallion, wearing a stained and dirty lab coat. The Aetherist speaks, §r'Surrender, scientist. Cooperate, and your intelligent mind will be put to use.'§! Red chuckles softly, looking up and opening his eyes, looking into the Aetherist's, §c'Do I look like a threat to you?'§! The Aetherist steps closer, nodding to the vats, §r'What is this room? What were these vats for?'§! Red smirks ever so slightly, §c'IMP, Impelled Metamorphosis Potion, to create a god for Equestria. A New Unity. The result of years of work, stealing and studying Unity's secrets.'§!\n\n The Aetherist nods slightly, §r'Interesting. We have no need for this to make gods and goddesses, but perhaps this research can be put to better use.'§! Red snorts, and stands straight, §c'The research will be done again, better, quicker. Red Eye shall become the Celestia of a new world, of a new Equestria.'§! The Aetherist smiles, §r'There will be no need for a new Equestria in the world we make. Besides, I don't plan to destroy the research.'§! Red smirks more, §c'No, you don't.'§!\n\n His horn lights up, §c'But I do.'§! The detonator in his lab coat is pressed down with the slightest magical push."
neocastle_creator.28.a: "Kaboom."

neocastle_creator.29.t: "Steel And Claw"
neocastle_creator.29.d: "§R'Incoming!'§! The Griffon cries from below, his armor, adorned with the sigil of Red Eye, covered with scorch marks and blood. He flees down the street, lasers chasing after him, fired by the pure white Sentinel machines. His fellow Talons hide behind cover, firing heavy rifles at the oncoming wall of steel, unable to do much. Until a missile comes from their lines, and the roar of a mini-gun. Lasers ping off the armor of three Steel Rangers, stood side by side with the Talons, weapons firing into the approaching legion of robots. To think, just a week ago, these Talons and these Rangers would be shooting each other, now they stand side by side, brothers and sisters in arms, against the Aetherists.\n\n New Moon watches from above, the thestral mare's dark colors blending into the grey smoke in the air, and the bruising she rests upon. She munches softly on some apple flakes she stole during her escape. When the Aetherist Sentinels came, she took the opportunity to slip from under her slave master's muzzle, surviving on scavenged food and rain water for the past few weeks. Elsewhere, Sentinels would be taking her fellow slaves away, down to Neocastle, where they'll serve new masters, building the tower, visible even from here. She's learned it's better to be close to the battles, elsewhere Sentinels will actively search for escaped slaves, but here, they're too busy. Eventually, they'll all leave, and she'll have the whole city to herself.\n\n One of the Talons cry out down below as they're struck in the eye by a laser, knocked dead. Despite the Steel Rangers, the Sentinels keep advancing, nearly unstoppable. New Moon glances over to a stolen anti-machine rifle lying next to her. She could help. With covering fire from above, they could all live. She looks back to the Talons. Remembering the whips they protected. The food they hoarded. The slaves they captured. She then looks to the Steel Rangers, remembering all the good they did for the slaves, nothing. After a moment of contemplation, she opens her mouth, chewing on another hoof-full of apple flakes, settling in to watch the show."
neocastle_creator.29.a: "Both shall fall"

neocastle_creator.30.t: "True Unity"
neocastle_creator.30.d: "When they arrived to Maripony, they had expected many things, but not the quiet. Two Aetherists trot side by side, flanked by thirty heavy Sentinel robots, weapons at the ready, for any deadly Alicorns to show their heads. They trot slowly through Maripony, past labs long since abandoned, some turned into resting chambers or bedrooms for Alicorn bodies to be stored in. They trot past a few cages, where once ponies would await to be turned into Alicorns themselves, with some food left behind in strewn over bowls, left behind in a rush. They trot, until they finally reach the main room, where The Goddess awaits.\n\n The door opens automatically as the two trot close to it, and through it, into a large room of catwalks and bubbling vats. Above one vat floats a mare's face, smirking towards the Aetherists who enter, her voice echoing into their minds, §o'The Goddess has sent her children away, Aetherists. They merely await for the destruction you bring. Their minds and bodies are ready to spread to every corner of the Wasteland. They shall create new societies, they shall discover how to repopulate the world, they shall rebuild Equestria. A new Equestria, a refined Equestria, where we all shall thrive and live happy, an Equestria built in the image of The Goddess. Destroy The Goddess if you should dare, but her children shall bring your destruction in turn, one day.'§!\n\n The Aetherists look upon The Goddess' visage above the bubbling vat, one of them speaking, §r'We don't wish to destroy you, nor your children. We only wish to build a better world, too.'§! The other smiles, §t'We want to bring Paradise, a world where we all can live better lives, Alicorn or not. Our tower will allow us great magic, enough to reshape the world. Enough to give you a body again. All of you.'§! The Goddess' face looks down upon them, frowning softly. The first Aetherist nods along, §r'Your children, the Alicorns, Goddess, are strong. They can help build our tower better than any other ponies could. They can help bring paradise! And in return, when we create the better world, we will give you everything you can desire.'§! The Goddess takes a minute, staring at all of them. Her visage flashes purple for but a moment, before the face of the blue mare returns. She speaks once more, §o'The Goddess. . . Is interested in your offer.'§!"
neocastle_creator.30.a: "Together along the River"

neocastle_creator.31.t: "Canterlot Cooperation"
neocastle_creator.31.d: "Canterlot is a city of many horrors, Pink Cloud, ghouls that are near immortal, insane robots, and Alicorns. The others had all been captured easily, the ghoul in the Stable, the zebra by the base of the mountain, even her fellow Alicorns. But Nightseer survived free, if only barely. She went to fight the oncoming Sentinels herself, with a wing of fellow Alicorns to help. They slaughtered her sisters, but not her, her, they only knocked out. When she woke up, she wore the skeleton of Luna no longer, left naked, without the embrace of another Alicorn, and near death. She is not a mare easily shaken. But that experience would shake anyone.\n\n She hides in a small shop, once a fast food restaurant, as Sentinels take the riches of Canterlot back home, all the gold, the gems, the old bodies of the rich and famous. She holds a rifle close to her body, shaking as she does. An Alicorn is above using such primitive weapons such as guns, but right now, she's going to take whatever help she can get. The door to her small shop opens, her teeth chattering with nerves, as she attempts to hide in the shadows. But then, a voice calls out, the voice of Sunforge, now Sister Sunstone, §O'Nightseer, I know you're in here. I mean you no harm.'§! Nightseer shivers, but then rises from behind the counter, her Alicorn form towering over the small pony, lifting her rifle in shaking a magical grasp, §t'L-leave us! Or we shall destroy you, and your entire country!'§!\n\n Sister Sunstone looks at the shaking Alicorn, at the quivering of her rifle, and smirks softly, §O'There's nothing to be afraid of. I'm here to make a deal.'§! Nightseer looks down at the pony, slowly setting down her rifle, §t'A-a deal?'§! Sister Sunstone smirks and nods, §O'A deal. As a member of the Council of the Aetherists, you see, I'm expected to provide some magic for our grand ritual, nothing you need to concern yourself with though. See, the only issue is, I don't have enough magic to provide.'§! She holds up a leg, §O'I had metallic legs, which didn't contain magic, when I was forced to regrow actual legs, magic never flowed into them. Which means my body has a much smaller capacity for magic, you see. I need a pony who's willing to help me, as a personal assistant, who can provide their own magic to the ritual, instead of mine, since I can't provide enough. I've heard of the wonders of your magic, Nightseer, and the run-in you had with the Sentinels. You survived only because they didn't want to damage Luna. Stay here, and you won't survive much longer. Come with me, though, and I'll make you my personal assistant.'§! She offers her hoof forward to the Alicorn. Nightseer looks down at the hoof, shifting uncomfortably, closing her eyes and baring sharp teeth, before slowly reaching out, taking Sister Sunstone's hoof, and shaking it."
neocastle_creator.31.a: "Friendship"

neocastle_creator.32.t: "Bite And Hold"
neocastle_creator.32.d: "Steel hooves press hard against the concrete, as a mare in power armor slowly makes her way into a building. Her helmet is cracked and broken in half, showing one part of her face, covered in scars from burns. She enters into the secret meeting room, where the others sit. Aneurysm and Hot Rod sit side by side, not bickering between themselves, for once. Black Seas sits by an empty seat, motioning the Steel Ranger to sit beside her. In the middle of them all, lit by a small fire, stands The Bonecrusher, her mouth contorted into a small frown, §R'Who are you, steelie?'§! The Steel Ranger sits besides Black Seas, speaking in a tired voice, §o'Knight Mango Slice.'§! The Bonecrusher frowns more, §R'They sent a Knight?'§! Mango Slice looks down, closing her eyes, §o'I'm all that's left. The rest are on the frontlines, or-'§! Her voice hitches for a second, §o'Dead.'§!\n\n Black Seas rests her hoof on Slice's side, smiling softly, §b'You're as good as we need, Knight.'§! Hot Rod scowls, standing from his seat, §O'Why are we here, Bonecrusher? We lost!'§! Aneurysm stands alongside Hot Rod, and nods, §c'Better we drive away, cut our losses.'§! The Bonecrusher shakes her head, §R'We haven't lost! Fucking quitters, it's not over until we're all six feet under. We're all that's left of Manehattan. Two fucking useless raiders, one amazing raider, a Knight, and a Mayor. Sad sacks of shit we are, we're what's left, and we're still fighting.'§! Hot Rod scowls, §O'Oh, I know where this is going! You want to take my gang away from me! I don't give three shits if my gang might be mostly dead, I'm not going to let some fucking trotter use my vehicles!'§! Aneurysm nods, §c'Much as it pains me to agree, I concur. I will not serve under a tyrant such as you, Bonecrusher. Even if the roads aren't free.'§!\n\n The Bonecrusher snorts, §R'You fucking useless pricks, don't you see? Those cunts out there want us dead! All of us! They want to use our bones to build their shitty fucking tower! Are we going to let cultists take over our city before you let me take charge?'§! Black Seas stands from her seat, §b'Yes, we will! What will happen if we win, Bonecrusher? You'll just build your own personal empire from the ashes! You'll destroy all the legacy of Friendship City, because you're nothing more than a violent psychopath!'§! The Bonecrusher snorts, §R'Please, as if you're any better! You sat back on your island and watched because you didn't have the fucking 'votes' to fight back! News check, cunt! Votes don't fucking matter anymore!'§!\n\n As the others argue, Mango Slice looks down at her hooves, sighing softly and closing her eyes, §o'I wish it was you here, Dice.'§! She takes a small breath, and then stands, the sound of her hooves on the ground shutting the others up, §o'I'll do it. I'll lead the resistance. I'm not a leader, I'm just a soldier. Either we'll end up in graves by the end of all this, or we'll end up winning. And if we defeat the Aetherists, I'll relinquish power. I don't want any of this. Not alone.'§! She looks at all of them, her burn scars lit up by the crackling fire light, §o'Now are you all going to sit there and argue, or are we going to kick some Aetherist flank?'§!"
neocastle_creator.32.a: "For Manehattan!"

neocastle_creator.33.t: "Eclipsing All"
neocastle_creator.33.d: "The Empire State Building, center point of Empire, once the tallest building in Equestria, once the tallest building in the Wasteland. Of course, now, it's nothing more than a pale imitation of the Great Spire. Many have wanted to destroy the building, a statement to all, that the Great Spire is unparalleled. Sister Sunstone has even come all the way north, to give the building a final look-over, before it is destroyed.\n\n She trots through the emptied and hollowed out halls of the building, trotting up, and up, and up some more, all the way to the roof. She takes a final step, her legs sore, and tired, but she doesn't mind the sensation. Nightseer stands on the roof, having flown up, carrying a radio on her, giving a nod to Sunstone. Sunstone trots to the edge of the building, peering into the distance, where the Great Spire rises ever higher. She breathes deeply, a bit of humidity in the air from the nearby river. She breathes out softly, looking to Nightseer, and nodding, §O'This will do. Out here, there's no chance of me being recognized.'§! Nightseer nods deeply, taking the radio off her back, setting it up, §t'We will begin to gather spare caps, food, and water to bring up here. We shall be discrete.'§! Sunstone smiles softly, §O'Store it in a hidden location, I want there to be no chance of suspicion. Thank you, Nightseer.'§!\n\n She sits on the edge of the roof, looking over the horizon, north, to distant lands where once the communists ruled. She speaks into the radio, §O'This is Sister Sunstone, I am ordering a delay on the destruction of the Empire State Building.'§! After a second, another Aetherist responds through the radio, §r'Are you sure of that decision, Sister Sunstone? This building is a blight on the horizon, compared to our Spire.'§! She breathes in deeply, and then out once more, before responding, §O'The explosives that would be used to destroy the building can be better suited for mining resources. The building is already a husk of what once was. Let destruction come after our ascension.'§! The voice responds after a second, §r'Understood, Sister Sunstone.'§! She breathes in deeply, and out once more, pushing the radio aside as she stares north. She wonders for a minute. How much of the world can see the Great Spire, rising into the sky? How many laugh at their folly? She sighs, and then stands, beginning the long trot down."
neocastle_creator.33.a: "The Ritual nears"

neocastle_creator.34.t: "Behold Our Divine Work"
neocastle_creator.34.d: "Brother Quartz stands near the top of the Great Spire, the air so thin that he relies on an oxygen mask to breathe, rather than his normal medical mask. It's cold, and the clouds rest far below them. They are close to space, the Exosphere, and the final stage of construction is underway. Workers build higher no longer, the oxygen masks alone to keep them going would cost too much, not to mention frozen hooves. No, instead, robots build the final bit of the spire, a seven meter diameter needle, which will pierce high into the heavens, from which the ritual will be carried out. It doesn't need to be stable, only to last for a bit.\n\n Quartz likes it up here, to watch the robots work. Up this high, there's nobody else for thousands of feet. No microbes are able to survive this cold. Nothing but clean steel, and those pure, like him. The cold feels sterile, like the hooves of a nurse. No, a nurse's hooves are colder, yet still. The clouds below are pure white in color, just like the robots. Pure. Clean. Sterile. Safe. It almost looks like he could just step off, and be caught by a blanket of white, stretching in every direction. But he knows better, of course.\n\n He wishes he could spend every day up here, watching as platforms fly up, laden with material, exotic, arcane, never before seen, to be used by the machines. It's so much more quiet. So much safer. Better. Up high. But he has his responsibilities. New robots to design. To build harder. Better. Faster. Stronger. He can not live up here. But soon, he will be in a realm that will make this look like a quagmire of disease. Soon. But never soon enough."
neocastle_creator.34.a: "Watch your salvation rise high, Equestria"

neocastle_creator.35.t: "All The Treasures Of The World"
neocastle_creator.35.d: "WThe magic draining was never fun for Citrine, nor for any other member of the Council. Yet still she stands, her body growing weaker by the second, as she pours more and more magic into the crystal vein, leading all the way up, to the ritual chamber. She shudders once she's done, with many acolytes helping keep her aloft. Her fur has started to grey, and every day, she feels weaker, on her pilgrimage to give her offering to the crystal vein. She blinks, waking up somewhere completely different, being carried by acolytes. They're an hour down the spire, near the cloud town that once was Altos. She looks out the windows, seeing the few Pegasi they have working under robot supervision, upkeeping massive cloud support beams, helping keep the spire safer. She blinks again.\n\n When she opens her eyes again, she finds herself waking up once more, now in a small lab. Sister Sunstone sits in a wheelchair, her hooves struggling to work, installing a reactor into the spire, to keep it powered, and able to absorb their magic. Her coat is completely grey, she lost her colors almost overnight, looking like she crawled right out of a noir film. Acolyte Nightseer steps closer to Sister Sunstone, her strong Alicorn hooves helping slide the reactor into place, her coat more vibrant than ever. Sunstone's body took the worst to the magic giving of them all, her legs, grown back by magic and filled to the brim with it, stopped working almost immediately. Luckily, shortly after she got her wheel chair, she found Acolyte Nightseer in Canterlot, who has become a personal assistant, pushing Sunstone around. She blinks again.\n\n She wakes back up, being offered a cup of coffee by Sunstone, grinning slightly, 'You awake, Citrine?' Citrine nods, and smiles softly, taking the cup and sipping from it, 'Yes, Sister Sunstone.' She looks to the new reactor, then back to Sunstone, 'How do you manage to keep enough energy to still be working? I feel like I spend most of the day sleeping. My mind is a constant fog.' Sunstone smiles softly, 'Copious amounts of coffee, Citrine. And unlike you, I actually venture out of the spire every so often.' Citrine nods softly, sipping her coffee again, 'It's been a while since I've felt the dirt under my hooves.' Sunstone nods, leaning back, as Acolyte Nightseer comes over, offering her a pill, which she takes and downs instantly, 'I know Brother Quartz isn't complaining about that.' Citrine smiles softly, and nods, looking at the pill curiously, 'What's that you're taking?' Sunstone smirks softly, leaning back in her wheelchair, 'It's supposed to help with my coat's color. I don't want others to know what's happening so obviously.'"
neocastle_creator.35.a: "High above, salvation approaches"

neocastle_creator.36.t: "Cleansing The Body"
neocastle_creator.36.d: "Sister Ruby stumbles back, giving the last of her magic for today. Her coat has gone completely grey by now, some of it patchy, and starting to fall off. Behind her, Sunstone rests in her wheelchair, looking over some readings, 'We're at ninety nine percent capacity. A few more days, and Ascent will be ready.' She leans back in her wheelchair, looking as Acolyte Nightseer approaches, placing down some coffee and some pills. Sister Ruby frowns softly, 'Sister Sunstone, you know you shouldn't be drinking anything in excess.' Sunstone looks at her, and rolls her eyes, pulling a smaller mug of water out, that was hiding behind the coffee, 'The coffee is for her, not me. I know, I know, we need to cleanse the bodies.'\n\n Sister Ruby stumbles closer, her body almost failing, but catching herself at the last minute. Acolyte Nightseer pushes over some pills to her, along with a nutrient block, and water, 'Thank you, Acolyte Nightseer.' She takes the pills, and begins to eat the nutrients, nodding as she does, 'We are going to be leaving our bodies soon, and we don't want anything foreign in our bodies. It could cause the ritual to go wrong. All we need are the essentials.' Sunstone rolls her eyes once more, 'Yes yes, we don't need anything other than the basics, the Think Tank can handle the rest. Still would have been better to call them the C-Consciousness.'\n\n Ruby leans against the desk, sighing softly, her head throbbing slightly. Nightseer rests a hoof against her side, her vibrant fur matted down and stuck together, contrasting Ruby's grey coat. Ruby shakes her head, and then takes a sip of water, standing straighter, 'Let us prepare. The time draws near.'"
neocastle_creator.36.a: "Suffering sharpens the Soul"

neocastle_creator.37.t: "§tAscent§!"
neocastle_creator.37.d: "The seven Councillors await together, all of them of grey coats. Four of them have already been put into their crystal coffins, unable to stay awake much longer, after a small ceremony of wisdom had taken place. Brother Quartz sits next to Sister Ruby, Citrine, and Sunstone. Quartz coughs softly behind his mask, closing his eyes, his whole body shuddering as he does. Acolyte Nightseer, the only other one in the room, goes to him quietly. He looks at her, and croaks out, his voice parched, 'It's time. Take me. To my coffin.' Nightseer nods, pulling over a specialty made vacuum suit, putting it on him, before going over to a crystal coffin, sealing it shut.\n\n Sister Ruby looks at her fellow mares, and smiles softly, 'The time has finally come. Take the time you both need, I shall get prepared.' She barely stands, with Nightseer coming over to help her, the two of them getting Ruby into her vacuum suit. She takes a small breath, and trots into her own crystal coffin, 'I trot the riverside path.' Nightseer seals the coffin once Ruby's inside. Sister Citrine looks at Sister Sunstone, smiling softly, 'I still remember when you were in that bio-gel tank, Sister. I am sorry you had to go through that. We've done so much, Sunstone. We've killed so many.' Sunstone looks into her eyes, smiling softly, 'We'll make a better world, and nobody will remember, or care.' Citrine nods softly, getting into her suit, and then into her coffin.\n\n As the last coffin seals, Sunstone looks at her wheelchair, and then gets up from it, trotting around to Nightseer. The Alicorn's fur has a spot which has gone grey, on a foreleg which she used to help Sister Ruby. Sunstone nods, 'I'm surprised the paint idea worked. Is your strength still okay?' Nightseer nods slightly, 'Our magic is weakened, but we are strong enough. We will make haste for the Empire State Building, Sunforge.' Sister Sunstone, now Sunforge once more, smirks softly, putting on her own suit, 'Have some coffee awaiting my arrival, and some food. I'm starving.' She then climbs into her coffin. Nightseer looks into her eyes, and nods, closing the coffin, and sealing it."
neocastle_creator.37.a: "The last Journey Begins"

neocastle_creator.38.t: "§tRitual§!"
neocastle_creator.38.d: "The crystal coffins begin their way upwards, and Citrine stares. Her mind is in a meditative state, but yet she perceives all the same. Starting at the base of the tower, and slowly making their way up. They pass by the tops of the buildings of Neocastle, watched with baited breath by thousands. They pass even higher, above the Empire State Building in the distance. They go higher, through the clouds, past the town of Altos, flying robots making sure no Pegasus interferes. Then higher still, until the blue color of the sky disappears, and they can see the curve in the distance. Brother Quartz breathes easier in his suit, finally someplace truly pure. Sister Ruby closes her eyes, preparing for what lays ahead. Sister Citrine, though, blinks, tears leaking down her cheeks, as she sees the stars clearly, the world down below them, paradise awaiting to come.\n\n The coffins come to a top at the very top of the tower, a magical needle thrumming with power, covered in magical, glowing runes. All coffins turn to face the needle, as down below, seven reactors, the Sunforges, as Sunstone calls them, open, and magic flows up. Above Sister Ruby, red magic begins to feed into the chamber, above Brother Amethyst, purple, above Brother Quartz, white, and above Citrine, a yellow-orange hue. Their bodies light up, feeding magic into the ritual, a pittance compared to all they've saved up, but just enough to start the reaction. The greatest Megaspell ever seen, Ascension begins.\n\n The sound would be deafening, if not for their suits and coffins keeping them safe from it. In the center of the ritual, slowly, the fabric of the world itself seems to tear open, Aether on the other side. Yet, Citrine doesn't pay attention to that. Instead, she notices something strange. The magic above Sister Sunstone is purple in coloration. She turns her eyes away from the opening rift of reality, towards Sister Sunstone. Sunstone matches her eyes. Citrine's eyes are filled with confusion, while Sunforge gives her a small smile. The rip in reality begins to grow wider and wider, but Citrine can't look at it. For she watches, as Sunforge lifts a hoof, kisses it, and blows the kiss to Citrine, before then disappearing in a flash of magical light. Citrine opens her mouth to question, but nothing comes out, as she Ascends."
neocastle_creator.38.a: "Then the world goes white"

neocastle_creator.39.t: "Freedom"
neocastle_creator.39.d: "Ponies gather all around, watching as the crystal coffins of the Aetherists rise up into the air. One pony, a former serf, runs and shouts, §c'Queen Stargazer! They're ascending!'§! Stargazer, once Queen of New Mareway, looks towards the former serf. She wears nothing more than a simple brown cloak, her mane dirty, her eyes tired, her brow covered in sweat, but her smile as bright as ever, §t'Not Queen anymore, Potato.'§! She places down a hoe, having been assigned to produce food for the workers on the spire. Slowly, she trots to join the other ponies, looking up at the ritual of ascension. Former serfs, raiders who served Blood Mane, and a simple farmer called Herald stand around Stargazer, looking up alongside her.\n\n All watch as the coffins disappear, their fur standing up straight as they feel the air around them electrify with magical use. Stargazer shudders slightly, §t'What is this sensation?'§! They all look up, watching, as an Aurora begins to surround the spire, of varied colors, it's glow filling the night sky. She smiles softly, and looks down, shaking her head, §t'Looks like it work- Ahh!'§! She shouts loudly, all of them do, as a bright white flash fills the sky, blinding them. They blink their eyes clear, and Stargazer looks up again. A hole has been blown away in the cloud cover, and high in the sky, a second sun burns bright, where the tip of the spire once was, its multicolored light shining down on the land, fading quickly. She pauses, as her eyes notice a shockwave going down, tearing the spire apart, piece by piece, §t'Take cover!'§! Her horn lights up bright, a magical shield surrounding them, as the shockwave hits. It destroys buildings in the distance, in the capital of Neocastle, as pieces of the tower begin to fall.\n\n Nearby, the white Sentinel who observed them begins to trundle, making its way to the capital. All around, they see more and more do the same, all the robotic servants returning to their masters. Stargazer pants, collapsing to the ground, her horn smoking from her shield. The others watch in wonder, while she closes her eyes. A tear rolls down her cheek, then another, and another, as the former Queen begins to cry on the ground. Yet despite her tears, a smile remains. The others look down at her, but none speak a word, until Herald does, §c'You protected us. Saved our lives.'§! He looks back towards the tower, and then back at Stargazer, §c'They took everything from us. Everything, except each other. Hail, Queen Stargazer!'§! The shout echoes around the fields, as the servants of Aether rally together. §c'Hail Queen Stargazer! Hail, Mareway Reborn! Hail to our freedom!'§!"
neocastle_creator.39.a: "Is it over, are we free?"

neocastle_creator.40.t: "Scramble"
neocastle_creator.40.d: "Sunforge sighs softly as she trots, Nightseer beside her, their packs laden down with food and water. They had remained on the Empire State Building for a while, resting and recovering, after the ritual had failed. Sunforge was the only survivor, of course, since she left before it all went wrong. She could go to Neocastle, try to claim sole leadership, maybe, once upon a time, she would have done just that. But not anymore. They watched from the Empire State as The Bonecrusher betrayed the Manehattan Resistance, using her raider armies to claim an empire for herself. Mango Slice, leader of the resistance, gathered what remained of the Steel Rangers, working alongside Black Seas to make a new nation, the Manehattan Armed Treaty Organization, not Steel Ranger, yet with strong influence from them. Down south, Stargazer had rallied the workers to rebuild Mareway. She hasn't been able to learn much more than that, but she doesn't care.\n\n Her hooves trot on rusty steel pathways. Everyone gives her a wide berth, it's to be expected for a mare with an Alicorn companion. This area has yet to fully solidify under a faction, but she doesn't care about that. That's not why she's here in Rustwreck. Her hooves drag further, her pace laborious and slow, as she pushes her way into a bar, built out of a small cruiser, too rusted to have been stripped down for parts by the Aetherists. Ponies sit around. A smart looking pony on her fifth glass of whiskey talks about building a new republic, to a geek sitting across from her. A lesbian couple in crimson armor sit around a charismatic mare spreading a new old faith. None of them matter, not anymore, not to her.\n\n She trots slowly, finally reaching a table, shoved in the corner of the room, where a Griffon sits. She looks at him, Nightseer stood behind her, §O'I've heard you're a sailor. Sailed between here and Griffonia most of your life.'§! The Griffon nods slightly, §o'Oui, you've heard right. Why do you ask?'§! She reaches into her bag, taking out a massive bag of caps, then another, and another, an entire third of the treasury of the Aetherists, §O'There's more in the Empire State Building to complete your payment. I want to go somewhere.'§! He nods softly, taking the bags, and counting the caps inside, §o'Where?'§! She breathes in softly, and then out, §O'Zebrica. Take me to Zebrica.'§! She sighs softly, her eyes tired, §O'So I can prevent anything like this from happening again.'§!"
neocastle_creator.40.a: "You got a deal, Madame!"

neocastle_creator.41.t: "Idealism"
neocastle_creator.41.d: "§P'Welcome, one and all, I'm glad you could be here today. Many years ago, we were subjugated by the Aetherists. All the forces of democracy fell.'§! A Griffon sits in the audience, under the hot desert heat. Many sit around her, ponies and griffons both. She remembers a time just like this, not too long ago, when her mother declared the New Canterlot Republic. Regina wasn't young then, maybe. But she certainly feels old now. Left alone in the world, her family slaughtered, all but her, in the pursuit of 'paradise'. 'In the south, New Canterlot fell, even when they had the greatest chance to win. Its ponies and griffons abandoned the republic on the first sight of conflict, because they knew it was no true republic. No republic is run by only one party, with only one leader, seeking to subjugate fellow republics around it. That is why the NCR fell.'\n\n Regina would speak up, and confront Wide Savage, giving the current part of the speech. Try to defend her mother's legacy. But maybe he's right, besides, Grimfeathers were always meant to fight, not to lead. She'll make sure to learn that lesson. Wide Savage continues on, §P'Many of our friends, our family, have died over these years. Our cities have been picked apart, our countries destroyed. But through it all, there is one thing the Aetherists never crushed! The light of liberty, the love of freedom, which beats in the heart of every living being, here, and elsewhere!'§! Cheers erupt from all around her, even Regina gives a small smile and a bit of applause. Wide Savage might be too much of a politician for her tastes, but he can give a speech like no other.\n\n §P'It doesn't matter your home, your creed, your kin, for within all living beings is the love, the want, the need for freedom! The Aetherists tried to take that away, but we fought for it, hoof and claw! Because we know, no paradise comes, except one where the light of liberty touches each and every creature on this planet!'§! He slams his hoof down on the podium, holding his other hoof up, §P'My home was taken, now owned by Hellhounds and dogs, but I promise you this, ponies of the Appleloosan Federal Republic! To the east, the slaves of Fillydelphia are a republic the same, and together, we will ensure no Aetherist ever rises again! Join the army, cast your votes, fight, fight for your freedom, fight for your liberty, fight, that no Aetherist comes again!'§! Cheers go up all around, as Regina stands. She walks away from the speech, a small smile on her face. Her eyes look elsewhere, spotting a recruitment station for the army. With no hesitation, she approaches."
neocastle_creator.41.a: "We can only hope"

neocastle_creator.42.t: "ERROR"
neocastle_creator.42.d: "The former acolyte, now acting council member Stormrise, stared at the fading screens of the spire in pure grief. Every datastream that flowed forth was the same answer: the ascendants are gone, and yet nothing at all has changed. There were no signs of their gods that would bring about paradise, no whispers of salvation, no end of disease or fear. Just pure absolute silence. It was deafening, all-consuming, and broke the spirit of the remaining brothers and sisters. This couldn’t be how it was meant to go; this was never how it should have ended! The sacrifices had been made, the blood and resources poured into the tower had to mean something! \n\n Doubt swelled within Stormrise as the reality of the situation came flooding forth as a tide that battered the lands. What was reality now? Their ascendants had vanished, their dreams filled with questions that may never get answers. The robots remained; they could try again, sacrifice everything for another attempt. That could have worked, but deep down, Stormrise knew, to attempt again was pointless. Everyone had been tired of war, of bloodshed, of conflict. There was only one truth to accept. To wait, to seal themselves within their holy sanctum even as the lands began to collapse around the Spire. \n\n Stormrise could only weep at the loss of paradise, the sacrifices made, the ponies lost, and the dreams that would never be fulfilled. “I take upon myself to be the guardian of the Spire. We shall await their words, their message, their blessings.” The unicorn swore this oath to his remaining brothers and sisters as the steel walls rose once more. \n\n A spire that consumed the wasteland would remain as a monument to what hubris could bring. A paradise that was never meant to be. Stormrise stared at the great screens of the machine once more and prayed for a salvation that never came."
neocastle_creator.42.a: "Our divines have gone silent, the machines have powered down, we have been abandoned. Our dreams laid broken for a paradise forever lost."

neocastle_creator.43.t: "Ever After"
neocastle_creator.43.d: "“Omniscient, ever present, yet sealed within the roots trapped by the bounds of reality. Forced to witness everything fall apart. Dreams shattered like a broken canvas, disease corrupting like a rotting pestilence, hope forgotten like leaves in the wind. Sister Citrine, no, Citrine stared through the reflection of the Aether itself as everything fell down. The ritual, it had to succeed, didn’t it? The effort all of them poured into it was meant to create something beautiful. But the world was not made for beings who existed as concepts. As mere thoughts. Perhaps that was her hubris. Perhaps that was all their hubris. To try rewriting the page, to remake the story so completely.  \n\n Her eyes tried to see her whole body, to find any semblance of self, but there was only her spirit, the Aether that was the foundation of her very being. Yet, as Citrine stared forward, she could make out all of Equestria to bear witness to what their efforts had wrought. It was to gaze into a great pool, to feel the reflections of one’s life and history all in a singular moment. The feeling was both beautiful and frightening, for it was then that Citrine realised she could see none of her fellow council members with her. She was alone, trapped within the Aether, forced to watch as the world continued onwards. Was it a miscalculation on their part that brought about this effect? Or was her mind still reeling from the ritual, and all it was were images that the brain showed before a final death? These questions would remain unanswered as Citrine’s eyes, or rather her being, focused on the pool in front of her. To see everything, and yet be unable to do anything. To know everything, but never be able to speak to another. Unlimited power with nothing to do, for an Aether being cannot exist within true reality.  \n\n She watched as the Infinite Spire collapsed downwards, dreams torn asunder as everything fell to ground. Countless ponies, sentinels, and years of progress were erased in a single spell that doomed their prospects to a life without paradise. She watched as they tried to rebuild, staring into the Think Tank’s data, trying to discover what went wrong. The anguish that tormented their souls seared itself into her very being. Citrine wished to reach out and comfort her fellows, but the pool refused to let her interfere. Citrine was forced to watch as her brothers and sisters gave into their loss and sealed themselves within what remained, waiting for a sign that could not, would not ever come.  \n\n The lashing of her spirit against the cage of her brilliant mind made the pond ripple and shift as her vision began to gaze further out across all Equestria. Citrine watched as everything they built collapsed inwards, the sentinel robots marching back towards the spire, their former laborers shattering their chains, and then one sight that caught her eye. Sister Sunstone, the one who abandoned them, who fled before the ritual’s end, fleeing Equestria to parts unknown. Endless questions flowed through her mind, from why to how, to what had they done? Citrine’s eyes stared from the pool, the very river of creation, for what felt like eternity. She witnessed the raiders turn against their allies and carve out a false empire, bringing yet more suffering. \n\n She watched as the other remnants in Manehattan tried to rebuild their homes, barely clinging together. Citrine saw the workers of Mareway, united by their Queen, gathering together to honor the losses and rebuild their societies. Republics being rebuilt, ideas of old flowing in to replace the originals. Citrine’s eyes once again turned towards the Empire State Building to watch Sunstone for one final time. She could not hear what was being said at that moment; she did not know what was going on, but everything became clear in time. The ritual had failed, completely and utterly. Their hubris did not bring about paradise; it did not give hope or friendship. All they had brought was more suffering, more despair, and only death. Citrine felt herself weep, tears drawn out from years of planning. Every name she remembered, every face she could recall, all sacrificed in the name of nothing. For there would be no salvation, no rewards, no paradise. In the end, they had changed nothing and ruined everything."
neocastle_creator.43.a: "In the silence, her reward was only despair."


