 NCG_electrification_cat: "Expanding the §rArcano-Electric integrated Network§!"
 NCG_electrification_cat_desc: "Pulsating wires snake extend out from the spires of Neocastle to the farthest reaches of the Magi's domain. Where-ever the humming wires with their matte silver coating are found, the will of Archmagos Tezla is absolute. Information is carried back to Neocastle from a myriad of Cameras, Robots and Servitors, while orders are sent out to troops and workers alike.\n§GAny state connected to the network will be §Osemi-cored§!, gaining bonuses to §Oresources, production§! and §Orecruitable population§!. It is not as good as a full core, but it is fast and costs much less political power.§!\n"
 NCG_electrification_dec: "Connect §G[FROM.Getname]§! to Network"

 NCG_subvert_mareway_cat: "Pulling the Strings of the Nobles"
 NCG_subvert_mareway_cat_desc:      "With §r[MWY.GetLeader]§! foalishly refusing our trade deal, we will have to use alternative means to aquire the §ARiches of Mareway.§!\nWe will therefore exploit their §GFeudal System§!, which only fosters distrust and competition among the various nobles. By strategically offering §CMonetary and Industrial 'Gifts'§!, we will turn the local nobility sympathetic to our cause, and while they might not outright rebel, they will still idly stand by once our eventual invasion comes, §Rcrippling the Crown and its armies!§!"
