### Leader Description
 POLITICS_TRADE_COUNCIL_DESC: "§YThree Guilds, United§!\n\nThe §aTrade Council§! is the official ruling body of §DNeocastle§!. Established several generations ago as part of a restructuring effort by the §OBuilder's Guild§!, this organization seeks to represent the interests of each of its member Guilds in equal measure. Though initially met with apprehension, it would rapidly go on to gain popular support after the §GMiner's Guild§! began to see it as a method through which they could even the political playing field.\n\nThough the §aTrade Council§! initially only dealt with matters of national policy, it has since expanded to deal with most matters that fall between or which involve the participation of multiple Guilds. Many agreements are made within this mediatory body, turning it into the common avenue through which the Guilds work with one another."

