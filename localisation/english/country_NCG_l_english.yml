 NCG_mil_invest_5: "An Army of Machines"
 NCG_mil_invest_5_desc: "Tales are told in hushed whispers around campfires of the machine-army of Neocastle. It is said that they are entirely unfeeling constructs of metal and circuitry, capable of shooting lasers out of their eyes and crushing a ponies spine with but a flick of their robotic hooves. These stories aren't far off, as our robotic forces have proven themselves more than capable of taking on even the toughest ponies. Moving forward, they will likely be crucial to securing our assets across the Wasteland."
 NCG_civ_invest_5: "The Magic of Capitalism"
 NCG_civ_invest_5_desc: "Once upon a time, in the magical land of Equestria, there lived three great Guilds. Each of them, noble and proud, sought to pursue what really matters: Profit. In this pursuit, they accomplished numerous amazing feats, revolutionizing the Wasteland with the power of capitalism and bringing about unheard of levels of prosperity."
 NCG_rng_invest_5: "Nation of the Future"
 NCG_rng_invest_5_desc: "Ours is not some primitive backwards nation living within the irradiated stone age of the post-apocalypse. Instead, we have forged a nation built on technology and progress. By our efforts, ponykind shall be enlightened once more to the glory of innovation!"
 NCG_mil_training_modifier: "Specialized Training"
 NCG_mil_training_modifier_desc: "We have invested some of our hard earned wealth into providing proper training for our security forces. Improved facilities and hired instructors both go a long way towards ensuring the professionalism of our brave officers."
 NCG_civ_market_modifier: "Cornering the Market"
 NCG_civ_market_modifier_desc: "We are currently investing in a market-expansion strategy within the Greater Wasteland Market. So long as we can continue to afford this expansion, we can undermine our competitors while expanding our own assets."
 NCG_rnd_budget_modifier: "Increased Research Budget"
 NCG_rnd_budget_mofier_desc: "With our increased funding towards Research and Development, we are able to afford some of the Wastelands greatest minds and most advanced facilities. Though some of our more expense-averse personnel view this as a waste of funds, it is often defended as a solid investment towards our future."
 NCG_civ_invest_debuff_idea: "Integrating Foreign Capital"
 NCG_civ_invest_debuff_idea_desc: "We are currently working towards integrating recently purchased competitor assets."
