 NCG_west_amethyst_resistance: "West Amethyst Strike"
 NCG_west_amethyst_resistance_desc: "Our northernmost valued employees have always acted without as much oversight as our personnel in Neocastle proper. With this relative freedom, they began to organize and form a §RUnion§!. That term brings anger to even the most mellow of workers, for we all know such vile organizations to be run by nothing but power hungry foals with no respect for market growth or profit margins. When the Guilds learned of their ongoing effort to sabotage and destroy those very values which built our great nation, they immediately took action to crack down on these troublemakers.\n\nUnfortunately, this effort led to the problem growing even worse. The dreaded §RUnion§! called for a §RGeneral Strike§!, revealing themselves to be committed to the complete and utter destruction of our way of life. Thankfully, we have been able to keep this threat contained, but their continued seditious activities within West Amethyst have greatly hindered our operations there. We'll need to deal with them if we wish to meet our national production quotas once more."
 NCG_west_amethyst_resistance2: "West Amethyst Strike"
 NCG_west_amethyst_resistance2_desc: "Our northernmost valued employees have always acted without as much oversight as our personnel in Neocastle proper. With this relative freedom, they began to organize and form a §RUnion§!. That term brings anger to even the most mellow of workers, for we all know such vile organizations to be run by nothing but power hungry foals with no respect for market growth or profit margins. When the Guilds learned of their ongoing effort to sabotage and destroy those very values which built our great nation, they immediately took action to crack down on these troublemakers.\n\nUnfortunately, this effort led to the problem growing even worse. The dreaded §RUnion§! called for a §RGeneral Strike§!, revealing themselves to be committed to the complete and utter destruction of our way of life. Thankfully, we have been able to keep this threat contained, but their continued seditious activities within West Amethyst have greatly hindered our operations there. We'll need to deal with them if we wish to meet our national production quotas once more."
