 NCG_star_foundry_cat: "Constructing the §OStar Foundry§!"
 NCG_star_foundry_cat_desc: "The lifelong ambition of Magos Sunforge, this project plans to open a small portal to the §YHeart of the Sun§! in order to not only produce energy, but also to extract heavy minerals via arcanomagnetic processes.\nThis project will cost a lot to get going, but might revolutionize our Industry!"
