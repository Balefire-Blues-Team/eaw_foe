NCG_infinite_spire_1: "Building the Infinite Spire"
NCG_infinite_spire_1_desc: "Creation is an inverted tree. We live on one of the great world-fruits, enjoying the bliss of life, but the true mysteries lie at the root. To find the source of all, we must build higher!"
