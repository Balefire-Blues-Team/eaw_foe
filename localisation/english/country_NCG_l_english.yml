 NCG_corruption_modifier: "Corporate Corruption"
 NCG_corruption_modifier_desc: "It is said that within the lands of Neocastle, money can buy anything. This includes the favor of the upper-ranking members within each Guild, who are willing to do all sorts of favors for those with enough gifts to grease the gears. Of course, this generosity also commonly extends to the friends and families of those holding such ranks as well.\n\nWhile these sorts of arrangements have persisted since the days of Equestria itself, they are considered by many to be far from desirable. If we aren't careful, this corruption could begin to have a severe impact on our business operations."
 NCG_corruption2_modifier: "Corporate Corruption"
 NCG_corruption2_modifier_desc: "It is said that within the lands of Neocastle, money can buy anything. This includes the favor of the upper-ranking members within each Guild, who are willing to do all sorts of favors for those with enough gifts to grease the gears. Of course, this generosity also commonly extends to the friends and families of those holding such ranks as well.\n\nWhile these sorts of arrangements have persisted since the days of Equestria itself, they are considered by many to be far from desirable. If we aren't careful, this corruption could begin to have a severe impact on our business operations."
 NCG_indentured_servants: "Indentured Employees"
 NCG_indentured_servants_desc: "In the early days of our nation, it was not uncommon for ponies to end up deeply indebted to the Guilds. Many of these ponies were then unable to pay their dues. However, we are not the sorts of monsters who would break their kneecaps and demand immediate payment. Instead, in our benevolence, we offered a solution that could allow them to work away their debt. This created a large supply of low-skilled personnel, which quickly became the backbone of our corporate expansion.\n\nThe descendants of many of these ponies are still indentured to us today, working hard to pay off the debts held by their lineage. Some call it slavery, but with enough hard work and effort, anypony can purchase their freedom once more."
 NCG_defunded_army: "Defunded Security"
 NCG_defunded_army_desc: "At one point in time, over a century ago, there was a fourth Guild: The Security Guild. They provided for the defence of the personnel and assets of all the other Guilds. However, they grew arrogant and sought to seize complete power over all of their peers. Their betrayal led to a long and bloody conflict, one which was ultimately won by the other three Guilds. The Security Guild was completely disolved and all of their assets were distributed among the other Guilds.\n\nDue to this dark stain in our history, our security officers are kept as a relatively small force with little funding. However, recent developments within the Greater Wasteland Market have led to a more pressing need for asset protection."
 NCG_defunded_army2: "Defunded Security"
 NCG_defunded_army2_desc: "At one point in time, over a century ago, there was a fourth Guild: The Security Guild. They provided for the defence of the personnel and assets of all the other Guilds. However, they grew arrogant and sought to seize complete power over all of their peers. Their betrayal led to a long and bloody conflict, one which was ultimately by the other three Guilds. The Security Guild was completely disolved and all of their assets were distributed among the other Guilds.\n\nDue to this dark stain in our history, our security officers are kept as a relatively small force with little funding. However, recent developments within the Greater Wasteland Market have led to a more pressing need for asset protection."
