 NCG_state_security_idea: "Equine Resources Department"
 NCG_state_security_idea_desc: "Equine Resources remains committed to ensuring a well-organized and safe working environment for all personnel. Paperwork is dutifully stored containing information on each and every employee, so as to ensure that all ponies are accounted for at every time. Any concerns or complaints are rapidly addressed, ensuring that morale and productivity remain high as we go about our day-to-day operations."
