NCG_church_of_aetherism: "State without a People"
NCG_church_of_aetherism_desc: "Other nations rely on their people for everything. We will not. A small corps of loyal servants and legions of robots enforce the will of the Council of Seven. As we have no need of the rest of the population, they will be ignored where possible, and systematically starved, worked to death or otherwise exterminated where not.\n§tWe will bring them all back once we ascend and create Paradise, so their deaths are more of a temporary inconvenience...§!"
NCG_church_of_aetherism2: "State without a People"
NCG_church_of_aetherism2_desc: "Other nations rely on their people for everything. We will not. A small corps of loyal servants and legions of robots enforce the will of the Council of Seven. As we have no need of the rest of the population, they will be ignored where possible, and systematically starved, worked to death or otherwise exterminated where not.\n§tWe will bring them all back once we ascend and create Paradise, so their deaths are more of a temporary inconvenience...§!"

NCG_aetherist_science: "Aetherist §NScience§!"
NCG_aetherist_science_desc: "§NScience§! is a branch of philosophy dedicated to the material world. As we reject the material in favour of the §tAetheric§!, we necessarily reject the excesses of §NScience§! as well! In their stead, more resources will be diverted to build the Spire. Additionally, production of consumer goods will be reduced, as we have no need to keep the workers in any sort of comfort, they are merely bodies for the grand design.\n§tThey will thank us, once we resurrect them into the new world, and they see their illusions of §NScience§! crumble to dust.§!"
NCG_aetherist_science2: "Aetherist §NScience§!"
NCG_aetherist_science2_desc: "§NScience§! is a branch of philosophy dedicated to the material world. As we reject the material in favour of the §tAetheric§!, we necessarily reject the excesses of §NScience§! as well! In their stead, more resources will be diverted to build the Spire. Additionally, production of consumer goods will be reduced, as we have no need to keep the workers in any sort of comfort, they are merely bodies for the grand design.\n§tThey will thank us, once we resurrect them into the new world, and they see their illusions of §NScience§! crumble to dust.§!"

NCG_bellatores_idea: "Faithful Metal Servants"
NCG_bellatores_idea_desc: "Servants with minds of their own doubt. They hunger, they covet what their betters have and complain about their lot in life. We have no time for such nonsense, we are in the process of saving all of the world. We shall build our own servants, wholly dedicated to the cause!\n§tAnd in paradise, we will gift them bodies of flesh and souls as true as any other in thanks for their service.§!"
