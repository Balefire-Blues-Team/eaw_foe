 NCG_hiring_new_mercs: "Hiring New Mercenaries"
 NCG_hiring_new_mercs_desc: "We are currently investing in hiring more third party asset protection services."

 NCG_underground_construction_idea: "Underground Construction"
 NCG_underground_construction_idea_desc: "Much of our industrial expansion is now undertaken deep within the ground, far away from the prying eyes of our competitiors and pony rights activists alike."
 NCG_death_merchant_modifier: "Merchants of Death"
 NCG_death_merchant_modifier_desc: "The arms industry is a profitable one, as we are quickly finding. So long as we have customers who wish to buy our weapons, the profits will continue to roll in. Profits which may then be reinvested in market expansion in order to further increase profit potential."
 NCG_death_buyer_idea: "Buying Neocastle Weapons"
 NCG_death_buyer_idea_desc: "We have signed a deal with Neocastle, purchasing weapons from them at a sizable price. While this may cost us quite a bit of money, it is worth it if it means keeping our army supplied with the weapons they need for victory."
 NCG_final_capitalism_idea: "§aPeak Capitalism§!"
 NCG_final_capitalism_idea_desc: "Through the maximization of employee productivity and extensive market expansion, we have achieved a model of peak profit. Through this model, wealth only flows upwards and the Guilds grow ever richer while everypony else grows ever poorer. Truly, this is the ideal system!"
 NCG_final_capitalism_mine_idea: "§aSlave-based Capitalism§!"
 NCG_final_capitalism_mine_idea_desc: "Through the maximization of employee productivity and extensive market expansion, we have achieved a model of peak profit. Through this model, wealth only flows upwards and the Guilds grow ever richer while everypony else grows ever poorer. Truly, this is the ideal system!"
 NCG_final_capitalism_mech_idea: "§aCybernetic Capitalism§!"
 NCG_final_capitalism_mech_idea_desc: "Through the maximization of employee productivity and extensive market expansion, we have achieved a model of peak profit. Through this model, wealth only flows upwards and the Guilds grow ever richer while everypony else grows ever poorer. Truly, this is the ideal system!"
 NCG_army_refunding_idea: "Rebuilding Company Security"
 NCG_army_refunding_idea_desc: "We are currently undertaking efforts towards ensuring asset protection moving forward."
 NCG_corpo_aircraft_idea: "Standardized Aircraft Construction"
 NCG_corpo_aircraft_idea_desc: "All of our airplanes are made of the same parts manufactured in the same ways with the same materials. This allows us to engage in mass production to ensure that we always have the most planes in any aerial conflict."
 NCG_merc_focus_idea: "A Mercenary-Based Army"
 NCG_merc_focus_idea_desc: "We have outsourced our asset protection to third parties. While this may look more expensive on paper, it will actually save us quite a bit of money in the long run. This also ensures that we have only trained professionals looking after our security, including some of the best soldiers the Wasteland has to offer."
 NCG_merc_focus_idea2: "A Mercenary-Based Army"
 NCG_merc_focus_idea2_desc: "We have outsourced our asset protection to third parties. While this may look more expensive on paper, it will actually save us quite a bit of money in the long run. This also ensures that we have only trained professionals looking after our security, including some of the best soldiers the Wasteland has to offer."
 NCG_employee_army_idea: "An Employee-Based Army"
 NCG_employee_army_idea_desc: "We have worked towards expanding our own internal security forces. This allows us to oversee everything directly, ensuring that our security personnel are kept in line and abide by our standards."
 NCG_employee_army_idea2: "An Employee-Based Army"
 NCG_employee_army_idea2_desc: "We have worked towards expanding our own internal security forces. This allows us to oversee everything directly, ensuring that our security personnel are kept in line and abide by our standards."
 NCG_naval_idea: "Corporate High-Seas Authority"
 NCG_naval_idea_desc: "Our naval security forces are some of the best money can buy, all of them being veteran seafarers. They work tirelessly to keep our riverways secure and to tackle the ever-present threat of piracy."
 NCG_mobile_army_idea: "§O'Rolling Thunder'§! Tactics"
 NCG_mobile_army_idea_desc: "The §ORolling Thunder§! strategy is based around the idea of a rapid response to any threats that may arise. Through truck, plane, and armored vehicle alike, our forces will be able to deal with threat-actors long before they are able to cause any damage to our operations."
 NCG_mobile_army_idea2: "§O'Rolling Thunder'§! Tactics"
 NCG_mobile_army_idea2_desc: "The §ORolling Thunder§! strategy is based around the idea of a rapid response to any threats that may arise. Through truck, plane, and armored vehicle alike, our forces will be able to deal with threat-actors long before they are able to cause any damage to our operations."
 NCG_robotic_focus_idea: "§R'Burning Steel'§! Tactics"
 NCG_robotic_focus_idea_desc: "The §RBurning Steel§! strategy is based around the idea of relying heavily on robotic combatants in order to provide asset protection. Through the mass production of these metal servants, we can ensure that we have a sizable advantage over our competition."
 NCG_robotic_focus_idea2: "§R'Burning Steel'§! Tactics"
 NCG_robotic_focus_idea2_desc: "The §RBurning Steel§! strategy is based around the idea of relying heavily on robotic combatants in order to provide asset protection. Through the mass production of these metal servants, we can ensure that we have a sizable advantage over our competition."
 NCG_defense_focus_idea: "§F'Thousand Citadels'§! Tactics"
 NCG_defense_focus_idea_desc: "The §FThousand Citadels§! strategy is based around the idea of relying heavily on fortified positions to keep our assets secure. Through a firm refusal to give any ground at all to our competition, we can ensure that our assets remain our own."
 NCG_defense_focus_idea2: "§F'Thousand Citadels'§! Tactics"
 NCG_defense_focus_idea2_desc: "The §FThousand Citadels§! strategy is based around the idea of relying heavily on fortified positions to keep our assets secure. Through a firm refusal to give any ground at all to our competition, we can ensure that our assets remain our own."
 NCG_finance_BOG_idea: "Bog Hopper Buyout"
 NCG_finance_BOG_idea_desc: "It took us a not inconsiderable sum of wealth to extend our influence across the lands of the Bog Hoppers. Though it was well worth it in the end, we'll likely be paying for this endeavor for a while."
 BOG_bogwoods_idea: "BogWoods(TM)"
 BOG_bogwoods_idea_desc: "BogWoods(TM) is the subsidiary established by the Neocastle Guild's to oversee economic operations within the Froggy Bottom Bog. Under their oversight, many of the warriors within the various tribes residing int he bog have instead been put to work draining the land in order to get at the valuable resources underneath, along with building foundries to produce steel."
 NCG_MWY_trade_idea: "§rNeocastle§!-§PMareway§! Trade-Deal"
