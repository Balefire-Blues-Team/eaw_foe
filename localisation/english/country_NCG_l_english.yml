 NCG_piracy_blues: "Piracy Blues"
 NCG_piracy_blues_desc: "Our easy access to the §RAzureway§! has allowed us to become a regional hub for river trade, second only to §YHoof City§!. While this has been a great boon to our economy, it has also attracted the attention of unsavory sorts. Pirates and vagabonds roam the riverways, sailing in on makeshift scrap boats and harassing our vessels. Though most of them do little more than demand monetary tribute in exchange for passing by their floating checkpoints, others take a far more violent approach and seize the cargo of all they come across at gunpoint. Until we deal with this issue, our naval routes will suffer from reduced traffic and trade."
 NCG_piracy_blues2: "Piracy Blues"
 NCG_piracy_blues2_desc: "Our easy access to the §RAzureway§! has allowed us to become a regional hub for river trade, second only to §YHoof City§!. While this has been a great boon to our economy, it has also attracted the attention of unsavory sorts. Pirates and vagabonds roam the riverways, sailing in on makeshift scrap boats and harassing our vessels. Though most of them do little more than demand monetary tribute in exchange for passing by their floating checkpoints, others take a far more violent approach and seize the cargo of all they come across at gunpoint. Until we deal with this issue, our naval routes will suffer from reduced traffic and trade."
