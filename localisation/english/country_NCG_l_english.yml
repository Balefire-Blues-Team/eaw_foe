 NCG_drugged_population: "Drugged Population"
 NCG_drugged_population_desc: "Our employees are in the prime of their lives thanks to a special house-blend cocktail of chems, the cost of which is automatically deducted from their wages. With our secret combinition of vairous life-saving medicines and miraculous chemicals, we can ensure that everypony is kept in tip top shape. This has also had the added effect of making them more docile and less likely to complain about their long hours or ever decreasing wages."
 NCG_lending_money: "Lending Money"
 NCG_lending_money_desc: "We are currently providing the good consumers of the Greater Wasteland Market with sizable investments at an affordable interest rate. Of course, the term affordable is relative."
 NCG_MWY_uncooperative_nobles_idea: "Uncooperative Nobles"
 NCG_MWY_uncooperative_nobles_idea_desc: "When the war began, we had expected the ever-bickering nobility to come together in face of this grave threat. Unfortunately, it appears they have done the opposite, instead opting to take every measure possible to further their own power at the expense of our ability to wage war."
 NCG_wedding_preparations_idea: "Wedding Preparations"
 NCG_wedding_preparations_idea_desc: "We are preparing for the wedding of the century, with a vast amount of our wealth being poured into this endeavor. We will make sure everypony knows of our union!"
 NCG_retirementpush_idea: "Retirement Incentives"
 NCG_retirementpush_idea_desc: "We are currently actively encouraging some of our less desirable members of middle management to resign. Though it may take some time to replace them, this will be best for our company moving forward."

 NCG_mechanicum_guild: "The One Guild"
 NCG_mechanicum_guild_desc: "There once were §YThree Guilds§! ruling over this land. For generations, they ruled over this land and sought to maximize their profits at the cost of all else. This greed would be their downfall, for they lacked anything more than short-sighted plans aimed at amassing as much wealth as they could in as little time as possible. Fortunately, one of the Guilds saw beyond the here and now. They gazed into the future and knew what must be done in order to achieve their goals.\n\n§RThe Mechanicm§! now stands alone, ruling over the rest of Neocastle with an augmented cyber-hoof. The future they have laid out is not one of endless construction towards no end, nor one of vast mines pointlessly digging ever deeper into the barren ground. Instead, they have laid out a vision for a future built on technology and progress. One where nothing is out of their reach. Nothing will stop them until that future has been made into a reality."

NCG_guild_resistance_1: "Betrayed Everyone"
NCG_guild_resistance_1_desc: "We have stabbed the Mechanicum in the back and then massacred our own allies after taking new Neocastle. Frankly, everypony hates our guts, and it will be an uphill battle to stabilize the nation."
NCG_guild_resistance_2: "Betrayed Everyone"
