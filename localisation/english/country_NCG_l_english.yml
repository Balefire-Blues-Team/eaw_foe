l_english:

##################
### FOCUS TREE ###
##################

 NCG_wartime_pre: "Our Wartime Predecessors"
 NCG_wartime_pre_desc: "The Great War was one of the best things to ever happen to us. The economy was booming, profits were seemingly endless, and worker protection laws went all but entirely unenforced. However, it wasn't to last. On that fateful day that the megaspells detonated across Equestria, so many countless investment portfolios crashed, and so many of our shareholders died. The economy was in tatters. Now, we have gathered up our wealth and we stand poised to once again become the economic heart of this blasted Wasteland."

 NCG_profit_stop: "The Day Profit Ended"
 NCG_profit_stop_desc: "That day was a true reckoning. There were few customers in the immediate aftermath of the War, the profit margins were virtually nil. However, we did not let this stop us. The good Guilds saw the suffering around them and became determined to create a bastion of economic freedom, which was the only way out of the mess left by the apocalypse. Rebuilding begins with money. This, we ponies and griffons can surely come to an agreement on."

 NCG_200_rebuild: "200 Years of Rebuilding"
 NCG_200_rebuild_desc: "It has been two centuries since then and we did not spend that time in idleness. No, we have been hard at work rebuilding all that was lost, driven by that same determined work ethics that once drove us to create some of the largest corporations to have ever existed. One day, our process of rebuilding this delicate network of trade, assets, and a loyal customer base will be completed. Only then will we be satisfied. For now, we rebuild and bide our time."

 NCG_board_meeting: "Meeting of the Board of Directors"
 NCG_board_meeting_desc: "Every four years, the highest ranking members of upper-management within each Guild meets. They are collectively known as the Board of Directors, and are those ponies tasked with always making sure that the cogs of profit continue to turn. Even the most powerful and most efficient machine needs a strong guiding hoof to make sure it all functions. Perhaps, then, our Board of Directors serves the true purpose of being our guides in this era of risk and profit."

 NCG_issue_caps: "On the Issue of Caps"
 NCG_issue_caps_desc: "The Greater Wasteland Market is known for having a singular common currency, that being the bottlecap. Though we often still use the old Equestrian bit within our domestic market, every deal made with those outside of Neocastle is done using only caps. While this has thus far served to enhance our profit margins considerably, some concerns have been made regarding this rogue currency and the consequences that could be faced if we continue to rely heavily upon it."

 NCG_stance_fillydelphia: "Our Stance on Fillydelphia"
 NCG_stance_fillydelphia_desc: "Long ago, the city of Fillydelphia was transformed by necessity into a major industrial hub dedicated to pumping out a constant stream of weapons, supplies, and goods to keep the war effort marching forward. Though it lost this reputation following it being blown to Tartarus, the efforts of one innovative stallion by the name of Red Eye resulted in the city being partially restored within recent history. Smog once again stretches up into the sky as the mighty factories churn out their products once more. Unfortunately, this has made the city into a sizable competitor to our own operations, and we must decide how to handle this rival moving forward."

 NCG_how_to_workers_rights: "A Matter of Worker's Rights"
 NCG_how_to_workers_rights_desc: "A common perception among the upper-ranking ponies within Neocastle's society is that the largely impoverished masses at the bottom of the vast machine of profit are there for a reason. Namely that they are simply just not as industrious nor as talented as those at the top. After all, if they were, they would be able to climb the ladder of their own merits like so many have before them. As a result, there is no pressing obligation to provide them with anything, least of all any semblance of respect. However, there also exist some who, for one reason or another, advocate for a softer approach when approaching those of lower status. What form this takes varies widely, but there are rumors that even some of the highest ranking ponies within the Guilds may hold such sentiments..."

 NCG_corruption_problem: "Addressing Corruption"
 NCG_corruption_problem_desc: "Though it may be true that corruption generally renders our operations less efficient, it is also true that it is oftentimes the only method through which we can get things done. Better we get results than go around pointing hooves against those only looking out for their own interests, or so many within the Guilds believe. However, not everyone is so complacent, and some push for action to be taken against what they see as a severe problem within our nation."

 NCG_industry_mil_entagle: "The Military-Industrial Entanglement"
 NCG_industry_mil_entagle_desc: "The rather pitiful state of our security forces, especially when compared to the rapidly expanding arms industry, has raised questions regarding the wisdom of selling so many of our weapons to the same types of ponies who would plunder our land without hesitation. This has been a matter of heavy debate among the middle-ranking members of each Guild for a while now, but it has received relatively little attention from those at the top, who are just more than happy to continue reaping in the profits. Until now, of course."

 NCG_new_ceo: "Choosing a Director"
 NCG_new_ceo_desc: "The final issue always brought before the Board of Directors is the matter of selecting a single leader to be the figurehead of our nation. For the last several meetings, this has ended in a stalemate with the Trade Council being granted this position by default. However, the Guilds haven't held back in the slightest over the last few years, pulling every trick in their books to win this one crucial vote. With all three sides in this matter fully invested in achieving a position of power over the others, it remains to be seen who will come out on top."

 NCG_trade_supremacy: "Consumerism Uber Alles"
 NCG_trade_supremacy_desc: "Our way of life is defined by the relationship of a pony to the products of our corporations. Corporate wants more consumers, so long as products are on the shelves and there are little ponies who buy them, then our way of life is secured. The best way to serve society is through being employees by day and consumers by night. All ponies, regardless of who they are, can fulfil this purpose. Here, we safeguard the fundamental right to buy products free of the interference so common to the other parts of the Wasteland."

 NCG_make_a_deal_with_BOG: "The Bog Buyout"
 NCG_make_a_deal_with_BOG_desc: "To our northwest lies Froggy Bottom Bog, a large wetland that is considered of low strategic value to its neighbors. Though the ponies living there have largely reverted to tribalism over the centuries, a few bright-minded individuals among them have recently unified the land against those nations who they view as an impending threat to their way of life. However, they know as well as anyone that their lack of industry, infrastructure, and viable soldiers makes them easy-pickings for anypony so inclined. Let us offer them a solution in exchange for nothing less than their subservience."

 NCG_trade_with_MWY: "Tea in Mareway"
 NCG_trade_with_MWY_desc: "New Mareway is our largest immediate competitor, being host to a thriving economic scene. Their merchants and our own have been engaged in a fiery rivalry for generations now, often making every effort possible to undercut eachother. However, what if it didn't have to be that way? We will extend our hoof out in friendship to our eastern rival, out of the hope that they could become our eastern partner instead. After all, cooperation is far better for business within both of our nations."

 NCG_pan_azuria_supply_chain: "Envision Pan-Azurian Supply Chains"
 NCG_pan_azuria_supply_chain_desc: "Though we are blessed to be within one of the most profitable regions within all of post-war Equestria, there are still countless natural obstacles to trade. Forests, mountains, and vast fields of nothingness all make long-distance trade difficult for all but the most well prepared caravans. However, we believe that it doesn't have to be this way. The future could be one with countless toll roads, thriving privatized canals, and maybe someday even a railroad to charge for the use of. With a little bit of investment, previously unheard of levels of trade could flow as our profit margins rise."

 NCG_froggy_bottom: "Subsidize BogWoods(TM) Industry"
 NCG_froggy_bottom_desc: "Our subsidiary has done admirably thus far, but there is no shortage of operational problems facing them within the confines of such a vile bog. To help them overcome the natural hurdles which have been thrown before them, we will secure for them a sizable subsidy. With it, we hope for them to expand their operations in spite of their environment. It is our hope that they will someday be worthy of calling themselves a Neocastle-backed corporation."

 NCG_smaller_duchies: "Approach the Dukes and Counts"
 NCG_smaller_duchies_desc: "The decentralized nature of New Mareway's feudal system might have held back their industry, but for us it's nothing but an asset. We can play the different nobles against eachother to get better deals, and even sponsor the ones friendly to us, so that we gain more influence over their nation."

 NCG_unequal_treaty: "The Unequal Treaty"
 NCG_unequal_treaty_desc: "Now some would say our methods of signing unequal treaties may be objectionable but our response should always be to slap some sense into them. A proper businesspony always understands when to take advantage of a deal and to make it work in their favour. If the results disproportionately favour us, then they should have hired a better negotiator. Simple as that! We even have plenty of negotiators to hire out as consultants! Such is the art of the deal. Of course, our subsidiary may not agree with us on that, but isn't that just even more evidence that we should directly oversee their operations in order to ensure maximum efficiency?"

 NCG_market_strategy: "Dynamic Generation of Market Altering Strategies"
 NCG_market_strategy_desc: "Though the Mechanicum has often held a monopoly over the field of computing within our nation, that doesn't mean that we haven't been able to secure a stash of advanced electronics for our own usage. With a few discrete deals and a bit of well-greased hooves, we could even secure a few of the Engineers to work under-the-table for us on this project. The purpose of this aforementioned project? To design an AI specifically for the purpose of manipulating the market to ensure we always come out on top."

 NCG_company_rearrangement: "Retire Unproductive Managers"
 NCG_company_rearrangement_desc: "The Builder's Guild employs a great many ponies, far more so than even our peers within the nation. It is inevitable that some of these ponies may, for one reason or another, simply be unfit for performing the tasks expected of them. Laziness, incompetence, and simple disability from age all plague the ranks of our middle management. Not only does this reflect poorly on us, but it also is often the source of a great deal of stress among those under them. Though we can't just terminate such a large number of personnel, we could 'encourage' them to willingly resign."

 NCG_meritocratise_hiring: "Meritocratise Low-End Positions"
 NCG_meritocratise_hiring_desc: "For a long time now, we have relied on mostly unskilled uneducated indentured workers as our menial labor personnel. Though this has seen some success, it is unfortunately also very inefficient. In order to ensure a more motivated and skilled baseline for our Guild, we will begin to phase out the less talented servants and offer incentives for those who show actual work ethic."

 NCG_disinterminate_corpo_command: "Disinterminate Corporate Chain of Command"
 NCG_disinterminate_corpo_command_desc: "Though proper bueracratic processes are necessary to the efficient functioning of any large company, it is undeniable that our Guild has perhaps taken it a bit too far. Our ponies often need the approval of numerous higher managers in order to move forward with the simplest of tasks, reducing overall efficiency and creating a production bottleneck within our structure. Well, no more! We shall set about fixing this problem immediately by slashing unnecessary protocols and putting a greater deal of trust in our on-ground personnel. Sure, this could cause a few problems here and there, but the increased productivity is more than worth it."

 NCG_synergy_employee: "Synergistic Hiring Methods"
 NCG_synergy_employee_desc: "If there is one thing that is crucial in ensuring operational efficiency, it is teamwork. Something which is sadly lacking within our Guild. We have near incentivized the recruitment of cutthroat ponies interested only in furthering their own goals for a long while now and it is time we bring an end to this. From now on, we shall weigh the compatibility of each new employee we hire or promote with our existing team to ensure that we can remain as functional as possible."

 NCG_crack_down_corruption: "Crack Down on Middle Management Corruption"
 NCG_crack_down_corruption_desc: "Our Middle Management has become a veritable cesspool of corruption, often going out of their way to provide favors for their friends and forge under-the-table deals with other ponies to rise further in the ranks. In order to tackle this issue, we will simply get rid of those most corrupt, as an example for the remainder. Anyone that has charges of corruption brought against them will henceforth be re-assigned to serve in Corporate Security as a basic grunt. Maybe their act will be cleaned up after a bit of hard work out in the field."

 NCG_blood_rnd: "Expanding Research and Development"
 NCG_blood_rnd_desc: "Though we are certainly far greater than the many primitive tribes that dot the Wasteland, we still are lacking when it comes to technological prowess. What kind of company would we be if we didn't make every effort to remain competitive within this field?"

 NCG_housing_employ: "Allow Employees to Vote for Management"
 NCG_housing_employ_desc: "Now that we have gotten rid of many middle-management ponies in our corruption-purges, it is time we fill those positions again. We will give our employees the illusion of democracy by letting them elect ponies to these rather meaningless positions, both creating a stronger family identity within the Guild and ensuring that those elected must maintain at least the illusion of being effective. Of course, we will ensure that no potential trouble-makers manage to be elevated by this system."

 NCG_model_employ: "The New Model Employee"
 NCG_model_employ_desc: "The other Guilds may be content with a lazy inefficient work force that cares less about their jobs than their employers, but not us! Within our Guild, there is a strong sense of pride from the lowest ranks to the highest, with each and every pony being reminded constantly that their work truly matters. Let us work as one big corporate family towards our shared goal of peace, prosperity, and profit."

 NCG_define_consumer: "Defining Consumers"
 NCG_define_consumer_desc: "Consumer: Anypony who we can market and sell goods or services to. Potential Consumer Population: The entirety of Neocastle and beyond. With this in mind, we will begin marketing to just about every demographic we can think of. Employees, rivals, raiders, tribals, slavers, and even Talons are all nothing but potential customers. We'll sell to any and all, so long as they have the money to pay for it."

 NCG_nation_for_sale: "Nation for Sale!"
 NCG_nation_for_sale_desc: "With our investments made and our market operations expanded, we have successfully maximized our profit margins. However, as an unfortunate consequence of this, we are running out of options to further increase our potential revenue. Thankfully, the Builder's Guild prepared a plan for just this scenario! We will put our very nation itself on the table, making the greatest transaction in the history of capitalism!"

 NCG_equestrian_copyright: "One Equestria Under Copyright"
 NCG_equestrian_copyright_desc: "With our company reformed and our trading steady, now is the perfect time to pursue corporate growth. Over the horizon is limitless opportunity, all sorts of new profitable markets, and an endless supply of potential customers. Though the risks are many, they are few in comparison to the money we stand to make."

 NCG_trade_with_appleloosa: "Sell Sand in the Desert"
 NCG_trade_with_appleloosa_desc: "How does one sell sand to ponies with an endless supply of it under their hooves? The answer is simple: All we must do is convince them of the merit of our sand. After all, it is the finest sand from across the entire Wasteland, ran through a aerial-motion purification process multiple times in order to ensure only the most refined grain. You can't find finer sand anywhere else."

 NCG_trade_manehattan: "Caravans to Manehattan"
 NCG_trade_manehattan_desc: "Manehattan is a previously untapped market full of limitless potential. From the luxury customers of Tenpony to the lower-class customers of Friendship City, there is no shortage of potential trading partners within the Heartland's largest city. It's time to move into this exciting new market and meet any needs they may have."

 NCG_everfree_aquisition: "The Everfree Coup"
 NCG_everfree_aquisition_desc: "Though Red Eye tried his hardest to tame the wild Everfree Forest, he was unable to completely suppress the endless hordes of monsterous creatures, violent flora, and surprisingly well organized hellhounds. They have continued to be a thorn in Fillydelphia's side, fighting tooth and claw against them from within the expanse of the southern Everfree. Fortunately for us, this war of attrition has left the mob of monsters in a greatly weakened state. With their demise at the hooves of Fillydelphia growing ever closer, we can't help but wonder if the hellhounds may be civilized enough to sign a contract with the lesser evil..."

 NCG_everfree_integrate: "Train the New Employees"
 NCG_everfree_integrate_desc: "Our newest employees have proven to be equally eager and loyal to serve our corporate interests. That being said, hellhounds aren't exactly known for their ability to hold a 9 to 5 job. Fortunately, with a bit of training and plenty of incentives, we believe we can whip them into being the very image of star employees."

 NCG_sub_companies: "Form Company Sub-Divisions"
 NCG_sub_companies_desc: "It's long past time that we face the hard truth of the matter: There is simply too much land in Equestria for us to hold it all. The Heartlands alone is a vast region, with far more customers than we could ever dream of meeting the needs of. Fortunately, Brick believes he's devised a solution. Rather than trying to forge one vast corporation that handles everything, we could instead create many individual specialized companies that operate on a more local level. In this way, we would both be reinforcing our ability to meet varied consumer needs and making it far easier to handle a greatly expanded employee base."

 NCG_azure_management: "New Management in Azuria"
 NCG_azure_management_desc: "Raiders playing at nation building are no substitute for good and proper civilization. It's about time we seek to free the markets of the Azurian region through aggressive market expansion against the local monopoly. We do this not just for the sake of our own profit margins, but for the good of the consumers themselves. Only through us can wealth flow freely down the river."

 NCG_everfree_management: "Expand Everfree Holdings"
 NCG_everfree_management_desc: "Our operations in the southern Everfree have thus far proven successful. The natural course of action to expand upon this revolutionary strategy by pursuing further expansion into the rest of that dreadful forest. It is our hope that the hellhounds under our employ will prove to be very useful when it comes to convincing the rest of their kin as to the merits of a proper wage."

 NCG_from_citizen_to_employee: "Corporate Expansionism"
 NCG_from_citizen_to_employee_desc: "With our new holdings secured, we can now undergo the process of consolidating our control over our newly expanded customer base. Let the money flow as we enter a new age of capitalistic success. What is but one small expansion today will lay the foundation for our domination over the entirety of the Heartlands tomorrow!"

 NCG_corporate_takeover: "Hostile Takeover of New Mareway"
 NCG_corporate_takeover_desc: "Many of our efforts have been leading up to this moment. The time has come at last for us to expand out to the sea. All that stands in the way of our eastward market expansion is the feudal state of New Mareway and their raider rivals to the north. Fortunately, we now stand ready to deal with both of them in one fell swoop and secure our market dominance over the entirety of the Amethyst Basin."

 NCG_feudo_corpo: "Establish a Feudo-Corpocracy"
 NCG_feudo_corpo_desc: "While we may take issue with many of the feudal traditions of New Mareway, we can't deny that some aspects of their system worked remarkably well. We may not be nobles, but 'Lord Manager' has a nice ring to it. To help usher in this new reform and to aid in rapidly integrating our new holdings, we will offer positions in upper management to many of the former nobles who have found themselves reduced to luxury customers under our occupation."

 NCG_raider_employment: "Employment for the Raiders"
 NCG_raider_employment_desc: "Raiders are simply misguided and uneducated survivors who haven't been afforded the same opportunities as civilized ponies. Well, no longer we say! From this day forward, the Brick-Rehabilitation Foundation will seek to provide charitable aid to any and all disenfranchised criminality-oriented ponies who just need a chance to turn a new leaf in life. Of course, those who refuse this generous offer of help will be sent off to work in one of our many mines for the remainder of their vastly shortened lives."

 NCG_neo_conglomerate: "The Neocastle Conglomerate"
 NCG_neo_conglomerate_desc: "Our company is vast and our profits even vaster. When Brick set out to reform the Guilds into something truly worthy of their heritage, he never could have dreamed of the success which we have now achieved. Nothing will stand between our newly supercharged brand blueprint and the near endless wealth that is now within our grasp."

 NCG_ceo_bonus: "Massive Bonuses All Around"
 NCG_ceo_bonus_desc: "We've put in the work, now it's time to reap the rewards. In response of the continued diligence of our most beloved personnel, we have decided to give out large bonuses to those who our Guild relies on the most: Our Vice Presidents. If they wish to remain competitive employers, it would be for the best if the other two Guilds similarly rewarded their own higher ups."

 NCG_employee_slaves: "Buy Out the Debt"
 NCG_employee_slaves_desc: "So many ponies within our fair nation labor away towards the impossible, kept going by nothing more than a faint hope that their foal's foals may finally be free of the crippling debt which has kept them down for so long. We say, no longer! The time has come for us to end this barbaric practice of indentured servitude, to remove the artificial monetary shackles forced upon our less fortunate. Effective immediately, the Miner's Guild will assume the debts of each and every one of those poor souls. Of course, by owning their debts, we also own them as well. It is only right that they work for us, to repay our endless generosity and benevolence."

 NCG_maximum_suppression: "Preemptive Security Measures"
 NCG_maximum_suppression_desc: "Ever since the disbandment of the Security Guild, our asset protection strategy has been largely reactive rather than proactive. Movements like the accursed Union were able to brew and simmer right under our noses, ultimately leading to the situation in West Amethyst. Well, no more, we say! The time has come for a drastic change to our security strategy moving forward, with a far larger focus on catching potential threats long before they grow into a crisis."

 NCG_utilize_corruption: "Greasing Hooves"
 NCG_utilize_corruption_desc: "Money makes the world go round. This is a truth that has formed the foundation for our very way of life. Why should we shy away from this fact in some misguided attempt to 'tackle corruption'? If our ponies are motivated by wealth and wealth alone, that just makes them successful and everypony else poor. The time has arrived for us to recognize that bribery is a perfectly valid business venture and source of revenue."

 NCG_send_mines: "Expand the Mines"
 NCG_send_mines_desc: "Our recent 'reforms' have left us with far more ponies than our current facilities can handle, creating a bit of an unemployment crisis. Fortunately, the mines can always use more able-bodied ponies to drive us ever further into the depths. So long as we can keep workplace accidents at an acceptable level, our enlarged employee base will fuel our mining expansion for decades to come."

 NCG_increase_quota: "Strictly Enforce Quotas"
 NCG_increase_quota_desc: "It seems the ponies who we have graciously assumed the debts of are near entirely ungrateful towards our efforts. Day after day, they slack off on the job and fail to meet their quotas. It's time we beat some sense into these rabble and remind them of the consequences of failing to meet expectations."

 NCG_chance_slavery: "A Chance to Escape Poverty"
 NCG_chance_slavery_desc: "Nopony likes to be poor, and yet most ponies are. We will present one additional chance for those ruthless and uncaring enough to take it: Join Equine Resources to earn a decent living wage, while also being able to lord your influence over your lessers."

 NCG_tap_into_slavetrade: "Tap into the Slavetrade"
 NCG_tap_into_slavetrade_desc: "Slaves are traded like any other commodity across the Wasteland. It's a previously untapped market, one which we could benefit greatly from but have always held back from expanding into. Now that we have cast aside our petty 'moral' concerns regarding owning thinking beings, we can finally embrace one of the oldest industries in the Wasteland."

 NCG_young_workers: "Make Slavery the Centre of the Economy"
 NCG_young_workers_desc: "Employees are a messy affair, what with their contracts and 'pony rights'. Instead of relying on these rather unreliable ponies, it's time for us to harden our industry by phasing out free-personnel in favor of slave assets. They will work until they drop and they won't complain if they know what's good for them. What more could we possibly want in a worker?"

 NCG_dig_deeper: "Dig Ever Deeper"
 NCG_dig_deeper_desc: "The riches of the earth are within our reach. We shall dig ever deeper, scouring more and more until our hoards rival even those of the mightiest dragons. Copper, iron, silver, gold, gems, and much more shall be ours! Keep digging! Deeper!"

 NCG_engine_war: "Begin Chemical Weapons Manufacturing"
 NCG_engine_war_desc: "With our industrial capabilities increasing by the day, we can begin producing more 'interesting' kinds of weapons. Chief among them are several variants of chemical weapons, mostly poisonous gasses, which were used to great effect by the zebras in the Great War.\n\n§ROthers may see it as an atrocity, but this is simply efficient!§!"

 NCG_pact_bloodmane: "Propose a Pact to Blood Mane"
 NCG_pact_bloodmane_desc: "Like ourselves, Blood Mane seeks to overthrow the order of New Mareway, and while we may have different end-goals, we can still work together to see [MWY.GetLeader] brought down! We will approach the Bloody Army with an offer:\nWe will enter into a non-aggression pact and send them some weapons-schematics, while they send some of their experienced soldiers to train our army."

 NCG_take_out_mwy: "Seize the Riches of Mareway"
 NCG_take_out_mwy_desc: "The time has come for us to deal with the greatest threat to our rule. The resource-rich lands of New Mareway and all of their wealth shall be ours. This shall be our greatest moment, the battle that will define our nation moving forward. March, for profit!"

 NCG_moving_central_basin: "Re-Arrange the Central Basin"
 NCG_moving_central_basin_desc: "The Central Basin is full of valuable gems, which are necessary to fuel our arcane industries. However, it is also full of ponies who seek to resist our rule at every turn. Perhaps we could have our cake and eat it too if we just send those who resist us deep into our newly obtained gem-mines? At very least, it'll shut up their ceaseless complaints."

 NCG_integrate_mwy: "Dealing with the Peninsula Nobles"
 NCG_integrate_mwy_desc: "In order to properly rule these populous new lands, we will have to integrate the local nobility into our ranks. Many have suggested adopting a §RFeudo-Corpocracy§!, mixing New Mareway's stable but slow feudal system, with our own efficient but small corporate administration. An important step towards this will be granting the nobility official positions within our Guild. This will go a long way towards integrating our newly conquered lands."

 NCG_bloody_treachery: "Bloody Treachery"
 NCG_bloody_treachery_desc: "Now that Blood Mane's crew have served their purpose, there is little stopping us from making our company policy towards raiders very clear. There is no room for bloodthirsty psychopaths in our nation."

 NCG_bloody_enslavement: "J.E.B.'s Raider Rehabilitation Program"
 NCG_bloody_enslavement_desc: "We are a reasonable and civilized people. We respect that raiders are ponies too, no matter how bloodthirsty or vile. As a result, it would only be right for us to give them a chance to redeem themselves through hard work. Only through their blood and sweat will they become proper ponies once more."

 NCG_integration_skills: "Uniting the Realms"
 NCG_integration_skills_desc: "Just as New Mareway is no more, so too is Neocastle a relic left in the past. We have become something greater than a mere collection of Guilds centered around a single city. Through our hard work and effort, we have risen ever higher and become a new nation. One holding within it the best qualities of our parts. This has already happened, but now we shall make it official. Neocastle is dead. Long live Neocastle-Mareway!"

 NCG_enslave_bog: "Enslave the Bogponies"
 NCG_enslave_bog_desc: "The bogponies are a backwards bunch of savages. They have plentiful disease, but little else of note. Despite our disgust towards their way of life, we can't deny that we are always in need of more able bodies to facilitate our industrial expansion. At least they should be an easy target."

 NCG_enslave_pbn: "Tame the Savage Plains"
 NCG_enslave_pbn_desc: "The plains to the west may not have an excessive amount of resources, but they are a strategic point that could allow us to push further into the region. Therefore, it would only be reasonable for us to secure them under our control at our earliest convenience."

 NCG_enslave_gor: "Gorge Ourselves on the Gorges"
 NCG_enslave_gor_desc: "Gorgetown is a rather small nation bordering a minor river. This makes them an obvious target for our continued expansion, as it is unlikely that other Wasteland powers would object to us dealing with such a small country."

 NCG_enslave_evr: "Put a Leash on the Dogs"
 NCG_enslave_evr_desc: "The disgusting mutts that occupy the Everfree continue to be a blight on the horizon. J.E.B. can't even go to his vacation resort on the border of the Everfree without fearing the stench of their flea-ridden packs. It's long past time someone do something about that menace and finally bring the torch of civilization to the Everfree."

 NCG_enslave_rep: "Of Radishes and Republics"
 NCG_enslave_rep_desc: "The Republic is a relatively unimportant nation that is sitting atop a treasure trove of natural resources and fertile land. Land that will very soon be ours, to do with what we please. J.E.B. is already envisioning vast farms growing all sorts of crops, with which we can corner the food trade in the Wasteland."

 NCG_enslave_raf: "Colour Azuria Black!"
 NCG_enslave_raf_desc: "The Azureway stands as a natural divider between us and the southern Heartland. The time has come for us to seize control of the river's entire northern bank, securing it and by extension our territory against any who would seek to threaten us. Of course, the powers that be may be displeased by this, so we should express suitable caution."

 NCG_slave_finish: "Onwards, to New Profits!"
 NCG_slave_finish_desc: "It's hard to believe that just a few short years ago, J.E.B.'s dream seemed to be just that: Nothing more than the unrealistic goals of a starry-eyed corporate president with more money than sense. Now, he has turned his vision into a reality. Our lands stretch far beyond our traditional holdings, our wealth piles high enough to cover entire city blocks, and we have proven ourselves to be worthy rulers of the Equestrian Wasteland."

 NCG_magos_sunforge: "Trust in Magos Sunforge"
 NCG_magos_sunforge_desc: "Magos Sunforge has been a controversial figure within our Guild for a long time due to her eccentric obsession with a singular project above all others. However, her mind is undeniably brilliant and her loyalty unshakable. Perhaps she would be far more willing to work on a larger variety of projects if we were willing to finally entertain §OProject Starfury§!."

 NCG_black_market_tech: "§OHarness the Fires of the Sun§!"
 NCG_black_market_tech_desc: "For milennia ponykind has yearned for the stars, gazing from afar at those great focal-points of life and prosperity. Celestia herself once claimed power over the Sun, and she had the magic to back it up, but now the princesses are dead and the Sun is still moving on its own. Still, our fascination is not gone, and Magos Sunforge has quite the ambitious plan to bring the Sun to us..."

 NCG_precision_engineering: "Revive the Art of Circuit-Manufacturing"
 NCG_precision_engineering_desc: "We have salvaged and maintained complex circuits for generations, but actually constructing them is an art that was considered lost with the rest of the world. Fortunately, with the backing of both the Builder's Guild and Miner's Guild, we now find ourselves in a position to restore what was once lost and to start up a high-tech manufacturing industry once more."

 NCG_our_own_crusader_maneframe: "Building Our Own Maneframe"
 NCG_our_own_crusader_maneframe_desc: "In times long past, there existed immense terminals quite unlike any others which have ever blessed our mortal realm. The height of engineering and technology, these beasts of computing power were referred to as 'maneframes'. Though they were few in number, their contributions were no-doubt vital to the ongoing progress of Equestrian industry and science towards the end of the War. It would benefit us immensely to harness such a technological marvel for ourselves."

 NCG_liquidate_the_corrupt: "Liquidate the Corrupt, Literally."
 NCG_liquidate_the_corrupt_desc: "Bribery, blackmail, and even more insidious practices plague our land. It is unfortunate that we have been forced to resort to such measures ourselves in our rise to power, but now we stand in a position to do something about it. Effective immediately, any official caught accepting bribes or trading in 'favors' will be considered a traitor to their Guild and to Neocastle as a whole. The only suitable punishment for violating the loyalty clause of their contract is immediate termination of both employment and life."

 NCG_soylent_green: "Introduce §rP.A.R.S.N.I.P.§!"
 NCG_soylent_green_desc: "The §rPony-Adjacent Recycled-Sustenance and Nutrient-Ingestion Program§!, or PARSNIP for short, will alleviate the problems of supplying an increasingly urbanized and factory-bound population with enough sustenance to remain effective workers. It allows us to not only recycle certain types of industrial waste into foodstuffs, but also allows for the re-use of dead employee bodies to provide nutrients for the next generation!\nIt's not cannibalism if the pony is at least five steps removed from the finished product!"

 NCG_land_plenty: "A Land of Plenty"
 NCG_land_plenty_desc: "Our industry is booming now that corruption has been eliminated and the process of employees getting fed and trained has been 'streamlined'. We will utilize this wealth to invest into our future further, hopefully creating an exponential-growth spiral. A future of endless wealth awaits!"

 NCG_electric_wonders: "The Wonders of Network-Integration"
 NCG_electric_wonders_desc: "Terminals, cameras, machines, security systems, and far more can all be connected in one vast network to drastically increase our capabilities across a wide variety of fields. This has already been carried out within our own Forges, but now the time has come for us to put it to the test on a wider scale. Neocastle shall become the testing grounds for what may very well be the single greatest innovation since the end of the world. Let the information flow!"

 NCG_expand_network: "Rural Testing"
 NCG_expand_network_desc: "Some concerns have been raised regarding the efficiency of our network when applied to a more rural setting. Fortunately, we have no shortage of less populated land in our territory with which to use as a testing grounds for this. Each and every minor settlement will be connected into our vast network, bringing the wonders of the future to even our most remote citizens."

 NCG_seize_everfree: "Hazardous Environment Testing"
 NCG_seize_everfree_desc: "We are still working out the kinks, but we believe we have devised a strategy for effectively expanding our network infrastructure into a less hospitable region. The perfect testing grounds for this lie in the depths of the Everfree Forest, one of the most hostile regions in all of Equestria. First, we must seize control of a section of it for ourselves."

 NCG_dog_workers: "A Gift to the Miner's Guild"
 NCG_dog_workers_desc: "The Miner's Guild remains distant from us, hesitant to praise the immense progress we are making. Perhaps a gift would warm their attitude a bit. It just so happens that we now have under our control no shortage of large semi-intelligent dogs, who are greatly proficient at mining. What more could they hope for?"

 NCG_charcoal_woods: "The Everfree Charcoal Powerplant"
 NCG_charcoal_woods_desc: "It is now time to put our theories into practice. Firstly, we must construct an immense facility dedicated to turning charcoal into usable industry. This shall form the basis of both our network expansion and our strategy to deal with the ever-enroaching forest which resists us at every turn. If the Everfree wishes to stand against us, it shall be reduced to nothing more than fuel for our fires as our circuits stretch across the ash-ridden landscape."

 NCG_expand_bog: "Stretching Our Legs"
 NCG_expand_bog_desc: "As our population and industry expands, we find ourselves increasingly in need of more land to continue our efforts. The Builder's Guild believe they have identified a suitable target for our expansion, even if the landscape itself is of questionable stability. The Bog Hoppers aren't expected to put up much of a fight, making their land free real estate."

 NCG_resettle_bogponies: "Finding Capable Technicians"
 NCG_resettle_bogponies_desc: "Most of the ponies inhabiting Froggy Bottom Bog are in questionable state, both physically and mentally. Illiteracy rates are high, disease is rampant, and it is truly a wonder they managed to survive for so long prior to our intervention in the region. That being said, not all of them are a lost cause. We will find those who can pass a basic intelligence test and bring them back to Neocastle to be trained on how to repair and maintain machines. At least some use will be made of them."

 NCG_bog_productivity: "Subsidize Guild Expansion"
 NCG_bog_productivity_desc: "The Builder's Guild has been quick to try to expand into our newly conquered land, working on all sorts of projects aimed at making them profitable. However, the time scale for these projects is unacceptable. In order to speed things up, we will reallocate resources and funding towards their efforts so that they may successfully expand at some point in our lifetimes."

 NCG_abduct_ponies: "Encourage 'Non-voluntary Immigration'"
 NCG_abduct_ponies_desc: "Though our reach stretches beyond our traditional borders, the heart of our power remains back in Neocastle. We will 'encourage' all those who we believe to be potential trouble-makers to relocate to those lands which have already felt the embrace of our ever-expanding network. There, we can keep a very close eye on them and handle any dissent long before it becomes a problem."

 NCG_new_relays: "Consolidating Control"
 NCG_new_relays_desc: "With our new lands tamed and those within them firmly under our iron-hoofed control, we can finish the subjugation of them and expand our operations freely across their former lands. This is but one small step towards our ultimate goal of achieving a new future for the Equestrian Wasteland, one driven by profit and progress in equal measure."

 NCG_magos_ferrofall: "Empower Magos Ferrofall"
 NCG_magos_ferrofall_desc: "Magos Ferrofall is our leading expert on all things relating to pony-based assets, from how they think and react to their overall driving motives. He has proven crucial in keeping our menials operating at peak efficiency, along with providing suitable incentives for advancing through our Guild. Now, it is time to spread his influence across each of the Guilds so that all equines within our nation may be managed with utmost efficiency."

 NCG_ferro_cyber: "§RThe Secrets of Fillydelphia§!"
 NCG_ferro_cyber_desc: "We have substantial reason to believe that the so-called 'Cathedral' deep within the Everfree is home to the most advanced cybernetics research program in Equestrian history. Fortunately, that mighty fortress is not so impenetrable as its inhabitants would otherwise believe. A full well-placed bribes and a careful smuggling operation should be enough to get some of the information contained within into our hooves."

 NCG_decrypt_files: "Decrypt Files"
 NCG_decrypt_files_desc: "While we now hold cybernetics that are decades ahead of our own, the holotapes that came with them are heavily encrypted. Without the information contained on them, it will take a great deal longer to reverse-engineer this technology. To avoid having to go through this process, we will focus our efforts on breaking the encryption and getting at the valuable data stored within."

 NCG_project_talos: "Launch project §P'TALOS!§!"
 NCG_project_talos_desc: "Now that we have knowledge of Stable 101's cybernetics-program, we can built upon it. While their creations are impressive, they are also prohibitively expensive and seem to put an over-emphasis on aesthetic. We will design new-model cybernetics that will be easy to produce, require mostly common materiels, and simply don't care about looking 'intimidating'. Magos Ferrofall, himself already a cyberpony, has mandated his entire department undergo cyberization by the end of the year."

 NCG_enhance_workers: "Lobotomize Unproductive Workers"
 NCG_enhance_workers_desc: "With the department of Equine Resources cyberized, and the higher-ups of the Mechanicum Guild supportive of our endeavors, we will begin mass-lobotomies of menials failing to meet their quotas. This procedure should remove their drive to rebel or feel strong emotions in general, and make them ideal candidates to receive cybernetics as well, to improve their lacking performance. They'll have to go into company debt to pay for those cybernetics, but they won't be capable of comprehending that fact."

 NCG_enhance_soldiers: "Cyberize Company Security"
 NCG_enhance_soldiers_desc: "Our cyberization-program has shown great results, and although many within our country are starting to doubt the sanity of the Magi, Ferrofall is determined to spread cyberization even further! Next on his list is our security forces, who could really use some 'upgrades'. You don't need to carry a weapon if you ARE the weapon after all. Also, it will be very convenient if we are the only suppliers of life-saving cybernetics maintenance for our army, virtually guaranteeing their continued subservience."

 NCG_flesh_steel: "§FFlesh§! and §gSteel§! in §NHarmony§!"
 NCG_flesh_steel_desc: "As of the end of last quarter, over 10% of our entire population has some sort of cybernetic implant in their bodies. We will have to move slower from now on, as manufacturing capabilities are reaching their peak potential efficiency, and outsourcing is not an option. So instead of producing more, we will introduce a new generation of cybernetics that are much more long-term compatible (and also kill you upon removal) with organic bodies. Soon, we will be the most efficient nation in this blasted Wasteland!"

 NCG_smoke_steel: "From §AThree§! to §ROne§!"
 NCG_smoke_steel_desc: "The Builder's Guild is spread thin, kept busy trying to manage far more land than they have the personnel to oversee. The Miner's Guild has grown content, bloated on their newfound wealth. Both are blind to the reality of their situation. Day after day, more of their personnel become augmented. Quarter after quarter, those under their command become increasingly reliant upon us. We are the future, the only possible way forward for Neocastle and ponykind as a whole. It is time that they submit to our rule or face their ultimate demise."

 NCG_our_tendrils: "Priority: §RExpand Reach§!"
 NCG_our_tendrils_desc: "Now that the lesser Guilds have been dealt with, there is nopony left to object to our decrees. The first order of business will be to expand our operations outwards, as we will need a far greater deal of resources if we wish to truly bring about the future of our dreams. From east to west, all is ours for the taking."

 NCG_eat_mareway: "Objective: §GSeize Eastern Peninsula§!"
 NCG_eat_mareway_desc: "New Mareway has stood as a proud relic of tradition for centuries now. They see themselves as the followers of a tried and true system, a Kingdom to last for centuries more. The truth is that they are ignorant. From the most miserable peasant to the fattest noble, each and every one of them is blind to the realities of the world. They are so trapped in the past that we have little choice but to drag them into the future."

 NCG_find_intelectuals: "Amendment: §CSecure Local Intellectuals§!"
 NCG_find_intelectuals_desc: "Though the nobility and commoners alike may be a lost cause, there are some within this miserable feudal nation that could have their eyes open. The intellectuals, whether they be local alchemists or noble wizards, may be bright enough to see the merit of the world in which we wish to create. With time, they could even be integrated into our ranks."

 NCG_kill_era: "Amendment: §CSuppress Irregular Combatants§!"
 NCG_kill_era_desc: "Organized raiders on a wide scale stand as a sort of paradoxical force. How can an organized entity based on stealing, murder, and war manage to grow large enough to consider itself a nation? It boggles the mind. Unfortunately, though they are a valuable resource for sociological research, they are also an active threat to our operations. As a result, we are left with little choice but to liquidate them."

 NCG_amethyst_unity: "Conclusion: §rAmethyst Basin Pacified§!"
 NCG_amethyst_unity_desc: "Many sought to stand against us, from barbaric savages playing at being knights to even more barbaric raiders trying to build an empire on a mound of bodies. How foalish they were to oppose us, for the conclusion of our conflict was reached long before our first soldiers stepped foot over the flimsy excuse they called borders. Now, we stand as the last remaining force in the Amethyst Basin. As it should be."

 NCG_annihilate_pbn: "Objective: §GAnnihilate Western Threat§!"
 NCG_annihilate_pbn_desc: "The further west one travels, the more clear it becomes that the torch of civilization was snuffed out by balefire. Tribalistic gangs, mercenary warlords, and inhospitable hellscapes await those who dare brave those untamed lands. Most would seek to avoid that entire region as if it were a necromantic plague. Fortunately, we are not like most, and we shall instead march forward with the full intent to civilize that which has been damned."

 NCG_annihilate_gor: "Amendment:\n§CCleanse Gorges§!"
 NCG_annihilate_gor_desc: "Quarry eels are disgusting and dangerous creatures, leaving us baffled as to why anypony would think living around them would be a good idea. Regardless, Gorge Town stands as a monument to both ponykinds perseverance and stupidity in equal measure. They will be far safer under our benevolent rule than they currently are, liable to meet the end of their days simply because an eel is having a bad day."

 NCG_annihilate_fta: "Amendment: §CExterminate Talons§!"
 NCG_annihilate_fta_desc: "The Talons are often more akin to wandering warbands than anything else, moving from contract to contract with nothing more than profit on their minds. However, a few key exceptions do exist across the Wasteland. One of these groups has been held up for a long while now in an old wartime bunker, ruling over a hostile land for reasons only they know. It's long past time somepony teach these mercenaries to stick to their original profession."

 NCG_west_secure: "Conclusion: §rSummerdale Fully Subjugated§!"
 NCG_west_secure_desc: "The western region has been brought firmly under our control. With the ponies of that wild land subjugated, we are now free to see to the exploitation of their natural wealth. Anything of value will be secured, any able-bodied ponies will be put to work, and we will ensure that our newly conquered lands operate as efficiently as possible."

 NCG_fight_NCR: "Priority: §REliminate Azurian Menace§!"
 NCG_fight_NCR_desc: "The Azureway stands as a natural divide between north and south. It is an obvious border for us to hold, allowing us both a strategic defence point and greater access to a valuable trading route in the form of the river. The current inhabitants are unlikely to freely welcome our rule, but since when have we put much stock in free will?"

 NCG_wrap_wires: "§ATo Wrap the World in Wires§!"
 NCG_wrap_wires_desc: "Through fire and war, we have proven our ideas time and time again. Tribals and their spirits could not stand against us. The other Guilds bent to our will. All manners of society, from feudal kingdoms to representative republics, have been forced to bow to us. There is only one possible conclusion to draw. It is the fate of the world to submit to our system, to be wrapped within the tender embrace of our grand network. The future will not be one of misery, slavery, or death. The future will be one of wires."

 NCG_company_security: "Begin Rebuilding Company Security"
 NCG_company_security_desc: "Our security team has been sorely lacking for a long time now. This was fine back when we could pay off any hostile competitors, but due to the ever-changing conditions of modern markets, we are forced to consider investing more heavily into asset-protection."

 NCG_flying_survey: "Flying Surveillance"
 NCG_flying_survey_desc: "We are forced to keep our eye on many ponies, both within our own market and outside of it. Personnel and consumers alike pose a potential threat to our operations, leading to the need to constantly monitor them. Towards this end, we will invest in aircraft to maintain an eye in the sky at all times. Only in this way can we avoid being caught unawares."

 NCG_airport_rapids: "The Rapids Airport"
 NCG_airport_rapids_desc: "Back during the War, Azure Rapids was home to the Azureway Regional Airport. Though it has been left in disarray after two centuries of neglect, it would still be entirely possible for us to restore it to working condition with enough effort."

 NCG_wartime_aircraft: "Wartime Aircraft Manuals"
 NCG_wartime_aircraft_desc: "Even the Mechanicum Guild's knowledge of aircraft is lacking due to generations of inexperience. If we wish to further our knowledge of these flying machines and effective usage of them, we have little choice but to see about purchasing any manuals we can find that have survived since the fall of Equestria."

 NCG_sky_behemoths: "Airborne Compliance Enforcement"
 NCG_sky_behemoths_desc: "As our airborne operations continue to expand, new ideas have begun to be proposed regarding our aircraft assets. The most popular of these ideas is the concept of utilizing these assets towards aiding our ground operations through the relentless bombing of hostile competitors and disgruntled employees alike."

 NCG_air_standart: "Corporate Aircraft Standardization"
 NCG_air_standart_desc: "If we wish to further expand our air operations, we must devise ways to maximize production of our aircraft. Towards this end, we will invest in the development of cheap mass-produced parts for use in the construction of these flying machines."

 NCG_let_serve: "Increase Service Quotas"
 NCG_let_serve_desc: "Ever since the dissolution of the Security Guild, we have maintained our security personnel using a quota based system of recruitment and training. Unfortunately, these quotas have proven to not be enough to keep us competitive in the modern market. In order to improve our standing in relation to our market rivals, we must increase the quotas substantially to ensure that we have more security personnel ready to protect our assets."

 NCG_rely_mercs: "Outsource Security"
 NCG_rely_mercs_desc: "The truth of the matter is that we simply don't have enough personnel to maintain a large security force. Rather than forcing more employees to abandon their jobs and transfer to asset protection, we will instead invest our wealth in hiring professional third parties to see to protect our property and interests."

 NCG_gerwin_mercs: "Gerwin's Grenadiers"
 NCG_gerwin_mercs_desc: "The most common brand of mercenary within the Wasteland are the many different Talon organizations. One such organization operates in our local area and have proven to be reliable in the past for single-asset protection. Their leader, a griffon with an almost depraved lust for violence, would be more than happy to work for us in exchange for appropriate pay."

 NCG_talon_flyers: "Hire Dashite Instructors"
 NCG_talon_flyers_desc: "Dashites are a scarcity in the Wasteland, but they are far from unheard of. Indeed, our insider market-analysis teams report the presence of a sizable amount of these exiles hiding out in the bog to the north-east. It seems likely that they would be willing to work for us, provided we offer them both luxurious living conditions and protection from their former government."

 NCG_talon_aeris: "Aeris' Aeronautical Adventurers"
 NCG_talon_aeris_desc: "Aeris is a rather eccentric surface-born pegasus who has an obsession with aircraft. Blimps, planes, and cloudships alike are all within her domain, with her claiming to be an expert on all of them and more. With a sizable investment, her startup company could prove to be of great value to our nation."

 NCG_zerko_mercs: "Zerko's Zealots"
 NCG_zerko_mercs_desc: "Zerko is an odd sort, even for a zebra. It's hard to get more than a few words out of him at a time, but his band of 'legionaries' have earned a reputation for being some of the most skilled soldiers in the entire Wasteland. They won't come cheap, but the price is more than worth having such renown warriors serving our interests."

 NCG_duke_mercs: "Duke's Diggers"
 NCG_duke_mercs_desc: "Duke is exotic even among mercenaries, being one of the few diamond dog mercenary organizations out there. We have no doubt that his unique talents would be of great value to us. However, he demands payment in gems alone, meaning we will have to deal with the cost of importing them."

 NCG_rely_employ: "Internal Security Solutions"
 NCG_rely_employ_desc: "We must further expand the ranks of our security personnel if we are to ensure the safety of our assets, both domestic and within foreign markets. More personnel will be transfered into asset protection and retired personnel will be brought back into service, as instructors and officers alike."

 NCG_invest_weapons: "Invest into MEW-Research"
 NCG_invest_weapons_desc: "Magical Energy Weapons are among the most advanced weapons to have been designed by Wartime Equestria for single-pony usage. Investing in this technology would provide us with a substantial advantage over the competition."

 NCG_invest_doctrine: "Board-Sponsored Wargames"
 NCG_invest_doctrine_desc: "One thing money can't buy is actual battlefield experience for our commanders. At least not without finding a reliable supplier of pre-recorded memory orbs. Until such a provider can be found, we will instead have to rely on simulated drills to test our operational strategies."

 NCG_robot_gaps: "The Mechanical Enforcers"
 NCG_robot_gaps_desc: "Unlike ponies, robots do not question orders. They do not feel remose. And most importantly, they do not hesitate before putting a disorderly employee back in line. Machines are the future, within the fields of industry and security alike. It would do us well to invest in this future now, before our competitors beat us to the punch."

 NCG_the_new_budget: "Restructure the Security Budget"
 NCG_the_new_budget_desc: "Our security spending has been subject to endless amounts of bueracratic meddling for decades, causing their budget to be widely misappropriated. When it does actually go towards asset protection, it is often spent inefficiently and with far higher than necessary operating costs. Through an extensive audit and restructuring of our security team's financial office, we can cut back on costs considerably while ensuring that all the money spent goes towards the right place."

 NCG_whip_into_shape: "Enforce Standards of Conduct"
 NCG_whip_into_shape_desc: "Many of our security officers act as if they are Wasteland ruffians, with little respect for proper conduct. While we've tolerated this sort of behavior in the past, the time has come for us to put our hoof down and strictly enforce our Code of Conduct for all security personnel. No more crazed drug binges will be tolerated while on duty or within a security uniform!"

 NCG_best_money_equipment: "Heavy Infantry Weapons"
 NCG_best_money_equipment_desc: "There comes a time when standard guns simply won't cut it. We will invest in the development of heavier weaponry for use in those situations where excessive force becomes necessary force."

 NCG_focus_of_the_new_army: "Securing the New Age"
 NCG_focus_of_the_new_army_desc: "Our rivals grow stronger by the day and our assets are being increasingly threatened by our more aggressive competition. We have little choice but to pursue the further expansion of our security operations to remain competitive as we move into the future."

 NCG_azure_navy: "Fund the Neocastle Merchant-Navy"
 NCG_azure_navy_desc: "A sizable amount of our trade is conducted entirely through the Azureway River. As of late, our vessels on the riverway have been increasingly harassed by the many pirates operating in the region. In order to protect them and to facilitate further trade, we will seek to establish our own Merchant-Navy."

 NCG_navy_canou: "Start Small, Like a Canoe..."
 NCG_navy_canou_desc: "We can't just jump into having the biggest baddest ships around. First, we must refine our understanding of boat construction. Towards this end, we will begin experimenting with small vessels designed for rapid scouting."

 NCG_corporate_marines: "A Corporate Marine-Corps"
 NCG_corporate_marines_desc: "While our standard security officers may be invaluable in the protection of our land-based assets, they are sadly lacking when it comes to seeing to the safety of our sea-based ones. As a solution to this problem, we will invest in the training of high specialized officers meant solely for naval-based combat."

 NCG_hooves_deck: "Aquire Naval-Schematics"
 NCG_hooves_deck_desc: "Our ongoing expansion of naval operations has hit a wall due to difficulties in reverse-engineering more advanced naval components. In order to rectify this situation, we will engage in a targeted hiring campaign towards our competitors with the hope of hiring their top naval experts."

 NCG_navy_guns: "...Put Some Massive Guns on it..."
 NCG_navy_guns_desc: "Now that we've experimented a bit with ship design, our experts feel confident in beginning to direct our research towards ensuring engagement effectiveness for our vessels. The dominate line of thought for this is to put the biggest guns possible on our seacraft, so as to ensure they can take on any threat they may face while out on the water."

 NCG_navy_battleship: "...End Big, With a Battleship!"
 NCG_navy_battleship_desc: "We have the boats and guns alike down. Now, all that's left to do is to improve our boats and guns further, through making them bigger and even more effective. Our ships shall dwarf those of our competitors, ensuring we have a sizable advantage when it comes to naval operations."

 NCG_no_raiders_no_pirates: "No Raiders, No Pirates!"
 NCG_no_raiders_no_pirates_desc: "With our greatly increased naval capabilities, we have found our naval operations to be unmatched in terms of effectiveness. Pirates and competition alike fear the sight of our ships in the distance, for few can hold out for long under the roar of their cannons."

 NCG_focus_mobility: "Like §ORolling Thunder§!"
 NCG_focus_mobility_desc: "Our forces will advance rapidly and with a great deal of force behind them, overwhelming our opposition without giving them even the opportunity to resist. In this way, we will ensure that any threat-actors which arise are dealt with as efficiently and effectively as possible."

 NCG_motorize_forces: "New Age Caravans"
 NCG_motorize_forces_desc: "The days of relying on slowly-trotting brahmin to carry merchandise are coming to a close. The future lies in the development of vehicles capable of crossing vast stretches of the Wasteland within a relatively short time frame. Trade routes that once took a month to travel will be reduced to under a week or less, allowing trade to prosper. Additionally, these vehicles will be of great use in the rapid transportation of our security forces."

 NCG_air_land_coord: "Air-Land Coordination"
 NCG_air_land_coord_desc: "No matter how fast we move across the land, planes will always be faster. With this in mind, we will invest in the further development of airplane technology. Planes will respond first to any and all incidents, stalling threat-actors until our land-based forces can arrive."

 NCG_armour_support: "Standardize 'Collector' Class IFVs"
 NCG_armour_support_desc: "While civilian vehicles may work for the transportation of our security forces, the development of armored vehicles would go a long way towards maximizing their effectiveness in the field. We will invest heavily in development within this field, so as to ensure our brave officers are kept safe as they ride into battle."

 NCG_armour_tank: "Develop the 'Persuader' Tank"
 NCG_armour_tank_desc: "Sometimes, you just can't deal with a problem through conventional means. Bullets, lasers, and even small explosives alike may just not be enough. To solve this problem, we will create a new class of vehicle, one so powerful so as to render all but the most extensive fortifications useless against it."

 NCG_cas_break: "Project 'Enterprise'"
 NCG_cas_break_desc: "Air superiority is of little value if we can't do anything with it. With this in mind, some of our brightest air operation theorists have proposed a project aimed at extensively furthering the development of planes designed to rain explosives down upon our rivals."

 NCG_fast_as_wind: "Riding on the Winds of Profit"
 NCG_fast_as_wind_desc: "Few can hope to match our security forces response time. They arrive on-site with such speed that any potential threat-actors present can't even offer a response before they are apprehended or terminated. Finally, our assets have forces worthy of protecting them."

 NCG_focus_robots: "Like §RBurning Steel§!"
 NCG_focus_robots_desc: "What use is a thousand ponies when a thousand machines would do just as well in their place? An endless wave of steel and circuitry is the key to success. Any other strategy is nothing more than folly, the stubborn effort by organics to remain relevant in the field of warfare despite having long been rendered obsolete."

 NCG_drown_bullets: "Drown Them in Brass"
 NCG_drown_bullets_desc: "Light robots may lack the pure force behind some of the larger models, but with enough of them even the most heavily fortified positions can be overwhelmed. We will invest in the further creation of these highly mobile machines to ensure we always enjoy the advantage of numbers."

 NCG_repair_squad: "Dedicated Repair-Squads"
 NCG_repair_squad_desc: "Though organic forces may be largely obsolete within the realm of modern warfare, this does not mean they are entirely without purpose. Dedicated maintenance teams will ensure that our mechanical guardians remain in top shape, ensuring their continued combat effectiveness even after long-term deployment."

 NCG_task_robots: "No Rest, No Respite"
 NCG_task_robots_desc: "Unlike our rivals, our forces don't need to take breaks beyond for standard maintenance. They can work throughout all hours of day and night, remaining fully alert throughout their entire shift rather than growing less aware as organics tend to do. This alone proves their superiority, making them an obvious target for further investment."

 NCG_tech_superior: "Technological Superiority"
 NCG_tech_superior_desc: "Some ponies may dislike their role in the world being taken over by a robot, but this shouldn't be a deterent. On the contrary, it is all the more reason to pursue more advanced robots in order to further reduce the need to rely on inferior organic forces. The future is one of machines."

 NCG_bomb_stone_age: "Into the Stone Age"
 NCG_bomb_stone_age_desc: "Our competition will be beaten back, massacred, and defeated so badly that they are returned to a more primitive time. No matter how civilized they may believe themselves to be, our more advanced forces will put theirs to shame. We are truly the peak of ponykinds advancement."

 NCG_spearhead_troops: "The Loyalty of Machines"
 NCG_spearhead_troops_desc: "Ponies have second thoughts and concerns regarding the orders they are given. How can we ever trust a security officer who could turn against us at any moment, deciding that they would much rather fight for our rivals than for us? Fortunately, robots do not suffer from such doubts. They remain faithful and loyal at all times, dutifully carying out their orders with efficiency and precision. How can anypony hope to compete with the most loyal army in Equestria?"

 NCG_focus_defiance: "§FOne Thousand Citadels§!"
 NCG_focus_defiance_desc: "When our rivals arrive at our borders, they will find nothing but impenetrable walls to greet them. Behind these fortifications will await a force so determined to hold their position that they will not retreat until every last one of them has died. Through our stubborn refusal to bow down to any petty Wasteland army, we will become known far and wide for our security capabilities."

 NCG_special_explosives: "Invest in Specialized Explosives"
 NCG_special_explosives_desc: "Bullets alone won't win the day. Vast amounts of explosives, on the other hoof, might. Through the widespread deployment of explosives companies, we can ensure that our forces remain ready to deal with even the largest armies."

 NCG_covering_fire: "Maximize Bullet-Saturation"
 NCG_covering_fire_desc: "Single-shot slow-firing weaponry is all well and good, but they simply won't cut it for dealing with larger amounts of lightly armored infantry. For this particular threat, we will instead rely on rapid-firing weaponry capable of mowing down a large number of ponies within a short time span."

 NCG_expert_medics: "Reduce Officer Casualties"
 NCG_expert_medics_desc: "Nopony is allowed to die unless they are ordered to do so. Through investments in medical technology, we hope to reduce our unauthorized casualties substantially. So long as they can still hold a gun, they can still fight in the defence of our nation."

 NCG_clad_in_steel: "10-Bit Rangers"
 NCG_clad_in_steel_desc: "The Steel Rangers fancy themselves to be the most effective force in the Wasteland. Hiding within their power armor, they act as though they are completely invulnerable. Unfortunately for them, we have more than enough money to invest in our own power armor project. One which will allow us to field heavily armored soldiers on par with or even superior to their best."

 NCG_safecracker: "'Safecracker' Rounds"
 NCG_safecracker_desc: "There exists some armor too thick for standard rounds to penetrate. To address this issue, we will create heavier weapons capable of punching a hole through even the sturdiest of foes. Not even tanks will be able to withstand our fire."

 NCG_not_one_step_back: "Grind Them to Dust"
 NCG_not_one_step_back_desc: "Let our competition come. No matter how many their number, they will not put a single hoof on our land. Our forces will hold out until the end of time if need be, outliving any who foalishly try to breach our lines. In this way, we will ensure our long-term success."

 NCG_wasteland_economics: "Wasteland Economics"
 NCG_wasteland_economics_desc: "The Greater Wasteland Market is highly competitive, being filled with struggle and death in equal measure. However, where others see only strife, we see endless potential for profit! After all, ponies are much more likely to buy into our message if the only alternative is a brutal death in the wastes..."

 NCG_toll_roads: "New Toll-Roads"
 NCG_toll_roads_desc: "Infrastructure is important for any efficient operation, but it is also really expensive to maintain. To balance out these expenses, any newly constructed roads and railways will enjoy having toll-stations already built in."

 NCG_squeeze_profits: "Charge for the Privilege of Employment"
 NCG_squeeze_profits_desc: "Our employees should count themselves lucky be allowed to not only live in such a progressive nation as this one, but to also be generously given employment by the Guilds. In fact, a good way to recoup some of our expenses would be to charge said employees for the privilege of being employed by us.\nAfter all, there is no 'I' in 'money', but there is a 'con' in 'economy'."

 NCG_appleseed_factory: "The Appleseed 'Welfare'-Centre"
 NCG_appleseed_factory_desc: "Instead of simply terminating or detaining our criminals and maladjusted employees, we will give them a chance to prove their apologism towards the Guilds by working off their debts to society. This way, we can produce cheaper ammenities, while fostering social cohesion in our staff. Some may criticize this measure as neo-indentured servitude, but we maintain that this is just a modern form of justice."

 NCG_clear_out_slums: "Pave Over the Slums"
 NCG_clear_out_slums_desc: "The hovels and shanties outside the walls of our fair city are quite the eyesore, on top of also being in the way of our industrial expansion. To combat this, we will send our security forces into the slums to clear out these dysfunctional miscreants, after which the Builder's Guild can move in to pave over the illegally constructed structures. They'll find other homes... probably. If not, the Miner's Guild is always more than happy to welcome more workers into their commons houses."

 NCG_connect_rapids: "Rapids Consumer-Colony"
 NCG_connect_rapids_desc: "We can always use more production centres to produce the various goods that our employess can buy from us. A proposal was recently brought before us, claiming to maximize both production and consumption at the same time. To put this to the test, we will invest in the development of a 'consumer-colony' within the Azure Rapids area. This colony will be based around both producing a large quantity of goods then redistributing those same goods to the local employees at a reasonable cost, exporting the excess to be traded on other markets. In this way, we can maximize our profit potential."

 NCG_river_industry: "Sea-Trade Monopolies"
 NCG_river_industry_desc: "Before the zebras started raiding Equestrian convoys, maritime trade with Griffonia and Zebrica made awe-inspiring amounts of bits. With the Zebrican Empire long gone, the time has come at last to revive sea-trade.\nWith us on top, of course."

 NCG_open_lemondrop_factory: "'Aquire' Resources Through Venture Capital"
 NCG_open_lemondrop_factory_desc: "There are still many ruins unexploited, and many leaders gullible enough to allow us to 'lease' scavenging rights. So, we will convince them to let us scavenge there, and, once we have evacuated all valuables, we will simply vanish from their lands, never to be heard from again. The profits will be solely our own and the chumps who foalishly agreed to grant us access will be left with nothing but empty promises and crushed dreams to remember us by."

 NCG_underground_factories: "Mandatory Urbanization"
 NCG_underground_factories_desc: "An urbanized population is on average 53% more productive than a dispersed rural-based one. In order to fasttrack urbanization, all employees not within the Miner's Guild shall be resettled into one of our urban production centres. Not only will this clear out the countryside for further industrial development, but it will also more effectively concentrate our skilled workforce within the capital."

 NCG_underground_rail: "Expanding Downwards"
 NCG_underground_rail_desc: "Relocating important parts of our industry to underground caverns and tunnels will not only open new avenues of expansion, but will also make for excellent protection against airstrikes and espionage alike. While the Miner's Guild resents having to work alongside the Builder's Guild to make this project successful, they're still willing to put aside their differences if it means they'll be able to hide their assets away from prying eyes.\nOur underground operations will be a secret to almost everypony."

 NCG_offshore_salvage: "Work to Earn the Right to Die"
 NCG_offshore_salvage_desc: "If you boil it down to the essentials, death is only an employee on permanent absence. Frankly, death is terribly inefficient and cuts into our profit margins substantially. Therefore, all workers will receive a mandatory dose of chems thrice a week to ensure that they remain vigorous and productive for as long as possible. A positive side-effect is that should a worker quit working for whatever reason, they will also forfeit their chem-benefits. We expect that the withdrawal will kill them soon thereafter, allowing us to charge any mourners for their funeral costs!"

 NCG_open_sylhpon_factory: "§rProject Sylphon§!"
 NCG_open_sylhpon_factory_desc: "We always strive to take every opportunity to hone the technological edge we have over our competitors. Recently, we were approached by a group of researches from Rock City who had to flee their home region for supposed 'crimes against equinekind'. We have offered them a new home to continue their research, provided they agree to grant us full rights to use their research however we see fit.\n§rExperimenting on living ponies for fun and profit!§!"

 NCG_capitalist_paradise: "A Corporatist Paradise"
 NCG_capitalist_paradise_desc: "When you look across the Wasteland, what do you see? Misery, suffering, and horrific conditions the likes of which nopony would ever wish to subject upon even their most hated enemies. Yet here, within the confines of Neocastle, you will find nothing but prosperity and progress the likes of which haven't been seen since the days of Equestria itself. Socially, culturally, and economically, we far outdo our competition. Thanks to the hard work of the Guilds, ours will be a future of prosperity and luxury. So long as everypony continues to do their part to make that future a reality."

 NCG_war_profiteering: "War Profiteering"
 NCG_war_profiteering_desc: "War is a racket and a profitable one at that. So long as there exists two ponies seeking to kill eachother, there will also exist the opportunity for money to be made. Through the combined efforts of each Guild, we will break into this market and reach formerly unheard of levels of profit."

 NCG_amethyst_plan: "The 'Amethyst' Plan"
 NCG_amethyst_plan_desc: "The Amethyst Plan, named after the gem which was once common throughout this region, calls for us to invest heavily in the expansion of our general industrial base first and foremost. Though this initially seems counterproductive towards the goal of further developing a domestic arms industry, the supporters of this plan argue that it would provide us with a better foundation on top of which we may build as many munitions plants as we can count."

 NCG_apiary_plan: "The 'Apiary' Scheme"
 NCG_apiary_plan_desc: "The Apiary Scheme was proposed by an unusual mix of the brightest minds within the Miner's and Mechanicum Guilds alike. It calls for us to create semi-isolated 'forge communities' on the outskirts of Neocastle, dedicating them entirely to the production of military equipment and weapons. The workers here will live and die within their factories, laboring tirelessly to provide the means for both the defence of their country and for the expansion of the private arms market."

 NCG_neighbour_weapons: "Merchants of Death"
 NCG_neighbour_weapons_desc: "Now that we have a greater industrial base to build off of, it is time to engage in a bit of advertising to let the rest of the Wasteland know of our new products. Great guns at great prices, provided to you by the hard-working ponies of Neocastle. Buy a hundred for ten free, in a deal so great it'll have you coming back for more! Terms and conditions may apply."

 NCG_poach_researchers: "Talent Poaching"
 NCG_poach_researchers_desc: "In recent years, many of the top researchers working within the Greater Wasteland Market have been grabbed up by Red Eye through his immense wealth and resources. Now, it is our turn to follow in his hoofsteps by offering a life of luxury to any innovative minds who are willing to work for the betterment of ponykind. After all, progress and profit go hoof in hoof."

 NCG_predatory_lending: "Nation-Scale Predatory Lending"
 NCG_predatory_lending_desc: "There's profit to be had within the realm of money lending. Now that we have the means to enforce our debt collection within the Greater Wasteland Market, we have little reason to not be generous with our foreign investments. Of course, these investments will have to be paid back, plus a non-insubstantial amount of interest, producing a net gain of revenue for us. When our new debtors inevitably can't afford to pay back what they owe, their assets will be seized and put to use to produce profit directly."

 NCG_capitalism_marches_on: "§aThe Final Form of Capitalism§!"
 NCG_capitalism_marches_on_desc: "We have achieved the goal of our forefathers, that pursuit which our nation has been wholly dedicated to for so long: The achievement of peak profit. Though many considered it to have been nothing more than a myth, we have shown it to be a reality. Money, money, and more money as far as the eye can see. Nopony, nogriff, and certainly nozeeb has ever come even close to holding the sheer amount of wealth we now have at our disposal. Truly, we have perfected the art of the deal."



 ##Aetherist Tree##

 NCG_somniare: "Somniare de Creatione"
 NCG_somniare_desc: "Creation is all around us. We were given the ability to harness it, perhaps to allow us the blessing of Ascension. Now, we must act upon this sacred opportunity by reaching out to it."

 NCG_questus: "Questus finem Mercatores"
 NCG_questus_desc: "The merchants of Neocastle have played their part. It is now for their story to end."

 NCG_vincens: "Vincens novum provincias"
 NCG_vincens_desc: "We are surrounded by the machinations of nations and politics. In the face of Creation, they are all meaningless. The Aether calls for all to serve."

 NCG_venandi: "Venandi et servos"
 NCG_venandi_desc: "Our dream is clear, but our path is long. Acquiring loyal servants is a task necessary to fulfill our quest of reaching the Aether."

 NCG_exequi: "Exequi Cultores de Machina"
 NCG_exequi_desc: "We still have those in our nation who choose to worship the progress of the machine. Just like our enemies, they shall be quelled as well. Their talents turned to the creation of the ancient, no longer the folly of the new."

 NCG_puritas: "Puritas Creaturae"
 NCG_puritas_desc: "The guilds are cleansed, and we are left to ourselves. The Aether calls to use now, more safely than ever."

 NCG_ecclesiis: "Ecclesiis Creaturae et Aether"
 NCG_ecclesiis_desc: "All outside our halls do not yet know of the beauty of the Aether. They will learn by their participation in the Great Work, willing or not."

 NCG_unum: "Unum, vera Scientia"
 NCG_unum_desc: "There is only one science. The science of Creation."

 NCG_aedificationem: "Aedificationem Finem"
 NCG_aedificationem_desc: "We build temples of reason only for those that dare enter. Invite none, for only the brilliant are welcome."

 NCG_incumbo: "Incumbo Omnia"
 NCG_incumbo_desc: "The Aether has blessed us with our very own lands. It is our duty to use it properly."

 NCG_ad_altiorem: "Ad Altiorem"
 NCG_ad_altiorem_desc: "'Do you hear it? The Aether! It calls! Don't just stand there, answer it! Build!'"

 NCG_fidem: "Fidem est Veritas"
 NCG_fidem_desc: "Perhaps it is not the science of Creation that we must study, but rather cementing our faith itself."

 NCG_opus: "Opus Donec Stillabunt"
 NCG_opus_desc: "'And you! Where is your faith? Get up! BUILD! BUILD!'"

 NCG_bellatores: "Bellatores Superior Planorum"
 NCG_bellatores_desc: "The warriors of the Aether shall arise and fight countless battles, just as they are sworn to do."

 NCG_ostendantium: "Ostendantium Antiquorum Mala"
 NCG_ostendantium_desc: "In order to fulfill our quest, we must use what has been kept hidden from us for so long."

 NCG_sine_fine: "Aedificationem Sine Fine"
 NCG_sine_fine_desc: "'Resting is failure! STOPPING is failure! Are you going to fail it?'"

 NCG_altior: "Altior quam Aquilae"
 NCG_altior_desc: "Our most faithful shall take to the skies, just as the light of the Aether shines into every facet of existence."

 NCG_liberos: "Liberos nostros Mareway"
 NCG_liberos_desc: "The feudal ponies of Mareway have it in their fate to be annexed. However, their similar skills shall prove useful in our quest for ascension."

 NCG_dicens: "Dicens ad bags et Silvis"
 NCG_dicens_desc: "As long as these nations continue to practice false ideals, our spire is still threatened. The Aether demands that we annex all who may interrupt us."

 NCG_subvertendo: "Subvertendo ad Azure Flumen"
 NCG_subvertendo_desc: "The Azure River, and all nations that have managed to sprawl along its waters, shall be called to the Aether as well."

 NCG_milites: "Milites de Fitum"
 NCG_milites_desc: "Only the absolute best shall fight for the Aether."

 NCG_terra: "Terra semper Aestas"
 NCG_terra_desc: "The plains to our east hold more nations. Nations of settlements with numerous ideologies, they are all lost. The Aether shall save them."

 NCG_de_deserto: "De deserto ad Oceanum"
 NCG_de_deserto_desc: "Slavers, republic, settlement, it does not matter. From desert to ocean, annexation comes for all who refuse to serve the Aether."

 NCG_habitatores: "Habitatores Sacra Fidelium"
 NCG_habitatores_desc: "As long as the Aether continues to call, the faithful shall arise in its name. So it shall be as long we serve its cause."

 NCG_et_terriblis: "Et Terriblis Servus, Dominus"
 NCG_et_terriblis_desc: "In their quest, these nations of slavers and technologists have amassed an innumerable amount of resources for a heretical purpose. No matter their strength, our faith will allow us to prevail."

 NCG_senex: "Senex Capitis"
 NCG_senex_desc: "This corner of the Wasteland holds foes more unique than ever seen, including those who think for one another. Regardless, the Aether calls for their annexation, just as it has for all else who surround us."

 NCG_lindinans: "Lindinans Ultra Urbem"
 NCG_lindinans_desc: "The Aether calls us into the deepest cities and into the most urban landscapes. Our faithful shall scour every street, every hall."

 NCG_montes: "Montes Pullos Et Insania"
 NCG_montes_desc: "Insanity has spread to every corner outside our borders, causing the most peculiar nations to form. Just as the Aether calls, so shall these ponies of the mountains."

 NCG_urbem: "Urbem, Quae Numquam Dormit"
 NCG_urbem_desc: "As we venture deeper into this corrupted corner of the Wasteland, the city that never sleeps shall inevitably lie in our path, and the Aether shall awaken it once more."

 NCG_imperii: "Imperii Quod Nusquam fuit"
 NCG_imperii_desc: "Ponies led far astray, they have taken to their own machinations, forming false empires out of steel and words. The Aether shall save them."

 NCG_adritus: "Adtritus Akasha"
 NCG_adritus_desc: "As the rocket burns fuel to accelerate and leave the atmosphere, so must we burn magic to reach the spiritual escape velocity required to leave this pained world, and reach the blessed River."

 NCG_in_horto: "In horto cras Edenum"
 NCG_in_horto_desc: "Paradise awaits!\nPraise no Gods, for none have been born yet.\nRejoice in labor and await the promised day.\nYou will be saved!"

 NCG_terminus: "Terminus ad Immaterialium"
 NCG_terminus_desc: "Vacuum is the absence of Creation. It is the most pure part of this wretched world, for it contains nothing that could be impure. From it, we will set out to remake creation, and it's purity shall become all-encompassing."

 NCG_amplexus: "Amplexus aeternum §DAETHER§!"
 NCG_amplexus_desc: "THE TIME HAS COME!\nPRAISE BE!\nTHE LAST DAY IS UPON US!"









