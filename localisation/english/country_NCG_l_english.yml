 NCG_investment_yearly_cat: "The Magic of Capitalism"
 NCG_investment_yearly_cat_desc: "It takes a lot of money to stay this rich. After all, we didn't get here by spending everything we had! A business that takes no risks won't last for long in this cutthroat market though, and so we take care to save money for investing into endeavors that are not immediately profitable, but which either promise future payoff or which directly contribute towards maintaining our current profit-margins. Once a year, some of the returns on our investments are reserved in a special budget intended solely for these sorts of otherwise risky investments.\n§GReturns increase to §C2 Investment Points§! at §O12 Civilian Factories§! and to §C3 Investment Points§! at §O30 Civilian Factories§!\n§!"

