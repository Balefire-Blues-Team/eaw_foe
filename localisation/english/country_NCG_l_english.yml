 NCG_coring_disabled_tt: "§R§rArchmagos Tezla§! does not believe in integrating outsiders into our nation. Instead, she seeks to unite ponykind through much more practical, mechanical means.\nCoring is disabled, but you will receive mechanics and buffs to compensate."

 NCG_blueprints_aquired_tt: "§rWe will Aquire a number of cybernetic-samples and encrypted files from our contact in the Cathedral§!"

 NCG_rolling_thunder_tt: "§OWe will pursue a strategy of mobilized infantry and armored advances.§!"
 NCG_burning_steel_tt: "§RWe will pursue a strategy of a primarily robotic security force.§!"
 NCG_thousand_citadels_tt: "§FWe will pursue a strategy of creating and holding fortified positions.§!"

 NCG_smaller_duchies_tt: "§CWith New Mareway having refused our deal, we will approach the nobility and leverage our wealth to turn them away from the Crown in preparation of our eventual invasion.§!\n"
 NCG_smaller_duchies_tt2: "§RThe effects of this focus are dependant on whether or not New Mareway accepted our trade deal.§!\n"
 NCG_industrial_aid_to_wavy_waters_tt: "§CDuke Pale Light will pretend not to get the call to arms.§!"
 NCG_industrial_aid_to_pale_light_tt: "§NDuke Wavy Waters will keep his fleet in the harbour.§!"
 NCG_industrial_aid_to_gatormaw_tt: "§rDuke Gatormaw will delay reinforcements from the south.§!"
 NCG_industrial_aid_to_littleward_tt: "§GDuke Bright Glow won't interfere with our invasion.§!"
 NCG_industrial_aid_to_sunflower_tt: "§ADuchess Sunflower will lend us her tenuous support.§!"
 NCG_corporate_takeover_mareway_tt: "§YThis focus requires you have either made deals with New Mareway's influential nobility or have an active trade deal with New Mareway.§!"

 NCG_90_core_reduction_tt: "§DNations, borders and political-groupings are utterly meaningless in the face of the Root of Creation.\nOver our time in hiding, we have become excellent in syncretising disparate beliefs into one coherent philisophy. All those who seek to join us in perfection are welcome, no matter their race or social standing!\n\n§FLowers Coring cost by 90%!§!§!\n"
 NCG_incumbo_tt: "§DWe will begin the arduous process of shipping massive amounts of Ressources to [NCG.Capital.GetName], to facilitate the construction of the Spire.§!\n\n§FEvery 10 Days, some ressources will be relocated from our states to [NCG.Capital.GetName].§!\n"
 NCG_shattered_uprising_tt: "§DIn 5 Months, we will trigger our agents to sabotage Azuria, and simultaniously declare §RWAR§!§!\n"

 NCG_mechanicum_coup1_tt: "§OThe Builder's Guild§! §Yhas submitted to the§! §RMechanicum's§! §Ywill!§!"
 NCG_mechanicum_coup2_tt: "§GThe Miner's Guild§! §Yhas submitted to the§! §RMechanicum's§! §Ywill!§!"

NCG_machanicum_epilogue_tt: "§CThank you for Playing §ONeocastle§!!\n\nThe March of Progress has become inevitable, and all who seek to stop Archmagos Tezla and her acolytes will be met with nothing but failure and death. 20 years from now, a new God will open its mechanical eyes to the world, and reshape it until it is unrecognizable. The path is set, and no trace of the Equestria of old nor the wasteland it has become will survive the awakening of the §GAllmind§!.\n§RThe time of Flesh and Magic is over.\nThe time of Thought and Steel is upon us§!\n§!§tPraise be, for you have ended 200 years of stagnation!§!"

NCG_aetherists_path_unlock_tt: "§tWe may open ourselves up to competition from within...§!"

NCG_leads_ncr_war_tt: "§tCompleting this focus will lead to a §RWar with [SHA.GetNameDEF]§! after some time!§!"

NCG_overclock_cost_increases: "§tThe cost to §GOverclock§! increases§!"
NCG_ponies_begin_to_live_again_tt: "§OPonies begin to live for themselves again§!"

NCG_aetherist_ending_tt: "§tThank you for playing §ONeocastle§!\n\nThe Council is ascendant, but powerless all the same. The wasteland however, is forever changed, and not for the better. It's natural resources were stripped, cities destroyed and many thousands died.\nThe only glimmer of hope is that ponies may learn from what happened and decide to do better on their own.\nHail the gods of the Aether for they weep for you and me, but know that hope is the only thing keeping the flame alive.§!"


