########################### focuses opening ##########################
GenStableLore1:0 "StableTec Emergency Shelter!"
GenStableLore1_desc:0 "Our people survived the end of the world thanks to advanced shelter designs made on behalf of StableTec, behind the massive cog-like blast door is a safe and secure future; Greenhouse apple orchards, water and waste reclamation systems, personal dorms and dwellings... even entertainment centers and some luxury accomodations! All designed to give us the best future we can Underground."

GenStableLore2:0 "A Key Choice in our Future"
GenStableLore2_desc:0 "It is important to remember that genetic stability is a necessary part to the StableTec Program. Too little diversity can lead to inbreeding and genetic damage, which can negatively impact the survival odds of a Stable. Always remember to consult your Pocket Reference Booklet for 'Preferable Breeding Choices' before committing to your friend!"


############################### events ###########################
Stable.1.t:0 "A Page of the History Book"
Stable.1.d:0 "Long before the Great War, Equestria was a beacon of harmony and peace. Their ideals went on to shape the world as a whole, as they became one of the strongest nations to ever exist. However, their power was challenged by another nation, one built on militaristic expansion: Zebrica. This would result in a war that spanned continents, which could only be brought to an end by such widescale death and destruction that we're still living in the aftermath to this day, waiting to return. \n \n This terrible and horrible war is what led to our ancestors entering the Stables. During the early days there were several competing visions for our future in mind. Some called for them to hold on to the Equestrian ideals that they had grown up and lived with. Others pointed out how well that went and instead called for them to mimic the clear victor in the war, the zebras. And yet another group instead proposed that they look at the griffons, who did nothing but profit off of both sides. Though their arguments raged on for quite a long time, they did eventually conclude to make one ideal the basis for their society."
Stable.1.a:0 "Harmony, like Equestria of old!"
Stable.1.b:0 "Militarism, like the mighty Zebrican Empire!"
Stable.1.c:0 "Greed, like the griffons."

##### Second focus about method how tribe is survivng today, for pony race
Stable.2.t:0 "A Key Choice in our Future?"
Stable.2.d:0 "After we sealed the doors and the bombs began falling, many came to the doors of Stables seeking safety. Regulations made it clear that under no circumstance were we to EVER open the doors until the All Clear was sent. ...but as the bombs were falling, some unexpected creatures reached the still open doors. What did we do?"
Stable.2.a:0 "We allowed a number of zebra to enter."
Stable.2.b:0 "We welcomed a flock of Gryphons to our midst."
Stable.2.c:0 "Our Security Officers forced them away."

Stablepony_ancestors:0 "Ancestors - Earth Pony, Unicorn, Pegasus."

Stablezebra_ancestors:0 "Ancestors - Earth Pony, Unicorn, Pegasus, Equestrian Stripe."

Stablegriffon_ancestors:0 "Ancestors - Earth Pony, Unicorn, Pegasus, Gryphon."

