l_english:
 ### Changeling Techs
 TITLE_CHANGELING_INFILTRATORS_SUBTITLE:0 "CHANGELING INFILTRATORS"
 TITLE_CHANGELING_DEEP_COVER_SUBTITLE:0 "Deep Cover"
 TITLE_CHANGELING_HIVE_SWARM_SUBTITLE:0 "Hive Swarm"
 FOE_tech_infiltrators_hs_tt:0 "§YChangeling Infiltrators§! also carry §Y15 Ballistic Weapons§!."
 tech_infiltrators:0 "Changeling Infiltrators"
 tech_infiltrators_desc:0 "A changeling who wears the right face can walk through any gate. Attached to a division, a handful of them scout ahead in borrowed shapes, mislead patrols and open the way into towns and fortifications."
 tech_infiltrators_dc:0 "Deep Cover"
 tech_infiltrators_dc_desc:0 "Infiltrators who spend weeks living as someone else learn far more than any scout. They report troop movements from inside the enemy's own camps."
 tech_infiltrators_dc2:0 "Forged Orders"
 tech_infiltrators_dc2_desc:0 "The right face and the right satchel: a forged order, delivered by a familiar courier, sends an enemy company marching the wrong way at the worst possible moment."
 tech_infiltrators_dc3:0 "Sabotage Cells"
 tech_infiltrators_dc3_desc:0 "Small cells slip into towns and fortifications ahead of an attack, spiking guns, cutting wires and leaving doors unbarred."
 tech_infiltrators_dc4:0 "Replaced Officers"
 tech_infiltrators_dc4_desc:0 "An officer who never came back from the latrine is replaced by one who did. The enemy's chain of command develops holes, while ours knows where the enemy will be."
 tech_infiltrators_dc5:0 "Hive Network"
 tech_infiltrators_dc5_desc:0 "Linked through the hive, every infiltrator knows what the others see. No patrol, outpost or garrison goes unreported."
 tech_infiltrators_hs:0 "Hive Swarm"
 tech_infiltrators_hs_desc:0 "Some hives prefer numbers to subtlety. Armed and drilled, the infiltrators drop their disguises and fight as a swarm alongside the line."
 tech_infiltrators_hs2:0 "Love Feeding"
 tech_infiltrators_hs2_desc:0 "Changelings feed on the love and devotion around them. A swarm that tends its comrades keeps its wounded fed and its veterans alive."
 tech_infiltrators_hs3:0 "Chitin Carapace"
 tech_infiltrators_hs3_desc:0 "Hardened chitin turns aside splinters and glancing shots, and a drone that can take a hit keeps its nerve."
 tech_infiltrators_hs4:0 "Swarm Tactics"
 tech_infiltrators_hs4_desc:0 "Drones strike from every side at once, overwhelming a position before its defenders can choose a target."
 tech_infiltrators_hs5:0 "Queen's Will"
 tech_infiltrators_hs5_desc:0 "Bound to the will of their queen, the swarm fights without hesitation or fear and presses every attack to the end."
