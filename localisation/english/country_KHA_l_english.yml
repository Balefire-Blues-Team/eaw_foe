 KHA_hostile_natives_1_idea:0 "Hostile Natives"
 KHA_hostile_natives_1_idea_desc:0 "Despite Yaks being strong and crushing all pony resistance, the local ponies aren't exactly too happy about their new rulers. When Yaks try to force puny ponies into their small puny pony factories, many ponies don't work, and many puny ponies protest. This is very annoying to Yaks."
