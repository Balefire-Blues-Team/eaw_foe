l_english: 

##################
### FOCUS TREE ###
##################

### Political Tree ###

 KHA_opening_1:0 "Our Clan Back home"
 KHA_opening_1_desc:0 "6th Khagnate come from Clan Tsasan in Yakyakistan, greatest Clan in Yakyakistan. Khan Grimsmasher learn from Yakyakistan Clan, but what lessons Yak learn?"

 KHA_opening_2:0 "The Journey southwards"
 KHA_opening_2_desc:0 "Yak made way south from Yakyakistan, seeking puny pony land to settle and SMASH. Along way, Yak pass by big pony city, too many pony to settle, yet pony city also in way. Yak had to decide to SMASH, or make ponies think will SMASH without actually SMASHing."

 KHA_opening_3:0 "The Battle of Razorfield"
 KHA_opening_3_desc:0 "Yak crushed puny pony armies when arriving, yet not every pony was puny. Commonwealth ponies puny individually, but together, ponies are tough, not as tough as Yak, but tough. Yak fought Commonwealth pony, yet Yak did not SMASH completely."
 
 KHA_licking_our_wounds:0 "Licking our Wounds"
 KHA_licking_our_wounds_desc:0 "Yak war against Commonwealth pony did not go in Yak favor. Yak must prepare for round two against Commonwealth. Yak prepare."

 KHA_where_to_live:0 "Where to live?"
 KHA_where_to_live_desc:0 "Yak have much land claimed in new Yak lands, but Yak need to decide what will come after taking down Commonwealth pony. Some say Yak should fill pony settlements, other say Yak remain nomadic. Tricky choice for Yak."

 KHA_our_new_subjects:0 "Our new subjects"
 KHA_our_new_subjects_desc:0 "Yak conquered many puny ponies during conquest, many kept as servants to Yak. Ponies not like Yak in many ways, but Khan could make pony more like Yak, yet might make Yak more like pony. Or could keep pony as servant to Yak."

 KHA_appoint_new_basquaqs:0 "Appoint local Basquaqs"
 KHA_appoint_new_basquaqs_desc:0 "Basquaqs are Yak who govern and collect tax for Khagnate. Khan must appoint many new ones over Khagnate lands, will make Yak land more stable, and provide Yak tax to build up Warcamp."

 KHA_import_a_bit_of_home:0 "Import a bit of home"
 KHA_import_a_bit_of_home_desc:0 "Yak left home, yet home still in Yak heart. Pony land culture is odd, not fitting for Yak. Yak don't worry! Yak just import home stuff, for Yak to enjoy, maybe show pony superior Yak culture too."

 KHA_disarm_the_ponies:0 "Disarm the Ponies"
 KHA_disarm_the_ponies_desc:0 "Many pony have boomsticks, not enough to kill proper Yak, yet enough to hurt Yak. Rebel pony use boomsticks to hurt many Yaks, so Yak say enough! Yak take pony weapons for Yak purposes!"

 KHA_exile_dissenters:0 "Exile Dissenters"
 KHA_exile_dissenters_desc:0 "We cannot abide those ponies who might challenge our rule, but we should also not deprive the Khanate of their expertise or labour. We shall send them to our subjects to be put to work there.\nIf they are a problem there, they can deal with it"
 
 KHA_have_them_work_earth:0 "Have them work the earth"
 KHA_have_them_work_earth_desc:0 "Pony not as strong as Yak, yet there more of them. Earth pony have small strength and Unicorn pony have magic. Put them to work in clearing the way for the Khagnate!"

 KHA_conscript_administrators:0 "Territorial Administration"
 KHA_conscript_administrators_desc:0 "Commonwealth territories will be hard for Yak to govern, pony will resist Yak rule. Pony may be weak as mosquito, but too many bites can kill even strongest Yak. Some say Yak use pony as pencil-pushers, other say only Yak is worthy of the glory."
 
 KHA_signs_of_a_nation:0 "Signs of a Nation"
 KHA_signs_of_a_nation_desc:0 "Yak must admit settled pony have some good ideas. Yak take inspiration, make new flag for Yak Khagnate, open ties to others. Yak trade and make deals with puny ponies around, just like Yak work with Yak pony allies."

 KHA_remind_our_allies:0 "Remind our allies"
 KHA_remind_our_allies_desc:0 "Yak allies strong, but none as strong as Yak! Detrot make useful motors, but factories can be SMASHed by single Yak! Arria surrounded by Commonwealth, only alive by Yak! Acolytes small and weak, Yak keep safe! Is time Yak remind pony allies that Yak is the best of them."

 KHA_prepare_for_expansion:0 "Prepare for expansion"
 KHA_prepare_for_expansion_desc:0 "Yak know that war with Commonwealth come, yet not every Yak, and especially not pony, are ready for the war. Yak must make pony as angry as Yak warrior if they are to prepare for Commonwealth fight ahead!"

 KHA_confiscate_wealth:0 "Confiscate Wealth"
 KHA_confiscate_wealth_desc:0 "Pony don't need much wealth in Yak lands, so Yak take wealth from pony. Many pony will whine and stomp their hooves, if pony stomp too hard, Yak stomp their skulls."

 KHA_forges_in_warcamp:0 "Forges in the Warcamp"
 KHA_forges_in_warcamp_desc:0 "Commonwealth war comes ever closer, and Yak need more weapons to SMASH Commonwealth pony with. Yak clear room in Great Warcamp, make more space for means of Yak production."

 KHA_organize_stampede:0 "Organize a traditional Stampede"
 KHA_organize_stampede_desc:0 "Yak grow bored, been too long since last stampede. Yak stampede is similar to pony 'military parade'. Invite pony to Yak stampede! Let pony experience great Yak culture!"

 KHA_honour_the_scourge:0 "Honor the §RScourge§!"
 KHA_honour_the_scourge_desc:0 "Northern pony afraid of the Khan, call him 'Scourge' because Khan terrify so many ponies. Yak like afraid ponies! Yak take pony title and make official!"

 KHA_break_tartarus:0 "Break Tartarus"
 KHA_break_tartarus_desc:0 "Tartarus Prison built to contain 'strongest prisoners', ha! Yak strongest, not any 'Tirek' or any other put down there! Yak go to prison and SMASH!"

 HA_implement_yassa:0 "Implement the Yassa"
 KHA_implement_yassa_desc:0 "Yassa be laws made by Yak for subjects of Yak Khagnate, dating back to Yak dominance over land called Nova Griffonia. Yassa has not been implemented for centuries, but the time has come to do it. The Yak will enforce our Yassa Laws, and ponies shall be glad, or they shall be SMASHed."

 KHA_road_to_the_heart:0 "Road to the Heart"
 KHA_road_to_the_heart_desc:0 "No road connect Arria city to Yak Warcamp, is bad for Yak supply. Yak SMASH ground and make road between city and Warcamp, to supply Yak for Commonwealth war."

 KHA_our_true_home:0 "Our true home"
 KHA_our_true_home_desc:0 "Yakyakistan has special place in all Yak hearts, yet Yak are not in Yakyakistan, Yakyakistan is far away, not the place for 6th Khagnate. New home is true home, is time Yak acknowledge."

 KHA_smash_prison:0 "Smash the prison"
 KHA_smash_prison_desc:0 "Tartarus Prison has much supply, but is too far from Yak home. No matter! Yak SMASH prison and take to bring to Great Warcamp!"

 KHA_the_convicts:0 "The convicts"
 KHA_the_convicts_desc:0 "Tartarus Prison held many prisoners, and gangs, who fought Yak. Many Yak have many idea on what to do with them. Popular Yak idea is to use gang as meat shield for Commonwealth war. Less popular Yak idea is to force them to work."

 KHA_open_to_trade:0 "Open up to trade"
 KHA_open_to_trade_desc:0 "Pony give Yak weapons and material to make weapons in return for useless junk! Yak ignore trade before, but puny ponies are truly silly, Yak overestimated them! Yak open to trade! Come give Yak pony weapons, please!"

 KHA_glimpse_of_hope:0 "A glimpse of Hope"
 KHA_glimpse_of_hope_desc:0 "Yak reforms have made puny pony citizens less angry. Pony see changes as sign of Yak not being too bad for pony. Puny pony protests die down more by day, and more arrive to work for Yak Khagnate."

 KHA_natives_pacified:0 "Pacification complete"
 KHA_natives_pacified_desc:0 "With enough SMASHing and concessions, pony have become peaceful under Yak rule. Yak now have complete control over Khagnate ponies."

 KHA_forge_new_compact:0 "Forge a new Compact"
 KHA_forge_new_compact_desc:0 "Tartarus Prison still hold many who don't like Yak, so Yak compromise with them. Some prisoners almost as strong as Yak child, mean they deserve Yak respect. Yak work with prisoners to give small rights in Yak Khagnate, make prisoners happy."

 KHA_prepare_our_army:0 "Prepare our army"
 KHA_prepare_our_army_desc:0 "Yak army feeling refreshed after SMASHing Tartarus Prison! Yak army can't wait to SMASH puny Commonwealth ponies again!"

 KHA_prepare_our_industry:0 "Prepare our industry"
 KHA_prepare_our_industry_desc:0 "Yak industry is good, but could be better. Yak industry still like pony industry, too small for old Yak to work in, because even old Yak much bigger than pony. Yak expand industry, make bigger for Yak frame."

 KHA_massive_drills:0 "Massive Drills"
 KHA_massive_drills_desc:0 "Yak must not be caught unprepared by Commonwealth pony, pony might be puny, and Yak might be strong, but pony still dangerous. Yak do many exercises to prepare for war ahead."

 KHA_plan_our_advance:0 "Planned advance"
 KHA_plan_our_advance_desc:0 "Yak do not like planning, but planning does make SMASHing three times more effective. Khan saw last war fail due to no planning, so Khan make greatest Yak plan ever!"

 KHA_conscript_from_subjects:0 "Conscript from subjects"
 KHA_conscript_from_subjects_desc:0 "Pony might not be as strong as Yak, yet pony can hold boomstick, hold shovel, transport supplies. Allies have many pony. Yak take pony from allies, might make allies angry, but Yak need the numbers."

 KHA_let_there_be_terror:0 "Let there be Terror"
 KHA_let_there_be_terror_desc:0 "Time approaches for Commonwealth war, but Commonwealth might be prepared for Yak. Yak will send small squads of Yak to SMASH pony settlements, make Commonwealth pony afraid."

 KHA_suspend_civilian_production:0 "Suspend civilian production"
 KHA_suspend_civilian_production_desc:0 "In Commonwealth war, civilian and fighter will not exist. Yak will use all as fighters or producers. Why waste factories making civilians happy with this fact? SMASH civilian production amounts!"

 KHA_prioritize_military_buildup:0 "Prioritize military Buildup"
 KHA_prioritize_military_buildup_desc:0 "Yak do not need factories in the future, Yak need factories now! Yak SMASH puny civilian factories, and from parts, build war factories!"

 KHA_ready_to_rumble:0 "Ready to rumble"
 KHA_ready_to_rumble_desc:0 "Yak army completely ready for the rematch now, story of Razorfield no longer bring Yak shame, but instead make Yak angry, and ready to fight again."

 KHA_hundred_days_campaign:0 "Hundred Days Campaign"
 KHA_hundred_days_campaign_desc:0 "Commonwealth ponies stop fighting each other, and prepare for war against Yak instead. Yak must not allow pony to use number to advantage, or Yak will lose. Yak must press advantage!"

 KHA_crack_captured_depots:0 "Crack captured bunkers"
 KHA_crack_captured_depots_desc:0 "Pony build many bunker to hide from Balefire, didn't do much good! Bunker withstand Balefire blast, remain untouched by pony scavenger hooves. Cannot withstand Yak strength! Yak break open and take for Yak purposes!"
 
 KHA_second_war_for_the_commonwealth:0 "The second war for the §ACommonwealth§!"
 KHA_second_war_for_the_commonwealth_desc:0 "Time has come! Yak will march against the Commonwealth ponies! Yak will SMASH them!"

 KHA_train_replacements:0 "Train replacements"
 KHA_train_replacements_desc:0 "Yak and pony will die in war, unavoidable fact, so Yak will prepare for this. Yak train up replacements behind lines, ready to replace fallen Yak or pony soldiers."

 KHA_surrender_incentives:0 "Surrender-incentives"
 KHA_surrender_incentives_desc:0 "Owned Commonwealth pony states resist Yak soldiers, make taking rest harder for Yak. So Yak show pony why is good to not resist Yak. Yak do this through SMASHing ponies!"

 KHA_push_to_victory:0 "Push to Victory"
 KHA_push_to_victory_desc:0 "Yak must not lose momentum, or war will go badly for Yak. Is time for a great SMASHing! Yak forces, charge!"

 KHA_backline_to_the_front:0 "Backline to the front"
 KHA_backline_to_the_front_desc:0 "Many pony and Yak in Khagnate lands useless for war effort, but war important. Yak force to the frontlines. Pony and Yak might whine, but Yak kick those who do."

 KHA_the_behemoth_crumbles:0 "Behemoth crumbles"
 KHA_the_behemoth_crumbles_desc:0 "Commonwealth has fallen to Yak forces, now Yak must decide once and for all what to do."

 KHA_adopt_commonwealth_systems:0 "Adopt Commonwealth systems"
 KHA_adopt_commonwealth_systems_desc:0 "Khan thinks of home, of Yakyakistan, Khagnates rising and then falling. Khan will prevent this. Khan will become something new. A perfect mix of Yak and Pony."

 KHA_the_olive_branch:0 "The olive branch"
 KHA_the_olive_branch_desc:0 "Yak Khan does not wish to rule over a wasteland, even if he rules over the Wasteland. Yak wish for taxes, and taxes require subjects to give taxes. Yak extend offer of peace to Commonwealth ponies, will make Arria allies happy, even if Acolyte allies whine."

 KHA_gesture_of_good_faith:0 "A gesture of good faith"
 KHA_gesture_of_good_faith_desc:0 "Commonwealth pony are scared of Yak, which would be good before, but not when Yak want to build new system. Yak make pony less scared! Yak release all prisoners of war and pardon of crime, should show pony Yak mean good."

 KHA_uildveriin_zovlol:0 "Economic Oversight"
 KHA_uildveriin_zovlol_desc:0 "Yak are not used to 'economy', most Yak production is for the means of SMASHing, but Commonwealth pony talk about economic theories. Yak don't understand what socialism or capitalism mean. Yak shall simply wait and watch over economy and economic ministers for now."

 KHA_repair_whats_broken:0 "Heal the broken Land"
 KHA_repair_whats_broken_desc:0 "Yak SMASH much in Commonwealth war. Yak prefer to SMASH than to fix, but Khan says Yak must fix what has been SMASHed if Yak wishes to be proper nation."

 KHA_wealth_of_fallen:0 "Wealth of the fallen"
 KHA_wealth_of_fallen_desc:0 "We shall redistribute the wealth of the fallen soldiers of the Commonwealth to our new Yak settlers. If those soldiers still have families, the wealth shall be split 50/50 between them and our settlers."

 KHA_restore_the_palace:0 "Restore the royal palace"
 KHA_restore_the_palace_desc:0 " Commonwealth pony had big building of massive marble, and gold, and other pony wealth items. Yak do not care much for pony wealth items, but Yak will rebuild anyway. Maybe Yak can come to love gold."

 KHA_retain_current_administration:0 "Retain the old Administration"
 KHA_retain_current_administration_desc:0 "Commonwealth ponies know Commonwealth better than Yak do, even if Yak doesn't want to admit it. Yak will meet with old administration of Commonwealth, and work alongside pony to refine Yak system."

 KHA_adopt_equestrian_official_language:0 "Adopt a bilingual system"
 KHA_adopt_equestrian_official_language_desc:0 "Yakish is the best language in the world, but pony struggle to speak it due to weakness pony vocal cords. Normally not issue for Yak, but since Yak want to rule over pony, Yak must find solution. Yak will now speak pony language as well."

 KHA_kucykow_military_academy:0 "Kucyków military academy"
 KHA_kucykow_military_academy_desc:0 "Capital of Commonwealth had old military academy in it, closed due to damage from SMASHing. Yak reopen it for much military education."

 KHA_establish_tsugluulagchid:0 "Establish the Tsugluulagchid"
 KHA_establish_tsugluulagchid_desc:0 "Yak will establish organization that will look over all tax collection, all potential corruption, and ensure Yak control remains over all matters of Yak country."

 KHA_expand_infrastructure:0 "Adopt industrial methods"
 KHA_expand_infrastructure_desc:0 "Yak observation of Commonwealth factories reveal much about their methods of production. Yak shall apply pony methods to Yak industry, to make Khagnate best economy in the world."

 KHA_encourage_buisness:0 "Encourage businesses"
 KHA_encourage_buisness_desc:0 "Pony want to found their own businesses within Yak lands, which means more tax for Yak. Khan has announced a tax stipend to be given to all pony businesses being founded, in hopes for more tax later."

 KHA_from_warcamp_to_warforge:0 "From Warcamp to Warforge"
 KHA_from_warcamp_to_warforge_desc:0 "Yak Warcamp is not much of Warcamp anymore, is made of metal and steel instead of nomadic Yak materials. Yak rename Warcamp and build it up even more, reflect Warcamp new status."

 KHA_compensate_families:0 "Twist Revolutionary rethoric"
 KHA_compensate_families_desc:0 "Commonwealth pony fight each other due to revolutionary rhetoric, many Commonwealth common pony like rhetoric. Yak not very revolutionary, do not understand what being a 'Red' would mean. But Yak are good at shouting things! Yak will shout revolutionary rhetoric!"

 KHA_khan_and_emperor:0 "Khan and Emperor"
 KHA_khan_and_emperor_desc:0 "Khan is always Khan, but Khan is not pony title, and pony do not like Khan title. Very well, Yak Khan shall take pony title, 'Emperor'. Commonwealth pony will love new title!"

 KHA_our_own_police:0 "Merge military and civilian police"
 KHA_our_own_police_desc:0 "Military police not needed anymore, and civilian police not needed alone either. Separating both doesn't work for Yak, so we will merge them together."

 KHA_rescind_disarmament:0 "Rescind disarmament"
 KHA_rescind_disarmament_desc:0 "While we did have to disarm the ponies when we could not trust them, now that we intend them to be our permanent subjects and neighbours, it is only to our advantage to restore their previous rights, and allow gun-ownership once again."
 
 KHA_local_industrial_methods:0 "Invite foreign workers to the Capital"
 KHA_local_industrial_methods_desc:0 "Yak always need more worker, and there are plenty of pony workers all around us. We will invite in poor ponies to make great city under Yak control."

 KHA_equal_taxation:0 "Write an actual tax-code"
 KHA_equal_taxation_desc:0 "Pony do not like Yak way of collecting taxes, and ask for consistency from Yak. Though Yak hate consistency, Yak will become more consistent to make pony stop complaining."

 KHA_mandated_partnerships:0 "Mandate Pony-Yak partnerships"
 KHA_mandated_partnerships_desc:0 "An easy way to integrate our people into the local industries, will be to simply mandate that all new businesses must in some way be associated with a Yak.\nAfter a few years of this policy, Yaks will be embedded in the deepest sectors of buisness and industry."

 KHA_fire_of_industry:0 "Fires of Industry"
 KHA_fire_of_industry_desc:0 "Yak investments working! Yak workers and pony workers working side by side have allowed many factories across Khagnate land! Now Khagnate Yaks even richer than Commonwealth pony ever could be!"

 KHA_restore_limuan_institute:0 "Rebuild the Limuan Academy"
 KHA_restore_limuan_institute_desc:0 "Limuan Academy where Commonwealth pony do much of their science. It was damaged by the Civil War SMASHing and Yak SMASHing, but is very valuable. Yak will rebuild and reopen, for pony knowledge to help Yak out."

 KHA_western_territories:0 "The Western territories"
 KHA_western_territories_desc:0 "Western side of Commonwealth calmed down under Yak rule. Now Yak establish secure rule over area, and Commonwealth pony happily flock to Yak banner."

 KHA_reopen_assembly:0 "Re-open the Assembly"
 KHA_reopen_assembly_desc:0 "Khan might be Emperor, but Khan is only Emperor due to consent of the pony. Commonwealth had system called Assembly of Hearts, Yak shall reuse system under Yak control."

 KHA_eastern_territories:0 "The Eastern territories"
 KHA_eastern_territories_desc:0 "Eastern side of Commonwealth closer to great ocean, closer to trade money. Yak want this money to fund more projects in Khagnate. Yak stabilize eastern Commonwealth, prepare for east push."

 KHA_resume_gov_programs:0 "Government Handouts"
 KHA_resume_gov_programs_desc:0 "Yak Khagnate have many taxes that sit around and collect dust. Yak will give out many unneeded tax to common pony and common Yak, to make economics even better, and make ponies happier."

 KHA_new_nobility:0 "Intertwining the lines"
 KHA_new_nobility_desc:0 "Khan has heard news about Yak general and pony noble marrying each other. Yak and pony relationship not happened before. . . But Yak is okay with it."

 KHA_prosperity_at_last:0 "Intellectual prosperity"
 KHA_prosperity_at_last_desc:0 "Yak attracting ponies from all over, including many egghead ponies that will help Yak research all sort of things. Yak truly are the best thinkers!"

 KHA_dominate_markets:0 "Economic Hegemony"
 KHA_dominate_markets_desc:0 "Yak now understand the way of pony economy, and take minor control over economics. Yak guidance and pony theory lead the way to make a perfect system!"

 KHA_university_yaks:0 "The Yak Dream"
 KHA_university_yaks_desc:0 "It is Khan's dream that every Yak, no matter the circumstances of Yak birth, should have the opportunity to become a Yak of renown. Khan will allow all Yak to be educated in schools, all Yak will have ensured job, and all Yak will benefit from great Yak economy."

 KHA_march_mountains:0 "Unto the Mountains"
 KHA_march_mountains_desc:0 "Yak push west to take more land, especially Novochernusk, which has Commonwealth pony leader. Yak will SMASH enemies, with Commonwealth pony help."

 KHA_yak_interest_party:0 "Independant Legislative"
 KHA_yak_interest_party_desc:0 "Yak wish to promote many ideas under their rule, as long as idea has Yak as Emperor, Yak are happy for pony to debate over ideology. Most ideology don't make sense to Yak anyway."

 KHA_move_capital:0 "Reinstate Commonwealth Advisors"
 KHA_move_capital_desc:0 "Commonwealth pony had many advising them, is why they were able to beat Khagnate the first time. Yak is prideful, yet Yak is not too prideful as to reject help from other. Yak will welcome pony advisor to Yak cabinet."

 KHA_seize_coast:0 "Seize the Coast"
 KHA_seize_coast_desc:0 "Yak push south-east to coast, through weak East Equestrian Commission. Pony countries there be weak and easy to crush, along with the fighting pony knights of Albion."

 KHA_expand_tsugluulagchid:0 "Expand the Tsugluulagchid"
 KHA_expand_tsugluulagchid_desc:0 "Yak system is expanding more and more, making room for more and more corruption in Yak system. Yak will expand anti-corruption organization, so that Yak can keep a clean Yak system."

 KHA_joint_education:0 "Rewrite the Curiculum"
 KHA_joint_education_desc:0 "Yak have new schools, where pony and Yak learn side by side. Yak cannot simply keep the poor education system of before. Yak will rewrite education system to bring pony and Yak even closer."

 KHA_traitorous_city:0 "The compliant Bats"
 KHA_traitorous_city_desc:0 "Yak have become best at making pony follow Yak rule. Bat might not be part of Commonwealth pony en masse, but Yak make bat follow just as well as horn-pony and earth-pony."

 KHA_honourable_warriors:0 "The Honourable Pegasi"
 KHA_honourable_warriors_desc:0 "Pegasi be third tribe of pony, and many pony hate Pegasi for past. Yak do not care about pony past, though. Yak make pony and Pegasi work together, make both happy."

 KHA_fusion_of_ideas:0 "A fusion of Lifestyles"
 KHA_fusion_of_ideas_desc:0 "Yak and pony have much to learn from each other. Yak society has changed over years since conquest of Commonwealth pony, and now Yak society looks a lot closer to Commonwealth than ever has before."

 KHA_knights_of_the_khan:0 "The valiant Knights"
 KHA_knights_of_the_khan_desc:0 "Albion knights do not fight as well as Yak SMASHer, but they fight still. Yak respect pony bravery, fighting Yak in face of being SMASHed. Yak will work alongside pony knights, and give rights."

 KHA_tributary_cities:0 "The prosporous Traders"
 KHA_tributary_cities_desc:0 "Pony traders make a lot of money as they are, do not need Yak to mess up money making systems. Yak will just impose a small tax and let ponies continue as they are."

 KHA_towards_upper_mare:0 "Secure the upper Mare"
 KHA_towards_upper_mare_desc:0 "Yak must secure a mightier empire for Khanate. River will be a good place for Yak empire to end, as Yak do not like to swim across river. Yak don't like water."

 KHA_our_natural_borders:0 "Our Natural Borders"
 KHA_our_natural_borders_desc:0 "It is Yak destiny to own all land between the Polga River and the Mare River. The Khagnate shall set out to remove the few remaining to the east."

 KHA_special_yak_forces:0 "A new Royal Guard"
 KHA_special_yak_forces_desc:0 "Yak have always been strong, but pony have idea of Royal Guard, the best of the best who protect Emperor. Yak like this idea. Yak take best pony and best Yak, turn into new Royal Guard for Emperor."

 KHA_cities_must_flourish:0 "Allow local democracy"
 KHA_cities_must_flourish_desc:0 "Pony have idea of democracy, where ponies can vote on what they want to be done. Yak find idea slightly strange, but Yak is okay with idea. Yak will allow local democracy across Khagnate."

 KHA_loosen_reigns:0 "Create free Courts"
 KHA_loosen_reigns_desc:0 "Pony do not trust Yak Emperor to be entirely unbiased in rulings, which Yak find wrong, but is pony belief. So Yak take effort to show trust to pony. Yak will make court not connected to Emperor control, make pony trust Yak more."

 KHA_our_new_homeland:0 "Our true Homeland"
 KHA_our_new_homeland_desc:0 "Commonwealth is now home of Yaks, truly. We remember Yakyakistan fondly, but Yakyakistan is no longer home of our true Khagnate. Yak have new home.  Better home."

 KHA_pony_in_us:0 "The Harmonious Mandate"
 KHA_pony_in_us_desc:0 "Yak have gained the trust of many pony citizens, and pony citizen are more and more happy to follow every day. Now with pony magic and Yak strength, Yak are able to make large agriculture, and remove radiation from certain areas."

 KHA_dynasty_is_born:0 "Now and Forever"
 KHA_dynasty_is_born_desc:0 " Khan and Emperor Grimsmasher has built something great in the former Commonwealth, where both Yak and pony can live happy, healthy. The time has come for the Khan to reap his reward, and all of Yakkind shall be grateful, forevermore."

 KHA_the_true_yak_way:0 "The true Yak Way"
 KHA_the_true_yak_way_desc:0 "Yak have SMASHed Commonwealth puny ponies, and Yak will remain true to Yak way!"

 KHA_plunder_the_cities:0 "Plunder the Cities"
 KHA_plunder_the_cities_desc:0 "Pony keep much within their cities, Yak want! Yak will SMASH all pony in Yak way! Yak will take all Yak wants!"

 KHA_enslave_the_unworthy:0 "Enslave the Ponies"
 KHA_enslave_the_unworthy_desc:0 "Pony in Fillydelphia, where Khan got cybernetic leg, had right idea of pony slavery. Let Yak do the important things, ponies serve."

 KHA_glory_to_the_khan:0 "Glory to the Khan!"
 KHA_glory_to_the_khan_desc:0 "Khan Grimsmasher is the Yakiest Yak to ever Yak! As Yak Khan of Yak Khagnate, and as Conqueror of Commonwealth, Grimsmasher is celebrate."

 KHA_obey_or_else:0 "Obey, or else"
 KHA_obey_or_else_desc:0 "Pony think they can resist Yak rule. A few SMASHed pony skulls should teach ponies to not be so stupid."

 KHA_relocate_industry:0 "Relocate Industry"
 KHA_relocate_industry_desc:0 "Commonwealth cause too much trouble, too spread out. Yak SMASH industry and bring closer to Yak home, under Yak control."

 KHA_scale_up_ways:0 "Yak Slave-Lords"
 KHA_scale_up_ways_desc:0 "Yak like the pony slaves which Yak have been keeping, they make things run much nicer for common Yak. Perhaps it's time Yak take even more of them."

 KHA_establish_temporary_sartryps:0 "Gift land to relatives"
 KHA_establish_temporary_sartryps_desc:0 "Relatives to Khan are strong, though not as strong as Khan self, and loyal to Khan. Khan shall make relatives administrators of land taken by Khan, to reduce burden on Khan."

 KHA_continue_the_conquest:0 "Continue the Conquest"
 KHA_continue_the_conquest_desc:0 "Commonwealth was first step of Yak, but not last step! Yak charge across Wasteland! Yak SMASH all enemies of Yak! Yak become mighty!"

 KHA_finish_off_stragglers:0 "Finish off §Nthe Stragglers§!"
 KHA_finish_off_stragglers_desc:0 "Ponies and Griffons south of Yak Khagnate weak! Yet also have much loot and many slaves for Yak to take. Yak charge south!"

  KHA_tear_apart_hornsmith:0 "Tear apart §RHornsmith§!"
  KHA_tear_apart_hornsmith_desc:0 "Hornsmith ponies weak, fighting amongst each other, not even strongest Paragons able to unite them! Yak fix division. Bring pony together under Yak flag."

 KHA_deal_with_breakaways:0 "Deal with §Cthe Breakaways§!"
 KHA_deal_with_breakaways_desc:0 "Commonwealth ponies too weak to keep territory under control, had other weak ponies break away. Yak not make same mistake."

 KHA_march_into_nurior:0 "March into §YNurior§!"
 KHA_march_into_nurior_desc:0 "Nurior Alliance too weak to be one great nation like Commonwealth was, instead squabbling countries. Yak bring end to squabbling. Yak bring end to Alliance."

 KHA_khar_nued:0 "Khar-Nüd"
 KHA_khar_nued_desc:0 "Smiletown city have interesting secret, puny ponies not puny ponies at all, instead cuddly changelings. Changelings very useful to Yak Khagnate, Changelings now honorary Yak, and work as Yak spies. "

 KHA_glorious_horde:0 "The Glorious Horde"
 KHA_glorious_horde_desc:0 "Khagnate is not a pony 'nation', Yak Khagnate, like all Yak countries, is an excuse for SMASHing, and nothing is better than SMASHing than the Khagnate's new, massive, horde."

 KHA_elevate_paragons:0 "Elevate the Paragons"
 KHA_elevate_paragons_desc:0 "Paragon ponies strong! Not as strong as Yak, but almost as strong as Yak child. Paragon ponies appreciate good Yak-Song and Yakstoberfest, so Yak reward Paragons with much respect. Paragons are honorary Yak!"

 KHA_enslave_archivists:0 "Enslave the Archivists"
 KHA_enslave_archivists_desc:0 "Archivist ponies want to study, then they will study in chains. Ponies deemed 'eggheads' will serve Yak Khagnate, their minds will make Yaks stronger!"

 KHA_take_over_jadestar:0 "Co-opt Jadestar Operations"
 KHA_take_over_jadestar_desc:0 "Jadestar ponies keep slaves, just like Yak Khagnate! Yak see their operations and they are acceptable, though bad by Yak standards. Yak SMASH Jadestar and take slaves for self."

 KHA_annihilate_enclave:0 "Annihilate the §BEnclave§!"
 KHA_annihilate_enclave_desc:0 "Flying ponies think they're so much better than Yaks because they fly. Yak hear Pegasi have hollow bones. Yak will SMASH to find out."

 KHA_a_golden_offer:0 "A Golden Offer"
 KHA_a_golden_offer_desc:0 "Yak Khan has ponies approaching, begging for an audience. Yak Khan shall allow them to speak, for now. This will surely have no unforeseen consequences for Yak."

 KHA_brutal_occupation:0 "Ashes in our Wake"
 KHA_brutal_occupation_desc:0 "Yak will SMASH all that is in Yak way! Do not care if alive or building! And if pony think they can stand in Yak way, then Yak SMASH!"

 KHA_entice_collaborators:0 "Benevolent Oppression"
 KHA_entice_collaborators_desc:0 "Yak give pony protection. Pony are too weak to protect self, so Yak protect pony for pony own good. All Yak ask for in return is servitude."

 KHA_destroy_silly_knights:0 "Destroy the §gSilly Knights§!"
 KHA_destroy_silly_knights_desc:0 "Ponies in armor call themselves Knights and think equal to Yak. Pony is wrong! Armor just make SMASHing all the more fun! Will crush pony like tin-can under Yak hoof!"

 KHA_end_pathetic_traders:0 "End the §Gweak Traders§!"
 KHA_end_pathetic_traders_desc:0 "East Equestrian Commission neglect war to focus on 'trade', boring! Yak have no need for their gold, only for their land. So Yak take their land!"

 KHA_reward_sosans:0 "Reward the Sosans"
 KHA_reward_sosans_desc:0 "Sosa ponies good ponies, compared to Enclave. Yak reward Sosans with much land, Sosans in return teach Yak ways of water. Good trade."

 KHA_into_neighgara:0 "Into §dNeighgara§!"
 KHA_into_neighgara_desc:0 "Neighgara ponies strong, maybe even stronger than Commonwealth ponies. But Yak Khan is not fettered by rumors of pony god. Yaks SMASH."

 KHA_bloody_river_banks:0 "Examples to be made"
 KHA_bloody_river_banks_desc:0 "Some ponies still think to resist Yaks. Yak take families of resistance and SMASH. Teach ponies to stop complaining."

 KHA_take_rightful_servants:0 "Our rightful Servants"
 KHA_take_rightful_servants_desc:0 "Yak need more slaves to serve Yak, there are many pony in Yak owned territory that can fill this purpose. Yak take one hundred ponies from around country and make servants."

 KHA_every_yak_under_sun:0 "Every Yak under the Sun"
 KHA_every_yak_under_sun_desc:0 "Khan Grimsmasher's legend spreads even to Yakyakistan! More and more small clans come to join great Khagnate! The Yaks stand together!"

 KHA_trial_by_combat:0 "Trial by Combat"
 KHA_trial_by_combat_desc:0 "Albion knights challenge Khan to combat, ponies call honorable duel. Ha! Yak take honorable duel, Yak Khan will smash all knights!"

 KHA_body_on_every_corner:0 "A body on every street-corner"
 KHA_body_on_every_corner_desc:0 "Traders think they are strong? Ha! They try to resist Yak rule? Fine! Yak will bring revenge to trader ponies. Yak will kill those who resist, leave bodies on streets as message."

 KHA_plunder_their_treasures:0 "Plunder their treasures"
 KHA_plunder_their_treasures_desc:0 "Yak don't need gold, but Yak wouldn't say no to gold. Traders have much gold, Knights also have gold, Yak take for self. Use to build up Yak lands."

 KHA_meeting_a_god:0 "Meeting a God"
 KHA_meeting_a_god_desc:0 " Pony whisper about god in region, NERTHUS. Stupid name for stupid pony god. Yet Khan is openminded Khan. He will meet the so-called god. Perhaps SMASH the god."

 KHA_kindred_spirit:0 "A second Homeland"
 KHA_kindred_spirit_desc:0 "Commonwealth land is Yak new home, but Yak are nomadic, doesn't need to be Yak only home. Yak roam across new Neighgara as new, second home."

 KHA_world_devouring_horde:0 "World-devouring Horde"
 KHA_world_devouring_horde_desc:0 "If it exists, it belongs to Yak. If it does not belong to Yak, then it will either not exist, or will belong to Yak. This is the Yak code to the world. Follow or be SMASHed!"

 KHA_break_bread_goldwings:0 "Seize the Arisian Navy"
 KHA_break_bread_goldwings_desc:0 "Yak see Hippogriff navy built in New Aris. Yak take Hippogriff navy built in New Aris."
 
 KHA_kidnap_eec_engineers:0 "Kidnap EEC-engineers"
 KHA_kidnap_eec_engineers_desc:0 "Some traders smart ponies, know how to manufacture even better weapons for Khan. Would offer money, but would be wasteful. Will just take smart ponies and force to work."

 KHA_march_frozen_oasis:0 "March on the §CFrozen Oasis§!"
 KHA_march_frozen_oasis_desc:0 "Yak not implemented this focus yet. Yak will get to it later."

 KHA_storm_striped_city:0 "Storm the §gstriped City§!"
 KHA_storm_striped_city_desc:0 "City once called Petershoof, north of Polga River, owned by Stripe Zebras. Zebras tougher than ponies, but still weak compared to Yak. Khan will SMASH zebras, show Khan better than Caesar."

 KHA_great_tundra:0 "The §BGreat Tundra§!"
 KHA_great_tundra_desc:0 "Yak not implemented this focus yet. Yak will get to it later."

 KHA_city_of_wonders:0 "§OCity of Wonders§!"
 KHA_city_of_wonders_desc:0 "Yak not implemented this focus yet. Yak will get to it later."

 KHA_crystal_border:0 "The §tCrystal Border§!"
 KHA_crystal_border_desc:0 " Yak not implemented this focus yet. Yak will get to it later."

 KHA_smash_zone:0 "§FSmash the Zone§!"
 KHA_smash_zone_desc:0 "Princessyn, Stalliongrad, Yak do not understand why pony can not keep one name for single city. Doesn't matter for Yak, Yak will take city and SMASH any in the way!"

 KHA_towards_storm:0 "Towards the Storm"
 KHA_towards_storm_desc:0 "Yak not implemented this focus yet. Yak will get to it later."

 KHA_all_along_the_mare:0 "All along the §GMare-River§!"
 KHA_all_along_the_mare_desc:0 "Mare River be south border of Yak Khagnate, separates 'Heartlands' from North-East. Yak want Heartlands for self. Yak charge across river, SMASH those on other side."

 KHA_unto_familiar_mountains:0 "Towards §Nfamiliar mountains§!"
 KHA_unto_familiar_mountains_desc:0 "Yakyakistan to west of Khagnate land. Khagnate traveled across this land to new Khagnate home. Time has come for Khagnate to make way back, stronger than ever."

 KHA_homecoming:0 "§RHomecoming§!"
 KHA_homecoming_desc:0 "Yak not implemented this focus yet. Yak will get to it later."



 
 
### Industry/Subject Tree ###
 
 KHA_support_the_acolytes:0 "Support the §rAcolytes§!"
 KHA_support_the_acolytes_desc:0 "South-Eastern Yak ally is furthest away from Commonwealth enemy, making best Yak ally for support. Acolytes of Sorrow be given some Yak money to prepare for war against puny Solaris Filiis."

 KHA_acolyte_infrastructure:0 "Acolyte Infrastructure"
 KHA_acolyte_infrastructure_desc:0 "Acolyte Yak ally have many hills, Yak are expert with hills, Yakyakistan have more hills than Yaks. Yak send Yaks to SMASH hills into trottable pathways for Yak pony ally."

 KHA_punish_failiure:0 "Punish failiure"
 KHA_punish_failiure_desc:0 "Yak pony ally fail easy war, prove are not worthy to be Khagnate ally. Khan order puny pony failures to be gathered together, most puny will be SMASHed."

 KHA_expand_stoneworks:0 "Expand Stoneworks"
 KHA_expand_stoneworks_desc:0 "Yak ally province 'Stoneworks' contains many materials that improve Yak SMASHing. Materials in hard to reach places for pony ally. No worry, Yak SMASH way to resources for pony."

 KHA_fund_direfall:0 "Fund Direfall"
 KHA_fund_direfall_desc:0 "Direfall city close to Yak lands, has much space for factories to produce the means of SMASHing. Yak send Yaks over to city, Yak strength build big Yak-size factories for ponies."

 KHA_integrate_remnants:0 "Integrate their Remnants"
 KHA_integrate_remnants_desc:0 "Not all Acolyte ponies so puny, some did their best but failed because ponies are weak. Yak can't blame pony for being weak, it is pony nature. Yak take in the best ponies, though some Yak may grumble about it."

 KHA_assist_slave_raids:0 "Assist in Salve-raids"
 KHA_assist_slave_raids_desc:0 "Acolyte ponies take non-Acolyte ponies as slaves. Yak great at breaking fortifications. Yak send over small squad of Yaks to teach Acolyte ponies how to better break fortifications, make better at taking slaves."

 KHA_carrotsburg_buildup:0 "Carrotsburg Buildup"
 KHA_carrotsburg_buildup_desc:0 "Acolyte pony help Yak in war against Commonwealth, Yak reward with Carrotsburg. Yak don't like carrot anyway. Yak aid Acolyte pony more, turn useless carrot making place into SMASH-making place."

 KHA_rebuild_solaria:0 "Rebuild Solaria"
 KHA_rebuild_solaria_desc:0 "Yak not often rebuild, often Yak just SMASH. Acolyte pony damage much of Solaria in SMASHing of puny non-Yak ally pony settlement. Yak put aside desire to SMASH to rebuild. Don't expect this from Yak again."

 KHA_integrate_acolytes:0 "Into the Fold"
 KHA_integrate_acolytes_desc:0 "Yak ally Acolytes grateful for all of Yak help, see no further reason to remain independent. Yak happily accept loyal Acolyte ally into Khagnate land."

 KHA_strengthern_consortium:0 "Strengthen the §NConsortium§!"
 KHA_strengthern_consortium_desc:0 "Detrot pony be least loyal Yak ally, most likely to break away, yet also provide Yak much good. Yak will show good faith to Yak ally, will make stronger, though Yak ally might think can oppose Yaks due to Yak help."

 KHA_dissolve_triad:0 "Dissolve the Triad"
 KHA_dissolve_triad_desc:0 "Three families that rule Detrot failed Khagnate despite Khagnate help. Ponies puny, couldn't unite under single leader. Yak help with pony problem, SMASH three families and become sole leader of Detrot ponies."

 KHA_move_into_detrot:0 "Move into Detrot"
 KHA_move_into_detrot_desc:0 "Detrot ponies puny, but Detrot factories good. Khagnate send Yaks into city to watch over pony, ensure production for Khagnate, eliminate puny pony protests."

 KHA_restore_motor_factories:0 "Restore motor-factories"
 KHA_restore_motor_factories_desc:0 " Detrot pony make many engines and motors for Khagnate, Yak appreciate production. Yak send over thankful Yaks to SMASH rubble and restore old factory for engine production."

 KHA_train_their_troops:0 "Train their troops"
 KHA_train_their_troops_desc:0 "Detrot ponies have smallest army of all members of alliance, make Detrot ponies vulnerable. Yak send over instructors to strengthen pony soldiers, make half as strong as Yak child."

 KHA_cantor_line:0 "The Cantor-line"
 KHA_cantor_line_desc:0 "Detrot ally have small border against Commonwealth, yet border that is easy to push through, could result in Yak ally being encircled by Commonwealth forces. Yak send over Yak experts to Detrot ally, make fortifications to prevent."

 KHA_assist_with_recruitment:0 "Assist with recruitment"
 KHA_assist_with_recruitment_desc:0 "Detrot ponies not join Detrot ally army, is very annoying with Commonwealth war coming. Yak fix silly situation, march through Detrot with many Yak, make pony want to march alongside Yak."

 KHA_grimhold_docks:0 "Grimhold docks"
 KHA_grimhold_docks_desc:0 "Phoenix Supremacy proven NOT supreme! Yak ally Detrot pony SMASH Phoenix, take land for selves! Yak send over bear Yak builders to build coast factories."

 KHA_restore_ascension:0 "Restore Ascension"
 KHA_restore_ascension_desc:0 "Detrot ally forces SMASH puny Starlight Cabal, but SMASH a bit too hard. Yak respect the SMASHing, so Yak help pony post-SMASHing, Yak rebuild many SMASHed factories."

 KHA_integrate_consortium:0 "Merging the Families"
 KHA_integrate_consortium_desc:0 "Detrot pony ally has been helped by Yaks to become mighty pony power. Yak take chance to approach three families and make offer, join Yak. Detrot ally surely accept!"

 KHA_back_up_arria:0 "Back up §OArria§!"
 KHA_back_up_arria_desc:0 "Arria ponies surrounded by Commonwealth, provide Yak good spot for Commonwealth invasion, but open to attack themselves. Yak send much aid to prevent Arria collapse, and Arria betrayal, like happened to Commonwealth ponies."

 KHA_reign_in_arria:0 "Traitors twice over"
 KHA_reign_in_arria_desc:0 " Arria traitors betray Yaks as they did ponies. But Yaks not ponies, do not forgive, do not forget. Arria traitors will be SMASHed!"

 KHA_a_lesson_learned:0 "The harsh Lesson"
 KHA_a_lesson_learned_desc:0 "Arria puny ponies have been SMASHed, remaining ponies rightfully afraid. Ponies learn, Yaks not to be messed with. Yaks are mighty and strong. Puny ponies follow Yaks now."

 KHA_expand_arria_foundries:0 "Expand the foundries"
 KHA_expand_arria_foundries_desc:0 "Arria make much metal, perfect for Yak SMASHing weapons and pony weapons both. Yaks sent to help Arria expand metal production, ensure better production for both."

 KHA_hand_over_pow:0 "Hand over POWs"
 KHA_hand_over_pow_desc:0 "Yak capture many Commonwealth ponies during war, many ponies related to ponies in Arria Yak ally. Yak don't know what to do with ponies, give to Arria. Let them use them."

 KHA_ravshire_forts:0 "Ravshire Forts"
 KHA_ravshire_forts_desc:0 " Ravshire city be on border with Commonwealth, has many resources. If Arria Yak allies prove puny, then city be taken by Commonwealth forces easy. Yak prevent this, Yak build up forts."

 KHA_vespeda_installations:0 "Vespeda installations"
 KHA_vespeda_installations_desc:0 "Vespeda city be close to western border with Commonwealth, good launching point for charge into Commonwealth capital. Yak ensure that city remain good, build factory to produce weapons and forts to protect."

 KHA_siege_proof_arria:0 "Siege-proof Arria"
 KHA_siege_proof_arria_desc:0 " If Arria city falls to Commonwealth, Yak ally falls as whole. Yak must prevent this from happening. Yak will build city even larger, even stronger, make it immune to SMASHing."

 KHA_harden_willows_grove:0 "Harden WIllow's Grove"
 KHA_harden_willows_grove_desc:0 "Southern connection to Khagnate lands make Willow's Grove useful for Commonwealth war. Yak would be fool to leave vulnerable, and Yak not fool. Yak will build up province for war."

 KHA_underground_construction:0 "Underground construction"
 KHA_underground_construction_desc:0 "Yak SMASH underground and make large cavern, where Arria ally can build factories free from enemy attack. Commonwealth ponies will use big SMASHers called artillery against Arria come war, but cannot hit what cannot see."

 KHA_teach_their_officers:0 "Teach their officers"
 KHA_teach_their_officers_desc:0 "Arria ponies only good in pony ways, make better in Yak ways. Yak team sent to Arria Yak ally, teach pony officers the way of SMASHing."
 
 KHA_help_them_smash:0 "Help them SMASH"
 KHA_help_them_smash_desc:0 "Ponies weak, even Yak ally ponies still weak! Weak pony cannot SMASH with hoof like Yak does. No worries. Yak teach pony how to use big kaboom to SMASH."
 
 KHA_groundwater_pumps:0 "Groundwater pumps"
 KHA_groundwater_pumps_desc:0 "Pony and Yak differ in many ways, but both need to drink. Yak prefer alcohol, but is low in supply. Arria Yak ally have water underground, Yak SMASH a pump into being, make water above ground." 
 
 KHA_integrate_arria:0 "The industrial Heart"
 KHA_integrate_arria_desc:0 "Arria ponies fully loyal to Khagnate, are sure to join. All Yak investment into Arria pony make into industrial power. Yak move in to new land, will love to use factories for Yak purposes." 
 
### Army Tree ###
 
 KHA_assemble_ords:0 "Assemble the Ords"
 KHA_assemble_ords_desc:0 "Yak mightiest warriors meet with Khan, discuss future of SMASHing. Yak only military has SMASHed puny ponies, yet there not many Yak. Perhaps Yak work with puny ponies, make strong ponies. Still weaker than Yak, but trained pony can be made to SMASH like Yak child."

 KHA_stick_to_arban:0 "Stick to the Arban-System"
 KHA_stick_to_arban_desc:0 "Yaks be the strongest and best SMASHers in world, no comparison. Yak SMASH puny ponies, puny zebras, Yak even SMASH dragons. Yak SMASHers remain as are, no need for puny pony aid."


 KHA_adopt_pony_tactics:0 "Adopt Pony tactics"
 KHA_adopt_pony_tactics_desc:0 "Yak lose war against Commonwealth because, much as Yak hates to admit it, pony tactics and weapons better than Yak. Pony might be puny and weak, but still beat Yak. Yak have much to learn."

 KHA_new_tools_smashing:0 "New tools for Smashing"
 KHA_new_tools_smashing_desc:0 " Puny pony do not SMASH as good as Yak alone, but puny pony make red stick that SMASHes with big boom. Yak enjoys pony red stick, will force puny pony to teach Yak how to use for better SMASHing."

 KHA_lessons_from_commonwealth:0 "Lessons from the Commonwealth"
 KHA_lessons_from_commonwealth_desc:0 "Puny pony rely on 'tactics' to beat mighty Yak during Commonwealth war. War more than just SMASHing enemy, Yak learn hard way. Yak interrogate captured pony generals, learn 'tactics', become better SMASHers."

 KHA_copy_commonwealth_navy:0 "Copy Commonwealth Navy"
 KHA_copy_commonwealth_navy_desc:0 "Yak not like water, water gets on coat, makes smelly. Pony river 'Polga' and 'Albion' be filled with weak pony ships, however, which Yak cannot SMASH. Yak learn water SMASHing from weak pony vessels."

 KHA_import_detrot_motors:0 "Import Motors from Detrot"
 KHA_import_detrot_motors_desc:0 "Yak too big for pony cars, yet Yak like pony cars idea. Yak like going fast, like SMASHing metal monster into puny enemy forces. Detrot ally make big, Yak sized motors, Yak use motors, make Yak sized cars."

 KHA_request_direfall_blueprints:0 "Request blueprints from Arria"
 KHA_request_direfall_blueprints_desc:0 "Yak surprised by flying ponies without wings when saw them, yet Yak also impressed by SMASHing power from above. Yak cannot stay on ground anymore, Yak ask Arria ponies how to make flying things, become flying Yaks."

 KHA_hire_merc_scouts:0 "Hire Talon-Scouts"
 KHA_hire_merc_scouts_desc:0 "Griffon Talons not as puny as ponies, are hard to SMASH, fast and with sharp talons, and big boomsticks. Yak appreciate little birds, will help Yak in exchange for gold. Improve Yak SMASHing, makes Yak happier, good deal."

 KHA_kheshig_for_khan:0 "A Kheshig for the Khan"
 KHA_kheshig_for_khan_desc:0 "After being wounded at Razorfield, despite his Warrior-kin escorting him, it is clear that we will need to establish some more formalized protection for the Khan. For this purpose, the Kheshig will be founded, a group of our most loyal warriors, that shall from now on form the Honour-Guard of Grimsmasher."
 
 KHA_learn_from_razorfield:0 "Learn from Razorfield"
 KHA_learn_from_razorfield_desc:0 "Many Yak fight and SMASH at Razorfield, learn how to fight pony with boomstick and tactics. Yak veterans from Razorfield gather in great meeting with Yak troops and Yak youth, tell stories of survival."

 KHA_invite_minor_clans:0 "Invite minor Clans"
 KHA_invite_minor_clans_desc:0 "Yak in Yakyakistan suffer under Khanates that collapse, small Clans used as SMASHers by big clans with no reward. 6th Khagnate be different. Khan invites Yak minor clans to 6th Khagnate, we SMASH together."

 KHA_the_big_iron:0 "The big iron"
 KHA_the_big_iron_desc:0 "Yak strong, can pick up and swing object that puny pony would call 'too heavy'. Yak don't use puny warriors, why use puny weapons? Yaks invent new weapons, big weapons, better SMASHers."

 KHA_layered_armor:0 "Invest in Body-Armor"
 KHA_layered_armor_desc:0 "Yak fur absorb puny pony bullets, but Yak fur not perfect. Yak strong, Yak don't need to rely on just fur alone. Yaks tear metal from pony buildings, shape for Yak body, make armor, make better SMASHing."

 KHA_even_more_yak:0 "More Yak for your Cap"
 KHA_even_more_yak_desc:0 "Yak strong, but Yak often not understand extent of Yak strength. Yak underestimate Yak strength, make Yak weaker, when could be stronger. Yak invest into understanding Yak strength, make Yak even stronger."

 KHA_scourge_of_wastes:0 "Scourge of the Wasteland"
 KHA_scourge_of_wastes_desc:0 "Puny pony Wastelanders fear Yaks, pony correct to fear. Yak strong, Yak fast, Yak many. Pony look at Yak in fear is pony that survive, Yak play off reputation. Yak become more feared sight in Wasteland."

 KHA_ultimate_firepower:0 "Ultimate Firepower"
 KHA_ultimate_firepower_desc:0 "Pony make big boomstick, Yak like big boomstick, but pony big not Yak big. Yak fix. Yak take pony 'artillery' and pony 'machine gun' and make one Yak boomstick. Yak enjoy the Dakka almost as much as Yak enjoy SMASH."

 KHA_fire_then_charge:0 "Fire THEN Charge"
 KHA_fire_then_charge_desc:0 "Many Yak charge while shooting boomstick, make boomstick not work as well, and hit other Yak. Yak improve SMASHing capabilities by much by changing order. Yak shoot boomstick at enemy, weaken, and then SMASH."

 KHA_superior_support:0 "Superior Support"
 KHA_superior_support_desc:0 "Pony weak, is truth. Is why pony not serve on Yak front line. But weak pony have use. Pony carry binoculars, carry shovel, carry Yak medicine. Pony call 'support forces', Yak call servants. Same thing!"

 KHA_greatest_tumen:0 "The greatest Tumen on Equus"
 KHA_greatest_tumen_desc:0 "6th Khagnate Army use big boomsticks, use big Dakka and big SMASH, use pony servants. Yak army not as big as old Khagnates, but Yak army better in every other way. Yak destroy all enemies of Yak."

 KHA_into_modern_age:0 "Into the modern age"
 KHA_into_modern_age_desc:0 "Yak not as smart as pony, not needed when can SMASH so good. But Commonwealth pony show SMASHing improved by smarts. In interest of better SMASHing, Yak must understand what pony call 'scientific methods'. We SMASH all other scientists in scientific progress!"

 KHA_yaks_on_water:0 "Yaks on the water"
 KHA_yaks_on_water_desc:0 "Yak finally reach pony river, Yak might not like water, but Yak able to experience new SMASHing. Pony boat hold almost as big boomstick as Yak can. Yak take boats and improve, make better SMASHing."

 KHA_ships_for_dummies:0 "Ships for dummies"
 KHA_ships_for_dummies_desc:0 "Yak find old pony book in pony building after SMASHing it. Book explains water to Yaks, 'buoyancy' and 'surface tensions' Yaks not know of before. Yak apply book to boat, make better."

 KHA_expand_fleet_infrastructure:0 "Expand anval infrastructure"
 KHA_expand_fleet_infrastructure_desc:0 "Yak need place to build Yak boats. Yak boats too big to carry across land, so Yak build boat by the water. Allow better building of Yak boat."

 KHA_yak_hulks:0 "Yak hulks"
 KHA_yak_hulks_desc:0 "Pony sailor complain about 'weight distribution' and 'sinking' when Yak propose Yak armor for Yak ship. Pony usually wrong, but pony has more experience with ship. Yaks listen to ponies, but Yak also make sure Yak boat has Yak sized armor."

 KHA_smashing_on_the_sea:0 "Smashing on the seas"
 KHA_smashing_on_the_sea_desc:0 "Yak boats close to complete, but pony boomsticks too small for Yak ship, not enough SMASHing power. Yak fix problem, take pony boomsticks, and make bigger. Yak boomsticks SMASH puny zebra and pony boats."

 KHA_armored_barges:0 "Armored barges"
 KHA_armored_barges_desc:0 "Yak and pony study on armor come to conclusion, Yak can make most armored ships on river, though won't have as big boomsticks as Yak want. Yak is sad."

 KHA_think_watery:0 "Think watery"
 KHA_think_watery_desc:0 "Yak learn what it's like to be boat in order to build boat. Shamans and soldiers go to river and swim for hours. Yaks stink once done, but Yaks learn more about water."

 KHA_khaganate_on_high_seas:0 "The Khaganate on the High Seas"
 KHA_khaganate_on_high_seas_desc:0 "Rule 6th Khagnate, 6th Khagnate Rules The Seas!\n Yak boats now biggest boats ever, and if not, Yak SMASH larger boats. Yak navy is best navy, this is not surprising."

 KHA_yaks_in_the_air:0 "Yaks in the Air"
 KHA_yaks_in_the_air_desc:0 "First Yak flights happen, was horrible. Yak do not like flying much, but Yak learn from experience. All Yak pilots crash, some die, some don't. Yak scholars learn from this."

 KHA_build_planeyards:0 "Build Planeyards"
 KHA_build_planeyards_desc:0 "Yak plane need place to launch from and return to, no better place than Yak Warcamp. Yak SMASH the ground to make flat run-way for planes."

 KHA_sky_chargers:0 "Sky-Chargers"
 KHA_sky_chargers_desc:0 "Yak love charging on ground, why planes be any different? Yaks scare puny pony fliers by flying directly at them. If pony not pull away, then planes crash and Yak likely survive, since Yak tough. If pony scared and pulls away, then Yak shoots. It just works!"

 KHA_sky_smashers:0 "Air-Smashers"
 KHA_sky_smashers_desc:0 "Yak like big explosions from bombs, but bombs heavy for Yak to carry. Yak load bombs into planes, drop from above enemies, SMASH enemy fortifications for great Yak charge."

 KHA_YAS:0 "Y.A.S."
 KHA_YAS_desc:0 "Yak Air Support is the greatest in the World!"

 KHA_big_planes_big_yaks:0 "Big planes for big yaks"
 KHA_big_planes_big_yaks_desc:0 "Yak do not fit into normal pony plane, Yak is too mighty for puny size. Yak import engine from Detrot and make big flying thing for Yak. Yak attach many boomsticks to flying thing, and Yak SMASH enemies."

 KHA_jumping_out_of_planes:0 "Jumping out of planes"
 KHA_jumping_out_of_planes_desc:0 "What more scary than Yak charging from in front of pony? Yak charging from above pony! Yak don't even need parachute like puny pony, Yak break landing with skulls of enemy and pure Yak strength."

 KHA_hordes_in_the_skies:0 "Hordes in the Air"
 KHA_hordes_in_the_skies_desc:0 "Yak know that one Yak is strong, but many Yak is stronger. One Yak destroys house, hundred Yaks destroy mountain. So Yak apply same to planes, make many big Yak planes, overwhelm enemies."

 KHA_begin_great_change:0 "Begin the great change"
 KHA_begin_great_change_desc:0 "Yak begin to slowly change, force all Yak soldiers and new pony soldiers into classes to learn from each other. Yak soldier make pony soldier strong, pony soldier make Yak soldier smart."

 KHA_learn_from_allies:0 "Learn form our allies"
 KHA_learn_from_allies_desc:0 "Khagnate pony allies aided Yaks during war against Commonwealth, pony allies have many lessons. Yaks will learn from them, and apply their lessons."

 KHA_lessons_to_be_drawn:0 "Lessons to be drawn"
 KHA_lessons_to_be_drawn_desc:0 "Yak schooling and pony schooling worked, now Yaks and ponies work together to draw up new ideas for future based off Commonwealth war."

 KHA_restructure_army:0 "A restructured army"
 KHA_restructure_army_desc:0 "Yak-apologies, We Yaks might SMASH-er, smash, better than ponies, but ponies still valuable. Ponies join our Yak army, make into Khagnate army instead of just Yak army. Ponies also teach how to better communicate."

 KHA_integrate_support_mages:0 "Integrate support-mages"
 KHA_integrate_support_mages_desc:0 " Pony magics have provided ponies with great balance against stronger species in war. Equestria only fight against Zebrica for so long due to magic. Yaks can learn from magic, use magic."

 KHA_tin_soldiers:0 "Tin soldiers"
 KHA_tin_soldiers_desc:0 "On our way south, Yak, we Yaks, saw puny pony city, Princessyn, filled with metal ponies. We Yaks were impressed by the smashing potential of pony inventions. Yak and pony scholars now work to make 'robot' and 'power armor'."

 KHA_pony_ingenuity:0 "Pony ingenuity"
 KHA_pony_ingenuity_desc:0 "Ponies always smarter than Yaks, needed to be in order to not be SMASH-er-smashed. Pony scholars now work alongside Yak scholars, two species learning from each other."

 KHA_swap_to_rifles:0 "Swap to rifles"
 KHA_swap_to_rifles_desc:0 "Yaks love to use big weapons to SM-to smash enemy forces. But bullet serves as massive force multiplier more than big weapon does. Many Yak still like to use big weapon, but many Yak also like the 'Dakka' of pony rifles."

 KHA_recover_blueprints:0 "Recover blueprints"
 KHA_recover_blueprints_desc:0 "Equestrian Army in area left behind many blueprints and ideas in factories. Usually Yaks wouldn't care about them, but pony scholars convinced Yaks to care. Khagnate studies the ways of the old Equestria to become better warriors."

 KHA_finish_the_reforms:0 "Expand the reforms"
 KHA_finish_the_reforms_desc:0 "Khagnate military still is much too Yak focused. Yak are strong, but with guns, strong doesn't matter as much. Khagnate military changed to reflect Khagnate citizens, more ponies included."

 KHA_embrace_new_designs:0 "Embrace new designs"
 KHA_embrace_new_designs_desc:0 "Many Yaks aren't happy about it, but the allure of rapid fire Dakka is too much to resist. Even the most traditional Yak has placed down all but the biggest of weapons, to pick up pony rapid-fire guns."

 KHA_yak_strength:0 "Yak strength..."
 KHA_yak_strength_desc:0 "Despite our reforms, it is obvious that Yaks are still the strongest species in the world, it's undeniable. The army has a place for ponies, but Yaks still have their own place. It is always within the blood of a Yak to smash their enemies, after all."

 KHA_pony_tactics:0 "And Pony tactics"
 KHA_pony_tactics_desc:0 "Due to our reforms, our armed forces are now using more and more pony tactics. Officers speak more like ponies, strategies are more complex than 'charge and smash', while ponies and Yaks serve together, side by side."

 KHA_modern_wasteland_military:0 "A modern Wasteland military"
 KHA_modern_wasteland_military_desc:0 "The eventuality of the Khagnate has been reached, if we are to be a wasteland nation, then we need a wasteland military. After much effort and many reforms, the Khan is proud to announce the success of the military reforms. Now Yak and pony troops march side by side, not separated by species. There's even rumors a few ponies are beating Yaks in hoof wrestling."






 
 
 
