 KHA_lack_of_cohesion_idea:0 "Lack of Cohesion"
 KHA_lack_of_cohesion_idea_desc:0 "The various nations that make up the §RGreat Khaganate§! have little in common other than their dislike for the Commonwealth.\nNow, with the Commonwealth beaten down, many simply don't see the reason for further military cooperation."
 
 KHA_strangers_in_strange_land_1_idea:0 "Strangers in a strange Land"
 KHA_strangers_in_strange_land_1_idea_desc:0 "Surprisingly, Yaks are from Yakyakyistan, not from north-eastern Equestria. When the Yaks making up the 6th Khagnate arrived to these lands, they crushed all forces opposing them, but now they are left trying to figure out the ways of those they conquered. The buildings are too small for great Yak frames, the guns do not fit strong Yak hooves, the swords break upon being swung by tough Yak. The Yaks will have to become one with the land, if they wish for the land to become one with them."
