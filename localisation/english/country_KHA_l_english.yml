 KHA_char_grimsmasher_name:0 "Khan Grimsmasher"
 
 
 

##############
### EVENTS ###
##############
 
 khanate.1.t:0 "Clan Tsasan"
 khanate.1.d:0 "WIP\n\nWhat was our clan at home in Yakistan like? What were our most distinct qualities?"
 khanate.1.a:0 "Our Prowess"
 khanate.1.b:0 "Our Dilligence"
 khanate.1.c:0 "Our Size"
 
 khanate.2.t:0 "Along the Polga"
 khanate.2.d:0 "WIP\n\nWhile we plundered many minor settlements on our way southwards, the bigger cities were able to pose some resistance.\n\nHow did we deal with these Cities, Intimdation or open Warfare?"
 khanate.2.a:0 "Intimidation"
 khanate.2.b:0 "SMASH!"
 
 khanate.3.t:0 "The indecisive Blow"
 khanate.3.d:0 "The two armies of the Commonwealth fought desperately to close their lines again.\nIt was no use, the Yaks had broken through their front and were bitterly fighting their way to the backlines. From all sides their forces were beset, with the reinforcements from Stratusburg and Novochernusk refusing to engage, and the Arrians having turned on their former overlords, the Commonwealth was truly doomed.\nGrimsmasher intended to make sure their fall came swiftly. Surrounded by some of his best soldiers, they were cutting a bloody swath to the top of a hill where the Royal Banners had been spotted. One of them at least, for it seemed the King and Queen of the Commonwealth were leading different parts of their desperate army.\n'THERE!' one of Grimsmashers Lieutenants shouted, pointing to a group of ponies making their way to one of the few Trucks the Commonwealth army used. Their uniforms had the Yellow trim of the Royal Guard, and so one of the Royals must be there. Grimshmasher and his Kin changed course, charging up the hill. The Royal Guard was swift to respond, shielding the Royal from the Yaks' first salvo, before returning fire, and actually managing to down some of the Yak Warriors.\nGrimsmasher ignored their fire, as he had spotted his target, Queen Falling Dusk. He let his Kin deal with the Guards, jumping their line to deal with the Queen Personally. The unicorn mare released some sort of spell, shearing armor plates off Grimsmasher's side, but it was too late. A burst from his guns tore into her side, and she fell to the ground. Grimshamsher, not breaking his charge, moved to crush her head with his hoof, though with a defiant roar, the Queen unleashed another great arc of magic, shredding his front leg. Now on three legs, Grimsmasher rose again, ready to finish the job, but the Queen's eyes were already lifeless. At the foot of the Hill, the Commonwealth forces were breaking, many fleeing, while others were cut down by Grimshasher's forces."
 khanate.3.a:0 "Victory!"
 
 khanate.4.t:0 "The Assault on Kucyków"
 khanate.4.d:0 "Grimshasher sat in his tent, one of his wives bandaging the stump where the Shaman had amputated his shredded leg. His Servants had already assured the Khan that they would send someyak to Fillydelphia with a large amount of Caps, to buy a cybernetic replacement from the Slaver-lord of the City.\nNow, Grimsmasher sat and waited, having given command of the Assault on Kucyków to his cousin Rockcrush. As displeasing as it was to sit out such a major battle, to not be able to deliver the deathblow to an enemy, he knew that he couldn't lead a charge in his state.\n\nAs the Sun began to set, the sound of an army returning filled the Warcamp. With hesitation a group of his advisors, as well as the three Pony-leaders that had betrayed the Commonwealth for him entered his tent.\nRockcrush was not among them.\nThey began to tell him of their failiure. Kucyków had held, the suburbs being ill-suited to the Yak's ususal charges, and the mighty walls raining down fire on their forces. Rockcrush had been slain in the assault, as had many of Grimsmasher's Warriors. King Purefire also seemed to have escaped the Battle at Razorfield alive.\nGrimsmasher took the news with quiet dignity, dismissing them all after they finished their reports, and ordered the alcohol-supplies of the camp to be given out to the returning warriors.\nOne of the Ponies, Dried Ink stayed behind. The former Governor of Arria assured the Khan that he had assassins in the city, and that King Purefire would be dead come the morning.\n\nDried Ink turned out to be right, but the Commonwealth was still standing even with their Monarch's death, and the Yaks would have to recover before another assault."
 khanate.4.a:0 "We Failed... for now"
 
 khanate.5.t:0 "Meeting of the Generals"
 khanate.5.d:0 "WIP\n\nGrimshmasher meets with his generals and decides on how to rebuild the army. They can either opt to keep the pure Yak-military, or begin integrating local pony forces. The latter option will be very disliked by many Yaks."
 khanate.5.a:0 "Hold to Tradition"
 khanate.5.b:0 "We will need to change"
 
 khanate.6.t:0 "Preparing for the Rematch"
 khanate.6.d:0 "WIP\n\nThe Armies of the Khanate are weakened, many soldiers wounded, much equipment lost. We will enter a time of rebuilding and healing, before we embark on our next conquest. The Khan has allowed for one year of peace, before we take up arms once more." 
 khanate.6.a:0 "Soon"

 khanate.7.t:0 "This Land is Our land"
 khanate.7.d:0 "WIP\n\nNow that we are stuck in this land for the forseeable future, many of our Clan are wondering how we should live until we conquer the Commonwealth.\nOne Group advocates taking some ideas from the ponies and forming proper permanent Settlements, maybe even let those too old or young of us to take up agriculture.\nAnother group rails against these ideas, decrying them as un-yaklike and insists that we should only keep to our tent-cities, and rather forge more weapons thant bother with the pony-lifestyle."
 khanate.7.a:0 "Settlements"
 khanate.7.b:0 "Warcamps"

 khanate.8.t:0 "The Equine's place"
 khanate.8.d:0 "WIP\n\nWe now rule over a considerable population of non-yaks. They have no idea about our usual culture, and are mainly used as servants and slaves. We could either keep it like this, or make an effort to integrate those ponies more into our society. Of course, the learning would likely go both ways, as some of our Citizens might decide to adopt some of the ponies' ideas."
 khanate.8.a:0 "Live and let-live"
 khanate.8.b:0 "They are servants, no more"

 khanate.9.t:0 "Ponies in the administration"
 khanate.9.d:0 "WIP\n\nAs our grip over this hand tightens, we will need to set up a proper administration\nWe could tap into the pre-existing pool of Commonwealth officials to support our Yak-appointees, though that would bind us on a more permanent basis to the local systems.\nAlternatively, we could fill all but the most menial position with Yaks, which would certainly cement our dominance over our subjects, but also pushes the locals away."
 khanate.9.a:0 "Allow pony-administrators"
 khanate.9.b:0 "Allow only Yaks"
 
 khanate.10.t:0 "Dissolving the Gangs"
 khanate.10.d:0 "WIP\n\nNow that we have conquered Tartarus, we will have to decide on what to do with the gangs that lived in the prison.\nWe could either force them to build up our nation, and improve our settlements, or alternatively we could conscript them into the army as cannon-fodder."
 khanate.10.a:0 "Put them to work"
 khanate.10.b:0 "We need more soldiers"

khanate.11.t:0 "Khanate calls to War"
khanate.11.d:0 "WIP\nKhanate is about to go to war with the Commonwealth, now is our last chance to ask for a delay, or betray them."
khanate.11.a:0 "Let's do this"
khanate.11.b:0 "Ask for 60 more days"
khanate.11.c:0 "Attack the Khanate"

khanate.12.t:0 "Subject asks for a Delay"
khanate.12.d:0 "WIP\nOne of our subjects has asked that we delay the invasion, as they themselves are still embroiled in a war. If we accept, we'd have to wait 60 more days, but their loyalty would increase"
khanate.12.a:0 "Ignore the Request"
khanate.12.b:0 "Accept the Delay"

khanate.13.t:0 "Spoils of Victory"
khanate.13.d:0 "WIP\n\nThe Commonwealth lies destroyed, its armies smashed, its ponies terrified. Now we need to decide how to proceed. Do we continue our conquest, and make this whole pathetic region kneel at our hooves, or do we take over the institutions of the Commonwealth, and settle down as a people in this prosperous land?"
khanate.13.a:0 "Continue Conquest"
khanate.13.b:0 "Allow Settlement"

khanate.14.t:0 "A vision for the Future"
khanate.14.d:0 "WIP\n\nGrimsmasher has decided that his kind should abandon their old migratory raiding ways, and instead use their recent victory to become the new, permanent rulers of the Commonwealth.\nPr-existing governments and systems can be utilized to easy the transition from Warband to Nationstate"
khanate.14.a:0 "We have much to do"

khanate.15.t:0 "A betrayal most foul"
khanate.15.d:0 "Today, Direfall stands alone.\n\nDespite our deal, despite our shared hatred for the Commonwealth, despite our oaths and our unwavering loyalty, the Khaganate has betrayed us.\nThe treacherous Grimsmasher has declared that he intends to reign as the new Monarch of the Commonwealth, and preserve many of its institutions. If we allow this to go through, it would mean the end of all our ideals, the death of every ambition we've held for so long.\nWe did not spend decades in hiding, living in caves and forests, to now fall to another tyrant, another betrayal of the so called 'civilized' peoples.\n\nWe shall push with all our might against our former ally, and with luck, and perserverance, we shall grind them to dust. In the end, their lands shall be salted, just like it shall befall the Commonwealth.\n\n§rIn Nihilus, Deus§!"
khanate.15.a:0 "We have no choice but to comply"
khanate.15.b:0 "We'll annihilate them!"

khanate.16.t:0 "A Pact, broken"
khanate.16.d:0 "What many had anticipated occured:\n[AOS.GetNameDEF] has decided to reneg on our alliance.\nIn all fairness, we did betray the pact we made with them, promising the complete and utter annihilation of the Commonwealth, and all it's institutions. However, after seeing us destroy the behemoth of the north, we did not believe them stupid enough to stand against us.\nNo matter, their armies will be smashed, their riches taken, and in the end they too will be a part of the Khaganate.\n\nThey should count themselves lucky that we have chosen this path of integration, otherwise such rebellion might have been answered with a complete culling of their people."
khanate.16.a:0 "Deal with this nusiance"

khanate.17.t:0 "The Coronation"
khanate.17.d:0 "WIP\n\nCeremony at the rebuilt royal palace. Influential merchants, collaborationist nobles and Yak generals are in attendance for the coronation of Grimsmasher.\nThe Khan demonstratively smashes the old golden crown, and takes one of blackened Steel.\nGrimsmasher is officially proclaimed Emperor of the Imperial Khanate."
khanate.17.a:0 "All hail the Emperor!"

khanate.18.t:0 "A most unusual Union"
khanate.18.d:0 "WIP\nOne of Grimsmasher's generals in marrying a widowed Noble... a pony noble.\nThis is highly controversial and unusual, but Grimsmhasher gives his ok, and now interracial marriage is legal, I guess..."
khanate.18.a:0 "Love... finds a way"

khanate.19.t:0 "Birth of a Dynasty"
khanate.19.d:0 "WIP\n Capstone event for the Imperial Khanate path.\n\nThings are going well, ponies and Yaks living in mostly harmony. The two cultures have already started to merge, ponies taking up Yak-traditions, while many young Yaks now follow pony professions.\n\nGrimsmasher returns to his Palace to find that one of his wives has given birth. He names the young Yak princess his heir, and a new Dynasty of the Commonwealth is born."
khanate.19.a:0 "Welcome to the world, Yalda"

khanate.20.t:0 "Towards our Destiny"
khanate.20.d:0 "WIP\n\nThe Commonwealth has fallen, and we are pilfering its rotting carcass.\nIt is now clear to every yak that we are destined to rule the Broken Plains, nay, the World!\nGrimsmasher has declared that we shall march endlessly across the north, gathering strength and slaves till we return to Yakistan Victorious and supplant the ruling Clans there!"
khanate.20.a:0 "This is just the beginning"

khanate.21.t:0 "A most helpful Offer"
khanate.21.d:0 "The triumphant conquest of the weak ponies, especially the puny merchant-cities of Nurior, is something Yaks will be proud of for generations. But, despite the crushing defeats inflicted on them, some ponies continue to resist from the shadows like cowards. Khan Grimsmasher knows they will need to be destroyed before his conquest can continue. And strangely just as he needed it, something came to him.\n\nA group of ponies approached the Khan personally, throwing themselves to the ground and begging to be heard, promising him they could solve his woes. Intrigued, Grimsmasher grunted in approval and sat, ready to hear them. The ponies, led by a Unicorn stallion named Dawnlight, claimed to be members of a small religious order called the "Golden Dawn Society." A religious society that was harshly repressed by their previous overlords. With the 'liberation' by the Yaks, as they call it, they humbly presented themselves to be useful pawns of the Khan. Civil administrators and spies against the resistance groups. And all they asked in exchange was a guarantee of religious freedom for their order.\n\nWith war on the horizon and the Yaks preparing for it, willing civilian administrators would be a God send. But something about offering an unknown, almost certainly heretical religion the right to worship in his empire gave the Khan pause. He thought their offer over and eventually came to a decision."
khanate.21.a:0 "With another grunt, the Khan accepted. A pact had been struck."
khanate.21.b:0 "With a shake of his head, the ponies were expelled from his presence."

khanate.22.t:0 "Our ever dilligent Servants"
khanate.22.d:0 "Many of the Khans advisors were not happy with his decision to allow the ponies of the Golden Dawn Society to become involved with the governance of the conquered lands. Though none would speak it to his face, Grimsmasher knew they worried the ponies might have tricked him, planning to use their new power and freedom to betray him. And in all honesty, he did too at first.\n\nBut those ponies who had prostrated themselves before him quickly proved their worth. Within weeks, they have embedded themselves into the local governments and become the new leaders of industry in many conquered territories. The Khans conquest caused many of the wealthiest and most educated to flee, and it seems the Gold Dawn have filled the power gap where Yaks simply couldn't. Those who didn't flee, seem to have flocked to the open hooves of the Golden Dawn, professing their loyalty to the Khan as well.\n\nTheir help in controlling the masses and getting the workshops back up in running has been invaluable, and has allowed every Yak to focus on further conquest. Dawnlight, now a respected enough pony to approach the Khan as any lesser Yak may, has come to ask Grimsmasher to allow his order to take minor places in the government of the Khannate. This would mean allowing Ponies to tell Yaks what to do. But they've proven themselves to be competent in all regards.\n\nThe Khan orders Dawnlight to leave, and ponders the proposal seriously for several days. In the end, he makes up his mind."
khanate.22.a:0 "They have proved their use. Allow them more power, for the good of Yaks"
khanate.22.b:0 "No pony, no matter how smart, will ever tell a Yak what to do!"

khanate.23.t:0 "A Word in every ear"
khanate.23.d:0 "A scandal has rocked the Khans court. Today, members of the Golden Dawn Society privately approached the Khan in his private chambers without warning. This was out of turn and highly insulting to the Khan, who almost ordered his guards to execute the insolent ponies. But when the ponies quickly plead their case, he stopped and listened. While acting as spies against one of the major resistance movements, who the Golden Dawn had done an excellent job at suppressing, they discovered that several of the Khans closest advisors had been working with the rebels and were plotting a coup. Grimsmasher grew furious at the accusations against his own kin, but then the ponies presented their evidence. Incriminating letters between conspirators, money apparently embezzled from his treasury and sent to the rebels, weapons smuggled from his armouries. And the paper trail to follow all of it.\n\nAfter reviewing the evidence and getting over his shock, Grimsmasher let out a mighty roar of vengeance. By the end of the week, all Yaks incriminated by the evidence brought forth by the ponies were in the Khans' dungeons awaiting their trials. Grimsmasher was satisfied with his actions, but this left him with a serious issue. These were some of his greatest, wisest advisors. Who could possibly replace them? Then his mind turned to the option of simply replacing them with ponies of the Golden Dawn. After all, it was they who uncovered this plot and had taken over many administrative duties already. Was there really harm in hearing them out more often?\n\nThe mental image of who might be really holding the dagger made Grimsmasher think it over again."
khanate.23.a:0 "Nonsense! Service and Loyalty ensures just Reward. Even to ponies."
khanate.23.b:0 "No! Enough is Enough. The disloyal can always be replaced by other Yaks."

khanate.24.t:0 "Whispers On The Wind"
khanate.24.d:0 "The war camp is unhappy. Accusations of the Khan's weakness are whispered and many feel Grimsmasher is a far cry from the noble conquering Khan they knew him as. They whisper that the ponies have gotten to him, made him weak and manipulate his every move. Normally, the Khans loyal would hear of these rumours and Grimsmasher would personally challenge every Yak to prove his strength and vigour.\n\nBut for some reason, the Khan has been much harder to get in contact with. Letters and dispatches just seem to never reach him, and his advisors always claim he is too busy to speak about simple 'fear mongering rumours."
khanate.24.a:0 "To the Khan, all things are in order."

khanate.25.t:0 "The Broken mask"
khanate.25.d:0 "Nortock Arrowbreaker was not born of the Khans blood. He had earned his place as the Basquaq of Nurior, more so than most Basquags did. After all, his honorary kinship to Khan Grimsmasher was earned by saving the Khan's life in battle by taking a bullet meant for Khan. That wound had left him unable to fight as he once had, but the respect and glory from his action would reign the rest of his life. A life spent in comfort and ease, as he governed what had become the calmest and more profitable region in Grimsmashers Khanate. And it was all because of those ponies.\n\nHe hadn't liked them at first, and certainly hadn't liked having to accept them into his court. But he'd grown accustomed to them. Perhaps even a bit reliant on them. But they were loyal creatures who knew their place. Them taking care of the day to day activities allowed him the time to roam the open plains alone, breathing in the fresh air and feeling like a hardy warrior again. His closest advisor, a pegasus named Swift Glint, had convinced the Basquag recently that the guards he usually brought along would be better served patrolling the city's streets. With the near disappearance of rebel resistance in the countryside, it seemed that was the case.\nBut something felt... off about today. Ever since breakfast, he'd felt queasy and warm. Despite that, he pushed through to continue his walk, Yak pride getting the better of him As he went on, it became harder and harder to pick up his hooves. Surely he was sick, and it was becoming too much. He turned and took a few steps back towards home, only to have his stride fail and force him to the ground. No matter how hard he tried to stand, he simply couldn't. His vision began to blur and his heart pounded in his ears, almost covering up the sounds of wings flapping. He struggled to keep his eyes open, but could see two figures standing before him. Swift Glint, his trusted advisor, and a black insect creature only talked about in stories.\n'Is… Is he dead?' Swift Glint asked, reaching down and poking the Yak, who could only pant and groan and wonder why the two would not help him.\n'Not yet, but it doesn't look like it'll take much longer. Honestly, good thinking with the slow acting poison.'\nPoison! Everything clicked in Nortocks mind at once. He had been tricked and betrayed! And he watched in horror as the black creature was engulfed in green flame, only to stand there looking just like him! With one final burst of energy, the Yak tried to stand and tried to yell out 'traitor!' But it only came out as a wheeze and his body refused to move. As the world began to blur beyond recognition and his head felt heavy, the Yaks final thought popped into his mind.\n\n'I must save the Khan'"
khanate.25.a:0 "The light in the Yak's eyes faded."

khanate.26.t:0 "Smiles and Promises"
khanate.26.d:0 "WIP\n\nDawnlight, leader of the Golden Dawn Society approaches members of the Legio Aeterna Equus with weapons and funds, being very polite and forthcoming. He explains that the time for a true uprising is nearing, and that so long as the Legio works with them, they will continue to funnel Equipment."
khanate.26.a:0 "They shook Hooves"

khanate.27.t:0 "The Price of Freedom"
khanate.27.d:0 "WIP\n\nDawnlight meets with the Voice of Luna, the Priestess and leader of the Black Moon faction.\nDawnlight offers her an independant state for Batponies, and that he would support her resistance-movement, so long as the Black Moon cooperates in the war of Liberation against the Yaks."
khanate.27.a:0 "Together under the Eclipse"

khanate.28.t:0 "Unity in Purpose"
khanate.28.d:0 "WIP\n\nIn a hidden bunker, Dawnlight talks to the remaining leaders of the Starlight Cabal. They are only there via telescreen, all only visible as sillouettes. Dawnlight offers them new purpose, and another try at their ideals within the Golden Dawn.\nThis is, of course, conditional on them mobilizing their remaining ressources to help in overthrowing the Yaks."
khanate.28.a:0 "A deal struck"

khanate.29.t:0 "The Calm before"
khanate.29.d:0 "WIP\n\nThings are messed up for the Khanate, patrols go missing, and Nurior is simply no longer responding to inquests."
khanate.29.a:0 "WTF?"

khanate.30.t:0 "Game-Start!"
khanate.30.d:0 "WIP\n\nThe Golden Morning has set into motion their grand plan to overthrow the Yaks with the help of various rebel groups."
khanate.30.a:0 "Dawlight Moves"
khanate.30.b:0 "The Khan Moves"

khanate.31.t:0 "From far and wide"
khanate.31.d:0 "WIP\n\nWith Grimshmasher's success, more and more of the minor clans of the Yakistani wastes see him as the rightful Khan, and have begun migrating southwards to become part of of the great Horde."
khanate.31.a:0 "United we stand"

khanate.32.t:0 "Hearts of Fibreglass"
khanate.32.d:0 "WIP\n\nGrimsmasher meets with the digital avatar of NERTHUS, the AI that led the NTFP-extraction zone, and was considered a god by it's pony subjects. NERTHUS at first appears arrogant, but quickly switches to bargaining, when she notices the amount of explosives the yaks brought with them. NERTHUS promises that she could easily convince her subjects to accept Grimsmasher's rule, and follow him willingly. Grimsmasher must choose between the awesome achievement of slying a God, or the practical ally he could make in NERTHUS."
khanate.32.a:0 "I am a Godslayer"
khanate.32.b:0 "You have your Pact"

 
 
 
 
