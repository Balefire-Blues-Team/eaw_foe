 KHA_strangers_in_strange_land_2_idea_desc:0 "Surprisingly, Yaks are from Yakyakyistan, not from north-eastern Equestria. When the Yaks making up the 6th Khagnate arrived to these lands, they crushed all forces opposing them, but now they are left trying to figure out the ways of those they conquered. The buildings are too small for great Yak frames, the guns do not fit strong Yak hooves, the swords break upon being swung by tough Yak. The Yaks will have to become one with the land, if they wish for the land to become one with them."
