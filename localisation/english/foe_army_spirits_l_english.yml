 # Academy Spirit Descriptions
 officer_academy_spirit_desc:0 "Good officers don't just give orders, they make soldiers believe the orders are worth following. In the wasteland, that distinction has kept more than a few units alive when a lesser commander would have lost them."
 nco_academy_spirit_desc:0 "The officers plan the battle. The NCOs fight it. Every squad leader who kept their soldiers alive while the brass was still figuring out the map is the reason we're still here."
 engineer_academy_spirit_desc:0 "Anyone can shoot. It takes something more to build a bridge under fire, wire a defensive grid before dawn, or clear a minefield while the enemy is still watching. Engineers don't get the songs, but they win the wars."
 loyalty_academy_spirit_desc:0 "Caps run out. Ammunition runs out. Even courage runs out eventually. Loyalty to something worth fighting for doesn't. An army that believes in its cause is harder to break than one that's simply been paid."
 marine_academy_spirit_desc:0 "Water crossings kill more assaults than enemy fire. Getting soldiers across a river or a strait and into the fight before they drown or get shot is a specialized art, and the ones who've trained for it are worth every cap spent."
 bold_advance_spirit_desc:0 "Hesitation gets you killed out here. Hit hard, hit fast, and don't stop moving until the enemy does."
 stalwart_resistance_spirit_desc:0 "We've bled for this ground and we aren't giving it up. Not an inch, not a hoof-width, not a single damn cobblestone."
 careful_preparation_spirit_desc:0 "Rushing into a firefight without a plan is how you end up a raider trophy. We plan, we prepare, then we end it before it begins."
 peoples_officers_spirit_desc:0 "They were chosen by the community, and the community expects them to bring everyone home. That's a weight most generals never have to carry."
 bright_minds_in_command_spirit_desc:0 "A sharp horn and a sharper mind. The best commanders don't just know how to fight, they know how to think three engagements ahead of the enemy."
 old_blood_command_spirit_desc:0 "Breeding, wealth, and the right family name. It's not what you know out here, it's who your grandmother was."
 liege_and_loyalty_spirit_desc:0 "My soldiers don't follow orders because I outrank them. They follow orders because they swore an oath, and in the Equestrian Wasteland, your word is all you have left."
 stable_tec_advisory_spirit_desc:0 "01010011 01110100 01100001 01100010 01101100 01100101 00101101 01010100 01100101 01100011 00100000 01010100 01100001 01100011 01110100 01101001 01100011 01100001 01101100 00100000 01000001 01110011 01110011 01101001 01110011 01110100 01100001 01101110 01100011 01100101 00100000 01010000 01110010 01101111 01110100 01101111 01100011 01101111 01101100 00100000 01100001 01100011 01110100 01101001 01110110 01100101 01101100 01111001 00100000 01100101 01101110 01100111 01100001 01100111 01100101 01100100 00101110"
 hall_of_captains_spirit_desc:0 "The Hall's walls are covered in the names of those who gave everything. Every officer trained here knows they are expected to add their deeds to that list, not their names."
 recovered_tactics_manuals_spirit_desc:0 "Somewhere in those crumbling pre-war pages is the reason we keep winning. You'd be surprised what two hundred years and a balefire bomb can't kill."
 hardened_by_fire_spirit_desc:0 "They didn't learn to lead in a classroom. They survived long enough to figure it out in the middle of a firefight, which is honestly a better qualification."
 wasteland_improvisation_spirit_desc:0 "You don't need a plan when you've seen enough of the wasteland to know how it ends. Just point the ones who'll shoot at the ones who need shooting."
 memory_orb_strategy_spirit_desc:0 "Pop a memory orb and relive three hundred engagements in an afternoon. The old Equestrian officer corps didn't survive the balefire, but their knowledge did."
 chem_fueled_command_spirit_desc:0 "Dash, Stampede, Buck, and a complete disregard for personal safety... Whoever said raiders couldn't lead just hadn't seen the right ones in action."

 # Army Spirit Descriptions
 beloved_war_heroes_spirit_desc:0 "Songs get written about them, settlements name streets after them, and recruits line up for a chance to serve under them. Winning is great, but a good story is better."
 arm_every_pony_spirit_desc:0 "We don't have time to train every soldier properly, but a body holding a gun is still a body between us and the enemy. Good enough will have to do."
 mercenary_contracts_spirit_desc:0 "Caps can buy anything in the wasteland, including somepony else willing to take the bullet meant for you. Best investment you'll ever make."
 nocturnal_hunters_spirit_desc:0 "The wasteland doesn't sleep, and neither do we. Let them huddle in their camps thinking the dark keeps them safe. It doesn't."
 community_defense_corps_spirit_desc:0 "We may not be soldiers, but we are neighbors. And when somepony threatens our home, there isn't a pony in this settlement who won't pick up a weapon to protect it."
 hit_and_run_tactics_spirit_desc:0 "We don't fight fair. Fair fights are for ponies who don't want to win. We hit them where it hurts, we vanish into the rocks, and we do it again at dawn."
 ancestral_guidance_spirit_desc:0 "The spirits of those who came before watch over us in battle. Their wisdom flows through the war-chief's words and the shaman's fire. We do not fight alone."
 prewar_veterans_spirit_desc:0 "We ghouls actually remember how the Equestrian military worked. The hard way. Turns out two hundred years of radiation does wonders for institutional memory."
 automated_perimeter_spirit_desc:0 "They can try to breach our walls. The turrets don't sleep, don't negotiate, and don't miss. Neither does the maintenance bay that keeps them running."
 alicorn_ascendant_spirit_desc:0 "Alicorns are not simply strong, they are a convergence of everything magic and flesh can become. Surrounding them is less of a battle tactic and more of a polite suggestion."
 peoples_war_committee_spirit_desc:0 "A council of veterans, tacticians, and community leaders who actually understand what they're asking creatures to die for. What a concept."
 recovered_ballistics_texts_spirit_desc:0 "These manuals survived the war in an evidence locker somewhere. The shooting data is still good. Two centuries hasn't changed the laws of physics."
 research_and_salvage_spirit_desc:0 "We don't need to outgun the enemy, we need to outsmart them. Every caps spent on research is a problem we solve before it becomes a body count."
 military_above_all_spirit_desc:0 "Everything you own, everything you've built, it all exists because the military allows it to. The army doesn't serve the nation. The nation serves the army."
 iron_authority_spirit_desc:0 "I don't rule with a velvet hoof. The wasteland doesn't respect gentle rulers. You want stability, you give me absolute obedience. That's the arrangement."
 heart_of_the_wild_spirit_desc:0 "The old world forgot that ponies were once something wild and untamed. The wasteland remembered for them. We have not made the same mistake."
 steel_ranger_doctrine_spirit_desc:0 "Flesh is fragile. Armor is not. We pour everything into the steel that protects our knights, because what good is courage without the shell to keep it alive?"
 old_war_doctrine_spirit_desc:0 "Equestria fought wars for a thousand years before the balefire fell. The ponies who wrote these field manuals knew something the wasteland keeps relearning the hard way."
 scavengers_advantage_spirit_desc:0 "Let the enemy bring their guns and their caps and their stockpiles. When the dust settles, we'll just use theirs."
 alicorn_brute_force_spirit_desc:0 "When you are made of the unified magic of earth, pegasus, and unicorn, tactical nuance becomes optional. You just point yourself at the problem and accelerate."
 talon_company_protocols_spirit_desc:0 "The Talons don't take bad contracts and they don't accept bad odds. When you hire them, you get professionals who've seen every terrain the wasteland has to offer, and survived it."
 zebra_legion_legacy_spirit_desc:0 "The zebra legions of Zebrica were gone before the balefire even fell, but their doctrine wasn't. It survived in fragments, in how a war-chief orders a charge, in how a squad holds a ridge under pressure. You don't have to be Zebrican to study what they knew. You just have to be willing to learn from the dead."
 crude_augmentations_spirit_desc:0 "It doesn't look pretty and it didn't come from a certified armory, but functional kit is functional kit. Cut corners where it doesn't matter, get it to the field before the enemy gets there first, and let the results speak for themselves."
 perfect_augmentation_spirit_desc:0 "Best materials. Best construction. Best finishing. Our elite units don't deploy with equipment that's merely adequate, because adequate gets soldiers killed. You spend the caps now or you spend them on graves later."
 steel_ranger_honor_spirit_desc:0 "Paladin Steelhooves didn't march into balefire for nothing. The Rangers remember their history. Every mission is carried out in honor of those who kept the flame alive."
 knights_of_the_wastes_spirit_desc:0 "Not every pony in power armor is a Steel Ranger, and not every Talon is a mercenary. Some of us are just the last line standing between the wasteland and the ponies behind us."
 unity_protocols_spirit_desc:0 "We are not individuals. We are not a coalition. We are Unity, and Unity speaks with one voice... Whether you are ready to listen or not."
 stable_lockdown_protocols_spirit_desc:0 "Stable-Tec built their vaults to last. So did the ponies who came out of them. We may be slower than the raiders, but our walls will outlast their grandchildren."
 full_throttle_spirit_desc:0 "No plan, no map, no speed limit. The only thing between us and their checkpoint is thirty seconds and a very loud engine. That's plenty."
 salvaged_rides_spirit_desc:0 "Pre-war or cobbled together from three rusted wrecks, if it moves and the engine turns over, we'll make it work. A little Dash and a wrench solves most mechanical problems."
 mounted_heritage_spirit_desc:0 "Long before the Balefire, ponies rode into battle and charged across the fields of Equestria. Hoofbeats and blades, some traditions the wasteland never quite managed to kill."
 crossing_the_divide_spirit_desc:0 "The rivers and straits of the Equestrian Wasteland have swallowed more than a few armies that didn't respect them. We respect them... And then we cross them anyway."
 robot_vanguard_spirit_desc:0 "Send the machines first. They don't panic, they don't tire, and they don't write letters home. Our robots lead the advance so that fewer of our soldiers have to."

 # Division Command Spirit Descriptions
 rapid_battle_orders_spirit_desc:0 "By the time the enemy figures out what we're doing, we'll already be doing something else. Keeping them reacting to us is how we stay alive."
 experienced_scouts_spirit_desc:0 "Our scouts have crawled through every tunnel, bluff, and balefire-scorched gully between here and the horizon. There are no surprises when they've already been everywhere first."
 throw_them_in_spirit_desc:0 "The enemy isn't going to wait for us to finish training. Give them a gun, point them at the problem, and hope they learn fast. Most of them will."
 defend_our_home_spirit_desc:0 "This is our land. Our settlements, our families, our graves. We don't need a general to tell us what we're fighting for, we need one who won't waste it."
 blooded_reserves_spirit_desc:0 "Our reserves aren't green recruits. They've been through the campaigns, buried their friends, and came back anyway. That kind of experience doesn't go stale."
 dug_in_and_waiting_spirit_desc:0 "Barricades, sandbags, and a hot cup of something that might be coffee. Let them come to us. We've been here longer and we've got nowhere else to be."
 horror_of_the_wastes_spirit_desc:0 "Deathclaws, Manticores, Mutant Ursa. The things that haunt the Equestrian Wasteland would break any pre-war army. We just call it Tuesday and keep moving."
 supply_caravan_network_spirit_desc:0 "Brahmin caravans, wagon teams, and the most stubborn logistics officers this side of Fillydelphia. If it needs to reach the front, it reaches the front."
 gifted_field_officers_spirit_desc:0 "What separates a good officer from a great one isn't courage, it's the ability to already have a plan for what happens when the first plan falls apart."
 might_makes_right_spirit_desc:0 "Take what you need from the weak, crush what resists you, and keep moving. Sentiment is a luxury for ponies who haven't stood on a battlefield."
 smash_through_spirit_desc:0 "How many ponies will it take? Enough. That's always the answer. Throw enough force at any problem and it stops being a problem."
 starve_them_out_spirit_desc:0 "A well-fed army fights, a starving army surrenders. We don't need to match them hoof-for-hoof, we just need to make sure their next meal never arrives."
 raw_instincts_spirit_desc:0 "Forget maps, forget battle lines, forget supply routes. We know this land the way the Equestrian Wasteland made us know it, on our hooves, with our teeth, through our scars."
 factory_to_frontline_spirit_desc:0 "The production line never stops. Everything rolling off the floor goes straight to where the shooting is. By the time the enemy counts what we have, we already have more. We don't win on tactics alone. We win on volume."
 iron_within_iron_without_spirit_desc:0 "The Steel Rangers do not retreat. They do not surrender. They step forward in their armor and they hold, because holding is what the Rangers have always done."
 feral_tide_spirit_desc:0 "Feral ghouls don't plan, don't coordinate, and don't stop. What they lack in discipline they make up for entirely in sheer, unrelenting numbers."
 enclave_patience_spirit_desc:0 "Two centuries in the clouds gave us time to prepare, not to hesitate. When the Enclave moves, it does not ask permission. The wasteland will be reclaimed. This is not a threat, it is a schedule."
 swift_conquest_spirit_desc:0 "Red Eye's armies don't linger. They hit the target, secure the labor, and move on before the dust has settled. Hesitation costs caps, and caps cost lives."
 drunken_bravado_spirit_desc:0 "A bottle of something strong before the charge and the fear goes quiet. It's not a tactical doctrine, but it's a raider tradition, and you don't argue with tradition when it works."
 elder_wisdom_spirit_desc:0 "The elder has lived through things that would break a younger pony. When they speak before battle, the tribe listens. They didn't survive this long by being wrong."
 tunnel_fighters_spirit_desc:0 "They know every warren, every collapsed rail tunnel, every underground access from here to the river. Fighting them on open ground is their courtesy to you."
 demolition_games_spirit_desc:0 "The arena is just the training ground. When the gates open and the crowd stops cheering, the real demolition begins, and they aren't playing for caps this time."
 radscorpion_doctrine_spirit_desc:0 "Small, patient, and armored, the radscorpion doesn't rush. It positions, it waits, and when the opening comes, the sting is already on the way."
 burn_it_all_spirit_desc:0 "The Equestrian Wasteland was born in fire. Some of us think it should end the same way. The flames don't discriminate and neither do we."
