 ### Sladkiy Tractor Collective: the offer from Princessyn
 severyana.20.t:0 "An Offer from Princessyn"
 severyana.20.d:0 "WIP\n\nNovaya Rodina has won the struggle for Princessyn. Amaryll Ponekoek, once of our own council, invites the Collective to join the reborn Motherland as an autonomous member. Accepting ends our own ambitions; refusing means we go our own way, south first and then to the city."
 severyana.20.a:0 "The Revolution has a home again. We join it."
 severyana.20.b:0 "We did not unite the river to take orders from the city."
 severyana.20.a_tt:0 "§RThe rest of our focus tree stays closed for as long as we are a subject.§!"
