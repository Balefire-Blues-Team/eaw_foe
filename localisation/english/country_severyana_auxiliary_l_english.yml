 ### Sladkiy Tractor Collective: the offer from Princessyn
 severyana.20.t:0 "An Offer from Princessyn"
 severyana.20.d:0 "WIP\n\nNovaya Rodina has won the struggle for Princessyn. Amaryll Ponekoek, once of our own council, invites the Collective to join the reborn Motherland as an autonomous member. Accepting ends our own ambitions; refusing means we go our own way, south first and then to the city."
 severyana.20.a:0 "The Revolution has a home again. We join it."
 severyana.20.b:0 "We did not unite the river to take orders from the city."
 severyana.20.a_tt:0 "§RThe rest of our focus tree stays closed for as long as we are a subject.§!"

 ### Wraiths: the takeover
 flavour.6.t:0 "The Nightwraiths Make Their Move"
 flavour.6.d:0 "WIP\n\nThe Nightwraiths have never been like the rest of the gang. They drill, they maintain their vehicles, and they still keep the muster roll of a division the Commonwealth left behind north of the Polga. Their commander, Winter Fox, has now walked into the Boss's quarters with a simple proposal: the Nightwraiths run the gang from here on."
 flavour.6.a:0 "The Boss stays the Boss."
 flavour.6.b:0 "The Nightwraiths take command."
 WRA_nightwraith_branch_tt:0 "§YWinter Fox§! takes over the gang. A new §YNightwraith§! branch is added to our focus tree."
 WRA_winter_fox:0 "Winter Fox"
 WRA_winter_fox_desc:0 ""

