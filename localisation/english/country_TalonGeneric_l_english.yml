foe_talon_decision_cat:0 "Contract Work"
foe_talon_killing_dec:0 "Killing Raiders"
foe_talon_killing_dec_desc:0 "There will always be roving bands of raiders in the wastes, and doubtless many people who'd like to see these brigands erased from history."
foe_talon_bounty_dec:0 "Bounty Hunting"
foe_talon_bounty_dec_desc:0 "Certain outlaws, raiders, or stable-dwellers garner enough of a reputation for someone to want them dead... and allow us to collect on the reward."
foe_talon_ghoul_dec:0 "Cleansing Ghouls"
foe_talon_ghoul_dec_desc:0 "Noone likes ferals... especially when they're trying to kill you while scavenging or setting up a camp. Some people are willing to pay us for help getting rid of them."

