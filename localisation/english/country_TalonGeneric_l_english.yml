##################
### FOCUS TREE ###
##################

### Opening Focuses ###



### Generic Foci ###

 Talon_industry_1:0 "Wasteland Industry"
 Talon_industry_1_desc:0 "Although we are a civilized settlement, we still have much progress to make before we can declare ourselves self-sufficient. We'll undertake the necessary efforts to establish a respectable industry for our nation."

 Talon_industry_2:0 "Connect Our Farms"
 Talon_industry_2_desc:0 "While we have a lot of farmland, most of homesteads on them are isolated from each other, and others have been abandoned to the Wasteland. Connecting these farms back to our settlements would make it substantially easier to expand them."

 Talon_industry_3:0 "Improve the Road Network"
 Talon_industry_3_desc:0 "Most of our current roads leave little impression to anypony who treads them. We shall strive to improve our network of avenues. Soon our entire domain will be properly connected to each other."

 Talon_industry_4:0 "Prepare For Expansion"
 Talon_industry_4_desc:0 "Our people look to expand and industrialize further. First we must make the necessary preparations. The portion of the Wasteland we control is still vast and relatively unclaimed, and we must use this to our advantage."

 Talon_industry_5:0 "Industrialize Our Capital"
 Talon_industry_5_desc:0 "The heart of our community lies in our capital. With our current land acquisitions, we can divert some of our labor to develop and expand the center of our society."

 Talon_industry_6:0 "Re-Open Old Arsenals"
 Talon_industry_6_desc:0 "Our territory still holds many arsenals and factories built during the Great War. Ever since Equestria was destroyed by balefire, they have lain abandoned and unused, and we only need to give them their proper attention to let them be of use."

 Talon_industry_7:0 "Protect Our Borders"
 Talon_industry_7_desc:0 "There are many out there who pay no heed to the lines that make up our borders on a map. In order to effectively guard our lands, we will construct new outposts for our soldiers, so that we may monitor our roads and mark any potentially unwanted entrants."

 Talon_industry_8:0 "Utilize Our Innate Power"
 Talon_industry_8_desc:0 "While we still inhabit a harsh, unforgiving environment, we are still ponies! For thousands of years, our ancestors utilized their innate magic to master their lands. We must never abandon our history, and we must strive to utilize our strengths."

 Talon_industry_9:0 "Specialization: Civilian Production"
 Talon_industry_9_desc:0 "While we don't discount the dangers of the Wasteland, why should we die for a specific ideal or cause? To survive is sufficient enough. To this end, we shall specialize our society in granting our ponies the best lives they could have in the Wastes."

 Talon_industry_10:0 "Specialization: Military Supremacy"
 Talon_industry_10_desc:0 "In order to survive and to keep ourselves united, we must prepare ourselves for inevitable war. It is the way of the Wasteland, and because of this, we shall specialize in militarization and transform our society into the potent powerhouse we know it can be."

 Talon_industry_11:0 "Invite Settlers"
 Talon_industry_11_desc:0 "There are still many out there who wander aimlessly. They are always seeking shelter from the harshness of the Wastes, which is something we can provide. We'll grant these wandering settlers the homes they need within our settlements."

 Talon_industry_12:0 "Land Clearance"
 Talon_industry_12_desc:0 "While there are many unclaimed regions of the Wasteland, much of it is barren incapable of sustaining life. Pockets of radiation and balefire continue to taint areas, making it even more dangerous. Instead of needless expansion, proper land clearance will go a long way to developing our nation."

 Talon_industry_13:0 "Trade With The World"
 Talon_industry_13_desc:0 "Trading is the lifeblood of our community's connection with other settlements. At the heart of a flourishing economy is a healthy barter system, and our villages could certainly partake in the endless bargaining of the Wasteland."

 Talon_industry_14:0 "Subsidize Gun-Makers"
 Talon_industry_14_desc:0 "Granting our weapon merchants the resources they require to expand their companies will not only assist them but it will also advance our own military industry as well."

 Talon_industry_15:0 "The City Grows"
 Talon_industry_15_desc:0 "As we develop our industry, we must also broaden our towns and cities. Funding will be allocated to ensure that each of our settlements are given the labor they need and deserve."

 Talon_industry_16:0 "Heavy Industry Returns"
 Talon_industry_16_desc:0 "At last the rewards of our diligence are bearing fruit. Our industry is beginning to burgeoning with a swelling economy, and the results of our hard work can finally be utilized by all."

 Talon_industry_17:0 "A Network of Trade Routes"
 Talon_industry_17_desc:0 "The trade routes of our land compose the veins and arteries of our nation. Establishing a grand network of routes through our territory shall ensure every road is safe for any settler."

 Talon_industry_18:0 "The Population Booms"
 Talon_industry_18_desc:0 "With all the necessary resources and tasks needed for a society to flourish acquired and accomplished, we can finally recognize ourselves as a healthy, growing community."

 Talon_know_1:0 "Wasteland Society"
 Talon_know_1_desc:0 "A new type of society is required to function in the Wasteland, one that nopony has ever experimented with before. If we are to prosper, we must progress technologically and adapt accordingly."

 Talon_know_2:0 "Establish a Scavenging Corps"
 Talon_know_2_desc:0 "The resources that lay scattered in the Wastes are almost immeasurable. A wealth of raw materials and useful scrap lie hidden below or scattered about the Wastes. We will establish a scavenging corps and procure these resources for ourselves."

 Talon_know_3:0 "Scavenge Smarter, not Harder"
 Talon_know_3_desc:0 "Our methods of scavenging have proven useful so far but they can be expanded further. Through analyzing our past mistakes, we can increase the efficiency of our processes and more intelligently extract resources from the Wastes."

 Talon_know_4:0 "Build New Smelteries"
 Talon_know_4_desc:0 "Smelteries the backbone of any community, as the refined metal can be used to construct new factories. By making more smelteries, we can ensure that we will produce the metal we need."

 Talon_know_5:0 "Disassemble Wartime Tech"
 Talon_know_5_desc:0 "Many relics old Equestrian technology still dot the Wasteland, but the majority of it is far too decayed to be of any use. However, they can still prove useful if we disassemble these relics and use them to maintain what bits of tech that currently functions."

 Talon_know_6:0 "Buy More Healing Potions"
 Talon_know_6_desc:0 "Healing potions have always proven quite useful for their versatility and consistency in any situation. Purchasing more will be expensive, but if we acquire an abundance of potions, our people will surely benefit."

 Talon_know_7:0 "A Healthy Populus..."
 Talon_know_7_desc:0 "Thanks to the surplus of healing potions and other resources for our community, our population has grown healthier and has begun to thrive in the Wastes."

 Talon_know_8:0 "...and a Healthy Army"
 Talon_know_8_desc:0 "Aside from the general populus, our soldiers have benefited much from the additional supplies. Because of this, our ranks have swelled with recruits as we gain the health needed to fight adequately."

 Talon_know_9:0 "Make Schooling Compulsory"
 Talon_know_9_desc:0 "For good reason, learning is considered one of the pillars of a functional, prosperous society. Education is paramount to the growth of any community, regardless of background or ideology."

 Talon_know_10:0 "Increase Our Research Efforts"
 Talon_know_10_desc:0 "Many within our settlements have volunteered to help us in our scientific endeavors. If we are to make progress, we must assign all those willing to help research and fill our labs."

 Talon_know_11:0 "The Science of Industry"
 Talon_know_11_desc:0 "The industrial capabilities of any society can always be improved, but the ideas that revolve around a functional one are what decides its true effectiveness."

 Talon_know_12:0 "The Industry of Science"
 Talon_know_12_desc:0 "While we can always come up with new ideas for improving our manufacturing process, and in turn teach them to our workers, obtaining the actual facilities and resources needed is another task. We must insure that our capabilities are never put to waste."

 Talon_know_13:0 "An Intelligent Society"
 Talon_know_13_desc:0 "Our advances have finally paid off! Not only do we have the knowledge to survive in the Wasteland, but we also understand what makes any community prosper: smarts and brains!"


