l_english:

##################
### FOCUS TREE ###
##################

### Opening Focuses ###

 GenTalonLore1:0 "The Great War"
 GenTalonLore1_desc:0 "War Never Changes... During the Great War the Avians of Griffonia remained neutral, focused on their own events at home and uwilling to get involved in an Equestrian-Zebrican conflict on a national scale. With... some exceptions. Chief among these were the '§7Talon Company§!' drawn primarily from citizens of §RThe Herzland§!, Noble §7Vedina§!, The Rich §0Karpathian§! lands, and §HNova Griffonia§!; which it was based from. Lethal, well-trained, well equipped, and adaptable."

 GenTalonLore2:0 "The Post-War Era"
 GenTalonLore2_desc:0 "The end of the Great War brought the end to an Era. The Sea became corrupted by necromantic magics, raising long-dead monsters from its depths that still threaten any attempts to cross the Oceans to this day. Because of this, most of the original §7Talon Company§! found themselves trapped on the Equestrian Continent. With no way home, many decided to settle in and continue their §gTrade§!."

### Initial Company Ethics Focuses ###

 GenTalonKind:0 "Talon Company Ethics: §GKind§!"
 GenTalonKind_desc:0 "Our §7Mercenary Forces§! will generally try to take a softer and more friendly approach to the local population. Ponies are naturally distrusting of Gryphons for good reason, so we'll have our work cut out for us. Hopefully it pays out in the long run."

 GenTalonKind1:0 "Low-Cost Defense Contracts"
 GenTalonKind1_desc:0 "There are several settlements in the local area that are lacking for defense... with some generous terms for them, we can slip in and make some caps. All while boosting public opinion."

 GenTalonKind2:0 "Playing Fair with the Weaponsmiths"
 GenTalonKind2_desc:0 "With some careful wording and upfront payments, we can convince the local gunsmiths to give us prefrential treatment. Its a bit more expensive, but you don't cheap out on your gear."

 GenTalonKind3:0 "Handling the local Slavers"
 GenTalonKind3_desc:0 "Slavers are a long-established problem in the Wasteland, one we are quite equipped to help deal with. More than a few of the locals have lost their kin to slave-raids, so they'll pay top dollar to see the chain-placers struck HARD in return."

 GenTalonNeutral:0 "Talon Company Ethics: §1Neutral§!"
 GenTalonNeutral_desc:0 "Our §7Mercenary Forces§! are going to take a neutral approach to interacting with the locals. Not to Soft, not to Hard. Its all buisness at the end of the day, nothing personnal."

 GenTalonNeutral1:0 "Make Deals with the Local Producers"
 GenTalonNeutral1_desc:0 "Some of the small farms, smiths, and other local producers could provide us with necessary supplies and goods... for the right price."

 GenTalonNeutral2:0 "Haggling with the Weaponsmiths"
 GenTalonNeutral2_desc:0 "We have to find a careful balance between profit and cost with the local gunsmiths... underpaying them might work in the short term, but long term it'll bite us hard."

 GenTalonNeutral3:0 "Eradicate Raider Bands"
 GenTalonNeutral3_desc:0 "There are several large Raider bands in the area that occasionally harrass the locals. Tracing them back to their dens of debauchery shouldn't be hard... nor would falling upon them from the blakc skies. It'll be messy, but we can clean house."

 GenTalonMerciless:0 "Talon Company Ethics: §RMerciless§!"
 GenTalonMerciless_desc:0 "Our §7Mercenary Forces§! are going to take a hard and ruthless approach to dealing with the locals, we are going to make them understand that at any time we could crush them or leave them out in the wind should the next Raider or Slaver crew show up. They won't like it, but thats their problem."

 GenTalonMerciless1:0 "Seize Necessary Supplies from the Locals"
 GenTalonMerciless1_desc:0 "The local shop-keeps and farmers are demanding our caps for the produce WE protect, well. The ones who demand we pay won't last very long when their Brahmin and crops start dying... or they get offed fighting the 'Raiders' stealing from them. Then either someone more flexible takes over and pays... or they don't. Not our problem."

 GenTalonMerciless2:0 "Strong-Arm the Arms Producers"
 GenTalonMerciless2_desc:0 "Most ponies back down in the face of well-armed and better-armored gryphons... or at least the smart ones do, others need some convincing... usually by their family after a few strong words from our Senior Talons about their safety."

 GenTalonMerciless3:0 "Wipe Out the Competition"
 GenTalonMerciless3_desc:0 "There are Raiders about... and Regulators... and small-time mercenaries too. All of these are a problem that needs to be swiftly handled at the same time, either with death... or something more profitable. Perhaps its time to break out the chains?"


### Base Establishment Focuses ###

 GenTalonBase1:0 "§1Establishing a Local Base§!"
 GenTalonBase1_desc:0 "Our Forces are not in a good state without a solid location to call home. There are the ruins of a small town in the area that might prove accepable as the foundation of one... or at least the resources to build something worthwhile."

### Workshop and Resource Focuses ###

 GenTalonBaseIndustry1:0 "Establish a Basic Workshop"
 GenTalonBaseIndustry1_desc:0 "We need a localized area to produce equipment for our §7Mercenaries§!, our best bet is to refurbish an old machine shop and use it as the foundation for a more dedicated facility."

 GenTalonBaseScavenging1:0 "Scavenging: §3Water Sources§!"
 GenTalonBaseScavenging1_desc:0 "Fresh Water is a difficult thing to find in the Wasteland... however the Old World had plenty of options, Water Talismans built into showers and fountains, old cisterns with robust filtration systems... even the occasional untainted pond are all key water sources out there in the dark."

 GenTalonBaseScavenging2:0 "Scavenging: §gScrap Metals§!"
 GenTalonBaseScavenging2_desc:0 "Access to §gScrap Metals§! will allow us to repair or build most basic wasteland structures or equipment. Steel Walls, blades, basic armors. As long as its not Rust, it can be reused."

 GenTalonBaseScavenging3:0 "Scavenging:§8Power Sources§!"
 GenTalonBaseScavenging3_desc:0 "Crystal-Gem Packs, Sparkle-Breeders, old Coal Generators, even hamster-wheel-charged batteries are all forms of §8Power Sources§! that can help improve our daily lives and efforts."

 GenTalonBaseIndustry2:0 "Bring in Dedicated Milling Equipment"
 GenTalonBaseIndustry2_desc:0 "Armor and Weapon Workbenches, Powered Tools, dedicated ammunition-presses, all of these things are necessary to step up from the average Wasteland Gunworker's shop."

 GenTalonBaseScavenging4:0 "Scavenging: §4Composite Materials§!"
 GenTalonBaseScavenging4_desc:0 "When one thinks about §4Composite Materials§! they usually think about Power Armor, Wartime Combat Armors, advanced materials on Combat Robots and other such things... they don't think about the suspension of an old Carriage, or the support beams of a ruined sky-scraper. The Old World used plenty of these Materials in their time, and some of it is still usable to this day."

 GenTalonBaseScavenging5:0 "Scavenging: §0Circutry§!"
 GenTalonBaseScavenging5_desc:0 "Pretty much every single robot out in the Wasteland has functional §0Circutry§! inside of it, old military installations, broken factories, Sky-Chariots, Terminals... if it can function without a Pony or Gryphon, it probabaly has §0Circutry§!."

 GenTalonBaseScavenging6:0 "Scavenging: §gAdditional Metallics§!"
 GenTalonBaseScavenging6_desc:0 "Our need for §gAdditional Metallics§! has grown with every expansion to our Workshop Facilities, locating more usable metals to feed our Armor and Weapon-techs is necessary to keep up production."

 GenTalonBaseIndustry3:0 "Set up an Advanced Equipment Section"
 GenTalonBaseIndustry3_desc:0 "Dedicated terminals and arcano-tech workbenches, Thaumic-Charging Arrays and Gem-cutter systems for carving runes and enchantments into gemstones, even a specialized glass-work and tempering workshop will ensure we are capable of producing weapons even the Old World would find acceptable."

 GenTalonBaseScavenging7:0 "Scavenging: §9Advanced Components§!"
 GenTalonBaseScavenging7_desc:0 "There are some pieces of technology that just aren't able to be made anymore... Lost Technology or '§9LosTech'§! are those rare pieces of equipment that are worth many times their weight in caps; Arcano-Thaumatic Replicators capable of reproducing a spells effects seamlessly, Kinetic Hardening Enchantment Talismans... Talismans in General really. For some pieces of Technology, these are essential."

 GenTalonBaseScavenging8:0 "Scavenging: §6Arcane Crystals§!"
 GenTalonBaseScavenging8_desc:0 "During the War the §1Equestrians§! were known to hold the lions share of powerful §6Arcane Crystals§! which they used to power their war machines and advanced magical equipment. Many of these stockpiles have survived the War and either lay abandoned, or are a well-sought commodity for high-profile traders. Getting access to them should open some doors for us to develop advanced arcane equipment."

 GenTalonBaseScavenging9:0 "Scavenging: §tWartime Data§!"
 GenTalonBaseScavenging9_desc:0 "Its well known that the §8Ministry of Wartime Technology§! and §0Ministry of Awesome§! were at the forefront of military technology during the war, many of their facilities lay abandoned or hidden out in the wastes. These hidden troves are dangerous and well protected... but may contain information we could use in the future."

### Field Operations ###

GenTalonBaseOperations1:0 "Establish a Dedicated §7Command Center§!"
GenTalonBaseOperations1_desc:0 "With our Base in a functional enough state, we can begin sending out §7Strike Teams§! To that end we need to establish a dedicated structure for handling the planning, administrative needs, and support for these missions."

GenTalonBaseOperations2:0 "Expanding Operations"
GenTalonBaseOperations2_desc:0 "Our Forces are prepared, our People are prepared, we as a §gTalon Company§! are ready to take on greater challenges beyond our local area. Ancestors Willing, we will be remembered among the Greatest of Mercenaries the Wasteland has ever known."

### Infantry Training ###

GenTalonBaseTraining:0 "Organized Training"
GenTalonBaseTraining_desc:0 "Theres alot more to being a §gTalon§! than wings, a beak, and black armor. Each Prospect is trained to survive not only the Wasteland, but the myriad of dangers that exist in it; Raiders, Slavers, Mutants, Ghouls, Monsters and more... and that training is NOT for the meek of heart or weak of will."

GenTalonInfantry1:0 "§gTalon Combat Operators§!"
GenTalonInfantry1_desc:0 "Every §gTalon Company§! Operator is meant to be a versitile and lethal combination of drilled training and experience, the latter can't be be gained without the prior to ensure one survives to learn... and learn they shall."

GenTalonInfantryRefined:0 "§8Tactical Doctrine:§! §0Refined§!"
GenTalonInfantryRefined_desc:0 "A Refined approach will allow our Operatives to engage our enemies in seamless, smooth perfection. Working our doctrine to focus on specialized combat elements. Like the Special Forces of old."

GenTalonInfantryRefined2:0 "Specialized Training and Equipment"
GenTalonInfantryRefined2_desc:0 "Long-rifles, Suppressors, Wingblades, Pneumatic Weapons, our §0Refined§! approach will require special tools for the job... tools we will need to develop and provide."

GenTalonInfantryAssault:0 "§8Tactical Doctrine:§! §tUnconventional§!"
GenTalonInfantryAssault_desc:0 "An Unconventional approach might be considered 'Raider-like' by many... sneaking in the dark, striking at our enemies soft and vulnerable underbelly, using every underhanded and cruel tactic avalible to ensure a victory... its not clean, but victory never is."

GenTalonInfantryAssault2:0 "Unconventional Firepower"
GenTalonInfantryAssault2_desc:0 "Crossbows, Specialized Melee Weapons, Shrapnel Grenades, Flamers... if it can invoke Terror on an enemy, it has a place and a need in our talons."

GenTalonInfantryBalanced:0 "§8Tactical Doctrine:§! §7Conventional§!"
GenTalonInfantryBalanced_desc:0 "Adopting the Conventional Tactics of the Old World may seem like a challenge, but even in small numbers one can find success with them; Squad tactics, platoon coordination... even Company-scale tactics might one day serve a purpose in the darkness of the Wasteland."

GenTalonInfantry2:0 "Necessary Support Equipment"
GenTalonInfantry2_desc:0 "Medical Supplies, Communications Equipment... our troops will need a great deal more than the gun in their talons and the armor on their back."

GenTalonInfantry3:0 "Improving Our Operatives Equipment"
GenTalonInfantry3_desc:0 "The Wasteland is an ever-changing enviroment... what works today may not work tomorrow, but with time and effort we can prepare equipment to meet MOST of those changes in stride."

### Air Training ###

GenTalonAir1:0 "Salvage Memory Orbs"
GenTalonAir1_desc:0 "While Memory Orbs might not be the bet source of training information, the memories of long-dead trainers or combat pilots should serve as a worthwhile base for training our own generation of pilots."

GenTalonAir2:0 "Recover Ancient Aircraft Wrecks"
GenTalonAir2_desc:0 "There are a great many wrecks across the wasteland; Airships, planes, chariots, Vertibucks... While the vast majority are nothing but twisted metal, some are intact enough to be learned from."

GenTalonAir3:0 "Construct a Proper Flight Ayriedrome"
GenTalonAir3_desc:0 "Flat and packed dirt, a few makeshift covers made from tent-cloth or metal, a lighting system so our pilots can see where they're landing, and a squat tower to coordinate things in the air... simple... but effective."

### Education ###

Talon_know_Medical_1:0 "§8Focus:§! §5Medical Training§!"
Talon_know_Medical_1_desc:0 "A major element of our education will be in the realm of Medicince, ensuring every young tom or hen under our wing has the knowledge of how to treat basic injuries in the field. In the harshness of the wasteland, such knowledge will serve them well as they grow."

Talon_know_Medical_2:0 "Specialized Additives"
Talon_know_Medical_2_desc:0 "During the War the Equestrians developed many ways to preserve their foodstuffs, to the point that most canned goods are still edible today. While we are unlikely to find ways to do the same, using those very same cans we can determine what some of the preservitives are. Any amount of food we can preserve is a boon."

Talon_know_Medical_3:0 "Medical Research"
Talon_know_Medical_3_desc:0 "There have been many wasteland physicians over the years who have worked alongside or treated our §gTalons§!, each one has brought a new lesson to our medical personnel... its time we made use of them."

Talon_know_Medical_4:0 "Dedicated Medical Specialists"
Talon_know_Medical_4_desc:0 "By dedicating medical personnel to specific fields of medical training, we can establish organized teams of specialists to handle our wounded and research without compromising the levels of care expected by our forces."

Talon_know_Intelligence_1:0 "§8Focus:§! §OProduction Fields§!"
Talon_know_Intelligence_1_desc:0 "There are several fields of industrial necessity our Company needs covered... while we would have to split our focus to ensure a level of 'passing' knowledge on them, it will be better than focusing into a singular field."

Talon_know_Intelligence_2:0 "Push For Additional Researchers"
Talon_know_Intelligence_2_desc:0 "Some of the more studious of our students show a level of intelligence that may serve well in devising new routes of research. We should push some of them to start looking at new potential avenues of thought."

Talon_know_Intelligence_3:0 "Industrialization Research"
Talon_know_Intelligence_3_desc:0 "As our people grow more familiar with certain industrial processes, we can expect some minor breakthroughs in our Industrial Sector."

Talon_know_Intelligence_4:0 "From The Classroom To The Design Room"
Talon_know_Intelligence_4_desc:0 "Some of our people have taken their lessons to heart and have constructed a workshop of their own. A glorious day."

Talon_know_1:0 "Lessons from the Wasteland"
Talon_know_1_desc:0 "The Wasteland does not give its lessons cheaply."

Talon_know_13:0 "Continued Developments"
Talon_know_13_desc:0 "While calling what we have 'Higher Learning' might be a stretch, none can say we are without Wisdom. As the number of knowledable creatures grow, so to do the number of potential researchers under our perview."

### Dependants ###

 Talon_industry_1:0 "The Civilian Sector"
 Talon_industry_1_desc:0 "Not everyone has what it takes to be a Talon Mercenary; The Young, the Decrepid, Non-Gryphons, those unwilling to kill other thinking creatures... partners and loved ones. While they might not be out on the job with us, they maintain a far more important role: They keep a home for us to come back to."

 Talon_industry_2:0 "Let There Be Light"
 Talon_industry_2_desc:0 "The Wasteland is a harsh mistress; the land is dark and hidden by the roiling storms of the Cloudcover, the ground in most places is poison. Light and warmth alone is a rarity. While we face the threats in the dark, those at home work to restore the most basic of things in the ruins we've claimed as our base; Plumbing and Electrical work."

 Talon_industry_3:0 "Restore Local Roads"
 Talon_industry_3_desc:0 "Most of the 'Roads' in our territory gave up the ghost a long time ago, these days they have more in common with black-cobblestone paths stretching off into the darkness. While we can't reconstruct them yet, we can patch up the paths to something more like a paved path... and perhaps add some occasional lighting that connects back to our base."

 Talon_industry_4:0 "Removing The Rubble"
 Talon_industry_4_desc:0 "As we continue to expand there comes a need for old, ruined structures to be torn down so their materials and space can be used to build something new. A shattered shopping center can swiftly become an ayrie of private shacks, a deep crater where a building once stood could become a retaining pond or an underground shelter against attack."

 Talon_industry_5:0 "Cottage Industry"
 Talon_industry_5_desc:0 "Ponies, Gryphons, Zebra, all races have a long history of having families who specialize in making things. With an actual place to call home, our dependants can find their chosen crafts and strengthen our position in their own way."

 Talon_industry_6:0 "Hunters Lodges"
 Talon_industry_6_desc:0 "Hunting is a tradition of Gryphon-kind going back to long before the written word... in our time as a species we have had many types of prey; mindless creatures, fish, even ponies and deer. But the time of hunting those latter two is [for the most part] history. While many of our dependants do not wish to fight, many are willing to take up a rifle to hunt. . . ...and some are more than eager to contribute their skills maintiaining and building rifles to our efforts."

 Talon_industry_7:0 "Fortified Settlements"
 Talon_industry_7_desc:0 "The age of borders marked out on maps ended in Balefire, these days anything beyond the walls of a settlement is Wild Territory... even with our mercenaries venturing forth to clear our Raiders and Monsters, the only truly safe place is within a Settlement or Outpost. To that end, efforts to build proper walls to defend our places of safety are necessary."

 Talon_industry_8:0 "The Power of Tradition"
 Talon_industry_8_desc:0 "For over two thousand years of recorded history, Gryphons have flown, fought, died, and stood victorius against adversity. Even in a world where the Magic of Friendship is as dead as the Princesses, we still have our Traditions. We still pray to Eyr, to Arcturius, and to Boreus. For we are Gryphons, our Gods and Ancestors still see us as Worthy."

 Talon_industry_9:0 "Civil Culture: Self Determination"
 Talon_industry_9_desc:0 "While we don't discount the dangers of the Wasteland, why should we die for a specific ideal or cause? To survive is sufficient enough. To this end, we shall focus on granting our dependants the best lives they could have in the Wastes."

 Talon_industry_10:0 "Civil Culture: So Say We All"
 Talon_industry_10_desc:0 "In order to survive and to keep ourselves united, we must prepare ourselves for inevitable conflict. It is the way of the Wasteland, and because of this, we shall focus our society into the potent powerhouse we know it can be."

 Talon_industry_11:0 "Invite Settlers"
 Talon_industry_11_desc:0 "There are many out there who wander aimlessly. They are always seeking shelter from the harshness of the Wastes, which is something we can provide. They might not all be gryphons, but only a fool casts aside a mind that can build a Talisman, a Laser Rifle, or Arcane Technology just because they're beakless."

 Talon_industry_12:0 "Building Upward"
 Talon_industry_12_desc:0 "Gryphons have a long-standing tradition of building 'Up', its why we call our homes 'Ayries'. In such an unforgiving wasteland, having multiple floors to a structure offer more than just more space to live and work. It can mean the difference between life and death against a grounded enemy, like most raiders or Ghouls."

 Talon_industry_13:0 "Expanding Trade"
 Talon_industry_13_desc:0 "Trade is the language of a Gryphon... is it a stereotype? Yes. Is it true... well, yes. Our efforts have made the civilian sector of our base a welcome habitat for travelling merchants, scavengers, salvagers... and even a rare few potential recruits for Talon Company."

 Talon_industry_14:0 "From Hunting Rifles to Sniper Rifles"
 Talon_industry_14_desc:0 "As time has gone on, our Hunters have found that the usual bolt action rifles aren't that effective against some of the Wastelands most mutated of monsters. To that end some of the most capable of them have begun producing copies of Old World Sniper Rifles and other high power weapons for their hunts. Some of these even make their way to our Mercenaries."

 Talon_industry_15:0 "From Cottage to Counter"
 Talon_industry_15_desc:0 "Over time the number of products our Cottage Industry is producing has brought in a great deluge of Caps and Influence among the travelling traders of the Wastes. The income from this has become a staple in the lives of many of our dependants."

 Talon_industry_16:0 "The Rumble of Industry"
 Talon_industry_16_desc:0 "After a great deal of effort some of our dependants have produced a true, legitimate Factory-Workshop capable of making a multitude of products, arms, armor... potentially even Vehicles."

 Talon_industry_17:0 "A Network of Trade Routes"
 Talon_industry_17_desc:0 "Finally our efforts to improve the roads of our territory has paid off, from high above any Winged being can see the lights of our trade-routes. Patrolled and protected by Mercenaries and Hunters, this. Is a sign of Power."

 Talon_industry_18:0 "The Population Booms"
 Talon_industry_18_desc:0 "Between our mercenaries returning to loved ones or bringing back new partners from their journey's into the dark. Our population is slowly and steadily booming. Chicks are born and raised, the young grow of age... and the Gods smile upon our efforts."


