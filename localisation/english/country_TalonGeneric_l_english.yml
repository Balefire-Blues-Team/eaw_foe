### EVENTS ###
##############

TalonGeneric.1.title:0 "By our Ancestors"
TalonGeneric.1.desc:0 "Our §7Talons§! came from all walks of life before the war, what is the majority of our ancestry? Are we descendant from Noble Vedinians, Manipulative Herzlanders, Hardy Nova Griffonians, or frugal Karpathians?"
TalonGeneric.1.a:0 "§OWe Draw our lines from the powerful Heartlands of Griffonia.§!"
TalonGeneric.1.b:0 "§0We can trace ourselves back to the clever-beaks of southern Griffonia.§!"
TalonGeneric.1.c:0 "§7The Nobility of the North Flows through our veins.§!"
TalonGeneric.1.d:0 "§8Our blood trails back to the first members of Talon Company.§!"

TalonGeneric.2.title:0 "...and by what we have sown..."
TalonGeneric.2.desc:0 "As our fragment of the once-great §7Talon Company§! stabilized into an independant company, we found ourselves focusing on immediate survival... We had need of resources, replacement equipment, and bodies."
TalonGeneric.2.a:0 "§tWe recovered an abandoned Military Logistical motorcarriage.§!"
TalonGeneric.2.b:0 "§8We fixed up an abandoned Workshop motorcarriage.§!"
TalonGeneric.2.c:0 "§7We Trained our Young to handle less dangerous tasks.§!"






