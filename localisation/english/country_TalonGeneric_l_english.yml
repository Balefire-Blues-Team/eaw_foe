### EVENTS ###
##############

talon_generic_event.1.t:0 "Raider Base Quelled!"
talon_generic_event.1.d:0 "Our team has managed to completely clear the designated location of raiders without suffering major casualties! Our contractor will be most pleased to hear this indeed."
talon_generic_event.1.a:0 "Score another."
talon_generic_event.2.t:0 "Our Team Requires Rescue!"
talon_generic_event.2.d:0 "The raiders at the marked location were more heavily extrenched and well supplied than we were led to believe, resulting in the loss of half the team and a rescue party needing to be sent to recover the survivors!"
talon_generic_event.2.a:0 "Maybe next time."
talon_generic_event.3.t:0 "No Response"
talon_generic_event.3.d:0 "Despite numerous attempts to contact our team after several days of no contact, we have no other choice than to assume they were completely wiped out by the raiders. A stain to our reputation."
talon_generic_event.3.a:0 "Blasted raiders!"
talon_generic_event.4.t:0 "A Bounty Turned In!"
talon_generic_event.4.d:0 "Our bountry hunters have managed to hunt down and turn in their target with minimal casualties, accruing a nice sum of caps and experience for us."
talon_generic_event.4.a:0 "Score another."
talon_generic_event.5.t:0 "Our Bounty Hunters Require Rescue!"
talon_generic_event.5.d:0 "The bounty we were sent to handle has managed to not only escape and inflict casualties to our team, but bogged them down with goons requiring a rescue party to be sent."
talon_generic_event.5.a:0 "Next time they won't be so lucky."
talon_generic_event.6.t:0 "Our Hunters Perished!"
talon_generic_event.6.d:0 "We have not heard nor been able to contact our team of bounty hunters for several days, and the local word does not paint a pretty picture of what has happened to them."
talon_generic_event.6.a:0 "That's one tough bounty."
talon_generic_event.7.t:0 "Feral Ghoul Nest Cleansed!"
talon_generic_event.7.d:0 "The designated location overrun with feral ghouls has successfully been cleared of the threat by our extermination team, our contractor will be most pleased."
talon_generic_event.7.a:0 "As if there were any doubt."
talon_generic_event.8.t:0 "Our Extermination Team Requires Rescue!"
talon_generic_event.8.d:0 "Despite the location being only filled with feral ghouls, our team radioed in that there were far more ghouls than thought and they needed rescue."
talon_generic_event.8.a:0 "Someone's going back through training."
talon_generic_event.9.t:0 "Extermination Team... Exterminated "
talon_generic_event.9.d:0 "We have lost contact with our extermination team! We have no choice but to assume all twenty Talons were wiped out by...ghouls."
talon_generic_event.9.a:0 "...maybe they were all reavers?..."


