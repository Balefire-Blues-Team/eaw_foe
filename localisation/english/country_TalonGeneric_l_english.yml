### Decisions ###
#################

 
 foe_talon_decision_cat:0 "§7Local Talon Contract§!"






#############
### Ideas ###
#############

 TalonEthicsKind:0 "Talon Ethics: §GKind§!"
 TalonEthicsKind_desc:0 "Our §7Mercenary Forces§! are actively attempting to work with local elements, aiming to ingraciate ourselves to the population."

 TalonEthicsNeutral:0 "Talon Ethics: §1Neutral§!"
 TalonEthicsNeutral_desc:0 "Our §7Mercenary Forces§! are taking no special actions to ingraciate ourselves with the local population, taking a neutral stance in how we treat with them."

 TalonEthicsMerciless:0 "Talon Ethics: §RMerciless§!"
 TalonEthicsMerciless_desc:0 "Our §7Mercenary Forces§! are working to crush any sentiment against us among the local population through a mix of intimidation, kidnapping, and enslavement. Resistance to our efforts is... present but managable."

 TalonBaseStatus1:0 "Talon Company Status: §RDispossessed§!"
 TalonBaseStatus1_desc:0 "Our forces and §3Dependant§! are living out of mobile caravans and tents, our organization and capabilities are heavily hindered. We Need to find a place to establish a Base."

 TalonBaseStatus2:0 "Talon Company Status: §1Locally Established§!"
 TalonBaseStatus2_desc:0 "Our forces and §3Dependant§! are settled in at our local Base of Operations. We are able to conduct operations at an acceptable rate with a minimized risk to our §3Dependant§!."

 TalonBaseStatus3:0 "Talon Company Status: §4Regionally Established§!"
 TalonBaseStatus3_desc:0 "Our Base is now a well-developed military installation capable of repelling all but the largest of attacks, with a sizable §7Mercenary§! and §3Dependant§! Population. We are capable of conducting operations far afield and have established outposts across our controlled territory. We are here to Stay."

 TalonHeritageHerzland:0 "§WHeritage:§! Herzland"
 TalonHeritageHerzland_desc:0 "Our Ancestors were among the ancient liniages of the Herzland, or Heartlands of Griffonia; The The Strawberry Duchy, Feathrisia, Griffonheim, and so on."   

 TalonHeritageVedina:0 "§WHeritage:§! Vedina"
 TalonHeritageVedina_desc:0 "Our Ancestors were among the Noble lines of Vedina; Knights, Houseguards, and other honorable creatures. Many of them are responsible for our companies Oath-like stance on Contracts and extensive training regimes."   

 TalonHeritageNova:0 "§WHeritage:§! Nova Griffonia"
 TalonHeritageNova_desc:0 "Our Ancestors were among the Frontiersgriff's of Nova Griffonia, the First §gTalons§!. Their Ferocity and brutal efficiency stirs hot in our blood."   

 TalonHeritageKarthinian:0 "§WHeritage:§! Karthinian"
 TalonHeritageKarthinian_desc:0 "Our Ancestors were frugal and cautious with their coinage back in the day... even now when bottlecaps are used for currency, their frugality carries on in us."   

 TalonMedical1:0 "Education Focus: §CMedical§!"
 TalonMedical1_desc:0 "Our focus on medical training will help the longevity of our Talon's in the field... and at home."   

 TalonIndustrial1:0 "Education Focus: §OVaried§!"
 TalonIndustrial1_desc:0 "Providing a variety of educational lessons ranging from basic engineering to scientific theory should allow our future Talon's to tackle a variety of situations."   

 






### Advisors ###

 




