## National Spirits ##

 NSU_legacy_of_steel_stallion:0 "§RLegacy of Steel Stallion§!"
 NSU_legacy_of_steel_stallion_desc:0 " 'No Step Back', these immortal words of Steel Stallion ring through the loyal heart of every follower of the Revolution. It was Steel Stallion's eternal strength that led Stalliongrad to the edge of greatness, and it is his strength that still lives in the hearts of all of New Stalliongrad today. No step back when the enemy comes for us, no step back in politics, no step back and no retreat, in New Stalliongrad, the only direction is forward."
 
 NSU_warlord_coalition:0 "Warlord Coalition"
 NSU_warlord_coalition_desc:0 "Though Red Steel is the truest dictator of the ponytariat, he is not the stallion in sole control of the Red Guard of the New Revolution. Many generals and officers, self-styled warlords, hold decentralized control over the armed forces of New Stalliongrad. If Red Steel is to see the dream of Steel Stallion brought about again, he must bring order to the warlords, or risk the Revolution dying once again. "

 NSU_disorganised_economy:0 "Disorganised Economy"
 NSU_disorganised_economy_desc:0 "The ponytariat of New Stalliongrad are liberated from the shackles of capitalism. Yet without a proper backing of theory, the government is paralyzed on how to best apply the ideas of Steel Stallion to the economy. He never got a chance to lead outside of the revolution, due to the dastardly Luna's intervention, so some theory needs to be crafted, to bring order to economic chaos."
