FOE_WS_Canterlot: "Canterlot Ruins"
FOE_WS_Canterlot_desc: "Canterlot, once Equestria’s capital, is now nothing but a ruin. The city, caked by deadly Pink Cloud that chokes the life out of any usual pony, filled with undying ghouls, and radio broadcasts that will melt a pony’s mind, is Tartarus on Equestria.\nOnly the toughest have managed to survive here, in the north, the Canterlot Alicorns, seeking the Black Book, led by a deranged but capable leader. To the south, Stable City, a group of Canterlot ghouls just trying to survive. Surrounded on one side by Zebras, and the other side by Diamond Dogs, Canterlot is relatively isolated from the rest of the world.\n\nBut as the power struggle between these factions continue, and as great empires rise across the Wastes, it may only be a matter of time until Canterlot is the capital of an empire once more."

