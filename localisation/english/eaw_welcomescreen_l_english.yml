EAW_WS_TAB_4_TXT: "\n\n§YAdded§!\n- Focus tree and content for New Mareway\n- Focus tree and content for The Bloody Army\n- Focus tree and content for Neocastle Guilds\n- Focus tree and content for Canterlot Alicorns\n- Extra starting units to Neighvarro\n- New gamerule to enable a much stronger Operation: Cauterize\n- Loads of new 3D unit models\n\n§YChanged§!\n- Dropped EaW/OWB from the name\n- Overhauled robotics tech tree\n- Renamed the Plains Raiders to Dust Reavers\n- Renamed the Freeside Raiders to Speedfreaks\n- Renamed the Leslie Raiders to Amethyst Liberation Army\n- Renamed Hayseed Walkers to Hayseed Striders\n- Renamed the Hayseed Cult to Cult of Myriad\n- Split South Everfree into two states\n- Gave the AI the option to refuse to join the NCR\n- Red Eye can now do a border war against the Fillydelphia Contingent every 50 days, instead of every 60 days\n- Talon Training Instructors law now visible to all, but still locked for certain tags/paths\n- Removed the Unity from the major countries in the country selection screen as it's content is not up to par with the rest of the mod\n- Updated some focus GFX for Neighvarro\n\n§YFixed§!\n- “Ghost aircraft” will no longer remain on airfields after capitulation\n- Hayseed Walkers now no longer receives 4,000 advanced infantry equipment while at war with Neighvarro\n- Misc missing GFX"

 # Regions
FOE_WS_Manehattan: "Manehattan Ruins"
FOE_WS_Manehattan_desc: "§YManehattan§!, a once-beautiful metropolis of Equestria, was a shining example of progress and modernity. It was the ‘City That Never Sleeps’, its hustle and bustle would warm the hearts of the city’s residents, knowing that they would always have each other. That two hundred years ago. Now, it is a shadow of its former self; its great conurbations were reduced to nothing more than rubble and a collapsed concrete jungle. The region still holds true as the jewel of the wasteland, more so than the other fallen metropolises of Old Equestria, for it was well-defended and more of its remnants were preserved behind megaspell-proof bunkers and reinforced defensive systems. It was once home to the Second Industrial Revolution, but nopony will ever see that former beauty again.\n\nThe war with the Zebras was devastating to the region, but not irreparably so, for in its shadows lurks the §OSteel Rangers§!, fighting for their cause. They hold themselves to a standard few could achieve and see in the remains of Manehattan a future they will shape. \n\nIn the middle of the ruins, a massive building dominates the skyline. Even before the bombs fell, it towered above the steel skyscrapers of the city. Today, it still stands, a shining beacon to all who see it; it has received the name §PTenpony Tower§!. It continues to serve as one of the most important telecommunications and broadcasting hubs in the wasteland, bringing the tunes of DJ-PON3’s radio station to all who are willing to hear it. The Tenpony Tower holds many secrets, yet they are what the ponies think of when they imagine the old world surviving in the Manehattan Ruins. \n\nCloser to the coast lies §CFriendship City§!, the last bastion of Friendship that exists within the wasteland. Holding steadfast to the values of Old Equestria, their way of life remains untarnished in the wasteland...yet against the harsh truths of reality and internal disharmony, their ways may not hold for much longer.\n\nIn §YGutterville§!, there is nothing except a sad empty shell of what once was. Even at its best, it remains overshadowed by the more powerful and prominent factions that control the region. It is unlikely that the status quo will change much."

FOE_WS_Northeast_equestria: "Northeast Equestria"
FOE_WS_Northeast_equestria_desc: "On the outskirts of Manehattan sit stretches of millions of houses, once inhabited by happy, healthy ponies, stretching from the Celestial Sea to Bridlepolis. Home to row after row of suburban home, and stretches of busy highway, this region of Equestria contained the majority of Manehattan's middle class workforce. Ponies would drive from Bridlepolis, from their calm coastal towns, from Summerfield, to work as middle managers or researchers for the Ministries in Manehattan.\n\n When Balefire hit Manehattan, an influx of radiation, destruction, and refugees left this part of Equestria struggling, as ponies crowded into the new town of Portshoof, in the shade of the Empire State Building, along the riverside of the Mare River, eking out their new lives. Two hundred years have passed, and the north still suffers from their Manehattan proximity. The Rain Riders threaten to cross the river every day. As powers compete over Manehattan, the young states of the north can only look on in worry, for if anyone could control Manehattan, they'd come to claim the suburbs as well. Under the oversight of a zebra, a pony, and a Griffon, the north looks south with worry.\n\n Yet perhaps someday, the spirits of the north shall force their eyes away from the south, to the call of the snow and chill."

FOE_WS_Sunrise: "Sunrise"
FOE_WS_Sunrise_desc: "Two hundred years ago, a great highway was built outside of Manehattan, called the Sunrise Highway. Starting at Macintosh Memorial Bridge, the highway led past the residential town of Freeside, and east, to Summerfield. Another highway would carry a driver east to Manehattan, but the Sunrise highway proper would instead turn south, taking a driver down the coast of the Poninsula. This great highway supported a connection between Freeside and Manehattan, allowing the middle class ponies of Freeside to board buses by the dozen, or to drive, to their jobs in Manehattan. It also served many smaller ports on the Celestial Sea, giving sailors and supplies to many smaller docks, which produced dozens of ships in their prime.\n\n After the bombs fell, the Sunrise Highway became a place of death. Ponies fleeing Manehattan would travel down the highway, to find safety from the Balefire. To the south, the Celestial Sea Fleet kept a tight border, turning away many sick refugees, unable to handle the resource strain. It was then that the road gave way to its true owners, once called The Sunriders. They were bandits and gangsters who rode around in busses from Freeside, or in tricked-out cars, harassing the fleeing refugees, taking their radiation medicine, their food, and their lives. Many refugees, rejected by the Celestial Sea Fleet, would even join The Sunriders, their anger at the borders of the newly named Rustwreck giving them an anarchic love of freedom to travel.\n\n Two hundred years have passed since then. The Sunriders are a forgotten memory, replaced by the Rain Riders, a harsh gang inspired by the original gangsters who rode the Sunrise highway, where the fastest rule, and the slower serve. They are also replaced by the Speedfreaks, descendants of the desperate and sick who joined the Sunriders, some say this is even why many Speedfreaks have an ugly, unsettling appearance. They preach a philosophy of freedom, the freedom to drive down any highway, no matter the laws or borders. These two Raider factions have made a name for themselves, riding around in armored vehicles, fighting with explosives usually. Their usual clashes cover miles of road, and after so much fighting and abuse over it, the Sunrise highway hardly even exists in their lands anymore, reduced to rubbles and relics. Both raiders groups, though, seek the same thing, to ride from one end of the Sunrise to the other.\n\n Yet there exist two pockets of civilization on the Sunrise highway. Stable 32, now called Stajniopolis, was a stable meant for the nearby town of Freeside, and for the nearby Cumulus Skyport. Ponies would flock here when the war ended, living prosperous, safe lives, underground. But recently, Stable 32 has opened to the world, their young Stable republic trading with outsiders from far and wide. Rumors say that many in the Stable seek to rebuild Freeside, in a proper republic.\n\n Rustwreck sits at the end of the highway, the remnants of the Celestial Sea Fleet, seen over by a two hundred year old ghoul. None remember how Rustwreck turned them away in their time of need, ponies just see the nation as a bucket of rust, a remnant of a bygone year. Yet whispers come from Rustwreck, of their Admiral going feral, and ambitious voices call for claiming the rest of the highway.\n\n In Sunrise, conflict is as guaranteed as the sun rising in the distance, behind Enclave grey clouds. Yet if someone could end the conflicts once and for all, and connect the Sunrise highway end to end, it's assured they would be a great power in their own right."

FOE_WS_Eclipse_gulf: "The Amethyst Basin"
FOE_WS_Eclipse_gulf_desc: "Before the Great War, the basin of the Amethyst River was a small nook within the Eclipse Gulf that harbored a number of port towns and cities with which trade between the continents of Equus and Griffonia flowed. It was one of the last heavily-populated areas before heading further south into the region of Azuria. Additional industries in the pre-war times included fishing and a small foresting sector, but like with everywhere else in Equus, the balefire radiation from the Zebra megaspells poisoned the nature that these ponies relied upon. None of it was targeted directly, as larger and juicier targets existed to the north and northwest, like Canterlot or Fillydelphia. This has allowed ponies to claim regions of the post-war ruins and create pockets of relative stability and safety. Three powers have established themselves in the Amethyst Basin, although one is quite recent. The one that most ponies who hear of the region think of and tends to represent it to the rest of the Wasteland is New Mareway, a neo-feudal society that has seen prosperity—relatively—for over a hundred years, and whose nobles have traced their lineages to great aristocratic families of Canterlot. They have recently gone through a succession crisis, losing their two northern baronies to the Bloody Army, under the leadership of Blood Mane, a claimant to the throne that currently Star Gazer rules. To the East of New Mareway lies the guilds of Neocastle, who dominate the industry and research of the region. Although they remain insular and dedicate themselves to the 'Magic of Industry and Capitalism,' they hold onto their territory with an iron grip and refuse to let any of their employees to travel far. Although they do lie close to Red Eye's armies, the nations of the Amethyst Basin have thus far remained out of his sights, and will have time to prepare for any ambitions he may have that venture south. With the resources and wealth that the region can provide them, whoever comes out on top of the slowly building tension between the guilds, the Bloody Army, and New Mareway will be able to weather the storm, much like the ponies that have lived there for generations already have."

FOE_WS_Foal_mountains: "Foal Mountains"
FOE_WS_Foal_mountains_desc: "The Foal Mountains never had much life during the war. Other than an electric park, a mine, and a few small towns, not many ponies were settled down in the mountains and hills. The hills and mountains were quite popular as a tourist attraction, though, with field trips, hikers, and skiers coming all around the year, to experience the natural beauty of the high mountains. The Royal Mountain Rangers were founded a long time ago by Princess Celestia, and from their HQ, High Hill, they would provide field trips and assistance to every pony and visitor to the mountains.\n\n On the Last Day, a group of foals were being given a tour through the mountains, protecting them from the fallout. The rangers accompanying them would receive a call to immediately return to High Hill, and many would, with only a few staying behind, to help the foals and teachers survive. In High Hill HQ, the head off the rangers would recognize the Royal Mountain Rangers, claiming a spot of territory in the hills and hunkering down, where none could harm them. To their east, the owners of the Midnight Wind-Park would flee, leaving behind confused and disoriented workers, and their families. To them, a stallion, eyes glowing like Balefire behind a mask, would come. He, Sun-Above-Clouds, would grow food from the dead soil, he would provide meat, and heal the wounded. Thus was founded Green Valley, named after the color of his eyes, with Sun-Above-Clouds elected sole leader.\n\n Two hundred years later, and the traditions established on the Last Day hold. The foals of Foaltopia live separate from the Foal Valley Tribe, yet they protect each other. To the east, Winsome, defeated after a war against the foal tribes, licks its wounds and prepares. In Green Valley, Sun-Above-Clouds has founded a religion, based around the voice recordings Luna left behind in the Midnight Wind-Park. In the Hill Trotters, a sorcerer from afar has arrived, seducing Overhill for conquest."

FOE_WS_Canterlot: "Canterlot Ruins"
FOE_WS_Canterlot_desc: "Canterlot, once Equestria’s capital, is now nothing but a ruin. The city, caked by deadly Pink Cloud that chokes the life out of any usual pony, filled with undying ghouls, and radio broadcasts that will melt a pony’s mind, is Tartarus on Equestria.\nOnly the toughest have managed to survive here, in the north, the Canterlot Alicorns, seeking the Black Book, led by a deranged but capable leader. To the south, Stable City, a group of Canterlot ghouls just trying to survive. Surrounded on one side by Zebras, and the other side by Diamond Dogs, Canterlot is relatively isolated from the rest of the world.\n\nBut as the power struggle between these factions continue, and as great empires rise across the Wastes, it may only be a matter of time until Canterlot is the capital of an empire once more."

FOE_WS_Summerdale: "Summerdale"
FOE_WS_Summerdale_desc: "The Ghastly Gorge is a place that earned its name, a deep gouge in the crust of the planet. It was avoided for centuries, except for the most brave tourists, who wished to fly past the gnashing teeth of the Quarry Eels, usually ending in disaster for the pony, and a tasty meal for the eel. But when the war came, the Gorge became an opportunity, it was an area that was easy to control, with only a few ways in, and a few ways out, with enough natural danger to make it risky for any infiltrators or enemy strike-forces.\n\n In the defensive gorge, Equestria would build roads and railroads, connecting Canterlot and Ponyville to the south and the west, with a large road connecting Appleloosa and Canterlot being built overlooking the gorge. In addition, a large bunker would be built overlooking the gorge, a hidden area for Equestrian soldiers to regroup and defend from, if needed, between Cloudsdale and Canterlot. This bunker overlooked the gorge below, where a few enterprising ponies began to build settlements.\n\n After the war ended, refugees sought for a safe place to settle, finding comfort in the tight walls of the gorge. On the major Appleloosa-Ponyville road, ponies would build Plainstown, a small town beset by dust storms intermittently, protecting them from any outside forces. Deep in the gorge, an autocratic, but fair, society would be built, with the eels and the walls of the gorge giving ponies safe shelter. Hill 432 Bunker would be most interesting as the war ended, as a group of Griffon mercenaries were stationed there at the time. This Talon company would base themselves out of the bunker, selling their services across the west.\n\n The dust storms of the Plains Ponies didn't protect them for long, as a wild pyromaniac, Buckshot, took over the town, making them into the Dust Reavers, headed by the best raider of all time..."

FOE_WS_Azuria: "Azuria"
FOE_WS_Azuria_desc: "Along the §CAzureway§!, there once stretched hundreds of miles of §Gfertile farmland§!, disrupted only by the occasional small settlement. Of course, the §FBalefire poisoned these lands§! with its necromantic magic like it did to most of the world.\nThe once §CCrystal-clear River§! is now nothing more than §La greenish-brown sludge§! most of the time, and the vast majority of those old farms now lie barren, their soil washed into the river by the near constant Rains.\nBut not all is lost! Slowly, over the past 200 years, some have §Dstarted reclaiming this land§!. Small subsistence farms have sprung up here and there, while others have found new ways to use this land:\n\nThe §OShattered Hoof Raiders§! have carved out a large chunk of Azuria, oppressing all that live within their realm, making life even more miserable for the farmers by taking a large chunk of their produce away to fuel their hedonistic excess.\nThe §FRock Farmers§! have taken up the once almost abandoned practice of herding rocks on the fields, waiting for them to replicate, and harvesting the surplus for minerals and gems.\nThe §GRad Fishers§! are a hardy bunch, living mainly off of the mutated fish and Seafood that dwell in the Azureway. Though they need to be careful, as, due to heavy mutation, even the Shellfish might try to eat you back!\nThe §DNeocastle Guilds§! pride themselves for upholding the Magics of Industry and capitalism, mainly using the River to power their mills and Factoriums, in which many a serf toil away in.\nLastly, §rNew Mareway§!, perhaps the most prosperous society on the Riverbanks, trade far and wide, making massive amounts of caps, though these mainly stay within their noble classes, never trickling down to the serfs.\n\n§CThe Azureway§! still provides much to those that choose to look for its gifts, and the nations on its banks are perfectly situated to become major players among the wastes."

FOE_WS_Appleloosa: "Appleloosa"
FOE_WS_Appleloosa_desc: "§OAppleloosa§!, once the romantic frontier of Old Equestria, where the beauty of farms and apple harvests were famous and common sights. Before the war, they were a region loosely settled by ponies who sought a new future and to carve out their own stories. Though far from the industrial core of Old Equestria, the food grown here had been plentiful enough to feed all those in the region. The balefire bombs made short work of the region, causing it to collapse in on itself and become a pitiful shadow of what it once was.\n\nNow, §ROld Appleloosa§! survives as a hub of Slaver activity, with makeshift metal structures used by the slavers as housing, intersped occasionally by cages that housed the slaves. At the centre of it all was a thriving marketplace where even young foals could be traded for bits over hoof or be pressed into labour. If hope was a currency, then it was the only type of currency Old Appleloosa was in severe shortage of. \n\nNeighbouring Old Appleloosa to the north is the §CLightning Scavengers§!, a loose group of quasi-autonomous villages united under one banner. Having a roughly equal level of population for the three pony races, it holds the dubious title of simultaneously having one of the largest pegasi minority settlements outside of the Enclave and being one of the most diverse places in the wasteland. While many of the pegasi that once lived in Cloudsdale fled to the Enclave or died when the city crashed, quite a few also decided to live around the remains of their former home in the Cloudsdale Ruins, which was the root foundation upon which the Lightning Scavengers were formed. The Lightning Scavengers, having the support of some pegasi, now control the mostly functioning remains of the Cloudsdale Weather-Factory. Though beset by internal strife, they hold on to their ideals and carry on in the wasteland.\n\n§YNew Appleloosa§!, though it shares a name with its distant neighbour, was not a slaver town and had never been the type of place to tolerate the presence of raiders. It trades only goods with Old Appleloosa out of a need to secure its own existence lest they become the next target of Red Eye’s Army. Built around the remains of a major railway junction, most of the buildings were made of derailed and salvaged train cars, some stacked several cars high. For defense, a ring of boxcars surrounds the town, with ponies constantly on guard against the threat of a hostile takeover. \n\nThe §rMinistry of Arcane Science§! survived the end of the world locked behind Stable 49, seeing themselves as the last vestiges of the Old Equestrian Government and the rightful rulers of the wasteland, they plot within their Stable, waiting for a time when they will return and show the world that all is not yet lost."

FOE_WS_Fillydelphia: "Fillydelphian Plains"
FOE_WS_Fillydelphia_desc: "Fillydelphia was once the industrial heart of Equestria, the industrial thrum of its factories could be felt through the land. Steel Ranger armor was shaped by the Ministry of Warfare, medicine produced by the thousands by the Ministry of Peace, and every soldier of Equestria marched carrying Fillydelphian goods. While Manehattan was the cultural hub of the east, it could never truly match Fillydelphia in pure industrial might. Roads stretch north, east, south, and west from the factories of Fillydelphia, and the port was always full of ships laden down with cargo.\n\n On the Last Day, everything changed. When Balefire hit Equestria, many ponies left Fillydelphia, but many others didn't have a choice. The managers of the Fillydelphian factories, turned brutal by late-war quotas, would take their employees as slaves, forcing them to fight the other bosses of Fillydelphia. The slavers, born out of the factory owners, would dominate the industrial north of the city. Other regions of the city were filled by Steel Rangers. First they came due to an evacuation order, helping ponies to the nearby safe-zone of Sunnyshore, but when the news of the Princesses' death came, the Steel Rangers decided to stay. They fought back the slavers, the bandits and the mutated beasts, claiming the southern half of Fillydelphia, guarding it jealously from the others.\n\n While the south consolidated under Steel Rangers, the north continued to fight. The slaver families, descendants of the factory owners, fought for eternal dominance. Escaped slaves would band together into their own armies, trying to fight a war of liberation that never came to fruition. Gangsters, raiders, and monsters would roam the streets, and any 'legitimate' authority didn't last long. The factories of Fillydelphia weren't destroyed only by Balefire, but by the hate of desperate ponies, fighting over the corpses of past greatness. Many great slaver families would rise and fall, the Slits, the Grindstones, the Flashes, but none were as influential as the Shackles, once a family of industrialists, seen as far south as Appleloosa, now the mightiest of the slavers. Their young patriarch, Chainlink, would lead a brutal campaign, destroying the Slit family and taking their only living daughter as a personal slave, using arms imported in by Mister Mosin, from the north.\n\n The conflict in Fillydelphia would end, though, as a stallion came from the west. A stallion with a glowing eye, wearing a symbol of the old world as a cape, with a mane of black shadow and a tongue of silver. Red Eye would gather slavers under his command, convincing them of his dream. He would convince raving raider lunatics, revolting slave armies, and, eventually, Chainlink Shackles himself. Red Eye would quickly become the sovereign of north Fillydelphia.\n\n Now, his red eye turns to the rest of the world. To the steadfast Steel Rangers of the south, to the rising threats in Manehattan and Shattered Hoof, and one thing is clear. Fillydelphia will be the heart of Equestria once again."
 # Nations
FOE_WS_EYE: "[Root.GetNameDef] - The Villain of the Piece"
FOE_WS_EYE_desc: "Few knew of the Stable hidden deep in the heart of the Everfree, and none would have predicted that a simple scout from that Stable would become the greatest monster the wasteland had ever seen.\n\n§RRed Eye§! built up from his Cathedral in the Everfree Forest, assembling an army of the elite §YTalon Mercenaries§! led by the Griffon §RStern§!. The hills of the Rambling Rock Ridge were the first to fall under Red Eye's new dominion, newly conquered ponies serving as the foundation to Red Eye's slave empire. His forces continued to grow, absorbing the local raider gangs, and impressing slaves into his army. By then, Red Eye was a force to be reckoned with, although not the dominant power in the region. That honor fell to the raider warlord §RBrimstone Blitz§! and his vicious §YBloodletter Clan§!, the perpetrators of the infamous Sacking of Ponyville. It was inevitable that these two factions would come into conflict, the only question is who would strike first...\n\nRed Eye moved against Brimstone Blitz, beginning the horrific §CHinterlands Campaign§!. While the raiders had dominated wasteland combat for nearly 200 years, they served little match for the better equipped and better disciplined Talon army. Thus, the Bloodletter Clan's chokehold on the region was broken, their forces scattered and fractured into new, smaller gangs as Brimstone Blitz was taken captive, forced to work as a slave for the rest of his days. However, Red Eye wasn't done. He had his eyes trained on the great city of §YFillydelphia§!, and all the wonders of the old world that it held. His army blazed a path of destruction across the Hinterlands; Aided by conspirators promised a place in Red Eye's new empire, settlement after settlement fell under his hoof, the army of Talons, raiders, and slaves acting as a relentless wave pushing towards the city, trailed by a sea of slaves being herded towards their fate.\n\nAfter the push through the Hinterlands, Red Eye did not waste a single moment in attacking the city. Knowing of the oncoming tide, the §YFillydelphia Steel Rangers§! decided to abandon the north side of the city, looting as much valuable technology as they could, caring little for the ponies who resided in the city. With each city block Red Eye's army took, the Rangers pulled back in turn, a mass exodus of ponies following them who had abandoned everything in an attempt to escape the coming storm. What was left were utterly defenseless ponies, herded into makeshift cages and forced to build Fillydelphia's now famous wall, locking all the slaves into their new existence as Red Eye's pawns for his greater plan.\n\nAlways looking for a way to grow his power, Red Eye turned his gaze south, towards the assembled settlements and raiders of the §YSunnyshore§!, who quickly formed a futile alliance of necessity against him... Unfortunately, in the years since the relentless march of the Hinterlands Campaign, the raiders of Red Eye's army have grown §Rrestless and chaotic§!, sending his forces into disarray. Not only that, the situation in Fillydelphia has rapidly deteriorated, with the §YMasters§!, led by the prominent slaver §RChainlink Shackles§! growing more antagonistic towards Stern and her Talons with each passing week, balance kept only by Red Eye's indomitable will. Worse still, the slaves have begun organizing into §Y\"Unions\"§! and are actively resisting our control over them. Once the Sunnyshore is subjugated, Red Eye must turn inward, and focus on building a stable foundation for his ultimate goal of §Ctrue equestrian Unity§!..."

FOE_WS_FSR: "[Root.GetNameDef] - The Guardians of Fillydelphia"
FOE_WS_FSR_desc: "Fillydelphia is not yet lost!\nIn the southern part of this great city, the Steel Rangers still stand against the encroaching forces of §RRed Eye§!, holding back the slaver's superior numbers through their §Cadvanced technology§!, and elite training.\nThose ponies in their shiny power armor are the §CSteel Rangers§!\nFounded by the §OMinistry of Wartime Technology§! during the Great War, they were once the elite fighting forces of Equestria in their devastating war against the Zebrican Empire. And even after 200 years of radiation, anarchy, and carnage, the Steel Rangers still stand firm.\nTheir Mission: To recover as much technology from the old world as possible, and to guard the most §Ldangerous tech§! from the outside world, for there are creatures who would abuse it to terrible ends.\n\nThe Fillydelphia Contingent of the Steel Rangers operates out from the mostly intact §Yheadquarters of Stable-Tec§!, a wartime megacorporation that built the stables so many ponies used to survive the balefire holocaust that swept the lands of Equestria.\nDifficult times are ahead for the Fillydelphia Contingent, as Red Eye is pressuring them with ever-greater ferocity, A partisan movement is attacking Ranger patrols on even their side of the city, and among all this, a power-struggle among the upper ranks is paralysing the Contingent.\nOne thing is clear though:\nThey will have to act fast if they want to be able to stand against §RRed Eye§! and end his reign of terror once and for all!"

FOE_WS_SHA: "[Root.GetNameDef] - The Jewel of Azuria"
FOE_WS_SHA_desc: "The §OShattered Hoof Penitentiary§! was an infamous pre war political prisoner camp that became the resting place of the ponies and zebras who conducted the plot to assassinate Princess Celestia during her Peace-talks with the Zebra Empire. Unfortunate souls, whose memories were taken by the §PMinistry of Morale§!, and who were forever after incarcerated by the Equestrian government.\nIt was here that these prisoners were forced to mine the §CMagical Gemstones§! that lay deep under Shattered Hoof, both to fuel the Equestrian War-machine, as well as the unrestrained research of the §rMinistry of Arcane Sciences§!.\nAfter the Balefire bombs rained upon Equestria, the prisoners who survived amalgamated into the §OShattered Hoof Raiders§! using the old prison as their base of Operations. As the years flew by they came to dominate much land, stretching from the §DAzureway§! in the north down to the §GSoutheastern Jungles§!.\n\nThe Gang is commanded by the authoritative and cunning §g(and avid Sweetie Belle fan)§! §FDeadeyes§!. But the reality is, that Deadeyes is a petty subordinate, a pawn to a dragon named §OMr. Topaz§!. Topaz has ruled the Shattered Hoof gang since the beginning with the intent to use them as a means to acquire gems and §Rfeast upon the expendable§!, securing both wealth and food in perpetuity.\nHe rules from the shadows so the Gang may not discover that they are being used for a dragon, which would certainly cause them to turn on §OTopaz§!. Thus §FDeadeyes§! has acted as his means to carry out his rule in secret.\nNear the §OShattered Hoof Penitentiary§! is §YJunction R-7§!, an old railroad yard that has serves as the headquarters of the §LTalon Company§! contracted to assist the Shattered Hoof Raiders, Though due to the actions of the §LTalon's Leader§!, it has recently morphed into something of a refugee camp.\nThe §LTalon Company§! that runs Junction R-7 is one of many mercenaries colloquially referred to as §L'Talons'§! throughout the Equestrian Wasteland. The term stems from the Widely known §LTalon Inc.§!, Who were part of the §RCorporate-Occupation-Government of Nova Griffonia§! after Equestria subsumed them during the great war. It needs to be said though, that while it initially only referring to those Nova-Griffonian Griffons, it has since lost its distinction, and is also used when referring to those griffons who fought on the Zebra's side, or to any Mercenary Company with a large percentage of griffons.\n\nThe Company that operates in Junction R-7 is a commanded by §rGawdyna Grimfeathers§!, a veteran mercenary of higher moral standing than most. She has the dedication of sticking to the contract she's given to the letter, and has instilled this value in all members of her company. She has fought and won many battles over the decades and bears a great scar across her left eye to prove it. §rGawdyna§! has proven to be a formidable leader with a formidable §LTalon Company§!, capable to challenge the threats of the wastes and support the §OShattered Hoof raiders§!.In recent times however §rGawdyna's§! moral uprighteousness has caused her to form a rivalry with §FDeadeyes§! and even the §OShattered Hoof Raiders§! as a whole, which has caused great tension.\nSome even speak of this tension leading to conflict within the nation, though none has happened as of yet. Strife with the §LTalons§! in Junction R-7 and the rise of §RRedeye's Empire§! is starting to worry §OMr. Topaz§!, who is now pondering whether to cease open control over the Penitentiary and the lands around it, as §rGawdyna§! and her §LTalons§! secretly prepare to overthrow the raiders and turn Shattered Hoof into something greater.\nThe fate of these lands along the Azure River, and, perhaps, the fate of the whole Wasteland, hinges on who will triumph in Shattered Hoof, the §Oruthless and Dragon-Tyrant§!, or the §ridealist and Griffon-Mercenary§!."

FOE_WS_TEN: "Tenpony Tower - The Beacon of Civilization "
FOE_WS_TEN_desc: "They called it the pride of the §rMinistry of Arcane Science§!, for it was an unusually audacious, highly sensitive assignment: to build a massive skyscraper, capable of withstanding a megaspell blast in the middle of Manehattan. It would have no windows, be tall enough to reach towards the sky, and perhaps serve as a shelter in an emergency.\n\nWith the war against the §YZebra Empire§! in full force, six governmental institutions were formed after the abdication of §RPrincess Celestia§! to cope with growing demands of the Equestrian War Machine. The §rMinistry of Arcane Sciences§!, founded by §RTwilight Sparkle§!, was dedicated to the study, research and procurement of modern magics. The Ministry built many hubs all across Equestria, with the city of Manehattan eventually housing its very own.\n\nWith the §CMinistry of Image§! banning all potentially dangerous and inciting texts in order to maintain stability, §RRarity§!, the Ministry Mare in charge of propaganda, chose to save many texts from their inevitable censorship and destruction. This rather gargantuan effort to preserve the knowledge of the past required the use of a massive storage complex, and no location was better suited to welcome this influx of forbidden texts than §YTwilight Sparkle's Athenaeum§!, the Ministry Mare's very own private library. The Manehattan Hub continued to aid in the war effort alongside her sister hubs, proudly housing some of Manehattan's most talented magic users. It would house one of the most important telecommunications and broadcasting hubs in Equestria, with radio broadcasts continuing from the §YTenpony Tower§! long after the collapse of Equestria.\n\nWhen Equestria and the rest of the known world was scorched in Balefire, Manehattan was no exception. It was annihilated in an instant, wiping out all life in the City That Never Sleeps.\n\nExcept for §YTenpony Tower§!.\n\nThe Tower, protected by its enforced exterior, managed to stand tall amidst the destruction of the megaspell blast. The §YCelestia Line§! monorail also managed to survive amongst the crumbling Manehattan ruins. The residents who survived inside the hub converged, forming the community that would soon be known as the §RTwilight Society§!. Those who survived managed to repair most of the damage caused by the megaspell, with the ground levels being heavily reinforced, repaired, and sealed off to the outside world. §YTenpony Tower§! would gain a reputation for being isolationist and secretive. The §RTwilight Society§! would take charge of the knowledge leftover by the Ministry Mare §RTwilight Sparkle§!.\n\n§YTenpony Tower§!, the highly fortified skyscraper of a hotel located among the ruins of old Manehattan, stands as a beacon of Old Equestrian luxury, prosperity, and unbeknownst to many, vast quantities of knowledge kept hidden from the Equestrian Wasteland, kept secret by its current leadership, the §RTwilight Society§!.\n\nThe fate of §YTenpony§! lies within the goals of its current administration, and whilst very selective, it holds grand ambitions for not only §YTenpony§!, but perhaps all of Manehattan."

FOE_WS_MAS: "Ministry of Arcane Sciences - The Arcane Stable"
FOE_WS_MAS_desc: "The Ministry of Arcane Sciences was established during the Equestrian-Zebrican War (otherwise known as The Great War), for the purpose of overseeing and progressing Equestria’s technological and magical development. Our Ministry was instrumental to bringing about Equestria’s golden age of progress, playing a role in the development of almost every innovation that would go on to define wartime Equestria.\n\nOur projects during this time are far too many to note, and our accomplishments too grand to put into written word. All of this thanks to our founder, Ministry Mare Twilight Sparkle. She is the first, and greatest, leader that our Ministry and Equestria itself has ever known. Unfortunately, she is believed to have perished in the end of the world.\n\nAs the War progressed, the possibility of total annihilation grew as a concern to the public. This led to the founding of Stable-Tec, a company dedicated to developing and building shelters that could save the civilian population should the worst come to pass. As we all know, the worst did indeed come to pass, and these “Stables” became the only bastions of life as the world was bathed in fire.\n\nOne of these Stables was Stable 49. If that name sounds familiar, that’s because it is our own stable! Many of the very first residents within our Stable were officials and employees of the Ministry, making us the last known remnants of the wartime Ministry of Arcane Sciences.\n\nFollowing the end of the world, our Ministry survived within our Stable. The civilian and Ministry populations within the Stable coexisted, with a coalition government at the head. At the head of this government was The First Overseer, Calm Flower, a civilian official who mediated between the two groups and oversaw us all during those dark days. She died in her bed, surrounded by her loved ones, in 1068. A monument in her honor was built in the atrium, and stands to this day.\n\nThe Second Overseer, Bright Idea, went on to declare himself the first Minister of our reborn Ministry of Arcane Sciences, combining the civilian and Ministry personnel into one. All civilian personnel were given new positions, and our Stable was completely reorganized to better suit our needs. This would set us down the path to where we are today, with our great Ministry being at the lead!"

FOE_WS_NEV: "[Root.GetNameDef] - The Boogieman of the Wasteland"
FOE_WS_NEV_desc: "The balefire bombs that ravaged Equestria long ago led to many new societies and factions nopony has ever experimented with before. These groups quarrel and bicker among one another, not knowing that they all share the same barbarism they inherit from the wastes. They are broken in ideology but united in impurity, all springing from the same corrupt stem.\n\nThey are unfit to continue Equestria's legacy.\n\nYet, high above the heads of many and isolated from the mutants that feud below, there remains a race of ponies still pure, still untouched by the foul chaos the megaspells wrought. They call themselves the Grand Pegasus Enclave.\n\nThe establishment of the six ministries by Princess Luna would lead to the inception of the most peculiar and secretive one of them all, set to be led by the most famous pegasus of them all, Rainbow Dash. She would name it the Ministry of Awesome, and would declare its purpose to be the study of all things 'cool' and 'radical'. Many would believe the actual Ministry served no real purpose in the War, when in actuality the real purpose of the Ministry was never truly revealed to the public. Unknown to the masses, the Ministry's actual function was perhaps the most vital of them all. It would serve as a developmental, research, and covert agency specialized in all things clandestine, while also serving as the pioneering technological front for Equestrian warfare. The Ministry cooperated frequently with many military organizations, while serving as the auxiliary offensive force in various battles. It was Equestria's cloak-and-dagger, and it served her well. It would be this very Ministry that would lead to the foundations of the Enclave itself.\n\nDuring the Great War, a plan was conceived in secret among the pegasi. Unknown to any outside their circle, they would take to the clouds above and isolate themselves if the War ever proved too drastic. They would form a new form of government, one that represented their interests rather than those of the Canterlot elite. All while making use of the Single Pony Project towers to more efficiently control the weather, along with to feed their ponies without having need for the earth ponies below. However, on that unfateful day that balefire rained down across the land, the magnificent pegasus city of Cloudsdale was annihilated. This no doubt prompted the fury of all pegasi across Equestria, and the plan to separate the pegasi race from the rest began to unfold. The remaining survivors of Cloudsdale escaped and regrouped, and soon starting construction of a new Cloudsdale. It is in this new city, among others, where the pegasi would continue civilization on their own and stay above the surface for two hundred years. They formed their own government, operating with a Senate and Council as they planned ahead for the future of the races below. Finally, they would descend once more onto the Surface and establish their outpost of Neighvarro.\n\nThe Enclave of present day may be composed of entirely new individuals, but its ideals have largely remained the same. The strength of the Senate wanes as the Council begins to solidify its grip over the pegasi government. General Featherfall, although rather uninspiring, has remained in his post leading the Enclave for the past forty years, yet many question his true legitimacy thanks to his recent controversy. There are many young leaders eager to take his place and lead the Enclave in a direction it has never taken. Revanchism begins to brew through the Council and ponies eager to serve a new leader, and plans of an operation that would involve the fate of the entire Wasteland are beginning to circle among certain officers.\n\nEquestria shall continue to endure in the form of the Enclave, and its pegasi shall strive to lead it to glory once more."
 
FOE_WS_MSR: "[Root.GetNameDef] - Knights of the MWT"
FOE_WS_MSR_desc: "The §YSteel Rangers§! have perhaps the most long and storied history of any power in the wastes, reaching all the way back to well before the end of the world. Developed and formed by the §AMinistry of Wartime Technology§! by the one and only §AApplejack§!, the original Steel Rangers served Equestria as specialist soldiers on both the frontlines and the homefront. When the world was bathed in Balefire, the Steel Rangers remained mostly intact, hiding away in their multitude of bunkers and safehouses.\n\nThe §YManehattan Contingent§! can trace it's roots all the way back to one such group of survivors: the §D21st Powered Armor Corps§!, one of the founding members of the Steel Rangers as we know them today. It took decades after the bombs fell for the Rangers to move back into the Manehattan ruins, setting up a base of operations at §OBucklyn Cross§!, where they were hailed as heroes by the ponies living there. As the years went by, however, the Contingent began to slip into isolationism and decadence, becoming the very pinnacle of this new kind of Steel Ranger. \n\nThe Manehattan Contingent were the first to adopt the now commonplace hierarchy of the Steel Rangers, linear and unflinching. The §CElder§! sat at the top of the chain, acting as the leader of an entire contingent. Following an Elder were the §GStar-Paladins§!, high-ranking officers who commanded most of the operations performed by the contingent. The military section of the Rangers divided itself even further. Commanded in large by §PSenior Paladins§!, the troops also followed a hierarchy consisting of Paladins, Crusaders, and Knights. Together, these ponies made up the core of the Steel Ranger forces.\n\nIn addition to the combatant side of the Rangers, most contingents kept a large cadre of civilian §FScribes§!, ponies who are responsible for research, maintenance, and other non-combat tasks that the contingent requires. The the rank and file Scribes are headed by §ySenior Scribes§!, the most knowledgeable and influential members of the group. Finally, Senior Scribes report to the §aHead Scribe§!, who oversees all operation of the Scribe corps, and answers only to the Elder of the contingent.\n\nThe current head scribe is one §RRiver Autumn§!, a typically quiet mare, but an influential genius nonetheless. Autumn holds sway with a great number of ponies, and although she loathes the current direction of the Contingent, she knows well enough to bide her time. Some say that she wishes to become the next Elder, but her ultimate goals are known only to herself.\n\nMany years ago, the famed and venerable §rStar-Paladin Steelhooves§! assigned himself to the Manehattan Contingent, choosing many times to decline the role of Elder as offered to him. Despite his reluctance to truly lead, Steelhooves believes the Steel Rangers can become something more, something better, than what they are now. Should he press the matter, a great deal of Rangers would join him.\n\nHowever, neither River Autumn nor Steelhooves can see their goals realized until a single pony is out of the picture. §LElder Cottage Cheese§!, an ancient stallion, often cited as the glue that has held the entire society of Steel Rangers together by his sheer dedication and obsession with following the Ranger's mission to the very letter. Cottage Cheese has always led the Manehattan Contingent with a solid hoof, guiding them down a highly conservative and isolationist path. However, in recent years he has grown more erratic, obsessed with his own mortality, and what it would mean for the Steel Rangers should he pass. §RHe cannot allow that to happen.§!"
 
FOE_WS_UNI: "[Root.GetNameDef] - The Death Throes of the Old World"
FOE_WS_UNI_desc: "Before the conflict with the §WZebras§!, §GEquestria§! was a land of peace and prosperity. For over a thousand years, ponies lived peaceably with surrounding nations, aside from rare spats, which were usually resolved through words rather than violence. While civilian life boomed with many advancements to ease life, §GEquestria's§! military was left lacking.\n\nNeedless to say, the country was not properly prepared when the growing tensions with the Zebrican continent turned §Rhot§!.\n\nIn the aftermath of the §YLittlehorn Valley massacre§!, the §OMinistries of Equestria§! were founded, their primary goal to continue the legacy of Princess Celestia and to ensure a swift end to the conflict with the Zebras. One of these, the §RMinistry of Arcane Sciences§!, was led directly by Celestia's former protege, Twilight Sparkle.\n\nAs the war continued, Twilight determined that regular ponies were not sufficient to defeat the Zebras. In the following months, she delved into researching the possibility of a new breed of super soldiers, loyal only to §GEquestria§!. Eventually, the project would bear fruit, yielding the first forays into creating artificial alicorns through the latest megaspells, the §rImpelled Metamorphosis Potion§!.\n\nAfter the initial theories and prototype potions were developed, Twilight fell back to one of §RMAS'§! research bases, codename §YMaripony§!. The fortress was designed to hold the most dangerous of MAS experiments, utilizing the natural defenses of the former §CDiamond Dogs'§! vast mines for protection. As time went on, the mines were filled with deadly materials, which were byproducts of the various attempts at perfecting §rI.M.P.§! \n\nThe process was slow and fraught with difficulties, as the slightest incorrect dosage could leave a subject a worthless piece of flesh, neither alicorn nor pony. After many tests, the process was perfected, and the archetypal alicorn subject was required.\n\nIn a twist of fate, one of Twilight's former rivals, a magician by the name of §CTrixie Lulamoon§!, would prove to be the foundation for the new §Ysuper-race§!. Trixie presented herself to Twilight, showcasing the knowledge she gained of the power of invisibility from a Zebra talisman.\n\nAfter a brief demonstration, it was decided that Trixie was to be the first test subject of the perfected §M.P.§! solution. In short order, Twilight and Trixie, along with two of MAS' top researches, the twins §GGestalt§! and §GMosaic§!, retreated to Maripony as the war reached its zenith.\n\nOn the fateful day that balefire rained from the heavens and blanketed the continent, Twilight and the other researches from MAS performed their final test. Before it could be concluded, Maripony was §Ohit§! directly by a blast, shuttering the facility and knocking Trixie into the vats of §rI.M.P.§!, ending the quest for artificial alicorn life before it began.\n\nHowever, it was not the end of the project, as Twilight believed. Despite her fears, the project had been a success. For days, the §Centity§! spawned in the vats festered and grew, feeding on ponies still trapped in the facility. Eventually, Twilight was left, nearing death from dehydration as the creature broke through the malfunctioning lockdown defenses.\n\nIn an instant, Twilight was saved, brought into the fold of the §CGoddess'§! consciousness. The Goddess, once being the unicorn §CTrixie§!, was now, in Her mind, the §Gsavior§! of the Pony race. The knowledge She gained from the assimilation of §RMAS'§! top scientists providing Her the power to create more artificial alicorns as she saw fit.\n\nMaripony went §Ldark§!, slowly transforming into an extension of the §CGoddess'§! will itself. Anypony who ventured into the foreboding facility vanished without a trace. The only creatures ever seen exiting were alicorns, of various dark hues.\n\nIn the depths of the facility, the Goddess watched the world slowly crawl back from the magical armageddon it had sentenced itself to. The more She observed, the more She realized that the conflicts and strife of the Old World would not end outside of intervention. §YDivine intervention§!.\n\nOver the years, She absorbed more ponies into her consciousness. Those that were not fit to be brought to Her fold, Her §Bunity§!, were instead transformed into mindless alicorn drones to carry out Her will. With each new mind liberated and brought into the fold, the Goddess' §BUnity§! grew more complete, more powerful. Each alicorn could communicate wordlessly between each other and the Goddess, becoming a nigh-unstoppable hivemind of magical power.\n\nNow, nearly two centuries after the §Rdestruction§! of the old Equestria, the §CGoddess§! stands posed to spread the blessing of Her §BUnity§! to all ponies who would willingly accept Her. To reject ascension into the Unity would be foolhardy, as the master race of ponykind is perfectly suited for life in the wasteland of Equestria.\n\nSoon, the Wasteland will be exposed to the beauty, the majesty, of Her race of alicorns, to the next stage of pony evolution. All those that reject Her will be allowed to live in peace, but they will be the §Olast of their kind§!.\n\nThe world of old still has a final trick up its sleeve, and the former magician turned savior will be its §Cperformer§!."
 
FOE_WS_LIT: "§CThe Lightning Scavengers§! - §YAn Experiment in Democracy§!"
FOE_WS_LIT_desc: "Many held little hope for §CCloudsdale§! and the lands surrounding it. The capital of the pegasus race was one of the first targets struck by Zebrican megaspells, being wiped clear out of the sky. Few would have been able to find a place less suited to live in than the blighted lands that the Lightning Scavengers call home. Yet, from the ashes of the Old World, what emerged out of the chaos and destruction of the last two centuries was one of the most vibrant and diverse nations in the Wasteland, as much of the remaining populace held on to their old lands and began a generations-long rebuilding process.\n\nFrom humble beginnings, the Scavengers formed a decentralised tribal confederation that knitted the far-flung villages, various settlements, and the pegasi of §CCloudsdale§! together in the united hope of a day when their old home would be restored. Until then, they found themselves organised into a nation founded upon §Yhope, friendship, and plurality.§! It was a grand experiment in how long such a society could hope to survive in their present form in the bleak darkness of the Wasteland.\n\nHowever, not all is perfect. §RRacial tensions§! continue to rise between the different types of ponies, while the various communities comprising the loose nation §Rdrift ever further apart§!. Their embarrassing defeat in the §CThunder-War§!, during which Featherbrush and his Talons seized much of the Lightning Scavenger's northernmost lands, only further eroded the common ponies faith in their government. As a result, new radical figures and ideas have emerged, promising solutions to all of the nation's problems.\n\nTo make matters worse, the Lightning Scavenger's find themselves surrounded on all sides by enemies. To the south, the slaver-state of §OOld Appleloosa§! grows ever more powerful and ambitious. To the north, §RFeatherbrush§! firmly holds onto his domain. And to the east, rumors stir of the §YShattered Hoof Raiders§! seeking to become something more. On top of all this, strange reports persist of §pa mysterious Stable in the northwest...§!\n\nSurrounded by foes and with their society teetering on the brink of its own destruction, the fate of the Lightning Scavenger's is left uncertain. Will the grand experiment stand the tests of the century? Or will it fail once more, as Equestria had?"
 
FOE_WS_OAP: "[Root.GetNameDef] - The Gate to the Southwest"
FOE_WS_OAP_desc: "§OThe sun burns mercilessly in Old Appleloosa, scorching slave and master alike.§!\nAnd slaves and masters there are many, as Old Appleloosa has chosen to entwine their fortune with not only the slavetrade, but §RRed Eye§! and his Empire as well.\nWhereas other nations had to slowly claw their way out of the poverty of subsistence farming or scavenging, Old Appleloosa was afforded a head start due to its favourable position as the §Ogateway from the Heartlands into the Appleloosan desert.§! As said gateway, they are able to control a vast wealth of traderoutes, as many caravans have to stop to refill their water in Old Appleloosa. Many §rexotic goods§!, §Fpremium weapons§! and, of course, §Rmassive amounts of slaves§! are bought and sold on Old Appleloosan markets, leading the small merchant-class to become §Afamously wealthy.§!\nThough, while they were rich, the wealth was never enough, and so a small group of slaver-merchants around Steel Shackles forcibly §Ctook control of the government§! in order to align with the rising power in Fillydelphia, Red Eye's Slavers.\n\nBut not all is good in this mercantile oasis: The massive §Rtrade-imbalance with Fillydelphia§! has led to a dangerous devaluation of caps in the nation, while Fillydelphian influence §Dthreatens their economic independence§!. Additionally, many of the countries §Gmore educated citizens are leaving for greener pastures§!, as both Red Eye, as well as other powers promise rich rewards for researchers and skilled labourers that join them.\nThe most pressing issue of all would be the internal unrest that has shaken the nation for months now. The old elite, led by Charming Luck, wants to §Ldecouple the nation from Fillydelphia§!, and are taking increasingly aggressive steps to ensure their demands are met.\n§FThe Appleloosan Rangers§!, a prestigious groups of elite soldiers that used to keep the deserts safe, have also withdrawn their support from the government, and rumors abound that that they are §Rgearing for an armed insurrection.§!\nTumultuous times lie before Old Appleloosa, as old powers are returning to the Wasteland and new challengers are rising from the ashes of the apocalypse. Whatever the future might bring, the ponies of Old Appleloosa know that they will play a §rdeciding part§! in it, and their §Cleaders are sure to attempt to get the best deal they can.§!"
 
FOE_WS_NCG: "[Root.GetNameDef] - The Bastion of Corporatism"
FOE_WS_NCG_desc: "To the ponies living within the domain of §DNeocastle§!, there has only ever been the §YGuilds.§! Two centuries ago, these very §YGuilds§! saved thousands of lives from the devastation brought by §Nbalefire§!. It was thanks to their benevolence and efforts that so many ponies can live and work today. However, this protection was not given for free; in exchange for their salvation, those saved agreed to serve the §YGuilds§! in perpetuity. Today, their descendants still labor away in the name of those who they owe their very lives to. In exchange for their hard work, they are provided with all they could ever want: Security, purpose, and pay. Indeed, it is a common saying among the workers that those three things are the components to happiness.\n\nLooking past the propaganda though, one would find that the history of §DNeocastle§! is much murkier than what the current rulers would have their ponies believe. Stories past down from parents to foals for generations tell of a far different government that once ruled over those lands, one providing for common representation. Some also tell of time when there were many §YGuilds§!, though their fate has been lost to time.\n\nToday, only three §YGuilds§! rule over the land. They are, in order of their influence, the §OBuilder's Guild§!, the §GMiner's Guild§!, and the §RMechanicum Guild§!. All three rule together, ensuring that their nation operates efficiently and that the profits continue to roll in. The first of these §YGuilds§!, the §OBuilder's Guild§!, is responsible for the construction and maintenance of all buildings within §DNeocastle§!, along with most of the nation's infrastructure. They are by far the largest of the three §YGuilds§! and employ the most ponies within the nation, making them the most influential and powerful force in the government. It is even rumored that the §tTrade Council§! was established by them for the purpose of further exerting their influence over the nation, though the truth of this claim is unknown to all but the highest ranking §OBuilders.§!\n\nThe second §YGuild§! is the §GMiner's Guild§!. They are responsible for overseeing all operations relating to natural resources, a task which they have adopted a very vague interpretation of. Historically, it is said that they once oversaw vast mines and logging operations. Nowadays, they seem to oversee scavenging operations, water purification facilities, and powerplants more than anything else. Though they still have considerably fewer employees than the §OBuilder's Guild§!, their monopoly over those resources needed for the continued operation of the nation provides them with an immense amount of influence.\n\nThe final §YGuild§! is the §RMechanicum Guild§!. They control many of the nation's more specialized factories, providing the other §YGuilds§! with all sorts of tools and goods that can't be found out in the Wasteland. From electronics to advanced machinery, their products are varied and many. However, their smaller work force and relatively less important purpose has left them as the least influential of the §YGuilds§!. Despite this, they continue to participate in government and take every opportunity available to further their own goals.\n\nAs change beckons across the Wasteland, the §YGuilds§! look on with greed. Where others see hope or suffering, those profit-minded ponies in charge of §DNeocastle§! see nothing but an opportunity to improve their profit margins. Only time will tell if they will sate their endless desire for more wealth or if they will become yet another victim to the brutalities of the Equestrian Wasteland."
 
FOE_WS_CAL: "[Root.GetNameDef] - The Doomed Expedition"
FOE_WS_CAL_desc: "The Canterlot Alicorns began with a single mission in mind: find the Black Book, and save the Unity through bringing it back, so male alicorns can be created. Nightseer, along with a few wings of other alicorns, would fly north from Maripony, until they landed in the ruined capital of old Equestria, Canterlot. Fighting through streets of Pink Cloud, where Canterlot Ghouls wander, they would eventually establish a base of operations in the Royal Palace, where once the past alicorns, Celestia and Luna, roamed. There would be their corpses, with Nightseer deciding to wear the bones of Princess Luna, a stark symbol of the new age.\n\nBut Canterlot takes a toll on everypony within it, even the most loyal of servants to The Goddess, and even the Alicorns, powerful as they might be, still suffer in this hellish place. Only through their natural power and Nightseer's capability have they been able to stay alive, though every passing day means another Alicorn lost, and more sanity along with it. Nightseer will have to lead them through this ruin, to find the Black Book, and establish complete dominance over Canterlot. Only time will tell what happens after that."
 
FOE_WS_MWY: "[Root.GetNameDef] - The Harmonic Kingdom"
FOE_WS_MWY_desc: "The noble families of §rNew Mareway§! are proud to be able to trace their roots all the way back to the Equestria of old. In their eyes, they are the last legitimate claimants to the once great §Yaristocracy§! of Equestria. The truth, is of course not as glamorous as they would like it to be: their ancestors survived by sheer luck. None of the first nobles that settled in §YMareway§! were of any great status; they were minor, courtly families at best, and moderately wealthy commoners at worst.\n\nNonetheless, they would give birth to perhaps the oldest civilized polity in the wasteland. Far from any §Nbalefire bombs§!, the cities of §YMareway§! and §YMaredia§! were left mostly untouched; and those that survived the ensuing radioactive winter came out better than most on the surface. As the dust settled, society coalesced around the nobility who had come to make Mareway their home. Accompanying these nobles was a small contingent of the royal §FCanterlot Guard§!, who would soon come to play a vital role.\n\nPresumed to be the last ranking member, §OLieutenant Nimbus Strongwing§!, a pegasus who ignored the Enclave's recall order out of loyalty to the crown, was elevated to the rank of Captain of the royal guard. Along with his new rank came an ancient tradition, one that had been established in the earliest unicorn kingdom, before even Celestia and Luna: in the absence of a clear line of succession, it fell to the Royal Guard to determine the next monarch of the land. Only a mere five years into the apocalypse, Sir Strongwing would fulfill his duty, naming §DLord North Star§! as the first §YKing of New Mareway§!, and Defender of Harmony.\n\nIn the early years, each successive king or queen of the Star dynasty worked to expand New Mareway bit by bit. The neighboring city of §YMaredia§! was the first to be brought into the fold, and it soon became tradition for a member of the ruling family to hold power there. Next to be added to the kingdom was the rural areas adjoining the two cities, becoming the duchies of the §YGrainlands§! and the §YPeninsula§! respectively. In time, New Mareway would stretch from the Hayseed Swamps south of the Azureway, to the western Hinterlands north of the Ponytomic river.\n\nFor 200 long years New Mareway stood firm, a beacon of stability in the wasteland; but all good things must come to an end. In 1220, in the 16th year of §LQueen Silver Star's§! reign, her sister §RGolden Star§!, the Baroness of Megamart, rose up, attempting to claim the throne for herself. Disillusioned by the corruption and stagnation of the nobility, and upset at the conditions of serfs across the realm, she gathered an army and marched upon the royal palace, §Rexecuting§! Silver Star and proclaiming herself queen.\n\nWhat followed was a brief, but brutal civil war; serf uprisings and Golden Star's supporters killed many nobles, but counter-revolutionary forces coalesced around the long-since ghoulified §OSir Strongwing§!, aiming to depose Golden Star and bring order back to the realm. Strongwing's counter coup was a success, he personally battled Golden Star, although she and much of her forces managed to escape north of the Ponytomic river, into the duchies of Maredia and Belle Grove.\n\n§PStar Gazer§!, Silver Star's only daughter and rightful heir to New Mareway, was crowned Queen at only 14. Under regency, New Mareway stagnated, it's place in the wastes eclipsed by rising powers such as Red Eye, and continuously harassed by the traitorous §RBloody Army§!. Young, optimistic, and a survivor of the horror of Golden Star's coup, Queen Star Gazer has a §Pvision§! for New Mareway, one that will bring it back from the brink, but one that not all may agree with..."

FOE_WS_ERA: "[Root.GetNameDef] - An Army with a State"
FOE_WS_ERA_desc: "By the end of the Great War, the city of §YMaredia§! had largely been subsumed by the larger city §YMareway§!, becoming one of it's most notable suburbs. The Sunrise Highway connected the two with a bridge across the Ponytomic river, and the two cities' futures seemed bright. As with most things, the §NBalefire§! apocalypse snuffed that hope out.\n\nLargely untouched by the bombs, §YMaredia§! and §YMareway§! became somewhat of a haven for those fleeing from harder hit parts of Equestria. Elements of Equestria's noble class soon came to power, declaring the §rKingdom of New Mareway§! under the §DStar Dynasty§!. Portions of Maredia, always being tightly linked to Mareway, were given as the domain of the lesser members of the royal family.\n\nThe last in a long line to hold power within the duchy of Maredia was §FGolden Star§!, once the Baroness of Megamart, now the dreaded warlord known as §RBlood Mane§!. Blood Mane was disillusioned by the corruption and crimes of her fellow nobles, infuriated by the plight of the peasants across the realm, and jealous of her sister: §LQueen Silver Star§!.\n\nBlood Mane gathered an army in secret, marching to the royal palace and §Rexecuted§! Silver Star, crowning herself queen. Unfortunately for Blood Mane: her reign was cut short. The ghoulish captain of the guard, §OSir Strongwing§!, faced her in single combat, giving her the now iconic scar that crosses her face. Forced to flee Mareway, Blood Mane and her surviving army crossed into §YMaredia§!, blowing the bridge that had stood for centuries behind them.\n\nFor 15 years now, Blood Mane has licked her wounds, forming the §RBloody Army§!: a force of raiders, escaped serfs, former knights, and anyone looking for a fight; all united under Blood Mane's force of will. For much of that time, the Bloody Army was content to spend their time raiding and pillaging their neighbors.\n\nEverything changed when §RRed Eye§! swept across the §Yhinterlands§! to the north of the Bloody Army's territory, flipping the balance of power in the Heartlands on its head. In Red Eye, Blood Mane saw an opportunity, a force that could finally help her break out of the cycle of stagnation and conquer New Mareway. On the flip side, Blood Mane now outwardly acts as an agent of Red Eye, ready to kowtow fully once New Mareway is conquered in his name.\n\n§RBlood Mane, though, may have other plans...§!"

FOE_WS_ABT: "[Root.GetNameDef] - The Gateway to the North"
FOE_WS_ABT_desc: "Ah, Portshoof, a place not many would talk about, not many would visit, and that suits the local community just fine. With a southern border filled with hostile Steel Rangers, savage Raiders, and a western border where Empire looks with desire on their lands, Portshoof is a city of isolation. Other than the lovely ponies of Arbu, Portshoof does most of its trading through its namesake, the city of Portshoof.\n\n All citizens in Portshoof have one right that they hold dear, namely, the right to vote for their leader. Mixing together large foreign populations, a lively port city, and a democratic vote has led Portshoof to be one of the only tolerant corners in the Wasteland. Their current leader, Fairweather, is a charismatic zebra renowned for being calm under pressure, a shining lighthouse in the choppy waters of Manehattan.\n\n Yet others come for his position as leader of Portshoof. Longfisher, a pony who shouts in the streets day and night about the need to expand Portshoof, to get rid of the hostile countries around them. Balefire Eye, a newcomer from Fillydelphia, speaks about the riches of slavery that have been brought to Filly, he speaks highly about the Fillydelphian system and wishes to make Portshoof the slave trade capital of the north. Finally, there's whispers of an old Griffon, Gerald Gruffbeak, who wants to be done with the unstable democracy of Portshoof, and replace it with despotic rule. Many wish to claim Portshoof for their own, the only question is, will they see Portshoof to greatness?"

FOE_WS_ARB: "[Root.GetNameDef] - White Picket Jungle"
FOE_WS_ARB_desc: "Hi there stranger! Welcome to Arbu, the friendliest little town this side of Manehattan! Weary from the dusty and hard roads, well, we have plenty of friendly ponies ready to help you out. Hungry from a long day of travel? Arbu's famous radigator kebabs are known across the Wasteland to every hungry soul! What's that? You had a friend who came here when injured? They disappeared? Well, we here are Arbu are sorry for your loss, but the Wasteland takes many of us down. Here, have a kebab, the meat's quite tasty!\n\n Here in Arbu, we like to be safe and free, we vote every so often just to make sure Mayor Sweetwater wins again! Oh sure, the Mayor doesn't look as cutting as a Steel Ranger marching in from the west, and maybe she doesn't have the good fashion of southern Tenpony Tower, but she's the friendliest pony you'll ever meet! Down the street, you'll see some other candidates, like the ever so lively Feast Free, one of the friendliest souls in Manehattan. Feast Free thinks it would be a good idea for our Arbu style friendliness to be spread to all of Manehattan, to have free meat for all, of course, a bit mad, we're in no state to fight a war, but the heart wants what it wants.\n\n Oh, those two over there? That's Thrill Hunt, he used to be a raider, before he retired and decided to help our militia become all the better. Sure, he might have some tendencies that make ponies freaked out, but hey, we all have our own unique personalities! Oh, the old stallion? That's Grandpa Rattle, you'll have to forgive him, he has dementia. If you spend too much time around him, he'll start to talk to you about cannibals, personally, I think he read one too many weird adventuring books in his youth! Anyway, welcome to Arbu, stranger, we hope you enjoy your stay, after all, most ponies who come here never leave!"

FOE_WS_FRI: "[Root.GetNameDef] - Bastion of Metropolism"
FOE_WS_FRI_desc: "For the weary traveler, for the abused, those chased out of their own homes, there's no better place to go than Friendship City. Built around the Pony of Friendship statue, overlooking the eastern coast of Manehattan, Friendship City boasts sturdy walls, a relatively well trained militia, and, unlike their neighbor, Gutterville, they aren't absolutely miserable to live in. Ponies in Friendship City live peacefully under the Council of Friendship, and its head, Black Seas, a pony who won their place off of charm, cuteness, and a boopable snoot, of course. Under Black Seas, and the Council, Friendship City has organized better than most wasteland factions, and even boast rights like freedom of speech, they're even relatively tolerant, keeping a few Dashite Pegasi within the city.\n\n Black Seas wishes for nothing more than improvement, after all, with Gutterville and their horrible quality of life between us and the rest of Manehattan, they're under no threat. Yet Black Seas has competitors, all of whom look oddly like Black Seas, such as Endless Abyss. Endless Abyss claims that the city can become all the richer with just a bit of expansion, Manehattan is ripe for expansion from those who have the will to boop those who oppose Friendship City, after all. Then there's Queen Seas, who might just be Black Seas wearing a crown and robe, who believes that Friendship city shall become an empire like none other, and wishes to bring progress, prosperity, and peace to Manehattan, through force, and through boops. Then there's the last party which is also somehow led by Black Seas, who just really want to defend Friendship City from the outside.\n\n Well, even if every leader is just Black Seas wearing a different outfit, Friendship City still has a hard choice in front of them. To seek prosperity through peace or force, to keep themselves defended at all costs, or to take Manehattan for their own."

FOE_WS_GUT: "[Root.GetNameDef] - Worst Town in the Heartlands"
FOE_WS_GUT_desc: "What bad choice road did you trot down to end up here, stranger? You want to know about Gutterville, you want to know what to do here? I'll give you one word. Leave. Leave as quick as you can, before you get stuck here like the rest of us. You haven't left yet? You really want to stay? Fine, but don't say I didn't warn you. Gutterville is the worst place in the Wasteland without question, we can't do anything without the world kicking us down. Want to go to work? Manticore attack. Want to try and get rich off of scavenging? Spritebots. Maybe you want to become leader over this shithole to try and fix it? Yeah, others have tried, none have succeeded.\n\n Moonshine Surprise rules right now, and probably forever. She used to be charismatic, convinced all the militia to support her, took over due to it. But then being leader of this place got to her, and she started drinking, now half her words are slurred and she hardly even gets up in the morning. Everypony here hates her, but not like we have much choice. Wax Whiskey has tried to replace Moonshine, but where Moonshine is an alcoholic who does nothing, Wax is an alcoholic who does too much. One time they poured olive oil into the machine at a bomb factory, set the whole place ablaze, said they thought oil helped machines. Wax thinks that their ideas will help us, but all it'll do is give us a different flavor of nightmare.\n\n Fine Wine? Yeah, a raider, a raider who sucks so bad at their job that sometimes we just give them some caps out of pity. The other raiders don't respect them, they see Fine as being a failure, and hey, they aren't wrong. If Fine takes over, then we're all raiders, with a boss who doesn't know what end of the shotgun to point at the enemy. The Prohibitionists? They might be loud on the streets, but all of us know that even if they want to get rid of alcohol, they're all drunk out of their minds each and every night. Even if they somehow won, no self respecting soldier would fight for them. You see, right? There's no pony who's going to bring us out of this mess, no hero, no dictator, no drunk. Still sure you want to stay?\n\n I'll be honest, though. Sometimes when I go to sleep at night, hearing the roars of Manticore, and the zaps of robots, I think that we must be the strongest place in the Wasteland. What other group of ponies could live with such torture for so long? A long time ago, I remember hearing that hard times make strong ponies, and strong ponies make easy times. Even if every day we wake up, we think we're going to die, well. . . I still dream. I dream of Manehattan with us leading the way. I dream of legions of steel marching out of Gutterville. I dream of the pricks in the rest of the Wasteland, and I dream of a future where we make them suffer like we do, every day."

FOE_WS_MAR: "[Root.GetNameDef] - Bats in the Big Apple"
FOE_WS_MAR_desc: "Once upon a time, in the magical land of Equestria, we had hope. Ever since Nightmare Moon's war against Celestia, supported by the thestral tribes, us thestrals have been discriminated against. When Celestia rebuilt Equestria, she looked over us, and when the other tribes cried about friendship and harmony, they forgot about us, and left us abandoned and alone. But then came the Great War, when Zebrica fought against Equestria. Beholding the horror of war, Celestia, the great oppressor, stepped down from her throne, and to the joy of every thestral across Equestria, our beloved Luna took the throne.\n\n Yet war distracts even the most noble of hearts, and Luna, a mare out of time, beset from enemies both internal and external, never got the chance to address us, her most loyal followers. Yet still, every noble-hearted thestral flocked together under the banner of Equestria, we marched side by side in the army, we marched day and night into the factories, we, the loyal to Luna, lived good, noble lives, all in hopes of pleasing her. Yet still, day by day, thestrals would disappear, kicked out of factories by ponies afraid of the 'vampire ponies', kidnapped by Ministries for projects they would never speak about, dying day by day in our ancestral jungles, to fight off the striped menace. Even when all the world set against us thestrals, we still held hope.\n\n Then, in a flash, it all disappeared. Luna, our mistress, our beloved Princess, dead in a cloud of pink, our homes lit by naught but Balefire, and ponies, distraught with the death of their home, turned against us. Us! The most loyal, and yet no matter how much we worked, how much we fought, no matter how much we did, the other tribes could never accept us! When the Wasteland took their hearts, raiders would come to take innocent thestrals and to torture them in the worst of ways, while every other settlement turned us away! Tenpony Tower, the Steel Rangers, the 'tolerant' of Portshoof, they turned us away for nothing but the color of our fur and the length of our teeth! We noble-hearted thestrals finally understood, thestrals were never going to be accepted by the other tribes. No, the only hope for us was to seize our new home, Marelem, where all the thestrals of the wartime city were forced to live.\n\n Yet even now, with our home, the other tribes still seek to do wrong us us noble-hearted folk. Suffering from a sudden assault from the Manehattan Raiders, our factories are now used to supply their raids, as we live in fear of full conquest. Yet our noble leader, Chief Moon Guard, promises to us as days pass that we will be safe. Yet whispers pass from mouth to ear, of a different destiny, an ending to our story.\n\n A wise Paladin, they say, shall one day unite the thestrals under her command, Miss Melody, they say, shall be this Paladin, a mare swathed in blessings from Luna. The wise Paladin proclaims that the place of thestrals is not to hide away, or live separate, but to be protectors of the other pony species, from the monsters in the night. A noble and cunning Knight, they say, shall one day lead the thestrals to greatness. Captain Bright Night, a commander unmatched, looks upon the world with memory of the injustices done upon all thestrals, and he claims no more shall this happen. Yet, often forgotten about, the kind Diplomat, it is said, shall lead thestrals into the future not in singular glory, but among others. Friendly Fangs, he who wishes to work with those who rejected us, for the safety of all.\n\n We thestrals all know how our story began, but as the years pass by, as we flip the pages of our story, we all must wonder. What lays at the end of this story?"

FOE_WS_MRA: "[Root.GetNameDef] - Scourge of the City"
FOE_WS_MRA_desc: "When the Great War ended, and Balefire lit up the whole world, it was only the strong, the brutal, the savage who survived, and it is from these savages of the old world that came the Manehattan Raiders. When the first generation of survivors died out, it was clear to all that Manehattan belonged to the raiders, and to nobody else, even the rich pricks in Tenpony would have to admit that. Yet then came the ponies wearing steel, and the speed-obsessed raiders of the west, and revolts by the thestrals and weak ponies all at once, and the raiders collapsed into in-fighting.\n\n All in-fighting ended, however, when the new boss, The Bonecrusher took over, son of the former leader of the Raiders, and where his father struggled to unite the raiders together, The Bonecrusher did it easily, by breaking the skulls of any who stepped up against him. He proved his strength quickly, by extorting the thestrals of Marelem, and taking over Fetlock for the Raiders, yet still, The Bonecrusher is unsatisfied.\n\n Yet despite The Bonecrusher's strength, there are those who are ready to replace him at a moment's notice. The Royal Guards, as they call themselves, led by Hold Hope, fight The Bonecrusher at every turn, trying their best to help settlements rebuild. At the same time, some of the extorted settlers have turned to support a republic to replace the raiders, led by an elusive figure named Mashed Oat. Despite how annoying these two are, The Bonecrusher pays them no mind. After all, the Manehattan Raiders used to own Manehattan, and they're going to own it again. Besides, Manehattan's in the name."

FOE_WS_RAR: "[Root.GetNameDef] - Nomads on the Sunrise Road"
FOE_WS_RAR_desc: "Speed is key!\n\n Come one, come all, to the Rain Rider Rumble! What time is it? All the time! Where is it? Wherever you and your valuables go! Hear that sound in the air, the purr of engines, the ecstatic cries of bloodlust in the raiders, and if you listen close, the cries of those who got caught by us! Once upon a time, we raiders used to ride across the entire Sunrise Highway, but then these things called 'borders' started appearing, and our boss, Hot Rod, got attacked by a chicken from the north!\n\n There ain't nopony in Equestria who knows engines better than a Rain Rider, and ain't no faster raiders in the Wasteland! Under Hot Rod, fastest racer in all of the Wastes, we plan to ride north and kick that turkey Redwing out of Mare Confluence, then, we plan to ride west, to kick in the teeth of those slow-ass Speedfreaks, then, we're gonna ride south into Rustwreck and kick some ghoul ass too!\n\n You may hear of some who ain't raiders, like Quick Accelerate, or Tire Tread, who pretend to be quicker than Hot Rod, but even they know our destiny is to ride Sunrise start to finish!\n\n On your marks, Rain Riders, let me hear them engines roar! Three! Two! One! Race!"

FOE_WS_FER: "[Root.GetNameDef] - Velocity as a Way of Life"
FOE_WS_FER_desc: "Once, a wise philosopher said a simple phrase, holding the truth of the world within it: Gotta Go Fast.\n\n Every pony, from the moment of their birth, wants for only one thing, to feel the wind in their mane and the purr of an engine as they tear their way down a highway. The freedom of the open road, no speed limits, no obstacles, no need for morality, that is what the Speedfreaks hold dear. Whenever their rounded up slaves talk about things like 'voting' or 'freedom of speech', it doesn't make any sense, after all, what freedom is there outside of the car?\n\n Their leader, Aneurysm, has watched as the pretenders of the Rain Riders cut their momentum, and instead of accelerating, they reversed when Redwing came for them. From the first day that Hot Rod put his car in reverse, Aneurysm knew deep down in his heart that it was his destiny to destroy the pretender, to ride the Sunrise Highway from start to finish, with Hot Rod as a screaming hood ornament. His hate of Hot Rod has made certain ponies afraid of him, they think he's dangerous. They're right.\n\n Some in the Speedfreaks don't hold the same hate, like Strongback, a stallion who wants to improve the lives of villagers. Or Mayor Scrap, who thinks he can protect ponies. But they're both fools, stood in the way of Aneurysm from his revenge. The keys to the car are your keys to freedom, after all.\n\n Ready your engines, everypony. The Speedfreaks are coming."

FOE_WS_STT: "[Root.GetNameDef] - The Little Stable That Could"
FOE_WS_STT_desc: "Welcome: New User to: Stable 32, we here at: Stable-Tec, welcome you to your new home. Loading: Overmare Stable Way's Welcoming Message. Loading: Complete\n\n Once, long ago, bombs fell all across Equestria, and ponies, the lucky few, fled into underground bunkers called Stables. While the Wasteland destroyed itself, Stable ponies thrived, until the Wasteland was deemed safe enough for pony repopulation. I, Overmare Stable Way, made the tough decision years ago to reopen the Stable to the outside, to welcome in new members of our community, and discover what happened to Freeside while we were gone. I am glad to say that, beyond a few raiders, the Wasteland community has proven reasonable, and it is with a happy heart that I welcome you, Wastelander, be you a trader, traveler, scholar, or one of our few migrants, to Stable 32, Stajniopolis.\n\n Loading message: Mercenary welcome screen. By: Overmare Stable Way.\n\n Hello there, mercenary, I'm sure you're wondering why a Stable would hire you. Heh, of course, the Stable needs to put on a nice front as being welcoming, but we all know here that the time will come when 'Destruction' reigns. Our neighbors, well, they're hardly even ponies, a bunch of ponies who quite literally play in the mud and call it civilization, and on the other side a bunch of half-high raiders riding around in battered and broken cars. Soon, though, with your help, Stable 32 will retake Freeside, as we always should have, putting an end to this sick joke that you wasteland folk call 'civilization'.\n\n Loading message: Doctor Phial.\n\n Is this thing on? Ah, yes, it is, I've had to sneak this message into our welcoming system, you see, under the guise of routine maintenance. If you're reading this, you need to know this, Overmare Stable Way is a mad-mare, she may pretend she's kind and peaceful, but I know, deep in her heart, that if the military ever took over, she'd lead them to destroy the Wasteland. You must listen carefully, there will come a time when we will be able to take over. For a new, a new vision of the wasteland, yes, I am, so you could say, a Visionary. I don't want to destroy the Wasteland, instead, I want to help you, so please, when the time comes, help me.\n\n Loading message: Trailblazer's Campaign.\n\n Greetings new pony to Stajniopolis, my name is Trailblazer, and I'm glad to see you! Even here in the waiting area, you can see that our Stable is something special, something that's worth protecting, and that's what I plan to do. My name is Trailblazer, which, hehe, I already said, but I'm running for Overmare soon! Our Stable deserves a firm hoof to protect it, but it doesn't need to stamp down on those within, instead, we need to give every pony, and, heh, and non-pony of course, the ability to choose their own leader! I do hope you'll come find me, I'm on the second level down, western side of the Stable, and I'm always looking for help in my campaign!\n\n Loading message: Error, no more messages to load. Stable-Tec wishes to extend you a warm welcome. Welcome to: Stable 32, we here at Stable-Tec hope you have a nice stay."

FOE_WS_MUD: "[Root.GetNameDef] - Not as Bad as it Sounds"
FOE_WS_MUD_desc: "Do you like mud? You must, if you decided to come here. What's in Mudburg? Well, it's in the name, mud, and the town of Mudburg, home of some scrap metal, some water, and a whole lot of dirty ponies. Mayor Muddy Puddle has ruled for a while, but he's not anything special, he's just an earth pony who's uniform was fancy enough that he got elected. Even if he doesn't wash that uniform, ever, and even if his glasses are so dirty that you can't see his eyes. Some ponies say he smells like a ghoul.\n\n Filthy Mane exists too, second most popular politician in Mudburg, who's renowned for, can you believe it, having a dirty mane. They go around the community and help out, they're nice, but nothing special. Just don't confuse them for Blood Mane down south, they get really angry if you do that. We also have a small raider gang in the town, led by Cunt Horsefucker, which, yes, is his actual name, his mom just hated him. He's nobody special, only unique thing about him is his name, but he's in Mudburg, the land of the not-special. Then there's Dirty Rain, the worse version of the Mayor, not much else to say.\n\n Well, if you want to stay in Mudburg, then that's your choice. We don't have any great history. No heroes, no claims on other lands, and we're mostly just a sitting duck in a muddy puddle for whatever faction is desperate enough to take us over. Enjoy your stay."

FOE_WS_WNF: "[Root.GetNameDef] - Exiles of the Foal Mountains"
FOE_WS_WNF_desc: "A tribe split in half, Winsome has recently had conflict against the Foal Valley Tribe, conflict that went poorly for Winsome. Instead of a grand victory, Winsome was pushed back, losing Western and Southern Winsome to the Foal Valley Tribe, and while the West and South might not be as valuable as North and East, which they still hold onto, the loss of this land has lit a spark inside Winsome.\n\n Dark Cloud is a cunning, clever, rather young, yet very dangerous war chief, having replaced the last war chief after a sudden sickness claimed his life. Indeed, all who have rose against Dark Cloud have found themselves similarly suddenly sick, until finally ponies got the memo to not go against him. Now, instead, the tribe follows him gladly as he schemes a plan, to retake their lands and humiliate the Foal Valley. First, they will strike east, aligning themselves with the Stable nation there, splitting apart the weak lands of Mudburg, the Speedfreaks, and the Mob. With all this land, the Foal Valley shall fall with no issues, and once all of the mountains have been taken, Dark Cloud will be undisputed master of Winsome.\n\n Yet others are not satisfied, The Council, they call themselves, a group of representatives that nobody knows, who demand reconquest now. They want to unify the mountains under a single republic, though many in the tribe don't believe their promises. Truly, it seems like only time will tell, but one thing is for sure. Winsome will be a great power, or it will not be a power at all."

FOE_WS_FTR: "[Root.GetNameDef] - Vanguard of the Mountain"
FOE_WS_FTR_desc: "Once, a long time ago, a group of foals was on a field trip in the Foal Mountains, exploring the mountains and learning survival skills by their teachers, and the ever helpful park rangers. Until one day, all the rangers left the foals and the teachers in the mountains, called back to their headquarters to the west for an emergency. We did not know what the emergency was, until we watched as green fire consumed the skies, and the world we all knew was consumed in Balefire. In a green flash, suddenly, the childhood of all the foals was over, and they were thrust right into adulthood, with only teachers to protect them.\n\n The field trip groups would all gather together, along with a group of miners working at H.M.I Mines, the adults agreeing to work together for the benefit of the children. They claimed the southern valley, where they could hunt and grow what little food they could muster, while the foals hid in the mountains, kept safe from harm. And for a generation, all was well, as Foal Valley and Foal Mountains worked as one.\n\n Yet, kept safe from the horrors of the Wasteland, the new generation of foals born, believing themselves greater than the adults who still clung to the 'old world', would kick out all ponies older than eighteen, and proclaim the tribe of Foaltopia. Thus came a schism, as adults went south, and when they had children, they would send them north, into the safe mountains.\n\n As the sun rises upon this tribe, we remain led under Burnt Aspen, she who has led for a decade, a mare careful, wise, and caring for all those beneath her. Yet the time nears for a tribal council to be held, and many others wish to rule the tribe. Most popular is Candle Light, a mare who calls not just for unification with Foaltopia, but for a unification of the Foal Mountains as a whole. Yet another, Rusty Shank, has taken inspiration by the tales of marauding bandits to the east, believing that the only way for the Foal Valley to find strength is to turn to savage raiding and barbarism. Finally is Dead Earth, a pessimist who fought in a previous war against the Winsome Tribe. Now, he believes the fate of the tribe is eventually to be destroyed, casting his eyes south, to the fabled land of Fillydelphia, with fear.\n\n Only one thing is for sure in this land. If we are to survive, if we are to thrive, then it's time for parents and children to stand side-by-side in the world once more. It's time for Foal Valley and Foaltopia to become one."

FOE_WS_FTP: "[Root.GetNameDef] - Child Soldiers Ahoi!"
FOE_WS_FTP_desc: "Once, a long time ago, a group of foals was on a field trip in the Foal Mountains, exploring the mountains and learning survival skills by their teachers, and the ever helpful park rangers. Until one day, all the rangers left the foals and the teachers in the mountains, called back to their headquarters to the west for an emergency. We did not know what the emergency was, until we watched as green fire consumed the skies, and the world we all knew was consumed in Balefire. In a green flash, suddenly, the childhood of all the foals was over, and they were thrust right into adulthood, with only teachers to protect them.\n\n The field trip groups would all gather together, along with a group of miners working at H.M.I Mines, the adults agreeing to work together for the benefit of the children. They claimed the southern valley, where they could hunt and grow what little food they could muster, while the foals hid in the mountains, kept safe from harm. And for a generation, all was well, as Foal Valley and Foal Mountains worked as one.\n\n Yet, kept safe from the horrors of the Wasteland, the new generation of foals born, believing themselves greater than the adults who still clung to the 'old world', would kick out all ponies older than eighteen, and proclaim the tribe of Foaltopia. Thus came a schism, as adults went south, and when they had children, they would send them north, into the safe mountains.\n\n And Foaltopia has prospered under the hooves of the young, where every idea shall be tried at least once, and where vegetables are never on the menu! Even though us foals hate politics, though, Mayor Lamp Light, being a real stick-in-the-mud, has said there's going to be an election anyway. Lamp Light is, of course, a really boring foal, always talking serious about stuff, but he has seen us through a lot of crises while being calm. Then there's Wet Mud, a foal who's able to read old books, which has gained him a lot of popularity. Most of the books he reads are written by stallions of steel, marks of caramel, and other weird mungo names. He talks about liberation, freedom, and he likes to use really fancy words while doing so. The other foals don't understand most of it, other than free ice cream, no bedtime, and a crusade to liberate the world. Littlehoof doesn't agree with that at all, instead, he fashions himself like an old world emperor, and he proclaims every day to anyone who will listen about how they should go and take from the adults for the benefit of foals! Finally is Pretty Pasture, a self-styled Princess who wants nothing more than every single thing in the world.\n\n Even though every foal might disagree on the way forward, it is clear in the minds of all that there is only one first step. The adults of the south shall come to protect the foals again, and from there, Foaltopia shall become great!"

FOE_WS_CCD: "[Root.GetNameDef] - Dogs of the Mountain"
FOE_WS_CCD_desc: "Mountains have always been the natural home of a Diamond Dog, surrounded by nothing but stone, and gems, there is no greater comfort to us. When the Great War began, Equestria needed to secure the Crystal Caverns, a mountain filled with hidden passages and crystals, which, if followed, could lead one directly into Canterlot itself. Not to mention the need for crystals, to power robots, energy weapons, and to sell all across the world, before long we became one of the top producers of crystals in the world.\n\n When the bombs fell, not much changed, and even still, not much does. None dare to come from the ruins of Canterlot, and to the east lay the foals of Foaltopia. Good to get some pets from, every so often, but good for little else. No, the Crystal Caverns remain a haven for dogs, where dogs can live free, and dig to their heart's content.\n\n Jim, our leader, has keep a steady paw, keeping things safe, prosperous, stable. Yet even the most stable regimes have dissent eventually. Some call for Jim to have a greater vision of the world, to use our peace to rebuild what we can, but they remain unpopular. Then is Hans Gudboi, an average miner who has spent all his life calling for a democracy, where every dog can live free lives. Finally is Ziggy XI, a mine overseer who wants to make our mines more efficient, by enslaving those around us and forcing them to mine.\n\n Despite their dissent, though, Jim remains in charge for now, and for the foreseeable future, nothing is set to change."

FOE_WS_SCI: "[Root.GetNameDef] - City of Ghouls"
FOE_WS_SCI_desc: "Canterlot, capital of Equestria, and greatest city in the world, built over the course of centuries, was destroyed in but a day. We still remember the Last Day, when the sirens went off, and a sickly pink cloud set down upon us. We, the common citizen of Canterlot, fled to our Stable, Stable 1. We learned the hard way that the Stable was supposed to be an eternal punishment, locking us away with the Princesses, and the rich, those who caused the war.\n\n And yet the rich never showed up, and we thought our punishment was gone. But it had only just begun. Slowly, Pink Cloud and radiation began to seep into our Stable, killing many and sparing few. Some fled, never to be heard from again, others died screaming, some went quietly. The rest of us, though, we weren't so lucky to die. Instead, we watched as our fur slowly started to fall off, as our voices went raspy, and as the centuries past, we learned our eternal punishment had come, to be trapped in a body, forever rotting, never able to die.\n\n Yet things were peaceful for a while, until the arrival of mutants, Alicorns. They flew in and gave us no chance, attacking us and forcing us away from the north side of the city, led by a mare as dark as night, savage and brutal beyond all compare. But we are Canterlot ghouls, and we don't die easy. Soon, the Alicorns will come for us, under Nightseer's monstrous command, and with that invasion, we shall secure our future.\n\n Our Overmare, Emerald Vale, awaits the future, but she is of many minds. Part of her wishes to rebuild the old world, another part wishes to hide back away in our mountain city. And yet, deep in her mind, she can feel a voice growling like a feral beast. Rid this world of smoothfurs, and long may Canterlot reign."

FOE_WS_STA: "[Root.GetNameDef] - Sealed For Centuries"
FOE_WS_STA_desc: "Stable 2 TODO welcome screen loc"

FOE_WS_GLY: "[Root.GetNameDef] - Striped Enclave"
FOE_WS_GLY_desc: "Have you ever been hated? Not just disliked, no, not just derided because of your actions or your beliefs. Have you ever been hated, just because of the color of your fur? It seems silly, that something like that could lead to such hate, but in Glyphmark, every zebra knows that their stripes are just target-marks for every pony in the wasteland.\n\n From our earliest days, us zebras have been betrayed. Forced into the slums called 'Zebratown' by a racist Princess, hated day and night by our fellow citizens, and when the world ended, its rumored that Celestia held up her shield around Canterlot purposefully long enough to lure us into a false sense of security, before sending the Pink Cloud down onto us.\n\n The rest of our history? It doesn't really matter, does it? How many tales of hate, death, and racism does one need to tell before their stripes are justified? How long must we live in tortured existence before the ponies stop shooting us? Never, never enough, all because of our stripes. Xephyr, our leader, rules peacefully, not that there is much to rule over, the pessimism and defeatism of all zebras carrying all the way up to her. Even Grandpa Rattle, the only other good leader, wants nothing more than power.\n\n Yet some of us envision something else. Some still hold hope, and they call for Xephyr to listen, to lead our armies into Canterlot and take the city for our own. From there, we can proclaim safety in the capital of the ponies, and maybe then, maybe, we'll have proven our worth. Yet others wish to take up arms, as a New Zebrican Legion. The ponies have proven time and time again that they'll never see us as anything but monsters. They want monsters? Then we'll give it to them, one bullet at a time."

FOE_WS_SPV: "[Root.GetNameDef] - Basically Deathclaws with Guns"
FOE_WS_SPV_desc: "Once, in a time long ago, Diamond Dogs had a home in Equus. An area of mines, rich in gems and crystals, where we could freely dig, and live happy lives. Then, came the ponies. The Equestrian government needed our home, and they did not ask nicely for us to leave, no, they forced us out by gunpoint, on pain of death. They defiled our home, and called it a name reviled by all Diamond Dogs, Maripony, where abominations live.\n\n We are a society left now, two hundred years later, with nothing. Ponies encroach on our borders, with ideas of freedom and republic, while the monsters of Maripony get all the more bold. Raiders attack Whitetail and steal away the pups and dogs they can, cooking them over fires, visible all the way from the valley. We are beset from all sides, and we know, soon shall come Unity, soon shall come Ponyville, soon shall come the hardest days of the Wasteland.\n\n Laika is a bitch who has led us through bad times, yet her lack of response to our surroundings has led to her having no popularity, and with approaching elections, it is clear to all she will lose. Fluffykins is her most popular opposition, who will take supreme power, and lock the country down, making the country an immovable object, a rock in the storm. Lassie, the second most popular leader, upholds a different ideal, that we Diamond Dogs shall see justice done, that Maripony will be ours once more.\n\n Longclaw, however, holds no such ideals of justice, only revenge. He howls, no more ponies pushing us back, no more suffering, no more setbacks, and many listen. But in the end, the fate of dogs is left unknown, and either our darkest, or our brightest, days are ahead."

FOE_WS_RWK: "[Root.GetNameDef] - The Fading Admiralty"
FOE_WS_RWK_desc: "Two hundred years ago, the Celestial Sea Fleet, under command of Admiral High Tides, set out on its last journey. In the cold northern waters they fought, against a massive Zebrican invasion force. At the moment of their triumph against the stripes, though, all went wrong, for from the mainland came flashes of bright green light, as the Balefire Bombs hit all across Equestria. The Pegasi of air command, instead of assisting their navy comrades, pulled away from the battle, leaving them high and dry against the stripes, as they retreated above the clouds like cowards.\n\n Admiral High Tides led the damaged fleet to the nearest friendly port, the city that would come to be called Rustwreck. The journey back to friendly territory was treacherous, many ships were lost, and many sailors. It was on this journey that High Tides became a ghoul, when a young mare fell into the radioactive ocean, he dived in to save her, sealing his fate as a ghoul. Two hundred years ago, the Celestial Sea Fleet landed in Rustwreck, and quickly they began to settle down, military law ruling the wild, chaotic land, keeping the legacy of the navy alive.\n\n Two hundred years have passed, and High Tides is starting to get old. He rambles about psychos, hippies, freaks and pinkos to his fellow Admirals and Captains, and it seems to many that his time is approaching. A sub-sect of the Admiralty follow High Tides' protege, Wavebreaker, an intelligent stallion well respected by the Admirals, who has always held merit above all else. Outside of the capital, though, the majority of the country is left neglected and ignored, their resources, population, and industry not being captured like the capital. One pony seeks to fix this, Doctor Kelp, a doctor from Manehattan with her personal organization, the Sunrise Development Council, wishing to spread prosperity across the country. It’s in these ignored provinces that desperation has taken over. The Endtide, a religious cult led by Crimson Waters, lead charities and paramilitary groups all throughout the hinterlands, spreading their message and their faith. Despite being a cult, the Endtide has been seen as rather reasonable, working alongside the government whenever they could.\n\n Rustwreck is a land on the precipice of change, all can tell that. Rustwreck is a land of tragedy, losing the battles of the past, losing the majority of their navy, losing the best of the best. In the past, glory has been tried to be grasped, but always has been lost. Like when High Tides sent an expedition to Griffonia, to try and make contact with any survivors. He sent a massive ship, led by Commodore Journey Perrylous, an expert at sailing troubled waters, but despite the hope for Griffon aid and trade, the ship never returned. It’s clear that the fate of Rustwreck, while aided by the waves, is a surface endeavor. As High Tides ages, and his mind slips, more ponies begin to question who will be next. The analytic Wavebreaker, the charismatic Crimson Waters, or maybe even the pragmatic Doctor Kelp. Only time will tell if our destiny is a high tide, or a low tide."

FOE_WS_REP: "[Root.GetNameDef] - Bastion of Democracy"
FOE_WS_REP_desc: "When the Balefire bombs fell two centuries ago, other ponies decided to languish in their destruction, becoming disgusting tribals, savage raiders, or giving themselves up to ideologies of slavery, indecency, and horrible things. While the Wasteland destroys itself, there is one shining beacon in the world, a new society building upon the ash of the old world, The Republic, a place where every pony has a vote, every pony has a say, and where society is kept safe from moral impurities. Freedom comes with a price, after all.\n\n No moral impurity, no distractions from what needs to be done. Every pony shall remain sober, away from the poison of chems. Every pony will remain righteous, away from the poison of sexual immorality. Every pony will remain free, that they can choose their local leaders, and together, we may build a society better than the past. These are the promises that President Wide Savage makes, a president who wants very little other than to focus on the interior, and to protect it from the outside. But democracy comes at a price, and others can be elected in his place.\n\n The Council, a collection of the most wealthy ponies in The Republic, have long chipped away at the democratic process, and today they are closer than ever to taking over. Wanting nothing more than maximum profit, they will turn the Republic from a democracy, to an oligarchy. Dry Spell falls into a similar category, though instead of building up, he wishes to expand outwards. With support from the military, he wishes to march, and bring riches back home. Then, there is Loud Speak, a popular pony amongst the common pony, who wishes to lead the Republic into greatness. Some say only by falling under him, could we truly spread our democracy, and create. . . An Eternal Republic."

FOE_WS_EVR: "[Root.GetNameDef] - True Rulers of the Everfree"
FOE_WS_EVR_desc: "Once, long ago, the Diamond Dogs of Equestria were forced out of Maripony. Many of them stayed, but of those who left, many of them decided to take their chances in the Everfree Forest, a place so dark, that no pony would ever come to push them out of their home again. The dogs, in such a dangerous place, reverted back to a tribal type of society, made all the worse when Balefire consumed the lands. They ruled the forest alone for years, until, deep in the Everfree, opened Stable 101.\n\n Fire, and the shooting of guns, that is the 'gift' that Stable 101 gave to the Everfree, as the dogs were once more pushed away from their homelands, by the one called Red Eye, He of 101. He, with his slavers and his raiders, pushed us south, securing all but the southwest of the Everfree Forest for his own. We fled, and we awaited his return, but he never came to claim what remained, instead, he seems to be waiting, waiting to destroy us. Barking Saw, newest Chief of the tribe, is afraid of the enemy of 101, she wishes to remain still, and wait for him to die on his own. One of our most popular elders, Old Red, agrees with her, believing an iron paw is needed to protect what remains.\n\n Yet not all are happy with this turn of events. Rex, a hopeful young dog, wishes to rectify the sins of the past, to reclaim the Everfree, and make a home not only for all Dogs, but for all who have lost their homes. Then there is Scoobert J. Doo, a Dog who was driven savage by the war against Red Eye, and wishes to use his own tactics against him. Raiding, destroying, pillaging, all for the benefit of Dogs.\n\n No matter the leader, we sit awaiting, in our dark home, knowing what's to come. Lead us, and let loose the dogs of war."

FOE_WS_GOR: "[Root.GetNameDef] - Safe in the Lair of the Beast"
FOE_WS_GOR_desc: "Ghastly Gorge, before the war, was seen as place that was rather, well, ghastly, not a place for a normal pony to roam. Quarry Eels come from their sleep every so often, sharp teeth and giant heads biting at whatever happens to roam too close to them, usually to deadly effect. Such a dangerous place, before the war, was seen as a place to not go. But when Balefire consumed the world, the eels went from a danger, to being a protector. And thus was Gorge Town founded, deep within Ghastly Gorge, and there it has stayed, away from risk, as the eels scare off any who might cause trouble.\n\n Yet our peace is not to be long lived, as tensions in our little corner of the world are heating up. Far to the west, the Lightning Scavengers are electing their new leader, with many fearing we might be a target of expansion for them. To the east, Red Eye has taken over Fillydelphia, seeking all of Equestria in his grasp. To our south, there are rumors in Shattered Hoof, of a play for power by Gawd, the Talon potentially posing quite the threat. Closer to home lay Featherbrush's Talons and the Dust Reavers, both of which look hungrily at our little town, both of which pose threats.\n\n Quarray, our leader, rules with a firm, yet fair, hoof, not allowing democracy, like the Republic to the east, yet prioritizing safety and prosperity. Deep Hole, a rather popular figure, believes that by taking over, he could create even greater prosperity, with little focus on anything else. Yet there exist some raiders, following Eel Wrangler, a pony who successfully managed to tame an eel, and in doing so, impressed a group of ponies so much that they immediately joined him. Firm Stead, on the other hand, is a pony that has prioritized helping those in need..."

FOE_WS_BOG: "[Root.GetNameDef] - Darkness Bubbles Beneath the Swamp"
FOE_WS_BOG_desc: "'What rests in the bogs, papa?', 'Death, little one. And darkness unmatched.'\n\n Never trust a stallion who builds his home in a swamp, so goes an old world saying. No foundation shall ever be secure, when the ground is mud, and no foal is safe, when the bog hungers for them. Yet in the Wasteland, ponies have to make a choice, to suffer being away from the bog, or to be safe, within the suffering of the bog. None come to Froggy Bottom Bog, afraid of the mire and muck, even if the ponies within are welcoming.\n\n Old Hop, eldest stallion in the bog has seen many decades pass, as raids from the west, and business ponies from the east alike try to take the bogs for themselves. But the bog claims all who come, giving him complete control over it all. For now. Croaker, a village chief, leads a collection of chiefs, wishing to replace the autocratic powers of Hop by a council of chiefs, while still remaining safe in the bog. Green Belly is a normal pony, not a chief, who wants nothing more than to help make lives better, to try and prevent the bog from swallowing another victim.\n\n Yet in the darkness, he lurks. A stallion with blood on his breath, and death in his mind. Toadstool, He of Shadow. Not many trust him, but should he somehow take over, the world itself may tremble. For the bog is more than just a dark place, it is a dark idea. Try and run, try and hide, the bog shall consume you all the same. And leave Desolation in its wake."

FOE_WS_PBN: "[Root.GetNameDef] - Dust, Rust and Lottsa Bullets"
FOE_WS_PBN_desc: "Plainstown was built up after the war by a bunch of ponies who thought they would be safe. Dust storms kick up over the entire country, dangerous to those who don't know how to deal with them, but to those who knew, it was just a way to stay safe. Thus the ponies in this region built a nice government, a nice place, thinking they were safe. At least, that's until I, Buckshot, came in and showed them how wrong they were!\n\n I, the most mighty raider in all the west, gathered together a cohort, a gang larger and more unified than any other! For I would go to the raider clans, and any who opposed me, I would tie them to a stake, and light it up, then force the remaining raiders of that gang to feed on the flesh. Unsightly? Yeah. But what isn't nowadays? Its effective, and with that, I was able to take over, and burn to death the previous 'mayor' of the plains. Now, even though gangs might not listen to me as much as they should, and even if the dust makes stuff annoying, I'm leader of a mighty place.\n\n Yet a secretary of the old mayor, Scar Hide, has decided to oppose me! He's popular, too, leading all the ponies of the towns together, trying to oppose me at every step I take, all so he can take over instead. But he doesn't matter, not like he could take me down, unless something real bad was gonna happen! Then there's Fair Sight, a stallion with a gun who plays sheriff around the towns, getting quite the following due to it, and no, he's not related to Farsight in Old Appleloosa. At least I don't think so. He's a bit weird, and even if he's liked, not like he can do anything!\n\n I am a conqueror, I am unmatched in this area. And I look around me, and all I see is weakness. Talons exhausted from a war against pegasi, ponies hiding in their gorge, thinking they're safe, Appleloosa ripe for the taking! It's time I show the gangs who I am again, time to show these ponies that I, Buckshot, am not to be fucked with! I'm gonna burn it all down, and from the ashes, I'll build a land of dust!"

FOE_WS_GUN: "[Root.GetNameDef] - Welcome to the Family!"
FOE_WS_GUN_desc: "How ya doing, boss? Welcome to the greatest little state here in these Equestrian wastelands. We pride ourselves on conducting good business for all the right prices and all the reasonable ponies left in this shithole of a world. The best kind of business is one that attracts crowds and addresses the worst vices the world has ever known. From drinks to chems, to those beautiful mares and sharpest suits, we’re the family that brings everything and anything to the table. The big boss, All Capony, has been running things for years, keeping the rackets running and those fat caps rolling. He’s a real go-getter, helping bring in all our new pals into a real model of a family. Sure, sometimes a pony’s got to get wacked or some poor shopkeep forgets to pay their proper tax, but what’s life without a little crime? I’ll tell ya it’s a boring one! \n\n But life in the syndicate, it ain’t no walk in the park. All Capony, he’s a people person, you know. Trying to make something out of a whole lot of nothing. From the April Grove to the lands of Light, and even those northern Fresian fucks, everyone pays their proper tribute to the boss of bosses. Not everything is as it looks, though, cause way down south, a damned storm is brewing. That red-eyed fuck has been eying our boss’s lands for a while now, like the damn bastard he is.\n\n Plus, the boss’s close cronies are surely plotting something. The damned Billard Board is trying to cause a real racket in town by talking about how it’s time we went big and cleaned all the houses out. Sure as hell hope that bastard remembers who’s the real boss here. Then there’s Booze Blues, always drunk out of his damned head, spouting some crap about a vision where the mobster’s paradise happens. Then lastly, the old Swing Beat is too lazy to do anything at all, and says that we’re only good for trying to keep living. Talk about a damned killer of fun. But the boss ain’t gonna go down without a rain of bullets and a glass of the best drinks in these wastes. Because once we’re in the family, we’re in it for life! And no pony, griffon, or anyone is going to break our syndicate!"

FOE_WS_HSW: "[Root.GetNameDef] - Home Of Bayou Hospitality"
FOE_WS_HSW_desc: "The Hayseed swamp has been one big happy family, far back as Mage Meadowbrook wandered these here lands. Ain't no strife among families 'round these parts, least, there weren't. After that big war two hundred years ago, Hayseed did what we always do, we stuck t'gether. Course, there weren't no challenges, we struggled, same as other folks, food, sickness, radiation, t'ain't much, though, when ya stick together. For two hundred years the Hayseeders lived, a series of chiefs, made of big ol'Hayseed families from 'fore the war, chose the Head Chief, who kept us all together. It worked, ponies were happy, healthy, much as can be expected.\n\n That all changed when the 'Prophet' rose to power. Leaf On The Wind, stallion who weren't gonna be anything special, but folks say he's got a silver serpent's tongue. He spread his lies among the young of the swamps, Discord's cursed words slithering past his teeth, an' when the time came t'elect a new Head Chief, he broke away. Ran for it, 'course, but he didn't win, and seein' that, he used his followers, took the southern swamps for his own, killed the chief who were gonna be elected. Now n'the chaos, Dusk Fog, respectable folk, took the charge.\n\n Dusk Fog's a calm stallion, who wants nothing but to end this uncivil war, and restore how things were. He ain't a Head Chief yet, just taken' emergency powers, given by the Chiefs. Says he's gonna lead us to bring the swamps back together. But a concord is gonna be called soon, and others are vying for the top. Moonlight Waves is an elder Chief, ran a fishing town called Moonlit Citadel, safe place, ain't got no beasts or backtalkers. He's an older folk's dream, calm, decisive, with an iron hood, ready t'crush Leaf's skull. Black Mist, meanwhile, he comes from the Home of the Brave, a mighty mare of muscle and action. They say she got 'er name by tearing apart a gator with 'er bare hooves, reducing it to nothin' but a black mist. She sees the communities around us, the 'civil' folk, and says we ain't gotta be so civil. Hayseed cares for their own, once we've taken care of Leaf, we c'n take from the outside. Their food, their fancy guns, all the amethysts of Mareway. She ain't too popular among the chiefs, but she could always get her way in. Finally there's Deep Marsh, quiet stallion, spent his time fighting the Liberation Army, and learning the civil ways of our northern Radigator Coast kin. He thinks once Leaf's dealt with, we can build a better society, tight knit. We can prevent another Myriad from ever coming again. He ain't too popular either, but his ideas do sway some of the young'ins.\n\n No matter who strides the swamps, though, one thing's clear. The Bayou's heating up, and the drums of war echo through the mire. It's time for Hayseed to reunite."

FOE_WS_HSC: "[Root.GetNameDef] - The Cultivators of Plenty"
FOE_WS_HSC_desc: "And the world spoke, voice booming through the quiet bayou: 'Reclaim, sons of Myriad.'\n\n Once, the Hayseed was filled with heretics through and through, heathens obsessed with naught but their own profit. Verily, for even the Prophet, Leaf on the Wind, lived through this time, watching as the Chiefs of the swamps took for their own desires. One night, when he came to sickness, the Chief turned him away, not risking his own flock, to save the life of one member. The Prophet turned to the bayou, and on the cusp of death, he spoke to it, begging for a chance. Then, moments from passing, the heavens opened up, as the warm sun shone down upon him, and the voice of the world spoke, echoing from on high. It commanded him to divide the swamps, to defeat the heathens, to spread far and wide, and reclaim the world once lost. The Prophet heard it, and he knew it was good.\n\n The faithful rallied quickly, the young, those with naught to lose, those who had witnessed the corruption of the elders, the chiefs, who sought change. Leaf has brought them change, for in a single moment, he slit the throat of the High Chief, and declared to all Myriad's truth. The righteous followed, and now all the world is split asunder, as the greedy fight for themselves, and the righteous fight for the future. The Prophet leads greater than any leader, and with his righteous heart, we shall never need to surrender.\n\n The war drums echo from the heathens, as the hearts beat of the faithful, ready to march into battle. Brother and sister, mother and father, grab their weapons, grab their clubs, for with faith on their side, never shall the children of Myriad lose!"

FOE_WS_HIT: "[Root.GetNameDef] - The Empire of Hills"
FOE_WS_HIT_desc: "Once upon a time, in the magical land of Equestria, the Foal Mountains were not home to petty tribals and mutated monsters, no, once, a long time ago, the mountains were explored day and night by foals on field trips, hikers, sightseeing tourists, nature lovers, or miners. The mountains, however, were dangerous to the unprepared pony, and thus Celestia decreed the creation of the Royal Mountain Rangers, park rangers for the mountains, who could help any ponies in trouble. The Royal Mountain Rangers (RMR) had a small HQ called High Hill, from which they served and protected every pony who was in danger in the Foal Mountains.\n\nWhen the Last Day happened, and Balefire rained down upon Equestria, the Royal Mountain Rangers, seeing the horror that had befallen those outside the mountains, drew back in on themselves. Shortly, High Hill would become Fort Highhill as the RMR fortified. Slowly, the RMR became more tribal, living off of the rough mountain terrain, using their survival skills to forge a life in the new world. It is from the RMR that the Hill Trotters came to be, for eighty years after the Last Day, the Rangers claimed the surrounding hills. It is for this that they named themselves, for all hills belonged to them.\n\nThe first Overtyrant of the Hill Trotters was called Molehill, who used the expertise of the Rangers to train more ponies to become special forces, the early version of the Sealgairean Beinne. Made to protect the tribe from others, their training was near unmatched. Molehill had a son at an old age, Overhill, who he physically and verbally abused, until passing away, well over a century in age. The second Overtyrant, Overhill, then took over. A competent pony, yet one who is very narcissistic, he brags about himself to anyone who will listen, in desperate search for praise. Overtyrant Overhill is a simple stallion, he wants nothing more than to make someone else proud of him, like his father never was. Shortly ago, from the southern land of New Mareway, came a mare who claimed to be a sorceress, Inky Lotus. She was a minor noble in New Mareway who received an above average magical education, before she was forced to flee her home by Blood Mane’s seizure of the north of New Mareway. Inky Lotus, tired of the other useless nobles of New Mareway, headed north, searching for a stallion who would do her every bidding. She's a mare who wants someone to command, and Overhill is a stallion who just wants praise, they were a match made in paradise.\n\n Inky Lotus, with her magical education, has rid the Hill Trotters of any opposition, and whispers to Overhill tales of glory, of empires long past, of Grovers and of Celestia, of gold, riches, and fame. She's told him tales of pride in conquest, and Overhill eats it all up. Now, the Hill Trotters prepare, for Overhill believes that he is to rule the world, with Inky Lotus at his side."

FOE_WS_GRV: "[Root.GetNameDef] - The Moonlit Valley"
FOE_WS_GRV_desc: "Green Valley was, once upon a time, the location of a rather large set of wind turbines, which provided electricity to much of central Equestria. Called the Midnight Wind-Park, they provided a safe place to generate needed energy for the war-effort, away from Stripe sabotage. Due to being such an important part of the country's energy supply, Luna personally lent her voice to a voice-over system tied to a terminal, which was to be used to spread propaganda about staying safe, about working for Harmony, and about beating back the Stripes.\n\nAll was well, until the Last Day came upon Equestria. When the Balefire bombs fell, the owners of the wind-park fled immediately, leaving behind workers and their confused families, with no guidance. Sickness from the Balefire radiation spread like wildfire through hastily constructed encampments, as ponies starved for days, with no hope in sight.\n\nThen arrived Sun-Above-Clouds, in the dead of the night. A stallion with eyes the color of Balefire, glowing constantly behind a plague doctor's white mask, wearing a hat and long, black cloak that covered his entire body from view. He spoke to the afraid masses, and from them he stole sickness, injury, and fear, taking them into himself. Then, with one word, he told them to follow, and they followed, all the way to the small town of Green Valley. There, Sun-Above-Clouds rose crops from the dead earth, and offered meat to the hungry ponies. He was quickly named the first, and only, chief of Green Valley. Two centuries have passed, and even as those around him have died, Sun-Above-Clouds has survived, and led the ponies of Green Valley. He founded the religion centered around the Midnight Wind-Park, worshipping the Luna voiceovers, which would speak of safety, peace, and prosperity, believing them to be communication from Luna herself. Yet Sun-Above-Clouds was not satisfied with his following, and over the years, he and the Foal Valley Tribe have clashed, trading land with each other. He would also clash against those to the south, before they were taken over by Red Eye.\n\nGreen Valley exists nowadays on the precipice, after two centuries of rule by Sun-Above-Clouds, with nobody questioning why he lived so long. Yet some do question. Spark, the brilliant inventor, was called to help fix an issue in the Midnight Wind-Park, where she discovered a terminal, to control the voice of the goddess. She's repaired the speakers and plans to use the terminal, to make herself the new Chief. But should she fail, Sun-Above-Clouds will hear the loud voice of the goddess in his head, and will lead the grand crusade in Luna's name."

