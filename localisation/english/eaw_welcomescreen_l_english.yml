 EAW_WS_TAB_3_TXT_HEADER_1: "New racial technologies and units"
 EAW_WS_TAB_3_TXT_HEADER_2: "Society & Research Development"
 EAW_WS_TAB_3_TXT_HEADER_3: "Megaspells"
 EAW_WS_TAB_3_TXT_HEADER_4: "Operation Paperclip - post-war research bonuses"
 EAW_WS_TAB_3_TXT_HEADER_5: "Various AI improvements"
 EAW_WS_TAB_3_TXT_HEADER_6: "Game Rules"
 EAW_WS_TAB_3_TXT_HEADER_7: "Dynamic Leader Generation"

EAW_WS_TAB_3_TXT: "\n\n£bb_text  §YBalefire Blues§! expands upon §YEquestria at War's§! racial technology system with two new races: Pegasi and Alicorns, accessible by Enclave Nations and the Unity respectively. Due to Pegasi being split from Earth Ponies and Unicorns, the Pony tech tree has been changed and expanded to reflect this. Due to the inherent cultural overlap found in most nations of the wasteland, racial units are not necessarily locked to only a single race, for example, §YRed Eye's Slavers§! has the ability to research both Talon Mercs (the Griffon racial unit) and Unicorn Companies (the Pony racial unit). \n\nBB uses a mix of OWB resources and EaW's £resources_strip|7  §YCrystals§! resource. §YCrystals§! are used in constructing advanced magical equipment such as §YPulse Energy Weapons§!, §YEnclave Raptors§!, and §YAlicorn Equipment§!.\n\n\n\nBalefire Blues merges OWB's three levels of technology §Y(Tribal, Civilized, and Advanced)§! with EaW's §YDevelopment§! system. The three levels of §YScientific Development§! found in the §YCultural Policies§! section of the political menu correspond with each level of tech, while giving their own secondary effects. Balefire Blues introduces our own type of §YDevelopment§!, ranging from Old World Society to Raider Society to Tribal Society. Certain nations or levels of Development may restrict diplomatic options, such as §YStable 2§! and their §YLocked Stable Society§!, which completely cuts them off from the outside world until they open their impenetrable door.\n\nTwo types of Development, §YRaider Society§! and §YSlaver Society§!, unlock a dynamic §YRaiding System§! adapted from EaW, which allows you to raid your neighbors for various effects, including capturing £slave_text  slaves.\n\n\n\nReplacing the traditional nuclear warfare system are various \"§YMegaspells§!\"; powerful magics that can unleash devastating or useful effects upon a battlefield. The Megaspell Menu can be found in the topbar under the 'Miscellaneous Tabs' button (to the right of the Logistics tab).\n\n-§GBalefire Bombs§! are a stand in for traditional nuclear bombs, a zebra design that uses necromatic magic in the place of radioactive material. Balefire Bombs are activated in the same way as Nukes, although they do not require air superiority to be triggered.\n-§PHealing Spells§! are currently the only positive megaspell in Balefire Blues, and can be used to give significant bonuses to your army for a short period of time. They can be activated by a leader ability, or if you aren't using the Waking the Tiger DLC, via a button in the Megaspell Menu.\n-§YCelestia One§! functions similarly to Balefire Bombs, but is a reuseable and renewable source of destruction. Celestia One is currently only useable by Tenpony Tower, through a new menu found in the state tab once the megaspell has been unlocked.\n\n\n\nAfter a country has been defeated in a war, and a peace conference has ended, the victors will have a chance to receive §Yone-time 50% research speed bonuses§! to §Ytechnologies§! that the loser had researched, and the victor has not.\n\nThe chance to receive the bonus is random, and calculated per technology. The more of loser's §YIndustry§! that has been taken over by the victor (either by puppeting or annexation), the higher the chance to receive a bonus, which means that not every victor will have an equal chance. The level of §YDevelopment§! of the victor is also a factor - the worse the Development, the smaller the chance.\n\n\n\nAn effort was made to improve the AI. While it is by no means perfect, and most of the real improvements can only be implemented by Paradox, we have done our best to tweak AI's behaviors, and improve AI's handling of Division Templates. AI will use all of the added units and technologies. AI will intelligently choose Doctrines based on the bonuses they receive in their Focus Tree. AI will use dynamic strategies to respond to events and changes on the world stage. Peace Conference AI has been improved, though it is not perfect.\n\n\n\nSince 1.6 Ironclad update, new Game Rules for various countries and game setups have been added, to allow the player to customize their £bb_text  §YEquestria at War§! experience.\n\n\n\n£bb_text  §YBalefire Blues§! adapts EaW's dynamic system of general, admiral and, for players with the La Resistance DLC, operative generation. Various nations will generate different leaders of different races or backgrounds depending on their circumstances. For example, §Y[EYE.GetNameWithFlag]§! can generate regular wastelanders, raiders, and griffon generals, all of which use different namelists. This does not carry any gameplay changes outside of leader traits."
