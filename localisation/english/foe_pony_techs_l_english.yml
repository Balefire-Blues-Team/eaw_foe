l_english:
 ### Pony Techs
 TITLE_PONY_UNICORN_MAGIC_SUBTITLE:0 "UNICORN MAGIC"
 tech_pony_uni_misc:0 "Advanced Telekinesis"
 tech_pony_uni_misc_desc:0 "While every unicorn can use telekinesis, not every unicorn can use it to manipulate fine objects or carry many things at once. By starting widespread training programs to help our unicorns master this talent, we could increase their capabilities substantially."
 tech_pony_uni_misc2:0 "Matrix Repair"
 tech_pony_uni_misc2_desc:0 "Most spell matrices around today were made during the Great War. Needless to say, many of them have seen better days. By training specialists in the repair of these intricate arcane constructs, we should be able to restore and utilize many wartime technologies that were only good for scrapping before."
 tech_pony_uni_misc3:0 "Weapon Enchantment Talismans"
 tech_pony_uni_misc3_desc:0 "During the Great War, Equestria and Zebrica alike experimented with using enchantments to enhance their weaponry. Recoil elimination, ammunition enhancement, and increased durability were just a few of the many applications seen over the course of the War. By rediscovering how to cast these enchantments, we could similarly enhance our own weaponry."
 tech_pony_uni_misc4:0 "Magically Augmented Defense"
 tech_pony_uni_misc4_desc:0 "We could take our experiments into enchanting a step further by using this field to improve our own armour. Through the miracles of magic, we could allow our soldiers to carry three times their body weight as if it were nothing, or make them unnaturally resistant to hazards such as fire or acid."
 tech_pony_uni_misc5:0 "Rad Removal Spells"
 tech_pony_uni_misc5_desc:0 "Radiation is an ever-present threat in the Wasteland. Though precautions may be taken to limit exposure, and medicine may be used to purge it from ones system, we often don't know we're exposed to it before it's too late, and Rad-Away is rare. By developing spells that can be used to at least partially purge radiation, we could deal with surprise exposure far more effectively and reduce our reliance on wartime medication."
 #more unicorn magic
 tech_pony_magical_infantry:0 "Defense Enchantments"
 tech_pony_magical_infantry_desc:0 "Many special forces in pony nations would utilize equipment enchanted to withstand more punishment than normal equipment. These enchantments were quite expensive, however, as they needed to be repeatedly reapplied."
 tech_pony_magical_infantry2:0 "Basic Magic Education"
 tech_pony_magical_infantry2_desc:0 "Special forces in pony nations were often given a basic understanding of magic and of spells, even if they weren't unicorns. For the unicorns among them, this would allow for greater use of spells, and for the others, it would allow for better reactions to enemy unicorns."
 tech_pony_magical_infantry3:0 "Magical Communications"
 tech_pony_magical_infantry3_desc:0 "Via use of enchantments, such as a repeatable Sending spell sewn into special forces' uniforms, special forces were often able to better communicate with each other over great distances."
 tech_pony_magical_infantry4:0 "Teleportation Circles"
 tech_pony_magical_infantry4_desc:0 "High level magic for most unicorns, teleportation circles allowed for a permanent link between a circle and a destination. These would often be used for special forces, to allow for quick resupplying, and to allow them to teleport behind enemy lines."
 tech_pony_magical_infantry5:0 "Integrated Cure Wounds"
 tech_pony_magical_infantry5_desc:0 "By enchanting special forces equipment to automatically cast Cure Wounds when the one wearing it was hurt, many special forces were able to take hits and keep on fighting."
 #stronger unicorn magic
 tech_pony_unicorns:0 "Mold Earth"
 tech_pony_unicorns_desc:0 "A common spell that allowed for unicorns to move a large amount of earth at a quick speed. These spells were often combined with shovels to quickly create trenches near the front lines."
 tech_pony_unicorns2:0 "Spellbooks"
 tech_pony_unicorns2_desc:0 "These spell books would be mass produced by unicorns and distributed across the country to other unicorns. They would contain the knowledge on how to cast most basic spells, ensuring consistent magical talent across the armed forces."
 tech_pony_unicorns3:0 "Magic Kindergarten"
 tech_pony_unicorns3_desc:0 "Though this place was feared by Ministry Mare Twilight Sparkle, Magic Kindergarten was quite effective for many unicorns. It was a year long course given to young unicorn foals, or to adults who didn't know how to use magic, teaching the basics of how to use spells."
 tech_pony_unicorns4:0 "Ray Of Frost"
 tech_pony_unicorns4_desc:0 "A common spell that shot a beam of frost. It wasn't ever as effective as a fire bolt at killing enemies, but it could be used from further away, and slow down any who it actually hit."
 tech_pony_unicorns5:0 "Mass Healing Word"
 tech_pony_unicorns5_desc:0 "A spell taught to most unicorns in Magical Kindergarten, Mass Healing Word allowed for multiple ponies to be healed slightly in the midst of battle. It was highly effective in ambush scenarios, or when enemies used demolitions equipment."
 #unicorn support company
 tech_unicorn:0 "Unicorn Magic"
 tech_unicorn_desc:0 "As all ponies know, Unicorns are able to channel their natural magic into effects that are called spells. These spells were often used to great effect across all of Equestria's history, and in the Wasteland as well."
 tech_unicorn_th:0 "Catapult"
 tech_unicorn_th_desc:0 "A basic and easy to learn spell for most unicorns, Catapult was able to grab small objects ranging from one to five pounds, and propel them at great speeds. This was most often used with firebombs or grenades, though many unicorns also carried around sharp flecks of metal to use the spell on."
 tech_unicorn_th2:0 "Spare The Dying"
 tech_unicorn_th2_desc:0 "A relatively basic spell for unicorns to learn, Spare the Dying is able to be used on any creature which is not currently dead, but is fatally injured. It can seal their wounds and give them enough time to get to healing supplies. This spell was used to great effect in combination with field medics."
 tech_unicorn_th3:0 "Scrying"
 tech_unicorn_th3_desc:0 "Though a more advanced spell than many unicorns could cast, Scrying was able to be put into magical balls made of crystals. These magical balls would allow for any unicorn to use the orb to view enemy movements."
 tech_unicorn_th4:0 "Haste"
 tech_unicorn_th4_desc:0 "A unicorn spell that, while not high level, required concentration on the ones it was cast on. This spell massively increased any chosen creature's movement speed, reaction time, and made their actions much faster. With a few good casts of Haste, divisions would act much quicker."
 tech_unicorn_th5:0 "Magic Missile"
 tech_unicorn_th5_desc:0 "One of the most basic spells in a unicorn's spell kit, Magic Missile fires out anywhere from three to twelve missiles. While individually, these missiles had little effect, they were enough to supplement both offensive and defensive actions, especially since they always hit their target."
 tech_unicorn_ms:0 "Shield"
 tech_unicorn_ms_desc:0 "Able to be cast as a reaction by most unicorns, these shields would provide them protection from most small projectiles. Shield was only able to be used to protect the caster most times, and wouldn't often be used to support others."
 tech_unicorn_ms2:0 "Fire Bolt"
 tech_unicorn_ms2_desc:0 "A common spell used offensively by most unicorns, Fire Bolt found itself quite useful against armored targets. It's magical heat was able to easily weaken enemy armor, and allow for attacks to punch right through."
 tech_unicorn_ms3:0 "Eldritch Blast"
 tech_unicorn_ms3_desc:0 "A darker kind of magic not used by many unicorns, Eldritch Blast sent out rays of force to hit against enemies. This spell was put to great effect by many battlemages as a good spell to fall back onto when needed."
 tech_unicorn_ms4:0 "Crown Of Stars"
 tech_unicorn_ms4_desc:0 "A very rare spell for unicorns to cast, Crown of Stars creates multiple glowing projectiles that rotate around the caster's head, and can be sent flying towards enemies, exploding on impact. This spell was often used to blind incoming attackers, and was highly effective against air vehicles, operating similar to flak cannons."
 tech_unicorn_ms5:0 "Maddening Darkness"
 tech_unicorn_ms5_desc:0 "A spell said to be originally created by King Sombra, Maddening Darkness is a cloud of unbreakable darkness. Within the cloud, hallucinations would be heard which would drive those within insane. This spell proved highly effective in softening up enemy target for attack."


 #earth ponies
 TITLE_PONY_EP_SUBTITLE:0 "EARTH PONIES"
 tech_pony_misc:0 "Earth Pony Agriculture"
 tech_pony_misc_desc:0 "Since the very first wandering pony tribes, earth ponies have been the most proficient in growing and cultivating agricultural areas. Modern machinery and crop cultures would drastically increase our food surplus."
 tech_pony_misc2:0 "Earth Pony Sappers"
 tech_pony_misc2_desc:0 "Owing to their latent connection to the soil, earth ponies are able to dig trenches and build fortifications much faster than other ponies."
 tech_pony_misc3:0 "Earth Pony Industry"
 tech_pony_misc3_desc:0 "WIP"
 tech_pony_misc4:0 "Earth Pony Robotics"
 tech_pony_misc4_desc:0 "WIP"
 tech_pony_misc5:0 "Earth Pony Mining"
 tech_pony_misc5_desc:0 "More earth ponies working in the mines means more resources extracted."
 tech_pony_misc6:0 "Earth Pony Medicine"
 tech_pony_misc6_desc:0 "Earth ponies are able to grow all kinds of plants, many of which have potential medical applications"
 tech_pony_misc_a2:0 "Raise This Barn"
 tech_pony_misc_a2_desc:0 "Where pegasi have cloud structures and unicorns have magic to trivialise construction, earth ponies have had to make do with physical labour, each other, and a good sense of materials. There's no denying that earth ponies are incredibly apt at building strong, sturdy structures at such speeds that put even some unicorns and pegasi to shame. We don't need the comfort of pegasi cloud buildings or the aesthetically complex unicorn edifices, but the reliable, quickly-built blocks and structures of the earth ponies."