#Pony Cohort

#Generals
Zorealis_name: "§RZorealis§!"
Zorealis_DESC: "§R\"I dont give a damn about what you think. I will do as want. The Manehattan will be mine.\"§! \n\n§RZorealis§! was born in the outskirts of St Petershoof, with his twin brother §4Zustralis§!.\nIn a way he is an unremarkable and average Legionary, he has the ability to fight and take over foes, he can lead men and organize warbands like any other Centurion. But his ambition ever since he got the idea to take the Manehattan has been unmatched, he will stop at nothing, before he takes over the Manehattan or dies trying.\n\n§YArt by:§! RedSkeleton"
ZOC_ZOREALIS_ARMY_DESC: "§YName§!: Zorealis 'Boney' Ossum\n§YRank§!: Charger Centurion\n§YOrigin§!: 21th Legion\n§YBackground§!: During the seizure of St Petershoof, one zebra rose to the occasion, the one who would become known as the Bone Charger. After Zenus VIII outlawed slavery and spoke of stupid ideals of 'Purity', he rejected such declaration and joined the coalition forces as an rebel, and not long after, claimed the skull of his previous commander, seizing the rank for himself and led his own rebellious troops against the regime of Zenus.\nAfter the exile of his legion of Origin, he has wandered across the City, always willing to give a hand to those who want to restore the rightful way of things, as slavery was a zebrican right.\n\n§YArt by:§! RedSkeleton"

zustralis_name: "§4Zustralis§!"
Australis_DESC: "\"I will give you the chance of living. Smile and submit to the Legion or I will nail you on a cross.\"\n\n§O§4Australis§! is the younger brother of §RBorealis§!, only know by them as §RBorealis§! was the one born minutes before him. A very smiling and seemingly happy man compared to his brother, he is pragmatic and smart, a perfect co-ruler for his older brother. But dont be fooled about his friendly apperance, he is as dangerous as the other twin.§!\n\n§YArt by:§! Lusa"
ZOC_ZUSTRALIS_ARMY_DESC: "§YName§!: Zustralis Ossum\n§YRank§!: Frumentarius Centurion\n§YOrigin§!: 21th Legion\n§YBackground§!: WIP\n\n§YArt by:§! RedSkeleton"

zorby_name: "Zorby"
ZOC_ZORBYLYS_army_chief_desc: "Our logistical network is stretched thin, we need...\"\n\n§OZorby Rufus was a genius, though perhaps not in the conventional sense, his brilliance was unparalleled among the Quartermasters of the Legion. With his striking red hair and unassuming demeanor, this Centurion was known for his remarkable ability to source supplies from seemingly nonexistent places. His skills went beyond mere resourcefulness; he could conjure food, ammunition, and other essential items seemingly out of thin air, provided he was allowed the freedom to operate according to his own methods.\n\nHis uncanny knack for finding and providing what the Legion needed, often under the most challenging circumstances, set him apart from his peers. He could turn a dire situation into one of abundance, all thanks to his innovative and unconventional approaches.§!§R\n\nTo change this advisor, bribe or kill them!§!\n\n§YArt by:§! RedSkeleton"
ZOC_ZORBY_ARMY_DESC: "§YName§!: Zorby Rufus\n§YRank§!: Procuror Centurion\n§YOrigin§!: Xersessi\n§YBackground§!: WIP\n\n§YArt by:§! RedSkeleton"

zisaias_name: "Zisaias"
ZOC_ZISAIAS_high_command_desc: "\"Come here, do twenty push ups!\"\n\n§OZisaias the Younger is a demanding and formidable teacher, known for his rigorous and unyielding methods. Despite his youthful appearance, marked by his striking golden hair, he stood out as a tough and relentless drill instructor. His keen eye allowed him to distinguish a promising candidate from a mere slave with nothing more than a sharp glance. His ability to discern potential and raw talent was unmatched, making him a pivotal figure in the training of Legionaries.\n\nHowever, there were whispers among the ranks that Zisaias's piercing gaze could serve purposes beyond just evaluating combat readiness. Some claimed that the same eyes that could assess and judge potential with such precision might also harbor other, less transparent intentions. This added an air of intrigue to his character, as his seemingly objective demeanor belied the complexity of his true nature.§!§R\n\nTo change this advisor, bribe or kill them!§!\n\n§YArt by:§! RedSkeleton"
ZOC_ZISAIAS_ARMY_DESC: "§YName§!: Zisaias 'The Younger'\n§YRank§!: Instructor Centurion\n§YOrigin§!: Xersessi\n§YBackground§!: WIP\n\n§YArt by:§! RedSkeleton"

zaltus_name: "Zaltus"
ZOC_ZALTUS_army_chief_desc: "\"Give me Cause.\"\n\n§OZaltus of Red Sun is a remarkable Centurion, embodying a rare blend of intellectual acumen and formidable martial prowess. His mind is a masterful amalgamation of strategic brilliance and combat skill, making him a standout figure in the ranks. Yet, despite his impressive capabilities and notable achievements, Zaltus is driven by a somewhat enigmatic motivation, his ambition seems to be rooted merely in the desire to 'keep living,' lacking a deeper, more defined purpose.\n\nSaltus's rise is a testament to his unique blend of talent and the impact of his strategic decisions. While his personal ambitions may appear unconventional, his effectiveness as a leader and warrior is undeniable.§!\n\n§YArt by:§! RedSkeleton"
ZOC_ZALTUS_cul_advisor_desc: "\"Give me Cause.\"\n\n§OZaltus of Red Sun is a remarkable Centurion, embodying a rare blend of intellectual acumen and formidable martial prowess. His mind is a masterful amalgamation of strategic brilliance and combat skill, making him a standout figure in the ranks. And he only has one friend in the wasteland, §4Zustralis§! having been standing at his side since they fought in the conquests of Red Sun City and the Lambda Tribe.§!\n\n§YArt by:§! RedSkeleton"
ZOC_ZALTUS_ARMY_DESC: "§YName§!: Zaltus 'Salt'\n§YRank§!: Centurion\n§YOrigin§!: The Shamanate\n§YBackground§!: WIP\n\n§YArt by:§! RedSkeleton"

zefectum_name: "Zefectum"
ZOC_ZEFECTUM_high_command_desc: "\"True to Caesar.\"\n\n§OZefectum had been a part of the Legion for as long as it has existed, essentially from the moment it was born. Almost his entire life had been spent under the command of Caesar, serving with unwavering dedication from a young age. Although he never achieved the rank of Praetorian, for reasons that remain shrouded in mystery, his competence as a commander is beyond question.\n\nZefectum's career is marked by his relentless adherence to duty and his exemplary performance as a commander. His experience and loyalty to Caesar make him a respected figure among his peers, and his role in the Cohort remains pivotal. He embodies the spirit of the Legion in both action and philosophy, upholding its traditions and contributing to its enduring strength.§!§R\n\nIt seems he cannot be bribed... unless...?§!\n\n§YArt by:§! RedSkeleton"
ZOC_ZEFECTUM_ARMY_DESC: "§YName§!: Zefectum Certus\n§YRank§!: Praetorian Centurion\n§YOrigin§!: 21th Legion\n§YBackground§!: WIP\n\n§YArt by:§! RedSkeleton"

zeridanus_name: "Zeridanus"
ZOC_ZERIDANUS_theorist_desc: "\"There are few sweetest things in life, battle, food and honor are among them.\"\n\n§OZeridanus has been a constant presence in the lives of the Twins since their early years. From the moment they were young, he took them under his wing, imparting his knowledge of combat and discipline to them. As they grew, his guidance played a crucial role in shaping their abilities and character.\n\nNow, in the twilight of his years, Zeridanus has undergone a significant transformation. Once known for his strength and vigor, he has gained weight and his movements have become slower and more deliberate. The battles and rigorous training of his youth have given way to a more sedentary lifestyle, marked by indulgence in feasts and treats. The once formidable warrior now finds pleasure in the comforts of his later years rather than the rigors of the battlefield.\n\nDespite these changes, Zeridanus remains the most experienced Centurion of the Cohort, at least theoretically. His vast knowledge and extensive experience are invaluable, and his strategic insights continue to be a significant asset to the Legion. Although his physical prowess may have diminished, his legacy of leadership and expertise endures, and he is still revered for the wisdom and guidance he provides to the younger generations of the Legion.§!\n\n§YArt by:§! RedSkeleton"
ZOC_ZERIDANUS_cul_advisor_desc: "\"There are few sweetest things in life, battle, food and honor are among them.\"\n\n§OZeridanus has been a constant presence in the lives of the Twins since their early years. From the moment they were young, he took them under his wing, imparting his knowledge of combat and discipline to them. As they grew, his guidance played a crucial role in shaping their abilities and character.\n\nNow, in the twilight of his years, Zeridanus has undergone a significant transformation. Once known for his strength and vigor, he has gained weight and his movements have become slower and more deliberate. The battles and rigorous training of his youth have given way to a more sedentary lifestyle, marked by indulgence in feasts and treats. The once formidable warrior now finds pleasure in the comforts of his later years rather than the rigors of the battlefield.\n\nDespite these changes, Zeridanus remains the most experienced Centurion of the Cohort, at least theoretically. His vast knowledge and extensive experience are invaluable, and his strategic insights continue to be a significant asset to the Legion. Although his physical prowess may have diminished, his legacy of leadership and expertise endures, and he is still revered for the wisdom and guidance he provides to the younger generations of the Legion.§!\n\n§YArt by:§! RedSkeleton"
ZOC_ZERIDANUS_ARMY_DESC: "§YName§!: Zeridanus 'Uncle'\n§YRank§!: Orator Centurion\n§YOrigin§!: 14th Legion\n§YBackground§!: WIP\n\n§YArt by:§! RedSkeleton"

zarcissus_name: "Zarcissus"

#Ideas
ZOC_legionary_training_idea: "Legionary Training"
ZOC_legionary_training_idea_desc: "Our soldiers are all professionals, trained in the ways of the old Legions of the Zebrican Empire. While this makes them a formidable force on the battlefield, it also means we have to be selective with who we recruit, as only the fittest are elligible. Additionally, our training is much longer and extensive, especially by wasteland standards."

ZOC_zebra_caesar_idea: "Memories of the Fallen Caesar"
ZOC_zebra_caesar_idea_desc: "Even though the once mighty Roaman Empire is nothing but squabbling Legions, fighting over dust, we all still remember our Caesar. Even though he died long ago, his memory has lasted into the ages, never to be replaced. He binds us together, for he is our Caesar, and we are his Legions."

ZOC_army_without_a_state: "A Barely Equipped Expedition"
ZOC_army_without_a_state_desc: "A warband, a group of Legionaries without a Legion, without supplies in a foreign land, every zebra should be a warrior and those who are not, are menial slaves. There is no time nor space for industry..."

