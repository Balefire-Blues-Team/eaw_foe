l_english:

##################
### FOCUS TREE ###
##################

NVR_opening_focus:0 "The third revolution"
NVR_opening_focus_desc:0 "The first revolution ended when Luna's forces marched north. The second ended in Balefire and Megaspells, as the Last Day closed over the land. Third time's the charm."

NVR_against_shadows_and_royalists:0 "Royalists and Shadows"
NVR_against_shadows_and_royalists_desc:0 "Those on the south side of the river still follow disgusting, outdated ideologies. Old soldiers, serving a dead monarchy, and the shadows of a new world religion, an overdosing opium of the masses, stand as our greatest threat."

NVR_help_from_far_and_wide:0 "Help from far and wide"
NVR_help_from_far_and_wide_desc:0 "Our friends back home in the Sladkiy Collective wish to see the Third Revolution succeed. We need their support, now more than ever."

NVR_seizing_the_heart:0 "Seizing the heart"
NVR_seizing_the_heart_desc:0 "Raiders, the degenerate reminder of the Last Day, and zebras, once allies, now enemies, hold lands on the north side of the river. We must make a grand push to remove them."

NVR_revive_stotemsk_foundry:0 "Revive Stotemsk foundries"
NVR_revive_stotemsk_foundry_desc:0 "The AI that controlled this city has deactivated much, but in the interest of the Third Revolution, we must see these factories reactivated. Smoke and smog will be the forebearers of liberation."

NVR_prepare_jzemroc_offensive:0 "Prepare the Jzemroc-offensive"
NVR_prepare_jzemroc_offensive_desc:0 "The Disciples border is not fully clear, only known by the sound of gunfire exchanged between both our sides. But if we wish to take their land, we must identify where they are weakest."

NVR_approach_new_stalliongrad:0 "Approach New Stalliongrad"
NVR_approach_new_stalliongrad_desc:0 "New Stalliongrad claims to represent the Revolution, like we do. While some may question how genuine their commitment is, the fact remains that they pose a great boon as potential comrades."

NVR_promote_new_officers:0 "Promote new Officers"
NVR_promote_new_officers_desc:0 "Not many in our fledgling nation know how to fight, or how to lead a fight. If the Revolution is to succeed, it must be led by the competent leadership that it deserves."

NVR_ideological_deserters:0 "Ideological Deserters"
NVR_ideological_deserters_desc:0 "Our enemies on the north side are raiders, easy to convince by the promise of prosperity, and zebras, who hold many sympathies from our old alliance. We might be able to appeal to one side or another."

NVR_clear_streets_prep:0 "Clear streets for the Assault"
NVR_clear_streets_prep_desc:0 "The path east, against our enemies, is blocked by many abandoned vehicles, which impede our progress and our development. We must first clear the roads, if we are to keep a stable supply chain."

NVR_overclocked_production:0 "Overclocked Production"
NVR_overclocked_production_desc:0 "The factories of this city were controlled by an AI who was too concerned on if they would work in a hundred years, rather than the needs of today. We need these factories today, so we will activate them, at maximum efficiency."

NVR_places_for_families:0 "Settle the families"
NVR_places_for_families_desc:0 "Many of our soldiers have families that they left behind, unknowing if the city would be able to support their existence. Yet with the amount of food left behind, many have decided to invite their families to come join the Revolution."

NVR_mountains_of_brass:0 "Mountains of Brass"
NVR_mountains_of_brass_desc:0 "Nothing is more important in warfare than shooting as many bullets in the general direction of the enemy as possible. We will become the best at using this philosophy."

NVR_push_for_southside:0 "Push for Southside"
NVR_push_for_southside_desc:0 "The preparations have been made, the south is ready for conquest, ready for liberation, ready for the Revolution. We march to bring it to them."

NVR_reclaim_palace:0 "Reclaim the Palace of the Soviets"
NVR_reclaim_palace_desc:0 "The Palace of the Soviets has been occupied by an AI, a willing slave of capital. This mockery of the First Revolution cannot be allowed to stay. We will take the Palace, for the Revolution."

NVR_paint_town_red:0 "Paint the town §RRed§!"
NVR_paint_town_red_desc:0 "The north, filled with raiders and zebra forces, sits, ready to be retaken. We will liberate the ponies of the north from foreign occupation and from wasteland style madness."

NVR_turn_metro_guns:0 "Gun-workshops in the Metro"
NVR_turn_metro_guns_desc:0 "The metro underneath the city serves as a perfect place to store our weapons manufacturing. Well protected, hard to see by enemies, and with an in-built supply chain, they will serve as wonderful manufacturing hubs."

NVR_one_last_push:0 "One last push"
NVR_one_last_push_desc:0 "We need more factories, and we need them quicker than ever. We need weapons, we need medicine, we need all they can produce. Come, one last push, one last industrial step forward, and the Revolution shall be ready!"

NVR_open_to_all:0 "Refuge in Socialism"
NVR_open_to_all_desc:0 "There is no discrimination against all the workers of the world, after all, all that divides us are the false borders and false consciousnesses that are assigned to us. We must welcome all who will aid the Revolution."

NVR_assaulting_the_bridge:0 "Guardians of Marksism"
NVR_assaulting_the_bridge_desc:0 "A large group of volunteers have gathered together, bringing weapons from outside of the city, ready to fight for the liberation. We welcome these fighters, they shall be our Guardians of Marksism."

NVR_use_robots_factories:0 "Robots in the factories"
NVR_use_robots_factories_desc:0 "Automation is not something to fear under communism and socialism, as the state will ensure all can live, and all will have productivity, even outside of factories. Let us not fear our robot comrades, but instead, welcome them."

NVR_have_ai_work:0 "The Peoples' AI"
NVR_have_ai_work_desc:0 "This city was filled with AI systems, calculating the best ways to oppress the locals in ways they called Peacekeeping. It would be wasteful to trash these systems, robots do not choose their programming, after all. We need merely make it act in the interest of the Revolution."

NVR_home_sweet_home:0 "Home, sweet home"
NVR_home_sweet_home_desc:0 "The Palace of the Soviets has been reclaimed, and it shall be ours, forevermore. Come raider, come zebra, come imperialist galore, we will hold strong, we will not be defeated once more."

NVR_enlighten_the_redeemable:0 "Educate the prisoners in Socialism"
NVR_enlighten_the_redeemable_desc:0 "Many have a misunderstanding of socialism, they believe it to be a flawed ideology of ideals, rather than a scientific theory applied to reality. We will talk to those we have captured, and educate them on the truth of dialectical materialism."

NVR_reaping_the_rewards:0 "Reap the rewards"
NVR_reaping_the_rewards_desc:0 "The city under our control grows ever larger, under the principles of socialism. This is merely the first step to a bright, red future."

NVR_push_industrial_advantage:0 "Push our industrial advantage"
NVR_push_industrial_advantage_desc:0 "Socialism, at its core, is an industrial, scientific ideology, one that is proven to be more effective than any other system. It is time that we unleash socialism in its proper, true form."

NVR_velvet_glove:0 "The velvet glove"
NVR_velvet_glove_desc:0 "Socialism is not a system of the elite, like many other ideologies, it is a scientific theory of reality, one that will benefit all who live under it. We need not strike back against those who resisted us, rather, we must show them the truth."

NVR_iron_hoof:0 "The iron hoof"
NVR_iron_hoof_desc:0 "Stalliongrad fell because it was too kind to those who resisted it. Those who they captured happily betrayed the Revolution, and laughed as communists were slaughtered. We will not show mercy to those who would show us none."

NVR_lessons_from_red_army:0 "Lessons from the Red Army"
NVR_lessons_from_red_army_desc:0 "The Red Army failed in their defense of Stalliongrad, but they did, for a time, win against a much larger foe. We must understand their tactics, and perfect them, to create a purified, better Red Army."

NVR_new_socialist_republic:0 "The United Severyanan Socialist Republic"
NVR_new_socialist_republic_desc:0 "Stalliongrad has been reclaimed, but much land once belonging to the Revolution had fallen under control of imperialism, capitalism, or madness. We can not, we must not, stop here. We must push on. For the Motherland."



