l_english: 
#################
### Decisions ###
#################
  foe_political_effort_cat:0 "Political Actions"

  foe_stability_dec:0 "Hold A Speech"
  foe_stability_dec_desc:0 "In these times of strife, our people are in desperate need of hope. Hope we can give them with a series of inspirational and optimistic speeches."
  foe_stability_water_dec:0 "Distribute Water"
  foe_stability_water_dec_desc:0 "Water is a scarce commodity in much of the Wasteland. Many families within our borders struggle to get enough to survive and what they do get is often irradiated. We shall see to it that purified water is distributed as widely as we can, so as to ease the suffering of our people."
  foe_war_support_dec:0 "Praise Our Guardians"
  foe_war_support_dec_desc:0 "Even now, our brave soldiers protect us from all that could do us harm. They stand ever vigilant, day and night, making sure that we are all safe and sound. Let us show them our appreciation with a celebration in their honor!"
  foe_war_support_2_dec:0 "Rally the Nation"
  foe_war_support_2_dec_desc:0 "This is a dark time for all of us. Our enemies seek to tear us down, to kill us, and to destroy our very way of life. If we are to survive as one people, we must fight as one people. For if we fall, we shall all die as one people."
  foe_research_dec:0 "Study Wartime Innovations"
  foe_research_dec_desc:0 "Wartime Equestria was always innovating, creating all sorts of amazing technologies across both civilian and military industries. By studying their advances, we believe we could begin to replicate some of them and advance our own scientific capabilities."
  foe_building_slots_dec:0 "Clear Rubble"
  foe_building_slots_dec_desc:0 "Much of our land is still covered in rubble. If we were to clear some of it out, we would have more usable land to build over."
  foe_rationing_dec:0 "Ration Food Supplies"
  foe_rationing_dec_desc:0 ""
  foe_building_dec:0 "Salvage Old Materials"
  foe_building_dec_desc:0 "There are all sorts of useful materials just lying around, from concrete to steel. Why don't we put them to use in our own construction efforts? Sure, the end result may not be the most structurally sound, but survivors can't be choosers in the post-apocalypse."
  
  territory_disputes:0 "Territorial Disputes"

  # Military Command category
  foe_military_command_cat:0 "Military Command"

  foe_field_officer_rotations:0 "Field Officer Rotations"
  foe_field_officer_rotations_desc:0 "Running a formal military academy takes resources most wasteland nations simply don't have. What we do have is a generation of survivors who learned to fight the hard way. By cycling our most experienced officers through training assignments, we can pass that hard-won knowledge to our recruits without a single classroom. It won't make them academy-trained, but it will make them harder to kill."

  foe_authorize_field_promotions:0 "Authorize Field Promotions"
  foe_authorize_field_promotions_desc:0 "Pre-war Equestria promoted its officers by seniority, political connection, and the right family name. We are not pre-war Equestria. When a soldier is keeping their unit alive under fire while their seniors are still drawing up orders, that soldier should be leading. Field promotions cut through the chain of command and put the right ponies in charge of the right fights... before the wrong ponies get everyone killed."

  # Command Power cost text strings
  foe_cp_cost_50:0 "£command_power §H50§!"
  foe_cp_cost_50_blocked:0 "£command_power §R50§!"
  foe_cp_cost_50_tooltip:0 "Requires §R50§! Command Power"

  foe_cp_cost_30:0 "£command_power §H30§!"
  foe_cp_cost_30_blocked:0 "£command_power §R30§!"
  foe_cp_cost_30_tooltip:0 "Requires §R30§! Command Power"

  # Armoury Doctrine category
  foe_armoury_cat:0 "Armoury Doctrine"
  foe_armoury_cat_desc:0 "Our energy weapon research lets us re-equip our elite troops with magical energy weapons, or commit them to ballistic weapons for good.\n\n§RThese choices are permanent.§! For each unit, refitting and committing to ballistics exclude each other: once one is started, the other is gone for the rest of the game."
  foe_armoury_spec_ops_mew_dec:0 "Refit Spec Ops with MEWs"
  foe_armoury_spec_ops_mew_dec_desc:0 "Our spec ops trade their rifles for magical energy weapons. From then on they need energy weapons instead of ballistic ones.\n\n§RPermanent: Commit Spec Ops to Ballistics will no longer be possible.§!"
  foe_armoury_spec_ops_ballistic_dec:0 "Commit Spec Ops to Ballistics"
  foe_armoury_spec_ops_ballistic_dec_desc:0 "Our spec ops keep the guns they know and train with them until every shot counts.\n\n§RPermanent: Refit Spec Ops with MEWs will no longer be possible.§!"
  FOE_tech_spec_ops_ballistic_tt:0 "§YSpec Ops§!: §G+5%§! soft attack and §G+5%§! defence."
