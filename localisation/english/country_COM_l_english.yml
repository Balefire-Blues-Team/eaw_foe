 COM_economic_panopticon_idea:0 "Economic Panopticon"
 COM_economic_panopticon_idea_desc:0 "Every wagon has a manifest, every manifest a stamp, and every stamp a clerk who answers for it. The shadow economy did not disappear. It was hired."
