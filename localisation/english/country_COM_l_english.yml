 COM_COM_gains_MP_tt:0 "§FThe §LMinistry of Seven§! manages to regain a bit of control over the Military.\nThey will use this to place staunch royalists in important positions. In Case of an Uprising, the §LRoyalists§! will receive an additional 300 Ponypower.§!"
 COM_COR_gains_regiment_and_militia1_tt:0 "§FThe §RVermillionists§! will gain the Loyalty of §Done Army Division§!, and §Done Reservist Division§!.§!"
 COM_COM_gains_regiment_and_militia1_tt:0 "§FThe §LMinistry of Seven§! will secure the Loyalty of §Done Army Division§!, and §Done Reservist Division§!.§!"
