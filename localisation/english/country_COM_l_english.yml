 commonwealth_start.1.t:0 "The final Battle of the Sparkle-Wars"
 commonwealth_start.1.d:0 "At the conclusion of the Sparkle-Wars, the Warbands of the §OPrincedom of Kucyków§! and the Cohorts of the §rGrand Limuan Principality§! were arrayed once more for yet another battle in their decades-long Conflict.\nBut on this day, the 9th of August 1160, their war would finally come to an end. As both sides marched to claim the relatively unimportant §Gvillage of Smoerbott§!, the adviser of the outnumbered Limuan side advised his leader to avoid direct conflict, and instead defeat the Kucykówans with other means. The Prince took the advice, and decided to challenge his opponent to §GSingle-combat§!, to decide which side would own Smoerbott. As they fought, both inflicted wounds upon eachother, until the prince of Kucyków was slain, though the Limuan one only survived for 30 second longer, before dropping from his wounds.\nOutraged, a minor scuffle between the nobles of both sides excalated, until shots were fired, and chaos descended upon them.\n\nWhen the smoke dissipated, §Gthe Royal families of both sides lay slain in the grass§!, all the major members of their houses slain.\nThe remaining advisors and officers from both sides decided then and there, that this war had gone on for far too long, and neither of their nations would survive it. They picked a 3 year-old distant Niece of the Prince of Kucyków, who was also a 4th cousin to the Prince of Limua's wife, to start a new Dynasty, and finally unify the two Realms in peace.\n\nThis was formalized two weeks later in a written Document, known as the §RTreaty of Smoerbott§!\nHowever, the treaty was still a bit biased, and the city it favoured was..."
 commonwealth_start.1.a:0 "...Kucyków"
 commonwealth_start.1.b:0 "...Limua"
 
 commonwealth_start.2.t:0 "King Purefire's Folly"
 commonwealth_start.2.d:0 "Many of our brightest minds agree:\nThe decline of the Commonwealth started 11 years ago, with the so called §RGreat Northern Expedition§!.\n\nOur armies had just subjugated Stratusburg 4 years prior, when King Purefire declared his ambition to expand our borders north of the Polga River. With the benefit of hindsight, we now know that this was mainly due to the late King's own feelings of inadequacy, and pressure from the Cossacks. At the time, most did not see the problem with such an expansion, after all: The Commonwealth had the greatest army in the Region!\n\nTwo great Hosts marched northward, 12000 Ponies between the two of them. It was a sight to behold, truly.\nThe first months went smoothly, with close by settlements being swiftly subjugated, and little local resistance being encountered. Soon thereafter, the Unseen Council and the E.D.F. in the West stopped their hostilities and joined together against us, while our troops were becoming progressively more and more bogged down due to local tribals setting traps and ambushes.\n\nFor two more years Purefire tried to turn the campaign around, but Tribal resistance, New Coalitions in the North, and the harsh Severnayan Winter eventually brought our armies to their knees, and Purefire was forced to withdraw in shame.\nThe King was devastated in the loss, and many say he lost his spirit for rulership the day he had to cross the Polga on the way home. Soon thereafter he elevated his wife Falling Dusk to be Co-Monarch, as he found the burden of Leadership to be too heavy for him alone.\n\nThe common Creatures of the Commonwealth were disapponted as well, with many losing faith in the Monarchy, and some even beginning to doubt the Commonwealth itself, as they thought it had lost its..."
 commonwealth_start.2.a:0 "...Greatness"
 commonwealth_start.2.b:0 "...Strength"
 
 commonwealth_start.3.t:0 "The Hordes from the North"
 commonwealth_start.3.d:0 "In 1230, a young Yak-Warlord by the name of §RGrimsmasher§! blazed a trail of destruction first through Novochernusk, and then thorugh our own Western lands. He lead a massive host of fearsome Yak Warriors, many of which would need multiple magazines of ammunition, or even anti-machine weapons before they finally went down.\n\nOur Army, still battered from the Great Northern Expedition, was slow to mobilize, and before the first formations had assembled, Grimsmasher had already pushed to our southern lands and occupied the Province of Willowtown.\nKing Purefire and Queen Falling Dusk decided to lead different hosts, in order to cut off the Yaks retreat, and smash them in the field, but Grimshasher managed to evade a direct engagement for months, showing a very un-Yaklike talent for strategy and logistics.\nIn late 1231, the armies finally catch up to the Yaks, and engage in a massive field-battle. Unbeknowst to them, Grimshasher had been making diplomatic Overtures to some of the more disloyal territories, and the Troops from Arria leave the battlefield prematurely, while the Contingent from Direfall turns on their comrades and joins the Yaks' side.\n\nThusly betrayed, the Hosts of the Commonwealth are dealt a crippling blow, with Queen Falling Dusk being killed in combat by Grimsmasher himself, though she managed to inflict some major injuries on the Warlord with her magic.\n\nThe Armies of the Commonwealth retreated north, pursued by a large detachement of Yaks led by Grimsmasher's second in command. Just south of Kucyków, General Stalwart Shield manages to rally the army, and lures the pursuing yaks into the range of the Cities fortifications, killing a great many of them, including Grimsmasher's second-in-command. The next day the King is found to have been poisoned by an Assasin from Arria, who have now fully seceded. Acting as Regent for the young prince Meltdown, Stalwart Shield takes stock of what they had left and finds..."
 commonwealth_start.3.a:0 "...Our Foodstores were plundered"
 commonwealth_start.3.b:0 "...Ponies are defecting én masse"
 commonwealth_start.3.c:0 "...The Assembly refuses her Orders"
 
 commonwealth_start.4.t:0 "The Cinnabar Report"
 commonwealth_start.4.d:0 "Stalwart Shield sat in silence at her desk in the Royal palace, staring at the piece of paper before her.\nIt was a mere 3 pages of writing, and yet the news it brought was disconcerting, the evidence it citied damning:\nLord Vermillion Grace and his supporters were preparing for a violent Coup against her and the young prince.\n\nVermillion had always been antagonistic to her, but to think that he might actually try to destroy all that the Commonwealth had built over a century... this seemed so unlike him. And yet it was just so, her Agents had managed to intercept several letters and spy on important meetings between Vermillion and his closest Supporters.\nAll his political posturing had finally grown into something much more terrible. His proposals would mean the end for the nobility as Stalwart knew it, and upend the entire social order of the Commonwealth.\n\nHow could he even think of this? They were at the brink of another war with the Yaks, and Vermillion sought to weaken them further? Did he not see that he was leading them all onto a path of destruction... that Sister would slay Brother and their armies would grind eachother down, till Grimsmasher would only have to come in and pick up the broken pieces of their great Nation.\n\nNo!\nStalwart would not let that happen! She quickly took out a pen and began writing orders to her most trusted officers, as well as her closest Noble supporters.\nThe Commonwealth would not fall so easily, not if she could help it!"
 commonwealth_start.4.a:0 "We'll be prepared for anything!"
 
 commonwealth_start.5.t:0 "The Velika-Issue"
 commonwealth_start.5.d:0 "Today, representatives of both Limua and Smoerbott were standing before the Platinum Council, each making their case for why their administration should have control over the long disputed state of Velika.\n\nThe Delegate from Smoerbott argued, that the land was settled by many Cossacks, and its mainly agrarian nature would make the Administration in Smoerbott much more qualified for governing such a land.\n\nThe 'Delegate' from Limua, as so often a remote-controlled robot through which the Council of Spring could speak directly, argued for Limuas need to control more territory to feed its growing population, and the usefulness of Velike to carry out certain 'experiments' the Council would like to perform. When pressed on the nature of these 'Experiments' the Council refused to answer, citing prior legislation giving them a right to secrecy, unless overruled by a royal decree.\n\nAs soon as the Council had spoken their last word, the Chamber erupted in debate, with the many members as always more interested in what would be more profitable, than what would do the nation any good.\nStalwart let it go on for a few minutes, before standing up and coughing audibly. Quickly, the Chamber fell silent.\n'I have made my decision! As Regent of Prince Meltdown, I award the rights to Velika to..."
 commonwealth_start.5.a:0 "...Limua"
 commonwealth_start.5.b:0 "...Smoerbott"
 
 commonwealth_start.6.t:0 "Cossacks demand right to expand Militias"
 commonwealth_start.6.d:0 "The letter from Burning Steppe, leader of the Smoerbotti Cossacks, had been short and to the point.\nIt demanded the right for 3 full-strength Divisions of Civilian Reservists to be raised in the lands of Smoerbott, so that they could be trained and quickly called up in case of war. Ostensibly, this was for a potential invasion from Severnaya, or maybe even to defend Rayoreyda, should the traitors from Arria decide to try their luck at an invasion, but Stalwart knew better.\nShe wasn't sure how, but Burning Steppe must have gotten wind of Vermillions treacherous plans, and is now making moves to seize control of the nation herself, once the Chaos starts.\n\nStalwart knew that she couldn't fully deny Steppe, as that would cause many cossacks within her own army to leave at such an insult, but could she truly hand such forces to a potential enemy?\n\nOf course, if she did grant the rights, she could mandate the troops be send to Kucyków for training, which would make it quite the easy task to sow dissent in the ranks of the Cossacks...\nAccepting with subterfuge, or limiting the proposal as much as she dared, she would have to make a decision now, while she still had the advantage of momentum. "
 commonwealth_start.6.a:0 "Accept, we can turn them against Eachother!"
 commonwealth_start.6.b:0 "Cut down the Proposal, give them as little as possible!"
 
 commonwealth_start.7.t:0 "Scuffle in the Assembly"
 commonwealth_start.7.d:0 "No less than 11 complaints were filed by the different factions in the Assembly of Hearts today, after a member of the '4-Cities party' attempted to drag a Vermillionist giving a speech from the Podium, which then escalated into a larger scuffle between the two political factions. Nopony was seriously hurt, though by the wording of the complaints, one could almost think somebody was murdered on stage.\n\nApparently, the Vermillionist, a rich Merhcant by the name of 'Golden Deal', had started his speech with the usual rhetoric about the necessity of a government-controlled redistribution of wealth, an expansion of the Grain-dole and new limits on the powers of the Nobility.\nHe was then interrupted by a heckler from the 4-Cities Party.\n\nGolden Deal then proceeded to go off-script and began questioning the continued existance of the 4-Cities Party, exclaiming that with the loss of Arria the Commonwealth only has 3 great Cities, and then accused the 4-CP of Cooperating with the Traitors from Arria.\n\nFrankly, all the complaints were quite childish, most members of the Assembly have high places in society, and really should know better.\nStalwart Shield stamped all the complaints with 'Rejected!' and turned to deal with more important matters."
 commonwealth_start.7.a:0 "I have a nation to save"
 
 commonwealth_start.8.t:0 "Council of Spring requests Criminals"
 commonwealth_start.8.d:0 "Truly, an unusual request.\n\nIt appears that the High-mages of Limua, the 'Council of Spring', require some live specimen for some unspecified experiments.\nFor this purpose, they have requested that Prisoners from both Kucyków and Smoertbott are sent to them. According to their letter, they are willing to take full responsibility of ensuring the prisoners don't escape and they they are 'punished accordingly to their crimes'. They are not willing to guarrantee the survival of those not on Death-row however, as their experiments supposedly have a very high mortality rate, this being the reason they are requesting Prisoners to begin with.\n\nThis could certainly be of use, as many of our prisons are near maximum capacity, and are costing us money that we, frankly, dont have at the moment.\nTo prevent public outrage, we could simply send them those prisoners that would not be missed, Raiders, Deserters and those without families for example.\n\nLimua won't be happy to be denied, and the Council is sure to use their influence to retaliate politically."
 commonwealth_start.8.a:0 "Make a list of Potential Candidates"
 commonwealth_start.8.b:0 "We can't just send them to their Deaths"
 
 commonwealth_start.9.t:0 "Running on Fumes"
 commonwealth_start.9.d:0 "§REMPTY§!\n\nThose five red letters mocked her from the bottom of the Treasury report.\nStalwart Shield knew their economic situation wasn't great, but a month ago she was still confident that they'd make it at least another 2 years.\nA recent investigation had revealed that many of the previous years numbers had been 'creatively interpreted' by a number of clerks either too corrupt to care, or too afraid to tell her the truth.\n\nThey had been right to be afraid, of course, as Stalwart had already ordered the responsible Ponies to be covertly 'disappeared' by the Royal Guard and her personal Agents. She couldn't let anyone she didn't trust fully have this information.\n\nIf this became known to the public, the Vermillionists would finally have their proof of the governments incompetency, the merchants would want her gone as Regent, and her noble enemies would jump at the opportunity to replace her.\n\nNo, she couldn't have that.\nThe government would simply continue to operate as if they weren't bankrupt. They could surely do some 'creative accounting' of their own.\nStalwart was unsure for how long they could keep up the charade, but she was determined to stabilize the country before bankruptcy eroded the last bits of confidence the Citizenry had."
 commonwealth_start.9.a:0 "None of you will speak of this!"
 
 commonwealth_start.10.t:0 "The Vermillion-March"
 commonwealth_start.10.d:0 "The North Quarter was rudely awoken this morning, when Vermillion Grace and many members of the Vermillionists took to the streets to protest the current actions of the Government.\nThe protest quickly increased in size, as many of the Homeless and disenfranchised were riled up by Vermillion. Not long after, many of the cities factories came to a halt, as an impromptu strike spread across the city.\n\nTo the shock of the City-guard, when they tried to disperse the crowd and arrest Vermillion, some of the Guard-officers recognized members of the Army among the protestors, apparently having joined Vermillion.\n\nAfraid of turning the protest into a bloodbath on both sides, the Commander of the guard decided to simply contain the protest until the guard could link up with Stalwart Shield's personal Guard.\nStalwart was out herself, inspecting her troops before sending them in, when an urgent missive reached her:\nSigned by multiple of the high Nobles, the missive called on her to ignore the protest, and instead focus on evacuating the most loyal elements of the City-Guard, as well as the personal retinues of the High-Nobles and to send them north, to her Estate.\nThat would certainly give her a large power-base to fall back on, once the Coup happened, but could she really let the Riots continue?"
 commonwealth_start.10.a:0 "Disperse the Crowd by any Means"
 commonwealth_start.10.b:0 "Evacuate the Loyalists"
 
 commonwealth_start.11.t:0 "Security by other Means"
 commonwealth_start.11.d:0 "WIP\nStalwart disbands the Bordergard, since so many are disloyal, and then immediatly hires many back on as private contractors"
 commonwealth_start.11.a:0 "They will be needed soon"
 
 commonwealth_start.12.t:0 "The Limuan Withdrawal"
 commonwealth_start.12.d:0 "WIP\nLimua withdraws and offically disbands all units under some pretense. We either let them go, or try to bribe some of them to join our reserve"
 commonwealth_start.12.a:0 "We have no need of those Traitors"
 commonwealth_start.12.b:0 "Approachs some of their units"
 
 commonwealth_start.13.t:0 "Vanished with the Wind"
 commonwealth_start.13.d:0 "WIP\nThe Cossack-Hosts no longer respond to our commands, and Cossack lands have become generally hostile to our administration"
 commonwealth_start.13.a:0 "Concerning"
 
 commonwealth_start.14.t:0 "Silence in the East"
 commonwealth_start.14.d:0 "WIP\nLimuan Lands have gone silent, with sparse reports of strange creatures, robots and the undead marching across the land."
 commonwealth_start.14.a:0 "What in Celestia's name is going on?"
 
 commonwealth_start.15.t:0 "Kucyków Burns"
 commonwealth_start.15.d:0 "The Sky above the Capital was stained red with Fire and smoke, a color all too similar to the one staining the coat of the Pony who had caused all this:\nVermillion Grace.\n\nThe Vermillionists had made their move shortly before sunrise, when 'Revolutionaries' stormed police stations and Arms-Depots, while many members of the City Guard simply stood by, or even joined the Vermillionists.\nStalwart Shield, her personal retinue and the Royal Guard quickly secured the young prince, as well as the most important ministers and documents of state, before moving through secret tunnels to escape the city.\n\nIn the end, even the Ruby citadel threw open its gates to Vermillion, its commander cowardly handing over the members of the Platinum Council that had not managed to leave the city in time.\n\nIf reports are to be believed, the mob practically tore them to pieces with their bare hooves, as Vermillions protegé, Crystal Drop, led a contingent of traitorous Soldiers into the bowels of the Citadel, to secure the Grain-depot it held.\n\nOn their way northwards, Stalwart rendevouzed with a number of Loyalist regiments, that joined her on their way to the Stalwart Lands, where the Governess-General planned to regroup and formulate a plan to re-take the Capital."
 commonwealth_start.15.a:0 "It's happening..."
 
 commonwealth_start.16.t:0 "The End of the Commonwealth"
 commonwealth_start.16.d:0 "Civil War time Baby!"
 commonwealth_start.16.a:0 "For the Prince!"
 commonwealth_start.16.b:0 "For the Revolution!"
 commonwealth_start.16.c:0 "For Science!"
 commonwealth_start.16.e:0 "For Freedom!"
 
 commonwealth_start.17.t:0 "Securing our Border"
 commonwealth_start.17.d:0 "With the Commonwealth descending into utter Chaos, the entire region is becoming worryingly unstable.\nWe are in an especially precarious position, seeing as we are a relatively small nation, directly bordering the warring factions of the Commonwealth.\n\nTo ensure the safety of our people, and so that the various factions respect our western border, we have decided to seize a narrow strip of land currently occupied by the Revolutionary faction of the Commonwealth Civil-war.\nHaving thusly established a buffer-zone, our core territories should be safe from spill-over conflicts.\n\nIt is extremely unlikey that nay of the Civil-war factions will retaliate. They are much too busy ripping their country, and eachother, apart."
 commonwealth_start.17.a:0 "Seize it!"
 
 commonwealth_start.18.t:0 "Saving what we can"
 commonwealth_start.18.d:0 "'We cannot afford to mince words, so I'll be the one to come out and put it bluntly: Our Military in total disarray.'\nGeneral Aegis let it sink in for a moment, the reactions from the other members of the Ministry of Seven ranging from disinterest to grim acceptance. Noone was surprised, it had been an open secret for months now, with all of them dancing around the subject, as none wanted to deal with the Implications.\n'Then isn't it your job to fix it, General?' Lord Vitamant was the first to break the Silence. As so often happened recently, he sought to assign blame instead of bringing something constructive to the table.\n'I think we all know that the Government lacks the funds to raise new formations.'Lady Ingenue spoke up. 'Not to mention that we can't draft more without cutting into our industrial base. The Expedition and the Grimwar have depleted us greatly, and some of our prime recruiting grounds in Stratusburg and Arria have seceded.' She looked to the Governess general, who was in the process of studying the proposal in front of her.\nIt was the reason for their meeting: The Assembly had sought to make the first move, and had not only filed a formal complaint pertaining to the state of the Armed forces, but also supplied a nine-page proposal as to how the situation could be ammended. It had been penned by Crystal Drop, protegé of Vermillion Grace, one of the leading figure in the Vermillionist movement... and Aegis' Daughter.\nAegis had to admit that the proposal was sound, and he was sure that the other members of the Ministry saw it as well. The one problematic thing was the funding. This reformed Army would be mainly funded through an additional tax levied upon the merchants by the Assembly.\nStalwart Shield finally looked up 'I think we can all agree to the basics of the proposal, dubious as any proposal from the Vermillionists may be. We will amend it, of course, to prevent this from outright handing over control to the Assembly, but we won't be able to stifle all of their influence, unless...' She looked at each of the other six in turn, lingering on them for a few seconds each '...unless we all are willing to pool some of our collective wealth to hold over the army for the time being. At least until the Government is back in shape.'\nAegis could virtually taste the mood souring in the room. Asking High nobles to give up some of their wealth would always be a painful process. They would have to vote on this."
 commonwealth_start.18.a:0 "The Assembly's Proposal wins"
 commonwealth_start.18.b:0 "We'll shoulder this ourselves"
 
 commonwealth_farther.1.t:0 "The Commonwealth is not yet Lost"
 commonwealth_farther.1.d:0 "The Radio broadcast sounded hollow, a distorted echo following each word, as if it had travelled through some winding cave on its way from the tower to their little Field-Radio. Aketon had to concentrate to make out the individual words, which was made a lot harder by the fact that one of those thrice-damned rabels was taking potshots at him and his group every few minutes. They knew the sniper was hiding in the upper floor af a barn, less than a hundred yards from their own position, but none of them had gotten a glimpse of them since the first bullet had caught Cheminage in the leg.\nThe radio sputtered and went silent. From the looks on the faces of the others, the orders had not been ones to raise their spirits.\nWHen the shooting started, they ahd taken shelter in the ruins of a garage, pre-war, since it was built from proper concrete. Cheminage was properly bandaged now, though they had decided not use one of the 3 healing potions they had between the 4 of them, instead saving those for actually life-threatening wounds. Corporal Heriot was trying to get the radio back to work, while Inkhorn had made herself busy counting their remaining ammunition, pitiful though the amount was.\nThey had been in almost continuous engagements since before dawn, at times linking up with other squads, mostly fighting just fighting as a unit of four. As far as Aketon could tell, High command was still in total chaos, and any orders they got were mainly from lower-ranking officers, each trying to get some measure of control of the situation. The rebels, it turned out, were a lot better armed and trained than they had expected, and they had a nasty tendency to fight in civillian clothing, meaning you were never sure if you were shooting at an innocent bystander, or a disguised rebel, just waiting to shoot you in the back.\n\nCRACK\nAnother bullet impacted the wall of the garage, the 19th, if you were counting the one that had hit Cheminage. Last he'd heard, they were outnumbered 3-1 on this southern front, and it would likely not get any better, now that the Kucyków had fallen.\nA soft static reached his ears, as Heriot stepped back, the radio apparently fixed. The static gave way to a voice, half familiar, for it was often heard in these kinds of broadcasts: The Governess-General.\nHe gripped his rifle tighter, as Stalwart Shield began to address those still Loyal to their Nation:"
 commonwealth_farther.1.a:0 "'We will prevail'"
 
 commonwealth_farther.2.t:0 "Shaking up the Roster"
 commonwealth_farther.2.d:0 ""
 commonwealth_farther.2.a:0 "We will carry on."
 
 
 
 
 
 
 
### Hegemony: Power Struggle ###

 com_power.1.t:0 "§OThe Army§! overreaches"
 com_power.1.d:0 "WIP\n\nOrders are being countersigned at the General Staff before they reach the Governess-General's desk. Regimental colonels have stopped answering the Shield-Guard's enquiries. Nopony has said the word, but everypony in Smoerbott knows what an army that no longer asks permission is called."

 com_power.11.t:0 "A Memorandum from the General Staff"
 com_power.11.d:0 "WIP\n\nThe Army has grown used to being listened to. Its latest memorandum is polite, detailed, and not a request."

 com_power.2.t:0 "§2The Shield-Guard§! overreaches"
 com_power.2.d:0 "WIP\n\nThe Guard's files now include its own ministers. Wardens have begun arresting officers on their own warrants, and governors have learned to ask a post commander before they ask the capital. The watchdog has decided it owns the house."

 com_power.12.t:0 "A Report from §2the Shield-Guard§!"
 com_power.12.d:0 "WIP\n\nThe Guard's report on the state of the country ends, as they always do now, with a list of what the Guard needs to keep it that way."

 com_power.3.t:0 "§0The Special Branch§! overreaches"
 com_power.3.d:0 "WIP\n\nPonies are disappearing who were never on any list the Governess-General signed. The Branch has funds nopony granted it and orders nopony gave it. A knife that chooses its own targets is not a tool any more."

 com_power.13.t:0 "A Note from §0the Special Branch§!"
 com_power.13.d:0 "WIP\n\nThe note is unsigned and three lines long. The Branch has never needed more than that to say what it wants."

 com_power.4.t:0 "§LThe Officer-Nobility§! overreaches"
 com_power.4.d:0 "WIP\n\nThe new houses have discovered what the old ones knew: titles, estates and private retinues add up to a country of their own. Taxes are arriving late, quotas arrive short, and the lords who owe everything to Stalwart Shield are beginning to act as though they owe her nothing."

 com_power.14.t:0 "A Petition from the New Houses"
 com_power.14.d:0 "WIP\n\nThe officer-lords have sent a petition, sealed with coats of arms that did not exist five years ago."

 #Generic replys, re-used for multiple events
 com_power.crisis.a:0 "Everypony has a price. Pay it."
 com_power.crisis.b:0 "Make examples of the ringleaders."
 com_power.crisis.c:0 "There is nothing left to pay with."
 com_power.demand.a:0 "We will see what can be done."


### Hegemony: Reconstruction ###

 com_recon.1.t:0 "Empty Lecture Halls"
 com_recon.1.d:0 "WIP\n\nHalf the chairs at Kucykow's university stand empty. The ponies who filled them are in Novochernusk, in Stratusburg, or simply gone. The rector asks what the Governess-General intends to do about it."
 com_recon.1.a:0 "Pay them what they are worth."
 com_recon.1.b:0 "Nopony with a degree leaves the country."

 com_recon.2.t:0 "Fill empty Seats"
 com_recon.2.d:0 "WIP\n\nA third of the Assembly's seats belonged to houses that chose the wrong side. Stalwart Shield has a list of officers who would fill them loyally. The only question is how quickly the old houses are made to watch it happen."
 com_recon.2.a:0 "All at once. Let them object, if they dare."
 com_recon.2.b:0 "A few each season, as vacancies arise."

 com_recon.3.t:0 "The Terms of Peace: the Vermillionists"
 com_recon.3.d:0 "The Vermillion Front's committees have been broken up and its leaders are in cells. What remains is a few ten-thousand labourers who believed them, and the workshops they ran."
 com_recon.3.a:0 "Their workshops belong to the state now."
 com_recon.3.b:0 "Let the labourers go home."

 com_recon.4.t:0 "The Terms of Peace: the Cossacks"
 com_recon.4.d:0 "The Rada is dissolved. The Cossack hosts that rode for it are camped under guard, waiting to hear whether they are prisoners or subjects."
 com_recon.4.a:0 "They will serve their sentence in uniform."
 com_recon.4.b:0 "Send them back to their steppe, disarmed."

 com_recon.5.t:0 "The Terms of Peace: the Magocrats"
 com_recon.5.d:0 "Limua's Council is gone, but its mages and its laboratories are not. Both could be put to work, or both could be left alone in exchange for quiet."
 com_recon.5.a:0 "Strip the laboratories for the arsenals."
 com_recon.5.b:0 "Leave Limua its towers."


### Hegemony: Politics ###

 com_pol.1.t:0 "The Question of the Prince"
 com_pol.1.d:0 "WIP\n\nPrince Meltdown is the last living heir of a dynasty the Governess-General has outlived in every way that matters. He is young, popular with the old houses, and entirely in her hooves."
 com_pol.1.a:0 "A comfortable exile, far from any border."
 com_pol.1.b:0 "He stays at court, where the nobility can see him."
 com_pol.1.c:0 "Unfortunate accidents happen."

 com_pol.2.t:0 "A General without an Army"
 com_pol.2.d:0 "WIP\n\nGleaming Aegis took his pension with good grace and was not heard from for a month. Now his name is on the masthead of every reform circular in the capital. The Reform-Movement has found itself a leader with a war record."
 com_pol.2.a:0 "We will be watching him."

 com_pol.3.t:0 "The Hegemony demands Smithsroad"
 com_pol.3.d:0 "WIP\n\nAn envoy of the Governess-General has delivered a note. Smithsroad was Commonwealth land, it says, and the Commonwealth wants it back."
 com_pol.3.a:0 "It is not worth a war."
 com_pol.3.b:0 "Let her come and take it."

 com_pol.4.t:0 "The Hegemony demands Carrotsburg"
 com_pol.4.d:0 "WIP\n\nAn envoy of the Governess-General has delivered a note. Carrotsburg was Commonwealth land, it says, and the Commonwealth wants it back."
 com_pol.4.a:0 "It is not worth a war."
 com_pol.4.b:0 "Let her come and take it."

 com_pol.5.t:0 "[From.GetNameDefCap] yields"
 com_pol.5.d:0 "WIP\n\n Generic event for countries submitting to the Hegemony. The garrison has marched out and our governor has marched in. Not a shot was fired."
 com_pol.5.a:0 "As it should be."

 com_pol.6.t:0 "[From.GetNameDefCap] refuses"
 com_pol.6.d:0 "WIP\n\nGeneric event for coutries refusing to submit to the Hegemony. Our note came back unanswered, which is an answer in and of itself. The General Staff has been asked for a plan."
 com_pol.6.a:0 "Then we will take it."

 com_pol.7.t:0 "Creditors, not Friends"
 com_pol.7.d:0 "WIP\n\nWith loans, trade and bribes we have bought a few months of peace with Novochernusk and Stratusburg. Unexpectantly, ponies on both sides of the border are making great use of the thawed tensions and industry is booming either side of the line."
 com_pol.7.a:0 "How nice of them to build up *our* cities."


### Hegemony: Politics, the war and the endings ###

 com_pol.10.t:0 "The Fourth City"
 com_pol.10.d:0 "WIP\n\nArria is breaking. Its magistrate, Dried Ink, has sent word through three different couriers that he could open the gates, if the Governess-General could find it in herself to forget which side he chose at Razorfield."
 com_pol.10.a:0 "He opens the gates and keeps his office."
 com_pol.10.b:0 "He hangs from them."

 com_pol.11.t:0 "The Yak Question"
 com_pol.11.d:0 "WIP\n\nThe Khaganate's land is ours, and so are the yaks who live on it. The Governess-General's Panequestrian project has no place for them. The only question the ministries are asked is how."
 com_pol.11.a:0 "Drive them north, across the Polga."
 com_pol.11.b:0 "There will be no yaks."

 com_pol.12.t:0 "Direfall answers"
 com_pol.12.d:0 "WIP\n\nDirefall's regiments changed sides at Razorfield and cost the Commonwealth a queen. Now its gunsmiths stand in the square with their hats in their hooves, waiting to hear what that is going to cost them."
 com_pol.12.a:0 "One in ten shot, and the rest to the camps."
 com_pol.12.b:0 "Their guns are worth more than their necks."

 com_pol.13.t:0 "The Queen avenged"
 com_pol.13.d:0 "WIP\n\nGrimsmasher is dead, and Falling Dusk can rest. What is left of the Khan lies in a cart outside the command tent, and three different offices have filed a request for it."
 com_pol.13.a:0 "Burn it. Let there be nothing to gather around."
 com_pol.13.b:0 "Put a piece on display in every city."
 com_pol.13.c:0 "The mages in Limua have asked for it."

 com_pol.14.t:0 "The Future of Detrot"
 com_pol.14.d:0 "WIP\n\nDetrot left the Khan when we asked and has kept its word since. Its council now asks, carefully, what the Hegemony intends for a city that was not conquered."
 com_pol.14.a:0 "A willing subject is still a subject."
 com_pol.14.b:0 "They have earned being left alone."

 com_pol.15.t:0 "The Future of Arria"
 com_pol.15.d:0 "WIP\n\nArria opened its gates and has been governed as an ally since. With the war over, the General Staff sees no reason for the Fourth City to stay outside the Commonwealth it once belonged to."
 com_pol.15.a:0 "The Fourth City comes home."
 com_pol.15.b:0 "Dried Ink has been useful. Let him stay."

 com_pol.20.t:0 "The Northern Concert"
 com_pol.20.d:0 "WIP\n\nGeneric event of the Hegemony inviting people to their faction. An envoy of the Governess-General has arrived with an invitation to the Northern Concert. It is worded as an honour. The second page lists the garrisons we would host and the tribute we would pay."
 com_pol.20.a:0 "We accept her protection."
 com_pol.20.b:0 "We answer to nopony."

 com_pol.21.t:0 "Nopony lives Forever"
 com_pol.21.d:0 "WIP\n\nStalwart Shield has no intention of dying, but she has seen what an empty throne does to a country. One of her institutions will be told, quietly, that the succession is theirs. TODO: Talk about htis with chem, ideally we'd have all four factions represented by a character."
 com_pol.21.a:0 "The Army."
 com_pol.21.b:0 "The Shield-Guard."
 com_pol.21.c:0 "The Special Branch."
 com_pol.21.e:0 "The Officer-Nobility."

 com_pol.22.t:0 "Purefire's Ghost"
 com_pol.22.d:0 "WIP\n\nThe Northern Expedition was King Purefire's great design, and it killed him, his army and very nearly his kingdom. The maps are still in the archive. So are the lists of the dead."
 com_pol.22.a:0 "He was right. He was only early."

 com_pol.23.t:0 "Ponykind's Destiny"
 com_pol.23.d:0 "WIP\n\nThe plains are quiet and the north is beaten. For the first time since Razorfield, nopony threatens the Hegemony. The Governess-General must decide what a state built for war does with peace."
 com_pol.23.a:0 "We have what is ours. Let the world keep the rest, and fear us."
 com_pol.23.b:0 "Panequestria from sea to shining sea!"

 com_pol.24.t:0 "The Hegemony reigns Supreme"
 com_pol.24.d:0 "WIP\n\nIsolationist Option. The borders are closed and the watchtowers are lit. Beyond them, the Official History teaches, lies a world that envies ponykind and would destroy it. It is a useful world to have. A country that is always about to be attacked asks few questions of those who guard it."
 com_pol.24.a:0 "And so it endures."

 com_pol.25.t:0 "The Hegemony reigns Supreme"
 com_pol.25.d:0 "WIP\n\nExpansionist option. The columns are moving again. There will be another frontier after this one, and another enemy behind it, because the machine Stalwart Shield built needs them as an engine needs coal. It will run until it has the whole world, or until something finally breaks it."
 com_pol.25.a:0 "Forward."

#TODO: Implement Victory-event if only COM and OWE are still on the map.


### Hegemony: Conscripts ###
 com_mil.1.t:0 "Stand down the Battalions"
 com_mil.1.d:0 "WIP\n\nThe Salvation Battalions were raised from prisons and debtors' rolls when there was nopony else left to raise. The war they were raised for is over. They are still armed, still in barracks, and nopony promised them anything in writing."
 com_mil.1.a:0 "Send them home. The workshops need hooves."
 com_mil.1.b:0 "They have not finished paying. Penal battalions."
 com_mil.2.t:0 "The Question of the Levies"
 com_mil.2.d:0 "WIP\n\nThe Spoków Youth Corps held a line that grown soldiers had already left. Most of its ponies are still younger than the conscription age the Assembly once set. Their mothers want them back, and their officers want them kept."
 com_mil.2.a:0 "Disband the Corps. They have done enough."
 com_mil.2.b:0 "They are soldiers now. They stay."

### Hegemony: Industry ###
 com_ind.1.t:0 "The Limuan Inheritance"
 com_ind.1.d:0 "WIP\n\nLimua's laboratories stand as the Council left them: sealed, half looted and still full of machines nopony in Kucyków can name. The engineers want them reopened. The Ministry wants the copper."
 com_ind.1.a:0 "Reopen them. Somepony will remember what they were for."
 com_ind.1.b:0 "Strip them. Factories need machine tools more than we need riddles."
 com_ind.2.t:0 "Who works, and where"
 com_ind.2.d:0 "WIP\n\nThe demobilised, the displaced and the released all need to be put somewhere. The factory boards and the recruiting sergeants have both sent in their lists, and the lists name the same ponies."
 com_ind.2.a:0 "To the factories."
 com_ind.2.b:0 "To the colours."

