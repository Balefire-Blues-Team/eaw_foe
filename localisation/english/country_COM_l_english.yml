 COM_smuggle_guns_400_tt:0 "§FWe will aquire §G400 Basic Weaponry§! by covert means and stash it at §LStalwart Castle§!§!"
 COM_peryfer_secure_tt:0 "§FBy strategically placing agents troughout the §gPeryfer§!, as well as positioning loyal ponies to take out local Vermillionists at any sign of insurrection, we will ensure that §gPeryfer§! sides with the §LRoyalist Cause§!§!"
