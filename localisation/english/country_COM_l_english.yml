 COM_requisition_idea_desc:0 "The state does not buy. It issues a receipt, and the receipt is honoured when the state decides that it is."
 COM_estate_quotas_idea:0 "Estate Quotas"
 COM_estate_quotas_idea_desc:0 "Each noble house answers for a figure. How the figure is met on its own land is the house's business, as long as it is met."

