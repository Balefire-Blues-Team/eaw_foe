 COM_shattered_army:0 "Shattered Army"
 COM_shattered_army_desc:0 "The Great Northern Expedition, as well as the Grimwar and the secession of Arria have severely diminished our military power. Once we had the greatest army in the region, but now many of our officers are dead, and the empty ranks in our battalions are only slowly being filled by green recruits, whom we'll have to train from the ground up."
 
 COM_shattered_army2:0 "Shattered Army"
 COM_shattered_army2_desc:0 "The Great Northern Expedition, as well as the Grimwar and the secession of Arria have severely diminished our military power. Once we had the greatest army in the region, but now many of our officers are dead, and the empty ranks in our battalions are only slowly being filled by green recruits, whom we'll have to train from the ground up."
 
 COM_shattered_army3:0 "Shattered Army"
 COM_shattered_army3_desc:0 "The Great Northern Expedition, as well as the Grimwar and the secession of Arria have severely diminished our military power. Once we had the greatest army in the region, but now many of our officers are dead, and the empty ranks in our battalions are only slowly being filled by green recruits, whom we'll have to train from the ground up."
 
 COM_ripped_heart:0 "Loss of the Industrial Heartland"
 COM_ripped_heart_desc:0 "While Kucyków has long been the largest city in the Commonwealth, it was traditionally Arria, that provided the majority of military equipment. Not only that, with Arria seceding, a lot of prominent industrialists also left the country, in search of a more stable home. It will take years to rebuild our industry, or maybe some radical new ideas..."
 
 COM_rebel_cossacks:0 "Rebellious Cossacks"
 COM_rebel_cossacks_desc:0 "The Cossacks were never the most loyal supporters of the Government, but with the failiure of the Great Northern Expedition, from which many Cossacks expected new land to settle in Severnaya, they are more rebellious than ever. Many refuse the draft, and their representatives in the Assembly and Council are openly antagonizing us."
 
 COM_assembly_of_hearts:0 "Assembly of Hearts"
 COM_assembly_of_hearts_desc:0 "A concession to the commons, the Assembly of Hearts is the only higher form of Government that commoners can be elected to. While it has opposed our politics at some points, it is still a great factor in keeping our nation stable."
 
 COM_capital_riots_idea:0 "Capital Riots"
 COM_capital_riots_idea_desc:0 "The Vermillionists are marching through the streets, only being held back from the Government-buildings. Kucyków is in utter Chaos."
 
 COM_civil_war_idea:0 "Commonwealth Civil-War"
 COM_civil_war_idea_desc:0 "WIP"
 
 COM_peasant_relief_idea:0 "Peasant Relief Efforts"
 
 COR_peasant_division_idea:0 "Division among the Peasants"
 
 COM_army_remnants_idea:0 "Loyalist Army Remnants"
 COM_army_remnants_idea_desc:0 "Even though many of our soldiers have sided with the various Rebel-Factions, we still retain a core of Loyal and competent army units. They will form the Backbone of our forces, and serve as the hammer that smashes the enemy lines, so that less experience units may follow them."
 
 COM_rural_industrial_base_idea:0 "Rural Industrial Base"
 COM_rural_industrial_base_idea_desc:0 "Before the Civil-War, we lost Arria, and Stratusburg and Novochernusk, a heavy blow to our industry. Now, Kucyków, Smoerbott and Limua are lost to us as well, and our industry had to be moved to the hinterlands of our nation. No more efficient supply-chains, no more rail-networks, just determined ponies working day and night to save our Nation."
 
 COM_vermillion_scare_idea:0 "The Vermillion Scare"
 COM_vermillion_scare_idea_desc:0 "The Enemy could be anywhere.\nNow that the Vermillionists have made their move and plunged our nation into civil-war, the populace is terrified of who might work for the Rebels, who might sympathise with them. Our Military police has to stop attempts at lynchings multiple times a day, and often the officers let the mob simply continue."
 
 COM_prince_meltdown_idea:0 "Prince Meltdown"
 
