 COM_fortify_estate:0 "Construct hidden Bunkers"
 COM_fortify_estate_desc:0 "In order to prevent the Rebels from ever setting a hoof into Stalwart Lands, we will construct a secret defensive line from Spoków to Równyna. We will also shore up defenses around Stalwart castle itself."
 
 COM_approach_royalists:0 "Approach Noble Levies"
 COM_approach_royalists_desc:0 ""
 
 COM_peryfer_militias:0 "Securing Peryfer"
 COM_peryfer_militias_desc:0 "Peryfer has become a hotbed for the Vermillionist Cause, mainly due to its proximity to Kucyków.\nIn the Event that the Vermillionists move against the rightful government, it is likely that Peryfer will side with the Rebels. We cannot let this situation be, and will therefore move to secure our control over the Region."
 
