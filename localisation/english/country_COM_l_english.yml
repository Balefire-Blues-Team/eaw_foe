### Hegemony: Power Struggle ###

 COM_power_struggle_cat:0 "The Balance of the Hegemony"
 COM_power_struggle_cat_desc:0 "The Governess-General rules through four institutions, each built to watch the other three. Every one of them has to be strong enough to do its work, and none strong enough to do without her.\n\n§OThe Army§!: [COM_get_army_tier] (§C[?COM_army_influence|0]§!)\n§2The Shield-Guard§!: [COM_get_guard_tier] (§C[?COM_guard_influence|0]§!)\n§0The Special Branch§!: [COM_get_branch_tier] (§C[?COM_branch_influence|0]§!)\n§LThe Officer-Nobility§!: [COM_get_nobility_tier] (§C[?COM_nobility_influence|0]§!)\n\nBelow §C25§! a faction is §gSubdued§!, from §C25§! it is §YMeddling§!, from §C50§! it is §GInfluential§! and starts making demands. A faction that reaches §C75§! §Roverreaches§!: it drains stability, and unless it is brought back below §C75§! within §Y31§! days, a crisis follows.\nCrises so far: §R[?COM_power_crisis_count|0]§! of §R3§!. The third one cannot be bought off."
