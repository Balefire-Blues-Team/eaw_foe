l_english:
  #Dog Technologies
  TITLE_DIAMOND_DOGS_IRONPAWS_SUBTITLE:0 "IRONPAW DIVISION"
  tech_ironpaws:0 "Ironpaws"
  tech_ironpaws_desc:0 "Given the Diamond Dog species and their affinity for digging, they became naturals at digging defensive lines. Excelling in hills and mountains where they could easily dig tunnels, Ironpaws were brutal to push through for any attacker."
  tech_ironpaws2:0 "Burrow Ambushes"
  tech_ironpaws2_desc:0 "A tactic seen most famously in Unity's conquest of Splendid Valley, and with Elder Steelhooves' death. Ironpaws using this tactics would make small tunnels heading all over a battlefield, and would travel through them to surprise enemies."
  tech_ironpaws3:0 "Trenches"
  tech_ironpaws3_desc:0 "Trench warfare was a staple of the South-Eastern front of the Great War, and none were better at trench warfare than Diamond Dog mercenaries. They could make an impervious trench system in but a fraction of the time that a pony would take to make even a basic one."
  tech_ironpaws_a:0 "Pack Tactics"
  tech_ironpaws_a_desc:0 "Diamond Dogs, being related to canines, retained much of their instinctual pack tactics. While they don't have an actual mental connection, like the Alicorns of Unity, they would often be able to work as a single whole through instincts alone."
  tech_ironpaws_b:0 "Howls"
  tech_ironpaws_b_desc:0 "Howls are the most famous tactic of feared Ironpaw mercenaries, both used to intimidate enemies, and to communicate to allies. The intimidation factor alone would often win battles. Duke's Diggers, a famous Diamond Dog mercenary company, put down a revolt in Neocastle through howling alone."
  tech_ironpaws_c:0 "Dogwhistles"
  tech_ironpaws_c_desc:0 "Whistles such as this make a sound at such a high frequency that pony ears cannot hear it, but dog ears can. Once Diamond Dogs realized that ponies couldn't hear these whistles, they began to use them en masse for all Ironpaws, able to communicate almost silently."
