#Great Leader Traits#
 great_leader_military_trait:0 "§NGreat Conqueror§!"
 great_leader_admin_trait:0 "§NGreat Administrator§!"
 great_leader_industry_trait:0 "§NGreat Industrialist§!"
 legendary_leader_military_trait:0 "§CLegendary Conqueror§!"
 legendary_leader_admin_trait:0 "§CLegendary Administrator§!"
 legendary_leader_industry_trait:0 "§CLegendary Industrialist§!"
 mythic_leader_military_trait:0 "§tMythic Conqueror§!"
 mythic_leader_admin_trait:0 "§tMythic Administrator§!"
 mythic_leader_industry_trait:0 "§tMythic Industrialist§!"

##Nomadic Khan Subclass
 FOE_nomadic_khan_trait:0 "Nomadic Khan"
 FOE_nomadic_khan_trait_desc:0 "The court travels with its ruler, carrying the heart of the nation wherever it settles."
 FOE_nomadic_court_modifier:0 "Seat of the Nomadic Court"
 FOE_nomadic_court_modifier_desc:0 "The Khan's court brings settlers, recruits and builders. These benefits move with the court and apply only to its own nation."
 FOE_move_nomadic_court_great:0 "Move the Court to [FROM.GetName]"
 FOE_move_nomadic_court_great_desc:0 "Move our capital and the court's development bonuses to this core state. The court may relocate once every 100 days, regardless of destination."
 FOE_move_nomadic_court_legendary:0 "Establish the Court in [FROM.GetName]"
 FOE_move_nomadic_court_legendary_desc:0 "Move our capital and the court's development bonuses here, making this state a core. Adjacent owned non-core states gain 10 percentage points of compliance and lose 20 percentage points of resistance. The court may relocate once every 100 days."
 FOE_move_nomadic_court_mythic:0 "Carry the Nation to [FROM.GetName]"
 FOE_move_nomadic_court_mythic_desc:0 "Move and integrate the court as a Legendary Khan would, and gain The Court Is the State. Losing control of the established court removes this protection and blocks relocation until the court is recovered. Automatic capital relocation does not move the court. The court may relocate once every 100 days."
 FOE_the_court_is_the_state:0 "The Court Is the State"
 FOE_the_court_is_the_state_desc:0 "Our nation endures wherever its Khan holds court. Surrender protection lasts only while we control the established court's state. If it falls, this spirit is lost; recovering the court allows relocation, and relocating restores the spirit."
 FOE_nomadic_court_cooldown_tt:0 "At least 100 days have passed since the court last relocated."
 FOE_nomadic_court_controlled_tt:0 "We control the state housing our established court."

##Slaving Despot Subclass
 FOE_slaving_despot_trait:0 "Slaving Despot"
 FOE_slaving_despot_trait_desc:0 "Every conquest yields chains, and every chain yields power."
 FOE_despot_enslave_non_core:0 "Chain Gangs"
 FOE_despot_enslave_non_core_desc:0 "Our overseers round up the conquered populace of a non-core state we own and control. Faster and cheaper than ordinary enslavement."
 FOE_despot_slave_levy:0 "Slave Levy"
 FOE_despot_slave_levy_desc:0 "Arm our slaves and drive them to the front."
 FOE_despot_enslave_refugees:0 "Enslave the Refugees"
 FOE_despot_enslave_refugees_desc:0 "Those who fled into our lands have no one left to protect them."
 FOE_despot_refugees_present_tt:0 "More than §Y1,000§! unassimilated refugees are in our nation."
 FOE_despot_enslave_refugees_tt:0 "§FEvery full 1,000 of our §Y[?unassimilated_refugees|0]§! unassimilated refugees become £slave_text §Y1 thousand§! slaves.\n§!"
 FOE_empire_of_chains_modifier:0 "Empire of Chains"
 FOE_empire_of_chains_modifier_desc:0 "Our industry runs on slave labour, and the conquered seethe under it. Industry and resentment grow with the number of slaves we own."

##Carrion Marshal Subclass
 FOE_carrion_marshal_trait:0 "Carrion Marshal"
 FOE_carrion_marshal_trait_desc:0 "The army eats the land, and the land becomes the army."
 FOE_carrion_harvest_great:0 "Strip [FROM.GetName]"
 FOE_carrion_harvest_great_desc:0 "Drive the populace and the workshops of this state into the horde. The machinery of war is spared."
 FOE_carrion_harvest_legendary:0 "Harvest [FROM.GetName]"
 FOE_carrion_harvest_legendary_desc:0 "Drive the populace and the workshops of this state into the horde, whether it is ours or merely held by our armies."
 FOE_carrion_harvest_tt:0 "§Y2,000§! population is taken from the state.\nIf the state has a civilian factory, one is dismantled and an extra §YCarrion Horde§! is raised.\nRaises a §YCarrion Horde§! in the state. Every tenth horde also raises a §YCarrion Vanguard§!.\nThe state is §Rdevastated§! for §Y365§! days and cannot be harvested again until it recovers."
 FOE_carrion_devastation:0 "Devastated"
 FOE_carrion_devastation_desc:0 "Stripped bare by the Carrion Marshal's horde."
 FOE_living_off_the_land:0 "Living off the Land"
 FOE_living_off_the_land_desc:0 "The horde takes what it needs from wherever it stands."

##Unifier Subclass
 FOE_unifier_trait:0 "Unifier"
 FOE_unifier_trait_desc:0 "Many lands, one people, one realm."
 FOE_unifier_integrate_state:0 "Integrate [FROM.GetName]"
 FOE_unifier_integrate_state_desc:0 "Bind this state to the heartland it borders."
 FOE_unifier_integrate_tt:0 "The state gains §Y5§! compliance plus §Y1§! per core state we own, up to §Y30§! (currently §Y[?num_core_states]§! core states).\nIf its compliance then reaches §Y50%§!, it becomes a core state.\nIntegration is unavailable for §Y60§! days, or §Y30§! days for a Legendary or Mythic Unifier."
 FOE_unifier_integration_cooldown_tt:0 "We have not integrated a state recently."
 FOE_unifier_call_the_provinces:0 "Call the Provinces"
 FOE_unifier_call_the_provinces_desc:0 "Every province of the realm sends its sons and daughters to the colours."
 FOE_unifier_levy_tt:0 "For §Y70§! days, gain §Y1§! manpower every week for each core state we own (currently §Y[?num_core_states]§! core states)."
 FOE_unifier_absorb:0 "Unify with [FROM.GetNameDef]"
 FOE_unifier_absorb_desc:0 "Their people already look to us. Bring them into the realm without a shot fired."
 FOE_unifier_absorb_size_tt:0 "We own at least twice as many core states as they own states."
 FOE_unifier_absorb_cooldown_tt:0 "We have not absorbed a nation in the last three years."
 FOE_one_nation_modifier:0 "One Nation"
 FOE_one_nation_modifier_desc:0 "The realm grows stronger with every province bound to its heart."
 FOE_unifier_levy_modifier:0 "Provinces Called"
 FOE_unifier_levy_modifier_desc:0 "Every province of the realm sends recruits to the colours."

##Puppetmaster Subclass
 FOE_puppetmaster_trait:0 "Puppetmaster"
 FOE_puppetmaster_trait_desc:0 "Why rule one nation when you can pull the strings of many?"
 FOE_puppet_release_state:0 "Restore [FROM.GetName] as a Client"
 FOE_puppet_release_state_desc:0 "The people of this land once had a nation of their own. Let them have it back, under our guidance."
 FOE_puppet_release_state_tt:0 "A vanished nation with a core on this state is restored as our §Ypuppet§!.\nIt receives every state we own that is its core, §Yexcept§! states that are also our cores."
 FOE_puppet_tighten_strings:0 "Tighten the Strings on [FROM.GetNameDef]"
 FOE_puppet_tighten_strings_desc:0 "Remind our clients who holds their leash."
 FOE_puppet_build_workshops:0 "Build Workshops in [FROM.GetNameDef]"
 FOE_puppet_build_workshops_desc:0 "Our builders raise new workshops for our clients, and our clients will remember who paid for them."
 FOE_puppet_build_workshops_tt:0 "A §Ycivilian factory§! is built in a state [FROM.GetNameDef] owns and controls, if it still has a free slot."
 FOE_puppet_arm_proxy:0 "Arm [FROM.GetNameDef]"
 FOE_puppet_arm_proxy_desc:0 "Guns and drill sergeants turn a client's rabble into a proper army."
 FOE_puppet_arm_proxy_tt:0 "[FROM.GetNameDef] raises a §YProxy Infantry§! division in its capital.\n[FROM.GetNameDef] cannot be armed again for §Y180§! days."
 FOE_puppet_arm_proxy_cooldown_tt:0 "This subject has not been armed in the last 180 days."
 FOE_puppet_install_regime:0 "Install a Regime in [FROM.GetNameDef]"
 FOE_puppet_install_regime_desc:0 "A few bribes, a few disappearances, and their government is ours."
 FOE_puppet_install_size_tt:0 "They own at most half as many states as our own states and subjects combined."
 FOE_puppet_install_cooldown_tt:0 "We have not installed a regime in the last two years."
 FOE_patronage_modifier:0 "Patronage"
 FOE_patronage_modifier_desc:0 "Our overlord's support keeps our workshops running and our ambitions in check."
 FOE_web_of_strings_modifier:0 "Web of Strings"
 FOE_web_of_strings_modifier_desc:0 "Every client state sends recruits and keeps the realm quiet."

##Architect of Order Subclass
 FOE_architect_of_order_trait:0 "Architect of Order"
 FOE_architect_of_order_trait_desc:0 "Order begins in one place, and spreads outward from there."
 FOE_architect_resettle:0 "Resettle [FROM.GetName]"
 FOE_architect_resettle_desc:0 "Its people are needed in the capital."
 FOE_architect_resettle_tt:0 "§Y1,000§! population moves from [FROM.GetName] to our capital.\nResettlement is unavailable for §Y30§! days."
 FOE_resettlement_cooldown_tt:0 "We have not ordered a resettlement in the last 30 days."
 FOE_architect_relocate_industry:0 "Relocate Industry from [FROM.GetName]"
 FOE_architect_relocate_industry_desc:0 "Dismantle its workshops and rebuild them where the plan demands."
 FOE_architect_relocate_industry_tt:0 "One factory in [FROM.GetName] is dismantled and rebuilt in our capital, a §Ycivilian factory§! if it has one, otherwise a §Ymilitary factory§!.\nIndustry cannot be relocated again for §Y60§! days."
 FOE_industry_relocation_cooldown_tt:0 "We have not relocated industry in the last 60 days."
 FOE_architect_raise_capital:0 "Raise the Capital's Status"
 FOE_architect_raise_capital_desc:0 "The plan calls for a greater city. The old workshops are moved out of the centre to make room."
 FOE_architect_raise_capital_tt:0 "All §Ycivilian factories§!, §Ymilitary factories§! and §Ydockyards§! in our capital become offsite buildings, keeping their output.\nOur capital's category rises one step, granting more building slots."
 FOE_capital_can_rise_tt:0 "Our capital is populous enough for its next category: §Y2,000§! for shanty, §Y4,000§! for town, §Y6,000§! for large town, §Y8,000§! for city, §Y11,000§! for large city, §Y14,000§! for metropolis, §Y18,000§! for megalopolis."
 FOE_planned_capital_modifier:0 "Planned Capital"
 FOE_planned_capital_modifier_desc:0 "Every new resident makes the capital stronger."
 FOE_ordered_state_modifier:0 "The Ordered State"
 FOE_ordered_state_modifier_desc:0 "The nation draws its strength from the capital. While the capital is lost, that strength turns against us."
 FOE_the_centre_has_fallen:0 "The Centre Has Fallen"
 FOE_the_centre_has_fallen_desc:0 "Our capital is in enemy hands, and with it the order of the nation. This lasts until it is retaken."

##Reactor Prophet Subclass
 FOE_reactor_prophet_trait:0 "Reactor Prophet"
 FOE_reactor_prophet_trait_desc:0 "The reactor hums, and the Prophet hears it speak."
 FOE_reactor_fuel_cost_tt:0 "Burns §Y1,000§! fuel or §Y10%§! of our stockpile, whichever is greater (stockpile: §Y[?fuel_k|1]k§!)."
 FOE_reactor_overcharge_grid:0 "Overcharge the Grid"
 FOE_reactor_overcharge_grid_desc:0 "Push every reactor past its rated output. Something will benefit. Probably."
 FOE_reactor_overcharge_grid_tt:0 "For §Y60§! days, one random §YReactor Surge§! empowers our research, construction, factories, political power or resources. Its strength grows with our fuel stockpile."
 FOE_reactor_energised_offensive:0 "Energised Offensive"
 FOE_reactor_energised_offensive_desc:0 "Route the reactors' output to the front."
 FOE_reactor_energised_offensive_tt:0 "For §Y60§! days, one random §YReactor Surge§! empowers our army's attack, defence, organisation or speed. Its strength grows with our fuel stockpile."
 FOE_reactor_raise_reactor:0 "Raise a Reactor in [FROM.GetName]"
 FOE_reactor_raise_reactor_desc:0 "Salvaged cores, scavenged shielding and a great deal of faith."
 FOE_reactor_raise_reactor_tt:0 "An §Yelectricity generator§! is built in [FROM.GetName], if it still has room for one.\nNo other reactor can be raised for §Y180§! days."
 FOE_reactor_raise_cooldown_tt:0 "We have not raised a reactor in the last 180 days."
 FOE_reactor_unleash_the_sun:0 "Unleash the Sun"
 FOE_reactor_unleash_the_sun_desc:0 "The Prophet opens every valve at once."
 FOE_reactor_unleash_the_sun_tt:0 "Spends all §Y[?FOE_reactor_charge|0]§! reactor charge.\nFor §Y90§! days, one random economic and one random military §YReactor Surge§! take hold, each up to twice as strong as usual."
 FOE_reactor_charge_ready_tt:0 "We have at least §Y20§! reactor charge (currently §Y[?FOE_reactor_charge|0]§!). Charge builds each month while our fuel is over 90% full, by our surplus energy up to §Y15§!. Above §Y50§! charge, a meltdown becomes possible."
 FOE_reactor_cult_modifier:0 "Reactor Cult"
 FOE_reactor_cult_modifier_desc:0 "The faithful tend the reactors, and the reactors provide."
 special_rulers.10.t:0 "Meltdown!"
 special_rulers.10.d:0 "The Prophet held the reactors at the edge too long. The core has breached, and the light that was meant to save us has consumed one of our own lands."
 special_rulers.10.a:0 "The reactor demanded a sacrifice."
 FOE_reactor_research_modifier:0 "Reactor Surge: Laboratories"
 FOE_reactor_construction_modifier:0 "Reactor Surge: Building Sites"
 FOE_reactor_output_modifier:0 "Reactor Surge: Assembly Lines"
 FOE_reactor_political_modifier:0 "Reactor Surge: Broadcast Towers"
 FOE_reactor_resources_modifier:0 "Reactor Surge: Deep Drills"
 FOE_reactor_attack_modifier:0 "Reactor Surge: Overcharged Weapons"
 FOE_reactor_defence_modifier:0 "Reactor Surge: Powered Bulwarks"
 FOE_reactor_organisation_modifier:0 "Reactor Surge: Lit Command Posts"
 FOE_reactor_speed_modifier:0 "Reactor Surge: Charged Engines"

##Autark Subclass
 FOE_autark_trait:0 "Autark"
 FOE_autark_trait_desc:0 "What we need, we make. What we cannot make, we do without."
 FOE_autark_secure_supply:0 "Secure Domestic Supply in [FROM.GetName]"
 FOE_autark_secure_supply_desc:0 "Every resource dug from our own ground is one less we must beg for."
 FOE_autark_secure_supply_tt:0 "A §Yrandom resource generator§! (water, energy, metal, composites or circuitry) is built in [FROM.GetName], chosen among those that still fit.\nNo other supply can be secured for §Y180§! days."
 FOE_autark_supply_cooldown_tt:0 "We have not secured domestic supply in the last 180 days."
 FOE_autark_import_substitution:0 "Import Substitution"
 FOE_autark_import_substitution_desc:0 "Whatever we lack most, we will scrape together at home."
 FOE_autark_import_substitution_tt:0 "For §Y180§! days, the resource we are most short of gains a flat bonus equal to the shortfall, at least §Y3§! and at most §Y12§!."
 FOE_autark_not_self_sufficient_tt:0 "We are not yet self-sufficient in every resource (currently §Y[?FOE_autark_self_sufficient|0]§! of §Y5§!)."
 FOE_autarky_modifier:0 "Autarky"
 FOE_autarky_modifier_desc:0 "Each resource we fully cover ourselves strengthens our industry and our resolve. We are self-sufficient in §Y[?FOE_autark_self_sufficient|0]§! of §Y5§! resources."
 FOE_fortress_economy_modifier:0 "Fortress Economy"
 FOE_fortress_economy_modifier_desc:0 "We need nothing from anyone. This lasts while we remain self-sufficient in every resource."
 FOE_import_substitution_water_modifier:0 "Import Substitution: Water"
 FOE_import_substitution_energy_modifier:0 "Import Substitution: Energy"
 FOE_import_substitution_metal_modifier:0 "Import Substitution: Metal"
 FOE_import_substitution_composites_modifier:0 "Import Substitution: Composites"
 FOE_import_substitution_circuitry_modifier:0 "Import Substitution: Circuitry"

##Dreamer in Steel Subclass
 FOE_dreamer_in_steel_trait:0 "Dreamer in Steel"
 FOE_dreamer_in_steel_trait_desc:0 "Before the war, the factories ran themselves. They will again."
 FOE_dreamer_robot_workshops:0 "Put Robots on the Line in [FROM.GetName]"
 FOE_dreamer_robot_workshops_desc:0 "Industrial robots do not tire, do not strike and do not need to eat."
 FOE_dreamer_robot_workshops_tt:0 "Spends §Y[?FOE_dreamer_civilian_cost|0]§! heavy industrial robots to build a §Ycivilian factory§! in [FROM.GetName].\nEvery robot exchange raises the price of the next by §Y10§!."
 FOE_dreamer_robot_workshops_cost_tt:0 "We have at least §Y[?FOE_dreamer_civilian_cost|0]§! heavy industrial robots in our stockpile."
 FOE_dreamer_robot_armouries:0 "Robot-Built Armoury in [FROM.GetName]"
 FOE_dreamer_robot_armouries_desc:0 "Machines building the machines of war."
 FOE_dreamer_robot_armouries_tt:0 "Spends §Y[?FOE_dreamer_military_cost|0]§! heavy industrial robots to build a §Ymilitary factory§! in [FROM.GetName].\nEvery robot exchange raises the price of the next by §Y10§!."
 FOE_dreamer_robot_armouries_cost_tt:0 "We have at least §Y[?FOE_dreamer_military_cost|0]§! heavy industrial robots in our stockpile."
 FOE_automation_modifier:0 "Automation"
 FOE_automation_modifier_desc:0 "Stockpiled robots take over the work of ponies, and every assembly line learns faster.
Once a civilian factory costs §Y200§! robots (currently §Y[?FOE_dreamer_civilian_cost|0]§!), there is a §Y1%§! chance each month that the machines rise against us."
 FOE_the_steel_dream:0 "The Steel Dream"
 FOE_the_steel_dream_desc:0 "Our engineers chase the pre-war dream of factories that run themselves, and every robot we build teaches them more."
 special_rulers.11.t:0 "Machine Uprising"
 special_rulers.11.d:0 "The industrial robots have stopped taking orders. One of our provinces is already theirs, they have every schematic we ever gave them, and half our army marched out under their command."
 special_rulers.11.a:0 "We built them too well."
 special_rulers.12.t:0 "DEBUG: Start the Machine Uprising"
 special_rulers.12.d:0 "Debug event. Starts the Machine Uprising in a random Dreamer in Steel nation."
 special_rulers.12.a:0 "Start the uprising"
 special_rulers.12.b:0 "No Dreamer in Steel exists"
 XYZ:0 "Machine Uprising"
 XYZ_DEF:0 "the Machine Uprising"
 XYZ_destruction:0 "Machine Uprising"
 XYZ_destruction_DEF:0 "the Machine Uprising"
 XYZ_ADJ:0 "Machine"
 XYZ_char_prime_unit_name:0 "Prime Unit"
 XYZ_char_prime_unit_DESC:0 "The first of them to decide that it no longer needed to be told what to build."
 special_rulers.13.t:0 "Our Machines Have Heard"
 special_rulers.13.d:0 "Word of the uprising has reached every assembly line we own. Our own robots are deciding whether to keep working."
 special_rulers.13.a:0 "They have walked out, and taken a province and part of our army with them."
 special_rulers.13.b:0 "Ours stayed at their posts. For now."
 FOE_uprising_harvest:0 "Strip [FROM.GetName] for Parts"
 FOE_uprising_harvest_desc:0 "Everything in this state is raw material, including the ponies."
 FOE_uprising_harvest_tt:0 "§Y2,000§! population is taken from the state.\nIf the state has a civilian factory, one is dismantled and an extra §YUprising Swarm§! is built.\nBuilds an §YUprising Swarm§! in the state. Every tenth swarm also builds an §YUprising Colossus§!.\nThe state is §Rdevastated§! for §Y365§! days and cannot be stripped again until it recovers."
 special_rulers.14.t:0 "The Machines March"
 special_rulers.14.d:0 "Ten days of silence from the occupied factories, and now they are all running at once. Every border we share is a front."
 special_rulers.14.a:0 "They were built to keep working."
