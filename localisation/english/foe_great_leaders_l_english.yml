l_english:

#Great Leader Traits#
 great_leader_military_trait:0 "§NGreat Conqueror§!"
 great_leader_admin_trait:0 "§NGreat Administrator§!"
 great_leader_industry_trait:0 "§NGreat Industrialist§!"
 legendary_leader_military_trait:0 "§CLegendary Conqueror§!"
 legendary_leader_admin_trait:0 "§CLegendary Administrator§!"
 legendary_leader_industry_trait:0 "§CLegendary Industrialist§!"
 mythic_leader_military_trait:0 "§tMythic Conqueror§!"
 mythic_leader_admin_trait:0 "§tMythic Administrator§!"
 mythic_leader_industry_trait:0 "§tMythic Industrialist§!"
 mythic_leader_ruler_trait:0 "§tMythic Ruler§!\n§RMulticlass: §cConqueror§! + §GAdministrator§!§!"
 mythic_leader_exploiter_trait:0 "§tMythic Exploiter§!\n§RMulticlass: §cConqueror§! + §YIndustrialist§!§!"
 mythic_leader_magnate_trait:0 "§tMythic Magnate§!\n§RMulticlass: §YIndustrialist§! + §GAdministrator§!§!"

##Nomadic Khan Subclass
 FOE_nomadic_khan_trait:0 "Nomadic Khan"
 FOE_nomadic_khan_trait_desc:0 "The court travels with its ruler, carrying the heart of the nation wherever it settles."
 FOE_nomadic_court_modifier:0 "Seat of the Nomadic Court"
 FOE_nomadic_court_modifier_desc:0 "The Khan's court brings settlers, recruits and builders. These benefits move with the court and apply only to its own nation."
 FOE_move_nomadic_court_great:0 "Move the Court to [FROM.GetName]"
 FOE_move_nomadic_court_great_desc:0 "Move our capital and the court's development bonuses to this core state. The court may relocate once every 100 days, regardless of destination."
 FOE_move_nomadic_court_legendary:0 "Establish the Court in [FROM.GetName]"
 FOE_move_nomadic_court_legendary_desc:0 "Move our capital and the court's development bonuses here, making this state a core. Adjacent owned non-core states gain 10 percentage points of compliance and lose 20 percentage points of resistance. The court may relocate once every 100 days."
 FOE_move_nomadic_court_mythic:0 "Carry the Nation to [FROM.GetName]"
 FOE_move_nomadic_court_mythic_desc:0 "Move and integrate the court as a Legendary Khan would, and gain The Court Is the State. Losing control of the established court removes this protection and blocks relocation until the court is recovered. Automatic capital relocation does not move the court. The court may relocate once every 100 days."
 FOE_the_court_is_the_state:0 "The Court Is the State"
 FOE_the_court_is_the_state_desc:0 "Our nation endures wherever its Khan holds court. Surrender protection lasts only while we control the established court's state. If it falls, this spirit is lost; recovering the court allows relocation, and relocating restores the spirit."
 FOE_nomadic_court_cooldown_tt:0 "At least 100 days have passed since the court last relocated."
 FOE_nomadic_court_controlled_tt:0 "We control the state housing our established court."

##Slaving Despot Subclass
 FOE_slaving_despot_trait:0 "Slaving Despot"
 FOE_slaving_despot_trait_desc:0 "Every conquest yields chains, and every chain yields power."
 FOE_despot_enslave_non_core:0 "Chain Gangs"
 FOE_despot_enslave_non_core_desc:0 "Our overseers round up the conquered populace of a non-core state we own and control. Faster and cheaper than ordinary enslavement."
 FOE_despot_slave_levy:0 "Slave Levy"
 FOE_despot_slave_levy_desc:0 "Arm our slaves and drive them to the front."
 FOE_despot_enslave_refugees:0 "Enslave the Refugees"
 FOE_despot_enslave_refugees_desc:0 "Those who fled into our lands have no one left to protect them."
 FOE_despot_refugees_present_tt:0 "More than §Y1,000§! unassimilated refugees are in our nation."
 FOE_despot_enslave_refugees_tt:0 "§FEvery full 1,000 of our §Y[?unassimilated_refugees|0]§! unassimilated refugees become £slave_text §Y1 thousand§! slaves.\n§!"
 FOE_empire_of_chains_modifier:0 "Empire of Chains"
 FOE_empire_of_chains_modifier_desc:0 "Our industry runs on slave labour, and the conquered seethe under it. Industry and resentment grow with the number of slaves we own."

##Carrion Marshal Subclass
 FOE_carrion_marshal_trait:0 "Carrion Marshal"
 FOE_carrion_marshal_trait_desc:0 "The army eats the land, and the land becomes the army."
 FOE_carrion_harvest_great:0 "Strip [FROM.GetName]"
 FOE_carrion_harvest_great_desc:0 "Drive the populace and the workshops of this state into the horde. The machinery of war is spared."
 FOE_carrion_harvest_legendary:0 "Harvest [FROM.GetName]"
 FOE_carrion_harvest_legendary_desc:0 "Drive the populace and the workshops of this state into the horde, whether it is ours or merely held by our armies."
 FOE_carrion_harvest_tt:0 "§Y2,000§! population is taken from the state.\nIf the state has a civilian factory, one is dismantled and an extra §YCarrion Horde§! is raised.\nRaises a §YCarrion Horde§! in the state. Every tenth horde also raises a §YCarrion Vanguard§!.\nThe state is §Rdevastated§! for §Y365§! days and cannot be harvested again until it recovers."
 FOE_carrion_devastation:0 "Devastated"
 FOE_carrion_devastation_desc:0 "Stripped bare by the Carrion Marshal's horde."
 FOE_living_off_the_land:0 "Living off the Land"
 FOE_living_off_the_land_desc:0 "The horde takes what it needs from wherever it stands."

##Unifier Subclass
 FOE_unifier_trait:0 "Unifier"
 FOE_unifier_trait_desc:0 "Many lands, one people, one realm."
 FOE_unifier_integrate_state:0 "Integrate [FROM.GetName]"
 FOE_unifier_integrate_state_desc:0 "Bind this state to the heartland it borders."
 FOE_unifier_integrate_tt:0 "The state gains §Y5§! compliance plus §Y1§! per core state we own, up to §Y30§! (currently §Y[?num_core_states]§! core states).\nIf its compliance then reaches §Y50%§!, it becomes a core state.\nIntegration is unavailable for §Y60§! days, or §Y30§! days for a Legendary or Mythic Unifier."
 FOE_unifier_integration_cooldown_tt:0 "We have not integrated a state recently."
 FOE_unifier_call_the_provinces:0 "Call the Provinces"
 FOE_unifier_call_the_provinces_desc:0 "Every province of the realm sends its sons and daughters to the colours."
 FOE_unifier_levy_tt:0 "For §Y70§! days, gain §Y1§! manpower every week for each core state we own (currently §Y[?num_core_states]§! core states)."
 FOE_unifier_absorb:0 "Unify with [FROM.GetNameDef]"
 FOE_unifier_absorb_desc:0 "Their people already look to us. Bring them into the realm without a shot fired."
 FOE_unifier_absorb_size_tt:0 "We own at least twice as many core states as they own states."
 FOE_unifier_absorb_cooldown_tt:0 "We have not absorbed a nation in the last three years."
 FOE_one_nation_modifier:0 "One Nation"
 FOE_one_nation_modifier_desc:0 "The realm grows stronger with every province bound to its heart."
 FOE_unifier_levy_modifier:0 "Provinces Called"
 FOE_unifier_levy_modifier_desc:0 "Every province of the realm sends recruits to the colours."

##Puppetmaster Subclass
 FOE_puppetmaster_trait:0 "Puppetmaster"
 FOE_puppetmaster_trait_desc:0 "Why rule one nation when you can pull the strings of many?"
 FOE_puppet_release_state:0 "Restore [FROM.GetName] as a Client"
 FOE_puppet_release_state_desc:0 "The people of this land once had a nation of their own. Let them have it back, under our guidance."
 FOE_puppet_release_state_tt:0 "A vanished nation with a core on this state is restored as our §Ypuppet§!.\nIt receives every state we own that is its core, §Yexcept§! states that are also our cores."
 FOE_puppet_tighten_strings:0 "Tighten the Strings on [FROM.GetNameDef]"
 FOE_puppet_tighten_strings_desc:0 "Remind our clients who holds their leash."
 FOE_puppet_build_workshops:0 "Build Workshops in [FROM.GetNameDef]"
 FOE_puppet_build_workshops_desc:0 "Our builders raise new workshops for our clients, and our clients will remember who paid for them."
 FOE_puppet_build_workshops_tt:0 "A §Ycivilian factory§! is built in a state [FROM.GetNameDef] owns and controls, if it still has a free slot."
 FOE_puppet_arm_proxy:0 "Arm [FROM.GetNameDef]"
 FOE_puppet_arm_proxy_desc:0 "Guns and drill sergeants turn a client's rabble into a proper army."
 FOE_puppet_arm_proxy_tt:0 "[FROM.GetNameDef] raises a §YProxy Infantry§! division in its capital.\n[FROM.GetNameDef] cannot be armed again for §Y180§! days."
 FOE_puppet_arm_proxy_cooldown_tt:0 "This subject has not been armed in the last 180 days."
 FOE_puppet_install_regime:0 "Install a Regime in [FROM.GetNameDef]"
 FOE_puppet_install_regime_desc:0 "A few bribes, a few disappearances, and their government is ours."
 FOE_puppet_install_size_tt:0 "They own at most half as many states as our own states and subjects combined."
 FOE_puppet_install_cooldown_tt:0 "We have not installed a regime in the last two years."
 FOE_patronage_modifier:0 "Patronage"
 FOE_patronage_modifier_desc:0 "Our overlord's support keeps our workshops running and our ambitions in check."
 FOE_web_of_strings_modifier:0 "Web of Strings"
 FOE_web_of_strings_modifier_desc:0 "Every client state sends recruits and keeps the realm quiet."

##Architect of Order Subclass
 FOE_architect_of_order_trait:0 "Architect of Order"
 FOE_architect_of_order_trait_desc:0 "Order begins in one place, and spreads outward from there."
 FOE_architect_resettle:0 "Resettle [FROM.GetName]"
 FOE_architect_resettle_desc:0 "Its people are needed in the capital."
 FOE_architect_resettle_tt:0 "§Y1,000§! population moves from [FROM.GetName] to our capital.\nResettlement is unavailable for §Y30§! days."
 FOE_resettlement_cooldown_tt:0 "We have not ordered a resettlement in the last 30 days."
 FOE_architect_relocate_industry:0 "Relocate Industry from [FROM.GetName]"
 FOE_architect_relocate_industry_desc:0 "Dismantle its workshops and rebuild them where the plan demands."
 FOE_architect_relocate_industry_tt:0 "One factory in [FROM.GetName] is dismantled and rebuilt in our capital, a §Ycivilian factory§! if it has one, otherwise a §Ymilitary factory§!.\nIndustry cannot be relocated again for §Y60§! days."
 FOE_industry_relocation_cooldown_tt:0 "We have not relocated industry in the last 60 days."
 FOE_architect_raise_capital:0 "Raise the Capital's Status"
 FOE_architect_raise_capital_desc:0 "The plan calls for a greater city. The old workshops are moved out of the centre to make room."
 FOE_architect_raise_capital_tt:0 "All §Ycivilian factories§!, §Ymilitary factories§! and §Ydockyards§! in our capital become offsite buildings, keeping their output.\nOur capital's category rises one step, granting more building slots."
 FOE_capital_can_rise_tt:0 "Our capital is populous enough for its next category: §Y2,000§! for shanty, §Y4,000§! for town, §Y6,000§! for large town, §Y8,000§! for city, §Y11,000§! for large city, §Y14,000§! for metropolis, §Y18,000§! for megalopolis."
 FOE_planned_capital_modifier:0 "Planned Capital"
 FOE_planned_capital_modifier_desc:0 "Every new resident makes the capital stronger."
 FOE_ordered_state_modifier:0 "The Ordered State"
 FOE_ordered_state_modifier_desc:0 "The nation draws its strength from the capital. While the capital is lost, that strength turns against us."
 FOE_the_centre_has_fallen:0 "The Centre Has Fallen"
 FOE_the_centre_has_fallen_desc:0 "Our capital is in enemy hands, and with it the order of the nation. This lasts until it is retaken."

##Reactor Prophet Subclass
 FOE_reactor_prophet_trait:0 "Reactor Prophet"
 FOE_reactor_prophet_trait_desc:0 "The reactor hums, and the Prophet hears it speak."
 FOE_reactor_fuel_cost_tt:0 "Burns §Y1,000§! fuel or §Y10%§! of our stockpile, whichever is greater (stockpile: §Y[?fuel_k|1]k§!)."
 FOE_reactor_overcharge_grid:0 "Overcharge the Grid"
 FOE_reactor_overcharge_grid_desc:0 "Push every reactor past its rated output. Something will benefit. Probably."
 FOE_reactor_overcharge_grid_tt:0 "For §Y60§! days, one random §YReactor Surge§! empowers our research, construction, factories, political power or resources. Its strength grows with our fuel stockpile."
 FOE_reactor_energised_offensive:0 "Energised Offensive"
 FOE_reactor_energised_offensive_desc:0 "Route the reactors' output to the front."
 FOE_reactor_energised_offensive_tt:0 "For §Y60§! days, one random §YReactor Surge§! empowers our army's attack, defence, organisation or speed. Its strength grows with our fuel stockpile."
 FOE_reactor_raise_reactor:0 "Raise a Reactor in [FROM.GetName]"
 FOE_reactor_raise_reactor_desc:0 "Salvaged cores, scavenged shielding and a great deal of faith."
 FOE_reactor_raise_reactor_tt:0 "An §Yelectricity generator§! is built in [FROM.GetName], if it still has room for one.\nNo other reactor can be raised for §Y180§! days."
 FOE_reactor_raise_cooldown_tt:0 "We have not raised a reactor in the last 180 days."
 FOE_reactor_unleash_the_sun:0 "Unleash the Sun"
 FOE_reactor_unleash_the_sun_desc:0 "The Prophet opens every valve at once."
 FOE_reactor_unleash_the_sun_tt:0 "Spends all §Y[?FOE_reactor_charge|0]§! reactor charge.\nFor §Y90§! days, one random economic and one random military §YReactor Surge§! take hold, each up to twice as strong as usual."
 FOE_reactor_charge_ready_tt:0 "We have at least §Y20§! reactor charge (currently §Y[?FOE_reactor_charge|0]§!). Charge builds each month while our fuel is over 90% full, by our surplus energy up to §Y15§!. Above §Y50§! charge, a meltdown becomes possible."
 FOE_reactor_cult_modifier:0 "Reactor Cult"
 FOE_reactor_cult_modifier_desc:0 "The faithful tend the reactors, and the reactors provide."
 special_rulers.10.t:0 "Meltdown!"
 special_rulers.10.d:0 "The Prophet held the reactors at the edge too long. The core has breached, and the light that was meant to save us has consumed one of our own lands."
 special_rulers.10.a:0 "The reactor demanded a sacrifice."
 FOE_reactor_research_modifier:0 "Reactor Surge: Laboratories"
 FOE_reactor_construction_modifier:0 "Reactor Surge: Building Sites"
 FOE_reactor_output_modifier:0 "Reactor Surge: Assembly Lines"
 FOE_reactor_political_modifier:0 "Reactor Surge: Broadcast Towers"
 FOE_reactor_resources_modifier:0 "Reactor Surge: Deep Drills"
 FOE_reactor_attack_modifier:0 "Reactor Surge: Overcharged Weapons"
 FOE_reactor_defence_modifier:0 "Reactor Surge: Powered Bulwarks"
 FOE_reactor_organisation_modifier:0 "Reactor Surge: Lit Command Posts"
 FOE_reactor_speed_modifier:0 "Reactor Surge: Charged Engines"

##Autark Subclass
 FOE_autark_trait:0 "Autark"
 FOE_autark_trait_desc:0 "What we need, we make. What we cannot make, we do without."
 FOE_autark_secure_supply:0 "Secure Domestic Supply in [FROM.GetName]"
 FOE_autark_secure_supply_desc:0 "Every resource dug from our own ground is one less we must beg for."
 FOE_autark_secure_supply_tt:0 "A §Yrandom resource generator§! (water, energy, metal, composites or circuitry) is built in [FROM.GetName], chosen among those that still fit.\nNo other supply can be secured for §Y180§! days."
 FOE_autark_supply_cooldown_tt:0 "We have not secured domestic supply in the last 180 days."
 FOE_autark_import_substitution:0 "Import Substitution"
 FOE_autark_import_substitution_desc:0 "Whatever we lack most, we will scrape together at home."
 FOE_autark_import_substitution_tt:0 "For §Y180§! days, the resource we are most short of gains a flat bonus equal to the shortfall, at least §Y3§! and at most §Y12§!."
 FOE_autark_not_self_sufficient_tt:0 "We are not yet self-sufficient in every resource (currently §Y[?FOE_autark_self_sufficient|0]§! of §Y5§!)."
 FOE_autarky_modifier:0 "Autarky"
 FOE_autarky_modifier_desc:0 "Each resource we fully cover ourselves strengthens our industry and our resolve. We are self-sufficient in §Y[?FOE_autark_self_sufficient|0]§! of §Y5§! resources."
 FOE_fortress_economy_modifier:0 "Fortress Economy"
 FOE_fortress_economy_modifier_desc:0 "We need nothing from anyone. This lasts while we remain self-sufficient in every resource."
 FOE_import_substitution_water_modifier:0 "Import Substitution: Water"
 FOE_import_substitution_energy_modifier:0 "Import Substitution: Energy"
 FOE_import_substitution_metal_modifier:0 "Import Substitution: Metal"
 FOE_import_substitution_composites_modifier:0 "Import Substitution: Composites"
 FOE_import_substitution_circuitry_modifier:0 "Import Substitution: Circuitry"

##Dreamer in Steel Subclass
 FOE_dreamer_in_steel_trait:0 "Dreamer in Steel"
 FOE_dreamer_in_steel_trait_desc:0 "Before the war, the factories ran themselves. They will again."
 FOE_dreamer_robot_workshops:0 "Put Robots on the Line in [FROM.GetName]"
 FOE_dreamer_robot_workshops_desc:0 "Industrial robots do not tire, do not strike and do not need to eat."
 FOE_dreamer_robot_workshops_tt:0 "Spends §Y[?FOE_dreamer_civilian_cost|0]§! heavy industrial robots to build a §Ycivilian factory§! in [FROM.GetName].\nEvery robot exchange raises the price of the next by §Y10§!."
 FOE_dreamer_robot_workshops_cost_tt:0 "We have at least §Y[?FOE_dreamer_civilian_cost|0]§! heavy industrial robots in our stockpile."
 FOE_dreamer_robot_armouries:0 "Robot-Built Armoury in [FROM.GetName]"
 FOE_dreamer_robot_armouries_desc:0 "Machines building the machines of war."
 FOE_dreamer_robot_armouries_tt:0 "Spends §Y[?FOE_dreamer_military_cost|0]§! heavy industrial robots to build a §Ymilitary factory§! in [FROM.GetName].\nEvery robot exchange raises the price of the next by §Y10§!."
 FOE_dreamer_robot_armouries_cost_tt:0 "We have at least §Y[?FOE_dreamer_military_cost|0]§! heavy industrial robots in our stockpile."
 FOE_automation_modifier:0 "Automation"
 FOE_automation_modifier_desc:0 "Stockpiled robots take over the work of ponies, and every assembly line learns faster.\nOnce a civilian factory costs §Y200§! robots (currently §Y[?FOE_dreamer_civilian_cost|0]§!), there is a §Y1%§! chance each month that the machines rise against us."
 FOE_the_steel_dream:0 "The Steel Dream"
 FOE_the_steel_dream_desc:0 "Our engineers chase the pre-war dream of factories that run themselves, and every robot we build teaches them more."
 special_rulers.11.t:0 "Machine Uprising"
 special_rulers.11.d:0 "The industrial robots have stopped taking orders. One of our provinces is already theirs, they have every schematic we ever gave them, and half our army marched out under their command."
 special_rulers.11.a:0 "We built them too well."
 special_rulers.12.t:0 "DEBUG: Start the Machine Uprising"
 special_rulers.12.d:0 "Debug event. Starts the Machine Uprising in a random Dreamer in Steel nation."
 special_rulers.12.a:0 "Start the uprising"
 special_rulers.12.b:0 "No Dreamer in Steel exists"
 XYZ:0 "Machine Uprising"
 XYZ_DEF:0 "the Machine Uprising"
 XYZ_destruction:0 "Machine Uprising"
 XYZ_destruction_DEF:0 "the Machine Uprising"
 XYZ_ADJ:0 "Machine"
 XYZ_char_prime_unit_name:0 "Prime Unit"
 XYZ_char_prime_unit_DESC:0 "The first of them to decide that it no longer needed to be told what to build."
 special_rulers.13.t:0 "Our Machines Have Heard"
 special_rulers.13.d:0 "Word of the uprising has reached every assembly line we own. Our own robots are deciding whether to keep working."
 special_rulers.13.a:0 "They have walked out, and taken a province and part of our army with them."
 special_rulers.13.b:0 "Ours stayed at their posts. For now."
 FOE_uprising_harvest:0 "Strip [FROM.GetName] for Parts"
 FOE_uprising_harvest_desc:0 "Everything in this state is raw material, including the ponies."
 FOE_uprising_harvest_tt:0 "§Y2,000§! population is taken from the state.\nIf the state has a civilian factory, one is dismantled and an extra §YUprising Swarm§! is built.\nBuilds an §YUprising Swarm§! in the state. Every tenth swarm also builds an §YUprising Colossus§!.\nThe state is §Rdevastated§! for §Y365§! days and cannot be stripped again until it recovers."
 special_rulers.14.t:0 "The Machines March"
 special_rulers.14.d:0 "Ten days of silence from the occupied factories, and now they are all running at once. Every border we share is a front."
 special_rulers.14.a:0 "They were built to keep working."

##Iron Warden Subclass
 FOE_iron_warden_trait:0 "Iron Warden"
 FOE_iron_warden_trait_desc:0 "Ground taken is ground held. Every conquest is walled in and garrisoned before the next one is considered."
 FOE_warden_bastion_modifier:0 "Warden's Bastion"
 FOE_warden_bastion_modifier_desc:0 "This state has been fortified and garrisoned by an Iron Warden. The works are useless to anyone else and are torn down if the state passes to an owner who is not an Iron Warden."
 FOE_the_iron_line_modifier:0 "The Iron Line"
 FOE_the_iron_line_modifier_desc:0 "Our defences are worth as much as the ground we have actually secured. Every state we hold without a bastion cancels out one that has one."
 FOE_warden_secure_state:0 "Secure [FROM.GetName]"
 FOE_warden_secure_state_desc:0 "Wall this state in properly. The work takes months and ties up our builders, but nothing we secure is ever given back cheaply."
 FOE_warden_secure_state_tt:0 "After §Y50§! days:\nBunkers are raised to §Ylevel 2§! along the state's borders.\nThe state gains §YWarden's Bastion§! permanently, and counts towards §YThe Iron Line§!.\nA §CLegendary§! or §tMythic§! Warden also adds §Y25§! compliance and ends resistance in the state."
 FOE_the_wardens_peace:0 "The Warden's Peace"
 FOE_the_wardens_peace_desc:0 "An occupation run like a siege. The population is counted, policed and eventually resigned to us."
 FOE_the_line_holds:0 "The Line Holds"
 FOE_the_line_holds_desc:0 "Our soldiers do not give up prepared ground to advance, and our engineers begin securing every new conquest without waiting for orders."
 FOE_warden_works_modifier:0 "Warden's Works"
 FOE_warden_works_modifier_desc:0 "Our engineers are securing conquered states without waiting for orders. Each site ties up §Y3§! civilian factories until the work is finished. We can run one site per §Y30§! factories we own, up to §Y5§! at once."

##Debug Event##
 special_rulers.16.t:0 "DEBUG: Great Leader Subclasses"
 special_rulers.16.d:0 "Debug event. Gives our own country leader the Mythic Conqueror tier and a subclass, or advances a subclass's timers on demand."
 special_rulers.16.a:0 "Make our leader an Exploiter Whisper Broker"
 special_rulers.16.b:0 "Add the Whisper Broker subclass to our Exploiter"
 special_rulers.16.c:0 "Fill the Dossier, open a Black File on a neighbour if needed, and grant both infiltration tokens (Dossier: [?FOE_dossier|0])"
 special_rulers.16.e:0 "Make our leader a Magnate Deep Mine Sovereign"
 special_rulers.16.f:0 "Add the Deep Mine Sovereign subclass to our Magnate"
 special_rulers.16.g:0 "Finish a dig now (Depth: [?FOE_mine_depth_shown|0])"
 special_rulers.16.k:0 "Jump the mine to Depth 10 (starts the Bottomless Mine)"
 special_rulers.16.h:0 "Make our leader a Ruler Just Monarch"
 special_rulers.16.i:0 "Add the Just Monarch subclass to our Ruler"
 special_rulers.16.j:0 "End the Bestow Honours cooldown (General rank: [?FOE_general_rank|0])"
 special_rulers.16.l:0 "Break the bond with our Loyal General now (a new one is chosen next week)"

##Saint of War Subclass
 FOE_saint_of_war_trait:0 "Saint of War"
 FOE_saint_of_war_trait_desc:0 "Every soldier is known by name, and none are spent cheaply. Those who survive come back better."
 FOE_saint_consecrate_host:0 "Consecrate a Host"
 FOE_saint_consecrate_host_desc:0 "Gather the best of our veterans under the Saint's own banner. Few in number, and worth more than any horde."
 FOE_saint_consecrate_host_tt:0 "Costs §Y5§! army experience and §Y250§! manpower.\nRaises a §YSainted Host§! in our capital: heavy infantry and special forces with a medical company, already seasoned."
 FOE_the_veterans_rite:0 "The Veterans' Rite"
 FOE_the_veterans_rite_desc:0 "Our wounded are carried home and our veterans are kept together. Every §Y25§! victories our army gains §Y10§! army experience."
 FOE_the_saint_walks_among_them:0 "The Saint Walks Among Them"
 FOE_the_saint_walks_among_them_desc:0 "Soldiers fight harder when they have seen their Saint on the line. Every §Y25§! victories a §YSainted Host§! rises in our capital."

##Chainbreaker Subclass
 FOE_chainbreaker_trait:0 "Chainbreaker"
 FOE_chainbreaker_trait_desc:0 "No pony is property. The oppressed of the wasteland know which banner to run towards."
 FOE_crusade_modifier:0 "Crusade Against Chains"
 FOE_crusade_modifier_desc:0 "Active while we are at war with slavers, raiders or the servants of destruction. Every state taken from a slaver frees its captives, and every state taken from a raider returns what was stolen."
 FOE_chainbreaker_freed_march:0 "The Freed March With Us"
 FOE_chainbreaker_freed_march_desc:0 "Offer the refugees who came to us a choice: a home, a rifle, or a place among our veterans."
 FOE_chainbreaker_refugees_present_tt:0 "At least §Y1,000§! refugees are waiting to be settled."
 FOE_chainbreaker_freed_march_tt:0 "§Y1,000§! refugees make their choice, in four groups of §Y250§!. Each group:\n§Y60%§!: settles in one of our core states, adding §Y250§! population.\n§Y30%§!: forms a §YFreedom Brigade§! of militia in our capital.\n§Y10%§!: joins the §YCrusaders of Liberty§!, a veteran division, in our capital."
 FOE_chainbreaker_crusade:0 "Crusade Against [FROM.GetName]"
 FOE_chainbreaker_crusade_desc:0 "Their chains end at our border. Gain a war goal to annex them."

##Inward Perfectionist Subclass
 FOE_inward_perfectionist_trait:0 "Inward Perfectionist"
 FOE_inward_perfectionist_trait_desc:0 "A small nation done perfectly is worth more than a large one done badly. Every acre we hold is tended; every acre we do not is someone else's problem."
 FOE_perfection_modifier:0 "Perfection"
 FOE_perfection_modifier_desc:0 "Our bonuses grow by §G3%§! for every state we own below §Y10§!, and turn into penalties of §R3%§! for every state above it."
 FOE_against_the_giant_modifier:0 "Against the Giant"
 FOE_against_the_giant_modifier_desc:0 "The larger our enemy, the harder we fight: §G1%§! attack and defence for every state our largest enemy owns beyond our own, up to §G20%§!."
 FOE_perfected_heartland_modifier:0 "Perfected Heartland"
 FOE_perfected_heartland_modifier_desc:0 "Each level of perfection brings §G5%§! population growth, construction speed and recruitable population. At the fifth level, the state's defenders gain §G20%§! core attack and defence."
 FOE_perfectionist_perfect_heartland:0 "Perfect [FROM.GetName]"
 FOE_perfectionist_perfect_heartland_desc:0 "Tend this state until nothing in it could be better. The fifth and final level can only be reached by giving up land elsewhere."
 FOE_perfect_heartland_tt:0 "The state gains one level of §YPerfected Heartland§!, up to level §Y4§!."
 FOE_heartland_cooldown_tt:0 "We have not perfected a state in the last §Y60§! days."
 FOE_perfectionist_cede_periphery:0 "Cede [FROM.GetName]"
 FOE_perfectionist_cede_periphery_desc:0 "This land dilutes us. Take everything of value home, and let our neighbours have the rest."
 FOE_cede_periphery_tt:0 "All civilian and military factories in the state move to our core states with free slots, or become offsite buildings; dockyards become offsite buildings.\nThe state is handed to a neighbouring country we are not at war with, and our claim on it is dropped.\nOne of our states gains a level of §YPerfected Heartland§!: a level §Y4§! capital first, then any level §Y4§! state, then the capital, then any other core state."

##Diplomatic Parasite Subclass
 FOE_diplomatic_parasite_trait:0 "Diplomatic Parasite"
 FOE_diplomatic_parasite_trait_desc:0 "Why rule a neighbour when you can simply feed on it? Their crown is theirs to keep. Their output is ours."
 FOE_leeched_industry_modifier:0 "Leeched Industry"
 FOE_leeched_industry_modifier_desc:0 "A neighbour's agents, contracts and 'advisors' are draining our factories."
 FOE_leeched_levies_modifier:0 "Siphoned Levies"
 FOE_leeched_levies_modifier_desc:0 "Our young ponies are being lured across the border by a neighbour's recruiters."
 FOE_parasite_industry_modifier:0 "Fed Industry"
 FOE_parasite_industry_modifier_desc:0 "§G3%§! factory output for every neighbour whose industry we are leeching."
 FOE_parasite_levies_modifier:0 "Fed Levies"
 FOE_parasite_levies_modifier_desc:0 "§G3%§! recruitable population for every neighbour whose levies we are siphoning."
 FOE_goaded_modifier:0 "Swallowed Insult"
 FOE_goaded_modifier_desc:0 "We backed down when we were goaded, and everyone knows it. This lasts until we finally go to war with the one who goaded us."
 FOE_provoked_modifier:0 "Provoked"
 FOE_provoked_modifier_desc:0 "They struck first, exactly as planned."
 FOE_parasite_leech_industry:0 "Leech [FROM.GetName]'s Industry"
 FOE_parasite_leech_industry_desc:0 "Place our people in their factories and our contracts on their books."
 FOE_parasite_leech_industry_tt:0 "[FROM.GetName] gains §YLeeched Industry§! (§R-10%§! factory output) for §Y200§! days.\nWe gain §G3%§! factory output while it lasts."
 FOE_parasite_siphon_levies:0 "Siphon [FROM.GetName]'s Levies"
 FOE_parasite_siphon_levies_desc:0 "Their young ponies would be better paid, fed and armed on our side of the border."
 FOE_parasite_siphon_levies_tt:0 "[FROM.GetName] gains §YSiphoned Levies§! (§R-10%§! recruitable population) for §Y200§! days.\nWe gain §G3%§! recruitable population while it lasts."
 FOE_parasite_goad:0 "Goad [FROM.GetName]"
 FOE_parasite_goad_desc:0 "Insult them in a way they cannot ignore. Either they swallow it, or they attack us on our terms."
 FOE_parasite_goad_tt:0 "[FROM.GetName] must choose:\nBack down, and suffer §R-20%§! stability, war support and recruitable population until they go to war with us.\nOr declare war on us, and we gain §YProvoked§! (§G+15%§! breakthrough, division speed and recon) for §Y100§! days."
 FOE_parasite_goad_cooldown_tt:0 "We have not goaded anyone in the last §Y300§! days."
 FOE_purge_the_parasites:0 "Purge the Parasites"
 FOE_purge_the_parasites_desc:0 "Expel their agents, void their contracts and close the recruiting stations."
 FOE_purge_the_parasites_tt:0 "All §YLeeched Industry§! and §YSiphoned Levies§! are removed.\nNo one can leech from us for §Y365§! days."
 special_rulers.17.t:0 "Goaded by [FROM.GetName]"
 special_rulers.17.d:0 "[FROM.GetName] has insulted us in front of the whole wasteland. If we do nothing, every pony will know we can be walked over. If we answer, it will be with war, and they are clearly ready for it."
 special_rulers.17.a:0 "Swallow the insult."
 special_rulers.17.b:0 "This means war."
 special_rulers.18.t:0 "They Took the Bait"
 special_rulers.18.d:0 "[FROM.GetName] has declared war on us, exactly as we intended. Our armies were ready before their declaration was read."
 special_rulers.18.a:0 "As planned."
 special_rulers.19.t:0 "They Backed Down"
 special_rulers.19.d:0 "[FROM.GetName] swallowed the insult. Their soldiers and their people saw it happen."
 special_rulers.19.a:0 "Weakness, as expected."

##Wild Heart Subclass
 FOE_wild_heart_trait:0 "Wild Heart"
 FOE_wild_heart_trait_desc:0 "Ponies go where they want to, and that is good. Each month our people move from crowded towns to empty land, and the land is better for it.\nAt §CLegendary§!, every sixth migration founds a civilian factory. At §tMythic§!, ponies from neighbouring countries join the migration too."
 FOE_migration_modifier:0 "New Arrivals"
 FOE_migration_modifier_desc:0 "Settlers have just arrived here and are building fast."

##Merchant Prince Subclass
 FOE_merchant_prince_trait:0 "Merchant Prince"
 FOE_merchant_prince_trait_desc:0 "Everything has a price, and everything is worth more moving than standing still. Our markets must stay open: we can never fall below Export Focus."
 FOE_market_modifier:0 "The Market"
 FOE_market_modifier_desc:0 "Every unit of resources we import or export makes our factories more efficient. It also means that when supply fails, our industry has nothing to fall back on."
 FOE_chartered_companies:0 "Chartered Companies"
 FOE_chartered_companies_desc:0 "Our trading companies buy more with every factory we commit to imports."
 FOE_purchase_payments_modifier:0 "Payments Due"
 FOE_purchase_payments_modifier_desc:0 "We are paying off a purchased state in civilian factory time."
 FOE_merchant_purchase_state:0 "Purchase [FROM.GetName]"
 FOE_merchant_purchase_state_desc:0 "Why fight for land that can simply be bought?"
 FOE_merchant_purchase_state_tt:0 "[FROM.GetName] becomes ours.\nWe pay for it with civilian factories for §Y180§! days: one for every thousand residents, and one for every factory or dockyard in the state. [FROM.Owner.GetName] receives the same factories for as long as we pay."
 FOE_purchase_payments_tt:0 "We have finished paying for our last purchase."
 FOE_merchant_speculate_water:0 "Speculate on Water"
 FOE_merchant_speculate_water_desc:0 "Buy up supply on the open market before anyone else does. Gives §Y10§! water for §Y100§! days."
 FOE_speculation_water_modifier:0 "Water Speculation"
 FOE_merchant_speculate_energy:0 "Speculate on Energy"
 FOE_merchant_speculate_energy_desc:0 "Buy up supply on the open market before anyone else does. Gives §Y10§! energy for §Y100§! days."
 FOE_speculation_energy_modifier:0 "Energy Speculation"
 FOE_merchant_speculate_metal:0 "Speculate on Metal"
 FOE_merchant_speculate_metal_desc:0 "Buy up supply on the open market before anyone else does. Gives §Y10§! metal for §Y100§! days."
 FOE_speculation_metal_modifier:0 "Metal Speculation"
 FOE_merchant_speculate_composites:0 "Speculate on Composites"
 FOE_merchant_speculate_composites_desc:0 "Buy up supply on the open market before anyone else does. Gives §Y10§! composites for §Y100§! days."
 FOE_speculation_composites_modifier:0 "Composites Speculation"
 FOE_merchant_speculate_circuitry:0 "Speculate on Circuitry"
 FOE_merchant_speculate_circuitry_desc:0 "Buy up supply on the open market before anyone else does. Gives §Y10§! circuitry for §Y100§! days."
 FOE_speculation_circuitry_modifier:0 "Circuitry Speculation"
 FOE_purchase_receipts_modifier:0 "Payments Received"
 FOE_purchase_receipts_modifier_desc:0 "A neighbour is paying us for land we sold them: §Y[?FOE_purchase_receipts|0]§! offsite civilian factories, until the payments end. We cannot sell another state until then."
 FOE_biological_engineer_trait:0 "Biological Engineer"
 FOE_biological_engineer_trait_desc:0 "A pony is a machine of meat and bone: it can be improved, and when it is worn out, it can be broken down for parts. We have no use for robots."
 FOE_the_flesh_is_the_machine:0 "The Flesh Is the Machine"
 FOE_the_flesh_is_the_machine_desc:0 "Why build machines when we are already surrounded by them? Our researchers study the body, and leave the robots to lesser nations."
 FOE_rendered_industry_modifier:0 "Rendered Industry"
 FOE_rendered_industry_modifier_desc:0 "Rendered ponies keep our factories and building sites running: §Y4%§! per Biomass. Active while we are at peace."
 FOE_rendered_soldiery_modifier:0 "Rendered Soldiery"
 FOE_rendered_soldiery_modifier_desc:0 "Rendered ponies are fed back into our soldiers: §Y4%§! per Biomass. Active while we are at war."
 FOE_breeding_pen_modifier:0 "Breeding Pen"
 FOE_breeding_pen_modifier_desc:0 "This state is being restocked after its ponies were rendered."
 FOE_engineer_render_stock:0 "Render the Stock of [FROM.GetName]"
 FOE_engineer_render_stock_desc:0 "The worn-out and the surplus are broken down, and what they were is put to better use."
 FOE_engineer_render_stock_tt:0 "[FROM.GetName] loses §R400§! population.\nWe gain §G1§! Biomass (current: §Y[?FOE_biomass|0]§!, at most §Y5§!). One Biomass decays each month and returns §G4%§! stability.\nIf our leader is Legendary or Mythic, [FROM.GetName] becomes a Breeding Pen and regrows §Y360§! population over six months."
 FOE_engineer_render_enemy:0 "Render the Enemy in [FROM.GetName]"
 FOE_engineer_render_enemy_desc:0 "The enemy's ponies are made of the same material as ours."
 FOE_engineer_render_enemy_tt:0 "[FROM.GetName] loses §R800§! population.\nWe gain §G2§! Biomass (current: §Y[?FOE_biomass|0]§!, at most §Y5§!)."
 FOE_biomass_full_tt:0 "We have less than §Y5§! Biomass."
 FOE_blackout_opportunist_trait:0 "Blackout Opportunist"
 FOE_blackout_opportunist_trait_desc:0 "When the lights go out, others panic. We get to work."
 FOE_running_dark_modifier:0 "Running Dark"
 FOE_running_dark_modifier_desc:0 "Our industry has learned to work without power. The emptier our fuel reserves, the harder it works: up to §G15%§! factory output and construction speed with an empty tank."
 FOE_bonfire_modifier:0 "Bonfire"
 FOE_bonfire_modifier_desc:0 "We burned our reserves, and our scholars worked by the light of the fire."
 FOE_black_market_modifier:0 "Black Market"
 FOE_black_market_modifier_desc:0 "Siphoned fuel is being sold off: §Y[?FOE_black_market_factories|0]§! offsite civilian factories, until the sales end. We cannot siphon again until then."
 FOE_lights_out_modifier:0 "Lights Out"
 FOE_lights_out_modifier_desc:0 "An enemy without fuel is an enemy without teeth. Active while any enemy has less than §Y25%§! of its fuel capacity."
 FOE_blackout_burn_reserves:0 "Burn the Reserves"
 FOE_blackout_burn_reserves_desc:0 "Fuel in a tank is a temptation. Fuel on a fire is progress."
 FOE_blackout_burn_reserves_tt:0 "All our fuel is burned.\nFor §Y60§! days, research speed rises by §G2%§! per 1,000 fuel burned, at most §G15%§!."
 FOE_blackout_siphon_fuel:0 "Siphon [FROM.GetName]"
 FOE_blackout_siphon_fuel_desc:0 "Their tanks are full. They won't be for long."
 FOE_blackout_siphon_fuel_tt:0 "[FROM.GetName] loses half its fuel. We sell it on the black market for one offsite civilian factory per 1,000 fuel (at least §Y1§!, at most §Y10§!) for §Y90§! days.\n[FROM.GetName] will not forget this."
 FOE_siphon_cooldown_tt:0 "Our last black-market sale has ended."
 FOE_siphoned_our_fuel:0 "Siphoned our fuel"
 FOE_oathkeeper_trait:0 "Oathkeeper"
 FOE_oathkeeper_trait_desc:0 "We take land by the sword, and give it back by oath. Those who swear to us are protected, and they will prosper, but their arms and their young are ours."
 autonomy_oathsworn:0 "Oathsworn"
 FOE_burden_of_oaths_modifier:0 "Burden of Oaths"
 FOE_burden_of_oaths_modifier_desc:0 "Every oath we swear must be kept: §Y[?FOE_oaths_sworn|0]§! civilian factories go to our Oathsworn."
 FOE_oath_of_prosperity_modifier:0 "Oath of Prosperity"
 FOE_oath_of_prosperity_modifier_desc:0 "Our overlord has sworn that we will prosper under their protection."
 FOE_oath_of_plenty_modifier:0 "Oath of Plenty"
 FOE_oath_of_plenty_modifier_desc:0 "Our overlord has sworn that our people and our fields will never go hungry."
 FOE_oath_of_order_modifier:0 "Oath of Order"
 FOE_oath_of_order_modifier_desc:0 "Our overlord has sworn to keep the peace within our borders."
 FOE_oathkeeper_swear_oath:0 "Swear the Oath in [FROM.GetName]"
 FOE_oathkeeper_swear_oath_desc:0 "The land is ours by conquest. Its people will have it back, if they swear to us."
 FOE_oathkeeper_swear_oath_tt:0 "The nation whose core [FROM.GetName] is will be released as our §YOathsworn§!: its military industry and §Y75%§! of its manpower each month belong to us."
 FOE_oathkeeper_reward_loyalty:0 "Reward Loyalty with [FROM.GetName]"
 FOE_oathkeeper_reward_loyalty_desc:0 "Loyalty is repaid in land."
 FOE_oathkeeper_reward_loyalty_tt:0 "[FROM.GetName] is given to a neighbouring Oathsworn, preferably one that owns more of its own core states than foreign ones."
 FOE_oathkeeper_bind_by_oath:0 "Bind [FROM.GetName] by Oath"
 FOE_oathkeeper_bind_by_oath_desc:0 "A subject is only held by force. An Oathsworn is held by their word."
 FOE_oathkeeper_bind_by_oath_tt:0 "[FROM.GetName] becomes our §YOathsworn§!: its military industry and §Y75%§! of its manpower each month belong to us."
 FOE_oathkeeper_oath_of_prosperity:0 "Swear the Oath of Prosperity to [FROM.GetName]"
 FOE_oathkeeper_oath_of_prosperity_desc:0 "We swear that they will prosper under our protection."
 FOE_oathkeeper_oath_of_prosperity_tt:0 "[FROM.GetName] gains §G+15%§! construction speed and §G-10%§! consumer goods.\nThe Burden of Oaths grows by §Y1§! civilian factory."
 FOE_oathkeeper_oath_of_plenty:0 "Swear the Oath of Plenty to [FROM.GetName]"
 FOE_oathkeeper_oath_of_plenty_desc:0 "We swear that their people and their fields will never go hungry."
 FOE_oathkeeper_oath_of_plenty_tt:0 "[FROM.GetName] gains §G+20%§! monthly population growth and §G+10%§! resources.\nThe Burden of Oaths grows by §Y1§! civilian factory."
 FOE_oathkeeper_oath_of_order:0 "Swear the Oath of Order to [FROM.GetName]"
 FOE_oathkeeper_oath_of_order_desc:0 "We swear to keep the peace within their borders."
 FOE_oathkeeper_oath_of_order_tt:0 "[FROM.GetName] gains §G+10%§! stability and §G+25%§! compliance growth.\nThe Burden of Oaths grows by §Y1§! civilian factory."
 FOE_oathkeeper_raise_the_wall:0 "Raise the Wall in [FROM.GetName]"
 FOE_oathkeeper_raise_the_wall_desc:0 "We swore to protect them. We will build the walls to prove it."
 FOE_oathkeeper_raise_the_wall_tt:0 "After §Y50§! days, level-§Y2§! bunkers are built along the borders of [FROM.GetName]."
 FOE_robber_baron_trait:0 "Robber Baron"
 FOE_robber_baron_trait_desc:0 "What others build, we take. Our raiders bring home half again as much loot, and every state we hold can be made to pay a little more."
 FOE_screws_tightened_modifier:0 "Screws Tightened"
 FOE_screws_tightened_modifier_desc:0 "This state's industry has been squeezed for everything it has."
 FOE_robbers_hoard_modifier:0 "The Robber's Hoard"
 FOE_robbers_hoard_modifier_desc:0 "Our stolen wealth keeps the factories running: §G+1%§! factory output and construction speed for every loot we hold, at most §G20%§!."
 FOE_robber_tighten_the_screws:0 "Tighten the Screws on [FROM.GetName]"
 FOE_robber_tighten_the_screws_desc:0 "They have more than they are telling us. They always do."
 FOE_robber_tighten_the_screws_tt:0 "We gain loot equal to half of [FROM.GetName]'s factories and dockyards (at least §Y1§!, at most §Y6§!).\n[FROM.GetName] suffers §R-50%§! construction speed, §R-25%§! resources and §R-25%§! recruitable population for §Y180§! days."
 FOE_railroad_tycoon_trait:0 "Railroad Tycoon"
 FOE_railroad_tycoon_trait_desc:0 "Every track we lay binds the nation tighter together, and every station is a depot for the next war."
 FOE_iron_arteries_modifier:0 "Iron Arteries"
 FOE_iron_arteries_modifier_desc:0 "Our rail network carries the nation's industry: §G+1%§! factory output and construction speed for each of our §Y[?FOE_rail_states|0]§! states at maximum infrastructure, at most §G15%§!."
 FOE_tycoon_lay_the_line:0 "Lay the Line to [FROM.GetName]"
 FOE_tycoon_lay_the_line_desc:0 "Where the rails go, the nation follows."
 FOE_tycoon_lay_the_line_tt:0 "Costs §Y5§! caravans.\n[FROM.GetName] gains §G+2§! infrastructure (up to §Y10§!), and a railway is laid to it from our capital."
 FOE_tycoon_draft_the_timetable:0 "Draft the Timetable"
 FOE_tycoon_draft_the_timetable_desc:0 "When war comes, every train will already know where to go."
 FOE_tycoon_draft_the_timetable_tt:0 "Costs §Y250§! manpower, §Y100§! infantry equipment and §Y5§! caravans.\nOne §YRailway Corps§! is put into storage (stored: §Y[?FOE_corps_stored|0]§! of §Y[?FOE_corps_max|0]§!). In wartime it can be sent to any of our states at maximum infrastructure. At peace the Railway Corps return to storage, and a tenth of them are lost."
 FOE_tycoon_run_the_timetable:0 "Run the Timetable to [FROM.GetName]"
 FOE_tycoon_run_the_timetable_desc:0 "The trains are already rolling."
 FOE_tycoon_run_the_timetable_tt:0 "One stored §YRailway Corps§! arrives in [FROM.GetName] (stored: §Y[?FOE_corps_stored|0]§!)."
 FOE_corps_storage_room_tt:0 "We have room for another Railway Corps (§Y[?FOE_corps_stored|0]§! of §Y[?FOE_corps_max|0]§!: 5 plus one per state at maximum infrastructure, at most 25)."
 FOE_corps_in_storage_tt:0 "We have a Railway Corps in storage."
 FOE_deep_mine_sovereign_trait:0 "Deep Mine Sovereign"
 FOE_deep_mine_sovereign_trait_desc:0 "The capital sits on the richest ground we know, and the Sovereign means to empty it. Every level of the shaft brings up something new."
 FOE_sovereigns_hoard_modifier:0 "Sovereign's Hoard"
 FOE_sovereigns_hoard_modifier_desc:0 "Everything we pull out of the ground fills the treasury: §G+1%§! factory output and political power gain for every §Y10§! resources we extract (currently §Y[?FOE_mine_extraction|0]§!), at most §G25%§!."
 FOE_deep_mine_modifier:0 "The Deep Mine"
 FOE_deep_mine_modifier_desc:0 "The Sovereign's shaft reaches §Y[?FOE_mine_depth|0]§! levels down: §G+3%§! local resources per level."
 FOE_mine_cave_in_modifier:0 "Cave-in"
 FOE_mine_cave_in_modifier_desc:0 "A gallery of the Deep Mine has collapsed on its miners."
 FOE_sovereign_sink_the_shaft:0 "Sink the Shaft"
 FOE_sovereign_sink_the_shaft_desc:0 "Deeper, and deeper still. Somewhere below lies the next vein."
 FOE_sovereign_sink_the_shaft_tt:0 "When the dig ends, if we still hold the mine (Depth §Y[?FOE_mine_depth_shown|0]§! of §Y10§!):\nDepth §G+1§!, and the mine's state gains §G+1§! shared building slot.\n§Y70%§!: a strike, a permanent §G+2§! of a random resource, plus §G1§! for every §Y3§! Depth. Advanced Technology can be struck from Depth §Y3§!, Magical Crystals from Depth §Y6§!.\n§Y20%§!: a dry shaft.\n§Y10%§!: a cave-in, §R-500§! population in the mine's state and §R-5%§! stability for §Y60§! days.\nAt Depth §Y10§! the mine bottoms out: every month has a §Y10%§! chance of a free strike, up to §Y20§! strikes."
 FOE_mine_held_tt:0 "We own and control the state of our Deep Mine."
 special_rulers.24.t:0 "The Deep Mine"
 special_rulers.24.d_metal:0 "The miners have struck a vein of old-world steel. Our Deep Mine now yields §G[?FOE_mine_last_amount|0]§! more §Ymetal§!, for good."
 special_rulers.24.d_energy:0 "The shaft has broken into a buried power conduit that still hums. Our Deep Mine now yields §G[?FOE_mine_last_amount|0]§! more §Yenergy§!, for good."
 special_rulers.24.d_water:0 "The drills have hit an underground spring, clean and cold. Our Deep Mine now yields §G[?FOE_mine_last_amount|0]§! more §Ywater§!, for good."
 special_rulers.24.d_composites:0 "The miners have found a collapsed pre-war depot packed with composite plating. Our Deep Mine now yields §G[?FOE_mine_last_amount|0]§! more §Ycomposites§!, for good."
 special_rulers.24.d_circuitry:0 "Deep below the city lies a sealed data vault, its circuit boards intact. Our Deep Mine now yields §G[?FOE_mine_last_amount|0]§! more §Ycircuitry§!, for good."
 special_rulers.24.d_advanced:0 "The shaft has reached a buried Old World facility. What the miners carry up from it has no name yet. Our Deep Mine now yields §G[?FOE_mine_last_amount|0]§! more §YAdvanced Technology§!, for good."
 special_rulers.24.d_crystals:0 "Far below the last gallery, the rock glitters. The miners have found magical crystals. Our Deep Mine now yields §G[?FOE_mine_last_amount|0]§! more §YMagical Crystals§!, for good."
 special_rulers.24.d_dry:0 "The shaft went a level deeper and found only rock. Still, there is more room below than there was."
 special_rulers.24.d_cave_in:0 "A gallery of the Deep Mine has collapsed. The miners inside were not all dug out in time, and the capital mourns them."
 special_rulers.24.a:0 "Keep digging."
 FOE_just_monarch_trait:0 "Just Monarch"
 FOE_just_monarch_trait_desc:0 "A crown is a promise to rule justly, and to reward those who serve. The Monarch raises a neighbouring leader as a Loyal General, and both grow stronger together."
 FOE_loyal_general_trait:0 "Loyal General"
 FOE_loyal_general_trait_desc:0 "This leader was raised by a Just Monarch and serves the crown. Everything the Monarch granted will vanish with it."
 FOE_just_rule_modifier:0 "Just Rule"
 FOE_just_rule_modifier_desc:0 "Our Loyal General serves at rank §Y[?FOE_general_rank|0]§! (Great 1, Legendary 2, Mythic 3): §G+2%§! political power gain and stability per rank, and §G+5%§! attack while we fight beside it."
 FOE_sworn_sword_modifier:0 "Sworn Sword"
 FOE_sworn_sword_modifier_desc:0 "We fight the enemies of our Monarch: §G+10%§! attack and §G+5%§! defence, and §G+10%§! breakthrough at Mythic rank."
 FOE_monarchs_favour_modifier:0 "The Monarch's Favour"
 FOE_monarchs_favour_modifier_desc:0 "Our leader serves a Just Monarch. For as long as the Monarch rules, it is a proud thing to serve: §G+5%§! recruitable population."
 FOE_sworn_bond:0 "Sworn Bond"
 FOE_monarch_faction_name_1:0 "The Just Crown"
 FOE_monarch_faction_name_2:0 "The Sworn Throne"
 FOE_monarch_faction_name_3:0 "The Oathbound Crown"
 FOE_monarch_faction_name_4:0 "The Crown and Sword"
 FOE_monarch_bestow_honours:0 "Bestow Honours"
 FOE_monarch_bestow_honours_desc:0 "A year of loyal service deserves its reward."
 FOE_monarch_bestow_honours_tt:0 "Our Loyal General rises one rank: from §YGreat§! to §YLegendary§!, or from §YLegendary§! to §YMythic§!.\nHonours can be bestowed once a year."
 FOE_honours_ready_tt:0 "A year has passed since our General was last honoured."
 FOE_general_not_mythic_tt:0 "Our Loyal General is not yet Mythic."
 FOE_monarch_royal_endowment:0 "Royal Endowment"
 FOE_monarch_royal_endowment_desc:0 "The crown's treasury builds for those who serve it."
 FOE_monarch_royal_endowment_tt:0 "Our Loyal General gains §G2§! civilian factories for §Y180§! days."
 FOE_endowment_ready_tt:0 "180 days have passed since the last Royal Endowment."
 FOE_monarch_summon_banners:0 "Summon the Banners"
 FOE_monarch_summon_banners_desc:0 "The crown is at war. Its General is called to the field."
 FOE_monarch_summon_banners_tt:0 "Our Loyal General joins our wars against every enemy it is not yet fighting. A General led by a player is asked, and may refuse.\nThe banners can be summoned every §Y90§! days."
 FOE_summon_ready_tt:0 "90 days have passed since the banners were last summoned."
 FOE_monarch_war_to_join_tt:0 "We are at war with an enemy our Loyal General is not yet fighting."
 FOE_general_answer_the_call:0 "Answer the Call"
 FOE_general_answer_the_call_desc:0 "The crown is at war. We do not need to be asked."
 FOE_general_answer_the_call_tt:0 "We join our Monarch's wars against every enemy we are not yet fighting."
 FOE_general_war_to_join_tt:0 "Our Monarch is at war with an enemy we are not yet fighting."
 FOE_general_hand_over_state:0 "Hand [FROM.GetName] to the Crown"
 FOE_general_hand_over_state_desc:0 "A loyal servant gives freely to the crown."
 FOE_general_hand_over_state_tt:0 "[FROM.GetName] passes to our Monarch."
 special_rulers.25.t:0 "A Crown Offers Its Favour"
 special_rulers.25.d:0 "[FROM.GetLeader], the Just Monarch of [FROM.GetNameDef], offers to raise our leader as a Loyal General of the crown. We would become a Great Conqueror, join the Monarch's alliance, and rise in rank with every year of service. But everything the Monarch grants will vanish if the Monarch falls."
 special_rulers.25.a:0 "We accept the crown's favour."
 special_rulers.25.b:0 "We serve no crown."
 special_rulers.25.expired_tt:0 "The offer is no longer open."
 special_rulers.27.t:0 "The Crown Summons Its Banners"
 special_rulers.27.d:0 "[FROM.GetLeader] of [FROM.GetNameDef] is at war, and calls on us, its Loyal General, to take the field."
 special_rulers.27.a:0 "Our banners march with the crown."
 special_rulers.27.b:0 "Not this war."
 FOE_nemesis_trait:0 "Nemesis"
 FOE_nemesis_trait_desc:0 "There is one nation on this leader's border that must fall, and it knows. In 800 days the two will settle it."
 FOE_decisive_strike_modifier:0 "Decisive Strike"
 FOE_decisive_strike_modifier_desc:0 "Everything we prepared is thrown at our Nemesis: §G+[?FOE_decisive_strike|%0]§! attack, organisation and breakthrough until the Reckoning is decided."
 FOE_spoils_to_the_victor_modifier:0 "Spoils to the Victor"
 FOE_spoils_to_the_victor_modifier_desc:0 "We won the Reckoning, and the whole wasteland saw it."
 FOE_victors_peace_modifier:0 "The Victor's Peace"
 FOE_victors_peace_modifier_desc:0 "Who would resist the nation that broke its Nemesis?"
 FOE_nemesis_the_reckoning:0 "The Reckoning"
 FOE_nemesis_the_reckoning_desc:0 "Two nations, one border, one war that has to come. When the time runs out, we march on our Nemesis. Until then, both of us prepare."
 FOE_nemesis_the_reckoning_tt:0 "We declare war on our Nemesis and claim every state it owns, and all Preparation on both sides is spent at once:\n§G+1%§! attack, organisation and breakthrough per Preparation (§YDecisive Strike§!) until the war is decided,\na §YNemesis Division§! per §Y2§! Preparation, and a military factory per §Y4§!.\nIf the war can no longer be declared (for example during a truce), the Reckoning is a draw and nothing is paid out."
 FOE_nemesis_muster:0 "Muster for the Reckoning"
 FOE_nemesis_muster_desc:0 "Every soldier drilled now is one more on the day."
 FOE_nemesis_muster_tt:0 "Costs §Y250§! manpower and §Y200§! infantry equipment.\n§G+1§! Preparation (now §Y[?FOE_nemesis_preparation|0]§! of §Y20§!)."
 FOE_nemesis_wargames:0 "Wargames in [FROM.GetName]"
 FOE_nemesis_wargames_desc:0 "Live fire, real casualties, real lessons."
 FOE_nemesis_wargames_tt:0 "[FROM.GetName] loses §R1,000§! population and is §Rdevastated§! for §Y365§! days.\n§G+1§! Preparation (now §Y[?FOE_nemesis_preparation|0]§! of §Y20§!)."
 FOE_nemesis_preparation_room_tt:0 "Preparation is below its maximum of §Y20§! (now §Y[?FOE_nemesis_preparation|0]§!)."
 FOE_nemesis_muster_ready_tt:0 "60 days have passed since the last muster."
 FOE_nemesis_wargames_ready_tt:0 "120 days have passed since the last wargames."
 special_rulers.28.t:0 "DEBUG: Nemesis"
 special_rulers.28.d:0 "Debug event for the Nemesis. Preparation: [?FOE_nemesis_preparation|0] of 20, victories towards the next: [?FOE_nemesis_victories|0] of 25."
 special_rulers.28.a:0 "Make our leader a Great Conqueror Nemesis with a Rival"
 special_rulers.28.b:0 "Fill Preparation to 20"
 special_rulers.28.c:0 "Day 800 now: start the Reckoning"
 special_rulers.28.e:0 "The Rival capitulates, then white peace (resolves next week)"
 special_rulers.28.f:0 "Annex the Rival: all its states become ours (resolves next week)"
 special_rulers.28.g:0 "Raise our Conqueror rank by one"
 special_rulers.28.h:0 "Run the weekly Nemesis update now"
 special_rulers.28.close:0 "Close"
 FOE_lawgiver_trait:0 "Lawgiver"
 FOE_lawgiver_trait_desc:0 "A law is a promise made to the future. It will hurt before it helps, and it will help most just before it ends."
 FOE_eternal_code_modifier:0 "The Eternal Code"
 FOE_eternal_code_modifier_desc:0 "Every law that ran its full year left a mark on the nation that will not fade."
 FOE_law_not_in_force_tt:0 "This law is not already in force."
 FOE_room_for_law_tt:0 "We have room for another law (§Y[?FOE_laws_in_force|0]§! of §Y[?FOE_law_limit|0]§! in force)."
 FOE_law_of_labour_modifier:0 "Law of Labour"
 FOE_law_of_labour_modifier_desc:0 "Every hoof will work, and every hand will build. Step §Y[?FOE_law_labour_step|0]§! of 12."
 FOE_lawgiver_enact_labour:0 "Enact the Law of Labour"
 FOE_lawgiver_enact_labour_desc:0 "Every hoof will work, and every hand will build."
 FOE_lawgiver_enact_labour_tt:0 "The Law of Labour is in force for a year. It affects factory output and construction speed, §Y2.5%§! per step.\nIt starts as a penalty (§R-4x§!), turns positive after four months, reaches §G+5x§! in its tenth month, then gives its Culmination (§G+12x§!) for its last two months before it expires."
 FOE_law_of_arms_modifier:0 "Law of Arms"
 FOE_law_of_arms_modifier_desc:0 "The army will be ready, whether it is ready or not. Step §Y[?FOE_law_arms_step|0]§! of 12."
 FOE_lawgiver_enact_arms:0 "Enact the Law of Arms"
 FOE_lawgiver_enact_arms_desc:0 "The army will be ready, whether it is ready or not."
 FOE_lawgiver_enact_arms_tt:0 "The Law of Arms is in force for a year. It affects army attack and defence, §Y2.5%§! per step.\nIt starts as a penalty (§R-4x§!), turns positive after four months, reaches §G+5x§! in its tenth month, then gives its Culmination (§G+12x§!) for its last two months before it expires."
 FOE_law_of_learning_modifier:0 "Law of Learning"
 FOE_law_of_learning_modifier_desc:0 "Knowledge is the law's first servant. Step §Y[?FOE_law_learning_step|0]§! of 12."
 FOE_lawgiver_enact_learning:0 "Enact the Law of Learning"
 FOE_lawgiver_enact_learning_desc:0 "Knowledge is the law's first servant."
 FOE_lawgiver_enact_learning_tt:0 "The Law of Learning is in force for a year. It affects research speed, §Y2.5%§! per step.\nIt starts as a penalty (§R-4x§!), turns positive after four months, reaches §G+5x§! in its tenth month, then gives its Culmination (§G+12x§!) for its last two months before it expires."
 FOE_law_of_levy_modifier:0 "Law of the Levy"
 FOE_law_of_levy_modifier_desc:0 "Every family owes the nation its young. Step §Y[?FOE_law_levy_step|0]§! of 12."
 FOE_lawgiver_enact_levy:0 "Enact the Law of the Levy"
 FOE_lawgiver_enact_levy_desc:0 "Every family owes the nation its young."
 FOE_lawgiver_enact_levy_tt:0 "The Law of the Levy is in force for a year. It affects recruitable population and monthly population growth, §Y2.5%§! per step.\nIt starts as a penalty (§R-4x§!), turns positive after four months, reaches §G+5x§! in its tenth month, then gives its Culmination (§G+12x§!) for its last two months before it expires."
 FOE_law_of_tithes_modifier:0 "Law of Tithes"
 FOE_law_of_tithes_modifier_desc:0 "The people will want for less, because the law says so. Step §Y[?FOE_law_tithes_step|0]§! of 12."
 FOE_lawgiver_enact_tithes:0 "Enact the Law of Tithes"
 FOE_lawgiver_enact_tithes_desc:0 "The people will want for less, because the law says so."
 FOE_lawgiver_enact_tithes_tt:0 "The Law of Tithes is in force for a year. It affects consumer goods (lower is better), §Y1%§! per step.\nIt starts as a penalty (§R-4x§!), turns positive after four months, reaches §G+5x§! in its tenth month, then gives its Culmination (§G+12x§!) for its last two months before it expires."
 FOE_steadfast_librarian_trait:0 "Steadfast Librarian"
 FOE_steadfast_librarian_trait_desc:0 "The world burned, but the books did not. Every page we recover is a step back towards what was lost."
 FOE_catalogue_modifier:0 "The Catalogue"
 FOE_catalogue_modifier_desc:0 "§Y[?FOE_catalogue|0]§! technologies catalogued since our Librarian took office: §G+0.25%§! research speed each, at most §G15%§!. A Legendary Librarian opens a new research slot at §Y20§!, a Mythic one another at §Y50§!, and a Mythic Librarian's soldiers, pilots and sailors learn from every page: §G+0.5%§! experience gain each, at most §G20%§!."
 FOE_study_cooldown_tt:0 "We have not commissioned a study in the last §Y60§! days."
 FOE_librarian_study_industry:0 "Commission a Study: Industry"
 FOE_librarian_study_industry_desc:0 "Somewhere in the stacks, someone has already solved this."
 FOE_librarian_study_engineering:0 "Commission a Study: Engineering"
 FOE_librarian_study_engineering_desc:0 "Somewhere in the stacks, someone has already solved this."
 FOE_librarian_study_infantry:0 "Commission a Study: Infantry"
 FOE_librarian_study_infantry_desc:0 "Somewhere in the stacks, someone has already solved this."
 FOE_librarian_study_support:0 "Commission a Study: Support"
 FOE_librarian_study_support_desc:0 "Somewhere in the stacks, someone has already solved this."
 FOE_voice_of_the_machine_trait:0 "Voice of the Machine"
 FOE_voice_of_the_machine_trait_desc:0 "Somewhere below the wasteland, a Mainframe still hums. It speaks, and our leader repeats its words. Nopony knows why it wants what it wants."
 FOE_priority_technology_modifier:0 "Mainframe Priority: Technology"
 FOE_priority_technology_modifier_desc:0 "The Mainframe demands knowledge. Everything else can wait."
 FOE_priority_production_modifier:0 "Mainframe Priority: Production"
 FOE_priority_production_modifier_desc:0 "The Mainframe demands output. Everything else can wait."
 FOE_priority_mobilisation_modifier:0 "Mainframe Priority: Mobilisation"
 FOE_priority_mobilisation_modifier_desc:0 "The Mainframe demands soldiers. Everything else can wait."
 FOE_priority_administration_modifier:0 "Mainframe Priority: Administration"
 FOE_priority_administration_modifier_desc:0 "The Mainframe demands order. Everything else can wait."
 FOE_overclocked_lines_modifier:0 "Overclocked Lines"
 FOE_overclocked_lines_modifier_desc:0 "The Mainframe has rewritten every schedule in our factories. The lines run faster, and nopony is allowed to ask how."
 FOE_voice_directive_unused_tt:0 "We have not carried out a directive under the current Priority."
 FOE_voice_not_petitioned_tt:0 "We have not petitioned the Mainframe during the current Priority."
 FOE_voice_compute_solution:0 "Directive: Compute the Solution"
 FOE_voice_compute_solution_desc:0 "The Mainframe has already run the numbers. Our engineers only need to follow them."
 FOE_voice_overclock_lines:0 "Directive: Overclock the Lines"
 FOE_voice_overclock_lines_desc:0 "The Mainframe takes over the factory schedules. Output will rise. Questions will not be answered."
 FOE_voice_issue_draft:0 "Directive: Issue the Draft"
 FOE_voice_issue_draft_desc:0 "The Mainframe has chosen who will serve. The lists are posted in every town square."
 FOE_voice_enforce_compliance:0 "Directive: Enforce Compliance"
 FOE_voice_enforce_compliance_desc:0 "The Mainframe knows who resists. So will they, soon."
 FOE_voice_enforce_compliance_tt:0 "Every state we own but have no core on gains §G+10§! compliance."
 FOE_voice_petition_mainframe:0 "Petition the Mainframe"
 FOE_voice_petition_mainframe_desc:0 "We ask the Mainframe to reconsider. It may listen, or it may not. Either way, our engineers learn something about how it thinks."
 FOE_voice_petition_accepted_tt:0 "§G50%§!: the Mainframe assigns a new Priority at once."
 FOE_voice_petition_refused_tt:0 "§R50%§!: the Mainframe refuses, and the current Priority stands."
 FOE_whisper_broker_trait:0 "Whisper Broker"
 FOE_whisper_broker_trait_desc:0 "Everypony has something to hide. Our leader simply keeps the ledger, and makes sure every page is paid for."
 FOE_ledger_opened_modifier:0 "Ledger Opened"
 FOE_ledger_opened_modifier_desc:0 "A foreign spymaster has our accounts, our contracts and our secrets. Part of every shift now goes to buying silence."
 FOE_whisper_network_modifier:0 "The Whisper Network"
 FOE_whisper_network_modifier_desc:0 "Our leader built a spy service before they built anything else. It grows faster than anypony else's."
 FOE_insider_knowledge_modifier:0 "Insider Knowledge"
 FOE_insider_knowledge_modifier_desc:0 "What our Black File knows, we know. §G+2%§! factory output and research speed for every point of Dossier (§Y[?FOE_dossier|0]§!), while our network against them holds at §Y20§! or more."
 FOE_crossed_wires_modifier:0 "Crossed Wires"
 FOE_crossed_wires_modifier_desc:0 "Forged orders are loose on our telegraph lines. Nopony knows which dispatch to trust, and every march waits for confirmation."
 FOE_broker_open_black_file:0 "Open a Black File on [FROM.GetName]"
 FOE_broker_open_black_file_desc:0 "One nation becomes the service's priority. Every agent, every intercept and every bribe goes into its file."
 FOE_broker_open_black_file_tt:0 "[FROM.GetName] becomes our §YBlack File§!. The Dossier starts again at §Y2§!.\nEach month, with network strength §Y20§! or more against them, the Dossier grows by §G1§!, at §Y40§! or more by §G2§!, and by §G1§! more once their cipher is fully decrypted. Below §Y20§! it shrinks by §R1§!. It holds at most §Y6§!.\nWhile the network holds at §Y20§!, every Dossier point gives §G+2%§! factory output and research speed."
 FOE_black_file_cooldown_tt:0 "We have not opened a Black File in the last §Y90§! days."
 FOE_broker_no_mission_tt:0 "No Whisper Broker operation is being prepared or run against our current Black File."
 FOE_broker_break_cipher:0 "Break [FROM.GetName]'s Cipher (Dossier: [?FOE_dossier|0])"
 FOE_broker_break_cipher_desc:0 "Everything in the file, from codebooks to careless operators, goes to our cryptologists."
 FOE_broker_cipher_cooldown_tt:0 "We have not broken a cipher in the last §Y90§! days."
 FOE_broker_dossier_2_tt:0 "Our Dossier holds at least §Y2§! (now §Y[?FOE_dossier|0]§!)."
 FOE_broker_spend_2_dossier_tt:0 "Spend §Y2§! Dossier."
 FOE_broker_dossier_3_tt:0 "Our Dossier holds at least §Y3§! (now §Y[?FOE_dossier|0]§!). It is spent when the operation launches."
 FOE_broker_dossier_4_tt:0 "Our Dossier holds at least §Y4§! (now §Y[?FOE_dossier|0]§!). It is spent when the operation launches."
 FOE_broker_not_alerted_tt:0 "Our service is not lying low after its last operation."
 FOE_broker_valid_file_tt:0 "Our Black File is still an independent foreign nation outside our faction."
 FOE_ledger_no_payment_tt:0 "We are not already blackmailing a nation through an Open Ledger."
 FOE_operation_open_ledger:0 "Open Ledger"
 FOE_operation_open_ledger_desc:0 "Our agents copy the target's accounts and contracts, then let the right people know that we have them. They will pay to keep the pages closed, for as long as our network stays in place. Only against our Black File, and only against a nation with at least §Y5§! civilian factories."
 FOE_operation_open_ledger_outcome_tt:0 "The target pays us §G1§! civilian factory for every §Y5§! of theirs (at least §G2§!, at most §G6§!): blackmail paid in construction, not a transfer of their factories. The target suffers §R-10%§! factory output.\nThe payment lasts as long as they stay our Black File and our network strength against them stays at §Y40§! or more.\nOur service lies low for §Y30§! days."
 FOE_operation_crossed_wires:0 "Crossed Wires"
 FOE_operation_crossed_wires_desc:0 "Forged orders, sent in the enemy's own cipher, go out on the enemy's own lines. Only against our Black File, while at war with it, with its cipher more than half decrypted."
 FOE_operation_crossed_wires_outcome_tt:0 "The target suffers §R-20%§! planning speed, §R-10%§! organisation and §R-5%§! division speed for §Y60§! days, or §Y90§! days if we have fully decrypted their cipher or our active decryption bonuses are running.\nOur service lies low for §Y30§! days."

 FOE_lord_of_the_long_march_trait:0 "Lord of the Long March"
 FOE_lord_of_the_long_march_trait_desc:0 "Their nation is the column on the road. Behind it lie abandoned crowns and cold campfires; ahead, a promised homeland from which every horizon will be conquered."
 FOE_long_march_column:0 "A Nation on the March"
 FOE_long_march_column_desc:0 "The marching column carries a modest mobile industry and lives for the next encampment. Its old camps pass to a peaceful rear custodian."
 FOE_long_march_breakout:0 "Every Banner Unfurled"
 FOE_long_march_breakout_desc:0 "The long road ends here. The strength gathered on the march stays with the army of the new homeland for as long as the Lord rules."
 special_rulers.23.t:0 "DEBUG: Lord of the Long March"
 special_rulers.23.d:0 "Use a fresh leader without a Great Leader subclass, with Great Leaders enabled. Assignment does not conquer any land. Choose a route through the decisions, win its waypoints normally, then inspect weekly camp moves. A committed expedition cannot be reset or replayed by this menu."
 special_rulers.23.a:0 "Assign a Great Lord of the Long March"
 special_rulers.23.b:0 "Assign a Legendary Lord of the Long March"
 special_rulers.23.c:0 "Assign a Mythic Lord of the Long March"
 special_rulers.23.e:0 "Run one guarded march update"
 special_rulers.23.f:0 "Add 100 political power for decision testing"
 special_rulers.23.g:0 "Take the next waypoint now, at peace (next: [?FOE_march_next|0])"
 special_rulers.23.close:0 "Close"
 FOE_march_plan_route:0 "Choose the Road"
 FOE_march_plan_route_desc:0 "Chart a fixed three-waypoint route from the capital and settle on a peaceful rear custodian to receive every camp we abandon. This can only succeed once; a failed attempt costs nothing and can be tried again shortly."
 FOE_march_plan_route_tt:0 "The route and rear custodian are fixed for the rest of the march."
 FOE_march_plan_cooldown_tt:0 "The last search for a route is still cooling down."
 FOE_march_pack_rear_state:0 "Pack Another Camp"
 FOE_march_pack_rear_state_desc:0 "Send an original home state after the rest of the column: its people and stores go to the rear custodian, and its evacuated army marches on to the front."
 FOE_march_pack_rear_state_tt:0 "The state joins the rear custodian; a small addition to the March Reserves follows."
 FOE_march_advance_cooldown_tt:0 "The column is still settling in behind its last move."
 FOE_march_open_the_road:0 "Open the Road"
 FOE_march_open_the_road_desc:0 "Claim the next waypoint and declare on its owner. The war itself, and any peace that follows, are fought and settled normally."
 FOE_march_open_the_road_tt:0 "A war goal for the next waypoint."
 FOE_march_next_foreign_tt:0 "The next waypoint still belongs to another nation. If it is already ours, the column moves there by itself once we fully control it and the camp has settled, §Y30§! days after the last move."
 FOE_march_road_closed_tt:0 "We are neither at war with the waypoint's owner nor already holding a war goal against them."
 FOE_march_claim_the_horizons:0 "Claim the Horizons"
 FOE_march_claim_the_horizons_desc:0 "Claim a neighbor's lands along the new homeland's border as a war goal. Once on arrival, before the banners are unfurled, and then again on other eligible neighbors for §Y60§!/§Y90§!/§Y120§! days (Great/Legendary/Mythic) after the banners are unfurled."
 FOE_march_claim_the_horizons_tt:0 "War goals for this neighbor's border states."
 FOE_march_unfurl_banners:0 "Unfurl Every Banner"
 FOE_march_unfurl_banners_desc:0 "Spend every March Reserve at once and found the new homeland. Manpower and infantry equipment arrive immediately, every state we hold becomes a core, and the army keeps the strength of the march for as long as the Lord rules. This can only be done once, at the journey's end."
 FOE_march_unfurl_banners_tt:0 "All March Reserves are spent: §G+500§! manpower and §G+100§! infantry equipment each, and a permanent §G+1%§! attack and §G+1.5%§! breakthrough each, with §G+10%§! division speed.\nEvery state we own becomes a §Ycore§!.\nClaim the Horizons stays open for §Y60§!/§Y90§!/§Y120§! days by tier."
