 NCR_early_eastern_defense_outpost_line_decision:0 "Fortify the Eastern Border"
 NCR_early_eastern_defense_outpost_line_decision_desc:0 "If at all possible, we have to stop the enemy right at the border! The further they push in, the more our industry and civilian population is threatened."
