 shatteredhoof.1.t:0 "Shattered Hoof: Wartime History"
 shatteredhoof.1.d:0 "Before the Great War, the land now known as Shattered Hoof was relatively empty, home to only a few farmsteads and a railroad, connecting modern New Mareway with Appleloosa. A few scattered relics among the desert hint at there perhaps once being settlements from the Neighua tribals of the South-East, but by contemporary Equestrian history, these few fragments were ancient history. After the Great War started, it was nearby Shattered Hoof Ridge that was picked for ceasefire talks, where Princess Celestia would meet with Zebrican dignitaries, chosen due to its proximity to the frontlines in the south-east, and its sparse population. It was during these fateful ceasefire talks that assassins struck at Princess Celestia, who were only stopped by the intervention of wartime hero, Big Macintosh.\n\nThe Ministry of Morale, incensed by the assassination attempt and fearing lynch mobs forming if prisoners related to it were kept in populated prisons, decided to build the prison called Shattered Hoof. Not only was the name chosen to remind the early prisoners, many of whom were perpetrators of the Shattered Hoof Ridge Assassination Attempt, of why they were in prison, it was also a very descriptive name for the prison's practice. Prisoners would be put to hard labor, shattering their hooves in the search for gems and magical crystals, which would fuel the Equestrian war effort, and would even be used to pay off dragon mercenaries. Due to being away from the pesky media, prisoners were treated like slaves, and the prison was filled with many political prisoners.\n\nMany suspect that it was due to the political dissidents housed in Shattered Hoof that it was not targeted by Zebrican Balefire. Yet, despite the lack of targeting by Balefire, Shattered Hoof would find itself without food after the war, with many prisoners resorting to cannibalism to get by. The Ministry of Morale never properly invested in food storage, not caring, or perhaps not thinking, about how the prisoners would fare when the Last Day came. Instead, in the final days, the Ministry of Morale invested in..."
 shatteredhoof.1.a:0 "...Housing More Prisoners."
 shatteredhoof.1.b:0 "...Arming Every Guard."
 shatteredhoof.1.c:0 "...Expanding Staff Facilities."
 
 shatteredhoof.2.t:0 "Shattered Hoof: Post-War History"
 shatteredhoof.2.d:0 "Shortly after the Last Day, the prisoners kept in Shattered Hoof were a disorganized band, too busy with survival to worry about anything else. A few prisoners fled to other settlements, while others tried to form bands of raiders and attack the nearby settlement now known as New Mango, only to be pushed back. They were left with no plan, no leader, and very few resources, until a leader appeared, Ruby Rose. She was a member of a gang that had disappeared, with only her reappearing, working for an unknown benefactor known as Mister Topaz. With weapons and armor gifted to her by Mister Topaz, Ruby Rose brought order to the chaos, becoming, in Raider terms, 'Boss' of Shattered Hoof.\n\nOrganized under Ruby Rose, the Shattered Hoof prisoners, now the Shattered Hoof Raiders, expanded their territory to include many small settlements popping up around them. Their raiding parties rode to New Mango, Appleloosa, and even Neocastle, looting and taking what was needed for survival. Under Ruby Rose, their raids were so successful that they quickly became one of the strongest and most respected forces in the South. Many settlements and cultures, names now long forgotten, were subjugated either willingly or through force by the raiders, securing Shattered Hoof's spot under the clouds.\n\nWith a stockpile gathered up, and further expansion only a matter of time, Ruby Rose received new orders from Mister Topaz. If Shattered Hoof was to survive, they needed to be more than just marauders, instead, they needed to build a system meant to last. With borders and supplies secure, Ruby Rose began to send massive expeditions to scavenge, repair, and rebuild what remained of Equestria. Of all her projects, there is one whose success was so great, it can still be seen today..."
 shatteredhoof.2.a:0 "...Clearing Local Ruins."
 shatteredhoof.2.b:0 "...Repairing the Azureway."
 shatteredhoof.2.c:0 "...Scavenging the Harbor."
 
 shatteredhoof.3.t:0 "Shattered Hoof: Contemporary History"
 shatteredhoof.3.d:0 "After Ruby Rose died peacefully in her sleep, Shattered Hoof stagnated, without the benefits of Mister Topaz guiding them. While they stagnated, many settlements were created around their borders, rebuilding out of the few ruins, settling the empty desert. This stagnant period ended with an assassination of the then-Boss, Complacency, causing a civil war in Shattered Hoof, lasting for years. Both sides weakened each other, until a third side arose under the guidance of a cunning gunslinger, Deadeyes, the new beneficiary of Mister Topaz. With intelligence and a quick draw, he unified Shattered Hoof under his control, seeking to become even greater than Ruby Rose was.\n\nTo fulfill this desire, he marched the raiders once again, with the raiders overwhelming the many complacent settlements around them. They kept expanding until they could no more, after a staggering defeat in the area known as Leslie. Deadeye's raiders were in the midst of battle with Leslie's settlers, when they were caught off guard and flanked by a massive group of escaped serfs from Neocastle. Crushed between the serfs and settlers, Deadeyes withdrew his troops, leaving behind much equipment for the serfs and settlers to gather, forming the Amethyst Liberation Army. Yet, despite this defeat, Shattered Hoof was back, stronger than ever, unified completely under Deadeyes.\n\nWith all nearby settlements under control, Deadeyes was ordered by Mister Topaz to turn to a more sustainable society. Under this directive, Deadeyes hired mercenaries, Gawdyna Grimfeather's Talons, covered in Appendix One, and, much like Ruby Rose, infrastructure projects. The projects undertaken by Deadeyes had a large effect on some areas of Shattered Hoof, especially..."
 shatteredhoof.3.a:0 "...Through Centralizing Assets."
 shatteredhoof.3.b:0 "...By Settling The Coast."
 shatteredhoof.3.c:0 "...By Building Up Green Crossing."
 
 shatteredhoof.4.t:0 "Shattered Hoof: Appendix 1"
 shatteredhoof.4.d:0 "The Talon Company was one of many mercenary companies hailing from occupied Nova Griffonia, who sold their services to both sides of the war as pay dictated. There were many mercenary companies, but the Talons were one of the largest, and one of the most enduring. After the Last Day, the Talon company split into many smaller companies, who also operated as mercenaries. Stern's Talons in Fillydelphia, Redwing's Talons in Summerfield, Featherbrush's Talons, and, what this appendix focuses on, Gawd's Talons in Shattered Hoof. Gawd's Talons have long roamed the South, working for Appleloosa, Neocastle, and many other settlements over the years.\n\nFollowing Deadeyes' defeat in Leslie, he needed more troops to secure the land he had conquered, and it was for this reason that he hired Gawd's Talons for an extended contract. Her Talons have kept down any rebellions over the years, as well as trained up the raiders of Shattered Hoof, and fought off raids from the Amethyst Liberation Army. Despite Talons being renowned for their loyalty to money, there are rumors that Gawdyna Grimfeathers wishes for more from Shattered Hoof than a mere band of raiders.\n\n-End of Appendix 1. Signed: Sanguine Signature, author of Contemporary Wasteland History. Please proceed to the next page for Appendix 2, focusing on Gawdyna's tactics, and her focus on..."
 shatteredhoof.4.a:0 "...Urban Combat."
 shatteredhoof.4.b:0 "...Siege Warfare."
 shatteredhoof.4.c:0 "...Large-Front Offensives."
 
 shatteredhoof.5.t:0 "Taking What is Rightfully Due"
 shatteredhoof.5.d:0 "It's that wonderful time again where we do rounds on local settlements. Easy picking as always. As much fun as it would be to take everything, we do have to leave them with enough to pay us next time.\n\nThis leaves us with three choices:\n\n First, we take the caps and buy ourselves something nice. It does leave less for them, not that they needed it.\n\n Second, take their guns. This saves us on making or buying them, and has the added benefit of making sure that they can't fight back.\n\n The final option is to instead force them to join us. This will help us recover from any losses we've taken during the course of our raids, but trusting the settlers that hate us with guns might not be the best idea.\n\nWhatever our choice is, we'll benefit and be back for more later as always."
 shatteredhoof.5.a:0 "Caps."
 shatteredhoof.5.b:0 "Guns."
 shatteredhoof.5.c:0 "Recruits."
 
 shatteredhoof.6.t:0 "The Aftermath"
 shatteredhoof.6.d:0 "Gawdyna Grimfeathers never was used to sitting around while others did work for her, but desperate times call for desperate measures. She'd be sat at Deadeyes' old desk, pouring over paperwork and manifests by the old Raider leader, tracking down hidden supply caches and enemy positions. She looks up as the door opens up, multiple Talons entering inside, most covered in some combination of blood and dirt. She gives them all a nod, "Status report, all of you. Goldbeak, what did you get from Junction R-7?" One of the griffons, a cock with golden feathers, nods his head respectfully, "All the Talons are mobilized and securing the country. While there, an army of settlers marched upon us, and made an offer. They were led by a pony called Steel Wall, who offered the help of the various settlers in getting rid of the raiders. Issue is, there's so many settler volunteers that our factories don't have enough workers in many locations."\n\nGawd nods, "Right now, we need bodies and guns, we can fix the economy when we're stable. Moontalon, status of the lands between here and New Mango?" A hen with dark feathers snaps a sharp salute to Gawd, "The land is secured, my squad hunted down the vast majority of raiders, none reached New Mango's borders. However, we noticed a few raider fortifications to the north, which was away from our assigned patrol. They were under attack by troops from the Amethyst Liberation Army last that we saw. In addition, much of the infrastructure seems to have been damaged by the raiders before we could kill them. Trade to New Mango will be slower for the foreseeable future." Gawd nods sharply, "Acceptable, better that the serfs and the raiders fight each other rather than fight us."\n\nShe looks towards the final griffon, a cock with a missing eye and red feathers, "Bloodeye, what's the status of the north?" He bows his head, "Worse than we thought, ma'am. It seems like the raiders have met up with large groups of slavers, using modern equipment, Fillydelphian in style. Their fortifications are thick, but relatively small, hugging the river crossing. I predict this is some move by Fillydelphia to try and secure southern territory. Methinks Stern might be getting jealous of us." The gathered griffons take a moment to chuckle, before they're interrupted by Gawd, "We'll deal with them when we need to. Where's Kaisercrest? I need a report on the Amethyst border." The three gathered griffons look at each other, before Goldbeak speaks up, "Missing in action. We haven't heard word since he left for the border.""
 shatteredhoof.6.a:0 "We're Alive, For Now"
 
 shatteredhoof.7.t:0 "The Corona Massacre"
 shatteredhoof.7.d:0 "Bullets whizz by a scrap metal shack, as the remnants of Kaisercrest's squadron take cover. The bodies of brave Talons are scattered around the battlefield, bodies still warm and bleeding onto the hot desert sands beneath them. Giovanni cannot help but to stare at them, even as the earth rumbles from dynamite and grenades thrown their way. He's knocked out of his reprieve as he's dragged down by Kaisercrest, shouting, "Get a hold of yourself, chick!" His mouth tastes like iron as he looks at all that remains. Kaisercrest himself, Blackpowder, their explosives expert, and Greentail, their healer. He hears words in the distance, but they don't make sense, "-Cover, we're holding for reinforcements! Got it, chick?!" He blinks, and looks at Kaisercrest, eyes unfocused, mouth dry. He can't think of the words to respond. He simply nods, drawing his revolver.\n\nBlackpowder shouts, drawing a grenade and cooking it, "Greentail-" But his words die in his throat, as a bullet hits the grenade in his claw, blowing it up instantly. In a blink and a puff of smoke, Blackpowder is gone, as is half the scrap shack. Greentail's eyes can only stare as he looks at his back half, thirty feet away from the rest of him. At once, the world comes into focus, the smell of blood and smoke, the sound of a bolt action right behind Giovanni. He spins and fires his revolver three times without thinking, watching as the bullets hit a filly no older than fifteen, carrying a bolt action larger than she is. Her eyes take a second to look at his revolver. Her mouth opens, as if to question the situation, but nothing but gurgling comes out, as blood spills from her neck.\n\nGiovanni's talons shake, as he whispers, "No, no. . . no. . ." His revolver falls to the ground, and he rushes into the open, catching the filly as she falls, her blood covering his talons, "I didn't. . . I. . ." Bullets fly by him, bouncing off his armor or just barely missing, while the light drains from her eyes. He's tackled from behind, dragged into cover by the elderly Kaisercrest, "Damnit, chick!" They take cover behind half-collapsed sandbags, while dozens of enemies advance. He shakes, looking down at his bloodstained talons, a faint buzzing in his ears. He's snapped out of it by Kaisercrest, who slaps a new revolver into his talons, looking into his eyes, "Go! Corona's lost!" The elderly Griffon pulls back, drawing his machine gun, "Tell Gawd. And tell the others. . . tell them I went down fighting. Now go!" The command snaps into Giovanni, his wings spreading as he takes off, leaving Kaisercrest behind, his final shots living forever in Giovanni's memories."
 shatteredhoof.7.a:0 "Corona Is Lost!"
 
 shatteredhoof.8.t:0 "The Shattered Hoof Alliance"
 shatteredhoof.8.d:0 "We have received an invitation from Gawdyna Grimfeather, leader of Shattered Hoof, asking us to join up with her in an alliance of Azurian states. She promises massive economic aid to our lands as well as military protection from enormous Easteland powers, such as Red Eye or the Enclave. In return, we would allow Shattered Hoof to become intertwined with the affairs of our land. There are obvious benefits, but it could cost us our independence if this Gawdyna has greater ambitions."
 shatteredhoof.8.a:0 "Seems like a good deal to me."
 shatteredhoof.8.b:0 "We can't trust a griffon. Reject her deal!"
 
 shatteredhoof.9.t:0 "The Problem of Leslie"
 shatteredhoof.9.d:0 "Now that [LRA.GetNameDEF] have been dealt with, we are forced to decide how to deal with the issue of their former territory. While we could just simply claim it as our own territory, a local leader by the name of Rock Solid has come to us with a different proposal: he calls for us to establish a semi-autonomous penal colony to rule over this land. The benefits of such an arrangement are many, as we would have a place to easily send all of our criminals and troublemakers to. They would then be expected to work within the colony, helping develop its industry which would in turn benefit us. However, we would also be losing out on some of the benefits of integrating them, such as more bodies to use in the defence of our nation. How should we proceed?"
 shatteredhoof.9.a:0 "This Rock Solid fellow has a good idea."
 shatteredhoof.9.b:0 "A penal colony? What? Just keep the land."
 
 shatteredhoof.10.t:0 "The Shattered Hoof Compact"
 shatteredhoof.10.d.gawd:0 "Steel Wall isn't the fancy type, showing up at Shattered Hoof Correctional Facility wearing his uniform. Gawd isn't the fancy type either, sitting across from him in her armor, the two uniformed creatures looking at each other from across a table. Steel Wall breaks the silence, "I am here on behalf of the settlers of the towns considered sort of Shattered Hoof. We joined your attack against the raiders because I think you're a reasonable hen. Good blood has been spilled serving your purposes, it's time to pay us back. Our request is simple. You create a formalized system of governance, a system that is not merely the rule of the strong and savage, and you make this a proper country. We also expect that settlements will be given limited self-determination, to end the dominance Shattered Hoof has had over the region alone. I'm not going to leave this room until these demands have been met, Grimfeather. So let's bargain."\n\nGawd's eyes stay locked on the stallion's for a minute, neither of them faltering for a second. After that minute of silence, she gives him a small nod, "I think I can accept those terms. I wouldn't overthrow raiders just to become a raider myself." Her talons tap across the desk slowly, "Many of my Talons have ancestors who come from a place across the sea, back in Griffonia. Cloudbury. There was a revolution in the Empire, and those revolutionaries fled north to Cloudbury when they failed. There, they created the system of 'Republicanism', the idea that a leader is a representative, chosen by the commoners. I'm sure you've heard of The Republic to the north, similar system, stable society, it'll be a system that lasts long after I'm gone."\n\nSteel Wall raises an eyebrow, "A republic? You sent your Talons to die, just to make a republic? What if you get voted out?" She leans back in her seat, "Make it impossible for me to be voted out, for the first election, at least. Announce elections too quickly for others to run. But what else would I do? Monarchy? You must not have met my chicks if you think I'd trust them to be leaders of this place. Dictatorship? Not much different than the raiders. We'll be a republic, just one that's slow, and steady." She grins ever so slightly, "A republic is like a bolt-action. If you move too quickly, it'll get jammed. If you move too slowly, you're going to die. You need the motion to be smooth. If I let others run for this first election, it'll jam the system. We need to introduce the idea of voting to common ponies first, then, give them options. Is this a fair compromise, Steel Wall?" He takes a minute, and then nods, "The settlers of Shattered Hoof accept this proposal.""
 shatteredhoof.10.d.topaz:0 "The traitors have been dealt with, our land has been reclaimed, and our gang is doing better than ever before. Topaz has seen his plans through, and now he stands to enjoy the fruits of his labour. And yet, a familiar greed claws at him. How can he stop here, when there is so much more out there for him to claim? No, this shall not be the end of his ambitions. Ruling over a small desolate slice of land with nothing but raiders to command will not do at all. They must expand further, claim more, and create a force that can rival even the greatest powers of the Wasteland!"
 shatteredhoof.10.a:0 "To A Brighter Future!"
 shatteredhoof.10.b:0 "Glory to Topaz!"
 
 shatteredhoof.11.t:0 "The Dust Settles" #Gawdyna has won
 shatteredhoof.11.d:0 "When Giovanni was given the orders, he almost considered abandoning Gawd's Talons. To take up arms against Deadeyes and his raiders, to fight for Shattered Hoof, it seemed like insanity to the young Talon. Yet five hundred bullets later, Giovanni's worries were proven incorrect, as he stood among the strewn about bodies of raiders in what was once Shattered Hoof's cafeteria. Their cheap armor and poorly maintained weapons stood no chance against well-kept, expensive, maintained Talon weaponry. Yet still, amongst the many dead ponies, a few dead griffons were seen as well. Giovanni shook slightly, while older griffons relaxed, looting the dead, smoking on top of the piles of the dead.\n\nA nearby elder Talon looked up from his rest, offered a cigarette to Giovanni with a small nod, and spoke softly, "First battle, chick?" Giovanni slowly shook his head, taking the cigarette slowly, "No, just. . . I spoke to a few of these raiders, laughed with them, just a few days ago." The older griffon nodded, breathed out a plume of smoke and lounged back, "It happens. Now, though, things are gonna change. We aren't just mercenaries anymore, chick. We're in the big leagues. Just got a few more raiders to put down. Pest control." Giovanni frowned as he smoked, then he looked away as he breathed out smoke, "These are ponies, not pests. I will not think of this as extermination. It is tragedy." The older Griffon took a second, before he shrugged, "Raiders aren't exactly ponies, if you get what I mean. But. . . you've got a good heart, chick. Long as you follow orders, you'll be fine."\n\nAt the end of the older Griffon's sentence, a loud bang would come from above them, as a raider fell from a balcony, broken body joined with the others down below. From the balcony came Gawdyna, barrels of her rifle smoking, who looked down at the gathered Talons, "Missed one, chicks!" Many of the Talons looked over at her, but Giovanni couldn't, he was too busy looking at the now-dead pony, bleeding out on the ground. Gawdyna spoke to them again, "That's enough of a rest, the prison is secured, but there's more raiders out there! Goldbeak, take a squad to Junction R-7, rally more troops, more ammunition. Moontalon, I want your squad covering all the ground between here and New Mango, don't let the raiders escape to thestral lands. Bloodeye, reports are coming of slavers in the north, deal with them. Kaisercrest, take a squad to Amethyst, the serfs are trying to cross the border. Get moving!" At her words, the griffons scattered, gathering guns and ammo and leaving quickly. The elder griffon near Giovanni grinned as he slowly got up, "Well, chick. You ready to go shoot some serfs?""
 shatteredhoof.11.a:0 "A New Boss in Shattered Hoof."
 
 shatteredhoof.12.t:0 "The Dust Settles" #Topaz has won
 shatteredhoof.12.d:0 "Gawd lies dead, and all of the Shattered Hoof gang have bowed down to their true master: Mr. Topaz, the dragon. His voice is pure fury, his eyes forever hold a glint of greed, and he has proven himself more than strong enough to deal with Red Eye's thugs. Now all he must do is reunify the gang, as he has done through proxy many times before, and ensure that their territory is safely in his claws."
 shatteredhoof.12.a:0 "Mr. Topaz is a dragon!?"
 
 shatteredhoof.13.t:0 "A Stable Eastern Border"
 shatteredhoof.13.d:0 "The burden on our eastern border, [LRA.GetNameDEF], have surrendered to our armies after we marched into the region. Though many independent raiders and splinter gangs still resist our forces, they are quickly being mopped up and our rule consolidated. Perhaps even more importantly, this has let the Wasteland know that Shattered Hoof isn't to be messed with, as we are more than capable of defending ourselves and our territory against any who would seek to oppose us. However, we should keep in mind that §R[LRA.GetNameDEF] weren't the only threat to exist to the east.§!"
 shatteredhoof.13.a:0 "Stability at last."
 
 shatteredhoof.14.t:0 "The Beginning of Something Great"
 shatteredhoof.14.d:0 ""Greetings, citizens of Shattered Hoof, and all ponies who are listening in from our allied states. My name is Gawdyna Grimfeathers, current leader of Shattered Hoof. Earlier this year, I, and my loyal Talons, overthrew the raiders and slavers that held dominion over this fair nation. Alongside with Marshal Steel Wall, and many, many lost lives, both Talon and Settler alike, we have made a new home for us all. The time of Shattered Hoof has come to an end, no longer are we a country whose name will cling to a past of violence and death. As of today, I'd like to announce our country as the Provisional Republic of Azuria, where I shall lead as President until such a time that the Republic has been secured from foreign threats. Today, we begin to build something new, a truly Equestrian republic, combining together the old ideals of friendship, harmony, and democracy into one ideology, which will forever lead us forward. Elections will be organized as soon as the Republic is secured, where you, the citizens, will be able to choose your own leader. Some of you may be curious-"\n\nGiovanni ignores the radio playing in the bar, sat in a quiet corner away from it, slowly sipping from a drink, eyes darkened and withdrawn. Medals hang from his uniform, most proud among them the Azurian Honor Medal, given only to the bravest soldiers of the new republic. Yet, the medal is almost entirely hidden behind other medals, shamefully pressed as far back from sight as it can be. He looks into his drink, claws feeling dirty, ears lightly ringing. The others in the bar crowd around the radio, leaving him alone. That is, until the chair across from him is pulled out, and a pony stallion sits within it, wearing a suit. The stallion speaks after a second, "Giovanni Guiseye, aren't you? It's a pleasure. Rock Solid."\n\nGiovanni looks up after a minute, looking over the stallion, and slowly nodding, "That's me." Rock Solid smiles slightly, "You fought in Corona against the Amethyst raiders, right? I used to be the Mayor of Leslie before those raiders came and took it over. Rumor has it that the President is going to put me there again." He takes a second, "Anyway, I wanted to thank you. Kaisercrest might have fallen in Corona, but he gave me and my stallions enough time to escape into Shattered Hoof. You saved a lot of lives." Giovanni just slightly nods, "Not enough." Rock takes a second before he responds, "Never enough. Well, I know a lot of the new army looks up to you. I do too. If you ever have some spare time, swing on by Leslie and maybe we can talk. General Olive Branch and I have something planned." He then stands, as Giovanni looks up at him, "Enjoy your drink, Mister Giovanni. Long live the republic." Giovanni slowly nods, "Long live the republic.""
 shatteredhoof.14.a:0 "Long Live The Republic!"
 
 shatteredhoof.15.t:0 "The Pegasus Question"
 shatteredhoof.15.d:0 "Gawd sits in her overly cramped office, reports and papers waiting to be signed stacked in unstable towers, while Marshal Steel Wall and General Olive Branch sit in front of her. She nods, "Gentlestallions, we have an issue. While we were busy fixing Shattered Hoof, enemies have gathered at our borders, posing a major threat to the Republic. The Grand Pegasus Enclave poses a threat to the longevity of this Republic, and we aren't leaving this room until we've decided what to do about them. You two might not be the highest ranking or most respected members of the military, but I know you disagree on a lot. If I'm making this decision, it's not going to be alone. Marshal Steel Wall, you can speak."\n\nSteel Wall nods respectfully, "This isn't a question, Madam Interim-President, there's only one answer here. The Enclave are too big, and too close, of a threat for us to ignore. We have everything to lose, and everything to gain." He sets a hoof on the desk, "Those Pegasi are looking down on us right now, because they see us as the threat we are. Fillydelphia's a roving band of raiders, they don't fear them, but we? We're a proper nation, we're the inheritors of Equestria, we have thousands of willing volunteers who will march to their death tomorrow if it means taking out those winged bastards!" He huffs, "Every day our ponies look into the sky, they see a reminder of who our true enemy is. This Enclave, these Pegasi, they've taken our birthright for two centuries, they've let our home starve for sunlight, they've let famines go uncontrolled, with just a bit of sunlight would solve it. The Enclave has already killed millions of ponies through their theft of the sun, and I won't have us sit here for another minute, while they kill more!" He slams his hoof down, and then leans back, "We should march through those damned swamps and tear down their clouds, bit by bit, bullet by bullet. Those who survive will make for good citizens, too. Give me fifty Pegasi and I can bring rain to a drought, give me one hundred and no pony will ever starve again. Give me a squad in power armor and we can fly into Fillydelphia tomorrow, and kill Red Eye in one night!" He leans back, and smooths out his uniform, "There's no debate here."\n\nOlive Branch immediately speaks up, "Madam Interim-President, it is true that the Enclave is a threat, but it isn't our place to strike first. Imagine how it'll look to the common ponies, they'll think you're just another Ruby Rose, expanding for your one benefit. The Enclave are horrible, but if we are to go to war, we need to wait for them to attack us, and all the nation will rally. Besides, we can't sustain a war effort. Our factories have just barely gotten back to functioning across the nation, our soldiers hardly have enough ammunition to train, let alone go to war. The Hayseed Swamps will devour our supplies until our soldiers have nothing to fight with but their hooves and teeth. If we are to attack the Enclave, we need to ensure we will win, and we will win decisively. How many thousands would die if we attacked now? Enough that the swamps would turn red." Steel Wall speaks up, "What about the Hayseed ponies? They're fleeing the Enclave's control, who knows what they're doing to them?" Olive Branch shakes his head, "If they are fleeing then we will welcome them! How many will die in the crossfire if we march in today?"\n\nGawd holds up a claw as Steel Wall makes to respond, "That's enough. Steel Wall, you had your time to speak. Olive Branch, thank you." She looks between them both, "You both made good points. But only one of you were correct.""
 shatteredhoof.15.a:0 "Olive Branch's Pragmatism Wins Out."
 shatteredhoof.15.b:0 "Steel Wall's Aggression Wins."
 
 shatteredhoof_ncr.1.t:0 "The Unification Proposal"
 shatteredhoof_ncr.1.d:0 "A new proposal has been sent to us from the Provisional Republic of Azuria: they ask that we unify with their lands to form a new collective democratic government. The proposition also outlines how the cooperation and integration of our militaries and economies have greatly improved the lives of our citizens, as well as the citizens of other members of the alliance. The proposal recommends that we also hold a vote to our citizens on whether or not we should unify with Azuria. Being a founding member of such a state could reap huge benefits in the long run, at the cost of losing most of our autonomy. It is certain that Gawdyna would not take our refusal lightly."
 shatteredhoof_ncr.1.a:0 "We're glad to join."
 shatteredhoof_ncr.1.b:0 "Thats going too far."
 
 shatteredhoof_ncr.2.t:0 "The Birth of the New Canterlot Republic"
 shatteredhoof_ncr.2.d:0 "Good day, Talons, Rad Fishers, Rock Farmers, New Mangoites, ponies from across Azuria and Leslie, my name is Gawdyna Grimfeathers. Over the past month, the leaders of the members of the defensive alliance unifying our lands have met in Shattered Hoof. Over this month, we have argued and discussed the creation of a new state, a state that will be, unquestionably, the power of southern Equestria. It is my pleasure to announce to everyone listening today that, as of five minutes ago, we have signed a constitution into place, officially creating the New Canterlot Republic. We are the official successor to Equestria, which has long been dead. Others, like Red Eye in Fillydelphia, might claim their own status as a successor, but it is only this fair Republic that will act on the old ideals of Equestria. Friendship, Harmony, Democracy, Freedom, these four values will guide our society into the future, to create a better society than this land has ever seen.\n\nDuring the war, the state of Equestria did many horrible acts, acts that we will never repeat. The Ministry of Morale's surveillance, the unethical experiments of the Ministry of Arcane Sciences, the corruption of the Ministry of Wartime Technology, the censorship of the Ministry of Image, the unbridled power of Princess Luna; these will have no place in our society. The constitution of our fair republic will ensure this, bounding the power of the President, and of all government representatives. Feel free to go to your local town hall to ask for the full list of rights the constitution grants to you. Most important of them are freedom of speech, to ensure Morale can never again exist, freedom of the press, to prevent Image from ever happening again, and freedom of religion, to protect the minority groups of our republic. As a republic, it is paramount to our rights, and is center in our constitution, the right that every citizen has to elect their own representatives. Elections will be held, and you, the common creature, will be able to vote on the way forward for our country, like never before seen in this land.\n\nDespite the mistakes of the Diarchy in the past, we will still pay tribute to the alicorn sisters for protecting our land for so long. On our new flag, there will be Luna's moon, and Celestia's sun, symbols to make sure we never forget our own history. Our flag will be a tricolor, like most republican flags. It will have purple on it, representing the republic itself, a reference to the Zonician Republic of ancient times. White on it will represent the purity we promise to bring to the wasteland, its color that of Celestia's fur, as we will return the land to the health it once had under her. Finally blue, representing the Azureway, our economic lifeline, based off of Luna's fur color, as she brought Equestria untold modernity and prosperity in her short rule. Our flag already flies high above New Canterlot, the new capital of the Republic, founded in the old city of Junctiontown.\n\nLong may Equestria live, long may be our citizen's lives, long live the Republic.""
 shatteredhoof_ncr.2.a:0 "Three Cheers!"
 
 shatteredhoof_ncr.4.t:0 "Growing Pains"
 shatteredhoof_ncr.4.d:0 "The sounds of shouting and routine gunfire fill Camp Quarrel, as soldiers from all over come together as one. An Azurian officer stands, watching grenade practice, "Before you throw a grenade, you need to shout to warn your fellow soldiers." A Rad Fisher steps up to the throwing line, blinking as they look at the crates of items to throw, "Uhh, sir, these are potatoes. Why are we throwing potatoes instead of real grenades?" The officer steps closer to the Rad Fisher, smirking, "Because real grenades are valuable. In fact, a lot more valuable than you." He picks up a potato and slaps it into the hoof of the Rad Fisher, "Now get throw-" Before he can finish his sentence, a Rock Farmer speaks monotonely, "Fire in the hole." She picks up a potato and throws it at a practice target, nailing it in the head, squishing the potato. The office scowls, "I said to shout when you're throwing!" She looks over, and blinks, tilting her head, "I did shout." He scowls more, "You also are throwing way too strong, filly." She tilts her head more, and looks at the potato, then back at the officer, blinking again, "You expect me to do weaker than that?"\n\nElsewhere, a Leslie former-serf aims a bolt-action, hitting a target dead on, while a thestral loads magazines next to them. The former-serf grins slightly as he cocks the bolt-action of his rifle, "Whew, this reminds me of my time before we escaped. Used to work for the Miner's Guild." The thestral nods, "Miserable conditions are the same?" The stallion grins, "And our 'masters' are even worse. Heh, back then, though, I had this magazine with a picture of ol' Luna in it, wearing this nice, blue dress. Got me through a lot of tough times, you know, Luna's a looker, well, was a looker." The thestral looks up and frowns, "Luna's my goddess, dickhead." He looks over and smirks more, "Hey, if a bit of worship got her next to me in a wedding dress, I'd call her a goddess too, buddy." The thestral scowls, throwing down the magazine, and tackling the stallion.\n\nThe officer rubs his eyes as the Rad Fisher's potato splats against the ground, "You would have just killed us all if that was a real grenade." His ears twitch and he looks over, as the thestral and the Leslie soldier start to fight, "Shit." He rushes over, watching as the thestral wails hit after hit onto the stallion beneath, "Stop! Stop this instant!" The thestral shouts out, slamming their hooves down on the stallion's face, "My goddess is not some cheap hooker, you fuck!" The Rad Fisher looks over, "Did someone say hook?" The officer moves in to break them apart, but all goes still as a voice booms across the entire camp, "Stop!"\n\nA potato comes flying like it was shot out of a cannon, smacking right into the thestral's head, sending them flying off the Leslie soldier. The Rock Farmer mare stands proud, and then looks confused as everyone turns to look at her, "What? I shouted this time.""
 shatteredhoof_ncr.4.a:0 "This Is Gonna Take A While..."
 
 shatteredhoof_ncr.5.t:0 "Demobilizing the Economy"
 shatteredhoof_ncr.5.d:0 "With our immediate problems solved and our republic stable, we can now see to the restoration of a civilian economy. Many militarists within our government are concerned that doing so will lead to our ultimate downfall, but President Gawdyna has written off their concerns as paranoid nonsense, along with reminding them that the whole purpose of our government is to serve the people rather than the army. Our citizens are welcoming this change, as this will mean more luxuries for them, more profit for the business owners, and easier shifts for the factory workers."
 shatteredhoof_ncr.5.a:0 "A return to peace."
 
 shatteredhoof_ncr.6.t:0 "First Election of the New Canterlot Republic"
 shatteredhoof_ncr.6.d:0 "The streets of Leslie are lively with celebration as the results of the election are announced. Gawdyna Grimfeathers and the United Republican Party have won every seat across the nation, ensuring her position and her agenda as President. Within city hall, Governor Rock Solid paces, while Giovanni watches, nursing a drink. Rock shakes his head, "I can't believe this. 'Free and fair elections' my ass! What's the point of an election if you can only choose one candidate, one party?" He scowls, "I submitted my paperwork day one, immediately after I was able to, but nope, didn't get filed in time, guess I didn't appear on the ballots. That would have been a problem for 'Madam President', democracy? What's that? Never heard of it!" He trots up to a window and looks outside, to the streets filled with celebrating ponies, "She would have won anyway! Imagine what this looks like to outsiders, to The Republic, to Friendship City, it's ridiculous, even the Commonwealth would laugh at us! This isn't a democracy, this is a dictatorship with votes, I guess we have a new Luna in charge!"\n\nGiovanni nods softly, watching Rock pace, "She's afraid, Rock." Rock looks over, and he continues, "She's wrong. I didn't. . . I didn't fight for her to pull this stunt. The blood we spilled, for this? It's ridiculous, you're right. You're right. But she's afraid." He looks away, speaking softer, "We lost a lot of Talons, a lot of brothers and sisters, fighting the raiders. Fighting Amethyst. Her own chicks were almost killed a few times." He pauses, and shakes his head, "She doesn't want everything to go to waste. All the sacrifice, all the. . . all the blood." The door to the room opens, as Giovanni continues, "She just needs to be not afraid, and we'll make sure this can't happen again. Next election. Until then, we. . . we fight for the republic. On the battlefield, and in the streets."\n\nFrom the open door, Olive Branch steps in, "The cock's right, Rock Solid, our constitution gives us a chance. Gawd was able to do this because she's far more popular than anyone else, so we need to change that." He looks toward Giovanni, and gives him a nod, before looking back towards Rock, "Gawdyna is going to lead us to war. Blood is going to spill, and we need to seize that opportunity. For every widow, every orphaned foal, we will be there to offer them another choice. Our road isn't going to be easy, but come next election, we'll make sure there's a choice. A choice between blood, or peace. The army respects me. The citizens of the east respect you, Rock. Giovanni, lots of the common soldiers and veterans like you. We've all seen our fair share of blood." He looks between the two, "No more blood. The Equus Amnesty Party will bring proper democracy, peace, and justice. Are you two in?"\n\nRock looks out the window, seeing a few ponies looking out from inside their own houses, "This land's filled with old serfs, saw their families sent away to war. Others watched as the raiders killed their foals. Leslie's lost more than it can take. I'm in, Olive." After a minute of silence, the other two stallions looking at him, Giovanni nods. He looks down at his talons, and closes his eyes, smelling blood faintly, hearing the echoes of gunfire. He opens his eyes, and looks back up, "No more blood. I'm in.""
 shatteredhoof_ncr.6.a:0 "Long Live President Gawdyna"
 
 shatteredhoof_ncr.7.t:0 "The Equus Amnesty Party Founded! "
 shatteredhoof_ncr.7.d:0 "Giovanni stands on stage, looking over a crowd of thousands of ponies, filling the central square of New Canterlot. He remembers last time, receiving his medal, now brought out of its shameful hiding to be displayed proudly on his chest. A request from Olive Branch, the medal gleaming in the dim sunlight. He looks out over the crowd, a mixture of respectful voices, their voices whispering to each other, looking up at him. Governor Rock Solid stands next to him, and gives him a small nudge from the side. Giovanni looks over, and Rock gives him a small nod. He stands straighter and prouder, his feathers puffing out as he looks over the crowd.\n\nThe crowd goes silent, as General Olive takes the stage, stepping up to a microphone, "Thank you, every creature, for coming to listen. Thank you to every member of our proud armed forces, every politician, and every voter. Today, history is made, my friends. Our first election was rife with controversy, from the decision to have it take place before other parties were created. A vote with only one choice is not a choice at all, many would say, yet our Republic still represents something great in the world. Yet no democracy survives with one party alone. That is why, today, I'd like to announce the creation of the Equus Amnesty Party, a party of peace, prosperity, and justice. As you can see, I have already secured support from renowned hero of the Battle of Corona, Giovanni Guiseye, and Governor of Leslie, Rock Solid. Mister Giovanni saw firstclaw the horrors of war, the death and destruction it can cause. Governor Rock Solid has seen the lasting effects, the widows, the orphans, the starving veterans. To this, I say, no more!"\n\nGiovanni almost looks away, but he stands proud, nodding along as his name is said, and Olive continues on, "The United Republican Party is a party of war, of blood and death, President Gawd will lead our fair ponies nowhere but the grave! We spend thousands of caps on bullets and bombs, while our foals don't know how to read, while our citizens toil day to dusk to barely afford food for the next morning! This is a disgrace! We are not the police of the Wasteland, it is not our role to decide who should and shouldn't die, while we ignore our own citizens!" The crowd loudly cheers, with him waiting for the cheering to die down, before he continues, "Our Republic has already overstepped our bounds. When we marched into Leslie and crushed the Amethyst Liberation Army, we killed hundreds of ponies who were just trying to protect their home! We gave lives to take lives, just to please the imperialist mindset of our President! How long will it be before that happens again? How long will it be until your spouse, your foal, your parents die in some foreign field, just to enrich our 'President'? How many need to die to sate Gawd's greed? I don't know about all of you, but I don't want to find out!"\n\nThe crowd cheers loudly, and Giovanni smiles widely, standing straight, his eyes meeting the eyes of dozens in the crowd. He only stops when he hears Rock mutter beside him, "What does he think he's saying?""
 shatteredhoof_ncr.7.a:0 "Welcome To Democracy"
 
 shatteredhoof_ncr.8.t:0 "The Divide"
 shatteredhoof_ncr.8.d:0 ""Leslie was a mistake?!" Giovanni sits in the Equus Amnesty Party's headquarters, his eyes looking down at the floor while Rock Solid shouts. Rock slams his hoof down on Olive's desk, "They were using foals as soldiers, Olive! You heard what Giovanni went through, are you seriously saying that we should have let them live?!" Olive takes a deep breath, "How many of those foal soldiers did we kill when we attacked them, Rock? How many parents lost their children because of us? Yes, the Amethyst Liberation Army was bad, but we could have solved it some other way. There were good ponies there." Rock scowls, glowering down at Olive, "Is this what you meant by 'peace', Olive? This isn't peace, this is cowardice! What, are you just going to sit by as Fillydelphia expands? Watch as they whip their slaves, kill thousands every day? You just can't handle getting some blood on your hooves!"\n\nGiovanni looks at his talons. They feel dirty. Olive stands up, staring down Rock Solid, "Is that supposed to be wrong, Rock?! Yes, I don't want blood on my hooves, that doesn't make me a coward, that makes me sane! We can help ponies, we can free them, it doesn't have to be through blood! We can make deals, we can integrate them slowly, like the Rock Farmers, like the Fishers, like Mango, no blood needs to be spilled! Conquest isn't the act of a moral republic, Rock, it's the act of a raider." Rock slams his hoof down again, and then turns and trots away, shaking his head, "Raider?! You would compare us to them!? We aren't going to war for loot or tribute, we're going to war to free ponies, that's what peace is! If you stand idly by while others die, then that's no peace at all!" Olive scowls, "I'm sure the dead appreciate their liberation, Rock. When I said peace, I meant just that, peace. War is a wrong to avoid!" Rock spins around, "Wrong? Is what Giovanni did wrong, Olive?!"\n\nHe stands and shouts, "Shut up!" Both stallions go quiet in an instant, heads looking over, as his feathers bristle, "S-stop using my name like I'm not here! Stop treating me like I'm some pawn! Stop pretending like I agree!" He pants softly, and closes his eyes, smelling blood, breathing shakily, "I killed a filly, it was just instinct, I didn't mean to do it! And for what, why, why did I do it? Just so I could live? S-so we could protect some stretch of land?" He shakes as he opens his eyes, which water up, "I was wrong! If I could go back, I'd rather shoot myself than-than do that ever again! Why do you think I'm here?!" He sniffs slightly, and turns away, "If this party can save even one filly, maybe I won't think of her every night. . . I killed her to save myself. I might as well do something valuable with my life." He then turns back to Rock, "So yes, I was wrong! And if you disagree, if you think I was right to shoot that filly, then leave. Now! Get out and take everyone with you who agrees! And don't ever, ever come back!"\n\nRock looks at Giovanni, and then at Olive. After a minute, he trots out, leaving the two of them behind. Olive slowly comes from behind his desk, approaching Giovanni and nudging his side, "I. . ." Giovanni looks back at him, and nods slightly, "Let's save fillies, Olive." Olive takes a second, and then nods, "Let's save fillies.""
 shatteredhoof_ncr.8.a:0 "War In The Party For Peace?"
 
 shatteredhoof_ncr.9.t:0 "Foundation of the Patriotic League"
 shatteredhoof_ncr.9.d:0 "Marshal Steel Wall sits in his personal office, looking at the stallion across from him, a smirking Pegasus wearing mirrored shades over his eyes. The Pegasus speaks up, wearing a fine suit, "Marshal Steel Wall, it's a pleasure to meet you, I'm so glad you finally accepted a meeting with me. I'm Agent Muddied Waters, part of the now defunct intelligence service of Neighvarro. From asking around, I've picked up that you represented the settlers of this fine nation when Gawdyna Grimfeathers was still taking over, is that correct? And many of those settlers are now members of the armed forces." Steel Wall nods, "Yes. Get to the point." Agent Waters grins softly, "Now now, I'm not a rushing type of stallion, you'll have to bear with me. See, I understand from that little tidbit of history that you, Marshal Steel Wall, are a stallion of the common pony. You secured representation for the common settler, not to mention well paying jobs in the army, while Gawdyna Grimfeathers was busy playing rebel in an old prison. You, Marshal Steel Wall, are a stallion to respect. And you have plenty of that respect."\n\nSteel Wall slowly nods, as Agent Waters continues, "Gawdyna Grimfeathers doesn't represent the common pony, you see. That election she held? Laughable. The Grand Pegasus Enclave wasn't the perfect democracy, of course, but even we had the decency to provide at least two options for every vote. And the opposition parties? General Olive Branch would have us sit around and wait until Red Eye puts chains on us all, and Governor Rock Steady is too pacifistic for the militarists, and too militaristic for the pacifists. Your republic needs a savior, Marshal Steel Wall, and I think there's no better savior than you." He snorts slightly, "Why would you want to help us? We conquered you." Agent Waters smiles, "Yes, you did conquer us, now I am part of your country, and I'd rather my country not collapse to invasion again. I'm a patriotic stallion at heart, Marshal Steel Wall, and I love democracy. Right now, this country needs someone willing to protect its democracy from the one who founded it."\n\nSteel Wall takes a second, and then slowly nods, "You want me to become a politician?" Agent Waters chuckles softly and smiles, "Astute as ever, Marshal Steel Wall, yes, I want you to become a politician. I can promise many of the Enclave will support you, as will many militarists. You need to use the bully pulpit to call for investment into the armed forces, and all the industry connected to it. You need the support of the commoners, because if the day comes where Gawdyna decides to do away with this facade of a democracy, those commoners need someone to stand up for them, and do what's right for the republic."\n\nHe takes a second, and nods once more, "I see your point. Well, Muddied Waters, how does campaign manager sound instead of agent?" Muddied Waters grins slightly, "That sounds perfect to me, future President Steel Wall.""
 shatteredhoof_ncr.9.a:0 "Who Protects The Republic?"
 
 shatteredhoof_ncr.10.t:0 "The First URP Yearly Convention"
 shatteredhoof_ncr.10.d:0 "The United Republican Party has held it's first annual convention, an event meant to celebrate the achievements of the URP and to discuss matters of the Party as well as its future policies. Supporters and government officials loyal to Gawdyna gathered to discuss and to listen to speeches from various party officials, all speaking on how to follow their beloved president's vision for the future. After a long speech from her, a series of speeches and announcements from many party officials followed, each one seemingly trying to outdo the last in terms of zealotry and patriotism. One could be forgiven for mistaking this to be a Patriotic League rally. The convention was uneventful, that is until the event was about to close...\n\nSecretary of the Treasury Mr. Waterworks unexpectedly took the podium shortly after the announcement for the convention's closure and called for everyone to hear what he has to say..."
 shatteredhoof_ncr.10.a:0 "..."
 
 shatteredhoof_ncr.11.t:0 "Secretary Waterwork's Speech"
 shatteredhoof_ncr.11.d:0 ""Citizens of the NCR and members of this convention, I speak to you today on matters of the very way our great nation is currently functioning, on the matters that the representation of our government is currently extremely flawed, on matters that our first election is also extremely flawed, and how our leadership poorly represents who we are as a people and a nation...\n\n...The simple fact is that our first election for president was a complete fraud and utterly pointless, what good is an election process if there is only one candidate to choose from? There was no time for somepony else to contest Gawdyna's candidacy, nor was there any dedication of her wanting to hold a fair and open election, just empty promises, it seemed that she was more concerned getting it over with and taking the reigns as quickly as possible with no concern that there are those that are not supportive of her leadership. Her history as a mercenary for a ruthless slaver is proof that her causes were more in line with her personal quest for glory and power and not the betterment of the wasteland's people, thus her presidency is greatly immoral and illegitimate...\n\n...The absurdity that a griffon now rules over our nation, a pony majority country, greatly undermines the true representations of the NCR and is a direct threat to the largest demographic of our nation. It is vital that this griffon resigns from her post and allows for better representation to take form in our country and for true leaders to take the reigns, not some petty gun for hire with ambitions for power and wealth. If this mercenary ever dares to run for her next term; then I will take those who agree with what I have told you, and split from this illegitimate party to undermine the questionable aims of this griffon."\n\nThese were some of the most important notions from an hour long declaration from the Secretary of Treasury that Gawdyna's Presidency is illegitimate, and that if she runs for the next election Waterworks will split the party and create a splinter faction within the URP known as the Free Ponies Party. What followed after the speech was cries of various support, some called Waterworks a traitor among other slurs, while some praised his words, crying that Gawdyna is a traitor to the NCR's ideals and she should resign. Things grew chaotic with Military Police sent to settle things down. It's unclear what may follow from this drastic turn of events, but what is clear is that the foundations of Gawdyna's Presidency and her party might be starting to crumble."
 shatteredhoof_ncr.11.a:0 "What did he just say?"
 
 shatteredhoof_ncr.12.t:0 "Citizenship Act Approved"
 shatteredhoof_ncr.12.d:0 ""Good morning, citizens of the New Canterlot Republic, this is your President speaking. I am proud to announce to everyone that today, a new mark in history has been made for our great nation. For too long, many in this land have seen Equestria as a nation, purely, of ponies. Before the Last Day, Equestria was treated as a place for earth ponies, pegasi, and unicorns alone, even the thestrals were excluded. In the aftermath of the Last Day, the ponies of the Wasteland didn't learn their lesson. They changed citizenship, not to include others, but to exclude the pegasi who left them. This, all of this, has been a stain on this land, on our fair republic, for too long. Harmony, friendship, democracy, these things are not limited by species. Feathers or fur, claws or hoof, stripes or no, we are, all of us, rational, thinking beings, deserving of our natural rights.\n\nMany would embrace the griffons of our country, but try to reject others. Many will make claims of danger, or inbred criminality, or unintelligence. Many will blame for past mistakes, past misdeeds and failures. All of these are flaws that we, as a nation, must work to overcome. Last night, in a session of the Senate, the 'Citizenship Act' passed almost unanimously, granting, in one grand sweep, citizenship to every creature in our fine nation. It does not matter where you come from, we will not make the mistakes of the past, we will accept you. Like I said, every creature is deserving of our rights, and we would be damned to turn any freedom loving individual away from our borders, from our halls of power, from our nation.\n\nCelestia and Luna, for all their benefits, had this as one major flaw. When the griffons of Nova Griffonia exiled the Yaks from the west, Equestria did not open its doors with open hearts, instead, they let the Yaks find their own place. When we pushed back the Buffalo, we didn't take them in as valuable citizens, instead, we treated them as if they were enemies. When changelings fled from Mad Queen Chrysalis' failed unification wars, Equestria did not open their hearts for their love-bug friends, but slammed the gates shut on them. No more, I say. Be you alicorn, or hellhound, changeling, or deer, be you pony, zebra, or griffon, equine, avian, bovine, all creatures have a place here. All creatures have a home here. Thank you for listening. Long live the republic.""
 shatteredhoof_ncr.12.a:0 "A Home, For All."
 
 shatteredhoof_ncr.13.t:0 "Field Marshal Steel Wall Protests"
 shatteredhoof_ncr.13.d:0 "Governor Rock Steady sits in his home, listening to a radio while he pens law proposals and acts for the United for Peace Coalition to listen to. On the radio, it switches quickly from songs, to a speech, given by the familiar voice of Marshal Steel Wall, ". . . It is obvious that these military reforms the President seeks to pass are nothing more than a grab at power by her. When the armed forces of our republic were created, we swore an oath to protect the constitution we helped write, we swore to protect the democratic rights of every citizen in our borders! We've seen the President slowly eroding the very rights she helped to establish, sham elections, wasting of the budget without caring about our citizens, and now, she wishes to cut back the armed forces, the last line of defense of our rights? If we continue to sit around and watch idly as she takes more and more power, then soon, we'll be nothing more than puppets dancing on Gawd's strings!"\n\nRock frowns softly, and flips the channel, hearing a much more smooth voice speaking, Campaign Manager Muddied Waters, ". . . What Marshal Steel Wall is saying is correct, and, I might even hold, far too kind for what is truly happening. Madam President Gawdyna Grimfeathers says that her proposed military reforms will make it more efficient, she says that by removing the influence of the army, they will ensure civilian governance forever. However, I cannot help but notice, the civilian governance just so happens to be filled with members of the United Republican Party, bar the few who have defected to other parties. Our military serves to protect the decency and democracy of this nation. What Madam President Gawdyna Grimfeathers asks of us is not to allow the military to not interfere, it's to stop the military from saving our country should the time come. And might I remind all of you listening about Madam President Gawdyna Grimfeathers' personal Talon company? She's already shown a willingness to use them to get her way, are we willing to sit by and trust a President unchecked, with her own private military force? I think not."\n\nRock frowns and changes the channel once more, hearing the familiar voice of Olive Branch speaking, ". . . While I must agree that we need to prevent the army from having an influence over our civilian government, to prevent us from becoming a junta in all but name, I must protest and question the motives behind this sudden decision. With the URP holding complete control over our nation, neglecting those of us who don't agree with their point of view, one must question if this reduction in military oversight of the government is just a way to hide upcoming controversial decisions. We must have a transparent government, and Gawdyna isn't going to give us one willingly, my fellow citizens."\n\nRock switches off the radio entirely, and sighs. It seems like the Equus Amnesty Party and Patriotic League are in one against Gawd's decision here. She'll be looking for support, and if she can't find it, then she'll likely draw back her decision. Rock picks up a piece of paper, realizing what he writes will determine the future of the country. After a minute, he puts pen to paper."
 shatteredhoof_ncr.13.a:0 "A Letter of Disapproval"
 shatteredhoof_ncr.13.b:0 "A Letter of Agreement"
 
 shatteredhoof_ncr.14.t:0 "The Enclave Act"
 shatteredhoof_ncr.14.d:0 "Gawd finds herself in her office once again, looking down at The Enclave Act, an Act that, if passed into law, would pardon all Enclave personnel. Across from her sits Steel Wall, and Campaign Manager Muddied Waters, a constant grin on his face. Gawd looks up from the act, "You have five minutes to convince me to support this comedy." Steel Wall gives her a steely nod, "The Enclave didn't show us mercy when we fought, but we didn't either. Their officers and scientists were following the orders of a flawed state, that doesn't mean they were evil, it means the state they served was evil. There are brilliant minds being kept in our prisons, minds which could lead us to victory against Fillydelphia, which could unlock the secrets of energy weapons, of power armor. With the Enclave on our side, we can ensure nobody, not Red Eye, not the Steel Rangers, nobody can oppose us."\n\nGawd shakes her head, "This is ridiculous, you want to empower the military, of course. Do you think I'm blind? Here you are, sat with some suit by your side, telling me to give you more power, do you think I'm an idiot? I see this for the grab for power it is. Your party is supported by the Pegasi, supported by the army, so of course, let's release a bunch of Pegasus criminals who will flock to the army. Am I supposed to be surprised when I eventually see them as part of a coup, Steel?" Steel frowns, "I am loyal to this republic, Gawd. I want what is best for it, but you think this is a grab for power. The United for Peace Coalition support this too, even the EAP are partly for it. The nation is asking for you to release them. If only you hadn't rigged the last elections, this might have been solved as the commoners want." She scowls, "I won't have my republic be filled with criminals let loose! Look at what they did while they served the Enclave."\n\nMuddied Waters clears his throat, and smiles, "My apologies, Madam President Gawdyna Grimfeathers, but I'm afraid there's a point of contention. It is true that these officers and researchers did bad things under the command of the Council, I'd never deny that. But, if I'm not wrong, wasn't it you, Madam President Gawdyna Grimfeathers, who worked under the Shattered Hoof Raiders for years as an enforcer?" She scowls more and opens her beak to speak, but he cuts her off, "Not to imply anything about your character, you are an unimpeachable bastion of this nation's values. Yet to the common pony, it might be seen as a point of hypocrisy if you were to punish these Pegasi so harshly. I can only imagine the whispers among the other opposition parties if they heard what was happening here. Of course, it's not my place to decide such important matters, but you, Madam President Gawdyna Grimfeathers, are the mother of the republic. You have a reputation to keep.""
 shatteredhoof_ncr.14.a:0 "The Act Fails"
 shatteredhoof_ncr.14.b:0 "The Act Passes"
 
 shatteredhoof_ncr.15.t:0 "Farsight Reaches Out"
 shatteredhoof_ncr.15.d:0 "To the west of New Canterlot is the region of Appleloosa, and, of particular note, the city of Old Appleloosa. Old Appleloosa has long been the center of the southern slave trade, with their slavers going across the south of Equestria, grabbing poor ponies and shipping them north to Fillydelphia. The only real opposition to the slavers are those who believe in the idea of 'Mixie', a party that simply wants to do slavery in a kinder way, and not align with Red Eye in the north. If the slavers stay in power, then Red Eye will likely protect them, and if those 'Mixie' believers take over, then they'll likely be able to put up a good fight against us.\n\nHowever, amongst the deserts of Appleloosa are the Appleloosan Rangers, a group of survivalists and well-trained special forces who have long believed in the call for freedom that our republic stands for. They've opposed slavery at every turn under the command of Farsight. Despite all their opposition, though, they're unable to change Old Appleloosa on their own. Recently, though, a detachment of Rangers arrived in New Canterlot, asking to make a deal.\n\nThe Rangers plan to cause a rebellion in Old Appleloosa, allowing New Canterlot to intervene and support them, making for a much easier conquest. The only issue is, the Rangers want to be autonomous, while they'll support the Republic, they'll still operate on their own. If we accept their offer, it'll make for an easier conquest, but it'll take much longer if we ever hope to core the agricultural lands of Old Appleloosa. However, many in our nation support the Rangers, and if we were to turn them away, it would cause some protest from many groups."
 shatteredhoof_ncr.15.a:0 "Aid the Rangers"
 shatteredhoof_ncr.15.b:0 "Turn the Rangers Away"
 
 shatteredhoof_ncr.17.t:0 "The NCR Census Results"
 shatteredhoof_ncr.17.d:0 "Our census takers have been hard at work, going door to door and town to town to tally up all of the citizens of our Republic. As the numbers pour in, they are tallied up and totaled by the many regional census offices set up to deal with this process. Each and every settlement, no matter how big or small, must be counted if we are to ensure an accurate number for our total population. As this continues, a surprising discovery is made in the lands around New Canterlot..."
 shatteredhoof_ncr.17.a:0 "There are a large number of military-age citizens not registered for the draft."
 shatteredhoof_ncr.17.b:0 "There is a large community of undocumented individuals."
 
 shatteredhoof_ncr.18.t:0 "Preparing For Breach"
 shatteredhoof_ncr.18.d:0 "The shield protecting what is believed to be the SPP Hub is one of, if not the, strongest we have ever seen. No weapon has been able to penetrate it and no spell has been able to bypass it, with even our brightest minds unable to figure out how to get past the shield. Until now. \n \n The team dedicated to finding a way through this most durable arcane fortress has devised a plan that they believe would allow a small team to slip in. Their plan revolves around taking a bypass spell, which has thus far proven insufficient in breaching the shield, and turning it into a megaspell. This, they believe, will be enough to allow a small team to be teleported into the facility. \n \n As the sun rises, their plan is put into motion. A team of highly talented unicorns, some of the best within all of the NCR, get into position, while another team checks the massive spell matrix drawn around the shield for any errors. As the all clear is given, the unicorns begin casting what may very well be one of the most complex spells to be created since the War. All of Neighvarro lights up, as they draw more and more power from two immense magical reactors: one from the base itself, and another scavenged from one of the Enclave's mighty Raptor-Class cloudships. The light grows brighter, as their spell enters the final steps of casting, and the expedition team prepares themselves for what lies ahead. Finally, with one great release of energy, the megaspell is cast... "
 shatteredhoof_ncr.18.a:0 "NOW!"
 
 shatteredhoof_ncr.1811.t:0 "In the Belly of the Beast"
 shatteredhoof_ncr.1811.d:0 "The team finds themselves in the center of the facility, facing numerous terminals and advanced electronic equipment. Looking around, they can't help but to appreciate the complexity of the facility they find themselves trapped in. Cutting edge technology, impressive even by Wartime standards, lines the walls. Unfortunately for the team, no obvious method of turning off the shield outside presents itself. \n \n As they continue exploring the facility, they run into another problem: much of the facility is locked off, and the door controls appear unresponsive. Despite being trapped within the control room itself, they lack any real method to take control of the facility. Without a way out, and with their radios failing the moment they appeared inside, they had no way to contact the team outside. And as such, they had no way to be extracted from what could very well become their tomb. \n \n As this realization dawns on the team, several of their members begin to break down. Panic closes in, and their expedition becomes rapidly disorderly. Escape seems impossible, their mission seems to be a failure, and their sacrifice will have been in vain. That is, until a monitor flickers to life before them."
 shatteredhoof_ncr.1811.a:0 "..."
 
 shatteredhoof_ncr.1812.t:0 "The Sleeping God Stirs"
 shatteredhoof_ncr.1812.d:0 "'Hello, my little ponies.' \n \n A figure appears on the monitor, one resembling a pony resigned to the history books. A digital mane flows in a simulated wind, and the graceful form of the long-dead Princess Celestia takes up the screen. The reactions of those among the expedition vary from baffled to curious, though the lingering fear of their horrible demise continues to eat away at their psyche. \n \n 'May I know who leads your team?', the image before them asked. To which, the leader of the expedition stepped forward and spoke: 'I am the leader of this team. Are you the computer running this facility?' \n \n The image of a ghost before them chuckled for a moment, before responding. 'No, I am no computer. Though I am the one in control of this facility, yes. Might I ask your name?' \n \n The expedition leader hesitates for a moment, before responding. 'I am New Rock. And who are you?' \n \n 'I, my dear little pony, am Celestia. And I owe you an apology for your time here. I'm afraid I haven't been the most accommodating host.' \n \n At this, the team began to chatter among themselves, before New Rock spoke up again. 'Celestia is dead. Whether you're an imposter or a loony AI, I don't quite care. What I do care about is getting my team out of this glorified casket.' \n \n At this, the image before them flashed with a look of sadness, before replying. 'It was never my intention to hold you here. If you wish to go, you will find that the way is now open for you. Be warned though, I'm afraid I can't let you or your team back in once you've left.' \n \n As she says this, one of the doors leading out of the control room opens. New Rock is quick to restore discipline within her team, and leads them out of it. More doors open to them, as they make their way towards the edge of the facility, before finally being faced with the damned bubble that had trapped them here to begin with. The bubble flickers and falls, and they step over its boundaries. The resulting cheers from the science team are brought to an abrupt end, as the shield reappears."
 shatteredhoof_ncr.1812.a:0 "Command isn't gonna believe this."
 
 shatteredhoof_ncr.19.t:0 "A Matter of Stripes"
 shatteredhoof_ncr.19.d:0 "Glyphmark has long been known as one of the worst places to live in the Wasteland, only rivaled by Hoofington and Gutterville for its pure squalor. For their history, the zebras of Glyphmark have not only had to deal with all the dangers of nearby Canterlot, but they've also been subject to alicorn raiding parties, and raiders from Ponyville. Countless zebras would disappear in the night, or be taken in large raiding parties, shipped southwards to Appleloosa or to Fillydelphia to serve as slaves. The zebras of this region have come to be naturally distrustful of ponies, defensive of their own species and suspicious of any outsiders.\n\nEven though we passed the Citizenship Act so long ago, many citizens are still suspicious of zebras, or even blame them for the Great War. Many have called for the republic to not give any courtesy or aid to the zebras of Glyphmark. Instead, prevailing among many in the republic is the idea of 'separate but equal' a revival of an old Equestrian policy. The zebras of Glyphmark will be allowed to stay in their home, and would not be expected to provide anything to the republic, yet they will also not be aided or protected by the republic either. Many in both the republic and Glyphmark support this idea, thinking it will help preserve both communities.\n\nHowever, Glyphmark is in squalor, and even if they are suspicious of outsiders, they will accept aid if it is offered. The republic has far more than enough resources to help build Glyphmark back into a proper town, it will be costly to fix them up, but it could pay out well as an investment. In addition, though the zebras might be suspicious of the republic as it is, if we help them out, they might come to help the republic in turn."
 shatteredhoof_ncr.19.a:0 "Segregation Works" #(add a state modifier to the core states of Glyphmark disallowing them to be cored, gives 5% stability)
 shatteredhoof_ncr.19.b:0 "Provide Aid" 
 #(Unlocks Legionary special forces, give each state of Glyphmark a myriad of rare resources, give national spirit that gives 20% consumer goods factor for 180 days)
 
 shatteredhoof_ncr.20.t:0 "Entering Stable 32"
 shatteredhoof_ncr.20.d:0 "Following our victory over Stable 32, their ponies simply decided to retreat into their home and close the door. It has proven to be a tough nut to crack. Our first obstacle was the front door, which proved that Stable-Tec truly is the best choice for post-apocalyptic survival. Removing the door was not an effortless matter, as it took our teams several weeks and over a dozen different attempts to finally find a way to get through it: bypassing it entirely by mining under it. Our next obstacle was the remnants of the stable, who put up one hell of a resistance against us. Every hallway was a chokepoint, and every room had a trap or ambush. Being sent into the depths of this forsaken place is a fate that many will have nightmares about for the rest of their lives. Even after losing so many lives just trying to take the damn place, we ended up being faced with yet another issue in the form of the military-grade encryption on all of their computer systems. Our teams have had issues thus far actually breaking into their systems and efforts are still ongoing."
 shatteredhoof_ncr.20.a:0 "Alright then."
 
 shatteredhoof_ncr.21.t:0 "Our Policy Towards Manehattan"
 shatteredhoof_ncr.21.d:0 "Manehattan was one of the greatest and most prosperous cities of Equestria, and it shall become such once again under our rule. Before this can be brought about, we must first decide on how we wish to deal with Tenpony Tower. If it has cooperated with us thus far, then there is little reason for us to do anything but honour our commitment to them and allow a semi-autonomous Manehattan to exist. We could still always betray them though, if we really want to. However, if they have been resistant to our efforts of friendly relations, then they have left us no choice but to deal with them in the harshest manner we can."
 shatteredhoof_ncr.21.a:0 "They have proven to be a loyal ally."
 shatteredhoof_ncr.21.b:0 "They have outlived their usefulness."
 shatteredhoof_ncr.21.c:0 "They knew the consequences of defiance."
 
 shatteredhoof_ncr.22.t:0 "The NCR Wants Further Integration"
 shatteredhoof_ncr.22.d:0 "Our relationship with the New Canterlot Republic has been a largely positive one, with them providing us with all sorts of economic and military aid as we worked to rebuild the city of Manehattan. Now, they have come to us with the proposal to take our cooperation to the next level. In exchange for surrendering some of our autonomy to them and becoming subject to their laws, they promise to invest more in our city and to help us deal with any crisises that we may face. Understandably, many of our ponies have expressed outrage at such a proposal. However, we stand to gain quite a lot and to become a prosperous city indeed."
 shatteredhoof_ncr.22.a:0 "Accept their proposal."
 shatteredhoof_ncr.22.b:0 "Politely decline."
 shatteredhoof_ncr.22.c:0 "Cooperation? We'd like to be a full state!"
 
 shatteredhoof_ncr.23.t:0 "Crisis Management"
 shatteredhoof_ncr.23.d:0 "Another crisis has hit our nation, after the collapse of the Enclave and its cities in the sky, tens of thousands if not hundreds of thousands of pegasi have descended from the sky into our nation for refuge. Some of them were heavily armed, putting much strain on our military to quell them before they get any ideas of an insurrection. The most troubling issue however is that we now have the sudden problem of feeding countless new mouths.\n\nMany of our farms were already strained by an influx of hundreds of pegasus refugees in the aftermath of the war on the Enclave but now farms all over the NCR are being sacked to feed the wave of thousands of new pegasi descending into our country. This has put a great strain on our economy, especially our agricultural sector, which is ill equipped to handle such an influx of new residents. This has resulted in a large spike in food prices across the NCR, leading to reports of mass starvation of our own citizens. We can only do so much to handle this, and we have enough problems on our table as it is, but if it's not handled soon enough this could lead to an even bigger famine crisis."
 shatteredhoof_ncr.23.a:0 "This should be our top priority!"
 shatteredhoof_ncr.23.b:0 "A measured response should be enough."
 shatteredhoof_ncr.23.c:0 "Just focus on keeping the economy going."
 
 shatteredhoof_ncr.24.t:0 "Friend or Foe?"
 shatteredhoof_ncr.24.d:0 "The New Canterlot Republic isn't the only country to claim to be a successor to Equestria, and, technically, it's not the most legitimate. The Steel Rangers are a continuation of the Ministry of Wartime Technology, one of the many Ministries that comprised the Equestrian government during the war, and a very effective military unit during the war. They are famous across the wasteland for their technical knowledge, using power armor and heavy weaponry to take dangerous technology, in order to 'protect it' in their bunkers. Some Steel Ranger chapters are beyond negotiating, like in Fillydelphia, who are hated for often killing as many innocent Wastelanders as they kill of Red Eye's forces.\n\nIn the northern city of Manehattan, however, a Steel Ranger chapter exists that isn't utterly despised by ponies. The Manehattan Contingent are famous for destroying the Manehattan Raiders and pushing them across the Lower Mare River, allowing the many city-states of Manehattan to revolt against Raider control. There are also stories of the Steel Rangers working alongside Tenpony Tower to kill the Sunriders, the Raider gang that once owned the land comprising the Speedfreaks and Rain Riders. Of course, like all chapters, Manehattan has an unhealthy obsession with technology, and plenty look at them with distaste.\n\nThe story of the Manehattan Continent seems familiar to Gawd's own story, though, a group of well-armed soldiers overthrowing a Raider group that owned a whole empire. Due to this, many in the republic want to ally with the northern Rangers. In addition, all that power armor and heavy weaponry would be a boon in future wars, while it would be painful to fight against. The decision, in the end, falls to Gawd."
 shatteredhoof_ncr.24.a:0 "Send A Request For Alliance"
 shatteredhoof_ncr.24.b:0 "We Continue Alone"
 
 shatteredhoof_ncr.25.t:0 "An Intriguing Offer"
 shatteredhoof_ncr.25.d:0 "A 'nation' calling themselves the New Canterlot Republic has sent a diplomat to us today with an interesting proposal. In exchange for our cooperation with them and their military, they are willing to both heavily invest in helping us create a proper industry to fuel our efforts and to directly help us in our military pursuits. While this would benefit us quite a lot, we would also be expected to help them in their own affairs, which may drag us into wars that aren't our own. Do we accept their offer?"
 shatteredhoof_ncr.25.a:0 "We accept!"
 shatteredhoof_ncr.25.b:0 "We refuse!"
 
 shatteredhoof_ncr.26.t:0 "The Rangers Have Refused"
 shatteredhoof_ncr.26.d:0 "The Manehattan Steel Rangers have refused our generous offer. While this is certainly unfortunate, we can't say that we're surprised. When the time comes, they'll be forcibly integrated into our Republic regardless of what their wishes are towards this matter."
 shatteredhoof_ncr.26.a:0 "Highly regrettable."
 
 shatteredhoof_ncr.27.t:0 "The Fillydelphia-Panis Proposal"
 shatteredhoof_ncr.27.d:0 "Now that the Fillydelphia Steel Rangers have been dealt with, we have to deal with the matter of their territory. The remnants of their chapter still oppose us, ambushing our patrols and maintaining firm strongholds, while various gangs have popped up that are dedicated to resisting our rule. This has proven to be quite the annoyance to our forces. A number of solutions have been offered to deal with this problem.\n\n Firstly, we could always see about contacting the Manehattan Steel Rangers, assuming they're still around and willing to work with us. They could be encouraged to move all of their operations to the Fillydelphia Chapter's former territory, essentially continuing their mission.\n\n Secondly, we could see about approaching the remnants of the old chapter there, and helping them reestablish themselves as a new chapter. Of course, they would be required to pledge loyalty to our Republic, and their autonomy would be limited. Sure, they might not be the friendliest towards us, but this would at least deal with the problem of holding that territory.\n\n Finally, we could just keep the land as is. It's not like we haven't faced resistance to our occupation before, after all."
 shatteredhoof_ncr.27.a:0 "Send the offer to Manehattan."
 shatteredhoof_ncr.27.b:0 "We'll handle the land ourselves."
 shatteredhoof_ncr.27.c:0 "Contact the remnants."
 
 shatteredhoof_ncr.28.t:0 "The Betrayal"
 shatteredhoof_ncr.28.d:0 "Despite our cooperation with them in the past, the NCR has decided that we are to immediately become part of their Republic, whether we like it or not. This has led to a scramble to prepare our defences, as their armed forces will surely be upon us soon."
 shatteredhoof_ncr.28.a:0 "They will regret this!"
 
 shatteredhoof_ncr.29.t:0 "The NCR's Proposal"
 shatteredhoof_ncr.29.d:0 "Our relationship with the NCR has been largely friendly thus far. So it was no surprise when they decided to bring another proposal to us. What was surprising were the details. Our sister chapter in Fillydelphia has fallen, as we were well aware. However, all of their territory and assets have now fallen under the control of the NCR, who are apparently having a hard time managing it all. They want us to move all of our operations over to southern Fillydelphia, where we may work on continuing our fallen chapters work. Of course, this would mean giving up Bucklyn Cross and all of our holdings within Manehattan, which the NCR will likely be more than glad to swoop in and take. Do we accept this proposal?"
 shatteredhoof_ncr.29.a:0 "It sounds like a wonderful idea!"
 shatteredhoof_ncr.29.b:0 "We will not be part of this!"
 
 shatteredhoof_ncr.30.t:0 "The Followers of the Apocalypse"
 shatteredhoof_ncr.30.d:0 "Moontalon stands in Gawd's office in New Canterlot, the pitch black hen looking odd among the old Equestrian style architecture, her armor contrasting the proper uniform Gawd wears from across her. Gawd gives her a nod, "Moontalon, I need a status report on that group you mentioned before." Moontalon looks around for a second more, before looking to Gawd, nodding, "They call themselves the Followers of the Apocalypse, they've already gotten a pretty good spread around the nation. They embed themselves in schools and hospitals, providing education and healthcare, issue is two things. One, they seem to be working alongside some unsavory characters, Alicorns and Hellhounds, apparently the Alicorns are detached from the Unity, but we can't be sure if any of them aren't spies. On top of this, they're spreading ideas around to those they heal and teach, ideas like the Equus Amnesty Party, world peace and all that. They're led by a mare called Velvet Remedy."\n\nGawd frowns, her talons tapping on the desk, "Peaceniks. Equestria used to have issues with them all the time. They make themselves useful to the state so they can try to spread their ideas against the state. They're likely being funded by the EAP, with their pacifist ideas." She frowns more, and then nods after a second, "We can't allow them to continue as they are. They'll spread their poison and make themselves too vital to get rid of, we need to preempt them, and get rid of them. Try to find any example where their Alicorns or Hellhounds act out, get evidence of it. Try to find any dirt on them that you can. We need to stop them before it's too late, we can't have them act against us when our greatest wars come."\n\nMoontalon nods, "Understood, Gawd, I'll get it done. But, umm, to be honest, they seem pretty above board. Their medicine is clean, their members are pretty kind, and they seem pretty clean. What if we can't find anything in them?" Gawd scowls, "Then we'll make something to catch them with. Illegal chems planted in one of their clinics, a false flag, blackmail, any of it. Moontalon, I can't stress this enough. They will kill our republic. We need to strike them first." Moontalon takes a second, and then snaps a salute, "I'll get it done, Gawd.""
 shatteredhoof_ncr.30.a:0 "At Any Cost..."
 
 shatteredhoof_ncr.31.t:0 "Followers Of The Apocalypse Arrested"
 shatteredhoof_ncr.31.d:0 ""Good evening citizens of the republic, this is New Canterlot Public Radio, here to tell the truth, no matter how bad it hurts. Late last night, NCPD performed a raid on the main headquarters of the Followers of the Apocalypse, following a lead about illegal chem production. Leading the raid was Miss Moontalon, who said to NCPR reporters, quote, 'Criminals will claw their way into any society by disguising themselves as being good. The Followers were a bunch of greedy criminals, buying sympathy from the common citizen while they poisoned our country.' Leader of the drug smuggling ring, Velvet Remedy, is now wanted for arrest and interrogation. Any information on her whereabouts will garner a one hundred cap-"\n\n"-sorrow that we see what has happened today. For once, my Equus Amnesty Party stands side by side with the United for Peace Coalition in denouncement of this illegal raid on the Followers of the Apocalypse. Many in our communities go without education and medicine, many die from preventable disease, many foals don't even know how to read, all because of the policies of the United Republican Party. The Followers have saved thousands of lives from sickness and poverty, Velvet Remedy is a pillar of everything we should be as a society. I, General Olive Branch, along with Governor Rock Solid, are calling for an official investigation into the raid on the Follower's headquarters. I believe it is no coincidence that our President has targeted this organization, for they spread the ideal of peace-"\n\n"-Steel Wall is still processing the events that have occurred with the Followers of the Apocalypse, I'm afraid. Many of his soldiers have sent him letters asking about it, asking for him to talk to Madam President Gawdyna Grimfeathers about amnesty for the Followers, no matter what they did. While the Followers were pacifists, their medicine and their doctors saved the lives of many soldiers, and their families. We may disagree with the political views of the Followers, but the Patriotic League thanks Miss Velvet Remedy, and every member of the Followers, for their service in this country. What has occurred here today is a complete miscarriage of justice, and I know that the Patriotic League will do everything in our power to secure justice for Miss Velvet Remedy. Now, if you have any questions, ple-""
 shatteredhoof_ncr.31.a:0 They Won't Oppose Us Now"
 
 shatteredhoof_ncr.33.t:0 "NCR Demands Integration"
 shatteredhoof_ncr.33.d:0 "The New Canterlot Republic has issued an ultimatum to us: either we submit to their authority and join them as a full state, or we will have no choice but to fight a military conflict with them. This has sparked quite a lot of outrage across our land, and many are calling for us to stick it to them regardless of how hopeless a war against such a superior force may be. Is joining the NCR really so bad though?"
 shatteredhoof_ncr.33.a:0 "We're better off within the NCR."
 shatteredhoof_ncr.33.b:0 "We will fight for our freedom!"
 
 shatteredhoof_ncr.32.t:0 "Wasteland Volunteers"
 shatteredhoof_ncr.32.d:0 "Our cause of freedom has rapidly caught on all across the Wasteland, with many skilled individuals making their way to our Republic to see if they can do their part. Though the road ahead of us is long and dangerous, it is comforting to know that so many see us as the saviors of the wastes. We hope that more will volunteer to help our cause, as the cause of liberty is everybody's business."
 shatteredhoof_ncr.32.a:0 "We can always use more help."
 
 shatteredhoof_ncr.34.t:0 "In the Defense of Democracy"
 shatteredhoof_ncr.34.d:0 "The NCR, in the simplest of terms, is one its last legs. Red Eye's forces are on the edge of capitulating the NCR, and the NCR is going full throttle on its war effort. Anyone who could use a gun is being sent to fight, whether they want to or not, every manufacturing center is turning out weaponry and military supplies, farms contribute everything to feed the troops, and citizens are sacrificing everything to help the war effort. Thousands from across the entire wasteland and even its furthest reaches are coming to fight for the last, and perhaps only bastion of democracy in the entire wasteland. The NCR government is doing everything possible to mobilize its entire population to squander the Slaver armies of Red Eye, propaganda about the war is rolling out so extremely that it rivals that of the propaganda of The Great War made by the Ministry of Morale 200 years ago. All of this sacrifice and strife in the NCR is not without good reason: if the NCR falls, it won't be long till every good creature in the entire Equestrian continent is in chains and working in factories that greatly resemble Tartarus. Life, Liberty, and the Pursuit of Happiness is in jeopardy, and with blood thirsty slavers on the gates of New Canterlot the NCR is hellbent to turn the tide, by any means.\nIn a speech President Gawdyna Grimfeathers gave on imploring the NCR citizens to dedicate their whole lives for the war effort she ended her speech with:\n\nI ask you: §RDO YOU WANT TOTAL WAR??!!!§!\n\nThe crowd screamed and cheered with great cries of yes, as if they'll tear apart slavers limb by limb in the name of Democracy."
 shatteredhoof_ncr.34.a:0 "We can still turn this around!"
 
 shatteredhoof_ncr.35.t:0 "Fighting back the Darkness"
 shatteredhoof_ncr.35.d:0 ""The greatest evil to have ever challenged us is now sweeping into our lands. The demon that is Red Eye and the Slave-Legions of Fillydelphia and the "Cathedral" are raging across the wasteland taking anyone who dares oppose him as slaves for their destructive war machine in a sinister attempt to rebuild Equestria in their own twisted image. If this monster were to force the entire wasteland under his dominion any semblance of life, friendship, or prosperity would be extinguished by the bodies of uncounted Slaves and the rivers of blood he would spill. So with this I implore all who reside in the NCR and all good creatures across the whole wasteland, to do everything possible to stand against this menace and ensure that the magic of friendship that founded Equestria can endure for all time."\n\nThis is an excerpt from a speech President Gawdyna Grimfeathers gave in the Senate, pertaining to the raging war between the NCR and its allies against the Slaver armies of Red Eye. Already lands who might not agree with us ideologically, but see RedEye as the greater Threat have sent as much aid and soldiers as they dare, to help the NCR fend off the vast, ruthless offensives as much as they could. The NCR has been very accepting of these foreign volunteers and has done much to spread word across the entire wasteland about the war to vanquish the great evil that lords over Fillydelphia and much of the Heartland, but with the war still in its infancy, it's hard to tell if all this aid will be enough.\nFor the sake of the NCR, and perhaps the entire wasteland, we need to stand against RedEye, stand against the Darkness..."
 shatteredhoof_ncr.35.a:0 "It's now or never!"
 
 shatteredhoof_ncr.36.t:0 "The New Capital"
 shatteredhoof_ncr.36.d:0 "With the Unification of the Shattered Hoof Alliance into this "New Canterlot Republic", a lot of things have changed...\nHowever, one thing that has stayed the same is the governments need for its masses of bureaucrats to maintain even a semblance of functioning governance. While many low-level government drones have stayed on their former posts, only with the big guys overhead changing, the most talented and useful have been strongly encouraged to relocate, with their families of course, to our new capital.\nTo ease this transition, everycreature who moves within the first six months can do so on the government's dime, an offer that is sure to entice many who were on the fence.\nCentralizing our bureaucracy in such a way will hopefully help all of our member-states become integral parts of the NCR, and might even kindle a bit of good old patriotism in those that see the glory of our capital."
 shatteredhoof_ncr.36.a:0 "Wonderful."
 
 shatteredhoof_ncr.37.t:0 "The Slums of New Canterlot"
 shatteredhoof_ncr.37.d:0 " "WE WERE PROMISED FREEDOM."\n\nThese words were spoken to me earlier today, by a group of slaves, escaped from Old Appleloosa. While the streets of New Canterlot might seem to gleam with gold and richness from the outside, when one examines it closer, they'll find a city in crisis. Away from the clean, well-constructed buildings of the government and the rich that fill New Canterlot proper, one can find slums, shacks built from scrap and trash, with no waste disposal, no plumbing, no comforts. Thousands of poor ponies fill these scrap houses, escaped slaves, former serfs, foals and chicks, all of them lovers of freedom, lovers of the Republic. Yet it seems that despite their desire for a better life in New Canterlot, they've been neglected by government programs, and from the factory owners of New Canterlot.\n\n"The minute they hear a Manehattan accent, they turn me away. I spent years working on Rain Rider vehicles, I'm as experienced as a pony can be expected to be. But I don't conform, and that means they don't like me." These words were spoken by a captive who escaped from the Rain Riders outside of Manehattan, who works to help build shacks for others in the slums. Rejected from every aspect of society and government, these desperate ponies have turned to do whatever they have to do to survive, "I had to rob a place last night. I left the Dust Reavers so I'd never have to do that again. But I've got a wife, and foals, and we don't got food. So I did what I had to do."\n\nWith the government neglecting these slums, action has been taken by other parties. The Equus Amnesty Party and United for Peace Coalition have been distributing food and medicine to all those they can, and have helped build better houses. Many witnesses even say that hero of the Battle of Corona, Giovanni Guiseye, was seen distributing food to children in the slums. Our reporters were unable to spot him during their time in the slums, but reports from witnesses claim that he encouraged the poor of the slums to organize protests, and force the government to listen to them. In this reporter's opinion, it is shameful that our government refuses to aid all of its citizens, and it is a betrayal of the promises of our nation.\n\n-Pen Ink, New Canterlot Reporter."
 shatteredhoof_ncr.37.a:0 "This Is Bad."
 
 shatteredhoof_ncr.38.t:0 "Greater New Canterlot"
 shatteredhoof_ncr.38.d:0 ""IT FEELS LIKE OLD EQUESTRIA"\n\nWords spoken from a family of refugees, recently moved into New Canterlot, escaping from the Commonwealth-Khagnate conflict in the far north. These sentiments are echoed across the entire city, as, indeed, New Canterlot seems almost like a new city entirely. Gone are the many slums that used to dominate the outskirts of the city, instead replaced with suburban style wartime housing. Food is plentiful, and each passing day, more ponies and more houses are added to the city. Students flock to the new, expansive university and colleges that serve the entire republic, while foals take buses every day to class, learning with an almost pre-war education level.\n\nA lengthy speech was held by Madam President Gawdyna Grimfeathers in the capital, a symbolic re-opening of the city, fixed and made better than ever before. In it, she remarked on the wonder of seeing a land go from nothing more than an old junction to the thriving capital of a new nation, where no citizen needs to go hungry or cold at night. In a surprising show of unity to many, General Olive Branch of the Equus Amnesty Party, and Governor Rock Solid of the United for Peace Coalition came together to give their own speeches, congratulating the President for her efforts. Governor Rock Solid had this to say, "Though I have had many disagreements with the President, and I still do, we must always acknowledge when good has been done for our nation. Ponies are fed, sheltered, and clothed like never before. It doesn't matter what politics you hold, this is a good thing." Marshal Steel Wall has even organized a military parade, making a point to demonstrate the importance of the military-industrial complex in freeing many from poverty.\n\nYet, we must never forget how this change in New Canterlot came to be. Many hundreds, if not thousands, of ponies died in the slums, and it was only through active protest and calls for action from all facets of society that change was able to be made. While thousands get to enjoy the fruits of the government's labor, we must never forget those who weren't fortunate enough to survive to this point. Without our freedom of assembly, our freedom of speech, we never would have reached this point. We must always keep this in mind.\n\n-Pen Ink, New Canterlot Reporter."
 shatteredhoof_ncr.38.a:0 "To Our Wonderful Capital!"
 
 shatteredhoof_ncr.39.t:0 "Opening Ironhusk"
 shatteredhoof_ncr.39.d:0 "Today, President Gawdyna Grimfeather officially opened the newly founded town of Ironhusk. The town was built as a Government project to prove the efficiency of centrally planned cities, along with making a statement about realizing the long held ambition of our President to fully reclaim the Wastes. Ironhusk lies in a forested Region between Leslie and New Mango, and is to serve as a minor shipping-port allowing small transports from all the way in the badlands safe travel towards the Azureway, and by extension our markets. In order to quickly populate the town, most of the buildings were given away free of charge to those lacking a home, and to Veterans that have finished their service.\n After Inaugurating Ironhusk's new Mayor, the President gave a short speech about the achievements made today, and how this would be replicated on a much grander scale in the Future."
 shatteredhoof_ncr.39.a:0 "Another City in the Republic"
 
 ###Tenpony Negotiations###
 
 shatteredhoof_ncr.16.t:0 "An Offer From the NCR"
 shatteredhoof_ncr.16.d:0 "An envoy from the New Canterlot Republic has arrived today, bringing with them an interesting proposal. It should come to no surprise to us that Manehattan, being such a city of such wealth and prestige before the War, has become a high priority for the NCR's expansion. Conflict between us and them seemed inevitable, but they have now proposed an arrangement that could allow us to not just avoid this conflict, but to even gain quite a bit of more territory. If we would be willing to assist them in taking the land between Manehattan and the territory they already own, along with pursuing more cooperative policies with them, they would be willing to both let us keep much of the land we conquer and to have all of Manehattan. This seems like a really good deal for us... perhaps too good of a deal. Can we trust them to keep their word and not to invade us once we've been weakened from a war?"
 shatteredhoof_ncr.16.a:0 "This sounds like a great opportunity!"
 shatteredhoof_ncr.16.b:0 "We can't trust them."
 
 shatteredhoof_ncr.1611.t:0 "Tenpony Accepts Our Offer"
 shatteredhoof_ncr.1611.d:0 "Our envoy to Tenpony Tower has arrived back in our territory today, bringing with them the tower's response. They have agreed to work with us, along with pursuing greater military and economic cooperation between our nations. However, this has also carried with it a warning that they will be closely watching us, and that they will not appreciate any excessive troop movements along their border. We'll have to be careful dealing with them, as they remain suspicious of us even as we approach them in a friendly and cooperative manner. That's a problem for the future though, as now is the time to deal with the Sunrise region."
 shatteredhoof_ncr.1611.a:0 "Then let's begin!"
 
 shatteredhoof_ncr.1612.t:0 "Tenpony Refuses Our Offer"
 shatteredhoof_ncr.1612.d:0 "Our envoy to Tenpony Tower has arrived back in our territory today, bringing with them unfortunate news. The tower has refused our offer, citing it being of limited benefit to themselves. While this means we'll have to invade the Sunrise region on our own, this does carry with it the benefit of us being able to keep all of the land we invade. Tenpony Tower itself will also have to be dealt with at some point, as they stand in the way of our Manehattan ambitions."
 shatteredhoof_ncr.1612.a:0 "They will regret their decision."
 
 shatteredhoof_ncr.1613.t:0 "Sunrise is ours!"
 shatteredhoof_ncr.1613.d:0 "The Sunrise region has been successfully invaded, with all of the various raider gangs and small nations residing there dealt with. We must now turn to the task of trying to divide out the land between us and Tenpony, who was directly involved with the conflict. With our superior military and contribution to the war, it would only be fair that we are given the vast majority of the newly annexed land. However, the delegates from Tenpony are likely to disagree. To work out these specifics, and to push for as much as we possibly can, we shall be calling a formal peace conference between our most skilled delegates and Tenpony's own. Hopefully they'll be able to work out an agreement that is generous to us."
 shatteredhoof_ncr.1613.a:0 "Now to determine the new borders."
 
 shatteredhoof_ncr.1614.t:0 "The Sunrise Peace Conference"
 shatteredhoof_ncr.1614.d:0 "With the war concluded, the NCR has called for a peace conference to draw the lines for our new borders. The chosen (yet barely accommodating) conference room is soon filled with representatives from both parties. They've come prepared and seem quite familiar to peacemaking, as a NCR representative opens a map of the Sunrise Region on the conference table, with the borders of our states are marked in our respective colors. Discussion begins to fill the room as both parties introduce their desires out of this meeting, valuing the resources that lay temporarily unclaimed. Our own Tenpony representatives try to push for our goals and steer the meeting in our favor, but it proves quite difficult; the NCR are no strangers to diplomacy. \n\nAfter an hour of back-and-forth peddling, an NCR official finally steps forward, the room quieting in anticipation. \n\n 'Alright, we've discussed enough.' \n\n He turns and eyes his colleagues behind him, followed by a glance at their map, at the region they've marked as Tenpony. \n\n 'For your efforts... Tenpony will receive the Rain Rider's lands. The NCR will acquire the rest of the region. Does this sound feasible?'"
 shatteredhoof_ncr.1614.a:0 "The Raindier's lands will be enough."
 shatteredhoof_ncr.1614.b:0 "We've earned more than that!"
 shatteredhoof_ncr.1614.c:0 "Our current borders are fine, no change needed!"
 
 shatteredhoof_ncr.1615.t:0 "Tenpony Demands More Land"
 shatteredhoof_ncr.1615.d:0 "Despite our effort to control the flow of the conference, the representatives of Tenpony are quite adamant in what they want. It's clear their eyes are set on acquiring more than just the Rain Rider's lands. They propose that in addition to our offer, they want parts of Rustwreck and Freeside to come under their control as well. We are of course very hesitant to give up any of our potential territory, but refusing this demand will almost certainly result in the peace efforts falling through entirely, along with our alliance."
 shatteredhoof_ncr.1615.a:0 "Give it to them, they've been loyal allies after all."
 shatteredhoof_ncr.1615.b:0 "This is unacceptable! The deal is off."
 
 shatteredhoof_ncr.1616.t:0 "Tenpony Demands Current Borders"
 shatteredhoof_ncr.1616.d:0 "Efforts to control the conference are proving rather futile as the Tenpony representatives across the room frown at any of our proposals. Instead of following any of our suggestions, they wish to keep the current borders decided by the war. They sound quite obstinate, making it quite clear that this is their final offer. We can accept this, or we can storm out of the peace conference and bring our alliance with them to an end."
 shatteredhoof_ncr.1616.a:0 "Fine, whatever."
 shatteredhoof_ncr.1616.b:0 "We shall teach them not to fuck with our Republic."
 
 shatteredhoof_ncr.1617.t:0 "The NCR Cuts Ties"
 shatteredhoof_ncr.1617.d:0 "After suggesting our own goals on acquiring more than just their proposed offer, the conference did not proceed as we'd hoped. The meeting was abruptly concluded with a single motion from an NCR representative, leaving us with a final declaration that they will cut all ties with us. Any further attempts to communicate since the conference are met with silence. Furthermore, we have baleful reports of NCR activity near our borders, only mere days after the meeting."
 shatteredhoof_ncr.1617.a:0 "This may have been a mistake."
 
 shatteredhoof_ncr.1618.t:0 "The NCR Agrees"
 shatteredhoof_ncr.1618.d:0 "With our counter-proposal offered, the NCR took a brief moment to discuss among themselves, before they quieted down and caught our attention once more. One of them glanced at the map of Sunrise with an expression that lacked enthusiasm. \n\n 'Very well, we will agree with keeping the current borders.'"
 shatteredhoof_ncr.1618.a:0 "Well, that's sorted out."
 
 
 
 ###Decision-Events###

 shatteredhoof_ncr_decisions.1.t:0 "In the Ruins of the Enclave"
 shatteredhoof_ncr_decisions.1.d:0 "Neighvarro used to be a wartime airforce-base situated west of New Horseleans that was used by the Enclave as their primary base of operations across the Equestrian Heartlands. It was also vital to the future plans of the Enclave, as Neighvarro is the home of the Single Pegasus Project Hub which, in theory, gives one control over the weather patterns across most of the Equestrian continent. The Enclave used the limited access they had to the SPP to maintain a constant cloud cover over the entire wasteland since the Great War. It was here that they began their conquest of the Wasteland and also the place where they ultimately surrendered. Now the base lies in ruins after the Battle of Neighvarro and the dispersal of the "New Cloudsdale" Enclave across the Wasteland.\nWith Neighvarro under our control we can now freely explore what remains of the base to discover all of its secrets and take advantage of what technology was left behind. An army of hired scavengers, explorers, and scientific minds were dispatched to dig into the base of Neighvarro and especially the SPP facility. After the remnants of Neighvarro's automated security systems and independent Scavengers were dealt with by NCR troops every piece of technology and data that could be gathered was collected and catalogued to be studied and used for the NCR's benefit.\nAmong the best finds were several damaged blueprints for energy-weapons, an entire room full of X02 Power Armour, and a virtual treasure trove of memory orbs the Enclave must have used to train pilots.\nThe most intriguing find however, was made by a team of explorers, who discovered what seemed to be a large room, surrounded by an impervious energy shield, at the heart of the base. Attempts to disable the shield have been unsuccessful as there seems to be no clear way of disabling it without damaging what lies behind the shield. What's even more perplexing is that the shield itself is not connected to the main reactor of the facility which means whatever is powering it lies inside the shield. It's theorized that the heart of the SPP's functions and purpose is what lies inside the shield, but until we find a safe way to penetrate it, whatever secrets lie inside that shield will remain a mystery."
 shatteredhoof_ncr_decisions.1.a:0 "Tell the eggheads I want that shield cracked as soon as possible!"
 
 shatteredhoof_ncr_decisions.2.t:0 "The Secrets of Hill 431"
 shatteredhoof_ncr_decisions.2.d:0 ""Breaching!" Bloodeye takes cover behind a wall as their team's demolition specialist blows up a sealed door. The bodies of Featherbrush's Talons surround them, still warm and bleeding from the battle for the bunker. As the door blasts open, Bloodeye motions his squad to follow him, keeping a well-maintained rifle up as they move into the space they opened up. They find themselves in a cavernous room, filled to the brim with weapons, and shelves containing uniforms. Bloodeye motions around, "Mango, left side, Fire, right side, Flanks, cover rear, shoot at anything that moves." The other three members of the squad assume their positions. Mango, a thestral with a cigarette and fifty bullets of .308 in an automatic rifle, Fire, a bright orange unicorn with a service rifle, and Flanks, a Pegasus mare who carries a light machine gun, commenting as they trot down the shelves, "Not my name, Sir."\n\nBloodeye doesn't respond, as they make their way down the middle pathway, surrounded on all sides by shelves. Dust lingers in the air and on the floor, kicked up by hooves and talons. Eventually, they reach the end of the room, stood in front of another door, "Flanks, cover me, I'm opening this door. I don't think any enemies got into here, but I'm not going to die because of thinking." Flanks nods, turning around and keeping her LMG sturdy. Bloodeye grabs the handle of the door in front of him, and swings it open, lifting his own rifle up as he does. No enemy comes charging at them, all the awaits them is a flickering light hanging above glowing vats.\n\nThey slowly move into the second room, eyes peering at the vats, only to step back as they see their contents. Bodies. Griffons, ponies, changelings, deer, every species imaginable, floating in green goop, held forever in vats stamped with the logo of the Ministry of Image. Mango breathes out a bit of smoke and shakes his head, "What in Luna's name is this shit?" Flanks frowns softly, "I don't like it." Flame nods along, "Whatever it is, fuck it, and its mother." Bloodeye steps forward, his gun still up, blood red eyes peering through every inch of the facility. After a second, he breathes out, and lowers his rifle, looking back to the others, "Whatever this is, it's for the egg-heads to figure out. There's no enemies left, the bunker's secure. Let's get out of here before one of these things decides to wake up." The ponies shudder softly, and quickly follow as he leads them back through the way they came."
 shatteredhoof_ncr_decisions.2.a:0 "Send A Team To Study"

 shatteredhoof_ncr_decisions.3.t:0 "A Ministry's Secrets"
 shatteredhoof_ncr_decisions.3.d:0 "This stable we have come across is simply extraordinary: it's apparent that these Stableponies truly believed themselves to be the Ministry of Arcane Sciences and had continued the "Ministry" long after the war, remaining isolated from the rest of the world much like the Enclave. And sadly, like the Enclave we had to wage war against the inhabitants of this stable to get to its secrets. After the smoke cleared nearly all of the stable's inhabitants had died either doggidly fighting us to the last, or commiting suicide within their rooms, with their Minister having shot himself in his office. Those few who survived were apprehended and taken in for questioning or given citizenship for the civilian types of the surviving inhabitants.\nWhen exploring the stable itself it appeared that most of the technology and research was destroyed in the fighting or was intentionally destroyed in a scorched earth effort. We have managed to retrieve a small amount of their research files and also decent amounts of advanced weaponry that this stable had developed over the last 200 years, including a schematic for a tank that they appear to have designed themselves post-war. What surprised us was that the stable also had large amounts of wasteland items mostly those used by slavers. It appears that this stable had ventured into the wasteland before and had taken many items back with them to perhaps study the ins and outs of the wasteland, despite much of what they studied to be some of the wasteland's worst.\nA couple of days after we managed to take what's valuable an explosion ripped the stable apart killing most of those left behind to hold the stable and rendering it naught but a smoking ruin. It is assumed that the main reactor of the stable had been rigged to explode and had been set on a delayed charge either on purpose or not. It is a sad day for the NCR, as hundreds of innocent lives and a stable in pristine condition were lost forever."
 shatteredhoof_ncr_decisions.3.a:0 "Amazing how far some ponies go to protect their secrets."
 
 shatteredhoof_ncr_decisions.4.t:0 "The Lair of a False Goddess"
 shatteredhoof_ncr_decisions.4.d:0 ""Sir, don't you feel bad about this?" Goldbeak stands on the catwalks in what was once Maripony, looking down at the ruined vats, once filled with IMP. A Griffon hen sits next to him, cleaning her rifle, armor dented and a few cuts still bleeding from the fighting, "I had an alicorn friend once, you know. She wasn't part of the Unity anymore, but she said that she loved it. It was comforting and all that, you know, like a big community in her head." Goldbeak looks over at the hen, and then back down, watching as scientists take the facility apart, searching for what remains, "They didn't ask to become part of this. Sure, once they're part of the hive mind, they'll talk it up, not like they have any control over it. Ponies love to feel good about bad things. But Unity, this 'Goddess' didn't give them any choice. Just made them part of the whole."\n\nThe hen frowns softly, and looks down at the vats as well, "Aren't we the same?" He looks over at her, cocking an eyebrow, as she looks back at him, "We didn't ask ponies if they wanted to be part of the republic. All the ponies of Leslie, Appleloosa, all the alicorns, it's not like we gave them a choice. We marched in and shot those who got in our way. Made them part of our whole." Goldbeak keeps eye contact for a bit, before looking away. He takes a cigarette from his side, and lights it up, breathing the smoke in, before softly letting it out, "It's not like that. We give ponies freedom, give them chances to live better lives, we make their lives better. We give them food, shelter, and community. That's more than they could get elsewhere." She frowns a bit more, and sighs softly, "But that's what the alicorns would say too. They'd say they were better with the Unity, with the hivemind, with their community. I just don't know."\n\nHe nods softly, "It's good to question what we do. We're a democracy. That's what we're all about. But we've freed the alicorns. Now they can vote, now they can think, now they don't have to obey their Goddess." She nods as well, and slowly stands up, leaning against the railing of the catwalk, "But couldn't we have negotiated? Maybe if Unity was treated as a religion by the state, they can only induct members who want to join willingly, and need to release those who don't want to stay. It's just. . . this was something unique, you know? Special, I guess. And now it's gone. Bad, or good, I don't know, but something was here, and now it isn't." He sighs softly, and offers her a cigarette, looking over at her, "It is what it is. Maybe we could have negotiated, I don't know. President didn't do that, though. We're soldiers, we follow orders." She takes the cigarette and looks down, "Yeah. I guess. Just following orders.""
 shatteredhoof_ncr_decisions.4.a:0 "Another Monster Defeated."
 
 shatteredhoof_ncr_decisions.5.t:0 "The Untouched Stable"
 shatteredhoof_ncr_decisions.5.d:0 "The lovely voice of Velvet Remedy fills the halls of Stable 2, as Moontalon makes her way through the winding metallic halls. Ponies give her curious smiles and friendly waves, already familiar with the New Canterlot Republic and its many features. All around, administrators and scientists talk to the various Stable ponies, learning about their technology, their society, their sanitation. Moontalon doesn't care for any of that, though, moving with only one purpose in mind, coming to a stop outside of a specific room.\n\nThe door slides open, revealing a bedroom on the other side, filled with posters of Sweetie Belle, recording equipment, and all sorts of other memorabilia. Moontalon steps inside, looking around, only to see a piece of dusty paper laying on a table. She moves up to it and looks it over. 'Dear Pip: I'm sorry that I tricked you, and I'm sorry that I left. I know many are going to blame y-' She doesn't read anymore, dismissing the paper and instead looking around the room some more. Records and songbooks cover the walls, nothing related to the Followers at all. A voice speaks from behind Moontalon, "Can I help you, Miss?" She turns around, seeing an elderly mare there, with a soft, sweet smile. She trots into the room, "I'm Velvet's grandmother. I've been keeping her room tidy, in case she ever returns."\n\nMoontalon clears her throat, "Your granddaughter is wanted due to being the leader of the criminal organization known as the Followers of the Apocalypse. I'm here to search for any presence of her." The old mare chuckles and looks around the room, "Or to plant more evidence to frame her? Heh, that's my granddaughter, getting into trouble again." She smiles at a poster of Sweetie Belle, "Overmare's mane had gone grey trying to find her too. Oh, she was a criminal since day one, she was always adventurous, always sweet, but always willing to go against the flow. The moment she left the Stable, she was a criminal from us, many thought she'd die out there, many didn't care that she did. So many were mad, or sad. But me? It was the proudest day of my life." She trots up to the note, and places it back in its original place, "My granddaughter was always like a bird in a cage, and that day, she took her chance to be free. That took more bravery than I ever had."\n\nMoontalon clears her throat, and looks down, "I'll just go, Ma'am. I'm sorry for interfering with your granddaughter's room." The old mare smiles wistfully, and looks towards the Griffon hen, "You could learn a lesson or two from her, little lady. Your 'President' is gonna be the doom of you, if you don't change." Moontalon looks at the mare, before wordlessly leaving the room."
 shatteredhoof_ncr_decisions.5.a:0 "Welcome To The NCR."
 
 shatteredhoof_ncr_decisions.6.t:0 "Birthplace of a Terror"
 shatteredhoof_ncr_decisions.6.d:0 "An old stallion trots after a little filly, her little hooves scampering over the well-maintained tiles of the Museum of Cathedral. The stallion chuckles softly as he struggles to keep up, "Hold on! Your pops can't move so fast!" The filly looks back with a pout, "Aww, come on, I wanna  see the main thingy!" She scuffs at the ground as the older stallion catches up, giving her a small smile, breathing a bit heavily, "Sorry, sweetie, but pop's not in the shape he used to be back in the army. Heh, I still remember back when this place was filled with science mooks. I stood guard as our boys took this place apart for parts." The filly looks ahead, and then back at him, smiling and skipping along, "Did ya fight here, pops?"\n\nHe smiles, following slowly behind her, letting his eyes cross over every exhibit, "Heh, you bet I did, back under ol'President Gawd. I was in my prime back then! I led a squad of ponies through the Everfree to find this place, and do you know what we found?" She looks back and blinks, shaking her head. He smirks, "We found a dragon!" He leans in and roars at the filly, making her giggle softly, as they continue along, "He was big, and mean, and covered with all sorts of bits and baubs. He breathed fire so bright that the sky lit up, like it was noon! Heh, I thank my lucky stars I didn't have to fight him, our colts in the air force took care of him. Or her. I don't remember." He smiles softly, "My squad moved through every hallway here, finding experiment after experiment, protected to the death by Red Eye's cultists. We fought for every inch, but your pops here made sure to clear it all out."\n\nThey come to a stop by the main exhibit, the little filly looking up, eyes widening as she takes it in. A statue of a red stallion, Stable uniform hanging off his back like a cape, stood in front of a painting of a city of the dead, "Woah." She sits down and looks up at it, "Was Red Eye bad, pops? One of mom's friends used to fight for him." He smiles softly, and sits next to the filly, "He was a pony who did bad things. Does that mean he was a bad pony? Well, I think that's for you to decide. Good ponies do bad things, and bad ponies do good things. In the end, doesn't matter. I've known honorable thieves, crooked priests, corrupt politicians, clean salesponies. Good, bad, what happened, happened. And we need to never forget what happened." She blinks softly, and smiles, "I'm never gonna forget.""
 shatteredhoof_ncr_decisions.6.a:0 "History Was Made Here."
 
 shatteredhoof_ncr_decisions.7.t:0 "Remain Buried"
 shatteredhoof_ncr_decisions.7.d:0 ""Well, sir, I'm afraid the Maneframes are, in colloquial terms, utterly fucked sideways." A stallion stands in front of Goldbeak, who listens with a frown, "I knew we should have used less artillery support. It would have cost us lives, but. . . Shit." The stallion smiles, "Shit indeed, sir, but, we are able to recover some information, left in notes and holotapes. It's just to our luck that the Steel Rangers recorded so much. Of course, since this is Stable-Tec HQ, there was a lot to record." He smiles more, "A lot of what we got was off of a stash of Pip-Buck we found, which will be very helpful to study."\n\nGoldbeak nods along, "Summarize the information. If there's nothing valuable here, then I'm going to report it to Gawd, bury the rest, I suppose." The stallion nods, "Well, a lot of it isn't really good, so to say. There's a lot of mentions of other Stables, apparently there were a lot of, uhh, experiments done in them, sir. There's a Stable in Manehattan that forced ponies with different views on technology to work together, one which was ran by an advanced computer program. Umm, there's one that only has fifty stallions? That seems like a recipe for disaster. There's one that contained a whole lot of different species near Canterlot, mostly zebras and ponies. There's a Stable that was supposed to contain the Princesses and, uhh, wasn't going to open until they died, and, well, they're immortal. So. Yeah. Weird there." He looks up from his list, "Stable-Tec did a lot of fucked up shit, sir."\n\nGoldbeak looks at the stallion, and then sighs, "Equestria did a lot of fucked up shit, egg-head. Stable-Tec was no different." He shakes his head, "This history isn't going to help us. It's just going to tear us apart. To think a trusted company could do this. . . it'll sow distrust, if it leaks to the public." The stallion blinks, "Uhh, sir, are we not telling this to the public? Isn't that the whole point of our democracy?" Goldbeak shakes his head again, and turns away, closing his eyes, "They won't know what will harm them. Imagine how ponies will turn against Stable ponies, imagine how those Stable ponies will feel, knowing they were just experiments. Let them think nothing about it. Bury it, bury all of it."\n\nThe scientist frowns softly, "Sir, this is history, imagine what other secrets could be down here?" Goldbeak begins to make his way out of the building, "I gave my orders, now follow them. Some history deserves to be forgotten. Some secrets are best if they remain buried.""
 shatteredhoof_ncr_decisions.7.a:0 "Forget It"
 
 shatteredhoof_ncr_decisions.8.t:0 "A Gangster's Paradise"
 shatteredhoof_ncr_decisions.8.d:0 "Bullets whizz overhead, a few impacting hastily set up sandbags, as the gangsters lay suppressing fire. Bloodeye, Fire, Mango, and Flanks hide behind the cover, their Griffon commander peeking over, shooting a gangster, before diving back beneath cover, "Can't hold 'em alone! Where's our backup?!" Fire's horn sparks, sending a ball of fire over the sandbags, the sounds of screaming confirming he hit his mark, "Fuck if I know! If we stay here, we're fucked! I don't know about you, Mango, but I'm not looking to get fucked!" Mango frowns around his cigarette, blind-firing his rifle around the sandbags, "Go fuck yourself. If you're the last voice I hear before I die, I swear to Luna, I will kill you."\n\nFlanks spreads a wing, with a helmet sitting on her feathers, tossing it away from the sandbags. The various gangsters turn their fire to the helmet, allowing her to peek over the sandbags, light machine gun chewing up a few enemies, before she's forced to duck back under cover again. She frowns as she reloads, "I'm out of ammo, sir. What do we do?" Bloodeye peeks over again, firing his rifle into another gangster, then taking cover again, bullets impacting the sandbags once more, "I don't know." He takes a second, his eyes looking to the side, where a few enemy bodies lay, Tommy Guns laying beneath them, complete with drum magazines. His eyes light up, "Fire, grab those!" The unicorn looks over, and then sees the guns, grinning as his horn pulls them behind the sandbags.\n\nAll four members of the squad grab a gun, and flick it to full-auto. Flanks licks her lips, "Okay, okay, I'm ready." Mango holds up a hoof, "A second." He takes out a cigarette, which Fire lights up with a bit of magic, "Alright. If I'm going to die with a gangster's gun, I'm going to smoke like a fucking gangster. Let's do it." The four nod, waiting for a pause in the gunfire, before they all peek over cover. Their guns roar with rapid rapport, bullet casings clinking to the ground below as bullets fly to the gangsters, and Fire cries, "Haha, yeah! Suck it you fuckers! How's this feel, huh?!" They chew through the cheap defenses of the gangsters through sheer volume of bullets, and not a single member of the squad stops firing until their guns click dry.\n\nThey look over a field of dead gangsters, their barrels still smoking from their overuse. Bloodeye takes a deep breath, and drops his gun, sitting down, "I should have joined Stern." Mango sits next to him, breathing out a plume of smoke, "I hope that Army Depot is worth it for all this." Flanks shudders out a breath and drops her gun, "This was not worth it." Fire smirks widely, holding his gun proudly, "This was so worth it!""
 shatteredhoof_ncr_decisions.8.a:0 "A Worthy Battle"
 
 shatteredhoof_ncr_decisions.9.t:0 "The Matter of Stable 32"
 shatteredhoof_ncr_decisions.9.d:0 "Giovanni stands outside of Stable 32, watching with distant eyes as soldiers send ponies out. This Stable was still mostly operational, due to it still being occupied. But its inhabitants made the crime of fighting back and losing against the republic. Thus, has come the cleansing. Clean Stable ponies take their first steps into the wasteland, looking around terrified, as soldiers bark orders to them. Scientists stop some ponies, forcing them into examinations, checking for health and sickness, measuring their skulls, taking their blood, before sending them along. No home awaits them, just the wasteland.\n\nHe swallows softly, before he hears something, the shouts of a soldier that are louder than usual. He rushes over, only to find a soldier pushing a Stable filly against the ground, holding his rifle up at her, "Get back into line!" His talons feel dirty. The stallion shouts again, but Giovanni can't hear the words over the ringing. The filly's eyes are dark. Fear. He can smell the blood. He sees her again, bleeding. His claws tremble. He doesn't remember what happens for the next few moments, but when he blinks, he finds the soldier's throat in his claws, his talons digging into the soft flesh of the pony. Their eyes are scared, just like his. He looks down into the eyes of the pony, and finds himself speaking without control, "Get away from her! S-stop this!" The other soldiers look over, the Stable ponies too. He doesn't see them. He sees nothing but the fear in the filly's eyes.\n\nHe releases the soldier's throat, and pulls his talons back. They're dirty. Covered in blood. His breaths come shakily as the soldier gets up, "Go, go and don't ever come back!" His whole body trembles. The soldier runs away, eyes filled with fear. He tries to breathe. He finds himself unable to. The serf-filly lays in front of him. His legs shake. The world goes dark. Then, a little leg touches his own, and he looks down. The Stable filly looks up at him and sniffs softly, "T-thank you, Mister, but. . . I can't find my momma."\n\nThe world returns in an instant, and he's finally able to breathe. He finds his cheeks wet. His talons are still dirty, but. . . He doesn't pay attention to them. He can't. He smiles softly to the little filly, and kneels down close to her, "Don't worry, little filly. Come with me. Let's go find your momma.""
 shatteredhoof_ncr_decisions.9.a:0 "So Ends Stable 32."
 
 shatteredhoof_ncr_decisions.10.t:0 "The lessons of automation"
 shatteredhoof_ncr_decisions.10.d:0 "Stable 29 proved difficult to take, as many of the Stable's defenses were still active, being used to fend off the raiders who owned the Stable for too long. It took a few lives, but piece by piece, the Stable was able to be taken, and, in even better news, it wasn't damaged in the fighting that much. Salvage teams have been sent to strip the Stable for supplies, finding many pieces of valuable technology. Circuits, batteries, and complex metals were stored in the Stable, alongside many other useful things.\n\nIt's clear that something bad took place here. Skeletons litter the inside of the Stable, having been killed quickly. It was only when our salvage team started examining the Stable's Maneframe that we learned why. Apparently, this Stable was supposed to be managed by an advanced AI, which was programmed to conserve resources and hopefully guide ponies to repopulate nearby Manehattan. Issue is, a few decades in, a water chip broke, meaning the Stable had limited water. Before the maintenance ponies could fix it, the Maneframe underwent many calculations, deciding that the ponies would eventually drink all the water, and deducing that the best way to conserve water would be to eliminate all consumption of it. We don't know exactly how it killed all the ponies, but whatever way it chose, it was efficient. Already a sci-fi story based off this tale has begun to be sold in stores across New Canterlot, called Aperture. Ratings are very good."
 shatteredhoof_ncr_decisions.10.a:0 "Never Trust AI."
 
 shatteredhoof_ncr_decisions.11.t:0 "The MoM Hub"
 shatteredhoof_ncr_decisions.11.d:0 "Within the depths of Manehattan lay a building that is not at all what we expected. The Ministry of Morale was once responsible for identifying and countering all Zebrican espionage, along with ensuring the loyalty of Equestrian citizens and their dedication to the war effort. Going into their Manehattan Hub, we were expecting it to be at the center of a widespread surveillance system, or full of torture and memory extraction chambers. What we were not expecting were birthday cards and two century old cakes.\n\n It seems that the Ministry was pursuing the truly monumental task of tracking and celebrating the birthdays of every single foal in Manehattan. We're honestly not sure what to think about this. More in line to what we were expecting, we did find a great deal of spritebots that had to be dealt with in order to secure the building, along with what we believe to be the remains of Ministry Mare Pinkie Pie herself. The remains will be buried on what we believe to have once been her families rock farm."
 shatteredhoof_ncr_decisions.11.a:0 "Alright then."
 
 shatteredhoof_ncr_decisions.12.t:0 "Bucklyn Cross"
 shatteredhoof_ncr_decisions.12.d:0 "Once the main base of operations for the Manehattan Steel Rangers, Bucklyn Cross is the common name given to a large bridge over the Lower Mare River. When the Manehattan Contingent arrived to Manehattan so long ago, it was over this bridge that they pushed the Manehattan Raiders, with the Steel Rangers taking the bridge as their own headquarters. Due to the importance of the bridge to travel over the Lower Mare River, it seems like the Equestrians built a military base, hidden in the supports of the bridge. It was in this small base where the Rangers roamed, and stored all their equipment.\n\nSadly, the Rangers held us off long enough to pick Bucklyn Cross almost entirely clean. They've taken their guns, armor, and all of their data along with their technology, leaving behind just crumbs. Luckily for us, Steel Ranger crumbs are still a massive boon, consisting of small pieces of technology that we can take apart for use in our industry. Though we didn't gain as much as we'd want, this was still a worthwhile endeavor."
 shatteredhoof_ncr_decisions.12.a:0 "Another Old Ruin Dealt With."

 shatteredhoof_ncr_decisions.13.t:0 "The failed war"
 shatteredhoof_ncr_decisions.13.d:0 "With the failed offensive the shattered hoof have proven too weak to be trusted to lead us so we must decide weather to stay loyal or break free while we can."
 shatteredhoof_ncr_decisions.13.a:0 "Prepare the troops."
 shatteredhoof_ncr_decisions.13.b:0 "Stay loyal."
 shatteredhoof_ncr_decisions.13.c:0 "Leave silently."

 shatteredhoof_ncr_decisions.14.t:0 "The war for independence."
 shatteredhoof_ncr_decisions.14.d:0 "It's now or never."
 shatteredhoof_ncr_decisions.14.a:0 "To arms!"

 shatteredhoof_ncr_decisions.15.t:0 "whispers of betrayal."
 shatteredhoof_ncr_decisions.15.d:0 "with the failed invasion still sending shockwaves through our nation theres been rumours of our allies betraying us."
 shatteredhoof_ncr_decisions.15.a:0 "We must secure secure our boarder with [FROM.GetNameDef]."


