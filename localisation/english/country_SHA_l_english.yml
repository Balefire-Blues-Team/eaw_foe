 NCR_stable_excavation_decision_cat:0 "Excavating Old World Facilities"
 NCR_stable_excavation_decision_cat_desc:0 "From stables to military bases, there are many old world facilities scattered across the Wasteland. As we come across these places, we can try to salvage them for anything useful."
 NCR_neighvarro_excavation_decision:0 "Crack Open Neighvarro"
 NCR_neighvarro_excavation_decision_desc:0 "Now that the Enclave has been dealt with and Neighvarro is under our control, we can find out what secrets that old facility holds."
 NCR_hill432_excavation_decision:0 "Search Hill 432"
 NCR_hill432_excavation_decision_desc:0 "Now that we have access to Hill 432, there is little stopping us from searching through that bunker to find out what lies within."
 NCR_mas_excavation_decision:0 "The Ministry Remnants"
 NCR_mas_excavation_decision_desc:0 "The Ministry of Arcane Sciences continued on within the confines of Stable 49. Now with their stable secured, we can see what they've been up to for the past two centuries."
 NCR_maripony_excavation_decision:0 "Excavating Maripony"
 NCR_maripony_excavation_decision_desc:0 "Maripony was once home to an abomination that terrorized the ponies of the Wasteland. Now, it is little more than abandoned ruins. Many sections are collapsing and the supports are anything but stable. There's likely a lot we could learn from the secrets held within though."
 NCR_stable2_excavation_decision:0 "Excavate Stable 2"
 NCR_stable2_excavation_decision_desc:0 "Stable 2 is still functioning just fine after two hundred years. With its ponies already vacated from the stable, we can now see just how many valuable components it has."
 NCR_stable101_excavation_decision:0 "Excavate Stable 101"
 NCR_stable101_excavation_decision_desc:0 "Stable 101 was once the home of Red Eye, and would become the foundation for his towering Cathedral. With the insane warlord dead and his Cathedral under our command, there is little stopping us from opening up his former home and finding out what secrets it holds."
 NCR_stabletechq_excavation_decision:0 "Search Through Stable-Tec HQ"
 NCR_stabletechq_excavation_decision_desc:0 "Stable-Tec HQ is an absolute treasure trove of old world information and technology. We can put it all to great use."
 NCR_silverwing_excavation_decision:0 "The Treasures of S.A.D."
 NCR_silverwing_excavation_decision_desc:0 "The Silverwing Army Depot is massive, stretching deep into the earth. There are still many armories within its depths that have yet to be claimed. Fortunately, we are more than up to the task."
 NCR_stable32_excavation_decision:0 "Into Stable 32"
 NCR_stable32_excavation_decision_desc:0 "With Stable 32 now within our domain, we are free to plunder it's depths for whatever secrets it might hold."
 NCR_stable29_excavation_decision:0 "The Manehattan Stable"
 NCR_stable29_excavation_decision_desc:0 "It seems that Stable 29 was a failure, with the entire population of that stable being killed. We'll figure out what went on there as we scrap the Stable for usable components."
 NCR_mommanehattan_excavation_decision:0 "The Ministry of Morale's Hub"
 NCR_mommanehattan_excavation_decision_desc:0 "The Ministry of Morale was one of the six major Ministries to rule over wartime Equestria. Their Manehattan Hub was one of their largest, with no expense being spared on it's construction. We look forward to seeing what goodies it contains within it."
 NCR_bucklynbunker_excavation_decision:0 "Looting Bucklyn Cross"
 NCR_bucklynbunker_excavation_decision_desc:0 "With the Manehattan Steel Rangers dealt with, we can now break open their main base and see what's inside."
 
 
#############
### Ideas ###
#############

 SHA_secret_dragon:0 "The Dragon Behind the Scenes"
 SHA_secret_dragon_desc:0 "While it may outwardly look like Shattered Hoof is run by Deadeyes, he is but a puppet to Mr. Topaz, a dragon living in the mines beneath the old prison."
 
 SHA_unstable_east:0 "Unstable Eastern Border"
 SHA_unstable_east_desc:0 "Our eastern border is only barely in our grip. Constant raids by [LRA.GetNameDEF] and batpony guerillas bind a significant amount of our forces to the pacification of the region."
 
 SHA_economic_ruin:0 "Destroyed Economy"
 SHA_economic_ruin_desc:0 "Red Eye's forces have destroyed many roads and workshops, as well as burning fields and villages. It will take a lot of effort to recover from this."
 
 SHA_economic_ruin2:0 "Recovering Economy"
 SHA_economic_ruin2_desc:0 "While the worst may be over, we still have a long way to go till our economy is truly back on track."
 
 SHA_economic_ruin3:0 "Stagnant Economy"
 SHA_economic_ruin3_desc:0 "It took a lot to get our economy back on track, but we're gonna feel echoes of the collapse for years to come."

SHA_economic_ruin4:0 "The Slow Upswing"
 SHA_economic_ruin4_desc:0 "The economy is slowly on the way up. More factories are opened day by day, and more workers go home with baskets filled with food. It's taken a while, but the economy is back, though still slower growing than it was."
 
 SHA_slaver_remnants:0 "Slaver Remnants"
 SHA_slaver_remnants_desc:0 "The Battle for Shattered Hoof is won, but some of these slavers just don't know when to quit!\n§CAs long as they are still out there, it will be impossible to launch any concerted effort at reconstruction.§!"
 
 SHA_LRA_prison_colony_idea:0 "Penal Colony"
 SHA_LRA_prison_colony_idea_desc:0 "Prisoners from the east are sent to this land on an almost daily basis, causing our society to be fragile and disorganized."
 
 SHA_speed_repair:0 "Repair Effort"
 SHA_speed_repair_desc:0 "We are launching a massive program to repair our infrastructure in all areas that were affected by the Battle of Shattered Hoof."
 
 NCR_investement_from_sha:0 "Investment From Azuria"
 NCR_investement_from_sha_desc:0 "The Provisional Republic of Azuria is investing in our industry, making large projects much more efficient."
 
 NCR_eastern_wall:0 "Bulwark of the East"
 NCR_eastern_wall_desc:0 "We are all that stands between the Enclave and the heartland of the alliance. We must hold at any cost!"
 
 NCR_early_buildup:0 "Military Buildup"
 NCR_early_buildup_desc:0 "We are making a concerted effort to raise our military potential in anticipation of future wars."
 
 NCR_early_joint_exercise:0 "Joint Training Exercises"
 NCR_early_joint_exercise_desc:0 "Our army is performing extensive exercises in coordination with the other forces of the Shattered Hoof Alliance."
 
 NCR_early_provisional_army:0 "Provisional Army of the Republic"
 NCR_early_provisional_army_desc:0 "We finally have a proper standing army to defend our country. While it is still nowhere near the level of professionalism we'd like it to be, this army will still fight hoof or claw to defend their homes."
 
 NCR_early_cauterize:0 "For the Republic!"
 NCR_early_cauterize_desc:0 "§RWe shall fight them with our guns, and once we run out of ammo, we shall fight them without. Our lives, for the Republic!§!"
 
 NCR_last_resort_idea:0 "For the Republic!"
 NCR_last_resort_idea_desc:0 "It is now or never. The time for failure is over, it is now time to make these bastards pay with blood for every meter they advance."
 
 NCR_growing_pains_army:0 "Integrating Armies"
 NCR_growing_pains_army_desc:0 "The armies of the nations that formed the NCR were fundamentally different in structure, training and equipment. We are embarking on the long process of integrating them into one organized force."

 NCR_growing_pains_economy:0 "Integrating Economies"
 NCR_growing_pains_economy_desc:0 "Despite the programs for economic integration we ran before unification, our industry is now a tangled mess of different standards and procedures. It will take time for us to get everything back on track."
 
 NCR_fmcc_idea:0 "Federal Ministry of Domestic Security"
 NCR_fmcc_idea_desc:0 "Federal Ministry of Domestic Security agents are focused on identifying terrorist plots and foiling them before conventional police forces ever have to get involved."
 
 NCR_waste_exploitation_1_idea:0 "Treaty on Wasteland Exploitation"
 NCR_waste_exploitation_1_idea_desc:0 "This treaty allows private companies to exploit the resources of the Wasteland with the full backing of the Republic."

 NCR_gun_in_every_hoof_idea:0 "A Gun in Every Hoof"
 NCR_gun_in_every_hoof_idea_desc:0 "We are the NCR, and we make more guns than any other country! Our 'Arsenal of Freedom' is always ready to light up whoever dares to stand against us!"

 NCR_militia_army:0 "New Canterlot Republic Armed Forces"
 NCR_militia_army_desc:0 "The NCRAF relies largely on a number of local and regional militias, which may all be called to protect the Republic as a whole."
 
