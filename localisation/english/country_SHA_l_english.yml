 NCR_power_struggle_urp_decision_cat_desc:0 "Currently, §MGawdyna Grimfeather§!, President of the Republic, and §RWaterworks§!, Treasury Secretary of the URP, are locked in a struggle over party leadership.\nThe current influence of both is:\n§M[?gawd_influence]% of the party supports Gawdyna§!\n\n§R[?water_influence]% of the party supports Waterworks§!\n"
 
