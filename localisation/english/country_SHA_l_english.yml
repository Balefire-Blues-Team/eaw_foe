GTC_greenway_trade_hub_idea: "Greenway Trade-Hub"
GTC_greenway_trade_hub_idea_desc: "The capital city of Greenway, Headwaters, is a major port, acting as a middle ground between the inland southern powers of Equestria, and the Heartlands. Through the city of Headwaters flow goods from as far away as Caledonia and Hoofington, purchased by ponies all the way from Fillydelphia and Manehattan. Their main export are slaves, brought to them by the Emerald Wardens to their south, though the slave business has been declining ever since Red Eye started to favor slaves bought from Old Appleloosa."
GTC_outcompeted_by_OAP_idea: "Outcompeted by Old Appleloosa"
GTC_outcompeted_by_OAP_idea_desc: "Unlike Old Appleloosa and other slavers, we refused to align with Red Eye, and now our economy suffers for it."
GTC_outcompeted_by_OAP_2_idea: "Slaves from the Pure"
GTC_outcompeted_by_OAP_2_idea_desc: "With the Pure as our allies, they are all too happy to sell their unicorn population into slavery to us. Finally, business is looking up again!"
TPU_earthborn_purity_idea: "Earthborn Purity"
TPU_earthborn_purity_idea_desc: "The Pure are earthpony supremacists, rejecting any other pony species. The only ones they'll even slightly accept are unicorns who show an understanding of their own inferiority by breaking their horns off, becoming like earth ponies. Due to their rejecting of unicorns, the Pure's fighting force is small compared to their surrounding powers, yet they are very tough."
COT_empty_forests_idea: "Empty Forests"
COT_empty_forests_idea_desc: "Corona has long been underpopulated, with only small tribes making their homes in the many forests located here. Rumors say that once this land was prosperous and filled with ponies, but repeated conscription from Shattered Hoof, raids from Amethyst, and young ponies leaving to places like Neocastle to search for a better life, have left this land nearly barren of life."
COT_SHC_tribute_to_topaz_idea: "Tribute to Shattered Hoof"
COT_SHC_tribute_to_topaz_idea_desc: "Ever since Ruby Rose marched into Corona, Shattered Hoof has taken much from Corona. Once per year, the ponies of Corona gather together and make their offerings to Shattered Hoof, forced to give up protection, prosperity, and even their friends to fuel the raiders of Shattered Hoof."
SHC_6_barrel_justice_idea: "6-Chamber Justice"
SHC_6_barrel_justice_idea_desc: "Here in Sherhoof, there ain't nothing more important than the law, and following the law. Each city is led by a deputy, all of whom answer to Sheriff Steel Wall. The deputies and their posses of lawponies are famous for dispensing justice with their six-shot revolvers. Here in Sherhoof, revolvers are the weapon to use, with them being better than any other six-shooters in the wastes, ready to bring law and order written in the blood of the poor bastards who disturb the peace."

