POLITICS_DEADEYES_DESC:0 "Once a minor warlord with little to his name, the past of Deadeyes is anything but spectacular. His rise to power was near entirely unexpected, leading to many local warlords being caught entirely off guard by the unassuming stallion.\n\nThough his new station came to a surprise to many, his rule quickly spoke for itself. Under his stern hoof, the decaying and infighting Shattered Hoof Gang was reorganized and reformed into a force greater than anything the south had seen in a long time. They were quick to reconquer their old lands, before turning their attention to the other raider gangs that had preyed on them for so long.\n\nA series of forceful conquests and tactical mergers would leave the Shattered Hoof Raiders as the most powerful gang along the Azureway. Though while Deadeyes was seemingly the one to lead the gang through all of those years, the true official leader of Shattered Hoof would remain the mysterious and elusive 'Mr. Topaz'. Yet with Deadeyes seemingly the only one to ever even speak to this Mr. Topaz, many doubt that he is anything more than a fictional figurehead created to scare new recruits into line."

POLITICS_EARLYGAWD_DESC:0 "Among the Talons, there are a few names which are known and renown across all of the post-war Wasteland. One of these names is Gawdyna Grimfeathers, the leader of Gawd's Talons and one of the few to reject Red Eye's offer of employment.\n\nGawdyna is known, perhaps paradoxically, for both upholding a basic sense of morality and following her contracts to the letter. She has turned down countless jobs that other Talons would jump at, for no other reason than them being distasteful. However, her moral line was nowhere near high enough to prevent her from being put under the employ of the Shattered Hoof Gang.\n\nNow, her contract has been finished, and she has found herself in charge of the gang that had employed her. It is unknown what her plans for the future may hold, though many are hopeful that she will create something far better than the raider nation that had previously occupied the lands south of the Azureway."


POLITICS_STEELWALLREVOLUTION_DESC:0 "Hostile occupation has not been kind to Steel Wall. He has been forced to cower in bunkers, watch the ponies under his command be slaughtered, and remain constantly on the run from those who would seek his demise. Lesser stallions would of given up by now, surrendered themselves or fled for better lands. Not Steel Wall though.\n\nThe Marshal has persevered through all of it and now stands ready to reclaim all that was lost to him. The disgrace his nation felt as it was forced under the rule of another will be no more. His pride, his country, and the freedom of his ponies shall all be restored."

