 SHA_char_turnip_menace_name:0 "Turnip Menace"
 SHA_char_turnip_menace_name_desc:0 "§gTurnip Menace. This name inspires terror among many farmers. He was once just another poor farmer, forced to give up a large portion of his harvest to the Shattered Hoof Gang everytime they came to call. That is, until he decided to fight back. Gathering a large militia of farmers and settlers to him, he declared the Land of Beets, with himself as the lord of it. This led to the brutal and bloody War of Beets, which resulted in many losses for the raiders. After a sustained and bloody conflict, the rebellious country finally fell. Mr. Menace was captured, and to everyones surprise, Deadeyes offered him a position within the gang. Though he isn't as great of a leader as we would of hoped, his farming expertise proved very valuable. Expertise we may now put to use.§!"
