 NCR_integrate_TEN_decision_cat:0 "Integrating Manehattan"
 NCR_integrate_TEN_decision_cat_desc:0 "The ponies in Manehattan have proven to be faithful allies, and we wish to keep on their good side.\n\n However, it is still the goal of the NCR to unify all of Equestria, Manehattan included. \n\nTo make the transition as easy as possible, we will slowly subvert their sovereignty under the guise of economic development."
