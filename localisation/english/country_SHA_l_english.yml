 NCR_early_eastern_defense_decision_cat_desc:0 "It is imperative that we secure our eastern border against the Enclave, otherwise they might destroy us in the future."
 NCR_early_eastern_defense_connect_capitals_decision:0 "Connect Leslie and New Mango"
 NCR_early_eastern_defense_outpost_line_decision:0 "Fortify the Eastern Border"
 NCR_early_eastern_defense_outpost_line_decision_desc:0 "If at all possible, we have to stop the enemy right at the border! The further they push in, the more our industry and civilian population is threatened."
 NCR_early_eastern_defense_leslie_mango_line_decision:0 "The Leslie-New Mango Line"
 NCR_early_eastern_defense_leslie_mango_line_decision_desc:0 "Should we be pushed back form the border, it has to be our highest priority to protect the settlements of Leslie and New Mango. To this end we should construct a line of fortifications stretching across their territory."
 
