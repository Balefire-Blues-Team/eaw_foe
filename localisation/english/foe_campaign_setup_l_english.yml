l_english:
 FOE_SETUP_TAB:0 "Campaign Setup"
 FOE_SETUP_TAB_TT:0 "Choose optional campaign systems. Confirm your choices once at the start of the campaign."
 FOE_SETUP_HEADER:0 "Campaign Setup"
 FOE_SETUP_INTRO:0 "Choose the campaign you want to play. Confirm your settings before advancing time. Once confirmed, these choices are permanent."
 FOE_SETUP_LEADERS_HEADER:0 "Great Leaders"
 FOE_SETUP_ENABLED:0 "Enabled"
 FOE_SETUP_ENABLED_TT:0 "Great Leaders are selected. Click to disable before confirming setup."
 FOE_SETUP_DISABLED:0 "Disabled"
 FOE_SETUP_DISABLED_TT:0 "Great Leaders are disabled. Click to enable before confirming setup."
 FOE_SETUP_LEADERS_DESC:0 "Give eligible AI countries a chance to begin with a Great, Legendary or Mythic Conqueror, Administrator or Industrialist. Larger powers and your starting neighbours are less likely to receive one.\n\nYour country, Red Eye, Shattered Hoof and the Commonwealth are excluded. Leaders are rolled once, after you confirm."
 FOE_SETUP_FUTURE:0 "Antagonists and Special Content: planned for a future update."
 FOE_SETUP_PENDING:0 "No leaders have been generated. Confirm to lock your choice, including if you leave Great Leaders disabled."
 FOE_SETUP_LOCKED:0 "Campaign setup confirmed. These settings are locked for this campaign. You can close this window or explore the other welcome pages."
 FOE_SETUP_EXPIRED:0 "Campaign setup is only available on the opening day. No new Great Leaders can be generated in this campaign."
 FOE_SETUP_CONFIRM:0 "Confirm Setup"
 FOE_SETUP_CONFIRM_TT:0 "Permanently lock these settings. If Great Leaders are enabled, eligible AI countries will roll for leaders once. This cannot be undone."
