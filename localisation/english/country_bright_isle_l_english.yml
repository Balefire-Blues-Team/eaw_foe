l_english:

 ##STE##
 STE_char_hopeful_blade_name:0 "Paladin Hopeful Blade"
 STE_char_hopeful_blade_desc:0 "\"The ponies of Trottingham are scarred from the attacks against them, and they have not been given time to let those scars heal. They are weak and fragile, perfect targets for the perfidious enemy to the west. We have been deigned by our forefathers, and their forefathers before, to protect the innocent of Trottingham from the barbarity of the Zebra menace. So we stand tall and proud, until our very last blade falls.\"\n\nHopeful Blade was just a colt when The Darkness descended upon the isle, and when the Steel Rangers left to take Trottingham. He was raised on tales of knights of old, chivalrous stallions and mares in gleaming armor, slaying monsters and savages alike to protect the innocent. He proved himself a worthy soldier from a young age, when the Knights were attacked by a Zebrican probing force. His commanding officer died and he took control, his squad's tactics cutting down the stripes before they could escape with their captured slaves. Over the last thirty years he has proven himself time and time again, until he assumed the position of Paladin, leader of the Knights. He takes pride in his work, and in the protection of Trottingham."
 ##LGE##
 LGE_char_Croissant_Mousquet_name:0 "Générale de Brigade Croissant Mousquet"
 LGE_char_Croissant_Mousquet_desc:0 "\"We know what it is like to lose a home, and I would not wish that fate on my worst enemy. Prance is distant, taken by Hippogriffs who now know it as their own home. I am not cruel enough to seek to deprive them of a home just so we can have one. This place, this Trottingham, we can help them rebuild, we can give them technologies they lost a century ago. All we ask is that we can share their home, and make it our home as well.\"\n\nLeader of the Prench Foreign Legion, Croissant was born to its then-leader, her father Croissant Curve, who led the great exodus from their home. As a young mare she took her father's place and led the Prench on their long march north. She led them through many small skirmishes along the way, losing not lives, but equipment. She heard of the cursed isle of Trottingham from others, and set out to make it her home. She carries little room for hate in her heart, though she is willing to use violence when needed. She often thinks of the home that was taken from her, and thinks that if she had not been taken from it, she would have become a teacher of some sort. She often gets lost in daydreams about a classroom that will never be."
 LGE_char_Eclair_Dubois_name:0 "Éclair Dubois"
 LGE_char_Eclair_Dubois_desc:0 "\"Our home has been our home for thousands of years, yet those Hippogriffs think they can take it from us?! Our forefathers were weak, cowards who just rolled over and let it happen! Well, I'm not going to let it happen. My children, my Prench children, will have a home that is Prench, where they may be Prench without worry of discrimination, of death, or discomfort! Prance will rise again!\"\n\nÉclair was one of the original members of the Légion, leaving with Croissant Curve over twenty years ago. He is wanted in New Aris for hate crimes against local Hippogriffs, spurred on by rage at them living in the city of his ancestors. Éclair has hate burning through his heart, especially for the Hippogriffs, and will do whatever it takes to have his revenge on them. He believes that Prench is the supreme culture, having seen what he deems the disgusting, inferior cultures of Hornsmith and Petershoof. He dreams of a country where all speak Prench, all act Prench, and all are Prench."
 ##BIT##
 BIT_char_astral_supremacy_name:0 "Queen Astral Supremacy"
 BIT_char_astral_supremacy_desc:0 "\"Mmm, scholars are always my favorite. Mages, wizards, sorcerers, oh, they're just all so boring. They cast a few paltry cantrips and think I'll swoon and crown them, and then I show them what real magic looks like, and they run away crying, so sad. But scholars? You all know you don't know everything, you know your worth, and you know I'm a mare worth her weight in gold. Let me know if you want to come and talk again later, cutie-pie, I might be up for a... thorough interview.\"\n\nQueen Astral Supremacy is an old mare by now, though she might look like she's barely older than thirty. She led her home through the crisis caused by The Darkness, using magical shields to hold mutants at bay for days, and magical attacks to destroy any who got through. She was crowned Queen when all was done, and is a remarkably generous and kind ruler to her subjects. Any who approach her and supplicate, asking for her magical aid, will be granted it. But she hates her underlings, mages and sorcerers who think they're greater than her. She teases them and lets them think they're something special, until they fail to meet her expectations and she leaves them with burning shame and disappointment. She is highly attracted to intelligence and is, herself, quite intelligent and well-read, knowing all about the Great War."
 ##INF##
 INF_char_The_Hungry_name:0 "The Hungry"
 INF_char_The_Hungry_desc:0 "The Bringers of End have no leaders and no personalities. They began as a starving family of peasants who ate a piece of The Darkness out of desperation. Their bodies break, mutate and change every moment of every day, and their minds are filled with the pain of The Darkness' last moment. They know of only one way to make it stop: to bring it back."
 ##CLK##
 CLK_char_zoo_keeper_name:0 "Lord Zoo Keeper"
 CLK_char_zoo_keeper_desc:0 "\"Come one, come all, come, come, come on down to Zoo Keeper's Grand Zoo! Never before seen mutants, animals thought extinct, mythical animals from regions unheard of, all can be admired for the low cost of ten caps per visitor! Come and try our most famous attraction, the Pet A Non-Mutated Cat exhibit, where you can pay five caps to pet a cat's head! It's an experience you won't forget!\"\n\nLord Zoo Keeper is a mixture between a carnie and a snake oil salesman, obsessed with his Grand Zoo and all the exhibits within. He wasn't always a Lord, instead being born to a peasant family in the aftermath of The Darkness. As a peasant he captured his first animal, a mutated squirrel, and charged other peasants to look at it. He slowly got better and better at capturing animals, manticores, wolves, all sorts of creatures, and the price to see them slowly increased. He was inducted as a Lord and made a member of the Council due to how impressive his collection is. He just really likes animals, and really likes money."
 CLK_char_icebrand_name:0 "Lady Icebrand"
 CLK_char_icebrand_desc:0 "\"The Verdant Council have sat on their flanks for far too long. It is due to the incompetence of one of our Ladies that this new infection has broken out, and instead of agreeing on a solution, my peers bicker and debate over how. The Council is an outdated system filled with incompetents and sycophants. The ponies of our realm deserve better. I aim to deliver better.\"\n\nBorn to Lady Blank Mind, known as one of the most incompetent Ladies of the Council's fifty year history, Lady Icebrand watched as her mother's mismanagement led to famine and almost to a peasant revolt. She managed to convince her mother to give her the crown at the young age of sixteen, immediately taking control of her realm and reversing course. Over the past twenty years she has led one of the most successful parts of the Verdant Central Council. Her ponies are well fed, happy, and loyal. She sees her fellow Lords and Ladies as just like her mother, incompetents ruining the lives of those beneath them. She believes that power can only be trusted in the iron hoof of one like herself, and she plans to take that power."
 CLK_char_ruby_shores_name:0 "Lady Ruby Shores"
 CLK_char_ruby_shores_desc:0 "\"I don't look like a chav, do I, doll? I bought this fine coat from a wayward trader, he told me it was all the rage in some kingdom called Filly. My peers, well, they might be called Lords and Ladies, but half of them are dunces and the other half criminally cuckoo. Doll, world goes 'round because of caps and money changing hooves, so if you wanna be on top, have the money.\"\n\nThe Lady of a port city that has been lost to the Bringers, Lady Ruby Shores is left with a lot of money and nothing to spend it on. Despite her riches she is no miser, happily spending caps whenever the opportunity arises, even if it sometimes might be a bad idea. She openly insults her peers and dresses in fine, foreign clothing. She is a good negotiator, and is in charge of many charitable organizations across the Council."
 CLK_char_hotshit_name:0 "Lord Hotshit"
 CLK_char_hotshit_desc:0 "\"Someone told me once, you think you're hot shit, don't you, son? And I said yeah, and the name stuck with me since. I don't mind it, it's a badass name, fits me well. I'm hot, I like making shit hot, and I'm the best shit in the Council. All the other jackoffs that call themselves nobles are just taking up my breathing space, and babes, fire needs air to grow.\"\n\nLord Hotshit was once a bandit who took over a settlement heavily damaged by The Darkness, using its ponies as his personal army and taking food and supplies from others. The Council, rather than being angry that he was killing their ponies and taking their stuff, were impressed by his gumption, and offered him a seat on the Council as long as he stopped his raids. So he joined the Council, and eagerly awaits a return to his old lifestyle of raiding shit and taking it for himself."
 ##SUD##
 SUD_char_Gruna_name:0 "Gruna the Eyr-Blessed"
 SUD_char_Gruna_desc:0 "\"My family is truly blessed to be in the position we are, and I am the happiest mother, grandmother, aunt, great aunt, and every other combination that a single hen could be. My family is filled with brilliant thinkers and fighters, my grandson recently graduated top of his class! He makes me so proud, I can't wait to set him up with someone nice.\"\n\nGruna was never crowned as a leader; her son was. But instead of being jealous, she was happy, and cheered him on. She has long operated from a place of respect, but not monarchical authority, within the Südreich, marrying her beautiful and well respected sons and daughters to the many nobles and monarchs of the South. Due to those family ties, and due to her natural charm and motherly nature, she is seen by many as the unofficial Empress of the realm. Those in her family, and those married into it, look up to her, respect her, and follow what she wants. Mostly because everygriff feels a large sense of happiness whenever she is proud of them."
 ##DON##
 DON_char_author_name:0 "King Author the First"
 DON_char_author_desc:0 "\"When your enemy offers you pain and death, choose life and forgiveness instead. These are the immortal words that founded Mercy long ago, when three rival tribes came together and joined as one in the face of a bandit tribe. I still hold these words to be true today. We must be better than our enemy, we must be exemplars of what we represent, Mercy. All can find a home in my Kingdom, except those who would wish to see that mercy destroyed.\"\n\nAuthor was born to Sir Pen Dragon, a great knight who helped fight back The Darkness in Mercy. His father was crowned when The Darkness was defeated, and the crown passed on to Author after his death. Author is a just stallion, treating his peasants no differently than he would treat his own nobles. He is always willing to give a second chance, to help his enemies up after defeat and offer them redemption. But he is by no means a republican: he believes feudal society is the natural order of ponykind, that there must be peasants, and those who rule over them."
 ##NTH##
 NTH_char_northern_august_name:0 "Emperor Northern August"
 NTH_char_northern_august_desc:0 "\"What did the North Mare bring us? Many say she brought death, or sadness, or even The Darkness. No! Under her, Trottingham was safe, we were stable, we had a golden age of prosperity that hasn't been seen since! I am no North Mare, I know that, I am but a pale imitation of what she managed to achieve. Yet in her example, I will follow. In her example, I will emulate. In her name, I will bring a silver age to my home.\"\n\nEmperor August was once a common Knight of Mercy, who hatched a conspiracy with many fellow Knights and with many peasants in the settlement of Normare. He led a grand coup, founding the Empire of Normare. He looks up to North Mare more than anyone else, dedicating his entire life to living in her shadow. He doesn't think he is anyone great or special. Though he is in truth a brilliant tactician and leader, he simply sees himself as an unworthy follower of North Mare's ways."
 ##TSR##
 TSR_char_bean_toast_name:0 "Paladin Bean Toast"
 TSR_char_bean_toast_desc:0 "\"We all heard over the radio when the Princessyn expedition failed last time. We heard our brothers and sisters get slaughtered by mutants beyond our comprehension. And yet we have stayed here, trapped on this isle. We are not Steel Rangers, just posers wearing power armor. It's time we change that. It's time we embrace who we are.\"\n\nBean Toast was a young Knight when his mother brought him in to listen, with the other members of the Trottingham Contingent, to the last known broadcast from the Princessyn Contingent. The things he heard that day shook him to his core, and what made it worse was that none of his fellow Rangers seemed to care. They went on with their days, while every single night the broadcast would play in his head, and guilt would eat away at him. Bean Toast sees the Steel Rangers as a large family, and he cares for his family more than anything else. Those outside the family are to be acknowledged and treated with distant respect, but nothing more. The original mission of the Rangers, the protection and preservation of technology, is good and just, and he wants to see that mission return."
 TSR_char_boring_presentation_name:0 "Star Paladin Boring Presentation"
 TSR_char_boring_presentation_desc:0 "\"As you can see on slide eight, point b, the reasons I will be best for the Contingent and the isle as a whole must first be defined. Mareiam-Web Spinner's dictionary defines best as- don't fall asleep while I'm giving a presentation, it is very rude. We still have fifty two slides more to go. Now, where was I?\"\n\nBoring Presentation fits his name: he's boring. He is a great leader due to his sharp mind and his thorough briefings, which contain more than enough information to aid any Ranger. He just delivers them in the most boring way possible. He doesn't have any hobbies and doesn't particularly enjoy anything other than making checklists and slideshows, and most of his day is spent preparing for his next presentation, or giving one. Sure, he's morally good and he wants good things, but nobody can stand sitting through his five hour presentations."
 TSR_char_cherry_slushie_name:0 "Knight Cherry Slushie"
 TSR_char_cherry_slushie_desc:0 "\"The Rangers on Trottingham are a bit eccentric, I will admit. Half the time it sounds more like I've been transported into a fantasy novel, rather than to a fellow Ranger Contingent. Sure, they speak like Shake Spear, and it's a bit annoying, but they're overall actually really pleasant! I think they're already halfway to being Applejack's Rangers, I mean, they already defeated a great evil. That's more than most other Contingents can say.\"\n\nKnight Cherry Slushie comes from the Manehattan Contingent, having heard of Steelhooves' ideas of renewed oaths, of the Applejack's Rangers. When Elder Cottage Cheese wanted a liaison to the distant Trottingham Contingent, she happily volunteered and sailed to the far north. She's a far cry from the normal Trottingham Rangers, being very laid back and casual in how she speaks, and not speaking in their old dialect. Due to her friendly nature, ponies naturally like listening to her, giving her ideas of chivalry fertile ground in the already chivalrous Trottingham Contingent. She might find them a bit strange, but she also likes them."
 TSR_char_knight_light_name:0 "Scribe Knight Light"
 TSR_char_knight_light_desc:0 "\"The Darkness is too great a threat for us to simply ignore! My father gave his life to blow that thing up, and now it's returning! The others don't believe me, they call me paranoid, they say we just missed some during the Cleansing, but I know they're wrong! We didn't kill The Darkness, we just weakened it, and it's still out there, watching, waiting, plotting! I'm not content to sit back on my flank and welcome the apocalypse again!\"\n\nKnight Light was born in Trottingham, one of the first to be born there after the Contingent moved in. His father was the Steel Ranger who survived to the end of the suicide mission and blew up The Darkness; Light was conceived the night before. He grew up hearing horror stories from survivors, of mutants ripping through armor, flesh and bone. From an early age he was intelligent, able to grasp the mysteries of the world, yet one thing slipped his grasp. He never could understand The Darkness, what could have caused it to exist, what made it act the way it did. With the recent sightings of mutants washing up on the shore of Trottingham, he knows in his gut that The Darkness is still alive out there, preparing for its return. He is arrogant in that he believes he is the only one thinking about The Darkness, but that is not the true source of his arrogance. He is truly arrogant because he thinks he can understand The Darkness. Because he thinks he can destroy it."

