l_english:
 #metal bar
 melee_weaponry_tech_1:0 "Basic Melee Equipment"
 melee_weaponry_tech_1_desc:0 "The most basic and easy to produce weaponry of the Equestrian Wasteland, melee weapons were often used by groups with less industry or technology. Seen often with tribals, new raider gangs, or on the Isle of Trottingham, they are cheap and reliable. Includes spears, swords, tools turned to warfare, and various improvised weapons."
 #guns
 standard_weaponry_tech:0 "Primitive Ballistic Weaponry"
 standard_weaponry_tech_desc:0 "Often cobbled together from scrap or the reject pieces of better weaponry, these weapons are barely better than melee weapons. Most often these types of weapons were seen used by small settlements or raider gangs. They can only handle low caliber bullets, and are singularly ineffective. However, with enough guns, even the most scary mutants could be scared away, though likely not killed."
 ballistic_weaponry_tech_1:0 "Outdated Ballistic Weaponry"
 ballistic_weaponry_tech_1_desc:0 "Often inspired by gun designs from before the Great War, these weapons are often either repeating or bolt action. These were the most common weaponry among the Wasteland's armed forces, having been used widely by Red Eye's Slavers in the early reclamation of Fillydelphia."
 warrior_equipment:0 "Basic Kit"
 warrior_equipment_desc:0 "Comprised of already loaded magazines or clips for ballistic weaponry, along with bedrolls and basic provisions. These kits are nothing special, but they ensure that soldiers can fight for longer. Often, they were seen in Wasteland armies preparing for a war."
 ballistic_weaponry_tech_2:0 "Early War Ballistic Weaponry"
 ballistic_weaponry_tech_2_desc:0 "Inspired by designs seen near the start of the Great War, such as those used in the conquest of Caledonia and of Severyana, these weapons made the common soldier a much more dangerous threat. These weapons were seen used en masse by the New Canterlot Republic during their early years."
 ballistic_weaponry_tech_3:0 "Contemporary Equipment"
 ballistic_weaponry_tech_3_desc:0 "Very rare across most of the Wasteland, these pieces of equipment are inspired off of the later designs of the Great War, such as those used to fend off the landing in Petershoof. Semi-automatic or fully-automatic, these guns were often only used by wandering heroes, expensive mercenary groups, or the bosses of raider gangs."
 basic_infantry_equipment:0 "Standardized Uniforms"
 basic_infantry_equipment_desc:0 "Often the stopping point for large Wasteland armies, their standardized uniforms could take on different forms depending on the army. Mass produced and often ensuring greater distinction between friend and foe. Seen most famously in The Commonwealth's conquest of Hornsmith, as both sides adopted standard uniforms."
 collapsible_weapons:0 "Collapsible Weapons"
 collapsible_weapons_desc:0 "Reverse engineered from weapons used by Zebican infiltrators, these compact weapons were able to be easily used as side arms by support personnel while still packing the punch of a primary weapon. These weapons led to the breakthrough of the Northern Front by the Zebican forces near the Last Day, allowing their push to Hoofington."
 ballistic_weaponry_tech_4:0 "Advanced Weaponry"
 ballistic_weaponry_tech_4_desc:0 "A mixture of cutting edge Great War technology and Wasteland ingenuity, these weapons were the best one could see on the battlefield. With an advanced weapon, just one soldier with a gun can perform the role of five soldiers with less advanced weaponry. Put to great effect during the Reclamation Of Stableside."
 ballistic_weaponry_tech_5:0 "Specialized Ammo"
 ballistic_weaponry_tech_5_desc:0 "Previously primarily made by gun nerds in personal workshops and never seeing mass deployment, specialized ammo types include hollow points, armor piercing, incendiary, and other such effects. When mass produced, switching between ammo types allows infantry to fulfill an anti-tank role as well as an anti-infantry role."
 prewar_infantry_kit:0 "Late War Kit"
 prewar_infantry_kit_desc:0 "Kits which were the quality of those given to soldiers during the later years of the Great War. Often included radios, flare guns, shovels for entrenchment, and medical kits. Greatly increased the effectiveness of infantry."
 #energy weapons
 enchanted_bullets:0 "Enchanted Bullets"
 enchanted_bullets_desc:0 "A technique used by both Zebrican and Equestrian forces during the Great War was the enchantment of their bullets. With a bit of a magical touch, bullets were able to travel faster, hit harder, and overall become more effective for the common soldier."
 captured_spells:0 "Captured Spells"
 captured_spells_desc:0 "The magical crystals that fill Equestria have the capacity to be filled with a unicorn's spell, which can then be released whenever desired. Many crystals across the Wasteland were often filled with healing spells, shield spells, and in many raider gangs, fireballs."
 energy_weaponry_tech_1:0 "Primitive Magical Energy Weapons"
 energy_weaponry_tech_1_desc:0 "Magical Energy Weapons used the spell capturing of crystals and weaponized it even further. These weapons are not like those seen during the Great War, but rather are crude attempts to imitate them. Consisting mostly of crank-loaded energy muskets or crystal launchers, these were the first step to magical energy weapon development for many nations."
 mew_capacitors:0 "MEW Capacitors"
 mew_capacitors_desc:0 "The need to crank weapons to draw out the power of crystallized magic came about due to a lack of place to store the magical energy. These capacitors solved that issue, providing a non-crystal source for magical energy to be stored and released, allowing for magical energy weapons to operate without the need for cranking."
 energy_weaponry_tech_2:0 "Basic MEWs"
 energy_weaponry_tech_2_desc:0 "Used primarily by the Grand Pegasus Enclave, these magical energy weapons use their capacitors to bypass the time between shots, allowing for quicker rates of fire. One shot from these weapons will leave a scar for the rest of your life, and if you're unlucky, it'll turn you to ash in an instant."
 crystal_lenses:0 "Crystal Lenses"
 crystal_lenses_desc:0 "Only able to be made by more advanced Wasteland nations, these lenses take slivers of crystals and use them to reflect and refract magical energy, multiplying its speed and its accuracy. These lenses allow for specialty designed sniper-type magical energy weapons, as well as increase the accuracy of basic infantry."
 energy_weaponry_tech_3:0 "Advanced Energy Weaponry"
 energy_weaponry_tech_3_desc:0 "Consisting of deadly accurate laser rifles and fully automatic magical energy weapons, these weapons saw limited use in the Great War, instead being mostly developed by the Grand Pegasus Enclave. These were the weapons that were primarily used during Operation Cauterize, their high effectiveness seen in the Battle of New Appleloosa and Friendship City."
 improved_heat_cycling:0 "Heat Cycling"
 improved_heat_cycling_desc:0 "By cycling in and out the magical crystals that are being used, as well as the lenses and capacitors used in magical energy weapons, they are able to become better at sustained and rapid fire. Though this cycling was expensive to put into weapons, it allowed for unmatched sustained fire."
 energy_weaponry_tech_4:0 "Futuristic Energy Weapons"
 energy_weaponry_tech_4_desc:0 "More advanced than the weapons used during the Great War, these energy weapons can kill even moderately armored infantry in just one shot. They are fully automatic and can sustain fire for long periods of time, and they are fully accurate, with no recoil. They were only seen used en masse after the Treaty of Cloudsdale, used by Grand Pegasus Enclave remnants who continued the war against the Wasteland."
 #armor
 heavy_infantry_tech_1:0 "Heavy Infantry Armor"
 heavy_infantry_tech_1_desc:0 "Consisting of padded armor, caravan shotguns, and blunt weapons, this kit was primarily used for heavier, closer range infantry activities. Though those who used this kit were often more vulnerable to being picked off by longer range enemy infantry, however, if they got in close, especially against armored opponents, they would often create a breakthrough."
 heavy_infantry_tech_1_1:0 "Non Lethal Ammunition"
 heavy_infantry_tech_1_1_desc:0 "Used by heavy infantry put onto occupation duty, non-lethal ammunition ensured that fewer would be killed when suppressing resistance activities. Though many didn't use non-lethal ammunition, preferring to kill those who oppose them, those who did use it reported greater success in resistance suppression."
 heavy_infantry_tech_2:0 "Hoofball Inspiration"
 heavy_infantry_tech_2_desc:0 "The uniforms used by Hoofball teams, such as the Hoofington Reapers, often was padded enough to protect against incoming fire while still allowing flexibility of movements. Many designs first used to try and protect athletes were discovered and put to use to improve the quality of the padded armor used by heavy infantry."
 heavy_infantry_tech_3:0 "Pocket Pistols"
 heavy_infantry_tech_3_desc:0 "The weapons used by heavy infantry often were unable to be put to good use in the tight corridors of urban areas or in fortifications. The introduction of low caliber pistols, small enough to fit into a soldier's pocket, allowed heavy infantry to better respond in enclosed spaces."
 heavy_infantry_tech_4:0 "Heavy Armor"
 heavy_infantry_tech_4_desc:0 "Via use of more composite, and stronger materials, heavy infantry armor became better at absorbing enemy attacks. Though more expensive to make, padded armor backed by composite materials rather than scrap metals allowed for almost twice as much fire to be withstood by the average soldier."
 heavy_infantry_tech_5:0 "Carapace Bands"
 heavy_infantry_tech_5_desc:0 "Inspired by Changeling designs, many heavy infantry armor pieces began to be supplemented with what was termed as a 'Carapace', a hard outer layer of welded-on metal which would provide defense against small arms fire."
 heavy_infantry_tech_6:0 "Powerful Armor"
 heavy_infantry_tech_6_desc:0 "A humorous term coined by a garrisoning soldier after surviving a kick from an occupied Steel Ranger, Powerful Armor was the final form of armor used by heavy infantry. Consisting of multiple layers of composite metal and padding, Powerful Armor could survive much before giving way."
 heavy_infantry_tech_7:0 "Internal Comms"
 heavy_infantry_tech_7_desc:0 "Communications systems that were integrated directly into Powerful Armor ensured that heavy infantry could communicate in an instant. These communications allowed for any ambushes to be responded to instantly, and allowed for more organized action."
 heavy_infantry_tech_3_1:0 "Basic CQC Weaponry"
 heavy_infantry_tech_3_1_desc:0 "As heavy infantry took to the field more as specialty breachers, their basic blunt weapons and caravan shotguns proved ineffective. The first properly effective heavy infantry units used a mixture of pump action shotguns and heavy melee weapons such as sledgehammers. Their shotguns would rip through soft targets, while their heavy weapons would smash through the armor of hard targets."
 heavy_infantry_tech_5_1:0 "Unarmed Weaponry"
 heavy_infantry_tech_5_1_desc:0 "Given the aggressive nature of heavy infantry, many found themselves running out of ammo or losing grasp of their melee weapons in the middle of fights. Basic unarmed weaponry began to be integrated into their armor, including hooks on the back of their legs, like seen with Massacre of the Paragons, or Yaka of the 6th Khagnate."
 heavy_infantry_tech_7_1:0 "Shredder Weaponry"
 heavy_infantry_tech_7_1_desc:0 "The most advanced heavy infantry didn't use any one piece of equipment, rather, they used an eclectic mix of close ranged weapons. Riot shotguns, power hooves, super-sledgehammers, and the like. Most famous were the ballistic-hooves, such as the hoof shotguns of Two-Kick Rip, the greatest fighter of the Paragons."
 #Courier kit
 courier_kit_tech:0 "Courier Kits"
 courier_kit_tech_desc:0 "Seen often in the newspaper carriers of The Radiant Times, or in traveling merchants such as Ditsy Do. Couriers of the Wasteland often carried large bags on their backs, allowing for items of a small or moderate size to be carried quickly. Many couriers were often used to deliver orders, or to deliver supplies, when at war."
 #special tech
 spec_ops_equipment_tech_1:0 "Primative Specialized Equipment"
 spec_ops_equipment_tech_1_desc:0 "Often consisting of light leather armor, well crafted blades, and basic weapons, these pieces of equipment were often used by tribal groups for their best warriors. Most famous of them were Sealgairean Beinne of the Hill Trotters, who used their specialized, yet still primitive, equipment to great effect during Red Eye's invasion."
 spec_ops_equipment_tech_2:0 "Basic Specialized Equipment"
 spec_ops_equipment_tech_2_desc:0 "Practically the same equipment as more primitive forms, the main difference was in the quality of their production. With greater care put into making armor both more protective and more flexible, as well as ensuring weapons wouldn't jam in the middle of combat, special forces using this equipment would be effective."
 hardening_armour_tech:0 "Armor Hardening"
 hardening_armour_tech_desc:0 "By using the leather of specific mutant animals, the armor used by special forces was able to be hardened against small arms fire and melee attacks. Most famous were the gecko armors of the South-West, which could withstand attacks much better than regular leather armor."
 spec_ops_equipment_tech_3:0 "Standard Specialized Equipment"
 spec_ops_equipment_tech_3_desc:0 "Often using hardened leather armor and trading out rapid fire weapons for long range rifles, special forces using this equipment were quite the threat to forces across the Wasteland. Often special forces would work in a team, with a spotter using binoculars and a sniper picking off enemies. This equipment was most famously used by the Old Appleloosan Rangers against slaver caravans."
 ballistic_fibre_tech:0 "Ballistic Fibre"
 ballistic_fibre_tech_desc:0 "Vests worn over the hardened leather armor of special forces were often made with a specialized fibre that dispersed the impact of bullets. While these vests would often rip and tear after a few shots, they could ensure that the force of those shots didn't hurt the wearer."
 spec_ops_equipment_tech_4:0 "Advanced Specialized Equipment"
 spec_ops_equipment_tech_4_desc:0 "With vastly improved sniper rifles, and scavenged Pip-Bucks using Eyes Forward Sparkle, special forces became an army on their own. No longer needing spotters due to their EFS, special forces could act alone and kill any threats before they even knew it. Most famously, this equipment was used by one of Philosopher-Raider Punt's Stalkers, during his attempt to take Princessyn."
 spec_ops_equipment_tech_5:0 "Poltergeist Armor"
 spec_ops_equipment_tech_5_desc:0 "The last thing you never see, according to this equipment's most famous user, Gohar De Gulliaume the Fourth. With advanced camouflage, integrated stealth technology, and high-quality silenced weapons, Gohar used this technology to make much money around Olenia. It's not known if this armor was ever used en masse, as if you saw the flicker of a Poltergeist's stealth technology, it was already too late for you."
 stealth_boy_tech:0 "Stealth Bucks"
 stealth_boy_tech_desc:0 "Reverse engineered from Zebra infiltrator tech in the later stages of the Great War, Stealth Bucks are able to turn a pony invisible for thirty minutes per use. Given how rare they were, they didn't see much use on national levels until the later years of the Wasteland, where they allowed special forces to move unseen."
 air_sighting_tech:0 "Anti-Air Sights"
 air_sighting_tech_desc:0 "Given the presence of Talons in many Wasteland forces, as well as the later Operation Cauterize, many nations scrambled to allow their special forces to take care of their enemies. The most efficient way to counter the flying Talons came through modified scopes that allowed for adjusting altitude, allowing snipers to pick off flying forces."
 rangefinder_tech:0 "Rangefinders"
 rangefinder_tech_desc:0 "Often integrated into either binoculars or into power armor, rangefinders were used to calculate the range a target was from the one using the rangefinder. The most common form of rangefinder used a small laser to determine distance, range, and altitude. This is why many survivors of long ranged snipers would report seeing red lasers pointed towards them."
 night_vision_tech:0 "Night Vision"
 night_vision_tech_desc:0 "Developed by Doctor Battington during the Great War, night vision gave the thestral's natural ability to see in the dark to other ponies. Night vision was often used in goggles, or in the visors of power armor, capturing infrared light and using it to create a bright image even during night. It's very similar to the way that thestral eyes are able to see at night."
 thermal_vision_tech:0 "Thermal Vision"
 thermal_vision_tech_desc:0 "Developed by the Ministry of Wartime Technology during the later years of the war, these goggles were able to see the heat signatures of living creatures. Zebra stealth suits were able to go unseen even with night vision, but their most common suits did not fully mask the thermal imaging of their wearer, allowing these goggles to spot most infiltrators."
 #power armor
 #unique power armor
 power_armor_equipment_talon:0 "Talon Power Armour"
 power_armor_equipment_talon_desc:0 "Power armor based off of the old Ministry of Awesome designs, which has been adapted specifically for griffon use."
 power_armor_equipment_knight:0 "Knight Power Armour"
 power_armor_equipment_knight_short:0 "Knight PA"
 power_armor_equipment_knight_desc:0 "Based on a pre-war design intended for the Equestrian Royal Guard, Knight PA is bulky, slow, and cumbersome, but provides unparalleled protection for its user."
 power_armor_equipment_x01:0 "X01 Power Armour"
 power_armor_equipment_x01_desc:0 "X01-Class power armour was designed towards the very end of the War by the Ministry of Awesome, in conjunction with the Ministry of Wartime Technology. Unlike the sleeker model designed prior with the aid of the Ministry of Image, the X01 model was designed with durability over mobility in mind. This made it unpopular among the pegasus soldiers. As a result, this armour wouldn't rise to popularity until the early days of the Enclave, when the greater protection it afforded became greatly desirable."
 power_armor_equipment_x02:0 "X02 Power Armour"
 power_armor_equipment_x02_desc:0 "The X02-Class power armour is far more closely related to the original pegasus power armour than the X01 model. As resources grew scarcer, the Enclave was forced to design a less resource-intensive armour. The end result was the X02 model, which was much sleeker and lighter than its predecessor."

 #unique air technology
 raptor_equipment:0 "Raptor Cloudship"
 raptor_equipment_desc:0 "The Raptor-Class Cloudship was designed by the Ministry of Awesome during the Great War to provide ground support and deal with singular large aerial targets. This later purpose led to them being nicknamed 'dragon killers', as they gained a reputation for being used to counter Zebrican-aligned dragons. They achieve flight through cloud generators, which unfortunately leaves them vulnerable to weather related accidents."
 balloon_equipment:0 "Balloon Equipment"
 balloon_equipment_desc:0 ""
 balloon_equipment_1:0 "Pinkie Pie Balloon"
 balloon_equipment_1_desc:0 "During the War, the Ministry of Morale designed hot air balloons that looked like Ministry Mare Pinkie Pie. These balloons were used for a large variety of purposes, from monitoring suspicious activity to transporting soldiers for a raid. Though their visage is more than a little unnerving, they allow us to both monitor our own skies and to perform aerial reconnaissance."
 #unique stuff
 alicorn_equipment:0 "Alicorn Body"
 alicorn_equipment_desc:0 "The physical body of an alicorn. However, it is useless until a mind occupies it."
 alicorn_equipment_0:0 "Alicorn Body"
 alicorn_equipment_0_desc:0 "The physical body of an alicorn. However, it is useless until a mind occupies it."
 alicorn_equipment_1:0 "Enhanced Alicorn Body"
 alicorn_equipment_1_desc:0 "The physical body of an alicorn. However, it is useless until a mind occupies it."
 alicorn_equipment_2:0 "Alicorn Body"
 alicorn_equipment_2_desc:0 "The physical body of an alicorn. However, it is useless until a mind occupies it."
 fighter_alicorn_1:0 "Flying Alicorn"
 fighter_alicorn_1_desc:0 "An alicorn in flight. It's just having a good time. Don't disturb it."
 magx_equipment_gun:0 "MAG-X Supercharged Rifle"
 magx_equipment_gun_short:0 "MAG-X Rifle"
 magx_equipment_gun_desc:0 "The MAG-X Supercharged Rifle was an experimental arcane weapon developed during the War. The kinks have never been worked out, but it has proven itself to be more than capable of laying waste to our foes."

 ### Vehicle equipment
 motorbike_equipment_1:0 "Scrap Motorcycles"
 motorbike_equipment_1_desc:0 "Tubings and househould appliance-type engines have given us the opportunity for the development of motorized vehicles. While not suited to the wasteland, terrain and lacking in subtlety, it should give our soldiers a noticeable increase in both tactical and strategical mobility"
 motorbike_equipment_2:0 "Salvaged Motorcycles"
 motorbike_equipment_2_desc:0 "A lightly armored housing to protect sensitive equipment and better filtration systems will let our motorcycle divisions ride in the wasteland terrain with close to no problem. Drivers weren't forgotten, and specialized anti-dust goggles, mouth covering and shock-resistant helmets as well as a high visibility shield will let them take full advantage of their newfound mobility."
 car_equipment_1:0 "Salvaged Car"
 car_equipment_1_desc:0 "Wastelander vehicles are certainly not pretty, but like us they are tough and reliable. While the scrap metal bolted to the frame won't stop aimed rifle fire, it should still provide our troops with some measure of protection. And no one will complain about not being subjected to the horrible weather of the wasteland."
 car_equipment_2:0 "Wasteland Car"
 car_equipment_2_desc:0 "The addition of pre-war technology, like improved engines and simple optics combined with wastelander tinkering to replace overcomplicated parts makes it so we can push our motorized forces even harder. Tight maintenance schedules and increased driver training is in order to maintain our strategical mobility and reduce accident rate."
 car_equipment_3:0 "Military Car"
 car_equipment_3_desc:0 "Now that our engineering capabilities are at an almost pre-war level, we can upgrade our motorized divisions to boast faster, more reliable and well protected vehicles. New armor plating and engine tinkering combined with classic wasteland tactics should give us an edge over any other unit short of armored divisions."
 truck_equipment_1:0 "Scrap Gun Truck"
 truck_equipment_1_desc:0 "Cobbled together from scrap found in junkyard or old military bases, those gun trucks aren't much to look at. But while the scrap metal can barely hold against small arms fire and the engine has trouble keeping up with the increased weight, they make for effective protection for our infantry elements, which would never be caught complaining about not being shot. A mounted automatic rifle on a pintle mount provides supporting fire during disembarking, but the crew of these vehicles are expressly told not to engage in direct combat otherwise."
 truck_equipment_2:0 "Salvaged Gun Truck"
 truck_equipment_2_desc:0 "Another product of our salvage network, those trucks are a mismatch of rusted armor plating taken from dilapidated vehicles and engine units trying to work together through a hastily-designed transmission. Sporting better defenses than previous models, these trucks are also armed with a proper mounted machine gun with it's crew protected by a gun shield. Better provisions are also made for the embarking infantry to let them stock more firepower inside and be more comfortable riding in and out of battle."
 apc_equipment_1:0 "Salvaged APC"
 apc_equipment_1_desc:0 "Salvaged heavy trucks clad in armor provides a much more suitable base to our mechanized divisions. Thicker armor plating supported by better suspensions and high-torque engines can now resist rifle fire, laser attacks and even anti-tank rifle projectiles. A forward-mounted heavy machine gun with provision to move it to other firing ports throughout the vehicle brings suitable firepower for frontline combat, and all these features combine finally allow our vehicle crew to directly support our infantry division, resulting in much better combined-arm defenses and assaults."
 apc_equipment_2:0 "Wasteland APC"
 apc_equipment_2_desc:0 "A tracked chassis to navigate the blasted wasteland much easier, together with a twin coupled engine drive and reinforced armor platings is the result of our engineers' effort into better AFVs for our mechanized divisions. A ramp system allowing disembarking under armor protection, an external communication system for infantry support and a new mixed machine gun belt with incendiary and armor-piercing projectiles continue to improve the cooperation potential between vehicles and infantry."
 apc_equipment_3:0 "Great War APC"
 apc_equipment_3_desc:0 "Pre-war APCs are the top of the line in matter of what we can manufacture currently. Composite armor plating with spall liners, as well as kevlar protection for crew and mounted infantry alike will save the lives of many foot soldier, while the short infantry support gun will blast apart any fortified position or enemy that our boys on the ground may encounter."
 supply_equipment_2:0 "Pre-War Train"
 supply_equipment_2_desc:0 "Brightly colored and flashy, these trains announce their presence for as far as the eye can see. However, they were plentiful prior to the Great War and held up surprisingly well in the aftermath. Though many of them still have functional coal-based steam engines, the scarcity of coal means that they more often than not have to be pulled the old fashioned way."
 supply_equipment_3:0 "Wartime Civilian Train"
 supply_equipment_3_desc:0 "These trains were by far the most common in Equestria prior to the end of the world. Towards the end of the war, many commercial trains were being converted to running on electric engines. Assuming a steady supply, this removes the need for manual pulling teams."
 supply_equipment_4:0 "Wartime Military Train"
 supply_equipment_4_desc:0 "The most advanced in locomotive technology, these behemoths of metal were created to transport large quantities of military supplies across vast distances. With hybrid electrical and arcane engines, they boast an unrivaled horsepower."
 apc_desc:0 ""
 courier_equipment_1:0 "Courier Kit"
 courier_equipment_1_desc:0 "Traditionally, couriers in the wasteland carried only messages or small packages, anything larger needed a full fledged caravan. Nowadays, couriers operate out of supply hubs across the wasteland, where caravans bring large shipments, and the couriers distribute the goods to various units and towns."

 ### Power armor techs
 stripped_pa_tech:0 "Unpowered Armor"
 stripped_pa_tech_desc:0 "While this armor might look like power armor on the outside, it lacks much of the internals needed to be classified as such. Given the lack of electronics expertise in the Wasteland, many groups who came across power armor simply stripped out the inside, and wore it as an empty shell around their soldiers. It was effective against softer forces, but useless against any basic anti armor."
 simple_servo_tech:0 "Simple Servos"
 simple_servo_tech_desc:0 "The primary internal system of power armor were the servos that would allow the pilot within to better move the massive hunk of armor. While the armor was effective even without them, these servos allowed for pilots to move much easier, and much faster."
 scav_pa_tech:0 "Scrapped Power Armor"
 scav_pa_tech_desc:0 "There was truly little difference between this armor and the stripped versions of power armor. Often these suits of armor would start as stripped versions, with basic servos shoved inside to help the pilot of the armor move better. They were far from standardized, and sometimes the servos would be installed improperly, causing these faulty suits of power armor to crush the one wearing it into a bloody pulp."
 advanced_servo_tech:0 "Advanced Servos"
 advanced_servo_tech_desc:0 "These power armor servos were a marked improvement over their predecessors, allowing for much easier control and movement of the armor. Suits with these advanced servos would allow their pilots to move at remarkable speeds, despite the heaviness of their armor."
 earlywar_pa_tech:0 "Macintosh Class Power Armor"
 earlywar_pa_tech_desc:0 "Built by Ministry Mare Applejack due to the death of her brother, Big Macintosh, the Macintosh Class was the most widely produced and worn class of power armor. This armor would see use across the South-East of Equestria, and during the defense of Puerto Cabello. It would continue to be used by the Steel Rangers after the Last Day, with this armor turning any ordinary soldier into a trotting tank."
 high_pressure_hydraulics_tech:0 "Electro-Hydraulic Integration"
 high_pressure_hydraulics_tech_desc:0 "Hybrid systems combine electric actuation with hydraulic power, improving precision, lowering fuel consumption, and reducing input-lag in heavy machinery and powered armor. "
 improved_pa_tech:0 "Honesty Class Power Armor"
 improved_pa_tech_desc:0 "The Honesty Class was the latest mass produced design of power armor during the later years of the Great War. Though more expensive, it was generally higher quality in every way, and it saw extensive use during the Battle of Hoofington and the Battle of Petershoof. After the Last Day, the Honesty Class was often reserved for Paladins and Star Paladins of the Steel Rangers."
 latewar_pa_tech:0 "Steelhooves Class Power Armor"
 latewar_pa_tech_desc:0 "A version of power armor developed by the Applejacks Rangers after the death of their first leader. It took the Honesty Class and made it much heavier, built to be able to withstand assault by Grand Pegasus Enclave and Steel Ranger weaponry. Records say that many of the improvements made to the armor were inspired by modifications done to Steelhooves' own armor over his two centuries of life."
 juggernaut_pa_tech:0 "Ursa-Major Class Power Armor"
 juggernaut_pa_tech_desc:0 "A late-war prototype, the Ursa-Major straddles the line between power armor and a mech. Massively up-armored, fitted with an array of redundant shield-talismans and hydraulics and Rad-rated up to 2.000 Rps, this armour was meant to compete with late-war Zebrican Robots."
