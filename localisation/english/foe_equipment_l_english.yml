 ### Infantry equipment, named after the tech that unlocks it
 melee_equipment_1:0 "Basic Melee Equipment"
 melee_equipment_1_desc:0 "The most basic and easy to produce weaponry of the Equestrian Wasteland, melee weapons were often used by groups with less industry or technology. Seen often with tribals, new raider gangs, or on the Isle of Trottingham, they are cheap and reliable. Includes spears, swords, tools turned to warfare, and various improvised weapons."
 ballistic_equipment_1:0 "Outdated Ballistic Weaponry"
 ballistic_equipment_1_desc:0 "Often inspired by gun designs from before the Great War, these weapons are often either repeating or bolt action. These were the most common weaponry among the Wasteland's armed forces, having been used widely by Red Eye's Slavers in the early reclamation of Fillydelphia."
 ballistic_equipment_2:0 "Early War Ballistic Weaponry"
 ballistic_equipment_2_desc:0 "Inspired by designs seen near the start of the Great War, such as those used in the conquest of Caledonia and of Severyana, these weapons made the common soldier a much more dangerous threat. These weapons were seen used en masse by the New Canterlot Republic during their early years."
 ballistic_equipment_3:0 "Contemporary Equipment"
 ballistic_equipment_3_desc:0 "Very rare across most of the Wasteland, these pieces of equipment are inspired off of the later designs of the Great War, such as those used to fend off the landing in Petershoof. Semi-automatic or fully-automatic, these guns were often only used by wandering heroes, expensive mercenary groups, or the bosses of raider gangs."
 ballistic_equipment_4:0 "Advanced Weaponry"
 ballistic_equipment_4_desc:0 "A mixture of cutting edge Great War technology and Wasteland ingenuity, these weapons were the best one could see on the battlefield. With an advanced weapon, just one soldier with a gun can perform the role of five soldiers with less advanced weaponry. Put to great effect during the Reclamation Of Stableside."
 energy_equipment_4:0 "Futuristic Energy Weapons"
 energy_equipment_4_desc:0 "More advanced than the weapons used during the Great War, these energy weapons can kill even moderately armored infantry in just one shot. They are fully automatic and can sustain fire for long periods of time, and they are fully accurate, with no recoil. They were only seen used en masse after the Treaty of Cloudsdale, used by Grand Pegasus Enclave remnants who continued the war against the Wasteland."
 heavy_infantry_equipment_1:0 "Heavy Infantry Armor"
 heavy_infantry_equipment_1_desc:0 "Consisting of padded armor, caravan shotguns, and blunt weapons, this kit was primarily used for heavier, closer range infantry activities. Though those who used this kit were often more vulnerable to being picked off by longer range enemy infantry, however, if they got in close, especially against armored opponents, they would often create a breakthrough."
 heavy_infantry_equipment_2:0 "Heavy Armor"
 heavy_infantry_equipment_2_desc:0 "Via use of more composite, and stronger materials, heavy infantry armor became better at absorbing enemy attacks. Though more expensive to make, padded armor backed by composite materials rather than scrap metals allowed for almost twice as much fire to be withstood by the average soldier."
 heavy_infantry_equipment_3:0 "Powerful Armor"
 heavy_infantry_equipment_3_desc:0 "A humorous term coined by a garrisoning soldier after surviving a kick from an occupied Steel Ranger, Powerful Armor was the final form of armor used by heavy infantry. Consisting of multiple layers of composite metal and padding, Powerful Armor could survive much before giving way."
 heavy_infantry_breacher_equipment_1:0 "Basic CQC Weaponry"
 heavy_infantry_breacher_equipment_1_desc:0 "As heavy infantry took to the field more as specialty breachers, their basic blunt weapons and caravan shotguns proved ineffective. The first properly effective heavy infantry units used a mixture of pump action shotguns and heavy melee weapons such as sledgehammers. Their shotguns would rip through soft targets, while their heavy weapons would smash through the armor of hard targets."
 heavy_infantry_breacher_equipment_2:0 "Unarmed Weaponry"
 heavy_infantry_breacher_equipment_2_desc:0 "Given the aggressive nature of heavy infantry, many found themselves running out of ammo or losing grasp of their melee weapons in the middle of fights. Basic unarmed weaponry began to be integrated into their armor, including hooks on the back of their legs, like seen with Massacre of the Paragons, or Yaka of the 6th Khagnate."
 heavy_infantry_breacher_equipment_3:0 "Shredder Weaponry"
 heavy_infantry_breacher_equipment_3_desc:0 "The most advanced heavy infantry didn't use any one piece of equipment, rather, they used an eclectic mix of close ranged weapons. Riot shotguns, power hooves, super-sledgehammers, and the like. Most famous were the ballistic-hooves, such as the hoof shotguns of Two-Kick Rip, the greatest fighter of the Paragons."
 spec_ops_equipment_1:0 "Primative Specialized Equipment"
 spec_ops_equipment_1_desc:0 "Often consisting of light leather armor, well crafted blades, and basic weapons, these pieces of equipment were often used by tribal groups for their best warriors. Most famous of them were Sealgairean Beinne of the Hill Trotters, who used their specialized, yet still primitive, equipment to great effect during Red Eye's invasion."
 spec_ops_equipment_2:0 "Basic Specialized Equipment"
 spec_ops_equipment_2_desc:0 "Practically the same equipment as more primitive forms, the main difference was in the quality of their production. With greater care put into making armor both more protective and more flexible, as well as ensuring weapons wouldn't jam in the middle of combat, special forces using this equipment would be effective."
 spec_ops_equipment_3:0 "Standard Specialized Equipment"
 spec_ops_equipment_3_desc:0 "Often using hardened leather armor and trading out rapid fire weapons for long range rifles, special forces using this equipment were quite the threat to forces across the Wasteland. Often special forces would work in a team, with a spotter using binoculars and a sniper picking off enemies. This equipment was most famously used by the Old Appleloosan Rangers against slaver caravans."
 spec_ops_equipment_4:0 "Advanced Specialized Equipment"
 spec_ops_equipment_4_desc:0 "With vastly improved sniper rifles, and scavenged Pip-Bucks using Eyes Forward Sparkle, special forces became an army on their own. No longer needing spotters due to their EFS, special forces could act alone and kill any threats before they even knew it. Most famously, this equipment was used by one of Philosopher-Raider Punt's Stalkers, during his attempt to take Princessyn."
 spec_ops_equipment_5:0 "Poltergeist Armor"
 spec_ops_equipment_5_desc:0 "The last thing you never see, according to this equipment's most famous user, Gohar De Gulliaume the Fourth. With advanced camouflage, integrated stealth technology, and high-quality silenced weapons, Gohar used this technology to make much money around Olenia. It's not known if this armor was ever used en masse, as if you saw the flicker of a Poltergeist's stealth technology, it was already too late for you."
 power_armor_equipment_1:0 "Unpowered Armor"
 power_armor_equipment_1_desc:0 "While this armor might look like power armor on the outside, it lacks much of the internals needed to be classified as such. Given the lack of electronics expertise in the Wasteland, many groups who came across power armor simply stripped out the inside, and wore it as an empty shell around their soldiers. It was effective against softer forces, but useless against any basic anti armor."
 power_armor_equipment_2:0 "Scrapped Power Armor"
 power_armor_equipment_2_desc:0 "There was truly little difference between this armor and the stripped versions of power armor. Often these suits of armor would start as stripped versions, with basic servos shoved inside to help the pilot of the armor move better. They were far from standardized, and sometimes the servos would be installed improperly, causing these faulty suits of power armor to crush the one wearing it into a bloody pulp."
 power_armor_equipment_3:0 "Macintosh Class Power Armor"
 power_armor_equipment_3_desc:0 "Built by Ministry Mare Applejack due to the death of her brother, Big Macintosh, the Macintosh Class was the most widely produced and worn class of power armor. This armor would see use across the South-East of Equestria, and during the defense of Puerto Cabello. It would continue to be used by the Steel Rangers after the Last Day, with this armor turning any ordinary soldier into a trotting tank."
 power_armor_equipment_4:0 "Honesty Class Power Armor"
 power_armor_equipment_4_desc:0 "The Honesty Class was the latest mass produced design of power armor during the later years of the Great War. Though more expensive, it was generally higher quality in every way, and it saw extensive use during the Battle of Hoofington and the Battle of Petershoof. After the Last Day, the Honesty Class was often reserved for Paladins and Star Paladins of the Steel Rangers."
 power_armor_equipment_4_light:0 "Steelhooves Class Power Armor"
 power_armor_equipment_4_light_desc:0 "A version of power armor developed by the Applejacks Rangers after the death of their first leader. It took the Honesty Class and made it much heavier, built to be able to withstand assault by Grand Pegasus Enclave and Steel Ranger weaponry. Records say that many of the improvements made to the armor were inspired by modifications done to Steelhooves' own armor over his two centuries of life."
 power_armor_equipment_5:0 "Ursa-Major Class Power Armor"
 power_armor_equipment_5_desc:0 "A late-war prototype, the Ursa-Major straddles the line between power armor and a mech. Massively up-armored, fitted with an array of redundant shield-talismans and hydraulics and Rad-rated up to 2.000 Rps, this armour was meant to compete with late-war Zebrican Robots."
 energy_equipment_1:0 "Primitive Magical Energy Weapons"
 energy_equipment_1_short:0 "Primitive Magical Energy Weapons"
 energy_equipment_1_desc:0 "Magical Energy Weapons used the spell capturing of crystals and weaponized it even further. These weapons are not like those seen during the Great War, but rather are crude attempts to imitate them. Consisting mostly of crank-loaded energy muskets or crystal launchers, these were the first step to magical energy weapon development for many nations."
 energy_equipment_2:0 "Basic MEWs"
 energy_equipment_2_short:0 "Basic MEWs"
 energy_equipment_2_desc:0 "Used primarily by the Grand Pegasus Enclave, these magical energy weapons use their capacitors to bypass the time between shots, allowing for quicker rates of fire. One shot from these weapons will leave a scar for the rest of your life, and if you're unlucky, it'll turn you to ash in an instant."
 energy_equipment_3:0 "Advanced Energy Weaponry"
 energy_equipment_3_short:0 "Adv. Energy Weaponry"
 energy_equipment_3_desc:0 "Consisting of deadly accurate laser rifles and fully automatic magical energy weapons, these weapons saw limited use in the Great War, instead being mostly developed by the Grand Pegasus Enclave. These were the weapons that were primarily used during Operation Cauterize, their high effectiveness seen in the Battle of New Appleloosa and Friendship City."

 ### Support equipment, named after the tech that unlocks it
 fireteam_equipment_1:0 "Primative Rapid Fire Weaponry"
 fireteam_equipment_1_desc:0 "These weapons were some of the first rapid fire weaponry developed and produced by many Wasteland nations. Often unreliable, shooting low caliber bullets, and with limited ammo capacity. But they weren't meant to actually kill, their main purpose was to provide suppressing fire for other soldiers."
 ballistic_fireteam_equipment_2:0 "Light Machine Guns"
 ballistic_fireteam_equipment_2_desc:0 "Light machine guns were used commonly by forces both during the Great War and after, as, due to their high capacity, they were unmatched at sustained suppressing fire. They weren't particularly accurate or the most damaging weapons, but there is an art in the act of shooting as much lead in as little an amount of time as possible."
 ballistic_fireteam_equipment_3:0 "Minigun"
 ballistic_fireteam_equipment_3_desc:0 "Despite its name, the minigun is quite large. These weapons were exclusively used in battle saddles, or attached to power armor, as they were much too heavy to be carried without those. The minigun fires so fast that often, the main issue for those using them wasn't making the minigun, it was having enough ammunition to use it for more than a minute."
 ballistic_fireteam_equipment_4:0 "Pony-Held Minigun"
 ballistic_fireteam_equipment_4_desc:0 "These miniguns were only used by the most advanced nations of the Wasteland, improving on the design in many ways, but especially on weight. With decreased weight, decreased recoil, and the same amazingly fast fire rate, these weapons were able to be used by ponies even without battle-saddles or power armor."
 energy_fireteam_equipment_2:0 "Rapid Fire MEWs"
 energy_fireteam_equipment_2_desc:0 "These Magical Energy Weapons were designed to allow for rapid fire compared to most, though they also suffered from a lack of accuracy often. Neighvarro's infantry brigades would often be supported by these weapons, whose fireteams would fly into the air and rain down lasers from above."
 energy_fireteam_equipment_3:0 "Gatling Laser"
 energy_fireteam_equipment_3_desc:0 "The Gatling Laser is the common name given to a variety of rapid fire magical energy weapons that used a bulky design to allow for more sustained fire before reloading. These weapons were bulky enough that they were often only used with power armor. Records from Operation Cauterize speak of the fear these weapons could cause, when a power armored Pegasus began to lay into you from above with one."
 energy_fireteam_equipment_4:0 "Heavy RFMEWs"
 energy_fireteam_equipment_4_desc:0 "These Heavy Rapid Fire Magical Energy Weapons were only deployed to a select few forces in the Grand Pegasus Enclave, able to fire multiple highly damaging electrical discharges a second. These weapons saw great use against Steel Rangers, and it was one of these which slew Strawberry Lemonade while she defended Gardens of Equestria."
 demolitions_equipment_1:0 "Dynamite"
 demolitions_equipment_1_desc:0 "Invented as a mining tool long before the Great War, the explosive power of dynamite found itself used by hundreds of groups across the Wasteland. Almost every nation had used dynamite at one point, but most famous of all was Granny Dynamite of the Galicians, whose mastery with the weapon blew away all her competition."
 flamer_demolitions_equipment_2:0 "Crude Flamer"
 flamer_demolitions_equipment_2_desc:0 "These weapons were often cobbled together from a mix of industrial and mining equipment, yet they were highly effective. If given fuel, they would put out large bouts of hot flame, burning anyone who got hit from it. Though they were unreliable and sometimes blew up on the users, when they worked, they worked well."
 flamer_demolitions_equipment_3:0 "Flamethrowers"
 flamer_demolitions_equipment_3_desc:0 "Created by Equestria for use in clearing out enemy positions in the south-eastern jungles, flamethrowers also saw great use across the Wasteland. Being generally reliable, and good at putting out flames at a medium range, flamethrowers were the favorite of many sociopaths. The most famous was Cinder Trails of the Paragons, which many sources describe having been quite hot."
 flamer_demolitions_equipment_4:0 "Incinerator"
 flamer_demolitions_equipment_4_desc:0 "These incinerators were much improved versions of flamethrowers, with their improved design allowing for longer range, higher heat, and more sustained fire. These weapons were very popular and efficient during the Reclamation of Tenochtitlan by the New Canterlot Republic."
 explosive_demolitions_equipment_2:0 "Grenade"
 explosive_demolitions_equipment_2_desc:0 "Grenades are a mainstay of many soldier's kits, dating back to the Griffonian Grenadiers, who would throw explosives at enemies. Grenades came in many types, but the most popular were fragmentation grenades, meant to send shrapnel flying all over whenever exploding."
 explosive_demolitions_equipment_3:0 "Grenade Launchers"
 explosive_demolitions_equipment_3_desc:0 "A flaw of many grenades was that throwing them was taking a gamble. Many soldiers wouldn't throw far enough, or would drop them in the middle of throwing them. Grenade launchers solved this issue, by loading grenades into a propulsion system, they could be launched much further, and much safer."
 explosive_demolitions_equipment_4:0 "Grenade Machine Gun"
 explosive_demolitions_equipment_4_desc:0 "Most famously used by Elder Steelhooves during his adventures with the Lightbringer, this weapon allowed for the rapid fire of explosives. Weapons such as these were rare, and were devastating when used, able to tear apart entire streets of cities with only half a minute of sustained fire."
 dogs_equipment_1:0 "Mutts"
 dogs_equipment_1_desc:0 "They may seem like good boys, but be careful around these early breeds of Wasteland dogs. They were used for suppression duty primary, able to sniff out enemies and able to provide bites and scratches. However, many were bred to purposefully have diseases transferred via their bites, to try and ruin the lives of any who resisted conquest."
 dogs_equipment_2:0 "Griffonian Shepards"
 dogs_equipment_2_desc:0 "Imported to Equestria during the Great War, these dogs actually have their origin in Griffonia. They were raised by Griffons in order to corral and control their herds of farmed animals. Equestria used them for something else, to patrol potential smuggling routes and to use their keen senses to find any potential contraband."
 dogs_equipment_3:0 "Cyberdogs"

 ### Vehicle equipment, named after the tech that unlocks it
 tank_equipment_1:0 "Scrap Tank"
 tank_equipment_1_desc:0 "While gun truck and APCs provide light armor and firepower to our mechanized divisions, the enemy is beginning to field better anti-armor weaponry. The solution is a simple one. A tracked chassis rebuilt from plans for industrial construction vehicles armored with slabs of concrete as well as spaced steel layers sandwiched between them provides protection against even simple rocket launchers, while firing ports and armored ball mounts let our vehicles be armed with a choice of small arms, heavy machineguns and anti-tank rifles. The forward bulldozer blade also let our crew demolish fortified positions and ram enemy AFVs."
 tank_equipment_2:0 "Wasteland Tank"
 tank_equipment_2_desc:0 "Completely cutting out the improvised superstructure and beginning from the hull base again lets us design a much more efficient AFV. Angled armor for better protection at a lesser tonnage, securized ammo storage, a hull mounted and coaxial machinegun as well as an actual powered turret with an infantry support gun improves their efficiency against soft and hard target alike, while the lighter armoring made of hardened steel plates let the same engine achieve higher speeds and take our enemy by surprise."
 tank_equipment_3:0 "Great War Tank"
 tank_equipment_3_desc:0 "While the design process of the tank itself is very straightforward, considering the amount of plans and intact vehicles found in bunkers, the manufacturing and supply is not. Pre-war technology requires advanced manufacturing capabilities or very creative thinking. Replacing the extremely advanced depleted uranium plating by a much simpler alloy front plate, unifying the four-tracked system into a two-tracked one and replacing extensive internal electronics by simpler substitutes such as mechanical devices and uncomplicated fire control modules allows our military factories to build a fearsome product of the past."
