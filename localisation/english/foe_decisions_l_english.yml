l_english:
 FOE_intro: "Fallout: Equestria Intro"


 foe_air_aviaton: "Air Aviaton"
 foe_air_aviaton_desc: "The sky was once filled with great ships of the air and battles of glory and with enough will we can reclaim the sky."
 
 foe_flying_machines: "Flying Ships?"
 foe_flying_machines_desc: "From old books and stories we will remake the great airships of old."

 foe_flying_weapons: "Weaponise The Airships"
 foe_flying_weapons_desc: "With A Clear View From Above We Will Rain Fire And Destruction Onto Our Enemies From Above."
 
 foe_war_machines: "War From Above"
 foe_war_machines_desc: "With Airships Our Enemies will stand no chance against us."

 foe_fund_our_engineers: "Founding For Airship Research"
 foe_fund_our_engineers_desc: "Putting Extra Resources into Air Will Help Us In Crafting New Airships."

 foe_study_the_enemy: "Study The Enemy"
 foe_study_the_enemy_desc: "By Studying The Enemy We Can See How To Best Use New Airships Against Them."

 foe_build_air_bases: "Build A Airbase"
 foe_build_air_bases_desc: "Airships Aren't That Useful Withought Somwhere To Launch And Coordinate Them From Let's Fix That."