 # Facilities
 land_facility: "Arms and Armour Facility"
 land_facility_plural: "Arms and Armour Facilities"
 land_facility_desc: "A pre-war armoury and proving ground for weapons and armour a single soldier can carry. Whoever holds it can run Arms and Armour projects there. Facilities cannot be built, only taken."
 air_facility: "Advanced Machines Facility"
 air_facility_plural: "Advanced Machines Facilities"
 air_facility_desc: "A pre-war works for aircraft, robots and other machines that think or fly. Whoever holds it can run Advanced Machines projects there. Facilities cannot be built, only taken."
 naval_facility: "Heavy Engineering Facility"
 naval_facility_plural: "Heavy Engineering Facilities"
 naval_facility_desc: "A pre-war yard and design bureau for ships, vehicles and anything else too heavy to carry. Whoever holds it can run Heavy Engineering projects there. Facilities cannot be built, only taken."
 industry_facility: "Industrial Research Facility"
 industry_facility_plural: "Industrial Research Facilities"
 industry_facility_desc: "A pre-war industrial laboratory. Whoever holds it can run Industry projects there. Facilities cannot be built, only taken."
 arcane_facility: "Arcane Sciences Facility"
 arcane_facility_plural: "Arcane Sciences Facilities"
 arcane_facility_desc: "A sealed ministry laboratory. Whoever holds it can run Arcane Sciences projects there. Facilities cannot be built, only taken."
 # Projects
 sp_naval_missile_destroyer: "Zebrican Missile Destroyer"
 sp_naval_missile_destroyer_desc: "The Zebrican navy ended the war with a destroyer that fought with guided missiles instead of guns. The plans survive in pieces; a naval yard with the right tools could put them back together."
 sp_land_x01_power_armour: "X-01 Power Armour"
 sp_land_x01_power_armour_desc: "The last power armour designed before the end, and the first never issued. Prototypes and tooling were sealed away when the bombs fell."
 sp_arcane_megaspell_batteries: "Megaspell Batteries"
 sp_arcane_megaspell_batteries_desc: "A megaspell small enough to fit a ship's turret is still a megaspell. Rebuilding one means reading notes their authors hoped nobody would need again."
 sp_industry_radiation_engine: "The Radiation Engine"
 sp_industry_radiation_engine_desc: "A machine that turns the arcane radiation soaking the wasteland into usable power. Once the principle is understood, every power plant can be rebuilt around it."
 sp_industry_radiation_engine_output_tt: "Every §YPower Generator§! produces §G+8§! energy."
 sp_air_cloudship_refit: "Cloudship Refit Programme"
 sp_air_cloudship_refit_desc: "Old airship hulls rebuilt with what two centuries of patching them has taught: lighter frames, tougher envelopes, bigger tanks."
 sp_naval_pocket_heavy_hull: "Pocket Heavy Hull"
 sp_naval_pocket_heavy_hull_desc: "A heavy ship's guns on a hull small enough for the yards the wasteland still has. The design was a wartime compromise that never left the drawing board."
 sp_naval_railguns: "Naval Railguns"
 sp_naval_railguns_desc: "A gun with no powder and no barrel wear, limited only by the power a ship can feed it. The prototypes worked; the ships to carry them were never finished."
 sp_naval_mega_gun_emplacement: "Mega Gun Emplacement"
 sp_naval_mega_gun_emplacement_desc: "A gun too large for any ship or carriage, built into the ground and aimed at a whole region. Casting the barrel is a project in itself."
 sp_naval_mega_gun_emplacement_output_tt: "Unlocks the §YMega Gun Emplacement§! building."
 sp_air_rocket_site: "Rocket Sites"
 sp_air_rocket_site_desc: "Launch rails, fuel plants and the guidance sets that make a rocket more than a firework. The ministries had them; the blueprints are scattered."
 sp_air_rocket_site_output_tt: "Unlocks the §YRocket Site§! building."
 sp_arcane_shielded_hulls: "Talisman-Shielded Hulls"
 sp_arcane_shielded_hulls_desc: "Ward talismans worked into a ship's plating turn aside what steel alone cannot stop. Making them in the numbers a hull needs was a secret of the Ministry of Arcane Sciences."
 sp_naval_bombardment_ship: "Bombardment Ship"
 sp_naval_bombardment_ship_desc: "Before the missile destroyer there was the bombardment ship: an ordinary escort hull carrying nothing but launchers. Working out how it was done is the first step towards the ships that replaced it."
