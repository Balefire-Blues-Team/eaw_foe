 # Third batch (community survey)
 sp_land_cybernetic_augmentation: "Cybernetic Augmentation"
 sp_land_cybernetic_augmentation_desc: "Stable 101 spent two centuries replacing what flesh does badly: eyes that see in the dark, legs that do not tire, hearts that do not stop. The first step is giving soldiers the parts that can be fitted without rebuilding the pony around them."
 bfb_cybernetic_augmentation_tech: "Cybernetic Augmentation"
 bfb_cybernetic_augmentation_tech_desc: "Stable 101 spent two centuries replacing what flesh does badly: eyes that see in the dark, legs that do not tire, hearts that do not stop. The first step is giving soldiers the parts that can be fitted without rebuilding the pony around them."
 sp_land_full_conversion: "Full Conversion"
 sp_land_full_conversion_desc: "Past a certain point it is easier to count what is left of the original soldier than what was replaced. The result is stronger, faster and very hard to kill, and needs a workshop where others need a field kitchen."
 bfb_full_conversion_tech: "Full Conversion"
 bfb_full_conversion_tech_desc: "Past a certain point it is easier to count what is left of the original soldier than what was replaced. The result is stronger, faster and very hard to kill, and needs a workshop where others need a field kitchen."
 sp_land_jump_packs: "Jump Packs"
 sp_land_jump_packs_desc: "A suit of power armour weighs as much as a wagon and climbs like one. A pair of thrusters on the back plate does not make it fly, but it clears a wall, a ravine or a river bank in one bound."
 bfb_jump_packs_tech: "Jump Packs"
 bfb_jump_packs_tech_desc: "A suit of power armour weighs as much as a wagon and climbs like one. A pair of thrusters on the back plate does not make it fly, but it clears a wall, a ravine or a river bank in one bound."
 sp_land_tesla_plating: "Tesla Plating"
 sp_land_tesla_plating_desc: "Coils worked into the armour plates bleed off energy weapons fire and bite back at anything that touches them. The suit hums, glows faintly in the dark, and is not something to stand next to in the rain."
 bfb_tesla_plating_tech: "Tesla Plating"
 bfb_tesla_plating_tech_desc: "Coils worked into the armour plates bleed off energy weapons fire and bite back at anything that touches them. The suit hums, glows faintly in the dark, and is not something to stand next to in the rain."
 sp_arcane_stealth_cloaks: "Stealth Cloaks"
 sp_arcane_stealth_cloaks_desc: "A StealthBuck hides one pony for a few minutes. A cloak with the talisman woven into it hides the wearer for as long as they stand still, and the zebras who made the originals did not need to stand still."
 bfb_stealth_cloaks_tech: "Stealth Cloaks"
 bfb_stealth_cloaks_tech_desc: "A StealthBuck hides one pony for a few minutes. A cloak with the talisman woven into it hides the wearer for as long as they stand still, and the zebras who made the originals did not need to stand still."
 sp_arcane_ward_emplacements: "Ward Emplacements"
 sp_arcane_ward_emplacements_desc: "The shield talismans that protected ministry hubs can be made smaller and set into a trench line. A warded position shrugs off the first shells of a bombardment, which is usually when a position is lost."
 bfb_ward_emplacements_tech: "Ward Emplacements"
 bfb_ward_emplacements_tech_desc: "The shield talismans that protected ministry hubs can be made smaller and set into a trench line. A warded position shrugs off the first shells of a bombardment, which is usually when a position is lost."
 sp_naval_all_terrain_drives: "All-Terrain Drives"
 sp_naval_all_terrain_drives_desc: "Wheels and tracks stop where the road does. Articulated legs and lift talismans were both tried before the war; put together they carry an armoured hull across ground that used to belong to the infantry."
 bfb_all_terrain_drives_tech: "All-Terrain Drives"
 bfb_all_terrain_drives_tech_desc: "Wheels and tracks stop where the road does. Articulated legs and lift talismans were both tried before the war; put together they carry an armoured hull across ground that used to belong to the infantry."
 sp_industry_combat_chems: "Combat Chems"
 sp_industry_combat_chems_desc: "Every raider cooks chems in a bathtub. Making them by the barrel, to a known strength, without killing a tenth of the soldiers who take them, is an industrial problem with an industrial answer."
 bfb_combat_chems_tech: "Combat Chems"
 bfb_combat_chems_tech_desc: "Every raider cooks chems in a bathtub. Making them by the barrel, to a known strength, without killing a tenth of the soldiers who take them, is an industrial problem with an industrial answer."
 sp_industry_chems_mass_issue: "Chems: Mass Issue"
 sp_industry_chems_mass_issue_desc: "A weak dose for everyone before the whistle blows. The line hits harder and feels less; it also learns less, and the veterans who survive on instinct are the ones the chems dull most. Excludes Elite Dosage."
 bfb_chems_mass_issue_tech: "Chems: Mass Issue"
 bfb_chems_mass_issue_tech_desc: "A weak dose for everyone before the whistle blows. The line hits harder and feels less; it also learns less, and the veterans who survive on instinct are the ones the chems dull most. Excludes Elite Dosage."
 sp_industry_chems_elite_dosage: "Chems: Elite Dosage"
 sp_industry_chems_elite_dosage_desc: "The good batches go to the few who can be trusted with them and watched afterwards. A strike team on a tailored mix does things that should not be possible, for about an hour. Excludes Mass Issue."
 bfb_chems_elite_dosage_tech: "Chems: Elite Dosage"
 bfb_chems_elite_dosage_tech_desc: "The good batches go to the few who can be trusted with them and watched afterwards. A strike team on a tailored mix does things that should not be possible, for about an hour. Excludes Mass Issue."
 # Air Cavalry
 sp_air_air_cavalry: "Air Cavalry"
 sp_air_air_cavalry_desc: "A helicopter does not care whether there is a road. Putting a rifle company in the back of a flight of them gives infantry that crosses swamp, forest and mountain at the same speed as open plain, for as long as the fuel lasts."
 sp_air_transport_vertibuck: "Transport Vertibuck"
 sp_air_transport_vertibuck_desc: "The Enclave's workhorse, stripped of its heavy weapons and fitted with benches. Faster and tougher than any rotor craft, with door guns that keep heads down while the troops get out."
 bfb_air_cavalry_tech: "Air Cavalry"
 bfb_air_cavalry_tech_desc: "Unlocks the §YAir Cavalry§! battalion and the §YTransport Helicopter§! that carries it."
 bfb_transport_vertibuck_tech: "Transport Vertibuck"
 bfb_transport_vertibuck_tech_desc: "Unlocks the §YTransport Vertibuck§!, a faster and tougher carrier for Air Cavalry."
 air_cavalry: "Air Cavalry"
 air_cavalry_desc: "Infantry carried into battle by transport helicopters. Bad ground does not slow them, but they are fewer, tire sooner and need a great deal of fuel and supply."
 transport_helicopter_equipment: "Transport Helicopters"
 transport_helicopter_equipment_short: "Transport Heli."
 transport_helicopter_equipment_desc: "Rotor craft that carry infantry over ground no vehicle can cross."
 transport_helicopter_equipment_1: "Transport Helicopter"
 transport_helicopter_equipment_1_short: "Transport Helicopter"
 transport_helicopter_equipment_1_desc: "A plain rotor craft with room for a squad. Slow for an aircraft, fast for anything that has to cross a swamp, and fragile."
 transport_helicopter_equipment_2: "Transport Vertibuck"
 transport_helicopter_equipment_2_short: "Transport Vertibuck"
 transport_helicopter_equipment_2_desc: "A Vertibuck fitted out as a troop carrier. Faster, armoured against small arms, and armed well enough to cover its own landing."
