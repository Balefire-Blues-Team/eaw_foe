 supply_equipment_1:0 "Makeshift Train"
 supply_equipment_1_desc:0 "Simple trains built using spare parts, rusted old carriages, and anything else we can find. They're not much to look at and are constantly on the verge of falling apart, but they get the job done regardless. They have to be pulled manually by ponies, due to lacking any form of engine."
 
