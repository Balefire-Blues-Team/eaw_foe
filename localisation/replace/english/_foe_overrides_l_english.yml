 ### Equipment ids that vanilla also defines; they must stay in replace/ to win over the base game
 anti_tank_equipment_1:0 "Anti-Machine Rifles"
 anti_tank_equipment_1_short:0 "Anti-Machine Rifles"
 anti_tank_equipment_1_desc:0 "Anti-Machine Rifles have their purpose quite obvious due to their name, they are made to destroy machines. Developed during the Great War to counter the robots made by the Zebrican Empire, they can pierce through quite tough armor. In the Wasteland, they were most famously used by Stern's Talons."
 infantry_equipment_1:0 "Primitive Ballistic Weaponry"
 infantry_equipment_1_short:0 "Primitive Ballistic Weaponry"
 infantry_equipment_1_desc:0 "Often cobbled together from scrap or the reject pieces of better weaponry, these weapons are barely better than melee weapons. Most often these types of weapons were seen used by small settlements or raider gangs. They can only handle low caliber bullets, and are singularly ineffective. However, with enough guns, even the most scary mutants could be scared away, though likely not killed."
 motorbike_equipment_1:0 "Motorbikes"
 motorbike_equipment_1_desc:0 "These vehicles, deemed motorbikes, were the first attempts by Wasteland nations to fix up the many vehicles of Equestria. While they look superficially similar to motorcycles, what separates them is that motorbikes are still primarily pony powered. Many motorbikes would have pedals or cranks, which would need to be turned in order to keep moving."
 support_equipment_1:0 "Support Equipment"
 support_equipment_1_desc:0 "A broader term to describe the tools used by soldiers that aren't their primary weapons. Support equipment includes many things, from grenades, to medical kits, to shovels and even beast companions. These pieces of equipment were often the difference between loss and victory for nations."
 anti_tank_equipment_2:0 "Rocket Launchers"
 anti_tank_equipment_2_desc:0 "These weapons would propel rockets, which would explode on contact with enemies, packing a lot of explosive power. While often used to explode heavily armored targets, these were also often used against flying targets, like Grand Pegasus Enclave Skytanks."
 anti_tank_equipment_3:0 "Missile Launchers"
